<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="1200" height="520" fill="#ffffff"/>

  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a237e">Bash 编程 · 学习路径总览</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#555555">进阶向：4 阶段 / 13 课 / 39 知识点 ｜ 主角：一段 2000 行的部署脚本 deploy.sh</text>

  <!-- 阶段 1 -->
  <rect x="25" y="90" width="250" height="360" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <rect x="25" y="90" width="250" height="44" rx="10" fill="#1565C0"/>
  <rect x="25" y="124" width="250" height="10" fill="#1565C0"/>
  <text x="150" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">阶段 1 · 重看地基</text>
  <text x="150" y="152" text-anchor="middle" font-size="12" font-style="italic" fill="#0D47A1">「能跑」和「跑对了」之间差着一层解析</text>

  <rect x="45" y="170" width="210" height="62" rx="6" fill="#ffffff" stroke="#90CAF9"/>
  <text x="57" y="190" font-size="13" font-weight="700" fill="#0D47A1">课 1 一行命令的生命周期</text>
  <text x="57" y="209" font-size="11" fill="#333333">解析链路 · 引号与转义 · 命令查找</text>
  <text x="57" y="224" font-size="11" fill="#333333">顺序</text>

  <rect x="45" y="244" width="210" height="62" rx="6" fill="#ffffff" stroke="#90CAF9"/>
  <text x="57" y="264" font-size="13" font-weight="700" fill="#0D47A1">课 2 展开全家桶</text>
  <text x="57" y="283" font-size="11" fill="#333333">参数展开全集 · 单词分割 · 命令/</text>
  <text x="57" y="298" font-size="11" fill="#333333">算术/进程替换</text>

  <rect x="45" y="318" width="210" height="62" rx="6" fill="#ffffff" stroke="#90CAF9"/>
  <text x="57" y="338" font-size="13" font-weight="700" fill="#0D47A1">课 3 退出码与条件</text>
  <text x="57" y="357" font-size="11" fill="#333333">退出码真相 · [[ ]] vs [ ] · 控制流</text>
  <text x="57" y="372" font-size="11" fill="#333333">细节</text>

  <text x="150" y="410" text-anchor="middle" font-size="11" fill="#0D47A1">复习方式：讲深层机制，不罗列语法</text>
  <text x="150" y="430" text-anchor="middle" font-size="11" fill="#0D47A1">目标：说清 shell 到底做了什么</text>

  <!-- 箭头 1→2 -->
  <path d="M 285 270 L 315 270" stroke="#546E7A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="258" text-anchor="middle" font-size="10" fill="#546E7A">展开</text>

  <!-- 阶段 2 -->
  <rect x="325" y="90" width="250" height="360" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <rect x="325" y="90" width="250" height="44" rx="10" fill="#2E7D32"/>
  <rect x="325" y="124" width="250" height="10" fill="#2E7D32"/>
  <text x="450" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">阶段 2 · 语言内核</text>
  <text x="450" y="152" text-anchor="middle" font-size="12" font-style="italic" fill="#1B5E20">把它当成一门真正的语言来用</text>

  <rect x="345" y="170" width="210" height="46" rx="6" fill="#ffffff" stroke="#A5D6A7"/>
  <text x="357" y="189" font-size="13" font-weight="700" fill="#1B5E20">课 4 变量属性与作用域</text>
  <text x="357" y="206" font-size="11" fill="#333333">declare · local · nameref</text>

  <rect x="345" y="226" width="210" height="46" rx="6" fill="#ffffff" stroke="#A5D6A7"/>
  <text x="357" y="245" font-size="13" font-weight="700" fill="#1B5E20">课 5 数组与映射</text>
  <text x="357" y="262" font-size="11" fill="#333333">索引数组 · 关联数组 · mapfile</text>

  <rect x="345" y="282" width="210" height="46" rx="6" fill="#ffffff" stroke="#A5D6A7"/>
  <text x="357" y="301" font-size="13" font-weight="700" fill="#1B5E20">课 6 函数与调用约定</text>
  <text x="357" y="318" font-size="11" fill="#333333">返回值 · "$@" 陷阱 · 递归</text>

  <rect x="345" y="338" width="210" height="46" rx="6" fill="#ffffff" stroke="#A5D6A7"/>
  <text x="357" y="357" font-size="13" font-weight="700" fill="#1B5E20">课 7 重定向与 fd</text>
  <text x="357" y="374" font-size="11" fill="#333333">fd 表 · here-doc · 管道缓冲</text>

  <text x="450" y="410" text-anchor="middle" font-size="11" fill="#1B5E20">目标：能写出不出意外的数据结构与</text>
  <text x="450" y="430" text-anchor="middle" font-size="11" fill="#1B5E20">IO 处理</text>

  <!-- 箭头 2→3 -->
  <path d="M 585 270 L 615 270" stroke="#546E7A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="600" y="258" text-anchor="middle" font-size="10" fill="#546E7A">进程</text>

  <!-- 阶段 3 -->
  <rect x="625" y="90" width="250" height="360" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
  <rect x="625" y="90" width="250" height="44" rx="10" fill="#EF6C00"/>
  <rect x="625" y="124" width="250" height="10" fill="#EF6C00"/>
  <text x="750" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">阶段 3 · 进程边界</text>
  <text x="750" y="152" text-anchor="middle" font-size="12" font-style="italic" fill="#E65100">脚本从来不是自己一个人在跑</text>

  <rect x="645" y="170" width="210" height="62" rx="6" fill="#ffffff" stroke="#FFCC80"/>
  <text x="657" y="190" font-size="13" font-weight="700" fill="#E65100">课 8 子shell 与执行上下文</text>
  <text x="657" y="209" font-size="11" fill="#333333">什么会创建子 shell · source</text>
  <text x="657" y="224" font-size="11" fill="#333333">vs 执行 · 环境继承</text>

  <rect x="645" y="244" width="210" height="62" rx="6" fill="#ffffff" stroke="#FFCC80"/>
  <text x="657" y="264" font-size="13" font-weight="700" fill="#E65100">课 9 信号 trap 与清理</text>
  <text x="657" y="283" font-size="11" fill="#333333">信号与 trap · EXIT/ERR/DEBUG</text>
  <text x="657" y="298" font-size="11" fill="#333333">· 锁与临时文件</text>

  <rect x="645" y="318" width="210" height="62" rx="6" fill="#ffffff" stroke="#FFCC80"/>
  <text x="657" y="338" font-size="13" font-weight="700" fill="#E65100">课 10 与文本工具的协作</text>
  <text x="657" y="357" font-size="11" fill="#333333">三剑客边界 · find/xargs</text>
  <text x="657" y="372" font-size="11" fill="#333333">· 何时不该用 shell</text>

  <text x="750" y="410" text-anchor="middle" font-size="11" fill="#E65100">目标：被 Ctrl-C / 被杀 / 文件名带空格</text>
  <text x="750" y="430" text-anchor="middle" font-size="11" fill="#E65100">都不会留下烂摊子</text>

  <!-- 箭头 3→4 -->
  <path d="M 885 270 L 915 270" stroke="#546E7A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="900" y="258" text-anchor="middle" font-size="10" fill="#546E7A">工程</text>

  <!-- 阶段 4 -->
  <rect x="925" y="90" width="250" height="360" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <rect x="925" y="90" width="250" height="44" rx="10" fill="#6A1B9A"/>
  <rect x="925" y="124" width="250" height="10" fill="#6A1B9A"/>
  <text x="1050" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">阶段 4 · 生产化</text>
  <text x="1050" y="152" text-anchor="middle" font-size="12" font-style="italic" fill="#4A148C">让错误在发生的那一刻被看见</text>

  <rect x="945" y="170" width="210" height="62" rx="6" fill="#ffffff" stroke="#CE93D8"/>
  <text x="957" y="190" font-size="13" font-weight="700" fill="#4A148C">课 11 严格模式与错误处理</text>
  <text x="957" y="209" font-size="11" fill="#333333">set -euo pipefail 真相 · 错误</text>
  <text x="957" y="224" font-size="11" fill="#333333">处理模式 · 参数解析</text>

  <rect x="945" y="244" width="210" height="62" rx="6" fill="#ffffff" stroke="#CE93D8"/>
  <text x="957" y="264" font-size="13" font-weight="700" fill="#4A148C">课 12 可观测与测试</text>
  <text x="957" y="283" font-size="11" fill="#333333">调试 · shellcheck · bats 与</text>
  <text x="957" y="298" font-size="11" fill="#333333">可测性设计</text>

  <rect x="945" y="318" width="210" height="62" rx="6" fill="#ffffff" stroke="#CE93D8"/>
  <text x="957" y="338" font-size="13" font-weight="700" fill="#4A148C">课 13 安全性能与选型</text>
  <text x="957" y="357" font-size="11" fill="#333333">注入 · 性能 · 可移植性与</text>
  <text x="957" y="372" font-size="11" fill="#333333">替代方案</text>

  <text x="1050" y="410" text-anchor="middle" font-size="11" fill="#4A148C">目标：知道什么时候该停下来</text>
  <text x="1050" y="430" text-anchor="middle" font-size="11" fill="#4A148C">改用 Python</text>

  <!-- 底部收束 -->
  <rect x="25" y="466" width="1150" height="40" rx="8" fill="#ECEFF1" stroke="#546E7A" stroke-dasharray="6 4"/>
  <text x="600" y="491" text-anchor="middle" font-size="13" font-weight="700" fill="#263238">收束：能把任意一段脚本改造成「输入脏、环境变、中途挂都不留烂摊子」的生产级工具</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#546E7A"/>
    </marker>
  </defs>
</svg>
