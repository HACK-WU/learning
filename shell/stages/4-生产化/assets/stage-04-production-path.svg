<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#4A148C">阶段 4 · 生产化 — 学习路径</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#555555">章节：让错误在发生的那一刻被看见</text>

  <rect x="25" y="90" width="265" height="200" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <rect x="25" y="90" width="265" height="38" rx="10" fill="#6A1B9A"/>
  <rect x="25" y="116" width="265" height="12" fill="#6A1B9A"/>
  <text x="157" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">课 11 · 严格模式与错误处理</text>
  <text x="43" y="146" font-size="12" font-weight="700" fill="#4A148C">知识点</text>
  <text x="43" y="168" font-size="11.5" fill="#333333">1. set -euo pipefail 的真相</text>
  <text x="55" y="186" font-size="10.5" fill="#666666">各自管什么 · **它失效的七种场景**</text>
  <text x="55" y="202" font-size="10.5" fill="#666666">· 为什么它不是银弹</text>
  <text x="43" y="224" font-size="11.5" fill="#333333">2. 错误处理模式</text>
  <text x="55" y="242" font-size="10.5" fill="#666666">错误码约定 · 上下文 · trap ERR 打栈</text>
  <text x="43" y="264" font-size="11.5" fill="#333333">3. 参数解析与输入校验</text>
  <text x="55" y="282" font-size="10.5" fill="#666666">getopts 局限 · 手写长选项解析器</text>

  <rect x="318" y="90" width="265" height="200" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <rect x="318" y="90" width="265" height="38" rx="10" fill="#6A1B9A"/>
  <rect x="318" y="116" width="265" height="12" fill="#6A1B9A"/>
  <text x="450" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">课 12 · 可观测与测试</text>
  <text x="336" y="146" font-size="12" font-weight="700" fill="#4A148C">知识点</text>
  <text x="336" y="168" font-size="11.5" fill="#333333">1. 调试与可观测</text>
  <text x="348" y="186" font-size="10.5" fill="#666666">set -x 增强 · PS4 打行号函数</text>
  <text x="348" y="202" font-size="10.5" fill="#666666">· BASH_XTRACEFD 分流 · 日志分级</text>
  <text x="336" y="224" font-size="11.5" fill="#333333">2. shellcheck 静态检查</text>
  <text x="348" y="242" font-size="10.5" fill="#666666">常见告警码 · 抑制与注解的纪律</text>
  <text x="336" y="264" font-size="11.5" fill="#333333">3. bats 与可测性设计</text>
  <text x="348" y="282" font-size="10.5" fill="#666666">bats-core · 依赖注入式脚本结构</text>

  <rect x="611" y="90" width="265" height="200" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <rect x="611" y="90" width="265" height="38" rx="10" fill="#6A1B9A"/>
  <rect x="611" y="116" width="265" height="12" fill="#6A1B9A"/>
  <text x="743" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">课 13 · 安全性能与选型</text>
  <text x="629" y="146" font-size="12" font-weight="700" fill="#4A148C">知识点</text>
  <text x="629" y="168" font-size="11.5" fill="#333333">1. 注入与安全</text>
  <text x="641" y="186" font-size="10.5" fill="#666666">eval 危险 · 命令注入 · 不可信输入</text>
  <text x="629" y="208" font-size="11.5" fill="#333333">2. 性能</text>
  <text x="641" y="226" font-size="10.5" fill="#666666">fork 成本 · while read 正确写法</text>
  <text x="641" y="242" font-size="10.5" fill="#666666">· 内置命令替代外部命令</text>
  <text x="629" y="264" font-size="11.5" fill="#333333">3. 边界、可移植性与替代方案</text>
  <text x="641" y="282" font-size="10.5" fill="#666666">shebang 选择 · 该改用 Python 的信号</text>

  <path d="M 295 190 L 316 190" stroke="#6A1B9A" stroke-width="2.5" marker-end="url(#a4)"/>
  <path d="M 588 190 L 609 190" stroke="#6A1B9A" stroke-width="2.5" marker-end="url(#a4)"/>

  <rect x="25" y="308" width="851" height="38" rx="8" fill="#ECEFF1" stroke="#546E7A" stroke-dasharray="6 4"/>
  <text x="450" y="332" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263238">本阶段出口：脚本敢上 CI、敢被人改，且你知道它什么时候该退休了</text>

  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6A1B9A"/>
    </marker>
  </defs>
</svg>
