global:
  scrape_interval: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Prometheus 自己——规则引擎的内部指标（prometheus_rule_*、ALERTS）全靠这个
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: l4-demo
    static_configs:
      - targets:
          - l4-app:8080
