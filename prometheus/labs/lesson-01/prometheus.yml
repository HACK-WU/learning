global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: lesson-01

scrape_configs:
  # 自己抓自己：Prometheus 默认不会监控自己，必须显式配置
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: demo-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - demo-app:8080

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091
