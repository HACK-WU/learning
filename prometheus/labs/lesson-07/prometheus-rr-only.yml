global:
  scrape_interval: 2s
  external_labels:
    cluster: l7-lab
    replica: "0"

# 只 remote read，不 remote write：
# 数据由另一个 Prometheus 写入 VictoriaMetrics，本实例仅负责查询
remote_read:
  - url: "http://l7-vm:8428/api/v1/read"
    read_recent: true
    name: vm-only-read

scrape_configs:
  - job_name: l7-prom-self
    static_configs:
      - targets: ["localhost:9090"]
