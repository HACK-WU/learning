global:
  scrape_interval: 2s
  external_labels:
    cluster: l7-agent
    role: agent

remote_write:
  - url: "http://l7-receiver:8080/api/v1/write"
    queue_config:
      capacity: 1000
      max_shards: 10
      min_shards: 1
      max_samples_per_send: 100
      batch_send_deadline: 5s
      min_backoff: 1s
      max_backoff: 30s

scrape_configs:
  - job_name: l7-app
    static_configs:
      - targets: ["l7-app:8080"]
  - job_name: agent-self
    static_configs:
      - targets: ["localhost:9090"]
