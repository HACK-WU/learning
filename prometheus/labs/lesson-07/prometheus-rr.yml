global:
  scrape_interval: 2s
  external_labels:
    cluster: l7-lab
    replica: "0"

# 远端：VictoriaMetrics，既有读也有写
remote_write:
  - url: "http://l7-vm:8428/api/v1/write"
    queue_config:
      capacity: 2000
      max_shards: 10
      min_shards: 1
      max_samples_per_send: 500
      batch_send_deadline: 5s

remote_read:
  - url: "http://l7-vm:8428/api/v1/read"
    read_recent: false
    name: vm-primary

scrape_configs:
  - job_name: l7-app
    static_configs:
      - targets: ["l7-app:8080"]

  - job_name: l7-prom-self
    static_configs:
      - targets: ["localhost:9090"]
