global:
  resolve_timeout: 5m

route:
  receiver: default-receiver
  group_by: ['alertname']
  # 攒批实验：把 group_wait 拉长到 20s，让"窗口内合并"现象清晰可见
  group_wait: 20s
  group_interval: 10s
  repeat_interval: 30s
  routes:
    - matchers:
        - alertname=~"Node.*"
      receiver: infra-receiver
      group_by: ['alertname', 'zone']
      continue: false

    - matchers:
        - team="payments"
      receiver: payments-receiver
      # 只按 alertname 分组：两个 zone 的高错误率会合并进同一分组
      group_by: ['alertname']
      continue: false

    - matchers:
        - team="search"
        - severity="critical"
      receiver: search-critical-receiver
      group_by: ['alertname']

inhibit_rules:
  - source_matchers:
      - alertname="NodeDown"
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['zone']

receivers:
  - name: default-receiver
    webhook_configs:
      - url: 'http://l5-receiver:8099/default'
        send_resolved: true

  - name: payments-receiver
    webhook_configs:
      - url: 'http://l5-receiver:8099/payments'
        send_resolved: true

  - name: search-critical-receiver
    webhook_configs:
      - url: 'http://l5-receiver:8099/search-critical'
        send_resolved: true

  - name: infra-receiver
    webhook_configs:
      - url: 'http://l5-receiver:8099/infra'
        send_resolved: true
