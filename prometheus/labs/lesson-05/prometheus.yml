global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: l5-lab

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - l5-am:9093

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: l5-apps
    static_configs:
      - targets:
          - l5-app-1:8080
          - l5-app-2:8080
          - l5-app-3:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
