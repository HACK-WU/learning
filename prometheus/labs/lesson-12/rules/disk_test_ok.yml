rule_files:
  - disk.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'node_filesystem_free_bytes{mountpoint="/"}'
        values: '100000000000+0x59'    # 恒定，不下降
    alert_rule_test:
      - eval_time: 10m
        alertname: DiskWillFillIn6h
        exp_alerts: []
