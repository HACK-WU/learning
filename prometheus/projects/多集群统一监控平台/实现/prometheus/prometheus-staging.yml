# 采集端 Prometheus 配置 —— staging 环境
# 与 prod 结构相同，差别：cluster 标签、targets、以及告警路由依赖的 env 标签

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    env: staging
    cluster: staging-shanghai
    region: cn-east

rule_files:
  - /etc/prometheus/rules/*.yml

remote_write:
  - url: http://mimir:8080/api/v1/push
    headers:
      X-Scope-OrgID: tenant-demo
    queue_config:
      capacity: 10000
      max_shards: 20
      min_shards: 1
      max_samples_per_send: 2000
      batch_send_deadline: 5s
      retry_on_http_429: true

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["app-staging:8000"]
        labels:
          env: staging

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
