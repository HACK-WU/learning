# 采集端 Prometheus 配置 —— dev 环境
#
# dev 的错误率与慢请求率明显高于 prod（见 app/app.py 的 ERROR_RATE / SLOW_RATE），
# 这是故意设计的：让「分层告警」有真实素材可演示
# —— 同样的规则，在 prod 不该响，在 dev 应该响。

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    env: dev
    cluster: dev-shanghai
    region: cn-east

rule_files:
  - /etc/prometheus/rules/*.yml

remote_write:
  - url: http://mimir:8080/api/v1/push
    headers:
      X-Scope-OrgID: tenant-demo
    queue_config:
      capacity: 10000
      max_shards: 20
      min_shards: 1
      max_samples_per_send: 2000
      batch_send_deadline: 5s
      retry_on_http_429: true

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["app-dev:8000"]
        labels:
          env: dev

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
