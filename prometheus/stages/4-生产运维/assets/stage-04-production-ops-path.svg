<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="345" viewBox="0 0 940 345" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="940" height="345" fill="#fafafa"/>

  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#4a148c">阶段 4 · 生产运维 ——「别让它在半夜崩」</text>
  <text x="470" y="56" text-anchor="middle" font-size="12" fill="#555">跑起来了，然后呢？</text>

  <!-- 课 10 -->
  <rect x="30" y="76" width="280" height="176" rx="8" fill="#fff" stroke="#6A1B9A" stroke-width="2"/>
  <rect x="30" y="76" width="280" height="32" rx="8" fill="#6A1B9A"/>
  <text x="170" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff">课 10 基数治理</text>
  <text x="46" y="126" font-size="11.5" fill="#333">① 基数的来源与量级</text>
  <text x="46" y="150" font-size="11.5" fill="#333">② 诊断高基数</text>
  <text x="46" y="174" font-size="11.5" fill="#333">③ 控制手段</text>
  <line x1="46" y1="196" x2="294" y2="196" stroke="#e0e0e0" stroke-width="1"/>
  <text x="46" y="216" font-size="11" fill="#666">头号杀手是谁、怎么按住</text>
  <text x="46" y="238" font-size="11" fill="#666">产出：构造高基数并实测影响</text>

  <!-- 课 11 -->
  <rect x="330" y="76" width="280" height="176" rx="8" fill="#fff" stroke="#6A1B9A" stroke-width="2"/>
  <rect x="330" y="76" width="280" height="32" rx="8" fill="#6A1B9A"/>
  <text x="470" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff">课 11 容量规划与调优</text>
  <text x="346" y="126" font-size="11.5" fill="#333">① 内存与磁盘估算</text>
  <text x="346" y="150" font-size="11.5" fill="#333">② 关键调优参数</text>
  <text x="346" y="174" font-size="11.5" fill="#333">③ 监控 Prometheus 自身</text>
  <line x1="346" y1="196" x2="594" y2="196" stroke="#e0e0e0" stroke-width="1"/>
  <text x="346" y="216" font-size="11" fill="#666">要多少资源、不抄经验公式</text>
  <text x="346" y="238" font-size="11" fill="#666">产出：本机实测测量方法</text>

  <!-- 课 12 -->
  <rect x="630" y="76" width="280" height="176" rx="8" fill="#fff" stroke="#6A1B9A" stroke-width="2"/>
  <rect x="630" y="76" width="280" height="32" rx="8" fill="#6A1B9A"/>
  <text x="770" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff">课 12 运维工具链与排障</text>
  <text x="646" y="126" font-size="11.5" fill="#333">① promtool 工具链</text>
  <text x="646" y="150" font-size="11.5" fill="#333">② TSDB 管理与 admin API</text>
  <text x="646" y="174" font-size="11.5" fill="#333">③ 排障方法论</text>
  <line x1="646" y1="196" x2="894" y2="196" stroke="#e0e0e0" stroke-width="1"/>
  <text x="646" y="216" font-size="11" fill="#666">崩了怎么查、改前怎么验</text>
  <text x="646" y="238" font-size="11" fill="#666">产出：规则单测 + 故障复现</text>

  <line x1="310" y1="164" x2="328" y2="164" stroke="#6A1B9A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="164" x2="628" y2="164" stroke="#6A1B9A" stroke-width="2" marker-end="url(#a)"/>

  <rect x="30" y="270" width="880" height="52" rx="6" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1"/>
  <text x="46" y="290" font-size="11.5" fill="#4a148c" font-weight="bold">倒过来用前三个阶段：</text>
  <text x="46" y="310" font-size="11.5" fill="#333">看到症状 → 定位到子系统 → 找到参数。这个倒查能力建立在阶段 1（存储）、阶段 2（评估）、阶段 3（远程链路）的机制理解之上。</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6A1B9A"/>
    </marker>
  </defs>
</svg>
