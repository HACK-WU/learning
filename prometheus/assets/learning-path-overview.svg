<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="1000" height="470" fill="#fafafa"/>

  <text x="500" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a237e">Prometheus 系统学习路径</text>
  <text x="500" y="62" text-anchor="middle" font-size="12.5" fill="#555">主角：一条时间序列 ｜ 冲突：单机要接住数据洪流 ｜ 收束：边界在哪、越界往哪扩</text>

  <!-- 前置 -->
  <rect x="380" y="82" width="240" height="40" rx="6" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5"/>
  <text x="500" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#283593">前置：promql/ 课程（已结课）</text>
  <text x="500" y="117" text-anchor="middle" font-size="11" fill="#5c6bc0">语法·函数·聚合·向量匹配 不重讲</text>

  <line x1="500" y1="122" x2="500" y2="146" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段 1 -->
  <rect x="40" y="150" width="215" height="112" rx="8" fill="#fff" stroke="#1565C0" stroke-width="2"/>
  <rect x="40" y="150" width="215" height="30" rx="8" fill="#1565C0"/>
  <text x="147" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">阶段 1 · 单机内核</text>
  <text x="54" y="196" font-size="11.5" fill="#333">课 1 架构总览与第一条数据</text>
  <text x="54" y="214" font-size="11.5" fill="#333">课 2 目标从哪来（SD+relabel）</text>
  <text x="54" y="232" font-size="11.5" fill="#333">课 3 TSDB 存储引擎</text>
  <text x="54" y="252" font-size="11" fill="#666">→ 接住并落盘</text>

  <!-- 阶段 2 -->
  <rect x="285" y="150" width="215" height="112" rx="8" fill="#fff" stroke="#00695C" stroke-width="2"/>
  <rect x="285" y="150" width="215" height="30" rx="8" fill="#00695C"/>
  <text x="392" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">阶段 2 · 规则与告警</text>
  <text x="299" y="196" font-size="11.5" fill="#333">课 4 规则引擎</text>
  <text x="299" y="214" font-size="11.5" fill="#333">课 5 Alertmanager 深入</text>
  <text x="299" y="232" font-size="11.5" fill="#333">课 6 查询引擎与查询成本</text>
  <text x="299" y="252" font-size="11" fill="#666">→ 变成告警</text>

  <!-- 阶段 3 -->
  <rect x="530" y="150" width="215" height="112" rx="8" fill="#fff" stroke="#EF6C00" stroke-width="2"/>
  <rect x="530" y="150" width="215" height="30" rx="8" fill="#EF6C00"/>
  <text x="637" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">阶段 3 · 规模化与生态</text>
  <text x="544" y="196" font-size="11.5" fill="#333">课 7 远程读写与 Agent 模式</text>
  <text x="544" y="214" font-size="11.5" fill="#333">课 8 联邦与全局视图</text>
  <text x="544" y="232" font-size="11.5" fill="#333">课 9 长期存储选型</text>
  <text x="544" y="252" font-size="11" fill="#666">→ 单机装不下时</text>

  <!-- 阶段 4 -->
  <rect x="775" y="150" width="185" height="112" rx="8" fill="#fff" stroke="#6A1B9A" stroke-width="2"/>
  <rect x="775" y="150" width="185" height="30" rx="8" fill="#6A1B9A"/>
  <text x="867" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">阶段 4 · 生产运维</text>
  <text x="789" y="196" font-size="11.5" fill="#333">课 10 基数治理</text>
  <text x="789" y="214" font-size="11.5" fill="#333">课 11 容量规划与调优</text>
  <text x="789" y="232" font-size="11.5" fill="#333">课 12 运维工具链与排障</text>
  <text x="789" y="252" font-size="11" fill="#666">→ 别崩、崩了能查</text>

  <!-- 横向依赖箭头 -->
  <line x1="255" y1="206" x2="283" y2="206" stroke="#1565C0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="206" x2="528" y2="206" stroke="#00695C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745" y1="206" x2="773" y2="206" stroke="#EF6C00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 依赖说明 -->
  <rect x="40" y="288" width="920" height="52" rx="6" fill="#fffde7" stroke="#f9a825" stroke-width="1"/>
  <text x="56" y="308" font-size="11.5" fill="#333">前置依赖说明：阶段 1 是全部后续的地基（不理解 TSDB 分层，容量规划与排障都是背结论）；阶段 2 依赖阶段 1 的抓取语义；</text>
  <text x="56" y="328" font-size="11.5" fill="#333">阶段 3 依赖阶段 1+2（remote write 传的就是抓取到的数据与规则结果）；阶段 4 横跨全程，其排障能力建立在阶段 1-3 的机制理解上。</text>

  <!-- 收尾产物 -->
  <text x="500" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">全部阶段完成后 → 收尾产物</text>

  <rect x="180" y="386" width="200" height="44" rx="6" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
  <text x="280" y="405" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0d47a1">结课实战项目</text>
  <text x="280" y="422" text-anchor="middle" font-size="11" fill="#1565C0">跨 ≥3 阶段整合</text>

  <rect x="410" y="386" width="200" height="44" rx="6" fill="#e0f2f1" stroke="#00695C" stroke-width="1.5"/>
  <text x="510" y="405" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#004d40">课程手册</text>
  <text x="510" y="422" text-anchor="middle" font-size="11" fill="#00695C">全书汇总</text>

  <rect x="640" y="386" width="200" height="44" rx="6" fill="#f3e5f5" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="740" y="405" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a148c">经验 + 排障 + 解法库</text>
  <text x="740" y="422" text-anchor="middle" font-size="11" fill="#6A1B9A">学习态 / 使用态 / 设计态</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#777"/>
    </marker>
  </defs>
</svg>
