<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; }
      .heading { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; }
      .body { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; }
      .panel { fill: #fff; stroke: #b0bec5; stroke-width: 2; rx: 16; }
      .blue { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; rx: 12; }
      .green { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 12; }
      .orange { fill: #fff3e0; stroke: #ef6c00; stroke-width: 2; rx: 12; }
      .gray { fill: #f5f7f8; stroke: #78909c; stroke-width: 2; rx: 12; }
      .red { fill: #ffebee; stroke: #c62828; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="title">一段程序，为什么会变成两种住法</text>
  <text x="600" y="73" text-anchor="middle" class="subtitle">关键差别：是各住各的房间，还是共用一间正厅</text>

  <rect x="55" y="110" width="520" height="390" class="panel"/>
  <text x="315" y="150" text-anchor="middle" class="heading">独立包房</text>
  <text x="315" y="178" text-anchor="middle" class="small">每个住户有自己的房间和门牌</text>

  <rect x="90" y="215" width="190" height="175" class="blue"/>
  <text x="185" y="250" text-anchor="middle" class="label">住户甲</text>
  <text x="185" y="286" text-anchor="middle" class="body">自己的桌面</text>
  <text x="185" y="316" text-anchor="middle" class="body">自己的抽屉</text>
  <text x="185" y="346" text-anchor="middle" class="body">自己的门牌</text>
  <text x="185" y="375" text-anchor="middle" class="small">改动不直接影响乙</text>

  <rect x="350" y="215" width="190" height="175" class="blue"/>
  <text x="445" y="250" text-anchor="middle" class="label">住户乙</text>
  <text x="445" y="286" text-anchor="middle" class="body">自己的桌面</text>
  <text x="445" y="316" text-anchor="middle" class="body">自己的抽屉</text>
  <text x="445" y="346" text-anchor="middle" class="body">自己的门牌</text>
  <text x="445" y="375" text-anchor="middle" class="small">改动不直接影响甲</text>

  <path d="M280 302 H348" stroke="#1565c0" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/>
  <text x="314" y="286" text-anchor="middle" class="small">要传话</text>
  <text x="315" y="443" text-anchor="middle" class="body">隔离强，传话要走专门通道</text>

  <rect x="625" y="110" width="520" height="390" class="panel"/>
  <text x="885" y="150" text-anchor="middle" class="heading">共享正厅</text>
  <text x="885" y="178" text-anchor="middle" class="small">同一栋房子里有多个服务员</text>

  <rect x="660" y="215" width="450" height="175" class="green"/>
  <text x="885" y="250" text-anchor="middle" class="label">同一间正厅</text>
  <rect x="700" y="275" width="105" height="60" class="gray"/>
  <rect x="835" y="275" width="105" height="60" class="gray"/>
  <rect x="970" y="275" width="105" height="60" class="gray"/>
  <text x="752" y="311" text-anchor="middle" class="body">服务员甲</text>
  <text x="887" y="311" text-anchor="middle" class="body">服务员乙</text>
  <text x="1022" y="311" text-anchor="middle" class="body">服务员丙</text>
  <text x="885" y="365" text-anchor="middle" class="small">能直接看到公共桌面，但各有自己的小本子</text>
  <text x="885" y="443" text-anchor="middle" class="body">沟通快，但需要约定谁先改桌面</text>

  <rect x="85" y="550" width="1030" height="90" class="orange"/>
  <text x="600" y="582" text-anchor="middle" class="label">怎么选？先问一个问题</text>
  <text x="600" y="612" text-anchor="middle" class="body">更怕“一个住户出事拖累全部人” → 独立包房；更需要“多人快速协作” → 共享正厅</text>

  <path d="M315 500 V545" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M885 500 V545" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
</svg>
