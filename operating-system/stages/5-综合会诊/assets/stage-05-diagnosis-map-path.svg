  <text x="56" y="178" font-size="12" fill="#666">给服务器做体检</text>
  <text x="56" y="225" font-size="11" fill="#333">14.1 一组指标一个工具</text>
  <text x="56" y="248" font-size="11" fill="#333">14.2 读数的口径陷阱</text>
  <text x="56" y="271" font-size="11" fill="#333">14.3 压力复现实验</text>
  <line x1="294" y1="245" x2="316" y2="245" stroke="#90A4AE"/>
  <polygon points="314,241 314,249 322,245" fill="#90A4AE"/>

  <!-- 课 15 -->
  <rect x="325" y="100" width="250" height="290" rx="10" fill="#ffffff" stroke="#B0BEC5"/>
  <rect x="341" y="116" width="70" height="30" rx="6" fill="#2E7D32"/>
  <text x="376" y="137" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">课 15</text>
  <text x="421" y="137" font-size="14" font-weight="bold" fill="#333">三个经典病例</text>
  <text x="341" y="178" font-size="12" fill="#666">三条排查链完整走一遍</text>
