  <!-- 课 16 -->
  <rect x="610" y="100" width="250" height="290" rx="10" fill="#ffffff" stroke="#B0BEC5"/>
  <rect x="626" y="116" width="70" height="30" rx="6" fill="#2E7D32"/>
  <text x="661" y="137" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">课 16</text>
