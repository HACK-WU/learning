<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#263238">CPU · GPU · NPU：不是谁更强，而是谁更匹配</text>
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="15" fill="#546e7a">上半看芯片哲学；下半把“模型能不能放上去”拆成可检查的决策路径。</text>

  <rect x="40" y="105" width="350" height="270" rx="12" fill="#fafafa" stroke="#90a4ae" stroke-width="2"/>
  <rect x="40" y="105" width="350" height="54" rx="12" fill="#455a64"/>
  <rect x="40" y="147" width="350" height="12" fill="#455a64"/>
  <text x="65" y="140" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">CPU · 通用总指挥</text>
  <text x="65" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">擅长</text>
  <text x="65" y="220" font-family="Arial, sans-serif" font-size="15" fill="#37474f">分支、控制、低延迟、通用逻辑</text>
  <text x="65" y="255" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">代价</text>
  <text x="65" y="282" font-family="Arial, sans-serif" font-size="15" fill="#37474f">大规模张量吞吐可能不够</text>
  <text x="65" y="317" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">关键词</text>
  <text x="65" y="344" font-family="Arial, sans-serif" font-size="15" fill="#37474f">灵活 · 回退 · 单请求</text>

  <rect x="425" y="105" width="350" height="270" rx="12" fill="#f5f9ff" stroke="#5c8dc7" stroke-width="2"/>
  <rect x="425" y="105" width="350" height="54" rx="12" fill="#1565c0"/>
  <rect x="425" y="147" width="350" height="12" fill="#1565c0"/>
  <text x="450" y="140" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">GPU · 并行车间</text>
  <text x="450" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">擅长</text>
  <text x="450" y="220" font-family="Arial, sans-serif" font-size="15" fill="#37474f">大批量并行、矩阵、训练和吞吐</text>
  <text x="450" y="255" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">代价</text>
  <text x="450" y="282" font-family="Arial, sans-serif" font-size="15" fill="#37474f">显存、传输、驱动与调度成本</text>
  <text x="450" y="317" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">关键词</text>
  <text x="450" y="344" font-family="Arial, sans-serif" font-size="15" fill="#37474f">吞吐 · 灵活并行 · 批量</text>

  <rect x="810" y="105" width="350" height="270" rx="12" fill="#fffaf0" stroke="#d99a2b" stroke-width="2"/>
  <rect x="810" y="105" width="350" height="54" rx="12" fill="#ef8f00"/>
  <rect x="810" y="147" width="350" height="12" fill="#ef8f00"/>
  <text x="835" y="140" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">NPU · 张量流水线</text>
  <text x="835" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">擅长</text>
  <text x="835" y="220" font-family="Arial, sans-serif" font-size="15" fill="#37474f">规则张量热点、端侧持续推理</text>
  <text x="835" y="255" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">代价</text>
  <text x="835" y="282" font-family="Arial, sans-serif" font-size="15" fill="#37474f">算子、精度、编译和回退约束</text>
  <text x="835" y="317" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">关键词</text>
  <text x="835" y="344" font-family="Arial, sans-serif" font-size="15" fill="#37474f">支持率 · 少搬运 · 低功耗</text>

  <rect x="40" y="410" width="1120" height="290" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <text x="65" y="445" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263238">从模型到芯片：先查映射，再谈加速</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#607d8b"/>
    </marker>
  </defs>

  <rect x="70" y="500" width="190" height="72" rx="9" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
  <text x="165" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">模型工作负载</text>
  <text x="165" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#455a64">算子 + 数据 + 延迟目标</text>

  <line x1="260" y1="536" x2="340" y2="536" stroke="#607d8b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="340" y="500" width="250" height="72" rx="9" fill="#e3f2fd" stroke="#5c8dc7" stroke-width="2"/>
  <text x="465" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">主要是张量运算？</text>
  <text x="465" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#455a64">矩阵 / 卷积 / 规则数据流</text>

  <line x1="590" y1="525" x2="690" y2="472" stroke="#607d8b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="626" y="487" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2e7d32">是</text>
  <line x1="590" y1="548" x2="690" y2="607" stroke="#607d8b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="626" y="590" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#c62828">否</text>

  <rect x="690" y="435" width="205" height="72" rx="9" fill="#fff3e0" stroke="#ef8f00" stroke-width="2"/>
  <text x="792" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">NPU 候选</text>
  <text x="792" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#455a64">继续查覆盖率与精度</text>

  <rect x="690" y="570" width="205" height="72" rx="9" fill="#f5f5f5" stroke="#90a4ae" stroke-width="2"/>
  <text x="792" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">CPU / GPU</text>
  <text x="792" y="623" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#455a64">看控制流、批量和吞吐</text>

  <line x1="895" y1="471" x2="945" y2="471" stroke="#607d8b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="945" y="425" width="180" height="105" rx="9" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
  <text x="1035" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1b5e20">五道门</text>
  <text x="1035" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">算子 · 精度 · 驻留</text>
  <text x="1035" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">回退 · 运维</text>
  <text x="1035" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">全链路通过才值得迁移</text>

  <rect x="70" y="655" width="1055" height="30" rx="8" fill="#263238"/>
  <text x="597" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">最终比较端到端路径：计算收益 − 编译 / 回退 / 搬运 / 运维成本</text>
</svg>
