<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <title>程序看到的连续空间与机器实际安排的对照</title>
  <desc>左侧展示程序以为自己独占一整栋连续大楼，右侧展示机器把内容分散安排并按需准备，中间用一张对应表连接两者。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1565C0"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; }
      .section { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; }
      .small { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #455A64; }
      .tiny { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #546E7A; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#FAFAFA"/>
  <text x="600" y="44" text-anchor="middle" class="title">同一个程序，两个世界</text>
  <text x="600" y="72" text-anchor="middle" class="small">把“我想要一块连续空间”变成“机器按需安排真实位置”</text>

  <rect x="42" y="108" width="330" height="430" rx="18" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2"/>
  <text x="207" y="148" text-anchor="middle" class="section">程序看到的世界</text>
  <text x="207" y="177" text-anchor="middle" class="small">像一栋自己独占的大楼</text>

  <rect x="92" y="210" width="230" height="78" rx="10" fill="#FFFFFF" stroke="#64B5F6" stroke-width="2"/>
  <text x="207" y="242" text-anchor="middle" class="label">自己的房间</text>
  <text x="207" y="268" text-anchor="middle" class="small">别人不能随便进来</text>

  <rect x="92" y="312" width="230" height="78" rx="10" fill="#FFFFFF" stroke="#64B5F6" stroke-width="2"/>
  <text x="207" y="344" text-anchor="middle" class="label">连续的门牌</text>
  <text x="207" y="370" text-anchor="middle" class="small">看起来整齐、好使用</text>

  <rect x="92" y="414" width="230" height="78" rx="10" fill="#FFFFFF" stroke="#64B5F6" stroke-width="2"/>
  <text x="207" y="446" text-anchor="middle" class="label">先占个位置</text>
  <text x="207" y="472" text-anchor="middle" class="small">真正使用时再准备</text>

  <rect x="430" y="188" width="340" height="270" rx="18" fill="#FFF8E1" stroke="#FFCC80" stroke-width="2"/>
  <text x="600" y="230" text-anchor="middle" class="section">中间的安排</text>
  <rect x="495" y="270" width="210" height="84" rx="10" fill="#FFFFFF" stroke="#FFB74D" stroke-width="2"/>
  <text x="600" y="304" text-anchor="middle" class="label">一张对应表</text>
  <text x="600" y="330" text-anchor="middle" class="small">每个门牌都能找到</text>
  <text x="600" y="352" text-anchor="middle" class="small">机器里的真实房间</text>
  <path d="M372 323 L485 323" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M715 323 L828 323" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="412" text-anchor="middle" class="tiny">需要时查找；找不到就补上、换位或拒绝</text>

  <rect x="828" y="108" width="330" height="430" rx="18" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="2"/>
  <text x="993" y="148" text-anchor="middle" class="section">机器实际安排</text>
  <text x="993" y="177" text-anchor="middle" class="small">房间可以分散，也可以暂时不在</text>

  <rect x="878" y="210" width="230" height="78" rx="10" fill="#FFFFFF" stroke="#66BB6A" stroke-width="2"/>
  <text x="993" y="242" text-anchor="middle" class="label">分散的空房间</text>
  <text x="993" y="268" text-anchor="middle" class="small">不要求物理上连在一起</text>

  <rect x="878" y="312" width="230" height="78" rx="10" fill="#FFFFFF" stroke="#66BB6A" stroke-width="2"/>
  <text x="993" y="344" text-anchor="middle" class="label">用到才摆进去</text>
  <text x="993" y="370" text-anchor="middle" class="small">没碰到的内容可以不占房间</text>

  <rect x="878" y="414" width="230" height="78" rx="10" fill="#FFFFFF" stroke="#66BB6A" stroke-width="2"/>
  <text x="993" y="446" text-anchor="middle" class="label">不够时做选择</text>
  <text x="993" y="472" text-anchor="middle" class="small">慢慢腾挪，或清理一个住户</text>

  <text x="600" y="584" text-anchor="middle" class="tiny">先建立“门牌 → 房间”的关系，程序才可以安全地把大空间当成自己的</text>
</svg>
