<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720">
  <title>程序的窗口编号如何连接到内核对象</title>
  <desc>从程序持有的整数窗口编号，经过内核中的连接，指向普通文件、管道、网络连接和事件门卫；关闭编号后连接被释放。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/>
    </marker>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; }
      .heading { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; }
      .body { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #90A4AE; stroke-width: 2; rx: 12; }
      .blue { fill: #E3F2FD; stroke: #1565C0; stroke-width: 2; rx: 12; }
      .green { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 2; rx: 12; }
      .amber { fill: #FFF8E1; stroke: #F9A825; stroke-width: 2; rx: 12; }
      .line { stroke: #1565C0; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #78909C; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  </defs>

  <rect width="1120" height="720" fill="#FAFAFA"/>
  <text x="560" y="42" text-anchor="middle" class="title">一个整数编号，通向许多不同的“东西”</text>
  <text x="560" y="69" text-anchor="middle" class="small">先看关系：程序记住的是编号，真正的状态由内核维护</text>

  <rect x="45" y="110" width="250" height="430" class="blue"/>
  <text x="170" y="145" text-anchor="middle" class="heading">程序手里的窗口</text>
  <text x="170" y="171" text-anchor="middle" class="small">只保存几个整数编号</text>

  <rect x="75" y="205" width="190" height="52" class="box"/>
  <text x="170" y="237" text-anchor="middle" class="body">0：输入窗口</text>
  <rect x="75" y="278" width="190" height="52" class="box"/>
  <text x="170" y="310" text-anchor="middle" class="body">1：输出窗口</text>
  <rect x="75" y="351" width="190" height="52" class="box"/>
  <text x="170" y="383" text-anchor="middle" class="body">2：报错窗口</text>
  <rect x="75" y="424" width="190" height="72" class="amber"/>
  <text x="170" y="454" text-anchor="middle" class="body">3、4、5…</text>
  <text x="170" y="478" text-anchor="middle" class="small">后来打开的窗口</text>

  <rect x="380" y="160" width="300" height="330" class="green"/>
  <text x="530" y="198" text-anchor="middle" class="heading">内核里的连接台账</text>
  <text x="530" y="224" text-anchor="middle" class="small">编号指向一个正在使用的对象</text>
  <rect x="430" y="260" width="200" height="58" class="box"/>
  <text x="530" y="295" text-anchor="middle" class="body">读写位置 / 状态</text>
  <rect x="430" y="340" width="200" height="58" class="box"/>
  <text x="530" y="375" text-anchor="middle" class="body">对象类型 / 操作方式</text>
  <rect x="430" y="420" width="200" height="38" class="box"/>
  <text x="530" y="445" text-anchor="middle" class="small">关闭最后一个编号 → 释放</text>

  <path d="M295 231 L380 231" class="line"/>
  <path d="M295 304 L380 304" class="line"/>
  <path d="M295 377 L380 377" class="line"/>
  <path d="M295 460 L380 460" class="line"/>

  <path d="M680 260 C735 220, 755 175, 820 175" class="line"/>
  <path d="M680 315 C740 300, 760 270, 820 270" class="line"/>
  <path d="M680 370 C740 385, 760 365, 820 365" class="line"/>
  <path d="M680 425 C740 470, 760 460, 820 460" class="line"/>

  <rect x="820" y="130" width="250" height="88" class="box"/>
  <text x="945" y="166" text-anchor="middle" class="heading">普通文件</text>
  <text x="945" y="192" text-anchor="middle" class="small">磁盘上的内容</text>
  <rect x="820" y="225" width="250" height="88" class="box"/>
  <text x="945" y="261" text-anchor="middle" class="heading">管道</text>
  <text x="945" y="287" text-anchor="middle" class="small">一边写，一边读</text>
  <rect x="820" y="320" width="250" height="88" class="box"/>
  <text x="945" y="356" text-anchor="middle" class="heading">网络连接</text>
  <text x="945" y="382" text-anchor="middle" class="small">来回传递字节</text>
  <rect x="820" y="415" width="250" height="88" class="box"/>
  <text x="945" y="451" text-anchor="middle" class="heading">事件门卫</text>
  <text x="945" y="477" text-anchor="middle" class="small">告诉你谁已经准备好</text>

  <path d="M530 490 L530 600" class="dash"/>
  <rect x="245" y="585" width="570" height="76" class="amber"/>
  <text x="530" y="616" text-anchor="middle" class="heading">关闭编号，不等于删除路径</text>
  <text x="530" y="642" text-anchor="middle" class="small">它只是撤掉这个程序的一张通行证；对象何时释放，还看是否仍有其他引用</text>
</svg>
