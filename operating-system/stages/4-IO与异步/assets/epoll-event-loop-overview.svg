<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1565C0"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; }
      .small { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; }
      .box { stroke-width: 2; rx: 16; }
      .arrow { stroke: #1565C0; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="680" fill="#FAFAFA"/>
  <text x="560" y="48" text-anchor="middle" class="title">从一万个门口，挑出真正有事的那几个</text>
  <text x="560" y="78" text-anchor="middle" class="small">全局视角：大家都在等，但工作人员只处理已经准备好的事情</text>

  <rect x="55" y="135" width="220" height="390" fill="#E3F2FD" stroke="#64B5F6" class="box"/>
  <text x="165" y="175" text-anchor="middle" class="label">很多连接</text>
  <text x="165" y="205" text-anchor="middle" class="small">大多数时候没新消息</text>
  <g fill="#90CAF9" stroke="#1976D2" stroke-width="1">
    <rect x="90" y="245" width="70" height="42" rx="8"/><rect x="175" y="245" width="70" height="42" rx="8"/>
    <rect x="90" y="305" width="70" height="42" rx="8"/><rect x="175" y="305" width="70" height="42" rx="8"/>
    <rect x="90" y="365" width="70" height="42" rx="8"/><rect x="175" y="365" width="70" height="42" rx="8"/>
    <rect x="90" y="425" width="70" height="42" rx="8"/><rect x="175" y="425" width="70" height="42" rx="8"/>
  </g>
  <text x="165" y="500" text-anchor="middle" class="small">连接 1 … 连接 10,000</text>

  <rect x="365" y="190" width="260" height="280" fill="#FFF8E1" stroke="#F9A825" class="box"/>
  <text x="495" y="240" text-anchor="middle" class="label">登记处</text>
  <text x="495" y="275" text-anchor="middle" class="small">持续留意每个门口</text>
  <path d="M425 315 H565 M425 355 H565 M425 395 H565" stroke="#F9A825" stroke-width="8" stroke-linecap="round"/>
  <circle cx="455" cy="315" r="7" fill="#43A047"/><circle cx="530" cy="395" r="7" fill="#43A047"/>
  <text x="495" y="440" text-anchor="middle" class="small">只把“现在能处理”的</text>
  <text x="495" y="463" text-anchor="middle" class="small">门口交给下一站</text>

  <rect x="715" y="155" width="205" height="350" fill="#E8F5E9" stroke="#66BB6A" class="box"/>
  <text x="817" y="198" text-anchor="middle" class="label">待处理清单</text>
  <text x="817" y="227" text-anchor="middle" class="small">此刻真的有事的</text>
  <rect x="755" y="270" width="125" height="44" rx="10" fill="#A5D6A7" stroke="#43A047"/>
  <rect x="755" y="335" width="125" height="44" rx="10" fill="#A5D6A7" stroke="#43A047"/>
  <rect x="755" y="400" width="125" height="44" rx="10" fill="#A5D6A7" stroke="#43A047"/>
  <text x="817" y="298" text-anchor="middle" class="small">连接 A</text>
  <text x="817" y="363" text-anchor="middle" class="small">连接 B</text>
  <text x="817" y="428" text-anchor="middle" class="small">连接 C</text>

  <rect x="980" y="245" width="95" height="170" fill="#EDE7F6" stroke="#7E57C2" class="box"/>
  <text x="1027" y="285" text-anchor="middle" class="label">一个</text>
  <text x="1027" y="315" text-anchor="middle" class="label">工作人员</text>
  <text x="1027" y="355" text-anchor="middle" class="small">逐个</text>
  <text x="1027" y="378" text-anchor="middle" class="small">处理</text>

  <path d="M275 330 H355" class="arrow"/>
  <path d="M625 330 H705" class="arrow"/>
  <path d="M920 330 H970" class="arrow"/>
  <path d="M1027 435 C1027 575 495 590 495 480" class="arrow"/>
  <text x="560" y="625" text-anchor="middle" class="small">处理完一批，再回登记处等下一批</text>
</svg>
