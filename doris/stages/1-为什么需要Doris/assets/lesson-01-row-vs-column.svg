<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="980" height="400" fill="#fbfbfb"/>
  <text x="490" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">行存 vs 列存：同一张表、同一条聚合查询，读取范围差多少</text>

  <!-- 行存 -->
  <text x="60" y="66" font-size="14" font-weight="700" fill="#b71c1c">行存（MySQL InnoDB）</text>
  <text x="60" y="86" font-size="11.5" fill="#777">数据按"行"连续存放 → 要读某一列，必须把它所在的整行取出来</text>

  <g>
    <rect x="60" y="100" width="400" height="200" fill="#fff" stroke="#C62828" stroke-width="2"/>
    <text x="70" y="118" font-size="10.5" fill="#777">第 1 行</text>
    <rect x="70" y="124" width="380" height="16" fill="#e0e0e0"/>
    <rect x="70" y="124" width="40" height="16" fill="#ffcdd2"/>
    <rect x="170" y="124" width="40" height="16" fill="#ffcdd2"/>
    <text x="70" y="152" font-size="10.5" fill="#777">第 2 行</text>
    <rect x="70" y="158" width="380" height="16" fill="#e0e0e0"/>
    <rect x="70" y="158" width="40" height="16" fill="#ffcdd2"/>
    <rect x="170" y="158" width="40" height="16" fill="#ffcdd2"/>
    <text x="70" y="186" font-size="10.5" fill="#777">第 3 行</text>
    <rect x="70" y="192" width="380" height="16" fill="#e0e0e0"/>
    <rect x="70" y="192" width="40" height="16" fill="#ffcdd2"/>
    <rect x="170" y="192" width="40" height="16" fill="#ffcdd2"/>
    <text x="70" y="220" font-size="10.5" fill="#777">第 4 行</text>
    <rect x="70" y="226" width="380" height="16" fill="#e0e0e0"/>
    <rect x="70" y="226" width="40" height="16" fill="#ffcdd2"/>
    <rect x="170" y="226" width="40" height="16" fill="#ffcdd2"/>
    <text x="70" y="254" font-size="10.5" fill="#777">… 共 2000 万行</text>
    <rect x="70" y="260" width="380" height="16" fill="#e0e0e0"/>
    <rect x="70" y="260" width="40" height="16" fill="#ffcdd2"/>
    <rect x="170" y="260" width="40" height="16" fill="#ffcdd2"/>
    <text x="70" y="290" font-size="10.5" fill="#777">第 N 行</text>
    <rect x="70" y="296" width="380" height="16" fill="#e0e0e0"/>
    <rect x="70" y="296" width="40" height="16" fill="#ffcdd2"/>
    <rect x="170" y="296" width="40" height="16" fill="#ffcdd2"/>
    <text x="260" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b71c1c">阴影 = 真正要的 2 列；灰色 = 白读的 13 列</text>
  </g>

  <!-- 列存 -->
  <text x="530" y="66" font-size="14" font-weight="700" fill="#1b5e20">列存（Doris）</text>
  <text x="530" y="86" font-size="11.5" fill="#777">数据按"列"连续存放 → 要读哪列就读哪列，其余列留在磁盘上</text>

  <g>
    <rect x="530" y="100" width="400" height="200" fill="#fff" stroke="#2E7D32" stroke-width="2"/>
    <text x="542" y="118" font-size="10.5" fill="#777">province 列</text>
    <rect x="542" y="124" width="376" height="16" fill="#c8e6c9"/>
    <text x="542" y="152" font-size="10.5" fill="#777">amount 列</text>
    <rect x="542" y="158" width="376" height="16" fill="#c8e6c9"/>
    <text x="542" y="186" font-size="10.5" fill="#777">id 列</text>
    <rect x="542" y="192" width="376" height="16" fill="#f5f5f5" stroke-dasharray="3 2"/>
    <text x="542" y="220" font-size="10.5" fill="#777">city 列</text>
    <rect x="542" y="226" width="376" height="16" fill="#f5f5f5" stroke-dasharray="3 2"/>
    <text x="542" y="254" font-size="10.5" fill="#777">… 其余 11 列（不读）</text>
    <rect x="542" y="260" width="376" height="16" fill="#f5f5f5" stroke-dasharray="3 2"/>
    <rect x="542" y="272" width="376" height="16" fill="#f5f5f5" stroke-dasharray="3 2"/>
    <text x="730" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b5e20">绿色 = 只读这两列；虚线 = 完全不碰</text>
  </g>

  <!-- 底部结论 -->
  <rect x="60" y="352" width="870" height="34" rx="8" fill="#fff8e1" stroke="#F9A825"/>
  <text x="495" y="374" text-anchor="middle" font-size="12" fill="#8d6e00">实测：MySQL 每行 165 字节，Q2 真正需要的两列仅约 20 字节 → 行存读取放大约 8 倍（2000 万行，2026-09-02 本机实测）</text>
</svg>
