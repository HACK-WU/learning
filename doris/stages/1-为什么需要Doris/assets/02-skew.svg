<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="980" height="300" fill="#fbfbfb"/>
  <text x="490" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">分桶键基数过低导致的数据倾斜（本课真实发生的）</text>

  <text x="40" y="56" font-size="12" fill="#555">建表语句：DISTRIBUTED BY HASH(province) BUCKETS 8 —— 但数据里只有 8 个省</text>

  <!-- 8 个桶 -->
  <g>
    <text x="40" y="90" font-size="11" fill="#777">tablet 0</text>
    <rect x="40" y="98" width="90" height="120" rx="4" fill="#e0e0e0" stroke="#999"/>
    <rect x="40" y="158" width="90" height="60" rx="4" fill="#ef9a9a" stroke="#C62828"/>
    <text x="85" y="236" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b71c1c">7,685,239</text>

    <text x="150" y="90" font-size="11" fill="#777">tablet 1</text>
    <rect x="150" y="98" width="90" height="120" rx="4" fill="#e0e0e0" stroke="#999" stroke-dasharray="4 3"/>
    <text x="195" y="236" text-anchor="middle" font-size="10.5" fill="#999">0（空）</text>

    <text x="260" y="90" font-size="11" fill="#777">tablet 2</text>
    <rect x="260" y="98" width="90" height="120" rx="4" fill="#e0e0e0" stroke="#999"/>
    <rect x="260" y="138" width="90" height="80" rx="4" fill="#ffcdd2" stroke="#C62828"/>
    <text x="305" y="236" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b71c1c">5,125,623</text>

    <text x="370" y="90" font-size="11" fill="#777">tablet 3</text>
    <rect x="370" y="98" width="90" height="120" rx="4" fill="#e0e0e0" stroke="#999"/>
    <rect x="370" y="138" width="90" height="80" rx="4" fill="#ffcdd2" stroke="#C62828"/>
    <text x="415" y="236" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b71c1c">5,124,985</text>

    <text x="480" y="90" font-size="11" fill="#777">tablet 4</text>
    <rect x="480" y="98" width="90" height="120" rx="4" fill="#e0e0e0" stroke="#999" stroke-dasharray="4 3"/>
    <text x="525" y="236" text-anchor="middle" font-size="10.5" fill="#999">0（空）</text>

    <text x="590" y="90" font-size="11" fill="#777">tablet 5</text>
    <rect x="590" y="98" width="90" height="120" rx="4" fill="#e0e0e0" stroke="#999" stroke-dasharray="4 3"/>
    <text x="635" y="236" text-anchor="middle" font-size="10.5" fill="#999">0（空）</text>

    <text x="700" y="90" font-size="11" fill="#777">tablet 6</text>
    <rect x="700" y="98" width="90" height="120" rx="4" fill="#e0e0e0" stroke="#999"/>
    <rect x="700" y="178" width="90" height="40" rx="4" fill="#ffe0b2" stroke="#EF6C00"/>
    <text x="745" y="236" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e65100">2,564,153</text>

    <text x="810" y="90" font-size="11" fill="#777">tablet 7</text>
    <rect x="810" y="98" width="90" height="120" rx="4" fill="#e0e0e0" stroke="#999" stroke-dasharray="4 3"/>
    <text x="855" y="236" text-anchor="middle" font-size="10.5" fill="#999">0（空）</text>
  </g>

  <text x="925" y="160" font-size="11" fill="#777">理想</text>
  <rect x="915" y="98" width="25" height="120" rx="4" fill="#e0e0e0" stroke="#999"/>
  <rect x="915" y="168" width="25" height="50" rx="4" fill="#c8e6c9" stroke="#2E7D32"/>
  <text x="927" y="236" text-anchor="middle" font-size="9.5" fill="#2E7D32">均匀</text>

  <rect x="40" y="252" width="900" height="34" rx="6" fill="#fff8e1" stroke="#F9A825"/>
  <text x="490" y="274" text-anchor="middle" font-size="11.5" fill="#8d6e00">哈希分桶是 hash(province) % 8：只有 8 个不同的省，哈希后必然只落到部分桶，其余桶永远为空 → 并行度实际只有 4</text>
</svg>
