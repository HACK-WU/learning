<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="980" height="340" fill="#fbfbfb"/>
  <text x="490" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">MOW 与 MOR：同一批数据，合并时机不同</text>
  <text x="490" y="46" text-anchor="middle" font-size="11.5" fill="#777">实验：6 批覆盖式导入，每批 30 万行，主键大量重合</text>

  <!-- MOW 流程 -->
  <text x="60" y="80" font-size="13" font-weight="700" fill="#0d47a1">MOW（写时合并）</text>
  <text x="60" y="98" font-size="10.5" fill="#777">导入时就去重覆盖</text>

  <!-- 批次 -->
  <rect x="40" y="110" width="80" height="30" rx="4" fill="#bbdefb" stroke="#1565C0"/>
  <text x="80" y="130" text-anchor="middle" font-size="10" fill="#0d47a1">批1 30万</text>
  <rect x="130" y="110" width="80" height="30" rx="4" fill="#bbdefb" stroke="#1565C0"/>
  <text x="170" y="130" text-anchor="middle" font-size="10" fill="#0d47a1">批2 30万</text>
  <rect x="220" y="110" width="80" height="30" rx="4" fill="#bbdefb" stroke="#1565C0"/>
  <text x="260" y="130" text-anchor="middle" font-size="10" fill="#0d47a1">批3 30万</text>
  <text x="315" y="130" font-size="14" fill="#999">...</text>
  <rect x="335" y="110" width="80" height="30" rx="4" fill="#bbdefb" stroke="#1565C0"/>
  <text x="375" y="130" text-anchor="middle" font-size="10" fill="#0d47a1">批6 30万</text>

  <path d="M 225 145 L 225 170 L 60 170 L 60 195" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="40" y="195" width="330" height="52" rx="6" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="205" y="215" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d47a1">每批导入时：查主键表 → 覆盖旧行 → 只写新值</text>
  <text x="205" y="236" text-anchor="middle" font-size="11" fill="#333">落盘物理行数 = 真实去重键数 = 14,659 行</text>

  <text x="205" y="270" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2E7D32">查询时：直接读，无需合并 → 快</text>
  <text x="205" y="290" text-anchor="middle" font-size="10.5" fill="#777">代价：每次导入都要查重，写放大</text>

  <!-- MOR 流程 -->
  <text x="640" y="80" font-size="13" font-weight="700" fill="#e65100">MOR（读时合并）</text>
  <text x="640" y="98" font-size="10.5" fill="#777">导入时只管追加</text>

  <rect x="580" y="110" width="80" height="30" rx="4" fill="#ffe0b2" stroke="#EF6C00"/>
  <text x="620" y="130" text-anchor="middle" font-size="10" fill="#e65100">批1 30万</text>
  <rect x="670" y="110" width="80" height="30" rx="4" fill="#ffe0b2" stroke="#EF6C00"/>
  <text x="710" y="130" text-anchor="middle" font-size="10" fill="#e65100">批2 30万</text>
  <rect x="760" y="110" width="80" height="30" rx="4" fill="#ffe0b2" stroke="#EF6C00"/>
  <text x="800" y="130" text-anchor="middle" font-size="10" fill="#e65100">批3 30万</text>
  <text x="855" y="130" font-size="14" fill="#999">...</text>
  <rect x="875" y="110" width="80" height="30" rx="4" fill="#ffe0b2" stroke="#EF6C00"/>
  <text x="915" y="130" text-anchor="middle" font-size="10" fill="#e65100">批6 30万</text>

  <path d="M 765 145 L 765 170 L 600 170 L 600 195" stroke="#EF6C00" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <rect x="580" y="195" width="375" height="52" rx="6" fill="#fff3e0" stroke="#EF6C00"/>
  <text x="767" y="215" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e65100">每批导入时：不查重，直接追加新版本</text>
  <text x="767" y="236" text-anchor="middle" font-size="11" fill="#333">落盘物理行数 = 29,104 行（含未合并的旧版本）</text>

  <text x="767" y="270" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C62828">查询时：边读边合并去重 → 慢</text>
  <text x="767" y="290" text-anchor="middle" font-size="10.5" fill="#777">代价：COUNT(*) 会虚高，且查询要付合并成本</text>

  <!-- 底部结论 -->
  <rect x="40" y="302" width="900" height="30" rx="6" fill="#e8eaf6" stroke="#3F51B5"/>
  <text x="490" y="322" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a237e">实测：同样 6 批导入，MOW 最终 14,659 行，MOR 物理行 29,104 行 —— 差了近一倍</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF6C00"/>
    </marker>
  </defs>
</svg>
