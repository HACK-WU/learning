<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1000" height="420" fill="#fbfbfb"/>
  <text x="500" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">分区裁剪：同一个查询，扫多少数据完全不一样</text>
  <text x="500" y="48" text-anchor="middle" font-size="11.5" fill="#777">查询：统计 2025 年 6 月的订单数与销售总额（实测于 Doris 4.1.3，2050 万行）</text>

  <!-- 不分区 -->
  <text x="120" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#C62828">不分区的表</text>
  <rect x="40" y="96" width="160" height="150" rx="4" fill="#ffcdd2" stroke="#C62828" stroke-width="2"/>
  <text x="120" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#b71c1c">全部数据</text>
  <text x="120" y="192" text-anchor="middle" font-size="11" fill="#b71c1c">2050 万行</text>
  <text x="120" y="230" text-anchor="middle" font-size="10" fill="#C62828">每一块都要扫</text>

  <text x="120" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#C62828">partitions=1/1</text>
  <text x="120" y="290" text-anchor="middle" font-size="11" fill="#333">tablets=8/8</text>
  <text x="120" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#C62828">cardinality=20500000</text>

  <!-- 箭头 -->
  <path d="M 230 170 L 290 170" stroke="#666" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 按月 -->
  <text x="420" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D32">按月分区（45 个分区）</text>
  <rect x="300" y="96" width="240" height="150" rx="4" fill="#e8f5e9" stroke="#2E7D32" stroke-width="1.5"/>
  <!-- 45 个小格，1 个高亮 -->
  <g>
    <rect x="308" y="104" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="354" y="104" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="400" y="104" width="42" height="18" rx="2" fill="#66bb6a" stroke="#2E7D32" stroke-width="2"/>
    <text x="421" y="117" text-anchor="middle" font-size="8.5" fill="#1b5e20">p202506</text>
    <rect x="446" y="104" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="492" y="104" width="42" height="18" rx="2" fill="#c8e6c9"/>

    <rect x="308" y="126" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="354" y="126" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="400" y="126" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="446" y="126" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="492" y="126" width="42" height="18" rx="2" fill="#c8e6c9"/>

    <rect x="308" y="148" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="354" y="148" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="400" y="148" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="446" y="148" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="492" y="148" width="42" height="18" rx="2" fill="#c8e6c9"/>

    <rect x="308" y="170" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="354" y="170" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="400" y="170" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="446" y="170" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="492" y="170" width="42" height="18" rx="2" fill="#c8e6c9"/>

    <rect x="308" y="192" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="354" y="192" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="400" y="192" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="446" y="192" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="492" y="192" width="42" height="18" rx="2" fill="#c8e6c9"/>

    <rect x="308" y="214" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="354" y="214" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="400" y="214" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="446" y="214" width="42" height="18" rx="2" fill="#c8e6c9"/>
    <rect x="492" y="214" width="42" height="18" rx="2" fill="#c8e6c9"/>
  </g>
  <text x="420" y="240" text-anchor="middle" font-size="10" fill="#2E7D32">45 个分区，只扫深绿色那 1 个</text>

  <text x="420" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D32">partitions=1/45</text>
  <text x="420" y="290" text-anchor="middle" font-size="11" fill="#333">tablets=8/8</text>
  <text x="420" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D32">cardinality=842808</text>
  <text x="420" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">扫描量减少 24.3 倍</text>

  <!-- 箭头 -->
  <path d="M 560 170 L 620 170" stroke="#666" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 按天 -->
  <text x="810" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#EF6C00">按天分区（365 个分区）</text>
  <rect x="630" y="96" width="330" height="150" rx="4" fill="#fff3e0" stroke="#EF6C00" stroke-width="1.5"/>
  <g>
    <rect x="638" y="104" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="660" y="104" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="682" y="104" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="704" y="104" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="726" y="104" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="748" y="104" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="770" y="104" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="792" y="104" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="814" y="104" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="836" y="104" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="858" y="104" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="880" y="104" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="902" y="104" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="924" y="104" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="946" y="104" width="18" height="12" rx="1" fill="#ffe0b2"/>

    <rect x="638" y="120" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="660" y="120" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="682" y="120" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="704" y="120" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="726" y="120" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="748" y="120" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="770" y="120" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="792" y="120" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="814" y="120" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="836" y="120" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="858" y="120" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="880" y="120" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="902" y="120" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="924" y="120" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="946" y="120" width="18" height="12" rx="1" fill="#ffe0b2"/>

    <rect x="638" y="136" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="660" y="136" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="682" y="136" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="704" y="136" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="726" y="136" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="748" y="136" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="770" y="136" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="792" y="136" width="18" height="12" rx="1" fill="#ffb74d" stroke="#EF6C00"/>
    <rect x="814" y="136" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="836" y="136" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="858" y="136" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="880" y="136" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="902" y="136" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="924" y="136" width="18" height="12" rx="1" fill="#ffe0b2"/>
    <rect x="946" y="136" width="18" height="12" rx="1" fill="#ffe0b2"/>
  </g>
  <text x="795" y="170" text-anchor="middle" font-size="10" fill="#e65100">...共 365 格，橙色 30 格是 6 月</text>
  <text x="795" y="188" text-anchor="middle" font-size="10" fill="#e65100">查一个月要扫 30 个分区</text>
  <text x="795" y="228" text-anchor="middle" font-size="10.5" fill="#EF6C00">但查单日只需 1/365 个分区</text>

  <text x="810" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#EF6C00">partitions=30/365</text>
  <text x="810" y="290" text-anchor="middle" font-size="11" fill="#333">tablets=240/240</text>
  <text x="810" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#EF6C00">tablet 总数 2920</text>
  <text x="810" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#C62828">查整月反而不划算</text>

  <!-- 结论 -->
  <rect x="40" y="352" width="920" height="52" rx="8" fill="#e8eaf6" stroke="#3F51B5" stroke-width="1.5"/>
  <text x="500" y="374" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a237e">结论：分区粒度要匹配查询模式——查整月就用月，查单日就用天，不是越细越好</text>
  <text x="500" y="395" text-anchor="middle" font-size="11" fill="#333">三个方案查出的数据完全相同（842808 行、总额 2114259057），差异只在"扫了多少"和"元数据多重"</text>

  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
