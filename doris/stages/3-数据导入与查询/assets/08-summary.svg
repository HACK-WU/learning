<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#546e7a"/>
    </marker>
    <style>
      .t { font-size:20px; font-weight:bold; fill:#1a237e; }
      .s { font-size:14px; fill:#37474f; }
      .sm { font-size:12px; fill:#546e7a; }
      .box { fill:#ffffff; stroke:#90a4ae; stroke-width:1.5; rx:6; }
      .hl { fill:#fff8e1; stroke:#ffa000; stroke-width:2; }
      .good { fill:#e8f5e9; stroke:#43a047; stroke-width:2; }
      .bad { fill:#ffebee; stroke:#e53935; stroke-width:2; }
      .var { fill:#f3e5f5; stroke:#8e24aa; stroke-width:2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="980" fill="#fafafa"/>
  <text x="500" y="38" text-anchor="middle" class="t" font-size="24">半结构化数据的三种存法 & 异步物化视图</text>
  <text x="500" y="62" text-anchor="middle" class="sm">100 万行实测 · Doris 4.1.3 单机单 BE</text>

  <!-- ============ 上：三种存法 ============ -->
  <text x="30" y="102" class="t">同一份日志，三种存法</text>

  <rect x="30" y="118" width="300" height="250" class="box"/>
  <text x="180" y="145" text-anchor="middle" class="s" font-weight="bold">A. 结构化列</text>
  <text x="180" y="165" text-anchor="middle" class="sm">schema 固定时用</text>
  <rect x="55" y="180" width="250" height="60" class="good"/>
  <text x="180" y="205" text-anchor="middle" class="sm" font-family="monospace">city VARCHAR(32)</text>
  <text x="180" y="225" text-anchor="middle" class="sm" font-family="monospace">device VARCHAR(16)</text>
  <text x="180" y="288" text-anchor="middle" class="s" fill="#2e7d32">过滤 26-27 ms</text>
  <text x="180" y="310" text-anchor="middle" class="s" fill="#2e7d32">聚合 47-57 ms</text>
  <text x="180" y="332" text-anchor="middle" class="s" fill="#2e7d32">磁盘 3.962 MB</text>
  <text x="180" y="356" text-anchor="middle" class="sm">最快，但字段变了要改表</text>

  <rect x="350" y="118" width="300" height="250" class="box"/>
  <text x="500" y="145" text-anchor="middle" class="s" font-weight="bold">B. VARIANT</text>
  <text x="500" y="165" text-anchor="middle" class="sm">字段不固定 / 经常变</text>
  <rect x="375" y="180" width="250" height="60" class="var"/>
  <text x="500" y="205" text-anchor="middle" class="sm">写入整条 JSON</text>
  <text x="500" y="225" text-anchor="middle" class="sm" font-family="monospace">payload VARIANT</text>
  <text x="500" y="288" text-anchor="middle" class="s" fill="#6a1b9a">过滤 23-37 ms</text>
  <text x="500" y="310" text-anchor="middle" class="s" fill="#6a1b9a">聚合 51-73 ms</text>
  <text x="500" y="332" text-anchor="middle" class="s" fill="#6a1b9a">磁盘 3.990 MB</text>
  <text x="500" y="356" text-anchor="middle" class="sm">接近结构化列，字段自适应</text>

  <rect x="670" y="118" width="300" height="250" class="box"/>
  <text x="820" y="145" text-anchor="middle" class="s" font-weight="bold">C. JSON 字符串</text>
  <text x="820" y="165" text-anchor="middle" class="sm">老做法，不建议</text>
  <rect x="695" y="180" width="250" height="60" class="bad"/>
  <text x="820" y="205" text-anchor="middle" class="sm" font-family="monospace">payload STRING</text>
  <text x="820" y="225" text-anchor="middle" class="sm" font-family="monospace">get_json_string()</text>
  <text x="820" y="288" text-anchor="middle" class="s" fill="#c62828">过滤 156-171 ms</text>
  <text x="820" y="310" text-anchor="middle" class="s" fill="#c62828">聚合 292-355 ms</text>
  <text x="820" y="332" text-anchor="middle" class="s" fill="#c62828">磁盘 8.344 MB</text>
  <text x="820" y="356" text-anchor="middle" class="sm">每行都要现解析一遍文本</text>

  <text x="500" y="392" text-anchor="middle" class="s" fill="#c62828">JSON 字符串比 VARIANT 慢 5-7 倍（过滤）、5-6 倍（聚合），磁盘多占 1 倍</text>

  <!-- VARIANT 原理 -->
  <rect x="30" y="408" width="940" height="112" class="box"/>
  <text x="50" y="432" class="s" font-weight="bold">VARIANT 为什么快：写入时就把 JSON 拆成列存子列</text>
  <text x="50" y="456" class="sm" font-family="monospace">DESC log_variant →  payload.city(text)   payload.cost(bigint)   payload.device(text)</text>
  <text x="50" y="478" class="sm">每个 JSON 字段自动变成独立子列，和其他列一样享受列存压缩与向量化；查询时直接读子列，不用解析文本。</text>
  <text x="50" y="500" class="sm" fill="#c62828">⚠ 子列不能直接 GROUP BY / ORDER BY，必须先 CAST：</text>
  <text x="50" y="518" class="sm" font-family="monospace">  ✗ GROUP BY payload['city']      → 报错 must use with specific function</text>
  <text x="50" y="516" class="sm" font-family="monospace" fill="#2e7d32"></text>
  <text x="560" y="518" class="sm" font-family="monospace" fill="#2e7d32">  ✓ GROUP BY CAST(payload['city'] AS VARCHAR(32))</text>

  <!-- ============ 下：异步 MV ============ -->
  <text x="30" y="556" class="t">异步物化视图：把答案提前算好存起来</text>

  <rect x="30" y="572" width="455" height="230" class="box"/>
  <text x="257" y="598" text-anchor="middle" class="s" font-weight="bold">没有 MV：每次都全表扫</text>
  <rect x="55" y="615" width="180" height="55" class="be" stroke-width="1.5"/>
  <text x="145" y="640" text-anchor="middle" class="s">orders</text>
  <text x="145" y="660" text-anchor="middle" class="sm">2150 万行</text>
  <path d="M240,642 L330,642" stroke="#e53935" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="335" y="615" width="130" height="55" class="bad"/>
  <text x="400" y="640" text-anchor="middle" class="s" font-weight="bold">全表聚合</text>
  <text x="400" y="660" text-anchor="middle" class="sm" fill="#c62828">489-654 ms</text>
  <text x="257" y="700" text-anchor="middle" class="sm">每次查询都重算一遍</text>
  <text x="257" y="722" text-anchor="middle" class="sm">数据没变也算</text>
  <text x="257" y="762" text-anchor="middle" class="s" fill="#c62828">慢，但永远是最新值</text>

  <rect x="515" y="572" width="455" height="230" class="box"/>
  <text x="742" y="598" text-anchor="middle" class="s" font-weight="bold">有 MV：直接读预计算结果</text>
  <rect x="540" y="615" width="180" height="55" class="be" stroke-width="1.5"/>
  <text x="630" y="640" text-anchor="middle" class="s">orders</text>
  <text x="630" y="660" text-anchor="middle" class="sm">2150 万行</text>
  <path d="M725,635 L790,625" stroke="#9e9e9e" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4,3"/>
  <text x="757" y="618" text-anchor="middle" class="sm" fill="#757575">刷新</text>
  <rect x="795" y="600" width="150" height="85" class="good"/>
  <text x="870" y="625" text-anchor="middle" class="s" font-weight="bold">mv_prov_pay_daily</text>
  <text x="870" y="648" text-anchor="middle" class="sm">23360 行</text>
  <text x="870" y="670" text-anchor="middle" class="sm" fill="#2e7d32">预聚合结果</text>
  <text x="620" y="722" text-anchor="middle" class="sm">查询被透明改写命中它</text>
  <text x="620" y="760" text-anchor="middle" class="s" fill="#2e7d32">24-60 ms（快 10-20 倍）</text>

  <!-- 改写判定 -->
  <rect x="30" y="818" width="940" height="140" class="box"/>
  <text x="50" y="844" class="s" font-weight="bold">怎么确认命中了：EXPLAIN 看 MATERIALIZATIONS 段</text>

  <rect x="55" y="858" width="430" height="80" class="good"/>
  <text x="270" y="882" text-anchor="middle" class="s" font-weight="bold">✓ 命中</text>
  <text x="270" y="904" text-anchor="middle" class="sm" font-family="monospace">MaterializedViewRewriteSuccessAndChose:</text>
  <text x="270" y="924" text-anchor="middle" class="sm" font-family="monospace"> CBO.internal.shop.mv_prov_pay_daily chose</text>

  <rect x="510" y="858" width="440" height="80" class="bad"/>
  <text x="730" y="882" text-anchor="middle" class="s" font-weight="bold">✗ 未命中</text>
  <text x="730" y="904" text-anchor="middle" class="sm">明细查询（SELECT 原始行）不会被改写</text>
  <text x="730" y="924" text-anchor="middle" class="sm">MV 里只有聚合结果，没有明细行</text>

  <text x="500" y="975" text-anchor="middle" class="sm">MV 是异步刷新的：基表改了数据，MV 不会立刻变。REFRESH 是异步提交，返回后要等几秒才查得到新值</text>
</svg>
