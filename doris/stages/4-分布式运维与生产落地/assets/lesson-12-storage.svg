<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546e7a"/>
    </marker>
  </defs>

  <rect width="1080" height="760" fill="#fafafa"/>
  <text x="540" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">存算一体 vs 存算分离：数据放哪，决定了你能弹到什么程度</text>

  <!-- ============ 左：存算一体 ============ -->
  <rect x="40" y="62" width="480" height="330" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" rx="8"/>
  <text x="280" y="92" text-anchor="middle" font-size="19" font-weight="bold" fill="#1565c0">存算一体（本机就是这个）</text>

  <!-- BE1 -->
  <rect x="70" y="115" width="190" height="90" fill="#fff" stroke="#42a5f5" stroke-width="2" rx="5"/>
  <text x="165" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">BE 1</text>
  <text x="82" y="160" font-size="12" fill="#455a64">计算：CPU / 内存</text>
  <rect x="82" y="168" width="166" height="28" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1" rx="3"/>
  <text x="165" y="187" text-anchor="middle" font-size="12" fill="#0d47a1">本地盘：数据 + 副本</text>

  <!-- BE2 -->
  <rect x="290" y="115" width="190" height="90" fill="#fff" stroke="#42a5f5" stroke-width="2" rx="5"/>
  <text x="385" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">BE 2</text>
  <text x="302" y="160" font-size="12" fill="#455a64">计算：CPU / 内存</text>
  <rect x="302" y="168" width="166" height="28" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1" rx="3"/>
  <text x="385" y="187" text-anchor="middle" font-size="12" fill="#0d47a1">本地盘：数据 + 副本</text>

  <!-- 复制箭头 -->
  <line x1="262" y1="160" x2="288" y2="160" stroke="#1565c0" stroke-width="2" marker-end="url(#a)"/>
  <text x="275" y="152" text-anchor="middle" font-size="10" fill="#1565c0">副本同步</text>

  <text x="70" y="232" font-size="13" font-weight="bold" fill="#1565c0">可靠性来源：多副本</text>
  <text x="70" y="252" font-size="12" fill="#455a64">• BE 挂了 → FE 调度其他 BE 从剩余副本补数据</text>
  <text x="70" y="271" font-size="12" fill="#455a64">• 扩缩容要搬 tablet（数据迁移，慢）</text>
  <text x="70" y="290" font-size="12" fill="#455a64">• 存算绑在一起，加计算必须连带加存储</text>

  <rect x="70" y="305" width="410" height="70" fill="#fff" stroke="#64b5f6" stroke-width="1" rx="5"/>
  <text x="82" y="325" font-size="12" font-weight="bold" fill="#0d47a1">本机实测证据</text>
  <text x="82" y="344" font-size="11" fill="#455a64">SHOW BACKENDS → RemoteUsedCapacity = 0.000（远端没数据）</text>
  <text x="82" y="362" font-size="11" fill="#455a64">SHOW COMPUTE GROUPS → Command only support in cloud mode</text>

  <!-- ============ 右：存算分离 ============ -->
  <rect x="560" y="62" width="480" height="330" fill="#f3e5f5" stroke="#ce93d8" stroke-width="2" rx="8"/>
  <text x="800" y="92" text-anchor="middle" font-size="19" font-weight="bold" fill="#6a1b9a">存算分离（cloud mode）</text>

  <!-- 计算节点们 -->
  <rect x="590" y="115" width="120" height="72" fill="#fff" stroke="#ab47bc" stroke-width="2" rx="5"/>
  <text x="650" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">计算组 A</text>
  <text x="650" y="158" text-anchor="middle" font-size="11" fill="#455a64">（导入）</text>
  <rect x="600" y="164" width="100" height="16" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1" rx="3"/>
  <text x="650" y="176" text-anchor="middle" font-size="10" fill="#6a1b9a">本地盘=缓存</text>

  <rect x="730" y="115" width="120" height="72" fill="#fff" stroke="#ab47bc" stroke-width="2" rx="5"/>
  <text x="790" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">计算组 B</text>
  <text x="790" y="158" text-anchor="middle" font-size="11" fill="#455a64">（查询）</text>
  <rect x="740" y="164" width="100" height="16" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1" rx="3"/>
  <text x="790" y="176" text-anchor="middle" font-size="10" fill="#6a1b9a">本地盘=缓存</text>

  <rect x="870" y="115" width="120" height="72" fill="#fff" stroke="#ab47bc" stroke-width="2" rx="5"/>
  <text x="930" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">计算组 C</text>
  <text x="930" y="158" text-anchor="middle" font-size="11" fill="#455a64">（adhoc）</text>
  <rect x="880" y="164" width="100" height="16" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1" rx="3"/>
  <text x="930" y="176" text-anchor="middle" font-size="10" fill="#6a1b9a">本地盘=缓存</text>

  <!-- 共享存储 -->
  <rect x="590" y="218" width="400" height="58" fill="#fff" stroke="#8e24aa" stroke-width="2" rx="5"/>
  <text x="790" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a1b9a">共享存储（S3 / HDFS）</text>
  <text x="790" y="262" text-anchor="middle" font-size="12" fill="#455a64">数据只有一份，可靠性由存储层保证</text>

  <!-- 箭头 -->
  <line x1="650" y1="190" x2="650" y2="216" stroke="#8e24aa" stroke-width="2" marker-end="url(#a)"/>
  <line x1="790" y1="190" x2="790" y2="216" stroke="#8e24aa" stroke-width="2" marker-end="url(#a)"/>
  <line x1="930" y1="190" x2="930" y2="216" stroke="#8e24aa" stroke-width="2" marker-end="url(#a)"/>

  <text x="590" y="300" font-size="13" font-weight="bold" fill="#6a1b9a">可靠性来源：存储层</text>
  <text x="590" y="320" font-size="12" fill="#455a64">• 计算节点无状态，挂了直接换，不用搬数据</text>
  <text x="590" y="339" font-size="12" fill="#455a64">• 扩缩容是加减节点，秒级完成</text>
  <text x="590" y="358" font-size="12" fill="#455a64">• 本地盘只做缓存，丢了不影响正确性</text>
  <text x="590" y="377" font-size="12" fill="#c62828">• 代价：冷查询要跨网络 → 本机实测慢 3 倍</text>

  <!-- ============ 中下：实测对比 ============ -->
  <rect x="40" y="410" width="1000" height="190" fill="#fff" stroke="#bdbdbd" stroke-width="1" rx="8"/>
  <text x="540" y="438" text-anchor="middle" font-size="18" font-weight="bold" fill="#37474f">本地性代价的实测：不是所有查询都变慢</text>

  <!-- 聚合 -->
  <text x="80" y="472" font-size="14" font-weight="bold" fill="#455a64">聚合查询</text>
  <text x="80" y="492" font-size="12" fill="#78909c">GROUP BY（全表扫描，瓶颈在计算）</text>
  <rect x="300" y="468" width="150" height="26" fill="#66bb6a" rx="4"/>
  <text x="375" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">本地 0.16-0.20s</text>
  <rect x="470" y="468" width="150" height="26" fill="#ffa726" rx="4"/>
  <text x="545" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">共享存储 0.20-0.23s</text>
  <text x="650" y="486" font-size="13" fill="#2e7d32">几乎无差（约 1.2 倍）</text>

  <!-- 明细 -->
  <text x="80" y="527" font-size="14" font-weight="bold" fill="#455a64">明细扫描</text>
  <text x="80" y="547" font-size="12" fill="#78909c">带谓词多列过滤（瓶颈在读取）</text>
  <rect x="300" y="523" width="50" height="26" fill="#66bb6a" rx="4"/>
  <text x="325" y="541" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">本地 0.13-0.15s</text>
  <rect x="360" y="523" width="160" height="26" fill="#ef5350" rx="4"/>
  <text x="440" y="541" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">共享存储 0.40-0.42s</text>
  <text x="545" y="541" font-size="13" fill="#c62828">差 3 倍（无本地缓存兜底）</text>

  <line x1="300" y1="560" x2="300" y2="590" stroke="#bdbdbd" stroke-width="1"/>
  <line x1="620" y1="560" x2="620" y2="590" stroke="#bdbdbd" stroke-width="1"/>
  <text x="300" y="586" text-anchor="middle" font-size="11" fill="#78909c">0.1s</text>
  <text x="620" y="586" text-anchor="middle" font-size="11" fill="#78909c">0.5s</text>

  <text x="80" y="575" font-size="12" fill="#455a64">同一份 314 万行数据（2025 Q1），本地表 local_1m vs MinIO 上的 parquet</text>

  <!-- ============ 底部：选型判据 ============ -->
  <rect x="40" y="618" width="490" height="118" fill="#e8f5e9" stroke="#81c784" stroke-width="1" rx="6"/>
  <text x="285" y="644" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">选存算一体，如果…</text>
  <text x="62" y="670" font-size="12" fill="#455a64">• 数据量在 TB 级，查询模式相对固定</text>
  <text x="62" y="690" font-size="12" fill="#455a64">• 追求极致性能，本地盘缓存能兜住热数据</text>
  <text x="62" y="710" font-size="12" fill="#455a64">• 集群规模稳定，不需要频繁扩缩容</text>

  <rect x="550" y="618" width="490" height="118" fill="#fff3e0" stroke="#ffb74d" stroke-width="1" rx="6"/>
  <text x="795" y="644" text-anchor="middle" font-size="16" font-weight="bold" fill="#ef6c00">选存算分离，如果…</text>
  <text x="572" y="670" font-size="12" fill="#455a64">• 负载波动大（大促加节点，过后释放）</text>
  <text x="572" y="690" font-size="12" fill="#455a64">• 要多租户物理隔离（导入/查询/adhoc 分开）</text>
  <text x="572" y="710" font-size="12" fill="#455a64">• 存储成本敏感（对象存储比 SSD 便宜一个数量级）</text>

  <text x="540" y="752" text-anchor="middle" font-size="12" fill="#607d8b">🔴 存算分离部分为本机无法实测的原理推演 —— SHOW COMPUTE GROUPS / SHOW STORAGE VAULT 均报 only support in cloud mode</text>
</svg>
