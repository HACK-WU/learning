<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#546e7a"/>
    </marker>
    <style>
      .t { font-size:20px; font-weight:bold; fill:#1a237e; }
      .s { font-size:14px; fill:#37474f; }
      .sm { font-size:12px; fill:#546e7a; }
      .box { fill:#ffffff; stroke:#90a4ae; stroke-width:1.5; rx:6; }
      .hl { fill:#fff8e1; stroke:#ffa000; stroke-width:2; }
      .good { fill:#e8f5e9; stroke:#43a047; stroke-width:2; }
      .bad { fill:#ffebee; stroke:#e53935; stroke-width:2; }
      .be { fill:#e3f2fd; stroke:#1e88e5; stroke-width:1.5; }
      .fe { fill:#f3e5f5; stroke:#8e24aa; stroke-width:1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="1180" fill="#fafafa"/>
  <text x="500" y="38" text-anchor="middle" class="t" font-size="24">课 9 全图总结：副本、FE 高可用、扩缩容</text>
  <text x="500" y="62" text-anchor="middle" class="sm">Doris 4.1.3 双 BE 实测 · 绿色=已实测验证　黄色=命令可用但未实测　红色=单机限制无法验证</text>

  <!-- ============ 1. FE 三种角色 ============ -->
  <text x="30" y="100" class="t">1. FE 三种角色：谁能写、谁能选、谁只旁观</text>
  <rect x="30" y="112" width="940" height="205" class="box"/>

  <rect x="55" y="132" width="270" height="90" class="good"/>
  <text x="190" y="156" text-anchor="middle" class="s" font-weight="bold" font-size="16">Master（主）</text>
  <text x="190" y="180" text-anchor="middle" class="sm">唯一可写元数据的节点</text>
  <text x="190" y="200" text-anchor="middle" class="sm">所有 DDL / 导入事务都经过它</text>
  <text x="190" y="216" text-anchor="middle" class="sm">实测：IsMaster = true</text>

  <rect x="345" y="132" width="270" height="90" class="fe"/>
  <text x="480" y="156" text-anchor="middle" class="s" font-weight="bold" font-size="16">Follower（从）</text>
  <text x="480" y="180" text-anchor="middle" class="sm">参与选举、可被选为新 Master</text>
  <text x="480" y="200" text-anchor="middle" class="sm">元数据与 Master 强一致</text>
  <text x="480" y="216" text-anchor="middle" class="sm">生产建议奇数个（1/3/5）</text>

  <rect x="635" y="132" width="305" height="90" class="hl"/>
  <text x="787" y="156" text-anchor="middle" class="s" font-weight="bold" font-size="16">Observer（观察者）</text>
  <text x="787" y="180" text-anchor="middle" class="sm">只同步元数据、分担读压力</text>
  <text x="787" y="200" text-anchor="middle" class="sm">不参与选举，不投票</text>
  <text x="787" y="216" text-anchor="middle" class="sm">用于扩展查询能力，不影响高可用</text>

  <rect x="55" y="240" width="885" height="60" class="box"/>
  <text x="72" y="264" class="s" font-weight="bold">选举规则：</text>
  <text x="72" y="288" class="sm">类 Raft 协议 —— 超过半数 Follower 同意才能选出新 Master。所以 3 个 FE 能容忍 1 个故障，5 个能容忍 2 个。</text>
  <text x="72" y="306" class="sm" fill="#c62828">⚠ 2 个 FE 无法容忍任何 1 个故障（2 的半数是 1，剩 1 个达不到"超过半数"）—— 这就是为什么必须是奇数个</text>

  <!-- ============ 2. 扩缩容命令对照 ============ -->
  <text x="30" y="355" class="t">2. 扩缩容：三条命令的语义天差地别</text>
  <rect x="30" y="367" width="940" height="285" class="box"/>

  <rect x="55" y="387" width="285" height="115" class="good"/>
  <text x="197" y="411" text-anchor="middle" class="s" font-weight="bold" font-size="15">ADD BACKEND（扩容）</text>
  <text x="197" y="435" text-anchor="middle" class="sm" font-family="monospace" font-size="11">ALTER SYSTEM ADD BACKEND</text>
  <text x="197" y="453" text-anchor="middle" class="sm" font-family="monospace" font-size="11">'host:heartbeat_port';</text>
  <text x="197" y="475" text-anchor="middle" class="sm">✅ 实测：秒级加入，立即 Alive</text>
  <text x="197" y="493" text-anchor="middle" class="sm">重复执行报 Same backend already exists</text>

  <rect x="355" y="387" width="285" height="115" class="hl"/>
  <text x="497" y="411" text-anchor="middle" class="s" font-weight="bold" font-size="15">DECOMMISSION（安全缩容）</text>
  <text x="497" y="435" text-anchor="middle" class="sm" font-family="monospace" font-size="11">ALTER SYSTEM DECOMMISSION</text>
  <text x="497" y="453" text-anchor="middle" class="sm" font-family="monospace" font-size="11">BACKEND 'host:port';</text>
  <text x="497" y="475" text-anchor="middle" class="sm">✅ 实测：先迁数据再摘除，可 CANCEL</text>
  <text x="497" y="493" text-anchor="middle" class="sm">tablet 15→13，数据真的搬走了</text>

  <rect x="655" y="387" width="285" height="115" class="bad"/>
  <text x="797" y="411" text-anchor="middle" class="s" font-weight="bold" font-size="15">DROP BACKEND（危险！）</text>
  <text x="797" y="435" text-anchor="middle" class="sm" font-family="monospace" font-size="11">直接丢弃该节点全部数据</text>
  <text x="797" y="453" text-anchor="middle" class="sm" font-family="monospace" font-size="11">不等迁移，数据永久丢失</text>
  <text x="797" y="475" text-anchor="middle" class="sm" fill="#c62828">✗ 实测被 Doris 明确拒绝并提示：</text>
  <text x="797" y="493" text-anchor="middle" class="sm" font-family="monospace" font-size="11">It is highly NOT RECOMMENDED...</text>

  <rect x="55" y="518" width="885" height="118" class="box"/>
  <text x="72" y="542" class="s" font-weight="bold">Doris 的防呆设计（实测报错原文）：</text>
  <text x="72" y="566" class="sm" font-family="monospace" font-size="11">It is highly NOT RECOMMENDED to use DROP BACKEND stmt. It is not safe to directly drop a backend.</text>
  <text x="72" y="586" class="sm" font-family="monospace" font-size="11">All data on this backend will be discarded permanently. If you insist, use DROPP instead of DROP</text>
  <text x="72" y="610" class="sm" font-weight="bold">→ 想强制删除必须故意拼错成 DROPP（两个 P）。这是"让你手抖也删不掉"的设计，值得每个运维记住。</text>

  <!-- ============ 3. 均衡与限速 ============ -->
  <text x="30" y="692" class="t">3. 数据均衡：不是瞬间完成，而是慢慢"渗"</text>
  <rect x="30" y="704" width="940" height="230" class="box"/>

  <rect x="55" y="724" width="440" height="95" class="be"/>
  <text x="275" y="748" text-anchor="middle" class="s" font-weight="bold">均衡开关（实测默认关闭！）</text>
  <text x="275" y="772" text-anchor="middle" class="sm" font-family="monospace" font-size="11">disable_balance = true　→　改为 false 才均衡</text>
  <text x="275" y="792" text-anchor="middle" class="sm" font-family="monospace" font-size="11">ADMIN SET FRONTEND CONFIG ('disable_balance'='false');</text>
  <text x="275" y="812" text-anchor="middle" class="sm">打开后 90 秒：tablet 3850→3848 / 8→10</text>

  <rect x="515" y="724" width="425" height="95" class="box"/>
  <text x="727" y="748" text-anchor="middle" class="s" font-weight="bold">限速参数（防拖垮在线业务）</text>
  <text x="727" y="772" text-anchor="middle" class="sm" font-family="monospace" font-size="11">balance_slot_num_per_path = 1（每盘并发搬运数）</text>
  <text x="727" y="792" text-anchor="middle" class="sm" font-family="monospace" font-size="11">partition_rebalance_max_moves_num_per_selection = 10</text>
  <text x="727" y="812" text-anchor="middle" class="sm" font-family="monospace" font-size="11">tablet_repair_delay_factor_second = 60（抢修延迟）</text>

  <rect x="55" y="835" width="885" height="82" class="good"/>
  <text x="72" y="859" class="s" font-weight="bold">实测：扩缩容期间在线查询几乎无感</text>
  <text x="72" y="883" class="sm">DECOMMISSION 进行中连续查 orders 5 次：140 / 128 / 151 / 145 / 159 ms —— 与平时同一量级，没有出现秒级抖动</text>
  <text x="72" y="905" class="sm">原因：均衡是按 slot（并发额度）慢慢搬的，不是一次性全量重分布。这就是限速参数存在的意义。</text>

  <!-- ============ 4. 成本与检查清单 ============ -->
  <text x="30" y="978" class="t">4. 副本的代价 + 生产检查清单</text>
  <rect x="30" y="990" width="940" height="150" class="box"/>

  <rect x="55" y="1010" width="440" height="115" class="hl"/>
  <text x="275" y="1034" text-anchor="middle" class="s" font-weight="bold">存储成本 = 单副本 × 副本数</text>
  <text x="275" y="1058" text-anchor="middle" class="sm">实测：cost1 表 100 万行 1 副本 = 2.553 MB</text>
  <text x="275" y="1078" text-anchor="middle" class="sm">2 副本 ≈ 5.1 MB　3 副本 ≈ 7.7 MB</text>
  <text x="275" y="1102" text-anchor="middle" class="sm" font-weight="bold">副本是"用存储换可用性"的买卖</text>

  <rect x="515" y="1010" width="425" height="115" class="good"/>
  <text x="727" y="1034" text-anchor="middle" class="s" font-weight="bold">每天该看的两个视图</text>
  <text x="727" y="1058" text-anchor="middle" class="sm" font-family="monospace" font-size="11">SHOW PROC '/cluster_health/tablet_health';</text>
  <text x="727" y="1078" text-anchor="middle" class="sm" font-family="monospace" font-size="11">SHOW PROC '/cluster_balance';</text>
  <text x="727" y="1102" text-anchor="middle" class="sm">实测：shop 库 611 tablet / 611 healthy（全绿）</text>

  <text x="500" y="1165" text-anchor="middle" class="sm">教材实测环境：Doris 4.1.3 · 1 FE + 2 BE（同主机伪多节点）· 2026-09-03 · 单机限制处已在正文明确标注</text>
</svg>
