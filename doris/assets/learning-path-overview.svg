<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1000" height="470" fill="#fafafa"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a237e">Apache Doris 学习路径</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#555">四个阶段 · 12 课 · 36 知识点 ｜ 故事主线：一张 3 亿行的订单表</text>

  <!-- 阶段 1 -->
  <rect x="40" y="90" width="200" height="150" rx="10" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <rect x="40" y="90" width="200" height="34" rx="10" fill="#1565C0"/>
  <rect x="40" y="114" width="200" height="10" fill="#1565C0"/>
  <text x="140" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">阶段 1 · 为什么需要 Doris</text>
  <text x="140" y="147" text-anchor="middle" font-size="12" fill="#0d47a1">章节：报表跑 3 分钟</text>
  <text x="60" y="172" font-size="12" fill="#333">课 1　数据分析的困境与诞生</text>
  <text x="60" y="192" font-size="12" fill="#333">课 2　跑起来第一个 Doris</text>
  <text x="60" y="222" font-size="11.5" fill="#555">· OLTP 与 OLAP 的鸿沟</text>
  <text x="60" y="238" font-size="11.5" fill="#555">· FE / BE 架构</text>

  <!-- 阶段 2 -->
  <rect x="290" y="90" width="200" height="150" rx="10" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
  <rect x="290" y="90" width="200" height="34" rx="10" fill="#2E7D32"/>
  <rect x="290" y="114" width="200" height="10" fill="#2E7D32"/>
  <text x="390" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">阶段 2 · 数据建模</text>
  <text x="390" y="147" text-anchor="middle" font-size="12" fill="#1b5e20">章节：把表重新设计一遍</text>
  <text x="310" y="172" font-size="12" fill="#333">课 3　三种数据模型</text>
  <text x="310" y="192" font-size="12" fill="#333">课 4　分区与分桶</text>
  <text x="310" y="212" font-size="12" fill="#333">课 5　键列、索引与 Rollup</text>
  <text x="310" y="232" font-size="11.5" fill="#555">· 建表即性能优化</text>

  <!-- 阶段 3 -->
  <rect x="540" y="90" width="200" height="150" rx="10" fill="#fff8e1" stroke="#F9A825" stroke-width="2"/>
  <rect x="540" y="90" width="200" height="34" rx="10" fill="#F9A825"/>
  <rect x="540" y="114" width="200" height="10" fill="#F9A825"/>
  <text x="640" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">阶段 3 · 导入与查询</text>
  <text x="640" y="147" text-anchor="middle" font-size="12" fill="#8d6e00">章节：数据进来、结果出去</text>
  <text x="560" y="172" font-size="12" fill="#333">课 6　数据导入全家桶</text>
  <text x="560" y="192" font-size="12" fill="#333">课 7　查询引擎与执行计划</text>
  <text x="560" y="212" font-size="12" fill="#333">课 8　多表关联与高级 SQL</text>
  <text x="560" y="232" font-size="11.5" fill="#555">· Profile 定位瓶颈</text>

  <!-- 阶段 4 -->
  <rect x="790" y="90" width="170" height="150" rx="10" fill="#fce4ec" stroke="#C2185B" stroke-width="2"/>
  <rect x="790" y="90" width="170" height="34" rx="10" fill="#C2185B"/>
  <rect x="790" y="114" width="170" height="10" fill="#C2185B"/>
  <text x="875" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">阶段 4 · 运维与落地</text>
  <text x="875" y="147" text-anchor="middle" font-size="12" fill="#880e4f">章节：撑住生产</text>
  <text x="806" y="172" font-size="12" fill="#333">课 9　副本与扩缩容</text>
  <text x="806" y="192" font-size="12" fill="#333">课 10 资源隔离</text>
  <text x="806" y="212" font-size="12" fill="#333">课 11 日常运维</text>
  <text x="806" y="232" font-size="12" fill="#333">课 12 选型与存算分离</text>

  <!-- 箭头 -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
  <line x1="242" y1="165" x2="286" y2="165" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="492" y1="165" x2="536" y2="165" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="742" y1="165" x2="786" y2="165" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 依赖说明 -->
  <text x="140" y="272" text-anchor="middle" font-size="11.5" fill="#555">先懂"为什么"</text>
  <text x="390" y="272" text-anchor="middle" font-size="11.5" fill="#555">再学"怎么存"</text>
  <text x="640" y="272" text-anchor="middle" font-size="11.5" fill="#555">然后"怎么读写"</text>
  <text x="875" y="272" text-anchor="middle" font-size="11.5" fill="#555">最后"怎么撑住"</text>

  <!-- 底部：一条 SQL 的旅程 -->
  <rect x="40" y="305" width="920" height="140" rx="10" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="60" y="332" font-size="14" font-weight="700" fill="#1a237e">贯穿全程的那条主线：一条 SQL 的旅程</text>
  <text x="60" y="354" font-size="12" fill="#444">课 1-2 看见慢　→　课 3-5 让它扫得少　→　课 6-8 让它并行算得快　→　课 9-12 让它不被别人拖慢</text>

  <rect x="70" y="375" width="150" height="42" rx="6" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="145" y="393" text-anchor="middle" font-size="11.5" fill="#0d47a1">MySQL 3 分钟</text>
  <text x="145" y="409" text-anchor="middle" font-size="11.5" fill="#0d47a1">全表扫 + 行存</text>

  <line x1="222" y1="396" x2="268" y2="396" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="270" y="375" width="150" height="42" rx="6" fill="#e8f5e9" stroke="#2E7D32"/>
  <text x="345" y="393" text-anchor="middle" font-size="11.5" fill="#1b5e20">列存 + 分区裁剪</text>
  <text x="345" y="409" text-anchor="middle" font-size="11.5" fill="#1b5e20">扫 1% 的数据</text>

  <line x1="422" y1="396" x2="468" y2="396" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="470" y="375" width="150" height="42" rx="6" fill="#fff8e1" stroke="#F9A825"/>
  <text x="545" y="393" text-anchor="middle" font-size="11.5" fill="#8d6e00">MPP 并行 + 向量化</text>
  <text x="545" y="409" text-anchor="middle" font-size="11.5" fill="#8d6e00">CPU 跑满</text>

  <line x1="622" y1="396" x2="668" y2="396" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="670" y="375" width="150" height="42" rx="6" fill="#fce4ec" stroke="#C2185B"/>
  <text x="745" y="393" text-anchor="middle" font-size="11.5" fill="#880e4f">资源隔离 + 多副本</text>
  <text x="745" y="409" text-anchor="middle" font-size="11.5" fill="#880e4f">稳定亚秒级</text>

  <line x1="822" y1="396" x2="868" y2="396" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="870" y="375" width="70" height="42" rx="6" fill="#ede7f6" stroke="#5E35B1"/>
  <text x="905" y="393" text-anchor="middle" font-size="11.5" fill="#4527a0">亚秒</text>
  <text x="905" y="409" text-anchor="middle" font-size="11.5" fill="#4527a0">返回</text>
</svg>
