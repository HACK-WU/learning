<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="370" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1F2937">综合实现：三道防线 + 一致性兜底</text>

  <rect x="20" y="50" width="160" height="60" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="34" y="74" font-size="13" font-weight="bold" fill="#1E40AF">应用</text>
  <text x="34" y="96" font-size="12" fill="#1E3A8A">先查缓存</text>

  <path d="M184 80 L238 80" stroke="#6B7280" stroke-width="2"/>
  <path d="M232 74 L240 80 L232 86" fill="#6B7280"/>

  <rect x="242" y="42" width="180" height="52" rx="8" fill="#DCFCE7" stroke="#4ADE80" stroke-width="2.5"/>
  <text x="256" y="64" font-size="13" font-weight="bold" fill="#166534">防线一：布隆过滤器</text>
  <text x="256" y="84" font-size="12" fill="#14532D">新增：不存在的一律挡回</text>

  <path d="M426 80 L480 80" stroke="#6B7280" stroke-width="2"/>
  <path d="M474 74 L482 80 L474 86" fill="#6B7280"/>

  <rect x="484" y="42" width="180" height="52" rx="8" fill="#DCFCE7" stroke="#4ADE80" stroke-width="2.5"/>
  <text x="498" y="64" font-size="13" font-weight="bold" fill="#166534">防线二：互斥锁重建</text>
  <text x="498" y="84" font-size="12" fill="#14532D">新增：只放一个去回源</text>

  <rect x="242" y="108" width="422" height="48" rx="8" fill="#DCFCE7" stroke="#4ADE80" stroke-width="2.5"/>
  <text x="256" y="130" font-size="13" font-weight="bold" fill="#166534">防线三：过期时间打散</text>
  <text x="256" y="150" font-size="12" fill="#14532D">新增：基础 TTL + 随机抖动，避免集体失效</text>

  <path d="M668 80 L702 80" stroke="#6B7280" stroke-width="2"/>
  <path d="M696 74 L704 80 L696 86" fill="#6B7280"/>

  <rect x="706" y="42" width="34" height="114" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="716" y="90" font-size="12" font-weight="bold" fill="#5B21B6">库</text>

  <rect x="20" y="176" width="720" height="76" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="36" y="202" font-size="13" font-weight="bold" fill="#92400E">一致性兜底：改数据时先改库，再删缓存</text>
  <text x="36" y="224" font-size="12.5" fill="#78350F">不更新缓存、只删除它 —— 避免并发写导致的旧值覆盖</text>
  <text x="36" y="244" font-size="12.5" fill="#78350F">TTL 是最后一道保险：即便删除失败，过期后也会自愈</text>

  <rect x="20" y="268" width="720" height="52" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="36" y="292" font-size="12.5" font-weight="bold" fill="#991B1B">坦白说：一致性没有银弹</text>
  <text x="36" y="312" font-size="12.5" fill="#7F1D1D">上面这套仍有极短的不一致窗口；要做到更强，得引入延迟双删或订阅数据库变更 —— 代价是复杂度</text>

  <rect x="20" y="330" width="720" height="26" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="36" y="348" font-size="12.5" fill="#065F46">本步解决了什么：三种失效各有防线，一致性有兜底 —— 代价是引入了过滤器与锁的维护成本</text>
</svg>
