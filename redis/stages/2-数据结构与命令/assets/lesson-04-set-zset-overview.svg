<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="720" height="300" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1F2937">去重、排名、附近的人，都要自己算吗？</text>

  <text x="20" y="62" font-size="13" font-weight="bold" fill="#B45309">不这么做</text>
  <rect x="20" y="72" width="290" height="176" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="38" y="100" font-size="13" fill="#7C2D12">取回全部数据自己遍历去重</text>
  <text x="38" y="122" font-size="13" fill="#7C2D12">排序、算距离都在应用里做</text>
  <rect x="38" y="138" width="254" height="34" rx="5" fill="#FFEDD5" stroke="#FDBA74"/>
  <text x="52" y="160" font-size="12.5" fill="#9A3412">一亿条要吃约 3 GB 内存</text>
  <text x="38" y="196" font-size="13" fill="#7C2D12">存 30 天做趋势根本不现实</text>
  <text x="38" y="222" font-size="13" fill="#7C2D12">数据一多，交并差直接卡死</text>

  <path d="M322 160 L398 160" stroke="#6B7280" stroke-width="2"/>
  <path d="M392 154 L400 160 L392 166" fill="#6B7280"/>

  <text x="410" y="62" font-size="13" font-weight="bold" fill="#047857">这么做</text>
  <rect x="410" y="72" width="290" height="176" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="428" y="100" font-size="13" fill="#064E3B">对口的结构直接给出答案</text>
  <text x="428" y="122" font-size="13" fill="#064E3B">去重、排名、就近都现成</text>
  <rect x="428" y="138" width="254" height="34" rx="5" fill="#D1FAE5" stroke="#6EE7B7"/>
  <text x="442" y="160" font-size="12.5" fill="#065F46">近似统计只要 12 KB</text>
  <text x="428" y="196" font-size="13" fill="#064E3B">用一点点误差换大量内存</text>
  <text x="428" y="222" font-size="13" fill="#064E3B">但每种结构都有脾气，不能通吃</text>

  <text x="20" y="278" font-size="12" fill="#6B7280">代价：近似统计有 0.5%~0.8% 误差；用错结构时，同样的操作可能慢几千倍</text>
</svg>
