<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="720" height="300" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1F2937">消息取走就没了，处理失败怎么办？</text>

  <text x="20" y="62" font-size="13" font-weight="bold" fill="#B45309">不这么做</text>
  <rect x="20" y="72" width="290" height="176" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="38" y="100" font-size="13" fill="#7C2D12">消息取出来就从队列消失</text>
  <text x="38" y="122" font-size="13" fill="#7C2D12">处理失败也没人重试</text>
  <rect x="38" y="138" width="254" height="34" rx="5" fill="#FFEDD5" stroke="#FDBA74"/>
  <text x="52" y="160" font-size="12.5" fill="#9A3412">崩一次就丢一批，找不回</text>
  <text x="38" y="196" font-size="13" fill="#7C2D12">想让多人分摊，又怕重复处理</text>
  <text x="38" y="222" font-size="13" fill="#7C2D12">广播个通知也要付存储成本</text>

  <path d="M322 160 L398 160" stroke="#6B7280" stroke-width="2"/>
  <path d="M392 154 L400 160 L392 166" fill="#6B7280"/>

  <text x="410" y="62" font-size="13" font-weight="bold" fill="#047857">这么做</text>
  <rect x="410" y="72" width="290" height="176" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="428" y="100" font-size="13" fill="#064E3B">消息留在流里，读完不删</text>
  <text x="428" y="122" font-size="13" fill="#064E3B">标记"给了谁、他确认了吗"</text>
  <rect x="428" y="138" width="254" height="34" rx="5" fill="#D1FAE5" stroke="#6EE7B7"/>
  <text x="442" y="160" font-size="12.5" fill="#065F46">没确认的可以转给别人</text>
  <text x="428" y="196" font-size="13" fill="#064E3B">多人分摊，各拿各的不重复</text>
  <text x="428" y="222" font-size="13" fill="#064E3B">丢了也无所谓的通知，走更轻的路</text>

  <text x="20" y="278" font-size="12" fill="#6B7280">代价：留痕要内存（同样一万条约是普通队列的 3.46 倍）；更轻的那条路不存储、掉线即丢</text>
</svg>
