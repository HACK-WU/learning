<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L0,10 L9,5 z" fill="#90A4AE"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1B5E20">阶段 2 · 数据结构与命令 — 学习路径</text>
  <text x="440" y="57" text-anchor="middle" font-size="12.5" fill="#546E7A">故事章节「不只是 get/set」：排行榜、队列、共同关注、UV 都能用原生结构做</text>

  <rect x="60" y="86" width="340" height="62" rx="7" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="80" y="110" font-size="14.5" font-weight="700" fill="#1B5E20">课 3　List 与 Hash</text>
  <text x="80" y="133" font-size="12" fill="#546E7A">机制层：双向操作 / 阻塞弹出 / 存对象取舍</text>

  <rect x="480" y="86" width="340" height="62" rx="7" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="500" y="110" font-size="14.5" font-weight="700" fill="#1B5E20">课 4　Set、ZSet 与特殊类型</text>
  <text x="500" y="133" font-size="12" fill="#546E7A">机制层：去重集合 / 排序 / 概率与位运算</text>

  <line x1="400" y1="117" x2="470" y2="117" stroke="#90A4AE" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="60" y="176" width="760" height="112" rx="7" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1"/>
  <text x="82" y="201" font-size="13.5" font-weight="700" fill="#37474F">课 3 的 3 个知识点</text>
  <circle cx="94" cy="228" r="4" fill="#2E7D32"/><text x="108" y="232" font-size="12.5" fill="#37474F">List 双向操作与阻塞弹出：LPUSH/RPOP 与 BRPOP 的等待语义</text>
  <circle cx="94" cy="252" r="4" fill="#2E7D32"/><text x="108" y="256" font-size="12.5" fill="#37474F">List 当消息队列的三个硬伤：无确认、无多消费者组、不重复消费</text>
  <circle cx="94" cy="276" r="4" fill="#2E7D32"/><text x="108" y="280" font-size="12.5" fill="#37474F">Hash 存对象 vs String 存 JSON：内存、部分读写、灵活性的三角取舍</text>

  <rect x="60" y="304" width="760" height="112" rx="7" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1"/>
  <text x="82" y="329" font-size="13.5" font-weight="700" fill="#37474F">课 4 的 3 个知识点</text>
  <circle cx="94" cy="356" r="4" fill="#2E7D32"/><text x="108" y="360" font-size="12.5" fill="#37474F">Set 交并差与去重：共同关注、点赞去重、抽奖</text>
  <circle cx="94" cy="380" r="4" fill="#2E7D32"/><text x="108" y="384" font-size="12.5" fill="#37474F">ZSet 跳表 + 哈希表双结构：为什么既能按成员查又能按分数排</text>
  <circle cx="94" cy="404" r="4" fill="#2E7D32"/><text x="108" y="408" font-size="12.5" fill="#37474F">Bitmap / HyperLogLog / Geo：签到、UV 误差边界、附近的人</text>

  <rect x="60" y="434" width="760" height="26" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.8"/>
  <text x="80" y="452" font-size="12" fill="#1B5E20">学完本阶段你应该能：为新需求选对结构（而不是一律 String 硬塞），并说清 ZSet 为什么查询快</text>
</svg>
