<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="720" height="300" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1F2937">线上出事了，你知道自己该看什么吗？</text>

  <text x="20" y="62" font-size="13" font-weight="bold" fill="#B45309">不这么做</text>
  <rect x="20" y="72" width="290" height="176" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="38" y="100" font-size="13" fill="#7C2D12">只盯监控上那一个慢日志数字</text>
  <text x="38" y="122" font-size="13" fill="#7C2D12">它和实际感受差了几十倍</text>
  <rect x="38" y="138" width="254" height="34" rx="5" fill="#FFEDD5" stroke="#FDBA74"/>
  <text x="52" y="160" font-size="12.5" fill="#9A3412">排查方向从一开始就错了</text>
  <text x="38" y="196" font-size="13" fill="#7C2D12">默认配置无密码，谁都能操作</text>
  <text x="38" y="222" font-size="13" fill="#7C2D12">选型靠吵架，比谁说得响</text>

  <path d="M322 160 L398 160" stroke="#6B7280" stroke-width="2"/>
  <path d="M392 154 L400 160 L392 166" fill="#6B7280"/>

  <text x="410" y="62" font-size="13" font-weight="bold" fill="#047857">这么做</text>
  <rect x="410" y="72" width="290" height="176" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="428" y="100" font-size="13" fill="#064E3B">从整体到细节，一层层往下看</text>
  <text x="428" y="122" font-size="13" fill="#064E3B">先找谁占资源，再定位到具体数据</text>
  <rect x="428" y="138" width="254" height="34" rx="5" fill="#D1FAE5" stroke="#6EE7B7"/>
  <text x="442" y="160" font-size="12.5" fill="#065F46">每一步都有对应的检查手段</text>
  <text x="428" y="196" font-size="13" fill="#064E3B">账号只给够用的最小权限</text>
  <text x="428" y="222" font-size="13" fill="#064E3B">选型按访问模式判断，不靠直觉</text>

  <text x="20" y="278" font-size="12" fill="#6B7280">代价：这些能力也会告诉你"这个场景不该用它" —— 有些需求直接查库反而更简单</text>
</svg>
