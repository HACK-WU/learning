<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="720" height="300" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1F2937">读的明明是同一批数据，为什么还是这么慢？</text>

  <text x="20" y="62" font-size="13" font-weight="bold" fill="#B45309">不这么做</text>
  <rect x="20" y="72" width="290" height="176" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="38" y="100" font-size="13" fill="#7C2D12">应用每次要数据</text>
  <text x="38" y="122" font-size="13" fill="#7C2D12">都去数据库翻一遍磁盘</text>
  <rect x="38" y="138" width="254" height="34" rx="5" fill="#FFEDD5" stroke="#FDBA74"/>
  <text x="52" y="160" font-size="12.5" fill="#9A3412">磁盘跑满，CPU 却很空闲</text>
  <text x="38" y="196" font-size="13" fill="#7C2D12">用户等 3 秒才看到页面</text>
  <text x="38" y="222" font-size="13" fill="#7C2D12">加机器也只是缓解寻址开销</text>

  <path d="M322 160 L398 160" stroke="#6B7280" stroke-width="2"/>
  <path d="M392 154 L400 160 L392 166" fill="#6B7280"/>

  <text x="410" y="62" font-size="13" font-weight="bold" fill="#047857">这么做</text>
  <rect x="410" y="72" width="290" height="176" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="428" y="100" font-size="13" fill="#064E3B">热点数据常驻内存</text>
  <text x="428" y="122" font-size="13" fill="#064E3B">重复读取不必再碰磁盘</text>
  <rect x="428" y="138" width="254" height="34" rx="5" fill="#D1FAE5" stroke="#6EE7B7"/>
  <text x="442" y="160" font-size="12.5" fill="#065F46">取到就用，快得多</text>
  <text x="428" y="196" font-size="13" fill="#064E3B">还提供现成的列表/集合等结构</text>
  <text x="428" y="222" font-size="13" fill="#064E3B">要拼要排的事，服务端一次做完</text>

  <text x="20" y="278" font-size="12" fill="#6B7280">代价：内存比磁盘贵，且断电会丢 —— 这正是后面持久化要解决的问题</text>
</svg>
