<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="#fff"/>
  <text x="40" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#333">实时排行榜：全局排序与分区扩展的取舍</text>
  <text x="40" y="78" font-family="sans-serif" font-size="15" fill="#555">先测单 ZSet；分区后必须重新定义全局 TopN 与个人 rank</text>
  <defs>
    <marker id="rank-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
  </defs>
  <rect x="45" y="125" width="260" height="300" rx="12" fill="#90CAF9" stroke="#1565C0"/>
  <text x="175" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#333">A 单 ZSet</text>
  <rect x="85" y="210" width="180" height="60" rx="8" fill="#1565C0"/>
  <text x="175" y="247" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">100 万成员</text>
  <line x1="175" y1="270" x2="175" y2="320" stroke="#1565C0" stroke-width="3" marker-end="url(#rank-arrow)"/>
  <rect x="85" y="325" width="180" height="55" rx="8" fill="#A5D6A7"/>
  <text x="175" y="359" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">TopN + rank</text>
  <line x1="305" y1="275" x2="365" y2="275" stroke="#1565C0" stroke-width="3" marker-end="url(#rank-arrow)"/>
  <rect x="365" y="125" width="260" height="300" rx="12" fill="#fafafa" stroke="#bbb"/>
  <text x="495" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#333">B 分区 ZSet</text>
  <rect x="395" y="205" width="100" height="50" rx="8" fill="#90CAF9"/>
  <text x="445" y="236" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">赛区 A</text>
  <rect x="510" y="205" width="100" height="50" rx="8" fill="#90CAF9"/>
  <text x="560" y="236" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">赛区 B</text>
  <line x1="445" y1="255" x2="495" y2="310" stroke="#1565C0" stroke-width="2" marker-end="url(#rank-arrow)"/>
  <line x1="560" y1="255" x2="495" y2="310" stroke="#1565C0" stroke-width="2" marker-end="url(#rank-arrow)"/>
  <rect x="405" y="315" width="180" height="55" rx="8" fill="#FFECB3" stroke="#F9A825"/>
  <text x="495" y="348" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">归并候选 → TopN</text>
  <line x1="625" y1="275" x2="685" y2="275" stroke="#1565C0" stroke-width="3" marker-end="url(#rank-arrow)"/>
  <rect x="685" y="125" width="270" height="300" rx="12" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="820" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#333">C TopN 物化</text>
  <rect x="735" y="210" width="170" height="55" rx="8" fill="#1565C0"/>
  <text x="820" y="244" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fff">实时候选窗口</text>
  <line x1="820" y1="265" x2="820" y2="315" stroke="#1565C0" stroke-width="3" marker-end="url(#rank-arrow)"/>
  <rect x="735" y="320" width="170" height="55" rx="8" fill="#E0E0E0"/>
  <text x="820" y="354" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">完整榜异步落库</text>
  <text x="45" y="475" font-family="sans-serif" font-size="16" fill="#555">关键问题：实时的是 TopN、个人 rank，还是全部历史查询？三者可以分开设计。</text>
</svg>
