<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="#fff"/>
  <text x="40" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#333">订单事件：写入、处理、确认与接管</text>
  <text x="40" y="78" font-family="sans-serif" font-size="15" fill="#555">Stream 的 pending 让“读过但未确认”可见，但业务仍需幂等</text>
  <defs>
    <marker id="msg-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker>
    <marker id="msg-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker>
  </defs>
  <rect x="45" y="160" width="150" height="70" rx="10" fill="#E0E0E0"/>
  <text x="120" y="203" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">订单服务</text>
  <line x1="195" y1="195" x2="255" y2="195" stroke="#1565C0" stroke-width="3" marker-end="url(#msg-arrow)"/>
  <rect x="255" y="140" width="210" height="115" rx="10" fill="#90CAF9" stroke="#1565C0"/>
  <text x="360" y="177" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">Redis Stream</text>
  <text x="360" y="207" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">XADD + 保留策略</text>
  <text x="360" y="232" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">事件 ID</text>
  <line x1="465" y1="195" x2="530" y2="195" stroke="#1565C0" stroke-width="3" marker-end="url(#msg-arrow)"/>
  <rect x="530" y="140" width="210" height="115" rx="10" fill="#A5D6A7" stroke="#2E7D32"/>
  <text x="635" y="177" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">消费者组</text>
  <text x="635" y="207" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">XREADGROUP</text>
  <text x="635" y="232" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">每条分给一个消费者</text>
  <line x1="635" y1="255" x2="635" y2="320" stroke="#1565C0" stroke-width="3" marker-end="url(#msg-arrow)"/>
  <rect x="530" y="330" width="210" height="90" rx="10" fill="#FFECB3" stroke="#F9A825"/>
  <text x="635" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#333">PEL / pending</text>
  <text x="635" y="394" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">未 ACK，可重试/接管</text>
  <line x1="530" y1="375" x2="430" y2="375" stroke="#C62828" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#msg-red)"/>
  <rect x="230" y="330" width="200" height="90" rx="10" fill="#FFCDD2" stroke="#C62828"/>
  <text x="330" y="365" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#333">XAUTOCLAIM</text>
  <text x="330" y="394" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">超时消息 → 新消费者</text>
  <line x1="740" y1="195" x2="810" y2="195" stroke="#2E7D32" stroke-width="3" marker-end="url(#msg-arrow)"/>
  <rect x="810" y="140" width="145" height="115" rx="10" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="882" y="177" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#333">业务事务</text>
  <text x="882" y="207" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">幂等写入</text>
  <text x="882" y="232" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333">成功后 XACK</text>
  <text x="45" y="500" font-family="sans-serif" font-size="16" fill="#555">失败语义：处理与 ACK 之间允许重复；不允许把“已读”误当成“业务已提交”。</text>
</svg>
