<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="220" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">阶段 2 · 结构型 —— 学习路径</text>

  <rect x="30" y="55" width="190" height="120" rx="10" fill="#eafaf0" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="125" cy="82" r="14" fill="#22c55e"/>
  <text x="125" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
  <text x="125" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">适配器 · 外观</text>
  <text x="125" y="132" text-anchor="middle" font-size="11" fill="#166534">统一不一致的接口</text>
  <text x="125" y="150" text-anchor="middle" font-size="11" fill="#166534">给外部系统包一层</text>

  <line x1="220" y1="115" x2="246" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="250" y="55" width="190" height="120" rx="10" fill="#eafaf0" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="345" cy="82" r="14" fill="#22c55e"/>
  <text x="345" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
  <text x="345" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">装饰器 · 组合</text>
  <text x="345" y="132" text-anchor="middle" font-size="11" fill="#166534">Python 装饰器辨析</text>
  <text x="345" y="150" text-anchor="middle" font-size="11" fill="#166534">树形结构统一处理</text>

  <line x1="440" y1="115" x2="466" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="470" y="55" width="190" height="120" rx="10" fill="#eafaf0" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="565" cy="82" r="14" fill="#22c55e"/>
  <text x="565" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7</text>
  <text x="565" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">代理 · 桥接</text>
  <text x="565" y="132" text-anchor="middle" font-size="11" fill="#166534">控制访问（懒加载/缓存）</text>
  <text x="565" y="150" text-anchor="middle" font-size="11" fill="#166534">分离抽象与实现</text>

  <text x="340" y="200" text-anchor="middle" font-size="12" fill="#666">统一接口（课5）→ 动态加职责/统一树（课6）→ 控制访问+解耦维度（课7）</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
