<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="220" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">阶段 1 · 地基与创建型 —— 学习路径</text>

  <!-- 课1 -->
  <rect x="30" y="55" width="140" height="120" rx="10" fill="#e8f1fb" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="100" cy="82" r="14" fill="#3b82f6"/>
  <text x="100" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="100" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">为什么需要设计模式</text>
  <text x="100" y="132" text-anchor="middle" font-size="11" fill="#33557f">SOLID · 坏味道</text>
  <text x="100" y="150" text-anchor="middle" font-size="11" fill="#33557f">面向变化点编程</text>

  <line x1="170" y1="115" x2="196" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>

  <!-- 课2 -->
  <rect x="200" y="55" width="140" height="120" rx="10" fill="#e8f1fb" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="270" cy="82" r="14" fill="#3b82f6"/>
  <text x="270" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="270" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">单例模式</text>
  <text x="270" y="132" text-anchor="middle" font-size="11" fill="#33557f">模块即单例</text>
  <text x="270" y="150" text-anchor="middle" font-size="11" fill="#33557f">__new__ 与元类</text>

  <line x1="340" y1="115" x2="366" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>

  <!-- 课3 -->
  <rect x="370" y="55" width="140" height="120" rx="10" fill="#e8f1fb" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="440" cy="82" r="14" fill="#3b82f6"/>
  <text x="440" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="440" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">工厂方法 · 抽象工厂</text>
  <text x="440" y="132" text-anchor="middle" font-size="11" fill="#33557f">简单工厂</text>
  <text x="440" y="150" text-anchor="middle" font-size="11" fill="#33557f">把 new 藏起来</text>

  <line x1="510" y1="115" x2="536" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>

  <!-- 课4 -->
  <rect x="540" y="55" width="140" height="120" rx="10" fill="#e8f1fb" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="610" cy="82" r="14" fill="#3b82f6"/>
  <text x="610" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="610" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">建造者 · 原型</text>
  <text x="610" y="132" text-anchor="middle" font-size="11" fill="#33557f">复杂对象组装</text>
  <text x="610" y="150" text-anchor="middle" font-size="11" fill="#33557f">copy.deepcopy</text>

  <text x="340" y="200" text-anchor="middle" font-size="12" fill="#666">地基（课1 SOLID）→ 单对象复用（课2）→ 家族对象创建（课3）→ 复杂对象组装（课4）</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
