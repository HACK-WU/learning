<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="720" height="310" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">浅拷贝 vs 深拷贝：嵌套对象的复制差异</text>

  <!-- 列1：原始对象 -->
  <text x="120" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">原始订单 order</text>
  <rect x="40" y="76" width="160" height="150" rx="8" fill="#e8f1fb" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="100" text-anchor="middle" font-size="11" fill="#1e3a5f">amount = 100</text>
  <text x="120" y="116" text-anchor="middle" font-size="11" fill="#1e3a5f">address = "北京"</text>
  <rect x="55" y="130" width="130" height="48" rx="6" fill="#e8f7ef" stroke="#10b981" stroke-width="1.5"/>
  <text x="120" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#0f5132">items 列表</text>
  <text x="120" y="167" text-anchor="middle" font-size="10" fill="#1e6b4f">["sku-1", "sku-2"]</text>

  <!-- 列2：浅拷贝 -->
  <text x="360" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">copy.copy（浅拷贝）</text>
  <rect x="280" y="76" width="160" height="150" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="360" y="100" text-anchor="middle" font-size="11" fill="#1e3a5f">amount = 100</text>
  <text x="360" y="116" text-anchor="middle" font-size="11" fill="#1e3a5f">address = "北京"</text>
  <text x="360" y="152" text-anchor="middle" font-size="11" fill="#b45309">items：仍指向原对象</text>

  <!-- 浅拷贝共享箭头：指向列1 的 items -->
  <path d="M 295 154 L 190 154" stroke="#e11d48" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)"/>

  <!-- 列3：深拷贝 -->
  <text x="600" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">copy.deepcopy（深拷贝）</text>
  <rect x="520" y="76" width="160" height="150" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="100" text-anchor="middle" font-size="11" fill="#1e3a5f">amount = 100</text>
  <text x="600" y="116" text-anchor="middle" font-size="11" fill="#1e3a5f">address = "北京"</text>
  <rect x="535" y="130" width="130" height="48" rx="6" fill="#e8f7ef" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#0f5132">items 列表（独立）</text>
  <text x="600" y="167" text-anchor="middle" font-size="10" fill="#1e6b4f">["sku-1", "sku-2"]</text>

  <!-- 底部说明 -->
  <text x="360" y="250" text-anchor="middle" font-size="12" fill="#b45309">浅拷贝：改副本的 items 会连累原对象（共享同一列表）</text>
  <text x="360" y="270" text-anchor="middle" font-size="12" fill="#1e6b4f">深拷贝：副本的 items 完全独立，互不影响</text>
  <text x="360" y="294" text-anchor="middle" font-size="12" fill="#666">嵌套结构要复制 → 用 deepcopy；只改顶层字段 → 用 dataclasses.replace 更直观</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/>
    </marker>
  </defs>
</svg>
