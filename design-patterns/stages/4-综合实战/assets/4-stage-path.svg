<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="240" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">阶段 4 · 综合实战 —— 重构订单处理系统</text>

  <!-- 四个步骤横向 -->
  <rect x="30" y="55" width="140" height="120" rx="10" fill="#f3eefe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="100" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">① 识别坏味道</text>
  <text x="100" y="116" text-anchor="middle" font-size="11" fill="#6d28d9">找出 if-else 面条</text>
  <text x="100" y="136" text-anchor="middle" font-size="11" fill="#6d28d9">上帝类 / 散弹修改</text>

  <line x1="170" y1="115" x2="196" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="200" y="55" width="140" height="120" rx="10" fill="#f3eefe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="270" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">② 识别变化点</text>
  <text x="270" y="116" text-anchor="middle" font-size="11" fill="#6d28d9">支付/通知/报表</text>
  <text x="270" y="136" text-anchor="middle" font-size="11" fill="#6d28d9">哪些维度会变</text>

  <line x1="340" y1="115" x2="366" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="370" y="55" width="140" height="120" rx="10" fill="#f3eefe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="440" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">③ 选模式重构</text>
  <text x="440" y="116" text-anchor="middle" font-size="11" fill="#6d28d9">工厂/策略/观察者</text>
  <text x="440" y="136" text-anchor="middle" font-size="11" fill="#6d28d9">责任链等组合</text>

  <line x1="510" y1="115" x2="536" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="540" y="55" width="140" height="120" rx="10" fill="#f3eefe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="610" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">④ 前后对比</text>
  <text x="610" y="116" text-anchor="middle" font-size="11" fill="#6d28d9">行数/可扩展性</text>
  <text x="610" y="136" text-anchor="middle" font-size="11" fill="#6d28d9">验收：加新需求</text>

  <text x="340" y="205" text-anchor="middle" font-size="12" fill="#666">核心不是背模式，而是「识别变化点 → 选对模式」的肌肉记忆</text>
  <text x="340" y="226" text-anchor="middle" font-size="12" fill="#666">验收标准：给系统加一个新支付渠道，只新增、不修改老代码</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
