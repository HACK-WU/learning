<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#065f46">阶段 2 · 查得到 —— 让图说人话</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="40" y="80" width="240" height="160" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="160" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">课 4 · 查询与协议</text>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#4b5563">4.1 编辑器三态</text>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#4b5563">4.2 一次查询的完整旅程</text>
  <text x="160" y="184" text-anchor="middle" font-size="12" fill="#b45309">4.3 状态码与错误分离（实测）</text>
  <text x="160" y="212" text-anchor="middle" font-size="11" fill="#6b7280">先定位错在哪一层，再动手改</text>
  <text x="160" y="230" text-anchor="middle" font-size="11" fill="#6b7280">HTTP 400 里藏着 status 502</text>

  <rect x="330" y="80" width="240" height="160" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">课 5 · Transformations</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#4b5563">5.1 Transform 的定位</text>
  <text x="450" y="162" text-anchor="middle" font-size="12" fill="#4b5563">5.2 合并 / 归约 / 分组 / 重命名</text>
  <text x="450" y="184" text-anchor="middle" font-size="12" fill="#4b5563">5.3 与查询的分工边界</text>
  <text x="450" y="212" text-anchor="middle" font-size="11" fill="#6b7280">查出来之后、画出来之前</text>
  <text x="450" y="230" text-anchor="middle" font-size="11" fill="#6b7280">改的是展示数据，不是后端数据</text>

  <rect x="620" y="80" width="240" height="160" rx="10" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
  <text x="740" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">课 6 · 动态仪表盘</text>
  <text x="740" y="140" text-anchor="middle" font-size="12" fill="#4b5563">6.1 变量类型与链式依赖</text>
  <text x="740" y="162" text-anchor="middle" font-size="12" fill="#4b5563">6.2 多值与 All 的查询写法</text>
  <text x="740" y="184" text-anchor="middle" font-size="12" fill="#4b5563">6.3 重复面板 Repeat</text>
  <text x="740" y="212" text-anchor="middle" font-size="11" fill="#6b7280">从写死的图到会联动的仪表盘</text>
  <text x="740" y="230" text-anchor="middle" font-size="11" fill="#6b7280">All 值是动态仪表盘第一事故点</text>

  <line x1="280" y1="160" x2="326" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="160" x2="616" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="276" width="820" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="450" y="300" text-anchor="middle" font-size="13" fill="#1f2937">排障主线：数据源 → 查询 → Transform → 面板，逐层排除</text>
  <text x="450" y="322" text-anchor="middle" font-size="12" fill="#4b5563">实验用已有指标 node_cpu_seconds_total（多 cpu × 多 mode），天然满足多序列整形需求</text>
</svg>
