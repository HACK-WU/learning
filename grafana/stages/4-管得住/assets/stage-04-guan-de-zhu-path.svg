<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="350" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#9d174d">阶段 4 · 管得住 —— 从"我会配"到"团队可维护"</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="40" y="80" width="240" height="150" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="160" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#9d174d">课 10 · Provisioning</text>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#4b5563">10.1 三类 provisioning 文件</text>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#4b5563">10.2 UI 改动与文件冲突</text>
  <text x="160" y="184" text-anchor="middle" font-size="12" fill="#4b5563">10.3 JSON Model 与 diff</text>
  <text x="160" y="212" text-anchor="middle" font-size="11" fill="#6b7280">Provisioning 是单向的：文件→数据库</text>

  <rect x="330" y="80" width="240" height="150" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#9d174d">课 11 · 权限</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#4b5563">11.1 Org / User / Team 三层</text>
  <text x="450" y="162" text-anchor="middle" font-size="12" fill="#4b5563">11.2 RBAC 与文件夹权限</text>
  <text x="450" y="184" text-anchor="middle" font-size="12" fill="#4b5563">11.3 服务账号与 API Key</text>
  <text x="450" y="212" text-anchor="middle" font-size="11" fill="#6b7280">给了文件夹权限，别忘了 dashboard</text>

  <rect x="620" y="80" width="240" height="150" rx="10" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
  <text x="740" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#9d174d">课 12 · 运维</text>
  <text x="740" y="140" text-anchor="middle" font-size="12" fill="#4b5563">12.1 性能：面板数与查询并发</text>
  <text x="740" y="162" text-anchor="middle" font-size="12" fill="#4b5563">12.2 数据库后端与 HA</text>
  <text x="740" y="184" text-anchor="middle" font-size="12" fill="#4b5563">12.3 升级与备份</text>
  <text x="740" y="212" text-anchor="middle" font-size="11" fill="#6b7280">升级不是换镜像，schema 会变</text>

  <line x1="280" y1="155" x2="326" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="155" x2="616" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="262" width="820" height="62" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="450" y="286" text-anchor="middle" font-size="13" fill="#1f2937">收束：把阶段 1-3 的全部点击成果，变成可版本化、可迁移、可交接的配置</text>
  <text x="450" y="310" text-anchor="middle" font-size="12" fill="#b45309">环境提示：课 10 用独立容器 grafana-prov（3002）验证从零重建；课 12 的 HA 实验需 Postgres 镜像，本机无，届时需拉或标注未实测</text>
</svg>
