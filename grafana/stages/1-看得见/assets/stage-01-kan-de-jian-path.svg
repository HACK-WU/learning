<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#3730a3">阶段 1 · 看得见 —— 把数据摆到一块屏幕上</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="40" y="80" width="240" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="160" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">课 1 · 它是谁</text>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#4b5563">1.1 定位：不存数据的查询展示层</text>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#4b5563">1.2 数据源插件模型</text>
  <text x="160" y="184" text-anchor="middle" font-size="12" fill="#4b5563">1.3 三种数据形态</text>
  <text x="160" y="212" text-anchor="middle" font-size="11" fill="#6b7280">先知道它在整条链路的哪一段</text>

  <rect x="330" y="80" width="240" height="150" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">课 2 · 第一个面板</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#4b5563">2.1 安装与初始化 / health</text>
  <text x="450" y="162" text-anchor="middle" font-size="12" fill="#4b5563">2.2 加数据源并验证连通</text>
  <text x="450" y="184" text-anchor="middle" font-size="12" fill="#4b5563">2.3 Panel：查询/单位/阈值</text>
  <text x="450" y="212" text-anchor="middle" font-size="11" fill="#6b7280">从零到屏幕上出现第一条曲线</text>

  <rect x="620" y="80" width="240" height="150" rx="10" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="740" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">课 3 · 变量与组织</text>
  <text x="740" y="140" text-anchor="middle" font-size="12" fill="#4b5563">3.1 Dashboard 与共享时间选择器</text>
  <text x="740" y="162" text-anchor="middle" font-size="12" fill="#4b5563">3.2 变量入门：$host</text>
  <text x="740" y="184" text-anchor="middle" font-size="12" fill="#4b5563">3.3 Row 与 JSON Model</text>
  <text x="740" y="212" text-anchor="middle" font-size="11" fill="#6b7280">一张图服务 N 台机器</text>

  <line x1="280" y1="155" x2="326" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="155" x2="616" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="262" width="820" height="48" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="450" y="292" text-anchor="middle" font-size="13" fill="#1f2937">伏笔：课 3 的「共享时间选择器」是阶段 3 课 9 三级下钻能成立的前提</text>
</svg>
