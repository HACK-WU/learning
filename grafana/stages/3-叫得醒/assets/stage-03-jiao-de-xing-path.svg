<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#9a3412">阶段 3 · 叫得醒 —— 从"看图"到"被叫醒"</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="40" y="80" width="240" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="160" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">课 7 · 告警架构</text>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#4b5563">7.1 规则在 Grafana 内部求值</text>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#4b5563">7.2 状态机：Normal→Pending→Firing</text>
  <text x="160" y="184" text-anchor="middle" font-size="12" fill="#4b5563">7.3 No Data 与 Error</text>
  <text x="160" y="212" text-anchor="middle" font-size="11" fill="#6b7280">for = 连续满足多久，不是延迟多久</text>

  <rect x="330" y="80" width="240" height="150" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">课 8 · 规则与通知</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#4b5563">8.1 规则三要素</text>
  <text x="450" y="162" text-anchor="middle" font-size="12" fill="#4b5563">8.2 通知策略树与静默</text>
  <text x="450" y="184" text-anchor="middle" font-size="12" fill="#4b5563">8.3 分组与抑制</text>
  <text x="450" y="212" text-anchor="middle" font-size="11" fill="#6b7280">一条故障只该响一次</text>

  <rect x="620" y="80" width="240" height="150" rx="10" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="740" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">课 9 · 日志与链路</text>
  <text x="740" y="140" text-anchor="middle" font-size="12" fill="#4b5563">9.1 Loki 与 LogQL 入门</text>
  <text x="740" y="162" text-anchor="middle" font-size="12" fill="#4b5563">9.2 指标 → 日志下钻</text>
  <text x="740" y="184" text-anchor="middle" font-size="12" fill="#4b5563">9.3 Jaeger 与 exemplar</text>
  <text x="740" y="212" text-anchor="middle" font-size="11" fill="#6b7280">故事主线在此收束</text>

  <line x1="280" y1="155" x2="326" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="155" x2="616" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <!-- 三级下钻条 -->
  <rect x="40" y="262" width="820" height="86" rx="8" fill="#f9fafb" stroke="#ea580c" stroke-width="1.5"/>
  <text x="450" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">三级下钻：指标 → 日志 → 链路（同一个时间选择器）</text>
  <text x="200" y="314" text-anchor="middle" font-size="12" fill="#1f2937">① 指标发现异常</text>
  <text x="450" y="314" text-anchor="middle" font-size="12" fill="#1f2937">② 同时间窗看日志</text>
  <text x="700" y="314" text-anchor="middle" font-size="12" fill="#1f2937">③ 点进对应 trace</text>
  <line x1="270" y1="310" x2="330" y2="310" stroke="#ea580c" stroke-width="2" marker-end="url(#b)"/>
  <line x1="540" y1="310" x2="600" y2="310" stroke="#ea580c" stroke-width="2" marker-end="url(#b)"/>
  <text x="450" y="336" text-anchor="middle" font-size="11.5" fill="#b45309">待办：课 9 前需拉取 Loki 镜像；Jaeger 复用本机已有 latest 镜像，不另拉 Tempo</text>
</svg>
