  </defs>

  <rect width="640" height="230" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="bold" fill="#e65100">阶段 3 路径 · 渲染与合成基础</text>
  <text x="320" y="52" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#666">章节：算出来了，怎么变成画面</text>

