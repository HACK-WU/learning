  <text x="160" y="186" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#555">两种表示在引擎中的分工</text>

  <rect x="352" y="70" width="256" height="118" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="480" y="96" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#e65100">课 8 · 图层、alpha 与深度排序</text>
