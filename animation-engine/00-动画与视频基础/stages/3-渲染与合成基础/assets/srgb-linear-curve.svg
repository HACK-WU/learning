<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <!-- 标题 -->
  <text x="250" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">sRGB vs 线性空间：转换曲线与"求平均"的物理正确性</text>
  <text x="250" y="40" text-anchor="middle" font-size="11" fill="#666">sRGB 是显示用的 gamma 编码；凡"求平均"（合成/插值/模糊/渐变）必须先转线性</text>

  <!-- 转换曲线（左） -->
  <text x="20" y="74" font-size="11" font-weight="bold" fill="#222">转换曲线（0→1）：</text>
  <g transform="translate(40, 90)">
    <!-- 坐标轴 -->
    <line x1="0" y1="170" x2="200" y2="170" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="0"   x2="0"   y2="170" stroke="#999" stroke-width="1"/>
    <!-- 恒等线（灰）: y = x -->
    <line x1="0" y1="170" x2="170" y2="0" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- sRGB → linear 曲线（蓝）：下凸，y 普遍更小 -->
    <path d="M 0,170 Q 80,160 120,130 T 170,60 L 170,0"
          fill="none" stroke="#285bc8" stroke-width="2.5"/>

    <text x="-12" y="174" font-size="9" fill="#666" text-anchor="end">0</text>
    <text x="-12" y="6"   font-size="9" fill="#666" text-anchor="end">1</text>
    <text x="174" y="184" font-size="9" fill="#666">1</text>
    <text x="100" y="186" font-size="9" fill="#666" text-anchor="middle">sRGB 值</text>
    <text x="-30" y="85" font-size="9" fill="#666" text-anchor="middle"
          transform="rotate(-90, -30, 85)">linear 值</text>

    <!-- 标注 -->
    <line x1="128" y1="0" x2="128" y2="170" stroke="#999" stroke-width="0.5" stroke-dasharray="2,2"/>
    <text x="132" y="14" font-size="9" fill="#285bc8">sRGB 0.5</text>
    <text x="132" y="98" font-size="9" fill="#285bc8">→ linear 0.21</text>
  </g>

  <!-- 标注图例 -->
  <g transform="translate(20, 280)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="26" y="4" font-size="10" fill="#666">恒等（sRGB 直接混）</text>
    <line x1="160" y1="0" x2="180" y2="0" stroke="#285bc8" stroke-width="2.5"/>
    <text x="186" y="4" font-size="10" fill="#285bc8">sRGB → linear</text>
  </g>

  <!-- 右侧：黑白中点对比 -->
  <text x="260" y="74" font-size="11" font-weight="bold" fill="#222">黑白 50/50 混合：</text>

  <!-- sRGB 直接混（暗） -->
  <text x="260" y="98" font-size="10" font-weight="bold" fill="#c83c3c">❌ sRGB 直接混：</text>
  <rect x="260" y="108" width="40" height="40" fill="rgb(128,128,128)" stroke="#999"/>
  <text x="306" y="124" font-size="10" fill="#222">值 128</text>
  <text x="306" y="140" font-size="9" fill="#666">直接 (0+255)/2</text>

  <!-- 线性混（亮） -->
  <text x="260" y="174" font-size="10" font-weight="bold" fill="#3ca05a">✅ 线性空间混：</text>
  <rect x="260" y="184" width="40" height="40" fill="rgb(188,188,188)" stroke="#999"/>
  <text x="306" y="200" font-size="10" fill="#222">值 188</text>
  <text x="306" y="216" font-size="9" fill="#666">linear 0.5 → sRGB 188</text>

  <!-- 差值 -->
  <text x="260" y="248" font-size="10" font-weight="bold" fill="#c83c3c">差 60 灰阶 —— sRGB 偏暗</text>

  <!-- 公式 -->
  <text x="20" y="304" font-size="10" fill="#222">linear = ((c+0.055)/1.055)^2.4   |   sRGB = 1.055 · c^(1/2.4) − 0.055</text>
</svg>