<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <!-- 标题 -->
  <text x="250" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">over 运算符：精确的 alpha 合成公式</text>
  <text x="250" y="40" text-anchor="middle" font-size="11" fill="#666">out = src · α + dst · (1 − α) —— 数字时代的赛璐珞"按比例混色"</text>

  <!-- 公式区（高亮） -->
  <rect x="50" y="56" width="400" height="48" fill="#fffde8" stroke="#d4b92a" rx="4"/>
  <text x="250" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">out_rgb = src · α + dst · (1 − α)</text>

  <!-- 参数说明 -->
  <text x="20" y="128" font-size="11" font-weight="bold" fill="#222">参数说明：</text>
  <text x="32" y="146" font-size="10" fill="#444">src     = 前景的 RGB（要画上去的那层）</text>
  <text x="32" y="162" font-size="10" fill="#444">dst     = 背景的 RGB（已经画好的下层）</text>
  <text x="32" y="178" font-size="10" fill="#444">α       = 前景的 alpha（0=全透，1=不透）</text>
  <text x="32" y="194" font-size="10" fill="#444">out_rgb = 合成后的 RGB</text>

  <!-- 边界情况表 -->
  <text x="20" y="222" font-size="11" font-weight="bold" fill="#222">边界检查（理解公式的关键）：</text>

  <rect x="32" y="232" width="436" height="22" fill="#f5f5f5" stroke="#ccc"/>
  <text x="44" y="248" font-size="10" font-weight="bold" fill="#c83c3c">α=0</text>
  <text x="84" y="248" font-size="10" fill="#444">out = 0 + dst·1 = dst  前景不存在，完全显示背景</text>

  <rect x="32" y="254" width="436" height="22" fill="#f5f5f5" stroke="#ccc"/>
  <text x="44" y="270" font-size="10" font-weight="bold" fill="#d49000">α=0.5</text>
  <text x="84" y="270" font-size="10" fill="#444">out = 0.5·src + 0.5·dst  各半混合，正中间</text>

  <rect x="32" y="276" width="436" height="22" fill="#f5f5f5" stroke="#ccc"/>
  <text x="44" y="292" font-size="10" font-weight="bold" fill="#3ca05a">α=1</text>
  <text x="84" y="292" font-size="10" fill="#444">out = src·1 + 0 = src  前景不透明，完全盖住背景</text>

  <!-- 底部注意 -->
  <text x="20" y="312" font-size="10" font-weight="bold" fill="#c83c3c">⚠ over 不满足交换律：over(a, b) ≠ over(b, a) —— 后画的层一定在上</text>
</svg>