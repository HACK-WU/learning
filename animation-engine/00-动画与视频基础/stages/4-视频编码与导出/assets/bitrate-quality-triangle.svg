<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <!-- 标题 -->
  <text x="250" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">三角关系：分辨率 × 帧率 × 码率 = 互相挤压</text>
  <text x="250" y="40" text-anchor="middle" font-size="11" fill="#666">码率是根本约束，给定预算时提高一项必然挤压另两项</text>

  <!-- 三角形 -->
  <g transform="translate(250, 180)">
    <polygon points="0,-90 90,80 -90,80" fill="#f0f4ff" stroke="#285bc8" stroke-width="2"/>
    <circle cx="0"   cy="-90" r="28" fill="#fff" stroke="#c83c3c" stroke-width="2.5"/>
    <circle cx="90"  cy="80"  r="28" fill="#fff" stroke="#d49000" stroke-width="2.5"/>
    <circle cx="-90" cy="80"  r="28" fill="#fff" stroke="#3ca05a" stroke-width="2.5"/>

    <text x="0"   y="-85" font-size="11" font-weight="bold" text-anchor="middle" fill="#c83c3c">分辨率</text>
    <text x="0"   y="-72" font-size="9" text-anchor="middle" fill="#c83c3c">W × H</text>

    <text x="90"  y="85"  font-size="11" font-weight="bold" text-anchor="middle" fill="#d49000">帧率</text>
    <text x="90"  y="98"  font-size="9" text-anchor="middle" fill="#d49000">fps</text>

    <text x="-90" y="85"  font-size="11" font-weight="bold" text-anchor="middle" fill="#3ca05a">码率</text>
    <text x="-90" y="98"  font-size="9" text-anchor="middle" fill="#3ca05a">bps</text>
  </g>

  <!-- 挤压关系（三角形外侧） -->
  <text x="20"  y="130" font-size="10" fill="#c83c3c">↑ 分辨率 → 每帧更多像素</text>
  <text x="20"  y="146" font-size="9" fill="#666">码率不变 → 画质↓</text>

  <text x="380" y="130" font-size="10" fill="#d49000">↑ 帧率 → 帧数更多</text>
  <text x="380" y="146" font-size="9" fill="#666">码率不变 → 画质↓</text>

  <text x="180" y="298" font-size="10" fill="#3ca05a">↑ 码率 → 画质更好</text>
  <text x="180" y="312" font-size="9" fill="#666">但文件大小线性增长</text>

  <!-- 中心：码率是约束 -->
  <text x="250" y="170" font-size="10" font-weight="bold" text-anchor="middle" fill="#666">码率是根本约束</text>
</svg>