<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240">
  <!-- Title -->
  <text x="210" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">时间与间距：匀速 vs 缓入缓出</text>
  <text x="210" y="40" text-anchor="middle" font-size="11" fill="#666">同样的总位移、同样的帧数，间距分布不同 → 视觉感受天壤之别</text>

  <!-- 匀速子图 (上) -->
  <text x="20" y="65" font-size="12" font-weight="bold" fill="#444">匀速（等间距）</text>
  <!-- 球沿 y=80 等间距移动：用 24 个等距小圆点表示过去位置（从 30 到 290） -->
  <g fill="#bbbbbb">
    <circle cx="41"  cy="80" r="2"/>
    <circle cx="52"  cy="80" r="2"/>
    <circle cx="63"  cy="80" r="2"/>
    <circle cx="74"  cy="80" r="2"/>
    <circle cx="85"  cy="80" r="2"/>
    <circle cx="96"  cy="80" r="2"/>
    <circle cx="107" cy="80" r="2"/>
    <circle cx="118" cy="80" r="2"/>
    <circle cx="129" cy="80" r="2"/>
    <circle cx="140" cy="80" r="2"/>
    <circle cx="151" cy="80" r="2"/>
    <circle cx="162" cy="80" r="2"/>
    <circle cx="173" cy="80" r="2"/>
    <circle cx="184" cy="80" r="2"/>
    <circle cx="195" cy="80" r="2"/>
    <circle cx="206" cy="80" r="2"/>
    <circle cx="217" cy="80" r="2"/>
    <circle cx="228" cy="80" r="2"/>
    <circle cx="239" cy="80" r="2"/>
    <circle cx="250" cy="80" r="2"/>
    <circle cx="261" cy="80" r="2"/>
    <circle cx="272" cy="80" r="2"/>
    <circle cx="283" cy="80" r="2"/>
  </g>
  <circle cx="290" cy="80" r="8" fill="#285bc8"/>
  <text x="20" y="105" font-size="10" fill="#888">spacing = 11px（每帧都一样）</text>
  <text x="20" y="118" font-size="10" fill="#888">→ 视觉：机械感、PPT 切换感</text>

  <!-- 缓入缓出子图 (下) -->
  <text x="20" y="145" font-size="12" font-weight="bold" fill="#444">缓入缓出（两端密、中间疏）</text>
  <!-- 球沿 y=160 移动：两端密集、中间稀疏 -->
  <g fill="#bbbbbb">
    <circle cx="32"  cy="160" r="2"/>
    <circle cx="35"  cy="160" r="2"/>
    <circle cx="40"  cy="160" r="2"/>
    <circle cx="48"  cy="160" r="2"/>
    <circle cx="58"  cy="160" r="2"/>
    <circle cx="70"  cy="160" r="2"/>
    <circle cx="84"  cy="160" r="2"/>
    <circle cx="100" cy="160" r="2"/>
    <circle cx="118" cy="160" r="2"/>
    <circle cx="138" cy="160" r="2"/>
    <circle cx="160" cy="160" r="2"/>
    <circle cx="182" cy="160" r="2"/>
    <circle cx="202" cy="160" r="2"/>
    <circle cx="220" cy="160" r="2"/>
    <circle cx="236" cy="160" r="2"/>
    <circle cx="250" cy="160" r="2"/>
    <circle cx="262" cy="160" r="2"/>
    <circle cx="272" cy="160" r="2"/>
    <circle cx="280" cy="160" r="2"/>
    <circle cx="285" cy="160" r="2"/>
    <circle cx="288" cy="160" r="2"/>
  </g>
  <circle cx="290" cy="160" r="8" fill="#c83c3c"/>
  <text x="20" y="185" font-size="10" fill="#888">spacing: 1px（起）→ 17px（中）→ 1px（收）</text>
  <text x="20" y="198" font-size="10" fill="#888">→ 视觉：有重量、被扔出去的物理感</text>

  <!-- 中间箭头对比 -->
  <text x="210" y="220" text-anchor="middle" font-size="11" fill="#3ca05a" font-weight="bold">总位移 = 总帧数 = 24 帧</text>
  <text x="210" y="234" text-anchor="middle" font-size="10" fill="#888">唯一不同："怎么分配"每帧的位移</text>
</svg>
