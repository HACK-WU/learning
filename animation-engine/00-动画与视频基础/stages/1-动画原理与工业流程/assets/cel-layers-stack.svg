<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260">
  <!-- Title -->
  <text x="220" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">分层与赛璐珞</text>
  <text x="220" y="40" text-anchor="middle" font-size="11" fill="#666">把画面拆成多层；背景静态只画 1 张，角色动态画 N 张</text>

  <!-- 3 stacked layers (semi-transparent) -->
  <!-- 前景层 (top) -->
  <g transform="translate(50, 60)">
    <rect width="340" height="36" fill="#ffffff" stroke="#999" stroke-width="1.5" opacity="0.95"/>
    <text x="10" y="22" font-size="12" font-weight="bold" fill="#222">前景层</text>
    <text x="260" y="22" font-size="11" fill="#666">UI / 字幕 / 光效</text>
  </g>

  <!-- 角色层 (middle) -->
  <g transform="translate(70, 100)">
    <rect width="340" height="36" fill="#ffffff" stroke="#999" stroke-width="1.5" opacity="0.85"/>
    <text x="10" y="22" font-size="12" font-weight="bold" fill="#222">角色层</text>
    <text x="260" y="22" font-size="11" fill="#666">每帧都要画（N 张）</text>
    <circle cx="180" cy="18" r="10" fill="#222"/>
  </g>

  <!-- 背景层 (bottom) -->
  <g transform="translate(90, 140)">
    <rect width="340" height="36" fill="#ffffff" stroke="#999" stroke-width="1.5" opacity="0.7"/>
    <text x="10" y="22" font-size="12" font-weight="bold" fill="#222">背景层</text>
    <text x="260" y="22" font-size="11" fill="#666">只画 1 张（赛璐珞时代 = 1 张赛璐珞片）</text>
    <polygon points="180,32 195,16 210,32" fill="#90b0c8"/>
    <circle cx="225" cy="18" r="6" fill="#f5d870"/>
  </g>

  <!-- Workload comparison -->
  <text x="50" y="200" font-size="11" fill="#222">不分层：每帧画 2 张 → 24 帧 × 2 = 48 张画</text>
  <text x="50" y="220" font-size="11" fill="#3ca05a" font-weight="bold">分层后：背景 1 张 + 角色 24 张 = 25 张画（省 47.9%）</text>
  <text x="50" y="240" font-size="10" fill="#888">视差 = 各层用不同速度移动，远慢近快 → 纵深感（伪 3D 原理）</text>
</svg>
