<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="740" height="420">
  <rect width="740" height="420" fill="#ffffff"/>

  <text x="370" y="28" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="bold" fill="#1a237e">帧号 ↔ 时间：一拍一 / 一拍二 / 一拍三</text>
  <text x="370" y="50" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#666">以 24 fps 播放 1 秒 = 24 帧（帧号 0–23）；「拍数」决定这一秒要画几张不同的画</text>

  <!-- 时间轴 -->
  <line x1="60" y1="96" x2="660" y2="96" stroke="#1565C0" stroke-width="2"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#333">
    <line x1="60" y1="90" x2="60" y2="102" stroke="#1565C0" stroke-width="2"/><text x="60" y="118" text-anchor="middle">f0</text><text x="60" y="130" text-anchor="middle" fill="#888">0.000s</text>
    <line x1="160" y1="92" x2="160" y2="100" stroke="#1565C0" stroke-width="1"/><text x="160" y="118" text-anchor="middle">f4</text><text x="160" y="130" text-anchor="middle" fill="#888">0.167s</text>
    <line x1="260" y1="92" x2="260" y2="100" stroke="#1565C0" stroke-width="1"/><text x="260" y="118" text-anchor="middle">f8</text><text x="260" y="130" text-anchor="middle" fill="#888">0.333s</text>
    <line x1="360" y1="92" x2="360" y2="100" stroke="#1565C0" stroke-width="1"/><text x="360" y="118" text-anchor="middle">f12</text><text x="360" y="130" text-anchor="middle" fill="#888">0.500s</text>
    <line x1="460" y1="92" x2="460" y2="100" stroke="#1565C0" stroke-width="1"/><text x="460" y="118" text-anchor="middle">f16</text><text x="460" y="130" text-anchor="middle" fill="#888">0.667s</text>
    <line x1="560" y1="92" x2="560" y2="100" stroke="#1565C0" stroke-width="1"/><text x="560" y="118" text-anchor="middle">f20</text><text x="560" y="130" text-anchor="middle" fill="#888">0.833s</text>
    <line x1="660" y1="90" x2="660" y2="102" stroke="#1565C0" stroke-width="2"/><text x="660" y="118" text-anchor="middle">f23</text><text x="660" y="130" text-anchor="middle" fill="#888">0.958s</text>
  </g>

  <!-- 一拍一 -->
  <text x="54" y="176" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">一拍一</text>
  <text x="54" y="192" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#555">24 张/秒</text>
  <g>
    <rect x="60" y="160" width="25" height="34" rx="2" fill="#1565C0"/>
    <rect x="85" y="160" width="25" height="34" rx="2" fill="#1976d2"/>
    <rect x="110" y="160" width="25" height="34" rx="2" fill="#1e88e5"/>
    <rect x="135" y="160" width="25" height="34" rx="2" fill="#2196f3"/>
    <rect x="160" y="160" width="25" height="34" rx="2" fill="#1565C0"/>
    <rect x="185" y="160" width="25" height="34" rx="2" fill="#1976d2"/>
    <rect x="210" y="160" width="25" height="34" rx="2" fill="#1e88e5"/>
    <rect x="235" y="160" width="25" height="34" rx="2" fill="#2196f3"/>
    <rect x="260" y="160" width="25" height="34" rx="2" fill="#1565C0"/>
    <rect x="285" y="160" width="25" height="34" rx="2" fill="#1976d2"/>
    <rect x="310" y="160" width="25" height="34" rx="2" fill="#1e88e5"/>
    <rect x="335" y="160" width="25" height="34" rx="2" fill="#2196f3"/>
    <rect x="360" y="160" width="25" height="34" rx="2" fill="#1565C0"/>
    <rect x="385" y="160" width="25" height="34" rx="2" fill="#1976d2"/>
    <rect x="410" y="160" width="25" height="34" rx="2" fill="#1e88e5"/>
    <rect x="435" y="160" width="25" height="34" rx="2" fill="#2196f3"/>
    <rect x="460" y="160" width="25" height="34" rx="2" fill="#1565C0"/>
    <rect x="485" y="160" width="25" height="34" rx="2" fill="#1976d2"/>
    <rect x="510" y="160" width="25" height="34" rx="2" fill="#1e88e5"/>
    <rect x="535" y="160" width="25" height="34" rx="2" fill="#2196f3"/>
    <rect x="560" y="160" width="25" height="34" rx="2" fill="#1565C0"/>
    <rect x="585" y="160" width="25" height="34" rx="2" fill="#1976d2"/>
    <rect x="610" y="160" width="25" height="34" rx="2" fill="#1e88e5"/>
    <rect x="635" y="160" width="25" height="34" rx="2" fill="#2196f3"/>
  </g>
  <text x="670" y="176" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#555">每帧一张新画</text>

  <!-- 一拍二 -->
  <text x="54" y="246" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">一拍二</text>
  <text x="54" y="262" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#555">12 张/秒</text>
  <g>
    <rect x="60" y="230" width="50" height="34" rx="2" fill="#1565C0"/>
    <rect x="110" y="230" width="50" height="34" rx="2" fill="#1976d2"/>
    <rect x="160" y="230" width="50" height="34" rx="2" fill="#1e88e5"/>
    <rect x="210" y="230" width="50" height="34" rx="2" fill="#2196f3"/>
    <rect x="260" y="230" width="50" height="34" rx="2" fill="#1565C0"/>
    <rect x="310" y="230" width="50" height="34" rx="2" fill="#1976d2"/>
    <rect x="360" y="230" width="50" height="34" rx="2" fill="#1e88e5"/>
    <rect x="410" y="230" width="50" height="34" rx="2" fill="#2196f3"/>
    <rect x="460" y="230" width="50" height="34" rx="2" fill="#1565C0"/>
    <rect x="510" y="230" width="50" height="34" rx="2" fill="#1976d2"/>
    <rect x="560" y="230" width="50" height="34" rx="2" fill="#1e88e5"/>
    <rect x="610" y="230" width="50" height="34" rx="2" fill="#2196f3"/>
  </g>
  <text x="670" y="246" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#555">一张停 2 帧</text>

  <!-- 一拍三 -->
  <text x="54" y="316" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">一拍三</text>
  <text x="54" y="332" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#555">8 张/秒</text>
  <g>
    <rect x="60" y="300" width="75" height="34" rx="2" fill="#1565C0"/>
    <rect x="135" y="300" width="75" height="34" rx="2" fill="#1976d2"/>
    <rect x="210" y="300" width="75" height="34" rx="2" fill="#1e88e5"/>
    <rect x="285" y="300" width="75" height="34" rx="2" fill="#2196f3"/>
    <rect x="360" y="300" width="75" height="34" rx="2" fill="#1565C0"/>
    <rect x="435" y="300" width="75" height="34" rx="2" fill="#1976d2"/>
    <rect x="510" y="300" width="75" height="34" rx="2" fill="#1e88e5"/>
    <rect x="585" y="300" width="75" height="34" rx="2" fill="#2196f3"/>
  </g>
  <text x="670" y="316" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#555">一张停 3 帧</text>

  <!-- 底部公式 -->
  <rect x="24" y="356" width="692" height="50" rx="6" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="370" y="378" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#333">帧号 f → 时间 t = f / fps　｜　每秒需画的张数 = fps / 拍数　｜　第 f 帧用的是第 f // 拍数 张画</text>
  <text x="370" y="398" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#666">注意：帧数 = 24，但最大帧号 = 23（从 0 开始数）—— 差 1 是最经典的 off-by-one</text>
</svg>
