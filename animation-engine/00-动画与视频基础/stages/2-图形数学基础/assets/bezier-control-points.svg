<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" width="460" height="340">
  <!-- Title -->
  <text x="230" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">贝塞尔曲线：控制点与德卡斯特里奥算法</text>
  <text x="230" y="40" text-anchor="middle" font-size="11" fill="#666">曲线只穿首末控制点；中间控制点只提供「拉力」</text>

  <!-- ================== 左：三次贝塞尔结构 ================== -->
  <text x="20" y="68" font-size="12" font-weight="bold" fill="#222">① 三次贝塞尔（4 控制点）</text>

  <!-- 控制点：P0(30,240) P1(70,90) P2(200,90) P3(290,240) —— SVG 屏幕坐标，y 向下 -->
  <g>
    <!-- 控制多边形（虚线） -->
    <line x1="30"  y1="240" x2="70"  y2="90"  stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="70"  y1="90"  x2="200" y2="90"  stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="200" y1="90"  x2="290" y2="240" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- 曲线（三次贝塞尔：C 命令） -->
    <path d="M 30,240 C 70,90 200,90 290,240"
          fill="none" stroke="#285bc8" stroke-width="3"/>

    <!-- 控制点（空心红圈 + 标签） -->
    <circle cx="30"  cy="240" r="5" fill="none" stroke="#c83c3c" stroke-width="2"/>
    <text x="18"  y="258" font-size="11" font-weight="bold" fill="#c83c3c">P₀</text>
    <circle cx="70"  cy="90"  r="5" fill="none" stroke="#c83c3c" stroke-width="2"/>
    <text x="58"  y="80"  font-size="11" font-weight="bold" fill="#c83c3c">P₁</text>
    <circle cx="200" cy="90"  r="5" fill="none" stroke="#c83c3c" stroke-width="2"/>
    <text x="208" y="80"  font-size="11" font-weight="bold" fill="#c83c3c">P₂</text>
    <circle cx="290" cy="240" r="5" fill="none" stroke="#c83c3c" stroke-width="2"/>
    <text x="284" y="258" font-size="11" font-weight="bold" fill="#c83c3c">P₃</text>

    <!-- 标注：曲线不穿过 P1/P2 -->
    <line x1="135" y1="128" x2="135" y2="100" stroke="#c83c3c" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="100" y="146" font-size="10" fill="#c83c3c">曲线不穿过 P₁/P₂</text>
  </g>

  <text x="20" y="286" font-size="10" fill="#666">曲线（蓝）只穿 P₀ 和 P₃，被 P₁/P₂「拉」成拱形</text>

  <!-- ================== 右：德卡斯特里奥递归 ================== -->
  <text x="250" y="68" font-size="12" font-weight="bold" fill="#222">② 德卡斯特里奥 = 递归 lerp</text>

  <g transform="translate(250, 80)">
    <!-- 第 0 层：4 控制点（简化画在一条折线上） -->
    <text x="0" y="0" font-size="10" fill="#888">第0层：4 点</text>
    <g fill="#c83c3c">
      <circle cx="10" cy="16" r="3"/>
      <circle cx="55" cy="44" r="3"/>
      <circle cx="120" cy="44" r="3"/>
      <circle cx="165" cy="16" r="3"/>
    </g>

    <!-- 第 1 层：3 点 -->
    <text x="0" y="76" font-size="10" fill="#285bc8">第1层：3 点（相邻 lerp）</text>
    <g fill="#285bc8">
      <circle cx="32"  cy="96" r="3"/>
      <circle cx="87"  cy="120" r="3"/>
      <circle cx="142" cy="96" r="3"/>
    </g>
    <line x1="32" y1="96" x2="87" y2="120" stroke="#285bc8" stroke-width="1"/>
    <line x1="87" y1="120" x2="142" y2="96" stroke="#285bc8" stroke-width="1"/>

    <!-- 第 2 层：2 点 -->
    <text x="0" y="152" font-size="10" fill="#3ca05a">第2层：2 点</text>
    <g fill="#3ca05a">
      <circle cx="60"  cy="172" r="3"/>
      <circle cx="114" cy="172" r="3"/>
    </g>
    <line x1="60" y1="172" x2="114" y2="172" stroke="#3ca05a" stroke-width="1"/>

    <!-- 第 3 层：1 点 = 曲线上的点 -->
    <text x="0" y="204" font-size="10" fill="#222">第3层：1 点 = B(t)</text>
    <circle cx="87" cy="224" r="5" fill="#285bc8"/>

    <!-- 箭头 -->
    <text x="176" y="30" font-size="14" fill="#999">↓</text>
    <text x="176" y="106" font-size="14" fill="#999">↓</text>
    <text x="176" y="182" font-size="14" fill="#999">↓</text>
  </g>

  <text x="250" y="320" font-size="9" fill="#666">每层对相邻点做 lerp，直到只剩 1 点</text>
</svg>
