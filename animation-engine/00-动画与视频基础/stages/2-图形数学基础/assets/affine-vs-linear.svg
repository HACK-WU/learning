<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360">
  <!-- Title -->
  <text x="230" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">仿射变换 = 线性 + 平移</text>
  <text x="230" y="40" text-anchor="middle" font-size="11" fill="#666">唯一区别：线性保持原点不动，仿射可以挪原点</text>

  <!-- ================== Left: Linear (origin stays) ================== -->
  <text x="20" y="68" font-size="12" font-weight="bold" fill="#444">① 线性变换 v' = M·v</text>

  <!-- 网格（数学系 y 向上，但 SVG 屏幕 y 向下，所以这里画 SVG 屏幕方向时手动翻转） -->
  <!-- 这里 SVG 直接画屏幕方向的网格，y 向下，但作为概念图不影响理解 -->
  <g transform="translate(20, 80)">
    <!-- 原方格（浅灰） -->
    <rect x="0" y="0" width="160" height="160" fill="#f5f5f5" stroke="#999"/>
    <line x1="40"  y1="0" x2="40"  y2="160" stroke="#ccc" stroke-width="1"/>
    <line x1="80"  y1="0" x2="80"  y2="160" stroke="#ccc" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="160" stroke="#ccc" stroke-width="1"/>
    <line x1="0" y1="40"  x2="160" y2="40"  stroke="#ccc" stroke-width="1"/>
    <line x1="0" y1="80"  x2="160" y2="80"  stroke="#ccc" stroke-width="1"/>
    <line x1="0" y1="120" x2="160" y2="120" stroke="#ccc" stroke-width="1"/>
    <!-- 变换后：放大 1.6x（仍方、仍平行、原点不动） -->
    <rect x="0" y="0" width="160" height="160" fill="none" stroke="#c83c3c" stroke-width="2.5"/>
    <line x1="40"  y1="0" x2="40"  y2="160" stroke="#e89090" stroke-width="1.5"/>
    <line x1="80"  y1="0" x2="80"  y2="160" stroke="#e89090" stroke-width="1.5"/>
    <line x1="120" y1="0" x2="120" y2="160" stroke="#e89090" stroke-width="1.5"/>
    <line x1="0" y1="40"  x2="160" y2="40"  stroke="#e89090" stroke-width="1.5"/>
    <line x1="0" y1="80"  x2="160" y2="80"  stroke="#e89090" stroke-width="1.5"/>
    <line x1="0" y1="120" x2="160" y2="120" stroke="#e89090" stroke-width="1.5"/>

    <!-- 原点：原位置 = 变换后位置（都在左下角） -->
    <circle cx="0" cy="160" r="4" fill="#444"/>
    <text x="-12" y="176" font-size="10" font-weight="bold" fill="#444">原点</text>
    <text x="-6" y="186" font-size="9" fill="#3ca05a">✓ 不动</text>
  </g>

  <text x="20" y="298" font-size="10" fill="#666">缩放 1.6× —— 格子变大，</text>
  <text x="20" y="312" font-size="10" fill="#666">仍方、仍平行，原点不动</text>

  <!-- ================== Right: Affine (origin moves) ================== -->
  <text x="250" y="68" font-size="12" font-weight="bold" fill="#444">② 仿射变换 v' = M·v + t</text>

  <g transform="translate(250, 80)">
    <!-- 原方格（浅灰） -->
    <rect x="0" y="0" width="100" height="100" fill="#f5f5f5" stroke="#999"/>
    <line x1="25"  y1="0" x2="25"  y2="100" stroke="#ccc" stroke-width="1"/>
    <line x1="50"  y1="0" x2="50"  y2="100" stroke="#ccc" stroke-width="1"/>
    <line x1="75"  y1="0" x2="75"  y2="100" stroke="#ccc" stroke-width="1"/>
    <line x1="0" y1="25" x2="100" y2="25" stroke="#ccc" stroke-width="1"/>
    <line x1="0" y1="50" x2="100" y2="50" stroke="#ccc" stroke-width="1"/>
    <line x1="0" y1="75" x2="100" y2="75" stroke="#ccc" stroke-width="1"/>
    <!-- 原点（左下角） -->
    <circle cx="0" cy="100" r="4" fill="#444"/>
    <text x="-22" y="116" font-size="10" font-weight="bold" fill="#444">原原点</text>

    <!-- 变换后：放大 1.6x + 平移 (40, -40)，整张被挪到右上 -->
    <g transform="translate(40, -40)">
      <rect x="0" y="0" width="160" height="160" fill="none" stroke="#285bc8" stroke-width="2.5"/>
      <line x1="40"  y1="0" x2="40"  y2="160" stroke="#a8c0e8" stroke-width="1.5"/>
      <line x1="80"  y1="0" x2="80"  y2="160" stroke="#a8c0e8" stroke-width="1.5"/>
      <line x1="120" y1="0" x2="120" y2="160" stroke="#a8c0e8" stroke-width="1.5"/>
      <line x1="0" y1="40"  x2="160" y2="40"  stroke="#a8c0e8" stroke-width="1.5"/>
      <line x1="0" y1="80"  x2="160" y2="80"  stroke="#a8c0e8" stroke-width="1.5"/>
      <line x1="0" y1="120" x2="160" y2="120" stroke="#a8c0e8" stroke-width="1.5"/>
      <!-- 变换后的原点（在平移后的位置） -->
      <circle cx="0" cy="160" r="4" fill="#c83c3c"/>
    </g>
    <text x="38" y="76" font-size="10" font-weight="bold" fill="#c83c3c">新原点</text>
  </g>

  <text x="250" y="298" font-size="10" fill="#666">缩放 1.6× + 平移 (40, -40) ——</text>
  <text x="250" y="312" font-size="10" fill="#666">整张被挪到右上，原点跑到新位置</text>

  <!-- 底部总结 -->
  <rect x="20" y="330" width="420" height="22" fill="#f5f5f5" stroke="#ccc" rx="3"/>
  <text x="230" y="345" text-anchor="middle" font-size="11" fill="#222">判据：<tspan font-weight="bold">T(0) = 0</tspan> → 线性 ｜ T(0) = t ≠ 0 → 仿射</text>
</svg>
