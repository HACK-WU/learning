<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320">
  <!-- Title -->
  <text x="230" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">沿路径运动：参数 t vs 弧长 s</text>
  <text x="230" y="40" text-anchor="middle" font-size="11" fill="#666">t 等间隔 ≠ 实际距离等间隔；按弧长 s 等分才真正匀速</text>

  <!-- ================== 上：参数 t 匀速（错误） ================== -->
  <text x="20" y="70" font-size="12" font-weight="bold" fill="#c83c3c">❌ 上：参数 t 等间隔 → 走得忽快忽慢</text>

  <g transform="translate(20, 80)">
    <!-- 曲线 -->
    <path d="M 20,60 C 90,10 180,10 250,60"
          fill="none" stroke="#ddd" stroke-width="2"/>
    <!-- t 等间隔的采样点（间距不均：两端疏、中间密 —— 表示同样 dt 走的距离不同） -->
    <g fill="#c83c3c">
      <circle cx="20"  cy="60" r="3"/>
      <circle cx="54"  cy="45" r="3"/>
      <circle cx="92"  cy="30" r="3"/>
      <circle cx="135" cy="24" r="3"/>
      <circle cx="178" cy="30" r="3"/>
      <circle cx="216" cy="45" r="3"/>
      <circle cx="250" cy="60" r="3"/>
    </g>
    <!-- 标注：间距不均 -->
    <text x="60"  y="86" font-size="9" fill="#c83c3c">间距不均</text>
  </g>

  <text x="20" y="180" font-size="10" fill="#666">同样 Δt，走过的「实际距离」不等 → 视觉上忽快忽慢</text>

  <!-- ================== 下：弧长 s 匀速（正确） ================== -->
  <text x="20" y="212" font-size="12" font-weight="bold" fill="#3ca05a">✅ 下：弧长 s 等间隔 → 真正匀速</text>

  <g transform="translate(20, 222)">
    <!-- 曲线 -->
    <path d="M 20,60 C 90,10 180,10 250,60"
          fill="none" stroke="#ddd" stroke-width="2"/>
    <!-- s 等间隔的采样点（沿曲线等距分布） -->
    <g fill="#3ca05a">
      <circle cx="20"  cy="60" r="3"/>
      <circle cx="58"  cy="40" r="3"/>
      <circle cx="102" cy="26" r="3"/>
      <circle cx="148" cy="26" r="3"/>
      <circle cx="192" cy="40" r="3"/>
      <circle cx="230" cy="56" r="3"/>
      <circle cx="250" cy="60" r="3"/>
    </g>
    <!-- 等距标注 -->
    <text x="60"  y="86" font-size="9" fill="#3ca05a">间距恒定</text>
  </g>

  <text x="20" y="312" font-size="10" fill="#666">按「实际走过的距离」等分 → 每帧走同样远 → 视觉匀速</text>

  <!-- ================== 右侧：实现说明 ================== -->
  <g transform="translate(290, 60)">
    <text x="0" y="0" font-size="11" font-weight="bold" fill="#222">弧长参数化</text>
    <text x="0" y="18" font-size="9" fill="#333">① 预计算弧长表</text>
    <text x="0" y="32" font-size="9" fill="#555">(t, 累计弧长)</text>
    <text x="0" y="52" font-size="9" fill="#333">② 二分查找</text>
    <text x="0" y="66" font-size="9" fill="#555">s·总长 → 对应区间</text>
    <text x="0" y="86" font-size="9" fill="#333">③ 线性插值出 t</text>
    <text x="0" y="100" font-size="9" fill="#555">再 bezier(t) 取点</text>

    <text x="0" y="130" font-size="10" font-weight="bold" fill="#3ca05a">实测对比</text>
    <text x="0" y="146" font-size="9" fill="#c83c3c">参数 t：8.4~13.3px</text>
    <text x="0" y="160" font-size="9" fill="#c83c3c">最值比 1.6×</text>
    <text x="0" y="180" font-size="9" fill="#3ca05a">弧长 s：11.7px</text>
    <text x="0" y="194" font-size="9" fill="#3ca05a">最值比 1.00× ✓</text>

    <text x="0" y="224" font-size="9" fill="#666">对应十二原则</text>
    <text x="0" y="238" font-size="9" fill="#666">第 7 条「弧线运动」</text>
    <text x="0" y="252" font-size="9" fill="#666">= 弧线 + 匀速</text>
  </g>
</svg>
