<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360">
  <!-- Title -->
  <text x="230" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">插值 + 缓动 = 中间帧怎么算、怎么有重量感</text>
  <text x="230" y="40" text-anchor="middle" font-size="11" fill="#666">P = lerp(A, B, ease(t)) — 阶段 2 课 6 第一批核心公式</text>

  <!-- ================== 上：lerp 基础 ================== -->
  <text x="20" y="68" font-size="12" font-weight="bold" fill="#222">① 插值 = lerp(A, B, t) = A + (B-A)·t</text>

  <!-- A 和 B 端点 -->
  <circle cx="40" cy="110" r="6" fill="#c83c3c"/>
  <text x="32" y="132" font-size="11" font-weight="bold" fill="#c83c3c">A</text>

  <circle cx="380" cy="110" r="6" fill="#c83c3c"/>
  <text x="386" y="132" font-size="11" font-weight="bold" fill="#c83c3c">B</text>

  <!-- 路径线（匀速 lerp 的中间点：等距分布） -->
  <line x1="40" y1="110" x2="380" y2="110" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
  <g fill="#bbb">
    <circle cx="72"  cy="110" r="3"/>
    <circle cx="105" cy="110" r="3"/>
    <circle cx="138" cy="110" r="3"/>
    <circle cx="170" cy="110" r="3"/>
    <circle cx="202" cy="110" r="3"/>
    <circle cx="235" cy="110" r="3"/>
    <circle cx="267" cy="110" r="3"/>
    <circle cx="300" cy="110" r="3"/>
    <circle cx="332" cy="110" r="3"/>
  </g>
  <!-- t=0.5 处的中点（蓝色高亮） -->
  <circle cx="210" cy="110" r="5" fill="#285bc8"/>
  <text x="190" y="92" font-size="10" fill="#285bc8">t=0.5 → 中点</text>

  <text x="20" y="160" font-size="10" fill="#666">匀速 lerp：等间距 → 看起来"机械"（课 3 的 spacing_uniform）</text>

  <!-- ================== 中：缓动 = 间距分布 ================== -->
  <text x="20" y="190" font-size="12" font-weight="bold" fill="#222">② 缓动函数 = 改写 t 的分布 → 间距自动产生</text>

  <!-- 曲线 t' = ease_in_out_cubic(t)：两端平、中间陡 -->
  <g transform="translate(20, 210)">
    <!-- 坐标轴 -->
    <line x1="0" y1="60" x2="320" y2="60" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="0"  x2="0"  y2="60" stroke="#999" stroke-width="1"/>
    <text x="-6" y="6"  font-size="9" fill="#888">t'</text>
    <text x="316" y="74" font-size="9" fill="#888">t</text>
    <text x="-50" y="32" font-size="9" fill="#888">ease(t)</text>

    <!-- 曲线：用一组点近似 S 形（两端平、中间陡） -->
    <path d="M 0,60 C 40,60 50,8 100,4 C 150,2 180,2 200,4 C 240,2 280,2 320,4"
          fill="none" stroke="#285bc8" stroke-width="2.5"/>
    <!-- 起止点 -->
    <circle cx="0"   cy="60" r="3" fill="#c83c3c"/>
    <text x="-12" y="76" font-size="9" fill="#c83c3c">0,0</text>
    <circle cx="320" cy="4"  r="3" fill="#3ca05a"/>
    <text x="298" y="18" font-size="9" fill="#3ca05a">1,1</text>
  </g>

  <!-- 下方对应间距（柱状图：两端短、中间高 = 间距分布） -->
  <g transform="translate(20, 280)">
    <text x="0" y="0" font-size="10" fill="#444">↓ 这个曲线对应"间距分布"：</text>
    <g fill="#3ca05a" opacity="0.7">
      <!-- 8 根柱，宽度约 36，间距约 4；高矮：两端矮中间高（模拟 ease-in-out 的间距） -->
      <rect x="0"   y="40" width="36" height="2"/>
      <rect x="40"  y="38" width="36" height="4"/>
      <rect x="80"  y="32" width="36" height="10"/>
      <rect x="120" y="20" width="36" height="22"/>
      <rect x="160" y="4"  width="36" height="38"/>
      <rect x="200" y="0"  width="36" height="42"/>
      <rect x="240" y="6"  width="36" height="36"/>
      <rect x="280" y="22" width="36" height="20"/>
    </g>
    <text x="0"   y="60" font-size="8" fill="#666">t=0</text>
    <text x="160" y="60" font-size="8" fill="#666">t=0.5</text>
    <text x="306" y="60" font-size="8" fill="#666">t=1</text>
  </g>

  <!-- ================== 底部：旋转插值坑 ================== -->
  <rect x="20" y="328" width="420" height="22" fill="#fff8dc" stroke="#c83c3c" rx="3"/>
  <text x="230" y="343" text-anchor="middle" font-size="11" fill="#222">⚠ 旋转插值：350°→10° 必须先归一化 Δ=((10-350+180) mod 360)-180=<tspan font-weight="bold" fill="#c83c3c">+20°</tspan>，否则走 340° 长路</text>
</svg>
