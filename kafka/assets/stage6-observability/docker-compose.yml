# 阶段 6《运维与可观测》实操环境
# 3 节点 KRaft 集群（每节点挂 JMX Exporter javaagent）+ Prometheus + Grafana
#
# 端口规划（避开本机已占用端口）：
#   19192-19194 : broker 客户端端口 kafka-1/2/3
#   17071-17073 : JMX Exporter HTTP 端口（Prometheus 从此拉取）
#   19990       : Prometheus UI
#   13000       : Grafana UI
#
# 说明：JMX Exporter 以 -javaagent 方式挂进 broker JVM（生产最常用做法），
#       通过 KAFKA_JMX_OPTS 注入；agent 在 1707x 暴露 Prometheus 格式指标。

networks:
  kafka-net:
    driver: bridge

services:
  kafka-1:
    image: apache/kafka:4.0.0
    container_name: l15-kafka-1
    networks: [kafka-net]
    ports:
      - "19192:9092"
      - "17071:17071"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-logs
      KAFKA_JMX_PORT: 7071
      KAFKA_JMX_HOSTNAME: kafka-1
      KAFKA_JMX_OPTS: "-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=17071:/opt/jmx-exporter/kafka-broker.yml -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.rmi.port=7071 -Djava.rmi.server.hostname=kafka-1"
    volumes:
      - ./jmx-exporter/jmx_prometheus_javaagent.jar:/opt/jmx-exporter/jmx_prometheus_javaagent.jar:ro
      - ./jmx-exporter/kafka-broker.yml:/opt/jmx-exporter/kafka-broker.yml:ro

  kafka-2:
    image: apache/kafka:4.0.0
    container_name: l15-kafka-2
    networks: [kafka-net]
    ports:
      - "19193:9092"
      - "17072:17072"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-logs
      KAFKA_JMX_PORT: 7071
      KAFKA_JMX_HOSTNAME: kafka-2
      KAFKA_JMX_OPTS: "-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=17072:/opt/jmx-exporter/kafka-broker.yml -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.rmi.port=7071 -Djava.rmi.server.hostname=kafka-2"
    volumes:
      - ./jmx-exporter/jmx_prometheus_javaagent.jar:/opt/jmx-exporter/jmx_prometheus_javaagent.jar:ro
      - ./jmx-exporter/kafka-broker.yml:/opt/jmx-exporter/kafka-broker.yml:ro

  kafka-3:
    image: apache/kafka:4.0.0
    container_name: l15-kafka-3
    networks: [kafka-net]
    ports:
      - "19194:9092"
      - "17073:17073"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-logs
      KAFKA_JMX_PORT: 7071
      KAFKA_JMX_HOSTNAME: kafka-3
      KAFKA_JMX_OPTS: "-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=17073:/opt/jmx-exporter/kafka-broker.yml -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.rmi.port=7071 -Djava.rmi.server.hostname=kafka-3"
    volumes:
      - ./jmx-exporter/jmx_prometheus_javaagent.jar:/opt/jmx-exporter/jmx_prometheus_javaagent.jar:ro
      - ./jmx-exporter/kafka-broker.yml:/opt/jmx-exporter/kafka-broker.yml:ro

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: l15-prom
    networks: [kafka-net]
    ports: ["19990:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.0.0
    container_name: l15-grafana
    networks: [kafka-net]
    ports: ["13000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
