<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="800" height="410" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">读到哪了，别记在自己脑子里</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#555555">换个人接手，进度就断了；各写各的又会互相盖掉</text>

  <!-- 左：各记各的 -->
  <text x="200" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#c62828">各人各记一份，或者随便找人记</text>

  <g transform="translate(35,84)">
    <rect x="0" y="0" width="330" height="190" rx="7" fill="#ffebee" stroke="#c62828" stroke-width="2"/>

    <rect x="14" y="16" width="145" height="76" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1.2"/>
    <text x="86" y="34" text-anchor="middle" font-size="9" fill="#b71c1c">自己记在随身本上</text>
    <text x="86" y="52" text-anchor="middle" font-size="9" fill="#b71c1c">人一换，本子跟着走，</text>
    <text x="86" y="66" text-anchor="middle" font-size="9" fill="#b71c1c">接手的两眼一抹黑：</text>
    <text x="86" y="82" text-anchor="middle" font-size="9" fill="#b71c1c">要么从头再来一遍，</text>

    <rect x="171" y="16" width="145" height="76" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1.2"/>
    <text x="243" y="34" text-anchor="middle" font-size="9" fill="#b71c1c">改成谁都能往册子上写</text>
    <text x="243" y="52" text-anchor="middle" font-size="9" fill="#b71c1c">两个人同时写同一行，</text>
    <text x="243" y="66" text-anchor="middle" font-size="9" fill="#b71c1c">后写的把先写的盖了，</text>
    <text x="243" y="82" text-anchor="middle" font-size="9" fill="#b71c1c">谁的都不算数</text>

    <rect x="14" y="100" width="302" height="78" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1.2"/>
    <text x="165" y="118" text-anchor="middle" font-size="9" fill="#b71c1c">还有一种更让人懵的：那人调岗了，新来的要先翻一遍旧册子</text>
    <text x="165" y="134" text-anchor="middle" font-size="9" fill="#b71c1c">翻的时候谁来问都答不上，只知道"在查了、在查了"</text>
    <text x="165" y="152" text-anchor="middle" font-size="9" fill="#b71c1c">外头看着就是：人没动、活没干，像是卡死了</text>
    <text x="165" y="170" text-anchor="middle" font-size="9" fill="#b71c1c">其实只是册子还没翻完 —— 白慌一场</text>
  </g>

  <!-- 分隔 -->
  <line x1="400" y1="70" x2="400" y2="380" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- 右：专人专管 -->
  <text x="600" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#2e7d32">按名字分给固定的一位，由他记</text>

  <g transform="translate(420,84)">
    <rect x="0" y="0" width="330" height="190" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>

    <rect x="14" y="16" width="302" height="34" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
    <text x="165" y="30" text-anchor="middle" font-size="10" fill="#1b5e20">先问一句"我这份归谁管"—— 问谁都答得上来</text>
    <text x="165" y="45" text-anchor="middle" font-size="9" fill="#1b5e20">（不用事先知道答案，问到谁都能指路）</text>

    <g transform="translate(14,58)">
      <rect x="0" y="0" width="94" height="58" rx="4" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2"/>
      <text x="47" y="18" text-anchor="middle" font-size="9" fill="#e65100">按名字指派</text>
      <text x="47" y="33" text-anchor="middle" font-size="9" fill="#e65100">同一伙人</text>
      <text x="47" y="48" text-anchor="middle" font-size="9" fill="#e65100">永远归同一位</text>

      <line x1="98" y1="29" x2="112" y2="29" stroke="#2e7d32" stroke-width="1.4"/>
      <polygon points="112,29 106,25 106,33" fill="#2e7d32"/>

      <rect x="118" y="0" width="94" height="58" rx="4" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2"/>
      <text x="165" y="18" text-anchor="middle" font-size="9" fill="#e65100">由他一人落笔</text>
      <text x="165" y="33" text-anchor="middle" font-size="9" fill="#e65100">别人不直接写，</text>
      <text x="165" y="48" text-anchor="middle" font-size="9" fill="#e65100">不会互相盖</text>

      <line x1="216" y1="29" x2="230" y2="29" stroke="#2e7d32" stroke-width="1.4"/>
      <polygon points="230,29 224,25 224,33" fill="#2e7d32"/>

      <rect x="236" y="0" width="94" height="58" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
      <text x="283" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#1b5e20">手边留一份</text>
      <text x="283" y="33" text-anchor="middle" font-size="9" fill="#1b5e20">问一句就答，</text>
      <text x="283" y="48" text-anchor="middle" font-size="9" fill="#1b5e20">不必翻册子</text>
    </g>

    <rect x="14" y="124" width="145" height="54" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
    <text x="86" y="142" text-anchor="middle" font-size="9" fill="#1b5e20">本子只留最新一条：</text>
    <text x="86" y="157" text-anchor="middle" font-size="9" fill="#1b5e20">旧进度没用了，</text>
    <text x="86" y="171" text-anchor="middle" font-size="9" fill="#1b5e20">定期清掉腾地方</text>

    <rect x="171" y="124" width="145" height="54" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1.2"/>
    <text x="243" y="142" text-anchor="middle" font-size="9" fill="#1b5e20">那人换了呢？</text>
    <text x="243" y="157" text-anchor="middle" font-size="9" fill="#1b5e20">重新问一句就找得到，</text>
    <text x="243" y="171" text-anchor="middle" font-size="9" fill="#1b5e20">翻册子的空档会短暂停摆</text>
  </g>

  <!-- 底部结论 -->
  <rect x="35" y="300" width="730" height="88" rx="6" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1"/>
  <text x="400" y="326" text-anchor="middle" font-size="12" fill="#333333">左边：不是记不住，是"谁都能写"会互相盖、而"谁来记"又没个准数</text>
  <text x="400" y="350" text-anchor="middle" font-size="12" fill="#333333">右边：按名字固定给一位，由他落笔并手边留一份；换人时重新问一句即可，翻册子的空档只是慢，不是坏</text>
  <text x="400" y="376" text-anchor="middle" font-size="12" font-weight="700" fill="#333333">所以本课那句"卡住了"的报错，多半是"换人了、他正在翻册子"，不是故障</text>
</svg>
