<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">一份账本，到底该放几个地方？</text>

  <!-- 左：只放一份 -->
  <text x="205" y="54" text-anchor="middle" font-size="14" font-weight="600" fill="#c62828">现在：全公司就这一本</text>
  <text x="205" y="72" text-anchor="middle" font-size="11.5" fill="#555">账本放在一台机器上</text>

  <g transform="translate(45,88)">
    <rect x="60" y="0" width="150" height="76" rx="8" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="135" y="22" text-anchor="middle" font-size="12" fill="#0d47a1">1 号机器</text>
    <rect x="78" y="30" width="114" height="34" rx="4" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="135" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e65100">订单账本（仅此一份）</text>

    <text x="135" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c62828">这台机器一坏 →</text>
    <text x="135" y="118" text-anchor="middle" font-size="12" fill="#c62828">账本拿不出来，全都停摆</text>
    <text x="135" y="138" text-anchor="middle" font-size="11.5" fill="#c62828">机器修好之前，一单也记不了</text>
  </g>

  <line x1="410" y1="52" x2="410" y2="330" stroke="#bbb" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- 右：放三份 -->
  <text x="615" y="54" text-anchor="middle" font-size="14" font-weight="600" fill="#2e7d32">改造后：同样的账本放三处</text>
  <text x="615" y="72" text-anchor="middle" font-size="11.5" fill="#555">三台机器各存一份，内容一模一样</text>

  <g transform="translate(430,88)">
    <rect x="0" y="0" width="108" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="54" y="20" text-anchor="middle" font-size="11.5" fill="#1b5e20">1 号机器 · 正本</text>
    <rect x="14" y="28" width="80" height="30" rx="4" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="54" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#e65100">订单账本</text>
    <text x="54" y="64" text-anchor="middle" font-size="9.5" fill="#33691e">大家只跟它打交道</text>

    <rect x="128" y="0" width="108" height="70" rx="8" fill="#f5f5f5" stroke="#8b949e" stroke-width="1.5"/>
    <text x="182" y="20" text-anchor="middle" font-size="11.5" fill="#424242">2 号机器 · 抄本</text>
    <rect x="142" y="28" width="80" height="30" rx="4" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="182" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#e65100">订单账本</text>
    <text x="182" y="64" text-anchor="middle" font-size="9.5" fill="#616161">自己过来抄</text>

    <rect x="256" y="0" width="108" height="70" rx="8" fill="#f5f5f5" stroke="#8b949e" stroke-width="1.5"/>
    <text x="310" y="20" text-anchor="middle" font-size="11.5" fill="#424242">3 号机器 · 抄本</text>
    <rect x="270" y="28" width="80" height="30" rx="4" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="310" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#e65100">订单账本</text>
    <text x="310" y="64" text-anchor="middle" font-size="9.5" fill="#616161">自己过来抄</text>

    <line x1="108" y1="44" x2="126" y2="44" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#a2)"/>
    <line x1="236" y1="44" x2="254" y2="44" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#a2)"/>
    <text x="182" y="86" text-anchor="middle" font-size="10" fill="#2e7d32">↑ 正本一改，两份抄本马上跟着抄</text>

    <text x="182" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e7d32">1 号坏了 → 2 号或 3 号立刻顶上</text>
    <text x="182" y="132" text-anchor="middle" font-size="11.5" fill="#2e7d32">账本内容一样，接着记账，没人察觉</text>
  </g>

  <rect x="45" y="300" width="730" height="42" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="410" y="318" text-anchor="middle" font-size="11.5" fill="#555">本课只讲清一件事：把"一份账本"变成"随时待命的三份"，坏一台也不停摆。</text>
  <text x="410" y="334" text-anchor="middle" font-size="11.5" fill="#555">至于"谁有资格顶上""谁来主持交接"，是下面三个知识点的事。</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2e7d32"/>
    </marker>
  </defs>
</svg>
