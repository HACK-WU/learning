<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">同一件事，两种搞法</text>

  <!-- 左：现在 -->
  <text x="200" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#c62828">以前：要自己一件件拼起来</text>
  <text x="200" y="76" text-anchor="middle" font-size="12" fill="#555555">零件多、说明书厚，一步配错就起不来</text>

  <g transform="translate(30,95)">
    <rect x="0" y="0" width="90" height="30" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
    <text x="45" y="20" text-anchor="middle" font-size="11" fill="#b71c1c">先装运行环境</text>

    <rect x="115" y="0" width="90" height="30" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
    <text x="160" y="20" text-anchor="middle" font-size="11" fill="#b71c1c">再装协调服务</text>

    <rect x="230" y="0" width="90" height="30" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
    <text x="275" y="20" text-anchor="middle" font-size="11" fill="#b71c1c">最后装它自己</text>

    <line x1="90" y1="15" x2="113" y2="15" stroke="#c62828" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="205" y1="15" x2="228" y2="15" stroke="#c62828" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="140" y="56" text-anchor="middle" font-size="11" fill="#c62828">三样东西都要自己装、自己配</text>
    <text x="140" y="74" text-anchor="middle" font-size="11" fill="#c62828">还要两两对上版本</text>

    <rect x="0" y="96" width="320" height="34" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
    <text x="160" y="118" text-anchor="middle" font-size="12" fill="#e65100">配错一个参数 → 起不来，还得猜哪里错了</text>
  </g>

  <!-- 分隔 -->
  <line x1="400" y1="60" x2="400" y2="270" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- 右：改造后 -->
  <text x="600" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#2e7d32">现在：整份打包好，一句话端上来</text>
  <text x="600" y="76" text-anchor="middle" font-size="12" fill="#555555">里面什么都有，拿过来就能用</text>

  <g transform="translate(420,95)">
    <rect x="30" y="0" width="250" height="86" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="155" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">一整份：全都装好了</text>
    <text x="155" y="44" text-anchor="middle" font-size="10" fill="#33691e">运行环境 · 协调管理 · 它自己</text>
    <text x="155" y="62" text-anchor="middle" font-size="10" fill="#33691e">版本已经互相配好</text>
    <text x="155" y="78" text-anchor="middle" font-size="10" fill="#33691e">说完一句话就自己跑起来</text>

    <rect x="0" y="34" width="26" height="26" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="13" y="51" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">1</text>
    <line x1="26" y1="47" x2="30" y2="47" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arg)"/>

    <text x="155" y="106" text-anchor="middle" font-size="11" fill="#2e7d32">不用管里面有几样东西</text>
    <text x="155" y="124" text-anchor="middle" font-size="11" fill="#2e7d32">跑起来就能直接收发</text>

    <rect x="30" y="142" width="250" height="34" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="155" y="164" text-anchor="middle" font-size="12" fill="#e65100">练完手不想用了 → 一句话收走，不留垃圾</text>
  </g>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#c62828"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2e7d32"/>
    </marker>
  </defs>
</svg>
