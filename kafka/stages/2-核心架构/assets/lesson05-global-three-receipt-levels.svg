<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">同一件事，三种"算送到"的标准</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#555555">标准定得越低越省事，但出事时越说不清</text>

  <!-- 档1 -->
  <g transform="translate(30,70)">
    <text x="110" y="12" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">① 扔出去就不管</text>
    <rect x="0" y="24" width="70" height="34" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="35" y="45" text-anchor="middle" font-size="11" fill="#0d47a1">发货的</text>
    <rect x="150" y="24" width="70" height="34" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="185" y="45" text-anchor="middle" font-size="11" fill="#e65100">收货的</text>
    <line x1="70" y1="41" x2="148" y2="41" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar)"/>
    <text x="110" y="78" text-anchor="middle" font-size="11" fill="#c62828">不等回话，掉在地上也不知道</text>
    <rect x="0" y="90" width="220" height="30" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
    <text x="110" y="110" text-anchor="middle" font-size="11" fill="#b71c1c">最快，但丢了你永远不会知道</text>
  </g>

  <!-- 档2 -->
  <g transform="translate(290,70)">
    <text x="110" y="12" text-anchor="middle" font-size="13" font-weight="700" fill="#ef6c00">② 一个人签字就算</text>
    <rect x="0" y="24" width="70" height="34" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="35" y="45" text-anchor="middle" font-size="11" fill="#0d47a1">发货的</text>
    <rect x="150" y="24" width="70" height="34" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="185" y="45" text-anchor="middle" font-size="11" fill="#e65100">签收人</text>
    <line x1="70" y1="41" x2="148" y2="41" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="148" y1="52" x2="72" y2="52" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
    <text x="109" y="70" text-anchor="middle" font-size="10" fill="#2e7d32">回话</text>
    <rect x="150" y="78" width="70" height="30" rx="5" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="185" y="97" text-anchor="middle" font-size="10" fill="#757575">备份（还没拿到）</text>
    <rect x="0" y="118" width="220" height="30" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
    <text x="110" y="138" text-anchor="middle" font-size="11" fill="#e65100">签收人一倒，东西跟着没了</text>
  </g>

  <!-- 档3 -->
  <g transform="translate(550,70)">
    <text x="110" y="12" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">③ 全都登记完才算</text>
    <rect x="0" y="24" width="70" height="34" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="35" y="45" text-anchor="middle" font-size="11" fill="#0d47a1">发货的</text>
    <rect x="150" y="18" width="70" height="28" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="185" y="36" text-anchor="middle" font-size="11" fill="#e65100">签收人</text>
    <rect x="150" y="52" width="70" height="28" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="185" y="70" text-anchor="middle" font-size="11" fill="#1b5e20">备份 1</text>
    <rect x="150" y="86" width="70" height="28" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="185" y="104" text-anchor="middle" font-size="11" fill="#1b5e20">备份 2</text>
    <line x1="70" y1="41" x2="148" y2="32" stroke="#333" stroke-width="1.3" marker-end="url(#ar)"/>
    <line x1="70" y1="41" x2="148" y2="66" stroke="#333" stroke-width="1.3" marker-end="url(#ar)"/>
    <line x1="70" y1="41" x2="148" y2="100" stroke="#333" stroke-width="1.3" marker-end="url(#ar)"/>
    <line x1="148" y1="46" x2="72" y2="50" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
    <text x="109" y="66" text-anchor="middle" font-size="10" fill="#2e7d32">都回话</text>
    <rect x="0" y="126" width="220" height="30" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="110" y="146" text-anchor="middle" font-size="11" fill="#1b5e20">最慢，但倒一个也丢不了</text>
  </g>

  <rect x="30" y="230" width="740" height="60" rx="6" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1"/>
  <text x="400" y="254" text-anchor="middle" font-size="12" fill="#333333">从左到右：越靠右越慢，但"出事后说不清"的口子越小</text>
  <text x="400" y="276" text-anchor="middle" font-size="12" fill="#333333">本课要你记住的不是选哪个，而是：这个标准是你自己定的，不是它替你定的</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#c62828"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2e7d32"/>
    </marker>
  </defs>
</svg>
