<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">同一件事，两种记法</text>

  <!-- 左：现在 -->
  <text x="200" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#c62828">现在：一本厚厚的总账</text>
  <text x="200" y="76" text-anchor="middle" font-size="12" fill="#555555">只有一个人能翻，其他人全在排队等</text>

  <g transform="translate(40,95)">
    <rect x="60" y="0" width="130" height="150" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="125" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#b71c1c">总账：一本</text>
    <line x1="70" y1="38" x2="180" y2="38" stroke="#ef9a9a" stroke-width="1"/>
    <text x="125" y="56" text-anchor="middle" font-size="10" fill="#c62828">第 1 笔</text>
    <text x="125" y="76" text-anchor="middle" font-size="10" fill="#c62828">第 2 笔</text>
    <text x="125" y="96" text-anchor="middle" font-size="10" fill="#c62828">第 3 笔</text>
    <text x="125" y="116" text-anchor="middle" font-size="10" fill="#c62828">…</text>
    <text x="125" y="136" text-anchor="middle" font-size="10" fill="#c62828">第 100 万笔</text>

    <rect x="0" y="56" width="46" height="30" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="23" y="76" text-anchor="middle" font-size="10" fill="#0d47a1">读者</text>
    <line x1="46" y1="71" x2="58" y2="71" stroke="#333" stroke-width="1.5" marker-end="url(#a1)"/>

    <rect x="215" y="46" width="46" height="26" rx="5" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1"/>
    <text x="238" y="63" text-anchor="middle" font-size="10" fill="#616161">排队</text>
    <rect x="215" y="80" width="46" height="26" rx="5" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1"/>
    <text x="238" y="97" text-anchor="middle" font-size="10" fill="#616161">排队</text>
    <rect x="215" y="114" width="46" height="26" rx="5" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1"/>
    <text x="238" y="131" text-anchor="middle" font-size="10" fill="#616161">排队</text>

    <text x="120" y="176" text-anchor="middle" font-size="12" fill="#c62828">再多人也挤不进来：账只有一本</text>
  </g>

  <!-- 分隔 -->
  <line x1="400" y1="60" x2="400" y2="290" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- 右：改造后 -->
  <text x="600" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#2e7d32">改造后：拆成几本分册，各放各的地方</text>
  <text x="600" y="76" text-anchor="middle" font-size="12" fill="#555555">几个人可以同时各翻一本，放不下就再加地方</text>

  <g transform="translate(425,95)">
    <rect x="55" y="0" width="62" height="112" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="86" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">分册 1</text>
    <text x="86" y="40" text-anchor="middle" font-size="9" fill="#33691e">第 1 笔</text>
    <text x="86" y="58" text-anchor="middle" font-size="9" fill="#33691e">第 4 笔</text>
    <text x="86" y="76" text-anchor="middle" font-size="9" fill="#33691e">…</text>
    <text x="86" y="100" text-anchor="middle" font-size="9" fill="#33691e">只在这本里有顺序</text>

    <rect x="127" y="0" width="62" height="112" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="158" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">分册 2</text>
    <text x="158" y="40" text-anchor="middle" font-size="9" fill="#33691e">第 2 笔</text>
    <text x="158" y="58" text-anchor="middle" font-size="9" fill="#33691e">第 5 笔</text>
    <text x="158" y="76" text-anchor="middle" font-size="9" fill="#33691e">…</text>
    <text x="158" y="100" text-anchor="middle" font-size="9" fill="#33691e">只在这本里有顺序</text>

    <rect x="199" y="0" width="62" height="112" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="230" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">分册 3</text>
    <text x="230" y="40" text-anchor="middle" font-size="9" fill="#33691e">第 3 笔</text>
    <text x="230" y="58" text-anchor="middle" font-size="9" fill="#33691e">第 6 笔</text>
    <text x="230" y="76" text-anchor="middle" font-size="9" fill="#33691e">…</text>
    <text x="230" y="100" text-anchor="middle" font-size="9" fill="#33691e">只在这本里有顺序</text>

    <rect x="0" y="30" width="46" height="26" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="23" y="47" text-anchor="middle" font-size="10" fill="#0d47a1">读者1</text>
    <rect x="0" y="62" width="46" height="26" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="23" y="79" text-anchor="middle" font-size="10" fill="#0d47a1">读者2</text>
    <rect x="0" y="94" width="46" height="26" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="23" y="111" text-anchor="middle" font-size="10" fill="#0d47a1">读者3</text>

    <line x1="46" y1="43" x2="53" y2="43" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#a2)"/>
    <line x1="46" y1="75" x2="53" y2="75" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#a2)"/>
    <line x1="46" y1="107" x2="53" y2="107" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#a2)"/>

    <text x="140" y="140" text-anchor="middle" font-size="12" fill="#2e7d32">三个人同时各翻一本，不用排队</text>
    <text x="140" y="158" text-anchor="middle" font-size="12" fill="#2e7d32">放不下 → 再添地方，把分册挪过去</text>
    <text x="140" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">对外还是"一整套账"，只在里头分了册</text>
  </g>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#333"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2e7d32"/>
    </marker>
  </defs>
</svg>
