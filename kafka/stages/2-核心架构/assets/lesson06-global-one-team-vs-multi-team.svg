<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="800" height="350" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">同一件事，两种分法</text>

  <!-- 左：一伙人分 -->
  <text x="205" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#1565C0">一伙人：一件事只干一次</text>
  <text x="205" y="76" text-anchor="middle" font-size="12" fill="#555555">三个人各盯一条，谁也不碰别人的</text>

  <g transform="translate(30,95)">
    <rect x="0" y="0" width="46" height="26" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="23" y="18" text-anchor="middle" font-size="10" fill="#0d47a1">传送带1</text>
    <rect x="0" y="36" width="46" height="26" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="23" y="54" text-anchor="middle" font-size="10" fill="#0d47a1">传送带2</text>
    <rect x="0" y="72" width="46" height="26" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="23" y="90" text-anchor="middle" font-size="10" fill="#0d47a1">传送带3</text>

    <rect x="120" y="0" width="80" height="26" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="160" y="18" text-anchor="middle" font-size="10" fill="#e65100">组员A</text>
    <rect x="120" y="36" width="80" height="26" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="160" y="54" text-anchor="middle" font-size="10" fill="#e65100">组员B</text>
    <rect x="120" y="72" width="80" height="26" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="160" y="90" text-anchor="middle" font-size="10" fill="#e65100">组员C</text>

    <line x1="46" y1="13" x2="118" y2="13" stroke="#1565C0" stroke-width="1.5" marker-end="url(#ab)"/>
    <line x1="46" y1="49" x2="118" y2="49" stroke="#1565C0" stroke-width="1.5" marker-end="url(#ab)"/>
    <line x1="46" y1="85" x2="118" y2="85" stroke="#1565C0" stroke-width="1.5" marker-end="url(#ab)"/>

    <text x="100" y="122" text-anchor="middle" font-size="11" fill="#1565C0">一条带只归一个人 → 不会重复干</text>
    <text x="100" y="140" text-anchor="middle" font-size="11" fill="#1565C0">人比带多 → 多出来的人闲着</text>

    <rect x="0" y="156" width="200" height="30" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="100" y="176" text-anchor="middle" font-size="11" fill="#0d47a1">同一伙人内部：分工，不重复</text>
  </g>

  <!-- 分隔 -->
  <line x1="400" y1="60" x2="400" y2="310" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- 右：几伙人各拿各的 -->
  <text x="600" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#2e7d32">几伙人：各自都要一份全的</text>
  <text x="600" y="76" text-anchor="middle" font-size="12" fill="#555555">互不相识、互不影响、各记各的进度</text>

  <g transform="translate(420,95)">
    <rect x="0" y="0" width="46" height="26" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="23" y="18" text-anchor="middle" font-size="10" fill="#0d47a1">传送带1</text>
    <rect x="0" y="36" width="46" height="26" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="23" y="54" text-anchor="middle" font-size="10" fill="#0d47a1">传送带2</text>
    <rect x="0" y="72" width="46" height="26" rx="5" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="23" y="90" text-anchor="middle" font-size="10" fill="#0d47a1">传送带3</text>

    <rect x="94" y="0" width="60" height="26" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="124" y="18" text-anchor="middle" font-size="10" fill="#1b5e20">风控组</text>
    <rect x="94" y="36" width="60" height="26" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="124" y="54" text-anchor="middle" font-size="10" fill="#1b5e20">积分组</text>
    <rect x="94" y="72" width="60" height="26" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="124" y="90" text-anchor="middle" font-size="10" fill="#1b5e20">短信组</text>

    <line x1="46" y1="13" x2="92" y2="13" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#ag2)"/>
    <line x1="46" y1="13" x2="92" y2="49" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#ag2)"/>
    <line x1="46" y1="13" x2="92" y2="85" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#ag2)"/>
    <line x1="46" y1="49" x2="92" y2="13" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#ag2)"/>
    <line x1="46" y1="49" x2="92" y2="49" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#ag2)"/>
    <line x1="46" y1="49" x2="92" y2="85" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#ag2)"/>
    <line x1="46" y1="85" x2="92" y2="13" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#ag2)"/>
    <line x1="46" y1="85" x2="92" y2="49" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#ag2)"/>
    <line x1="46" y1="85" x2="92" y2="85" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#ag2)"/>

    <rect x="176" y="26" width="120" height="46" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="236" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#e65100">东西只有一份</text>
    <text x="236" y="63" text-anchor="middle" font-size="10" fill="#e65100">没有复制出三份</text>

    <text x="110" y="122" text-anchor="middle" font-size="11" fill="#2e7d32">每条带子三伙人都要看一遍</text>
    <text x="110" y="140" text-anchor="middle" font-size="11" fill="#2e7d32">各记各的进度，互不打扰</text>

    <rect x="0" y="156" width="296" height="30" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="148" y="176" text-anchor="middle" font-size="11" fill="#1b5e20">几伙人之间：各拿全量，进度独立</text>
  </g>

  <rect x="30" y="240" width="740" height="56" rx="6" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1"/>
  <text x="400" y="264" text-anchor="middle" font-size="12" fill="#333333">左：怕的是"同一件事被干两遍" → 靠分工解决</text>
  <text x="400" y="286" text-anchor="middle" font-size="12" fill="#333333">右：要的是"同一件事给三个人各干一遍" → 靠分成几伙人解决，不用复制东西</text>

  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#1565C0"/>
    </marker>
    <marker id="ag2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2e7d32"/>
    </marker>
  </defs>
</svg>
