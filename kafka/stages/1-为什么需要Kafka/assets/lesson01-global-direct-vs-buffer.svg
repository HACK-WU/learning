<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">同一件事，两种连法</text>

  <!-- 左：现在 -->
  <text x="200" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#c62828">现在：所有人排成一队</text>
  <text x="200" y="76" text-anchor="middle" font-size="12" fill="#555555">中间任何一个人卡住，后面全跟着等</text>

  <g transform="translate(40,95)">
    <rect x="0" y="0" width="74" height="40" rx="6" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="37" y="25" text-anchor="middle" font-size="12" fill="#0d47a1">客人下单</text>

    <rect x="100" y="0" width="74" height="40" rx="6" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="137" y="25" text-anchor="middle" font-size="12" fill="#0d47a1">扣库存</text>

    <rect x="200" y="0" width="74" height="40" rx="6" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="237" y="25" text-anchor="middle" font-size="12" fill="#0d47a1">收钱</text>

    <rect x="300" y="0" width="80" height="40" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
    <text x="340" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#b71c1c">发通知</text>
    <text x="340" y="34" text-anchor="middle" font-size="10" fill="#b71c1c">这里卡住了</text>

    <line x1="74" y1="20" x2="98" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="174" y1="20" x2="198" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="274" y1="20" x2="298" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="380" y1="20" x2="404" y2="20" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="392" y="14" text-anchor="middle" font-size="15" fill="#c62828">✕</text>

    <text x="200" y="62" text-anchor="middle" font-size="12" fill="#c62828">一个人停下 → 整条队都动不了</text>
    <text x="200" y="82" text-anchor="middle" font-size="12" fill="#c62828">后面的订单 只能放弃</text>
  </g>

  <!-- 分隔 -->
  <line x1="400" y1="60" x2="400" y2="300" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- 右：改造后 -->
  <text x="600" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#2e7d32">改造后：中间放一个筐</text>
  <text x="600" y="76" text-anchor="middle" font-size="12" fill="#555555">下单的人把单子扔进筐就走，后面的活慢慢干</text>

  <g transform="translate(430,95)">
    <rect x="0" y="0" width="74" height="40" rx="6" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
    <text x="37" y="25" text-anchor="middle" font-size="12" fill="#0d47a1">客人下单</text>

    <rect x="100" y="-8" width="110" height="66" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="155" y="14" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">筐：先收着</text>
    <text x="155" y="31" text-anchor="middle" font-size="10" fill="#33691e">单子排队等着</text>
    <text x="155" y="46" text-anchor="middle" font-size="10" fill="#33691e">不会丢</text>

    <line x1="74" y1="20" x2="98" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="236" y="-8" width="74" height="30" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="273" y="12" text-anchor="middle" font-size="11" fill="#e65100">扣库存</text>

    <rect x="236" y="30" width="74" height="30" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="273" y="50" text-anchor="middle" font-size="11" fill="#e65100">收钱</text>

    <rect x="236" y="68" width="74" height="30" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="273" y="88" text-anchor="middle" font-size="11" fill="#b71c1c">发通知（慢）</text>

    <line x1="210" y1="6" x2="234" y2="6" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>
    <line x1="210" y1="44" x2="234" y2="44" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>
    <line x1="210" y1="82" x2="234" y2="82" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>

    <text x="155" y="128" text-anchor="middle" font-size="12" fill="#2e7d32">发通知卡住 → 只压住它自己</text>
    <text x="155" y="146" text-anchor="middle" font-size="12" fill="#2e7d32">下单照常，单子晚点处理完</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
