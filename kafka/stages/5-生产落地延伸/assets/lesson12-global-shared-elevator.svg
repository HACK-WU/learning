<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a237e">同一栋楼住进很多人，两种管法</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#555555">问题不是"有人干了坏事"，而是"有人干了太多正经事"</text>

  <!-- 左：放任 -->
  <text x="200" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#c62828">现在：谁抢到算谁的</text>

  <g transform="translate(35,92)">
    <rect x="0" y="0" width="330" height="132" rx="7" fill="#ffebee" stroke="#c62828" stroke-width="2"/>

    <rect x="16" y="16" width="298" height="26" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.2"/>
    <text x="165" y="34" text-anchor="middle" font-size="11" fill="#e65100">共用的电梯（就这一部）</text>

    <rect x="16" y="52" width="90" height="20" rx="3" fill="#e3f2fd" stroke="#1565C0" stroke-width="1"/>
    <text x="61" y="66" text-anchor="middle" font-size="9" fill="#0d47a1">搬家队（超大件）</text>
    <rect x="16" y="80" width="46" height="20" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="39" y="94" text-anchor="middle" font-size="9" fill="#1b5e20">住户 1</text>
    <rect x="70" y="80" width="46" height="20" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="93" y="94" text-anchor="middle" font-size="9" fill="#1b5e20">住户 2</text>
    <rect x="124" y="80" width="46" height="20" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="147" y="94" text-anchor="middle" font-size="9" fill="#1b5e20">住户 3</text>

    <text x="210" y="66" text-anchor="middle" font-size="14" fill="#c62828">✕ 挤爆</text>
    <text x="210" y="94" text-anchor="middle" font-size="10" fill="#b71c1c">等很久，甚至卡住</text>
    <text x="280" y="80" text-anchor="middle" font-size="10" fill="#b71c1c">干等的</text>

    <text x="165" y="120" text-anchor="middle" font-size="11" fill="#b71c1c">他干的是正经事，只是没人管"每次能搬多少"</text>
  </g>

  <!-- 分隔 -->
  <line x1="400" y1="70" x2="400" y2="290" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- 右：限流 -->
  <text x="600" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#2e7d32">改造后：每人每次能搬多少，先定好</text>

  <g transform="translate(420,92)">
    <rect x="0" y="0" width="330" height="132" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>

    <rect x="16" y="16" width="298" height="26" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.2"/>
    <text x="165" y="34" text-anchor="middle" font-size="11" fill="#1b5e20">共用的电梯（还是这一部，没分开）</text>

    <rect x="16" y="52" width="90" height="20" rx="3" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="61" y="66" text-anchor="middle" font-size="9" fill="#e65100">搬家队：限了额度</text>
    <rect x="16" y="80" width="46" height="20" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="39" y="94" text-anchor="middle" font-size="9" fill="#1b5e20">住户 1 ✓</text>
    <rect x="70" y="80" width="46" height="20" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="93" y="94" text-anchor="middle" font-size="9" fill="#1b5e20">住户 2 ✓</text>
    <rect x="124" y="80" width="46" height="20" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="147" y="94" text-anchor="middle" font-size="9" fill="#1b5e20">住户 3 ✓</text>

    <text x="215" y="66" text-anchor="middle" font-size="11" fill="#2e7d32">正经事照干，只是</text>
    <text x="215" y="82" text-anchor="middle" font-size="11" fill="#2e7d32">搬得慢一点</text>
    <text x="215" y="98" text-anchor="middle" font-size="10" fill="#1b5e20">不是不让搬，是压着速度</text>

    <text x="165" y="120" text-anchor="middle" font-size="11" fill="#1b5e20">别人照样用得上电梯</text>
  </g>

  <rect x="35" y="240" width="730" height="58" rx="6" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1"/>
  <text x="400" y="264" text-anchor="middle" font-size="12" fill="#333333">注意右边那句"搬得慢一点"：被限的人不会收到"不许搬"，只会觉得"今天怎么有点慢"</text>
  <text x="400" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#333333">所以不盯着看，就根本不知道发生了什么</text>
</svg>
