<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <title>任务队列语义与失败出口</title>
  <desc>主任务流按分区分配，失败消息进入分级重试或 DLQ；share groups 是需要单条确认时的待验证选项。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker></defs>
  <rect width="900" height="420" fill="#fff"/>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#333">任务队列不是只有“加消费者”一个旋钮</text>
  <rect x="45" y="105" width="170" height="88" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="130" y="141" text-anchor="middle" font-size="18" fill="#333">主任务 Topic</text><text x="130" y="170" text-anchor="middle" font-size="15" fill="#555">分区分配</text>
  <line x1="215" y1="149" x2="315" y2="149" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="315" y="80" width="215" height="145" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="422" y="114" text-anchor="middle" font-size="18" fill="#333">处理器</text><text x="422" y="146" text-anchor="middle" font-size="15" fill="#555">成功 → 提交</text><text x="422" y="176" text-anchor="middle" font-size="15" fill="#555">失败 → 重试</text><text x="422" y="206" text-anchor="middle" font-size="15" fill="#555">超限 → DLQ</text>
  <line x1="530" y1="149" x2="650" y2="105" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><line x1="530" y1="195" x2="650" y2="240" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="650" y="68" width="200" height="75" rx="12" fill="#fafafa" stroke="#555" stroke-width="2"/><text x="750" y="101" text-anchor="middle" font-size="17" fill="#333">普通消费者组</text><text x="750" y="126" text-anchor="middle" font-size="14" fill="#555">当前稳定基线</text>
  <rect x="650" y="212" width="200" height="75" rx="12" fill="#fff8e1" stroke="#d29922" stroke-width="2"/><text x="750" y="245" text-anchor="middle" font-size="17" fill="#333">share groups</text><text x="750" y="270" text-anchor="middle" font-size="14" fill="#555">Accepted / 需核验</text>
  <rect x="105" y="330" width="690" height="42" rx="10" fill="#f5f5f5" stroke="#999"/><text x="450" y="357" text-anchor="middle" font-size="15" fill="#555">先落实重试 + DLQ + 幂等；再按目标版本与功能开关评估 share groups</text>
</svg>
