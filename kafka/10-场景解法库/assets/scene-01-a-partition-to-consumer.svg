<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="370" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="16" fill="#333333">解法 A：加实例能提升并行度，但上限就是分区数</text>

  <!-- 行 1：3 个实例 -->
  <text x="20" y="83" font-size="13" fill="#333333">3 个实例</text>
  <rect x="110" y="62" width="150" height="40" rx="4" fill="#fafafa" stroke="#333333"/>
  <text x="185" y="87" text-anchor="middle" font-size="13" fill="#333333">orders · 12 个分区</text>
  <line x1="260" y1="82" x2="340" y2="82" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="72" text-anchor="middle" font-size="11" fill="#333333">组内分配</text>
  <rect x="350" y="62" width="150" height="40" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="425" y="87" text-anchor="middle" font-size="12" fill="#333333">C0 → P0-P3</text>
  <rect x="510" y="62" width="150" height="40" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="585" y="87" text-anchor="middle" font-size="12" fill="#333333">C1 → P4-P7</text>
  <rect x="670" y="62" width="150" height="40" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="745" y="87" text-anchor="middle" font-size="12" fill="#333333">C2 → P8-P11</text>
  <text x="860" y="87" font-size="12" fill="#333333">并行度 3</text>

  <!-- 行 2：12 个实例 -->
  <text x="20" y="183" font-size="13" fill="#333333">12 个实例</text>
  <rect x="110" y="162" width="150" height="40" rx="4" fill="#fafafa" stroke="#333333"/>
  <text x="185" y="187" text-anchor="middle" font-size="13" fill="#333333">orders · 12 个分区</text>
  <line x1="260" y1="182" x2="340" y2="182" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="172" text-anchor="middle" font-size="11" fill="#333333">一一对应</text>
  <rect x="350" y="162" width="470" height="40" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="585" y="187" text-anchor="middle" font-size="12" fill="#333333">C0…C11，每个实例恰好 1 个分区</text>
  <text x="860" y="187" font-size="12" fill="#333333">并行度 12</text>

  <!-- 行 3：13 个实例 -->
  <text x="20" y="283" font-size="13" fill="#333333">13 个实例</text>
  <rect x="110" y="262" width="150" height="40" rx="4" fill="#fafafa" stroke="#333333"/>
  <text x="185" y="287" text-anchor="middle" font-size="13" fill="#333333">orders · 12 个分区</text>
  <line x1="260" y1="282" x2="340" y2="282" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="262" width="470" height="40" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="585" y="287" text-anchor="middle" font-size="12" fill="#333333">C0…C11 各 1 个分区</text>
  <rect x="830" y="262" width="60" height="40" rx="4" fill="#c62828"/>
  <text x="860" y="280" text-anchor="middle" font-size="11" fill="#ffffff">C12</text>
  <text x="860" y="294" text-anchor="middle" font-size="11" fill="#ffffff">0 分区</text>

  <rect x="110" y="322" width="780" height="34" rx="4" fill="#fafafa" stroke="#c62828" stroke-dasharray="5 3"/>
  <text x="200" y="344" text-anchor="middle" font-size="12" fill="#c62828">失效点：第 13 个实例完全闲置，再加机器吞吐也不涨</text>
  <text x="620" y="344" text-anchor="middle" font-size="12" fill="#333333">还想继续提并行度 → 只能动分区数（解法 C）</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
