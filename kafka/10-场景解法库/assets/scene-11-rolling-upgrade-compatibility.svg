<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <title>Kafka 滚动升级与协议兼容</title>
  <desc>先验证兼容性和集群健康，逐个升级 broker，最后再执行 feature finalization；协议协商让新旧客户端共存。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker></defs>
  <rect width="900" height="420" fill="#fff"/>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#333">升级是状态机，不是一次性替换二进制</text>
  <rect x="40" y="105" width="165" height="90" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="122" y="141" text-anchor="middle" font-size="18" fill="#333">兼容性检查</text><text x="122" y="171" text-anchor="middle" font-size="15" fill="#555">版本 / KRaft / 客户端</text>
  <line x1="205" y1="150" x2="285" y2="150" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="285" y="82" width="205" height="145" rx="12" fill="#fafafa" stroke="#555" stroke-width="2"/><text x="387" y="116" text-anchor="middle" font-size="18" fill="#333">逐 Broker 滚动</text><text x="387" y="150" text-anchor="middle" font-size="15" fill="#555">停一个 → 健康</text><text x="387" y="180" text-anchor="middle" font-size="15" fill="#555">再下一个</text><text x="387" y="210" text-anchor="middle" font-size="14" fill="#555">旧客户端可协商</text>
  <line x1="490" y1="150" x2="570" y2="150" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="570" y="105" width="145" height="90" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="642" y="141" text-anchor="middle" font-size="18" fill="#333">全员健康</text><text x="642" y="171" text-anchor="middle" font-size="15" fill="#555">ISR / 请求 / 错误</text>
  <line x1="715" y1="150" x2="785" y2="150" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="785" y="105" width="80" height="90" rx="12" fill="#fff8e1" stroke="#d29922" stroke-width="2"/><text x="825" y="141" text-anchor="middle" font-size="16" fill="#333">最终化</text><text x="825" y="171" text-anchor="middle" font-size="13" fill="#555">features</text>
  <rect x="105" y="305" width="690" height="67" rx="12" fill="#f5f5f5" stroke="#999"/><text x="450" y="334" text-anchor="middle" font-size="17" fill="#333">任何一步不健康都暂停推进；不要把“能启动”当成“升级完成”</text><text x="450" y="358" text-anchor="middle" font-size="14" fill="#555">真正不兼容或跨地域迁移时，才切换到双集群迁移</text>
</svg>
