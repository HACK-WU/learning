<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <title>消费者积压与分区并行度</title>
  <desc>流量进入分区，消费者组按分区并行消费；扩实例受分区数上限约束，扩分区需要迁移。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker></defs>
  <rect width="900" height="420" fill="#fff"/>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#333">积压不是“多加几个进程”就能解决</text>
  <rect x="40" y="120" width="150" height="80" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="115" y="155" text-anchor="middle" font-size="19" fill="#333">生产流量</text><text x="115" y="181" text-anchor="middle" font-size="15" fill="#555">10 倍上涨</text>
  <line x1="190" y1="160" x2="270" y2="160" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="270" y="85" width="220" height="150" rx="12" fill="#fafafa" stroke="#555" stroke-width="2"/>
  <text x="380" y="115" text-anchor="middle" font-size="19" fill="#333">Topic</text>
  <rect x="300" y="132" width="160" height="22" fill="#bbdefb"/><rect x="300" y="163" width="160" height="22" fill="#90caf9"/><rect x="300" y="194" width="160" height="22" fill="#64b5f6"/>
  <text x="470" y="149" font-size="14" fill="#555">P0</text><text x="470" y="180" font-size="14" fill="#555">P1</text><text x="470" y="211" font-size="14" fill="#555">P2</text>
  <line x1="490" y1="160" x2="590" y2="160" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="590" y="78" width="270" height="165" rx="12" fill="#fff8e1" stroke="#d29922" stroke-width="2"/>
  <text x="725" y="110" text-anchor="middle" font-size="19" fill="#333">消费者组</text>
  <rect x="620" y="130" width="85" height="42" rx="8" fill="#c8e6c9" stroke="#2e7d32"/><rect x="730" y="130" width="85" height="42" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="662" y="157" text-anchor="middle" font-size="15" fill="#333">实例 A</text><text x="772" y="157" text-anchor="middle" font-size="15" fill="#333">实例 B</text>
  <text x="725" y="208" text-anchor="middle" font-size="15" fill="#9a6700">实例数 ≤ 分区数</text>
  <rect x="90" y="300" width="720" height="64" rx="12" fill="#f5f5f5" stroke="#999"/>
  <text x="450" y="328" text-anchor="middle" font-size="17" fill="#333">先优化处理耗时与下游写入 → 再扩消费者 → 最后用新 Topic 扩分区</text>
  <text x="450" y="352" text-anchor="middle" font-size="14" fill="#555">原地扩分区会改变 key 映射，既有顺序不能自动修复</text>
</svg>
