<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="320" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="16" fill="#333333">解法 A：把“数据快照”换成“事件通知”，消息体自然变小</text>

  <!-- 左：快照 -->
  <rect x="50" y="60" width="370" height="200" rx="4" fill="#fafafa" stroke="#333333"/>
  <text x="235" y="86" text-anchor="middle" font-size="13" fill="#333333">改前：整份快照（约 5 MB）</text>
  <rect x="80" y="100" width="310" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="235" y="119" text-anchor="middle" font-size="11" fill="#333333">订单全字段 + 用户完整资料 + 商品明细</text>
  <rect x="80" y="134" width="310" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="235" y="153" text-anchor="middle" font-size="11" fill="#333333">收货地址 + 优惠券 + 推荐位素材</text>
  <rect x="80" y="168" width="310" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="235" y="187" text-anchor="middle" font-size="11" fill="#333333">（下游只用得到其中 3 个字段）</text>
  <rect x="80" y="206" width="310" height="34" rx="4" fill="#c62828"/>
  <text x="235" y="228" text-anchor="middle" font-size="12" fill="#ffffff">失效点：字段一多就撞 1MB 上限</text>

  <!-- 右：事件 -->
  <rect x="480" y="60" width="370" height="200" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="665" y="86" text-anchor="middle" font-size="13" fill="#333333">改后：事件通知（约 1 KB）</text>
  <rect x="510" y="100" width="310" height="28" rx="4" fill="#fafafa" stroke="#333333"/>
  <text x="665" y="119" text-anchor="middle" font-size="11" fill="#333333">order_id、状态、金额、发生时间</text>
  <rect x="510" y="134" width="310" height="28" rx="4" fill="#fafafa" stroke="#333333"/>
  <text x="665" y="153" text-anchor="middle" font-size="11" fill="#333333">只讲“发生了什么”，不讲“现在长什么样”</text>
  <rect x="510" y="168" width="310" height="28" rx="4" fill="#fafafa" stroke="#333333"/>
  <text x="665" y="187" text-anchor="middle" font-size="11" fill="#333333">需要细节的下游按需回查一次</text>
  <rect x="510" y="206" width="310" height="34" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="665" y="228" text-anchor="middle" font-size="12" fill="#333333">代价：下游多一次回查，且要约定“事件携带什么”</text>

  <rect x="50" y="278" width="800" height="30" rx="4" fill="#fafafa" stroke="#333333"/>
  <text x="450" y="298" text-anchor="middle" font-size="12" fill="#333333">语义损失很低：事件含义没变，只是把“随身带全部数据”换成“通知 + 按需回查”</text>
</svg>
