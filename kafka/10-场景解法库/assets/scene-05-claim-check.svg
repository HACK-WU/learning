<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <title>Claim Check 大消息拆分</title>
  <desc>大对象放入对象存储，Kafka 只携带可校验的引用和业务元数据。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker></defs>
  <rect width="900" height="420" fill="#fff"/>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#333">消息越大，越应该让 Kafka 只传“凭证”</text>
  <rect x="45" y="105" width="190" height="95" rx="12" fill="#fff8e1" stroke="#d29922" stroke-width="2"/><text x="140" y="143" text-anchor="middle" font-size="18" fill="#333">大对象</text><text x="140" y="174" text-anchor="middle" font-size="15" fill="#555">图片 / 报表 / 快照</text>
  <line x1="235" y1="145" x2="330" y2="105" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><line x1="235" y1="175" x2="330" y2="235" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="330" y="72" width="215" height="82" rx="12" fill="#fafafa" stroke="#555" stroke-width="2"/><text x="437" y="108" text-anchor="middle" font-size="18" fill="#333">对象存储</text><text x="437" y="136" text-anchor="middle" font-size="15" fill="#555">内容 + 校验和</text>
  <rect x="330" y="205" width="215" height="82" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="437" y="241" text-anchor="middle" font-size="18" fill="#333">Kafka</text><text x="437" y="269" text-anchor="middle" font-size="15" fill="#555">ID + URL + 版本</text>
  <line x1="545" y1="246" x2="660" y2="175" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><line x1="545" y1="113" x2="660" y2="175" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="660" y="130" width="190" height="95" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="755" y="168" text-anchor="middle" font-size="18" fill="#333">消费者</text><text x="755" y="198" text-anchor="middle" font-size="15" fill="#555">按需取回并校验</text>
  <rect x="105" y="330" width="690" height="42" rx="10" fill="#f5f5f5" stroke="#999"/><text x="450" y="357" text-anchor="middle" font-size="15" fill="#555">代价：多一次存储读取与权限治理；收益：消息大小、回放和 broker 内存压力可控</text>
</svg>
