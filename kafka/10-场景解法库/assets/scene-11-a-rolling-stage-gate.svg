<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif">
  <title>解法 A：原地滚动升级的三个阶段</title>
  <desc>逐 broker 换包，每台通过健康门（broker 可服务、副本回 ISR、指标正常）才动下一台；全部 broker 运行新版本后再最终化 release feature。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" fill="#333333">解法 A：原地滚动升级的三个阶段</text>

  <!-- 阶段一：逐节点滚动 -->
  <text x="20" y="72" font-size="13" fill="#333333">阶段一 · 逐个 broker 换包，每台都要过健康门</text>
  <rect x="20" y="86" width="150" height="72" rx="6" fill="#fafafa" stroke="#333333"/>
  <text x="95" y="110" text-anchor="middle" font-size="12" fill="#333333">broker-1</text>
  <text x="95" y="130" text-anchor="middle" font-size="11" fill="#333333">stop → 换包 → start</text>
  <text x="95" y="148" text-anchor="middle" font-size="11" fill="#333333">ISR 恢复 → 指标正常</text>

  <line x1="170" y1="122" x2="230" y2="122" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="240" y="86" width="150" height="72" rx="6" fill="#fafafa" stroke="#333333"/>
  <text x="315" y="110" text-anchor="middle" font-size="12" fill="#333333">broker-2</text>
  <text x="315" y="130" text-anchor="middle" font-size="11" fill="#333333">同样换包 + 健康门</text>
  <text x="315" y="148" text-anchor="middle" font-size="11" fill="#333333">通过才继续</text>

  <line x1="390" y1="122" x2="450" y2="122" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="86" width="150" height="72" rx="6" fill="#fafafa" stroke="#333333"/>
  <text x="535" y="110" text-anchor="middle" font-size="12" fill="#333333">broker-3</text>
  <text x="535" y="130" text-anchor="middle" font-size="11" fill="#333333">同样换包 + 健康门</text>
  <text x="535" y="148" text-anchor="middle" font-size="11" fill="#333333">通过才继续</text>

  <rect x="650" y="86" width="230" height="72" rx="6" fill="#ffffff" stroke="#c62828" stroke-dasharray="5 3"/>
  <text x="765" y="112" text-anchor="middle" font-size="12" fill="#c62828">失效点 A：ISR 未恢复</text>
  <text x="765" y="134" text-anchor="middle" font-size="11" fill="#c62828">就动下一台 = 同时扩大</text>
  <text x="765" y="152" text-anchor="middle" font-size="11" fill="#c62828">副本风险</text>

  <!-- 阶段二：全部新版本 + 观察窗口 -->
  <line x1="450" y1="180" x2="450" y2="212" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="200" font-size="11" fill="#333333">全部 broker 已换包</text>

  <text x="20" y="244" font-size="13" fill="#333333">阶段二 · 所有 broker 已运行新版本，进入观察窗口（客户端此阶段不变）</text>
  <rect x="20" y="258" width="590" height="60" rx="6" fill="#fafafa" stroke="#333333"/>
  <text x="315" y="282" text-anchor="middle" font-size="12" fill="#333333">观察：broker 可服务 · 副本回 ISR · URP=0 · 业务 LAG 稳定</text>
  <text x="315" y="304" text-anchor="middle" font-size="11" fill="#333333">此阶段“二进制已升级”，但特性/元数据版本尚未最终化</text>

  <!-- 阶段三：最终化 -->
  <line x1="315" y1="318" x2="315" y2="348" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="376" font-size="13" fill="#333333">阶段三 · 最终化 release feature（升级真正收口的一步）</text>
  <rect x="20" y="390" width="590" height="46" rx="6" fill="#fafafa" stroke="#333333"/>
  <text x="315" y="419" text-anchor="middle" font-size="12" fill="#333333">kafka-features.sh upgrade --release-version 4.3</text>

  <rect x="650" y="376" width="230" height="60" rx="6" fill="#ffffff" stroke="#c62828" stroke-dasharray="5 3"/>
  <text x="765" y="400" text-anchor="middle" font-size="12" fill="#c62828">失效点 B：把“最后</text>
  <text x="765" y="420" text-anchor="middle" font-size="12" fill="#c62828">一台启动成功”当成升级完成</text>
</svg>
