<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="16" fill="#333333">解法 D：Kafka 事务的作用域，覆盖不到数据库</text>

  <!-- 事务圈 -->
  <rect x="60" y="60" width="380" height="180" rx="6" fill="#fafafa" stroke="#333333" stroke-dasharray="6 4"/>
  <text x="250" y="86" text-anchor="middle" font-size="13" fill="#333333">Kafka 事务能管住的范围</text>
  <rect x="90" y="104" width="140" height="34" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="160" y="126" text-anchor="middle" font-size="12" fill="#333333">topic A</text>
  <rect x="250" y="104" width="140" height="34" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="320" y="126" text-anchor="middle" font-size="12" fill="#333333">topic B</text>
  <rect x="90" y="152" width="300" height="34" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="240" y="174" text-anchor="middle" font-size="12" fill="#333333">__consumer_offsets（消费位移）</text>
  <text x="250" y="215" text-anchor="middle" font-size="12" fill="#333333">begin → send → sendOffsets → commit</text>
  <text x="250" y="232" text-anchor="middle" font-size="11" fill="#333333">这几件事要么一起生效、要么一起作废</text>

  <!-- 数据库 -->
  <rect x="560" y="60" width="280" height="180" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="700" y="86" text-anchor="middle" font-size="13" fill="#c62828">事务管不到的范围</text>
  <rect x="590" y="104" width="220" height="34" rx="4" fill="#fafafa" stroke="#333333"/>
  <text x="700" y="126" text-anchor="middle" font-size="12" fill="#333333">MySQL 订单表写入</text>
  <rect x="590" y="152" width="220" height="34" rx="4" fill="#fafafa" stroke="#333333"/>
  <text x="700" y="174" text-anchor="middle" font-size="12" fill="#333333">任何外部系统的提交</text>
  <text x="700" y="215" text-anchor="middle" font-size="12" fill="#333333">本地事务 commit 独立发生</text>
  <text x="700" y="232" text-anchor="middle" font-size="11" fill="#333333">崩溃时刻与 Kafka 提交时刻不一致</text>

  <line x1="445" y1="150" x2="555" y2="150" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="500" y="140" text-anchor="middle" font-size="11" fill="#c62828">边界</text>

  <rect x="60" y="260" width="780" height="50" rx="4" fill="#fafafa" stroke="#c62828" stroke-dasharray="5 3"/>
  <text x="450" y="280" text-anchor="middle" font-size="12" fill="#c62828">失效点：用 Kafka 事务包住数据库写入，是把工具边界记错了 —— 崩溃时依然不一致</text>
  <text x="450" y="300" text-anchor="middle" font-size="12" fill="#333333">正确用法只剩 Kafka → Kafka 的流式链路：多个 topic 的输出与消费位移一起提交</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
