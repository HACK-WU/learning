<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>

  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">基础版：发得出去、收得回来，然后交给运气</text>
  <text x="440" y="46" text-anchor="middle" font-size="12" fill="#555555">功能确实实现了 —— 但三条岔路中任何一条发生，行为都不可控</text>

  <!-- 左：程序主体 -->
  <rect x="30" y="88" width="220" height="180" rx="8" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <text x="140" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">程序主体</text>

  <rect x="46" y="126" width="188" height="32" rx="5" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="140" y="146" text-anchor="middle" font-size="11" fill="#0d47a1">producer.send() 循环</text>

  <rect x="46" y="164" width="188" height="32" rx="5" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="140" y="184" text-anchor="middle" font-size="11" fill="#0d47a1">for msg in consumer 循环</text>

  <text x="140" y="214" text-anchor="middle" font-size="10" fill="#2e7d32">happy path：一切正常时很顺</text>
  <text x="140" y="240" text-anchor="middle" font-size="10" fill="#c62828">close() 写在循环外</text>
  <text x="140" y="256" text-anchor="middle" font-size="10" fill="#c62828">→ 永远执行不到</text>

  <line x1="250" y1="178" x2="306" y2="178" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#arg)"/>
  <text x="278" y="164" text-anchor="middle" font-size="9" fill="#2e7d32">正常路径</text>

  <!-- 中：happy path -->
  <rect x="310" y="140" width="180" height="76" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.4"/>
  <text x="400" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">Happy Path</text>
  <text x="400" y="188" text-anchor="middle" font-size="11" fill="#1b5e20">发出去 → 收到了 ✓</text>
  <text x="400" y="206" text-anchor="middle" font-size="10" fill="#1b5e20">本地跑通，一切正常</text>

  <!-- 右：三条岔路 -->
  <rect x="520" y="82" width="330" height="216" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.4"/>
  <text x="685" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">三条岔路：完全没有处理</text>

  <rect x="536" y="120" width="298" height="46" rx="5" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.4"/>
  <text x="685" y="140" text-anchor="middle" font-size="11" fill="#b71c1c">① 发送失败（缓冲区满 / 超时）</text>
  <text x="685" y="158" text-anchor="middle" font-size="10" fill="#c62828">失败被静默丢弃，程序照常打印"已发"</text>

  <rect x="536" y="174" width="298" height="46" rx="5" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.4"/>
  <text x="685" y="194" text-anchor="middle" font-size="11" fill="#b71c1c">② 收到退出信号（SIGTERM / Ctrl+C）</text>
  <text x="685" y="212" text-anchor="middle" font-size="10" fill="#c62828">缓冲区消息全丢，位移未提交</text>

  <rect x="536" y="228" width="298" height="46" rx="5" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.4"/>
  <text x="685" y="248" text-anchor="middle" font-size="11" fill="#b71c1c">③ 单条消息处理抛异常</text>
  <text x="685" y="266" text-anchor="middle" font-size="10" fill="#c62828">循环中断 → 重启又卡在同一条 → 死循环</text>

  <line x1="490" y1="150" x2="518" y2="142" stroke="#c62828" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="490" y1="178" x2="518" y2="178" stroke="#c62828" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="490" y1="206" x2="518" y2="214" stroke="#c62828" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 底部：四个缺陷 -->
  <rect x="30" y="312" width="820" height="72" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
  <text x="50" y="336" font-size="12" font-weight="700" fill="#e65100">四个"只在出事时才暴露"的缺陷：</text>
  <text x="50" y="358" font-size="11" fill="#795548">① 发送结果没人看（失败静默）② 退出信号不可控（缓冲区丢失）③ 消费异常终止循环（卡死循环）</text>
  <text x="50" y="376" font-size="11" fill="#795548">④ 没有健康信号（活着还是卡住，外部无从判断）</text>

  <defs>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2e7d32"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#c62828"/>
    </marker>
  </defs>
</svg>
