<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="880" height="410" fill="#ffffff"/>

  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">基础版：3 副本 + min.insync.replicas=1</text>
  <text x="440" y="46" text-anchor="middle" font-size="12" fill="#555555">副本确实有 3 份了 —— 但保障会在没人察觉时静默退化</text>

  <!-- 生产者 -->
  <rect x="30" y="90" width="160" height="150" rx="8" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <text x="110" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">下单服务</text>
  <rect x="46" y="130" width="128" height="30" rx="5" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="110" y="150" text-anchor="middle" font-size="11" fill="#0d47a1">acks=all</text>
  <text x="110" y="180" text-anchor="middle" font-size="10" fill="#2e7d32">以为"等所有副本"</text>
  <text x="110" y="200" text-anchor="middle" font-size="10" fill="#2e7d32">日志：发送成功 ✓</text>
  <text x="110" y="228" text-anchor="middle" font-size="10" fill="#c62828">实际可能只等 1 份</text>

  <line x1="190" y1="140" x2="246" y2="140" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="246" y1="180" x2="190" y2="180" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arg)"/>
  <text x="218" y="204" text-anchor="middle" font-size="9" fill="#2e7d32">成功回执</text>

  <!-- 三个副本 -->
  <rect x="250" y="80" width="330" height="196" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.4"/>
  <text x="415" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">分区 0 的 3 个副本</text>

  <rect x="266" y="116" width="298" height="32" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="415" y="137" text-anchor="middle" font-size="11" fill="#1b5e20">副本 1（leader 正本）：已确认</text>

  <rect x="266" y="154" width="298" height="32" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.6"/>
  <text x="415" y="175" text-anchor="middle" font-size="11" fill="#b71c1c">副本 2（follower）：掉队被除名 → OSR</text>

  <rect x="266" y="192" width="298" height="32" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.6"/>
  <text x="415" y="213" text-anchor="middle" font-size="11" fill="#b71c1c">副本 3（follower）：掉队被除名 → OSR</text>

  <rect x="266" y="234" width="298" height="30" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
  <text x="415" y="254" text-anchor="middle" font-size="11" fill="#e65100">当前 ISR = {1}　（3 → 1，静默收缩）</text>

  <!-- 熔断值提示 -->
  <rect x="596" y="80" width="254" height="196" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="723" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#880e4f">这一版的关键：熔断值 = 1</text>
  <text x="723" y="134" text-anchor="middle" font-size="11" fill="#6a1b9a">min.insync.replicas = 1（默认）</text>

  <rect x="612" y="146" width="222" height="34" rx="5" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.2"/>
  <text x="723" y="167" text-anchor="middle" font-size="11" fill="#6a1b9a">ISR 剩 1 个 → 照常写入</text>

  <rect x="612" y="188" width="222" height="34" rx="5" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.2"/>
  <text x="723" y="209" text-anchor="middle" font-size="11" fill="#6a1b9a">acks=all 实际等 1 份确认</text>

  <text x="723" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#b71c1c">⚠️ 配置写着 all，保障等于 1</text>

  <!-- 底部：三个风险 -->
  <rect x="30" y="296" width="820" height="94" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
  <text x="50" y="320" font-size="12" font-weight="700" fill="#e65100">这一版的三个静默风险（下一版逐个解决）：</text>
  <text x="50" y="342" font-size="11" fill="#795548">① acks=all 静默退化 —— ISR 只剩 1 个也照常写，业务方拿到的一直是"发送成功"</text>
  <text x="50" y="364" font-size="11" fill="#795548">② 没有熔断 —— 没有任何报错会告诉业务方"现在写入不安全"</text>
  <text x="50" y="384" font-size="11" fill="#795548">③ 故障期行为靠运气 —— 是网络抖一下还是真挂了，事先无从分辨</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#333"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2e7d32"/>
    </marker>
  </defs>
</svg>
