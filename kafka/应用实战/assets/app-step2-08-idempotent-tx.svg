<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="880" height="450" fill="#ffffff"/>

  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">综合版：幂等键去重 + 事务原子提交</text>
  <text x="440" y="46" text-anchor="middle" font-size="12" fill="#555555">高亮 = 本步新增：① 中间多一张账单 ② 三步圈进同一事务 ③ 生产者侧也开幂等与事务</text>

  <!-- 左：同一条消息三次 -->
  <rect x="30" y="86" width="200" height="180" rx="8" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <text x="130" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">同一条订单 order-1001</text>

  <rect x="46" y="124" width="168" height="30" rx="5" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="130" y="144" text-anchor="middle" font-size="11" fill="#0d47a1">第 1 次：查账单 → 没算过</text>

  <rect x="46" y="160" width="168" height="30" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="130" y="180" text-anchor="middle" font-size="11" fill="#1b5e20">第 2 次：查账单 → 跳过</text>

  <rect x="46" y="196" width="168" height="30" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="130" y="216" text-anchor="middle" font-size="11" fill="#1b5e20">第 3 次：查账单 → 跳过</text>

  <text x="130" y="248" text-anchor="middle" font-size="10" fill="#1b5e20">重复了也只算一次</text>

  <line x1="230" y1="176" x2="286" y2="176" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 中：事务框 -->
  <rect x="290" y="76" width="330" height="212" rx="10" fill="#f1f8e9" stroke="#33691e" stroke-width="2.6" stroke-dasharray="7,4"/>
  <text x="455" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#33691e">同一个事务（要么全成，要么全回滚）</text>

  <!-- 新增徽标 1 -->
  <rect x="300" y="56" width="230" height="24" rx="12" fill="#fff176" stroke="#f9a825" stroke-width="1.6"/>
  <text x="415" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#795548">新增①：中间多一张账单</text>

  <rect x="306" y="110" width="298" height="30" rx="5" fill="#ffffff" stroke="#7cb342" stroke-width="1.4"/>
  <text x="455" y="130" text-anchor="middle" font-size="11" fill="#33691e">① 查账单 processed_orders（幂等键 order_id）</text>

  <rect x="306" y="146" width="298" height="30" rx="5" fill="#ffffff" stroke="#7cb342" stroke-width="1.4"/>
  <text x="455" y="166" text-anchor="middle" font-size="11" fill="#33691e">② 加积分 user_points</text>

  <rect x="306" y="182" width="298" height="30" rx="5" fill="#ffffff" stroke="#7cb342" stroke-width="1.4"/>
  <text x="455" y="202" text-anchor="middle" font-size="11" fill="#33691e">③ 记账单 INSERT OR IGNORE</text>

  <rect x="306" y="224" width="298" height="30" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.6"/>
  <text x="455" y="244" text-anchor="middle" font-size="11" fill="#b71c1c">若订单已存在 → ROLLBACK，直接跳过</text>

  <text x="455" y="272" text-anchor="middle" font-size="10" fill="#33691e">不会出现"分加了但没记账单"（否则下次重复还会再加一次）</text>

  <!-- 新增徽标 2 -->
  <rect x="300" y="296" width="310" height="24" rx="12" fill="#fff176" stroke="#f9a825" stroke-width="1.6"/>
  <text x="455" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#795548">新增②：三步圈进同一个事务</text>

  <!-- 右：结果 -->
  <rect x="634" y="110" width="216" height="132" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="742" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">结果：积分只加一次</text>
  <rect x="650" y="148" width="184" height="28" rx="5" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="742" y="167" text-anchor="middle" font-size="11" fill="#1b5e20">第 1 次 → 100（已加）</text>
  <rect x="650" y="180" width="184" height="28" rx="5" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="742" y="199" text-anchor="middle" font-size="11" fill="#1b5e20">第 2 次 → 100（跳过）</text>
  <text x="742" y="232" text-anchor="middle" font-size="10" fill="#1b5e20">重复执行不产生额外效果</text>

  <!-- 生产者侧 -->
  <rect x="30" y="330" width="400" height="104" rx="8" fill="#fff176" stroke="#f9a825" stroke-width="1.6"/>
  <text x="50" y="354" font-size="12" font-weight="700" fill="#795548">新增③：生产者侧也开幂等与事务</text>
  <text x="50" y="376" font-size="11" fill="#5d4037">enable_idempotence=True → 内部重试不产生重复消息</text>
  <text x="50" y="396" font-size="11" fill="#5d4037">transactional_id → 跨重启围栏，跨主题写入原子提交</text>
  <text x="50" y="418" font-size="11" fill="#5d4037">⚠️ 失败用 abort_transaction()，不是 close_transaction()</text>

  <!-- 四条边界 -->
  <rect x="446" y="330" width="404" height="104" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.6"/>
  <text x="466" y="354" font-size="12" font-weight="700" fill="#1a237e">四条容易搞错的边界</text>
  <text x="466" y="376" font-size="11" fill="#283593">① 幂等分三层：生产者 / 业务 / 事务，只开一个挡不全</text>
  <text x="466" y="396" font-size="11" fill="#283593">② 生产者幂等是会话级 —— 重启换 PID，跨重启要靠事务</text>
  <text x="466" y="418" font-size="11" fill="#283593">③ transactional.id 要稳定且唯一；④ 消费端要 read_committed</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
