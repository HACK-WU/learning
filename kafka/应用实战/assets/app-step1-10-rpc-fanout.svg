<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>

  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">基础版：挨个调用 —— 订单服务认识每一个下游</text>
  <text x="440" y="46" text-anchor="middle" font-size="12" fill="#555555">功能照常工作 —— 但耦合在每次需求变更时反复收费</text>

  <!-- 左：订单服务 -->
  <rect x="30" y="110" width="180" height="160" rx="8" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <text x="120" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">订单服务</text>
  <rect x="46" y="148" width="148" height="44" rx="5" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="120" y="168" text-anchor="middle" font-size="10" fill="#0d47a1">认识并直接调用</text>
  <text x="120" y="184" text-anchor="middle" font-size="10" fill="#0d47a1">每一个下游</text>
  <text x="120" y="214" text-anchor="middle" font-size="10" fill="#c62828">下游慢 → 我也慢</text>
  <text x="120" y="234" text-anchor="middle" font-size="10" fill="#c62828">下游挂 → 我也挂</text>
  <text x="120" y="254" text-anchor="middle" font-size="10" fill="#c62828">加下游 → 改我代码</text>

  <!-- 三条调用箭头 -->
  <line x1="210" y1="140" x2="290" y2="120" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="210" y1="180" x2="290" y2="180" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="210" y1="220" x2="290" y2="240" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 中：挨个通知循环 -->
  <rect x="294" y="76" width="200" height="228" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.4"/>
  <text x="394" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">"挨个通知"循环</text>

  <rect x="310" y="112" width="168" height="34" rx="5" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.2"/>
  <text x="394" y="133" text-anchor="middle" font-size="11" fill="#b71c1c">add_points（0.05s）</text>

  <rect x="310" y="152" width="168" height="34" rx="5" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="394" y="173" text-anchor="middle" font-size="11" fill="#b71c1c">risk_check（0.8s）</text>

  <rect x="310" y="192" width="168" height="34" rx="5" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.2"/>
  <text x="394" y="213" text-anchor="middle" font-size="11" fill="#b71c1c">feed_dw（0.2s）</text>

  <text x="394" y="248" text-anchor="middle" font-size="10" fill="#c62828">任何一个慢/报错</text>
  <text x="394" y="266" text-anchor="middle" font-size="10" fill="#c62828">→ 直接影响下单返回值</text>
  <text x="394" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#b71c1c">总耗时 ≈ 1.05 秒</text>

  <!-- 右：三个下游 -->
  <rect x="530" y="76" width="320" height="150" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="690" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">三个下游（被挨个调用）</text>

  <rect x="546" y="112" width="288" height="30" rx="5" fill="#ffffff" stroke="#fbc02d" stroke-width="1.2"/>
  <text x="690" y="132" text-anchor="middle" font-size="11" fill="#e65100">积分服务</text>

  <rect x="546" y="150" width="288" height="30" rx="5" fill="#ffffff" stroke="#fbc02d" stroke-width="1.2"/>
  <text x="690" y="170" text-anchor="middle" font-size="11" fill="#e65100">风控服务（慢，且偶尔超时）</text>

  <rect x="546" y="188" width="288" height="30" rx="5" fill="#ffffff" stroke="#fbc02d" stroke-width="1.2"/>
  <text x="690" y="208" text-anchor="middle" font-size="11" fill="#e65100">数据团队（与下单成败无关）</text>

  <!-- 第四个团队 -->
  <rect x="530" y="240" width="320" height="64" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="690" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#880e4f">新增第四个团队时</text>
  <text x="690" y="282" text-anchor="middle" font-size="11" fill="#6a1b9a">回到订单服务改代码 + 加调用 + 重新发版</text>
  <text x="690" y="298" text-anchor="middle" font-size="10" fill="#6a1b9a">而这次改动对"下单"业务本身毫无价值</text>

  <!-- 底部：三个缺陷 -->
  <rect x="30" y="322" width="820" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
  <text x="50" y="344" font-size="12" font-weight="700" fill="#e65100">三个结构性缺陷：① 空间耦合（认识每个下游）② 同步耦合（下游慢就拖慢下单、报错就失败）③ 时间耦合（无削峰、挂了就丢）</text>
  <text x="50" y="366" font-size="11" fill="#795548">对应知识点：事件驱动架构 EDA —— 下一版用"广播事实"逐个拆掉</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
