<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="860" height="400" fill="#ffffff"/>

  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">基础版：只知道"进度提交到 Kafka 了"，说不清交给谁、存在哪</text>
  <text x="430" y="46" text-anchor="middle" font-size="12" fill="#555555">位移能提交、进度能查到 —— 但中间那一段是个黑盒</text>

  <!-- 消费者 -->
  <rect x="24" y="80" width="120" height="50" rx="7" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.8"/>
  <text x="84" y="110" text-anchor="middle" font-size="11" fill="#0d47a1">消费者 A</text>
  <rect x="24" y="140" width="120" height="50" rx="7" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.8"/>
  <text x="84" y="170" text-anchor="middle" font-size="11" fill="#0d47a1">消费者 B</text>
  <rect x="24" y="200" width="120" height="50" rx="7" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.8"/>
  <text x="84" y="230" text-anchor="middle" font-size="11" fill="#0d47a1">消费者 C</text>

  <line x1="144" y1="105" x2="212" y2="150" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="144" y1="165" x2="212" y2="165" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="144" y1="225" x2="212" y2="180" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 黑盒 -->
  <rect x="216" y="120" width="200" height="90" rx="10" fill="#eceff1" stroke="#546e7a" stroke-width="2.4"/>
  <text x="316" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">黑盒：提交到 Kafka 了</text>
  <text x="316" y="170" text-anchor="middle" font-size="10" fill="#455a64">交给谁？不知道</text>
  <text x="316" y="188" text-anchor="middle" font-size="10" fill="#455a64">写进哪个分区？不知道</text>

  <line x1="416" y1="165" x2="470" y2="165" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 能查到进度 -->
  <rect x="474" y="120" width="180" height="90" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="564" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">能查到进度</text>
  <text x="564" y="170" text-anchor="middle" font-size="10" fill="#1b5e20">CURRENT-OFFSET 500</text>
  <text x="564" y="188" text-anchor="middle" font-size="10" fill="#1b5e20">LAG 110</text>

  <!-- 右侧：出事时的反应 -->
  <rect x="674" y="80" width="162" height="180" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="1.8"/>
  <text x="755" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#b71c1c">出事时的反应</text>
  <text x="692" y="126" font-size="10" fill="#c62828">日志刷"在查了"</text>
  <text x="692" y="144" font-size="10" fill="#c62828">判断不了是正常自愈</text>
  <text x="692" y="160" font-size="10" fill="#c62828">还是真故障</text>
  <text x="692" y="184" font-size="10" fill="#c62828">→ 只能重启了事</text>
  <text x="692" y="204" font-size="10" fill="#c62828">（而重启并不会</text>
  <text x="692" y="220" font-size="10" fill="#c62828">让它更快）</text>

  <!-- 问题 -->
  <rect x="24" y="280" width="812" height="40" rx="8" fill="#fff176" stroke="#f9a825" stroke-width="1.6"/>
  <text x="430" y="305" text-anchor="middle" font-size="11" fill="#795548">问题①：不知道归谁管 → 出问题时不知道该看哪台机器的日志</text>

  <rect x="24" y="328" width="812" height="40" rx="8" fill="#fff176" stroke="#f9a825" stroke-width="1.6"/>
  <text x="430" y="353" text-anchor="middle" font-size="11" fill="#795548">问题②：不知道存在哪、什么格式 → 说不清它为什么不会被写爆</text>

  <!-- 底部 -->
  <rect x="24" y="374" width="812" height="24" rx="6" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.4"/>
  <text x="44" y="391" font-size="11" fill="#283593">这一版的核心变化：位移确实提交成功了 —— 但那本册子是谁在记、记在哪、那个报错要不要修，一概答不上来。</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
