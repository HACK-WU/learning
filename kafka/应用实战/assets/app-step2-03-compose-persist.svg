<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>

  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">综合版：一个文件固化下来，数据落在盘上</text>
  <text x="440" y="46" text-anchor="middle" font-size="12" fill="#555555">高亮 = 本步新增：① 命令收进文件 ② 数据挪到宿主机 ③ 两个端口各司其职</text>

  <!-- 左：compose 文件 -->
  <rect x="30" y="80" width="200" height="160" rx="8" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <text x="130" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">一个文件（compose.yml）</text>
  <rect x="46" y="118" width="168" height="96" rx="5" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="58" y="138" font-size="10" fill="#0d47a1">services.kafka:</text>
  <text x="58" y="154" font-size="10" fill="#0d47a1">  image / ports / environment</text>
  <text x="58" y="170" font-size="10" fill="#0d47a1">  volumes: ./kafka-data:...</text>
  <text x="58" y="186" font-size="10" fill="#0d47a1">  healthcheck: 能列 topic？</text>
  <text x="130" y="226" text-anchor="middle" font-size="10" fill="#2e7d32">改一次，之后只敲 up / down</text>

  <!-- 新增徽标 1 -->
  <rect x="240" y="62" width="180" height="26" rx="13" fill="#fff176" stroke="#f9a825" stroke-width="1.6"/>
  <text x="330" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#795548">新增①：长命令收进文件</text>

  <line x1="230" y1="160" x2="286" y2="160" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 中：容器 -->
  <rect x="290" y="96" width="230" height="150" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="405" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">一个盒子（容器）</text>

  <rect x="304" y="132" width="202" height="30" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="405" y="151" text-anchor="middle" font-size="11" fill="#1b5e20">对外服务端口：9092（你连它）</text>

  <rect x="304" y="168" width="202" height="30" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="405" y="187" text-anchor="middle" font-size="11" fill="#1b5e20">内部协调端口：29093（自己用）</text>

  <rect x="304" y="204" width="202" height="30" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="405" y="223" text-anchor="middle" font-size="11" fill="#1b5e20">数据目录：/var/lib/kafka/data</text>

  <!-- 新增徽标 3 -->
  <rect x="240" y="252" width="180" height="26" rx="13" fill="#fff176" stroke="#f9a825" stroke-width="1.6"/>
  <text x="330" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#795548">新增③：两个端口各司其职</text>

  <!-- 宿主机目录 -->
  <rect x="290" y="286" width="230" height="62" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2.4"/>
  <text x="405" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#1a237e">宿主机 ./kafka-data</text>
  <text x="405" y="328" text-anchor="middle" font-size="10" fill="#283593">盒子删了，东西还在</text>
  <line x1="405" y1="246" x2="405" y2="284" stroke="#3f51b5" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arb)"/>
  <text x="500" y="272" font-size="10" fill="#3f51b5">卷挂载</text>

  <!-- 新增徽标 2 -->
  <rect x="530" y="62" width="196" height="26" rx="13" fill="#fff176" stroke="#f9a825" stroke-width="1.6"/>
  <text x="628" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#795548">新增②：数据挪到宿主机</text>

  <line x1="520" y1="160" x2="576" y2="160" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 右：日常动作 -->
  <rect x="580" y="96" width="270" height="150" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="715" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">日常只需三条命令</text>

  <rect x="596" y="134" width="238" height="30" rx="5" fill="#ffffff" stroke="#fbc02d" stroke-width="1.2"/>
  <text x="715" y="153" text-anchor="middle" font-size="11" fill="#e65100">docker compose up -d（起）</text>

  <rect x="596" y="170" width="238" height="30" rx="5" fill="#ffffff" stroke="#fbc02d" stroke-width="1.2"/>
  <text x="715" y="189" text-anchor="middle" font-size="11" fill="#e65100">health = healthy（确认活着）</text>

  <rect x="596" y="206" width="238" height="30" rx="5" fill="#ffffff" stroke="#fbc02d" stroke-width="1.2"/>
  <text x="715" y="225" text-anchor="middle" font-size="11" fill="#e65100">docker compose down（收工）</text>

  <!-- 底部：验证 -->
  <rect x="30" y="360" width="820" height="46" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="50" y="380" font-size="11" font-weight="700" fill="#1b5e20">关键实证：down → up 之后，--list 仍能列出 orders，--from-beginning 仍能读回 hello / hi</text>
  <text x="50" y="398" font-size="11" fill="#2e7d32">容器是一次性的，数据不是 —— 这就是卷挂载的直接效果</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#333"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3f51b5"/>
    </marker>
  </defs>
</svg>
