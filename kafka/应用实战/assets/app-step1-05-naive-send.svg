<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>

  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">基础版：每条一发、不等回话</text>
  <text x="440" y="46" text-anchor="middle" font-size="12" fill="#555555">消息确实发出去了 —— 但顺序、可靠性、吞吐三项全裸奔</text>

  <!-- 下单服务 -->
  <rect x="30" y="90" width="170" height="150" rx="8" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <text x="115" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">下单服务</text>
  <rect x="46" y="128" width="138" height="26" rx="4" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="115" y="145" text-anchor="middle" font-size="10" fill="#0d47a1">订单 1（u1）</text>
  <rect x="46" y="158" width="138" height="26" rx="4" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="115" y="175" text-anchor="middle" font-size="10" fill="#0d47a1">订单 2（u2）</text>
  <rect x="46" y="188" width="138" height="26" rx="4" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="115" y="205" text-anchor="middle" font-size="10" fill="#0d47a1">订单 3（u1）</text>
  <text x="115" y="228" text-anchor="middle" font-size="10" fill="#c62828">send() 后立刻 flush()</text>

  <line x1="200" y1="165" x2="256" y2="165" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="228" y="152" text-anchor="middle" font-size="9" fill="#c62828">一次一条</text>

  <!-- 攒批格（空的） -->
  <rect x="260" y="120" width="170" height="90" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.4"/>
  <text x="345" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">攒批的地方</text>
  <text x="345" y="168" text-anchor="middle" font-size="10" fill="#c62828">每条都催它马上送</text>
  <text x="345" y="188" text-anchor="middle" font-size="10" fill="#c62828">→ 根本攒不起来</text>

  <line x1="430" y1="150" x2="486" y2="140" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="430" y1="165" x2="486" y2="165" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="430" y1="180" x2="486" y2="190" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 三个分区 -->
  <rect x="490" y="80" width="360" height="180" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="670" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#e65100">3 个分区：谁先到谁进哪格</text>

  <rect x="506" y="116" width="328" height="34" rx="5" fill="#ffffff" stroke="#fbc02d" stroke-width="1.2"/>
  <text x="670" y="137" text-anchor="middle" font-size="11" fill="#e65100">分区 0：订单 2（u2）</text>

  <rect x="506" y="156" width="328" height="34" rx="5" fill="#ffffff" stroke="#fbc02d" stroke-width="1.2"/>
  <text x="670" y="177" text-anchor="middle" font-size="11" fill="#e65100">分区 1：订单 3（u1 已付款）</text>

  <rect x="506" y="196" width="328" height="34" rx="5" fill="#ffffff" stroke="#fbc02d" stroke-width="1.2"/>
  <text x="670" y="217" text-anchor="middle" font-size="11" fill="#e65100">分区 2：订单 1（u1 已下单）</text>

  <text x="670" y="252" text-anchor="middle" font-size="10" fill="#b71c1c">⚠️ u1 的两条分家了 → 顺序失效</text>

  <!-- 底部：三个坑 -->
  <rect x="30" y="290" width="820" height="90" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="1.6"/>
  <text x="50" y="314" font-size="12" font-weight="700" fill="#880e4f">这一版的三个坑（下一版逐个解决）：</text>
  <text x="50" y="336" font-size="11" fill="#6a1b9a">① 乱序 —— 没 key，同用户散在不同分区，而 Kafka 只保证分区内有序</text>
  <text x="50" y="356" font-size="11" fill="#6a1b9a">② 丢了不知情 —— 不拿 send() 的结果，程序照常打印"已发送"</text>
  <text x="50" y="374" font-size="11" fill="#6a1b9a">③ 吞吐低 —— 每条一次 flush()，一次往返只送一条</text>
  <text x="470" y="336" font-size="11" fill="#6a1b9a">对应知识点：分区策略 / acks 与可靠性 / 发送流程（攒批）</text>
  <text x="470" y="356" font-size="11" fill="#6a1b9a">本版是"能发就行"，下一版解决"发得对、发得稳、发得快"</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
