<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>

  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">基础版：points = points + 100 —— 跑几遍加几遍</text>
  <text x="440" y="46" text-anchor="middle" font-size="12" fill="#555555">逻辑最简单 —— 但重复消费直接等于业务错误</text>

  <!-- 左：同一条消息三次 -->
  <rect x="30" y="86" width="220" height="180" rx="8" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <text x="140" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">同一条订单 order-1001</text>

  <rect x="46" y="124" width="188" height="30" rx="5" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="140" y="144" text-anchor="middle" font-size="11" fill="#0d47a1">第 1 次：正常处理</text>

  <rect x="46" y="160" width="188" height="30" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
  <text x="140" y="180" text-anchor="middle" font-size="11" fill="#e65100">第 2 次：重启后重来</text>

  <rect x="46" y="196" width="188" height="30" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
  <text x="140" y="216" text-anchor="middle" font-size="11" fill="#e65100">第 3 次：再均衡后重来</text>

  <text x="140" y="248" text-anchor="middle" font-size="10" fill="#c62828">at-least-once 下，重复是必然</text>

  <line x1="250" y1="176" x2="306" y2="176" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 中：累加语句 -->
  <rect x="310" y="110" width="240" height="132" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.4"/>
  <text x="430" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">加积分的那一句</text>
  <rect x="326" y="148" width="208" height="40" rx="5" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.4"/>
  <text x="430" y="166" text-anchor="middle" font-size="11" fill="#b71c1c">points = points + 100</text>
  <text x="430" y="182" text-anchor="middle" font-size="9" fill="#c62828">（累加，不是赋值）</text>
  <text x="430" y="212" text-anchor="middle" font-size="10" fill="#c62828">不记录"这笔加过没有"</text>
  <text x="430" y="232" text-anchor="middle" font-size="10" fill="#c62828">只看当前值往上加</text>

  <line x1="550" y1="176" x2="606" y2="176" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 右：结果 -->
  <rect x="610" y="110" width="240" height="132" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="730" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#880e4f">结果：积分翻倍</text>
  <rect x="626" y="148" width="208" height="28" rx="5" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.2"/>
  <text x="730" y="167" text-anchor="middle" font-size="11" fill="#6a1b9a">第 1 次 → 100</text>
  <rect x="626" y="180" width="208" height="28" rx="5" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.2"/>
  <text x="730" y="199" text-anchor="middle" font-size="11" fill="#6a1b9a">第 2 次 → 200（错）</text>
  <text x="730" y="232" text-anchor="middle" font-size="10" fill="#b71c1c">多出来的 100，没有任何报错</text>

  <!-- 底部：三个致命处 -->
  <rect x="30" y="286" width="820" height="94" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
  <text x="50" y="310" font-size="12" font-weight="700" fill="#e65100">这一版的三个致命处（下一版逐个解决）：</text>
  <text x="50" y="332" font-size="11" fill="#795548">① 逻辑不幂等 —— 重复执行 N 次结果翻 N 倍，而重复消费在 at-least-once 下必然发生</text>
  <text x="50" y="354" font-size="11" fill="#795548">② 没有"处理过"的痕迹 —— 库里只有"当前多少分"，无法回答"这笔订单算过没有"</text>
  <text x="50" y="374" font-size="11" fill="#795548">③ 补偿成本高 —— 只能人工核对流水退分重算；积分一旦被花掉就是真实资金损失</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
