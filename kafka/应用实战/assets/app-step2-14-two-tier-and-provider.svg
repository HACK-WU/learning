<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="860" height="440" fill="#ffffff"/>

  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">综合版：近处留热、远郊留冷 + 两个保留参数 + 凭据外置</text>
  <text x="430" y="46" text-anchor="middle" font-size="12" fill="#555555">高亮 = 本步新增：① 两层仓库 ② 两级保留 + 上传闸门 ③ 配置里只留引用</text>

  <!-- 本地层 -->
  <rect x="24" y="76" width="240" height="112" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.4"/>
  <text x="144" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">近处：broker 本地（SSD）</text>
  <rect x="42" y="112" width="204" height="30" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="144" y="132" text-anchor="middle" font-size="10" fill="#1b5e20">最近几天 · 热数据（低延迟）</text>
  <rect x="42" y="148" width="204" height="30" rx="6" fill="#f1f8e9" stroke="#7cb342" stroke-width="1.4"/>
  <text x="144" y="168" text-anchor="middle" font-size="10" fill="#33691e">只放非得放在这儿的东西</text>

  <!-- 上传闸门 -->
  <rect x="292" y="102" width="120" height="60" rx="8" fill="#fff176" stroke="#f9a825" stroke-width="2.4"/>
  <text x="352" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#795548">上传闸门</text>
  <text x="352" y="144" text-anchor="middle" font-size="10" fill="#5d4037">先送到远郊，</text>
  <text x="352" y="158" text-anchor="middle" font-size="10" fill="#5d4037">近处才允许清</text>

  <line x1="264" y1="132" x2="290" y2="132" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="412" y1="132" x2="446" y2="132" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 远端层 -->
  <rect x="450" y="76" width="230" height="112" rx="10" fill="#fff176" stroke="#f9a825" stroke-width="2.4"/>
  <text x="565" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#795548">新增①：远郊仓库（对象存储）</text>
  <rect x="468" y="112" width="194" height="30" rx="6" fill="#ffffff" stroke="#f9a825" stroke-width="1.4"/>
  <text x="565" y="132" text-anchor="middle" font-size="10" fill="#5d4037">一年 / 两年前 · 冷数据</text>
  <rect x="468" y="148" width="194" height="30" rx="6" fill="#ffffff" stroke="#f9a825" stroke-width="1.4"/>
  <text x="565" y="168" text-anchor="middle" font-size="10" fill="#5d4037">照样能消费，只是慢一点</text>

  <!-- 消费箭头 -->
  <line x1="680" y1="112" x2="800" y2="112" stroke="#0277bd" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arb)"/>
  <text x="806" y="116" font-size="10" fill="#01579b">回溯可读</text>

  <!-- 两级保留 -->
  <rect x="24" y="208" width="380" height="96" rx="8" fill="#fff176" stroke="#f9a825" stroke-width="2.2"/>
  <text x="214" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#795548">新增②：保留策略从一个变两个</text>
  <text x="44" y="254" font-size="10" fill="#5d4037">local.retention.ms —— 近处留多久（到期只是「取得删除资格」）</text>
  <text x="44" y="272" font-size="10" fill="#5d4037">retention.ms —— 远郊总共留多久（到期删的是远端数据）</text>
  <text x="44" y="292" font-size="10" fill="#c62828">铁律：未上传成功 → 近处必须老老实实留着，不许删</text>

  <!-- 配置外置 -->
  <rect x="424" y="208" width="412" height="96" rx="8" fill="#fff176" stroke="#f9a825" stroke-width="2.2"/>
  <text x="630" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#795548">新增③：配置文件里不再出现明文凭据</text>
  <text x="444" y="254" font-size="10" fill="#5d4037">config.providers=envProvider</text>
  <text x="444" y="272" font-size="10" fill="#5d4037">config.providers.envProvider.class=...EnvVarConfigProvider</text>
  <text x="444" y="292" font-size="10" fill="#5d4037">password=${envProvider:KAFKA_ADMIN_PASSWORD}  ← 只留「去哪儿取」</text>

  <!-- 底部注意 -->
  <rect x="24" y="324" width="812" height="98" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.6"/>
  <text x="44" y="348" font-size="12" font-weight="700" fill="#1a237e">关掉分层存储的正确顺序（顺序错了 broker 起不来）：</text>
  <text x="44" y="370" font-size="11" fill="#283593">① topic 级关闭（只读：remote.log.copy.disable=true，同时把 local.retention.* 设为与 retention.* 相同 或 -2）</text>
  <text x="44" y="390" font-size="11" fill="#283593">② 删除所有启用分层的 topic　③ 最后才设 remote.log.storage.system.enable=false</text>
  <text x="44" y="412" font-size="11" fill="#c62828">另：compacted topic 不支持分层存储（官方 Limitations 第一条）</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#333"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#0277bd"/>
    </marker>
  </defs>
</svg>
