<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.source{fill:#e0f2fe;stroke:#38bdf8;stroke-width:2}.out{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}.title{font:700 26px sans-serif;fill:#0f172a}.label{font:600 18px sans-serif;fill:#0f172a}.small{font:15px sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1100" height="420" rx="24"/>
  <text class="title" x="550" y="48" text-anchor="middle">基础实现：把交接信息散落在四处</text>
  <rect class="source" x="55" y="105" width="190" height="72" rx="14"/><text class="label" x="150" y="137" text-anchor="middle">配置文件</text><text class="small" x="150" y="162" text-anchor="middle">角色与版本</text>
  <rect class="source" x="55" y="205" width="190" height="72" rx="14"/><text class="label" x="150" y="237" text-anchor="middle">拓扑草图</text><text class="small" x="150" y="262" text-anchor="middle">节点与故障域</text>
  <rect class="source" x="290" y="105" width="190" height="72" rx="14"/><text class="label" x="385" y="137" text-anchor="middle">监控截图</text><text class="small" x="385" y="162" text-anchor="middle">健康与容量</text>
  <rect class="source" x="290" y="205" width="190" height="72" rx="14"/><text class="label" x="385" y="237" text-anchor="middle">值班记录</text><text class="small" x="385" y="262" text-anchor="middle">联系人与升级</text>
  <path class="arrow" d="M245 141 L560 178"/><path class="arrow" d="M245 241 L560 205"/><path class="arrow" d="M480 141 L560 178"/><path class="arrow" d="M480 241 L560 205"/>
  <rect class="box" x="560" y="145" width="230" height="95" rx="16"/><text class="label" x="675" y="182" text-anchor="middle">手工笔记</text><text class="small" x="675" y="210" text-anchor="middle">没有统一时间与责任人</text>
  <path class="arrow" d="M790 193 L925 193"/>
  <rect class="out" x="925" y="145" width="130" height="95" rx="16"/><text class="label" x="990" y="182" text-anchor="middle">交接</text><text class="small" x="990" y="210" text-anchor="middle">靠口头补充</text>
  <text class="small" x="550" y="340" text-anchor="middle">本步解决了“信息在哪里”，但还没有解决“现在是否可信、谁负责、异常找谁”。</text>
</svg>
