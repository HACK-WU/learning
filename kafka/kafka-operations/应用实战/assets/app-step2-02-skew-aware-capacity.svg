<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.new{fill:#dcfce7;stroke:#22c55e;stroke-width:2}.out{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}.title{font:700 26px sans-serif;fill:#0f172a}.label{font:600 18px sans-serif;fill:#0f172a}.small{font:15px sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1100" height="420" rx="24"/>
  <text class="title" x="550" y="48" text-anchor="middle">综合实现：按 Broker、保留和增长斜率评审</text>
  <rect class="box" x="35" y="145" width="165" height="95" rx="16"/><text class="label" x="117" y="183" text-anchor="middle">业务申请</text><text class="small" x="117" y="211" text-anchor="middle">吞吐 / 分区 / 保留</text>
  <path class="arrow" d="M200 193 L270 193"/>
  <rect class="new" x="270" y="95" width="190" height="75" rx="14"/><text class="label" x="365" y="128" text-anchor="middle">分区与副本</text><text class="small" x="365" y="153" text-anchor="middle">落点 + 复制因子</text>
  <rect class="new" x="270" y="220" width="190" height="75" rx="14"/><text class="label" x="365" y="253" text-anchor="middle">保留与段</text><text class="small" x="365" y="278" text-anchor="middle">天数 + 增长斜率</text>
  <path class="arrow" d="M460 132 L535 193"/><path class="arrow" d="M460 257 L535 213"/>
  <rect class="new" x="535" y="145" width="205" height="95" rx="16"/><text class="label" x="637" y="183" text-anchor="middle">逐 Broker 预算</text><text class="small" x="637" y="211" text-anchor="middle">最大值 + 安全余量</text>
  <path class="arrow" d="M740 193 L835 193"/>
  <rect class="out" x="835" y="115" width="230" height="155" rx="16"/><text class="label" x="950" y="153" text-anchor="middle">容量评审结论</text><text class="small" x="950" y="183" text-anchor="middle">通过 / 调整分区</text><text class="small" x="950" y="208" text-anchor="middle">预警日期 / 负责人</text><text class="small" x="950" y="233" text-anchor="middle">保留回退方案</text>
  <text class="small" x="550" y="350" text-anchor="middle">本步新增逐 Broker 视角和预警出口，避免平均值掩盖热点与副本不均。</text>
</svg>
