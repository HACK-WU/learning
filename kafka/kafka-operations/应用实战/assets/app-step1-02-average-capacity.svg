<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.source{fill:#e0f2fe;stroke:#38bdf8;stroke-width:2}.warn{fill:#fee2e2;stroke:#ef4444;stroke-width:2}.title{font:700 26px sans-serif;fill:#0f172a}.label{font:600 18px sans-serif;fill:#0f172a}.small{font:15px sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1100" height="420" rx="24"/>
  <text class="title" x="550" y="48" text-anchor="middle">基础实现：用集群平均值判断容量</text>
  <rect class="source" x="60" y="145" width="180" height="95" rx="16"/><text class="label" x="150" y="183" text-anchor="middle">业务申请</text><text class="small" x="150" y="211" text-anchor="middle">吞吐 + 分区数</text>
  <path class="arrow" d="M240 193 L340 193"/>
  <rect class="box" x="340" y="145" width="220" height="95" rx="16"/><text class="label" x="450" y="183" text-anchor="middle">平均增长</text><text class="small" x="450" y="211" text-anchor="middle">总量 ÷ Broker 数</text>
  <path class="arrow" d="M560 193 L660 193"/>
  <rect class="box" x="660" y="145" width="190" height="95" rx="16"/><text class="label" x="755" y="183" text-anchor="middle">平均磁盘</text><text class="small" x="755" y="211" text-anchor="middle">看起来还有余量</text>
  <path class="arrow" d="M850 193 L945 193"/>
  <rect class="warn" x="945" y="145" width="120" height="95" rx="16"/><text class="label" x="1005" y="183" text-anchor="middle">误判</text><text class="small" x="1005" y="211" text-anchor="middle">热点被隐藏</text>
  <text class="small" x="550" y="340" text-anchor="middle">本步解决了“能不能粗算”，但没有回答副本如何落在每个 Broker、保留策略如何消耗空间。</text>
</svg>
