<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.source{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.warn{fill:#fee2e2;stroke:#ef4444;stroke-width:2}.title{font:700 26px sans-serif;fill:#0f172a}.label{font:600 18px sans-serif;fill:#0f172a}.small{font:15px sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1100" height="420" rx="24"/>
  <text class="title" x="550" y="48" text-anchor="middle">基础实现：把所有指标堆进一个看板</text>
  <rect class="source" x="50" y="145" width="190" height="95" rx="16"/><text class="label" x="145" y="183" text-anchor="middle">采集结果</text><text class="small" x="145" y="211" text-anchor="middle">很多曲线</text>
  <path class="arrow" d="M240 193 L340 193"/>
  <rect class="box" x="340" y="145" width="210" height="95" rx="16"/><text class="label" x="445" y="183" text-anchor="middle">单页 Dashboard</text><text class="small" x="445" y="211" text-anchor="middle">按指标排列</text>
  <path class="arrow" d="M550 193 L650 193"/>
  <rect class="box" x="650" y="145" width="210" height="95" rx="16"/><text class="label" x="755" y="183" text-anchor="middle">告警规则</text><text class="small" x="755" y="211" text-anchor="middle">只写阈值</text>
  <path class="arrow" d="M860 193 L945 193"/>
  <rect class="warn" x="945" y="125" width="120" height="135" rx="16"/><text class="label" x="1005" y="163" text-anchor="middle">噪声</text><text class="small" x="1005" y="193" text-anchor="middle">谁受影响?</text><text class="small" x="1005" y="219" text-anchor="middle">先做什么?</text>
  <text class="small" x="550" y="340" text-anchor="middle">本步解决了“能看到指标”，但没有把来源、范围、持续时间和动作连起来。</text>
</svg>
