<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.source{fill:#e0f2fe;stroke:#38bdf8;stroke-width:2}.warn{fill:#fee2e2;stroke:#ef4444;stroke-width:2}.title{font:700 26px sans-serif;fill:#0f172a}.label{font:600 18px sans-serif;fill:#0f172a}.small{font:15px sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1100" height="420" rx="24"/>
  <text class="title" x="550" y="48" text-anchor="middle">基础实现：一次性把旧节点数据全部搬走</text>
  <rect class="source" x="50" y="135" width="190" height="115" rx="16"/><text class="label" x="145" y="175" text-anchor="middle">旧 Broker</text><text class="small" x="145" y="204" text-anchor="middle">大量副本</text><text class="small" x="145" y="229" text-anchor="middle">持续承载流量</text>
  <path class="arrow" d="M240 193 L430 193"/>
  <rect class="box" x="430" y="135" width="230" height="115" rx="16"/><text class="label" x="545" y="175" text-anchor="middle">一次性重分配</text><text class="small" x="545" y="204" text-anchor="middle">大 JSON + 无限流</text><text class="small" x="545" y="229" text-anchor="middle">网络与磁盘同时升高</text>
  <path class="arrow" d="M660 193 L850 193"/>
  <rect class="source" x="850" y="135" width="190" height="115" rx="16"/><text class="label" x="945" y="175" text-anchor="middle">新 Broker</text><text class="small" x="945" y="204" text-anchor="middle">接收突发搬运</text><text class="small" x="945" y="229" text-anchor="middle">业务余量变薄</text>
  <rect class="warn" x="385" y="300" width="320" height="54" rx="14"/><text class="label" x="545" y="334" text-anchor="middle">失败时：难以判断停在哪里、如何回退</text>
  <text class="small" x="550" y="390" text-anchor="middle">本步解决了“副本能移动”，但没有解决搬迁速率、分批验收和中途暂停。</text>
</svg>
