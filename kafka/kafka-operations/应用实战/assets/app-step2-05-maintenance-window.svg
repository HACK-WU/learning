<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.new{fill:#dcfce7;stroke:#22c55e;stroke-width:2}.out{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}.stop{fill:#fee2e2;stroke:#ef4444;stroke-width:2}.title{font:700 26px sans-serif;fill:#0f172a}.label{font:600 18px sans-serif;fill:#0f172a}.small{font:15px sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1100" height="420" rx="24"/>
  <text class="title" x="550" y="48" text-anchor="middle">综合实现：按对象分支维护，并保留暂停出口</text>
  <rect class="box" x="25" y="155" width="150" height="75" rx="14"/><text class="label" x="100" y="188" text-anchor="middle">Prepare</text><text class="small" x="100" y="213" text-anchor="middle">健康与余量</text>
  <path class="arrow" d="M175 193 L230 193"/>
  <rect class="new" x="230" y="95" width="180" height="75" rx="14"/><text class="label" x="320" y="128" text-anchor="middle">Broker 维护</text><text class="small" x="320" y="153" text-anchor="middle">优雅退出 / 恢复</text>
  <rect class="new" x="230" y="180" width="180" height="75" rx="14"/><text class="label" x="320" y="213" text-anchor="middle">Controller 维护</text><text class="small" x="320" y="238" text-anchor="middle">多数 / 成员状态</text>
  <rect class="new" x="230" y="265" width="180" height="75" rx="14"/><text class="label" x="320" y="298" text-anchor="middle">目录 / 换盘</text><text class="small" x="320" y="323" text-anchor="middle">数据面 / 元数据面</text>
  <path class="arrow" d="M410 132 L490 193"/><path class="arrow" d="M410 217 L490 193"/><path class="arrow" d="M410 302 L490 193"/>
  <rect class="new" x="490" y="155" width="190" height="75" rx="14"/><text class="label" x="585" y="188" text-anchor="middle">Observe + Verify</text><text class="small" x="585" y="213" text-anchor="middle">服务 / 副本 / 控制面</text>
  <path class="arrow" d="M680 193 L750 193"/>
  <rect class="out" x="750" y="95" width="155" height="75" rx="14"/><text class="label" x="827" y="128" text-anchor="middle">继续下一步</text><text class="small" x="827" y="153" text-anchor="middle">基线恢复</text>
  <rect class="stop" x="750" y="265" width="155" height="75" rx="14"/><text class="label" x="827" y="298" text-anchor="middle">暂停并升级</text><text class="small" x="827" y="323" text-anchor="middle">多数 / ISR 恶化</text>
  <path class="arrow" d="M680 210 C715 235 720 290 750 302"/>
  <text class="small" x="550" y="380" text-anchor="middle">本步新增对象分支、验证判据和异常出口，让维护动作可以停在安全边界。</text>
</svg>
