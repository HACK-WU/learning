<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 690" role="img" aria-labelledby="title desc">
  <title id="title">Topic 分区与 Broker 空间布局</title>
  <desc id="desc">一个 Topic 的四个分区分别在三个 Broker 上保存三份，每个分区有一份 leader 和两份 follower。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1260" height="690" rx="28" fill="url(#bg)"/>
  <text x="630" y="56" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#0f172a">Topic 分区与 Broker 空间布局</text>
  <text x="630" y="88" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">同一条分区通道的三份副本，分别落在不同 Broker 上</text>

  <g filter="url(#shadow)">
    <rect x="48" y="135" width="205" height="435" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="320" y="135" width="260" height="435" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="630" y="135" width="260" height="435" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="940" y="135" width="260" height="435" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  </g>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
    <text x="150" y="180" text-anchor="middle" font-size="23" font-weight="700">Topic A</text>
    <text x="450" y="180" text-anchor="middle" font-size="23" font-weight="700">Broker 1</text>
    <text x="760" y="180" text-anchor="middle" font-size="23" font-weight="700">Broker 2</text>
    <text x="1070" y="180" text-anchor="middle" font-size="23" font-weight="700">Broker 3</text>

    <rect x="82" y="215" width="138" height="58" rx="12" fill="#e0e7ff"/>
    <rect x="82" y="305" width="138" height="58" rx="12" fill="#e0e7ff"/>
    <rect x="82" y="395" width="138" height="58" rx="12" fill="#e0e7ff"/>
    <rect x="82" y="485" width="138" height="58" rx="12" fill="#e0e7ff"/>
    <text x="151" y="251" text-anchor="middle" font-size="20" font-weight="700">Partition 0</text>
    <text x="151" y="341" text-anchor="middle" font-size="20" font-weight="700">Partition 1</text>
    <text x="151" y="431" text-anchor="middle" font-size="20" font-weight="700">Partition 2</text>
    <text x="151" y="521" text-anchor="middle" font-size="20" font-weight="700">Partition 3</text>
  </g>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">
    <g>
      <rect x="354" y="215" width="192" height="58" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="664" y="215" width="192" height="58" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <rect x="974" y="215" width="192" height="58" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="450" y="240" fill="#1e3a8a" font-weight="700">P0 · leader</text>
      <text x="450" y="261" fill="#475569" font-size="14">一份副本</text>
      <text x="760" y="240" fill="#334155" font-weight="700">P0 · follower</text>
      <text x="760" y="261" fill="#475569" font-size="14">一份副本</text>
      <text x="1070" y="240" fill="#334155" font-weight="700">P0 · follower</text>
      <text x="1070" y="261" fill="#475569" font-size="14">一份副本</text>
    </g>
    <g>
      <rect x="354" y="305" width="192" height="58" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <rect x="664" y="305" width="192" height="58" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="974" y="305" width="192" height="58" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="450" y="330" fill="#334155" font-weight="700">P1 · follower</text>
      <text x="450" y="351" fill="#475569" font-size="14">一份副本</text>
      <text x="760" y="330" fill="#1e3a8a" font-weight="700">P1 · leader</text>
      <text x="760" y="351" fill="#475569" font-size="14">一份副本</text>
      <text x="1070" y="330" fill="#334155" font-weight="700">P1 · follower</text>
      <text x="1070" y="351" fill="#475569" font-size="14">一份副本</text>
    </g>
    <g>
      <rect x="354" y="395" width="192" height="58" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <rect x="664" y="395" width="192" height="58" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <rect x="974" y="395" width="192" height="58" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="450" y="420" fill="#334155" font-weight="700">P2 · follower</text>
      <text x="450" y="441" fill="#475569" font-size="14">一份副本</text>
      <text x="760" y="420" fill="#334155" font-weight="700">P2 · follower</text>
      <text x="760" y="441" fill="#475569" font-size="14">一份副本</text>
      <text x="1070" y="420" fill="#1e3a8a" font-weight="700">P2 · leader</text>
      <text x="1070" y="441" fill="#475569" font-size="14">一份副本</text>
    </g>
    <g>
      <rect x="354" y="485" width="192" height="58" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="664" y="485" width="192" height="58" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <rect x="974" y="485" width="192" height="58" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="450" y="510" fill="#1e3a8a" font-weight="700">P3 · leader</text>
      <text x="450" y="531" fill="#475569" font-size="14">一份副本</text>
      <text x="760" y="510" fill="#334155" font-weight="700">P3 · follower</text>
      <text x="760" y="531" fill="#475569" font-size="14">一份副本</text>
      <text x="1070" y="510" fill="#334155" font-weight="700">P3 · follower</text>
      <text x="1070" y="531" fill="#475569" font-size="14">一份副本</text>
    </g>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 220 244 C 270 244, 292 244, 345 244"/>
    <path d="M 220 334 C 270 334, 292 334, 345 334"/>
    <path d="M 220 424 C 270 424, 292 424, 345 424"/>
    <path d="M 220 514 C 270 514, 292 514, 345 514"/>
  </g>

  <rect x="180" y="610" width="900" height="45" rx="22" fill="#0f172a"/>
  <text x="630" y="639" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#ffffff">分区决定并行通道；复制因子决定每条通道保留几份；leader 是当前服务入口</text>
  <rect x="930" y="101" width="18" height="18" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="958" y="116" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">蓝色 = leader</text>
  <rect x="1065" y="101" width="18" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1093" y="116" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">灰色 = follower</text>
</svg>
