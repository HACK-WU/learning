<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="280" fill="#ffffff"/>
  <text x="36" y="40" fill="#1f2328" font-size="21" font-weight="700">阶段 1 · 集群运维基线</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/></marker></defs>
  <path d="M276 145 L320 145" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <g><rect x="36" y="82" width="240" height="128" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/><text x="156" y="112" text-anchor="middle" fill="#0969da" font-size="15" font-weight="700">课 1</text><text x="156" y="138" text-anchor="middle" fill="#1f2328" font-size="13">运维全景与集群基线</text><text x="156" y="166" text-anchor="middle" fill="#57606a" font-size="11">对象 → 故障域 → SLO</text><text x="156" y="190" text-anchor="middle" fill="#57606a" font-size="11">先定义“健康”</text></g>
  <g><rect x="324" y="82" width="240" height="128" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><text x="444" y="112" text-anchor="middle" fill="#1a7f37" font-size="15" font-weight="700">课 2</text><text x="444" y="138" text-anchor="middle" fill="#1f2328" font-size="13">存储、容量与分区规划</text><text x="444" y="166" text-anchor="middle" fill="#57606a" font-size="11">分区 → 日志 → 容量</text><text x="444" y="190" text-anchor="middle" fill="#57606a" font-size="11">再计算“能承受多少”</text></g>
  <g><rect x="612" y="82" width="240" height="128" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/><text x="732" y="124" text-anchor="middle" fill="#9a6700" font-size="15" font-weight="700">阶段产出</text><text x="732" y="154" text-anchor="middle" fill="#1f2328" font-size="13">集群基线表</text><text x="732" y="180" text-anchor="middle" fill="#57606a" font-size="11">每次改动前的参照物</text></g>
</svg>
