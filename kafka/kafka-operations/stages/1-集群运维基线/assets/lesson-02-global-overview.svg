<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">一座仓库如何长期接住货物</title>
  <desc id="desc">货物持续到来，被分到多个小仓库并保留多份，旧货按规则处理，同时根据增长计划扩建。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5f0"/>
    </linearGradient>
    <linearGradient id="inbound" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="plan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#0f172a">一座仓库如何长期接住货物</text>
  <text x="600" y="91" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">零术语全局图：先看全貌，再进入正式叫法</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="275" height="280" rx="22" fill="url(#inbound)" stroke="#93c5fd" stroke-width="2"/>
    <rect x="462" y="125" width="300" height="320" rx="22" fill="url(#store)" stroke="#86efac" stroke-width="2"/>
    <rect x="894" y="145" width="250" height="280" rx="22" fill="url(#plan)" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
    <text x="192" y="193" text-anchor="middle" font-size="24" font-weight="700">货物不断到来</text>
    <text x="92" y="245" font-size="18">• 速度有高峰</text>
    <text x="92" y="292" font-size="18">• 每天都会增加</text>
    <text x="92" y="339" font-size="18">• 不能无限堆积</text>
    <text x="92" y="386" font-size="16" fill="#475569">先量清楚“进来多少”</text>

    <text x="612" y="177" text-anchor="middle" font-size="24" font-weight="700">仓库分开</text>
    <rect x="507" y="210" width="210" height="52" rx="12" fill="#ffffff" fill-opacity=".75"/>
    <rect x="507" y="278" width="210" height="52" rx="12" fill="#ffffff" fill-opacity=".75"/>
    <rect x="507" y="346" width="210" height="52" rx="12" fill="#ffffff" fill-opacity=".75"/>
    <text x="612" y="243" text-anchor="middle" font-size="17">分到多间小仓库</text>
    <text x="612" y="311" text-anchor="middle" font-size="17">重要货物留多份</text>
    <text x="612" y="379" text-anchor="middle" font-size="17">旧货按规则处理</text>

    <text x="1019" y="193" text-anchor="middle" font-size="24" font-weight="700">提前做计划</text>
    <text x="924" y="245" font-size="18">• 算今天进多少</text>
    <text x="924" y="292" font-size="18">• 算还能放多久</text>
    <text x="924" y="339" font-size="18">• 算何时要扩建</text>
    <text x="924" y="386" font-size="16" fill="#475569">在堆满之前留下余量</text>
  </g>

  <path d="M 330 285 C 375 285, 410 285, 455 285" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 767 285 C 812 285, 850 285, 887 285" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="395" y="263" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#475569">分开与留存</text>
  <text x="828" y="263" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#475569">测量与决策</text>

  <rect x="195" y="478" width="810" height="46" rx="23" fill="#ffffff" fill-opacity=".82" stroke="#cbd5e1"/>
  <text x="600" y="507" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#334155">本课的任务：把“持续进来的货物”换算成分开、空间、余量和扩建信号</text>
</svg>
