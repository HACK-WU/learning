<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="sans-serif">
  <rect width="880" height="520" fill="#fbfcfd"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2933">事故分诊：从模糊抱怨到可验证假设</text>
  <text x="440" y="52" text-anchor="middle" font-size="12" fill="#6b7785">先分流到层，再找该层的第一个只读证据</text>

  <rect x="330" y="72" width="220" height="48" rx="8" fill="#1f2933"/>
  <text x="440" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">收到报障："消息不对劲"</text>

  <rect x="30" y="152" width="180" height="70" rx="8" fill="#e8f2ff" stroke="#3f7fd4"/>
  <text x="120" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c4f8a">写不进去</text>
  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#2a4a6b">生产端报错/超时</text>
  <text x="120" y="216" text-anchor="middle" font-size="11" fill="#2a4a6b">查 UnderMinIsr</text>

  <rect x="240" y="152" width="180" height="70" rx="8" fill="#fff4e0" stroke="#e0a800"/>
  <text x="330" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6100">读不出来/慢</text>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#6b4f14">消费滞后/卡住</text>
  <text x="330" y="216" text-anchor="middle" font-size="11" fill="#6b4f14">查 LAG + 组成员</text>

  <rect x="450" y="152" width="180" height="70" rx="8" fill="#ffe8e8" stroke="#d9534f"/>
  <text x="540" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b2c2c">节点/副本异常</text>
  <text x="540" y="200" text-anchor="middle" font-size="11" fill="#6b3a3a">掉线/ISR 收缩</text>
  <text x="540" y="216" text-anchor="middle" font-size="11" fill="#6b3a3a">查 URP + ISR</text>

  <rect x="660" y="152" width="180" height="70" rx="8" fill="#f0e8f7" stroke="#7d5ba6"/>
  <text x="750" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a2f6b">控制面异常</text>
  <text x="750" y="200" text-anchor="middle" font-size="11" fill="#4a3a5a">改不动/Topic 异常</text>
  <text x="750" y="216" text-anchor="middle" font-size="11" fill="#4a3a5a">查仲裁 + Controller</text>

  <line x1="440" y1="120" x2="440" y2="152" stroke="#8a949e" stroke-width="2"/>
  <line x1="440" y1="152" x2="120" y2="152" stroke="#8a949e" stroke-width="2"/>
  <line x1="440" y1="152" x2="750" y2="152" stroke="#8a949e" stroke-width="2"/>
  <line x1="120" y1="120" x2="120" y2="152" stroke="#8a949e" stroke-width="2"/>
  <line x1="330" y1="120" x2="330" y2="152" stroke="#8a949e" stroke-width="2"/>
  <line x1="540" y1="120" x2="540" y2="152" stroke="#8a949e" stroke-width="2"/>
  <line x1="750" y1="120" x2="750" y2="152" stroke="#8a949e" stroke-width="2"/>
  <line x1="120" y1="120" x2="750" y2="120" stroke="#8a949e" stroke-width="2"/>

  <rect x="30" y="256" width="810" height="110" rx="8" fill="#f2f4f6" stroke="#8a949e"/>
  <text x="46" y="280" font-size="13" font-weight="bold" fill="#3d4752">每次分诊都要写下这四件事（缺一件就不算分诊完）</text>
  <text x="46" y="304" font-size="12" fill="#5a636b">① 症状：谁、什么时候、看到什么（要具体到 Topic / Group / 分区，不要只写"卡了"）</text>
  <text x="46" y="326" font-size="12" fill="#5a636b">② 假设：这条症状最可能属于上面四层里的哪一层，为什么</text>
  <text x="46" y="348" font-size="12" fill="#5a636b">③ 验证：用哪条只读命令能证明或推翻它（不改动系统）</text>
  <text x="46" y="370" font-size="12" fill="#5a636b">④ 出口：验证不了/解决不了时，升级给谁、带上哪些证据</text>

  <rect x="30" y="392" width="390" height="100" rx="8" fill="#eaf7ec" stroke="#3fa35a"/>
  <text x="225" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6b33">先做的动作（低风险、可并行）</text>
  <text x="46" y="440" font-size="12" fill="#2a5a3a">• 采指标快照 + 保留日志时间窗</text>
  <text x="46" y="460" font-size="12" fill="#2a5a3a">• 记录最近变更（发布/扩缩容/配置改动）</text>
  <text x="46" y="480" font-size="12" fill="#2a5a3a">• 暂停高风险变更，避免叠加故障</text>

  <rect x="450" y="392" width="390" height="100" rx="8" fill="#ffe8e8" stroke="#d9534f"/>
  <text x="645" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b2c2c">先别做的动作（需授权/有不可逆风险）</text>
  <text x="466" y="440" font-size="12" fill="#6b3a3a">• 删 Topic、清数据、重置 offset</text>
  <text x="466" y="460" font-size="12" fill="#6b3a3a">• 放宽 min.insync.replicas 或开 unclean 选举</text>
  <text x="466" y="480" font-size="12" fill="#6b3a3a">• 重启还没搞清原因的节点</text>
</svg>
