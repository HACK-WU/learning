<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="sans-serif">
  <rect width="900" height="400" fill="#fbfcfe"/>

  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b4c">安全变更四阶段：先加门，不锁门</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#5a6b85">每个阶段下方是该阶段的回滚动作 —— 每个阶段都必须能单独回退</text>

  <!-- 阶段 1 -->
  <rect x="30" y="80" width="190" height="150" rx="8" fill="#e8f4fd" stroke="#3d7ea6" stroke-width="2"/>
  <text x="125" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a4d6d">阶段一 加门</text>
  <text x="125" y="128" text-anchor="middle" font-size="11" fill="#334">加 SASL 监听器</text>
  <text x="125" y="146" text-anchor="middle" font-size="11" fill="#334">保留 PLAINTEXT</text>
  <text x="125" y="164" text-anchor="middle" font-size="11" fill="#334">老客户端零中断</text>
  <line x1="45" y1="182" x2="205" y2="182" stroke="#3d7ea6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="125" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#2d7a4f">回滚：改回配置重启</text>
  <text x="125" y="216" text-anchor="middle" font-size="10" fill="#2d7a4f">代价 低</text>

  <!-- 阶段 2 -->
  <rect x="245" y="80" width="190" height="150" rx="8" fill="#eaf7ee" stroke="#3d8a5a" stroke-width="2"/>
  <text x="340" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d5c37">阶段二 迁客户端</text>
  <text x="340" y="128" text-anchor="middle" font-size="11" fill="#334">客户端分批切 9095</text>
  <text x="340" y="146" text-anchor="middle" font-size="11" fill="#334">每批验证连通性</text>
  <text x="340" y="164" text-anchor="middle" font-size="11" fill="#334">旧门仍在</text>
  <line x1="260" y1="182" x2="420" y2="182" stroke="#3d8a5a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="340" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#2d7a4f">回滚：客户端改回 9092</text>
  <text x="340" y="216" text-anchor="middle" font-size="10" fill="#2d7a4f">代价 低</text>

  <!-- 阶段 3 -->
  <rect x="460" y="80" width="190" height="150" rx="8" fill="#fff4e5" stroke="#c98a2e" stroke-width="2"/>
  <text x="555" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a12">阶段三 上权限</text>
  <text x="555" y="128" text-anchor="middle" font-size="11" fill="#334">开 authorizer</text>
  <text x="555" y="146" text-anchor="middle" font-size="11" fill="#8b2020">必须先配 super.users</text>
  <text x="555" y="164" text-anchor="middle" font-size="11" fill="#334">最小权限 ACL</text>
  <line x1="475" y1="182" x2="635" y2="182" stroke="#c98a2e" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="555" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#a06820">回滚：移除 authorizer 重启</text>
  <text x="555" y="216" text-anchor="middle" font-size="10" fill="#a06820">代价 中</text>

  <!-- 阶段 4 -->
  <rect x="675" y="80" width="190" height="150" rx="8" fill="#fdeaea" stroke="#b5453f" stroke-width="2"/>
  <text x="770" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b2020">阶段四 拆旧门</text>
  <text x="770" y="128" text-anchor="middle" font-size="11" fill="#334">下线 PLAINTEXT</text>
  <text x="770" y="146" text-anchor="middle" font-size="11" fill="#8b2020">finalize metadata</text>
  <text x="770" y="164" text-anchor="middle" font-size="11" fill="#8b2020">version 单向阀</text>
  <line x1="690" y1="182" x2="850" y2="182" stroke="#b5453f" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="770" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2020">回滚：不可回滚</text>
  <text x="770" y="216" text-anchor="middle" font-size="10" fill="#8b2020">代价 无上限</text>

  <!-- 箭头 -->
  <path d="M 222 155 L 243 155" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 437 155 L 458 155" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 652 155 L 673 155" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- 底部核心约束 -->
  <rect x="30" y="255" width="835" height="60" rx="6" fill="#fff8e1" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="450" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a12">核心约束：可逆的动作放前面，不可逆的动作放最后</text>
  <text x="450" y="298" text-anchor="middle" font-size="11" fill="#5a4a2a">不可逆动作（finalize metadata.version）之前，必须完成备份与验证 —— 实测降级被拒：Refusing to perform the requested downgrade</text>

  <!-- 实测数据条 -->
  <rect x="30" y="330" width="835" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="450" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">本课实测（apache/kafka:4.0.0，3 节点 KRaft）</text>
  <text x="450" y="369" text-anchor="middle" font-size="11" fill="#475569">双监听器共存 · 老客户端零中断 · TopicAuthorizationException 拒权 · SCRAM 轮换即时生效 · 三批次滚动重启 URP 0→1→3→0</text>
</svg>
