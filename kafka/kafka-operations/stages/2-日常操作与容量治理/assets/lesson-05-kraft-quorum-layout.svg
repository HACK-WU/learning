<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">KRaft 控制器仲裁与元数据路径</title>
  <desc id="desc">三个 Controller 参与 metadata quorum，其中一个是 active，其余是 standby；Broker 和管理工具通过控制器读取集群元数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="640" y="56" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#0f172a">KRaft 控制器仲裁与元数据路径</text>
  <text x="640" y="88" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">三个 Controller 中多数可用，集群控制面才有机会继续提交元数据</text>

  <g filter="url(#shadow)">
    <rect x="50" y="150" width="260" height="385" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="370" y="120" width="540" height="445" rx="22" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect x="970" y="150" width="260" height="385" rx="22" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
    <text x="180" y="198" text-anchor="middle" font-size="23" font-weight="700">业务服务</text>
    <rect x="92" y="240" width="176" height="64" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="92" y="330" width="176" height="64" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="92" y="420" width="176" height="64" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="180" y="280" text-anchor="middle" font-size="19" font-weight="700">Broker 1</text>
    <text x="180" y="370" text-anchor="middle" font-size="19" font-weight="700">Broker 2</text>
    <text x="180" y="460" text-anchor="middle" font-size="19" font-weight="700">Broker 3</text>

    <text x="640" y="170" text-anchor="middle" font-size="24" font-weight="700">metadata quorum</text>
    <text x="640" y="200" text-anchor="middle" font-size="15" fill="#64748b">3 个 Controller，保持多数需要至少 2 个</text>
    <rect x="430" y="240" width="160" height="105" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <rect x="560" y="375" width="160" height="105" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <rect x="690" y="240" width="160" height="105" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="510" y="280" text-anchor="middle" font-size="19" font-weight="700">Controller 1</text>
    <text x="510" y="307" text-anchor="middle" font-size="16" fill="#1e3a8a">active</text>
    <text x="640" y="415" text-anchor="middle" font-size="19" font-weight="700">Controller 2</text>
    <text x="640" y="442" text-anchor="middle" font-size="16" fill="#047857">hot standby</text>
    <text x="770" y="280" text-anchor="middle" font-size="19" font-weight="700">Controller 3</text>
    <text x="770" y="307" text-anchor="middle" font-size="16" fill="#475569">hot standby</text>
    <rect x="490" y="505" width="300" height="38" rx="19" fill="#0f172a"/>
    <text x="640" y="530" text-anchor="middle" font-size="15" fill="#ffffff">metadata log：集群元数据的提交记录</text>

    <text x="1100" y="198" text-anchor="middle" font-size="23" font-weight="700">运维工具</text>
    <rect x="1012" y="275" width="176" height="70" rx="14" fill="#fef3c7" stroke="#fbbf24"/>
    <rect x="1012" y="380" width="176" height="70" rx="14" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="1100" y="318" text-anchor="middle" font-size="18" font-weight="700">metadata-quorum</text>
    <text x="1100" y="423" text-anchor="middle" font-size="18" font-weight="700">features describe</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 268 272 C 320 272, 350 270, 420 270"/>
    <path d="M 268 362 C 330 362, 360 305, 420 295"/>
    <path d="M 268 452 C 330 452, 370 325, 420 315"/>
    <path d="M 850 295 C 900 295, 930 300, 1002 300"/>
    <path d="M 850 320 C 900 350, 930 405, 1002 405"/>
    <path d="M 510 345 C 560 365, 580 380, 600 390"/>
    <path d="M 770 345 C 720 365, 700 380, 680 390"/>
  </g>

  <rect x="160" y="620" width="960" height="45" rx="22" fill="#ffffff" fill-opacity=".86" stroke="#cbd5e1"/>
  <text x="640" y="649" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#334155">Controller 负责元数据仲裁；Broker 负责业务数据；两者合并部署时仍是两种运维职责</text>
</svg>
