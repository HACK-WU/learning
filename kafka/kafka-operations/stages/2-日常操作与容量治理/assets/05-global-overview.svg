<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">一小时维护窗口如何不打乱全城</title>
  <desc id="desc">维护开始前确认多数仍在工作，窗口中一次只动一处，恢复后检查道路、货架和指挥台并记录结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fff8ed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#0f172a">一小时维护窗口如何不打乱全城</text>
  <text x="600" y="91" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">零术语全局图：先确认还能工作，再一次只动一处</text>

  <g filter="url(#shadow)">
    <rect x="45" y="155" width="245" height="250" rx="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <rect x="340" y="125" width="245" height="310" rx="22" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <rect x="635" y="155" width="245" height="250" rx="22" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
    <rect x="930" y="125" width="225" height="310" rx="22" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/>
  </g>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
    <text x="167" y="205" text-anchor="middle" font-size="24" font-weight="700">开始前</text>
    <text x="78" y="258" font-size="18">• 多数仍在工作</text>
    <text x="78" y="305" font-size="18">• 没有正在搬运</text>
    <text x="78" y="352" font-size="18">• 退路已经写好</text>

    <text x="462" y="175" text-anchor="middle" font-size="24" font-weight="700">窗口中</text>
    <rect x="382" y="215" width="160" height="45" rx="12" fill="#ffffff" fill-opacity=".78"/>
    <rect x="382" y="275" width="160" height="45" rx="12" fill="#ffffff" fill-opacity=".78"/>
    <rect x="382" y="335" width="160" height="45" rx="12" fill="#ffffff" fill-opacity=".78"/>
    <text x="462" y="244" text-anchor="middle" font-size="17">一次只动一处</text>
    <text x="462" y="304" text-anchor="middle" font-size="17">让工作转给别处</text>
    <text x="462" y="364" text-anchor="middle" font-size="17">每一步都看结果</text>

    <text x="757" y="205" text-anchor="middle" font-size="24" font-weight="700">恢复后</text>
    <text x="668" y="258" font-size="18">• 先看服务</text>
    <text x="668" y="305" font-size="18">• 再看资源</text>
    <text x="668" y="352" font-size="18">• 最后看记录</text>

    <text x="1042" y="175" text-anchor="middle" font-size="24" font-weight="700">形成闭环</text>
    <text x="958" y="236" font-size="18">• 这次真的恢复了吗</text>
    <text x="958" y="283" font-size="18">• 有没有留下新风险</text>
    <text x="958" y="330" font-size="18">• 下次能否照着做</text>
    <text x="958" y="377" font-size="16" fill="#475569">异常就升级，不硬撑</text>
  </g>

  <path d="M 290 280 C 305 280, 320 280, 333 280" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 585 280 C 600 280, 615 280, 628 280" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 880 280 C 895 280, 910 280, 923 280" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="190" y="478" width="820" height="46" rx="23" fill="#ffffff" fill-opacity=".86" stroke="#cbd5e1"/>
  <text x="600" y="507" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#334155">本课的任务：让维护动作可分批、可观察、可恢复，而不是靠运气熬过窗口</text>
</svg>
