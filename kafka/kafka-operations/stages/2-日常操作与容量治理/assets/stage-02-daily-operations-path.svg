  <g><rect x="562" y="82" width="234" height="128" rx="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/><text x="679" y="112" text-anchor="middle" fill="#9a6700" font-size="15" font-weight="700">课 5</text><text x="679" y="140" text-anchor="middle" fill="#1f2328" font-size="13">维护与 KRaft 运维</text><text x="679" y="170" text-anchor="middle" fill="#57606a" font-size="11">关停 → 维护 → 恢复</text><text x="679" y="192" text-anchor="middle" fill="#57606a" font-size="11">控制面与数据面</text></g>
