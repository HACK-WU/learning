  <g><rect x="36" y="82" width="208" height="128" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/><text x="140" y="112" text-anchor="middle" fill="#0969da" font-size="15" font-weight="700">课 3</text><text x="140" y="140" text-anchor="middle" fill="#1f2328" font-size="13">Topic 与配置治理</text><text x="140" y="170" text-anchor="middle" fill="#57606a" font-size="11">申请 → 评估 → 变更</text><text x="140" y="192" text-anchor="middle" fill="#57606a" font-size="11">保护不可逆边界</text></g>
