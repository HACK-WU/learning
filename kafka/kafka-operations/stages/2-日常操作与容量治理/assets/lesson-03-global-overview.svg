<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">一次改动如何安全走完一圈</title>
  <desc id="desc">申请先写清规则，再执行改动，最后核对结果和退回边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fff8ed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#0f172a">一次改动如何安全走完一圈</text>
  <text x="600" y="91" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">零术语全局图：先把“要改什么”说清，再动手</text>

  <g filter="url(#shadow)">
    <rect x="45" y="165" width="245" height="230" rx="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <rect x="340" y="135" width="245" height="290" rx="22" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <rect x="635" y="165" width="245" height="230" rx="22" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
    <rect x="930" y="135" width="225" height="290" rx="22" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/>
  </g>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
    <text x="167" y="212" text-anchor="middle" font-size="24" font-weight="700">申请到来</text>
    <text x="78" y="263" font-size="18">• 新增一处空间</text>
    <text x="78" y="310" font-size="18">• 调整已有规则</text>
    <text x="78" y="357" font-size="18">• 关闭一处空间</text>

    <text x="462" y="182" text-anchor="middle" font-size="24" font-weight="700">先写清规则</text>
    <rect x="382" y="220" width="160" height="45" rx="12" fill="#ffffff" fill-opacity=".78"/>
    <rect x="382" y="280" width="160" height="45" rx="12" fill="#ffffff" fill-opacity=".78"/>
    <rect x="382" y="340" width="160" height="45" rx="12" fill="#ffffff" fill-opacity=".78"/>
    <text x="462" y="249" text-anchor="middle" font-size="17">要分几路</text>
    <text x="462" y="309" text-anchor="middle" font-size="17">要留几份</text>
    <text x="462" y="369" text-anchor="middle" font-size="17">要留多久</text>

    <text x="757" y="212" text-anchor="middle" font-size="24" font-weight="700">执行改动</text>
    <text x="668" y="263" font-size="18">• 建立</text>
    <text x="668" y="310" font-size="18">• 调整</text>
    <text x="668" y="357" font-size="18">• 关闭</text>

    <text x="1042" y="182" text-anchor="middle" font-size="24" font-weight="700">核对与退回</text>
    <text x="958" y="243" font-size="18">• 结果真的生效吗</text>
    <text x="958" y="290" font-size="18">• 客户端看到了吗</text>
    <text x="958" y="337" font-size="18">• 出错能退回哪一步</text>
    <text x="958" y="384" font-size="16" fill="#475569">不可逆动作要先标红</text>
  </g>

  <path d="M 290 280 C 305 280, 320 280, 333 280" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 585 280 C 600 280, 615 280, 628 280" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 880 280 C 895 280, 910 280, 923 280" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="190" y="478" width="820" height="46" rx="23" fill="#ffffff" fill-opacity=".86" stroke="#cbd5e1"/>
  <text x="600" y="507" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#334155">本课的任务：让一次“改动”从申请单变成可验证、可审计、知道退路的运维动作</text>
</svg>
