<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
  <title id="title">Broker 加入前后的分区副本布局</title>
  <desc id="desc">加入 Broker 4 前，Broker 1、2、3 承担全部副本，Broker 4 为空；重分配完成后，四个分区仍各保留三份，并有副本落到 Broker 4。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1320" height="720" rx="28" fill="url(#bg)"/>
  <text x="660" y="54" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#0f172a">Broker 加入前后的分区副本布局</text>
  <text x="660" y="86" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">新 Broker 先是空的；reassignment 让它开始分担旧数据，但还要继续验收整体均衡</text>

  <g filter="url(#shadow)">
    <rect x="42" y="125" width="550" height="470" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="728" y="125" width="550" height="470" rx="22" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  </g>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
    <text x="317" y="168" text-anchor="middle" font-size="23" font-weight="700">搬迁前：新 Broker 4 是空的</text>
    <text x="1003" y="168" text-anchor="middle" font-size="23" font-weight="700">搬迁后：副本落点已改变</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="205" width="110" height="310" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="178" y="205" width="110" height="310" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="296" y="205" width="110" height="310" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="414" y="205" width="110" height="310" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="748" y="205" width="110" height="310" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="866" y="205" width="110" height="310" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="984" y="205" width="110" height="310" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="1102" y="205" width="110" height="310" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  </g>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="115" y="242" font-size="17" font-weight="700">Broker 1</text>
    <text x="233" y="242" font-size="17" font-weight="700">Broker 2</text>
    <text x="351" y="242" font-size="17" font-weight="700">Broker 3</text>
    <text x="469" y="242" font-size="17" font-weight="700">Broker 4</text>
    <text x="803" y="242" font-size="17" font-weight="700">Broker 1</text>
    <text x="921" y="242" font-size="17" font-weight="700">Broker 2</text>
    <text x="1039" y="242" font-size="17" font-weight="700">Broker 3</text>
    <text x="1157" y="242" font-size="17" font-weight="700">Broker 4</text>

    <g font-size="14">
      <rect x="68" y="270" width="94" height="47" rx="10" fill="#dbeafe"/>
      <rect x="68" y="335" width="94" height="47" rx="10" fill="#dbeafe"/>
      <rect x="68" y="400" width="94" height="47" rx="10" fill="#dbeafe"/>
      <rect x="68" y="465" width="94" height="47" rx="10" fill="#dbeafe"/>
      <text x="115" y="299">P0 · L</text><text x="115" y="364">P1 · F</text><text x="115" y="429">P2 · F</text><text x="115" y="494">P3 · L</text>
    </g>
    <g font-size="14">
      <rect x="186" y="270" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="186" y="335" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="186" y="400" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="186" y="465" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <text x="233" y="299">P0 · F</text><text x="233" y="364">P1 · L</text><text x="233" y="429">P2 · L</text><text x="233" y="494">P3 · F</text>
    </g>
    <g font-size="14">
      <rect x="304" y="270" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="304" y="335" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="304" y="400" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="304" y="465" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <text x="351" y="299">P0 · F</text><text x="351" y="364">P1 · F</text><text x="351" y="429">P2 · F</text><text x="351" y="494">P3 · F</text>
    </g>
    <text x="469" y="365" font-size="15" fill="#64748b">无旧副本</text>

    <g font-size="14">
      <rect x="756" y="270" width="94" height="47" rx="10" fill="#dbeafe"/>
      <rect x="756" y="335" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="756" y="400" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="756" y="465" width="94" height="47" rx="10" fill="#dbeafe"/>
      <text x="803" y="299">P0 · L</text><text x="803" y="364">P1 · F</text><text x="803" y="429">P2 · F</text><text x="803" y="494">P3 · L</text>
    </g>
    <g font-size="14">
      <rect x="874" y="270" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="874" y="335" width="94" height="47" rx="10" fill="#dbeafe"/>
      <rect x="874" y="400" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="874" y="465" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <text x="921" y="299">P0 · F</text><text x="921" y="364">P1 · L</text><text x="921" y="429">P2 · F</text><text x="921" y="494">P3 · F</text>
    </g>
    <g font-size="14">
      <rect x="992" y="270" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="992" y="335" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="992" y="400" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <rect x="992" y="465" width="94" height="47" rx="10" fill="#f1f5f9"/>
      <text x="1039" y="299">P0 · F</text><text x="1039" y="364">P1 · —</text><text x="1039" y="429">P2 · F</text><text x="1039" y="494">P3 · F</text>
    </g>
    <g font-size="14">
      <rect x="1110" y="270" width="94" height="47" rx="10" fill="#dcfce7"/>
      <rect x="1110" y="335" width="94" height="47" rx="10" fill="#dcfce7"/>
      <rect x="1110" y="400" width="94" height="47" rx="10" fill="#dbeafe"/>
      <rect x="1110" y="465" width="94" height="47" rx="10" fill="#dcfce7"/>
      <text x="1157" y="299">P0 · —</text><text x="1157" y="364">P1 · F</text><text x="1157" y="429">P2 · L</text><text x="1157" y="494">P3 · —</text>
    </g>
  </g>

  <path d="M 592 360 C 630 360, 684 360, 718 360" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="655" y="338" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#475569">reassignment</text>
  <text x="655" y="386" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">复制追平后加入 ISR</text>

  <rect x="170" y="630" width="980" height="45" rx="22" fill="#0f172a"/>
  <text x="660" y="659" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#ffffff">L = leader，F = follower；搬迁改变副本落点，但每个分区仍保持 3 份</text>
</svg>
