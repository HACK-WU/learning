<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">配置来源与有效值层级</title>
  <desc id="desc">Topic 显式覆盖优先于 Broker 提供的默认值；Broker 配置自身遵循动态单 Broker、动态集群默认、静态文件、Kafka 默认的优先顺序。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="640" y="56" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#0f172a">配置来源与有效值层级</text>
  <text x="640" y="88" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">先问“谁覆盖了谁”，再判断要不要重启</text>

  <g filter="url(#shadow)">
    <rect x="48" y="130" width="520" height="500" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="612" y="130" width="620" height="500" rx="22" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  </g>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
    <text x="308" y="174" text-anchor="middle" font-size="23" font-weight="700">Broker 配置自身的优先顺序</text>
    <text x="308" y="202" text-anchor="middle" font-size="14" fill="#64748b">同一个 Broker 配置在多层定义时</text>
    <rect x="128" y="232" width="360" height="62" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="128" y="322" width="360" height="62" rx="14" fill="#dcfce7" stroke="#4ade80"/>
    <rect x="128" y="412" width="360" height="62" rx="14" fill="#fef3c7" stroke="#fbbf24"/>
    <rect x="128" y="502" width="360" height="62" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="308" y="270" text-anchor="middle" font-size="18" font-weight="700">动态单 Broker 配置</text>
    <text x="308" y="360" text-anchor="middle" font-size="18" font-weight="700">动态集群默认配置</text>
    <text x="308" y="450" text-anchor="middle" font-size="18" font-weight="700">静态 server.properties</text>
    <text x="308" y="540" text-anchor="middle" font-size="18" font-weight="700">Kafka 内置默认值</text>
    <path d="M 308 300 L 308 316" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 308 390 L 308 406" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 308 480 L 308 496" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="308" y="598" text-anchor="middle" font-size="14" fill="#475569">越靠上，优先级越高</text>

    <text x="922" y="174" text-anchor="middle" font-size="23" font-weight="700">Topic 的有效配置</text>
    <text x="922" y="202" text-anchor="middle" font-size="14" fill="#64748b">显式覆盖存在时，不再直接采用 Broker 默认</text>
    <rect x="704" y="252" width="430" height="78" rx="16" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <rect x="704" y="395" width="430" height="78" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="919" y="285" text-anchor="middle" font-size="19" font-weight="700">Topic 显式覆盖</text>
    <text x="919" y="310" text-anchor="middle" font-size="14" fill="#475569">kafka-configs.sh --entity-type topics</text>
    <text x="919" y="428" text-anchor="middle" font-size="19" font-weight="700">Broker 提供的默认值</text>
    <text x="919" y="453" text-anchor="middle" font-size="14" fill="#475569">动态默认 / 静态配置 / 内置默认</text>
    <path d="M 919 335 L 919 389" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="919" y="365" text-anchor="middle" font-size="14" fill="#475569">没有覆盖时才向下取值</text>
    <rect x="692" y="520" width="454" height="62" rx="14" fill="#0f172a"/>
    <text x="919" y="547" text-anchor="middle" font-size="16" fill="#ffffff">删除 Topic 覆盖 = 回到下层默认</text>
    <text x="919" y="570" text-anchor="middle" font-size="13" fill="#cbd5e1">不是把有效配置变成“空值”</text>
  </g>

  <rect x="180" y="662" width="920" height="34" rx="17" fill="#ffffff" fill-opacity=".8" stroke="#cbd5e1"/>
  <text x="640" y="685" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">运维判断顺序：先查 Topic 覆盖，再查 Broker 动态值、静态文件和内置默认</text>
</svg>
