<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="40" y="42" fill="#1f2328" font-size="24" font-weight="700">Kafka 运维方向子教程 · 学习路径</text>
  <text x="40" y="68" fill="#57606a" font-size="13">故事线：接班一座事件流集群 → 安全改动与止血 → 让另一座集群能接班</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
  <path d="M278 255 L310 255" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M568 255 L600 255" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M858 255 L890 255" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="30" y="110" width="248" height="300" rx="12" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
    <text x="154" y="142" text-anchor="middle" fill="#0969da" font-size="16" font-weight="700">阶段 1 · 运维基线</text>
    <text x="154" y="166" text-anchor="middle" fill="#57606a" font-size="12">先知道自己守着什么</text>
    <line x1="52" y1="184" x2="256" y2="184" stroke="#d0d7de"/>
    <text x="48" y="216" fill="#1f2328" font-size="12">课1 运维全景与基线</text>
    <text x="48" y="244" fill="#57606a" font-size="11">对象 / 故障域 / SLO / runbook</text>
    <text x="48" y="284" fill="#1f2328" font-size="12">课2 存储与容量规划</text>
    <text x="48" y="312" fill="#57606a" font-size="11">分区 / 保留 / 磁盘 / 增长</text>
    <text x="48" y="365" fill="#57606a" font-size="11">输出：一张集群基线表</text>
  </g>
  <g>
    <rect x="320" y="110" width="248" height="300" rx="12" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
    <text x="444" y="142" text-anchor="middle" fill="#1a7f37" font-size="16" font-weight="700">阶段 2 · 日常操作</text>
    <text x="444" y="166" text-anchor="middle" fill="#57606a" font-size="12">每个改动都要可回退</text>
    <line x1="342" y1="184" x2="546" y2="184" stroke="#d0d7de"/>
    <text x="338" y="216" fill="#1f2328" font-size="12">课3 Topic 与配置</text>
    <text x="338" y="244" fill="#57606a" font-size="11">创建 / 扩容 / 配置层级</text>
    <text x="338" y="284" fill="#1f2328" font-size="12">课4 Broker 与搬迁</text>
    <text x="338" y="312" fill="#57606a" font-size="11">重分配 / 限流 / 均衡</text>
    <text x="338" y="352" fill="#1f2328" font-size="12">课5 维护与 KRaft</text>
    <text x="338" y="380" fill="#57606a" font-size="11">关停 / 仲裁 / 磁盘</text>
  </g>
  <g>
    <rect x="610" y="110" width="248" height="300" rx="12" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/>
    <text x="734" y="142" text-anchor="middle" fill="#9a6700" font-size="16" font-weight="700">阶段 3 · 观测排障</text>
    <text x="734" y="166" text-anchor="middle" fill="#57606a" font-size="12">先止血，再证明根因</text>
    <line x1="632" y1="184" x2="836" y2="184" stroke="#d0d7de"/>
    <text x="628" y="226" fill="#1f2328" font-size="12">课6 可观测性与告警</text>
    <text x="628" y="254" fill="#57606a" font-size="11">指标 / 基线 / lag / 看板</text>
    <text x="628" y="304" fill="#1f2328" font-size="12">课7 事故响应与排障</text>
    <text x="628" y="332" fill="#57606a" font-size="11">副本 / Controller / 消费者 / 磁盘</text>
    <text x="628" y="382" fill="#57606a" font-size="11">输出：可执行的 QRH 式 runbook</text>
  </g>
  <g>
    <rect x="900" y="110" width="248" height="300" rx="12" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/>
    <text x="1024" y="142" text-anchor="middle" fill="#8250df" font-size="16" font-weight="700">阶段 4 · 变更灾备</text>
    <text x="1024" y="166" text-anchor="middle" fill="#57606a" font-size="12">把恢复能力练出来</text>
    <line x1="922" y1="184" x2="1126" y2="184" stroke="#d0d7de"/>
    <text x="918" y="226" fill="#1f2328" font-size="12">课8 安全与滚动变更</text>
    <text x="918" y="254" fill="#57606a" font-size="11">TLS/SASL / ACL / 升级</text>
    <text x="918" y="304" fill="#1f2328" font-size="12">课9 跨集群与自动化</text>
    <text x="918" y="332" fill="#57606a" font-size="11">RPO/RTO / MM2 / runbook</text>
    <text x="918" y="382" fill="#57606a" font-size="11">输出：演练过的恢复路径</text>
  </g>
  <text x="40" y="462" fill="#6e7781" font-size="12">建议先修：主教程课 7 / 11 / 15 / 16；本线共 4 阶段 / 9 课 / 27 个知识点</text>
</svg>
