<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <text x="30" y="40" fill="#8250df" font-size="18" font-weight="700">阶段 4 · 实战与架构落地</text>
  <text x="30" y="62" fill="#57606a" font-size="12">故事章节：「把它用进你的项目」——代码开发、架构设计收尾</text>

  <rect x="30" y="86" width="620" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="46" y="110" fill="#1f2328" font-size="13" font-weight="700">🎯 阶段目标</text>
  <text x="46" y="130" fill="#57606a" font-size="11.5">写出生产/消费代码；设计事件驱动架构，并判断"什么时候该用 / 不该用 Kafka"</text>

  <path d="M340 142 L340 162" stroke="#57606a" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="30" y="166" width="620" height="58" rx="8" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/>
  <text x="46" y="190" fill="#8250df" font-size="13" font-weight="700">课 9 · 代码开发实战</text>
  <text x="46" y="212" fill="#57606a" font-size="11">选客户端（Java/Python） / 写生产者（含分区·acks） / 写消费者（含位移提交）</text>

  <path d="M340 226 L340 246" stroke="#57606a" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="30" y="250" width="620" height="64" rx="8" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/>
  <text x="46" y="274" fill="#8250df" font-size="13" font-weight="700">课 10 · 项目架构设计落地</text>
  <text x="46" y="296" fill="#57606a" font-size="11">事件驱动架构（EDA） / 常见拓扑（管道·流处理·CQRS·事件溯源）</text>
  <text x="46" y="314" fill="#57606a" font-size="11">决策清单：什么时候该用 / 不该用 Kafka + 生态（Connect/Streams）定位</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
