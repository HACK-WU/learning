<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="360" fill="#0d1117"/>
  <text x="30" y="40" fill="#58a6ff" font-size="18" font-weight="700">阶段 1 · 为什么需要 Kafka</text>
  <text x="30" y="62" fill="#8b949e" font-size="12">故事章节：「系统开始喘不过气」——先搞懂痛点，再认识 Kafka</text>

  <rect x="30" y="86" width="620" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="110" fill="#e6edf3" font-size="13" font-weight="700">🎯 阶段目标</text>
  <text x="46" y="130" fill="#8b949e" font-size="11.5">理解「为什么需要消息队列」，说清 Kafka 的定位、四大角色，并与 RabbitMQ/Redis 队列建立直觉对比</text>

  <path d="M340 142 L340 162" stroke="#8b949e" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="30" y="166" width="620" height="64" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="46" y="190" fill="#58a6ff" font-size="13" font-weight="700">课 1 · 为什么需要消息队列</text>
  <text x="46" y="212" fill="#8b949e" font-size="11">知识点：① 直接同步调用的痛点（耦合/雪崩/积压） ② 消息队列是什么（邮政类比） ③ 削峰·异步·解耦三大价值</text>

  <path d="M340 232 L340 252" stroke="#8b949e" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="30" y="256" width="620" height="64" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="46" y="280" fill="#58a6ff" font-size="13" font-weight="700">课 2 · Kafka 是什么 &amp; 起源与定位</text>
  <text x="46" y="302" fill="#8b949e" font-size="11">知识点：① Kafka 诞生背景（LinkedIn，2010） ② 四大角色全景（Producer/Consumer/Broker/Topic）</text>
  <text x="46" y="320" fill="#8b949e" font-size="11">③ Kafka vs 其他 MQ 的直觉对比</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
