<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="720" height="270" fill="#ffffff"/>
  <text x="30" y="40" fill="#1f2328" font-size="17" font-weight="700">Partition 内部结构：只追加、按 offset 严格有序</text>

  <!-- message cells -->
  <g font-size="11">
    <rect x="30" y="70" width="96" height="64" rx="6" fill="#f6f8fa" stroke="#1a7f37"/>
    <text x="78" y="92" fill="#1a7f37" font-weight="700" text-anchor="middle">offset = 0</text>
    <text x="78" y="118" fill="#1f2328" text-anchor="middle">订单A</text>

    <rect x="132" y="70" width="96" height="64" rx="6" fill="#f6f8fa" stroke="#1a7f37"/>
    <text x="180" y="92" fill="#1a7f37" font-weight="700" text-anchor="middle">offset = 1</text>
    <text x="180" y="118" fill="#1f2328" text-anchor="middle">订单B</text>

    <rect x="234" y="70" width="96" height="64" rx="6" fill="#f6f8fa" stroke="#1a7f37"/>
    <text x="282" y="92" fill="#1a7f37" font-weight="700" text-anchor="middle">offset = 2</text>
    <text x="282" y="118" fill="#1f2328" text-anchor="middle">订单C</text>

    <rect x="336" y="70" width="96" height="64" rx="6" fill="#f6f8fa" stroke="#1a7f37"/>
    <text x="384" y="92" fill="#1a7f37" font-weight="700" text-anchor="middle">offset = 3</text>
    <text x="384" y="118" fill="#1f2328" text-anchor="middle">订单D</text>

    <text x="446" y="106" fill="#57606a" font-size="20">…</text>

    <!-- append arrow -->
    <rect x="500" y="70" width="110" height="64" rx="6" fill="none" stroke="#9a6700" stroke-dasharray="5,4"/>
    <text x="555" y="96" fill="#9a6700" font-weight="700" text-anchor="middle">offset = N</text>
    <text x="555" y="118" fill="#9a6700" text-anchor="middle">新消息追加</text>

    <path d="M470 102 L500 102" stroke="#9a6700" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <text x="30" y="170" fill="#1f2328" font-size="13" font-weight="700">三个关键性质：</text>
  <text x="30" y="194" fill="#57606a" font-size="12">① 只追加（append-only）：新消息永远写到末尾，已写入的不修改、不删除（到 retention 过期才清）</text>
  <text x="30" y="216" fill="#57606a" font-size="12">② 有序：offset 从 0 单调递增，读的时候按 offset 从小到大顺序读</text>
  <text x="30" y="238" fill="#57606a" font-size="12">③ 顺序保证只在「单个 Partition 内」成立——不同 Partition 之间没有全局顺序</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9a6700"/>
    </marker>
  </defs>
</svg>
