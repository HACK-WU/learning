<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="470" fill="#0d1117"/>
  <text x="30" y="40" fill="#3fb950" font-size="18" font-weight="700">阶段 2 · Kafka 核心架构</text>
  <text x="30" y="62" fill="#8b949e" font-size="12">故事章节：「认识这套物流系统」——存储模型、生产、消费三大机制</text>

  <rect x="30" y="86" width="620" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="110" fill="#e6edf3" font-size="13" font-weight="700">🎯 阶段目标</text>
  <text x="46" y="130" fill="#8b949e" font-size="11.5">说清 Topic/Partition/Broker 的存储模型与高吞吐原理；讲透生产者发送、消费者组与位移提交机制</text>

  <path d="M340 142 L340 162" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="30" y="166" width="620" height="58" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="46" y="190" fill="#3fb950" font-size="13" font-weight="700">课 3 · Topic、Partition 与 Broker</text>
  <text x="46" y="212" fill="#8b949e" font-size="11">分片思想 / Broker 与集群 / 顺序写磁盘 + 零拷贝 = 高吞吐</text>

  <path d="M340 226 L340 246" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="30" y="250" width="620" height="58" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="46" y="274" fill="#3fb950" font-size="13" font-weight="700">课 4 · 生产者 Producer</text>
  <text x="46" y="296" fill="#8b949e" font-size="11">发送流程 / 分区策略（key→分区） / acks 参数与发送可靠性</text>

  <path d="M340 310 L340 330" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="30" y="334" width="620" height="58" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="46" y="358" fill="#3fb950" font-size="13" font-weight="700">课 5 · 消费者与消费者组</text>
  <text x="46" y="380" fill="#8b949e" font-size="11">消费模型与位移 offset / 消费者组与再均衡 rebalance</text>
  <text x="46" y="398" fill="#8b949e" font-size="11">位移提交方式（自动/手动）与重复消费/消息丢失</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
