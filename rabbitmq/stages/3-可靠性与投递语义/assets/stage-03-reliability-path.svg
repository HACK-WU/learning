<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="250" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#7f3f00">阶段 3 · 可靠性与投递语义</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#666666">章节：消息为什么还会丢 —— 把「不丢」拆成一层层保障来看</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="30" y="74" width="266" height="140" rx="8" fill="#fff4e5" stroke="#EF6C00" stroke-width="2"/>
  <text x="163" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#EF6C00">课 6</text>
  <text x="163" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#7f3f00">确认机制与预取</text>
  <text x="163" y="150" text-anchor="middle" font-size="12" fill="#333333">· 消费者确认</text>
  <text x="163" y="170" text-anchor="middle" font-size="12" fill="#333333">· 发布者确认</text>
  <text x="163" y="188" text-anchor="middle" font-size="12" fill="#333333">· 预取与公平分发</text>

  <rect x="316" y="74" width="266" height="140" rx="8" fill="#fff4e5" stroke="#EF6C00" stroke-width="2"/>
  <text x="449" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#EF6C00">课 7</text>
  <text x="449" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#7f3f00">持久化与死信</text>
  <text x="449" y="150" text-anchor="middle" font-size="12" fill="#333333">· 三层持久化</text>
  <text x="449" y="170" text-anchor="middle" font-size="12" fill="#333333">· 持久化的真实程度</text>
  <text x="449" y="188" text-anchor="middle" font-size="12" fill="#333333">· TTL 与死信队列</text>

  <rect x="602" y="74" width="266" height="140" rx="8" fill="#fff4e5" stroke="#EF6C00" stroke-width="2"/>
  <text x="735" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#EF6C00">课 8</text>
  <text x="735" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#7f3f00">交付语义与幂等</text>
  <text x="735" y="150" text-anchor="middle" font-size="12" fill="#333333">· 三种交付语义</text>
  <text x="735" y="170" text-anchor="middle" font-size="12" fill="#333333">· 重复来源与幂等设计</text>
  <text x="735" y="188" text-anchor="middle" font-size="12" fill="#333333">· 顺序性</text>

  <line x1="300" y1="144" x2="312" y2="144" stroke="#555555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="586" y1="144" x2="598" y2="144" stroke="#555555" stroke-width="2" marker-end="url(#a)"/>

  <text x="450" y="238" text-anchor="middle" font-size="12" fill="#666666">学完本阶段：能说清「开了持久化为什么还会丢」「为什么会重复、怎么幂等」</text>
</svg>
