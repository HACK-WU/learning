## 📊 预聚合前后成本对比

| 查询 | 预聚合前（单步样本） | 预聚合后 | 降幅 |
|------|------------------|---------|------|
| P95 延迟 | 14,040 | ~3 条序列 | **~3 个数量级** |
| SLO 合规率 | ~1,080 | ~3 条序列 | ~2 个数量级 |
| 错误率 | ~1,080 | ~4 条序列 | ~2 个数量级 |
| QPS | 540 | ~27 条序列 | ~1 个数量级 |
| CPU 使用率 | ~30 + 向量匹配 | 3 条序列 | 小（但省掉匹配开销） |

> 📌 单步看着都不多，但**乘以 361 个评估步、再乘以每分钟 2 次刷新**，差距就是每分钟几百万到几千万样本。

---

## ⚠️ 预聚合的三个代价（必须知道）

1. **数据延迟**：预聚合结果最多滞后一个 `interval`（本项目 15s）。对秒级熔断类告警不适用——那条要改回直算。
2. **查询与规则可能漂移**：改了 expr 忘了改规则（或反之），面板与告警会给出不同数字。**本项目用「面板与告警读同一条预聚合序列」来根治这个问题**（见规则 2 与 4 的设计意图）。
3. **存储开销**：每条预聚合序列都要按 15s 存一份。规则 1 保留 method×path×status 三个维度 → 27 条新序列，规模随维度组合增长。**保留维度要克制**。

