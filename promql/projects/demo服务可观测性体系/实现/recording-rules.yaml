## 🔍 如何在自己的环境验证

```bash
# 1. 加载规则（prometheus.yml 的 rule_files 配置后）
# 2. 检查规则是否被 Prometheus 接受
curl -s http://localhost:9090/api/v1/rules | jq '.data.groups[] | select(.name=="demo-service-precompute")'

# 3. 确认预聚合序列已产生
curl -s 'http://localhost:9090/api/v1/query?query=demo:api_latency_p95_seconds:histogram_quantile'

# 4. 用 stats 看成本降幅（L12 教的测量工具）
curl -s 'http://localhost:9090/api/v1/query?stats=all' \
  --data-urlencode 'query=demo:api_latency_p95_seconds:histogram_quantile' \
  | jq '.data.stats.samples.totalQueryableSamples'
```

> 💡 第 4 步是关键：用 `?stats=all` 拿到 `totalQueryableSamples`，与预聚合前的 14,040 对比——**优化效果要量出来，不能靠感觉**。

---

## 📚 知识点回指

- **recording rule 语法**：与告警规则同构（`groups → rules`），`record` 替代 `alert`，无 `for`/`labels`/`annotations` — [L12](../stages/4-实战应用/lessons/lesson-12-实战二-Grafana面板套路与查询优化.md)
- **成本第一定律**：账单按读取样本数算，不按输出行数算 — [L12](../stages/4-实战应用/lessons/lesson-12-实战二-Grafana面板套路与查询优化.md)
- **`ALERTS` 是内置合成序列的活例**：告警状态本身就是被预聚合出来的指标 — [L11](../stages/4-实战应用/lessons/lesson-11-实战一-从查询到告警规则.md)
