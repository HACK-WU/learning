<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">PromQL 学习路径：零基础到实战（12 课）</text>

  <!-- 阶段1 -->
  <rect x="40" y="70" width="190" height="130" rx="12" fill="#e8f4fd" stroke="#3b82f6" stroke-width="2"/>
  <text x="135" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">阶段1 地基与数据模型</text>
  <text x="135" y="126" text-anchor="middle" font-size="12" fill="#334155">L1 为什么需要 PromQL</text>
  <text x="135" y="146" text-anchor="middle" font-size="12" fill="#334155">L2 指标、标签与时间序列</text>
  <text x="135" y="166" text-anchor="middle" font-size="12" fill="#334155">L3 四种指标类型</text>
  <text x="135" y="190" text-anchor="middle" font-size="11" fill="#64748b">看懂数据长什么样</text>

  <line x1="230" y1="135" x2="270" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段2 -->
  <rect x="275" y="70" width="190" height="130" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="370" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">阶段2 核心语法</text>
  <text x="370" y="126" text-anchor="middle" font-size="12" fill="#334155">L4 瞬时/范围向量</text>
  <text x="370" y="146" text-anchor="middle" font-size="12" fill="#334155">L5 标签匹配器</text>
  <text x="370" y="166" text-anchor="middle" font-size="12" fill="#334155">L6 运算符 / L7 向量匹配</text>
  <text x="370" y="190" text-anchor="middle" font-size="11" fill="#64748b">取数、算数、拼数据</text>

  <line x1="465" y1="135" x2="505" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段3 -->
  <rect x="510" y="70" width="190" height="130" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="605" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">阶段3 函数与聚合</text>
  <text x="605" y="126" text-anchor="middle" font-size="12" fill="#334155">L8 rate/increase</text>
  <text x="605" y="146" text-anchor="middle" font-size="12" fill="#334155">L9 sum/avg/topk 聚合</text>
  <text x="605" y="166" text-anchor="middle" font-size="12" fill="#334155">L10 histogram_quantile</text>
  <text x="605" y="190" text-anchor="middle" font-size="11" fill="#64748b">日常 80% 查询套路</text>

  <line x1="700" y1="135" x2="740" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段4 -->
  <rect x="745" y="70" width="190" height="130" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="840" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#be185d">阶段4 实战应用</text>
  <text x="840" y="126" text-anchor="middle" font-size="12" fill="#334155">L11 告警规则</text>
  <text x="840" y="146" text-anchor="middle" font-size="12" fill="#334155">L12 Grafana 面板与优化</text>
  <text x="840" y="166" text-anchor="middle" font-size="12" fill="#334155"></text>
  <text x="840" y="190" text-anchor="middle" font-size="11" fill="#64748b">产出真实告警与面板</text>

  <text x="480" y="250" text-anchor="middle" font-size="13" fill="#475569">实操环境：play.prometheus.io（官方在线演练场，浏览器打开即用）</text>
  <text x="480" y="274" text-anchor="middle" font-size="12" fill="#94a3b8">2026-08-27 建档 · 零基础 + 实操导向</text>
</svg>
