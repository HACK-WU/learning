<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif"><rect width="900" height="260" fill="#fafafa"/><text x="40" y="42" font-size="20" font-weight="700" fill="#0d47a1">把快速开发和完整检查拆成两条协作流水线</text><rect x="50" y="90" width="220" height="92" rx="12" fill="#e8f1fb" stroke="#1565c0" stroke-width="2"/><text x="160" y="128" text-anchor="middle" font-size="17" fill="#16324f">快速转译</text><text x="160" y="155" text-anchor="middle" font-size="13" fill="#52606d">先让页面跑起来</text><path d="M290 136H370" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="90" width="220" height="92" rx="12" fill="#fff4d6" stroke="#d28b00" stroke-width="2"/><text x="480" y="128" text-anchor="middle" font-size="17" fill="#5a4100">独立检查</text><text x="480" y="155" text-anchor="middle" font-size="13" fill="#6b5b2a">发现类型和规范问题</text><path d="M610 136H690" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="90" width="160" height="92" rx="12" fill="#e4f5e9" stroke="#2e7d32" stroke-width="2"/><text x="770" y="128" text-anchor="middle" font-size="17" fill="#1b5e20">CI 门禁</text><text x="770" y="155" text-anchor="middle" font-size="13" fill="#35663a">失败不会被吞掉</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker></defs></svg>
