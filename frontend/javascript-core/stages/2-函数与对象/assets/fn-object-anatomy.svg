<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>

  <text x="24" y="36" font-size="18" font-weight="700" fill="#1f2937">函数对象的解剖：一个函数值 = 代码 + 自有属性 + 隐藏槽位</text>

  <!-- ===== 左：函数对象本体 ===== -->
  <rect x="24" y="58" width="376" height="352" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="86" font-size="14.5" font-weight="700" fill="#0f172a">函数对象 fn（引用值，存在堆里）</text>

  <!-- 层 1：代码体 -->
  <rect x="40" y="98" width="344" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="56" y="120" font-size="13.5" font-weight="700" fill="#1e3a8a">① 代码体 —— 决定「怎么算」</text>
  <text x="56" y="141" font-size="12" font-family="Consolas,Monaco,monospace" fill="#1e293b">function (a, b) { return a + b }</text>
  <text x="56" y="162" font-size="11.5" fill="#475569">内部方法 [[Call]]（能调用）· [[Construct]]（能 new）</text>

  <!-- 层 2：自有属性 -->
  <rect x="40" y="186" width="344" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="56" y="208" font-size="13.5" font-weight="700" fill="#14532d">② 自有属性 —— 跟普通对象一样可读写</text>
  <text x="56" y="229" font-size="12" font-family="Consolas,Monaco,monospace" fill="#1e293b">fn.name = 'fn'   fn.length = 2   fn.prototype = {}</text>
  <text x="56" y="250" font-size="11.5" fill="#475569">还能自己挂：fn.tag = 'x' —— 因为它本来就是对象</text>

  <!-- 层 3：隐藏槽位 -->
  <rect x="40" y="274" width="344" height="118" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="56" y="296" font-size="13.5" font-weight="700" fill="#78350f">③ 隐藏槽位 —— 看不见，但决定行为</text>
  <text x="56" y="320" font-size="12" font-family="Consolas,Monaco,monospace" fill="#1e293b">[[Environment]]</text>
  <text x="196" y="320" font-size="11.5" fill="#475569">定义时的词法环境 ← 课 3 闭包的根</text>
  <text x="56" y="344" font-size="12" font-family="Consolas,Monaco,monospace" fill="#1e293b">[[ThisMode]]</text>
  <text x="196" y="344" font-size="11.5" fill="#475569">决定 this 怎么定 ← 课 5 的主场</text>
  <text x="56" y="368" font-size="11.5" font-family="Consolas,Monaco,monospace" fill="#b45309">箭头函数：无 [[Construct]]，[[ThisMode]] = 词法</text>

  <!-- ===== 箭头：因为是值，所以能…… ===== -->
  <g stroke="#64748b" stroke-width="1.4" fill="none">
    <path d="M404 123 L436 123" marker-end="url(#ah)"/>
    <path d="M404 181 L436 181" marker-end="url(#ah)"/>
    <path d="M404 239 L436 239" marker-end="url(#ah)"/>
    <path d="M404 297 L436 297" marker-end="url(#ah)"/>
  </g>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="406" y="116" font-size="11" font-weight="700" fill="#64748b">值</text>

  <!-- ===== 右：四种能力 ===== -->
  <text x="440" y="86" font-size="14.5" font-weight="700" fill="#0f172a">因为是「值」，所以它能：</text>

  <rect x="440" y="100" width="416" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="456" y="122" font-size="13" font-weight="700" fill="#1e293b">存进变量</text>
  <text x="556" y="122" font-size="12" font-family="Consolas,Monaco,monospace" fill="#475569">const g = fn</text>
  <text x="456" y="139" font-size="11" fill="#64748b">（复印件，指向同一个函数对象）</text>

  <rect x="440" y="158" width="416" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="456" y="180" font-size="13" font-weight="700" fill="#1e293b">当参数传</text>
  <text x="556" y="180" font-size="12" font-family="Consolas,Monaco,monospace" fill="#475569">arr.map(fn)</text>
  <text x="456" y="197" font-size="11" fill="#64748b">（高阶函数 · 回调，本课知识点 3）</text>

  <rect x="440" y="216" width="416" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="456" y="238" font-size="13" font-weight="700" fill="#1e293b">当返回值</text>
  <text x="556" y="238" font-size="12" font-family="Consolas,Monaco,monospace" fill="#475569">return fn</text>
  <text x="456" y="255" font-size="11" fill="#64748b">（函数工厂 / 柯里化，回扣课 3）</text>

  <rect x="440" y="274" width="416" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="456" y="296" font-size="13" font-weight="700" fill="#1e293b">挂自定义属性</text>
  <text x="576" y="296" font-size="12" font-family="Consolas,Monaco,monospace" fill="#475569">fn.tag = 'x'</text>
  <text x="456" y="313" font-size="11" fill="#64748b">（对象能干的它都能干）</text>

  <rect x="440" y="336" width="416" height="74" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="456" y="358" font-size="12.5" font-weight="700" fill="#7f1d1d">⚠️ 箭头函数缺三样</text>
  <text x="456" y="378" font-size="11.5" fill="#7f1d1d">无 prototype → 不能 new；无自己的 this（课 5）；</text>
  <text x="456" y="397" font-size="11.5" fill="#7f1d1d">无自己的 arguments → 借外层的（本课知识点 1）</text>
</svg>
