<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="940" height="380" fill="#ffffff"/>

  <text x="24" y="36" font-size="18" font-weight="700" fill="#1f2937">箭头函数的 this：向外穿透，直到遇到第一个「有 this 的」普通函数</text>

  <!-- ① 普通函数 -->
  <rect x="40" y="70" width="790" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="94" font-size="13.5" font-weight="700" fill="#1e3a8a">① function greetAll() { ... }</text>
  <text x="58" y="114" font-size="11.5" fill="#1e293b">普通函数 · <tspan font-weight="700" fill="#1e3a8a">有 this</tspan> —— 由「调用方式」决定：obj.greetAll() → this = obj</text>

  <!-- ② 箭头函数 -->
  <rect x="80" y="150" width="750" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="98" y="172" font-size="13.5" font-weight="700" fill="#78350f">② friends.map((f) =&gt; { ... })</text>
  <text x="98" y="192" font-size="11.5" fill="#1e293b">箭头函数 · <tspan font-weight="700" fill="#b45309">没有 this</tspan> —— 沿用 ① 的</text>

  <!-- ③ 箭头函数 -->
  <rect x="120" y="226" width="710" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="138" y="248" font-size="13.5" font-weight="700" fill="#78350f">③ setTimeout(() =&gt; { ... })</text>
  <text x="138" y="268" font-size="11.5" fill="#1e293b">箭头函数 · <tspan font-weight="700" fill="#b45309">也没有 this</tspan> —— 仍然沿用 ① 的</text>

  <!-- 穿透箭头 -->
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <path d="M 836 254 C 900 254, 900 100, 836 100" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="848" y="162" font-size="12" font-weight="700" fill="#dc2626">this</text>
  <text x="848" y="180" font-size="12" font-weight="700" fill="#dc2626">向外</text>
  <text x="848" y="198" font-size="12" font-weight="700" fill="#dc2626">穿透</text>

  <!-- 结论 -->
  <rect x="40" y="300" width="860" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="56" y="322" font-size="12.5" font-weight="700" fill="#0f172a">🔑 箭头函数自己没有 this</text>
  <text x="56" y="342" font-size="11.5" fill="#334155">它内部出现的 this 会向外穿透所有箭头函数，落在「最近一层的普通函数」上，且穿透后不能被 call / apply / bind 改写。</text>
  <text x="56" y="358" font-size="11.5" fill="#334155">对比：普通函数只看「调用点」，不看出生地；箭头函数只看「出生地」，不看调用点——这是它俩唯一的分歧。</text>
</svg>
