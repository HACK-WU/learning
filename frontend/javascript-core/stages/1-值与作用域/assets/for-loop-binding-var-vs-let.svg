<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
  </defs>

  <rect width="960" height="510" fill="#fafafa"/>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">为什么把 var 换成 let 就修好了？</text>
  <text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#5f6368">关键不在「作用域大小」，而在「循环变量被创建了多少次」</text>

  <!-- ===== 上半：var ===== -->
  <rect x="30" y="76" width="900" height="184" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.5"/>
  <rect x="30" y="76" width="900" height="34" rx="6" fill="#c62828"/>
  <text x="50" y="99" font-size="14" font-weight="bold" fill="#ffffff">❌ for (var i = 0; i &lt; 3; i++)　—— 三次迭代共用「同一个」绑定</text>

  <text x="50" y="130" font-size="11.5" fill="#78909c">三个闭包</text>
  <rect x="50" y="140" width="110" height="32" rx="4" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="105" y="161" text-anchor="middle" font-size="12" fill="#333333">闭包 f₀</text>
  <rect x="50" y="180" width="110" height="32" rx="4" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="105" y="201" text-anchor="middle" font-size="12" fill="#333333">闭包 f₁</text>
  <rect x="50" y="220" width="110" height="32" rx="4" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="105" y="241" text-anchor="middle" font-size="12" fill="#333333">闭包 f₂</text>

  <text x="520" y="130" font-size="11.5" fill="#78909c">它们捕获的绑定</text>
  <rect x="520" y="150" width="180" height="98" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="610" y="192" text-anchor="middle" font-size="18" font-weight="bold" fill="#c62828">i = 3</text>
  <text x="610" y="216" text-anchor="middle" font-size="11.5" fill="#c62828">循环结束后只剩这一个</text>
  <text x="610" y="234" text-anchor="middle" font-size="11.5" fill="#c62828">（值停在 3）</text>

  <path d="M 160 156 L 512 175" stroke="#c62828" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M 160 196 L 512 199" stroke="#c62828" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M 160 236 L 512 223" stroke="#c62828" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <text x="740" y="189" font-size="13" font-weight="bold" fill="#c62828">三个闭包</text>
  <text x="740" y="209" font-size="13" font-weight="bold" fill="#c62828">都指向它</text>
  <text x="740" y="234" font-size="14" font-weight="bold" fill="#c62828">→ 输出 3 3 3</text>

  <!-- ===== 下半：let ===== -->
  <rect x="30" y="286" width="900" height="184" rx="6" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.5"/>
  <rect x="30" y="286" width="900" height="34" rx="6" fill="#2E7D32"/>
  <text x="50" y="309" font-size="14" font-weight="bold" fill="#ffffff">✅ for (let i = 0; i &lt; 3; i++)　—— 每次迭代都创建一个「新」绑定</text>

  <text x="50" y="340" font-size="11.5" fill="#78909c">三个闭包</text>
  <rect x="50" y="350" width="110" height="32" rx="4" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="105" y="371" text-anchor="middle" font-size="12" fill="#333333">闭包 f₀</text>
  <rect x="50" y="390" width="110" height="32" rx="4" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="105" y="411" text-anchor="middle" font-size="12" fill="#333333">闭包 f₁</text>
  <rect x="50" y="430" width="110" height="32" rx="4" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="105" y="451" text-anchor="middle" font-size="12" fill="#333333">闭包 f₂</text>

  <text x="520" y="340" font-size="11.5" fill="#78909c">各自捕获的绑定</text>
  <rect x="520" y="350" width="180" height="32" rx="4" fill="#e8f5e9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="610" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E7D32">第 1 轮的 i　= 0</text>
  <rect x="520" y="390" width="180" height="32" rx="4" fill="#e8f5e9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="610" y="411" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E7D32">第 2 轮的 i　= 1</text>
  <rect x="520" y="430" width="180" height="32" rx="4" fill="#e8f5e9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="610" y="451" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E7D32">第 3 轮的 i　= 2</text>

  <path d="M 160 366 L 512 366" stroke="#2E7D32" stroke-width="1.8" fill="none" marker-end="url(#arg)"/>
  <path d="M 160 406 L 512 406" stroke="#2E7D32" stroke-width="1.8" fill="none" marker-end="url(#arg)"/>
  <path d="M 160 446 L 512 446" stroke="#2E7D32" stroke-width="1.8" fill="none" marker-end="url(#arg)"/>

  <text x="740" y="399" font-size="13" font-weight="bold" fill="#2E7D32">每个闭包</text>
  <text x="740" y="419" font-size="13" font-weight="bold" fill="#2E7D32">抓住自己那一轮</text>
  <text x="740" y="444" font-size="14" font-weight="bold" fill="#2E7D32">→ 输出 0 1 2</text>

  <text x="480" y="494" text-anchor="middle" font-size="12" fill="#5f6368">💡 所以 let 修好它不是因为「块级作用域更小」，而是因为「循环变量被创建了三次」——这才是真相</text>
</svg>
