<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <rect width="900" height="400" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">typeof null 为什么是 "object"？</text>
  <text x="450" y="54" text-anchor="middle" font-size="12.5" fill="#5f6368">1995 年第一个 JS 实现里，一个值 = 「类型标签 + 值」。标签撞车了。</text>

  <!-- 表头 -->
  <rect x="30" y="76" width="840" height="34" rx="4" fill="#1565C0"/>
  <text x="48" y="99" font-size="13.5" font-weight="bold" fill="#ffffff">你写的值</text>
  <text x="368" y="99" font-size="13.5" font-weight="bold" fill="#ffffff">引擎内部：类型标签 + 值</text>
  <text x="718" y="99" font-size="13.5" font-weight="bold" fill="#ffffff">typeof 结果</text>

  <!-- 行 1：对象 -->
  <rect x="30" y="120" width="840" height="76" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="48" y="152" font-size="13.5" font-weight="bold" fill="#333333">const o = { a: 1 }</text>
  <text x="48" y="174" font-size="11.5" fill="#5f6368">这是一个真的对象</text>
  <rect x="360" y="140" width="100" height="36" rx="4" fill="#1565C0"/>
  <text x="410" y="163" text-anchor="middle" font-size="12" fill="#ffffff">类型标签 0</text>
  <rect x="470" y="140" width="170" height="36" rx="4" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="555" y="163" text-anchor="middle" font-size="11.5" fill="#333333">值：指向对象的指针</text>
  <text x="718" y="163" font-size="14" font-weight="bold" fill="#2E7D32">"object" ✓</text>

  <!-- 行 2：null -->
  <rect x="30" y="206" width="840" height="76" rx="4" fill="#fff8e1" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="48" y="238" font-size="13.5" font-weight="bold" fill="#333333">const n = null</text>
  <text x="48" y="260" font-size="11.5" fill="#5f6368">这是「空」，不是对象</text>
  <rect x="360" y="226" width="100" height="36" rx="4" fill="#EF6C00"/>
  <text x="410" y="249" text-anchor="middle" font-size="12" fill="#ffffff">类型标签 0</text>
  <rect x="470" y="226" width="170" height="36" rx="4" fill="#f5f5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="555" y="249" text-anchor="middle" font-size="11.5" fill="#333333">值：0x00（空指针）</text>
  <text x="718" y="249" font-size="14" font-weight="bold" fill="#c62828">"object" ✗</text>

  <!-- 撞车高亮 -->
  <rect x="352" y="132" width="116" height="138" rx="6" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="352" y="296" font-size="12" font-weight="bold" fill="#c62828">两个完全不同的东西，标签位却都是 0</text>

  <!-- 结论框 -->
  <rect x="30" y="308" width="840" height="72" rx="6" fill="#f5f5f5" stroke="#cfd8dc" stroke-width="1"/>
  <text x="48" y="330" font-size="12" fill="#333333">• 对象的类型标签被定为 0；null 是 NULL 指针（多数平台为 0x00），标签位同样是 0 —— 于是 typeof 把它当成了对象。</text>
  <text x="48" y="352" font-size="12" fill="#333333">• ECMAScript 曾提议改成返回 "null"（需 opt-in 开启），但该提案已被拒绝，为的是不破坏既有代码。</text>
  <text x="48" y="372" font-size="11.5" fill="#5f6368">来源：MDN typeof 文档（引 2ality）｜核查于 2026-08</text>
</svg>
