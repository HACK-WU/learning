<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#fafafa"/>

  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">赋值 · 浅拷贝 · 深拷贝：到底复制了什么？</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#5f6368">变量里存的不是对象本身，是「指向对象的钥匙」</text>

  <!-- ============ Panel A：b = a ============ -->
  <rect x="20" y="76" width="313" height="310" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <rect x="20" y="76" width="313" height="32" rx="6" fill="#c62828"/>
  <rect x="20" y="100" width="313" height="8" fill="#c62828"/>
  <text x="36" y="98" font-size="13.5" font-weight="bold" fill="#ffffff">① b = a（只是换了个名字）</text>

  <text x="36" y="126" font-size="11.5" fill="#78909c">栈（变量）</text>
  <rect x="36" y="136" width="120" height="34" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="96" y="158" text-anchor="middle" font-size="12.5" fill="#333333">变量 a</text>
  <rect x="197" y="136" width="120" height="34" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="257" y="158" text-anchor="middle" font-size="12.5" fill="#333333">变量 b</text>

  <text x="36" y="196" font-size="11.5" fill="#78909c">堆（对象）</text>
  <rect x="76" y="206" width="200" height="70" rx="4" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="176" y="234" text-anchor="middle" font-size="12.5" fill="#333333">{ x: 1, user: {...} }</text>
  <text x="176" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c62828">同一个对象</text>

  <path d="M 96 170 L 146 206" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M 257 170 L 206 206" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <rect x="36" y="352" width="281" height="30" rx="4" fill="#ffebee" stroke="#ef9a9a" stroke-width="1"/>
  <text x="176" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c62828">改 b.x → a.x 也跟着变 ❌</text>

  <!-- ============ Panel B：浅拷贝 ============ -->
  <rect x="353" y="76" width="313" height="310" rx="6" fill="#ffffff" stroke="#EF6C00" stroke-width="1.5"/>
  <rect x="353" y="76" width="313" height="32" rx="6" fill="#EF6C00"/>
  <rect x="353" y="100" width="313" height="8" fill="#EF6C00"/>
  <text x="369" y="98" font-size="13.5" font-weight="bold" fill="#ffffff">② 浅拷贝 { ...a }</text>

  <text x="369" y="126" font-size="11.5" fill="#78909c">栈（变量）</text>
  <rect x="369" y="136" width="120" height="34" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="429" y="158" text-anchor="middle" font-size="12.5" fill="#333333">变量 a</text>
  <rect x="530" y="136" width="120" height="34" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="590" y="158" text-anchor="middle" font-size="12.5" fill="#333333">变量 copy</text>

  <text x="369" y="196" font-size="11.5" fill="#78909c">堆（对象）</text>
  <rect x="369" y="206" width="135" height="70" rx="4" fill="#ffffff" stroke="#1565C0" stroke-width="1.5"/>
  <text x="436" y="234" text-anchor="middle" font-size="12" fill="#333333">{ x: 1, user }</text>
  <text x="436" y="252" text-anchor="middle" font-size="10.5" fill="#1565C0">原始对象</text>
  <rect x="515" y="206" width="135" height="70" rx="4" fill="#ffffff" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="582" y="234" text-anchor="middle" font-size="12" fill="#333333">{ x: 1, user }</text>
  <text x="582" y="252" text-anchor="middle" font-size="10.5" fill="#7B1FA2">新对象（顶层独立）</text>

  <path d="M 429 170 L 436 206" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M 590 170 L 582 206" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <rect x="409" y="292" width="200" height="52" rx="4" fill="#fff8e1" stroke="#EF6C00" stroke-width="2"/>
  <text x="509" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">仍共享的嵌套对象 { name }</text>
  <path d="M 436 276 L 479 292" stroke="#EF6C00" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M 582 276 L 539 292" stroke="#EF6C00" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <rect x="369" y="352" width="281" height="30" rx="4" fill="#fff8e1" stroke="#ffcc80" stroke-width="1"/>
  <text x="509" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#EF6C00">顶层安全，改嵌套仍互串 ⚠️</text>

  <!-- ============ Panel C：深拷贝 ============ -->
  <rect x="686" y="76" width="313" height="310" rx="6" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/>
  <rect x="686" y="76" width="313" height="32" rx="6" fill="#2E7D32"/>
  <rect x="686" y="100" width="313" height="8" fill="#2E7D32"/>
  <text x="702" y="98" font-size="13.5" font-weight="bold" fill="#ffffff">③ 深拷贝 structuredClone(a)</text>

  <text x="702" y="126" font-size="11.5" fill="#78909c">栈（变量）</text>
  <rect x="702" y="136" width="120" height="34" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="762" y="158" text-anchor="middle" font-size="12.5" fill="#333333">变量 a</text>
  <rect x="863" y="136" width="120" height="34" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="923" y="158" text-anchor="middle" font-size="12.5" fill="#333333">变量 copy</text>

  <text x="702" y="196" font-size="11.5" fill="#78909c">堆（对象）</text>
  <rect x="702" y="206" width="135" height="70" rx="4" fill="#ffffff" stroke="#1565C0" stroke-width="1.5"/>
  <text x="769" y="234" text-anchor="middle" font-size="12" fill="#333333">{ x: 1, user }</text>
  <text x="769" y="252" text-anchor="middle" font-size="10.5" fill="#1565C0">原始对象</text>
  <rect x="848" y="206" width="135" height="70" rx="4" fill="#ffffff" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="915" y="234" text-anchor="middle" font-size="12" fill="#333333">{ x: 1, user }</text>
  <text x="915" y="252" text-anchor="middle" font-size="10.5" fill="#7B1FA2">新对象</text>

  <path d="M 762 170 L 769 206" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M 923 170 L 915 206" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <rect x="702" y="292" width="135" height="52" rx="4" fill="#ffffff" stroke="#1565C0" stroke-width="1.5"/>
  <text x="769" y="322" text-anchor="middle" font-size="11.5" fill="#333333">嵌套 { name }</text>
  <rect x="848" y="292" width="135" height="52" rx="4" fill="#ffffff" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="915" y="322" text-anchor="middle" font-size="11.5" fill="#333333">新的嵌套 { name }</text>
  <path d="M 769 276 L 769 292" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M 915 276 L 915 292" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <rect x="702" y="352" width="281" height="30" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="842" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2E7D32">完全独立，怎么改都不影响 ✅</text>

  <text x="500" y="406" text-anchor="middle" font-size="11.5" fill="#5f6368">口诀：赋值只是多配一把钥匙；浅拷贝配了新钥匙但抽屉共用；深拷贝连抽屉一起复制了一份</text>
</svg>
