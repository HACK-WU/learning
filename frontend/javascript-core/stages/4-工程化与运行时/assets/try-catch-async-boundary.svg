<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="cd" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="cdr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2937">为什么 try...catch 抓不到异步里的错</text>
  <text x="24" y="56" font-size="12" fill="#64748b">关键不在「代码写在不在 try 的括号里」，而在「throw 发生时，try 所在的栈帧还在不在栈上」。</text>

  <!-- ===== 列 1：t1 同步阶段 ===== -->
  <rect x="24" y="76" width="292" height="296" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="44" y="100" font-size="13.5" font-weight="700" fill="#15803d">t₁　同步执行 handleRequest()</text>

  <rect x="44" y="112" width="252" height="176" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="56" y="130" font-size="10.5" fill="#94a3b8">调用栈（栈顶在上）</text>

  <!-- try 覆盖区 -->
  <rect x="58" y="196" width="224" height="50" rx="6" fill="#dcfce7" fill-opacity="0.55" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="66" y="190" font-size="10.5" font-weight="700" fill="#15803d">try 的有效范围（含它调用的一切）</text>

  <rect x="64" y="206" width="212" height="32" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="76" y="227" font-size="11.5" fill="#1e3a8a">handleRequest()　← try 写在它里面</text>

  <rect x="64" y="246" width="212" height="32" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="76" y="267" font-size="11.5" fill="#312e81">main / 模块顶层</text>

  <rect x="44" y="298" width="252" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="58" y="319" font-size="12" font-weight="700" fill="#15803d">✅ 此刻同步 throw → 接得住</text>
  <text x="58" y="339" font-size="11" fill="#166534">setTimeout 只是「登记」回调，</text>
  <text x="58" y="350" font-size="11" fill="#166534">并不执行它。</text>

  <!-- ===== 列 2：t2 同步结束 ===== -->
  <rect x="334" y="76" width="292" height="296" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="354" y="100" font-size="13.5" font-weight="700" fill="#475569">t₂　同步代码跑完</text>

  <rect x="354" y="112" width="252" height="176" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="366" y="130" font-size="10.5" fill="#94a3b8">调用栈（栈顶在上）</text>

  <rect x="374" y="206" width="212" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="386" y="227" font-size="11" fill="#94a3b8">（帧已销毁 —— try 随之消失）</text>

  <rect x="374" y="246" width="212" height="32" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="386" y="267" font-size="11.5" fill="#312e81">main / 模块顶层　→ 也快结束了</text>

  <rect x="354" y="298" width="252" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="368" y="319" font-size="12" font-weight="700" fill="#475569">—　回调还没执行</text>
  <text x="368" y="339" font-size="11" fill="#475569">try 的作用域随函数返回而消失，</text>
  <text x="368" y="350" font-size="11" fill="#475569">它不会「挂」在回调上等着。</text>

  <!-- ===== 列 3：t3 下一个 tick ===== -->
  <rect x="644" y="76" width="292" height="296" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="664" y="100" font-size="13.5" font-weight="700" fill="#b91c1c">t₃　事件循环的下一个 tick</text>

  <rect x="664" y="112" width="252" height="176" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="676" y="130" font-size="10.5" fill="#94a3b8">调用栈（栈顶在上）</text>

  <rect x="684" y="206" width="212" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="696" y="227" font-size="11" fill="#94a3b8">（空的 —— 栈上没有任何 try）</text>

  <rect x="684" y="246" width="212" height="32" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="696" y="267" font-size="11.5" font-weight="700" fill="#991b1b">定时器回调　throw new Error()</text>

  <path d="M 926 262 L 916 262" stroke="#dc2626" stroke-width="0" fill="none"/>
  <text x="676" y="196" font-size="10.5" font-weight="700" fill="#b91c1c">❌ 抛出的错无人接住</text>

  <rect x="664" y="298" width="252" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="678" y="319" font-size="12" font-weight="700" fill="#991b1b">❌ 异步 throw → 接不住</text>
  <text x="678" y="339" font-size="11" fill="#7f1d1d">冒泡到 uncaughtException，</text>
  <text x="678" y="350" font-size="11" fill="#7f1d1d">Node 进程退出码 1。</text>

  <!-- 时间箭头 -->
  <path d="M 320 224 L 330 224" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#cd)"/>
  <path d="M 630 224 L 640 224" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#cdr)"/>

  <!-- ===== 底部结论 ===== -->
  <rect x="24" y="386" width="912" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="44" y="409" font-size="13" font-weight="700" fill="#1e3a8a">判据：try 能接住的范围 = 「try 所在栈帧还在栈上」的那段时间里的同步执行</text>
  <text x="44" y="431" font-size="11.5" fill="#1e293b">异步回调由事件循环在<tspan font-weight="700">另一个 tick</tspan>重新压栈，那时 try 所在的帧早就没了 —— 所以「包住了」和「接得住」是两件事。回扣课 7 事件循环。</text>

</svg>
