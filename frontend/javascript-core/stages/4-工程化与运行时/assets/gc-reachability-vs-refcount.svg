<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#334155"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="452" fill="#ffffff"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1f2937">同一张对象引用图，两种算法的判断完全不同</text>
  <text x="24" y="54" font-size="12" fill="#64748b">左下角那对互相引用的对象，是引用计数算法 100% 会漏掉、而可达性算法 100% 能收掉的东西。</text>

  <!-- ===== 对象引用图 ===== -->
  <rect x="24" y="70" width="912" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="92" font-size="12.5" font-weight="700" fill="#475569">对象引用图（箭头 = 谁引用谁）</text>

  <!-- GC Roots -->
  <rect x="44" y="122" width="104" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="62" y="150" font-size="12.5" font-weight="700" fill="#1e3a8a">GC Roots</text>
  <text x="62" y="164" font-size="9.5" fill="#1e40af">根集合</text>

  <!-- 可达链 -->
  <path d="M 148 145 L 186 145" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <rect x="190" y="122" width="80" height="46" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
  <text x="204" y="150" font-size="12" font-weight="700" fill="#1f2937">对象 1</text>

  <path d="M 270 145 L 308 145" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <rect x="312" y="122" width="80" height="46" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
  <text x="326" y="150" font-size="12" font-weight="700" fill="#1f2937">对象 2</text>
  <text x="186" y="188" font-size="10.5" fill="#475569">↑ 可达链：从根出发走得到</text>

  <!-- 孤岛（循环引用） -->
  <rect x="556" y="100" width="184" height="132" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="572" y="120" font-size="11" font-weight="700" fill="#c2410c">已不可达的孤岛</text>

  <rect x="586" y="130" width="72" height="40" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
  <text x="610" y="155" font-size="12.5" font-weight="700" fill="#7c2d12">A</text>

  <rect x="586" y="192" width="72" height="40" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
  <text x="610" y="217" font-size="12.5" font-weight="700" fill="#7c2d12">B</text>

  <path d="M 658 142 C 700 142 700 152 668 158" stroke="#ea580c" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M 668 202 C 700 206 700 216 658 220" stroke="#ea580c" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="676" y="150" font-size="10" fill="#9a3412">A.ref → B</text>
  <text x="676" y="222" font-size="10" fill="#9a3412">B.ref → A</text>

  <!-- 断开的引用 -->
  <path d="M 400 145 L 470 145" stroke="#94a3b8" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/>
  <text x="410" y="138" font-size="10" fill="#64748b">原来的引用已断开</text>
  <text x="462" y="160" font-size="15" fill="#94a3b8">✂</text>

  <!-- ===== 算法对比 ===== -->
  <rect x="24" y="262" width="448" height="168" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="44" y="288" font-size="13.5" font-weight="700" fill="#b91c1c">① 引用计数：数「有几个人指着我」</text>

  <rect x="44" y="300" width="408" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="58" y="325" font-size="11.5" fill="#7f1d1d">对象 1 计数 = 1　｜　对象 2 计数 = 1　｜　A 计数 = <tspan font-weight="700">1</tspan>　｜　B 计数 = <tspan font-weight="700">1</tspan></text>

  <rect x="44" y="350" width="408" height="62" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="58" y="372" font-size="12" font-weight="700" fill="#991b1b">A、B 互相指着对方 → 计数永远 ≥ 1</text>
  <text x="58" y="394" font-size="11" fill="#7f1d1d">两个都「有人指着」，于是永远不回收 → <tspan font-weight="700">内存泄漏</tspan></text>

  <rect x="488" y="262" width="448" height="168" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="508" y="288" font-size="13.5" font-weight="700" fill="#15803d">② 可达性：从根出发，「走得到」才算活着</text>

  <rect x="508" y="300" width="408" height="40" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="522" y="325" font-size="11.5" fill="#166534">对象 1 ✓ 可达　｜　对象 2 ✓ 可达　｜　A <tspan font-weight="700">✗ 走不到</tspan>　｜　B <tspan font-weight="700">✗ 走不到</tspan></text>

  <rect x="508" y="350" width="408" height="62" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="522" y="372" font-size="12" font-weight="700" fill="#15803d">「走得到」跟「有没有人指着」无关</text>
  <text x="522" y="394" font-size="11" fill="#166534">A、B 从根出发走不到 → 整个孤岛一起回收 → <tspan font-weight="700">不泄漏</tspan></text>

</svg>
