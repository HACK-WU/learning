<svg xmlns="http://www.w3.org/2000/svg" width="960" height="492" viewBox="0 0 960 492" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="960" height="492" fill="#ffffff"/>

  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2937">加载时机的差异：CommonJS 一步走完，ESM 分三步走</text>
  <text x="24" y="56" font-size="12" fill="#64748b">这一条差异，解释了「实时绑定 vs 值拷贝」「tree-shaking」「循环依赖」三件事的全部原因。</text>

  <!-- ===== CommonJS ===== -->
  <rect x="24" y="76" width="424" height="332" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="44" y="102" font-size="14.5" font-weight="700" fill="#7c2d12">CommonJS：边加载边执行（全部在运行时）</text>

  <rect x="44" y="118" width="384" height="60" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="58" y="140" font-size="12" font-weight="700" fill="#9a3412">① 执行到 require('./m') 这一行</text>
  <text x="58" y="162" font-size="11.5" fill="#431407">立刻去加载并「执行完」目标模块，再往下一行走</text>

  <path d="M 236 178 L 236 196" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#cd)"/>

  <rect x="44" y="200" width="384" height="60" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="58" y="222" font-size="12" font-weight="700" fill="#9a3412">② 返回 module.exports</text>
  <text x="58" y="244" font-size="11.5" fill="#431407">拿到的是导出对象；解构基本类型 → <tspan font-weight="700">值的拷贝</tspan></text>

  <path d="M 236 260 L 236 278" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#cd)"/>

  <rect x="44" y="282" width="384" height="52" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/>
  <text x="58" y="304" font-size="11.5" font-weight="700" fill="#7c2d12">✗ 无法静态分析</text>
  <text x="58" y="324" font-size="11" fill="#7c2d12">require 可写在 if 里、路径可以是变量 → <tspan font-weight="700">tree-shaking 不成立</tspan></text>

  <!-- ===== ESM ===== -->
  <rect x="480" y="76" width="456" height="332" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="500" y="102" font-size="14.5" font-weight="700" fill="#1e3a8a">ESM：构建 → 实例化 → 求值（编译期 + 运行期）</text>

  <rect x="500" y="118" width="416" height="62" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="514" y="140" font-size="12" font-weight="700" fill="#1d4ed8">① 构建（编译期）：解析全部 import / export</text>
  <text x="514" y="162" font-size="11.5" fill="#1e293b">画出依赖图；此阶段就能发现语法错误与缺失的导出</text>

  <path d="M 708 180 L 708 198" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#cd)"/>

  <rect x="500" y="202" width="416" height="62" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="514" y="224" font-size="12" font-weight="700" fill="#1d4ed8">② 实例化：为每个导出建立「绑定」</text>
  <text x="514" y="246" font-size="11.5" fill="#1e293b">var → undefined；const / let → <tspan font-weight="700">TDZ（未初始化）</tspan></text>

  <path d="M 708 264 L 708 282" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#cd)"/>

  <rect x="500" y="286" width="416" height="58" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="514" y="308" font-size="12" font-weight="700" fill="#1d4ed8">③ 求值：按依赖顺序执行模块体，给绑定赋值</text>
  <text x="514" y="330" font-size="11.5" fill="#1e293b">导入方与导出方共享<tspan font-weight="700">同一个绑定</tspan> → 实时可见</text>

  <defs>
    <marker id="cd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 底部结论 -->
  <rect x="24" y="424" width="912" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="44" y="446" font-size="12" font-weight="700" fill="#0f172a">🔑 一句话</text>
  <text x="44" y="466" font-size="11.5" fill="#334155">CJS 把「加载」和「执行」混在同一步，所以只能给你一份快照；ESM 先把图画好、绑定建好，再统一求值，所以能给你<tspan font-weight="700">同一个绑定的实时值</tspan>——也正因图是静态的，tree-shaking 才成立。</text>
</svg>
