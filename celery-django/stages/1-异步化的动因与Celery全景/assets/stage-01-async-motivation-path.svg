<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="860" height="330" fill="#fafafa"/>
  <text x="26" y="32" font-size="17" font-weight="700" fill="#1a237e">阶段 1 路径 · 异步化的动因与 Celery 全景</text>
  <text x="26" y="54" font-size="12.5" fill="#555">先建立痛点，再建立架构全景 —— 每课都带一个动手环节</text>

  <!-- 课 1 -->
  <rect x="26" y="76" width="380" height="212" rx="9" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
  <rect x="26" y="76" width="380" height="32" rx="9" fill="#1565C0"/>
  <rect x="26" y="96" width="380" height="12" fill="#1565C0"/>
  <text x="42" y="99" font-size="14" font-weight="700" fill="#ffffff">课 1 · 为什么需要异步任务</text>
  <text x="42" y="130" font-size="12" fill="#0d47a1">认知层级：感知 → 概念</text>

  <rect x="42" y="144" width="348" height="30" rx="5" fill="#ffffff" stroke="#90caf9"/>
  <text x="54" y="164" font-size="12.5" fill="#1b1b1b">① 同步请求里的慢活儿</text>
  <rect x="42" y="180" width="348" height="30" rx="5" fill="#ffffff" stroke="#90caf9"/>
  <text x="54" y="200" font-size="12.5" fill="#1b1b1b">② "土办法"为什么不够（threading / cron）</text>
  <rect x="42" y="216" width="348" height="30" rx="5" fill="#ffffff" stroke="#90caf9"/>
  <text x="54" y="236" font-size="12.5" fill="#1b1b1b">③ Celery 的诞生与定位</text>

  <rect x="42" y="256" width="348" height="24" rx="5" fill="#e8eaf6"/>
  <text x="54" y="273" font-size="11.5" fill="#283593">🔧 动手：本地复现慢请求把线程池占满</text>

  <!-- 课 2 -->
  <rect x="440" y="76" width="394" height="212" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="440" y="76" width="394" height="32" rx="9" fill="#2e7d32"/>
  <rect x="440" y="96" width="394" height="12" fill="#2e7d32"/>
  <text x="456" y="99" font-size="14" font-weight="700" fill="#ffffff">课 2 · Celery 架构全景与消息流转</text>
  <text x="456" y="130" font-size="12" fill="#1b5e20">认知层级：概念 → 机制</text>

  <rect x="456" y="144" width="362" height="30" rx="5" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="468" y="164" font-size="12.5" fill="#1b1b1b">① 三大件 Producer / Broker / Worker</text>
  <rect x="456" y="180" width="362" height="30" rx="5" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="468" y="200" font-size="12.5" fill="#1b1b1b">② 一次 delay() 的完整旅程</text>
  <rect x="456" y="216" width="362" height="30" rx="5" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="468" y="236" font-size="12.5" fill="#1b1b1b">③ Result Backend 与任务状态机</text>

  <rect x="456" y="256" width="362" height="24" rx="5" fill="#e8f5e9"/>
  <text x="468" y="273" font-size="11.5" fill="#1b5e20">🔧 动手：用 redis-cli 直视队列里的任务消息</text>

  <!-- 箭头 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64" stroke="none"/>
    </marker>
  </defs>
  <path d="M410 182 L436 182" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>

  <!-- 底部收束 -->
  <rect x="26" y="300" width="808" height="20" rx="5" fill="#eceff1"/>
  <text x="40" y="314" font-size="11.5" fill="#455a64">学完能画出完整消息流转图，并判断"这个场景该不该上 Celery"</text>
</svg>
