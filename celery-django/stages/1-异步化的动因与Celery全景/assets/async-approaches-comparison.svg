<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="960" height="372" fill="#fafafa"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1a237e">四种"把慢活儿挪走"的方案 · 能力对比</text>
  <text x="24" y="52" font-size="12" fill="#555">同一件事：用户点完按钮，后台要生成一份 8 秒的报表</text>

  <!-- 表头 -->
  <rect x="24" y="66" width="912" height="36" rx="4" fill="#37474f"/>
  <text x="38" y="90" font-size="12.5" font-weight="700" fill="#ffffff">方案</text>
  <text x="178" y="90" font-size="12.5" font-weight="700" fill="#ffffff">进程重启后</text>
  <text x="318" y="90" font-size="12.5" font-weight="700" fill="#ffffff">失败重试</text>
  <text x="448" y="90" font-size="12.5" font-weight="700" fill="#ffffff">跨机器扩展</text>
  <text x="568" y="90" font-size="12.5" font-weight="700" fill="#ffffff">拿执行结果</text>
  <text x="698" y="90" font-size="12.5" font-weight="700" fill="#ffffff">可观测 / 可控</text>

  <!-- 行 1：同步阻塞 -->
  <rect x="24" y="102" width="912" height="52" rx="4" fill="#ffebee" stroke="#ef9a9a"/>
  <text x="38" y="124" font-size="13" font-weight="700" fill="#b71c1c">① 同步阻塞</text>
  <text x="38" y="142" font-size="11" fill="#c62828">在视图里直接跑</text>
  <text x="178" y="128" font-size="12" fill="#1b1b1b">不适用</text>
  <text x="178" y="144" font-size="11" fill="#757575">请求已结束</text>
  <text x="318" y="128" font-size="12" fill="#1b1b1b">只能靠用户刷新</text>
  <text x="448" y="128" font-size="12" fill="#1b1b1b">✗ 受限于 Web 进程数</text>
  <text x="568" y="128" font-size="12" fill="#1b1b1b">✓ 直接返回</text>
  <text x="568" y="144" font-size="11" fill="#757575">代价：用户干等</text>
  <text x="698" y="128" font-size="12" fill="#1b1b1b">✗ 只有 access log</text>

  <!-- 行 2：threading -->
  <rect x="24" y="158" width="912" height="52" rx="4" fill="#fff8e1" stroke="#ffcc80"/>
  <text x="38" y="180" font-size="13" font-weight="700" fill="#e65100">② threading.Thread</text>
  <text x="38" y="198" font-size="11" fill="#ef6c00">视图里起个线程跑</text>
  <text x="178" y="184" font-size="12" font-weight="700" fill="#c62828">✗ 任务凭空消失</text>
  <text x="318" y="184" font-size="12" fill="#1b1b1b">✗ 要自己写</text>
  <text x="448" y="184" font-size="12" fill="#1b1b1b">✗ 只在本进程内</text>
  <text x="568" y="184" font-size="12" fill="#1b1b1b">△ 需要队列/回调</text>
  <text x="698" y="184" font-size="12" fill="#1b1b1b">✗ 线程无身份、无状态</text>

  <!-- 行 3：cron -->
  <rect x="24" y="214" width="912" height="52" rx="4" fill="#fff8e1" stroke="#ffcc80"/>
  <text x="38" y="236" font-size="13" font-weight="700" fill="#e65100">③ cron / 管理命令</text>
  <text x="38" y="254" font-size="11" fill="#ef6c00">定时跑个脚本</text>
  <text x="178" y="240" font-size="12" fill="#1b1b1b">✓ 下次照常</text>
  <text x="318" y="240" font-size="12" fill="#1b1b1b">△ 只能整个脚本重跑</text>
  <text x="448" y="240" font-size="12" fill="#1b1b1b">△ 需自己分片</text>
  <text x="568" y="240" font-size="12" fill="#1b1b1b">△ 只能落库/发邮件</text>
  <text x="698" y="240" font-size="12" fill="#1b1b1b">△ 只有 cron 日志</text>
  <text x="698" y="256" font-size="11" fill="#757575">且无法响应"立即执行"</text>

  <!-- 行 4：Celery -->
  <rect x="24" y="270" width="912" height="52" rx="4" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="38" y="292" font-size="13" font-weight="700" fill="#1b5e20">④ Celery 任务队列</text>
  <text x="38" y="310" font-size="11" fill="#2e7d32">投递给 broker，worker 执行</text>
  <text x="178" y="296" font-size="12" font-weight="700" fill="#2e7d32">✓ 消息持久化在 broker</text>
  <text x="318" y="296" font-size="12" font-weight="700" fill="#2e7d32">✓ 内建重试 + 退避</text>
  <text x="448" y="296" font-size="12" font-weight="700" fill="#2e7d32">✓ 加 worker 即可</text>
  <text x="568" y="296" font-size="12" fill="#2e7d32">✓ Result Backend</text>
  <text x="698" y="296" font-size="12" font-weight="700" fill="#2e7d32">✓ 状态机 + 监控面板</text>

  <!-- 结论条 -->
  <rect x="24" y="334" width="912" height="26" rx="4" fill="#eceff1"/>
  <text x="38" y="352" font-size="11.5" fill="#455a64">关键分界线：②③ 的「任务」活在某台机器的某个进程内存里；④ 的「任务」是一条被持久化的消息——这正是可靠性差异的根源。</text>
</svg>
