<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1080" height="470" fill="#fafafa"/>

  <text x="24" y="30" font-size="17" font-weight="700" fill="#1a237e">canvas 三原语对比 · 数据是怎么流动的</text>
  <text x="24" y="52" font-size="12.5" fill="#555">判断依据只有一个：任务之间有没有依赖</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64" stroke="none"/>
    </marker>
  </defs>

  <!-- ========== Panel 1: group ========== -->
  <rect x="24" y="66" width="336" height="336" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="24" y="66" width="336" height="32" rx="10" fill="#2e7d32"/>
  <rect x="24" y="88" width="336" height="10" fill="#2e7d32"/>
  <text x="40" y="88" font-size="14" font-weight="700" fill="#ffffff">group · 并行</text>
  <text x="40" y="120" font-size="12" font-style="italic" fill="#1b5e20">「一群人同时干活，互不依赖」</text>

  <rect x="140" y="134" width="104" height="28" rx="5" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="192" y="152" font-size="11.5" fill="#1b1b1b" text-anchor="middle">投递端</text>

  <g stroke="#455a64" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M170 164 L126 190"/>
    <path d="M192 164 L192 190"/>
    <path d="M214 164 L258 190"/>
  </g>

  <rect x="40" y="192" width="88" height="30" rx="5" fill="#ffffff" stroke="#66bb6a"/>
  <text x="84" y="211" font-size="11.5" fill="#1b1b1b" text-anchor="middle">任务 1</text>
  <rect x="148" y="192" width="88" height="30" rx="5" fill="#ffffff" stroke="#66bb6a"/>
  <text x="192" y="211" font-size="11.5" fill="#1b1b1b" text-anchor="middle">任务 2</text>
  <rect x="256" y="192" width="88" height="30" rx="5" fill="#ffffff" stroke="#66bb6a"/>
  <text x="300" y="211" font-size="11.5" fill="#1b1b1b" text-anchor="middle">任务 3</text>

  <g stroke="#455a64" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M84 224 L84 250 L192 250 L192 272"/>
    <path d="M192 224 L192 272"/>
    <path d="M300 224 L300 250 L192 250 L192 272"/>
  </g>

  <rect x="76" y="274" width="232" height="30" rx="5" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="192" y="293" font-size="12" fill="#1b5e20" text-anchor="middle">GroupResult.get() → [r1, r2, r3]</text>

  <text x="40" y="326" font-size="11.5" font-weight="700" fill="#1b5e20">✓ 适合</text>
  <text x="40" y="344" font-size="11.5" fill="#1b1b1b">互不相关的批量任务</text>
  <text x="40" y="362" font-size="11.5" fill="#1b1b1b">（100 个门店各自生成报表）</text>
  <text x="40" y="388" font-size="11.5" font-weight="700" fill="#b71c1c">⚠ 注意</text>
  <text x="40" y="406" font-size="11.5" fill="#1b1b1b">不保证完成顺序，但</text>
  <text x="40" y="424" font-size="11.5" fill="#1b1b1b">get() 结果按投递顺序排列</text>

  <!-- ========== Panel 2: chain ========== -->
  <rect x="372" y="66" width="336" height="336" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <rect x="372" y="66" width="336" height="32" rx="10" fill="#ef6c00"/>
  <rect x="372" y="88" width="336" height="10" fill="#ef6c00"/>
  <text x="388" y="88" font-size="14" font-weight="700" fill="#ffffff">chain · 串行</text>
  <text x="388" y="120" font-size="12" font-style="italic" fill="#e65100">「流水线，结果逐级往下传」</text>

  <rect x="504" y="134" width="72" height="30" rx="5" fill="#ffffff" stroke="#ffcc80"/>
  <text x="540" y="153" font-size="11.5" fill="#1b1b1b" text-anchor="middle">fetch</text>
  <path d="M540 166 L540 190" stroke="#455a64" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="556" y="182" font-size="10.5" fill="#e65100">结果 r1</text>

  <rect x="504" y="192" width="72" height="30" rx="5" fill="#ffffff" stroke="#ffcc80"/>
  <text x="540" y="211" font-size="11.5" fill="#1b1b1b" text-anchor="middle">transform</text>
  <text x="556" y="228" font-size="10.5" fill="#e65100">← transform(r1)</text>
  <path d="M540 224 L540 248" stroke="#455a64" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <rect x="504" y="250" width="72" height="30" rx="5" fill="#ffffff" stroke="#ffcc80"/>
  <text x="540" y="269" font-size="11.5" fill="#1b1b1b" text-anchor="middle">load</text>
  <text x="556" y="286" font-size="10.5" fill="#e65100">← load(r2)</text>

  <text x="388" y="306" font-size="11.5" font-weight="700" fill="#e65100">⚠ 关键</text>
  <text x="388" y="324" font-size="11.5" fill="#1b1b1b">用 s()：上一步结果会 prepend</text>
  <text x="388" y="342" font-size="11.5" fill="#1b1b1b">到下一步参数最前面</text>
  <text x="388" y="360" font-size="11.5" fill="#1b1b1b">用 si()：忽略上一步结果</text>
  <text x="388" y="386" font-size="11.5" font-weight="700" fill="#b71c1c">⚠ 注意</text>
  <text x="388" y="404" font-size="11.5" fill="#1b1b1b">中间一步失败 → 后面全部不执行</text>
  <text x="388" y="422" font-size="11.5" fill="#1b1b1b">耗时 = 各步之和 + 每步投递延迟</text>

  <!-- ========== Panel 3: chord ========== -->
  <rect x="720" y="66" width="336" height="336" rx="10" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
  <rect x="720" y="66" width="336" height="32" rx="10" fill="#1565C0"/>
  <rect x="720" y="88" width="336" height="10" fill="#1565C0"/>
  <text x="736" y="88" font-size="14" font-weight="700" fill="#ffffff">chord · 并行后汇聚</text>
  <text x="736" y="120" font-size="12" font-style="italic" fill="#0d47a1">「全部干完，交给一个人汇总」</text>

  <rect x="736" y="134" width="88" height="28" rx="5" fill="#ffffff" stroke="#90caf9"/>
  <text x="780" y="152" font-size="11" fill="#1b1b1b" text-anchor="middle">header 1</text>
  <rect x="844" y="134" width="88" height="28" rx="5" fill="#ffffff" stroke="#90caf9"/>
  <text x="888" y="152" font-size="11" fill="#1b1b1b" text-anchor="middle">header 2</text>
  <rect x="952" y="134" width="88" height="28" rx="5" fill="#ffffff" stroke="#90caf9"/>
  <text x="996" y="152" font-size="11" fill="#1b1b1b" text-anchor="middle">header N</text>

  <g stroke="#455a64" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M780 164 L780 186 L888 186 L888 208"/>
    <path d="M888 164 L888 208"/>
    <path d="M996 164 L996 186 L888 186 L888 208"/>
  </g>

  <rect x="756" y="210" width="264" height="30" rx="5" fill="#ffe0b2" stroke="#ef6c00"/>
  <text x="888" y="229" font-size="11.5" font-weight="700" fill="#e65100" text-anchor="middle">barrier：等全部完成（同步代价高）</text>

  <path d="M888 242 L888 264" stroke="#455a64" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <rect x="780" y="266" width="216" height="30" rx="5" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="888" y="285" font-size="11.5" fill="#1b5e20" text-anchor="middle">body(results=[r1,r2,…])</text>

  <text x="736" y="322" font-size="11.5" font-weight="700" fill="#0d47a1">⚠ 强制要求</text>
  <text x="736" y="340" font-size="11.5" fill="#1b1b1b">必须配 result backend，且 header 任务</text>
  <text x="736" y="358" font-size="11.5" fill="#1b1b1b">不能 ignore_result=True</text>
  <text x="736" y="384" font-size="11.5" font-weight="700" fill="#b71c1c">⚠ 失败语义</text>
  <text x="736" y="402" font-size="11.5" fill="#1b1b1b">header 任一失败 → body 不执行</text>
  <text x="736" y="420" font-size="11.5" fill="#1b1b1b">（其余 header 任务仍会跑完）</text>

  <!-- 底部结论 -->
  <rect x="24" y="414" width="1032" height="42" rx="8" fill="#eceff1" stroke="#b0bec5"/>
  <text x="40" y="434" font-size="12.5" font-weight="700" fill="#37474f">选型口诀：没有依赖 → group ｜ 逐级依赖 → chain ｜ 并行后要汇总 → chord（但官方文档原话：synchronization is costly，能不用就不用）</text>
  <text x="40" y="450" font-size="11.5" fill="#546e7a">需要「被记住、被查询、被干预」的流程 → 别用 canvas，换工作流引擎（Temporal / Airflow / Camunda）。</text>
</svg>
