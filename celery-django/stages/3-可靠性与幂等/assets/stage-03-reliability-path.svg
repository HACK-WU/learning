<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="860" height="330" fill="#fafafa"/>
  <text x="26" y="32" font-size="17" font-weight="700" fill="#1a237e">阶段 3 路径 · 可靠性与幂等</text>
  <text x="26" y="54" font-size="12.5" fill="#555">核心命题：Celery 是「至少一次」投递 —— 任务会丢，也会重</text>

  <!-- 课 5 -->
  <rect x="26" y="76" width="380" height="212" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <rect x="26" y="76" width="380" height="32" rx="9" fill="#ef6c00"/>
  <rect x="26" y="96" width="380" height="12" fill="#ef6c00"/>
  <text x="42" y="99" font-size="14" font-weight="700" fill="#ffffff">课 5 · 确认机制与重试策略</text>
  <text x="42" y="130" font-size="12" fill="#e65100">关键词：ack 时机 / backoff / 幂等键</text>

  <rect x="42" y="144" width="348" height="30" rx="5" fill="#ffffff" stroke="#ffcc80"/>
  <text x="54" y="164" font-size="12.5" fill="#1b1b1b">① ack 时机与可见性超时</text>
  <rect x="42" y="180" width="348" height="30" rx="5" fill="#ffffff" stroke="#ffcc80"/>
  <text x="54" y="200" font-size="12.5" fill="#1b1b1b">② 重试策略（backoff / jitter / 白名单）</text>
  <rect x="42" y="216" width="348" height="30" rx="5" fill="#ffffff" stroke="#ffcc80"/>
  <text x="54" y="236" font-size="12.5" fill="#1b1b1b">③ 幂等性设计</text>

  <rect x="42" y="256" width="348" height="24" rx="5" fill="#fff3e0"/>
  <text x="54" y="273" font-size="11.5" fill="#e65100">🔧 动手：kill 掉执行中的 worker，观察任务去向</text>

  <!-- 课 6 -->
  <rect x="440" y="76" width="394" height="212" rx="9" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <rect x="440" y="76" width="394" height="32" rx="9" fill="#6a1b9a"/>
  <rect x="440" y="96" width="394" height="12" fill="#6a1b9a"/>
  <text x="456" y="99" font-size="14" font-weight="700" fill="#ffffff">课 6 · Django 事务与 ORM 的坑</text>
  <text x="456" y="130" font-size="12" fill="#4a148c">关键词：on_commit / 传 id / 连接回收</text>

  <rect x="456" y="144" width="362" height="30" rx="5" fill="#ffffff" stroke="#ce93d8"/>
  <text x="468" y="164" font-size="12.5" fill="#1b1b1b">① 事务提交后再发任务（on_commit）</text>
  <rect x="456" y="180" width="362" height="30" rx="5" fill="#ffffff" stroke="#ce93d8"/>
  <text x="468" y="200" font-size="12.5" fill="#1b1b1b">② 任务参数序列化（传 id 不传对象）</text>
  <rect x="456" y="216" width="362" height="30" rx="5" fill="#ffffff" stroke="#ce93d8"/>
  <text x="468" y="236" font-size="12.5" fill="#1b1b1b">③ worker 里的数据库连接管理</text>

  <rect x="456" y="256" width="362" height="24" rx="5" fill="#f3e5f5"/>
  <text x="468" y="273" font-size="11.5" fill="#4a148c">🔧 动手：复现"任务查不到刚创建的数据"并修好它</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64" stroke="none"/>
    </marker>
  </defs>
  <path d="M410 182 L436 182" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>

  <rect x="26" y="300" width="808" height="20" rx="5" fill="#eceff1"/>
  <text x="40" y="314" font-size="11.5" fill="#455a64">学完能配出"不丢 + 自动重试 + 业务幂等"组合，并修掉 Django 集成的经典 bug</text>
</svg>
