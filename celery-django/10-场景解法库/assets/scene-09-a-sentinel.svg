<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
<rect width="1000" height="364" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">解法 A · Redis Sentinel：解决客户端找到新主节点</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#546e7a">不等于故障前已提交的消息绝不丢失</text>
<rect x="55.0" y="95" width="189.5" height="78" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="149.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Web / worker</text>
<text x="149.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">sentinel:// 多地址</text>
<path d="M244.5 134.0 L282.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="288.5" y="95" width="189.5" height="78" rx="9" fill="#f5f7f8" stroke="#607d8b" stroke-width="2"/>
<text x="383.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Sentinel 选主</text>
<text x="383.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">发现新 master</text>
<path d="M478.0 134.0 L516.0 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="522.0" y="95" width="189.5" height="78" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="616.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">客户端重连</text>
<text x="616.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">有切换抖动</text>
<path d="M711.5 134.0 L749.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="755.5" y="95" width="189.5" height="78" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="850.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">复制窗口内的消息</text>
<text x="850.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">可能已丢失</text>
<rect x="90" y="228" width="820" height="110" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：Sentinel 自动发现 master，不承诺零复制窗口 —— 故障前写入但未复制的消息会丢。</text>
<text x="110" y="302" font-size="13" fill="#37474f">发布端必须记录 task id / business id / publish exception，靠业务层对账兜底。</text>
</svg>
