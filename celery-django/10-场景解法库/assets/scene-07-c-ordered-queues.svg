<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
<rect width="1000" height="364" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">解法 C · 多队列 + 顺序消费：简单有效</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#546e7a">-Q 写在前面的优先被轮询，prefetch=1 是关键</text>
<rect x="55.0" y="95" width="189.5" height="78" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="149.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">task_routes 分流</text>
<text x="149.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">vip / normal</text>
<path d="M244.5 134.0 L282.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="288.5" y="95" width="189.5" height="78" rx="9" fill="#f5f7f8" stroke="#607d8b" stroke-width="2"/>
<text x="383.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">worker -Q vip,normal</text>
<text x="383.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">顺序即偏好</text>
<path d="M478.0 134.0 L516.0 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="522.0" y="95" width="189.5" height="78" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="616.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">prefetch-multiplier=1</text>
<text x="616.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">关键配置</text>
<path d="M711.5 134.0 L749.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="755.5" y="95" width="189.5" height="78" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="850.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">高负载下稀释</text>
<text x="850.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">只是轮询偏好</text>
<rect x="90" y="228" width="820" height="110" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：-Q 的顺序不是严格的优先级保证，只是轮询偏好，高负载下会被稀释。</text>
<text x="110" y="302" font-size="13" fill="#37474f">漏配路由或漏配 -Q 都会让任务静默挂死。</text>
</svg>
