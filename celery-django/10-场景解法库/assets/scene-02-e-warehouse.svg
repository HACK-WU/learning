<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
<rect width="1000" height="364" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">解法 E · 换数据处理系统：Celery 只负责触发</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#546e7a">100 万条其实还不到需要 Spark 的量级</text>
<rect x="55.0" y="95" width="189.5" height="78" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="149.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">worker 逐行搬运</text>
<text x="149.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">Python 内做聚合</text>
<path d="M244.5 134.0 L282.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="288.5" y="95" width="189.5" height="78" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="383.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">提交外部作业</text>
<text x="383.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">SQL / Spark / Flink</text>
<path d="M478.0 134.0 L516.0 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="522.0" y="95" width="189.5" height="78" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="616.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">记录 external_run_id</text>
<text x="616.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">可追踪</text>
<path d="M711.5 134.0 L749.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="755.5" y="95" width="189.5" height="78" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="850.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Celery 轮询终态</text>
<text x="850.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">只做编排</text>
<rect x="90" y="228" width="820" height="110" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：引入新组件的运维成本远高于收益；先确认 SQL 侧索引、分区和增量边界。</text>
<text x="110" y="302" font-size="13" fill="#37474f">本来就是 SQL 能算完的聚合，不该把数据搬到 Python 再算一遍。</text>
</svg>
