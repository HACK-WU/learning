<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
<rect width="1000" height="364" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">解法 F · 换方案：先判断任务模型还属不属于任务队列</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#546e7a">这不是换一个更快的 Celery 配置，而是换问题模型</text>
<rect x="55.0" y="95" width="189.5" height="78" rx="9" fill="#f5f7f8" stroke="#607d8b" stroke-width="2"/>
<text x="149.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Celery 任务模型</text>
<text x="149.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">每条一次 broker 往返</text>
<path d="M244.5 134.0 L282.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="288.5" y="95" width="189.5" height="78" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="383.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">判断瓶颈</text>
<text x="383.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">broker / DB / 计算量</text>
<path d="M478.0 134.0 L516.0 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="522.0" y="95" width="189.5" height="78" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="616.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">云队列 + 消费者</text>
<text x="616.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">SQS / RQ / Dramatiq</text>
<path d="M711.5 134.0 L749.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="755.5" y="95" width="189.5" height="78" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="850.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">计算框架</text>
<text x="850.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">Spark / Flink / 数仓 SQL</text>
<rect x="90" y="228" width="820" height="110" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：把削峰转嫁给数据库（outbox 直写）在 15000/s 仍会压垮 DB，只能算过渡方案。</text>
<text x="110" y="302" font-size="13" fill="#37474f">需要严格顺序或本身就是大数据计算时，Celery 不是正确工具。</text>
</svg>
