<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
<rect width="1000" height="364" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">解法 E · 降级：直接削掉非核心任务</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#546e7a">成本为零的削量手段，但要靠开关而不是改代码发版</text>
<rect x="55.0" y="95" width="267.3" height="78" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="188.7" y="127.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">大促开关</text>
<text x="188.7" y="147.0" text-anchor="middle" font-size="12" fill="#37474f">settings.ENABLE_*</text>
<path d="M322.3 134.0 L360.3 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="366.3" y="95" width="267.3" height="78" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="500.0" y="127.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">核心任务</text>
<text x="500.0" y="147.0" text-anchor="middle" font-size="12" fill="#37474f">发券 / 通知 照发</text>
<path d="M633.7 134.0 L671.7 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="677.7" y="95" width="267.3" height="78" rx="9" fill="#f5f7f8" stroke="#607d8b" stroke-width="2"/>
<text x="811.3" y="127.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">非核心任务</text>
<text x="811.3" y="147.0" text-anchor="middle" font-size="12" fill="#37474f">写流水 直接不发</text>
<rect x="90" y="228" width="820" height="110" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：开关写死在代码里等于要发版；多实例灰度不一致会造成行为漂移。</text>
<text x="110" y="302" font-size="13" fill="#37474f">哪些任务可降级由业务 SLA 决定，不是技术单方面能定的。</text>
</svg>
