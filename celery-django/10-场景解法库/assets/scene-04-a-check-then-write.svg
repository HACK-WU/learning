<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
<rect width="1000" height="364" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">解法 A · 先查再写：并发下的检查-执行窗口（反例）</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#546e7a">看起来能跑，实际上会重复扣款 —— 明确不可用</text>
<rect x="55.0" y="95" width="189.5" height="78" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="149.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">worker-1 查询</text>
<text x="149.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">不存在 → 通过</text>
<path d="M244.5 134.0 L282.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="288.5" y="95" width="189.5" height="78" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="383.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">worker-2 查询</text>
<text x="383.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">同一时刻也不存在</text>
<path d="M478.0 134.0 L516.0 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="522.0" y="95" width="189.5" height="78" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="616.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">worker-1 扣款</text>
<text x="616.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">执行</text>
<path d="M711.5 134.0 L749.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="755.5" y="95" width="189.5" height="78" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="850.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">worker-2 扣款</text>
<text x="850.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">也执行 → 重复</text>
<rect x="90" y="228" width="820" height="110" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：检查与执行之间存在竞态窗口，两个请求同时通过检查。</text>
<text x="110" y="302" font-size="13" fill="#37474f">本解法是反例，仅用于演示，不得进入生产确定区。</text>
</svg>
