<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
<rect width="1000" height="364" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">解法 C · 业务失败账本 + 受控重放</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#546e7a">重放前先校验终态，重放时换 task id 沿用业务幂等键</text>
<rect x="55.0" y="95" width="189.5" height="78" rx="9" fill="#f5f7f8" stroke="#607d8b" stroke-width="2"/>
<text x="149.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">QUARANTINED 记录</text>
<text x="149.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">带 business_id</text>
<path d="M244.5 134.0 L282.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="288.5" y="95" width="189.5" height="78" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="383.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">检查业务终态</text>
<text x="383.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">已成功则不重放</text>
<path d="M478.0 134.0 L516.0 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="522.0" y="95" width="189.5" height="78" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="616.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">生成新 task id</text>
<text x="616.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">沿用同一幂等键</text>
<path d="M711.5 134.0 L749.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="755.5" y="95" width="189.5" height="78" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="850.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">外部已成功本地超时</text>
<text x="850.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">幂等键是唯一防线</text>
<rect x="90" y="228" width="820" height="110" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：复用原 task id 或跳过业务幂等键，会造成二次开票 / 二次发货。</text>
<text x="110" y="302" font-size="13" fill="#37474f">重放入口要记录操作者、原因、原失败记录和新 task id；批量重放要限速且有暂停开关。</text>
</svg>
