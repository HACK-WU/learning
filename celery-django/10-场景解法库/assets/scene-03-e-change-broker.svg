<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
<rect width="1000" height="364" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">解法 E · 换 broker：RabbitMQ 的原生 ack 语义</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#546e7a">只有长任务是核心业务时才值得为它迁移</text>
<rect x="55.0" y="95" width="267.3" height="78" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="188.7" y="127.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">Redis 用 vt 模拟 ack</text>
<text x="188.7" y="147.0" text-anchor="middle" font-size="12" fill="#37474f">超时即重投</text>
<path d="M322.3 134.0 L360.3 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="366.3" y="95" width="267.3" height="78" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="500.0" y="127.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">RabbitMQ 原生 ack</text>
<text x="500.0" y="147.0" text-anchor="middle" font-size="12" fill="#37474f">崩溃后立即可见</text>
<path d="M633.7 134.0 L671.7 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="677.7" y="95" width="267.3" height="78" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="811.3" y="127.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">业务副作用</text>
<text x="811.3" y="147.0" text-anchor="middle" font-size="12" fill="#37474f">换 broker 不会自动幂等</text>
<rect x="90" y="228" width="820" height="110" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：换 broker 不能消灭业务副作用重复 —— acks_late、幂等和故障演练仍要保留。</text>
<text x="110" y="302" font-size="13" fill="#37474f">只是偶尔有一个长任务时，迁移成本通常高于 A+B+C 的组合。</text>
</svg>
