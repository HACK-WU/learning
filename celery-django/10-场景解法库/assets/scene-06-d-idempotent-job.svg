<text x="811.3" y="147.0" text-anchor="middle" font-size="12" fill="#37474f">数据不翻倍</text>
<rect x="90" y="228" width="820" height="88" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：幂等只能防重复副作用，不能替代调度记录 —— 漏跑依然无感知。</text>
