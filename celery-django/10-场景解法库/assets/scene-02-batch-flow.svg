<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
  <rect width="1000" height="500" fill="#fff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">100 万条数据：从全量大任务到可续跑批次</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#546e7a">先解决内存，再决定并发；每个批次都要能重跑而不重复</text>
  <rect x="55" y="105" width="190" height="70" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="150" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">全量 QuerySet</text>
  <text x="150" y="158" text-anchor="middle" font-size="12" fill="#37474f">OOM / 失败重头来</text>
  <path d="M245 140 L320 140" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="105" width="190" height="70" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="415" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">iterator / id 游标</text>
  <text x="415" y="158" text-anchor="middle" font-size="12" fill="#37474f">稳定内存占用</text>
  <path d="M510 140 L585 140" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="585" y="105" width="190" height="70" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="680" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">chunks</text>
  <text x="680" y="158" text-anchor="middle" font-size="12" fill="#37474f">控制批次大小与并发</text>
  <path d="M775 140 L850 140" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="850" y="105" width="100" height="70" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="900" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">slow</text>
  <text x="900" y="158" text-anchor="middle" font-size="12" fill="#37474f">队列</text>
  <rect x="170" y="280" width="660" height="100" rx="10" fill="#fafafa" stroke="#90a4ae" stroke-width="2"/>
  <text x="500" y="315" text-anchor="middle" font-size="17" font-weight="bold" fill="#37474f">每个 chunk 的恢复契约</text>
  <text x="500" y="342" text-anchor="middle" font-size="13" fill="#455a64">chunk_id 唯一 · 进度可查 · 已完成跳过 · 数据库并发受控</text>
  <text x="500" y="365" text-anchor="middle" font-size="12" fill="#607d8b">并发不是越大越快：先看主库连接数、锁等待和单块耗时</text>
  <path d="M680 175 L610 280" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
