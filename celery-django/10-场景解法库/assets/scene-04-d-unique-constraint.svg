<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
<rect width="1000" height="364" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">解法 D · 唯一约束：让数据库做最终裁判</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#546e7a">最强保证，必做的兜底层</text>
<rect x="55.0" y="95" width="189.5" height="78" rx="9" fill="#f5f7f8" stroke="#607d8b" stroke-width="2"/>
<text x="149.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">写入流水</text>
<text x="149.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">带业务唯一键</text>
<path d="M244.5 134.0 L282.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="288.5" y="95" width="189.5" height="78" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="383.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">数据库唯一索引</text>
<text x="383.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">冲突即拒绝</text>
<path d="M478.0 134.0 L516.0 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="522.0" y="95" width="189.5" height="78" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="616.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">捕获 IntegrityError</text>
<text x="616.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">已扣过款</text>
<path d="M711.5 134.0 L749.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="755.5" y="95" width="189.5" height="78" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="850.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">拦截次数 &gt; 0</text>
<text x="850.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">上游在重复投递</text>
<rect x="90" y="228" width="820" height="110" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：唯一约束只保护数据库内的业务键，挡不住「外部 API 已扣款但响应超时」。</text>
<text x="110" y="302" font-size="13" fill="#37474f">拦截次数是告警信号而非防护生效的信号 —— 持续 &gt; 0 说明更上游的幂等没拦住。</text>
</svg>
