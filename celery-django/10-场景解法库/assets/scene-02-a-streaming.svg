<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
<rect width="1000" height="364" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">解法 A · 流式处理：先把内存止血</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#546e7a">iterator 分批取，不一次性把 100 万条加载进内存</text>
<rect x="55.0" y="95" width="267.3" height="78" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="188.7" y="127.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">全量 QuerySet</text>
<text x="188.7" y="147.0" text-anchor="middle" font-size="12" fill="#37474f">100 万条进内存 → OOM</text>
<path d="M322.3 134.0 L360.3 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="366.3" y="95" width="267.3" height="78" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="500.0" y="127.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">iterator</text>
<text x="500.0" y="147.0" text-anchor="middle" font-size="12" fill="#37474f">chunk_size=1000</text>
<path d="M633.7 134.0 L671.7 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="677.7" y="95" width="267.3" height="78" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="811.3" y="127.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">总耗时</text>
<text x="811.3" y="147.0" text-anchor="middle" font-size="12" fill="#37474f">仍是 5 小时</text>
<rect x="90" y="228" width="820" height="110" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：iterator 只解决内存，不解决耗时；与 prefetch_related 同时用会静默退化成 N+1，比原来更慢。</text>
<text x="110" y="302" font-size="13" fill="#37474f">chunk_size 需按数据库与查询计划压测，不是通用默认值。</text>
</svg>
