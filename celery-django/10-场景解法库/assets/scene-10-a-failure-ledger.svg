<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs>
<rect width="1000" height="364" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">解法 A · task_failure + 失败记录表</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#546e7a">让最终失败可检索、可告警、可审计</text>
<rect x="55.0" y="95" width="189.5" height="78" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="149.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">retry 1..N</text>
<text x="149.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">仍在重试</text>
<path d="M244.5 134.0 L282.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="288.5" y="95" width="189.5" height="78" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="383.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">最终失败</text>
<text x="383.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">max_retries 到头</text>
<path d="M478.0 134.0 L516.0 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="522.0" y="95" width="189.5" height="78" rx="9" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="616.8" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">task_failure 信号</text>
<text x="616.8" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">每次失败都发</text>
<path d="M711.5 134.0 L749.5 134.0" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="755.5" y="95" width="189.5" height="78" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="850.2" y="127.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">FailedTask 表</text>
<text x="850.2" y="147.0" text-anchor="middle" font-size="11" fill="#37474f">唯一键去重后落账</text>
<rect x="90" y="228" width="820" height="110" rx="10" fill="#fff8f6" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="256" font-size="16" font-weight="bold" fill="#b71c1c">失效点 / 代价</text>
<text x="110" y="280" font-size="13" fill="#37474f">失效点：task_failure 对每次 retry 都会触发，没有唯一约束会产生同一业务的多条死信。</text>
<text x="110" y="302" font-size="13" fill="#37474f">不要把完整手机号、token 写进失败表；max_retries 不要用 None 把永久失败藏起来。</text>
</svg>
