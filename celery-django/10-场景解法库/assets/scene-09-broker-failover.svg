<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#fff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">Broker 故障切换：连接恢复 ≠ 业务不丢</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#546e7a">先比较 broker 的恢复语义，再用 outbox 与幂等补上业务边界</text>

  <rect x="40" y="92" width="220" height="190" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="150" y="121" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d47a1">Redis Sentinel</text>
  <text x="60" y="151" font-size="13" fill="#263238">客户端发现新 master</text>
  <text x="60" y="177" font-size="13" fill="#263238">接受复制窗口与重连抖动</text>
  <text x="60" y="203" font-size="13" fill="#263238">业务仍需幂等 / outbox</text>
  <text x="60" y="245" font-size="12" fill="#455a64">关注：切换时间、发布异常</text>

  <rect x="390" y="92" width="220" height="190" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="500" y="121" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b5e20">RabbitMQ quorum</text>
  <text x="410" y="151" font-size="13" fill="#263238">队列复制 + confirm_publish</text>
  <text x="410" y="177" font-size="13" fill="#263238">发布是否被接受更明确</text>
  <text x="410" y="203" font-size="13" fill="#263238">QoS / autoscaling 有边界</text>
  <text x="410" y="245" font-size="12" fill="#455a64">关注：确认延迟、消费者恢复</text>

  <rect x="740" y="92" width="220" height="190" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="850" y="121" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100">托管 SQS</text>
  <text x="760" y="151" font-size="13" fill="#263238">减少 broker 节点运维</text>
  <text x="760" y="177" font-size="13" fill="#263238">仍是 visibility timeout</text>
  <text x="760" y="203" font-size="13" fill="#263238">无 Celery remote control</text>
  <text x="760" y="245" font-size="12" fill="#455a64">关注：费用、延迟、云侧指标</text>

  <rect x="40" y="330" width="220" height="90" rx="8" fill="#fafafa" stroke="#90a4ae"/>
  <text x="150" y="361" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">Django Web</text>
  <text x="150" y="386" text-anchor="middle" font-size="12" fill="#455a64">订单事务 + 发布请求</text>
  <rect x="390" y="330" width="220" height="90" rx="8" fill="#fafafa" stroke="#90a4ae"/>
  <text x="500" y="361" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">TaskOutbox</text>
  <text x="500" y="386" text-anchor="middle" font-size="12" fill="#455a64">PENDING / SENT / ERROR</text>
  <rect x="740" y="330" width="220" height="90" rx="8" fill="#fafafa" stroke="#90a4ae"/>
  <text x="850" y="361" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">Dispatcher</text>
  <text x="850" y="386" text-anchor="middle" font-size="12" fill="#455a64">重试发布 + 积压告警</text>
  <path d="M260 375 L390 375" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M610 375 L740 375" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="170" y="490" width="660" height="90" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="500" y="523" text-anchor="middle" font-size="16" font-weight="bold" fill="#880e4f">业务最终边界：幂等键 + 状态机 + 故障演练</text>
  <text x="500" y="550" text-anchor="middle" font-size="13" fill="#37474f">任何 broker 方案都可能重投；只能保证同一 business_id 不产生重复副作用</text>
  <path d="M150 420 L300 490" stroke="#ad1457" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 420 L500 490" stroke="#ad1457" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M850 420 L700 490" stroke="#ad1457" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
