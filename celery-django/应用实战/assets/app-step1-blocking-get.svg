<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="740" height="300" fill="#ffffff"/>
  <text x="370" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">基础版：后端 .get() 阻塞，异步白做了</text>

  <rect x="15" y="65" width="80" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="55" y="94" text-anchor="middle" font-size="13" fill="#0d47a1">浏览器</text>

  <path d="M95 92 L150 92" stroke="#555" stroke-width="2" marker-end="url(#b1)"/>
  <text x="122" y="82" text-anchor="middle" font-size="10" fill="#555">请求</text>

  <rect x="155" y="60" width="150" height="65" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="230" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">Django 视图</text>
  <text x="230" y="104" text-anchor="middle" font-size="11" fill="#b71c1c">r.get() 死等结果</text>
  <text x="230" y="119" text-anchor="middle" font-size="10.5" fill="#b71c1c">HTTP 连接一直挂着</text>

  <path d="M305 92 L360 92" stroke="#555" stroke-width="2" marker-end="url(#b1)"/>
  <path d="M360 108 L305 108" stroke="#555" stroke-width="2" marker-end="url(#b1)"/>

  <rect x="365" y="60" width="110" height="65" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="420" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">broker</text>
  <text x="420" y="104" text-anchor="middle" font-size="11" fill="#e65100">队列</text>

  <path d="M475 92 L530 92" stroke="#555" stroke-width="2" marker-end="url(#b1)"/>

  <rect x="535" y="60" width="110" height="65" rx="6" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="590" y="85" text-anchor="middle" font-size="13" fill="#333">worker</text>
  <text x="590" y="104" text-anchor="middle" font-size="11" fill="#666">跑 8 秒</text>

  <rect x="660" y="60" width="65" height="65" rx="6" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="692" y="85" text-anchor="middle" font-size="13" fill="#333">结果</text>
  <text x="692" y="104" text-anchor="middle" font-size="11" fill="#666">backend</text>

  <rect x="15" y="175" width="710" height="95" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="370" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">本步的问题：把异步活儿又等成了同步</text>
  <text x="370" y="226" text-anchor="middle" font-size="11.5" fill="#5f2121">请求线程被 get() 占住 8 秒 —— 异步省下的时间全还回去了</text>
  <text x="370" y="245" text-anchor="middle" font-size="11.5" fill="#5f2121">用户看到的是转圈白屏，中途完全不知道进行到哪一步</text>
  <text x="370" y="263" text-anchor="middle" font-size="11.5" fill="#5f2121">8 秒超过多数网关超时，很可能直接拿到 504（课 1 的坑重现）</text>

  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
