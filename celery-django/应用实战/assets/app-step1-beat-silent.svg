<svg xmlns="http://www.w3.org/2000/svg" width="730" height="290" viewBox="0 0 730 290" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="730" height="290" fill="#ffffff"/>
  <text x="365" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">基础版：只有 beat，跑没跑、跑了几次全靠猜</text>

  <rect x="20" y="75" width="120" height="60" rx="6" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="80" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">beat 进程</text>
  <text x="80" y="118" text-anchor="middle" font-size="11" fill="#666">到点投递</text>

  <path d="M140 105 L200 105" stroke="#555" stroke-width="2" marker-end="url(#h1)"/>

  <rect x="205" y="75" width="110" height="60" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="260" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">broker</text>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#e65100">定时消息</text>

  <path d="M315 105 L375 105" stroke="#555" stroke-width="2" marker-end="url(#h1)"/>

  <rect x="380" y="75" width="110" height="60" rx="6" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="435" y="99" text-anchor="middle" font-size="13" fill="#333">worker</text>
  <text x="435" y="118" text-anchor="middle" font-size="11" fill="#666">执行对账</text>

  <path d="M490 105 L550 105" stroke="#555" stroke-width="2" marker-end="url(#h1)"/>

  <rect x="555" y="75" width="155" height="60" rx="6" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="632" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579b">数据库</text>
  <text x="632" y="118" text-anchor="middle" font-size="11" fill="#01579b">只存业务数据</text>

  <rect x="20" y="175" width="690" height="90" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="365" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">本步的问题：没有"今天跑过没"这件事的记录</text>
  <text x="365" y="225" text-anchor="middle" font-size="11.5" fill="#5f2121">beat 挂了 → 不再投递 → 不报错、不打日志、队列长度也是 0（看起来很健康）</text>
  <text x="365" y="244" text-anchor="middle" font-size="11.5" fill="#5f2121">跑了两遍 → 数据翻倍，你只知道"数据不对"，不知道是哪次跑重了</text>
  <text x="365" y="262" text-anchor="middle" font-size="11.5" fill="#5f2121">跑到一半崩了 → 没有中间态，第二天才发现"昨天没跑完"</text>

  <defs>
    <marker id="h1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
