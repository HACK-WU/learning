<svg xmlns="http://www.w3.org/2000/svg" width="730" height="300" viewBox="0 0 730 300" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="730" height="300" fill="#ffffff"/>
  <text x="365" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">基础版：路由漏配，chord 静默挂死</text>

  <rect x="20" y="65" width="130" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="85" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0d47a1">chord：3 个子任务</text>
  <text x="85" y="106" text-anchor="middle" font-size="10.5" fill="#0d47a1">+ 1 个回调</text>

  <path d="M150 80 L205 80" stroke="#555" stroke-width="2" marker-end="url(#j1)"/>
  <path d="M150 105 L205 130" stroke="#c62828" stroke-width="2" marker-end="url(#j2)"/>

  <rect x="210" y="55" width="150" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="285" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">子任务 → fast 队列</text>
  <text x="285" y="93" text-anchor="middle" font-size="10.5" fill="#1b5e20">已配路由 ✓</text>

  <rect x="210" y="115" width="150" height="50" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="285" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">编排入口 → default</text>
  <text x="285" y="153" text-anchor="middle" font-size="10.5" fill="#b71c1c">漏配路由 ✗</text>

  <path d="M360 80 L415 80" stroke="#555" stroke-width="2" marker-end="url(#j1)"/>
  <path d="M360 140 L415 140" stroke="#c62828" stroke-width="2" marker-end="url(#j2)"/>

  <rect x="420" y="55" width="130" height="50" rx="6" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="485" y="75" text-anchor="middle" font-size="12" fill="#333">worker -Q fast</text>
  <text x="485" y="93" text-anchor="middle" font-size="10.5" fill="#666">正常消费</text>

  <rect x="420" y="115" width="150" height="50" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="495" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">default 没人消费</text>
  <text x="495" y="153" text-anchor="middle" font-size="10.5" fill="#b71c1c">消息一直积压 ✗</text>

  <path d="M570 140 L620 140" stroke="#c62828" stroke-width="2" marker-end="url(#j2)"/>

  <rect x="625" y="115" width="90" height="50" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="670" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">chord 挂死</text>
  <text x="670" y="153" text-anchor="middle" font-size="10.5" fill="#b71c1c">无报错</text>

  <rect x="20" y="190" width="695" height="90" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="365" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">本步的问题：症状在 chord，根因在路由</text>
  <text x="365" y="240" text-anchor="middle" font-size="11.5" fill="#5f2121">表现为"chord 永不完成"，但没有任何报错 —— 回调只是永远等不到触发</text>
  <text x="365" y="259" text-anchor="middle" font-size="11.5" fill="#5f2121">最容易误判为"chord_unlock 走 default 队列"，从而用"让 worker 消费 default"来掩盖真因</text>
  <text x="365" y="276" text-anchor="middle" font-size="11.5" fill="#5f2121">那个修复确实有效，但会永久掩盖漏配路由这个真问题</text>

  <defs>
    <marker id="j1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="j2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c62828"/>
    </marker>
  </defs>
</svg>
