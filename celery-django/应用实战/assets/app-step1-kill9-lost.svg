<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">基础版：sleep 5 后强杀，任务冻结在 unacked</text>

  <text x="30" y="60" font-size="12.5" font-weight="bold" fill="#444">发版脚本时间线</text>

  <rect x="30" y="72" width="120" height="42" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="90" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0d47a1">t=0s 投任务</text>
  <text x="90" y="106" text-anchor="middle" font-size="10" fill="#0d47a1">12 秒长任务</text>

  <path d="M150 93 L195 93" stroke="#555" stroke-width="2" marker-end="url(#k1)"/>

  <rect x="200" y="72" width="130" height="42" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="265" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#795548">t=3s kill -TERM</text>
  <text x="265" y="106" text-anchor="middle" font-size="10" fill="#795548">warm：无超时概念</text>

  <path d="M330 93 L375 93" stroke="#555" stroke-width="2" marker-end="url(#k1)"/>

  <rect x="380" y="72" width="130" height="42" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="445" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#795548">t=8s sleep 5 到期</text>
  <text x="445" y="106" text-anchor="middle" font-size="10" fill="#795548">任务才跑到 8/12</text>

  <path d="M510 93 L555 93" stroke="#c62828" stroke-width="2.5" marker-end="url(#k2)"/>

  <rect x="560" y="72" width="170" height="42" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="645" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b71c1c">kill -9 主进程</text>
  <text x="645" y="106" text-anchor="middle" font-size="10" fill="#b71c1c">无人善后 ✗</text>

  <rect x="30" y="140" width="330" height="120" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="195" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">停机前（任务运行中）</text>
  <text x="52" y="186" font-size="11.5" fill="#333">队列 celery</text>
  <text x="300" y="186" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2e7d32">llen = 0</text>
  <text x="52" y="208" font-size="11.5" fill="#333">unacked（hash）</text>
  <text x="300" y="208" text-anchor="end" font-size="11.5" font-weight="bold" fill="#c62828">hlen = 1</text>
  <text x="52" y="236" font-size="11" fill="#666">↑ 消息已被取走，</text>
  <text x="52" y="252" font-size="11" fill="#666">放在"已取未确认"暂存区</text>

  <rect x="400" y="140" width="330" height="120" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="565" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b71c1c">kill -9 之后（实测）</text>
  <text x="422" y="186" font-size="11.5" fill="#5f2121">队列 celery</text>
  <text x="700" y="186" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b71c1c">llen = 0  ← 骗人</text>
  <text x="422" y="208" font-size="11.5" fill="#5f2121">unacked（hash）</text>
  <text x="700" y="208" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b71c1c">hlen = 1  ← 冻在这</text>
  <text x="422" y="236" font-size="11" fill="#5f2121">↑ 一动没动。要等</text>
  <text x="422" y="252" font-size="11" fill="#5f2121">visibility_timeout = 3600 秒</text>

  <rect x="30" y="278" width="700" height="40" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="380" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#795548">本步的问题：队列长度 0 让你以为没丢任务</text>
  <text x="380" y="311" text-anchor="middle" font-size="11" fill="#795548">但任务卡在 unacked，1 小时后才会过期 —— 且必须有 worker 存活才会被搬回队列</text>

  <defs>
    <marker id="k1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="k2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c62828"/>
    </marker>
  </defs>
</svg>
