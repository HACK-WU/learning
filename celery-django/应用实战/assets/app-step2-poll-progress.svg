<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="740" height="330" fill="#ffffff"/>
  <text x="370" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">综合版：task_id 立即返回 + 前端轮询进度接口</text>

  <rect x="15" y="65" width="80" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="55" y="94" text-anchor="middle" font-size="13" fill="#0d47a1">浏览器</text>

  <path d="M95 82 L155 82" stroke="#2e7d32" stroke-width="2" marker-end="url(#c1)"/>
  <text x="125" y="72" text-anchor="middle" font-size="10" fill="#2e7d32">①提交</text>

  <rect x="160" y="58" width="140" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="230" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b5e20">提交接口</text>
  <text x="230" y="96" text-anchor="middle" font-size="10.5" fill="#1b5e20">立刻返回 task_id</text>

  <path d="M95 118 L155 118" stroke="#1565c0" stroke-width="2" marker-end="url(#c2)"/>
  <text x="122" y="112" text-anchor="middle" font-size="10" fill="#1565c0">②轮询</text>
  <path d="M155 128 L95 128" stroke="#1565c0" stroke-width="2" marker-end="url(#c2)"/>

  <rect x="160" y="110" width="140" height="42" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="230" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b5e20">进度接口</text>
  <text x="230" y="145" text-anchor="middle" font-size="10.5" fill="#1b5e20">按 task_id 查状态</text>

  <path d="M300 83 L355 83" stroke="#555" stroke-width="2" marker-end="url(#c1)"/>

  <rect x="360" y="58" width="105" height="50" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="412" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e65100">broker</text>
  <text x="412" y="96" text-anchor="middle" font-size="10.5" fill="#e65100">队列</text>

  <path d="M465 83 L515 83" stroke="#555" stroke-width="2" marker-end="url(#c1)"/>

  <rect x="520" y="58" width="110" height="50" rx="6" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="575" y="78" text-anchor="middle" font-size="12.5" fill="#333">worker</text>
  <text x="575" y="96" text-anchor="middle" font-size="10.5" fill="#666">update_state 上报</text>

  <rect x="645" y="58" width="80" height="50" rx="6" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="685" y="78" text-anchor="middle" font-size="12.5" fill="#333">backend</text>
  <text x="685" y="96" text-anchor="middle" font-size="10.5" fill="#666">存进度</text>

  <path d="M605 108 L605 131 L300 131" stroke="#1565c0" stroke-width="2" marker-end="url(#c2)"/>
  <text x="450" y="150" text-anchor="middle" font-size="10" fill="#1565c0">进度接口从 backend 读，不打扰 worker</text>

  <rect x="15" y="180" width="710" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="370" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">本步解决了什么：请求秒回，进度可查</text>
  <text x="370" y="231" text-anchor="middle" font-size="11.5" fill="#33691e">① 提交接口只投递、不等待，20ms 内返回 task_id（一个普通字符串）</text>
  <text x="370" y="251" text-anchor="middle" font-size="11.5" fill="#33691e">② 前端拿 task_id 每隔 1 秒问一次进度接口，画出「3/5 正在聚合」</text>
  <text x="370" y="271" text-anchor="middle" font-size="11.5" fill="#33691e">③ 进度由 worker 写进 backend，进度接口只读 backend —— 两者解耦</text>
  <text x="370" y="290" text-anchor="middle" font-size="11.5" fill="#33691e">代价：多一个接口 + 前端轮询逻辑；轮询间隔与超时要在前端设上限</text>

  <defs>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="c2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/>
    </marker>
  </defs>
</svg>
