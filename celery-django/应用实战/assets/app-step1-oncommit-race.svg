<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">基础版：事务未提交就发任务，worker 查不到数据</text>

  <rect x="20" y="60" width="250" height="110" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="145" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">Web 进程（Django 视图）</text>
  <text x="145" y="104" text-anchor="middle" font-size="11.5" fill="#e65100">① Order.objects.create(...)</text>
  <text x="145" y="122" text-anchor="middle" font-size="11.5" fill="#c62828">② 事务还没提交</text>
  <text x="145" y="140" text-anchor="middle" font-size="11.5" fill="#c62828">③ send_email.delay(order.id)</text>
  <text x="145" y="158" text-anchor="middle" font-size="10.5" fill="#c62828">④ 事务提交（在 delay 之后）</text>

  <path d="M270 115 L330 115" stroke="#c62828" stroke-width="2" marker-end="url(#f1)"/>
  <text x="300" y="105" text-anchor="middle" font-size="10" fill="#c62828">立即</text>

  <rect x="335" y="60" width="120" height="60" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="395" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">broker</text>
  <text x="395" y="101" text-anchor="middle" font-size="11" fill="#e65100">消息已投递</text>

  <path d="M455 90 L510 90" stroke="#c62828" stroke-width="2" marker-end="url(#f1)"/>

  <rect x="515" y="55" width="185" height="70" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="607" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">worker 查不到订单</text>
  <text x="607" y="97" text-anchor="middle" font-size="11" fill="#b71c1c">Order.DoesNotExist</text>
  <text x="607" y="114" text-anchor="middle" font-size="10.5" fill="#b71c1c">另一个连接，看不见未提交数据</text>

  <rect x="20" y="195" width="685" height="80" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="360" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">本步的问题：竞态 —— 消息跑得比事务快</text>
  <text x="360" y="245" text-anchor="middle" font-size="11.5" fill="#5f2121">worker 用的是另一个数据库连接，看不到未提交的行；消息投递是毫秒级，事务提交在它之后</text>
  <text x="360" y="264" text-anchor="middle" font-size="11.5" fill="#5f2121">更隐蔽的是：本地测试很少复现（跑得慢反而"刚好提交完了"），上生产才随机炸</text>

  <defs>
    <marker id="f1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c62828"/>
    </marker>
  </defs>
</svg>
