<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">基础版：一个队列扛所有，慢任务堵死快任务</text>

  <rect x="20" y="70" width="90" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="65" y="98" text-anchor="middle" font-size="13" fill="#0d47a1">下单请求</text>
  <text x="65" y="116" text-anchor="middle" font-size="11" fill="#0d47a1">（发券/通知/写流水）</text>

  <path d="M110 100 L165 100" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="170" y="60" width="200" height="80" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="270" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">default 队列</text>
  <text x="270" y="108" text-anchor="middle" font-size="11" fill="#e65100">慢任务在前 · 快任务排后面</text>
  <text x="270" y="126" text-anchor="middle" font-size="11" fill="#c62828">快任务被堵住，只能等</text>

  <path d="M370 100 L425 100" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="430" y="70" width="120" height="60" rx="6" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="490" y="98" text-anchor="middle" font-size="13" fill="#333">worker ×2</text>
  <text x="490" y="116" text-anchor="middle" font-size="11" fill="#666">8 个槽位全被占</text>

  <path d="M550 100 L605 100" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="610" y="70" width="95" height="60" rx="6" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="657" y="98" text-anchor="middle" font-size="13" fill="#333">数据库</text>
  <text x="657" y="116" text-anchor="middle" font-size="11" fill="#666">被波及</text>

  <rect x="20" y="185" width="685" height="80" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="360" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">本步的问题：所有任务共用一个队伍</text>
  <text x="360" y="234" text-anchor="middle" font-size="11.5" fill="#5f2121">一个跑 3 分钟的慢任务，能把后面 200 个 50ms 的快任务全堵住</text>
  <text x="360" y="252" text-anchor="middle" font-size="11.5" fill="#5f2121">队列长度看着在涨，但你分不清是谁堵的、也没法优先放行</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
