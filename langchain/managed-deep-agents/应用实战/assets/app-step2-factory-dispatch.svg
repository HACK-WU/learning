<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="540" fill="#fbfcfd"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">综合版：工厂查表，按"来源"分流而不是按"自述"分流</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">本步新增：三个土办法全删，换成"模块级配置表 + 五行工厂"；分流依据从"自述的 team"改为"撕不掉的 channel"</text>

  <rect x="30" y="86" width="250" height="128" rx="6" fill="#f7f8fa" stroke="#4b5563" stroke-width="1.5"/>
  <text x="44" y="108" font-size="12" font-weight="700" fill="#374151">模块级：CONFIGS 查表</text>
  <text x="44" y="130" font-size="9.5" fill="#4b5563">"support" → 通用模型 + 客套提示</text>
  <text x="44" y="148" font-size="9.5" fill="#4b5563">"ops"     → 强模型 + 命令风格</text>
  <text x="44" y="166" font-size="9.5" fill="#4b5563">"finance" → 强模型 + 条款引用</text>
  <text x="44" y="188" font-size="10" font-weight="700" fill="#1f5537">纯数据、无副作用</text>
  <text x="44" y="206" font-size="9.5" fill="#3f6b50">反复调用结果一致</text>

  <rect x="308" y="86" width="250" height="128" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="2"/>
  <text x="322" y="108" font-size="12" font-weight="700" fill="#1e4b7a">工厂函数体（只有 5 行）</text>
  <text x="322" y="130" font-size="9.5" fill="#3f5b78">execution = runtime.execution_runtime</text>
  <text x="322" y="148" font-size="9.5" fill="#3f5b78">channel   = runtime.channel</text>
  <text x="322" y="166" font-size="9.5" fill="#3f5b78">team      = 由 channel 推出</text>
  <text x="322" y="184" font-size="9.5" fill="#3f5b78">config    = CONFIGS.get(team, 默认)</text>
  <text x="322" y="202" font-size="9.5" fill="#3f5b78">return define_deep_agent(name=..., **config)</text>

  <rect x="586" y="86" width="284" height="128" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="600" y="108" font-size="12" font-weight="700" fill="#7a4f13">为什么不能用 server_info</text>
  <text x="600" y="130" font-size="10" fill="#7a4f13">工厂的运行时类型里没这个字段</text>
  <text x="600" y="150" font-size="10" fill="#7a4f13">实测 factory 有 server_info? False</text>
  <text x="600" y="170" font-size="10" fill="#7a4f13">tool / middleware 才有（True）</text>
  <text x="600" y="194" font-size="10" font-weight="700" fill="#7a4f13">这不是遗漏，是类型层面的分工</text>
  <text x="600" y="208" font-size="9.5" fill="#7a4f13">选配置 ≠ 判权限，后者留到工具里做</text>

  <path d="M280 150 L308 150" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c5)"/>
  <path d="M558 150 L586 150" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c5)"/>
  <defs><marker id="c5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5a6b7d"/></marker></defs>

  <rect x="30" y="236" width="412" height="150" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="2"/>
  <text x="46" y="258" font-size="12.5" font-weight="700" fill="#1f5537">分流依据：channel（撕不掉的快递单）</text>
  <text x="46" y="280" font-size="10.5" fill="#3f6b50">runtime.channel.provider 告诉你从哪进来的</text>
  <text x="46" y="300" font-size="10.5" fill="#3f6b50">七道校验全过才有值，任一不过就是 None</text>
  <text x="46" y="320" font-size="10.5" fill="#3f6b50">None 是正常情况（直接 API 调用），要有默认分支</text>
  <text x="46" y="344" font-size="10.5" font-weight="700" fill="#1f5537">工厂里 channel 依赖渠道已注册</text>
  <text x="46" y="364" font-size="10" fill="#3f6b50">channels/ 没声明时 factory 里 channel=None，声明后才有值</text>

  <rect x="458" y="236" width="412" height="150" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="2"/>
  <text x="474" y="258" font-size="12.5" font-weight="700" fill="#1e4b7a">微调依据：context（可以选的开关）</text>
  <text x="474" y="280" font-size="10.5" fill="#3f5b78">只能用来"选行为"：语言、详细程度、模板</text>
  <text x="474" y="300" font-size="10.5" fill="#3f5b78">工厂读它的唯一入口是 execution_runtime</text>
  <text x="474" y="320" font-size="10.5" fill="#3f5b78">读 schema 时 execution_runtime 是 None，必须判空</text>
  <text x="474" y="344" font-size="10.5" font-weight="700" fill="#7a2626">绝不拿它判权限</text>
  <text x="474" y="364" font-size="10" fill="#a05a5a">13 个身份保留键会被剥，但自起的业务字段不剥也不校验</text>

  <rect x="30" y="404" width="840" height="76" rx="6" fill="#f7f8fa" stroke="#4b5563" stroke-width="1.5"/>
  <text x="46" y="426" font-size="12" font-weight="700" fill="#374151">三态语义：省略 / 写具体 / 写空，第三种最容易被误读</text>
  <text x="46" y="448" font-size="10.5" fill="#4b5563">不写 skills 键 → 暴露项目全部技能　｜　skills=["...escalate"] → 只暴露这一个　｜　skills=[] → 一个都不暴露（不是"没配"）</text>
  <text x="46" y="468" font-size="10.5" fill="#4b5563">排查方法：看 dict(definition.config) 里键在不在 —— 键不存在是"没选"，键存在且为空是"选了空"</text>

  <rect x="30" y="492" width="840" height="34" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="46" y="512" font-size="10.5" fill="#7a2626">仍未解决：工厂内不能出现 if / try / for / while / with / assert / del，所以"按团队写不同提示词"只能靠查表，不能靠分支拼接</text>

  <text x="30" y="536" font-size="9" fill="#94a3b8">读图：从左到右是"配置表 → 工厂 → 为什么不能读身份"；下面两块是能用的两个来源，最底那条是工厂表达能力的硬边界。</text>
</svg>
