<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="520" fill="#fbfcfd"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">综合版：两层分离 + 三道闸 + 写入纪律</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">团队记忆走"全部署共用"，个人记忆走"已验证的人 + allow 策略"，写入靠指令约束而不是靠模型自觉</text>

  <rect x="30" y="88" width="330" height="104" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="46" y="110" font-size="12" font-weight="700" fill="#1e4b7a">identity.py：先让"人"成立</text>
  <text x="46" y="132" font-size="10" fill="#3f5b78">把默认 LangSmith API key 换成验证人的身份源</text>
  <text x="46" y="152" font-size="10" fill="#3f5b78">（Supabase / JWT / backend 三选一）</text>
  <text x="46" y="176" font-size="10" font-weight="700" fill="#1f5537">没有这一步，下面两道闸全是白写</text>

  <rect x="390" y="88" width="228" height="104" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="404" y="110" font-size="12" font-weight="700" fill="#1f5537">闸一：principal 必须是"人"</text>
  <text x="404" y="132" font-size="10" fill="#3f6b50">服务身份 → not_a_person</text>
  <text x="404" y="152" font-size="10" fill="#3f6b50">这道闸在 allow 之前</text>
  <text x="404" y="176" font-size="10" font-weight="700" fill="#3f6b50">allow 越不过它</text>

  <rect x="646" y="88" width="224" height="104" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="660" y="110" font-size="12" font-weight="700" fill="#7a4f13">闸二：allow(context)</text>
  <text x="660" y="132" font-size="10" fill="#7a4f13">默认只放行 Slack 一对一私聊</text>
  <text x="660" y="152" font-size="10" fill="#7a4f13">频道 / 群聊 / API 调用 → 拒绝</text>
  <text x="660" y="176" font-size="10" font-weight="700" fill="#7a4f13">只能放宽，不能越权</text>

  <path d="M360 140 L390 140" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c4)"/>
  <path d="M618 140 L646 140" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c4)"/>
  <defs><marker id="c4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5a6b7d"/></marker></defs>

  <rect x="30" y="212" width="420" height="122" rx="6" fill="#f7f8fa" stroke="#4b5563" stroke-width="1.5"/>
  <text x="46" y="234" font-size="12" font-weight="700" fill="#374151">agent 层 → /memories/agent/</text>
  <text x="46" y="256" font-size="10" fill="#4b5563">整个部署共用，所有调用者看到同一份</text>
  <text x="46" y="276" font-size="10" fill="#4b5563">放：团队约定、可复用流程、口径定义</text>
  <text x="46" y="296" font-size="10" fill="#4b5563">默认策略：直接放行，连 context 都不看</text>
  <text x="46" y="318" font-size="10" font-weight="700" fill="#1f5537">写入门槛最高 —— 一个人写，所有人读</text>

  <rect x="470" y="212" width="400" height="122" rx="6" fill="#f7f8fa" stroke="#4b5563" stroke-width="1.5"/>
  <text x="486" y="234" font-size="12" font-weight="700" fill="#374151">user 层 → /memories/user/</text>
  <text x="486" y="256" font-size="10" fill="#4b5563">只属于这次运行那个已验证的人</text>
  <text x="486" y="276" font-size="10" fill="#4b5563">放：个人偏好、称呼、惯用渠道</text>
  <text x="486" y="296" font-size="10" fill="#4b5563">默认策略：只放行 Slack 一对一私聊</text>
  <text x="486" y="318" font-size="10" font-weight="700" fill="#7a4f13">写入门槛低 —— 但越不了界</text>

  <rect x="30" y="354" width="840" height="112" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="2"/>
  <text x="46" y="376" font-size="13" font-weight="700" fill="#1e4b7a">本步新增：写入纪律（写在 instructions.md 里，不是代码里）</text>
  <text x="46" y="400" font-size="11" fill="#3f5b78">① 只写"下次还会用到且不会过期的结论"，不写过程、不抄原文、不写一次性的查询结果</text>
  <text x="46" y="422" font-size="11" fill="#3f5b78">② 每条 ≤ 200 字；同主题先 read_file 看有没有，有就 edit_file 改，没有才 write_file 新建</text>
  <text x="46" y="444" font-size="11" fill="#3f5b78">③ 团队记忆要写之前先在回答里说明"我准备把 X 写进团队记忆"，等人确认</text>

  <rect x="30" y="478" width="840" height="30" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="46" y="498" font-size="10.5" fill="#7a2626">仍未解决：记忆没有自动过期机制 —— 内容会一直累积，只能靠指令约束 + 定期人工巡检（场景解法库 05 给了收敛方案）</text>

  <text x="30" y="514" font-size="9.5" fill="#94a3b8">读图：从左上到右上是一条"能不能挂"的判定链，三道闸任一不过就落空；下半部两层是"挂上之后装什么"的分工。</text>
</svg>
