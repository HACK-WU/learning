<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="沙箱与权限的互斥关系及身份四条路径">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="900" height="520" fill="#ffffff"/>

  <text x="30" y="38" class="t" font-size="17" font-weight="700" fill="#0f172a">沙箱和权限规则不能同时生效，平台选了沙箱</text>
  <text x="30" y="62" class="t" font-size="12" fill="#64748b">实测：sandbox 存在时 permissions 被置为 []，且 build 阶段一句提示都没有</text>

  <rect x="30" y="86" width="250" height="120" rx="10" fill="#eff6ff" stroke="#93b4f0" stroke-width="1.5"/>
  <text x="155" y="112" class="t" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">你写的 permissions</text>
  <rect x="50" y="124" width="210" height="28" rx="5" fill="#dbeafe" stroke="#93b4f0" stroke-width="1"/>
  <text x="155" y="143" class="m" font-size="9.5" fill="#1e3a8a" text-anchor="middle">{path: /workspace/**, deny}</text>
  <text x="155" y="172" class="t" font-size="10" fill="#4b5563" text-anchor="middle">想拦住对 /workspace 的写</text>
  <text x="155" y="192" class="t" font-size="10" fill="#4b5563" text-anchor="middle">这类规则同时会禁掉 execute</text>

  <rect x="620" y="86" width="250" height="120" rx="10" fill="#f5fdf7" stroke="#8ecfa4" stroke-width="1.5"/>
  <text x="745" y="112" class="t" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">sandbox/ 目录存在</text>
  <rect x="640" y="124" width="210" height="28" rx="5" fill="#dcfce7" stroke="#8ecfa4" stroke-width="1"/>
  <text x="745" y="143" class="m" font-size="9.5" fill="#166534" text-anchor="middle">define_sandbox(...)</text>
  <text x="745" y="172" class="t" font-size="10" fill="#4b5563" text-anchor="middle">给了隔离文件系统 + shell</text>
  <text x="745" y="192" class="t" font-size="10" fill="#4b5563" text-anchor="middle">execute 工具就此可用</text>

  <line x1="284" y1="146" x2="616" y2="146" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a3)"/>
  <text x="450" y="138" class="t" font-size="10.5" fill="#b91c1c" text-anchor="middle">两者都要 → 后者胜出</text>

  <rect x="150" y="224" width="600" height="76" rx="10" fill="#fef2f2" stroke="#e9a9a2" stroke-width="1.5"/>
  <text x="450" y="250" class="t" font-size="11.5" font-weight="600" fill="#8a2f2f" text-anchor="middle">运行时实际执行（runtime.py:_mount_selected_skills）</text>
  <text x="450" y="272" class="m" font-size="11" fill="#8a2f2f" text-anchor="middle">if sandbox_backend is not None:  merged["permissions"] = []</text>
  <text x="450" y="290" class="t" font-size="10" fill="#9a3412" text-anchor="middle">实测：有沙箱时 → []；无沙箱时 → 保留你的规则并追加托管的 /skills/** 规则</text>

  <text x="30" y="334" class="t" font-size="11.5" font-weight="600" fill="#0f172a">源码给的根因，比文档多说了一层</text>
  <rect x="30" y="346" width="840" height="58" rx="8" fill="#0f172a"/>
  <text x="48" y="368" class="m" font-size="9.5" fill="#a7f3d0"># Sandbox + FilesystemPermission cannot coexist at execute() time: deepagents</text>
  <text x="48" y="384" class="m" font-size="9.5" fill="#a7f3d0"># adapts CompositeBackend and drops route prefixes, so any permission rule</text>
  <text x="48" y="400" class="m" font-size="9.5" fill="#a7f3d0"># disables shell. Rely on read-only Context Hub mounts instead.</text>

  <text x="30" y="436" class="t" font-size="11.5" font-weight="600" fill="#0f172a">那想要「沙箱 + 限制」怎么办</text>

  <rect x="30" y="448" width="405" height="60" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="50" y="470" class="t" font-size="10.5" fill="#334155">✗ 靠 permissions 拦：会被静默清空，等于没写</text>
  <text x="50" y="492" class="t" font-size="10.5" fill="#334155">✗ 靠 setup.sh 删工具：管得住镜像，管不住调用</text>

  <rect x="465" y="448" width="405" height="60" rx="9" fill="#f5fdf7" stroke="#8ecfa4" stroke-width="1.3"/>
  <text x="485" y="470" class="t" font-size="10.5" fill="#166534">✓ 只给他需要的工具（官方建议的原话方向）</text>
  <text x="485" y="492" class="t" font-size="10.5" fill="#166534">✓ 在 instructions 里写清不准改哪里</text>
</svg>
