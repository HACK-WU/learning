<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#fbfcfd"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">阶段 2 路径：从「一份提示词」到「八类能力各归其位」</text>

  <rect x="40" y="72" width="240" height="110" rx="9" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
  <text x="160" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e4b7a">课 4 · 指令、技能与工具</text>
  <text x="160" y="122" text-anchor="middle" font-size="11" fill="#334155">instructions.md 只读</text>
  <text x="160" y="140" text-anchor="middle" font-size="11" fill="#334155">skills 按需加载</text>
  <text x="160" y="158" text-anchor="middle" font-size="11" fill="#334155">tools 是普通模块</text>
  <text x="160" y="176" text-anchor="middle" font-size="10" fill="#94a3b8">卡点：什么都往提示词里塞</text>

  <rect x="330" y="72" width="240" height="110" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.5"/>
  <text x="450" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f5537">课 5 · 中间件、MCP 与检索</text>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#334155">列表顺序即嵌套顺序</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#334155">mcp.py 只声明不 import</text>
  <text x="450" y="158" text-anchor="middle" font-size="11" fill="#334155">build 不校验 MCP 配置</text>
  <text x="450" y="176" text-anchor="middle" font-size="10" fill="#94a3b8">卡点：以为 build 绿灯就配好了</text>

  <rect x="620" y="72" width="240" height="110" rx="9" fill="#fff8ec" stroke="#e0b877" stroke-width="1.5"/>
  <text x="740" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a4f13">课 6 · 记忆、沙箱与身份</text>
  <text x="740" y="122" text-anchor="middle" font-size="11" fill="#334155">两层记忆各挂一个目录</text>
  <text x="740" y="140" text-anchor="middle" font-size="11" fill="#334155">热记忆是 AGENTS.md</text>
  <text x="740" y="158" text-anchor="middle" font-size="11" fill="#334155">声明沙箱就清掉权限</text>
  <text x="740" y="176" text-anchor="middle" font-size="10" fill="#94a3b8">卡点：权限和沙箱想同时要</text>

  <line x1="282" y1="127" x2="326" y2="127" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#b1)"/>
  <line x1="572" y1="127" x2="616" y2="127" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#b1)"/>

  <rect x="40" y="212" width="820" height="96" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="60" y="236" font-size="11.5" fill="#475569">阶段 2 的判断力只有一条：面对一个新需求，先问「它属于哪一类」，再决定落哪个文件。</text>
  <text x="60" y="258" font-size="11.5" fill="#475569">写进 instructions = 每次都在场；写进 skills = 相关时才在场；写进 memory = 跨会话还在场；写成 tool = 能动手。</text>
  <text x="60" y="282" font-size="10.5" fill="#94a3b8">四者混用是这一阶段最常见的返工来源，也是后面课 9 上线前要清理的第一件事</text>
</svg>
