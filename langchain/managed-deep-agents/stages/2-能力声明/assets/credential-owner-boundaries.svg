<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="凭据的两种归属与三道边界">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="900" height="480" fill="#ffffff"/>

  <text x="32" y="38" class="t" font-size="17" font-weight="700" fill="#0f172a">密钥放在哪，决定「谁能看见谁的数据」</text>
  <text x="32" y="62" class="t" font-size="12" fill="#64748b">同样的 connections.get(...)，换个 owner 就从「共用一把钥匙」变成「各开各的门」</text>

  <rect x="32" y="88" width="398" height="150" rx="10" fill="#eff6ff" stroke="#93b4f0" stroke-width="1.5"/>
  <text x="52" y="114" class="t" font-size="12.5" font-weight="700" fill="#1e3a8a">owner = agent</text>
  <text x="52" y="138" class="t" font-size="10.5" fill="#334155">一把钥匙，所有调用者共用</text>
  <text x="52" y="160" class="m" font-size="10" fill="#3b5b9a">connections.get("tavily", {"type":"agent"})</text>
  <text x="52" y="184" class="t" font-size="10.5" fill="#4b5563">适合：公共知识库、团队频道、通用网页搜索</text>
  <text x="52" y="206" class="t" font-size="10.5" fill="#4b5563">这类凭据属于「部署」，所以要 deploy 过才建得了</text>
  <text x="52" y="228" class="t" font-size="10" fill="#9a3412">本地 dev 读 MDA_DEV_&lt;SLUG&gt;，与线上不是同一份</text>

  <rect x="452" y="88" width="416" height="150" rx="10" fill="#f5fdf7" stroke="#8ecfa4" stroke-width="1.5"/>
  <text x="472" y="114" class="t" font-size="12.5" font-weight="700" fill="#166534">owner = user</text>
  <text x="472" y="138" class="t" font-size="10.5" fill="#334155">每个调用者授权自己的账号</text>
  <text x="472" y="160" class="m" font-size="10" fill="#166534">connections.get("notion", {"type":"user"})</text>
  <text x="472" y="184" class="t" font-size="10.5" fill="#4b5563">适合：查「只有他能看」的文档、以他名义发邮件/提 issue</text>
  <text x="472" y="206" class="t" font-size="10.5" fill="#4b5563">缺少授权时不会报错，而是抛一个 interrupt 等用户点同意</text>
  <text x="472" y="228" class="t" font-size="10" fill="#9a3412">代码永远不传 user id——运行时自己解析调用者</text>

  <text x="32" y="278" class="t" font-size="11.5" font-weight="600" fill="#0f172a">三道边界：写错任何一道，密钥都会跑到不该到的地方</text>

  <rect x="32" y="292" width="264" height="120" rx="10" fill="#fef7f6" stroke="#e9a9a2" stroke-width="1.3"/>
  <text x="52" y="316" class="t" font-size="11" font-weight="600" fill="#8a2f2f">边界 ①：不写进项目</text>
  <text x="52" y="338" class="t" font-size="10" fill="#4b5563">.env 里的值会在每次 deploy 时被收走，</text>
  <text x="52" y="356" class="t" font-size="10" fill="#4b5563">作为部署密钥存在云端；connection 的值</text>
  <text x="52" y="374" class="t" font-size="10" fill="#4b5563">留在 workspace，不进仓库、不进镜像。</text>
  <text x="52" y="396" class="t" font-size="10" fill="#9a3412">给 agent 单独签发密钥，别复用人人的</text>

  <rect x="316" y="292" width="264" height="120" rx="10" fill="#fff7ed" stroke="#e0b877" stroke-width="1.3"/>
  <text x="336" y="316" class="t" font-size="11" font-weight="600" fill="#7a4f13">边界 ②：不进提示词</text>
  <text x="336" y="338" class="t" font-size="10" fill="#4b5563">密钥只活在工具代码里，模型看不到。</text>
  <text x="336" y="356" class="t" font-size="10" fill="#4b5563">一旦把密钥当工具参数，它就会进对话</text>
  <text x="336" y="374" class="t" font-size="10" fill="#4b5563">历史、进日志、进追踪。</text>
  <text x="336" y="396" class="t" font-size="10" fill="#9a3412">connections.get 在函数体内调用即可</text>

  <rect x="600" y="292" width="268" height="120" rx="10" fill="#eff6ff" stroke="#93b4f0" stroke-width="1.3"/>
  <text x="620" y="316" class="t" font-size="11" font-weight="600" fill="#1e3a8a">边界 ③：不拿 context 判权</text>
  <text x="620" y="338" class="t" font-size="10" fill="#4b5563">context 由调用方传，可伪造；</text>
  <text x="620" y="356" class="t" font-size="10" fill="#4b5563">server_info.principal 才是验证过的。</text>
  <text x="620" y="374" class="t" font-size="10" fill="#4b5563">credential gate 会剥掉客户端塞的</text>
  <text x="620" y="392" class="t" font-size="10" fill="#4b5563">identity 键，所以篡改是无效的。</text>
  <text x="620" y="408" class="t" font-size="10" fill="#9a3412">授权看 principal，行为才看 context</text>

  <rect x="32" y="432" width="836" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="450" y="453" class="t" font-size="11.5" fill="#334155" text-anchor="middle">一句话：agent-owned 是「这个部署的一把钥匙」，user-owned 是「每个人的钥匙」——选错的后果是数据串台，不是报错</text>
</svg>
