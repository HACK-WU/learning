<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="中间件包装顺序与托管层的插入位置">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="880" height="500" fill="#ffffff"/>

  <text x="32" y="38" class="t" font-size="17" font-weight="700" fill="#0f172a">列表里的第一个，是最外层的那个</text>
  <text x="32" y="62" class="t" font-size="12" fill="#64748b">middleware=[first, second] 的实际嵌套：写在前面的包住写在后面的</text>

  <rect x="32" y="86" width="404" height="228" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="52" y="110" class="t" font-size="11.5" font-weight="600" fill="#334155">嵌套结构（谁包住谁）</text>

  <rect x="60" y="126" width="348" height="150" rx="8" fill="#fef7f6" stroke="#e9a9a2" stroke-width="1.6"/>
  <text x="76" y="150" class="m" font-size="11.5" fill="#8a2f2f">first   ← middleware[0]</text>

  <rect x="88" y="162" width="292" height="96" rx="8" fill="#fff7ed" stroke="#e0b877" stroke-width="1.6"/>
  <text x="104" y="186" class="m" font-size="11.5" fill="#7a4f13">second   ← middleware[1]</text>

  <rect x="116" y="196" width="238" height="46" rx="8" fill="#f0fdf4" stroke="#8ecfa4" stroke-width="1.6"/>
  <text x="235" y="224" class="t" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">真正的工具执行</text>

  <text x="52" y="298" class="t" font-size="10.5" fill="#64748b">进入顺序：first → second → 工具。返回顺序相反。</text>

  <rect x="452" y="86" width="396" height="228" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="472" y="110" class="t" font-size="11.5" font-weight="600" fill="#334155">实测输出（假模型 + 真工具，单次调用）</text>

  <rect x="472" y="126" width="356" height="88" rx="8" fill="#0f172a"/>
  <text x="490" y="152" class="m" font-size="11.5" fill="#a7f3d0">ORDER: first&gt; second&gt; TOOL</text>
  <text x="490" y="172" class="m" font-size="11.5" fill="#a7f3d0">        &lt;second &lt;first</text>
  <text x="490" y="198" class="m" font-size="10" fill="#64748b">middleware=[first, second]</text>

  <text x="472" y="240" class="t" font-size="10.5" fill="#4b5563">「前」按列表正序，「后」按列表反序——</text>
  <text x="472" y="260" class="t" font-size="10.5" fill="#4b5563">这是标准的包装（洋葱）语义，不是队列。</text>
  <text x="472" y="286" class="t" font-size="10.5" fill="#9a3412">推论：想做「最外层兜底」，写在列表第一个。</text>

  <rect x="32" y="332" width="816" height="140" rx="10" fill="#eff6ff" stroke="#93b4f0" stroke-width="1.3"/>
  <text x="52" y="356" class="t" font-size="11.5" font-weight="600" fill="#1e3a8a">托管层会往这个列表里插东西，别指望自己是第一层</text>

  <text x="52" y="382" class="t" font-size="10.5" fill="#334155">运行时在 create_deep_agent 之前做了这些插入（0.9.5 源码 runtime.py 实测）：</text>

  <rect x="52" y="394" width="180" height="26" rx="6" fill="#dbeafe" stroke="#93b4f0" stroke-width="1.1"/>
  <text x="142" y="412" class="t" font-size="10" fill="#1e3a8a" text-anchor="middle">凭据闸门（最前）</text>

  <rect x="244" y="394" width="170" height="26" rx="6" fill="#dbeafe" stroke="#93b4f0" stroke-width="1.1"/>
  <text x="329" y="412" class="t" font-size="10" fill="#1e3a8a" text-anchor="middle">Slack 文件与投递</text>

  <rect x="426" y="394" width="192" height="26" rx="6" fill="#fff7ed" stroke="#e0b877" stroke-width="1.1"/>
  <text x="522" y="412" class="t" font-size="10" fill="#7a4f13" text-anchor="middle">你写的中间件（原序）</text>

  <rect x="630" y="394" width="198" height="26" rx="6" fill="#dbeafe" stroke="#93b4f0" stroke-width="1.1"/>
  <text x="729" y="412" class="t" font-size="10" fill="#1e3a8a" text-anchor="middle">渠道响应格式 + 记忆指令</text>

  <text x="52" y="444" class="t" font-size="10.5" fill="#9a3412">实测编译后节点里能看到 PatchToolCallsMiddleware.before_agent、mda-schedule-delivery.after_agent 等托管件。</text>
  <text x="52" y="462" class="t" font-size="10.5" fill="#9a3412">所以「我的中间件在最外层」这个假设不成立；要精确控制边界，用 hook 自身的判断而不是位置博弈。</text>
</svg>
