<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="MCP 声明从文件到运行期的三段校验，以及文档与实测版本的差异">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="900" height="520" fill="#ffffff"/>

  <text x="32" y="38" class="t" font-size="17" font-weight="700" fill="#0f172a">MCP 的校验分三段，build 只做最浅的一段</text>
  <text x="32" y="62" class="t" font-size="12" fill="#64748b">声明写在 tools/mcp.py，但真正连不连得上，要到运行时才见分晓</text>

  <rect x="32" y="84" width="200" height="96" rx="10" fill="#eff6ff" stroke="#93b4f0" stroke-width="1.5"/>
  <text x="132" y="110" class="t" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">① 写文件</text>
  <text x="132" y="132" class="m" font-size="10.5" fill="#3b5b9a" text-anchor="middle">tools/mcp.py</text>
  <text x="132" y="152" class="t" font-size="10" fill="#64748b" text-anchor="middle">导出名为 mcp 的对象</text>
  <text x="132" y="170" class="t" font-size="10" fill="#64748b" text-anchor="middle">不需要 import 进入口</text>

  <rect x="264" y="84" width="200" height="96" rx="10" fill="#f0fdf4" stroke="#8ecfa4" stroke-width="1.5"/>
  <text x="364" y="110" class="t" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">② mda build</text>
  <text x="364" y="132" class="t" font-size="10" fill="#166534" text-anchor="middle">只收集、生成桥接模块</text>
  <text x="364" y="152" class="t" font-size="10" fill="#166534" text-anchor="middle">不连远端、不校验配置</text>
  <text x="364" y="170" class="t" font-size="10" fill="#9a3412" text-anchor="middle">stdio / 非法 transport 都放行</text>

  <rect x="496" y="84" width="200" height="96" rx="10" fill="#fff7ed" stroke="#e0b877" stroke-width="1.5"/>
  <text x="596" y="110" class="t" font-size="12" font-weight="600" fill="#7a4f13" text-anchor="middle">③ 导入模块</text>
  <text x="596" y="132" class="t" font-size="10" fill="#7a4f13" text-anchor="middle">pydantic 校验触发</text>
  <text x="596" y="152" class="t" font-size="10" fill="#9a3412" text-anchor="middle">stdio / 非法值 / 白黑名单</text>
  <text x="596" y="170" class="t" font-size="10" fill="#9a3412" text-anchor="middle">都在这里炸 ValueError</text>

  <rect x="728" y="84" width="140" height="96" rx="10" fill="#fef2f2" stroke="#e9a9a2" stroke-width="1.5"/>
  <text x="798" y="110" class="t" font-size="12" font-weight="600" fill="#8a2f2f" text-anchor="middle">④ 建图</text>
  <text x="798" y="132" class="t" font-size="10" fill="#8a2f2f" text-anchor="middle">真连远端</text>
  <text x="798" y="152" class="t" font-size="10" fill="#8a2f2f" text-anchor="middle">列工具清单</text>
  <text x="798" y="170" class="t" font-size="10" fill="#8a2f2f" text-anchor="middle">连不上就抛</text>

  <line x1="232" y1="132" x2="260" y2="132" stroke="#64748b" stroke-width="1.8" marker-end="url(#a3)"/>
  <line x1="464" y1="132" x2="492" y2="132" stroke="#64748b" stroke-width="1.8" marker-end="url(#a3)"/>
  <line x1="696" y1="132" x2="724" y2="132" stroke="#64748b" stroke-width="1.8" marker-end="url(#a3)"/>

  <text x="32" y="212" class="t" font-size="11.5" font-weight="600" fill="#0f172a">三段实测：同样一个坏声明，只有后两段会喊</text>

  <rect x="32" y="226" width="836" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="52" y="250" class="m" font-size="10.5" fill="#334155">transport: "stdio"          →  build: ◇ Managed app compiled exit=0   ·   import: ValueError（uses a stdio transport, which is not supported）</text>
  <text x="52" y="274" class="m" font-size="10.5" fill="#334155">transport: "websocket"      →  build: ◇ Managed app compiled exit=0   ·   import: ValueError（must declare a remote transport）</text>
  <text x="52" y="298" class="m" font-size="10.5" fill="#334155">白名单与黑名单含同一工具    →  build: ◇ Managed app compiled exit=0   ·   import: ValueError（selects tool(s) in both）</text>
  <text x="52" y="322" class="t" font-size="10.5" fill="#9a3412">端点不可达（DNS 失败）      →  build 与 import 都过，建图时 EnvironmentError: Client failed to connect</text>

  <text x="32" y="372" class="t" font-size="11.5" font-weight="600" fill="#0f172a">文档写的 0.9.5 实际不接受的四个配置项（实测逐个验证）</text>

  <rect x="32" y="386" width="404" height="112" rx="10" fill="#fef7f6" stroke="#e9a9a2" stroke-width="1.3"/>
  <text x="52" y="410" class="t" font-size="10.5" fill="#8a2f2f">官方页仍列出：</text>
  <text x="52" y="432" class="m" font-size="10" fill="#8a2f2f">prefix_tool_name_with_server_name</text>
  <text x="52" y="452" class="m" font-size="10" fill="#8a2f2f">default_tool_timeout</text>
  <text x="52" y="472" class="m" font-size="10" fill="#8a2f2f">automatic_sse_fallback / reconnect</text>
  <text x="52" y="490" class="t" font-size="9.5" fill="#9a3412">照抄会得到 removed in 0.9 的 ValueError</text>

  <rect x="464" y="386" width="404" height="112" rx="10" fill="#f5fdf7" stroke="#8ecfa4" stroke-width="1.3"/>
  <text x="484" y="410" class="t" font-size="10.5" fill="#166534">0.9.5 实际接受：</text>
  <text x="484" y="432" class="m" font-size="10" fill="#166534">timeout / sse_read_timeout（sse 专属）</text>
  <text x="484" y="452" class="m" font-size="10" fill="#166534">include_tools / exclude_tools</text>
  <text x="484" y="472" class="m" font-size="10" fill="#166534">headers / connection / throw_on_load_error</text>
  <text x="484" y="490" class="t" font-size="9.5" fill="#166534">工具名由 group.py:248 拼成 {server}_{tool}，前缀开关已删</text>
</svg>
