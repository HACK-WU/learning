<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#fbfcfd"/>
  <text x="470" y="32" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1f2937">同一个字段，三种写法，三种结局</text>
  <text x="470" y="56" text-anchor="middle" font-size="11.5" fill="#64748b">"不写"和"写空"完全不是一回事——这是本课最容易踩的一脚</text>

  <rect x="40" y="80" width="268" height="316" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="174" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">不写这个字段</text>
  <text x="174" y="130" text-anchor="middle" font-size="10.5" fill="#64748b">（连参数都不传）</text>
  <rect x="60" y="146" width="228" height="34" rx="5" fill="#eef2f6" stroke="#b6c2cf"/>
  <text x="174" y="168" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#334155">define_deep_agent(name="x")</text>
  <text x="174" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">沿用项目文件里的那份</text>
  <text x="60" y="234" font-size="10.5" fill="#475569">· 读 instructions.md</text>
  <text x="60" y="254" font-size="10.5" fill="#475569">· 挂上 skills/ 全部技能</text>
  <text x="60" y="274" font-size="10.5" fill="#475569">· 用 mcp.py 声明的连接器</text>
  <text x="60" y="294" font-size="10.5" fill="#475569">· 开 sandbox/ 的沙箱</text>
  <rect x="60" y="312" width="228" height="46" rx="6" fill="#eef6ff" stroke="#a9ccea"/>
  <text x="76" y="331" font-size="10.5" font-weight="600" fill="#1e4b7a">结果：键根本不存在</text>
  <text x="76" y="349" font-size="9.8" fill="#1e4b7a">config 里只有 ['name']</text>
  <text x="174" y="380" text-anchor="middle" font-size="10" fill="#64748b">适合：大部分运行用默认配置</text>

  <rect x="336" y="80" width="268" height="316" rx="10" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.5"/>
  <text x="470" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#1f5537">写一个新值</text>
  <text x="470" y="130" text-anchor="middle" font-size="10.5" fill="#357a52">（这次用这个）</text>
  <rect x="356" y="146" width="228" height="34" rx="5" fill="#e6f4ea" stroke="#a8d4b8"/>
  <text x="470" y="168" text-anchor="middle" font-size="9.8" font-family="ui-monospace, monospace" fill="#1f5537">instructions="本次专用提示词"</text>
  <text x="470" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#1f5537">整体替换项目文件那份</text>
  <text x="356" y="234" font-size="10.5" fill="#2f6b48">· 项目 instructions.md 不再读</text>
  <text x="356" y="254" font-size="10.5" fill="#2f6b48">· skills 只挂点名的那些</text>
  <text x="356" y="274" font-size="10.5" fill="#2f6b48">· mcp 只连点到的那几个</text>
  <text x="356" y="294" font-size="10.5" fill="#2f6b48">· sandbox 换成新的声明</text>
  <rect x="356" y="312" width="228" height="46" rx="6" fill="#eaf6ee" stroke="#a8d4b8"/>
  <text x="372" y="331" font-size="10.5" font-weight="600" fill="#1f5537">结果：键在，值是新的</text>
  <text x="372" y="349" font-size="9.8" fill="#1f5537">只影响这一次运行</text>
  <text x="470" y="380" text-anchor="middle" font-size="10" fill="#64748b">适合：按租户 / 按仓库分流</text>

  <rect x="632" y="80" width="268" height="316" rx="10" fill="#fef6e7" stroke="#d9a94c" stroke-width="1.5"/>
  <text x="766" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#7a5210">写一个"空"</text>
  <text x="766" y="130" text-anchor="middle" font-size="10.5" fill="#8a6a2a">（这次什么都不要）</text>
  <rect x="652" y="146" width="228" height="34" rx="5" fill="#fdf6e6" stroke="#e6cf9a"/>
  <text x="766" y="168" text-anchor="middle" font-size="9.8" font-family="ui-monospace, monospace" fill="#7a5210">instructions="" / skills=[]</text>
  <text x="766" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#7a5210">项目文件那份被压掉</text>
  <text x="652" y="234" font-size="10.5" fill="#6b4d14">· <tspan font-family="ui-monospace, monospace" font-size="9.8">""</tspan> → 作者指令清空</text>
  <text x="652" y="254" font-size="10.5" fill="#6b4d14">· <tspan font-family="ui-monospace, monospace" font-size="9.8">[]</tspan> → 一个技能都不给</text>
  <text x="652" y="274" font-size="10.5" fill="#6b4d14">· <tspan font-family="ui-monospace, monospace" font-size="9.8">[]</tspan> → 一个 MCP 工具都不给</text>
  <text x="652" y="294" font-size="10.5" fill="#6b4d14">· <tspan font-family="ui-monospace, monospace" font-size="9.8">None</tspan> → 沙箱直接关掉</text>
  <rect x="652" y="312" width="228" height="46" rx="6" fill="#fdf1de" stroke="#e6cf9a"/>
  <text x="668" y="331" font-size="10.5" font-weight="600" fill="#7a5210">结果：键在，值是空</text>
  <text x="668" y="349" font-size="9.8" fill="#7a5210">项目默认被覆盖，不是被忽略</text>
  <text x="766" y="380" text-anchor="middle" font-size="10" fill="#64748b">适合：给某类运行做能力收窄</text>

  <rect x="40" y="424" width="880" height="132" rx="9" fill="#fdf2f2" stroke="#d99a9a" stroke-width="1.3"/>
  <text x="60" y="450" font-size="12" font-weight="600" fill="#7a2626">两个必须记住的例外</text>
  <text x="60" y="476" font-size="10.8" fill="#7f5a5a">① 记忆（memory）不能按运行选。四个字段里没有它——想按运行收窄，只能用 <tspan font-family="ui-monospace, monospace" font-size="10">allow</tspan> 策略在挂载前判一次，而不是在工厂里换一份声明。</text>
  <text x="60" y="500" font-size="10.8" fill="#7f5a5a">② "空"必须是那个类型认得的空。<tspan font-family="ui-monospace, monospace" font-size="10">instructions=123</tspan> 不会被当成"清空"，而是直接 <tspan font-family="ui-monospace, monospace" font-size="10">TypeError: instructions must be a string or None</tspan>；<tspan font-family="ui-monospace, monospace" font-size="10">sandbox={}</tspan> 也同理。</text>
  <text x="60" y="528" font-size="10.8" fill="#7f5a5a">实测：全省略时 config 只有 <tspan font-family="ui-monospace, monospace" font-size="10">['name']</tspan>；全写 None 时 5 个键全在且值为 None。<tspan font-family="ui-monospace, monospace" font-size="10">skills=[]</tspan> 存的是 <tspan font-family="ui-monospace, monospace" font-size="10">tuple(len=0)</tspan>，不是空列表——两者在运行期等价，但排查时看到的值不同。</text>
</svg>
