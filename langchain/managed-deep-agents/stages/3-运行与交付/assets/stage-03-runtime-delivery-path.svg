<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#fbfcfd"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">阶段 3 路径：从「能本地跑」到「敢让它自己去跑」</text>

  <rect x="40" y="72" width="240" height="112" rx="9" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
  <text x="160" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e4b7a">课 7 · 运行时上下文</text>
  <text x="160" y="122" text-anchor="middle" font-size="11" fill="#334155">三个来源分信任级别</text>
  <text x="160" y="140" text-anchor="middle" font-size="11" fill="#334155">工厂调四次·看不到身份</text>
  <text x="160" y="158" text-anchor="middle" font-size="11" fill="#334155">不写≠写空·两种结局</text>
  <text x="160" y="176" text-anchor="middle" font-size="10" fill="#94a3b8">卡点：拿 context 当鉴权</text>

  <rect x="330" y="72" width="240" height="112" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.5"/>
  <text x="450" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f5537">课 8 · 通道与调度</text>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#334155">入站·出站·供给三件套</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#334155">cron 五段 · 线程选型</text>
  <text x="450" y="158" text-anchor="middle" font-size="11" fill="#334155">agent 主动发问</text>
  <text x="450" y="176" text-anchor="middle" font-size="10" fill="#94a3b8">卡点：以为通道运行也有 context</text>

  <rect x="620" y="72" width="240" height="112" rx="9" fill="#fff8ec" stroke="#e0b877" stroke-width="1.5"/>
  <text x="740" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a4f13">课 9 · 部署、评估与收口</text>
  <text x="740" y="122" text-anchor="middle" font-size="11" fill="#334155">mda deploy 全链路</text>
  <text x="740" y="140" text-anchor="middle" font-size="11" fill="#334155">Context Hub 冲突</text>
  <text x="740" y="158" text-anchor="middle" font-size="11" fill="#334155">迁移清单 · 决策树</text>
  <text x="740" y="176" text-anchor="middle" font-size="10" fill="#94a3b8">卡点：以为 build 过就能上线</text>

  <line x1="282" y1="128" x2="326" y2="128" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c1)"/>
  <line x1="572" y1="128" x2="616" y2="128" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c1)"/>

  <rect x="40" y="214" width="400" height="88" rx="9" fill="#fdf2f2" stroke="#d99a9a" stroke-width="1.4"/>
  <text x="60" y="238" font-size="11.5" font-weight="600" fill="#7a2626">上线前必须回答的四个问题</text>
  <text x="60" y="260" font-size="10.5" fill="#7f5a5a">① 谁在调用，凭什么证明是他　② 记忆该共享到哪一层</text>
  <text x="60" y="280" font-size="10.5" fill="#7f5a5a">③ 沙箱要开吗，开了权限怎么办　④ 出事了看哪里</text>

  <rect x="460" y="214" width="400" height="88" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="480" y="238" font-size="11.5" font-weight="600" fill="#475569">阶段 3 的终态</text>
  <text x="480" y="260" font-size="10.5" fill="#475569">一个接在真实入口上、按点自跑、</text>
  <text x="480" y="280" font-size="10.5" fill="#475569">多用户隔离、出错能查的托管 agent</text>
</svg>
