<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="g1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6b7d"/>
    </marker>
    <marker id="g2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#fbfcfd"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">build 与 dev：两道闸门，各拦一半</text>

  <rect x="24" y="54" width="196" height="358" rx="12" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
  <text x="122" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1e4b7a">你写的文件</text>
  <rect x="42" y="96" width="160" height="52" rx="7" fill="#ffffff" stroke="#a9c9e6" stroke-width="1.2"/>
  <text x="122" y="116" text-anchor="middle" font-size="10.5" fill="#334155">agent.py / .ts</text>
  <text x="122" y="134" text-anchor="middle" font-size="9.5" fill="#6b7280">name / model / tools</text>
  <rect x="42" y="158" width="160" height="52" rx="7" fill="#ffffff" stroke="#a9c9e6" stroke-width="1.2"/>
  <text x="122" y="178" text-anchor="middle" font-size="10.5" fill="#334155">instructions.md</text>
  <text x="122" y="196" text-anchor="middle" font-size="9.5" fill="#6b7280">托管的系统提示</text>
  <rect x="42" y="220" width="160" height="52" rx="7" fill="#ffffff" stroke="#a9c9e6" stroke-width="1.2"/>
  <text x="122" y="240" text-anchor="middle" font-size="10.5" fill="#334155">tools/ · middleware/</text>
  <text x="122" y="258" text-anchor="middle" font-size="9.5" fill="#6b7280">普通模块</text>
  <rect x="42" y="282" width="160" height="52" rx="7" fill="#ffffff" stroke="#a9c9e6" stroke-width="1.2"/>
  <text x="122" y="302" text-anchor="middle" font-size="10.5" fill="#334155">sandbox/ · identity</text>
  <text x="122" y="320" text-anchor="middle" font-size="9.5" fill="#6b7280">存在即开启</text>
  <text x="122" y="370" text-anchor="middle" font-size="9.5" fill="#6b7280">.env 本地加载</text>
  <text x="122" y="388" text-anchor="middle" font-size="9.5" fill="#6b7280">不进构建包</text>

  <line x1="220" y1="150" x2="268" y2="150" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#g1)"/>
  <line x1="220" y1="290" x2="268" y2="290" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#g1)"/>

  <rect x="272" y="92" width="212" height="122" rx="12" fill="#fff8ec" stroke="#e0b877" stroke-width="1.6"/>
  <text x="378" y="116" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a4f13">第一道：mda build</text>
  <text x="378" y="138" text-anchor="middle" font-size="10" fill="#7a4f13">只读文本，不 import 你的模块</text>
  <text x="378" y="158" text-anchor="middle" font-size="10" fill="#7a4f13">查：参数是否托管、name 是否字面量</text>
  <text x="378" y="178" text-anchor="middle" font-size="10" fill="#7a4f13">产出：.mda/build/ + 胶水文件</text>
  <text x="378" y="200" text-anchor="middle" font-size="10" fill="#9a3412">拦不住的：import 错、密钥缺、包没装</text>

  <rect x="272" y="236" width="212" height="122" rx="12" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.6"/>
  <text x="378" y="260" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e4b7a">第二道：mda dev</text>
  <text x="378" y="282" text-anchor="middle" font-size="10" fill="#334155">真的 import、真的编译、真的起 server</text>
  <text x="378" y="302" text-anchor="middle" font-size="10" fill="#334155">查：模块能否加载、定义能否编译</text>
  <text x="378" y="322" text-anchor="middle" font-size="10" fill="#334155">产出：本地 API + Studio 打开入口</text>
  <text x="378" y="344" text-anchor="middle" font-size="10" fill="#9a3412">拦不住的：缺密钥（会告警但 server 照起）</text>

  <line x1="484" y1="150" x2="532" y2="150" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#g1)"/>
  <line x1="484" y1="296" x2="532" y2="296" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#g1)"/>

  <rect x="536" y="92" width="196" height="122" rx="12" fill="#ffffff" stroke="#c9b6e5" stroke-width="1.5"/>
  <text x="634" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#4c2f7a">编译产物</text>
  <text x="634" y="140" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#334155">_mda_entry.py</text>
  <text x="634" y="160" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#334155">langgraph.json</text>
  <text x="634" y="182" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#334155">_mda_auth.py · _mda_http.py</text>
  <text x="634" y="202" text-anchor="middle" font-size="9.5" fill="#6b7280">根目录被整个复制进来</text>

  <rect x="536" y="236" width="196" height="122" rx="12" fill="#ffffff" stroke="#c9b6e5" stroke-width="1.5"/>
  <text x="634" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#4c2f7a">本地运行现场</text>
  <text x="634" y="284" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#334155">http://127.0.0.1:PORT</text>
  <text x="634" y="304" text-anchor="middle" font-size="10" fill="#334155">Studio 里能发消息、看轨迹</text>
  <text x="634" y="326" text-anchor="middle" font-size="10" fill="#9a3412">改文件后要重启 dev 才重编译</text>
  <text x="634" y="346" text-anchor="middle" font-size="9.5" fill="#6b7280">调度不会真的触发</text>

  <rect x="756" y="92" width="180" height="266" rx="12" fill="#fdf2f2" stroke="#e7a6a6" stroke-width="1.5"/>
  <text x="846" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#8a2f2f">只有这里才认</text>
  <text x="846" y="142" text-anchor="middle" font-size="10" fill="#6b7280">真实模型调用</text>
  <text x="846" y="166" text-anchor="middle" font-size="10" fill="#6b7280">通道收发消息</text>
  <text x="846" y="190" text-anchor="middle" font-size="10" fill="#6b7280">调度按点触发</text>
  <text x="846" y="214" text-anchor="middle" font-size="10" fill="#6b7280">记忆真正落盘</text>
  <text x="846" y="238" text-anchor="middle" font-size="10" fill="#6b7280">沙箱真实创建</text>
  <text x="846" y="270" text-anchor="middle" font-size="10.5" fill="#8a2f2f">这些本地都测不到</text>
  <text x="846" y="292" text-anchor="middle" font-size="10" fill="#8a2f2f">（无账号时）</text>
  <text x="846" y="326" text-anchor="middle" font-size="9.5" fill="#6b7280">mda deploy 之后</text>

  <text x="480" y="446" text-anchor="middle" font-size="11" fill="#5b6472">两道闸门都绿灯，说明「定义合法、能被编译、server 能起」——不说明「模型能答、工具能跑」</text>
  <rect x="252" y="462" width="456" height="42" rx="9" fill="#fff8ec" stroke="#e0b877" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="480" y="488" text-anchor="middle" font-size="10.5" fill="#7a4f13">经验法则：build 绿灯只是入场券；要确认「真的能跑」，必须走一次 dev + 一条真实消息</text>
</svg>
