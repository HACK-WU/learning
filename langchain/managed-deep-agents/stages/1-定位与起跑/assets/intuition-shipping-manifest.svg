<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="920" height="420" fill="#fbfcfd"/>
  <text x="460" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">同一个包裹，两种交付</text>

  <rect x="28" y="58" width="410" height="316" rx="12" fill="#fdf2f2" stroke="#e7a6a6" stroke-width="1.5"/>
  <text x="233" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#8a2f2f">做法一：自己开车送</text>

  <rect x="58" y="104" width="150" height="64" rx="8" fill="#ffffff" stroke="#e0b4b4" stroke-width="1.3"/>
  <text x="133" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#8a2f2f">你</text>
  <text x="133" y="148" text-anchor="middle" font-size="10" fill="#6b7280">打包 · 装车 · 认路</text>

  <rect x="228" y="104" width="180" height="64" rx="8" fill="#ffffff" stroke="#e0b4b4" stroke-width="1.3"/>
  <text x="318" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#8a2f2f">一件包裹</text>
  <text x="318" y="148" text-anchor="middle" font-size="10" fill="#6b7280">到了，但下一次还得再来</text>

  <rect x="58" y="190" width="350" height="66" rx="8" fill="#ffffff" stroke="#e0b4b4" stroke-width="1.3"/>
  <text x="233" y="214" text-anchor="middle" font-size="11" fill="#6b7280">车是谁的、油够不够、路上被拦怎么办</text>
  <text x="233" y="236" text-anchor="middle" font-size="11" fill="#6b7280">全都要你自己想，每次重新想一遍</text>

  <rect x="58" y="276" width="350" height="72" rx="8" fill="#fff8ec" stroke="#e0b877" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="233" y="300" text-anchor="middle" font-size="10.5" fill="#7a4f13">换一个人来送，这一路经验带不走</text>
  <text x="233" y="322" text-anchor="middle" font-size="10.5" fill="#7a4f13">包裹本身没有任何说明</text>

  <rect x="482" y="58" width="410" height="316" rx="12" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
  <text x="687" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#1e4b7a">做法二：只填一张发货单</text>

  <rect x="512" y="104" width="150" height="64" rx="8" fill="#ffffff" stroke="#a9c9e6" stroke-width="1.3"/>
  <text x="587" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#1e4b7a">你</text>
  <text x="587" y="148" text-anchor="middle" font-size="10" fill="#6b7280">只写清三行</text>

  <rect x="682" y="104" width="180" height="64" rx="8" fill="#ffffff" stroke="#a9c9e6" stroke-width="1.3"/>
  <text x="772" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#1e4b7a">发货单</text>
  <text x="772" y="148" text-anchor="middle" font-size="10" fill="#6b7280">写错格式它就不收</text>

  <rect x="512" y="190" width="350" height="66" rx="8" fill="#ffffff" stroke="#a9c9e6" stroke-width="1.3"/>
  <text x="687" y="214" text-anchor="middle" font-size="11" fill="#6b7280">这一行填「它叫什么」</text>
  <text x="687" y="236" text-anchor="middle" font-size="11" fill="#6b7280">这一行填「用谁的车」</text>

  <rect x="512" y="276" width="350" height="72" rx="8" fill="#ffffff" stroke="#a9c9e6" stroke-width="1.3"/>
  <text x="687" y="300" text-anchor="middle" font-size="10.5" fill="#334155">车怎么调度、路上怎么走，你都不用管</text>
  <text x="687" y="322" text-anchor="middle" font-size="10.5" fill="#334155">但单子上那三行，一个字都不能糊</text>

  <text x="460" y="400" text-anchor="middle" font-size="11" fill="#5b6472">左边把「想」和「送」揽在一起；右边只写单子，把运送整件事交出去 —— 代价是单子必须写得对方看得懂</text>
</svg>
