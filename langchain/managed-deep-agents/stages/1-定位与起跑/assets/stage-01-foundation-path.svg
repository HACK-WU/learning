<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="900" height="320" fill="#fbfcfd"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">阶段 1 路径：从「装得上」到「看得懂它为什么不给你对象」</text>

  <rect x="40" y="72" width="200" height="102" rx="9" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
  <text x="140" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e4b7a">课 1 · 环境准备</text>
  <text x="140" y="120" text-anchor="middle" font-size="11" fill="#334155">两侧脚手架各装一套</text>
  <text x="140" y="138" text-anchor="middle" font-size="11" fill="#334155">验证 build 通过</text>
  <text x="140" y="158" text-anchor="middle" font-size="10" fill="#94a3b8">卡点：用错渠道装出另一门语言</text>

  <rect x="290" y="72" width="250" height="102" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.5"/>
  <text x="415" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f5537">课 2 · 托管的是什么</text>
  <text x="415" y="120" text-anchor="middle" font-size="11" fill="#334155">定义 vs 编译 · 目录即配置</text>
  <text x="415" y="138" text-anchor="middle" font-size="11" fill="#334155">与 Deep Agents 的边界</text>
  <text x="415" y="158" text-anchor="middle" font-size="10" fill="#94a3b8">卡点：以为 define 能 invoke</text>

  <rect x="590" y="72" width="270" height="102" rx="9" fill="#fff8ec" stroke="#e0b877" stroke-width="1.5"/>
  <text x="725" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a4f13">课 3 · 第一个可部署项目</text>
  <text x="725" y="120" text-anchor="middle" font-size="11" fill="#334155">入口 · 命名 · 模型前缀</text>
  <text x="725" y="138" text-anchor="middle" font-size="11" fill="#334155">build 与 dev 的分工</text>
  <text x="725" y="158" text-anchor="middle" font-size="10" fill="#94a3b8">卡点：build 过了却起不来</text>

  <line x1="242" y1="123" x2="286" y2="123" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="542" y1="123" x2="586" y2="123" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="40" y="204" width="820" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="60" y="228" font-size="11.5" fill="#475569">阶段 1 结束后你手里应有：① 两侧各一个能编译的工程　② 一张「定义 → 编译 → 注入 → 部署」四段链路图</text>
  <text x="60" y="250" font-size="11.5" fill="#475569">③ 一份目录清单，能对每个文件说出「它什么时候生效、由谁读」④ 一句判断：这个 agent 该托管还是留在本地</text>
  <text x="60" y="274" font-size="10.5" fill="#94a3b8">注：课 1 为环境准备操作课，按轻量结构交付，不占「每课 2–5 知识点」配额</text>
</svg>
