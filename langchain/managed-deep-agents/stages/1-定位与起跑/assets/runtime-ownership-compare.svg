<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#fbfcfd"/>
  <text x="470" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">谁拥有运行时：同一条 agent 逻辑，两种归属</text>

  <rect x="34" y="58" width="418" height="252" rx="12" fill="#fdf6f6" stroke="#e2b6b6" stroke-width="1.5"/>
  <text x="243" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#7a2626">自己跑（Deep Agents）</text>
  <text x="243" y="106" text-anchor="middle" font-size="10.5" fill="#8a5a5a">create_deep_agent 直接出图</text>

  <rect x="58" y="122" width="370" height="46" rx="8" fill="#ffffff" stroke="#c9a1a1" stroke-width="1.4"/>
  <text x="243" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#7a2626">agent 逻辑（提示词 / 工具 / 技能）</text>
  <text x="243" y="160" text-anchor="middle" font-size="9.5" fill="#a97b7b">这部分两边完全一样，搬过去不用改</text>

  <line x1="243" y1="172" x2="243" y2="188" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#m1)"/>

  <rect x="58" y="192" width="370" height="60" rx="8" fill="#ffffff" stroke="#c9a1a1" stroke-width="1.4"/>
  <text x="243" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#7a2626">这些是你得自己造的</text>
  <text x="243" y="230" text-anchor="middle" font-size="10" fill="#8a5a5a">backend · store · checkpointer · 进程 / 容器</text>
  <text x="243" y="246" text-anchor="middle" font-size="10" fill="#8a5a5a">Slack 接入 · 定时器 · 沙箱 · 密钥分发</text>

  <line x1="243" y1="256" x2="243" y2="272" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#m1)"/>

  <rect x="58" y="274" width="370" height="26" rx="6" fill="#f9e6e6" stroke="#c9a1a1" stroke-width="1.2"/>
  <text x="243" y="292" text-anchor="middle" font-size="10.5" fill="#7a2626">能 invoke 的 agent —— 但上线这层壳也归你</text>

  <rect x="488" y="58" width="418" height="252" rx="12" fill="#f4faf6" stroke="#9dc9af" stroke-width="1.5"/>
  <text x="697" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#1f5537">托管跑（MDA）</text>
  <text x="697" y="106" text-anchor="middle" font-size="10.5" fill="#5b8a6e">define_deep_agent 只留定义</text>

  <rect x="512" y="122" width="370" height="46" rx="8" fill="#ffffff" stroke="#8fbfa3" stroke-width="1.4"/>
  <text x="697" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#1f5537">agent 逻辑（提示词 / 工具 / 技能）</text>
  <text x="697" y="160" text-anchor="middle" font-size="9.5" fill="#5b8a6e">同一套 harness，行为不变</text>

  <line x1="697" y1="172" x2="697" y2="188" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#m1)"/>

  <rect x="512" y="192" width="370" height="60" rx="8" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="697" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#1e4b7a">这些平台给</text>
  <text x="697" y="230" text-anchor="middle" font-size="10" fill="#3d6a96">backend · store · checkpointer · Agent Server</text>
  <text x="697" y="246" text-anchor="middle" font-size="10" fill="#3d6a96">通道 · 调度 · 沙箱 · identity · 记忆树</text>

  <line x1="697" y1="256" x2="697" y2="272" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#m1)"/>

  <rect x="512" y="274" width="370" height="26" rx="6" fill="#e2f2e8" stroke="#8fbfa3" stroke-width="1.2"/>
  <text x="697" y="292" text-anchor="middle" font-size="10.5" fill="#1f5537">能 invoke 的 agent —— 但你不能改那层壳</text>

  <rect x="34" y="330" width="872" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="470" y="352" text-anchor="middle" font-size="11.5" fill="#475569">差别只在最后一块：谁编译、谁持有 backend / store / 检查点器 —— 前两块是同一份东西</text>

  <rect x="34" y="374" width="424" height="34" rx="8" fill="#fdf2f2" stroke="#d99a9a" stroke-width="1.3"/>
  <text x="246" y="396" text-anchor="middle" font-size="10.5" fill="#7a2626">留在原处：要自有 backend / 存储 / 检查点，或 agent 外面还有自己的路由</text>

  <rect x="482" y="374" width="424" height="34" rx="8" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.3"/>
  <text x="694" y="396" text-anchor="middle" font-size="10.5" fill="#1f5537">交给托管：只要它接消息、按点自跑、多人隔离</text>

  <text x="470" y="418" text-anchor="middle" font-size="9.5" fill="#b0bac6">依据：官方 overview「Relationship to Deep Agents」+ migrate「Decide whether to move」与「Check what does not carry over」</text>
</svg>
