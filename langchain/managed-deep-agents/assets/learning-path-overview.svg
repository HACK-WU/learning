<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="960" height="450" fill="#fbfcfd"/>

  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">Managed Deep Agents 学习路径</text>
  <text x="480" y="60" text-anchor="middle" font-size="12.5" fill="#6b7280">从「我会写 agent」到「我知道该让谁跑 agent」</text>

  <rect x="60" y="96" width="250" height="170" rx="10" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.6"/>
  <text x="185" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#1e4b7a">阶段 1 · 定位与起跑</text>
  <line x1="80" y1="134" x2="290" y2="134" stroke="#b9d5ef"/>
  <text x="185" y="158" text-anchor="middle" font-size="11.5" fill="#334155">课 1 环境准备</text>
  <text x="185" y="180" text-anchor="middle" font-size="11.5" fill="#334155">课 2 托管的是什么</text>
  <text x="185" y="202" text-anchor="middle" font-size="11.5" fill="#334155">课 3 第一个可部署项目</text>
  <text x="185" y="234" text-anchor="middle" font-size="10.5" fill="#64748b">先搞清这活儿到底谁在干</text>

  <rect x="355" y="96" width="250" height="170" rx="10" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.6"/>
  <text x="480" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#1f5537">阶段 2 · 能力声明</text>
  <line x1="375" y1="134" x2="585" y2="134" stroke="#b6dcc4"/>
  <text x="480" y="158" text-anchor="middle" font-size="11.5" fill="#334155">课 4 指令、技能与工具</text>
  <text x="480" y="180" text-anchor="middle" font-size="11.5" fill="#334155">课 5 中间件、MCP 与检索</text>
  <text x="480" y="202" text-anchor="middle" font-size="11.5" fill="#334155">课 6 记忆、沙箱与身份</text>
  <text x="480" y="234" text-anchor="middle" font-size="10.5" fill="#64748b">再用文件把能力一件件声明出来</text>

  <rect x="650" y="96" width="250" height="170" rx="10" fill="#fff8ec" stroke="#e0b877" stroke-width="1.6"/>
  <text x="775" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#7a4f13">阶段 3 · 运行与交付</text>
  <line x1="670" y1="134" x2="880" y2="134" stroke="#f0d5ab"/>
  <text x="775" y="158" text-anchor="middle" font-size="11.5" fill="#334155">课 7 运行时上下文</text>
  <text x="775" y="180" text-anchor="middle" font-size="11.5" fill="#334155">课 8 通道与调度</text>
  <text x="775" y="202" text-anchor="middle" font-size="11.5" fill="#334155">课 9 部署、评估与收口</text>
  <text x="775" y="234" text-anchor="middle" font-size="10.5" fill="#64748b">最后才敢让它接真实场景、上线</text>

  <line x1="312" y1="181" x2="351" y2="181" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="607" y1="181" x2="646" y2="181" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="60" y="296" width="840" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="480" y="318" text-anchor="middle" font-size="12" fill="#475569">走完三阶段，你手里最该留下的是判断力：这件事该交出去，还是自己扛</text>

  <rect x="60" y="346" width="400" height="62" rx="9" fill="#fdf2f2" stroke="#d99a9a" stroke-width="1.4"/>
  <text x="80" y="370" font-size="12" font-weight="600" fill="#7a2626">该留在自己手里</text>
  <text x="80" y="392" font-size="10.5" fill="#7f5a5a">要自己的后端 / 存储 / 检查点，或 agent 外面还要跑自己的 Web 路由</text>

  <rect x="500" y="346" width="400" height="62" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.4"/>
  <text x="520" y="370" font-size="12" font-weight="600" fill="#1f5537">该交给托管</text>
  <text x="520" y="392" font-size="10.5" fill="#3f6b50">只想让它接消息、按点自跑、多人隔离，不想养那层壳</text>

  <text x="480" y="436" text-anchor="middle" font-size="11" fill="#94a3b8">阶段 1 回答「谁在干」；阶段 2 回答「能力怎么写」；阶段 3 回答「怎么跑到真实场景里」</text>
</svg>
