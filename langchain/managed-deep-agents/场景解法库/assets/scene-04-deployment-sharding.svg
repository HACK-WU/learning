<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="j1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">解法 A：拆部署 + 按业务分片——一个 agent 拆成 N 个独立部署</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">托管侧一个项目只有一个 agent 入口，所以「横向扩」只能是「纵向拆部署」</text>

  <rect x="30" y="82" width="220" height="70" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="140" y="106" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">统一入口 / 路由</text>
  <text x="140" y="126" font-size="10" fill="#5a6b7d" text-anchor="middle">按 team / 租户分流</text>
  <text x="140" y="144" font-size="10" fill="#5a6b7d" text-anchor="middle">不承载 agent 逻辑</text>

  <rect x="300" y="72" width="200" height="44" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="400" y="99" font-size="11" font-weight="700" fill="#1f5537" text-anchor="middle">部署 A：platform</text>

  <rect x="300" y="126" width="200" height="44" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="400" y="153" font-size="11" font-weight="700" fill="#1f5537" text-anchor="middle">部署 B：infra</text>

  <rect x="300" y="180" width="200" height="44" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="400" y="207" font-size="11" font-weight="700" fill="#1f5537" text-anchor="middle">部署 C：data</text>

  <rect x="560" y="72" width="300" height="152" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="576" y="96" font-size="12" font-weight="700" fill="#1e4b7a">每个部署独立拥有</text>
  <text x="576" y="120" font-size="11" fill="#5a6b7d">· 自己的 agent 层记忆树</text>
  <text x="576" y="142" font-size="11" fill="#5a6b7d">· 自己的 schedules（时区/频率可不同）</text>
  <text x="576" y="164" font-size="11" fill="#5a6b7d">· 自己的 Slack 通道与密钥</text>
  <text x="576" y="186" font-size="11" fill="#5a6b7d">· 自己的构建产物与版本节奏</text>
  <text x="576" y="208" font-size="11" fill="#5a6b7d">· 自己的失败域（互不影响）</text>

  <line x1="250" y1="117" x2="296" y2="96" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#j1)"/>
  <line x1="250" y1="117" x2="296" y2="148" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#j1)"/>
  <line x1="250" y1="117" x2="296" y2="202" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#j1)"/>
  <line x1="500" y1="94" x2="556" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="500" y1="148" x2="556" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="500" y1="202" x2="556" y2="170" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="30" y="248" width="840" height="76" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="270" font-size="12" font-weight="700" fill="#b45309">为什么不能「一个部署横扩副本」</text>
  <text x="46" y="292" font-size="11" fill="#7a4f13">· 副本数不归你调（托管按线程路由，没有「副本」这个旋钮）</text>
  <text x="46" y="312" font-size="11" fill="#7a4f13">· 一个项目只能有一个 agent 入口 → 想跑第二套逻辑就得第二个项目/部署</text>

  <rect x="30" y="340" width="840" height="82" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="362" font-size="13" font-weight="700" fill="#7a2626">此处会失效</text>
  <text x="46" y="386" font-size="12" fill="#7a2626">① 记忆不再共享：原本「全团队共用一条值班约定」变成 N 份，改一次要改 N 遍</text>
  <text x="46" y="408" font-size="12" fill="#7a2626">② 路由层成为新单点：它挂了所有 agent 都不可达（且托管侧不提供这个路由）</text>

</svg>
