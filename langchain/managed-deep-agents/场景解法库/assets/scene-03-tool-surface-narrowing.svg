<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="i2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">解法 C：权限前置到工具签名——危险工具干脆不发给模型</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">「模型不会调到一个它看不见的工具」，这是比任何运行时判断都硬的边界</text>

  <rect x="30" y="80" width="180" height="60" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="120" y="104" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">工厂入口</text>
  <text x="120" y="124" font-size="10" fill="#5a6b7d" text-anchor="middle">agent = 函数</text>

  <rect x="240" y="80" width="200" height="60" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="340" y="104" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">读 context 决定</text>
  <text x="340" y="124" font-size="10" fill="#7a4f13" text-anchor="middle">只选行为，不判权</text>

  <rect x="470" y="80" width="200" height="60" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="2"/>
  <text x="570" y="104" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">tools=[只读的三个]</text>
  <text x="570" y="124" font-size="10" fill="#3f6b50" text-anchor="middle">写工具不在列表里</text>

  <rect x="700" y="80" width="170" height="60" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="785" y="104" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">模型看到的</text>
  <text x="785" y="124" font-size="10" fill="#3f6b50" text-anchor="middle">参数表里没有它</text>

  <line x1="210" y1="110" x2="236" y2="110" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#i2)"/>
  <line x1="440" y1="110" x2="466" y2="110" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#i2)"/>
  <line x1="670" y1="110" x2="696" y2="110" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#i2)"/>

  <text x="30" y="176" font-size="13" font-weight="700" fill="#1f2937">三种边界强度对照：越往下越硬</text>

  <rect x="30" y="192" width="840" height="44" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="1.5"/>
  <text x="46" y="219" font-size="12" fill="#7a2626">软：instructions.md 里写「不要做 X」 → 模型可能不听话，且无法验证</text>

  <rect x="30" y="246" width="840" height="44" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="273" font-size="12" fill="#7a4f13">中：工具内部判 principal → 调用会到达，靠代码正确性保证（写错就静默越权）</text>

  <rect x="30" y="300" width="840" height="44" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="2"/>
  <text x="46" y="327" font-size="12" font-weight="700" fill="#3f6b50">硬：工具根本不在 tools=[...] 里 → 类型与参数表层面不存在，模型调不到</text>

  <rect x="30" y="356" width="840" height="72" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="378" font-size="13" font-weight="700" fill="#7a2626">此处会失效</text>
  <text x="46" y="400" font-size="12" fill="#7a2626">① 工厂体写 if / try 就构建失败 → 只能用三元表达式或预先算好的映射，表达力受限</text>
  <text x="46" y="420" font-size="12" fill="#7a2626">② 工厂看不到 server_info → 它无法判权，只能按 context 选「通用档位」，权限判断必须落在别处</text>

</svg>
