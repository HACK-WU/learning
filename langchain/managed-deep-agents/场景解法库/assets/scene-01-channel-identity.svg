<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">解法 B：通道级身份绑定——身份在入口就固定，工具里不再判</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">把判断点前移，让「不可能出错」代替「记得判对」</text>

  <rect x="30" y="80" width="170" height="56" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="115" y="104" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">上游系统</text>
  <text x="115" y="122" font-size="10" fill="#5a6b7d" text-anchor="middle">已认证用户</text>

  <rect x="230" y="80" width="180" height="56" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="320" y="104" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">identity.py</text>
  <text x="320" y="122" font-size="10" fill="#3f6b50" text-anchor="middle">Supabase / backend</text>

  <rect x="440" y="80" width="180" height="56" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="530" y="104" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">principal</text>
  <text x="530" y="122" font-size="10" fill="#3f6b50" text-anchor="middle">kind=person + id</text>

  <rect x="650" y="80" width="220" height="56" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="760" y="104" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">工具执行</text>
  <text x="760" y="122" font-size="10" fill="#3f6b50" text-anchor="middle">直接信任 principal 存在</text>

  <line x1="200" y1="108" x2="226" y2="108" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#b1)"/>
  <line x1="410" y1="108" x2="436" y2="108" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#b1)"/>
  <line x1="620" y1="108" x2="646" y2="108" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#b1)"/>

  <text x="30" y="176" font-size="13" font-weight="700" fill="#1f2937">两条通路：都经过身份闸，没有旁路</text>

  <rect x="30" y="192" width="400" height="96" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="46" y="214" font-size="12" font-weight="700" fill="#1e4b7a">Slack 通路</text>
  <text x="46" y="236" font-size="11" fill="#5a6b7d">/v1/channels/slack/events → 签名验 → identity 解析</text>
  <text x="46" y="256" font-size="11" fill="#5a6b7d">无 identity 时拒绝启动（ingress 不能退回服务身份）</text>
  <text x="46" y="276" font-size="11" fill="#5a6b7d">通道事件的 principal 与工具里读到的是同一个</text>

  <rect x="460" y="192" width="410" height="96" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="476" y="214" font-size="12" font-weight="700" fill="#1e4b7a">HTTP / API 通路</text>
  <text x="476" y="236" font-size="11" fill="#5a6b7d">/channels/xxx/events（无 /v1 前缀）→ verify 返回布尔</text>
  <text x="476" y="256" font-size="11" fill="#5a6b7d">auth="backend" 时由后端自行校验请求头</text>
  <text x="476" y="276" font-size="11" fill="#5a6b7d">后端校验失败必须返回 401，不是抛异常（500）</text>

  <rect x="30" y="308" width="840" height="96" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="330" font-size="13" font-weight="700" fill="#7a2626">此处会失效：身份闸只挡得住「经过它的请求」</text>
  <text x="46" y="354" font-size="12" fill="#7a2626">① 直调 backend.write() 可以绕过中间件层的 permissions —— 权限在中间件，不在 backend</text>
  <text x="46" y="376" font-size="12" fill="#7a2626">② 定时任务（schedules）没有「人」，principal 恒为服务身份 → user 层记忆在此跑必然空</text>
  <text x="46" y="398" font-size="12" fill="#7a2626">③ 服务身份恒 not_a_person，写 allow 恒真也救不回来</text>

  <text x="30" y="428" font-size="11" fill="#6b7280">此图只在本解法下成立：换成「工具内判 principal」则主链完全不同</text>
</svg>
