<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="l1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">解法 C：把热路径的计算挪出 agent——让工具只做「取」，不做「算」</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">流量上来先别扩 agent，先问「这一步为什么需要模型参与」</text>

  <rect x="30" y="82" width="200" height="60" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="1.5"/>
  <text x="130" y="106" font-size="12" font-weight="700" fill="#7a2626" text-anchor="middle">改造前</text>
  <text x="130" y="126" font-size="10" fill="#7a2626" text-anchor="middle">每次请求 4 轮模型调用</text>

  <rect x="270" y="82" width="200" height="60" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="2"/>
  <text x="370" y="106" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">改造后</text>
  <text x="370" y="126" font-size="10" fill="#3f6b50" text-anchor="middle">每次请求 1 轮模型调用</text>

  <rect x="510" y="82" width="180" height="60" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="600" y="106" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">结果</text>
  <text x="600" y="126" font-size="10" fill="#5a6b7d" text-anchor="middle">成本降到约 1/4</text>

  <line x1="230" y1="112" x2="266" y2="112" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#l1)"/>
  <line x1="470" y1="112" x2="506" y2="112" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#l1)"/>

  <text x="30" y="176" font-size="13" font-weight="700" fill="#1f2937">哪四轮被砍成了哪一轮</text>

  <rect x="30" y="192" width="400" height="130" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="1.5"/>
  <text x="46" y="214" font-size="12" font-weight="700" fill="#7a2626">被砍掉的（不需要模型）</text>
  <text x="46" y="240" font-size="11" fill="#7a2626">轮 2：从告警列表里筛 P1 → 纯过滤规则</text>
  <text x="46" y="262" font-size="11" fill="#7a2626">轮 3：按时间排序 → 纯排序</text>
  <text x="46" y="284" font-size="11" fill="#7a2626">轮 4：格式化表格 → 纯模板填充</text>
  <text x="46" y="306" font-size="11" fill="#7a2626">这些「模型能做」但「不该做」的事，全部下沉到工具</text>

  <rect x="460" y="192" width="410" height="130" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="476" y="214" font-size="12" font-weight="700" fill="#1f5537">保留的那一轮（真的需要模型）</text>
  <text x="476" y="240" font-size="11" fill="#3f6b50">· 判断「哪些异常值得说、按什么顺序说」</text>
  <text x="476" y="262" font-size="11" fill="#3f6b50">· 把三个团队的告警合成一段人能读的话</text>
  <text x="476" y="284" font-size="11" fill="#3f6b50">· 决定「要不要升级、升给谁」</text>
  <text x="476" y="306" font-size="11" fill="#3f6b50">判据：这一步有歧义吗？没有就写成代码</text>

  <rect x="30" y="340" width="840" height="82" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="362" font-size="13" font-weight="700" fill="#7a2626">此处会失效</text>
  <text x="46" y="386" font-size="12" fill="#7a2626">① 砍过头 → 需要判断的地方写成死规则，遇到「新形态告警」直接漏报（比慢更糟）</text>
  <text x="46" y="408" font-size="12" fill="#7a2626">② 工具里塞了业务逻辑 → 工具变成不可测的黑盒，且工具不能调模型，改起来比 prompt 更僵</text>

</svg>
