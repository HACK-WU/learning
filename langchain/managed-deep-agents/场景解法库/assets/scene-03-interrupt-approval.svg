<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">解法 A：interrupt 人工确认——写操作前停下来等人点</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">托管运行时自己持有 checkpointer，所以中断不需要你额外配任何东西</text>

  <rect x="30" y="80" width="150" height="52" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="105" y="112" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">模型决定调工具</text>

  <rect x="210" y="74" width="200" height="64" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="2.5"/>
  <text x="310" y="98" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">interrupt_on</text>
  <text x="310" y="118" font-size="10" fill="#7a4f13" text-anchor="middle">按工具名挂起</text>

  <rect x="440" y="80" width="170" height="52" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="525" y="104" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">等人工响应</text>
  <text x="525" y="122" font-size="10" fill="#3f6b50" text-anchor="middle">Studio / Command(resume)</text>

  <rect x="640" y="80" width="120" height="52" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="700" y="112" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">批准的才执行</text>

  <rect x="790" y="80" width="80" height="52" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="1.5"/>
  <text x="830" y="112" font-size="11" font-weight="700" fill="#7a2626" text-anchor="middle">拒绝</text>

  <line x1="180" y1="106" x2="206" y2="106" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#g1)"/>
  <line x1="410" y1="106" x2="436" y2="106" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#g1)"/>
  <line x1="610" y1="106" x2="636" y2="106" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#g1)"/>
  <line x1="760" y1="106" x2="786" y2="106" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#g1)"/>

  <text x="30" y="176" font-size="13" font-weight="700" fill="#1f2937">续跑的真实路径：从函数第一行重跑，不是从 interrupt() 继续</text>

  <rect x="30" y="194" width="840" height="82" rx="6" fill="#fbfcfd" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>

  <rect x="50" y="208" width="120" height="52" rx="4" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1"/>
  <text x="110" y="228" font-size="10" font-weight="700" fill="#1e4b7a" text-anchor="middle">第 1 次进入</text>
  <text x="110" y="246" font-size="9" fill="#5a6b7d" text-anchor="middle">event=message</text>

  <rect x="200" y="208" width="120" height="52" rx="4" fill="#fff8ec" stroke="#b45309" stroke-width="1"/>
  <text x="260" y="228" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">发表单 → 挂起</text>
  <text x="260" y="246" font-size="9" fill="#7a4f13" text-anchor="middle">检查点已存</text>

  <rect x="350" y="208" width="140" height="52" rx="4" fill="#f4faf6" stroke="#1f5537" stroke-width="1"/>
  <text x="420" y="228" font-size="10" font-weight="700" fill="#1f5537" text-anchor="middle">用户提交</text>
  <text x="420" y="246" font-size="9" fill="#3f6b50" text-anchor="middle">Command(resume=...)</text>

  <rect x="520" y="204" width="150" height="60" rx="4" fill="#fdf6f6" stroke="#7a2626" stroke-width="2"/>
  <text x="595" y="224" font-size="10" font-weight="700" fill="#7a2626" text-anchor="middle">第 2 次进入</text>
  <text x="595" y="240" font-size="9" fill="#7a2626" text-anchor="middle">从第一行重跑</text>
  <text x="595" y="256" font-size="9" fill="#7a2626" text-anchor="middle">event=user_prompt_response</text>

  <rect x="700" y="208" width="150" height="52" rx="4" fill="#fff8ec" stroke="#b45309" stroke-width="1"/>
  <text x="775" y="228" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">若无闸 → 再发一张</text>
  <text x="775" y="246" font-size="9" fill="#7a4f13" text-anchor="middle">用户收到两张单</text>

  <line x1="170" y1="234" x2="196" y2="234" stroke="#5a6b7d" stroke-width="1.2" marker-end="url(#g1)"/>
  <line x1="320" y1="234" x2="346" y2="234" stroke="#5a6b7d" stroke-width="1.2" marker-end="url(#g1)"/>
  <line x1="490" y1="234" x2="516" y2="234" stroke="#5a6b7d" stroke-width="1.2" marker-end="url(#g1)"/>
  <line x1="670" y1="234" x2="696" y2="234" stroke="#5a6b7d" stroke-width="1.2" marker-end="url(#g1)"/>

  <rect x="30" y="292" width="840" height="112" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="314" font-size="13" font-weight="700" fill="#7a2626">此处会失效：中断只挡「等待」，不挡「重跑」</text>
  <text x="46" y="338" font-size="12" fill="#7a2626">① 副作用写在闸之前 → 重复执行（发消息两次、升级两次）</text>
  <text x="46" y="360" font-size="12" fill="#7a2626">② 忘了判 event.type → 第二次又发一张表单，用户以为系统坏了</text>
  <text x="46" y="382" font-size="12" fill="#7a2626">③ 定时任务里没有 channel → runtime.channel 为 None，中断无处可发，直接卡死</text>

  <text x="30" y="428" font-size="11" fill="#6b7280">红线框标出的是「第二次进入」这条必由之路——所有副作用的防线都要架在这里</text>
</svg>
