<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">解法 D：收窄工具签名——它管「有没有这个工具」，不管「谁在用」</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">可见性与身份合法性是两个正交维度；签名收窄只动得了前者</text>

  <text x="345" y="84" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">工具在 tools=[...] 里（模型看得见）</text>
  <text x="690" y="84" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">工具不在列表里（模型调不到）</text>

  <rect x="30" y="96" width="120" height="84" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="90" y="132" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">身份合法</text>
  <text x="90" y="152" font-size="10" fill="#5a6b7d" text-anchor="middle">principal.kind</text>
  <text x="90" y="166" font-size="10" fill="#5a6b7d" text-anchor="middle">= person</text>

  <rect x="30" y="186" width="120" height="84" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="90" y="222" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">身份不合法</text>
  <text x="90" y="242" font-size="10" fill="#5a6b7d" text-anchor="middle">principal 为 None</text>
  <text x="90" y="256" font-size="10" fill="#5a6b7d" text-anchor="middle">或 kind = service</text>

  <rect x="168" y="96" width="354" height="84" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="345" y="126" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">正常执行 —— 这是设计内的路径</text>
  <text x="345" y="148" font-size="10" fill="#3f6b50" text-anchor="middle">工具给对了档位，人也确实是他本人</text>
  <text x="345" y="166" font-size="10" fill="#3f6b50" text-anchor="middle">这个格子不需要额外判断</text>

  <rect x="540" y="96" width="330" height="84" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="705" y="126" font-size="12" font-weight="700" fill="#7a4f13" text-anchor="middle">能力被砍 —— 过度收窄的代价</text>
  <text x="705" y="148" font-size="10" fill="#7a4f13" text-anchor="middle">身份明明合法，却因为档位选低</text>
  <text x="705" y="166" font-size="10" fill="#7a4f13" text-anchor="middle">而拿不到该有的能力</text>

  <rect x="168" y="186" width="354" height="84" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2"/>
  <text x="345" y="216" font-size="12" font-weight="700" fill="#7a2626" text-anchor="middle">静默越权 —— 签名收窄碰不到这里</text>
  <text x="345" y="238" font-size="10" fill="#7a2626" text-anchor="middle">工具在列表里、调用也到达了，</text>
  <text x="345" y="256" font-size="10" fill="#7a2626" text-anchor="middle">但没有一层去看 principal → 只有工具内部或中间件能挡住</text>

  <rect x="540" y="186" width="330" height="84" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="705" y="216" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">挡住 —— 这是它唯一解得了的格子</text>
  <text x="705" y="238" font-size="10" fill="#3f6b50" text-anchor="middle">参数表层面就不存在，</text>
  <text x="705" y="256" font-size="10" fill="#3f6b50" text-anchor="middle">模型再多轮推理也调不出来</text>

  <text x="30" y="302" font-size="12" fill="#1f2937">结论：矩阵上半行（正常执行）与右半列（挡住）它能解；<tspan font-weight="700">左下角那格必须由解法 A 或 C 兜住</tspan>。</text>

  <rect x="30" y="318" width="840" height="104" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="340" font-size="13" font-weight="700" fill="#7a2626">此处会失效</text>
  <text x="46" y="362" font-size="12" fill="#7a2626">① 工厂看不到 server_info（运行时类型里根本没这个字段）→ 它判不了「这个人是谁」，只能按 context 选档位</text>
  <text x="46" y="382" font-size="12" fill="#7a2626">② context 是调用方自己填的登记本 → 用它决定要不要给写工具，等于让调用方自己选权限</text>
  <text x="46" y="402" font-size="12" fill="#7a2626">③ 工厂体不能出现 if / try / for / while / with / assert / del → 只能用三元表达式或预先算好的映射，复杂分档表达不出来</text>

  <text x="30" y="436" font-size="10" fill="#94a3b8">读图：横轴看「工具在不在」，纵轴看「人是不是他本人」，四个格子分别对应四种结局；红字三行是这个解法自己付的代价。</text>
</svg>
