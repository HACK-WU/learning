<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="n1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">解法 B：把长期知识搬出记忆——改用工具现查或 skills 按需加载</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">记忆不是唯一的知识载体，skills 的加载时机比记忆更省</text>

  <rect x="30" y="82" width="200" height="64" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="130" y="106" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">启动时</text>
  <text x="130" y="128" font-size="10" fill="#5a6b7d" text-anchor="middle">只加载技能标签</text>

  <rect x="270" y="82" width="210" height="64" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="2"/>
  <text x="375" y="106" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">任务对上了</text>
  <text x="375" y="128" font-size="10" fill="#3f6b50" text-anchor="middle">模型按 description 挑</text>

  <rect x="520" y="82" width="190" height="64" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="615" y="106" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">SKILL.md 正文</text>
  <text x="615" y="128" font-size="10" fill="#3f6b50" text-anchor="middle">此刻才进上下文</text>

  <rect x="750" y="82" width="120" height="64" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="810" y="106" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">附件</text>
  <text x="810" y="128" font-size="10" fill="#7a4f13" text-anchor="middle">按需再取</text>

  <line x1="230" y1="114" x2="266" y2="114" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#n1)"/>
  <line x1="480" y1="114" x2="516" y2="114" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#n1)"/>
  <line x1="710" y1="114" x2="746" y2="114" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#n1)"/>

  <text x="30" y="176" font-size="13" font-weight="700" fill="#1f2937">三种载体的成本曲线完全不同</text>

  <rect x="30" y="192" width="270" height="106" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="1.5"/>
  <text x="46" y="214" font-size="12" font-weight="700" fill="#7a2626">热记忆</text>
  <text x="46" y="238" font-size="11" fill="#7a2626">每轮都付 → 成本 = 行数 × 轮数</text>
  <text x="46" y="260" font-size="11" fill="#7a2626">适合：3-5 行铁律</text>
  <text x="46" y="282" font-size="11" fill="#7a2626">不适合：任何超过一屏的内容</text>

  <rect x="320" y="192" width="270" height="106" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="336" y="214" font-size="12" font-weight="700" fill="#1f5537">skills</text>
  <text x="336" y="238" font-size="11" fill="#3f6b50">按任务付 → 成本 = 用到的次数</text>
  <text x="336" y="260" font-size="11" fill="#3f6b50">适合：流程性知识（怎么做）</text>
  <text x="336" y="282" font-size="11" fill="#3f6b50">不适合：需要精确数值的查询</text>

  <rect x="610" y="192" width="260" height="106" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="626" y="214" font-size="12" font-weight="700" fill="#1e4b7a">tools</text>
  <text x="626" y="238" font-size="11" fill="#5a6b7d">按调用付 → 只回传结果</text>
  <text x="626" y="260" font-size="11" fill="#5a6b7d">适合：事实性数据（谁值班）</text>
  <text x="626" y="282" font-size="11" fill="#5a6b7d">不适合：需要推理的模糊问题</text>

  <rect x="30" y="316" width="840" height="100" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="338" font-size="13" font-weight="700" fill="#7a2626">此处会失效</text>
  <text x="46" y="362" font-size="12" fill="#7a2626">① skills 只扫一层 + frontmatter 缺字段 → 整张静默跳过，你以为在省成本其实是零加载</text>
  <text x="46" y="384" font-size="12" fill="#7a2626">② description 写成「我是什么」而不是「什么时候用我」→ 模型永远不选它</text>
  <text x="46" y="406" font-size="12" fill="#7a2626">③ 全搬进工具 → 工具不能调模型，需要判断的活做不了，最后还是要回到模型</text>

</svg>
