<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
    <marker id="e2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">解法 B：固定线程 + 历史裁剪——让 agent 记得昨天，但不被昨天压垮</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">适合「每天在同一个对话里继续」的值班助手，而不是一次性晨报</text>

  <rect x="30" y="80" width="120" height="52" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="90" y="112" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">Day 1</text>

  <rect x="30" y="150" width="120" height="52" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="90" y="182" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">Day 2</text>

  <rect x="30" y="220" width="120" height="52" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="90" y="252" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">Day N</text>

  <rect x="200" y="80" width="200" height="192" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="2.5"/>
  <text x="300" y="106" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">同一个 thread_id</text>
  <line x1="230" y1="120" x2="370" y2="120" stroke="#5b8a6e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="300" y="146" font-size="11" fill="#3f6b50" text-anchor="middle">检查点持续累积</text>
  <text x="300" y="170" font-size="11" fill="#3f6b50" text-anchor="middle">每轮 messages 越来越长</text>
  <text x="300" y="194" font-size="11" fill="#3f6b50" text-anchor="middle">上下文成本线性上升</text>
  <rect x="222" y="212" width="156" height="44" rx="4" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="300" y="230" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">自动压缩兜底</text>
  <text x="300" y="246" font-size="9" fill="#7a4f13" text-anchor="middle">旧消息存 /conversation_history/</text>

  <line x1="150" y1="106" x2="196" y2="106" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#e1)"/>
  <line x1="150" y1="176" x2="196" y2="176" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#e1)"/>
  <line x1="150" y1="246" x2="196" y2="246" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#e1)"/>

  <rect x="440" y="80" width="210" height="86" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="545" y="104" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">agent 层记忆</text>
  <text x="545" y="126" font-size="11" fill="#5a6b7d" text-anchor="middle">跨线程共享的「结论」</text>
  <text x="545" y="148" font-size="11" fill="#5a6b7d" text-anchor="middle">/memories/agent/</text>

  <rect x="440" y="186" width="210" height="86" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="545" y="210" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">user 层记忆</text>
  <text x="545" y="232" font-size="11" fill="#7a4f13" text-anchor="middle">个人偏好，需真 principal</text>
  <text x="545" y="254" font-size="11" fill="#7a4f13" text-anchor="middle">定时任务拿不到 → 恒空</text>

  <line x1="400" y1="140" x2="436" y2="126" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#e1)"/>
  <line x1="400" y1="200" x2="436" y2="224" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#e2)"/>

  <rect x="690" y="80" width="180" height="192" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="780" y="102" font-size="12" font-weight="700" fill="#7a2626" text-anchor="middle">此处会失效</text>
  <text x="704" y="130" font-size="10" fill="#7a2626">① 线程越长越贵：</text>
  <text x="704" y="148" font-size="10" fill="#7a2626">   热记忆每轮都进</text>
  <text x="704" y="166" font-size="10" fill="#7a2626">   上下文，是固定</text>
  <text x="704" y="184" font-size="10" fill="#7a2626">   成本不是边际成本</text>
  <text x="704" y="210" font-size="10" fill="#7a2626">② 压缩有边界：单条</text>
  <text x="704" y="228" font-size="10" fill="#7a2626">   超长消息可能被压成</text>
  <text x="704" y="246" font-size="10" fill="#7a2626">   "无法总结"空摘要</text>

  <text x="30" y="316" font-size="13" font-weight="700" fill="#1f2937">判断依据：这条信息「明天还有用吗」</text>

  <rect x="30" y="332" width="260" height="60" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="46" y="354" font-size="11" font-weight="700" fill="#1f5537">明天还要用 → 写记忆</text>
  <text x="46" y="376" font-size="10" fill="#3f6b50">值班约定、常见故障模式</text>

  <rect x="310" y="332" width="260" height="60" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="326" y="354" font-size="11" font-weight="700" fill="#1e4b7a">只今天有用 → 留线程</text>
  <text x="326" y="376" font-size="10" fill="#5a6b7d">今天的告警清单、已通知谁</text>

  <rect x="590" y="332" width="280" height="60" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="606" y="354" font-size="11" font-weight="700" fill="#b45309">一次就完 → 都不要</text>
  <text x="606" y="376" font-size="10" fill="#7a4f13">临时线程跑完即弃</text>

  <text x="30" y="418" font-size="11" fill="#6b7280">红色虚线 = 必然断裂的一环：定时任务没有「人」，user 层记忆在调度里挂不上</text>
</svg>
