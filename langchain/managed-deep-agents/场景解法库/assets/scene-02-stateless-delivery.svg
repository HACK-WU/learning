<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="f1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">解法 C：跑完就发 + 不留状态——把「谁提醒谁」交给下游系统</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">agent 只负责「生成内容」，不负责「记住发过没」</text>

  <rect x="30" y="80" width="170" height="56" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="115" y="104" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">cron 到点</text>
  <text x="115" y="122" font-size="10" fill="#5a6b7d" text-anchor="middle">无入参、无身份</text>

  <rect x="230" y="80" width="190" height="56" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="325" y="104" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">工具查数据</text>
  <text x="325" y="122" font-size="10" fill="#3f6b50" text-anchor="middle">每次现场拉，不靠记忆</text>

  <rect x="450" y="80" width="180" height="56" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="540" y="104" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">生成并投递</text>
  <text x="540" y="122" font-size="10" fill="#3f6b50" text-anchor="middle">channel.post</text>

  <rect x="660" y="80" width="210" height="56" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="765" y="104" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">下游系统负责</text>
  <text x="765" y="122" font-size="10" fill="#7a4f13" text-anchor="middle">去重 / 升级 / 已读状态</text>

  <line x1="200" y1="108" x2="226" y2="108" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#f1)"/>
  <line x1="420" y1="108" x2="446" y2="108" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#f1)"/>
  <line x1="630" y1="108" x2="656" y2="108" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#f1)"/>

  <text x="30" y="176" font-size="13" font-weight="700" fill="#1f2937">这个解法的核心取舍：牺牲「连贯性」换「可重放」</text>

  <rect x="30" y="192" width="400" height="126" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="46" y="214" font-size="12" font-weight="700" fill="#1f5537">得到什么</text>
  <text x="46" y="238" font-size="11" fill="#3f6b50">· 每次跑都是干净上下文，成本恒定可预测</text>
  <text x="46" y="260" font-size="11" fill="#3f6b50">· 失败可直接重跑，不需要清理脏状态</text>
  <text x="46" y="282" font-size="11" fill="#3f6b50">· 线程列表永远干净，用户不会翻到 30 份旧晨报</text>
  <text x="46" y="304" font-size="11" fill="#3f6b50">· 不需要 user 层记忆 → 绕开身份那一整套</text>

  <rect x="460" y="192" width="410" height="126" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="476" y="214" font-size="12" font-weight="700" fill="#b45309">失去什么</text>
  <text x="476" y="238" font-size="11" fill="#7a4f13">· agent 不记得「昨天已经提醒过一次 P1 没恢复」</text>
  <text x="476" y="260" font-size="11" fill="#7a4f13">· 跨天趋势判断做不了（"连续三天恶化"需要历史）</text>
  <text x="476" y="282" font-size="11" fill="#7a4f13">· 去重逻辑必须在别处实现，否则重复告警</text>
  <text x="476" y="304" font-size="11" fill="#7a4f13">· 用户回复晨报时，接不上那次运行的上下文</text>

  <rect x="30" y="334" width="840" height="72" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="356" font-size="13" font-weight="700" fill="#7a2626">此处会失效</text>
  <text x="46" y="380" font-size="12" fill="#7a2626">① 没有幂等键 → 平台重试或部署重复触发，同一份晨报发两遍（下游必须能按键去重）</text>
  <text x="46" y="400" font-size="12" fill="#7a2626">② 需要「连续 N 天」判断时本解法直接不够 → 必须配合解法 B 或外部历史表</text>

  <text x="30" y="428" font-size="11" fill="#6b7280">选它的判据：下游系统本来就有去重与状态管理，不需要 agent 记住任何东西</text>
</svg>
