<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="h1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">解法 B：幂等键去重——不拦第二次，让第二次自己变成无操作</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">适合「拦不住也得安全」的场景：重试、并发、部署重复触发</text>

  <rect x="30" y="82" width="160" height="56" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="110" y="106" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">写操作请求</text>
  <text x="110" y="124" font-size="10" fill="#5a6b7d" text-anchor="middle">带业务幂等键</text>

  <rect x="230" y="82" width="180" height="56" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="320" y="106" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">查键是否已用</text>
  <text x="320" y="124" font-size="10" fill="#3f6b50" text-anchor="middle">外部幂等表（自备）</text>

  <rect x="450" y="82" width="170" height="56" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="535" y="106" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">原子占键</text>
  <text x="535" y="124" font-size="10" fill="#3f6b50" text-anchor="middle">先占位再执行</text>

  <rect x="660" y="82" width="180" height="56" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="750" y="106" font-size="12" font-weight="700" fill="#1f5537" text-anchor="middle">执行 + 回写结果</text>
  <text x="750" y="124" font-size="10" fill="#3f6b50" text-anchor="middle">结果按同键缓存</text>

  <line x1="190" y1="110" x2="226" y2="110" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#h1)"/>
  <line x1="410" y1="110" x2="446" y2="110" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#h1)"/>
  <line x1="620" y1="110" x2="656" y2="110" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#h1)"/>

  <text x="30" y="176" font-size="13" font-weight="700" fill="#1f2937">两条分支的结果必须长得一样</text>

  <rect x="30" y="192" width="400" height="96" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="46" y="214" font-size="12" font-weight="700" fill="#1f5537">首次：键不存在</text>
  <text x="46" y="238" font-size="11" fill="#3f6b50">占键成功 → 执行 → 回写「成功 + 结果」</text>
  <text x="46" y="260" font-size="11" fill="#3f6b50">返回：已升级到 X，操作人 Y</text>
  <text x="46" y="280" font-size="11" fill="#3f6b50">用户看到一次真实动作</text>

  <rect x="450" y="192" width="420" height="96" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="466" y="214" font-size="12" font-weight="700" fill="#1e4b7a">重放：键已存在</text>
  <text x="466" y="238" font-size="11" fill="#5a6b7d">直接返回上次的结果，不执行任何动作</text>
  <text x="466" y="260" font-size="11" fill="#5a6b7d">返回：已升级到 X，操作人 Y（同一条）</text>
  <text x="466" y="280" font-size="11" fill="#5a6b7d">用户无法分辨这是不是重复——这才是幂等</text>

  <rect x="30" y="304" width="840" height="100" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="326" font-size="13" font-weight="700" fill="#7a2626">此处会失效：幂等键本身就是设计题</text>
  <text x="46" y="350" font-size="12" fill="#7a2626">① 键里含时间戳 / 随机数 → 每次都是新键，等于没做幂等</text>
  <text x="46" y="372" font-size="12" fill="#7a2626">② 先执行后占键 → 检查与执行之间有窗口，并发时两边都执行</text>
  <text x="46" y="394" font-size="12" fill="#7a2626">③ 幂等表得你自己提供（托管层不给工具暴露 KV 接口）→ 键不带团队前缀就会跨团队碰撞</text>

  <text x="30" y="428" font-size="11" fill="#6b7280">与解法 A 的区别：A 靠「不让第二次发生」，B 靠「第二次发生也无害」</text>
</svg>
