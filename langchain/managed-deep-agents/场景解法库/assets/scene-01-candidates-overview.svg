<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="420" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">场景 1 总览：四个候选位置，四种绕过方式</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">横向对比用；每个解法各自的机制图在正文对应小节</text>

  <rect x="30" y="76" width="840" height="30" rx="4" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1"/>
  <text x="46" y="96" font-size="11" fill="#1e4b7a">信任级别：从左到右递增 —— 模型提示 &lt; 调用方数据 &lt; 平台数据 &lt; 不存在即调用不到</text>

  <rect x="30" y="126" width="195" height="120" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="1.5"/>
  <text x="46" y="148" font-size="12" font-weight="700" fill="#7a2626">① 提示词约束</text>
  <text x="46" y="170" font-size="10" fill="#7a2626">写在 instructions.md</text>
  <text x="46" y="190" font-size="10" fill="#7a2626">绕过：模型不听话</text>
  <text x="46" y="212" font-size="10" fill="#7a2626">验证：无</text>
  <text x="46" y="234" font-size="10" font-weight="700" fill="#7a2626">软 · 不可审计</text>

  <rect x="245" y="126" width="195" height="120" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="1.5"/>
  <text x="261" y="148" font-size="12" font-weight="700" fill="#7a2626">② 读 context 判</text>
  <text x="261" y="170" font-size="10" fill="#7a2626">if runtime.context.role</text>
  <text x="261" y="190" font-size="10" fill="#7a2626">绕过：调用方随便写</text>
  <text x="261" y="212" font-size="10" fill="#7a2626">验证：无，且无日志</text>
  <text x="261" y="234" font-size="10" font-weight="700" fill="#7a2626">软 · 静默越权</text>

  <rect x="460" y="126" width="195" height="120" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="476" y="148" font-size="12" font-weight="700" fill="#1f5537">③ 读 principal 判</text>
  <text x="476" y="170" font-size="10" fill="#3f6b50">server_info.principal</text>
  <text x="476" y="190" font-size="10" fill="#3f6b50">绕过：需改代码</text>
  <text x="476" y="212" font-size="10" fill="#3f6b50">验证：可断言</text>
  <text x="476" y="234" font-size="10" font-weight="700" fill="#1f5537">硬 · 但每处都要写对</text>

  <rect x="675" y="126" width="195" height="120" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="2.5"/>
  <text x="691" y="148" font-size="12" font-weight="700" fill="#1f5537">④ 不给这个工具</text>
  <text x="691" y="170" font-size="10" fill="#3f6b50">tools=[只读三个]</text>
  <text x="691" y="190" font-size="10" fill="#3f6b50">绕过：无路径</text>
  <text x="691" y="212" font-size="10" fill="#3f6b50">验证：看参数表</text>
  <text x="691" y="234" font-size="10" font-weight="700" fill="#1f5537">最硬 · 表达力最低</text>

  <text x="30" y="278" font-size="13" font-weight="700" fill="#1f2937">四个解法落在这四个位置</text>

  <rect x="30" y="294" width="195" height="46" rx="4" fill="#fff8ec" stroke="#b45309" stroke-width="1"/>
  <text x="127" y="322" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">解法 A → 位置 ③</text>

  <rect x="245" y="294" width="195" height="46" rx="4" fill="#fff8ec" stroke="#b45309" stroke-width="1"/>
  <text x="342" y="322" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">解法 B → ③ 的前置化</text>

  <rect x="460" y="294" width="195" height="46" rx="4" fill="#fff8ec" stroke="#b45309" stroke-width="1"/>
  <text x="557" y="322" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">解法 C → ③ 的集中化</text>

  <rect x="675" y="294" width="195" height="46" rx="4" fill="#fff8eb" stroke="#b45309" stroke-width="1"/>
  <text x="772" y="322" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">解法 D → 位置 ④</text>

  <rect x="30" y="358" width="840" height="46" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="386" font-size="12" fill="#7a2626">共同盲区：一条都防不住「定时任务没有 principal」—— 那需要设计层面决定「这个工具根本不该给调度用」</text>

  <text x="30" y="418" font-size="10" fill="#6b7280">看图要点：位置 ①② 的绕过不需要任何特殊条件，默认就是不安全的</text>
</svg>
