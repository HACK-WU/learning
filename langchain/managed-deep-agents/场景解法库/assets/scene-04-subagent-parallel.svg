<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="k1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fbfcfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1f2937">解法 B：子代理并行——一个入口内把重活拆给 subagents</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">托管侧不允许一个项目多张图，但允许一个 agent 委派给多个子代理</text>

  <rect x="30" y="82" width="180" height="56" rx="6" fill="#eef6ff" stroke="#1e4b7a" stroke-width="1.5"/>
  <text x="120" y="106" font-size="12" font-weight="700" fill="#1e4b7a" text-anchor="middle">主 agent</text>
  <text x="120" y="124" font-size="10" fill="#5a6b7d" text-anchor="middle">编排 + 汇总</text>

  <rect x="260" y="40" width="190" height="48" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="355" y="70" font-size="11" font-weight="700" fill="#1f5537" text-anchor="middle">子代理 1：查告警</text>

  <rect x="260" y="100" width="190" height="48" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="355" y="130" font-size="11" font-weight="700" fill="#1f5537" text-anchor="middle">子代理 2：查值班</text>

  <rect x="260" y="160" width="190" height="48" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="355" y="190" font-size="11" font-weight="700" fill="#1f5537" text-anchor="middle">子代理 3：查历史</text>

  <rect x="510" y="82" width="180" height="100" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="600" y="106" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">并发执行</text>
  <text x="600" y="128" font-size="10" fill="#7a4f13" text-anchor="middle">同一轮里同时发</text>
  <text x="600" y="148" font-size="10" fill="#7a4f13" text-anchor="middle">总耗时 ≈ 最慢那个</text>
  <text x="600" y="168" font-size="10" fill="#7a4f13" text-anchor="middle">而非三者之和</text>

  <rect x="730" y="82" width="140" height="100" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="800" y="112" font-size="11" font-weight="700" fill="#1f5537" text-anchor="middle">主 agent</text>
  <text x="800" y="134" font-size="11" font-weight="700" fill="#1f5537" text-anchor="middle">汇总输出</text>
  <text x="800" y="156" font-size="10" fill="#3f6b50" text-anchor="middle">上下文合并</text>

  <line x1="210" y1="104" x2="256" y2="68" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#k1)"/>
  <line x1="210" y1="110" x2="256" y2="124" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#k1)"/>
  <line x1="210" y1="118" x2="256" y2="180" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#k1)"/>
  <line x1="450" y1="68" x2="506" y2="110" stroke="#5a6b7d" stroke-width="1.2" marker-end="url(#k1)"/>
  <line x1="450" y1="124" x2="506" y2="130" stroke="#5a6b7d" stroke-width="1.2" marker-end="url(#k1)"/>
  <line x1="450" y1="184" x2="506" y2="152" stroke="#5a6b7d" stroke-width="1.2" marker-end="url(#k1)"/>
  <line x1="690" y1="132" x2="726" y2="132" stroke="#5a6b7d" stroke-width="1.5" marker-end="url(#k1)"/>

  <rect x="30" y="230" width="400" height="106" rx="6" fill="#f4faf6" stroke="#1f5537" stroke-width="1.5"/>
  <text x="46" y="252" font-size="12" font-weight="700" fill="#1f5537">收益在哪</text>
  <text x="46" y="276" font-size="11" fill="#3f6b50">· 墙钟时间：3 个 2s 任务 → 约 2s 不是 6s</text>
  <text x="46" y="298" font-size="11" fill="#3f6b50">· 每个子代理上下文独立，主 agent 不被中间过程污染</text>
  <text x="46" y="320" font-size="11" fill="#3f6b50">· 仍然只有一个部署、一条记忆树、一套通道</text>

  <rect x="460" y="230" width="410" height="106" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="476" y="252" font-size="12" font-weight="700" fill="#b45309">代价在哪</text>
  <text x="476" y="276" font-size="11" fill="#7a4f13">· token 总量上升：三个子代理各有自己的 system prompt</text>
  <text x="476" y="298" font-size="11" fill="#7a4f13">· 主 agent 需要一轮「拆任务」+ 一轮「汇总」，多两次模型调用</text>
  <text x="476" y="320" font-size="11" fill="#7a4f13">· 子代理失败时，主 agent 得自己决定部分失败怎么办</text>

  <rect x="30" y="352" width="840" height="70" rx="6" fill="#fdf6f6" stroke="#7a2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="374" font-size="13" font-weight="700" fill="#7a2626">此处会失效</text>
  <text x="46" y="398" font-size="12" fill="#7a2626">① 子代理数远超并行度上限时，实际变成排队 → 耗时又回到「之和」，「并行」是幻觉</text>
  <text x="46" y="418" font-size="12" fill="#7a2626">② 子代理自己再调工具 → 工具调用次数成倍放大，配额与成本按倍数烧</text>
</svg>
