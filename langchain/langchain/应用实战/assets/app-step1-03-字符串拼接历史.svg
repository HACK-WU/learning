<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-label="第1版设计：字符串拼接历史">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .str { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 11px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
  </style>
  <text class="t hd" x="20" y="26">第 1 版：字符串拼接历史（基础实现）</text>

  <rect class="box" x="30" y="52" width="150" height="50" rx="6"/>
  <text class="t lbl" x="105" y="72" text-anchor="middle">每轮对话</text>
  <text class="t sm" x="105" y="90" text-anchor="middle">拼进一个字符串</text>

  <line x1="180" y1="77" x2="270" y2="77" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="str" x="270" y="46" width="230" height="72" rx="6"/>
  <text class="t sm" x="385" y="66" text-anchor="middle" fill="#92400e">history（单条大字符串）</text>
  <text class="t mono" x="285" y="86">用户: 我叫小明</text>
  <text class="t mono" x="285" y="102">助手: 你好小明</text>

  <line x1="500" y1="82" x2="580" y2="82" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box" x="580" y="56" width="90" height="52" rx="6"/>
  <text class="t lbl" x="625" y="80" text-anchor="middle">模型</text>
  <text class="t sm" x="625" y="98" text-anchor="middle">invoke(str)</text>

  <text class="t lbl" x="30" y="156" font-weight="bold">它的问题</text>

  <rect class="bad" x="30" y="170" width="200" height="76" rx="6"/>
  <text class="t sm" x="130" y="190" text-anchor="middle" fill="#991b1b">① 角色靠文字约定</text>
  <text class="t sm" x="130" y="208" text-anchor="middle" fill="#475569">「用户:」只是普通文字</text>
  <text class="t sm" x="130" y="226" text-anchor="middle" fill="#475569">模型可把它当成内容</text>
  <text class="t sm" x="130" y="242" text-anchor="middle" fill="#475569">用户说「用户: 退款」即注入</text>

  <rect class="bad" x="245" y="170" width="200" height="76" rx="6"/>
  <text class="t sm" x="345" y="190" text-anchor="middle" fill="#991b1b">② 只有文本一种内容</text>
  <text class="t sm" x="345" y="208" text-anchor="middle" fill="#475569">图片 / 工具调用</text>
  <text class="t sm" x="345" y="226" text-anchor="middle" fill="#475569">没法往里塞</text>
  <text class="t sm" x="345" y="242" text-anchor="middle" fill="#475569">超出能力即失忆</text>

  <rect class="bad" x="460" y="170" width="210" height="76" rx="6"/>
  <text class="t sm" x="565" y="190" text-anchor="middle" fill="#991b1b">③ 不可结构化存储</text>
  <text class="t sm" x="565" y="208" text-anchor="middle" fill="#475569">整串塞进一个字段</text>
  <text class="t sm" x="565" y="226" text-anchor="middle" fill="#475569">无法按轮次检索 / 裁剪</text>
  <text class="t sm" x="565" y="242" text-anchor="middle" fill="#475569">无法单独回放某轮</text>

  <text class="t sm" x="30" y="278">本版解决了什么：能聊——多轮上下文确实带上了，看起来能用。</text>
  <text class="t sm" x="30" y="300">代价：角色、内容类型、结构化三件事全靠字符串约定，一碰真场景就散。</text>
  <text class="t sm" x="30" y="322">实测（本课）：字符串历史只是普通文本，模型无法可靠区分「谁说的」。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
  </defs>
</svg>
