<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-label="第1版设计：裸函数直接当工具">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 11px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
  </style>
  <text class="t hd" x="20" y="26">第 1 版：裸函数直接给模型（基础实现）</text>

  <rect class="box" x="30" y="56" width="140" height="50" rx="6"/>
  <text class="t lbl" x="100" y="76" text-anchor="middle">模型</text>
  <text class="t sm" x="100" y="94" text-anchor="middle">看到函数签名</text>

  <line x1="170" y1="81" x2="250" y2="81" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="box" x="250" y="48" width="220" height="66" rx="6"/>
  <text class="t sm" x="360" y="68" text-anchor="middle">工具（凭签名推断）</text>
  <text class="t mono" x="262" y="88">def query_order(oid): ...</text>
  <text class="t mono" x="262" y="104">（无 docstring / 无标注）</text>

  <line x1="470" y1="81" x2="540" y2="81" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box" x="540" y="56" width="130" height="50" rx="6"/>
  <text class="t sm" x="605" y="76" text-anchor="middle">内部 API</text>
  <text class="t sm" x="605" y="94" text-anchor="middle">可能抛异常</text>

  <line x1="605" y1="106" x2="605" y2="150" stroke="#dc2626" stroke-width="2" marker-end="url(#b)"/>
  <rect class="bad" x="470" y="150" width="270" height="46" rx="6"/>
  <text class="t sm" x="605" y="170" text-anchor="middle" fill="#991b1b">异常直接冒泡 → agent 崩溃</text>
  <text class="t sm" x="605" y="188" text-anchor="middle" fill="#991b1b">用户看到一串堆栈</text>

  <text class="t lbl" x="30" y="230" font-weight="bold">它的问题</text>

  <rect class="bad" x="30" y="244" width="200" height="72" rx="6"/>
  <text class="t sm" x="130" y="264" text-anchor="middle" fill="#991b1b">① 契约靠猜</text>
  <text class="t sm" x="130" y="282" text-anchor="middle" fill="#475569">oid 是什么格式？</text>
  <text class="t sm" x="130" y="300" text-anchor="middle" fill="#475569">模型只能瞎猜参数</text>

  <rect class="bad" x="245" y="244" width="200" height="72" rx="6"/>
  <text class="t sm" x="345" y="264" text-anchor="middle" fill="#991b1b">② 出错即崩</text>
  <text class="t sm" x="345" y="282" text-anchor="middle" fill="#475569">异常不会变成</text>
  <text class="t sm" x="345" y="300" text-anchor="middle" fill="#475569">「模型看得懂的反馈」</text>

  <rect class="bad" x="460" y="244" width="210" height="72" rx="6"/>
  <text class="t sm" x="565" y="264" text-anchor="middle" fill="#991b1b">③ 权限无差别</text>
  <text class="t sm" x="565" y="282" text-anchor="middle" fill="#475569">只读用户也拿到</text>
  <text class="t sm" x="565" y="300" text-anchor="middle" fill="#475569">删除工具</text>

  <text class="t sm" x="30" y="344">本版解决了什么：能调——内部 API 确实被模型调起来了。</text>
  <text class="t sm" x="30" y="366">代价：契约、容错、权限三件事全裸奔，一碰真场景就出事。</text>
  <text class="t sm" x="30" y="388">实测：无 docstring 的 @tool 直接 ValueError（连定义都过不去）。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>
</svg>
