<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" aria-label="第2版设计：按域拆分为专家子agent">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .new { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 10px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
    .tag { font-size: 11px; fill: #92400e; font-weight: bold; }
  </style>
  <text class="t hd" x="20" y="26">第 2 版：按域拆分为专家子 agent（改进实现）</text>

  <text class="t sm" x="24" y="50">主代理只认识 4 个专家，领域知识与工具下沉到各专家内部</text>

  <rect class="new" x="24" y="60" width="180" height="86" rx="6"/>
  <text class="t tag" x="114" y="80" text-anchor="middle">主代理（总协调员）</text>
  <text class="t mono" x="32" y="100">4 个子代理工具 = 611 字符</text>
  <text class="t sm" x="114" y="118" text-anchor="middle" fill="#475569">不含任何领域知识</text>
  <text class="t sm" x="114" y="136" text-anchor="middle" fill="#475569">只负责「派给谁」</text>

  <line x1="204" y1="103" x2="242" y2="103" stroke="#d97706" stroke-width="1.5" marker-end="url(#o)"/>

  <rect class="ok" x="242" y="60" width="110" height="86" rx="6"/>
  <text class="t sm" x="297" y="80" text-anchor="middle" fill="#15803d">weather</text>
  <text class="t mono" x="250" y="98">1 工具 + 知识</text>
  <text class="t mono" x="250" y="114">= 231 字符</text>
  <text class="t sm" x="297" y="132" text-anchor="middle" fill="#475569">只在被调度时</text>
  <text class="t sm" x="297" y="142" text-anchor="middle" fill="#475569">才付这份钱</text>

  <rect class="ok" x="360" y="60" width="110" height="86" rx="6"/>
  <text class="t sm" x="415" y="80" text-anchor="middle" fill="#15803d">finance</text>
  <text class="t mono" x="368" y="98">2 工具 + 知识</text>
  <text class="t mono" x="368" y="114">= 566 字符</text>
  <text class="t sm" x="415" y="132" text-anchor="middle" fill="#475569">主会话看不到</text>
  <text class="t sm" x="415" y="142" text-anchor="middle" fill="#475569">它的内部过程</text>

  <rect class="ok" x="478" y="60" width="100" height="86" rx="6"/>
  <text class="t sm" x="528" y="80" text-anchor="middle" fill="#15803d">database</text>
  <text class="t mono" x="486" y="98">1 工具 + 知识</text>
  <text class="t mono" x="486" y="114">= 242 字符</text>
  <text class="t sm" x="528" y="132" text-anchor="middle" fill="#475569">返回的是</text>
  <text class="t sm" x="528" y="142" text-anchor="middle" fill="#475569">一句话结论</text>

  <rect class="ok" x="586" y="60" width="84" height="86" rx="6"/>
  <text class="t sm" x="628" y="80" text-anchor="middle" fill="#15803d">office</text>
  <text class="t mono" x="594" y="98">4 工具 + 知识</text>
  <text class="t mono" x="594" y="114">= 907 字符</text>
  <text class="t sm" x="628" y="132" text-anchor="middle" fill="#475569">最大的专家</text>
  <text class="t sm" x="628" y="142" text-anchor="middle" fill="#475569">也按需付费</text>

  <text class="t sm" x="24" y="174">成本对照（实测字符数）</text>

  <rect class="box" x="24" y="184" width="646" height="42" rx="6"/>
  <text class="t mono" x="38" y="202">单 agent 每次调用：1983 字符   |   拆分后主代理：611 字符   |   子代理按需：231 ~ 907 字符</text>
  <text class="t mono" x="38" y="218">典型任务（主 + 一个子）= 842 ~ 1518 字符 → 节省 23% ~ 58%</text>

  <text class="t sm" x="24" y="254">代码：把子 agent 包装成工具</text>

  <rect class="box" x="24" y="264" width="646" height="76" rx="6"/>
  <text class="t mono" x="38" y="284">def make_specialist(name, tools, knowledge, desc):</text>
  <text class="t mono" x="38" y="300">    agent = create_agent(model, tools=tools, system_prompt=knowledge)   # 专家自带领域知识</text>
  <text class="t mono" x="38" y="316">    @tool(name, description=desc)</text>
  <text class="t mono" x="38" y="332">    def call_specialist(query: str) -&gt; str:                              # 包成工具</text>
  <text class="t mono" x="56" y="348">        return agent.invoke({'messages': [{'role': 'user', 'content': query}]})['messages'][-1].content</text>

  <text class="t sm" x="24" y="368">实测确认</text>

  <rect class="bad" x="24" y="378" width="320" height="46" rx="6"/>
  <text class="t sm" x="184" y="398" text-anchor="middle" fill="#991b1b">① 子代理内部消息在主会话不可见</text>
  <text class="t sm" x="184" y="416" text-anchor="middle" fill="#475569">实测：主会话只看到 weather_expert，看不到内部 get_weather</text>

  <rect class="bad" x="356" y="378" width="314" height="46" rx="6"/>
  <text class="t sm" x="513" y="398" text-anchor="middle" fill="#991b1b">② 上下文隔离：子代理不继承主会话历史</text>
  <text class="t sm" x="513" y="416" text-anchor="middle" fill="#475569">实测：裸子代理只收到 1 条用户消息</text>

  <defs>
    <marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  </defs>
</svg>
