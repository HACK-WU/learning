<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="第2版设计：短期记忆按线程续接">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .new { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .thr { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 10px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
    .tag { font-size: 11px; fill: #6d28d9; font-weight: bold; }
  </style>
  <text class="t hd" x="20" y="26">第 2 版：checkpointer 按线程续接（改进实现）</text>

  <rect class="thr" x="24" y="50" width="180" height="56" rx="6"/>
  <text class="t tag" x="114" y="70" text-anchor="middle">新增：thread_id</text>
  <text class="t mono" x="36" y="90">{'configurable': {'thread_id': 'A'}}</text>
  <text class="t sm" x="114" y="102" text-anchor="middle">会话的身份标识</text>

  <line x1="204" y1="78" x2="252" y2="78" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#p)"/>

  <rect class="new" x="252" y="50" width="220" height="56" rx="6"/>
  <text class="t tag" x="362" y="70" text-anchor="middle">新增：checkpointer</text>
  <text class="t mono" x="264" y="90">InMemorySaver()</text>
  <text class="t sm" x="362" y="102" text-anchor="middle">按 thread 存 / 取消息链</text>

  <line x1="472" y1="78" x2="520" y2="78" stroke="#d97706" stroke-width="1.5" marker-end="url(#o)"/>
  <rect class="ok" x="520" y="50" width="152" height="56" rx="6"/>
  <text class="t sm" x="596" y="70" text-anchor="middle" fill="#15803d">历史自动续接</text>
  <text class="t sm" x="596" y="90" text-anchor="middle" fill="#475569">不用手动拼历史</text>
  <text class="t sm" x="596" y="102" text-anchor="middle" fill="#475569">invoke 时自动带上</text>

  <text class="t sm" x="24" y="140">实测：同线程累积 vs 换线程隔离</text>

  <rect class="ok" x="24" y="150" width="310" height="82" rx="6"/>
  <text class="t sm" x="179" y="170" text-anchor="middle" fill="#15803d">thread-A（同一会话）</text>
  <text class="t mono" x="38" y="190">第1轮: 2 条 → 第2轮: 4 条</text>
  <text class="t mono" x="38" y="208">链: human, ai, human, ai</text>
  <text class="t sm" x="179" y="224" text-anchor="middle" fill="#475569">get_state(config) 可取回持久化消息</text>

  <rect class="box" x="350" y="150" width="322" height="82" rx="6"/>
  <text class="t sm" x="511" y="170" text-anchor="middle">thread-B（新会话）</text>
  <text class="t mono" x="364" y="190">invoke → 2 条（不继承 A 的历史）</text>
  <text class="t sm" x="511" y="208" text-anchor="middle" fill="#475569">实测：问「我叫什么」→ 答不知道</text>
  <text class="t sm" x="511" y="224" text-anchor="middle" fill="#475569">线程之间互相隔离 ✓</text>

  <text class="t lbl" x="24" y="264" font-weight="bold">它的问题</text>

  <rect class="box" x="24" y="278" width="310" height="60" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="179" y="298" text-anchor="middle" fill="#991b1b">① 消息链无限增长</text>
  <text class="t sm" x="179" y="316" text-anchor="middle" fill="#475569">实测 4 轮后 8 条、第 5 轮 10 条</text>
  <text class="t sm" x="179" y="332" text-anchor="middle" fill="#475569">token 与延迟随轮次线性上升</text>

  <rect class="box" x="350" y="278" width="322" height="60" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="511" y="298" text-anchor="middle" fill="#991b1b">② 换会话即失忆</text>
  <text class="t sm" x="511" y="316" text-anchor="middle" fill="#475569">checkpointer 只在线程内有效</text>
  <text class="t sm" x="511" y="332" text-anchor="middle" fill="#475569">开新会话，用户偏好归零</text>

  <text class="t sm" x="24" y="362">比上张多了什么：紫色 thread_id + 黄色 checkpointer——历史自动续接且线程间隔离。</text>
  <text class="t sm" x="24" y="380">实测：thread-A 两轮后 get_state 取回 4 条；thread-B 独立算起，不继承 A。</text>
  <text class="t sm" x="24" y="398">InMemorySaver 进程重启即丢，生产需换 SqliteSaver / PostgresSaver。</text>

  <defs>
    <marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  </defs>
</svg>
