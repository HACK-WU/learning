<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="700" height="410" role="img" aria-label="第2版设计：加护栏与结构化输出">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .new { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 10px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
    .tag { font-size: 11px; fill: #92400e; font-weight: bold; }
  </style>
  <text class="t hd" x="20" y="26">第 2 版：加护栏 + 结构化输出（改进实现）</text>

  <rect class="box" x="24" y="50" width="130" height="50" rx="6"/>
  <text class="t lbl" x="89" y="70" text-anchor="middle">用户输入</text>
  <text class="t sm" x="89" y="88" text-anchor="middle">带问题</text>

  <line x1="154" y1="75" x2="200" y2="75" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="new" x="200" y="48" width="200" height="56" rx="6"/>
  <text class="t tag" x="300" y="68" text-anchor="middle">新增：system_prompt 约束</text>
  <text class="t sm" x="300" y="86" text-anchor="middle">角色 / 口径 / 边界</text>
  <text class="t sm" x="300" y="98" text-anchor="middle">不确定就说不知道</text>

  <line x1="400" y1="76" x2="450" y2="76" stroke="#d97706" stroke-width="1.5" marker-end="url(#o)"/>

  <rect class="new" x="450" y="48" width="220" height="56" rx="6"/>
  <text class="t tag" x="560" y="68" text-anchor="middle">新增：步数预算</text>
  <text class="t mono" x="462" y="88">config={'recursion_limit': 25}</text>
  <text class="t sm" x="560" y="102" text-anchor="middle">invoke 时传入（非构造参数）</text>

  <rect class="box" x="200" y="126" width="470" height="50" rx="6"/>
  <text class="t sm" x="435" y="146" text-anchor="middle">agent loop（model ⇄ tools 循环）</text>
  <text class="t sm" x="435" y="164" text-anchor="middle">超预算 → GraphRecursionError</text>

  <line x1="435" y1="176" x2="435" y2="206" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="ok" x="180" y="206" width="510" height="66" rx="6"/>
  <text class="t tag" x="435" y="226" text-anchor="middle" fill="#15803d">新增：response_format 结构化输出</text>
  <text class="t mono" x="196" y="246">res['structured_response'] → ContactInfo(name=..., email=...)</text>
  <text class="t sm" x="435" y="264" text-anchor="middle" fill="#475569">实测：返回 keys 变 ['messages','structured_response']，类型是 Pydantic 模型实例</text>

  <text class="t lbl" x="24" y="296" font-weight="bold">它的问题</text>

  <rect class="box" x="24" y="310" width="310" height="56" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="179" y="330" text-anchor="middle" fill="#991b1b">① 跑完才知道结果</text>
  <text class="t sm" x="179" y="348" text-anchor="middle" fill="#475569">长任务用户干等，无进度</text>

  <rect class="box" x="350" y="310" width="320" height="56" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="510" y="330" text-anchor="middle" fill="#991b1b">② 失败原因不透明</text>
  <text class="t sm" x="510" y="348" text-anchor="middle" fill="#475569">只知道崩了，不知道卡在第几步</text>

  <text class="t sm" x="24" y="388">比上张多了什么：黄色三块——提示词约束、步数预算、结构化输出；绿框是可编程的结果。</text>
  <text class="t sm" x="24" y="406">实测：recursion_limit=6 时无限循环模型触发 GraphRecursionError。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  </defs>
</svg>
