<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-label="第1版设计：无记忆每轮重开">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 11px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
  </style>
  <text class="t hd" x="20" y="26">第 1 版：无记忆，每轮重开（基础实现）</text>

  <rect class="box" x="26" y="58" width="126" height="60" rx="6"/>
  <text class="t lbl" x="89" y="78" text-anchor="middle">第 1 轮</text>
  <text class="t sm" x="89" y="96" text-anchor="middle">「我叫小明」</text>
  <text class="t sm" x="89" y="110" text-anchor="middle">消息数 2</text>

  <line x1="152" y1="88" x2="200" y2="88" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="bad" x="200" y="64" width="150" height="48" rx="6"/>
  <text class="t sm" x="275" y="84" text-anchor="middle" fill="#991b1b">跑完即丢弃</text>
  <text class="t sm" x="275" y="102" text-anchor="middle" fill="#991b1b">没有 checkpointer</text>

  <line x1="350" y1="88" x2="398" y2="88" stroke="#dc2626" stroke-width="1.5" marker-end="url(#b)"/>
  <rect class="box" x="398" y="58" width="126" height="60" rx="6"/>
  <text class="t lbl" x="461" y="78" text-anchor="middle">第 2 轮</text>
  <text class="t sm" x="461" y="96" text-anchor="middle">「我叫什么？」</text>
  <text class="t sm" x="461" y="110" text-anchor="middle" fill="#991b1b">消息数仍 2</text>

  <line x1="524" y1="88" x2="570" y2="88" stroke="#dc2626" stroke-width="1.5" marker-end="url(#b)"/>
  <rect class="bad" x="570" y="64" width="104" height="48" rx="6"/>
  <text class="t sm" x="622" y="84" text-anchor="middle" fill="#991b1b">答非所问</text>
  <text class="t sm" x="622" y="102" text-anchor="middle" fill="#991b1b">「我不知道」</text>

  <text class="t sm" x="26" y="152">两次 invoke 的调用与状态（实测）</text>
  <rect class="box" x="26" y="162" width="310" height="52" rx="6"/>
  <text class="t mono" x="38" y="182">invoke(...) → 2 条消息</text>
  <text class="t mono" x="38" y="200">invoke(...) → 2 条消息   ← 又是 2</text>

  <rect class="bad" x="352" y="162" width="322" height="52" rx="6"/>
  <text class="t sm" x="513" y="182" text-anchor="middle" fill="#991b1b">第二次调用时，agent 完全不知道上一轮存在</text>
  <text class="t sm" x="513" y="200" text-anchor="middle" fill="#475569">两次调用之间没有任何状态被保存</text>

  <text class="t lbl" x="26" y="242" font-weight="bold">它的问题</text>

  <rect class="bad" x="26" y="256" width="200" height="76" rx="6"/>
  <text class="t sm" x="126" y="276" text-anchor="middle" fill="#991b1b">① 上下文不接续</text>
  <text class="t sm" x="126" y="294" text-anchor="middle" fill="#475569">「我叫什么？」</text>
  <text class="t sm" x="126" y="310" text-anchor="middle" fill="#475569">只能答不知道</text>
  <text class="t sm" x="126" y="326" text-anchor="middle" fill="#475569">多轮对话不可用</text>

  <rect class="bad" x="242" y="256" width="200" height="76" rx="6"/>
  <text class="t sm" x="342" y="276" text-anchor="middle" fill="#991b1b">② 无法追溯</text>
  <text class="t sm" x="342" y="294" text-anchor="middle" fill="#475569">出错时看不到</text>
  <text class="t sm" x="342" y="310" text-anchor="middle" fill="#475569">当时聊了什么</text>
  <text class="t sm" x="342" y="326" text-anchor="middle" fill="#475569">只能靠外部日志</text>

  <rect class="bad" x="458" y="256" width="216" height="76" rx="6"/>
  <text class="t sm" x="566" y="276" text-anchor="middle" fill="#991b1b">③ 重开即失忆</text>
  <text class="t sm" x="566" y="294" text-anchor="middle" fill="#475569">换会话 / 重启进程</text>
  <text class="t sm" x="566" y="310" text-anchor="middle" fill="#475569">用户偏好全部归零</text>
  <text class="t sm" x="566" y="326" text-anchor="middle" fill="#475569">每轮都像新客</text>

  <text class="t sm" x="26" y="358">本版解决了什么：单次问答是对的——一轮一问一答，逻辑最简单、无状态最好推理。</text>
  <text class="t sm" x="26" y="380">代价：只要涉及「上一轮说过的话」，立刻失忆。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>
</svg>
