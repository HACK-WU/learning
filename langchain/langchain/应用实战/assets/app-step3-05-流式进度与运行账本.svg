<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" role="img" aria-label="第3版设计：流式进度与运行账本">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .new { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .str { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 10px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
    .tag { font-size: 11px; fill: #075985; font-weight: bold; }
  </style>
  <text class="t hd" x="20" y="26">第 3 版：流式进度 + 运行账本（综合实现）</text>

  <rect class="box" x="24" y="50" width="120" height="46" rx="6"/>
  <text class="t sm" x="84" y="70" text-anchor="middle">用户输入</text>
  <text class="t sm" x="84" y="88" text-anchor="middle">（一个问题）</text>

  <line x1="144" y1="73" x2="196" y2="73" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="box" x="196" y="48" width="150" height="50" rx="6"/>
  <text class="t sm" x="271" y="68" text-anchor="middle">agent（带护栏）</text>
  <text class="t sm" x="271" y="88" text-anchor="middle">prompt + limit</text>

  <line x1="346" y1="73" x2="410" y2="73" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="str" x="410" y="42" width="264" height="62" rx="6"/>
  <text class="t tag" x="542" y="62" text-anchor="middle">新增：stream（stream_mode='updates'）</text>
  <text class="t mono" x="424" y="82">for chunk in agent.stream(...):</text>
  <text class="t sm" x="542" y="100" text-anchor="middle" fill="#475569">边跑边吐：用户看得到进度</text>

  <text class="t sm" x="24" y="140">三种 stream_mode 实测（同一任务）：</text>

  <rect class="box" x="24" y="150" width="200" height="60" rx="6"/>
  <text class="t sm" x="124" y="170" text-anchor="middle">messages</text>
  <text class="t sm" x="124" y="188" text-anchor="middle" fill="#475569">按消息粒度（3 chunks）</text>
  <text class="t sm" x="124" y="204" text-anchor="middle" fill="#475569">适合打字机效果</text>

  <rect class="new" x="240" y="150" width="200" height="60" rx="6"/>
  <text class="t sm" x="340" y="170" text-anchor="middle">updates</text>
  <text class="t sm" x="340" y="188" text-anchor="middle" fill="#475569">按节点步骤（3 chunks）</text>
  <text class="t sm" x="340" y="204" text-anchor="middle" fill="#92400e">适合展示进度 ✓</text>

  <rect class="box" x="456" y="150" width="218" height="60" rx="6"/>
  <text class="t sm" x="565" y="170" text-anchor="middle">values</text>
  <text class="t sm" x="565" y="188" text-anchor="middle" fill="#475569">每步完整状态（4 chunks）</text>
  <text class="t sm" x="565" y="204" text-anchor="middle" fill="#475569">适合调试 / 存快照</text>

  <rect class="new" x="24" y="230" width="646" height="76" rx="6"/>
  <text class="t tag" x="347" y="250" text-anchor="middle">新增：运行账本（跑完自动记账）</text>
  <text class="t mono" x="38" y="272">模型调用 N 次 · 工具申请 M 条 · 工具回执 K 条 · 消息共 T 条</text>
  <text class="t sm" x="347" y="292" text-anchor="middle" fill="#475569">超阈值即告警——成本与失控从「事后才发现」变「当场可见」</text>

  <rect class="ok" x="24" y="326" width="310" height="56" rx="6"/>
  <text class="t sm" x="179" y="346" text-anchor="middle" fill="#15803d">结构化结果照旧可取</text>
  <text class="t sm" x="179" y="364" text-anchor="middle" fill="#475569">structured_response 仍是 Pydantic 实例</text>

  <rect class="ok" x="350" y="326" width="320" height="56" rx="6"/>
  <text class="t sm" x="510" y="346" text-anchor="middle" fill="#15803d">失败可定位</text>
  <text class="t sm" x="510" y="364" text-anchor="middle" fill="#475569">账本 + 进度 → 卡在第几步一目了然</text>

  <text class="t lbl" x="24" y="404" font-weight="bold">三层各就各位</text>
  <text class="t sm" x="24" y="422">约束层：system_prompt 定边界 + recursion_limit 定预算（黄框）。</text>
  <text class="t sm" x="24" y="440">契约层：response_format 产出可编程的结构化结果（绿框）。</text>
  <text class="t sm" x="24" y="458">观测层：stream 给进度 + 账本给成本（蓝/黄框），失败可定位。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
  </defs>
</svg>
