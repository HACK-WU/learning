<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-label="第2版设计：主备降级">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .model { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .new { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
    .tag { font-size: 11px; fill: #92400e; font-weight: bold; }
  </style>
  <text class="t hd" x="20" y="28">第 2 版：主备降级（改进实现）</text>

  <rect class="box" x="30" y="60" width="150" height="54" rx="6"/>
  <text class="t lbl" x="105" y="82" text-anchor="middle">业务脚本</text>
  <text class="t sm" x="105" y="100" text-anchor="middle">app.py（零改动）</text>

  <line x1="180" y1="87" x2="250" y2="87" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="new" x="250" y="46" width="180" height="82" rx="6"/>
  <text class="t tag" x="340" y="66" text-anchor="middle">新增：降级编排</text>
  <text class="t lbl" x="340" y="86" text-anchor="middle">with_fallbacks</text>
  <text class="t sm" x="340" y="106" text-anchor="middle">主模型失败自动换备用</text>
  <text class="t sm" x="340" y="122" text-anchor="middle">业务侧仍是 .invoke()</text>

  <line x1="430" y1="70" x2="520" y2="50" stroke="#16a34a" stroke-width="1.5" marker-end="url(#c)"/>
  <rect class="model" x="520" y="28" width="150" height="44" rx="6"/>
  <text class="t sm" x="595" y="48" text-anchor="middle">① 主模型</text>
  <text class="t sm" x="595" y="64" text-anchor="middle">优先</text>

  <line x1="430" y1="104" x2="520" y2="140" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#d)"/>
  <rect class="new" x="520" y="118" width="150" height="44" rx="6"/>
  <text class="t sm" x="595" y="138" text-anchor="middle">② 备用模型</text>
  <text class="t sm" x="595" y="154" text-anchor="middle">仅失败时</text>

  <text class="t sm" x="450" y="128" fill="#b45309">失败即切换</text>

  <text class="t lbl" x="30" y="196" font-weight="bold">它的问题</text>

  <rect class="box" x="30" y="210" width="200" height="86" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="130" y="232" text-anchor="middle" fill="#991b1b">① 备用也挂了怎么办</text>
  <text class="t sm" x="130" y="250" text-anchor="middle" fill="#475569">链末端仍会抛异常</text>
  <text class="t sm" x="130" y="268" text-anchor="middle" fill="#475569">没兜底策略</text>
  <text class="t sm" x="130" y="286" text-anchor="middle" fill="#475569">（可选再挂一级）</text>

  <rect class="box" x="250" y="210" width="200" height="86" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="350" y="232" text-anchor="middle" fill="#991b1b">② 黑盒：悄悄降了级</text>
  <text class="t sm" x="350" y="250" text-anchor="middle" fill="#475569">不知道走了备用</text>
  <text class="t sm" x="350" y="268" text-anchor="middle" fill="#475569">次数 / 原因无统计</text>
  <text class="t sm" x="350" y="286" text-anchor="middle" fill="#475569">故障被静默吞掉</text>

  <rect class="box" x="470" y="210" width="200" height="86" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="570" y="232" text-anchor="middle" fill="#991b1b">③ 配置仍硬编码</text>
  <text class="t sm" x="570" y="250" text-anchor="middle" fill="#475569">两个模型写死在代码</text>
  <text class="t sm" x="570" y="268" text-anchor="middle" fill="#475569">换环境要改源码</text>
  <text class="t sm" x="570" y="286" text-anchor="middle" fill="#475569">无法按请求切换</text>

  <text class="t sm" x="30" y="330">比上张多了什么：主模型后面多挂一条备用链路——单点变双点，调用方接口不变。</text>
  <text class="t sm" x="30" y="352">本步解决了什么：主模型故障不再直接报错，业务连续性有了第一道保险。</text>
  <text class="t sm" x="30" y="374">遗留：降级是黑盒的（不知道发生了），配置依旧写死。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
    <marker id="c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>
</svg>
