<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-label="第1版设计：非流式等到全部完成">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .wait { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 11px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
  </style>
  <text class="t hd" x="20" y="26">第 1 版：invoke 等全部完成（基础实现）</text>

  <rect class="box" x="26" y="58" width="110" height="46" rx="6"/>
  <text class="t lbl" x="81" y="78" text-anchor="middle">用户提问</text>
  <text class="t sm" x="81" y="94" text-anchor="middle">（t=0s）</text>

  <line x1="136" y1="81" x2="186" y2="81" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="wait" x="186" y="52" width="330" height="58" rx="6"/>
  <text class="t sm" x="351" y="72" text-anchor="middle">agent 内部跑完整个 loop（无任何输出）</text>
  <text class="t mono" x="200" y="92">model → tools → model → …（全部跑完才返回）</text>

  <line x1="516" y1="81" x2="566" y2="81" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box" x="566" y="58" width="110" height="46" rx="6"/>
  <text class="t sm" x="621" y="78" text-anchor="middle">一次性返回</text>
  <text class="t sm" x="621" y="94" text-anchor="middle">（t=8s）</text>

  <text class="t sm" x="26" y="132">时间轴（用户视角）</text>
  <line x1="26" y1="146" x2="674" y2="146" stroke="#cbd5e1" stroke-width="2"/>
  <rect class="wait" x="26" y="140" width="620" height="12" rx="3"/>
  <text class="t sm" x="351" y="168" text-anchor="middle" fill="#991b1b">0s —————————— 全程空白，用户不知道在跑还是挂了 —————————— 8s</text>
  <text class="t sm" x="648" y="168" fill="#15803d">✓ 结果</text>

  <text class="t lbl" x="26" y="204" font-weight="bold">它的问题</text>

  <rect class="bad" x="26" y="218" width="200" height="76" rx="6"/>
  <text class="t sm" x="126" y="238" text-anchor="middle" fill="#991b1b">① 首字延迟 = 总耗时</text>
  <text class="t sm" x="126" y="256" text-anchor="middle" fill="#475569">要 8 秒的活儿</text>
  <text class="t sm" x="126" y="274" text-anchor="middle" fill="#475569">用户就得干等 8 秒</text>
  <text class="t sm" x="126" y="288" text-anchor="middle" fill="#475569">才能看到第一个字</text>

  <rect class="bad" x="242" y="218" width="200" height="76" rx="6"/>
  <text class="t sm" x="342" y="238" text-anchor="middle" fill="#991b1b">② 无法判断存活</text>
  <text class="t sm" x="342" y="256" text-anchor="middle" fill="#475569">空白页 vs 卡死</text>
  <text class="t sm" x="342" y="274" text-anchor="middle" fill="#475569">用户分不清</text>
  <text class="t sm" x="342" y="288" text-anchor="middle" fill="#475569">只能刷新重试</text>

  <rect class="bad" x="458" y="218" width="216" height="76" rx="6"/>
  <text class="t sm" x="566" y="238" text-anchor="middle" fill="#991b1b">③ 失败=全丢</text>
  <text class="t sm" x="566" y="256" text-anchor="middle" fill="#475569">跑到 90% 崩了</text>
  <text class="t sm" x="566" y="274" text-anchor="middle" fill="#475569">前面所有中间产物</text>
  <text class="t sm" x="566" y="288" text-anchor="middle" fill="#475569">一个都拿不到</text>

  <text class="t sm" x="26" y="320">本版解决了什么：能拿到结果——功能是对的，代码也是最简单的。</text>
  <text class="t sm" x="26" y="342">代价：用户全程处于「盲等」状态；长任务体验差，出问题也无从判断。</text>
  <text class="t sm" x="26" y="364">实测：invoke 返回 keys = ['messages']，终答在最后一条；耗时全部堆在返回前。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
  </defs>
</svg>
