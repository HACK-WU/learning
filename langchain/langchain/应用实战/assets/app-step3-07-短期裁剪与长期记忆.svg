<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" role="img" aria-label="第3版设计：短期裁剪与长期跨会话记忆">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .new { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .lt { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 10px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
    .tag { font-size: 11px; fill: #6d28d9; font-weight: bold; }
  </style>
  <text class="t hd" x="20" y="26">第 3 版：短期裁剪 + 长期跨会话记忆（综合实现）</text>

  <text class="t sm" x="24" y="54">左：短期记忆怎么控制规模（实测同一组 4 轮对话 + 1 次检查）</text>

  <rect class="box" x="24" y="64" width="200" height="76" rx="6"/>
  <text class="t sm" x="124" y="84" text-anchor="middle">全量（默认）</text>
  <text class="t mono" x="38" y="104">2→4→6→8→10 条</text>
  <text class="t sm" x="124" y="122" text-anchor="middle" fill="#991b1b">token 估算 62</text>
  <text class="t sm" x="124" y="136" text-anchor="middle" fill="#475569">越聊越长，成本线性涨</text>

  <rect class="new" x="240" y="64" width="200" height="76" rx="6"/>
  <text class="t sm" x="340" y="84" text-anchor="middle">裁剪（before_model）</text>
  <text class="t mono" x="254" y="104">稳定在 6 条</text>
  <text class="t sm" x="340" y="122" text-anchor="middle" fill="#15803d">token 估算 38</text>
  <text class="t sm" x="340" y="136" text-anchor="middle" fill="#475569">首条 + 最近 4 条，丢中间</text>

  <rect class="new" x="456" y="64" width="214" height="76" rx="6"/>
  <text class="t sm" x="563" y="84" text-anchor="middle">摘要（Summarization）</text>
  <text class="t mono" x="470" y="104">旧历史 → 1 条摘要</text>
  <text class="t sm" x="563" y="122" text-anchor="middle" fill="#15803d">规模可控且保留语义</text>
  <text class="t sm" x="563" y="136" text-anchor="middle" fill="#475569">多花一次摘要模型调用</text>

  <rect class="box" x="24" y="152" width="646" height="52" rx="6"/>
  <text class="t tag" x="347" y="172" text-anchor="middle" fill="#92400e">裁剪实测链路：human, ai, human, ai, human, ai（首条 + 最近 4，恒定 6 条）</text>
  <text class="t sm" x="347" y="192" text-anchor="middle" fill="#475569">摘要实测链路：首条是「Here is a summary of the conversation to date:…」，后面保留最近消息</text>

  <text class="t sm" x="24" y="230">右：长期记忆跨会话（实测 session-1 教 / session-2 查 / session-3 换用户）</text>

  <rect class="lt" x="24" y="240" width="200" height="88" rx="6"/>
  <text class="t tag" x="124" y="260" text-anchor="middle">新增：store + context</text>
  <text class="t mono" x="36" y="280">store=InMemoryStore()</text>
  <text class="t mono" x="36" y="298">context_schema=UserContext</text>
  <text class="t sm" x="124" y="318" text-anchor="middle" fill="#475569">user_id 作为记忆归属</text>

  <line x1="224" y1="284" x2="268" y2="284" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#p)"/>

  <rect class="new" x="268" y="240" width="200" height="88" rx="6"/>
  <text class="t tag" x="368" y="260" text-anchor="middle">工具内读写长期记忆</text>
  <text class="t mono" x="280" y="280">runtime.store.put(('users',), uid, {...})</text>
  <text class="t mono" x="280" y="298">runtime.store.get(('users',), uid)</text>
  <text class="t sm" x="368" y="318" text-anchor="middle" fill="#475569">与 thread 无关，按 user_id 存</text>

  <line x1="468" y1="284" x2="512" y2="284" stroke="#d97706" stroke-width="1.5" marker-end="url(#o)"/>

  <rect class="ok" x="512" y="240" width="158" height="88" rx="6"/>
  <text class="t sm" x="591" y="260" text-anchor="middle" fill="#15803d">跨会话召回</text>
  <text class="t mono" x="524" y="280">session-1 教 → store: Tom</text>
  <text class="t mono" x="524" y="298">session-2 查 → 拿到 Tom</text>
  <text class="t sm" x="591" y="318" text-anchor="middle" fill="#475569">换 user_456 → 查不到 ✓</text>

  <text class="t lbl" x="24" y="360" font-weight="bold">两层各就各位</text>

  <rect class="box" x="24" y="374" width="310" height="52" rx="6"/>
  <text class="t sm" x="179" y="394" text-anchor="middle">短期：checkpointer + thread_id</text>
  <text class="t sm" x="179" y="412" text-anchor="middle" fill="#475569">管「这次聊到哪」，用裁剪/摘要控规模</text>

  <rect class="lt" x="350" y="374" width="322" height="52" rx="6"/>
  <text class="t sm" x="511" y="394" text-anchor="middle">长期：store + user_id</text>
  <text class="t sm" x="511" y="412" text-anchor="middle" fill="#475569">管「这个人是谁」，跨会话、按用户隔离</text>

  <text class="t sm" x="24" y="450">关键区分：短期记忆按「会话」切（换 thread 就断），长期记忆按「用户」切（换会话仍存活）。</text>
  <text class="t sm" x="24" y="468">写入模式：读旧档案 → 合并 → 写回（实测直接覆盖写会丢掉 city 等既有字段）。</text>

  <defs>
    <marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  </defs>
</svg>
