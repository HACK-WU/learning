<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="第2版设计：流式输出进度与逐字">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .new { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .str { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 10px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
    .tag { font-size: 11px; fill: #075985; font-weight: bold; }
  </style>
  <text class="t hd" x="20" y="26">第 2 版：stream 给进度与逐字（改进实现）</text>

  <rect class="box" x="24" y="50" width="110" height="44" rx="6"/>
  <text class="t sm" x="79" y="70" text-anchor="middle">用户提问</text>
  <text class="t sm" x="79" y="86" text-anchor="middle">（t=0s）</text>

  <line x1="134" y1="72" x2="180" y2="72" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="str" x="180" y="46" width="250" height="52" rx="6"/>
  <text class="t tag" x="305" y="66" text-anchor="middle">新增：stream(stream_mode=...)</text>
  <text class="t sm" x="305" y="86" text-anchor="middle">边跑边吐，不用等全跑完</text>

  <line x1="430" y1="72" x2="480" y2="72" stroke="#0284c7" stroke-width="1.5" marker-end="url(#b)"/>
  <rect class="box" x="480" y="50" width="190" height="44" rx="6"/>
  <text class="t sm" x="575" y="70" text-anchor="middle">逐个 chunk 抵达</text>
  <text class="t sm" x="575" y="86" text-anchor="middle">（t=0.3s 起）</text>

  <text class="t sm" x="24" y="126">两种模式分别解决两件事（实测同一任务）：</text>

  <rect class="new" x="24" y="136" width="320" height="88" rx="6"/>
  <text class="t tag" x="184" y="156" text-anchor="middle">updates：看「跑到哪一步」</text>
  <text class="t mono" x="38" y="176">for c in agent.stream(..., stream_mode='updates'):</text>
  <text class="t mono" x="58" y="192">    node = list(c['data'])[0]</text>
  <text class="t sm" x="184" y="212" text-anchor="middle" fill="#475569">实测 v2 下 chunk 结构 {'type':'updates','data':{...}}</text>
  <text class="t sm" x="184" y="222" text-anchor="middle" fill="#475569">节点序列 model → tools → model</text>

  <rect class="new" x="356" y="136" width="314" height="88" rx="6"/>
  <text class="t tag" x="513" y="156" text-anchor="middle">messages：看「正在说什么」</text>
  <text class="t mono" x="370" y="176">token, meta = chunk['data']</text>
  <text class="t mono" x="370" y="192">node = meta.get('langgraph_node')</text>
  <text class="t sm" x="513" y="212" text-anchor="middle" fill="#475569">逐 token 抵达，可做打字机效果</text>
  <text class="t sm" x="513" y="222" text-anchor="middle" fill="#475569">含大量空增量 chunk，需过滤</text>

  <text class="t sm" x="24" y="252">时间轴（用户视角）</text>
  <line x1="24" y1="266" x2="676" y2="266" stroke="#cbd5e1" stroke-width="2"/>
  <rect class="str" x="24" y="260" width="180" height="12" rx="3"/>
  <rect class="str" x="210" y="260" width="240" height="12" rx="3"/>
  <rect class="str" x="456" y="260" width="220" height="12" rx="3"/>
  <text class="t sm" x="114" y="288" text-anchor="middle" fill="#475569">模型思考</text>
  <text class="t sm" x="330" y="288" text-anchor="middle" fill="#475569">工具执行</text>
  <text class="t sm" x="566" y="288" text-anchor="middle" fill="#475569">逐字输出</text>
  <text class="t sm" x="350" y="306" text-anchor="middle" fill="#15803d">每个阶段都有反馈 → 用户看得到「在跑」</text>

  <text class="t lbl" x="24" y="336" font-weight="bold">它的问题</text>

  <rect class="box" x="24" y="350" width="320" height="52" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="184" y="370" text-anchor="middle" fill="#991b1b">① 工具内部进度不可见</text>
  <text class="t sm" x="184" y="388" text-anchor="middle" fill="#475569">只知道进了 tools 节点，不知道搜到第几条</text>

  <rect class="box" x="360" y="350" width="310" height="52" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="515" y="370" text-anchor="middle" fill="#991b1b">② 进度语义靠猜节点名</text>
  <text class="t sm" x="515" y="388" text-anchor="middle" fill="#475569">节点名是框架内部约定，不是业务语义</text>

  <text class="t sm" x="24" y="416">比上张多了什么：蓝色两块——stream 让结果从「一次性给」变成「持续吐」，首字延迟从 8s 降到 0.3s 量级。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0284c7"/></marker>
  </defs>
</svg>
