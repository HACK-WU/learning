<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" aria-label="第3版设计：按角色装配工具集">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .new { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .role { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 10px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
    .tag { font-size: 11px; fill: #6d28d9; font-weight: bold; }
  </style>
  <text class="t hd" x="20" y="26">第 3 版：按角色装配工具集（综合实现）</text>

  <rect class="role" x="24" y="48" width="140" height="56" rx="6"/>
  <text class="t tag" x="94" y="68" text-anchor="middle">新增：角色解析</text>
  <text class="t sm" x="94" y="86" text-anchor="middle">viewer / operator</text>
  <text class="t sm" x="94" y="98" text-anchor="middle">/ admin</text>

  <line x1="164" y1="76" x2="230" y2="76" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#p)"/>

  <rect class="new" x="230" y="48" width="180" height="56" rx="6"/>
  <text class="t tag" x="320" y="68" text-anchor="middle">新增：工具注册表</text>
  <text class="t sm" x="320" y="86" text-anchor="middle">角色 → 允许的工具名集合</text>
  <text class="t sm" x="320" y="98" text-anchor="middle">（单点维护，不再散落）</text>

  <line x1="410" y1="76" x2="470" y2="76" stroke="#d97706" stroke-width="1.5" marker-end="url(#o)"/>

  <rect class="box" x="470" y="48" width="200" height="56" rx="6"/>
  <text class="t sm" x="570" y="68" text-anchor="middle">create_agent(tools=子集)</text>
  <text class="t sm" x="570" y="86" text-anchor="middle">按角色建实例</text>

  <text class="t sm" x="24" y="140">装配结果（实测：从图节点可检出工具名，作为准入证据）</text>

  <rect class="ok" x="24" y="150" width="200" height="86" rx="6"/>
  <text class="t sm" x="124" y="170" text-anchor="middle" fill="#15803d">viewer（只读）</text>
  <text class="t mono" x="38" y="190">tools=[read_data]</text>
  <text class="t sm" x="124" y="208" text-anchor="middle" fill="#475569">图节点含 read_data ✓</text>
  <text class="t sm" x="124" y="226" text-anchor="middle" fill="#475569">含 delete_data ✗</text>

  <rect class="box" x="240" y="150" width="200" height="86" rx="6"/>
  <text class="t sm" x="340" y="170" text-anchor="middle">operator（读写）</text>
  <text class="t mono" x="254" y="190">tools=[read_data, write_data]</text>
  <text class="t sm" x="340" y="208" text-anchor="middle" fill="#475569">可写不可删</text>
  <text class="t sm" x="340" y="226" text-anchor="middle" fill="#475569">删除工具不在视野内</text>

  <rect class="bad" x="456" y="150" width="214" height="86" rx="6"/>
  <text class="t sm" x="563" y="170" text-anchor="middle" fill="#991b1b">admin（含高危）</text>
  <text class="t mono" x="470" y="190">tools=[read, write, delete_data]</text>
  <text class="t sm" x="563" y="208" text-anchor="middle" fill="#475569">图节点含 delete_data ✓</text>
  <text class="t sm" x="563" y="226" text-anchor="middle" fill="#475569">需配合人工确认（课 10）</text>

  <rect class="new" x="24" y="256" width="646" height="76" rx="6"/>
  <text class="t tag" x="347" y="276" text-anchor="middle">新增：准入自检（启动时断言，防止配错）</text>
  <text class="t mono" x="38" y="298">def assert_tools(agent, allowed):</text>
  <text class="t mono" x="58" y="316">    names = tool_names(agent)   # 从图节点检出</text>
  <text class="t sm" x="347" y="330" text-anchor="middle" fill="#475569">断言「高危工具只出现在被授权的角色里」→ 配错即启动失败</text>

  <text class="t lbl" x="24" y="362" font-weight="bold">三层各就各位</text>
  <text class="t sm" x="24" y="384">契约层：Pydantic schema + docstring，参数可校验、用途可理解（黄框）。</text>
  <text class="t sm" x="24" y="402">容错层：wrap_tool_call 把异常转译成模型可读的 ToolMessage，崩溃变自我修正（黄框）。</text>
  <text class="t sm" x="24" y="420">权限层：按角色装配工具子集 + 启动期准入自检，高危工具只对被授权角色可见（紫/黄框）。</text>

  <defs>
    <marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  </defs>
</svg>
