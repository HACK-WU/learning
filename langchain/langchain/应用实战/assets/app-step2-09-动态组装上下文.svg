<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="第2版设计：动态组装每次调用看到的上下文">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .new { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 10px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
    .tag { font-size: 11px; fill: #92400e; font-weight: bold; }
  </style>
  <text class="t hd" x="20" y="26">第 2 版：按状态与运行时动态组装（改进实现）</text>

  <rect class="box" x="24" y="48" width="150" height="56" rx="6"/>
  <text class="t sm" x="99" y="68" text-anchor="middle">状态（消息数）</text>
  <text class="t sm" x="99" y="86" text-anchor="middle">+ 运行时（角色）</text>
  <text class="t sm" x="99" y="98" text-anchor="middle" fill="#475569">两个输入源</text>

  <line x1="174" y1="76" x2="220" y2="76" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="new" x="220" y="48" width="230" height="56" rx="6"/>
  <text class="t tag" x="335" y="68" text-anchor="middle">新增：@dynamic_prompt / wrap_model_call</text>
  <text class="t mono" x="232" y="88">request.override(messages=..., tools=...)</text>
  <text class="t sm" x="335" y="100" text-anchor="middle" fill="#475569">只改这一次调用，不落状态</text>

  <line x1="450" y1="76" x2="496" y2="76" stroke="#d97706" stroke-width="1.5" marker-end="url(#o)"/>
  <rect class="ok" x="496" y="48" width="174" height="56" rx="6"/>
  <text class="t sm" x="583" y="68" text-anchor="middle" fill="#15803d">模型看到定制版上下文</text>
  <text class="t sm" x="583" y="86" text-anchor="middle" fill="#475569">长对话 → 更简洁的提示词</text>
  <text class="t sm" x="583" y="100" text-anchor="middle" fill="#475569">访客 → 只有只读工具</text>

  <text class="t sm" x="24" y="136">实测：动态提示词的两个维度</text>

  <rect class="box" x="24" y="146" width="320" height="94" rx="6"/>
  <text class="t tag" x="184" y="166" text-anchor="middle" fill="#475569">① 按状态（消息数 ≥ 5 → 简洁模式）</text>
  <text class="t mono" x="36" y="186">[探针] 消息 1 条 → system: 你是一个助手。</text>
  <text class="t mono" x="36" y="204">[探针] 消息 5 条 → system: 你是一个助手。</text>
  <text class="t mono" x="36" y="222">　　这是长对话，请格外简洁。</text>
  <text class="t sm" x="184" y="236" text-anchor="middle" fill="#15803d">同一份代码，随状态自动切换</text>

  <rect class="box" x="356" y="146" width="318" height="94" rx="6"/>
  <text class="t tag" x="515" y="166" text-anchor="middle" fill="#475569">② 按运行时上下文（admin vs viewer）</text>
  <text class="t mono" x="368" y="186">[admin]  …当前用户是管理员，拥有全部操作权限。</text>
  <text class="t mono" x="368" y="204">[viewer] …当前用户是只读访客，只能执行读取操作，</text>
  <text class="t mono" x="368" y="222">　　　　　不能修改数据。</text>
  <text class="t sm" x="515" y="236" text-anchor="middle" fill="#15803d">同一 agent，不同用户看到不同提示词</text>

  <text class="t sm" x="24" y="268">动态工具：按角色收窄模型可见的工具</text>

  <rect class="box" x="24" y="278" width="646" height="46" rx="6"/>
  <text class="t mono" x="38" y="298">role_tools(): viewer → 只保留 read_* 开头的工具（write_data / delete_data 从清单里消失）</text>
  <text class="t sm" x="347" y="316" text-anchor="middle" fill="#475569">模型看不到就调不到——这是权限约束最可靠的一层（不是靠提示词求它别调）</text>

  <text class="t lbl" x="24" y="352" font-weight="bold">它的问题</text>

  <rect class="box" x="24" y="366" width="320" height="46" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="184" y="386" text-anchor="middle" fill="#991b1b">① 注入的内容要不要留下来？</text>
  <text class="t sm" x="184" y="404" text-anchor="middle" fill="#475569">本轮注入 vs 永久保存，是两件不同的事</text>

  <rect class="box" x="356" y="366" width="318" height="46" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="515" y="386" text-anchor="middle" fill="#991b1b">② 超大工具结果怎么处理？</text>
  <text class="t sm" x="515" y="404" text-anchor="middle" fill="#475569">一份 1144 字的报告会反复占位</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  </defs>
</svg>
