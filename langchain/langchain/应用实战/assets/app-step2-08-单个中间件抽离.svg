<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" aria-label="第2版设计：单个中间件抽离横切能力">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .new { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 10px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
    .tag { font-size: 11px; fill: #92400e; font-weight: bold; }
  </style>
  <text class="t hd" x="20" y="26">第 2 版：单个中间件抽离横切能力（改进实现）</text>

  <rect class="box" x="24" y="48" width="180" height="60" rx="6"/>
  <text class="t sm" x="114" y="68" text-anchor="middle">业务代码</text>
  <text class="t sm" x="114" y="86" text-anchor="middle">只管「查天气」</text>
  <text class="t sm" x="114" y="100" text-anchor="middle" fill="#15803d">横切逻辑已抽走 ✓</text>

  <line x1="204" y1="78" x2="252" y2="78" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="new" x="252" y="48" width="230" height="60" rx="6"/>
  <text class="t tag" x="367" y="68" text-anchor="middle">新增：middleware=[...]</text>
  <text class="t mono" x="264" y="88">create_agent(model, tools,</text>
  <text class="t mono" x="264" y="102">    middleware=[ToolRetryMiddleware(...)])</text>

  <line x1="482" y1="78" x2="530" y2="78" stroke="#d97706" stroke-width="1.5" marker-end="url(#o)"/>
  <rect class="ok" x="530" y="48" width="140" height="60" rx="6"/>
  <text class="t sm" x="600" y="68" text-anchor="middle" fill="#15803d">所有调用点</text>
  <text class="t sm" x="600" y="86" text-anchor="middle" fill="#15803d">自动生效</text>
  <text class="t sm" x="600" y="100" text-anchor="middle" fill="#475569">一处配置，全局覆盖</text>

  <text class="t sm" x="24" y="136">内置中间件：开箱即用的六类（实测行为）</text>

  <rect class="box" x="24" y="146" width="320" height="86" rx="6"/>
  <text class="t tag" x="184" y="166" text-anchor="middle" fill="#475569">限额：ModelCallLimit / ToolCallLimit</text>
  <text class="t mono" x="36" y="186">run_limit=2, exit_behavior='end'</text>
  <text class="t sm" x="184" y="204" text-anchor="middle" fill="#475569">实测：消息数 6，末条 =</text>
  <text class="t sm" x="184" y="220" text-anchor="middle" fill="#475569">「Model call limits exceeded: run limit (2/2)」</text>
  <text class="t sm" x="184" y="232" text-anchor="middle" fill="#15803d">超限优雅收尾，不是抛异常崩掉</text>

  <rect class="box" x="356" y="146" width="318" height="86" rx="6"/>
  <text class="t tag" x="515" y="166" text-anchor="middle" fill="#475569">容错：ToolRetry / ModelFallback</text>
  <text class="t mono" x="368" y="186">ToolRetryMiddleware(max_retries=3)</text>
  <text class="t sm" x="515" y="204" text-anchor="middle" fill="#475569">实测：工具被执行 3 次（前 2 次抛错）</text>
  <text class="t sm" x="515" y="220" text-anchor="middle" fill="#475569">第 3 次成功后 agent 正常收尾</text>
  <text class="t sm" x="515" y="232" text-anchor="middle" fill="#15803d">业务代码里一个 try 都不用写</text>

  <rect class="box" x="24" y="244" width="320" height="86" rx="6"/>
  <text class="t tag" x="184" y="264" text-anchor="middle" fill="#475569">兜错：ToolErrorMiddleware</text>
  <text class="t mono" x="36" y="284">ToolErrorMiddleware(on_error)</text>
  <text class="t sm" x="184" y="302" text-anchor="middle" fill="#991b1b">对照组（无）：agent 中断 ValueError</text>
  <text class="t sm" x="184" y="318" text-anchor="middle" fill="#15803d">实验组（有）：转成 ToolMessage 交给模型</text>
  <text class="t sm" x="184" y="330" text-anchor="middle" fill="#475569">模型看到错误后自行调整输入</text>

  <rect class="new" x="356" y="244" width="318" height="86" rx="6"/>
  <text class="t tag" x="515" y="264" text-anchor="middle">自定义：装饰器 / 类式 + jump</text>
  <text class="t mono" x="368" y="284">@before_model(can_jump_to=['end'])</text>
  <text class="t sm" x="515" y="302" text-anchor="middle" fill="#475569">实测：正常输入 2 条消息</text>
  <text class="t sm" x="515" y="318" text-anchor="middle" fill="#15803d">命中守护 → 跳过模型，直接兜底回复</text>
  <text class="t sm" x="515" y="330" text-anchor="middle" fill="#475569">消息数仍 2，无模型输出</text>

  <text class="t lbl" x="24" y="356" font-weight="bold">它的问题</text>

  <rect class="box" x="24" y="370" width="320" height="46" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="184" y="390" text-anchor="middle" fill="#991b1b">① 多个中间件谁先谁后？</text>
  <text class="t sm" x="184" y="408" text-anchor="middle" fill="#475569">顺序不同行为不同，靠猜容易出错</text>

  <rect class="box" x="356" y="370" width="318" height="46" rx="6" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="t sm" x="515" y="390" text-anchor="middle" fill="#991b1b">② 想要的能力没有内置件怎么办？</text>
  <text class="t sm" x="515" y="408" text-anchor="middle" fill="#475569">需要自己写，但不知挂哪个钩子</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  </defs>
</svg>
