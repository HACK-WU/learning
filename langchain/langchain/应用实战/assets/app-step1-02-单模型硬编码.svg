<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-label="第1版设计：单模型硬编码">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .app { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .model { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
  </style>
  <text class="t hd" x="20" y="28">第 1 版：单模型硬编码（基础实现）</text>

  <rect class="box" x="40" y="60" width="180" height="54" rx="6"/>
  <text class="t lbl" x="130" y="82" text-anchor="middle">业务脚本</text>
  <text class="t sm" x="130" y="100" text-anchor="middle">app.py</text>

  <line x1="220" y1="87" x2="330" y2="87" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="t sm" x="275" y="78" text-anchor="middle">init_chat_model</text>

  <rect class="model" x="330" y="60" width="200" height="54" rx="6"/>
  <text class="t lbl" x="430" y="82" text-anchor="middle">主模型（唯一）</text>
  <text class="t sm" x="430" y="100" text-anchor="middle">qwen3.8-flash @ 百炼</text>

  <line x1="530" y1="87" x2="620" y2="87" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box" x="620" y="60" width="60" height="54" rx="6"/>
  <text class="t lbl" x="650" y="92" text-anchor="middle">结果</text>

  <line x1="430" y1="114" x2="430" y2="160" stroke="#dc2626" stroke-width="2" marker-end="url(#b)"/>
  <rect class="bad" x="300" y="160" width="260" height="46" rx="6"/>
  <text class="t lbl" x="430" y="180" text-anchor="middle" fill="#991b1b">主模型 502 / 超时 / 限流</text>
  <text class="t sm" x="430" y="198" text-anchor="middle" fill="#991b1b">异常直接抛给调用方</text>

  <text class="t lbl" x="40" y="248" font-weight="bold">它的问题</text>

  <rect class="bad" x="40" y="262" width="190" height="60" rx="6"/>
  <text class="t sm" x="135" y="284" text-anchor="middle" fill="#991b1b">① 单点：它挂了</text>
  <text class="t sm" x="135" y="302" text-anchor="middle" fill="#991b1b">整个功能就不可用</text>

  <rect class="bad" x="245" y="262" width="190" height="60" rx="6"/>
  <text class="t sm" x="340" y="284" text-anchor="middle" fill="#991b1b">② 配置散落各处</text>
  <text class="t sm" x="340" y="302" text-anchor="middle" fill="#991b1b">换模型要改每个文件</text>

  <rect class="bad" x="450" y="262" width="190" height="60" rx="6"/>
  <text class="t sm" x="545" y="284" text-anchor="middle" fill="#991b1b">③ 能力全靠运气</text>
  <text class="t sm" x="545" y="302" text-anchor="middle" fill="#991b1b">没先验过就上线</text>

  <text class="t sm" x="40" y="352">调用链只有一条，任何一环断裂 = 用户看到一个报错。</text>
  <text class="t sm" x="40" y="374">本版解决了什么：能用——参数、endpoint、profile 都摸清了。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
