<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" aria-label="第2版设计：切分与向量检索">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .new { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 10px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
    .tag { font-size: 11px; fill: #92400e; font-weight: bold; }
  </style>
  <text class="t hd" x="20" y="26">第 2 版：切分 + 向量库 + 检索（改进实现）</text>

  <text class="t sm" x="24" y="50">离线建索引 → 在线按语义相似度取回片段</text>

  <rect class="box" x="24" y="60" width="128" height="66" rx="6"/>
  <text class="t sm" x="88" y="82" text-anchor="middle">原始文档</text>
  <text class="t mono" x="32" y="102">kb/*.md（5 份）</text>
  <text class="t sm" x="88" y="120" text-anchor="middle" fill="#475569">整篇太长</text>

  <line x1="152" y1="93" x2="190" y2="93" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="new" x="190" y="60" width="190" height="66" rx="6"/>
  <text class="t tag" x="285" y="82" text-anchor="middle">新增：RecursiveCharacterTextSplitter</text>
  <text class="t mono" x="200" y="102">chunk_size=300, overlap=60</text>
  <text class="t sm" x="285" y="120" text-anchor="middle" fill="#475569">实测：5 份 → 15 块（127~290 字）</text>

  <line x1="380" y1="93" x2="418" y2="93" stroke="#d97706" stroke-width="1.5" marker-end="url(#o)"/>
  <rect class="new" x="418" y="60" width="140" height="66" rx="6"/>
  <text class="t tag" x="488" y="82" text-anchor="middle">Embeddings</text>
  <text class="t mono" x="428" y="102">OpenAIEmbeddings</text>
  <text class="t sm" x="488" y="120" text-anchor="middle" fill="#475569">实测维度 4096</text>

  <line x1="558" y1="93" x2="596" y2="93" stroke="#d97706" stroke-width="1.5" marker-end="url(#o)"/>
  <rect class="ok" x="596" y="60" width="74" height="66" rx="6"/>
  <text class="t sm" x="633" y="82" text-anchor="middle" fill="#15803d">向量库</text>
  <text class="t mono" x="606" y="102">InMemory</text>
  <text class="t sm" x="633" y="120" text-anchor="middle" fill="#475569">可检索</text>

  <text class="t sm" x="24" y="152">查询： similarity_search_with_score(q, k=3) 的实测结果</text>

  <rect class="box" x="24" y="162" width="646" height="106" rx="6"/>
  <text class="t mono" x="38" y="182">q = '星云科技员工每年有多少天年假？'</text>
  <rect class="ok" x="38" y="192" width="610" height="24" rx="3"/>
  <text class="t mono" x="46" y="208">score=0.7023  ★含答案  [01-考勤与休假制度.md]  # 星云科技 · 考勤与休假制度</text>
  <text class="t mono" x="46" y="224">score=0.5688           [04-产品与售后政策.md]  # 星云科技 · 产品与售后政策</text>
  <text class="t mono" x="46" y="240">score=0.5643           [01-考勤与休假制度.md]  ## 四、远程办公</text>
  <text class="t sm" x="341" y="258" text-anchor="middle" fill="#15803d">答案块排第 1（0.70 对 0.57，分差明显）→ 排序有效</text>
  <text class="t sm" x="341" y="272" text-anchor="middle" fill="#475569">但第 2、3 名是同名公司的其他文档——「星云科技」这个共同前缀拉高了它们的分</text>

  <text class="t sm" x="24" y="298">k 值对命中的影响（实测同一问题）</text>

  <rect class="box" x="24" y="308" width="646" height="46" rx="6"/>
  <text class="t mono" x="38" y="328">k=1: 命中=True (末位 0.7023)    k=2: 命中=True (0.5695)    k=3: 命中=True (0.5643)</text>
  <text class="t mono" x="38" y="346">k=4: 命中=True (0.5629)         k=5: 命中=True (0.5414)</text>
  <text class="t sm" x="347" y="358" text-anchor="middle" fill="#475569">本例 k=1 就够（答案块稳居第一）；k 调大只是多带噪音，不是越多越好</text>

  <text class="t lbl" x="24" y="382" font-weight="bold">它的问题</text>

  <rect class="bad" x="24" y="392" width="320" height="34" rx="6"/>
  <text class="t sm" x="184" y="412" text-anchor="middle" fill="#991b1b">① 检索回的片段怎么变成答案？</text>

  <rect class="bad" x="356" y="392" width="314" height="34" rx="6"/>
  <text class="t sm" x="513" y="412" text-anchor="middle" fill="#991b1b">② 答案该不该带出处？（无出处 = 用户无从核实）</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  </defs>
</svg>
