<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-label="第1版设计：全量历史与全量资料直塞">
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .lbl { font-size: 13px; fill: #0f172a; }
    .sm { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas, monospace; font-size: 11px; fill: #475569; }
    .hd { font-size: 15px; font-weight: bold; fill: #0f172a; }
  </style>
  <text class="t hd" x="20" y="26">第 1 版：全量历史与全量资料直塞（基础实现）</text>

  <text class="t sm" x="24" y="54">一次模型调用，上下文窗口被这些内容占满</text>

  <rect class="box" x="24" y="64" width="646" height="112" rx="6"/>
  <rect class="bad" x="36" y="76" width="150" height="26" rx="3"/>
  <text class="t sm" x="111" y="93" text-anchor="middle" fill="#991b1b">system prompt</text>
  <text class="t sm" x="111" y="112" text-anchor="middle" fill="#475569">一次性塞入全部参考资料</text>

  <rect class="bad" x="196" y="76" width="180" height="26" rx="3"/>
  <text class="t sm" x="286" y="93" text-anchor="middle" fill="#991b1b">全部历史消息</text>
  <text class="t sm" x="286" y="112" text-anchor="middle" fill="#475569">从第 1 轮到现在，一条不删</text>

  <rect class="bad" x="386" y="76" width="130" height="26" rx="3"/>
  <text class="t sm" x="451" y="93" text-anchor="middle" fill="#991b1b">工具结果全文</text>
  <text class="t sm" x="451" y="112" text-anchor="middle" fill="#475569">1144 字的报告原样进</text>

  <rect class="bad" x="526" y="76" width="132" height="26" rx="3"/>
  <text class="t sm" x="592" y="93" text-anchor="middle" fill="#991b1b">全部工具定义</text>
  <text class="t sm" x="592" y="112" text-anchor="middle" fill="#475569">无关工具也在清单里</text>

  <text class="t sm" x="350" y="146" text-anchor="middle" fill="#991b1b">↑ 每一轮调用都要把这一整包重新发给模型</text>

  <text class="t sm" x="24" y="176">成本对照（同一问题「1+1 等于几」的实测）</text>

  <rect class="box" x="24" y="186" width="310" height="76" rx="6"/>
  <text class="t sm" x="179" y="206" text-anchor="middle">短提示词（10 字）</text>
  <text class="t mono" x="38" y="226">input_tokens = 70</text>
  <text class="t mono" x="38" y="244">total_tokens = 98</text>
  <text class="t sm" x="179" y="258" text-anchor="middle" fill="#475569">基线</text>

  <rect class="bad" x="350" y="186" width="320" height="76" rx="6"/>
  <text class="t sm" x="510" y="206" text-anchor="middle">长提示词（参考资料重复 30 遍，1746 字）</text>
  <text class="t mono" x="364" y="226">input_tokens = 1034</text>
  <text class="t mono" x="364" y="244">total_tokens = 1064</text>
  <text class="t sm" x="510" y="258" text-anchor="middle" fill="#991b1b">差额：每次调用多付 964 tokens</text>

  <text class="t lbl" x="24" y="292" font-weight="bold">它的问题</text>

  <rect class="bad" x="24" y="306" width="200" height="60" rx="6"/>
  <text class="t sm" x="124" y="326" text-anchor="middle" fill="#991b1b">① 每次调用重复付费</text>
  <text class="t sm" x="124" y="346" text-anchor="middle" fill="#475569">同一份资料每一轮</text>
  <text class="t sm" x="124" y="360" text-anchor="middle" fill="#475569">都要重新算一遍 token</text>

  <rect class="bad" x="242" y="306" width="200" height="60" rx="6"/>
  <text class="t sm" x="342" y="326" text-anchor="middle" fill="#991b1b">② 长对话迟早爆窗口</text>
  <text class="t sm" x="342" y="346" text-anchor="middle" fill="#475569">历史只增不减</text>
  <text class="t sm" x="342" y="360" text-anchor="middle" fill="#475569">到某个轮次直接报错</text>

  <rect class="bad" x="458" y="306" width="212" height="60" rx="6"/>
  <text class="t sm" x="564" y="326" text-anchor="middle" fill="#991b1b">③ 噪音拖累质量</text>
  <text class="t sm" x="564" y="346" text-anchor="middle" fill="#475569">无关工具与旧资料占位</text>
  <text class="t sm" x="564" y="360" text-anchor="middle" fill="#475569">模型注意力被稀释</text>

  <text class="t sm" x="24" y="388">本版解决了什么：实现最简单——有什么塞什么，不用管上下文，功能是对的。</text>

  <defs></defs>
</svg>
