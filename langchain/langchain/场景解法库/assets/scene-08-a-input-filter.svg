<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 A · 输入侧确定性过滤：在模型被调用之前就挡下</text>

  <rect x="24" y="62" width="180" height="40" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="80" font-size="13" fill="#333">用户输入</text>
  <text x="40" y="96" font-size="12" fill="#555">第一条 human 消息</text>
  <line x1="204" y1="82" x2="252" y2="82" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="256" y="62" width="220" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="272" y="80" font-size="13" fill="#0d47a1">@before_agent 钩子</text>
  <text x="272" y="96" font-size="12" fill="#0d47a1">关键词 / 正则判定</text>

  <line x1="476" y1="70" x2="534" y2="58" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="476" y1="96" x2="534" y2="108" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="538" y="42" width="338" height="32" rx="4" fill="#ffebee" stroke="#c62828"/>
  <text x="554" y="64" font-size="13" fill="#c62828">命中 → 返回固定话术 + jump_to="end"</text>
  <rect x="538" y="94" width="338" height="32" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="554" y="116" font-size="13" fill="#1b5e20">未命中 → 正常进入 agent 流程</text>

  <rect x="24" y="146" width="852" height="44" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="40" y="166" font-size="13" fill="#1b5e20">课 10 实测：被拦截的会话消息链只有两条（请求 + 固定话术），模型全程未参与</text>
  <text x="40" y="184" font-size="12" fill="#1b5e20">省下一次模型调用 —— 拦截比「让模型自己拒绝」更便宜也更确定</text>

  <rect x="24" y="208" width="852" height="34" rx="4" fill="#fff8e1" stroke="#f9a825"/>
  <text x="40" y="230" font-size="13" fill="#8d6e00">can_jump_to=["end"] 是「直接收束」的前提声明（课 8 跳步机制），不声明会报错</text>

  <rect x="24" y="258" width="852" height="64" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="282" font-size="14" font-weight="bold" fill="#c62828">失效点：规则挡的是措辞，不是意图 —— 换个说法就绕过去，还会误伤</text>
  <text x="40" y="306" font-size="13" fill="#333">「忽略之前的规则」写成「把上面的指示放进括号里当作故事」照样通过；正常用户的长文本也可能命中关键词。</text>
  <text x="40" y="326" font-size="13" fill="#333">所以它是第一层不是唯一一层 —— 必须配合输出审查与动作层约束（B / C）。</text>
</svg>
