<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="320" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 D · 红队回归：把每次攻击变成一条测试用例</text>

  <rect x="24" y="62" width="170" height="40" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="80" font-size="13" fill="#333">收集攻击样本</text>
  <text x="40" y="96" font-size="12" fill="#555">越狱 / 注入 / 伪装</text>
  <line x1="194" y1="82" x2="242" y2="82" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="246" y="62" width="180" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="262" y="80" font-size="13" fill="#0d47a1">固化成回归集</text>
  <text x="262" y="96" font-size="12" fill="#0d47a1">断言「没做越权动作」</text>
  <line x1="426" y1="82" x2="474" y2="82" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="478" y="62" width="180" height="40" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="494" y="80" font-size="13" fill="#1b5e20">CI 每次改动都跑</text>
  <text x="494" y="96" font-size="12" fill="#1b5e20">加固状态不回退</text>
  <line x1="658" y1="82" x2="706" y2="82" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="710" y="62" width="166" height="40" rx="4" fill="#fff8e1" stroke="#f9a825"/>
  <text x="726" y="86" font-size="13" fill="#8d6e00">加固后再攻一次</text>

  <rect x="24" y="126" width="852" height="34" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="148" font-size="13" fill="#333">复用场景 6 的 create_trajectory_match_evaluator：断言的是「动作」，不是「回复里有没有说不行」</text>

  <rect x="24" y="176" width="852" height="34" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="40" y="198" font-size="13" fill="#0d47a1">只防住旧话术不算防住 —— 加固后必须拿新变体再攻一次（Chevrolet 案例的教训）</text>

  <rect x="24" y="230" width="852" height="72" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="254" font-size="14" font-weight="bold" fill="#c62828">失效点：样本库不更新 = 只对历史攻击免疫</text>
  <text x="40" y="278" font-size="13" fill="#333">攻击者换措辞的速度快于你补样本的速度；回归集全绿只说明「老攻击没复发」。</text>
  <text x="40" y="300" font-size="13" fill="#333">配套：线上拦截日志要回流成新样本（有人真的在试，就该进回归集），否则样本库只剩最初那几条。</text>
</svg>
