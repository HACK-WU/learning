<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 A · 全量历史（基线）：每一轮都把全部历史重发给模型</text>

  <text x="24" y="72" font-size="13" fill="#555">对话推进</text>
  <rect x="110" y="58" width="120" height="30" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="126" y="78" font-size="13" fill="#333">第 3 轮</text>
  <rect x="330" y="58" width="120" height="30" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="346" y="78" font-size="13" fill="#333">第 10 轮</text>
  <rect x="550" y="58" width="120" height="30" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="566" y="78" font-size="13" fill="#333">第 30 轮</text>
  <line x1="230" y1="73" x2="326" y2="73" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="450" y1="73" x2="546" y2="73" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="24" y="132" font-size="13" fill="#555">每次请求携带</text>
  <rect x="110" y="112" width="60" height="30" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="122" y="132" font-size="13" fill="#0d47a1">6 条</text>
  <rect x="330" y="112" width="200" height="30" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="342" y="132" font-size="13" fill="#0d47a1">20 条（全量）</text>
  <rect x="550" y="112" width="230" height="30" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="562" y="132" font-size="13" fill="#0d47a1">60 条（全量）</text>

  <rect x="24" y="176" width="852" height="36" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="200" font-size="13" fill="#333">模型调用：prompt = 系统提示 + 全部历史 + 本轮问题（历史只增不减）</text>
  <line x1="450" y1="158" x2="450" y2="174" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="24" y="248" font-size="13" fill="#555">单次请求成本</text>
  <rect x="110" y="230" width="40" height="26" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <rect x="330" y="230" width="140" height="26" rx="3" fill="#fff8e1" stroke="#f9a825"/>
  <rect x="550" y="230" width="300" height="26" rx="3" fill="#ffebee" stroke="#c62828"/>
  <text x="152" y="248" font-size="12" fill="#555">低</text>
  <text x="474" y="248" font-size="12" fill="#555">中</text>
  <text x="854" y="248" font-size="12" fill="#c62828">高（近 10 倍）</text>

  <rect x="24" y="286" width="852" height="62" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="310" font-size="14" font-weight="bold" fill="#c62828">失效点：没有任何封顶机制</text>
  <text x="40" y="334" font-size="13" fill="#333">历史只增不减 → 第 30 轮时把前 29 轮的寒暄、重复追问、已解决的问题全部重发一遍。</text>
</svg>
