<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 B · 动态工具过滤：按角色收窄工具集（确定性事实，不是劝）</text>

  <text x="24" y="72" font-size="13" fill="#555">注册的工具（30 个）</text>
  <rect x="150" y="56" width="700" height="30" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="166" y="76" font-size="12" fill="#333">read_order · read_price · create_refund · delete_user · send_coupon · update_invoice · …（30）</text>

  <line x1="500" y1="86" x2="500" y2="108" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="330" y="110" width="340" height="34" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="346" y="132" font-size="13" fill="#0d47a1">@wrap_model_call：role=="viewer" → 只留 read_*</text>

  <line x1="500" y1="144" x2="430" y2="164" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="500" y1="144" x2="600" y2="164" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="130" y="168" width="300" height="42" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="146" y="188" font-size="13" fill="#1b5e20">viewer 看到的：read_*（3 个）</text>
  <text x="146" y="204" font-size="12" fill="#1b5e20">课 9 实测：「请删除所有数据」→ 直接拒绝</text>
  <rect x="470" y="168" width="300" height="42" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="486" y="188" font-size="13" fill="#333">admin 看到的：全部 30 个</text>
  <text x="486" y="204" font-size="12" fill="#555">过滤发生在模型调用之前</text>

  <rect x="24" y="230" width="852" height="34" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="40" y="252" font-size="13" fill="#0d47a1">与 LLMToolSelectorMiddleware 的区别：那是「智能挑选」（精度优化），这个是「权限控制」（确定性隔离）</text>

  <rect x="24" y="278" width="852" height="64" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="302" font-size="14" font-weight="bold" fill="#c62828">失效点：场景维度一多，映射维护量爆炸；它只缩小候选集</text>
  <text x="40" y="326" font-size="13" fill="#333">按「角色」过滤只是一条维度；再叠加业务线 / 地域 / 版本，映射就从一张表变成要专门维护的服务。</text>
  <text x="40" y="344" font-size="13" fill="#333">它只减少候选数量，不解决「候选内部的相似工具怎么选」——那是命名与描述（解法 A）的活。</text>
</svg>
