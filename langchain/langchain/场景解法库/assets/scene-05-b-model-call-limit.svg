<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 B · 模型调用限额：优雅收尾还是直接报错，由 exit_behavior 决定</text>

  <rect x="24" y="62" width="180" height="40" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="80" font-size="13" fill="#333">ModelCallLimit</text>
  <text x="40" y="96" font-size="12" fill="#555">run_limit = 2</text>
  <line x1="204" y1="82" x2="252" y2="82" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="256" y="62" width="180" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="272" y="80" font-size="13" fill="#0d47a1">第 1 / 2 次调用</text>
  <text x="272" y="96" font-size="12" fill="#0d47a1">正常执行</text>
  <line x1="436" y1="82" x2="484" y2="82" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="488" y="62" width="180" height="40" rx="4" fill="#fff8e1" stroke="#f9a825"/>
  <text x="504" y="80" font-size="13" fill="#8d6e00">第 3 次请求</text>
  <text x="504" y="96" font-size="12" fill="#8d6e00">已到 2/2 上限</text>

  <line x1="668" y1="70" x2="726" y2="56" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="668" y1="94" x2="726" y2="108" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="730" y="40" width="146" height="34" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="744" y="62" font-size="13" fill="#1b5e20">"end"：优雅收尾</text>
  <rect x="730" y="92" width="146" height="34" rx="4" fill="#ffebee" stroke="#c62828"/>
  <text x="744" y="114" font-size="13" fill="#c62828">"error"：抛异常</text>

  <rect x="24" y="126" width="852" height="44" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="40" y="146" font-size="13" fill="#1b5e20">课 8 实测（"end"）：最后一条 AI 消息是限额说明</text>
  <text x="40" y="164" font-size="12" fill="#1b5e20">「Model call limits exceeded: run limit (2/2)」—— 用户看到的是一句话，不是崩溃</text>

  <rect x="24" y="190" width="852" height="34" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="40" y="212" font-size="13" fill="#0d47a1">thread_limit（跨会话计数）需要 checkpointer 配合，否则计数无从持久化</text>

  <rect x="24" y="242" width="852" height="80" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="266" font-size="14" font-weight="bold" fill="#c62828">失效点：限额是「静默降级」—— 不监控就等于业务悄悄变差</text>
  <text x="40" y="290" font-size="13" fill="#333">被拦的请求看起来「正常返回」了，只是没办成事；必须监控「被拦次数 / 被拦率」。</text>
  <text x="40" y="312" font-size="13" fill="#333">阈值按业务调：太小误伤正常任务，太大等于没设（先测算正常调用分布再定）。</text>
</svg>
