<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 D · 超时 / 重试 / 降级三条防线，各管一种「卡住」</text>

  <text x="24" y="76" font-size="13" fill="#555">① 模型侧超时与重试</text>
  <rect x="200" y="58" width="676" height="34" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="216" y="80" font-size="13" fill="#333">init_chat_model(..., timeout=30, max_retries=2) —— 网络抖动自己扛，业务无感</text>

  <text x="24" y="132" font-size="13" fill="#555">② 工具侧重试</text>
  <rect x="200" y="114" width="676" height="52" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="216" y="134" font-size="13" fill="#333">ToolRetryMiddleware(max_retries=3, backoff_factor, jitter, on_failure="continue")</text>
  <text x="216" y="154" font-size="12" fill="#555">课 8 实测：「前两次必故障」的工具实际执行 3 次（2 败 1 成），模型只看到最终成功结果</text>

  <text x="24" y="200" font-size="13" fill="#555">③ 模型侧降级</text>
  <rect x="200" y="182" width="250" height="34" rx="4" fill="#ffebee" stroke="#c62828"/>
  <text x="216" y="204" font-size="13" fill="#c62828">主模型服务端报错</text>
  <line x1="450" y1="199" x2="508" y2="199" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="512" y="182" width="364" height="34" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="528" y="204" font-size="13" fill="#1b5e20">ModelFallbackMiddleware 自动切备用模型</text>

  <rect x="24" y="240" width="852" height="34" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="40" y="262" font-size="13" fill="#0d47a1">on_failure 两种："continue" 耗尽后返回错误消息（模型接着想办法）；"error" 重新抛出（交上层）</text>

  <rect x="24" y="292" width="852" height="72" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="316" font-size="14" font-weight="bold" fill="#c62828">失效点：重试放大成本，降级改变行为，两者都可能掩盖真问题</text>
  <text x="40" y="340" font-size="13" fill="#333">3 次重试 = 最多 3 倍费用；叠加模型限额时，重试会先把预算烧光再被拦。</text>
  <text x="40" y="360" font-size="13" fill="#333">降级后输出质量/格式可能不同 —— 备用模型要过同一套回归（见场景 6），否则「没崩」但「答错了」。</text>
</svg>
