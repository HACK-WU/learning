<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 C · 摘要压缩：超阈值把早期历史压成一条摘要</text>

  <rect x="24" y="58" width="180" height="34" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="80" font-size="13" fill="#333">消息数达到 6（trigger）</text>
  <line x1="204" y1="75" x2="252" y2="75" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="256" y="58" width="220" height="34" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="272" y="80" font-size="13" fill="#0d47a1">额外跑一次模型生成摘要</text>
  <line x1="476" y1="75" x2="524" y2="75" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="528" y="58" width="348" height="34" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="544" y="80" font-size="13" fill="#333">替换早期消息，保留最近 4 条（keep）</text>

  <text x="24" y="136" font-size="13" fill="#555">压缩后</text>
  <rect x="110" y="120" width="300" height="44" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="126" y="140" font-size="13" fill="#1b5e20">摘要 1 条（含订单号 / 承诺 / 金额）</text>
  <text x="126" y="158" font-size="12" fill="#1b5e20">原文被丢弃，只留语义</text>
  <rect x="430" y="120" width="230" height="44" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="446" y="140" font-size="13" fill="#0d47a1">最近 4 条原文</text>
  <text x="446" y="158" font-size="12" fill="#0d47a1">保持细节，供本轮推理</text>

  <text x="24" y="204" font-size="13" fill="#555">回本曲线</text>
  <line x1="110" y1="256" x2="860" y2="256" stroke="#333" stroke-width="1.4"/>
  <line x1="110" y1="256" x2="110" y2="200" stroke="#333" stroke-width="1.4"/>
  <text x="112" y="272" font-size="12" fill="#555">对话长度 →</text>
  <polyline points="110,250 400,244 620,214 860,186" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
  <text x="866" y="190" font-size="12" fill="#2e7d32">省下的 token</text>
  <polyline points="110,254 300,240 400,232 860,216" fill="none" stroke="#c62828" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="300" y="230" font-size="12" fill="#c62828">摘要本身的固定开销</text>
  <circle cx="470" cy="224" r="5" fill="#c62828"/>
  <text x="478" y="220" font-size="12" fill="#c62828">回本点（之后才划算）</text>

  <rect x="24" y="296" width="852" height="62" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="320" font-size="14" font-weight="bold" fill="#c62828">失效点：小对话用摘要反而更贵，且摘要会丢原文</text>
  <text x="40" y="344" font-size="13" fill="#333">课 7 实测：同一段小对话，摘要 303 token vs 全量 135 token。触发阈值别设太小；需审计留痕的场景要「冷存原文 + 热用摘要」。</text>
</svg>
