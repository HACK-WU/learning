<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 A · 显式步数预算：把默认 9999 调到「正常值的 2~3 倍」</text>

  <rect x="24" y="62" width="150" height="40" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="80" font-size="13" fill="#333">agent.invoke</text>
  <text x="40" y="96" font-size="12" fill="#555">config 传入上限</text>
  <line x1="174" y1="82" x2="222" y2="82" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="226" y="62" width="170" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="242" y="80" font-size="13" fill="#0d47a1">框架逐步计数</text>
  <text x="242" y="96" font-size="12" fill="#0d47a1">每进一个节点 +1</text>

  <line x1="396" y1="74" x2="454" y2="60" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="396" y1="94" x2="454" y2="108" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="458" y="44" width="200" height="34" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="474" y="66" font-size="13" fill="#1b5e20">步数 ≤ 50 → 正常跑完</text>
  <rect x="458" y="92" width="200" height="34" rx="4" fill="#ffebee" stroke="#c62828"/>
  <text x="474" y="114" font-size="13" fill="#c62828">超限 → GraphRecursionError</text>

  <rect x="682" y="44" width="194" height="34" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="698" y="66" font-size="13" fill="#333">返回结果</text>
  <rect x="682" y="92" width="194" height="34" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="698" y="114" font-size="13" fill="#333">异常冒泡到调用方</text>

  <rect x="24" y="146" width="852" height="34" rx="4" fill="#fff8e1" stroke="#f9a825"/>
  <text x="40" y="168" font-size="13" fill="#8d6e00">课 5 实测：默认值是 9999（源码里写死）—— 它是防死循环的最后兜底，不是预算管理</text>

  <rect x="24" y="200" width="852" height="34" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="222" font-size="13" fill="#333">定阈值的方法：先测算正常任务的步数分布 → 上限 = 正常值 × 2~3（不是拍一个数）</text>

  <rect x="24" y="250" width="852" height="72" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="274" font-size="14" font-weight="bold" fill="#c62828">失效点：报错不「业务化」，且阈值太小学会误伤长任务</text>
  <text x="40" y="298" font-size="13" fill="#333">GraphRecursionError 直接抛给用户 = 一句看不懂的框架异常，上层必须接住并转成「任务未完成」的诚实回复。</text>
  <text x="40" y="318" font-size="13" fill="#333">批处理类任务步数天然多 —— 上限必须按任务类型分别设，不能全站一个值。</text>
</svg>
