<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 A · 命名与描述：模型选工具，靠的就是这几行字</text>

  <text x="24" y="76" font-size="13" fill="#c62828">❌ 无信息命名</text>
  <rect x="24" y="88" width="360" height="62" rx="4" fill="#ffebee" stroke="#c62828"/>
  <text x="40" y="110" font-size="13" fill="#c62828">@tool def helper1(x): ...</text>
  <text x="40" y="130" font-size="12" fill="#333">模型只看到「helper1」—— 与其他 29 个工具无法区分</text>
  <line x1="384" y1="119" x2="432" y2="119" stroke="#c62828" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="436" y="98" width="230" height="42" rx="4" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="452" y="118" font-size="13" fill="#616161">选择靠猜</text>
  <text x="452" y="134" font-size="12" fill="#616161">同一问题每次选的不一样</text>

  <text x="24" y="188" font-size="13" fill="#2e7d32">✅ 写成「模型能懂的文档」</text>
  <rect x="24" y="200" width="360" height="72" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="40" y="222" font-size="13" fill="#1b5e20">@tool("query_order", description=</text>
  <text x="40" y="240" font-size="13" fill="#1b5e20">  "查询订单状态与物流。输入订单号；</text>
  <text x="40" y="258" font-size="13" fill="#1b5e20">   用户问'包裹到哪了'时使用。")</text>
  <line x1="384" y1="236" x2="432" y2="236" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="436" y="216" width="230" height="42" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="452" y="236" font-size="13" fill="#1b5e20">名称 = 动词 + 对象</text>
  <text x="452" y="252" font-size="12" fill="#1b5e20">描述里给触发场景</text>

  <rect x="24" y="296" width="852" height="48" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="318" font-size="14" font-weight="bold" fill="#c62828">失效点：30 个工具全量改造，且描述一改会「隔山打牛」</text>
  <text x="40" y="338" font-size="13" fill="#333">改一个工具的 docstring 可能影响另一个场景的选择 —— 描述是共享信号，改动要有回归测试兜着（见场景 6）。</text>
</svg>
