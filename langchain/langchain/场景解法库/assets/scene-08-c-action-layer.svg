<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 C · 动作层约束：信息与动作，四个点位都要管</text>

  <text x="24" y="72" font-size="13" fill="#555">信息侧 · PII 三个点位</text>
  <rect x="200" y="54" width="180" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="216" y="74" font-size="13" fill="#0d47a1">① 输入</text>
  <text x="216" y="90" font-size="12" fill="#0d47a1">进模型之前</text>
  <rect x="396" y="54" width="180" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="412" y="74" font-size="13" fill="#0d47a1">② 工具结果</text>
  <text x="412" y="90" font-size="12" fill="#0d47a1">回模型之前</text>
  <rect x="592" y="54" width="180" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="608" y="74" font-size="13" fill="#0d47a1">③ 输出</text>
  <text x="608" y="90" font-size="12" fill="#0d47a1">给用户之前</text>

  <rect x="200" y="106" width="572" height="36" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="216" y="130" font-size="13" fill="#333">四种策略：redact（整体替换）/ mask（部分遮挡）/ hash（可比对不可逆）/ block（直接拒）</text>

  <text x="24" y="186" font-size="13" fill="#555">动作侧 · 工具是唯一能造成真实后果的地方</text>
  <rect x="200" y="168" width="572" height="62" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="216" y="190" font-size="13" fill="#1b5e20">@wrap_tool_call：内部异常 → 转成 ToolMessage「请检查输入后重试」（不崩、不漏内部细节）</text>
  <text x="216" y="210" font-size="13" fill="#1b5e20">配合：权限分级（场景 7 解法 C）+ 参数校验 + 高风险动作 HITL（场景 2）</text>
  <text x="216" y="226" font-size="12" fill="#1b5e20">护栏目标 = 越权动作出不去，不是「什么都不敢说」</text>

  <rect x="24" y="252" width="852" height="34" rx="4" fill="#fff8e1" stroke="#f9a825"/>
  <text x="40" y="274" font-size="13" fill="#8d6e00">内建 PII 只有五类（email / credit_card / ip / mac_address / url），业务类型要自定义 detector 补（课 10 实测 EMP-\d{5} 掩码生效）</text>

  <rect x="24" y="302" width="852" height="62" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="326" font-size="14" font-weight="bold" fill="#c62828">失效点：detector 漏配即裸奔，block 策略会误伤正常内容</text>
  <text x="40" y="350" font-size="13" fill="#333">业务敏感格式（工号 / 内部单号）不在内建五类里，不补就是明文进模型；api_key 用 block 时，含相似字符串的技术讨论会被整条拒掉。</text>
</svg>
