<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 D · 角色审计：给合规一个能翻的台账</text>

  <rect x="24" y="62" width="150" height="40" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="80" font-size="13" fill="#333">before_agent</text>
  <text x="40" y="96" font-size="12" fill="#555">记录请求进入</text>
  <line x1="174" y1="82" x2="222" y2="82" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="226" y="62" width="150" height="40" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="242" y="80" font-size="13" fill="#333">工具包装层</text>
  <text x="242" y="96" font-size="12" fill="#555">记录执行动作</text>
  <line x1="376" y1="82" x2="424" y2="82" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="428" y="62" width="150" height="40" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="444" y="80" font-size="13" fill="#333">after_agent</text>
  <text x="444" y="96" font-size="12" fill="#555">记录最终输出</text>
  <line x1="578" y1="82" x2="626" y2="82" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="630" y="62" width="246" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="646" y="86" font-size="13" fill="#0d47a1">审计台账（可查询 / 可导出）</text>

  <rect x="24" y="126" width="852" height="76" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="148" font-size="13" fill="#333">每条记录四要素：谁（角色 / 账号）· 何时 · 请求了什么 · 执行了什么</text>
  <text x="40" y="170" font-size="13" fill="#333">课 10 的 before / after 护栏钩子可直接复用 —— 不用从零搭</text>
  <text x="40" y="192" font-size="12" fill="#555">用途：事后复盘、合规举证、异常行为发现（如某角色频繁触发越权）</text>

  <rect x="24" y="222" width="852" height="34" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="40" y="244" font-size="13" fill="#1b5e20">价值不在「防住」，在「说得清」—— 出了事能回答「谁在什么时候做了什么」</text>

  <rect x="24" y="268" width="852" height="60" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="292" font-size="14" font-weight="bold" fill="#c62828">失效点：审计是事后记录，且日志本身可能成为新的泄漏源</text>
  <text x="40" y="316" font-size="13" fill="#333">审计拦不住任何动作（要拦得靠解法 C）；台账里若原样写入用户输入与工具返回，PII 就进了日志系统（见场景 8）。</text>
</svg>
