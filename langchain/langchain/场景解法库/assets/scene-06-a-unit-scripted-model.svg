<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 A（单元层）· 剧本模型：把「代码逻辑」和「模型智商」分开测</text>

  <rect x="24" y="62" width="220" height="52" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="82" font-size="13" fill="#333">agent（被测对象）</text>
  <text x="40" y="102" font-size="12" fill="#555">编排 / 工具绑定 / 中间件</text>
  <line x1="244" y1="88" x2="292" y2="88" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="296" y="62" width="240" height="52" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="312" y="82" font-size="13" fill="#0d47a1">剧本模型（测试替身）</text>
  <text x="312" y="102" font-size="12" fill="#0d47a1">预设的 messages / tool_calls</text>
  <line x1="536" y1="88" x2="584" y2="88" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="588" y="62" width="288" height="52" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="604" y="82" font-size="13" fill="#1b5e20">确定性断言：走了哪条路、调了哪个工具</text>
  <text x="604" y="102" font-size="12" fill="#1b5e20">本项目实测：5 项 0.40 秒</text>

  <rect x="24" y="136" width="852" height="44" rx="4" fill="#fff8e1" stroke="#f9a825"/>
  <text x="40" y="156" font-size="13" fill="#8d6e00">课 13 实测的文档盲区：内置 fake 模型的 bind_tools 全部未实现 —— 挂工具直接抛 NotImplementedError</text>
  <text x="40" y="174" font-size="12" fill="#8d6e00">补 3 行子类（bind_tools 返回 self）即可让「工具调用链」进入秒级单测</text>

  <rect x="24" y="200" width="852" height="34" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="222" font-size="13" fill="#333">配 pytest marker：默认跑快的（剧本模型），集成测试显式 -m integration 才跑</text>

  <rect x="24" y="252" width="852" height="72" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="276" font-size="14" font-weight="bold" fill="#c62828">失效点：剧本模型测不出「模型真的会不会这么干」</text>
  <text x="40" y="300" font-size="13" fill="#333">它验证的是「给定这个回复，代码是否走对分支」—— 模型行为漂移（换模型 / 改提示词）它一条都抓不到。</text>
  <text x="40" y="320" font-size="13" fill="#333">所以必须配集成测试 + Evals（解法 B），单测全绿 ≠ 系统正常。</text>
</svg>
