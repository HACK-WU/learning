<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 B · 消息裁剪：首条 + 最近 4 条，中间一刀切掉</text>

  <text x="24" y="76" font-size="13" fill="#555">裁剪前（10 条全量）</text>
  <rect x="150" y="60" width="70" height="30" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="168" y="80" font-size="12" fill="#0d47a1">m1 设定</text>
  <rect x="228" y="60" width="70" height="30" rx="4" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="246" y="80" font-size="12" fill="#616161">m2</text>
  <rect x="306" y="60" width="70" height="30" rx="4" fill="#fff8e1" stroke="#f9a825"/>
  <text x="318" y="80" font-size="12" fill="#8d6e00">m3 颜色偏好</text>
  <rect x="384" y="60" width="70" height="30" rx="4" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="402" y="80" font-size="12" fill="#616161">m4</text>
  <rect x="462" y="60" width="70" height="30" rx="4" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="480" y="80" font-size="12" fill="#616161">m5</text>
  <rect x="540" y="60" width="70" height="30" rx="4" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="558" y="80" font-size="12" fill="#616161">m6</text>
  <rect x="618" y="60" width="70" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="636" y="80" font-size="12" fill="#1b5e20">m7…m10</text>

  <rect x="24" y="112" width="852" height="34" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="134" font-size="13" fill="#333">@before_model 钩子：消息数 > 6 时，返回 RemoveMessage(REMOVE_ALL_MESSAGES) + 首条 + 最近 4 条</text>
  <line x1="450" y1="90" x2="450" y2="110" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="24" y="188" font-size="13" fill="#555">裁剪后（6 条）</text>
  <rect x="150" y="172" width="70" height="30" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="168" y="192" font-size="12" fill="#0d47a1">m1 设定</text>
  <rect x="228" y="172" width="210" height="30" rx="4" fill="#fafafa" stroke="#9e9e9e" stroke-dasharray="5 4"/>
  <text x="288" y="192" font-size="12" fill="#9e9e9e">m2 … m6 已删除</text>
  <rect x="618" y="172" width="70" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="636" y="192" font-size="12" fill="#1b5e20">m7…m10</text>

  <line x1="450" y1="216" x2="450" y2="242" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="24" y="246" width="852" height="34" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="40" y="268" font-size="13" fill="#333">效果：条数封顶（10 → 6），token 只降约 14% —— 便宜，但降幅有限</text>

  <rect x="24" y="300" width="852" height="58" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="322" font-size="14" font-weight="bold" fill="#c62828">失效点：被切掉的中间信息永久丢失</text>
  <text x="40" y="344" font-size="13" fill="#333">课 7 实测：裁掉早期的「颜色偏好」后，模型再问「我喜欢什么颜色」答不出来。裁剪只适合早期信息不关键的对话。</text>
</svg>
