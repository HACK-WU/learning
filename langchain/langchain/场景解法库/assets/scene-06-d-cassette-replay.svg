<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#333">解法 D · 录制回放：CI 里跑「真链路」，但不烧钱不依赖网络</text>

  <text x="24" y="76" font-size="13" fill="#555">首次（录制）</text>
  <rect x="140" y="58" width="180" height="40" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="156" y="80" font-size="13" fill="#333">真调模型 API</text>
  <text x="156" y="96" font-size="12" fill="#555">6.66 秒 / 产生费用</text>
  <line x1="320" y1="78" x2="368" y2="78" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="372" y="58" width="200" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="388" y="80" font-size="13" fill="#0d47a1">cassette（录制文件）</text>
  <text x="388" y="96" font-size="12" fill="#0d47a1">请求 / 响应对入档</text>

  <text x="24" y="146" font-size="13" fill="#555">之后（回放）</text>
  <rect x="140" y="128" width="180" height="40" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="156" y="150" font-size="13" fill="#1b5e20">CI 离线回放</text>
  <text x="156" y="166" font-size="12" fill="#1b5e20">1.85 秒 / 零费用</text>
  <line x1="320" y1="148" x2="368" y2="148" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="372" y="128" width="200" height="40" rx="4" fill="#fafafa" stroke="#333"/>
  <text x="388" y="150" font-size="13" fill="#333">端点不可达照常通过</text>
  <text x="388" y="166" font-size="12" fill="#555">离线证明</text>

  <rect x="612" y="92" width="264" height="44" rx="4" fill="#fff8e1" stroke="#f9a825"/>
  <text x="628" y="112" font-size="13" fill="#8d6e00">比 mock 更真：抓的是真实请求形状</text>
  <text x="628" y="130" font-size="12" fill="#8d6e00">但录的是「那一刻」的模型行为</text>
  <line x1="572" y1="114" x2="608" y2="114" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="24" y="196" width="852" height="34" rx="4" fill="#e3f2fd" stroke="#1565C0"/>
  <text x="40" y="218" font-size="13" fill="#0d47a1">cassette 是资产：要进版本管理，也要做脱敏（真实 key / 用户信息不能入库）</text>

  <rect x="24" y="250" width="852" height="72" rx="4" fill="#ffebee" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="40" y="274" font-size="14" font-weight="bold" fill="#c62828">失效点：失配异常被伪装成 Connection error，排查会被带偏</text>
  <text x="40" y="298" font-size="13" fill="#333">cassette 没匹配上时，报错看起来像网络问题 —— 实际是请求变了（改了提示词 / 参数）。</text>
  <text x="40" y="320" font-size="13" fill="#333">另：回放固定了模型行为，模型升级后 cassette 不更新 = 测试的是旧世界。</text>
</svg>
