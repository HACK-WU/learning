<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="880" height="580" fill="#FDFDFE"/>

  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">本课一张图：六个钩子 × 四站</text>

  <!-- 卡片 1 -->
  <rect x="30" y="58" width="400" height="196" rx="12" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="50" y="88" font-size="15" font-weight="bold" fill="#5B21B6">① 中间件机制</text>
  <text x="50" y="118" font-size="13" fill="#6D28D9">四个节点钩子：before/after agent、before/after model</text>
  <text x="50" y="144" font-size="13" fill="#6D28D9">两个包裹钩子：wrap model call / wrap tool call</text>
  <text x="50" y="170" font-size="13" fill="#6D28D9">声明：create_agent(middleware=[...])</text>
  <text x="50" y="196" font-size="13" fill="#6D28D9">两种写法：装饰器式（单钩子）/ 类式（多钩子+配置）</text>
  <text x="50" y="226" font-size="12.5" fill="#7C3AED">实测：钩子在编译后的图里（图节点可见 middleware 节点）</text>

  <!-- 卡片 2 -->
  <rect x="450" y="58" width="400" height="196" rx="12" fill="#F7FDF9" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="470" y="88" font-size="15" font-weight="bold" fill="#166534">② 内置中间件（19 个）</text>
  <text x="470" y="118" font-size="13" fill="#15803D">容错：tool error / tool retry / model retry / model fallback</text>
  <text x="470" y="144" font-size="13" fill="#15803D">上下文：summarization / context editing / to-do list</text>
  <text x="470" y="170" font-size="13" fill="#15803D">安全：HITL / PII / model call limit / tool call limit</text>
  <text x="470" y="196" font-size="13" fill="#15803D">工具增强：tool selector / provider tool search / tool emulator</text>
  <text x="470" y="226" font-size="12.5" fill="#22A55B">能力扩展：shell / filesystem / subagent / rubric / file search</text>

  <!-- 卡片 3 -->
  <rect x="30" y="282" width="400" height="196" rx="12" fill="#FEFCE8" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="50" y="312" font-size="15" font-weight="bold" fill="#854D0E">③ 自定义中间件</text>
  <text x="50" y="342" font-size="13" fill="#92400E">节点钩子返回 dict → 合并进状态（走 reducer）</text>
  <text x="50" y="368" font-size="13" fill="#92400E">自定义 state：state_schema 扩展字段（实测计数跨步保持）</text>
  <text x="50" y="394" font-size="13" fill="#92400E">包裹钩子更新状态：返回 Command / ExtendedModelResponse</text>
  <text x="50" y="420" font-size="13" fill="#92400E">jump_to 提前收尾：实测省掉一次模型调用</text>
  <text x="50" y="450" font-size="12.5" fill="#A16207">类式可声明：state_schema / tools / transformers</text>

  <!-- 卡片 4 -->
  <rect x="450" y="282" width="400" height="196" rx="12" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
  <text x="470" y="312" font-size="15" font-weight="bold" fill="#9D174D">④ 组合与执行顺序</text>
  <text x="470" y="342" font-size="13" fill="#BE185D">before 钩子：正序（M1 → M2 → M3）</text>
  <text x="470" y="368" font-size="13" fill="#BE185D">after 钩子：逆序（M3 → M2 → M1）</text>
  <text x="470" y="394" font-size="13" fill="#BE185D">wrap 钩子：嵌套（M1 包 M2 包 M3 包模型）</text>
  <text x="470" y="420" font-size="13" fill="#BE185D">实测：换位后同一观察者看到 1 个 vs 6 个工具</text>
  <text x="470" y="450" font-size="12.5" fill="#DB2777">注意：同类实例需用 name 区分，否则判重报错</text>

  <!-- 底栏 -->
  <rect x="30" y="496" width="820" height="64" rx="12" fill="#FBFBFD" stroke="#E5E7EB" stroke-width="1.5"/>

  <rect x="52" y="512" width="152" height="34" rx="8" fill="#FBFBFC" stroke="#E5E7EB"/>
  <text x="128" y="534" text-anchor="middle" font-size="12" fill="#374151">agent loop</text>

  <text x="216" y="534" text-anchor="middle" font-size="14" fill="#9CA3AF">→</text>

  <rect x="232" y="512" width="176" height="34" rx="8" fill="#F7FDF9" stroke="#BBF7D0"/>
  <text x="320" y="534" text-anchor="middle" font-size="12" fill="#166534">中间件插槽（6 钩子）</text>

  <text x="420" y="534" text-anchor="middle" font-size="14" fill="#9CA3AF">→</text>

  <rect x="436" y="512" width="164" height="34" rx="8" fill="#FEFCE8" stroke="#FDE68A"/>
  <text x="518" y="534" text-anchor="middle" font-size="12" fill="#854D0E">内置 + 自定义</text>

  <text x="612" y="534" text-anchor="middle" font-size="14" fill="#9CA3AF">→</text>

  <rect x="628" y="512" width="200" height="34" rx="8" fill="#FDF2F8" stroke="#FBCFE8"/>
  <text x="728" y="534" text-anchor="middle" font-size="12" fill="#9D174D">组合顺序 → 课 10 HITL</text>

  <text x="440" y="574" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#374151">下一课：上下文工程——中间件已露脸，课 9 系统化"往模型上下文里放什么"</text>
</svg>
