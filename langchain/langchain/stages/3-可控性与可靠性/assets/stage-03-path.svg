<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="940" height="250" fill="#ffffff"/>
  <text x="20" y="40" fill="#1f2328" font-size="18" font-weight="700">阶段 3 路径：可控性与可靠性（让它靠谱）</text>
  <text x="20" y="62" fill="#57606a" font-size="12">从「能跑」到「可控」：用中间件、上下文工程、人机协同与 RAG 把可靠性立起来</text>

  <!-- 课 8 -->
  <g>
    <rect x="25" y="86" width="205" height="130" rx="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/>
    <text x="127" y="112" fill="#9a6700" font-size="13.5" font-weight="700" text-anchor="middle">课 8 · Middleware</text>
    <line x1="45" y1="124" x2="210" y2="124" stroke="#d0d7de"/>
    <text x="42" y="146" fill="#1f2328" font-size="11">中间件机制与钩子</text>
    <text x="42" y="166" fill="#1f2328" font-size="11">内置中间件</text>
    <text x="42" y="186" fill="#1f2328" font-size="11">自定义中间件</text>
    <text x="42" y="206" fill="#1f2328" font-size="11">组合与执行顺序</text>
  </g>

  <path d="M232 151 L242 151" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 课 9 -->
  <g>
    <rect x="248" y="86" width="205" height="130" rx="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/>
    <text x="350" y="112" fill="#9a6700" font-size="13.5" font-weight="700" text-anchor="middle">课 9 · 上下文工程</text>
    <line x1="268" y1="124" x2="433" y2="124" stroke="#d0d7de"/>
    <text x="265" y="146" fill="#1f2328" font-size="11">三类上下文</text>
    <text x="265" y="166" fill="#1f2328" font-size="11">模型/工具上下文</text>
    <text x="265" y="186" fill="#1f2328" font-size="11">生命周期上下文</text>
    <text x="265" y="206" fill="#1f2328" font-size="11">最佳实践</text>
  </g>

  <path d="M455 151 L465 151" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 课 10 -->
  <g>
    <rect x="471" y="86" width="205" height="130" rx="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/>
    <text x="573" y="112" fill="#9a6700" font-size="13.5" font-weight="700" text-anchor="middle">课 10 · 人机协同与护栏</text>
    <line x1="491" y1="124" x2="656" y2="124" stroke="#d0d7de"/>
    <text x="488" y="146" fill="#1f2328" font-size="11">为什么需要人在环中</text>
    <text x="488" y="166" fill="#1f2328" font-size="11">中断 / 审批 / 恢复</text>
    <text x="488" y="186" fill="#1f2328" font-size="11">内置 / 自定义护栏</text>
    <text x="488" y="206" fill="#1f2328" font-size="11">PII 检测</text>
  </g>

  <path d="M678 151 L688 151" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 课 11 -->
  <g>
    <rect x="694" y="86" width="205" height="130" rx="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/>
    <text x="796" y="112" fill="#9a6700" font-size="13.5" font-weight="700" text-anchor="middle">课 11 · Retrieval 与 RAG</text>
    <line x1="714" y1="124" x2="879" y2="124" stroke="#d0d7de"/>
    <text x="711" y="146" fill="#1f2328" font-size="11">为什么需要检索</text>
    <text x="711" y="166" fill="#1f2328" font-size="11">知识库构建链路</text>
    <text x="711" y="186" fill="#1f2328" font-size="11">检索器接口</text>
    <text x="711" y="206" fill="#1f2328" font-size="11">RAG 架构</text>
  </g>

  <text x="20" y="240" fill="#57606a" font-size="11.5">实操：给 agent 加摘要中间件 + 高危动作审批流 + 一个最小可用 RAG</text>
</svg>
