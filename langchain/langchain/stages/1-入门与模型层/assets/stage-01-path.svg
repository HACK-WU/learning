<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="250" fill="#ffffff"/>
  <text x="20" y="40" fill="#1f2328" font-size="18" font-weight="700">阶段 1 路径：入门与模型层</text>
  <text x="20" y="62" fill="#57606a" font-size="12">先认识主角（模型）与它的语言（消息），跑通第一个 Agent —— 这是后续一切组件的地基</text>

  <!-- 课 1 -->
  <g>
    <rect x="40" y="86" width="240" height="120" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
    <text x="160" y="112" fill="#0969da" font-size="14" font-weight="700" text-anchor="middle">课 1 · LangChain 是什么</text>
    <line x1="60" y1="124" x2="260" y2="124" stroke="#d0d7de"/>
    <text x="60" y="148" fill="#1f2328" font-size="11.5">起源与 1.0 大重构</text>
    <text x="60" y="170" fill="#1f2328" font-size="11.5">Agent = Model + Harness</text>
    <text x="60" y="192" fill="#1f2328" font-size="11.5">安装 · 配置 · 首个 Agent</text>
  </g>

  <path d="M282 146 L324 146" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 课 2 -->
  <g>
    <rect x="330" y="86" width="240" height="120" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
    <text x="450" y="112" fill="#0969da" font-size="14" font-weight="700" text-anchor="middle">课 2 · Models 模型层</text>
    <line x1="350" y1="124" x2="550" y2="124" stroke="#d0d7de"/>
    <text x="350" y="148" fill="#1f2328" font-size="11.5">两种模型初始化方式</text>
    <text x="350" y="170" fill="#1f2328" font-size="11.5">自定义 endpoint 接入</text>
    <text x="350" y="192" fill="#1f2328" font-size="11.5">invoke / stream / batch</text>
  </g>

  <path d="M572 146 L614 146" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 课 3 -->
  <g>
    <rect x="620" y="86" width="240" height="120" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
    <text x="740" y="112" fill="#0969da" font-size="14" font-weight="700" text-anchor="middle">课 3 · Messages 消息体系</text>
    <line x1="640" y1="124" x2="840" y2="124" stroke="#d0d7de"/>
    <text x="640" y="148" fill="#1f2328" font-size="11.5">标准消息格式的动机</text>
    <text x="640" y="170" fill="#1f2328" font-size="11.5">四类消息与工具调用流</text>
    <text x="640" y="192" fill="#1f2328" font-size="11.5">content blocks 与多模态</text>
  </g>

  <text x="20" y="236" fill="#57606a" font-size="11.5">实操：接入自定义 API（URL + Key），跑通「模型调用 → 消息构造 → 响应解读」全流程</text>
</svg>
