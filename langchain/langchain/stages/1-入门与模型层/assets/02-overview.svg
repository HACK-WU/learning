<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#FDFDFE"/>

  <text x="440" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">同一份代码，接上不同的大脑</text>

  <!-- 中部：主流程 -->
  <rect x="40" y="62" width="300" height="64" rx="10" fill="#F8FBFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="190" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E40AF">你要写的那份代码</text>
  <text x="190" y="112" text-anchor="middle" font-size="12.5" fill="#3B82F6">写一次，改配置就能换平台</text>

  <line x1="344" y1="94" x2="386" y2="94" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="390" y="62" width="212" height="64" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="496" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#5B21B6">一个统一的"插座"</text>
  <text x="496" y="112" text-anchor="middle" font-size="12.5" fill="#6D28D9">不同平台，同一个接口</text>

  <line x1="606" y1="80" x2="652" y2="80" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="606" y1="108" x2="652" y2="108" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="656" y="58" width="184" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="748" y="81" text-anchor="middle" font-size="13" fill="#475569">平台 A（默认走它）</text>

  <rect x="656" y="102" width="184" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="748" y="125" text-anchor="middle" font-size="13" fill="#475569">平台 B（备用，也能接）</text>

  <!-- 三点能力 -->
  <rect x="40" y="164" width="256" height="130" rx="12" fill="#F7FDF9" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="60" y="196" font-size="15" font-weight="bold" fill="#166534">① 一个口子接所有</text>
  <text x="60" y="224" font-size="13" fill="#15803D">接哪个平台、用哪个模型，</text>
  <text x="60" y="246" font-size="13" fill="#15803D">都只是"配置"级别的事，</text>
  <text x="60" y="268" font-size="13" fill="#15803D">业务代码不用动。</text>

  <rect x="312" y="164" width="256" height="130" rx="12" fill="#F8FBFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="332" y="196" font-size="15" font-weight="bold" fill="#1E40AF">② 三种"对话姿势"</text>
  <text x="332" y="224" font-size="13" fill="#1D4ED8">听完再说（等完整结果）</text>
  <text x="332" y="246" font-size="13" fill="#1D4ED8">边想边说（一个字一个字出）</text>
  <text x="332" y="268" font-size="13" fill="#1D4ED8">一次问多件事（同时处理）</text>

  <rect x="584" y="164" width="256" height="130" rx="12" fill="#FEFCE8" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="604" y="196" font-size="15" font-weight="bold" fill="#854D0E">③ 先看"说明书"</text>
  <text x="604" y="224" font-size="13" fill="#92400E">它能接受图片吗？</text>
  <text x="604" y="246" font-size="13" fill="#92400E">它是边想边答吗？</text>
  <text x="604" y="268" font-size="13" fill="#92400E">一次能读多长的内容？</text>

  <!-- 底部：成本 -->
  <rect x="40" y="322" width="800" height="112" rx="12" fill="#FBFBFD" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="60" y="354" font-size="15" font-weight="bold" fill="#374151">④ 账单看得见</text>
  <text x="60" y="382" font-size="13" fill="#4B5563">每次对话消耗多少、"思考"占了多少，都能打印出来对比——</text>
  <text x="60" y="404" font-size="13" fill="#4B5563">选平台、算成本，不靠感觉，靠数据。</text>

  <rect x="560" y="346" width="260" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="580" y="372" font-size="12.5" fill="#6B7280">本机实测（3 条同时提问）：</text>
  <text x="580" y="394" font-size="12.5" fill="#6B7280">平台 A：2.99s ｜ 平台 B：2.20s</text>
</svg>
