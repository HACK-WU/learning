<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3B82F6"/>
    </marker>
  </defs>

  <rect width="920" height="600" fill="#FDFDFE"/>

  <text x="460" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">LangChain 组件生态：三类角色，七个组件</text>

  <!-- 编排层 -->
  <rect x="40" y="66" width="660" height="140" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="62" y="96" font-size="15" font-weight="bold" fill="#334155">编排层 · 决定「下一步做什么」</text>

  <rect x="62" y="112" width="290" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="207" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">智能体 Agents</text>
  <text x="207" y="167" text-anchor="middle" font-size="12.5" fill="#64748B">协调下面所有组件，规划并推进任务</text>

  <rect x="386" y="112" width="290" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="531" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">记忆 Memory</text>
  <text x="531" y="167" text-anchor="middle" font-size="12.5" fill="#64748B">记住之前发生过什么（对话与状态）</text>

  <!-- 层间箭头 1 -->
  <line x1="370" y1="208" x2="370" y2="248" stroke="#6B7280" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="384" y="233" font-size="12.5" fill="#6B7280">调用与协调</text>

  <!-- 生成层 -->
  <rect x="40" y="254" width="660" height="140" rx="12" fill="#F8FBFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="62" y="284" font-size="15" font-weight="bold" fill="#1E40AF">生成层 · 负责「想」和「做」</text>

  <rect x="62" y="300" width="290" height="76" rx="10" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="207" y="329" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A8A">模型 Models</text>
  <text x="207" y="355" text-anchor="middle" font-size="12.5" fill="#3B82F6">理解问题、生成文字（思考与作答）</text>

  <line x1="356" y1="338" x2="382" y2="338" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="382" y1="346" x2="356" y2="346" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrBlue)"/>

  <rect x="386" y="300" width="290" height="76" rx="10" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="531" y="329" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A8A">工具 Tools</text>
  <text x="531" y="355" text-anchor="middle" font-size="12.5" fill="#3B82F6">真的去查 / 算 / 读 / 写（与外部世界交互）</text>

  <!-- 层间箭头 2 -->
  <line x1="370" y1="396" x2="370" y2="436" stroke="#6B7280" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="384" y="421" font-size="12.5" fill="#6B7280">按需查询</text>

  <!-- 数据层 -->
  <rect x="40" y="442" width="660" height="132" rx="12" fill="#F7FDF9" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="62" y="472" font-size="15" font-weight="bold" fill="#166534">数据层 · 给模型补上「它不知道」的知识</text>

  <rect x="62" y="488" width="180" height="68" rx="10" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="152" y="517" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532D">文档处理</text>
  <text x="152" y="540" text-anchor="middle" font-size="11.5" fill="#16A34A">收集并切分外部资料</text>

  <line x1="245" y1="522" x2="271" y2="522" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arr2)"/>

  <rect x="276" y="488" width="180" height="68" rx="10" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="366" y="517" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532D">向量存储</text>
  <text x="366" y="540" text-anchor="middle" font-size="11.5" fill="#16A34A">把资料变成可检索的知识</text>

  <line x1="459" y1="522" x2="485" y2="522" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arr2)"/>

  <rect x="490" y="488" width="186" height="68" rx="10" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="583" y="517" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532D">检索器</text>
  <text x="583" y="540" text-anchor="middle" font-size="11.5" fill="#16A34A">按问题取回相关资料</text>

  <!-- 右侧：三种常见组合 -->
  <rect x="730" y="66" width="160" height="508" rx="12" fill="#FBFBFD" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="810" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">三种常见组合</text>

  <rect x="746" y="116" width="128" height="112" rx="10" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="810" y="146" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5B21B6">RAG</text>
  <text x="810" y="172" text-anchor="middle" font-size="11.5" fill="#6D28D9">先查资料，</text>
  <text x="810" y="192" text-anchor="middle" font-size="11.5" fill="#6D28D9">再带着资料回答</text>

  <rect x="746" y="248" width="128" height="128" rx="10" fill="#FFFFFF" stroke="#BAE6FD"/>
  <text x="810" y="278" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#075985">带工具的 Agent</text>
  <text x="810" y="304" text-anchor="middle" font-size="11.5" fill="#0C4A6E">自己决定</text>
  <text x="810" y="324" text-anchor="middle" font-size="11.5" fill="#0C4A6E">什么时候用</text>
  <text x="810" y="344" text-anchor="middle" font-size="11.5" fill="#0C4A6E">哪个帮手</text>

  <rect x="746" y="396" width="128" height="128" rx="10" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="810" y="426" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#854D0E">多智能体</text>
  <text x="810" y="452" text-anchor="middle" font-size="11.5" fill="#92400E">多个智能体</text>
  <text x="810" y="472" text-anchor="middle" font-size="11.5" fill="#92400E">分工协作</text>
  <text x="810" y="492" text-anchor="middle" font-size="11.5" fill="#92400E">共同完成任务</text>
</svg>
