<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="880" height="540" fill="#FDFDFE"/>

  <text x="440" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">Testing 与 Observability：从「能跑」到「敢用」</text>

  <!-- 卡 1 -->
  <rect x="30" y="58" width="262" height="245" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="46" y="88" font-size="13.5" font-weight="bold" fill="#991B1B">① 为什么测：非确定性的三种表现</text>
  <text x="46" y="118" font-size="12" fill="#7F1D1D">内容变：同题 3 次 3 种措辞</text>
  <text x="46" y="140" font-size="12" fill="#7F1D1D">节奏变：同题耗时 1.8~14 秒</text>
  <text x="46" y="162" font-size="12" fill="#7F1D1D">路径变：5 次跑出 4 种工具链</text>
  <rect x="46" y="182" width="230" height="1.2" fill="#FECACA"/>
  <text x="46" y="210" font-size="12" font-weight="bold" fill="#991B1B">断言换代：别断「原话」</text>
  <text x="46" y="232" font-size="12" fill="#7F1D1D">实测：快照断言 1/3 通过</text>
  <text x="46" y="254" font-size="12" fill="#7F1D1D">结构断言 3/3 通过</text>
  <text x="46" y="284" font-size="12" fill="#B91C1C">→ 结构断言 + Evals 评分</text>

  <!-- 卡 2 -->
  <rect x="309" y="58" width="262" height="245" rx="12" fill="#F8FBFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="325" y="88" font-size="13.5" font-weight="bold" fill="#1E40AF">② 三层测试：快慢分工</text>
  <text x="325" y="118" font-size="12" fill="#1D4ED8">单元：剧本替身，5 项 0.4 秒</text>
  <text x="325" y="140" font-size="12" fill="#1D4ED8">集成：真调用 + 断言结构，6.1 秒</text>
  <text x="325" y="162" font-size="12" fill="#1D4ED8">Evals：4 种匹配 + 裁判模型</text>
  <rect x="325" y="182" width="230" height="1.2" fill="#BFDBFE"/>
  <text x="325" y="210" font-size="12" font-weight="bold" fill="#1E40AF">一条省钱的近路：录制回放</text>
  <text x="325" y="232" font-size="12" fill="#1D4ED8">录一次真调用 → 之后离线重放</text>
  <text x="325" y="254" font-size="12" fill="#1D4ED8">实测 1.9 秒跑完、端点半路也过</text>
  <text x="325" y="284" font-size="12" fill="#3B82F6">→ 日常跑快层，交付跑全层</text>

  <!-- 卡 3 -->
  <rect x="588" y="58" width="262" height="245" rx="12" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="604" y="88" font-size="13.5" font-weight="bold" fill="#5B21B6">③ 可观测：每一步留痕</text>
  <text x="604" y="118" font-size="12" fill="#6D28D9">trace = 一棵树：模型调用、工具</text>
  <text x="604" y="140" font-size="12" fill="#6D28D9">执行、输入输出、耗时全部记录</text>
  <rect x="604" y="160" width="230" height="1.2" fill="#DDD6FE"/>
  <text x="604" y="188" font-size="12" font-weight="bold" fill="#5B21B6">本地看：set_debug</text>
  <text x="604" y="210" font-size="12" fill="#6D28D9">自建：callback 迷你收集器</text>
  <text x="604" y="232" font-size="12" fill="#6D28D9">托管：两行环境变量接入平台</text>
  <text x="604" y="262" font-size="12" fill="#7C3AED">查问题：从根往下逐节点核对</text>
  <text x="604" y="284" font-size="12" fill="#A78BFA">→ 黑盒变全记录</text>

  <!-- 工程纪律条 -->
  <rect x="30" y="318" width="820" height="100" rx="12" fill="#F7FDF9" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="48" y="346" font-size="13.5" font-weight="bold" fill="#166534">工程纪律（实测踩出来的四条）</text>
  <text x="48" y="372" font-size="12" fill="#374151">① 密钥只进 .env，不进代码与断言　② 录制文件入库前脱敏（凭据 + 端点）</text>
  <text x="48" y="396" font-size="12" fill="#374151">③ 集成测试用 marker 分流，不进默认跑　④ tracing 环境变量在进程启动前配好（中途改不生效）</text>

  <!-- 底栏 -->
  <rect x="30" y="432" width="820" height="88" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="440" y="462" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1E40AF">测试证明它，观测看住它——这是交付前最后一道工序</text>
  <text x="440" y="490" text-anchor="middle" font-size="12.5" fill="#475569">13 课基础组件至此全部就位（模型 → 消息 → 工具 → agent → 记忆 → 可控 → 协作 → 质量）</text>
  <text x="440" y="510" text-anchor="middle" font-size="12.5" fill="#64748B">下一站：把全部知识点焊成一个跨阶段整合的结课实战项目</text>
</svg>
