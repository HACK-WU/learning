<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#ffffff"/>
  <text x="20" y="42" fill="#1f2328" font-size="22" font-weight="700">LangChain 系统学习 · 学习路径总览</text>
  <text x="20" y="66" fill="#57606a" font-size="13">故事主线：主角「只会聊天的模型」→ 冲突「裸调 API 越写越失控」→ 收束「用组件体系组装出生产级智能体」</text>

  <!-- Stage 1 -->
  <g>
    <rect x="20" y="90" width="210" height="290" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
    <text x="125" y="118" fill="#0969da" font-size="15" font-weight="700" text-anchor="middle">阶段 1 · 入门与模型层</text>
    <text x="125" y="140" fill="#57606a" font-size="11" text-anchor="middle">「认识主角与它的语言」</text>
    <line x1="40" y1="155" x2="210" y2="155" stroke="#d0d7de"/>
    <text x="34" y="180" fill="#1f2328" font-size="12">▸ 课1 LangChain 是什么</text>
    <text x="34" y="200" fill="#57606a" font-size="10.5">  起源 / 定位 / 首个 Agent</text>
    <text x="34" y="228" fill="#1f2328" font-size="12">▸ 课2 Models 模型层</text>
    <text x="34" y="248" fill="#57606a" font-size="10.5">  init_chat_model / 自定义 API</text>
    <text x="34" y="276" fill="#1f2328" font-size="12">▸ 课3 Messages 消息体系</text>
    <text x="34" y="296" fill="#57606a" font-size="10.5">  四类消息 / content blocks</text>
  </g>

  <path d="M232 235 L246 235" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g>
    <rect x="250" y="90" width="210" height="290" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
    <text x="355" y="118" fill="#1a7f37" font-size="15" font-weight="700" text-anchor="middle">阶段 2 · Agent 核心</text>
    <text x="355" y="140" fill="#57606a" font-size="11" text-anchor="middle">「让它动起来」</text>
    <line x1="270" y1="155" x2="440" y2="155" stroke="#d0d7de"/>
    <text x="264" y="180" fill="#1f2328" font-size="12">▸ 课4 Tools 工具</text>
    <text x="264" y="200" fill="#57606a" font-size="10.5">  机制 / @tool / MCP</text>
    <text x="264" y="228" fill="#1f2328" font-size="12">▸ 课5 Agents 智能体核心</text>
    <text x="264" y="248" fill="#57606a" font-size="10.5">  create_agent / agent loop</text>
    <text x="264" y="276" fill="#1f2328" font-size="12">▸ 课6 Streaming 流式</text>
    <text x="264" y="296" fill="#57606a" font-size="10.5">  流模式 / token 输出</text>
    <text x="264" y="324" fill="#1f2328" font-size="12">▸ 课7 Memory 记忆</text>
    <text x="264" y="344" fill="#57606a" font-size="10.5">  短期 / 长期 / 策略</text>
  </g>

  <path d="M462 235 L476 235" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <g>
    <rect x="480" y="90" width="210" height="290" rx="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/>
    <text x="585" y="118" fill="#9a6700" font-size="15" font-weight="700" text-anchor="middle">阶段 3 · 可控性与可靠性</text>
    <text x="585" y="140" fill="#57606a" font-size="11" text-anchor="middle">「让它靠谱」</text>
    <line x1="500" y1="155" x2="670" y2="155" stroke="#d0d7de"/>
    <text x="494" y="180" fill="#1f2328" font-size="12">▸ 课8 Middleware 中间件</text>
    <text x="494" y="200" fill="#57606a" font-size="10.5">  钩子 / 内置 / 自定义</text>
    <text x="494" y="228" fill="#1f2328" font-size="12">▸ 课9 Context 上下文工程</text>
    <text x="494" y="248" fill="#57606a" font-size="10.5">  三类上下文 / 组装策略</text>
    <text x="494" y="276" fill="#1f2328" font-size="12">▸ 课10 人机协同与护栏</text>
    <text x="494" y="296" fill="#57606a" font-size="10.5">  中断审批 / PII / 过滤</text>
    <text x="494" y="324" fill="#1f2328" font-size="12">▸ 课11 Retrieval 检索与 RAG</text>
    <text x="494" y="344" fill="#57606a" font-size="10.5">  知识库 / 检索器 / RAG</text>
  </g>

  <path d="M692 235 L706 235" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <g>
    <rect x="710" y="90" width="210" height="290" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/>
    <text x="815" y="118" fill="#8250df" font-size="15" font-weight="700" text-anchor="middle">阶段 4 · 组合与工程化</text>
    <text x="815" y="140" fill="#57606a" font-size="11" text-anchor="middle">「从单兵到团队」</text>
    <line x1="730" y1="155" x2="900" y2="155" stroke="#d0d7de"/>
    <text x="724" y="180" fill="#1f2328" font-size="12">▸ 课12 Multi-Agent 多智能体</text>
    <text x="724" y="200" fill="#57606a" font-size="10.5">  subagents / handoffs / router</text>
    <text x="724" y="228" fill="#1f2328" font-size="12">▸ 课13 Testing 与可观测</text>
    <text x="724" y="248" fill="#57606a" font-size="10.5">  测试层次 / evals / tracing</text>
    <line x1="730" y1="268" x2="900" y2="268" stroke="#d0d7de"/>
    <text x="724" y="294" fill="#1f2328" font-size="12">▸ 结课综合实战项目</text>
    <text x="724" y="314" fill="#57606a" font-size="10.5">  跨阶段整合 · 完整应用</text>
  </g>

  <!-- 汇聚箭头：全部阶段 → 结课项目 -->
  <path d="M125 384 L125 404" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M355 384 L355 404" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M585 384 L585 404" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M815 384 L815 404" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 结课项目条 -->
  <rect x="20" y="408" width="900" height="56" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/>
  <text x="470" y="432" fill="#1f2328" font-size="13" font-weight="700" text-anchor="middle">结课综合实战项目：跨阶段整合，独立交付一个完整智能体应用（全部 13 课完成后启动）</text>
  <text x="470" y="452" fill="#57606a" font-size="11" text-anchor="middle">模型接入 + 工具 + 记忆 + 中间件 + 输出管控 + 测试/观测 ｜ 多文件工程 · 设计决策 · 反例对照 · 验收清单</text>
</svg>
