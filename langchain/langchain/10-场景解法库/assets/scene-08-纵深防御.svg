<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <text x="440" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">场景 8：越狱纵深防御（四层防线 + 红队回归）</text>

  <rect x="20" y="90" width="120" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="80" y="126" text-anchor="middle" font-size="14" fill="#1e293b">用户输入</text>

  <rect x="170" y="90" width="170" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="255" y="118" text-anchor="middle" font-size="14" fill="#1e293b">① 输入过滤</text>
  <text x="255" y="138" text-anchor="middle" font-size="12" fill="#64748b">before_agent</text>

  <rect x="370" y="90" width="100" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="420" y="126" text-anchor="middle" font-size="14" fill="#1e293b">模型</text>

  <rect x="500" y="90" width="170" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="585" y="118" text-anchor="middle" font-size="14" fill="#1e293b">② 输出审查</text>
  <text x="585" y="138" text-anchor="middle" font-size="12" fill="#64748b">after_agent</text>

  <rect x="700" y="90" width="120" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="760" y="126" text-anchor="middle" font-size="14" fill="#1e293b">回复</text>

  <line x1="140" y1="120" x2="166" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="120" x2="366" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="120" x2="496" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="120" x2="696" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="420" y1="150" x2="420" y2="216" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="432" y="186" font-size="12" fill="#64748b">工具调用</text>

  <rect x="300" y="220" width="240" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="420" y="248" text-anchor="middle" font-size="14" fill="#1e293b">③ 动作约束</text>
  <text x="420" y="268" text-anchor="middle" font-size="12" fill="#64748b">权限分级 + 参数校验 + HITL</text>

  <line x1="420" y1="284" x2="420" y2="326" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="330" width="180" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="364" text-anchor="middle" font-size="14" fill="#1e293b">工具执行（越权出不去）</text>

  <rect x="150" y="430" width="580" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="440" y="456" text-anchor="middle" font-size="14" fill="#1e293b">④ 红队回归集：注入样本 → 轨迹断言</text>
  <text x="440" y="476" text-anchor="middle" font-size="12" fill="#64748b">加固后再攻一次验证——只防住旧话术不算防住</text>

  <path d="M 210 430 C 190 320, 220 210, 248 156" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
  <path d="M 660 430 C 680 320, 650 210, 610 156" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
  <text x="812" y="330" font-size="12" fill="#dc2626" text-anchor="middle">样本回流</text>

  <rect x="30" y="516" width="820" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="440" y="535" text-anchor="middle" font-size="12" fill="#64748b">核心：护栏要在模型之外的代码层（输入检测 / 输出审查 / 动作约束）——缺一层都别自称「防住」</text>
</svg>
