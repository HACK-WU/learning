<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">场景 2：分级审批决策流（when 谓词分流）</text>

  <rect x="30" y="70" width="170" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="98" text-anchor="middle" font-size="14" fill="#1e293b">用户请求</text>
  <text x="115" y="118" text-anchor="middle" font-size="12" fill="#64748b">（退款 80 元）</text>

  <rect x="260" y="70" width="210" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="365" y="98" text-anchor="middle" font-size="14" fill="#1e293b">when 谓词判定</text>
  <text x="365" y="118" text-anchor="middle" font-size="12" fill="#64748b">金额 &gt; 50 ？</text>

  <line x1="200" y1="102" x2="256" y2="102" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="560" y="70" width="180" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="98" text-anchor="middle" font-size="14" fill="#1e293b">直通执行（小额）</text>
  <text x="650" y="118" text-anchor="middle" font-size="12" fill="#64748b">无感、不打扰</text>
  <path d="M 470 90 L 515 90 L 515 102 L 556 102" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="512" y="80" text-anchor="middle" font-size="13" fill="#16a34a">False（放行）</text>

  <rect x="260" y="210" width="210" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="365" y="238" text-anchor="middle" font-size="14" fill="#1e293b">中断提案（冻结）</text>
  <text x="365" y="258" text-anchor="middle" font-size="12" fill="#64748b">状态存入检查点</text>
  <line x1="365" y1="134" x2="365" y2="206" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="378" y="176" font-size="13" fill="#dc2626">True（要审批）</text>

  <rect x="260" y="310" width="210" height="64" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="365" y="338" text-anchor="middle" font-size="14" fill="#1e293b">审批人决策</text>
  <text x="365" y="358" text-anchor="middle" font-size="12" fill="#64748b">approve / reject</text>
  <line x1="365" y1="274" x2="365" y2="306" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="440" width="230" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="155" y="468" text-anchor="middle" font-size="14" fill="#1e293b">approve：执行 + 记账</text>
  <text x="155" y="488" text-anchor="middle" font-size="12" fill="#64748b">动作按提案原样落地</text>
  <path d="M 300 374 L 155 374 L 155 436" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="430" y="440" width="290" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="575" y="468" text-anchor="middle" font-size="14" fill="#1e293b">reject：错误回执 → 模型改道</text>
  <text x="575" y="488" text-anchor="middle" font-size="12" fill="#64748b">拒绝不是无声取消，模型据此重新评估</text>
  <path d="M 430 374 L 575 374 L 575 436" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="524" width="700" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="380" y="541" text-anchor="middle" font-size="12" fill="#64748b">核心：闸门要精准——when 返回 False 的调用不会进入中断批次；checkpointer 是恢复的前提</text>
</svg>
