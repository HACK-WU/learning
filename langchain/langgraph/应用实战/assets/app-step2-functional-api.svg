<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">第 3 跳：@task + previous 收口，并给出选型结论</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#6b7280">高亮为本跳新增：全部步骤加 @task、previous 承载跨轮状态、明确选型判据</text>

  <!-- 主流程 -->
  <rect x="26" y="68" width="848" height="110" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="450" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">最终形态：所有有副作用的步骤都标 @task</text>

  <rect x="44" y="98" width="130" height="54" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="109" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">@task 读数据</text>
  <text x="109" y="136" text-anchor="middle" font-size="9" fill="#047857">结果进存档点</text>

  <path d="M174 125 L200 125" stroke="#6366f1" stroke-width="2" marker-end="url(#c1)"/>

  <rect x="200" y="98" width="130" height="54" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="265" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">@task 清洗</text>
  <text x="265" y="136" text-anchor="middle" font-size="9" fill="#047857">结果进存档点</text>

  <path d="M330 125 L356 125" stroke="#6366f1" stroke-width="2" marker-end="url(#c1)"/>

  <rect x="356" y="98" width="130" height="54" rx="7" fill="#fefce8" stroke="#fde047" stroke-width="1.4"/>
  <text x="421" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">interrupt 暂停</text>
  <text x="421" y="136" text-anchor="middle" font-size="9" fill="#78350f">人工确认后再续</text>

  <path d="M486 125 L512 125" stroke="#6366f1" stroke-width="2" marker-end="url(#c1)"/>

  <rect x="512" y="98" width="130" height="54" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="577" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">@task 写回</text>
  <text x="577" y="136" text-anchor="middle" font-size="9" fill="#047857">结果进存档点</text>

  <rect x="662" y="98" width="192" height="54" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="758" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">previous 承载跨轮状态</text>
  <text x="758" y="136" text-anchor="middle" font-size="9" fill="#1e3a8a">整体值，无具名字段</text>

  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6366f1"/></marker>
  </defs>

  <!-- 四块 -->
  <rect x="26" y="192" width="420" height="116" rx="8" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.3"/>
  <text x="236" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">① 全部标 @task 后的效果（实测）</text>
  <text x="236" y="234" text-anchor="middle" font-size="9" fill="#065f46">invoke  -> 读数据 1 次，清洗 0 次（卡在 interrupt）</text>
  <text x="236" y="252" text-anchor="middle" font-size="9" fill="#065f46">resume  -> 读数据 1 次，清洗 1 次  ← 未重跑</text>
  <text x="236" y="270" text-anchor="middle" font-size="9" fill="#065f46">三次 interrupt 累计：3 个 task 只跑 3 次</text>
  <text x="236" y="290" text-anchor="middle" font-size="9" font-weight="600" fill="#b91c1c">对照：普通函数 resume 必重跑（1 次→2 次）</text>

  <rect x="466" y="192" width="408" height="116" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="670" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">② 想改中间结果？做不到（实测）</text>
  <text x="670" y="234" text-anchor="middle" font-size="9" fill="#7f1d1d">Functional 历史只有 2 条：() / ('f1',)</text>
  <text x="670" y="252" text-anchor="middle" font-size="9" fill="#7f1d1d">Graph 同样两步有 4 条，能逐字段改</text>
  <text x="670" y="270" text-anchor="middle" font-size="9" fill="#7f1d1d">update_state 在 Functional 里是整体替换</text>
  <text x="670" y="290" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b">← 这就是选型的实质代价</text>

  <rect x="26" y="322" width="420" height="116" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="236" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">③ 选型判据：一句话</text>
  <text x="236" y="366" text-anchor="middle" font-size="10" fill="#1e3a8a">中间过程要不要被单独看见和逐格改？</text>
  <text x="236" y="386" text-anchor="middle" font-size="9" fill="#1e3a8a">要 ——> Graph API（步骤多 / 要 time-travel 改字段）</text>
  <text x="236" y="404" text-anchor="middle" font-size="9" fill="#1e3a8a">不要 -> Functional API（已有脚本 / 控制流直）</text>
  <text x="236" y="424" text-anchor="middle" font-size="9" font-weight="600" fill="#1e3a8a">两套能力对等，不是比优劣</text>

  <rect x="466" y="322" width="408" height="116" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.3"/>
  <text x="670" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">④ 混用的三个坑（实测）</text>
  <text x="670" y="366" text-anchor="middle" font-size="9" fill="#7e22ce">task 里调已编译的图：可行（实测 12）</text>
  <text x="670" y="384" text-anchor="middle" font-size="9" fill="#7e22ce">但内层图有自己的 thread_id，外层管不到</text>
  <text x="670" y="402" text-anchor="middle" font-size="9" fill="#7e22ce">cache_policy 要配 entrypoint(cache=) 才生效</text>
  <text x="670" y="424" text-anchor="middle" font-size="9" font-weight="600" fill="#6b21a8">同步 task 配 timeout 装饰即抛</text>

  <!-- 铁律 -->
  <rect x="26" y="452" width="848" height="54" rx="9" fill="#fefce8" stroke="#fde047" stroke-width="1.4"/>
  <text x="450" y="472" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">五条必须记住（全是实测）</text>
  <text x="450" y="492" text-anchor="middle" font-size="10" fill="#78350f">① 只有 @task 进存档点（普通函数 resume 必重跑）　② @task 不是缓存（不中断时照样重算）　③ 挂 cp 必须传 config</text>
  <text x="450" y="508" text-anchor="middle" font-size="10" fill="#78350f">④ previous 是整体值、无具名字段（历史 2 条 vs Graph 4 条）　⑤ cache_policy 要两头配；同步 timeout 装饰即抛</text>
</svg>
