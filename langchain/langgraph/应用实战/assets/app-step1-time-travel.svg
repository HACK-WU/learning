<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">第 1 跳：翻回看，搞清「当时为什么判驳回」</text>
  <text x="440" y="52" text-anchor="middle" font-size="12" fill="#6b7280">左右是同一次执行，区别只在你能不能看到中间那几步</text>

  <rect x="40" y="76" width="380" height="180" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="230" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">改之前：只看得到结果</text>
  <rect x="62" y="112" width="336" height="28" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.1"/>
  <text x="230" y="131" text-anchor="middle" font-size="11" fill="#7f1d1d">跑完只剩最终状态，中间蒸发</text>
  <rect x="62" y="146" width="336" height="42" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="230" y="164" text-anchor="middle" font-size="10" fill="#b91c1c">客户问「为什么驳回」</text>
  <text x="230" y="180" text-anchor="middle" font-size="10" fill="#b91c1c">只能凭猜，或者整条重跑一遍</text>
  <text x="230" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">结果：{'decision': '驳回'}</text>
  <text x="230" y="234" text-anchor="middle" font-size="10" fill="#7f1d1d">看不到金额、看不到判定依据</text>

  <rect x="460" y="76" width="380" height="180" rx="9" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="650" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">改之后：翻历史看每一步</text>
  <rect x="482" y="112" width="336" height="28" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.1"/>
  <text x="650" y="131" text-anchor="middle" font-size="11" fill="#065f46">get_state_history 从新到旧列出来</text>
  <rect x="482" y="146" width="336" height="84" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="650" y="164" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#0f172a">next=()       已驳回</text>
  <text x="650" y="180" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#0f172a">next=('判定',) amount=5000</text>
  <text x="650" y="196" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#0f172a">next=('查订单',) log=[]</text>
  <text x="650" y="216" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#0f172a">next=('__start__',) values={}</text>
  <text x="650" y="238" text-anchor="middle" font-size="10" fill="#059669">每一步的金额和依据都在</text>

  <rect x="40" y="274" width="800" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="440" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">这一跳的改动：加一行 for s in graph.get_state_history(cfg)，把 5 条快照打出来</text>
  <text x="440" y="316" text-anchor="middle" font-size="11" fill="#1e3a8a">读历史不改变图 —— 打完最新状态仍是 next=()</text>

  <rect x="40" y="340" width="385" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="232" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">这一跳还没解决</text>
  <text x="232" y="378" text-anchor="middle" font-size="10" fill="#475569">① 看到了，但还是改不了判错的那一步</text>

  <rect x="455" y="340" width="385" height="48" rx="8" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="647" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">下一跳要撞什么</text>
  <text x="647" y="378" text-anchor="middle" font-size="10" fill="#065f46">② 换 thread 改判 → 状态整个丢失</text>
</svg>
