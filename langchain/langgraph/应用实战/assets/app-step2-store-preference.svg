<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">第 3 跳：三类记忆分层 + 热路径写入</text>
  <text x="440" y="52" text-anchor="middle" font-size="12" fill="#6b7280">新增：档案 / 经历 / 规矩三个格子，各用各的写法（高亮部分为本跳新增）</text>

  <!-- 用户 -->
  <rect x="40" y="76" width="96" height="48" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.4"/>
  <text x="88" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">用户</text>
  <text x="88" y="114" text-anchor="middle" font-size="10" fill="#4338ca">user_id=1</text>

  <path d="M136 100 L176 100" stroke="#6366f1" stroke-width="2" marker-end="url(#b1)"/>

  <!-- 图 -->
  <rect x="176" y="70" width="176" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="264" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">图（两节点）</text>
  <text x="264" y="111" text-anchor="middle" font-size="10" fill="#64748b">读取偏好 → 回复</text>

  <path d="M352 100 L392 100" stroke="#6366f1" stroke-width="2" marker-end="url(#b1)"/>

  <!-- Store -->
  <rect x="392" y="62" width="288" height="76" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="536" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Store（本跳新增，图外面）</text>
  <text x="536" y="103" text-anchor="middle" font-size="11" fill="#065f46">按 (user_id, 类别) 分格</text>
  <text x="536" y="122" text-anchor="middle" font-size="10" fill="#059669">任何会话都能读写</text>

  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- 三个格子 -->
  <rect x="700" y="62" width="140" height="76" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="770" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">checkpointer</text>
  <text x="770" y="103" text-anchor="middle" font-size="10" fill="#78350f">本轮上下文</text>
  <text x="770" y="122" text-anchor="middle" font-size="10" fill="#78350f">（课 5，自动存）</text>

  <rect x="40" y="164" width="266" height="118" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.3"/>
  <text x="173" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">① 档案（语义）</text>
  <text x="52" y="207" font-size="10" fill="#4b5563">格子: (user_id, "profile")</text>
  <text x="52" y="224" font-size="10" fill="#4b5563">key: 固定一个 "profile"</text>
  <text x="52" y="241" font-size="10" fill="#4b5563">写法: 读旧的 → 合并 → 整条覆盖</text>
  <text x="52" y="262" font-size="10" fill="#7c3aed">⚠ 不合并就丢字段</text>

  <rect x="322" y="164" width="266" height="118" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.3"/>
  <text x="455" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">② 经历（情景）</text>
  <text x="334" y="207" font-size="10" fill="#4b5563">格子: (user_id, "episodes")</text>
  <text x="334" y="224" font-size="10" fill="#4b5563">key: 带时间戳 / 事件 id</text>
  <text x="334" y="241" font-size="10" fill="#4b5563">写法: 一条条加，永不覆盖</text>
  <text x="334" y="262" font-size="10" fill="#7c3aed">⚠ 同 key 会整条盖掉</text>

  <rect x="604" y="164" width="236" height="118" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.3"/>
  <text x="722" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">③ 规矩（程序）</text>
  <text x="616" y="207" font-size="10" fill="#4b5563">格子: (user_id, "rules")</text>
  <text x="616" y="224" font-size="10" fill="#4b5563">写法: 按字段 filter 捞</text>
  <text x="616" y="241" font-size="10" fill="#4b5563">通常进提示词，改的是行为</text>
  <text x="616" y="262" font-size="10" fill="#7c3aed">⚠ 写错污染所有后续会话</text>

  <!-- 热路径写入 -->
  <rect x="40" y="300" width="800" height="76" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
  <text x="440" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">本跳新增：热路径写入——在同一轮里「读到偏好 → 生成回复 → 顺手记下新事实」</text>
  <text x="440" y="344" text-anchor="middle" font-size="11" fill="#065f46">代价：主流程多一次写入、延迟变高（课 7 的流式输出正好能把这段等待摊开给用户看）</text>
  <text x="440" y="364" text-anchor="middle" font-size="10" fill="#059669">替代路线：后台写入（对话结束后异步提炼，不占主流程；干净实现要等课 10 子图）</text>

  <!-- 对比 -->
  <rect x="40" y="392" width="390" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="235" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">比第 1 跳多了什么</text>
  <text x="235" y="431" text-anchor="middle" font-size="10" fill="#475569">偏好不再跟着会话走；三类内容各占一格，互不覆盖</text>

  <rect x="450" y="392" width="390" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="645" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">生产上还要补（非本课）</text>
  <text x="645" y="431" text-anchor="middle" font-size="10" fill="#1e3a8a">换 PostgresStore、记忆去重与冲突检测、TTL 清理、后台提炼</text>
</svg>
