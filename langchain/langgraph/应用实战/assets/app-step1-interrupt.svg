<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">第 1 跳：在付款前卡一道审批</text>
  <text x="440" y="52" text-anchor="middle" font-size="12" fill="#6b7280">左右是同一张图，区别只在付款节点多了一声「等一下」</text>

  <rect x="40" y="76" width="380" height="170" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="230" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">改之前：一路跑到底</text>
  <rect x="62" y="112" width="336" height="28" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.1"/>
  <text x="230" y="131" text-anchor="middle" font-size="11" fill="#7f1d1d">查订单 → 付款 → 发通知，无人把关</text>
  <rect x="62" y="146" width="336" height="28" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="230" y="165" text-anchor="middle" font-size="11" fill="#b91c1c">一路冲到 END，扣错了才知道</text>
  <text x="230" y="198" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">结果：{'status': '已付款'}</text>
  <text x="230" y="222" text-anchor="middle" font-size="10" fill="#7f1d1d">invoke 一次就跑完，中间问不了人</text>

  <rect x="460" y="76" width="380" height="170" rx="9" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="650" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">改之后：付款里加 interrupt</text>
  <rect x="482" y="112" width="336" height="28" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.1"/>
  <text x="650" y="131" text-anchor="middle" font-size="11" fill="#065f46">查订单 → 付款(暂停问人) → 发通知</text>
  <rect x="482" y="146" width="336" height="42" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="650" y="164" text-anchor="middle" font-size="10" fill="#92400e">停下返回 __interrupt__</text>
  <text x="650" y="180" text-anchor="middle" font-size="10" fill="#92400e">next=('pay',) 状态还是原样</text>
  <text x="650" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">人批准后 Command(resume=) 继续</text>
  <text x="650" y="230" text-anchor="middle" font-size="10" fill="#065f46">要挂 checkpointer，带同一 thread_id</text>

  <rect x="40" y="264" width="800" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="440" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">这一跳的改动：节点里加一行 interrupt()，compile 挂上 checkpointer</text>
  <text x="440" y="306" text-anchor="middle" font-size="11" fill="#1e3a8a">实测返回：{'amount':100,'approved':'','__interrupt__':[Interrupt(value={'问':'...'}, id='...')]}</text>

  <rect x="40" y="330" width="385" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="232" y="351" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">这一跳还没解决</text>
  <text x="232" y="370" text-anchor="middle" font-size="10" fill="#475569">① 副作用放错位置会重复执行</text>

  <rect x="455" y="330" width="385" height="54" rx="8" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="647" y="351" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">下一跳要撞什么</text>
  <text x="647" y="370" text-anchor="middle" font-size="10" fill="#065f46">② update_state 填审批 → 反复中断的死循环</text>
</svg>
