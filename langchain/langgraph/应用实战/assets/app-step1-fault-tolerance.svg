<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">第 1 跳：给调用节点挂上重试</text>
  <text x="440" y="52" text-anchor="middle" font-size="12" fill="#6b7280">左右是同一个流程，区别只在"外部抖一下"之后会怎样</text>

  <rect x="40" y="76" width="380" height="180" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="230" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">改之前：抖一下整单就废</text>
  <rect x="62" y="112" width="336" height="28" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.1"/>
  <text x="230" y="131" text-anchor="middle" font-size="11" fill="#7f1d1d">节点抛错 -> 整跑退出</text>
  <rect x="62" y="146" width="336" height="70" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="230" y="166" text-anchor="middle" font-size="10" fill="#b91c1c">查库存 ✅ 已做完</text>
  <text x="230" y="184" text-anchor="middle" font-size="10" fill="#b91c1c">调风控 ❌ 抖了一下</text>
  <text x="230" y="202" text-anchor="middle" font-size="10" fill="#b91c1c">出结论 / 通知 —— 没轮到</text>
  <text x="230" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">客户只看到「处理失败」</text>

  <rect x="460" y="76" width="380" height="180" rx="9" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="650" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">改之后：抖的那一下自己重试</text>
  <rect x="482" y="112" width="336" height="28" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.1"/>
  <text x="650" y="131" text-anchor="middle" font-size="11" fill="#065f46">retry_policy=RetryPolicy(...)</text>
  <rect x="482" y="146" width="336" height="70" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="650" y="166" text-anchor="middle" font-size="10" fill="#065f46">查库存 ✅ 不受影响</text>
  <text x="650" y="184" text-anchor="middle" font-size="10" fill="#065f46">调风控 🔄 自己重试 3 次后成功</text>
  <text x="650" y="202" text-anchor="middle" font-size="10" fill="#065f46">出结论 / 通知 —— 照常走完</text>
  <text x="650" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">客户拿到完整结论</text>

  <rect x="40" y="274" width="800" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="440" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">这一跳的改动：一行 add_node(..., retry_policy=RetryPolicy(max_attempts=3))</text>
  <text x="440" y="316" text-anchor="middle" font-size="11" fill="#1e3a8a">只动出错的那个节点，别的节点一行不改 —— 这就是 per-node 配置的价值</text>

  <rect x="40" y="340" width="385" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="232" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">这一跳还没解决</text>
  <text x="232" y="378" text-anchor="middle" font-size="10" fill="#475569">① 抛 ValueError 时，配了也不重试</text>

  <rect x="455" y="340" width="385" height="48" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
  <text x="647" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">下一跳要撞什么</text>
  <text x="647" y="378" text-anchor="middle" font-size="10" fill="#78350f">② 同步节点配 timeout 直接编译失败</text>
</svg>
