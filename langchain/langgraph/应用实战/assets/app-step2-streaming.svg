<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">第 3 跳：多模式分工 + 前端消费</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#6b7280">高亮为本跳新增：子图进度要冒泡、custom 要声明、前端按 type 分流</text>

  <!-- 图 -->
  <rect x="30" y="70" width="180" height="150" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="120" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">父图（主流程）</text>
  <rect x="48" y="104" width="144" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="120" y="124" text-anchor="middle" font-size="10" fill="#1e40af">检索</text>
  <rect x="48" y="140" width="144" height="30" rx="6" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.4"/>
  <text x="120" y="160" text-anchor="middle" font-size="10" fill="#3730a3">生成（含子图）</text>
  <rect x="48" y="176" width="144" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="120" y="196" text-anchor="middle" font-size="10" fill="#1e40af">校对</text>

  <path d="M210 145 L248 145" stroke="#6366f1" stroke-width="2" marker-end="url(#c1)"/>

  <!-- 子图 -->
  <rect x="248" y="70" width="180" height="150" rx="9" fill="#faf5ff" stroke="#c084fc" stroke-width="1.6"/>
  <text x="338" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">子图（本跳新增可见性）</text>
  <rect x="266" y="104" width="144" height="26" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.1"/>
  <text x="338" y="122" text-anchor="middle" font-size="10" fill="#475569">查资料</text>
  <rect x="266" y="136" width="144" height="26" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.1"/>
  <text x="338" y="154" text-anchor="middle" font-size="10" fill="#475569">写草稿</text>
  <rect x="266" y="168" width="144" height="36" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="338" y="182" text-anchor="middle" font-size="9" fill="#92400e">writer 喊话</text>
  <text x="338" y="196" text-anchor="middle" font-size="9" fill="#92400e">"还差一半"</text>

  <path d="M428 145 L466 145" stroke="#6366f1" stroke-width="2" marker-end="url(#c1)"/>

  <!-- 一次 stream 调用 -->
  <rect x="466" y="70" width="200" height="150" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="566" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">一次 stream 调用</text>
  <text x="566" y="114" text-anchor="middle" font-size="10" fill="#065f46">subgraphs=True</text>
  <rect x="484" y="124" width="164" height="82" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="566" y="144" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">stream_mode=[</text>
  <text x="566" y="160" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">  "updates",</text>
  <text x="566" y="176" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">  "custom",</text>
  <text x="566" y="192" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">]</text>

  <path d="M666 145 L704 145" stroke="#6366f1" stroke-width="2" marker-end="url(#c1)"/>

  <!-- 前端 -->
  <rect x="704" y="70" width="166" height="150" rx="9" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="787" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">前端（本跳新增）</text>
  <rect x="722" y="104" width="130" height="26" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.1"/>
  <text x="787" y="122" text-anchor="middle" font-size="9" fill="#7c2d12">updates → 步骤条</text>
  <rect x="722" y="136" width="130" height="26" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.1"/>
  <text x="787" y="154" text-anchor="middle" font-size="9" fill="#7c2d12">custom → 进度条</text>
  <rect x="722" y="168" width="130" height="36" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="787" y="182" text-anchor="middle" font-size="9" fill="#92400e">ns 非空</text>
  <text x="787" y="196" text-anchor="middle" font-size="9" fill="#92400e">→ 标"子图内"</text>

  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- 三条铁律 -->
  <rect x="30" y="240" width="840" height="120" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="450" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">⚠ 这一跳必须记住的三条（全是实测撞出来的静默失败）</text>

  <rect x="50" y="276" width="256" height="70" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.1"/>
  <text x="178" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">① 不声明 custom = 丢弃</text>
  <text x="178" y="316" text-anchor="middle" font-size="10" fill="#7f1d1d">节点里 writer 写了，前端一个字</text>
  <text x="178" y="332" text-anchor="middle" font-size="10" fill="#7f1d1d">都收不到，且不报错</text>

  <rect x="322" y="276" width="256" height="70" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.1"/>
  <text x="450" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">② 子图动静要 subgraphs</text>
  <text x="450" y="316" text-anchor="middle" font-size="10" fill="#7f1d1d">默认子图全程隐身</text>
  <text x="450" y="332" text-anchor="middle" font-size="10" fill="#7f1d1d">custom 数据也靠它才冒泡</text>

  <rect x="594" y="276" width="256" height="70" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.1"/>
  <text x="722" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">③ v2 结构要取 data</text>
  <text x="722" y="316" text-anchor="middle" font-size="10" fill="#7f1d1d">默认吐 {'type','ns','data'}</text>
  <text x="722" y="332" text-anchor="middle" font-size="10" fill="#7f1d1d">别当裸字典用</text>

  <!-- 底部 -->
  <rect x="30" y="372" width="410" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="235" y="394" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">比第 2 跳多了什么</text>
  <text x="235" y="414" text-anchor="middle" font-size="10" fill="#475569">子图内部可见、进度可自定义</text>
  <text x="235" y="432" text-anchor="middle" font-size="10" fill="#475569">前端一套流同时驱动步骤条与进度条</text>
  <text x="235" y="449" text-anchor="middle" font-size="10" fill="#475569">ns 非空即"来自子图"，可直接标注</text>

  <rect x="460" y="372" width="410" height="88" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="665" y="394" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">生产上还要补（非本课）</text>
  <text x="665" y="414" text-anchor="middle" font-size="10" fill="#1e3a8a">SSE / WebSocket 推送、断线重连</text>
  <text x="665" y="432" text-anchor="middle" font-size="10" fill="#1e3a8a">背压与节流、鉴权、消息序号与幂等</text>
  <text x="665" y="449" text-anchor="middle" font-size="10" fill="#1e3a8a">（课 13 部署时展开）</text>
</svg>
