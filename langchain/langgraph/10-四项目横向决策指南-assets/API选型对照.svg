<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="470" fill="#fbfcfe"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2b45">Graph API vs Functional API</text>
  <text x="450" y="47" text-anchor="middle" font-size="11" fill="#6b7d94">实测对照（langgraph 1.2.11）· 同样的流程，两种写法的差异</text>

  <!-- 表头 -->
  <rect x="40" y="66" width="170" height="34" rx="6" fill="#e8eef5" stroke="#c3d2e2" stroke-width="1"/>
  <text x="125" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a2b45">维度</text>
  <rect x="212" y="66" width="320" height="34" rx="6" fill="#eef8f0" stroke="#4f9d69" stroke-width="1.4"/>
  <text x="372" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f5c33">Graph API</text>
  <rect x="534" y="66" width="326" height="34" rx="6" fill="#f3e8fb" stroke="#8b5cc7" stroke-width="1.4"/>
  <text x="697" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6a3d9a">Functional API</text>

  <!-- 行数据 -->
  <!-- 状态形态 -->
  <rect x="40" y="102" width="170" height="42" rx="0" fill="#f7fafd" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="52" y="127" font-size="10.5" font-weight="600" fill="#2c4a6e">状态形态</text>
  <rect x="212" y="102" width="320" height="42" fill="#fbfdfc" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="224" y="120" font-size="9.5" font-family="monospace" fill="#2f5c33">{"log":[...],"amount":300}</text>
  <text x="224" y="136" font-size="9.5" fill="#4a7a5a">具名字段，一眼看清</text>
  <rect x="534" y="102" width="326" height="42" fill="#fdfbfe" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="546" y="120" font-size="9.5" font-family="monospace" fill="#6a3d9a">3</text>
  <text x="546" y="136" font-size="9.5" fill="#7a5aa0">整体一个值，没有字段名</text>

  <!-- 历史条数 -->
  <rect x="40" y="146" width="170" height="42" fill="#f7fafd" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="52" y="171" font-size="10.5" font-weight="600" fill="#2c4a6e">历史条数（实测）</text>
  <rect x="212" y="146" width="320" height="42" fill="#eef8f0" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="224" y="164" font-size="10" font-weight="700" fill="#1f5c33">2 节点 → 4 条</text>
  <text x="224" y="180" font-size="9.5" fill="#4a7a5a">每步一个存档点，可逐格回放</text>
  <rect x="534" y="146" width="326" height="42" fill="#f3e8fb" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="546" y="164" font-size="10" font-weight="700" fill="#6a3d9a">同流程 → 只有 2 条</text>
  <text x="546" y="180" font-size="9.5" fill="#7a5aa0">排障看不出「卡在第几步」</text>

  <!-- 逐格修改 -->
  <rect x="40" y="190" width="170" height="42" fill="#f7fafd" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="52" y="215" font-size="10.5" font-weight="600" fill="#2c4a6e">逐格修改</text>
  <rect x="212" y="190" width="320" height="42" fill="#eef8f0" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="224" y="208" font-size="10" font-weight="700" fill="#1f5c33">✅ update_state 改单字段</text>
  <text x="224" y="224" font-size="9.5" fill="#4a7a5a">运营能手动修正某一格</text>
  <rect x="534" y="190" width="326" height="42" fill="#fdeeee" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="546" y="208" font-size="10" font-weight="700" fill="#8a2020">❌ 只能整体替换返回值</text>
  <text x="546" y="224" font-size="9.5" fill="#7a5050">「把第3行 city 改北京」做不到</text>

  <!-- config -->
  <rect x="40" y="234" width="170" height="42" fill="#f7fafd" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="52" y="259" font-size="10.5" font-weight="600" fill="#2c4a6e">config 必填？</text>
  <rect x="212" y="234" width="320" height="42" fill="#fbfdfc" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="224" y="252" font-size="10" fill="#2f5c33">❌ 不传也能跑</text>
  <text x="224" y="268" font-size="9.5" fill="#4a7a5a">（但没 checkpointer 就无存档）</text>
  <rect x="534" y="234" width="326" height="42" fill="#fdeeee" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="546" y="252" font-size="10" font-weight="700" fill="#8a2020">✅ 不传直接 ValueError</text>
  <text x="546" y="268" font-size="9.5" fill="#7a5050">挂了 checkpointer 就必须传</text>

  <!-- 并发 -->
  <rect x="40" y="278" width="170" height="42" fill="#f7fafd" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="52" y="303" font-size="10.5" font-weight="600" fill="#2c4a6e">并发写法</text>
  <rect x="212" y="278" width="320" height="42" fill="#fbfdfc" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="224" y="296" font-size="9.5" font-family="monospace" fill="#2f5c33">Send("node", payload)</text>
  <text x="224" y="312" font-size="9.5" fill="#4a7a5a">动态扇出，子图隔离</text>
  <rect x="534" y="278" width="326" height="42" fill="#fdfbfe" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="546" y="296" font-size="9.5" font-family="monospace" fill="#6a3d9a">fs=[t(x) for x in xs]; [f.result()...]</text>
  <text x="546" y="312" font-size="9.5" fill="#7a5aa0">先全提交再统一收（实测 2 倍）</text>

  <!-- 恢复重跑 -->
  <rect x="40" y="322" width="170" height="52" fill="#f7fafd" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="52" y="342" font-size="10.5" font-weight="600" fill="#2c4a6e">resume 时</text>
  <text x="52" y="358" font-size="10.5" font-weight="600" fill="#2c4a6e">重跑什么</text>
  <rect x="212" y="322" width="320" height="52" fill="#fff5e6" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="224" y="342" font-size="10" font-weight="700" fill="#8a5d0c">整个节点重跑</text>
  <text x="224" y="358" font-size="9.5" fill="#8a6a3a">实测：节点执行 2 次</text>
  <text x="224" y="370" font-size="9.5" fill="#8a6a3a">→ 副作用必须放 interrupt 之后</text>
  <rect x="534" y="322" width="326" height="52" fill="#fff5e6" stroke="#c3d2e2" stroke-width="0.8"/>
  <text x="546" y="342" font-size="10" font-weight="700" fill="#8a5d0c">含 interrupt 那次重跑</text>
  <text x="546" y="358" font-size="9.5" fill="#2f7a48">但已完成的 @task 不重跑 ✅</text>
  <text x="546" y="370" font-size="9.5" fill="#7a5050">普通函数一律重跑 ❌</text>

  <!-- 底部结论 -->
  <rect x="40" y="392" width="820" height="58" rx="8" fill="#eef4fb" stroke="#4a7fb5" stroke-width="1.3"/>
  <text x="60" y="412" font-size="11" font-weight="700" fill="#2c5282">判据一句话：中间过程要不要被单独看见和逐格修改？</text>
  <text x="60" y="429" font-size="9.5" fill="#3d6a94">要（单独重跑某行 / 手动改字段 / 看每步中间结果 / 靠图拓扑当文档）→ Graph</text>
  <text x="60" y="444" font-size="9.5" fill="#3d6a94">不要（已有脚本改造 / 控制流直 / 只关心最终产出）→ Functional，省一大半样板</text>

  <defs/>
</svg>
