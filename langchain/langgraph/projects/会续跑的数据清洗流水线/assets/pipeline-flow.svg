<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="470" fill="#fbfcfe"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2b45">会续跑的数据清洗流水线</text>
  <text x="450" y="48" text-anchor="middle" font-size="11.5" fill="#6b7d94">@entrypoint 主流程 · @task 结果进存档点 · interrupt 卡住 · Command(resume) 续跑</text>

  <!-- entrypoint 容器 -->
  <rect x="40" y="76" width="820" height="300" rx="12" fill="#f7fafd" stroke="#4a7fb5" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="60" y="98" font-size="11.5" font-weight="700" fill="#2c5282">@entrypoint(checkpointer=InMemorySaver())  ·  pipeline</text>
  <text x="60" y="114" font-size="9.5" fill="#6b7d94">控制流就是普通 Python：先全提交 → 再统一收 → 卡住 → 续跑</text>

  <!-- ① 并发清洗 -->
  <rect x="66" y="130" width="180" height="76" rx="8" fill="#eef6fc" stroke="#4a7fb5" stroke-width="1.4"/>
  <text x="156" y="150" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2b45">① 并发清洗</text>
  <text x="156" y="167" text-anchor="middle" font-size="9.5" font-mono="true" fill="#4a7fb5">[clean_row(r) for r in rows]</text>
  <text x="156" y="182" text-anchor="middle" font-size="9.5" fill="#5b6b80">@task · 结果进存档点</text>
  <text x="156" y="197" text-anchor="middle" font-size="9" fill="#2f7a48">✓ resume 不重跑</text>

  <!-- ② 异常检测 -->
  <rect x="266" y="130" width="180" height="76" rx="8" fill="#eef6fc" stroke="#4a7fb5" stroke-width="1.4"/>
  <text x="356" y="150" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2b45">② 异常检测</text>
  <text x="356" y="167" text-anchor="middle" font-size="9.5" font-mono="true" fill="#4a7fb5">detect_outliers(...)</text>
  <text x="356" y="182" text-anchor="middle" font-size="9.5" fill="#5b6b80">@task · 标记不删</text>
  <text x="356" y="197" text-anchor="middle" font-size="9" fill="#2f7a48">✓ resume 不重跑</text>

  <!-- ③ interrupt -->
  <rect x="466" y="130" width="180" height="76" rx="8" fill="#fff5e6" stroke="#d98a2b" stroke-width="1.6"/>
  <text x="556" y="150" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a5d0c">③ interrupt 卡住</text>
  <text x="556" y="167" text-anchor="middle" font-size="9.5" fill="#8a5d0c">有需确认的行 → 暂停</text>
  <text x="556" y="182" text-anchor="middle" font-size="9.5" fill="#8a6a3a">等人工裁决</text>
  <text x="556" y="197" text-anchor="middle" font-size="9" fill="#a07030">⏸ 整条流水线挂起</text>

  <!-- ④ 人工 -->
  <rect x="666" y="130" width="170" height="76" rx="8" fill="#f3e8fb" stroke="#8b5cc7" stroke-width="1.4"/>
  <text x="751" y="150" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6a3d9a">④ 人工裁决</text>
  <text x="751" y="167" text-anchor="middle" font-size="9.5" fill="#6a3d9a">accept / reject</text>
  <text x="751" y="182" text-anchor="middle" font-size="9" fill="#7a5aa0">list[dict] 形态传</text>
  <text x="751" y="197" text-anchor="middle" font-size="8.5" fill="#a07030">⚠ dict[int,...] 会 TypeError</text>

  <path d="M248 168 L264 168" stroke="#8aa4bf" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M448 168 L464 168" stroke="#8aa4bf" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M648 168 L664 168" stroke="#d98a2b" stroke-width="1.4" fill="none" marker-end="url(#o)"/>

  <!-- resume 回路 -->
  <path d="M751 208 L751 250 L556 250 L556 208" stroke="#8b5cc7" stroke-width="1.6" fill="none" marker-end="url(#p)"/>
  <text x="653" y="266" text-anchor="middle" font-size="10" font-weight="600" fill="#6a3d9a">Command(resume=[...]) 续跑</text>
  <text x="653" y="280" text-anchor="middle" font-size="9" fill="#7a5aa0">①② 从存档点取，不重算；③ 重跑</text>

  <!-- ⑤ 汇总 -->
  <rect x="266" y="296" width="280" height="52" rx="8" fill="#eef8f0" stroke="#4f9d69" stroke-width="1.5"/>
  <text x="406" y="316" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f5c33">⑤ 应用裁决 + 出报告</text>
  <text x="406" y="333" text-anchor="middle" font-size="9.5" fill="#2f7a48">PipelineResult：成功 / 失败 / 各阶段统计</text>

  <path d="M556 208 L556 296 L546 296" stroke="#8aa4bf" stroke-width="1.4" fill="none"/>
  <path d="M406 250 L406 294" stroke="#8aa4bf" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

  <!-- 存档点 -->
  <rect x="600" y="296" width="236" height="52" rx="8" fill="#fff8e8" stroke="#d9b34a" stroke-width="1.3"/>
  <text x="718" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#8a6a0c">存档点（checkpoint）</text>
  <text x="718" y="333" text-anchor="middle" font-size="9" fill="#8a6a3a">只存 @task 结果 · 无具名字段</text>

  <!-- 底部实测注记 -->
  <rect x="40" y="384" width="820" height="62" rx="8" fill="#fff8e8" stroke="#e0c090" stroke-width="1.2"/>
  <text x="60" y="403" font-size="10.5" font-weight="700" fill="#8a5d0c">🔬 实测结论（langgraph 1.2.11）</text>
  <text x="60" y="419" font-size="9.5" fill="#8a6a3a">· resume 时：已完成的 @task 不重跑 ✅ ｜ 含 interrupt 的那次执行会重跑（它需要人工输入才能算出结果）</text>
  <text x="60" y="432" font-size="9.5" fill="#8a6a3a">· 普通函数（未标 @task）resume 时一律重跑 —— 「哪些活不白干」完全由 @task 决定</text>
  <text x="60" y="443" font-size="9.5" fill="#8a6a3a">· 挂了 checkpointer 后 config 必填（ValueError）｜ 历史只有 2 条（Graph API 同流程 4 条）</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8aa4bf"/></marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d98a2b"/></marker>
    <marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b5cc7"/></marker>
  </defs>
</svg>
