<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">同样配了 retry，为什么一个重试一个不重试</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#6b7280">两边代码只差一行：抛的异常类型不同</text>

  <rect x="30" y="72" width="400" height="230" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="230" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">✅ 抛 TransientUpstreamError</text>
  <rect x="52" y="112" width="356" height="76" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="230" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">外部抖一下，用可重试的异常表达</text>
  <text x="230" y="154" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#047857">raise TransientUpstreamError</text>
  <text x="230" y="174" text-anchor="middle" font-size="9" fill="#047857">（自定义异常，default_retry_on 判 True）</text>
  <text x="230" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">实测：风控调用 3 次，最后成功</text>
  <text x="230" y="234" text-anchor="middle" font-size="10" fill="#065f46">第 1、2 次抖 → 自动重试 → 第 3 次通</text>
  <text x="230" y="256" text-anchor="middle" font-size="10" fill="#065f46">用户完全感知不到抖过</text>
  <text x="230" y="282" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">工单：通过</text>

  <rect x="470" y="72" width="400" height="230" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="670" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">❌ 抛 ValueError</text>
  <rect x="492" y="112" width="356" height="76" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="670" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">同样是抖，却用了"代码 bug"的异常</text>
  <text x="670" y="154" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#7f1d1d">raise ValueError</text>
  <text x="670" y="174" text-anchor="middle" font-size="9" fill="#7f1d1d">（default_retry_on 判 False：当你是 bug）</text>
  <text x="670" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">实测：只调 1 次，直接炸</text>
  <text x="670" y="234" text-anchor="middle" font-size="10" fill="#7f1d1d">RetryPolicy(max_attempts=3) 写了等于没写</text>
  <text x="670" y="256" text-anchor="middle" font-size="10" fill="#7f1d1d">整单失败，用户看到报错</text>
  <text x="670" y="282" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">工单：ValueError 抛出</text>

  <rect x="30" y="318" width="840" height="86" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="450" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">根因：retry_policy 是否生效，取决于"异常类型"而不是"你有没有配"</text>
  <text x="450" y="362" text-anchor="middle" font-size="10" fill="#475569">default_retry_on 的判断：ValueError / TypeError / RuntimeError / OSError → 当代码 bug，不重试</text>
  <text x="450" y="380" text-anchor="middle" font-size="10" fill="#475569">ConnectionError / 自定义异常 → 当外部抖动，重试</text>
  <text x="450" y="398" text-anchor="middle" font-size="10" fill="#475569">所以「外部接口」必须自己定义异常类型，别顺手 raise ValueError（回指：阶段 3 · 课 10）</text>
</svg>
