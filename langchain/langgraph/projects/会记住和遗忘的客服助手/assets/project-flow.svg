<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="470" fill="#fbfcfe"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2b45">会记住和遗忘的客服助手 · 主流程</text>
  <text x="450" y="48" text-anchor="middle" font-size="11.5" fill="#6b7d94">State 只装"这一轮" · Store 装"跨会话的档案" · 两者作用域不同</text>

  <!-- 左：图（thread 作用域） -->
  <rect x="26" y="72" width="330" height="330" rx="10" fill="#f3f8fd" stroke="#b9d4ec" stroke-width="1.4"/>
  <text x="191" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#22507e">图内部（thread 作用域）</text>
  <text x="191" y="111" text-anchor="middle" font-size="10.5" fill="#6b7d94">每一轮会话一个 thread_id</text>

  <rect x="52" y="130" width="150" height="46" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="127" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2b45">recall</text>
  <text x="127" y="167" text-anchor="middle" font-size="10" fill="#6b7d94">回忆（读 Store）</text>

  <rect x="52" y="196" width="150" height="46" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="127" y="216" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2b45">extract</text>
  <text x="127" y="233" text-anchor="middle" font-size="10" fill="#6b7d94">抽取 + 冲突检测</text>

  <rect x="52" y="262" width="150" height="46" rx="8" fill="#fff5e6" stroke="#d9a13b" stroke-width="1.5"/>
  <text x="127" y="282" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8a5d0c">confirm</text>
  <text x="127" y="299" text-anchor="middle" font-size="10" fill="#8a5d0c">interrupt 卡住</text>

  <rect x="52" y="328" width="150" height="46" rx="8" fill="#eef8f0" stroke="#4f9d69" stroke-width="1.5"/>
  <text x="127" y="348" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f5c33">write</text>
  <text x="127" y="365" text-anchor="middle" font-size="10" fill="#2f7a48">写档（唯一写入点）</text>

  <!-- 条件边分支 -->
  <path d="M202 219 L246 219" stroke="#8aa4bf" stroke-width="1.4" fill="none"/>
  <text x="249" y="216" font-size="10" fill="#5b6b80">risk?</text>
  <path d="M249 219 L292 219 L292 285 L206 285" stroke="#d9a13b" stroke-width="1.4" fill="none" marker-end="url(#ma)"/>
  <text x="300" y="252" font-size="9.5" fill="#8a5d0c">是→confirm</text>
  <path d="M249 219 L292 219 L292 351 L206 351" stroke="#4f9d69" stroke-width="1.4" fill="none" marker-end="url(#ma)"/>
  <text x="298" y="330" font-size="9.5" fill="#2f7a48">否→write</text>

  <path d="M127 176 L127 196" stroke="#8aa4bf" stroke-width="1.4" fill="none" marker-end="url(#ma)"/>
  <path d="M127 242 L127 262" stroke="#8aa4bf" stroke-width="1.4" fill="none" marker-end="url(#ma)"/>
  <path d="M127 308 L127 328" stroke="#8aa4bf" stroke-width="1.4" fill="none" marker-end="url(#ma)"/>

  <circle cx="127" cy="120" r="4" fill="#4a7fb5"/>
  <text x="141" y="124" font-size="10" fill="#5b6b80">START</text>

  <!-- 右：Store（user 作用域） -->
  <rect x="386" y="72" width="240" height="330" rx="10" fill="#fdf6f0" stroke="#e8c39e" stroke-width="1.4"/>
  <text x="506" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5d0c">Store（user 作用域）</text>
  <text x="506" y="111" text-anchor="middle" font-size="10.5" fill="#8a5d0c">按 user_id 分格 · 跨会话共享</text>

  <rect x="406" y="130" width="200" height="62" rx="8" fill="#fff" stroke="#d9a13b" stroke-width="1.3"/>
  <text x="506" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5d0c">语义记忆 · profile</text>
  <text x="506" y="167" text-anchor="middle" font-size="10" fill="#7a6a50">一份档案 · 固定 key</text>
  <text x="506" y="182" text-anchor="middle" font-size="9.5" fill="#9a8a70">(u1, profile) / "profile"</text>

  <rect x="406" y="206" width="200" height="62" rx="8" fill="#fff" stroke="#d9a13b" stroke-width="1.3"/>
  <text x="506" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5d0c">情景记忆 · episodes</text>
  <text x="506" y="243" text-anchor="middle" font-size="10" fill="#7a6a50">一条条经历 · 追加</text>
  <text x="506" y="258" text-anchor="middle" font-size="9.5" fill="#9a8a70">(u1, episodes) / ep-ts-N</text>

  <rect x="406" y="282" width="200" height="62" rx="8" fill="#fff" stroke="#d9a13b" stroke-width="1.3"/>
  <text x="506" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5d0c">程序记忆 · rules</text>
  <text x="506" y="319" text-anchor="middle" font-size="10" fill="#7a6a50">生效的规矩 · filter</text>
  <text x="506" y="334" text-anchor="middle" font-size="9.5" fill="#9a8a70">(u1, rules) / enabled=True</text>

  <rect x="406" y="356" width="200" height="34" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="506" y="377" text-anchor="middle" font-size="10.5" fill="#8a5d0c">⚠ InMemoryStore 不支持 TTL</text>

  <!-- 读写箭头 -->
  <path d="M202 146 L292 146 L292 158 L406 158" stroke="#d9a13b" stroke-width="1.5" fill="none" marker-end="url(#mo)"/>
  <text x="300" y="140" font-size="9.5" fill="#8a5d0c">读</text>
  <path d="M406 351 L292 351 L292 351 L206 351" stroke="#4f9d69" stroke-width="1.5" fill="none" marker-end="url(#mg)"/>
  <text x="300" y="345" font-size="9.5" fill="#2f7a48">写</text>

  <!-- 人工 -->
  <rect x="656" y="252" width="218" height="80" rx="10" fill="#f6f2fb" stroke="#b39ddb" stroke-width="1.4"/>
  <text x="765" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5e35b1">人工裁决</text>
  <text x="765" y="293" text-anchor="middle" font-size="10.5" fill="#6b5b8a">confirm 照写 / reject 丢弃</text>
  <text x="765" y="309" text-anchor="middle" font-size="10.5" fill="#6b5b8a">keep 保留旧值</text>
  <text x="765" y="324" text-anchor="middle" font-size="10" fill="#8a7aa8">Command(resume=...)</text>

  <path d="M656 288 L646 288" stroke="#b39ddb" stroke-width="1.4" fill="none"/>
  <path d="M626 288 L206 288" stroke="#b39ddb" stroke-width="1.4" fill="none" marker-end="url(#mp)"/>
  <text x="400" y="424" text-anchor="middle" font-size="10" fill="#6b5b8a">▲ 实测：resume 不重放 confirm 之前的节点，Store 不会重复写</text>

  <defs>
    <marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8aa4bf"/></marker>
    <marker id="mo" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d9a13b"/></marker>
    <marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4f9d69"/></marker>
    <marker id="mp" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b39ddb"/></marker>
  </defs>
</svg>
