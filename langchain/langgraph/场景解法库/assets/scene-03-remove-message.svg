<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="320" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 A：RemoveMessage 写回 channel（真正缩小 state）</text>

  <g>
    <rect x="30" y="62" width="170" height="70" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="1.8"/>
    <text x="115" y="86" font-size="12" text-anchor="middle" fill="#1a1a1a">修复前：只裁剪 prompt</text>
    <text x="115" y="103" font-size="10" text-anchor="middle" fill="#555">trim_messages(...) 拼给模型</text>
    <text x="115" y="119" font-size="10" text-anchor="middle" fill="#555">channel 里仍是全量</text>
    <text x="115" y="132" font-size="10" text-anchor="middle" fill="#c0392b">✗ state 一点没小</text>
  </g>

  <path d="M200 97 L250 97" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="250" y="56" width="200" height="82" rx="9" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.8"/>
    <text x="350" y="78" font-size="12" text-anchor="middle" fill="#1a1a1a">修复后：写回 channel</text>
    <text x="350" y="96" font-size="10" text-anchor="middle" fill="#555">return {"messages":</text>
    <text x="350" y="111" font-size="10" text-anchor="middle" fill="#555">  [RemoveMessage(id=m.id)</text>
    <text x="350" y="126" font-size="10" text-anchor="middle" fill="#555">   for m in old_msgs]}</text>
  </g>
  <path d="M450 97 L510 97" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="510" y="56" width="180" height="82" rx="9" fill="#f2ecf9" stroke="#7a5ea8" stroke-width="1.8"/>
    <text x="600" y="78" font-size="12" text-anchor="middle" fill="#1a1a1a">add_messages reducer</text>
    <text x="600" y="95" font-size="10" text-anchor="middle" fill="#555">识别 RemoveMessage 哨兵</text>
    <text x="600" y="111" font-size="10" text-anchor="middle" fill="#555">从 channel 删除对应 id</text>
    <text x="600" y="126" font-size="10" text-anchor="middle" fill="#555">快照随之变小</text>
  </g>
  <path d="M690 97 L740 97" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="740" y="66" width="130" height="62" rx="9" fill="#dceefb" stroke="#2b7cba" stroke-width="1.5"/>
    <text x="805" y="88" font-size="12" text-anchor="middle" fill="#1a1a1a">checkpoint 变小</text>
    <text x="805" y="105" font-size="10" text-anchor="middle" fill="#555">checkpoint_blobs</text>
    <text x="805" y="120" font-size="10" text-anchor="middle" fill="#555">不再线性膨胀</text>
  </g>

  <g>
    <rect x="30" y="180" width="830" height="60" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="46" y="200" font-size="12" font-weight="700" fill="#c0392b">✗ 失效点</text>
    <text x="46" y="218" font-size="11.5" fill="#1a1a1a">1. 历史 checkpoint 不会回溯变小——已写入的旧快照仍是原大小（只影响新快照）</text>
    <text x="46" y="234" font-size="11.5" fill="#1a1a1a">2. 删掉的上下文回不来：若后续节点需要引用早期消息，模型会「失忆」</text>
  </g>

  <g>
    <rect x="30" y="252" width="830" height="56" rx="9" fill="#fff8e6" stroke="#c99a1e" stroke-width="1.5"/>
    <text x="46" y="272" font-size="11.5" fill="#1a1a1a">💡 关键认知：在节点内调 trim_messages 只为「给模型看」——不写回 channel 就对 state 大小零影响</text>
    <text x="46" y="290" font-size="11.5" fill="#1a1a1a">（这是本场景最常见的伪修复）</text>
  </g>

  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
</svg>
