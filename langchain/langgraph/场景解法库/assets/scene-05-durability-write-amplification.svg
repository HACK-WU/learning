<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="330" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 B：控制写入量（durability 参数决定「写几次」）</text>

  <g>
    <rect x="30" y="58" width="200" height="86" rx="9" fill="#f2ecf9" stroke="#7a5ea8" stroke-width="1.8"/>
    <text x="130" y="80" font-size="12" text-anchor="middle" fill="#1a1a1a">durability="sync"</text>
    <text x="130" y="100" font-size="10" text-anchor="middle" fill="#555">每步写，且等落盘返回</text>
    <text x="130" y="118" font-size="10" text-anchor="middle" fill="#555">最安全 / 最慢</text>
    <text x="130" y="134" font-size="10" text-anchor="middle" fill="#555">写入量：N 步 = N 次</text>
  </g>

  <g>
    <rect x="260" y="58" width="200" height="86" rx="9" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="2.2"/>
    <text x="360" y="80" font-size="12" text-anchor="middle" fill="#1a1a1a">durability="async"</text>
    <text x="360" y="100" font-size="10" text-anchor="middle" fill="#1a1a1a">与下一步并发写</text>
    <text x="360" y="118" font-size="10" text-anchor="middle" fill="#555">不等返回 → 延迟低</text>
    <text x="360" y="134" font-size="10" text-anchor="middle" fill="#555">写入量：仍 N 次（不减量）</text>
  </g>

  <g>
    <rect x="490" y="58" width="200" height="86" rx="9" fill="#fff6d9" stroke="#c99a1e" stroke-width="1.8"/>
    <text x="590" y="80" font-size="12" text-anchor="middle" fill="#1a1a1a">durability="exit"</text>
    <text x="590" y="100" font-size="10" text-anchor="middle" fill="#1a1a1a">只在整跑结束时写</text>
    <text x="590" y="118" font-size="10" text-anchor="middle" fill="#555">写入量：1 次（最少）</text>
    <text x="590" y="134" font-size="10" text-anchor="middle" fill="#c0392b">崩溃 = 整跑白做</text>
  </g>

  <g>
    <rect x="720" y="58" width="150" height="86" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
    <text x="795" y="80" font-size="12" text-anchor="middle" fill="#1a1a1a">子图</text>
    <text x="795" y="100" font-size="10" text-anchor="middle" fill="#555">独立 checkpoint_ns</text>
    <text x="795" y="116" font-size="10" text-anchor="middle" fill="#555">写入量再翻倍</text>
    <text x="795" y="134" font-size="10" text-anchor="middle" fill="#555">（课 10）</text>
  </g>

  <path d="M130 144 L130 180" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M360 144 L360 180" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M590 144 L590 180" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="30" y="180" width="840" height="48" rx="9" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="450" y="202" font-size="12" text-anchor="middle" fill="#1a1a1a">权衡轴：写入次数 ↔ 崩溃时可恢复的粒度</text>
    <text x="450" y="218" font-size="10.5" text-anchor="middle" fill="#555">exit 省 90% 写入，但中途崩 = 从零开始；含人工审批的图绝不能用 exit</text>
  </g>

  <g>
    <rect x="30" y="240" width="835" height="52" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="46" y="260" font-size="12" font-weight="700" fill="#c0392b">✗ 失效点</text>
    <text x="46" y="278" font-size="11.5" fill="#1a1a1a">1. exit 模式下 interrupt 无法恢复（没有中间快照可续）——含审批的图直接不可用</text>
    <text x="46" y="292" font-size="11.5" fill="#1a1a1a">2. 默认值随版本变化，必须实测确认，不能凭记忆写</text>
  </g>

  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
</svg>
