<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="300" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 A：纯幂等键（调用方生成，服务端查重）</text>

  <g>
    <rect x="30" y="60" width="120" height="52" rx="8" fill="#dceefb" stroke="#2b7cba" stroke-width="1.5"/>
    <text x="90" y="82" font-size="12" text-anchor="middle" fill="#1a1a1a">进入打款节点</text>
    <text x="90" y="99" font-size="10" text-anchor="middle" fill="#555">携带幂等键</text>
  </g>
  <path d="M150 86 L200 86" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="200" y="56" width="140" height="60" rx="8" fill="#fff6d9" stroke="#c99a1e" stroke-width="1.5"/>
    <text x="270" y="78" font-size="12" text-anchor="middle" fill="#1a1a1a">查已执行表</text>
    <text x="270" y="95" font-size="10" text-anchor="middle" fill="#555">SELECT ... WHERE key=?</text>
    <text x="270" y="110" font-size="10" text-anchor="middle" fill="#555">（唯一索引）</text>
  </g>
  <path d="M340 86 L398 86" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="369" y="78" font-size="10" text-anchor="middle" fill="#555">存在?</text>

  <g>
    <polygon points="398,86 470,52 542,86 470,120" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="470" y="83" font-size="12" text-anchor="middle" fill="#1a1a1a">命中 → 直接返回</text>
    <text x="470" y="99" font-size="10" text-anchor="middle" fill="#555">不重复打款</text>
  </g>
  <path d="M542 86 L610 86" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="610" y="62" width="120" height="48" rx="8" fill="#dceefb" stroke="#2b7cba" stroke-width="1.5"/>
    <text x="670" y="82" font-size="12" text-anchor="middle" fill="#1a1a1a">未命中</text>
    <text x="670" y="98" font-size="10" text-anchor="middle" fill="#555">打款 + 记键</text>
  </g>

  <g>
    <rect x="30" y="170" width="700" height="96" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="46" y="194" font-size="13" font-weight="700" fill="#c0392b">✗ 失效点</text>
    <text x="46" y="216" font-size="11.5" fill="#1a1a1a">1. 打款成功但「记键」失败 → 下次重试仍会再打一次（非原子）</text>
    <text x="46" y="236" font-size="11.5" fill="#1a1a1a">2. 并发同一键同时未命中 → 都去打款（查与写之间有窗口）</text>
    <text x="46" y="256" font-size="11.5" fill="#1a1a1a">3. 幂等键只挡「同一笔」，挡不住「金额被改过」的重复提交</text>
  </g>

  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
</svg>
