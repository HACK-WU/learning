<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="330" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 B：粘性会话（同一 thread 固定打到一个实例）</text>

  <g>
    <rect x="30" y="58" width="160" height="52" rx="8" fill="#dceefb" stroke="#2b7cba" stroke-width="1.5"/>
    <text x="110" y="80" font-size="12" text-anchor="middle" fill="#1a1a1a">请求（thread=T）</text>
    <text x="110" y="96" font-size="10" text-anchor="middle" fill="#555">hash(T) → 固定实例</text>
  </g>
  <path d="M190 84 L240 84" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="240" y="52" width="170" height="64" rx="9" fill="#fff6d9" stroke="#c99a1e" stroke-width="1.8"/>
    <text x="325" y="74" font-size="12" text-anchor="middle" fill="#1a1a1a">LB 按 thread_id 路由</text>
    <text x="325" y="91" font-size="10" text-anchor="middle" fill="#555">一致性哈希 / cookie</text>
    <text x="325" y="107" font-size="10" text-anchor="middle" fill="#555">同一 thread 总打同一台</text>
  </g>

  <path d="M325 116 L325 146" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="180" y="146" width="290" height="60" rx="9" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="325" y="168" font-size="12" text-anchor="middle" fill="#1a1a1a">实例 2（持有 T 的状态）</text>
    <text x="325" y="185" font-size="10" text-anchor="middle" fill="#555">本地内存 + 定期落盘</text>
    <text x="325" y="200" font-size="10" text-anchor="middle" fill="#555">省掉每次跳转的远程读</text>
  </g>

  <g>
    <rect x="500" y="52" width="370" height="240" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="516" y="76" font-size="13" font-weight="700" fill="#c0392b">✗ 失效点（本解法的要害）</text>
    <text x="516" y="102" font-size="11" fill="#1a1a1a">1. 实例挂了 → 该实例上的全部会话中断</text>
    <text x="516" y="122" font-size="11" fill="#1a1a1a">　（无状态化下只是换台机器继续）</text>
    <text x="516" y="146" font-size="11" fill="#1a1a1a">2. 扩容 / 缩容要重新哈希 → 大量会话漂移</text>
    <text x="516" y="166" font-size="11" fill="#1a1a1a">　（一致性哈希只缓解，不消除）</text>
    <text x="516" y="190" font-size="11" fill="#1a1a1a">3. 热点 thread（某个大客户）打爆单台</text>
    <text x="516" y="210" font-size="11" fill="#1a1a1a">　无法分摊，因为必须打同一台</text>
    <text x="516" y="234" font-size="11" fill="#1a1a1a">4. 滚动发布仍需排空，不能随手重启</text>
    <text x="516" y="256" font-size="11" fill="#1a1a1a">　（否则在途会话丢）</text>
    <text x="516" y="280" font-size="11" font-weight="700" fill="#c0392b">→ 与「水平扩展」的目标直接冲突</text>
  </g>

  <g>
    <rect x="30" y="226" width="440" height="66" rx="9" fill="#fff8e6" stroke="#c99a1e" stroke-width="1.5"/>
    <text x="46" y="248" font-size="11.5" fill="#1a1a1a">💡 唯一合理用途：作为「无状态化」的临时过渡</text>
    <text x="46" y="266" font-size="11.5" fill="#1a1a1a">　——先用粘性把单机应用跑起来，同时改造状态外置</text>
    <text x="46" y="284" font-size="11.5" fill="#1a1a1a">　不要把它当终态方案</text>
  </g>

  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
</svg>
