<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="330" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 B：静态断点 interrupt_before（图在节点「之前」停，不进节点）</text>

  <g>
    <rect x="30" y="62" width="130" height="50" rx="8" fill="#dceefb" stroke="#2b7cba" stroke-width="1.5"/>
    <text x="95" y="84" font-size="12" text-anchor="middle" fill="#1a1a1a">invoke 启动</text>
    <text x="95" y="99" font-size="10" text-anchor="middle" fill="#555">compile 时声明断点</text>
  </g>
  <path d="M160 87 L215 87" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="215" y="56" width="140" height="62" rx="8" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="285" y="78" font-size="12" text-anchor="middle" fill="#1a1a1a">前置节点</text>
    <text x="285" y="95" font-size="10" text-anchor="middle" fill="#555">校验 / 风控</text>
    <text x="285" y="110" font-size="10" text-anchor="middle" fill="#555">正常跑完</text>
  </g>
  <path d="M355 87 L410 87" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="410" y="46" width="180" height="82" rx="9" fill="#fff6d9" stroke="#c99a1e" stroke-width="2"/>
    <text x="500" y="70" font-size="12" text-anchor="middle" fill="#1a1a1a">⛔ 断点：停在 refund 之前</text>
    <text x="500" y="88" font-size="10" text-anchor="middle" fill="#555">interrupt_before=["refund"]</text>
    <text x="500" y="104" font-size="10" text-anchor="middle" fill="#555">节点一行都没执行</text>
    <text x="500" y="119" font-size="10" text-anchor="middle" fill="#555">next 字段 = ("refund",)</text>
  </g>

  <path d="M500 128 L500 168 L285 168 L285 122" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="400" y="160" font-size="10.5" text-anchor="middle" fill="#c0392b">人工可先 update_state 改输入</text>

  <path d="M590 87 L645 87" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="645" y="56" width="150" height="62" rx="8" fill="#f2ecf9" stroke="#7a5ea8" stroke-width="1.5"/>
    <text x="720" y="78" font-size="12" text-anchor="middle" fill="#1a1a1a">审批后</text>
    <text x="720" y="95" font-size="10" text-anchor="middle" fill="#555">invoke(None, config)</text>
    <text x="720" y="110" font-size="10" text-anchor="middle" fill="#555">从断点继续</text>
  </g>
  <path d="M720 118 L720 200 L500 200 L500 128" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="330" y="204" width="340" height="40" rx="8" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="500" y="223" font-size="12" text-anchor="middle" fill="#1a1a1a">refund 节点这才开始执行（只跑一次）</text>
    <text x="500" y="237" font-size="10" text-anchor="middle" fill="#555">无「重跑两遍」问题</text>
  </g>

  <g>
    <rect x="30" y="258" width="830" height="60" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="46" y="278" font-size="12" font-weight="700" fill="#c0392b">✗ 失效点</text>
    <text x="46" y="296" font-size="11.5" fill="#1a1a1a">1. 断点在 compile 时写死，运行期无法按条件决定「这单要不要卡」——要么全卡要么全不卡</text>
    <text x="46" y="312" font-size="11.5" fill="#1a1a1a">2. 拿不到「节点内问人的问题」——问题得在断点前单独构造</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
  </defs>
</svg>
