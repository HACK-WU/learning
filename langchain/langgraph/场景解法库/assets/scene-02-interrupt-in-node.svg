<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="310" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 A：interrupt() 卡在节点内（快照存活于 checkpoint）</text>

  <g>
    <rect x="30" y="60" width="120" height="52" rx="8" fill="#dceefb" stroke="#2b7cba" stroke-width="1.5"/>
    <text x="90" y="82" font-size="12" text-anchor="middle" fill="#1a1a1a">invoke 启动</text>
    <text x="90" y="99" font-size="10" text-anchor="middle" fill="#555">thread_id=T</text>
  </g>
  <path d="M150 86 L200 86" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="200" y="54" width="150" height="64" rx="8" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="275" y="76" font-size="12" text-anchor="middle" fill="#1a1a1a">校验 / 风控</text>
    <text x="275" y="93" font-size="10" text-anchor="middle" fill="#555">纯计算</text>
    <text x="275" y="109" font-size="10" text-anchor="middle" fill="#555">结果进快照</text>
  </g>
  <path d="M350 86 L400 86" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <polygon points="400,86 470,50 540,86 470,122" fill="#fff6d9" stroke="#c99a1e" stroke-width="1.8"/>
    <text x="470" y="83" font-size="12" text-anchor="middle" fill="#1a1a1a">interrupt()</text>
    <text x="470" y="100" font-size="10" text-anchor="middle" fill="#555">抛异常 → 暂停</text>
  </g>

  <path d="M470 122 L470 165 L250 165 L250 122" stroke="#7a5ea8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arp)"/>
  <g>
    <rect x="130" y="150" width="230" height="52" rx="9" fill="#f2ecf9" stroke="#7a5ea8" stroke-width="1.5"/>
    <text x="245" y="172" font-size="12" text-anchor="middle" fill="#1a1a1a">checkpoint 落盘：卡在哪 + 当时状态</text>
    <text x="245" y="188" font-size="10" text-anchor="middle" fill="#555">进程可重启，快照仍在</text>
  </g>

  <path d="M540 86 L620 86" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="620" y="54" width="150" height="64" rx="8" fill="#dceefb" stroke="#2b7cba" stroke-width="1.5"/>
    <text x="695" y="76" font-size="12" text-anchor="middle" fill="#1a1a1a">人工审批（外部）</text>
    <text x="695" y="93" font-size="10" text-anchor="middle" fill="#555">几秒 ~ 几天</text>
    <text x="695" y="109" font-size="10" text-anchor="middle" fill="#555">不占进程资源</text>
  </g>
  <path d="M695 118 L695 200 L470 200 L470 122" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="330" y="204" width="290" height="42" rx="8" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="475" y="224" font-size="12" text-anchor="middle" fill="#1a1a1a">Command(resume=...) + 同一 thread_id</text>
    <text x="475" y="238" font-size="10" text-anchor="middle" fill="#555">节点从头重跑，interrupt 返回值</text>
  </g>

  <g>
    <rect x="30" y="258" width="830" height="42" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="46" y="277" font-size="12" font-weight="700" fill="#c0392b">✗ 失效点</text>
    <text x="46" y="294" font-size="11.5" fill="#1a1a1a">不挂 checkpointer 则「能停不能恢复」；resume=None 在 1.2.11 撞 langgraph 自身 bug（UnboundLocalError）</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7a5ea8"/></marker>
  </defs>
</svg>
