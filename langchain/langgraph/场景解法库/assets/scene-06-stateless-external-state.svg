<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="330" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 A：状态外置（无状态服务 + 共享 checkpointer）</text>

  <g>
    <rect x="30" y="58" width="150" height="46" rx="8" fill="#dceefb" stroke="#2b7cba" stroke-width="1.5"/>
    <text x="105" y="78" font-size="12" text-anchor="middle" fill="#1a1a1a">负载均衡</text>
    <text x="105" y="93" font-size="10" text-anchor="middle" fill="#555">任意分发</text>
  </g>

  <path d="M105 104 L105 128 L60 128 L60 148" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M105 104 L105 128" stroke="#333" stroke-width="1.6"/>
  <path d="M60 128 L60 148" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M105 128 L105 148" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M105 128 L255 128 L255 148" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="20" y="148" width="110" height="62" rx="8" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="75" y="170" font-size="12" text-anchor="middle" fill="#1a1a1a">实例 1</text>
    <text x="75" y="187" font-size="10" text-anchor="middle" fill="#555">无本地状态</text>
    <text x="75" y="201" font-size="10" text-anchor="middle" fill="#555">可随时销毁</text>
  </g>
  <g>
    <rect x="140" y="148" width="110" height="62" rx="8" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="195" y="170" font-size="12" text-anchor="middle" fill="#1a1a1a">实例 2</text>
    <text x="195" y="187" font-size="10" text-anchor="middle" fill="#555">无本地状态</text>
    <text x="195" y="201" font-size="10" text-anchor="middle" fill="#555">可随时销毁</text>
  </g>
  <g>
    <rect x="260" y="148" width="110" height="62" rx="8" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="315" y="170" font-size="12" text-anchor="middle" fill="#1a1a1a">实例 N</text>
    <text x="315" y="187" font-size="10" text-anchor="middle" fill="#555">无本地状态</text>
    <text x="315" y="201" font-size="10" text-anchor="middle" fill="#555">可随时销毁</text>
  </g>

  <path d="M75 210 L75 244 L315 244 L315 210" stroke="#7a5ea8" stroke-width="1.6" marker-end="url(#arp)"/>
  <path d="M195 210 L195 244" stroke="#7a5ea8" stroke-width="1.6" marker-end="url(#arp)"/>

  <g>
    <rect x="20" y="244" width="350" height="52" rx="9" fill="#f2ecf9" stroke="#7a5ea8" stroke-width="1.8"/>
    <text x="195" y="266" font-size="12" text-anchor="middle" fill="#1a1a1a">共享 checkpointer（Postgres / Redis）</text>
    <text x="195" y="283" font-size="10" text-anchor="middle" fill="#555">状态按 thread_id 存取，任何实例都能接手</text>
  </g>

  <g>
    <rect x="410" y="148" width="450" height="148" rx="9" fill="#fff8e6" stroke="#c99a1e" stroke-width="1.5"/>
    <text x="426" y="172" font-size="12" font-weight="700" fill="#1a1a1a">关键：第二次 invoke 只传「新输入」</text>
    <text x="426" y="194" font-size="10.5" fill="#1a1a1a">图会按 thread_id 自动取回历史状态</text>
    <text x="426" y="212" font-size="10.5" fill="#1a1a1a">❌ 若你把 result.messages + 新输入一起传</text>
    <text x="426" y="228" font-size="10.5" fill="#1a1a1a">   → 消息重复一份（常见误用）</text>
    <text x="426" y="250" font-size="10.5" fill="#1a1a1a">✅ 正确：graph.invoke({"messages":[新消息]}, cfg)</text>
    <text x="426" y="272" font-size="10.5" fill="#1a1a1a">   历史由 checkpointer 补齐，不靠调用方拼</text>
    <text x="426" y="288" font-size="10.5" fill="#1a1a1a">（这是「无状态」能成立的前提）</text>
  </g>

  <g>
    <rect x="20" y="306" width="840" height="20" rx="6" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
    <text x="36" y="320" font-size="11" fill="#c0392b">✗ 失效点：checkpointer 成为新的单点与容量瓶颈（见场景 4）；每次跳转多一次网络往返</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7a5ea8"/></marker>
  </defs>
</svg>
