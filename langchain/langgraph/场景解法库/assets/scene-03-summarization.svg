<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="330" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 B：摘要化（REMOVE_ALL_MESSAGES 后写入摘要，压缩历史）</text>

  <g>
    <rect x="30" y="60" width="150" height="62" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
    <text x="105" y="84" font-size="12" text-anchor="middle" fill="#1a1a1a">第 N 轮：历史全量</text>
    <text x="105" y="101" font-size="10" text-anchor="middle" fill="#555">messages = [m1..mN]</text>
    <text x="105" y="116" font-size="10" text-anchor="middle" fill="#c0392b">体积 ∝ N</text>
  </g>
  <path d="M180 91 L240 91" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <polygon points="240,91 310,55 380,91 310,127" fill="#fff6d9" stroke="#c99a1e" stroke-width="1.8"/>
    <text x="310" y="88" font-size="12" text-anchor="middle" fill="#1a1a1a">len &gt; 阈值?</text>
    <text x="310" y="105" font-size="10" text-anchor="middle" fill="#555">如 &gt; 20 条</text>
  </g>
  <path d="M380 91 L440 91" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="410" y="83" font-size="10" text-anchor="middle" fill="#3d8b3d">是</text>

  <g>
    <rect x="440" y="52" width="170" height="78" rx="9" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.8"/>
    <text x="525" y="74" font-size="12" text-anchor="middle" fill="#1a1a1a">LLM 生成摘要</text>
    <text x="525" y="91" font-size="10" text-anchor="middle" fill="#555">把 m1..mN 压成一条</text>
    <text x="525" y="107" font-size="10" text-anchor="middle" fill="#555">summary message</text>
    <text x="525" y="122" font-size="10" text-anchor="middle" fill="#555">（额外一次模型调用）</text>
  </g>
  <path d="M610 91 L660 91" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="660" y="52" width="200" height="78" rx="9" fill="#f2ecf9" stroke="#7a5ea8" stroke-width="1.8"/>
    <text x="760" y="74" font-size="12" text-anchor="middle" fill="#1a1a1a">写回 channel</text>
    <text x="760" y="91" font-size="10" text-anchor="middle" fill="#555">RemoveMessage(id=REMOVE_ALL</text>
    <text x="760" y="107" font-size="10" text-anchor="middle" fill="#555">_MESSAGES) + [summary]</text>
    <text x="760" y="122" font-size="10" text-anchor="middle" fill="#555">全清后写入摘要</text>
  </g>

  <path d="M760 130 L760 200 L105 200 L105 122" stroke="#7a5ea8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arp)"/>
  <g>
    <rect x="300" y="204" width="330" height="42" rx="9" fill="#dceefb" stroke="#2b7cba" stroke-width="1.5"/>
    <text x="465" y="224" font-size="12" text-anchor="middle" fill="#1a1a1a">下一轮：messages = [summary]（体积回到常数）</text>
    <text x="465" y="238" font-size="10" text-anchor="middle" fill="#555">checkpoint 不再随轮次增长</text>
  </g>

  <g>
    <rect x="30" y="258" width="830" height="60" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="46" y="278" font-size="12" font-weight="700" fill="#c0392b">✗ 失效点</text>
    <text x="46" y="296" font-size="11.5" fill="#1a1a1a">1. 有损压缩——摘要漏掉的细节永远找不回（且「漏了什么」不可预知）</text>
    <text x="46" y="312" font-size="11.5" fill="#1a1a1a">2. 摘要本身要花一次 LLM 调用（成本 + 延迟），且摘要出错会污染后续全部轮次</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7a5ea8"/></marker>
  </defs>
</svg>
