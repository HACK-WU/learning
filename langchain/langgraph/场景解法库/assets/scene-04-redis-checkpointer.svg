<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="330" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 C：换 Redis checkpointer（不按线程长期占连接）</text>

  <g>
    <rect x="30" y="60" width="230" height="72" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="1.8"/>
    <text x="145" y="84" font-size="12" text-anchor="middle" fill="#1a1a1a">Postgres：每步一行 × 线程</text>
    <text x="145" y="101" font-size="10" text-anchor="middle" fill="#555">30 步 agent = 三张表几十行</text>
    <text x="145" y="117" font-size="10" text-anchor="middle" fill="#555">子图再按 checkpoint_ns 翻倍</text>
    <text x="145" y="129" font-size="10" text-anchor="middle" fill="#c0392b">单写者表 = 最先到的天花板</text>
  </g>

  <path d="M260 96 L330 96" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="330" y="58" width="240" height="76" rx="9" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.8"/>
    <text x="450" y="82" font-size="12" text-anchor="middle" fill="#1a1a1a">Redis checkpointer</text>
    <text x="450" y="99" font-size="10" text-anchor="middle" fill="#555">低延迟读写（活跃 run 用）</text>
    <text x="450" y="115" font-size="10" text-anchor="middle" fill="#555">不按线程长期占连接</text>
    <text x="450" y="129" font-size="10" text-anchor="middle" fill="#555">需 Redis 8.0+ 或 Redis Stack</text>
  </g>
  <path d="M570 96 L625 96" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="625" y="58" width="235" height="76" rx="9" fill="#fff6d9" stroke="#c99a1e" stroke-width="1.8"/>
    <text x="742" y="82" font-size="12" text-anchor="middle" fill="#1a1a1a">⚠ Redis 是缓存不是真相源</text>
    <text x="742" y="99" font-size="10" text-anchor="middle" fill="#555">淘汰 / 重启 = 状态可能丢</text>
    <text x="742" y="115" font-size="10" text-anchor="middle" fill="#555">生产常与 PG 并用：</text>
    <text x="742" y="129" font-size="10" text-anchor="middle" fill="#555">Redis 活跃态 + PG 持久</text>
  </g>

  <g>
    <rect x="330" y="158" width="530" height="46" rx="9" fill="#f2ecf9" stroke="#7a5ea8" stroke-width="1.5"/>
    <text x="595" y="178" font-size="11.5" text-anchor="middle" fill="#1a1a1a">责任划分：Redis 管「跑得快」，Postgres 管「丢不了」</text>
    <text x="595" y="194" font-size="10.5" text-anchor="middle" fill="#555">崩溃后以哪一层为准恢复，必须写进部署文档（否则对不上账）</text>
  </g>

  <g>
    <rect x="30" y="222" width="830" height="56" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="46" y="242" font-size="12" font-weight="700" fill="#c0392b">✗ 失效点</text>
    <text x="46" y="260" font-size="11.5" fill="#1a1a1a">1. 单用 Redis 有丢状态风险：eviction 或重启无持久化 = 已提交的会话没了</text>
    <text x="46" y="274" font-size="11.5" fill="#1a1a1a">2. 依赖 RedisJSON + RediSearch 模块（Redis 8.0+ 才内置），版本不够 setup() 直接失败</text>
  </g>

  <g>
    <rect x="30" y="288" width="830" height="34" rx="9" fill="#fff8e6" stroke="#c99a1e" stroke-width="1.5"/>
    <text x="46" y="306" font-size="11.5" fill="#1a1a1a">🧭 选型：并发上来先试 A（池参数）→ 还扛不住上 B（PgBouncer）→ 读多写多才考虑 C（换后端）</text>
  </g>

  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
</svg>
