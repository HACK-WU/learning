<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="300" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 B：把副作用挪到 interrupt() 之后（消除重跑窗口）</text>

  <g>
    <rect x="30" y="58" width="150" height="56" rx="8" fill="#dceefb" stroke="#2b7cba" stroke-width="1.5"/>
    <text x="105" y="80" font-size="12" text-anchor="middle" fill="#1a1a1a">节点开始（重跑入口）</text>
    <text x="105" y="97" font-size="10" text-anchor="middle" fill="#555">每次 resume 都回到这里</text>
  </g>
  <path d="M180 86 L232 86" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="232" y="52" width="150" height="68" rx="8" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="307" y="74" font-size="12" text-anchor="middle" fill="#1a1a1a">纯计算区</text>
    <text x="307" y="91" font-size="10" text-anchor="middle" fill="#555">查余额 / 算金额 / 组单号</text>
    <text x="307" y="107" font-size="10" text-anchor="middle" fill="#555">重跑 N 次也无害</text>
  </g>
  <path d="M382 86 L434 86" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <polygon points="434,86 500,50 566,86 500,122" fill="#fff6d9" stroke="#c99a1e" stroke-width="1.8"/>
    <text x="500" y="83" font-size="12" text-anchor="middle" fill="#1a1a1a">interrupt()</text>
    <text x="500" y="100" font-size="10" text-anchor="middle" fill="#555">暂停等人工</text>
  </g>
  <path d="M566 86 L620 86" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M500 122 L500 150 L105 150 L105 118" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="300" y="166" font-size="10.5" text-anchor="middle" fill="#c0392b">resume → 整个节点从头再跑一次</text>

  <g>
    <rect x="620" y="58" width="150" height="56" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
    <text x="695" y="80" font-size="12" text-anchor="middle" fill="#1a1a1a">副作用区</text>
    <text x="695" y="97" font-size="10" text-anchor="middle" fill="#555">打款 / 发信（只在这之后）</text>
  </g>

  <g>
    <rect x="30" y="195" width="740" height="80" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="46" y="218" font-size="13" font-weight="700" fill="#c0392b">✗ 失效点</text>
    <text x="46" y="240" font-size="11.5" fill="#1a1a1a">1. 只消除「interrupt 导致的重跑」，挡不住 RetryPolicy 重试、节点超时、进程崩溃重启</text>
    <text x="46" y="260" font-size="11.5" fill="#1a1a1a">2. 依赖人写对位置——失误即失效，无编译期保护（是纪律不是机制）</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
  </defs>
</svg>
