<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="330" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 C：大对象外置（State 只存指针，正文放 Store / 对象存储）</text>

  <g>
    <rect x="30" y="62" width="190" height="76" rx="9" fill="#dceefb" stroke="#2b7cba" stroke-width="1.8"/>
    <text x="125" y="86" font-size="12" text-anchor="middle" fill="#1a1a1a">节点拿到大对象</text>
    <text x="125" y="103" font-size="10" text-anchor="middle" fill="#555">长文档 / 检索结果</text>
    <text x="125" y="119" font-size="10" text-anchor="middle" fill="#555">工具返回的原始数据</text>
    <text x="125" y="132" font-size="10" text-anchor="middle" fill="#555">（几 KB ~ 几 MB）</text>
  </g>
  <path d="M220 100 L275 100" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="275" y="58" width="170" height="84" rx="9" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.8"/>
    <text x="360" y="80" font-size="12" text-anchor="middle" fill="#1a1a1a">① 写入外部</text>
    <text x="360" y="97" font-size="10" text-anchor="middle" fill="#555">Store / S3 / Redis</text>
    <text x="360" y="113" font-size="10" text-anchor="middle" fill="#555">key = 内容哈希</text>
    <text x="360" y="129" font-size="10" text-anchor="middle" fill="#555">（天然去重）</text>
  </g>
  <path d="M445 100 L500 100" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="500" y="58" width="180" height="84" rx="9" fill="#fff6d9" stroke="#c99a1e" stroke-width="1.8"/>
    <text x="590" y="80" font-size="12" text-anchor="middle" fill="#1a1a1a">② State 只存指针</text>
    <text x="590" y="100" font-size="10" text-anchor="middle" fill="#555">{"doc_ref": "s3://..."}</text>
    <text x="590" y="118" font-size="10" text-anchor="middle" fill="#555">几十字节，不是几 MB</text>
    <text x="590" y="133" font-size="10" text-anchor="middle" fill="#555">checkpoint 瘦下来</text>
  </g>
  <path d="M680 100 L735 100" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="735" y="62" width="140" height="76" rx="9" fill="#f2ecf9" stroke="#7a5ea8" stroke-width="1.5"/>
    <text x="805" y="86" font-size="12" text-anchor="middle" fill="#1a1a1a">③ 需要时再取</text>
    <text x="805" y="103" font-size="10" text-anchor="middle" fill="#555">下游节点按 ref</text>
    <text x="805" y="119" font-size="10" text-anchor="middle" fill="#555">读回正文</text>
    <text x="805" y="132" font-size="10" text-anchor="middle" fill="#555">（多一次 IO）</text>
  </g>

  <path d="M805 138 L805 178 L360 178 L360 142" stroke="#7a5ea8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arp)"/>
  <text x="580" y="196" font-size="10.5" text-anchor="middle" fill="#7a5ea8">读回走网络，不在 checkpoint 里</text>

  <g>
    <rect x="30" y="212" width="830" height="58" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="46" y="232" font-size="12" font-weight="700" fill="#c0392b">✗ 失效点</text>
    <text x="46" y="250" font-size="11.5" fill="#1a1a1a">1. 指针失效 = 数据丢失：外部对象被清理 / TTL 过期，State 里的 ref 就成了死链（checkpoint 还在但读不出）</text>
    <text x="46" y="266" font-size="11.5" fill="#1a1a1a">2. 回放语义被破坏：time-travel 回到旧快照时，外部对象可能已被改写，拿到的不是「当时」的内容</text>
  </g>

  <g>
    <rect x="30" y="280" width="830" height="40" rx="9" fill="#fff8e6" stroke="#c99a1e" stroke-width="1.5"/>
    <text x="46" y="299" font-size="11.5" fill="#1a1a1a">💡 用内容哈希做 key 可缓解第 2 点：内容不可变 → 旧 ref 永远指向旧内容</text>
    <text x="46" y="314" font-size="11.5" fill="#1a1a1a">（代价是不可删——存储空间换回放正确性）</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7a5ea8"/></marker>
  </defs>
</svg>
