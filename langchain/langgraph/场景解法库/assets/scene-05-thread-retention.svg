<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="330" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 A：按 thread 整体保留（删就删三张表，不能只删 checkpoints）</text>

  <g>
    <rect x="30" y="60" width="250" height="120" rx="9" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.8"/>
    <text x="155" y="82" font-size="12" text-anchor="middle" fill="#1a1a1a">✅ 正确：delete_thread(thread_id)</text>
    <text x="155" y="104" font-size="10" text-anchor="middle" fill="#555">一次调用清理该 thread 在</text>
    <text x="155" y="120" font-size="10" text-anchor="middle" fill="#555">checkpoints / checkpoint_blobs /</text>
    <text x="155" y="136" font-size="10" text-anchor="middle" fill="#555">checkpoint_writes 三张表的全部行</text>
    <text x="155" y="156" font-size="10" text-anchor="middle" fill="#3d8b3d">bytes 真正释放</text>
    <text x="155" y="172" font-size="10" text-anchor="middle" fill="#555">（blobs 是大头，在 TOAST 里）</text>
  </g>

  <g>
    <rect x="320" y="60" width="290" height="120" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="1.8"/>
    <text x="465" y="82" font-size="12" text-anchor="middle" fill="#1a1a1a">❌ 错误：DELETE FROM checkpoints</text>
    <text x="465" y="104" font-size="10" text-anchor="middle" fill="#555">三张表之间</text>
    <text x="465" y="120" font-size="10" text-anchor="middle" fill="#555">**没有外键**</text>
    <text x="465" y="140" font-size="10" text-anchor="middle" fill="#c0392b">blobs 与 writes 永久残留</text>
    <text x="465" y="160" font-size="10" text-anchor="middle" fill="#555">表「看起来小了」</text>
    <text x="465" y="174" font-size="10" text-anchor="middle" fill="#555">磁盘一点没降</text>
  </g>

  <g>
    <rect x="650" y="60" width="215" height="120" rx="9" fill="#fff6d9" stroke="#c99a1e" stroke-width="1.8"/>
    <text x="757" y="82" font-size="12" text-anchor="middle" fill="#1a1a1a">⏰ 谁来调用？</text>
    <text x="757" y="104" font-size="10" text-anchor="middle" fill="#555">开源 checkpointer</text>
    <text x="757" y="120" font-size="10" text-anchor="middle" fill="#555">**没有内置 TTL / sweeper**</text>
    <text x="757" y="140" font-size="10" text-anchor="middle" fill="#555">langgraph.json 的 ttl 块</text>
    <text x="757" y="156" font-size="10" text-anchor="middle" fill="#555">是 Platform 功能</text>
    <text x="757" y="174" font-size="10" text-anchor="middle" fill="#c0392b">自托管 = 必须自己写任务</text>
  </g>

  <path d="M465 180 L465 214" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="230" y="214" width="470" height="46" rx="9" fill="#dceefb" stroke="#2b7cba" stroke-width="1.5"/>
    <text x="465" y="236" font-size="12" text-anchor="middle" fill="#1a1a1a">保留策略：按「会话结束后 N 天」批量 delete_thread</text>
    <text x="465" y="251" font-size="10" text-anchor="middle" fill="#555">每 6 个月未活动 → 归档到冷存后删</text>
  </g>

  <g>
    <rect x="30" y="274" width="835" height="46" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="46" y="293" font-size="12" font-weight="700" fill="#c0392b">✗ 失效点</text>
    <text x="46" y="310" font-size="11.5" fill="#1a1a1a">删掉的 thread 无法再回放 / 恢复——合规要求保留的会话，删之前必须先归档</text>
  </g>

  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
</svg>
