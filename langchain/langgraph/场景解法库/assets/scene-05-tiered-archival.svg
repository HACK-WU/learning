<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="900" height="320" fill="#fbfaf7"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1a1a1a">解法 C：冷热分层（活跃留在热库，历史归档冷存）</text>

  <g>
    <rect x="30" y="62" width="190" height="80" rx="9" fill="#dceefb" stroke="#2b7cba" stroke-width="1.8"/>
    <text x="125" y="86" font-size="12" text-anchor="middle" fill="#1a1a1a">热库（Postgres）</text>
    <text x="125" y="104" font-size="10" text-anchor="middle" fill="#555">近 30 天活跃的 thread</text>
    <text x="125" y="120" font-size="10" text-anchor="middle" fill="#555">要回放 / 要恢复</text>
    <text x="125" y="134" font-size="10" text-anchor="middle" fill="#555">占比小、查询快</text>
  </g>
  <path d="M220 102 L290 102" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <polygon points="290,102 360,66 430,102 360,138" fill="#fff6d9" stroke="#c99a1e" stroke-width="1.8"/>
    <text x="360" y="99" font-size="12" text-anchor="middle" fill="#1a1a1a">N 天无活动?</text>
    <text x="360" y="116" font-size="10" text-anchor="middle" fill="#555">按 last_active 判</text>
  </g>
  <path d="M430 102 L495 102" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="495" y="56" width="200" height="92" rx="9" fill="#f2ecf9" stroke="#7a5ea8" stroke-width="1.8"/>
    <text x="595" y="78" font-size="12" text-anchor="middle" fill="#1a1a1a">冷存（S3 / 对象存储）</text>
    <text x="595" y="96" font-size="10" text-anchor="middle" fill="#555">导出 thread 全部快照</text>
    <text x="595" y="112" font-size="10" text-anchor="middle" fill="#555">压缩 + 带 manifest</text>
    <text x="595" y="128" font-size="10" text-anchor="middle" fill="#555">（blob 是大头）</text>
    <text x="595" y="142" font-size="10" text-anchor="middle" fill="#555">成本 ≈ 热库的 1/10</text>
  </g>
  <path d="M595 148 L595 186 L125 186 L125 142" stroke="#7a5ea8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arp)"/>
  <text x="360" y="204" font-size="10.5" text-anchor="middle" fill="#7a5ea8">需要审计时按需回灌（慢，但可行）</text>

  <g>
    <rect x="715" y="62" width="155" height="86" rx="9" fill="#eaf5ea" stroke="#3d8b3d" stroke-width="1.5"/>
    <text x="792" y="84" font-size="12" text-anchor="middle" fill="#1a1a1a">归档后</text>
    <text x="792" y="102" font-size="10" text-anchor="middle" fill="#555">delete_thread 删热库</text>
    <text x="792" y="120" font-size="10" text-anchor="middle" fill="#555">热库体积稳定</text>
    <text x="792" y="138" font-size="10" text-anchor="middle" fill="#555">备份窗口不再涨</text>
  </g>

  <g>
    <rect x="30" y="222" width="835" height="52" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="46" y="242" font-size="12" font-weight="700" fill="#c0392b">✗ 失效点</text>
    <text x="46" y="260" font-size="11.5" fill="#1a1a1a">1. 归档格式无官方保证——跨版本升级后可能读不回（msgpack 序列化 + schema 演进风险）</text>
    <text x="46" y="276" font-size="11.5" fill="#1a1a1a">2. 回灌要停机或加锁，且「回放一次旧会话」可能耗时很久（不是随时可查）</text>
  </g>

  <g>
    <rect x="30" y="284" width="835" height="28" rx="9" fill="#fff8e6" stroke="#c99a1e" stroke-width="1.5"/>
    <text x="46" y="302" font-size="11.5" fill="#1a1a1a">💡 归档时必须存「当时版本号」——否则几个月后你不知道该用哪个版本解读</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7a5ea8"/></marker>
  </defs>
</svg>
