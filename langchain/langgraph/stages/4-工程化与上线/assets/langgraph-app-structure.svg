<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">代码写完了，怎么让它变成别人能跑起来的服务</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">左边：只有一个文件，得你自己跑 ｜ 右边：写清门牌号，谁都能按地址找到它</text>

  <!-- 左 -->
  <rect x="34" y="76" width="400" height="326" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="234" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#b91c1c">只有一个文件</text>
  <text x="234" y="122" text-anchor="middle" font-size="12" fill="#991b1b">（脚本阶段：能跑，但只有你能跑）</text>

  <rect x="62" y="138" width="344" height="30" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.1"/>
  <text x="234" y="158" text-anchor="middle" font-size="11" fill="#7f1d1d">my_graph.py（图 + 节点 + 依赖 全在一起）</text>

  <rect x="62" y="176" width="344" height="72" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="234" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">要让别人跑，你得口头交代</text>
  <text x="234" y="214" text-anchor="middle" font-size="10" fill="#7f1d1d">"图在哪个文件、变量叫什么、装哪些包"</text>
  <text x="234" y="232" text-anchor="middle" font-size="10" fill="#7f1d1d">少说一句，对方就跑不起来</text>

  <rect x="62" y="258" width="344" height="60" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.1"/>
  <text x="234" y="278" text-anchor="middle" font-size="10" fill="#7f1d1d">改一行代码 = 全部重跑一遍看有没有坏</text>
  <text x="234" y="296" text-anchor="middle" font-size="10" fill="#7f1d1d">没有固定入口，谁也不知道从哪开始</text>
  <text x="234" y="310" text-anchor="middle" font-size="10" fill="#7f1d1d">上线靠手动 copy 文件</text>

  <rect x="62" y="330" width="344" height="56" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="234" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">典型问题</text>
  <text x="234" y="368" text-anchor="middle" font-size="10" fill="#475569">依赖版本对不上 / 环境变量没设 / 找不到入口</text>

  <!-- 右 -->
  <rect x="466" y="76" width="400" height="326" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="666" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#166534">写清门牌号</text>
  <text x="666" y="122" text-anchor="middle" font-size="12" fill="#065f46">（工程阶段：地址写死，谁都能按地址找）</text>

  <rect x="494" y="138" width="344" height="30" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.1"/>
  <text x="666" y="158" text-anchor="middle" font-size="11" fill="#065f46">langgraph.json（一张"门牌表"）</text>

  <rect x="494" y="176" width="344" height="72" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="666" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">图在哪 / 装什么 / 环境变量 全写在表上</text>
  <text x="666" y="214" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#047857">graphs: 文件:变量名</text>
  <text x="666" y="232" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#047857">dependencies / env</text>

  <rect x="494" y="258" width="344" height="60" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.1"/>
  <text x="666" y="278" text-anchor="middle" font-size="10" fill="#065f46">一条命令就能起服务（实测起得来）</text>
  <text x="666" y="296" text-anchor="middle" font-size="10" fill="#065f46">改代码前先跑测试，坏了当场知道</text>
  <text x="666" y="310" text-anchor="middle" font-size="10" fill="#065f46">地址不变，老客户还能按老地址找到</text>

  <rect x="494" y="330" width="344" height="56" rx="7" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
  <text x="666" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#854d0e">代价：这张表写错就直接起不来</text>
  <text x="666" y="368" text-anchor="middle" font-size="10" fill="#78350f">实测：写错名字会报"找不到"，还提示你是不是想写这个</text>

  <rect x="34" y="416" width="832" height="66" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="450" y="438" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">门牌表解决的是"别人怎么找到它"</text>
  <text x="450" y="458" text-anchor="middle" font-size="11" fill="#475569">还有两件事它管不了：改了之后会不会弄坏别的（测试）、正在跑的活会不会被打断（兼容）</text>
  <text x="450" y="474" text-anchor="middle" font-size="11" fill="#475569">本课三件事：写对门牌表 → 改之前先有测试兜底 → 改的时候别打断在跑的活</text>
</svg>
