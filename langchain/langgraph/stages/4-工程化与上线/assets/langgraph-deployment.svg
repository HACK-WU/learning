<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">图能跑了，怎么让它一直跑、跑坏了能知道</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">左边：你电脑上跑，你关掉就没了 ｜ 右边：交给一个不关机的地方，还装了监控</text>

  <!-- 左 -->
  <rect x="34" y="76" width="400" height="330" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="234" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#b91c1c">你电脑上跑</text>
  <text x="234" y="122" text-anchor="middle" font-size="12" fill="#991b1b">（开发阶段：能跑，但你关掉就没了）</text>

  <rect x="62" y="138" width="344" height="32" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.1"/>
  <text x="234" y="159" text-anchor="middle" font-size="11" fill="#7f1d1d">langgraph dev —— 一条命令，随开随关</text>

  <rect x="62" y="178" width="344" height="66" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="234" y="198" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">关掉电脑就没人干活了</text>
  <text x="234" y="216" text-anchor="middle" font-size="10" fill="#7f1d1d">存档存在内存里，重启就丢</text>
  <text x="234" y="234" text-anchor="middle" font-size="10" fill="#7f1d1d">别人访问不到你的 localhost</text>

  <rect x="62" y="252" width="344" height="58" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.1"/>
  <text x="234" y="272" text-anchor="middle" font-size="10" fill="#7f1d1d">出问题只能看自己打的 print</text>
  <text x="234" y="290" text-anchor="middle" font-size="10" fill="#7f1d1d">用户说"刚才卡住了"，你查不到那次</text>
  <text x="234" y="304" text-anchor="middle" font-size="10" fill="#7f1d1d">几十次运行混在一起，分不清谁是谁</text>

  <rect x="62" y="320" width="344" height="70" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="234" y="340" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">适合什么时候</text>
  <text x="234" y="358" text-anchor="middle" font-size="10" fill="#475569">本地调试、用 Studio 一步步看</text>
  <text x="234" y="376" text-anchor="middle" font-size="10" fill="#475569">给同事演示、跑测试</text>

  <!-- 右 -->
  <rect x="466" y="76" width="400" height="330" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="666" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#166534">交给不关机的地方</text>
  <text x="666" y="122" text-anchor="middle" font-size="12" fill="#065f46">（上线阶段：一直有人干活，还装了监控）</text>

  <rect x="494" y="138" width="344" height="32" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.1"/>
  <text x="666" y="159" text-anchor="middle" font-size="11" fill="#065f46">打包成镜像 → 放到服务器上一直跑</text>

  <rect x="494" y="178" width="344" height="66" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="666" y="198" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">存档放进真数据库，重启不丢</text>
  <text x="666" y="216" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#047857">需要一个放东西的库 + 一个排队的地方</text>
  <text x="666" y="234" text-anchor="middle" font-size="10" fill="#047857">实测：少给一个就起不来</text>

  <rect x="494" y="252" width="344" height="58" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.1"/>
  <text x="666" y="272" text-anchor="middle" font-size="10" fill="#065f46">每次运行都留一份"行车记录"</text>
  <text x="666" y="290" text-anchor="middle" font-size="10" fill="#065f46">用户说卡住，你能翻出那一次的全过程</text>
  <text x="666" y="304" text-anchor="middle" font-size="10" fill="#065f46">慢在哪一步、花了多少，都能查</text>

  <rect x="494" y="320" width="344" height="70" rx="7" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
  <text x="666" y="340" text-anchor="middle" font-size="10" font-weight="600" fill="#854d0e">代价：要备的东西变多了</text>
  <text x="666" y="358" text-anchor="middle" font-size="10" fill="#78350f">数据库、队列、密钥、授权，少一样起不来</text>
  <text x="666" y="376" text-anchor="middle" font-size="10" fill="#78350f">实测：光打包起来跑，连撞三次"缺东西"</text>

  <rect x="34" y="418" width="832" height="66" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="450" y="440" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">上线解决的是"一直有人干活"，监控解决的是"干坏了能知道"</text>
  <text x="450" y="460" text-anchor="middle" font-size="11" fill="#475569">中间那条路：先打包在自己机器上试跑一遍，确认备齐了再送上线</text>
  <text x="450" y="476" text-anchor="middle" font-size="11" fill="#475569">本课三件事：选放哪（部署）→ 本地怎么边跑边看（调试界面）→ 跑坏怎么查（监控）</text>
</svg>
