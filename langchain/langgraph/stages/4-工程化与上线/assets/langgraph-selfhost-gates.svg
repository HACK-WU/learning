<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="920" height="500" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">自托管打包出来跑，连撞三道门（本机实测）</text>
  <text x="460" y="50" text-anchor="middle" font-size="12" fill="#6b7280">langgraph build 成功 → docker run 启动，每次卡在一个新的"缺东西"</text>

  <!-- 时间线 -->
  <path d="M60 90 L860 90" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 步骤1 -->
  <circle cx="90" cy="90" r="15" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <text x="90" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="90" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">打包成功</text>
  <rect x="32" y="138" width="116" height="184" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="90" y="160" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#065f46">langgraph build</text>
  <text x="90" y="180" text-anchor="middle" font-size="9" fill="#047857">-t lgdemo:test</text>
  <text x="90" y="204" text-anchor="middle" font-size="9" fill="#047857">基础镜像：</text>
  <text x="90" y="218" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#047857">langgraph-api:3.11</text>
  <text x="90" y="240" text-anchor="middle" font-size="9" fill="#047857">默认 Python 3.11</text>
  <text x="90" y="256" text-anchor="middle" font-size="9" fill="#047857">（不是你本机的版本）</text>
  <text x="90" y="280" text-anchor="middle" font-size="9" fill="#047857">把图位置写成</text>
  <text x="90" y="294" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#047857">LANGSERVE_GRAPHS</text>
  <text x="90" y="310" text-anchor="middle" font-size="9" font-weight="700" fill="#059669">✅ 镜像出来了</text>

  <!-- 步骤2 -->
  <circle cx="300" cy="90" r="15" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="300" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="300" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">第一道门</text>
  <rect x="212" y="138" width="176" height="184" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="300" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">缺 REDIS_URI</text>
  <text x="300" y="182" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#7f1d1d">KeyError: Config</text>
  <text x="300" y="196" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#7f1d1d">'REDIS_URI' is missing</text>
  <text x="300" y="220" text-anchor="middle" font-size="9" fill="#7f1d1d">用来排队和暂存</text>
  <text x="300" y="236" text-anchor="middle" font-size="9" fill="#7f1d1d">dev 模式不需要</text>
  <text x="300" y="252" text-anchor="middle" font-size="9" fill="#7f1d1d">——所以本地从没见过</text>
  <text x="300" y="278" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">补上 → 继续</text>
  <text x="300" y="294" text-anchor="middle" font-size="9" fill="#7f1d1d">（还要真起一个 Redis）</text>

  <!-- 步骤3 -->
  <circle cx="510" cy="90" r="15" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="510" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="510" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">第二道门</text>
  <rect x="422" y="138" width="176" height="184" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="510" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">缺 POSTGRES_URI</text>
  <text x="510" y="182" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#7f1d1d">AttributeError:</text>
  <text x="510" y="196" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#7f1d1d">'NoneType' has no</text>
  <text x="510" y="208" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#7f1d1d">'encode'</text>
  <text x="510" y="232" text-anchor="middle" font-size="9" fill="#7f1d1d">存档要放真数据库</text>
  <text x="510" y="248" text-anchor="middle" font-size="9" fill="#7f1d1d">报错还很难懂（空值）</text>
  <text x="510" y="278" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">补上 → 继续</text>
  <text x="510" y="294" text-anchor="middle" font-size="9" fill="#7f1d1d">（再起一个 Postgres）</text>

  <!-- 步骤4 -->
  <circle cx="720" cy="90" r="15" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="720" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="720" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">第三道门</text>
  <rect x="632" y="138" width="176" height="184" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="720" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">缺 授权密钥</text>
  <text x="720" y="182" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#7f1d1d">ValueError:</text>
  <text x="720" y="196" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#7f1d1d">License verification</text>
  <text x="720" y="210" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#7f1d1d">failed</text>
  <text x="720" y="234" text-anchor="middle" font-size="9" fill="#7f1d1d">自带镜像要授权</text>
  <text x="720" y="250" text-anchor="middle" font-size="9" fill="#7f1d1d">乱填一个密钥：</text>
  <text x="720" y="264" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#7f1d1d">Not enough segments</text>
  <text x="720" y="290" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">❌ 到此为止</text>

  <!-- 箭头 -->
  <path d="M148 230 L212 230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M388 230 L422 230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M598 230 L632 230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- 结论 -->
  <rect x="32" y="342" width="856" height="66" rx="9" fill="#fefce8" stroke="#fde047" stroke-width="1.4"/>
  <text x="460" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">自托管不是"免费自己跑"——它把三样东西交给你自己备</text>
  <text x="460" y="384" text-anchor="middle" font-size="11" fill="#78350f">① 排队用的（REDIS_URI）② 存档用的库（POSTGRES_URI）③ 授权（LANGGRAPH_CLOUD_LICENSE_KEY）</text>
  <text x="460" y="400" text-anchor="middle" font-size="11" fill="#78350f">dev 模式全用内存替你扛了，所以本地从不出这三个错——这正是"本地好好的，上线起不来"的根因</text>

  <!-- 对照 -->
  <rect x="32" y="420" width="420" height="64" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="242" y="440" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">那托管平台呢？</text>
  <text x="242" y="458" text-anchor="middle" font-size="10" fill="#1e3a8a">这三样平台替你备好，你只交代码</text>
  <text x="242" y="474" text-anchor="middle" font-size="10" fill="#1e3a8a">代价：数据出你的机房、按量付费</text>

  <rect x="468" y="420" width="420" height="64" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.3"/>
  <text x="678" y="440" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">省钱的办法</text>
  <text x="678" y="458" text-anchor="middle" font-size="10" fill="#6b21a8">先 build 出来在自己机器上跑一遍，把缺的都撞出来</text>
  <text x="678" y="474" text-anchor="middle" font-size="10" fill="#6b21a8">再决定要不要买托管</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
