<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="system-ui,-apple-system,Segoe UI,Robo,Helvetica Neue,Arial,sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">跑错了只能从头再来，还是能退回去改一步</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">左边：发现判错了只能整条重跑 ｜ 右边：退回到那一步，改一个值，只重跑后面的</text>

  <!-- 左：只能重跑 -->
  <rect x="40" y="82" width="380" height="210" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="230" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#b91c1c">发现判错了，只能整条重跑</text>

  <rect x="66" y="122" width="60" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="96" y="146" text-anchor="middle" font-size="11" fill="#7f1d1d">查订单</text>
  <path d="M126 142 L146 142" stroke="#f87171" stroke-width="2" marker-end="url(#r2)"/>
  <rect x="146" y="122" width="60" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="176" y="146" text-anchor="middle" font-size="11" fill="#7f1d1d">算金额</text>
  <path d="M206 142 L226 142" stroke="#f87171" stroke-width="2" marker-end="url(#r2)"/>
  <rect x="226" y="122" width="60" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="256" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">判驳回</text>

  <rect x="66" y="172" width="220" height="46" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="176" y="192" text-anchor="middle" font-size="11" fill="#7f1d1d">客户投诉：判错了</text>
  <text x="176" y="210" text-anchor="middle" font-size="11" fill="#991b1b">→ 从头再跑一遍，前面全白做</text>

  <text x="230" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">❌ 前面几步的钱和时间都白花</text>
  <text x="230" y="270" text-anchor="middle" font-size="11" fill="#7f1d1d">而且重跑一次，结果还可能不一样</text>

  <!-- 右：退回去改 -->
  <rect x="470" y="82" width="390" height="210" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="665" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#047857">退回去改一步，只重跑后面</text>

  <rect x="496" y="122" width="60" height="40" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="526" y="146" text-anchor="middle" font-size="11" fill="#065f46">查订单</text>
  <path d="M556 142 L576 142" stroke="#34d399" stroke-width="2" marker-end="url(#g2)"/>
  <rect x="576" y="122" width="60" height="40" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="606" y="146" text-anchor="middle" font-size="11" fill="#065f46">算金额</text>
  <path d="M636 142 L656 142" stroke="#34d399" stroke-width="2" marker-end="url(#g2)"/>
  <rect x="656" y="122" width="60" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="686" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">判驳回</text>
  <text x="750" y="146" font-size="11" fill="#059669">→ 改判批准</text>

  <path d="M686 162 L686 186 M681 180 L687 186 L693 180 Z" stroke="#059669" stroke-width="1.6" fill="#059669"/>
  <rect x="580" y="186" width="212" height="40" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="686" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">退回「判驳回」之前那一刻</text>
  <text x="686" y="219" text-anchor="middle" font-size="11" fill="#047857">改一个值，后面重跑，前面不动</text>

  <text x="665" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">✅ 前面几步的成果保住了</text>
  <text x="665" y="274" text-anchor="middle" font-size="11" fill="#065f46">实测：只重跑了后面 2 个节点</text>

  <defs>
    <marker id="r2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f87171"/></marker>
    <marker id="g2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#34d399"/></marker>
  </defs>

  <!-- 底部 -->
  <rect x="40" y="306" width="820" height="56" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="450" y="330" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">本课做的事：给跑完的流程装一台「录像机 + 倒带键」</text>
  <text x="450" y="352" text-anchor="middle" font-size="12" fill="#1e3a8a">图每跑一步就自动存一张快照 —— 你能翻回任意一张，改点东西，从那里重新走一遍</text>

  <!-- 三个关键点 -->
  <rect x="40" y="382" width="255" height="80" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="167" y="406" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">① 翻回看</text>
  <text x="167" y="428" text-anchor="middle" font-size="11" fill="#4b5563">每步一张快照，连成一串</text>
  <text x="167" y="446" text-anchor="middle" font-size="11" fill="#4b5563">从新到旧排着，随时能翻</text>

  <rect x="322" y="382" width="255" height="80" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="449" y="406" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">② 改一点</text>
  <text x="449" y="428" text-anchor="middle" font-size="11" fill="#4b5563">选一张快照，改里面的值</text>
  <text x="449" y="446" text-anchor="middle" font-size="11" fill="#4b5563">改完就长出新的一条分支</text>

  <rect x="604" y="382" width="256" height="80" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="732" y="406" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">③ 从那继续</text>
  <text x="732" y="428" text-anchor="middle" font-size="11" fill="#4b5563">只重跑这一步之后的</text>
  <text x="732" y="446" text-anchor="middle" font-size="11" fill="#4b5563">前面的成果保住不动</text>
</svg>
