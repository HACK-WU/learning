<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="920" height="540" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">子图状态隔离：共享的字段才过得去</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#6b7280">实测于 langgraph 1.2.11 —— 双向都只认「两边都有的字段」</text>

  <!-- 父图 -->
  <rect x="30" y="70" width="250" height="150" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="155" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">父图 State</text>
  <rect x="50" y="104" width="210" height="26" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.1"/>
  <text x="155" y="122" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#0f172a">secret: str</text>
  <rect x="50" y="134" width="210" height="26" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="155" y="152" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#1e40af">log: list      ← 共享</text>
  <rect x="50" y="164" width="210" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="155" y="182" text-anchor="middle" font-size="10" fill="#64748b">（父图独有 secret）</text>
  <text x="155" y="206" text-anchor="middle" font-size="10" fill="#1e3a8a">实测：子图只看到 ['log']</text>

  <!-- 箭头 父->子 -->
  <path d="M280 145 L330 145" stroke="#6366f1" stroke-width="2.5" marker-end="url(#p1)"/>
  <text x="305" y="136" text-anchor="middle" font-size="9" fill="#4f46e5">进</text>

  <!-- 子图 -->
  <rect x="330" y="70" width="250" height="150" rx="9" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="455" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#6b21a8">子图 State</text>
  <rect x="350" y="104" width="210" height="26" rx="5" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.3"/>
  <text x="455" y="122" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#6b21a8">log: list      ← 共享</text>
  <rect x="350" y="134" width="210" height="26" rx="5" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.1"/>
  <text x="455" y="152" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#0f172a">only_sub: str</text>
  <rect x="350" y="164" width="210" height="26" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="455" y="182" text-anchor="middle" font-size="10" fill="#b91c1c">子图写了 only_sub</text>
  <text x="455" y="206" text-anchor="middle" font-size="10" fill="#7e22ce">实测：secret 收不到</text>

  <!-- 箭头 子->父 -->
  <path d="M580 175 L630 175" stroke="#6366f1" stroke-width="2.5" marker-end="url(#p1)"/>
  <text x="605" y="166" text-anchor="middle" font-size="9" fill="#4f46e5">出</text>

  <!-- 结果 -->
  <rect x="630" y="70" width="260" height="150" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="760" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">父图最终拿到</text>
  <rect x="650" y="104" width="220" height="26" rx="5" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.1"/>
  <text x="760" y="122" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#065f46">secret: 'x'</text>
  <rect x="650" y="134" width="220" height="26" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="760" y="152" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#065f46">log: ['子图写了', ...]</text>
  <rect x="650" y="164" width="220" height="26" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="760" y="182" text-anchor="middle" font-size="10" fill="#b91c1c">only_sub   ❌ 被吞掉</text>
  <text x="760" y="206" text-anchor="middle" font-size="10" fill="#166534">实测 keys = ['log','secret']</text>

  <!-- 结论条 -->
  <rect x="30" y="238" width="860" height="52" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="460" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">一句话：父子之间只传「两边 schema 都声明了的字段」，单向私有字段各留各的</text>
  <text x="460" y="280" text-anchor="middle" font-size="11" fill="#1e3a8a">想让子图结果传出来，必须在父图 State 里也声明那个字段 —— 否则静默丢弃，不报错</text>

  <!-- checkpoint_ns -->
  <rect x="30" y="304" width="425" height="120" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="242" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">子图不挂 checkpointer：内部不单独存档</text>
  <text x="242" y="348" text-anchor="middle" font-size="10" fill="#475569">父图历史 4 条，子图内部两步合成一条：</text>
  <text x="60" y="368" font-size="9" font-family="ui-monospace,monospace" fill="#0f172a">ns='' next=()     log=[子图内A, 子图内B, 父收尾]</text>
  <text x="60" y="386" font-size="9" font-family="ui-monospace,monospace" fill="#0f172a">ns='' next=('o',) log=[子图内A, 子图内B]</text>
  <text x="60" y="404" font-size="9" font-family="ui-monospace,monospace" fill="#059669">子图内部没单独 checkpoint</text>

  <rect x="475" y="304" width="415" height="120" rx="9" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
  <text x="682" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">想看子图内部：stream(subgraphs=True)</text>
  <text x="682" y="348" text-anchor="middle" font-size="10" fill="#78350f">输出变 (命名空间, 数据) 元组：</text>
  <text x="500" y="368" font-size="9" font-family="ui-monospace,monospace" fill="#0f172a">ns=('sub:b44bbf92-...',)  chunk=['i1']</text>
  <text x="500" y="386" font-size="9" font-family="ui-monospace,monospace" fill="#0f172a">ns=('sub:b44bbf92-...',)  chunk=['i2']</text>
  <text x="500" y="404" font-size="9" font-family="ui-monospace,monospace" fill="#b45309">ns=() chunk=['sub']  ← 父图视角只 1 步</text>

  <!-- 错误传播 -->
  <rect x="30" y="438" width="425" height="86" rx="9" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.3"/>
  <text x="242" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">子图抛错，父图能兜住（实测）</text>
  <text x="242" y="480" text-anchor="middle" font-size="10" fill="#065f46">父图 add_node('sub', sub, error_handler=...)</text>
  <text x="242" y="498" text-anchor="middle" font-size="10" fill="#047857">-> ['父图兜住了']   ✅ 不炸整张图</text>
  <text x="242" y="514" text-anchor="middle" font-size="10" fill="#065f46">retry 要配在子图内部节点上（实测跑 3 次）</text>

  <rect x="475" y="438" width="415" height="86" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="682" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">代价：父图看不见子图内部</text>
  <text x="682" y="480" text-anchor="middle" font-size="10" fill="#7f1d1d">排障时父图只知道「sub 这一步出事了」</text>
  <text x="682" y="498" text-anchor="middle" font-size="10" fill="#7f1d1d">不知道子图里四个节点卡在第几个</text>
  <text x="682" y="514" text-anchor="middle" font-size="10" fill="#991b1b">-> 必须开 subgraphs=True 才看得见</text>

  <defs>
    <marker id="p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6366f1"/></marker>
  </defs>
</svg>
