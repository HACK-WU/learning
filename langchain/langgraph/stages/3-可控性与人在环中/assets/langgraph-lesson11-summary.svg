<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">课 11 知识全景：Functional API 与选型</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#6b7280">给刚学完的你复习：怎么写 / 存到哪 / 怎么选 / 混用的坑 → 往下接什么</text>

  <!-- 列1 怎么写 -->
  <rect x="30" y="76" width="200" height="322" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="130" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">① 怎么写</text>

  <rect x="48" y="116" width="164" height="62" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="130" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">@entrypoint</text>
  <text x="130" y="154" text-anchor="middle" font-size="10" fill="#475569">整个流程的入口</text>
  <text x="130" y="170" text-anchor="middle" font-size="10" fill="#475569">编译后就是 Pregel</text>

  <rect x="48" y="186" width="164" height="76" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="130" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">@task ★</text>
  <text x="130" y="224" text-anchor="middle" font-size="9" fill="#475569">标注了才进存档点</text>
  <text x="130" y="240" text-anchor="middle" font-size="9" fill="#475569">返回 Future</text>
  <text x="130" y="254" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">不 .result() 就拿不到</text>

  <rect x="48" y="270" width="164" height="62" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="130" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">并发靠不急着取</text>
  <text x="130" y="308" text-anchor="middle" font-size="10" fill="#475569">先全提交再统一收</text>
  <text x="130" y="324" text-anchor="middle" font-size="10" fill="#059669">实测 0.30s vs 0.60s</text>

  <rect x="48" y="340" width="164" height="42" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="130" y="358" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">分支 / 循环</text>
  <text x="130" y="374" text-anchor="middle" font-size="9" fill="#475569">就是 if / while</text>

  <!-- 列2 存到哪 -->
  <rect x="248" y="76" width="200" height="322" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="348" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">② 存到哪</text>

  <rect x="266" y="116" width="164" height="62" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="348" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">previous 参数</text>
  <text x="348" y="154" text-anchor="middle" font-size="10" fill="#475569">上一次的返回值</text>
  <text x="348" y="170" text-anchor="middle" font-size="10" fill="#475569">这就是"状态"</text>

  <rect x="266" y="186" width="164" height="76" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="348" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">没有具名字段 ★</text>
  <text x="348" y="224" text-anchor="middle" font-size="9" fill="#7f1d1d">改只能整体替换</text>
  <text x="348" y="240" text-anchor="middle" font-size="9" fill="#7f1d1d">不能逐字段改</text>
  <text x="348" y="254" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">历史只有 2 条</text>

  <rect x="266" y="270" width="164" height="76" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="348" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Graph 对照</text>
  <text x="348" y="308" text-anchor="middle" font-size="9" fill="#475569">Graph 历史 4 条</text>
  <text x="348" y="322" text-anchor="middle" font-size="9" fill="#475569">能 update_state 逐字段</text>
  <text x="348" y="338" text-anchor="middle" font-size="9" fill="#059669">next 能看到下一步</text>

  <rect x="266" y="354" width="164" height="28" rx="7" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
  <text x="348" y="372" text-anchor="middle" font-size="9" fill="#854d0e">挂 cp 必须传 config ★</text>

  <!-- 列3 怎么选 -->
  <rect x="466" y="76" width="200" height="322" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="566" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">③ 怎么选</text>

  <rect x="484" y="116" width="164" height="76" rx="7" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="566" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">选 Graph</text>
  <text x="566" y="154" text-anchor="middle" font-size="9" fill="#475569">步骤多、要回头改</text>
  <text x="566" y="170" text-anchor="middle" font-size="9" fill="#475569">要逐格 inspect 状态</text>
  <text x="566" y="184" text-anchor="middle" font-size="9" fill="#475569">多人接手看拓扑</text>

  <rect x="484" y="200" width="164" height="76" rx="7" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="566" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">选 Functional</text>
  <text x="566" y="238" text-anchor="middle" font-size="9" fill="#475569">已有脚本要改造</text>
  <text x="566" y="252" text-anchor="middle" font-size="9" fill="#475569">步骤直、分支就是 if</text>
  <text x="566" y="268" text-anchor="middle" font-size="9" fill="#475569">想少写样板代码</text>

  <rect x="484" y="284" width="164" height="76" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="566" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">反过来想 ★</text>
  <text x="566" y="322" text-anchor="middle" font-size="9" fill="#7f1d1d">不是"哪个更好"</text>
  <text x="566" y="338" text-anchor="middle" font-size="9" fill="#7f1d1d">是"中间过程要不要"</text>
  <text x="566" y="352" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">被人看见和改</text>

  <rect x="484" y="368" width="164" height="14" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="566" y="379" text-anchor="middle" font-size="8" fill="#475569">两套能力对等</text>

  <!-- 列4 混用 -->
  <rect x="684" y="76" width="186" height="322" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="777" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">④ 混用</text>

  <rect x="702" y="116" width="150" height="62" rx="7" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text x="777" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">图当函数调</text>
  <text x="777" y="154" text-anchor="middle" font-size="10" fill="#475569">task 里 invoke 图</text>
  <text x="777" y="170" text-anchor="middle" font-size="10" fill="#059669">实测可行</text>

  <rect x="702" y="186" width="150" height="76" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="777" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">存档各管各 ★</text>
  <text x="777" y="224" text-anchor="middle" font-size="9" fill="#7f1d1d">内层图用自己的</text>
  <text x="777" y="240" text-anchor="middle" font-size="9" fill="#7f1d1d">thread_id</text>
  <text x="777" y="254" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">外层管不到</text>

  <rect x="702" y="270" width="150" height="76" rx="7" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text x="777" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#6b21a8">缓存要两头配</text>
  <text x="777" y="308" text-anchor="middle" font-size="9" fill="#475569">task 有 cache_policy</text>
  <text x="777" y="324" text-anchor="middle" font-size="9" fill="#475569">entrypoint 还得配 cache</text>
  <text x="777" y="338" text-anchor="middle" font-size="9" fill="#059669">配了才跨 thread</text>

  <rect x="702" y="354" width="150" height="28" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="777" y="372" text-anchor="middle" font-size="9" fill="#475569">同步 timeout 装饰即抛</text>

  <!-- 底部 -->
  <rect x="30" y="412" width="840" height="70" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="450" y="434" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">往下接：阶段 4 课 12《Application structure 与测试》（项目结构 / 单元与集成测试 / 向后兼容）</text>
  <text x="450" y="454" text-anchor="middle" font-size="11" fill="#475569">抉择：@task 才是持久化的单位（普通函数 resume 必重跑）；previous 是 Functional 的"状态"但它没有具名字段（历史 2 条 vs Graph 4 条）；</text>
  <text x="450" y="472" text-anchor="middle" font-size="11" fill="#475569">选型不是比优劣，是问"中间过程要不要被看见和逐格改"——要就 Graph，不要就 Functional</text>
</svg>
