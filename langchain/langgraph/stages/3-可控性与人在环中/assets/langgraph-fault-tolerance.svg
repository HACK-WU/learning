<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">一处出错就得整单重来，还是重试一下就好</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">上面：一个环节卡住，整单就废了 ｜ 下面：卡住的那一环自己重试，别的照走</text>

  <!-- 上：整单废掉 -->
  <rect x="40" y="78" width="820" height="180" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="230" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#b91c1c">一个环节卡住，整单就废了</text>

  <rect x="66" y="118" width="90" height="44" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="111" y="138" text-anchor="middle" font-size="11" fill="#7f1d1d">接单</text>
  <text x="111" y="154" text-anchor="middle" font-size="9" fill="#991b1b">已完成</text>

  <path d="M156 140 L176 140" stroke="#f87171" stroke-width="2" marker-end="url(#r1)"/>

  <rect x="176" y="118" width="90" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="221" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">调外部接口</text>
  <text x="221" y="154" text-anchor="middle" font-size="9" fill="#7f1d1d">网络抖了一下</text>

  <path d="M266 140 L286 140" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="286" y="118" width="90" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="331" y="138" text-anchor="middle" font-size="11" fill="#94a3b8">生成结论</text>
  <text x="331" y="154" text-anchor="middle" font-size="9" fill="#94a3b8">没轮到</text>

  <path d="M376 140 L396 140" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="396" y="118" width="90" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="441" y="138" text-anchor="middle" font-size="11" fill="#94a3b8">通知客户</text>
  <text x="441" y="154" text-anchor="middle" font-size="9" fill="#94a3b8">没轮到</text>

  <rect x="516" y="112" width="316" height="56" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="674" y="134" text-anchor="middle" font-size="11" fill="#7f1d1d">整单报错退出，前面的活全白干</text>
  <text x="674" y="152" text-anchor="middle" font-size="11" fill="#991b1b">客户只看到一句"处理失败"</text>

  <text x="450" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">❌ 一次抖动 = 整单重来</text>
  <text x="450" y="218" text-anchor="middle" font-size="11" fill="#7f1d1d">而且没人知道该重试哪一步</text>
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="#7f1d1d">流程一大，整张图都改不动</text>

  <!-- 下：只重试那一环 -->
  <rect x="40" y="272" width="820" height="180" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="450" y="296" text-anchor="middle" font-size="15" font-weight="600" fill="#047857">卡住的那一环自己重试，流程再拆成小块</text>

  <rect x="66" y="312" width="90" height="44" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="111" y="332" text-anchor="middle" font-size="11" fill="#065f46">接单</text>
  <text x="111" y="348" text-anchor="middle" font-size="9" fill="#047857">已完成</text>

  <path d="M156 334 L176 334" stroke="#34d399" stroke-width="2" marker-end="url(#g1)"/>

  <rect x="176" y="312" width="118" height="44" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="235" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">调外部接口</text>
  <text x="235" y="346" text-anchor="middle" font-size="9" fill="#047857">自己重试 3 次</text>

  <path d="M240 356 L240 372 M236 366 L240 372 L244 366 Z" stroke="#059669" stroke-width="1.4" fill="#059669"/>

  <path d="M294 334 L314 334" stroke="#34d399" stroke-width="2" marker-end="url(#g1)"/>

  <rect x="314" y="312" width="90" height="44" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="359" y="332" text-anchor="middle" font-size="11" fill="#065f46">生成结论</text>
  <text x="359" y="348" text-anchor="middle" font-size="9" fill="#047857">照常走</text>

  <path d="M404 334 L424 334" stroke="#34d399" stroke-width="2" marker-end="url(#g1)"/>

  <rect x="424" y="312" width="90" height="44" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="469" y="332" text-anchor="middle" font-size="11" fill="#065f46">通知客户</text>
  <text x="469" y="348" text-anchor="middle" font-size="9" fill="#047857">照常走</text>

  <rect x="240" y="376" width="150" height="46" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="315" y="396" text-anchor="middle" font-size="11" fill="#7f1d1d">真不行就走兜底</text>
  <text x="315" y="414" text-anchor="middle" font-size="11" fill="#991b1b">不拖垮整张图</text>

  <rect x="546" y="312" width="286" height="110" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="689" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">大流程拆成子流程</text>
  <text x="689" y="354" text-anchor="middle" font-size="10" fill="#047857">每块只看自己要的字段</text>
  <text x="689" y="372" text-anchor="middle" font-size="10" fill="#047857">改一块不动别的</text>
  <text x="689" y="392" text-anchor="middle" font-size="10" fill="#047857">代价：外面看不到里面</text>
  <text x="689" y="412" text-anchor="middle" font-size="10" fill="#047857">排障要专门打开才看得见</text>

  <text x="240" y="440" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">✅ 抖动自己扛，块与块互不拖累</text>

  <defs>
    <marker id="r1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f87171"/></marker>
    <marker id="g1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#34d399"/></marker>
  </defs>
</svg>
