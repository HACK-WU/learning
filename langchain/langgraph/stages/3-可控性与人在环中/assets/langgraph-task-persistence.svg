<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="920" height="540" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">task 持久化：什么时候真复用，什么时候白重跑</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#6b7280">实测于 langgraph 1.2.11 —— 同一个 thread，同一段流程</text>

  <!-- 上：task 版 -->
  <rect x="24" y="68" width="428" height="200" rx="9" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="238" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">用 @task 标注：resume 时不重跑已做的</text>

  <rect x="44" y="104" width="180" height="40" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="134" y="122" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">第一次 invoke</text>
  <text x="134" y="138" text-anchor="middle" font-size="9" fill="#475569">t_a 跑了 → 计数 1</text>

  <path d="M224 124 L252 124" stroke="#22c55e" stroke-width="2" marker-end="url(#b1)"/>

  <rect x="252" y="104" width="180" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="342" y="122" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">卡在 interrupt</text>
  <text x="342" y="138" text-anchor="middle" font-size="9" fill="#7f1d1d">t_b 还没轮到 → 计数 0</text>

  <path d="M134 144 L134 172 L342 172 L342 152" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#b1)"/>
  <text x="238" y="190" text-anchor="middle" font-size="10" fill="#166534">resume 后：t_a 1→1（复用），t_b 0→1（新跑）</text>

  <rect x="44" y="200" width="388" height="52" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="238" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">实测：t_a 累计 1 次，t_b 累计 1 次</text>
  <text x="238" y="240" text-anchor="middle" font-size="10" fill="#047857">副作用（打日志 / 调外部接口）没有重复发生</text>

  <!-- 下：普通函数版 -->
  <rect x="24" y="282" width="428" height="200" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="238" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">不用 @task（普通函数）：每次都重跑</text>

  <rect x="44" y="318" width="180" height="40" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="134" y="336" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">第一次 invoke</text>
  <text x="134" y="352" text-anchor="middle" font-size="9" fill="#7f1d1d">plain_a 跑了 → 计数 1</text>

  <path d="M224 338 L252 338" stroke="#ef4444" stroke-width="2" marker-end="url(#b2)"/>

  <rect x="252" y="318" width="180" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="342" y="336" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">卡在 interrupt</text>
  <text x="342" y="352" text-anchor="middle" font-size="9" fill="#7f1d1d">等待人工确认</text>

  <path d="M134 358 L134 386 L342 386 L342 366" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#b2)"/>
  <text x="238" y="404" text-anchor="middle" font-size="10" fill="#b91c1c">resume 后：plain_a 1→2（又跑了一遍）</text>

  <rect x="44" y="414" width="388" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="238" y="434" text-anchor="middle" font-size="10" font-weight="700" fill="#7f1d1d">实测：plain_a 累计 2 次</text>
  <text x="238" y="454" text-anchor="middle" font-size="10" fill="#991b1b">副作用重复发生 —— 调外部接口就重复调了</text>

  <!-- 右：结论 -->
  <rect x="468" y="68" width="428" height="200" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="682" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">复用发生在哪一层？</text>
  <rect x="488" y="104" width="388" height="30" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.1"/>
  <text x="682" y="124" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#1e3a8a">invoke → t_a → interrupt</text>
  <rect x="488" y="138" width="388" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="682" y="158" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#1e3a8a">resume → 从 t_a 之后接，不重跑 t_a</text>
  <text x="682" y="192" text-anchor="middle" font-size="10" fill="#1e3a8a">因为 t_a 的结果已写进 checkpoint，</text>
  <text x="682" y="210" text-anchor="middle" font-size="10" fill="#1e3a8a">resume 是从存档点继续，不是从头重来</text>
  <rect x="488" y="222" width="388" height="32" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
  <text x="682" y="242" text-anchor="middle" font-size="10" fill="#854d0e">⚠ 普通函数没进 checkpoint，只能重跑</text>

  <rect x="468" y="282" width="428" height="200" rx="9" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="682" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#6b21a8">三次 interrupt 的累计（实测）</text>
  <rect x="488" y="318" width="388" height="28" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.1"/>
  <text x="682" y="337" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#6b21a8">invoke 1 → interrupt  → 累计 1 次</text>
  <rect x="488" y="350" width="388" height="28" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.1"/>
  <text x="682" y="369" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#6b21a8">resume 1 → interrupt  → 累计 2 次</text>
  <rect x="488" y="382" width="388" height="28" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="682" y="401" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#065f46">resume 2 → 完成      → 累计 3 次</text>
  <text x="682" y="432" text-anchor="middle" font-size="10" fill="#7e22ce">每次 resume 只跑新增的 task</text>
  <text x="682" y="450" text-anchor="middle" font-size="10" fill="#7e22ce">3 个 task 总共只跑了 3 次，不是 3×3</text>
  <text x="682" y="470" text-anchor="middle" font-size="10" font-weight="600" fill="#6b21a8">这正是 @task 存在的理由</text>

  <rect x="24" y="496" width="872" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="460" y="517" text-anchor="middle" font-size="11" fill="#334155">一句话：@task 把这一步的结果写进存档点；普通函数是"没记住"，resume 时只能重算</text>

  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#22c55e"/></marker>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ef4444"/></marker>
  </defs>
</svg>
