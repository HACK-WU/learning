<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">课 6 知识全景：Store 长期记忆</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#6b7280">给刚学完的你复习：柜子是什么 / 东西怎么摆 / 摆什么进去 → 往下接什么</text>

  <!-- 第一列：是什么 -->
  <rect x="30" y="76" width="270" height="300" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="165" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">① 柜子是什么</text>

  <rect x="50" y="116" width="230" height="54" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="165" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">在图外面，编译时交给图</text>
  <text x="165" y="155" text-anchor="middle" font-size="11" fill="#475569">compile(checkpointer=, store=)</text>

  <rect x="50" y="178" width="230" height="54" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="165" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">不归任何一次对话</text>
  <text x="165" y="217" text-anchor="middle" font-size="11" fill="#475569">换 thread 照样读到（实测 0/1/2 条）</text>

  <rect x="50" y="240" width="230" height="54" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="165" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">四个动作：放 / 取 / 找 / 删</text>
  <text x="165" y="279" text-anchor="middle" font-size="11" fill="#475569">put / get / search / delete</text>

  <rect x="50" y="302" width="230" height="58" rx="7" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="165" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">不挂 store 会怎样</text>
  <text x="165" y="341" text-anchor="middle" font-size="11" fill="#78350f">节点里 store 是 None</text>
  <text x="165" y="356" text-anchor="middle" font-size="11" fill="#78350f">实测 AttributeError</text>

  <!-- 第二列：怎么摆 -->
  <rect x="315" y="76" width="270" height="300" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="450" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">② 东西怎么摆</text>

  <rect x="335" y="116" width="230" height="54" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="450" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">一串名字定位置</text>
  <text x="450" y="155" text-anchor="middle" font-size="11" fill="#475569">(用户, 类别) 常用两层</text>

  <rect x="335" y="178" width="230" height="54" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="450" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">搜上层 = 连下层一起</text>
  <text x="450" y="217" text-anchor="middle" font-size="11" fill="#475569">实测 ("1",) 捞到 4 条</text>

  <rect x="335" y="240" width="230" height="54" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="450" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">默认只给 10 条</text>
  <text x="450" y="279" text-anchor="middle" font-size="11" fill="#475569">写 25 条实测只回来 10 条</text>

  <rect x="335" y="302" width="230" height="58" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="450" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">第一层别用对话编号</text>
  <text x="450" y="341" text-anchor="middle" font-size="11" fill="#7f1d1d">用 thread_id 就是按会话分格</text>
  <text x="450" y="356" text-anchor="middle" font-size="11" fill="#7f1d1d">换会话即失忆，等于白做</text>

  <!-- 第三列：放什么 -->
  <rect x="600" y="76" width="270" height="300" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="735" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">③ 放什么进去</text>

  <rect x="620" y="116" width="230" height="62" rx="7" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text x="735" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">不会变的事（语义）</text>
  <text x="735" y="154" text-anchor="middle" font-size="11" fill="#475569">"偏好邮件沟通"</text>
  <text x="735" y="170" text-anchor="middle" font-size="11" fill="#475569">一份档案，反复改写它</text>

  <rect x="620" y="186" width="230" height="62" rx="7" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text x="735" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">发生过的事（情景）</text>
  <text x="735" y="224" text-anchor="middle" font-size="11" fill="#475569">"上次退款被拒，原因是 X"</text>
  <text x="735" y="240" text-anchor="middle" font-size="11" fill="#475569">一条条攒，靠像不像来找</text>

  <rect x="620" y="256" width="230" height="62" rx="7" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text x="735" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">做事的规矩（程序）</text>
  <text x="735" y="294" text-anchor="middle" font-size="11" fill="#475569">"回他之前先确认订单号"</text>
  <text x="735" y="310" text-anchor="middle" font-size="11" fill="#475569">改的是它自己的行为</text>

  <rect x="620" y="326" width="230" height="34" rx="7" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="735" y="347" text-anchor="middle" font-size="11" fill="#78350f">三类不是三种 API，是三种用法</text>

  <!-- 底部：往下接 -->
  <rect x="30" y="392" width="840" height="48" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="450" y="412" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">往下接：课 7 让它边跑边说 ｜ 课 8 人在环里改状态 ｜ 课 9 回到过去重跑</text>
  <text x="450" y="430" text-anchor="middle" font-size="11" fill="#475569">「语义记忆」≠「语义搜索」：前者存什么，后者怎么找（不配 embedding 时 query 会被静默忽略，实测）</text>
</svg>
