<svg xmlns="http://www.w3.org/2000/svg" width="910" height="540" viewBox="0 0 910 540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="910" height="540" fill="#ffffff"/>

  <defs>
    <marker id="c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>

  <text x="455" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#16324f">存档点：每跑完一批，就把当时的状态拍一张快照</text>

  <rect x="16" y="42" width="878" height="150" rx="12" fill="#f7f9fc" stroke="#c9d4e2" stroke-width="1.5"/>
  <text x="455" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">一条直线图跑一次，会留下 4 张快照（实测）</text>

  <rect x="46" y="84" width="150" height="46" rx="8" fill="#eceff4" stroke="#8a97a8" stroke-width="1.3"/>
  <text x="121" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#33415c">① 还没开工</text>
  <text x="121" y="123" text-anchor="middle" font-size="11" fill="#5b6b7f">下一步：开头</text>

  <line x1="196" y1="107" x2="232" y2="107" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#c5)"/>

  <rect x="236" y="84" width="150" height="46" rx="8" fill="#e5f4ff" stroke="#006ddd" stroke-width="1.3"/>
  <text x="311" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#16324f">② 收到你的输入</text>
  <text x="311" y="123" text-anchor="middle" font-size="11" fill="#5b6b7f">下一步：第一个方框</text>

  <line x1="386" y1="107" x2="422" y2="107" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#c5)"/>

  <rect x="426" y="84" width="150" height="46" rx="8" fill="#e5f4ff" stroke="#006ddd" stroke-width="1.3"/>
  <text x="501" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#16324f">③ 第一个方框跑完</text>
  <text x="501" y="123" text-anchor="middle" font-size="11" fill="#5b6b7f">下一步：第二个方框</text>

  <line x1="576" y1="107" x2="612" y2="107" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#c5)"/>

  <rect x="616" y="84" width="150" height="46" rx="8" fill="#eaf7ee" stroke="#2e8540" stroke-width="1.3"/>
  <text x="691" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5c2b">④ 全跑完</text>
  <text x="691" y="123" text-anchor="middle" font-size="11" fill="#5b6b7f">下一步：没有</text>

  <text x="455" y="156" text-anchor="middle" font-size="12" fill="#5b6b7f">每张快照都记着两件事：<tspan font-weight="700">现在的状态</tspan> 和 <tspan font-weight="700">下一批该跑谁</tspan></text>
  <text x="455" y="176" text-anchor="middle" font-size="12" fill="#5b6b7f">所以回到任意一张快照，都能从那里接着跑</text>

  <rect x="16" y="206" width="286" height="316" rx="12" fill="#fbfcfe" stroke="#c9d4e2" stroke-width="1.5"/>
  <text x="159" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#16324f">区分"哪一次对话"</text>
  <line x1="42" y1="246" x2="276" y2="246" stroke="#dde4ec" stroke-width="1.2"/>
  <text x="159" y="270" text-anchor="middle" font-size="12" fill="#33415c">每次跑都要带一个<b>会话编号</b></text>
  <text x="159" y="292" text-anchor="middle" font-size="12" fill="#33415c">编号相同 = 接着上次</text>
  <text x="159" y="314" text-anchor="middle" font-size="12" fill="#33415c">编号不同 = 全新开始</text>
  <rect x="42" y="330" width="234" height="42" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.3"/>
  <text x="159" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#8f2318">忘了带编号会直接报错</text>
  <rect x="42" y="382" width="234" height="56" rx="8" fill="#fff8ea" stroke="#e0b060" stroke-width="1.3"/>
  <text x="159" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5200">注意：接着跑 ≠ 覆盖</text>
  <text x="159" y="424" text-anchor="middle" font-size="11" fill="#8a5200">会叠加字段（实测 3 项）</text>
  <text x="159" y="500" text-anchor="middle" font-size="11" fill="#5b6b7f">想真重来 → 换编号</text>

  <rect x="318" y="206" width="286" height="316" rx="12" fill="#fbfcfe" stroke="#c9d4e2" stroke-width="1.5"/>
  <text x="461" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#16324f">存到哪：三种地方</text>
  <line x1="344" y1="246" x2="578" y2="246" stroke="#dde4ec" stroke-width="1.2"/>

  <rect x="344" y="258" width="234" height="48" rx="8" fill="#eceff4" stroke="#8a97a8" stroke-width="1.3"/>
  <text x="461" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#33415c">只在内存里</text>
  <text x="461" y="296" text-anchor="middle" font-size="11" fill="#5b6b7f">写完就跑，关掉就没 → 练手</text>

  <rect x="344" y="316" width="234" height="48" rx="8" fill="#e5f4ff" stroke="#006ddd" stroke-width="1.3"/>
  <text x="461" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#16324f">一个本地文件</text>
  <text x="461" y="354" text-anchor="middle" font-size="11" fill="#5b6b7f">重启还在 → 单机 / 本地调试</text>

  <rect x="344" y="374" width="234" height="48" rx="8" fill="#eaf7ee" stroke="#2e8540" stroke-width="1.3"/>
  <text x="461" y="394" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5c2b">正经数据库</text>
  <text x="461" y="412" text-anchor="middle" font-size="11" fill="#5b6b7f">多人同时用 → 线上</text>

  <rect x="344" y="432" width="234" height="72" rx="8" fill="#fff8ea" stroke="#e0b060" stroke-width="1.3"/>
  <text x="461" y="452" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5200">实测：换成本地文件后</text>
  <text x="461" y="470" text-anchor="middle" font-size="11" fill="#8a5200">换一个进程打开，上次还在</text>
  <text x="461" y="490" text-anchor="middle" font-size="11" fill="#8a5200">（内存版读出来是空的）</text>

  <rect x="620" y="206" width="274" height="316" rx="12" fill="#f7f9fc" stroke="#c9d4e2" stroke-width="1.5"/>
  <text x="757" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#16324f">中途崩了怎么办</text>
  <line x1="646" y1="246" x2="868" y2="246" stroke="#dde4ec" stroke-width="1.2"/>
  <text x="757" y="270" text-anchor="middle" font-size="12" fill="#33415c">跑崩的那一刻，</text>
  <text x="757" y="290" text-anchor="middle" font-size="12" fill="#33415c">已经跑完的<b>已经存下来了</b></text>
  <rect x="646" y="306" width="222" height="52" rx="8" fill="#eaf7ee" stroke="#2e8540" stroke-width="1.4"/>
  <text x="757" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5c2b">修好再跑 → 只跑崩掉那个</text>
  <text x="757" y="348" text-anchor="middle" font-size="11" fill="#33513a">实测：前两个一格没重跑</text>
  <line x1="646" y1="372" x2="868" y2="372" stroke="#dde4ec" stroke-width="1.2"/>
  <text x="757" y="396" text-anchor="middle" font-size="12" fill="#5b6b7f">这靠的是"每格单独记账"</text>
  <text x="757" y="416" text-anchor="middle" font-size="12" fill="#5b6b7f">崩掉那格不算数，</text>
  <text x="757" y="434" text-anchor="middle" font-size="12" fill="#5b6b7f">其余的照旧保留</text>
  <rect x="646" y="450" width="222" height="56" rx="8" fill="#fff8ea" stroke="#e0b060" stroke-width="1.3"/>
  <text x="757" y="474" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5200">往下接：能回到过去</text>
  <text x="757" y="494" text-anchor="middle" font-size="11" fill="#8a5200">前提就是这些快照</text>
</svg>
