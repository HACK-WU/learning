<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">档案柜的分层：路径写错一处，东西就找不回来</text>
  <text x="440" y="52" text-anchor="middle" font-size="12" fill="#6b7280">左边：官方示例的两层 ｜ 右边：搜上层能连下层一起拿到（实测）</text>

  <!-- 左侧：两层结构 -->
  <rect x="40" y="76" width="400" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="240" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">一个存放位置 = 一串名字</text>

  <rect x="70" y="118" width="150" height="46" rx="7" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="145" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">第一层：谁</text>
  <text x="145" y="157" text-anchor="middle" font-size="11" fill="#1e3a8a">"1" ＝ 用户编号</text>

  <rect x="240" y="118" width="170" height="46" rx="7" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="325" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">第二层：哪一类</text>
  <text x="325" y="157" text-anchor="middle" font-size="11" fill="#78350f">"memories" ＝ 记下来的事</text>

  <text x="230" y="192" text-anchor="middle" font-size="12" fill="#475569">合起来写作 ("1", "memories")，是个「括号串」</text>

  <rect x="70" y="208" width="340" height="80" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="86" y="230" font-size="11" fill="#64748b">放东西时要给一个「条目名」：</text>
  <text x="86" y="252" font-size="12" font-family="ui-monospace,monospace" fill="#0f172a">store.put(("1","memories"), "m1", {...})</text>
  <text x="86" y="274" font-size="11" fill="#64748b">条目名在同一个位置里要唯一，重名就是覆盖</text>

  <!-- 右侧：前缀搜索 -->
  <rect x="470" y="76" width="370" height="230" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="655" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">搜得越短，捞上来越多</text>

  <rect x="500" y="118" width="310" height="34" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="514" y="140" font-size="12" font-family="ui-monospace,monospace" fill="#0f172a">("1",)</text>
  <text x="620" y="140" font-size="11" fill="#166534">→ a, b, m1, m2（全捞）</text>

  <rect x="500" y="158" width="310" height="34" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="514" y="180" font-size="12" font-family="ui-monospace,monospace" fill="#0f172a">("1","memories")</text>
  <text x="645" y="180" font-size="11" fill="#166534">→ a, m1, m2</text>

  <rect x="500" y="198" width="310" height="34" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="514" y="220" font-size="12" font-family="ui-monospace,monospace" fill="#0f172a">("2",)</text>
  <text x="620" y="220" font-size="11" fill="#166534">→ c（只有自己的）</text>

  <text x="655" y="252" text-anchor="middle" font-size="11" fill="#15803d">前面几层对得上就算命中，不用写全</text>
  <text x="655" y="272" text-anchor="middle" font-size="11" fill="#15803d">实测：搜 ("1",) 能同时拿到 memories 和 profile</text>

  <!-- 底部：踩坑对照 -->
  <rect x="40" y="326" width="800" height="86" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="440" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">⚠ 最容易摆错的一层：把「对话编号」当第一层</text>
  <text x="440" y="374" text-anchor="middle" font-size="12" fill="#7f1d1d">("session-A","prefs") 和 ("session-B","prefs") 是两个互不相干的格子</text>
  <text x="440" y="396" text-anchor="middle" font-size="12" fill="#7f1d1d">实测：新开 session-C 去搜，拿到空列表  换个对话就失忆，白做</text>
</svg>
