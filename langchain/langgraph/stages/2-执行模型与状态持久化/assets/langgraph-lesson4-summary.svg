<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="940" height="520" fill="#ffffff"/>

  <defs>
    <marker id="s4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#16324f">课 4 全景：一批一批跑，引出两个新工具</text>

  <rect x="16" y="44" width="286" height="360" rx="12" fill="#f7f9fc" stroke="#c9d4e2" stroke-width="1.5"/>
  <text x="159" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#16324f">核心：批（superstep）</text>
  <text x="159" y="94" text-anchor="middle" font-size="12" fill="#33415c">同一批：读同一份快照</text>
  <text x="159" y="114" text-anchor="middle" font-size="12" fill="#33415c">跑完才合并，再开下批</text>

  <rect x="38" y="132" width="242" height="56" rx="9" fill="#e5f4ff" stroke="#006ddd" stroke-width="1.4"/>
  <text x="159" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#16324f">结论 1　并行分支互不可见</text>
  <text x="159" y="176" text-anchor="middle" font-size="11" fill="#16324f">实测：两个分支都看到空列表</text>

  <rect x="38" y="198" width="242" height="56" rx="9" fill="#e5f4ff" stroke="#006ddd" stroke-width="1.4"/>
  <text x="159" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#16324f">结论 2　轮数 = 批数</text>
  <text x="159" y="242" text-anchor="middle" font-size="11" fill="#16324f">接力占 2 批 → 课 3 问号解开</text>

  <rect x="38" y="264" width="242" height="56" rx="9" fill="#e5f4ff" stroke="#006ddd" stroke-width="1.4"/>
  <text x="159" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#16324f">结论 3　合并靠 reducer</text>
  <text x="159" y="308" text-anchor="middle" font-size="11" fill="#16324f">并行写同一字段要有 add</text>

  <rect x="38" y="330" width="242" height="56" rx="9" fill="#fde8e8" stroke="#c0392b" stroke-width="1.4"/>
  <text x="159" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#8f2318">边界　批数够多也会超限</text>
  <text x="159" y="374" text-anchor="middle" font-size="11" fill="#7a2f26">没有环也可能撞上限</text>

  <rect x="318" y="44" width="290" height="360" rx="12" fill="#fbfcfe" stroke="#c9d4e2" stroke-width="1.5"/>
  <text x="463" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#16324f">两个新工具怎么选</text>

  <rect x="340" y="86" width="246" height="140" rx="10" fill="#eaf7ee" stroke="#2e8540" stroke-width="1.5"/>
  <text x="463" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5c2b">Send</text>
  <text x="463" y="134" text-anchor="middle" font-size="12" fill="#33513a">份数跑起来才知道</text>
  <line x1="360" y1="148" x2="566" y2="148" stroke="#a9c9b3" stroke-width="1"/>
  <text x="463" y="170" text-anchor="middle" font-size="11" fill="#33513a">给每个分支一份<b>独立状态</b></text>
  <text x="463" y="190" text-anchor="middle" font-size="11" fill="#33513a">条件边做不到（实测 KeyError）</text>
  <text x="463" y="212" text-anchor="middle" font-size="11" fill="#5b7a63">产出要写回带 reducer 的字段</text>

  <rect x="340" y="240" width="246" height="146" rx="10" fill="#f3eafc" stroke="#7c4dbd" stroke-width="1.5"/>
  <text x="463" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#5b2f8f">Command</text>
  <text x="463" y="288" text-anchor="middle" font-size="12" fill="#5b2f8f">一个节点干两件事</text>
  <line x1="360" y1="302" x2="566" y2="302" stroke="#d5c0e8" stroke-width="1"/>
  <text x="463" y="324" text-anchor="middle" font-size="11" fill="#5b2f8f">改状态 + 决定去哪，一次写完</text>
  <text x="463" y="344" text-anchor="middle" font-size="11" fill="#5b2f8f">省掉"只看路不干活"的空节点</text>
  <rect x="356" y="356" width="214" height="22" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.2"/>
  <text x="463" y="371" text-anchor="middle" font-size="11" font-weight="700" fill="#8f2318">goto 拼错不报错，静默跳过</text>
  <text x="463" y="392" text-anchor="middle" font-size="10" fill="#7a2f26">（加 Literal 标注可编译期拦住）</text>

  <rect x="624" y="44" width="300" height="360" rx="12" fill="#f7f9fc" stroke="#c9d4e2" stroke-width="1.5"/>
  <text x="774" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#16324f">往下接什么</text>
  <text x="774" y="98" text-anchor="middle" font-size="12" fill="#33415c">每批跑完，状态都变了</text>
  <text x="774" y="120" text-anchor="middle" font-size="12" fill="#33415c">这些中间状态存哪？</text>
  <line x1="650" y1="140" x2="898" y2="140" stroke="#dde4ec" stroke-width="1.2"/>
  <text x="774" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5200">课 5　Checkpointer</text>
  <text x="774" y="190" text-anchor="middle" font-size="12" fill="#5b6b7f">每批结束打一个存档点</text>
  <text x="774" y="212" text-anchor="middle" font-size="12" fill="#5b6b7f">thread_id 区分会话</text>
  <text x="774" y="234" text-anchor="middle" font-size="12" fill="#5b6b7f">断线接着跑</text>
  <line x1="650" y1="256" x2="898" y2="256" stroke="#dde4ec" stroke-width="1.2"/>
  <text x="774" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#5b2f8f">再往后：课 9 Time-travel</text>
  <text x="774" y="306" text-anchor="middle" font-size="12" fill="#5b6b7f">能回到过去，</text>
  <text x="774" y="326" text-anchor="middle" font-size="12" fill="#5b6b7f">前提就是这些存档点</text>
  <rect x="650" y="346" width="248" height="42" rx="8" fill="#fff8ea" stroke="#e0b060" stroke-width="1.3"/>
  <text x="774" y="372" text-anchor="middle" font-size="11" fill="#8a5200">本课的"批"= 课 5 的"存档时机"</text>

  <line x1="302" y1="224" x2="318" y2="224" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#s4)"/>
  <line x1="608" y1="224" x2="624" y2="224" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#s4)"/>

  <rect x="16" y="418" width="908" height="84" rx="12" fill="#f7f9fc" stroke="#c9d4e2" stroke-width="1.5"/>
  <text x="470" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#16324f">一句话串起来</text>
  <text x="470" y="470" text-anchor="middle" font-size="13" fill="#33415c">一批一批跑，同批互不可见；份数不定用 Send 各带各的料，干活兼指路用 Command</text>
  <text x="470" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#8f2318">但 Command 的 goto 拼错不报错，只会静默跳过。</text>
</svg>
