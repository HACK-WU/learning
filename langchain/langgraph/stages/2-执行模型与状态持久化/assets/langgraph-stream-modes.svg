<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <rect width="920" height="470" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">七种「要的方式」：同一张图，换个参数拿到不同的东西</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#6b7280">实测于 langgraph 1.2.11 —— 网上常说四种，本机源码里其实是七种</text>

  <!-- 常用四种 -->
  <rect x="30" y="70" width="860" height="180" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="460" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">常用的四种（日常够用）</text>

  <rect x="48" y="104" width="200" height="128" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="148" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">values</text>
  <text x="148" y="146" text-anchor="middle" font-size="11" fill="#475569">每步之后的完整状态</text>
  <text x="58" y="168" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">{'draft':'', 'review':''}</text>
  <text x="58" y="184" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">{'draft':'草稿', 'review':''}</text>
  <text x="58" y="200" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">{'draft':'草稿','review':'审阅'}</text>
  <text x="148" y="222" text-anchor="middle" font-size="10" fill="#dc2626">⚠ 每次重发全部，费带宽</text>

  <rect x="264" y="104" width="200" height="128" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="364" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">updates</text>
  <text x="364" y="146" text-anchor="middle" font-size="11" fill="#475569">只给这一步的改动</text>
  <text x="274" y="168" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">{'draft': {'draft':'草稿'}}</text>
  <text x="274" y="184" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">{'review':{'review':'审阅'}}</text>
  <text x="364" y="206" text-anchor="middle" font-size="10" fill="#059669">✓ 省带宽，要自己攒</text>
  <text x="364" y="222" text-anchor="middle" font-size="10" fill="#059669">并行节点分开吐</text>

  <rect x="480" y="104" width="200" height="128" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="580" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">messages</text>
  <text x="580" y="146" text-anchor="middle" font-size="11" fill="#475569">大模型的逐字输出</text>
  <text x="490" y="168" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">(token, 元数据) 二元组</text>
  <text x="580" y="192" text-anchor="middle" font-size="10" fill="#dc2626">⚠ 无大模型调用 = 0 条</text>
  <text x="580" y="208" text-anchor="middle" font-size="10" fill="#dc2626">（实测：纯节点拿到 0 个）</text>
  <text x="580" y="224" text-anchor="middle" font-size="10" fill="#475569">不是万能流</text>

  <rect x="696" y="104" width="176" height="128" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="784" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">custom</text>
  <text x="784" y="146" text-anchor="middle" font-size="11" fill="#475569">节点里自己喊的话</text>
  <text x="706" y="168" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">{'progress': 0.5}</text>
  <text x="706" y="184" font-size="10" font-family="ui-monospace,monospace" fill="#0f172a">{'msg': '一半'}</text>
  <text x="784" y="208" text-anchor="middle" font-size="10" fill="#dc2626">⚠ 不声明模式 = 静默丢弃</text>
  <text x="784" y="224" text-anchor="middle" font-size="10" fill="#475569">（实测：不报错）</text>

  <!-- 另外三种 -->
  <rect x="30" y="264" width="860" height="120" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="1.4"/>
  <text x="460" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">另外三种（源码里有，日常少见但排障好用）</text>

  <rect x="48" y="298" width="264" height="72" rx="8" fill="#ffffff" stroke="#fde047" stroke-width="1.2"/>
  <text x="180" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">checkpoints</text>
  <text x="180" y="340" text-anchor="middle" font-size="11" fill="#475569">每存一次档就报一次</text>
  <text x="180" y="358" text-anchor="middle" font-size="10" fill="#64748b">实测：3 次（需挂 checkpointer）</text>

  <rect x="330" y="298" width="264" height="72" rx="8" fill="#ffffff" stroke="#fde047" stroke-width="1.2"/>
  <text x="462" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">tasks</text>
  <text x="462" y="340" text-anchor="middle" font-size="11" fill="#475569">每个任务开始 / 结束各报一次</text>
  <text x="462" y="358" text-anchor="middle" font-size="10" fill="#64748b">实测：start / result 成对</text>

  <rect x="612" y="298" width="278" height="72" rx="8" fill="#ffffff" stroke="#fde047" stroke-width="1.2"/>
  <text x="751" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">debug</text>
  <text x="751" y="340" text-anchor="middle" font-size="11" fill="#475569">最详细：入参 / 结果 / 报错</text>
  <text x="751" y="358" text-anchor="middle" font-size="10" fill="#64748b">实测含 input / result / error</text>

  <!-- 底部提醒 -->
  <rect x="30" y="398" width="860" height="56" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="460" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">⚠ 实测撞出来的三件事</text>
  <text x="460" y="440" text-anchor="middle" font-size="11" fill="#7f1d1d">① 写错模式名不报错（静默无输出）　② custom 不声明就丢弃且不报错　③ messages 在没有大模型时一条都不吐</text>
</svg>
