<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ia" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fbfcfd"/>
  <text x="450" y="30" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1f2937">同一台发动机，装没装附件</text>
  <text x="450" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">左边是你现在手里的，右边是它给你的——中间的转圈动作，两边一模一样</text>

  <rect x="28" y="70" width="396" height="252" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="226" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">你原来手里的：一个会转的循环</text>

  <rect x="58" y="112" width="92" height="34" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="104" y="134" text-anchor="middle" font-size="11.5" fill="#334155">用户提问</text>

  <rect x="180" y="112" width="92" height="34" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="226" y="134" text-anchor="middle" font-size="11.5" fill="#334155">模型思考</text>

  <rect x="302" y="112" width="92" height="34" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="348" y="134" text-anchor="middle" font-size="11.5" fill="#334155">给出回答</text>

  <rect x="180" y="176" width="92" height="34" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="226" y="198" text-anchor="middle" font-size="11.5" fill="#334155">动手做事</text>

  <line x1="152" y1="129" x2="176" y2="129" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#ia)"/>
  <line x1="274" y1="129" x2="298" y2="129" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#ia)"/>
  <line x1="226" y1="150" x2="226" y2="172" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#ia)"/>
  <line x1="208" y1="172" x2="208" y2="150" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#ia)"/>

  <text x="226" y="238" text-anchor="middle" font-size="11" fill="#94a3b8">这圈能跑，但它只会转</text>

  <rect x="52" y="252" width="106" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="105" y="270" text-anchor="middle" font-size="10.5" fill="#94a3b8">要读写文件？</text>
  <text x="105" y="286" text-anchor="middle" font-size="10.5" fill="#b45309">自己接线</text>

  <rect x="172" y="252" width="106" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="225" y="270" text-anchor="middle" font-size="10.5" fill="#94a3b8">要记住上次？</text>
  <text x="225" y="286" text-anchor="middle" font-size="10.5" fill="#b45309">自己接线</text>

  <rect x="292" y="252" width="106" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="345" y="270" text-anchor="middle" font-size="10.5" fill="#94a3b8">要分头干？</text>
  <text x="345" y="286" text-anchor="middle" font-size="10.5" fill="#b45309">自己接线</text>

  <rect x="476" y="70" width="396" height="252" rx="10" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
  <text x="674" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1e4b7a">用了它之后：同一圈 + 装好的件</text>

  <rect x="506" y="112" width="86" height="34" rx="7" fill="#ffffff" stroke="#7fb2e5" stroke-width="1.3"/>
  <text x="549" y="134" text-anchor="middle" font-size="11.5" fill="#334155">用户提问</text>

  <rect x="618" y="112" width="86" height="34" rx="7" fill="#ffffff" stroke="#7fb2e5" stroke-width="1.3"/>
  <text x="661" y="134" text-anchor="middle" font-size="11.5" fill="#334155">模型思考</text>

  <rect x="730" y="112" width="86" height="34" rx="7" fill="#ffffff" stroke="#7fb2e5" stroke-width="1.3"/>
  <text x="773" y="134" text-anchor="middle" font-size="11.5" fill="#334155">给出回答</text>

  <rect x="618" y="176" width="86" height="34" rx="7" fill="#ffffff" stroke="#7fb2e5" stroke-width="1.3"/>
  <text x="661" y="198" text-anchor="middle" font-size="11.5" fill="#334155">动手做事</text>

  <line x1="594" y1="129" x2="614" y2="129" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#ia)"/>
  <line x1="706" y1="129" x2="726" y2="129" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#ia)"/>
  <line x1="661" y1="150" x2="661" y2="172" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#ia)"/>
  <line x1="643" y1="172" x2="643" y2="150" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#ia)"/>

  <rect x="500" y="248" width="84" height="54" rx="7" fill="#dff0e4" stroke="#86bfa0" stroke-width="1.3"/>
  <text x="542" y="266" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f5537">文件柜</text>
  <text x="542" y="282" text-anchor="middle" font-size="9.5" fill="#334155">读 / 写 / 搜</text>
  <text x="542" y="296" text-anchor="middle" font-size="9" fill="#64748b">已装好</text>

  <rect x="596" y="248" width="84" height="54" rx="7" fill="#dff0e4" stroke="#86bfa0" stroke-width="1.3"/>
  <text x="638" y="266" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f5537">笔记本</text>
  <text x="638" y="282" text-anchor="middle" font-size="9.5" fill="#334155">记住跨对话</text>
  <text x="638" y="296" text-anchor="middle" font-size="9" fill="#64748b">已装好</text>

  <rect x="692" y="248" width="84" height="54" rx="7" fill="#dff0e4" stroke="#86bfa0" stroke-width="1.3"/>
  <text x="734" y="266" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f5537">帮手</text>
  <text x="734" y="282" text-anchor="middle" font-size="9.5" fill="#334155">派分头干</text>
  <text x="734" y="296" text-anchor="middle" font-size="9" fill="#64748b">已装好</text>

  <rect x="788" y="248" width="72" height="54" rx="7" fill="#dff0e4" stroke="#86bfa0" stroke-width="1.3"/>
  <text x="824" y="266" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f5537">压缩器</text>
  <text x="824" y="282" text-anchor="middle" font-size="9.5" fill="#334155">太长就精简</text>
  <text x="824" y="296" text-anchor="middle" font-size="9" fill="#64748b">已装好</text>

  <line x1="661" y1="212" x2="661" y2="244" stroke="#86bfa0" stroke-width="1.3" stroke-dasharray="3 3"/>

  <rect x="28" y="344" width="844" height="56" rx="9" fill="#fff8ec" stroke="#e0b877" stroke-width="1.3"/>
  <text x="48" y="368" font-size="11.5" fill="#475569">看图：左边那圈和右边那圈，中间的转圈动作完全一样 —— 差别只在外面那几件东西是"空槽等你接"还是"已经装好并接上线"。</text>
  <text x="48" y="388" font-size="11.5" fill="#7a4f13">所以本课不回答"又一个新框架怎么学"，只回答：它替你装了哪几件、装在哪台发动机上、什么活该用它、什么活不该。</text>
</svg>
