<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600">
  <defs>
    <marker id="m11a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7c"/>
    </marker>
    <marker id="m11r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#a33b3b"/>
    </marker>
  </defs>
  <rect width="1060" height="600" fill="#ffffff"/>
  <text x="30" y="40" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1f2d3d">审批闸门：从模型提议到人点头的五步</text>
  <text x="30" y="66" font-family="sans-serif" font-size="13" fill="#667788">闸门在中间件里判断，暂停在图运行时里发生，记忆在 checkpointer 里落地</text>

  <!-- 五步 -->
  <g font-family="sans-serif">
    <rect x="34" y="96" width="180" height="88" rx="8" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.6"/>
    <text x="50" y="120" font-size="12.5" font-weight="bold" fill="#1e4b7a">1. 模型提议</text>
    <text x="50" y="142" font-size="10" fill="#33475b">AIMessage 带 tool_calls</text>
    <text x="50" y="160" font-size="10" fill="#33475b">write_file("/a.txt")</text>
    <text x="50" y="176" font-size="9" fill="#667788">此刻还没执行</text>

    <line x1="214" y1="140" x2="242" y2="140" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#m11a)"/>

    <rect x="248" y="96" width="180" height="88" rx="8" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.6"/>
    <text x="264" y="120" font-size="12.5" font-weight="bold" fill="#1e4b7a">2. 中间件拦截</text>
    <text x="264" y="142" font-size="10" fill="#33475b">after_model 钩子</text>
    <text x="264" y="160" font-size="10" fill="#33475b">查 interrupt_on</text>
    <text x="264" y="176" font-size="9" fill="#667788">再跑 when 谓词</text>

    <line x1="428" y1="140" x2="456" y2="140" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#m11a)"/>

    <rect x="462" y="96" width="180" height="88" rx="8" fill="#fff8ec" stroke="#e0b877" stroke-width="1.8"/>
    <text x="478" y="120" font-size="12.5" font-weight="bold" fill="#7a4f13">3. 存盘并暂停</text>
    <text x="478" y="142" font-size="10" fill="#33475b">interrupt(hitl_request)</text>
    <text x="478" y="160" font-size="10" fill="#33475b">整个图状态写进 saver</text>
    <text x="478" y="176" font-size="9" fill="#a33b3b">无 saver 就接不回来</text>

    <line x1="642" y1="140" x2="670" y2="140" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#m11a)"/>

    <rect x="676" y="96" width="180" height="88" rx="8" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.6"/>
    <text x="692" y="120" font-size="12.5" font-weight="bold" fill="#1f5537">4. 人决策</text>
    <text x="692" y="142" font-size="10" fill="#33475b">读 __interrupt__</text>
    <text x="692" y="160" font-size="10" fill="#33475b">action_requests[i].args</text>
    <text x="692" y="176" font-size="9" fill="#667788">给人看名字和参数</text>

    <line x1="856" y1="140" x2="884" y2="140" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#m11a)"/>

    <rect x="890" y="96" width="136" height="88" rx="8" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.6"/>
    <text x="906" y="120" font-size="12.5" font-weight="bold" fill="#1f5537">5. 恢复执行</text>
    <text x="906" y="142" font-size="9.5" fill="#33475b">Command(resume=</text>
    <text x="906" y="158" font-size="9.5" fill="#33475b"> {"decisions":[...]})</text>
    <text x="906" y="176" font-size="9" fill="#a33b3b">同 thread_id</text>
  </g>

  <!-- 四条决策出口 -->
  <rect x="34" y="208" width="992" height="152" rx="9" fill="#f7f9fc" stroke="#a8b8c8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="50" y="232" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#33475b">第四步展开：人能做的四种处置（全部实测）</text>

  <g font-family="sans-serif">
    <rect x="50" y="248" width="228" height="98" rx="7" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.4"/>
    <text x="66" y="270" font-size="12" font-weight="bold" fill="#1f5537">approve 批准</text>
    <text x="66" y="292" font-size="9.5" fill="#33475b">按原参数执行</text>
    <text x="66" y="310" font-size="9.5" fill="#667788">实测：文件写入 "hello"</text>
    <text x="66" y="330" font-size="9" fill="#667788">最常用，风险最低</text>

    <rect x="292" y="248" width="228" height="98" rx="7" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.4"/>
    <text x="308" y="270" font-size="12" font-weight="bold" fill="#1f5537">edit 改参数</text>
    <text x="308" y="292" font-size="9.5" fill="#33475b">改完再执行</text>
    <text x="308" y="310" font-size="9.5" fill="#667788">实测：/a.txt 没写，</text>
    <text x="308" y="326" font-size="9.5" fill="#667788">改后的 /safe.txt 写入</text>

    <rect x="534" y="248" width="228" height="98" rx="7" fill="#fff8ec" stroke="#e0b877" stroke-width="1.4"/>
    <text x="550" y="270" font-size="12" font-weight="bold" fill="#7a4f13">reject 拒绝</text>
    <text x="550" y="292" font-size="9.5" fill="#33475b">不执行 + 回传原因</text>
    <text x="550" y="310" font-size="9" fill="#667788">"User rejected the tool</text>
    <text x="550" y="326" font-size="9" fill="#667788">call ... with reason: ..."</text>

    <rect x="776" y="248" width="234" height="98" rx="7" fill="#fdf3f3" stroke="#e0a0a0" stroke-width="1.4"/>
    <text x="792" y="270" font-size="12" font-weight="bold" fill="#a33b3b">respond 替代</text>
    <text x="792" y="292" font-size="9.5" fill="#33475b">不执行，人的话当结果</text>
    <text x="792" y="310" font-size="9" fill="#667788">实测 ToolMessage 就是</text>
    <text x="792" y="326" font-size="9" fill="#667788">人的原话，非"批准"</text>
  </g>

  <!-- 下半：条件触发与优先级 -->
  <g font-family="sans-serif">
    <rect x="34" y="382" width="478" height="200" rx="9" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
    <text x="50" y="406" font-size="12.5" font-weight="bold" fill="#1e4b7a">什么会触发中断（层层收窄）</text>

    <text x="50" y="432" font-size="10.5" font-weight="bold" fill="#33475b">① 工具名在表里？</text>
    <text x="66" y="450" font-size="9.5" fill="#667788">True / {allowed_decisions} 在 → 候选</text>

    <text x="50" y="472" font-size="10.5" font-weight="bold" fill="#33475b">② when 谓词通过？</text>
    <text x="66" y="490" font-size="9.5" fill="#2e6b4f">only_bulk → 群发 all@ 才拦（实测 True/False）</text>

    <text x="50" y="512" font-size="10.5" font-weight="bold" fill="#33475b">③ permissions 没 deny？</text>
    <text x="66" y="530" font-size="9.5" fill="#a33b3b">deny 优先：直接拒绝，不浪费人点（实测）</text>

    <text x="50" y="556" font-size="10" fill="#667788">三者全过 → interrupt 落下</text>
  </g>

  <rect x="530" y="382" width="496" height="200" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.5"/>
  <text x="546" y="406" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1f5537">权限 vs 审批：红线与灰区</text>

  <text x="546" y="432" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#33475b">permissions（静态，不需要人）</text>
  <text x="562" y="450" font-family="sans-serif" font-size="9.5" fill="#667788">管"绝对不许"：/secrets/** deny</text>
  <text x="562" y="468" font-family="sans-serif" font-size="9.5" fill="#667788">agent 问了也没用，直接拒</text>

  <text x="546" y="492" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#33475b">interrupt_on（动态，人在场）</text>
  <text x="562" y="510" font-family="sans-serif" font-size="9.5" fill="#667788">管"这次该不该"：改 config/prod.yaml</text>
  <text x="562" y="528" font-family="sans-serif" font-size="9.5" fill="#667788">路径合法但内容可能错，要人看 diff</text>

  <text x="546" y="556" font-family="sans-serif" font-size="10" fill="#a33b3b">两者不能互相替代；同时命中时 deny 赢</text>

  <!-- 底部提示 -->
  <rect x="34" y="592" width="0" height="0" fill="none"/>
</svg>
