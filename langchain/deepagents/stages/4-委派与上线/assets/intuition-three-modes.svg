<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620">
  <defs>
    <marker id="m12a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="1080" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1f2d3d">三种子代理模式：横看规模，竖看要不要等</text>
  <text x="30" y="66" font-family="sans-serif" font-size="13" fill="#667788">越往下不是越好，是代价不同。三条路径各有自己的隐藏成本</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="530" x2="1010" y2="530" stroke="#8a9aa8" stroke-width="1.6"/>
  <line x1="80" y1="530" x2="80" y2="100" stroke="#8a9aa8" stroke-width="1.6"/>
  <text x="960" y="556" font-family="sans-serif" font-size="12" fill="#33475b">活的规模 →</text>
  <text x="52" y="316" font-family="sans-serif" font-size="12" fill="#33475b" transform="rotate(-90 52 316)">要等结果？</text>
  <text x="150" y="552" font-family="sans-serif" font-size="10" fill="#8899aa">1 件</text>
  <text x="470" y="552" font-family="sans-serif" font-size="10" fill="#8899aa">几件</text>
  <text x="900" y="552" font-family="sans-serif" font-size="10" fill="#8899aa">几十上百件</text>
  <text x="62" y="150" font-family="sans-serif" font-size="10" fill="#8899aa">不等</text>
  <text x="62" y="500" font-family="sans-serif" font-size="10" fill="#8899aa">要等</text>

  <!-- 左下：同步 -->
  <rect x="120" y="370" width="230" height="140" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.8"/>
  <text x="138" y="394" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f5537">同步子代理</text>
  <text x="138" y="416" font-family="monospace" font-size="9.5" fill="#33475b">task(...) 阻塞直到返回</text>
  <text x="138" y="436" font-family="sans-serif" font-size="9.5" fill="#667788">工具 8 个，最简单</text>
  <text x="138" y="456" font-family="sans-serif" font-size="9.5" fill="#2e6b4f">多数项目的正确答案</text>
  <text x="138" y="480" font-family="sans-serif" font-size="9" fill="#a33b3b">代价：派出去就干等</text>

  <!-- 中上：异步 -->
  <rect x="400" y="150" width="270" height="180" rx="9" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.8"/>
  <text x="418" y="176" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e4b7a">异步子代理</text>
  <text x="418" y="198" font-family="monospace" font-size="9" fill="#33475b">graph_id + url</text>
  <text x="418" y="218" font-family="sans-serif" font-size="9.5" fill="#667788">提交到远程 Agent Protocol</text>
  <text x="418" y="238" font-family="sans-serif" font-size="9.5" fill="#667788">拿到 task_id 立即返回</text>
  <text x="418" y="264" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#1e4b7a">五个工具</text>
  <text x="418" y="282" font-family="monospace" font-size="8.5" fill="#33475b">start / check / update</text>
  <text x="418" y="298" font-family="monospace" font-size="8.5" fill="#33475b">cancel / list</text>
  <text x="418" y="320" font-family="sans-serif" font-size="9" fill="#a33b3b">代价：要一套远程服务</text>

  <!-- 右下：动态 -->
  <rect x="740" y="330" width="260" height="185" rx="9" fill="#fff8ec" stroke="#e0b877" stroke-width="1.8"/>
  <text x="758" y="354" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a4f13">动态子代理</text>
  <text x="758" y="376" font-family="monospace" font-size="9" fill="#33475b">eval + task() 循环</text>
  <text x="758" y="396" font-family="sans-serif" font-size="9.5" fill="#667788">QuickJS 内跑 JS</text>
  <text x="758" y="422" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#1f5537">收益：主上下文</text>
  <text x="758" y="440" font-family="monospace" font-size="9" fill="#2e6b4f">3526 → 38 字符</text>
  <text x="758" y="462" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#a33b3b">代价：固定开销</text>
  <text x="758" y="480" font-family="monospace" font-size="9" fill="#a33b3b">N=4 慢 3.8 倍</text>
  <text x="758" y="502" font-family="sans-serif" font-size="9" fill="#667788">无 fs / shell / 网络</text>

  <!-- 中间：并行 tool_calls -->
  <rect x="390" y="400" width="290" height="110" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="408" y="424" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f5537">同步 + 并行 tool_calls</text>
  <text x="408" y="446" font-family="sans-serif" font-size="9.5" fill="#33475b">一轮里模型发多个 task 调用</text>
  <text x="408" y="466" font-family="monospace" font-size="9" fill="#2e6b4f">N=12 只需 0.111s（最快）</text>
  <text x="408" y="486" font-family="sans-serif" font-size="9" fill="#a33b3b">代价：N 份结果全进主上下文</text>

  <!-- 连线 -->
  <path d="M350,440 Q375,440 390,445" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#m12a)"/>
  <path d="M535,400 L535,330" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#m12a)"/>
  <path d="M680,455 L740,440" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#m12a)"/>
  <path d="M670,240 L740,360" fill="none" stroke="#a8b8c8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#m12a)"/>

  <!-- 顶部决策提示 -->
  <rect x="30" y="88" width="1000" height="44" rx="7" fill="#f7f9fc" stroke="#a8b8c8" stroke-width="1.3"/>
  <text x="48" y="114" font-family="sans-serif" font-size="11" fill="#33475b">决策顺序：① 派完能干活吗（不能→同步） ② 要中途改指令吗（要→异步） ③ 量大且能写循环吗（大→动态，小→并行 task）</text>

  <!-- 底部说明 -->
  <text x="30" y="592" font-family="sans-serif" font-size="10" fill="#667788">实测数据：deepagents 0.7.28 / langchain_quickjs 0.3.9 ｜ 上下文对比 N=8，worker 各返回约 600 字 ｜ 耗时对比单个子代理 0.05s</text>
</svg>
