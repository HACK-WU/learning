<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="600" viewBox="0 0 1020 600">
  <defs>
    <marker id="m8a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="1020" height="600" fill="#ffffff"/>
  <text x="30" y="40" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1f2d3d">记忆的两条轴：多久用一次 × 存在哪</text>
  <text x="30" y="66" font-family="sans-serif" font-size="13" fill="#667788">这两件事必须一起判断：只问"多久用"会选错存储，只问"存哪"会选错加载方式</text>

  <text x="30" y="104" font-family="sans-serif" font-size="12" font-weight="bold" fill="#667788">轴一：加载频率（决定它进不进每一次请求）</text>

  <rect x="30" y="118" width="450" height="112" rx="8" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.8"/>
  <text x="48" y="144" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1e4b7a">常驻：memory</text>
  <text x="48" y="168" font-family="sans-serif" font-size="11.5" fill="#1e4b7a">每次模型调用都完整注入</text>
  <text x="48" y="190" font-family="sans-serif" font-size="11.5" fill="#1e4b7a">像工牌：每次进门都要刷</text>
  <text x="48" y="214" font-family="monospace" font-size="11" fill="#a33b3b">固定税约 5,118 字符（不随内容变）</text>

  <rect x="500" y="118" width="490" height="112" rx="8" fill="#fff8ec" stroke="#e0b877" stroke-width="1.8"/>
  <text x="518" y="144" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#7a4f13">按需：skills</text>
  <text x="518" y="168" font-family="sans-serif" font-size="11.5" fill="#7a4f13">启动只读 name + description</text>
  <text x="518" y="190" font-family="sans-serif" font-size="11.5" fill="#7a4f13">像工具箱：修水管才拿</text>
  <text x="518" y="214" font-family="monospace" font-size="11" fill="#2e6b4f">固定税约 1,900 字符（比 memory 省 2.7 倍）</text>

  <line x1="30" y1="248" x2="990" y2="248" stroke="#a8b8c8" stroke-width="1.2" stroke-dasharray="5 4"/>

  <text x="30" y="278" font-family="sans-serif" font-size="12" font-weight="bold" fill="#667788">轴二：存储后端（决定它能不能活过这一场会话）</text>

  <rect x="30" y="292" width="300" height="150" rx="8" fill="#fdf3f3" stroke="#e0a0a0" stroke-width="1.8"/>
  <text x="48" y="318" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a33b3b">StateBackend（默认）</text>
  <text x="48" y="342" font-family="sans-serif" font-size="11.5" fill="#a33b3b">便利贴：贴在这次会议的桌上</text>
  <text x="48" y="366" font-family="sans-serif" font-size="11.5" fill="#a33b3b">换 thread → 记忆消失</text>
  <text x="48" y="392" font-family="monospace" font-size="10.5" fill="#33475b">实测 T1 有 / T2 无</text>
  <text x="48" y="418" font-family="sans-serif" font-size="10.5" fill="#667788">适合：单次会话内的临时草稿</text>

  <rect x="348" y="292" width="300" height="150" rx="8" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.8"/>
  <text x="366" y="318" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e4b7a">FilesystemBackend</text>
  <text x="366" y="342" font-family="sans-serif" font-size="11.5" fill="#1e4b7a">笔记本：记在磁盘上</text>
  <text x="366" y="366" font-family="sans-serif" font-size="11.5" fill="#1e4b7a">换 thread → 还在；换机器 → 没了</text>
  <text x="366" y="392" font-family="monospace" font-size="10.5" fill="#33475b">实测 T1 有 / T2 有</text>
  <text x="366" y="418" font-family="sans-serif" font-size="10.5" fill="#667788">适合：本地开发、单机部署</text>

  <rect x="666" y="292" width="324" height="150" rx="8" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.8"/>
  <text x="684" y="318" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f5537">Composite + StoreBackend</text>
  <text x="684" y="342" font-family="sans-serif" font-size="11.5" fill="#1f5537">云文档：跟人、跟机器都无关</text>
  <text x="684" y="366" font-family="sans-serif" font-size="11.5" fill="#1f5537">换 thread / 换机器 → 都在</text>
  <text x="684" y="392" font-family="monospace" font-size="10.5" fill="#33475b">实测 T1/T2/T3 全有</text>
  <text x="684" y="418" font-family="sans-serif" font-size="10.5" fill="#667788">适合：生产、多用户、多实例</text>

  <rect x="30" y="466" width="960" height="104" rx="8" fill="#fff8ec" stroke="#e0b877" stroke-width="1.5"/>
  <text x="48" y="492" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a4f13">Store 这一步最容易翻车的三处（实测）</text>
  <text x="48" y="516" font-family="monospace" font-size="11" fill="#a33b3b">① backend 传工厂 → TypeError: Backend factories were removed in deepagents 0.7</text>
  <text x="48" y="536" font-family="monospace" font-size="11" fill="#a33b3b">② namespace 传元组 → TypeError: 'tuple' object is not callable（要 lambda _rt: (...)）</text>
  <text x="48" y="556" font-family="monospace" font-size="11" fill="#a33b3b">③ seed 写成 /memories/AGENTS.md → 读不到（前缀被剥掉，要用 /AGENTS.md）</text>
</svg>
