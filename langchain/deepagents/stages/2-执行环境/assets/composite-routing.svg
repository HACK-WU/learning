<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="c5b" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#fbfcfd"/>
  <text x="470" y="30" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1f2937">Composite 是一个"按前缀转发的交换机"</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">路径只被剥掉一次；剥掉的那段前缀，会在返回时原样贴回去</text>

  <rect x="30" y="76" width="180" height="58" rx="9" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
  <text x="120" y="98" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e4b7a">模型发起</text>
  <text x="120" y="118" text-anchor="middle" font-size="10.3" fill="#334155" font-family="ui-monospace, Menlo, monospace">read /memories/a.md</text>

  <line x1="210" y1="105" x2="248" y2="105" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c5b)"/>

  <rect x="254" y="68" width="196" height="74" rx="9" fill="#fff8ec" stroke="#e0b877" stroke-width="1.6"/>
  <text x="352" y="90" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a4f13">最长前缀匹配</text>
  <text x="352" y="110" text-anchor="middle" font-size="10.2" fill="#334155">sorted by len(prefix) desc</text>
  <text x="352" y="128" text-anchor="middle" font-size="10.2" fill="#334155">"最长"赢，不是"最先声明"赢</text>

  <line x1="450" y1="105" x2="486" y2="105" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c5b)"/>

  <rect x="492" y="68" width="200" height="74" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.4"/>
  <text x="592" y="90" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f5537">前缀被剥掉</text>
  <text x="592" y="110" text-anchor="middle" font-size="10.2" fill="#334155" font-family="ui-monospace, Menlo, monospace">/memories/a.md</text>
  <text x="592" y="128" text-anchor="middle" font-size="10.2" fill="#334155" font-family="ui-monospace, Menlo, monospace">→ /a.md</text>

  <line x1="692" y1="105" x2="728" y2="105" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c5b)"/>

  <rect x="734" y="68" width="176" height="74" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.4"/>
  <text x="822" y="90" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f5537">该路由的后端</text>
  <text x="822" y="110" text-anchor="middle" font-size="10.2" fill="#334155">Store / 磁盘 / Hub</text>
  <text x="822" y="128" text-anchor="middle" font-size="10.2" fill="#334155">它只看到 /a.md</text>

  <line x1="822" y1="142" x2="822" y2="164" stroke="#5a6b7d" stroke-width="1.6"/>
  <line x1="822" y1="164" x2="120" y2="164" stroke="#5a6b7d" stroke-width="1.6"/>
  <line x1="120" y1="164" x2="120" y2="186" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c5b)"/>

  <text x="470" y="182" text-anchor="middle" font-size="10.4" fill="#8f3a3a">⚠ 剥离是单向的、有损的：后端不知道 /memories/ 这三个字，所以它自己的路径语义从 "/" 开始</text>

  <rect x="30" y="200" width="880" height="94" rx="9" fill="#fdeeee" stroke="#e39a9a" stroke-width="1.4"/>
  <text x="46" y="222" font-size="11.8" font-weight="600" fill="#8f3a3a">实测踩到的第一个坑：两个路由指向同一目录，路径会"套娃"</text>
  <text x="46" y="244" font-size="10.4" fill="#334155">routes = {"/workspace/": disk, "/workspace/sub/": disk}，两个前缀都剥，都落到同一个 disk 根</text>
  <text x="46" y="262" font-size="10.4" fill="#334155">→ glob 出来 /workspace/sub/plan.md 和 /workspace/sub/sub/plan.md 同时存在，</text>
  <text x="46" y="280" font-size="10.4" fill="#334155">→ 读 /workspace/sub/deep.md 报 "File '/deep.md' not found"（剥多了）</text>

  <rect x="30" y="308" width="432" height="120" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="46" y="330" font-size="11.8" font-weight="600" fill="#334155">ls 的合成规则（源码 composite.py:300-352）</text>
  <text x="46" y="352" font-size="10.3" fill="#334155">path == "/" → 合成：default 的条目 + 每个路由前缀本身</text>
  <text x="46" y="370" font-size="10.3" fill="#334155">path 命中路由 → 只列那个后端，路径贴回前缀</text>
  <text x="46" y="388" font-size="10.3" fill="#334155">path 未命中 → 只问 default</text>
  <text x="46" y="410" font-size="10.2" fill="#8f3a3a">所以 ls("/memories/") 看不到 /memories/projects/ 这个子路由</text>

  <rect x="478" y="308" width="432" height="120" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="494" y="330" font-size="11.8" font-weight="600" fill="#334155">自定义后端：6 个必须 + 1 个可选</text>
  <text x="494" y="352" font-size="10.3" fill="#334155" font-family="ui-monospace, Menlo, monospace">ls read write edit glob grep  ← 必须</text>
  <text x="494" y="370" font-size="10.3" fill="#334155" font-family="ui-monospace, Menlo, monospace">delete                        ← 可选</text>
  <text x="494" y="392" font-size="10.2" fill="#64748b">不重写 delete → _supports_delete=False → 请求期静默摘掉</text>
  <text x="494" y="410" font-size="10.2" fill="#64748b">要 execute 则改继承 SandboxBackendProtocol</text>

  <rect x="30" y="446" width="880" height="112" rx="10" fill="#fff8ec" stroke="#e0b877" stroke-width="1.6"/>
  <text x="46" y="468" font-size="11.8" font-weight="600" fill="#7a4f13">比声明式权限更细的那层：policy hooks</text>
  <text x="46" y="490" font-size="10.5" fill="#334155">① 子类化：继承 FilesystemBackend，重写 write/edit，命中前缀就返回 WriteResult(error=...)</text>
  <text x="46" y="508" font-size="10.5" fill="#334155">② 包装器：写一个实现 BackendProtocol 的类，内持 inner，只拦想拦的方法，其余原样转发</text>
  <text x="46" y="526" font-size="10.5" fill="#334155">③ 用途：限流、审计日志、内容检查——这些"按路径 allow/deny"表达不了</text>
  <text x="46" y="546" font-size="10.2" fill="#8f3a3a">关键：返回结果对象里的 error，不要抛异常（协议要求）</text>
</svg>
