<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="620" fill="#fbfcfd"/>
  <text x="40" y="44" font-size="21" font-weight="700" fill="#1f2937">eval 的能力围栏：默认什么都碰不到</text>
  <text x="40" y="68" font-size="13" fill="#6b7280">QuickJS 编译成 WebAssembly，跑在宿主进程内的 wasmtime 上；围栏靠"不给能力"，不靠"禁止操作"</text>

  <!-- 中心 -->
  <rect x="330" y="100" width="300" height="120" rx="12" fill="#fff8ec" stroke="#e8cfa0" stroke-width="1.6"/>
  <text x="480" y="128" font-size="14" font-weight="700" fill="#7a4f00" text-anchor="middle">QuickJS 上下文</text>
  <text x="480" y="152" font-size="12" fill="#6b5b3f" text-anchor="middle">一个 thread 一个独立实例</text>
  <text x="480" y="176" font-size="12" fill="#6b5b3f" text-anchor="middle">64 MB 堆 · 5 秒预算</text>
  <text x="480" y="200" font-size="12" font-family="ui-monospace, monospace" fill="#7a4f00" text-anchor="middle">纯计算 + 变量 + console</text>

  <!-- 左侧：默认可用 -->
  <rect x="40" y="100" width="250" height="120" rx="10" fill="#f0f8f2" stroke="#bcdcc4"/>
  <text x="60" y="124" font-size="13" font-weight="700" fill="#1f4d2e">✅ 默认可用的</text>
  <text x="60" y="148" font-size="12" fill="#374151">JavaScript 全套语法</text>
  <text x="60" y="168" font-size="12" fill="#374151">顶层 await · Promise</text>
  <text x="60" y="188" font-size="12" fill="#374151">console.log / warn / error</text>
  <text x="60" y="208" font-size="12" fill="#374151">变量与函数跨调用保留</text>

  <path d="M292 160 L326 160" stroke="#7a9b84" stroke-width="1.5" marker-end="url(#c1)"/>

  <!-- 右侧：默认不可用 -->
  <rect x="670" y="100" width="250" height="120" rx="10" fill="#fdeeee" stroke="#f0c9c9"/>
  <text x="690" y="124" font-size="13" font-weight="700" fill="#8a2b2b">❌ 默认碰不到的</text>
  <text x="690" y="148" font-size="12" fill="#374151" font-family="ui-monospace, monospace">require / process</text>
  <text x="690" y="168" font-size="12" fill="#374151" font-family="ui-monospace, monospace">fetch / XMLHttpRequest</text>
  <text x="690" y="188" font-size="12" fill="#374151" font-family="ui-monospace, monospace">setTimeout / Deno</text>
  <text x="690" y="208" font-size="12" fill="#374151">shell · 装包 · 文件系统</text>

  <path d="M636 160 L666 160" stroke="#c98a8a" stroke-width="1.5" marker-end="url(#c2)"/>

  <!-- 两座桥 -->
  <text x="480" y="266" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">只有两座桥能伸出去</text>

  <rect x="130" y="286" width="330" height="120" rx="10" fill="#eef6ff" stroke="#c7ddf5"/>
  <text x="150" y="310" font-size="13" font-weight="700" fill="#1a4f8a">桥 1　PTC（programmatic tool calling）</text>
  <text x="150" y="334" font-size="12" fill="#374151">CodeInterpreterMiddleware(ptc=["web_search"])</text>
  <text x="150" y="356" font-size="12" fill="#374151">代码里写 await tools.webSearch({...})</text>
  <text x="150" y="376" font-size="12" font-weight="600" fill="#8a3b1f">默认关闭；白名单之外的工具完全不可见</text>
  <text x="150" y="396" font-size="11.5" fill="#6b7280">命名：snake_case → camelCase</text>

  <rect x="500" y="286" width="330" height="120" rx="10" fill="#eef6ff" stroke="#c7ddf5"/>
  <text x="520" y="310" font-size="13" font-weight="700" fill="#1a4f8a">桥 2　动态子代理 task()</text>
  <text x="520" y="334" font-size="12" fill="#374151">agent 配了 subagents 就自动有 task()</text>
  <text x="520" y="356" font-size="12" fill="#374151">在代码里 fan-out：await Promise.all([...])</text>
  <text x="520" y="376" font-size="12" font-weight="600" fill="#8a3b1f">默认开启；subagents=False 可关</text>
  <text x="520" y="396" font-size="11.5" fill="#6b7280">并发上限 max_subagent_concurrency=32</text>

  <!-- 底部：三个易判错的点 -->
  <rect x="40" y="428" width="880" height="172" rx="10" fill="#f1f3f5" stroke="#dfe3e8"/>
  <text x="60" y="452" font-size="13.5" font-weight="700" fill="#374151">三个容易误判的地方（都已实测）</text>

  <text x="60" y="480" font-size="12.5" font-weight="700" fill="#8a2b2b">① 时钟其实读得到</text>
  <text x="60" y="500" font-size="12" fill="#4b5563">提示词说「No real clock」，但实测 Date.now() 与宿主时间只差 1ms，</text>
  <text x="60" y="518" font-size="12" fill="#4b5563">performance.now() 也真实流动。别把「没给时钟工具」当成「读不到时间」。</text>

  <text x="60" y="546" font-size="12.5" font-weight="700" fill="#8a5a00">② timeout 只算 VM 时间</text>
  <text x="60" y="566" font-size="12" fill="#4b5563">await 一个慢工具时，等待时间不计入 5 秒预算——一个阻塞的工具调用能让 eval 远超超时。</text>

  <text x="60" y="590" font-size="12.5" font-weight="700" fill="#1a4f8a">③ PTC 绕过 interrupt_on</text>

  <defs>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#7a9b84"/>
    </marker>
    <marker id="c2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#c98a8a"/>
    </marker>
  </defs>
</svg>
