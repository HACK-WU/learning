<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="c5a" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fbfcfd"/>
  <text x="470" y="30" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1f2937">同样一句 write_file，落在哪取决于底座</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">工具是外壳，后端才是那个真正动手的；三条轴问清它：存哪、活多久、谁共享</text>

  <rect x="330" y="72" width="280" height="46" rx="9" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
  <text x="470" y="94" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e4b7a">7 个文件工具 + execute</text>
  <text x="470" y="111" text-anchor="middle" font-size="10.3" fill="#334155">同一个函数名，永远是同一个</text>

  <line x1="470" y1="118" x2="470" y2="140" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c5a)"/>

  <rect x="330" y="146" width="280" height="40" rx="9" fill="#fff8ec" stroke="#e0b877" stroke-width="1.6"/>
  <text x="470" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#7a4f13">BackendProtocol（你要选的那个）</text>

  <line x1="470" y1="186" x2="470" y2="206" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c5a)"/>

  <rect x="40" y="212" width="196" height="96" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.3"/>
  <text x="138" y="234" text-anchor="middle" font-size="11.8" font-weight="600" fill="#1f5537">StateBackend</text>
  <text x="138" y="254" text-anchor="middle" font-size="10.2" fill="#334155">图内 state，随 checkpoint</text>
  <text x="138" y="272" text-anchor="middle" font-size="10.2" fill="#334155">活一个 thread</text>
  <text x="138" y="292" text-anchor="middle" font-size="9.8" fill="#64748b">默认就是它</text>

  <rect x="252" y="212" width="196" height="96" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.3"/>
  <text x="350" y="234" text-anchor="middle" font-size="11.8" font-weight="600" fill="#1f5537">FilesystemBackend</text>
  <text x="350" y="254" text-anchor="middle" font-size="10.2" fill="#334155">真磁盘 root_dir</text>
  <text x="350" y="272" text-anchor="middle" font-size="10.2" fill="#334155">活到你删为止</text>
  <text x="350" y="292" text-anchor="middle" font-size="9.8" fill="#64748b">virtual_mode 必须懂</text>

  <rect x="464" y="212" width="196" height="96" rx="9" fill="#fdeeee" stroke="#e39a9a" stroke-width="1.3"/>
  <text x="562" y="234" text-anchor="middle" font-size="11.8" font-weight="600" fill="#8f3a3a">LocalShellBackend</text>
  <text x="562" y="254" text-anchor="middle" font-size="10.2" fill="#334155">磁盘 + 真 shell</text>
  <text x="562" y="272" text-anchor="middle" font-size="10.2" fill="#334155">宿主上无隔离</text>
  <text x="562" y="292" text-anchor="middle" font-size="9.8" fill="#8f3a3a">只给"信任的开发机"</text>

  <rect x="676" y="212" width="224" height="96" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.3"/>
  <text x="788" y="234" text-anchor="middle" font-size="11.8" font-weight="600" fill="#1f5537">StoreBackend</text>
  <text x="788" y="254" text-anchor="middle" font-size="10.2" fill="#334155">LangGraph BaseStore</text>
  <text x="788" y="272" text-anchor="middle" font-size="10.2" fill="#334155">跨 thread 持久</text>
  <text x="788" y="292" text-anchor="middle" font-size="9.8" fill="#64748b">namespace 决定隔离给谁</text>

  <rect x="40" y="322" width="420" height="96" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.3"/>
  <text x="56" y="344" font-size="11.8" font-weight="600" fill="#1f5537">ContextHubBackend</text>
  <text x="56" y="364" font-size="10.2" fill="#334155">存在 LangSmith Hub repo 里：agent repo 挂根，skill repo 挂 /skills/</text>
  <text x="56" y="382" font-size="10.2" fill="#334155">每次写都是一次 commit（parent_commit 乐观并发）</text>
  <text x="56" y="402" font-size="9.8" fill="#64748b">需要 LANGSMITH_API_KEY；只收 UTF-8 文本</text>

  <rect x="476" y="322" width="424" height="96" rx="9" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
  <text x="492" y="344" font-size="11.8" font-weight="600" fill="#1e4b7a">CompositeBackend（不是"第 7 种存储"）</text>
  <text x="492" y="364" font-size="10.2" fill="#334155">按路径前缀把请求分发给上面任意几个</text>
  <text x="492" y="382" font-size="10.2" fill="#334155">default=State + routes={"/memories/": Store}</text>
  <text x="492" y="402" font-size="9.8" fill="#64748b">长前缀优先；只有 ls("/") 会合出路由目录</text>

  <line x1="470" y1="424" x2="470" y2="446" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#c5a)"/>

  <rect x="40" y="452" width="860" height="86" rx="10" fill="#fff8ec" stroke="#e0b877" stroke-width="1.6"/>
  <text x="56" y="474" font-size="11.8" font-weight="600" fill="#7a4f13">三条轴，按顺序问自己</text>
  <text x="56" y="496" font-size="10.5" fill="#334155">① 存哪：内存 / 真磁盘 / 远端 store / Hub——决定"进程重启还在不在"</text>
  <text x="56" y="514" font-size="10.5" fill="#334155">② 活多久：一个 thread 内 / 跨 thread——StateBackend 换 thread 就读不到了（实测报 not found）</text>
  <text x="56" y="532" font-size="10.5" fill="#334155">③ 谁共享：namespace 给 user_id / assistant_id / thread_id——不给 namespace 就是所有用户共用一份</text>
</svg>
