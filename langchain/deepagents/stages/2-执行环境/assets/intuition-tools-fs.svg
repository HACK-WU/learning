<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#fbfcfd"/>
  <text x="470" y="30" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1f2937">一张工具表，三段来路，一个看不见的底座</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">你以为你在控制工具表，其实你只控制了其中一段</text>

  <rect x="30" y="84" width="250" height="110" rx="10" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.5"/>
  <text x="46" y="106" font-size="12" font-weight="600" fill="#1f5537">你给的（加法）</text>
  <text x="46" y="130" font-size="10.6" fill="#334155" font-family="ui-monospace, Menlo, monospace">def search(q: str): ...</text>
  <text x="46" y="150" font-size="10.6" fill="#334155" font-family="ui-monospace, Menlo, monospace">@tool def fetch(...): ...</text>
  <text x="46" y="170" font-size="10.6" fill="#334155" font-family="ui-monospace, Menlo, monospace">MCPAdapter.list_tools()</text>
  <text x="46" y="186" font-size="10" fill="#64748b">三类来源，可混用</text>

  <rect x="30" y="210" width="250" height="150" rx="10" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
  <text x="46" y="232" font-size="12" font-weight="600" fill="#1e4b7a">它自带的（固定 9 个）</text>
  <text x="46" y="254" font-size="10.6" fill="#1e4b7a">7 个文件工具 + 2 个额外</text>
  <text x="46" y="276" font-size="10.4" fill="#334155" font-family="ui-monospace, Menlo, monospace">ls  read_file  write_file</text>
  <text x="46" y="296" font-size="10.4" fill="#334155" font-family="ui-monospace, Menlo, monospace">edit_file  delete  glob  grep</text>
  <text x="46" y="320" font-size="10.4" fill="#7a4f13" font-family="ui-monospace, Menlo, monospace">+ execute（仅沙箱）</text>
  <text x="46" y="340" font-size="10.4" fill="#7a4f13" font-family="ui-monospace, Menlo, monospace">+ task（派子代理）</text>

  <line x1="282" y1="139" x2="330" y2="139" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a4)"/>
  <line x1="282" y1="285" x2="330" y2="285" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a4)"/>

  <rect x="336" y="84" width="574" height="204" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="623" y="106" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">合并后的一张表（9 + 你给的）</text>

  <rect x="356" y="118" width="534" height="34" rx="6" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.1"/>
  <text x="370" y="140" font-size="10.8" fill="#1f5537">名字撞了 → 你的顶掉它的，总数不变，不报错</text>
  <text x="870" y="140" text-anchor="end" font-size="9.8" fill="#64748b">实测 9 个仍是 9 个</text>

  <rect x="356" y="158" width="534" height="34" rx="6" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.1"/>
  <text x="370" y="180" font-size="10.8" fill="#1e4b7a">没撞名 → 纯追加，模型多一个可选工具</text>
  <text x="870" y="180" text-anchor="end" font-size="9.8" fill="#64748b">实测 9 + 3 = 12</text>

  <rect x="356" y="198" width="534" height="34" rx="6" fill="#fff8ec" stroke="#e0b877" stroke-width="1.1"/>
  <text x="370" y="220" font-size="10.8" fill="#7a4f13">FilesystemMiddleware(tools=[...]) → 构造期裁剪，压根不进表</text>
  <text x="870" y="220" text-anchor="end" font-size="9.8" fill="#64748b">另一种"没有"</text>

  <text x="623" y="262" text-anchor="middle" font-size="10.2" fill="#94a3b8">工具名就是模型的选择依据：叫 process / run / handle 的工具，基本不会被选对</text>

  <line x1="623" y1="290" x2="623" y2="308" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a4)"/>

  <rect x="336" y="312" width="574" height="86" rx="10" fill="#fff8ec" stroke="#e0b877" stroke-width="1.5"/>
  <text x="352" y="334" font-size="12" font-weight="600" fill="#7a4f13">模型真正收到的那张表（可能比上面少）</text>
  <text x="352" y="358" font-size="10.8" fill="#334155">后端不支持 delete / execute 时，它们在请求期被剥掉，静态清单里却还在</text>
  <text x="352" y="380" font-size="10.8" fill="#334155">所以"我 print 出来有"不等于"模型看得到"——这是本课最容易误判的一处</text>

  <rect x="30" y="416" width="880" height="80" rx="10" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.3"/>
  <text x="46" y="438" font-size="12" font-weight="600" fill="#1e4b7a">底座：同样的工具，落在哪儿由后端决定</text>
  <text x="46" y="462" font-size="10.8" fill="#334155">同一个 write_file：StateBackend 写进内存（线程结束就没）｜ StoreBackend 跨线程持久｜ FilesystemBackend 真落磁盘</text>
  <text x="46" y="484" font-size="10.8" fill="#64748b">工具只负责"动作"，后端负责"落在哪"——本课管工具，课 5 管后端</text>
</svg>
