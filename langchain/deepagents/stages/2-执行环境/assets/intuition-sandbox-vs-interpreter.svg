<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="560" fill="#fbfcfd"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2937">执行能力的两条来路：shell 还是 JavaScript</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">同一个 agent，两种完全不同的「能写代码」——能力边界、隔离方式、风险等级都不同</text>

  <!-- 上半：沙箱 -->
  <rect x="40" y="92" width="880" height="196" rx="10" fill="#eef6ff" stroke="#c7ddf5"/>
  <text x="60" y="118" font-size="14" font-weight="700" fill="#1a4f8a">沙箱（Sandbox）：给它一台机器</text>

  <rect x="60" y="132" width="200" height="60" rx="8" fill="#ffffff" stroke="#b9d4ef"/>
  <text x="80" y="156" font-size="13" font-weight="600" fill="#1f2937">create_deep_agent</text>
  <text x="80" y="176" font-size="12" fill="#6b7280">backend=&lt;沙箱后端&gt;</text>

  <path d="M268 162 L318 162" stroke="#1a4f8a" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="322" y="132" width="230" height="60" rx="8" fill="#ffffff" stroke="#b9d4ef"/>
  <text x="342" y="156" font-size="13" font-weight="600" fill="#1f2937">工具表多出 execute</text>
  <text x="342" y="176" font-size="12" fill="#6b7280">请求期检测 → 可见 n=9</text>

  <path d="M560 162 L610 162" stroke="#1a4f8a" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="614" y="132" width="286" height="60" rx="8" fill="#f0f8f2" stroke="#bcdcc4"/>
  <text x="634" y="156" font-size="13" font-weight="600" fill="#1f4d2e">隔离环境里跑 shell</text>
  <text x="634" y="176" font-size="12" fill="#4a6b55">装依赖 / 跑测试 / 调 CLI / git</text>

  <text x="60" y="216" font-size="12" fill="#374151">能碰到：真文件系统、真网络、真 OS、包管理器、各种二进制</text>
  <text x="60" y="238" font-size="12" fill="#374151">拿不到：宿主的凭据、宿主的环境变量、宿主进程（前提是沙箱真的隔离）</text>
  <text x="60" y="262" font-size="12" font-weight="600" fill="#8a3b1f">代价：一个容器/VM 的资源与费用；每次调用有网络延迟；必须自己管生命周期</text>

  <!-- 下半：解释器 -->
  <rect x="40" y="306" width="880" height="196" rx="10" fill="#fff8ec" stroke="#f0dcb4"/>
  <text x="60" y="332" font-size="14" font-weight="700" fill="#8a5a00">解释器（Interpreter）：给它一块草稿纸</text>

  <rect x="60" y="346" width="200" height="60" rx="8" fill="#ffffff" stroke="#ecd9ae"/>
  <text x="80" y="370" font-size="13" font-weight="600" fill="#1f2937">middleware=</text>
  <text x="80" y="390" font-size="12" fill="#6b7280">CodeInterpreterMiddleware()</text>

  <path d="M268 376 L318 376" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#a2)"/>

  <rect x="322" y="346" width="230" height="60" rx="8" fill="#ffffff" stroke="#ecd9ae"/>
  <text x="342" y="370" font-size="13" font-weight="600" fill="#1f2937">工具表多出 eval</text>
  <text x="342" y="390" font-size="12" fill="#6b7280">n=10（在 9 个基础上加）</text>

  <path d="M560 376 L610 376" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#a2)"/>

  <rect x="614" y="346" width="286" height="60" rx="8" fill="#fdf6e8" stroke="#e8d4a8"/>
  <text x="634" y="370" font-size="13" font-weight="600" fill="#7a4f00">QuickJS 里跑 JavaScript</text>
  <text x="634" y="390" font-size="12" fill="#7a6a4f">循环 / 分支 / 重试 / 数据转换</text>

  <text x="60" y="430" font-size="12" fill="#374151">能碰到：纯计算、变量与函数（可跨调用保留）、console 输出、PTC 白名单里的工具</text>
  <text x="60" y="452" font-size="12" fill="#374151">拿不到：shell、装包、文件系统、网络、setTimeout / require / process</text>
  <text x="60" y="476" font-size="12" font-weight="600" fill="#8a3b1f">代价：几乎没有——它就是内存里的一段 WebAssembly，几十毫秒起</text>

  <!-- 底部判据 -->
  <rect x="40" y="518" width="880" height="30" rx="6" fill="#f1f3f5"/>
  <text x="60" y="538" font-size="12.5" font-weight="600" fill="#374151">一句话判据：要"改这台机器的状态"就上沙箱；只想"在脑子里算清楚"就上解释器。</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1a4f8a"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8a5a00"/>
    </marker>
  </defs>
</svg>
