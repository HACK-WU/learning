<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="600" fill="#fbfcfd"/>
  <text x="40" y="44" font-size="21" font-weight="700" fill="#1f2937">execute 是怎么"长"出来的：一道 isinstance 检查</text>
  <text x="40" y="68" font-size="13" fill="#6b7280">沙箱后端只需要被判定为 SandboxBackendProtocol，请求期就会把 execute 留在工具表里</text>

  <!-- 静态表 -->
  <rect x="40" y="90" width="880" height="82" rx="10" fill="#f1f3f5" stroke="#dfe3e8"/>
  <text x="60" y="114" font-size="13.5" font-weight="700" fill="#374151">第 1 层　静态工具表（构造期）</text>
  <text x="60" y="136" font-size="12" fill="#4b5563">不管什么后端，这里永远有 9 个名字：</text>
  <text x="60" y="156" font-size="12.5" font-family="ui-monospace, monospace" fill="#1f2937">delete · edit_file · execute · glob · grep · ls · read_file · task · write_file</text>
  <text x="640" y="156" font-size="12" font-weight="600" fill="#8a3b1f">← 差异不在这层</text>

  <!-- 判定 -->
  <rect x="40" y="186" width="880" height="128" rx="10" fill="#eef6ff" stroke="#c7ddf5"/>
  <text x="60" y="210" font-size="13.5" font-weight="700" fill="#1a4f8a">第 2 层　请求期能力判定（每次模型调用前）</text>

  <rect x="60" y="224" width="330" height="72" rx="8" fill="#ffffff" stroke="#b9d4ef"/>
  <text x="76" y="246" font-size="12.5" font-family="ui-monospace, monospace" fill="#1f2937">isinstance(backend, SandboxBackendProtocol)</text>
  <text x="76" y="268" font-size="12" fill="#6b7280">或：CompositeBackend 的 default 是沙箱</text>
  <text x="76" y="288" font-size="12" fill="#6b7280">→ 只有 default，routes 里的沙箱不算</text>

  <path d="M398 250 L442 250" stroke="#1a4f8a" stroke-width="1.6" marker-end="url(#ab1)"/>
  <path d="M398 276 L442 276" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ab2)"/>

  <rect x="446" y="232" width="200" height="36" rx="6" fill="#f0f8f2" stroke="#bcdcc4"/>
  <text x="462" y="255" font-size="12.5" font-weight="600" fill="#1f4d2e">True → 保留 execute</text>

  <rect x="446" y="274" width="200" height="36" rx="6" fill="#fdeeee" stroke="#f0c9c9"/>
  <text x="462" y="297" font-size="12.5" font-weight="600" fill="#8a2b2b">False → 摘掉 execute</text>

  <rect x="664" y="232" width="236" height="78" rx="8" fill="#ffffff" stroke="#b9d4ef"/>
  <text x="680" y="254" font-size="12" fill="#374151">摘掉后模型看到 n=8</text>
  <text x="680" y="274" font-size="12" fill="#374151">保留后模型看到 n=9</text>
  <text x="680" y="296" font-size="11.5" font-weight="600" fill="#8a3b1f">delete 也走同一套判定</text>

  <!-- 三档后端 -->
  <rect x="40" y="334" width="880" height="158" rx="10" fill="#f0f8f2" stroke="#bcdcc4"/>
  <text x="60" y="358" font-size="13.5" font-weight="700" fill="#1f4d2e">第 3 层　三种典型后端的实测结果</text>

  <rect x="60" y="372" width="270" height="106" rx="8" fill="#ffffff" stroke="#bcdcc4"/>
  <text x="76" y="394" font-size="12.5" font-weight="700" fill="#1f2937">StateBackend / FilesystemBackend</text>
  <text x="76" y="416" font-size="12" fill="#4b5563">不是沙箱，没有隔离执行能力</text>
  <text x="76" y="438" font-size="12" font-family="ui-monospace, monospace" fill="#8a2b2b">n=8，无 execute</text>
  <text x="76" y="460" font-size="11.5" fill="#6b7280">文件工具照常可用</text>

  <rect x="346" y="372" width="270" height="106" rx="8" fill="#ffffff" stroke="#bcdcc4"/>
  <text x="362" y="394" font-size="12.5" font-weight="700" fill="#1f2937">LocalShellBackend</text>
  <text x="362" y="416" font-size="12" fill="#4b5563">本机 shell，无隔离边界</text>
  <text x="362" y="438" font-size="12" font-family="ui-monospace, monospace" fill="#1f4d2e">n=9，有 execute</text>
  <text x="362" y="460" font-size="11.5" font-weight="600" fill="#8a3b1f">危险：不受 virtual_mode 约束</text>

  <rect x="632" y="372" width="268" height="106" rx="8" fill="#ffffff" stroke="#bcdcc4"/>
  <text x="648" y="394" font-size="12.5" font-weight="700" fill="#1f2937">真正的沙箱后端（E2B 等）</text>
  <text x="648" y="416" font-size="12" fill="#4b5563">容器/VM 里执行，有隔离</text>
  <text x="648" y="438" font-size="12" font-family="ui-monospace, monospace" fill="#1f4d2e">n=9，有 execute</text>
  <text x="648" y="460" font-size="11.5" fill="#6b7280">需第三方账号与凭据</text>

  <!-- 底部 -->
  <rect x="40" y="508" width="880" height="68" rx="10" fill="#fff8ec" stroke="#f0dcb4"/>
  <text x="60" y="532" font-size="13" font-weight="700" fill="#8a5a00">关键落差：能力是"接口"给的，不是"实现质量"给的</text>
  <text x="60" y="556" font-size="12" fill="#7a6a4f">LocalShellBackend 也满足 SandboxBackendProtocol，所以它会拿到 execute —— 但它跑在你的本机上，隔离为零。</text>

  <defs>
    <marker id="ab1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1a4f8a"/>
    </marker>
    <marker id="ab2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
