<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#fbfcfd"/>
  <text x="450" y="30" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1f2937">第 2 步：换成真实目录，并把写口关掉</text>
  <text x="450" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">橙色虚线 = 本步新增 / 改动；其余框与第 1 步同位置，便于对比</text>

  <rect x="34" y="80" width="230" height="112" rx="10" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.5"/>
  <text x="149" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f5537">你写的</text>
  <text x="149" y="128" text-anchor="middle" font-size="10.2" fill="#334155" font-family="ui-monospace, Menlo, monospace">create_deep_agent(</text>
  <text x="149" y="144" text-anchor="middle" font-size="10.2" fill="#334155" font-family="ui-monospace, Menlo, monospace">  model=...,</text>
  <text x="149" y="160" text-anchor="middle" font-size="10.2" fill="#334155" font-family="ui-monospace, Menlo, monospace">  backend=...,</text>
  <text x="149" y="176" text-anchor="middle" font-size="10.2" fill="#7a4f13" font-family="ui-monospace, Menlo, monospace">  permissions=[...],</text>
  <text x="149" y="192" text-anchor="middle" font-size="10.2" fill="#7a4f13" font-family="ui-monospace, Menlo, monospace">  middleware=[...]</text>

  <line x1="270" y1="136" x2="300" y2="136" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="308" y="80" width="558" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="587" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">跑起来的样子</text>

  <rect x="334" y="120" width="150" height="46" rx="7" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.2"/>
  <text x="409" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#1e4b7a">模型</text>
  <text x="409" y="156" text-anchor="middle" font-size="9.5" fill="#64748b">会思考</text>

  <line x1="490" y1="143" x2="524" y2="143" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="524" y1="158" x2="490" y2="158" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="507" y="136" text-anchor="middle" font-size="9" fill="#94a3b8">调用</text>

  <rect x="530" y="112" width="310" height="74" rx="7" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.2"/>
  <text x="685" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#1f5537">工具：仍是 9 个（静态清单不变）</text>
  <text x="685" y="150" text-anchor="middle" font-size="9.3" fill="#334155" font-family="ui-monospace, Menlo, monospace">ls read_file write_file edit_file delete</text>
  <text x="685" y="165" text-anchor="middle" font-size="9.3" fill="#334155" font-family="ui-monospace, Menlo, monospace">glob grep execute task</text>
  <text x="685" y="180" text-anchor="middle" font-size="9.2" fill="#a16207">但 4 个写类被 profile 挡在模型视野外</text>

  <line x1="685" y1="192" x2="685" y2="222" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="697" y="212" font-size="9.5" fill="#64748b">读写落到哪</text>

  <rect x="530" y="228" width="310" height="62" rx="7" fill="#fff8ec" stroke="#e0b877" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="685" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#7a4f13">★ 换成 FilesystemBackend</text>
  <text x="685" y="266" text-anchor="middle" font-size="9.5" fill="#7a4f13">root_dir 指向真实仓库，virtual_mode 关住越界</text>
  <text x="685" y="281" text-anchor="middle" font-size="9.3" fill="#a16207">→ 它现在真的能读到 /src/calc.py</text>

  <line x1="527" y1="259" x2="492" y2="259" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="440" y="252" text-anchor="middle" font-size="9.5" fill="#64748b">读</text>

  <rect x="334" y="228" width="150" height="62" rx="7" fill="#f4f7fb" stroke="#c3d3e6" stroke-width="1.2"/>
  <text x="409" y="250" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">演示仓库</text>
  <text x="409" y="268" text-anchor="middle" font-size="9.3" fill="#64748b" font-family="ui-monospace, Menlo, monospace">README.md</text>
  <text x="409" y="282" text-anchor="middle" font-size="9.3" fill="#64748b" font-family="ui-monospace, Menlo, monospace">src/calc.py docs/api.md</text>

  <rect x="334" y="306" width="506" height="58" rx="7" fill="#fff8ec" stroke="#e0b877" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="350" y="326" font-size="10.8" font-weight="600" fill="#7a4f13">★ 本步新增：permissions 两道规则</text>
  <text x="350" y="344" font-size="9.8" fill="#7a4f13">read /** allow　+　write /** deny　→　第一条命中的规则生效</text>
  <text x="350" y="358" font-size="9.8" fill="#a16207">实测：write /src/x.py 返回 permission denied；read /src/calc.py 正常</text>

  <rect x="34" y="398" width="832" height="58" rx="8" fill="#fff8ec" stroke="#e0b877" stroke-width="1.3"/>
  <text x="52" y="420" font-size="11.3" fill="#7a4f13">看图：同一个位置的两处变化——橙色虚线①把空抽屉换成真实目录，橙色虚线②给写操作上了锁。</text>
  <text x="52" y="440" font-size="11.3" fill="#7a4f13">注意工具清单没变（还是 9 个）：能看见工具 ≠ 能成功执行，这是本课最容易搞混的一点。</text>
</svg>
