<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="620" viewBox="0 0 1020 620">
  <rect width="1020" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1f2d3d">第 2 步：迁 Store + 量化 + 管住笔</text>
  <text x="30" y="66" font-family="sans-serif" font-size="13" fill="#667788">橙色虚线是相对第 1 步的三处变化</text>

  <rect x="30" y="92" width="300" height="176" rx="8" fill="#fff8ec" stroke="#e0b877" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="48" y="118" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a4f13">变化①：迁到 Store</text>
  <text x="48" y="144" font-family="monospace" font-size="10" fill="#33475b">CompositeBackend(</text>
  <text x="60" y="162" font-family="monospace" font-size="10" fill="#33475b">default=StateBackend(),</text>
  <text x="60" y="180" font-family="monospace" font-size="10" fill="#33475b">routes={"/memories/": StoreBackend(</text>
  <text x="72" y="198" font-family="monospace" font-size="10" fill="#33475b">store=store,</text>
  <text x="72" y="216" font-family="monospace" font-size="10" fill="#2e6b4f">namespace=lambda _rt: ("my-agent",)</text>
  <text x="60" y="234" font-family="monospace" font-size="10" fill="#33475b">)})</text>
  <text x="48" y="256" font-family="sans-serif" font-size="10" fill="#a33b3b">实测 T1/T2/T3 全都能读到</text>

  <rect x="356" y="92" width="300" height="176" rx="8" fill="#fff8ec" stroke="#e0b877" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="374" y="118" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a4f13">变化②：量出固定税</text>
  <text x="374" y="144" font-family="sans-serif" font-size="10.5" fill="#7a4f13">用假模型记录系统提示长度</text>
  <text x="374" y="168" font-family="monospace" font-size="10" fill="#a33b3b">正文   0 → 固定税 100.0%</text>
  <text x="374" y="186" font-family="monospace" font-size="10" fill="#a33b3b">正文 500 → 固定税  91.1%</text>
  <text x="374" y="204" font-family="monospace" font-size="10" fill="#a33b3b">正文  20k → 固定税  20.4%</text>
  <text x="374" y="230" font-family="sans-serif" font-size="10.5" fill="#2e6b4f">结论：精简正文省不了多少</text>
  <text x="374" y="250" font-family="sans-serif" font-size="10.5" fill="#2e6b4f">真正的省法是"别放常驻"</text>

  <rect x="682" y="92" width="300" height="176" rx="8" fill="#fff8ec" stroke="#e0b877" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="700" y="118" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a4f13">变化③：管住它的笔</text>
  <text x="700" y="144" font-family="sans-serif" font-size="10.5" fill="#7a4f13">方案 A 放开自更新：</text>
  <text x="700" y="162" font-family="monospace" font-size="9.5" fill="#2e6b4f">Successfully replaced 1 instance</text>
  <text x="700" y="186" font-family="sans-serif" font-size="10.5" fill="#7a4f13">方案 B deny 写 /memories/**:</text>
  <text x="700" y="204" font-family="monospace" font-size="9.5" fill="#a33b3b">Error: permission denied for write</text>
  <text x="700" y="230" font-family="sans-serif" font-size="10.5" fill="#7a4f13">再加一道 git diff 人工审查</text>
  <text x="700" y="250" font-family="sans-serif" font-size="10.5" fill="#667788">记忆是纯 Markdown，diff 就能看</text>

  <rect x="30" y="288" width="952" height="180" rx="8" fill="#fdf3f3" stroke="#e0a0a0" stroke-width="1.6"/>
  <text x="48" y="314" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a33b3b">Store 的三个坑（实测报错原文）</text>
  <text x="48" y="342" font-family="monospace" font-size="10.5" fill="#a33b3b">① backend 传工厂</text>
  <text x="60" y="360" font-family="monospace" font-size="10" fill="#33475b">TypeError: backend must be an initialized backend instance.</text>
  <text x="60" y="376" font-family="monospace" font-size="10" fill="#33475b">Backend factories were removed in deepagents 0.7</text>
  <text x="48" y="404" font-family="monospace" font-size="10.5" fill="#a33b3b">② namespace 传元组</text>
  <text x="60" y="422" font-family="monospace" font-size="10" fill="#33475b">TypeError: 'tuple' object is not callable</text>
  <text x="60" y="438" font-family="monospace" font-size="10" fill="#2e6b4f">　→ 改成 namespace=lambda _rt: ("my-agent",)</text>
  <text x="48" y="462" font-family="monospace" font-size="10.5" fill="#a33b3b">③ seed 到带前缀的 key（读不到，静默）</text>

  <rect x="640" y="330" width="330" height="126" rx="8" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.5"/>
  <text x="658" y="356" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e4b7a">key 前缀为什么被剥掉</text>
  <text x="658" y="380" font-family="monospace" font-size="9.5" fill="#1e4b7a">memory=["/memories/AGENTS.md"]</text>
  <text x="658" y="398" font-family="monospace" font-size="9.5" fill="#1e4b7a">routes={"/memories/": StoreBackend}</text>
  <text x="658" y="420" font-family="sans-serif" font-size="10" fill="#33475b">→ Composite 剥掉 /memories/</text>
  <text x="658" y="436" font-family="sans-serif" font-size="10" fill="#33475b">→ store.get(ns, "/AGENTS.md")</text>
  <text x="658" y="452" font-family="sans-serif" font-size="9.5" fill="#2e6b4f">所以 seed 要写 "/AGENTS.md"</text>

  <rect x="30" y="490" width="952" height="100" rx="8" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.5"/>
  <text x="48" y="516" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1f5537">落盘前自检</text>
  <text x="48" y="540" font-family="sans-serif" font-size="11" fill="#1f5537">① 两版可对比（基础版存不住 → 综合版持久）② 固定税曲线可复现 ③ 三个坑都有报错原文 ④ 权限拦截有实测对照</text>
  <text x="48" y="564" font-family="sans-serif" font-size="11" fill="#1f5537">⑤ seed key 与路由前缀的关系已画清 ⑥ 图 2 张、均 xmllint 通过、均带读图指引 ⑦ 双入口已挂索引</text>
</svg>
