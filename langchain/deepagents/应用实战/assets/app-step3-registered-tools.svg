<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#fbfcfd"/>
  <text x="450" y="30" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1f2937">第 3 步：从"藏起来"改成"压根没有"</text>
  <text x="450" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">橙色虚线 = 本步改动；框的位置与上两步一致，方便对比</text>

  <rect x="34" y="80" width="230" height="128" rx="10" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.5"/>
  <text x="149" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f5537">你写的</text>
  <text x="149" y="126" text-anchor="middle" font-size="10.2" fill="#334155" font-family="ui-monospace, Menlo, monospace">create_deep_agent(</text>
  <text x="149" y="142" text-anchor="middle" font-size="10.2" fill="#334155" font-family="ui-monospace, Menlo, monospace">  model=...,</text>
  <text x="149" y="158" text-anchor="middle" font-size="10.2" fill="#334155" font-family="ui-monospace, Menlo, monospace">  backend=...,</text>
  <text x="149" y="174" text-anchor="middle" font-size="10.2" fill="#7a4f13" font-family="ui-monospace, Menlo, monospace">  middleware=[</text>
  <text x="149" y="190" text-anchor="middle" font-size="10.2" fill="#7a4f13" font-family="ui-monospace, Menlo, monospace">   FilesystemMiddleware(</text>
  <text x="149" y="206" text-anchor="middle" font-size="10.2" fill="#7a4f13" font-family="ui-monospace, Menlo, monospace">     tools=[...])]</text>

  <line x1="270" y1="144" x2="300" y2="144" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#a3)"/>

  <rect x="308" y="80" width="558" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="587" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">跑起来的样子</text>

  <rect x="334" y="120" width="150" height="46" rx="7" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.2"/>
  <text x="409" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#1e4b7a">模型</text>
  <text x="409" y="156" text-anchor="middle" font-size="9.5" fill="#64748b">会思考</text>

  <line x1="490" y1="143" x2="524" y2="143" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="524" y1="158" x2="490" y2="158" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a3)"/>
  <text x="507" y="136" text-anchor="middle" font-size="9" fill="#94a3b8">调用</text>

  <rect x="530" y="112" width="310" height="78" rx="7" fill="#fff8ec" stroke="#e0b877" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="685" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#7a4f13">★ 工具表真的只剩 5 个</text>
  <text x="685" y="151" text-anchor="middle" font-size="9.6" fill="#7a4f13" font-family="ui-monospace, Menlo, monospace">ls read_file glob grep task</text>
  <text x="685" y="169" text-anchor="middle" font-size="9.2" fill="#a16207">write / edit / delete / execute 不再注册</text>
  <text x="685" y="184" text-anchor="middle" font-size="9.2" fill="#a16207">不是"藏起来"，是工具表里没有这一项</text>

  <line x1="685" y1="196" x2="685" y2="226" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a3)"/>
  <text x="697" y="216" font-size="9.5" fill="#64748b">读写落到哪</text>

  <rect x="530" y="232" width="310" height="58" rx="7" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.2"/>
  <text x="685" y="252" text-anchor="middle" font-size="10.8" font-weight="600" fill="#1f5537">真实仓库目录（沿用第 2 步）</text>
  <text x="685" y="270" text-anchor="middle" font-size="9.4" fill="#334155">read 通、write 通不了——但这次连工具都没有</text>

  <line x1="527" y1="261" x2="492" y2="261" stroke="#5a6b7d" stroke-width="1.6" marker-end="url(#a3)"/>
  <text x="440" y="254" text-anchor="middle" font-size="9.5" fill="#64748b">读</text>

  <rect x="334" y="232" width="150" height="58" rx="7" fill="#f4f7fb" stroke="#c3d3e6" stroke-width="1.2"/>
  <text x="409" y="254" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">演示仓库</text>
  <text x="409" y="272" text-anchor="middle" font-size="9.3" fill="#64748b" font-family="ui-monospace, Menlo, monospace">src/calc.py …</text>

  <rect x="334" y="306" width="506" height="58" rx="7" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="350" y="326" font-size="10.8" font-weight="600" fill="#1e4b7a">★ 本步关键：同名替换（不是新增）</text>
  <text x="350" y="344" font-size="9.8" fill="#1e4b7a">你的 FilesystemMiddleware 与默认那条同名 → 顶掉原位置</text>
  <text x="350" y="358" font-size="9.8" fill="#64748b">节点数没变，变的只是这个槽位里装的是什么</text>

  <rect x="34" y="398" width="832" height="58" rx="8" fill="#fff8ec" stroke="#e0b877" stroke-width="1.3"/>
  <text x="52" y="420" font-size="11.3" fill="#7a4f13">看图：第 2 步是"工具还在、执行被拦"，第 3 步是"工具不在了"，两者是不同层。安全评审要哪一种，取决于它问的是可见性还是能力。</text>
  <text x="52" y="440" font-size="11.3" fill="#7a4f13">到这一步能做什么：一个只读的仓库答疑助手，答案必须带路径行号，写操作在三个层上都走不通。</text>
</svg>
