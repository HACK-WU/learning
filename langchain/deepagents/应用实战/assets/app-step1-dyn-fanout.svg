<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470">
  <defs>
    <marker id="m12s1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="1040" height="470" fill="#ffffff"/>
  <text x="30" y="40" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1f2d3d">第 1 步：一个循环派 5 个，主上下文只剩一行</text>
  <text x="30" y="66" font-family="sans-serif" font-size="13" fill="#667788">子代理干了大量活，主代理只看到统计结果——这既是收益，也是"看不出发生了什么"的来源</text>

  <!-- 左：脚本 -->
  <rect x="30" y="92" width="470" height="250" rx="9" fill="#fff8ec" stroke="#e0b877" stroke-width="1.6"/>
  <text x="48" y="118" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#7a4f13">模型写出的 eval 脚本</text>

  <rect x="48" y="134" width="434" height="192" rx="6" fill="#1f2d3d"/>
  <text x="64" y="158" font-family="monospace" font-size="9.5" fill="#c8d8e8">const competitors = ["飞书","Notion",</text>
  <text x="64" y="174" font-family="monospace" font-size="9.5" fill="#c8d8e8">  "Coda","Airtable","ClickUp"];</text>
  <text x="64" y="196" font-family="monospace" font-size="9.5" fill="#a8e0b8">const reports = await Promise.all(</text>
  <text x="64" y="212" font-family="monospace" font-size="9.5" fill="#a8e0b8">  competitors.map(name =&gt;</text>
  <text x="80" y="228" font-family="monospace" font-size="9.5" fill="#ffd888">    task({ description: `调研 ${name}`,</text>
  <text x="100" y="244" font-family="monospace" font-size="9.5" fill="#ffd888">           subagentType: "researcher" })</text>
  <text x="64" y="260" font-family="monospace" font-size="9.5" fill="#a8e0b8">  )</text>
  <text x="64" y="276" font-family="monospace" font-size="9.5" fill="#a8e0b8">);</text>
  <text x="64" y="298" font-family="monospace" font-size="9.5" fill="#88b8e8">`共 ${reports.length} 份，</text>
  <text x="64" y="314" font-family="monospace" font-size="9.5" fill="#88b8e8"> 总长 ${reports.join("").length} 字`</text>

  <line x1="500" y1="216" x2="530" y2="216" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#m12s1)"/>

  <!-- 右：主上下文 -->
  <rect x="538" y="92" width="472" height="250" rx="9" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.6"/>
  <text x="556" y="118" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1f5537">主代理实际收到的 messages</text>

  <rect x="556" y="134" width="436" height="46" rx="5" fill="#ffffff" stroke="#9ccfae"/>
  <text x="570" y="152" font-family="sans-serif" font-size="9.5" fill="#33475b">[human] "调研这 5 个竞品"</text>
  <text x="570" y="170" font-family="sans-serif" font-size="9" fill="#667788">→ 用户那一句</text>

  <rect x="556" y="190" width="436" height="46" rx="5" fill="#ffffff" stroke="#9ccfae"/>
  <text x="570" y="208" font-family="sans-serif" font-size="9.5" fill="#33475b">[ai] tool_calls: eval(code)</text>
  <text x="570" y="226" font-family="sans-serif" font-size="9" fill="#667788">→ 模型只发了一次工具调用</text>

  <rect x="556" y="246" width="436" height="46" rx="5" fill="#fff8ec" stroke="#e0b877" stroke-width="1.3"/>
  <text x="570" y="264" font-family="monospace" font-size="9" fill="#7a4f13">[tool] "共 5 份，总长 3480 字"</text>
  <text x="570" y="282" font-family="sans-serif" font-size="9" fill="#a33b3b">→ 5 份报告正文不在这里</text>

  <rect x="556" y="304" width="436" height="22" rx="5" fill="#eef6ff" stroke="#7fb2e5"/>
  <text x="570" y="319" font-family="sans-serif" font-size="9" fill="#1e4b7a">[ai] "调研完成"</text>

  <!-- 底部：三个问题 -->
  <rect x="30" y="362" width="980" height="90" rx="8" fill="#fdf3f3" stroke="#e0a0a0" stroke-width="1.4"/>
  <text x="48" y="384" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a33b3b">三个待解决的问题</text>
  <text x="48" y="406" font-family="sans-serif" font-size="10.5" fill="#33475b">① 收益看不见——要拿并行 task tool_calls 对照，才知道省了多少字符</text>
  <text x="48" y="426" font-family="sans-serif" font-size="10.5" fill="#33475b">② 小规模反而慢——解释器启动是固定开销，N=4 时慢 3.8 倍</text>
  <text x="48" y="446" font-family="sans-serif" font-size="10.5" fill="#33475b">③ 这条路没有 task_id——不能中途改指令、不能取消，要那个能力得走异步</text>
</svg>
