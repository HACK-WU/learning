<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6b7d"/>
    </marker>
    <marker id="arrow-hi" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#fbfcfd"/>

  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">Deep Agents 学习路径</text>
  <text x="480" y="58" text-anchor="middle" font-size="12.5" fill="#6b7280">从「知道它是什么」到「敢让它动手、能管住它、能上线」</text>

  <!-- Stage 1 -->
  <rect x="40" y="100" width="196" height="150" rx="10" fill="#eef6ff" stroke="#7fb2e5" stroke-width="1.6"/>
  <text x="138" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#1e4b7a">阶段 1 · 定位与起跑</text>
  <line x1="60" y1="136" x2="216" y2="136" stroke="#b9d5ef"/>
  <text x="138" y="158" text-anchor="middle" font-size="11.5" fill="#334155">课 1 环境准备</text>
  <text x="138" y="180" text-anchor="middle" font-size="11.5" fill="#334155">课 2 它是什么</text>
  <text x="138" y="202" text-anchor="middle" font-size="11.5" fill="#334155">课 3 第一个 agent</text>
  <text x="138" y="228" text-anchor="middle" font-size="10.5" fill="#64748b">跑起来，看清默认装配</text>

  <!-- Stage 2 -->
  <rect x="268" y="100" width="196" height="150" rx="10" fill="#f0f8f2" stroke="#86bfa0" stroke-width="1.6"/>
  <text x="366" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#1f5537">阶段 2 · 执行环境</text>
  <line x1="288" y1="136" x2="444" y2="136" stroke="#b6dcc4"/>
  <text x="366" y="158" text-anchor="middle" font-size="11.5" fill="#334155">课 4 工具与文件系统</text>
  <text x="366" y="180" text-anchor="middle" font-size="11.5" fill="#334155">课 5 后端与权限</text>
  <text x="366" y="202" text-anchor="middle" font-size="11.5" fill="#334155">课 6 沙箱与解释器</text>
  <text x="366" y="228" text-anchor="middle" font-size="10.5" fill="#64748b">让它动手，划清能动手到哪</text>

  <!-- Stage 3 -->
  <rect x="496" y="100" width="196" height="150" rx="10" fill="#fff8ec" stroke="#e0b877" stroke-width="1.6"/>
  <text x="594" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#7a4f13">阶段 3 · 上下文管理</text>
  <line x1="516" y1="136" x2="672" y2="136" stroke="#f0d5ab"/>
  <text x="594" y="158" text-anchor="middle" font-size="11.5" fill="#334155">课 7 技能 Skills</text>
  <text x="594" y="180" text-anchor="middle" font-size="11.5" fill="#334155">课 8 记忆 Memory</text>
  <text x="594" y="202" text-anchor="middle" font-size="11.5" fill="#334155">课 9 上下文工程</text>
  <text x="594" y="228" text-anchor="middle" font-size="10.5" fill="#64748b">让它记得住，且撑得久</text>

  <!-- Stage 4 -->
  <rect x="724" y="100" width="196" height="150" rx="10" fill="#f9f2fb" stroke="#b992c7" stroke-width="1.6"/>
  <text x="822" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#5b2f6b">阶段 4 · 委派与上线</text>
  <line x1="744" y1="136" x2="900" y2="136" stroke="#ddc4e6"/>
  <text x="822" y="158" text-anchor="middle" font-size="11.5" fill="#334155">课 10 规划与子代理</text>
  <text x="822" y="180" text-anchor="middle" font-size="11.5" fill="#334155">课 11 人在环中</text>
  <text x="822" y="202" text-anchor="middle" font-size="11.5" fill="#334155">课 12 异步子代理</text>
  <text x="822" y="224" text-anchor="middle" font-size="11.5" fill="#334155">课 13 生产化</text>

  <!-- arrows -->
  <line x1="236" y1="175" x2="264" y2="175" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="464" y1="175" x2="492" y2="175" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="692" y1="175" x2="720" y2="175" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- closing project -->
  <rect x="300" y="300" width="360" height="66" rx="10" fill="#fdf2f2" stroke="#d99a9a" stroke-width="1.6"/>
  <text x="480" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#7a2626">结课实战项目：一个能自己查、自己写、自己收尾的研究助手</text>
  <text x="480" y="348" text-anchor="middle" font-size="11" fill="#7f5a5a">跨阶段整合 · 4 项设计决策 · 反例对照 · 验收清单</text>
  <line x1="480" y1="252" x2="480" y2="296" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-hi)"/>

  <text x="480" y="398" text-anchor="middle" font-size="11" fill="#94a3b8">阶段 1 只讲「它是什么」；阶段 2–4 依次回答「能动手到哪 / 能记多久 / 能委派给谁，最后怎么上线」</text>
</svg>
