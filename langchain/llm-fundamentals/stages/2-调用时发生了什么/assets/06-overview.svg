<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">每个位置都能看到全部前文，但不是同样认真地看</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#6b7280">窗口内不存在"记不住远处"，但存在"没重点看中间"</text>

  <!-- 左：注意力都能看 -->
  <rect x="40" y="72" width="380" height="150" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">① 能看到：每个位置都可直接访问</text>
  <text x="70" y="128" font-size="11" fill="#374151">生成第 N 个词时，回头"查"前 N-1 个位置</text>
  <text x="70" y="150" font-size="11" fill="#374151">不是"读完传给下一个"（那是老模型）</text>
  <text x="70" y="172" font-size="11" fill="#374151">所以窗口内【不存在遗忘】</text>
  <text x="70" y="196" font-size="11" font-weight="700" fill="#1e40af">Q 查什么 · K 能提供什么 · V 取走什么</text>

  <!-- 右：权重不均 -->
  <rect x="470" y="72" width="390" height="150" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="665" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">② 会注意：权重偏好首尾</text>
  <text x="665" y="124" text-anchor="middle" font-size="11" fill="#b91c1c">训练数据里重点总在开头（标题）和结尾（总结）</text>
  <rect x="500" y="138" width="60" height="42" rx="4" fill="#ef4444"/>
  <text x="530" y="164" text-anchor="middle" font-size="10" fill="#ffffff">强</text>
  <rect x="564" y="146" width="60" height="34" rx="4" fill="#f87171"/>
  <text x="594" y="167" text-anchor="middle" font-size="10" fill="#ffffff">中</text>
  <rect x="628" y="154" width="60" height="26" rx="4" fill="#fca5a5"/>
  <text x="658" y="171" text-anchor="middle" font-size="10" fill="#7f1d1d">弱</text>
  <rect x="692" y="150" width="60" height="30" rx="4" fill="#f87171"/>
  <text x="722" y="169" text-anchor="middle" font-size="10" fill="#ffffff">中</text>
  <rect x="756" y="138" width="60" height="42" rx="4" fill="#ef4444"/>
  <text x="786" y="164" text-anchor="middle" font-size="10" fill="#ffffff">强</text>
  <text x="530" y="198" text-anchor="middle" font-size="10" fill="#991b1b">开头</text>
  <text x="658" y="198" text-anchor="middle" font-size="10" fill="#991b1b">中间</text>
  <text x="786" y="198" text-anchor="middle" font-size="10" fill="#991b1b">结尾</text>

  <!-- 代价 -->
  <rect x="40" y="240" width="380" height="92" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="230" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">代价：每个 token 都要付钱</text>
  <text x="230" y="290" text-anchor="middle" font-size="11" fill="#92400e">输入 token 每次请求都要发一次</text>
  <text x="230" y="310" text-anchor="middle" font-size="11" fill="#b45309">多轮会话：第 10 轮要带上前 9 轮全部内容</text>
  <text x="230" y="326" text-anchor="middle" font-size="11" fill="#92400e">实测：4 轮对话输入 62 → 406 token</text>

  <!-- RAG 后果 -->
  <rect x="470" y="240" width="390" height="92" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="665" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">对 RAG 的直接后果：必须重排</text>
  <text x="665" y="288" text-anchor="middle" font-size="11" fill="#059669">检索排序是给系统看的，不是给模型看的</text>
  <text x="665" y="308" text-anchor="middle" font-size="11" fill="#059669">最相关 → 放开头 ｜ 次相关 → 放结尾</text>
  <text x="665" y="326" text-anchor="middle" font-size="11" fill="#047857">别让关键信息躺在中间</text>

  <rect x="40" y="350" width="820" height="34" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="450" y="372" text-anchor="middle" font-size="11" fill="#6b7280">诚实说明：lost in the middle 在本环境三轮实验均未复现（可精确定位的任务上模型已很强），重排建议按保险对待</text>
</svg>
