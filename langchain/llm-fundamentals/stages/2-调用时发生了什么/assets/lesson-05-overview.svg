<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">它不是在查表，每一步都在抽签</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#6b7280">同一个问题每次答案不同——这不是故障，是机制</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="40" y="72" width="190" height="76" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="135" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">① 算出分数</text>
  <text x="135" y="119" text-anchor="middle" font-size="11" fill="#3b82f6">每个候选一个 logit</text>
  <text x="135" y="137" text-anchor="middle" font-size="11" fill="#6b7280">北京 6.2 / 上海 2.1</text>

  <line x1="235" y1="110" x2="290" y2="110" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="295" y="72" width="190" height="76" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="390" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">② 变成概率</text>
  <text x="390" y="119" text-anchor="middle" font-size="11" fill="#3b82f6">softmax 归一化</text>
  <text x="390" y="137" text-anchor="middle" font-size="11" fill="#6b7280">北京 97.5% / 上海 1.6%</text>

  <line x1="490" y1="110" x2="545" y2="110" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="550" y="72" width="190" height="76" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="645" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">③ 按概率抽签</text>
  <text x="645" y="119" text-anchor="middle" font-size="11" fill="#92400e">不是取最大值</text>
  <text x="645" y="137" text-anchor="middle" font-size="11" fill="#b45309">最可能 ≠ 必然</text>

  <line x1="745" y1="110" x2="800" y2="110" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <text x="830" y="107" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">重复</text>
  <text x="830" y="125" text-anchor="middle" font-size="11" fill="#6b7280">几百次</text>

  <text x="450" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">抽签的后果：最可能的选项，经常没被选中</text>

  <rect x="60" y="198" width="370" height="96" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="245" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">模型很有把握时</text>
  <text x="245" y="248" text-anchor="middle" font-size="11" fill="#059669">「北京」97.5% → 实测抽中 97.5%</text>
  <text x="245" y="270" text-anchor="middle" font-size="11" fill="#059669">跑偏 2.5%，答案基本稳定</text>
  <text x="245" y="286" text-anchor="middle" font-size="11" fill="#6b7280">如：1+1 等于几</text>

  <rect x="470" y="198" width="370" height="96" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="655" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">模型没什么把握时</text>
  <text x="655" y="248" text-anchor="middle" font-size="11" fill="#b91c1c">「因此」26.7% → 实测抽中 26.5%</text>
  <text x="655" y="270" text-anchor="middle" font-size="11" fill="#b91c1c">跑偏 73.5%：四次里三次选别的</text>
  <text x="655" y="286" text-anchor="middle" font-size="11" fill="#6b7280">如：写一段开头</text>

  <rect x="60" y="312" width="780" height="66" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="450" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">关键实测：temperature=0 + 固定 seed=42，三次输出依然不同</text>
  <text x="450" y="358" text-anchor="middle" font-size="11" fill="#7c3aed">服务端浮点非确定性 / 批处理 / 推测解码 —— 所以测试不能断言字面，缓存不是一致性保证</text>
  <text x="450" y="374" text-anchor="middle" font-size="11" fill="#9ca3af">真实 API 实测于 2026-09-21，阿里云百炼 qwen3.8-flash</text>
</svg>
