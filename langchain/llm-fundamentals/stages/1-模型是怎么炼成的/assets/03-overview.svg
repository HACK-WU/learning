<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">预训练：一个动作，反复施加万亿次</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#6b7280">没人教它翻译、推理、写代码——只要求一件事：下一个词是什么</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 输入：海量文本 -->
  <rect x="40" y="78" width="230" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">整个互联网的文本</text>
  <text x="155" y="126" text-anchor="middle" font-size="12" fill="#3b82f6">网页 / 书 / 代码 / 论坛</text>
  <text x="155" y="150" text-anchor="middle" font-size="11" fill="#6b7280">不需要任何人标注</text>
  <text x="155" y="166" text-anchor="middle" font-size="11" fill="#6b7280">数据自己就是标签</text>

  <line x1="275" y1="126" x2="345" y2="126" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 唯一的动作 -->
  <rect x="350" y="78" width="200" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="450" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">唯一的动作</text>
  <text x="450" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">猜下一个词</text>
  <text x="450" y="152" text-anchor="middle" font-size="11" fill="#b45309">施加了万亿次</text>
  <text x="450" y="168" text-anchor="middle" font-size="11" fill="#b45309">「猜不准，就得懂」</text>

  <line x1="555" y1="126" x2="625" y2="126" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 产出 -->
  <rect x="630" y="78" width="230" height="96" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="745" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">被迫学会</text>
  <text x="745" y="126" text-anchor="middle" font-size="12" fill="#059669">语法结构 · 世界知识</text>
  <text x="745" y="148" text-anchor="middle" font-size="12" fill="#059669">翻译 · 推理 · 写代码</text>
  <text x="745" y="166" text-anchor="middle" font-size="11" fill="#6b7280">都是「猜得准」的副产品</text>

  <!-- 下半：到不了的地方 -->
  <text x="450" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">但这套机制到不了的地方</text>

  <rect x="60" y="230" width="240" height="112" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="180" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">① 不会「回答」</text>
  <text x="180" y="280" text-anchor="middle" font-size="11" fill="#b91c1c">只会接下去写</text>
  <text x="180" y="300" text-anchor="middle" font-size="11" fill="#b91c1c">问它问题 → 继续编问题</text>
  <text x="180" y="326" text-anchor="middle" font-size="11" fill="#059669">→ 课 4 后训练来补</text>

  <rect x="330" y="230" width="240" height="112" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">② 语料之外一无所知</text>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="#b91c1c">有知识截止日期</text>
  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#b91c1c">你公司的私域 = 从没见过</text>
  <text x="450" y="326" text-anchor="middle" font-size="11" fill="#059669">→ 外挂检索（RAG）来补</text>

  <rect x="600" y="230" width="240" height="112" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="720" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">③ 不会说「不知道」</text>
  <text x="720" y="280" text-anchor="middle" font-size="11" fill="#b91c1c">压缩是有损的</text>
  <text x="720" y="300" text-anchor="middle" font-size="11" fill="#b91c1c">存的是印象，不是原文</text>
  <text x="720" y="326" text-anchor="middle" font-size="11" fill="#b91c1c">→ 幻觉，课 7 展开</text>

  <text x="450" y="378" text-anchor="middle" font-size="12" fill="#374151">本机实测：验证集困惑度 4.18（训练集 4.14）——它没在死背，学到的是规律</text>
  <text x="450" y="402" text-anchor="middle" font-size="11" fill="#6b7280">三个缺口不是「暂时缺陷」，是「猜下一个词」这条路的结构性边界</text>
  <text x="450" y="420" text-anchor="middle" font-size="11" fill="#9ca3af">小模型实验演示机制，真实 LLM 结论另标文献</text>
</svg>
