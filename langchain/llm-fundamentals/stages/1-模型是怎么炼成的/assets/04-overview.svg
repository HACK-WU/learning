<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">同一个模型，两件事分开做</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#6b7280">知识是一次性装进去的，行为是后训练教的——后者一点知识都没加</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 底座 -->
  <rect x="330" y="76" width="240" height="62" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">预训练底座</text>
  <text x="450" y="122" text-anchor="middle" font-size="12" fill="#3b82f6">知识在这里，已经装好了</text>

  <line x1="450" y1="138" x2="450" y2="168" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 两个分支 -->
  <line x1="450" y1="168" x2="220" y2="168" stroke="#4b5563" stroke-width="2"/>
  <line x1="220" y1="168" x2="220" y2="196" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="450" y1="168" x2="680" y2="168" stroke="#4b5563" stroke-width="2"/>
  <line x1="680" y1="168" x2="680" y2="196" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 左：不后训练 -->
  <rect x="80" y="202" width="280" height="128" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="220" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">不做后训练 = 续写机</text>
  <text x="220" y="254" text-anchor="middle" font-size="11" fill="#92400e">问：如何训练狗坐下？</text>
  <text x="220" y="276" text-anchor="middle" font-size="11" fill="#b45309">答：如何训练猫用猫砂盆？如何选宠物保险？</text>
  <text x="220" y="302" text-anchor="middle" font-size="11" fill="#92400e">它其实「知道」答案</text>
  <text x="220" y="320" text-anchor="middle" font-size="11" fill="#92400e">只是没人教它该「回答」</text>

  <!-- 右：后训练 -->
  <rect x="540" y="202" width="280" height="128" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="680" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">后训练 = 助手</text>
  <text x="680" y="252" text-anchor="middle" font-size="11" fill="#059669">SFT：几万条示范 → 学会格式语气</text>
  <text x="680" y="274" text-anchor="middle" font-size="11" fill="#059669">RLHF：人类排序 → 学会人喜欢哪种</text>
  <text x="680" y="300" text-anchor="middle" font-size="11" fill="#047857">数据量只有预训练的极小一部分</text>
  <text x="680" y="320" text-anchor="middle" font-size="11" fill="#047857">实测：问答格式困惑度 25.3 → 4.4</text>

  <!-- 底部：没被涂绿的那一格 -->
  <rect x="80" y="352" width="740" height="52" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">但这一格没被涂绿：它依然不会说「我不知道」</text>
  <text x="450" y="395" text-anchor="middle" font-size="11" fill="#b91c1c">实测：问它语料里没有的事，后训练后照样编一个像模像样的回答——幻觉没治好</text>
</svg>
