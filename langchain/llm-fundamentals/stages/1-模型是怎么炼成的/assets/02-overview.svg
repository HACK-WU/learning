<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="940" height="440" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">一句话进模型之后，发生了什么</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#6b7280">人看到的是字，模型拿到的是编号块，回答时一块一块往外吐</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 左：你看到的 -->
  <rect x="40" y="88" width="210" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="40" y="88" width="210" height="32" rx="10" fill="#3b82f6"/>
  <text x="145" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">你看到的</text>
  <text x="145" y="146" text-anchor="middle" font-size="12" fill="#1e40af">一个个字母</text>
  <text x="60" y="176" font-size="15" font-family="Consolas, monospace" fill="#111827">s t r a w</text>
  <text x="60" y="200" font-size="15" font-family="Consolas, monospace" fill="#111827">b e r r y</text>
  <text x="145" y="226" text-anchor="middle" font-size="12" fill="#6b7280">10 个字母，能数出 3 个 r</text>

  <!-- 中：模型拿到的 -->
  <rect x="300" y="88" width="240" height="150" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="300" y="88" width="240" height="32" rx="10" fill="#f59e0b"/>
  <text x="420" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">模型拿到的</text>
  <text x="420" y="146" text-anchor="middle" font-size="12" fill="#b45309">不是字母，是编号块</text>
  <rect x="318" y="162" width="62" height="34" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="349" y="184" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#92400e">str</text>
  <rect x="390" y="162" width="62" height="34" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="421" y="184" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#92400e">aw</text>
  <rect x="462" y="162" width="62" height="34" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="493" y="184" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#92400e">berry</text>
  <text x="420" y="216" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#78350f">496   675   15717</text>
  <text x="420" y="234" text-anchor="middle" font-size="11" fill="#92400e">字母被封在块里，数不到了</text>

  <!-- 右：一次吐一块 -->
  <rect x="590" y="88" width="310" height="150" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="590" y="88" width="310" height="32" rx="10" fill="#10b981"/>
  <text x="745" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">它怎么回答你</text>
  <text x="745" y="146" text-anchor="middle" font-size="12" fill="#047857">一次只吐一块，吐完接回队尾</text>
  <rect x="608" y="160" width="54" height="28" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="635" y="179" text-anchor="middle" font-size="12" fill="#065f46">The</text>
  <rect x="670" y="160" width="54" height="28" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="697" y="179" text-anchor="middle" font-size="12" fill="#065f46">capital</text>
  <rect x="732" y="160" width="54" height="28" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="759" y="179" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">of</text>
  <rect x="794" y="160" width="54" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="821" y="179" text-anchor="middle" font-size="12" fill="#6b7280">?</text>
  <path d="M 759 196 L 759 214 L 635 214 L 635 196" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar)"/>
  <text x="700" y="230" text-anchor="middle" font-size="11" fill="#047857">新块接回末尾，成为下一轮的输入</text>

  <!-- 箭头 -->
  <line x1="250" y1="163" x2="296" y2="163" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <text x="273" y="152" text-anchor="middle" font-size="11" fill="#4b5563">切块</text>
  <line x1="540" y1="163" x2="586" y2="163" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 底部：旋钮 -->
  <rect x="40" y="286" width="860" height="120" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="470" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">那一堆旋钮：决定"下一块该吐什么"</text>
  <text x="470" y="338" text-anchor="middle" font-size="12" fill="#6d28d9">训练前乱转（输出乱码）　→　训练中不断微调　→　训练后固定下来</text>
  <g>
    <circle cx="180" cy="372" r="16" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="180" y1="372" x2="192" y2="362" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="260" cy="372" r="16" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="260" y1="372" x2="248" y2="362" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="340" cy="372" r="16" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="340" y1="372" x2="352" y2="366" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="420" cy="372" r="16" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="420" y1="372" x2="408" y2="362" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="500" cy="372" r="16" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="500" y1="372" x2="512" y2="366" stroke="#8b5cf6" stroke-width="2"/>
    <text x="600" y="368" font-size="12" fill="#6d28d9">… 还有几十亿个</text>
    <text x="600" y="388" font-size="12" fill="#6d28d9">存的是"印象"，不是原文</text>
  </g>

  <text x="470" y="428" text-anchor="middle" font-size="11" fill="#9ca3af">本课三个零件：按块读 ｜ 一块一块吐 ｜ 旋钮里的印象</text>
</svg>
