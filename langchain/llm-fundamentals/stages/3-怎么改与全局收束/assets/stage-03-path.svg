  <rect x="70" y="86" width="200" height="72" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="170" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">课 8</text>
  <text x="170" y="134" text-anchor="middle" font-size="12" fill="#047857">Prompt / RAG / 微调</text>

  <rect x="330" y="86" width="200" height="72" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="430" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">课 9</text>
