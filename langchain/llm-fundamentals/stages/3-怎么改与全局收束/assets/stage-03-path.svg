  <text x="300" y="206" text-anchor="middle" font-size="12" fill="#1e40af">学完能回答：这个需求该 Prompt、RAG 还是微调？为什么不该用微调注入知识？</text>
  <text x="300" y="224" text-anchor="middle" font-size="12" fill="#1e40af">看到任一 LangChain 组件，能说出它在补哪个缺陷。</text>
