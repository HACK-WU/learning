<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">三条路改的东西根本不同，不是三选一</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#6b7280">Prompt 换输入 · RAG 换知识 · 微调换行为</text>

  <!-- Prompt -->
  <rect x="35" y="72" width="255" height="180" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="162" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">① Prompt</text>
  <text x="162" y="120" text-anchor="middle" font-size="11" fill="#3b82f6">不换模型，换输入</text>
  <line x1="60" y1="132" x2="265" y2="132" stroke="#bfdbfe" stroke-width="1"/>
  <text x="60" y="154" font-size="11" fill="#374151">成本：最低（只有 token）</text>
  <text x="60" y="174" font-size="11" fill="#374151">速度：最快（改完即生效）</text>
  <text x="60" y="194" font-size="11" fill="#374151">可更新：随时改</text>
  <text x="60" y="218" font-size="11" font-weight="700" fill="#1e40af">上限：教不会它不知道的</text>
  <text x="60" y="240" font-size="10" fill="#6b7280">实测：加格式约束 →</text>
  <text x="60" y="252" font-size="10" fill="#6b7280">严格三段式输出</text>

  <!-- RAG -->
  <rect x="322" y="72" width="255" height="180" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="449" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">② RAG</text>
  <text x="449" y="120" text-anchor="middle" font-size="11" fill="#059669">不换参数，换知识</text>
  <line x1="347" y1="132" x2="552" y2="132" stroke="#a7f3d0" stroke-width="1"/>
  <text x="347" y="154" font-size="11" fill="#374151">成本：中（每次多 token）</text>
  <text x="347" y="174" font-size="11" fill="#374151">速度：快（改文档即可）</text>
  <text x="347" y="194" font-size="11" fill="#374151">可更新：改文档 ✅</text>
  <text x="347" y="218" font-size="11" font-weight="700" fill="#047857">可溯源：能给出引用 ✅</text>
  <text x="347" y="240" font-size="10" fill="#6b7280">实测：无 RAG 拒答 →</text>
  <text x="347" y="252" font-size="10" fill="#6b7280">有 RAG 答对 + 算出 11 天</text>

  <!-- 微调 -->
  <rect x="609" y="72" width="255" height="180" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="736" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">③ 微调</text>
  <text x="736" y="120" text-anchor="middle" font-size="11" fill="#92400e">换参数，改行为</text>
  <line x1="634" y1="132" x2="839" y2="132" stroke="#fde68a" stroke-width="1"/>
  <text x="634" y="154" font-size="11" fill="#374151">成本：最高（需训练）</text>
  <text x="634" y="174" font-size="11" fill="#374151">速度：最慢</text>
  <text x="634" y="194" font-size="11" fill="#374151">可更新：要重新训练</text>
  <text x="634" y="218" font-size="11" font-weight="700" fill="#b45309">会改：格式 / 语气 / 风格</text>
  <text x="634" y="240" font-size="10" fill="#6b7280">⚠ 本课未实测（需 GPU）</text>
  <text x="634" y="252" font-size="10" fill="#6b7280">论述基于公开文献</text>

  <!-- 底部警示 -->
  <rect x="35" y="272" width="829" height="52" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="450" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">最常见误用：拿微调注入知识</text>
  <text x="450" y="316" text-anchor="middle" font-size="11" fill="#b91c1c">知识会变 → 微调改不动，且无法溯源 ｜ 正确做法：RAG</text>

  <!-- 选型顺序 -->
  <rect x="35" y="340" width="829" height="42" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="450" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">选型顺序：先 Prompt → 不够再加 RAG → 只剩格式/风格问题才上微调</text>
  <text x="450" y="376" text-anchor="middle" font-size="11" fill="#7c3aed">会变的东西走 RAG，不变的行为走微调</text>
</svg>
