<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">六条缺陷 × LangChain 组件 = 设计动机</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#6b7280">每个组件都不是凭空设计的，而是某一缺陷的解药</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="175" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">课 7：六条固有缺陷</text>
  <text x="640" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">LangChain 组件（解药）</text>

  <!-- 1 幻觉 -->
  <rect x="40" y="90" width="240" height="34" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="160" y="112" text-anchor="middle" font-size="11" fill="#991b1b">1 幻觉（采样 + 有损压缩）</text>
  <line x1="285" y1="107" x2="480" y2="107" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="490" y="90" width="300" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="640" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">课 11 Retrieval 与 RAG</text>

  <!-- 2 无状态 -->
  <rect x="40" y="132" width="240" height="34" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="160" y="154" text-anchor="middle" font-size="11" fill="#991b1b">2 无状态（上下文≠记忆）</text>
  <line x1="285" y1="149" x2="480" y2="149" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="490" y="132" width="300" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="640" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">课 7 Memory 记忆</text>

  <!-- 3 无工具 -->
  <rect x="40" y="174" width="240" height="34" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="160" y="196" text-anchor="middle" font-size="11" fill="#991b1b">3 无工具（参数是权重）</text>
  <line x1="285" y1="191" x2="480" y2="191" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="490" y="174" width="300" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="640" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">课 4 Tools 工具</text>

  <!-- 4 知识截止 -->
  <rect x="40" y="216" width="240" height="34" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="160" y="238" text-anchor="middle" font-size="11" fill="#991b1b">4 知识截止（语料有截点）</text>
  <line x1="285" y1="233" x2="480" y2="233" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="490" y="216" width="300" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="640" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">课 11 Retrieval 与 RAG</text>

  <!-- 5 无 grounding -->
  <rect x="40" y="258" width="240" height="34" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="160" y="280" text-anchor="middle" font-size="11" fill="#991b1b">5 无 grounding（不可核实）</text>
  <line x1="285" y1="275" x2="480" y2="275" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="490" y="258" width="300" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="640" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">课 10 人机协同与护栏</text>

  <!-- 6 不可靠 -->
  <rect x="40" y="300" width="240" height="34" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="160" y="322" text-anchor="middle" font-size="11" fill="#991b1b">6 不可靠（抽样非确定）</text>
  <line x1="285" y1="317" x2="480" y2="317" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="490" y="300" width="300" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="640" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">课 13 Testing 与 Observability</text>

  <!-- 系统级 -->
  <rect x="40" y="352" width="240" height="46" rx="7" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="160" y="371" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">系统级问题</text>
  <text x="160" y="388" text-anchor="middle" font-size="10" fill="#7c3aed">上下文膨胀 / 失控 / 太复杂</text>
  <line x1="285" y1="375" x2="480" y2="375" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="490" y="352" width="300" height="46" rx="7" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="640" y="371" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">课 9 上下文工程 · 课 8 中间件</text>
  <text x="640" y="388" text-anchor="middle" font-size="10" fill="#7c3aed">课 12 Multi-Agent</text>

  <rect x="40" y="410" width="820" height="26" rx="7" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="450" y="428" text-anchor="middle" font-size="11" fill="#6b7280">总纲：Agent = Model + Harness —— 模型只会"猜"（提出申请），harness 负责"做"（真实执行）</text>
</svg>
