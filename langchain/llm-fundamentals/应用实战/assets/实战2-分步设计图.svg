<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">从"拼完就发"到"发前先算账"</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#6b7280">左边黑盒，右边可观测 + 超预算自动截断</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 基础实现 -->
  <rect x="40" y="80" width="330" height="240" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <rect x="40" y="80" width="330" height="32" rx="10" fill="#9ca3af"/>
  <text x="205" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">基础实现：拼完直接发</text>

  <rect x="60" y="130" width="290" height="34" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="205" y="152" text-anchor="middle" font-size="12" fill="#374151">系统提示词 + 全部历史 + 新问题</text>

  <line x1="205" y1="164" x2="205" y2="190" stroke="#9ca3af" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="60" y="196" width="290" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="205" y="218" text-anchor="middle" font-size="12" fill="#991b1b">直接调 API</text>

  <text x="60" y="256" font-size="12" fill="#dc2626">✗ 花多少不清楚</text>
  <text x="60" y="278" font-size="12" fill="#dc2626">✗ 超窗口才报错</text>
  <text x="60" y="300" font-size="12" fill="#dc2626">✗ 第 10 轮成本是第 1 轮 10 倍</text>

  <!-- 箭头 -->
  <line x1="380" y1="200" x2="470" y2="200" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <text x="425" y="188" text-anchor="middle" font-size="11" fill="#4b5563">加一层</text>

  <!-- 综合实现 -->
  <rect x="480" y="80" width="380" height="240" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="480" y="80" width="380" height="32" rx="10" fill="#3b82f6"/>
  <text x="670" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">综合实现：发前先算账</text>

  <rect x="500" y="128" width="340" height="32" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="670" y="149" text-anchor="middle" font-size="12" fill="#374151">系统提示词 + 历史 + 新问题</text>

  <line x1="670" y1="160" x2="670" y2="180" stroke="#3b82f6" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="500" y="186" width="340" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="670" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">① 算账：含消息开销</text>
  <text x="670" y="215" text-anchor="middle" font-size="11" fill="#1e3a8a">留响应缓冲，不贴着上限走</text>

  <line x1="670" y1="222" x2="670" y2="240" stroke="#3b82f6" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="500" y="246" width="340" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="670" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">② 超预算 → 砍最老的历史</text>

  <line x1="670" y1="280" x2="670" y2="296" stroke="#3b82f6" stroke-width="2" marker-end="url(#ar)"/>

  <text x="500" y="314" font-size="12" fill="#059669">✓ 每笔成本实时可知</text>
  <text x="500" y="332" font-size="12" fill="#059669">✓ 超预算不失败，优雅降级</text>

  <text x="450" y="358" text-anchor="middle" font-size="11" fill="#6b7280">改动只在中间那一层：拼装与发送之间插一个预算闸门</text>
</svg>
