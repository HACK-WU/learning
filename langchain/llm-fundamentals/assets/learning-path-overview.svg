<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">大模型本质认知 · 学习路径</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#6b7280">从"它是什么"到"它缺什么"再到"LangChain 为什么那样设计"</text>

  <!-- 阶段 1 -->
  <rect x="40" y="92" width="240" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="40" y="92" width="240" height="32" rx="10" fill="#3b82f6"/>
  <text x="160" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">阶段 1 · 模型是怎么炼成的</text>
  <text x="160" y="146" text-anchor="middle" font-size="12" fill="#1e40af">它是怎么变成这样的</text>
  <text x="60" y="174" font-size="12" fill="#374151">课 1  环境准备</text>
  <text x="60" y="196" font-size="12" fill="#374151">课 2  猜下一个词的机器</text>
  <text x="60" y="218" font-size="12" fill="#374151">课 3  预训练给了它什么</text>
  <text x="60" y="240" font-size="12" fill="#374151">课 4  从续写机到助手</text>

  <!-- 阶段 2 -->
  <rect x="330" y="92" width="240" height="150" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="330" y="92" width="240" height="32" rx="10" fill="#8b5cf6"/>
  <text x="450" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">阶段 2 · 调用时发生了什么</text>
  <text x="450" y="146" text-anchor="middle" font-size="12" fill="#6d28d9">为什么它这样表现</text>
  <text x="350" y="174" font-size="12" fill="#374151">课 5  采样与非确定性</text>
  <text x="350" y="196" font-size="12" fill="#374151">课 6  注意力与上下文窗口</text>
  <text x="350" y="218" font-size="12" fill="#374151">课 7  六条固有缺陷</text>

  <!-- 阶段 3 -->
  <rect x="620" y="92" width="240" height="150" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="620" y="92" width="240" height="32" rx="10" fill="#10b981"/>
  <text x="740" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">阶段 3 · 怎么改与收束</text>
  <text x="740" y="146" text-anchor="middle" font-size="12" fill="#047857">所以 LangChain 为何那样设计</text>
  <text x="640" y="174" font-size="12" fill="#374151">课 8  Prompt / RAG / 微调</text>
  <text x="640" y="196" font-size="12" fill="#374151">课 9  缺陷 ↔ 组件映射总表</text>

  <!-- 箭头 -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>
  <line x1="280" y1="167" x2="326" y2="167" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="570" y1="167" x2="616" y2="167" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 收束回扣 -->
  <rect x="180" y="296" width="540" height="82" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">回扣 LangChain 主干（../langchain/）</text>
  <text x="450" y="346" text-anchor="middle" font-size="12" fill="#78350f">课 2→Models ｜课 3→RAG ｜课 4→护栏 ｜课 5→参数与测试</text>
  <text x="450" y="366" text-anchor="middle" font-size="12" fill="#78350f">课 6→上下文工程 ｜课 7→工具与记忆 ｜课 8→选型 ｜课 9→全课程</text>

  <line x1="740" y1="242" x2="740" y2="292" stroke="#f59e0b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="450" y1="292" x2="450" y2="242" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="452" y="270" font-size="11" fill="#b45309">缺陷清单驱动</text>
</svg>
