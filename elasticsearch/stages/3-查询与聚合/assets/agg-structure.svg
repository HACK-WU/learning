<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">聚合的两大类：桶（分组）与指标（计算）</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b">24 条订单实测 · 索引 l8_orders_v2</text>

  <rect x="60" y="85" width="340" height="205" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">桶聚合 Bucket</text>
  <text x="230" y="133" text-anchor="middle" font-size="12.5" fill="#475569">「按什么分组」→ 产出一组组的桶</text>
  <text x="82" y="158" font-size="13" fill="#1e293b">terms</text><text x="150" y="158" font-size="12.5" fill="#475569">按字段值分组（品牌/城市）</text>
  <text x="82" y="180" font-size="13" fill="#1e293b">date_histogram</text><text x="196" y="180" font-size="12.5" fill="#475569">按时间间隔分组（按周）</text>
  <text x="82" y="202" font-size="13" fill="#1e293b">range</text><text x="150" y="202" font-size="12.5" fill="#475569">按数值区间分组（价格段）</text>
  <text x="82" y="224" font-size="13" fill="#1e293b">filter / filters</text><text x="192" y="224" font-size="12.5" fill="#475569">按条件筛选后分组</text>
  <text x="82" y="246" font-size="13" fill="#1e293b">nested / reverse</text><text x="200" y="246" font-size="12.5" fill="#475569">嵌套文档分组</text>
  <rect x="82" y="258" width="296" height="22" rx="4" fill="#dbeafe"/>
  <text x="230" y="273" text-anchor="middle" font-size="12" fill="#1e40af">每个桶带 doc_count（该组有多少条）</text>

  <rect x="500" y="85" width="340" height="205" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="670" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">指标聚合 Metric</text>
  <text x="670" y="133" text-anchor="middle" font-size="12.5" fill="#475569">「算什么数」→ 产出一个数值</text>
  <text x="522" y="158" font-size="13" fill="#1e293b">sum / avg</text><text x="600" y="158" font-size="12.5" fill="#475569">求和 / 平均</text>
  <text x="522" y="180" font-size="13" fill="#1e293b">min / max</text><text x="600" y="180" font-size="12.5" fill="#475569">最小 / 最大</text>
  <text x="522" y="202" font-size="13" fill="#1e293b">value_count</text><text x="620" y="202" font-size="12.5" fill="#475569">非空值计数</text>
  <text x="522" y="224" font-size="13" fill="#1e293b">cardinality</text><text x="616" y="224" font-size="12.5" fill="#475569">去重计数（近似）</text>
  <text x="522" y="246" font-size="13" fill="#1e293b">stats / percentiles</text><text x="654" y="246" font-size="12.5" fill="#475569">一次返回多个 / 分位数</text>
  <rect x="522" y="258" width="296" height="22" rx="4" fill="#dcfce7"/>
  <text x="670" y="273" text-anchor="middle" font-size="12" fill="#166534">输出一个数字，没有 doc_count</text>

  <path d="M230 290 L230 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M670 290 L670 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="332" width="500" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">实际用法：桶里套指标（子聚合）</text>
  <text x="450" y="371" text-anchor="middle" font-size="12.5" fill="#78350f">按品牌分桶 → 每桶再算 sum(销售额)、avg(单价)</text>

  <path d="M450 378 L450 412" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="414" width="680" height="46" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="450" y="434" text-anchor="middle" font-size="14" font-weight="bold" fill="#7e22ce">管道聚合 Pipeline：对「聚合的结果」再聚合</text>
  <text x="450" y="453" text-anchor="middle" font-size="12.5" fill="#581c87">max_bucket / cumulative_sum / bucket_script（用 buckets_path 引用兄弟指标）</text>

  <rect x="60" y="482" width="780" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="506" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">实测结果（24 条订单，3 个品牌）</text>
  <text x="90" y="530" font-size="12.5" fill="#334155">桶聚合 terms(brand)</text>
  <text x="560" y="530" font-size="12.5" fill="#334155">→  苹果 8 单   华为 8 单   小米 8 单</text>
  <text x="90" y="552" font-size="12.5" fill="#334155">+ 指标 sum(amount)</text>
  <text x="560" y="552" font-size="12.5" fill="#334155">→  苹果 80390   华为 64179   小米 45488</text>
  <text x="90" y="574" font-size="12.5" fill="#334155">+ 管道 max_bucket</text>
  <text x="560" y="574" font-size="12.5" fill="#334155">→  销售额最高品牌 = 苹果（80390）</text>
  <text x="90" y="594" font-size="12.5" fill="#334155">占比校验</text>
  <text x="560" y="594" font-size="12.5" fill="#334155">→  42.3% + 33.8% + 23.9% = 100%</text>
</svg>
