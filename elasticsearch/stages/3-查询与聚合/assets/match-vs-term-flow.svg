<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="880" height="560" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">match 会分词，term 不分词：同一句查询，两条完全不同的路</text>
  <text x="440" y="51" text-anchor="middle" font-size="12.5" fill="#64748b">数据来自本课实测：索引 l6_shop 的 name 字段（ik_max_word 索引 / ik_smart 搜索），查询词「苹果手机」</text>

  <!-- 查询输入 -->
  <rect x="330" y="66" width="220" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="440" y="84" text-anchor="middle" font-size="11.5" fill="#64748b">你的查询输入</text>
  <text x="440" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">"苹果手机"</text>

  <path d="M 380 108 L 220 145" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M 500 108 L 660 145" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <polygon points="0,0 9,4.5 0,9" fill="#64748b"/></marker></defs>

  <!-- 左：match -->
  <rect x="24" y="150" width="410" height="330" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="40" y="173" font-size="14.5" font-weight="700" fill="#1d4ed8">match：先分词，再逐个去倒排索引里查</text>

  <rect x="40" y="184" width="378" height="60" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="52" y="202" font-size="11" fill="#64748b">第①步 用 ik_smart 把查询词切开（实测）</text>
  <text x="52" y="223" font-size="13.5" font-weight="700" fill="#0f172a">"苹果手机" → 苹果 | 手机</text>
  <text x="52" y="238" font-size="10.5" fill="#64748b">切成 2 个词项，再去索引里分别找</text>

  <rect x="40" y="252" width="378" height="74" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="52" y="270" font-size="11" fill="#64748b">第②步 每个词去倒排索引查，文档取并集</text>
  <text x="52" y="289" font-size="11.5" fill="#334155">苹果 → doc1, doc4, doc7（3 条）</text>
  <text x="52" y="307" font-size="11.5" fill="#334155">手机 → doc1, doc2, doc3, doc8（4 条）</text>
  <text x="52" y="321" font-size="10.5" fill="#64748b">默认 operator=or：取并集 = 6 条（doc1 重复只算一次）</text>

  <text x="40" y="350" font-size="12.5" font-weight="700" fill="#15803d">实测结果：命中 6 条，且按相关性排序</text>
  <text x="40" y="370" font-size="11.5" fill="#334155">1.7156  苹果 iPhone 15 Pro 手机　← 两个词都命中</text>
  <text x="40" y="388" font-size="11.5" fill="#334155">1.0710  苹果 AirPods Pro 耳机</text>
  <text x="40" y="406" font-size="11.5" fill="#334155">0.8567  小米 14 手机</text>
  <text x="40" y="424" font-size="11.5" fill="#94a3b8">0.8054  苹果 MacBook Pro 笔记本电脑</text>
  <text x="40" y="442" font-size="11.5" fill="#94a3b8">0.7262  华为 Mate 60 Pro 手机</text>
  <text x="40" y="460" font-size="11.5" fill="#94a3b8">0.6747  小米 红米 Note 13 手机</text>

  <text x="40" y="484" font-size="11" fill="#1d4ed8">两个词都命中的排第一：0.9894 + 0.7262 = 1.7156（实测两词分数之和）</text>

  <!-- 右：term -->
  <rect x="446" y="150" width="410" height="330" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.4"/>
  <text x="462" y="173" font-size="14.5" font-weight="700" fill="#b91c1c">term：不分词，拿原句去倒排索引里精确比对</text>

  <rect x="462" y="184" width="378" height="60" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="474" y="202" font-size="11" fill="#64748b">跳过分词，直接拿整个字符串去比对</text>
  <text x="474" y="223" font-size="13.5" font-weight="700" fill="#0f172a">"苹果手机" → 苹果手机（1 个整体）</text>
  <text x="474" y="238" font-size="10.5" fill="#64748b">索引里必须有「苹果手机」这个词项才算命中</text>

  <rect x="462" y="252" width="378" height="74" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="474" y="270" font-size="11" fill="#64748b">倒排索引里 name 字段实际存的词项</text>
  <text x="474" y="289" font-size="11.5" fill="#334155">苹果、手机、iPhone、15、Pro、华为、</text>
  <text x="474" y="307" font-size="11.5" fill="#334155">Mate、60、小米、14…（都是切好的词）</text>
  <text x="474" y="321" font-size="10.5" fill="#b91c1c">没有「苹果手机」这个整体词项 ❌</text>

  <text x="462" y="350" font-size="12.5" font-weight="700" fill="#b91c1c">实测结果：命中 0 条</text>
  <text x="462" y="374" font-size="11.5" fill="#334155">查 name（text）→ 0 条</text>
  <text x="462" y="392" font-size="11.5" fill="#334155">查 name 的单词「苹果」→ 3 条 ✅</text>
  <text x="462" y="410" font-size="11.5" fill="#334155">查 name.raw（keyword）整句 → 1 条 ✅</text>
  <text x="462" y="428" font-size="11.5" fill="#334155">查 brand（keyword）"Apple" → 3 条 ✅</text>
  <text x="462" y="446" font-size="11.5" fill="#b45309">查 brand "apple" 小写 → 0 条 ❌</text>
  <text x="462" y="464" font-size="10.5" fill="#64748b">keyword 不分词也不归一化，大小写敏感</text>
  <text x="462" y="484" font-size="11" fill="#b91c1c">term 查 text 字段几乎总是 0 条——新手第一坑</text>

  <!-- 底部结论 -->
  <rect x="24" y="494" width="832" height="54" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="40" y="514" font-size="12.5" font-weight="700" fill="#b45309">选型口诀</text>
  <text x="40" y="534" font-size="11.5" fill="#334155">搜 text 字段 → 用 match（让它分词）　｜　搜 keyword 字段 / 精确值 → 用 term（别让它分词）　｜　要精确筛选用 filter，别用 must 打分</text>
</svg>
