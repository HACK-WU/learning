<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" font-family="'PingFang SC','Microsoft YaHei',-apple-system,sans-serif">
  <rect width="1200" height="1180" fill="#ffffff"/>

  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a2e">课 11 · 数据管道与备份</text>
  <text x="600" y="70" text-anchor="middle" font-size="15" fill="#5a6472">Ingest Pipeline ｜ Reindex 与 Update By Query ｜ 快照与恢复</text>
  <line x1="80" y1="86" x2="1120" y2="86" stroke="#d8dee9" stroke-width="1.5"/>

  <!-- ===== Panel 1: Ingest Pipeline ===== -->
  <rect x="60" y="108" width="1080" height="290" rx="12" fill="#f7fbfd" stroke="#b8d4e8" stroke-width="1.5"/>
  <text x="84" y="138" font-size="19" font-weight="700" fill="#1668a8">① Ingest Pipeline — 写入前的加工车间</text>
  <text x="84" y="160" font-size="13" fill="#5a6472">文档写入索引前，先过一串 processor；改的是 _source 本身，不只是索引</text>

  <rect x="90" y="180" width="130" height="60" rx="8" fill="#fff8e6" stroke="#e0b84c" stroke-width="1.5"/>
  <text x="155" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#8a6410">原始文档</text>
  <text x="155" y="226" text-anchor="middle" font-size="11" fill="#8a6410">brand: apple</text>
  <text x="155" y="242" text-anchor="middle" font-size="11" fill="#8a6410">price_str: "8999"</text>

  <path d="M228 210 L268 210" stroke="#8aa4b8" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="276" y="180" width="118" height="60" rx="8" fill="#e8f4ff" stroke="#4a90c2" stroke-width="1.5"/>
  <text x="335" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1668a8">set</text>
  <text x="335" y="220" text-anchor="middle" font-size="10.5" fill="#4a7089">加时间戳</text>
  <text x="335" y="234" text-anchor="middle" font-size="10.5" fill="#4a7089">打默认值</text>

  <path d="M402 210 L432 210" stroke="#8aa4b8" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="440" y="180" width="118" height="60" rx="8" fill="#e8f4ff" stroke="#4a90c2" stroke-width="1.5"/>
  <text x="499" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1668a8">uppercase</text>
  <text x="499" y="220" text-anchor="middle" font-size="10.5" fill="#4a7089">apple</text>
  <text x="499" y="234" text-anchor="middle" font-size="10.5" fill="#4a7089">→ APPLE</text>

  <path d="M566 210 L596 210" stroke="#8aa4b8" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="604" y="180" width="118" height="60" rx="8" fill="#e8f4ff" stroke="#4a90c2" stroke-width="1.5"/>
  <text x="663" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1668a8">convert</text>
  <text x="663" y="220" text-anchor="middle" font-size="10.5" fill="#4a7089">"8999" 字符串</text>
  <text x="663" y="234" text-anchor="middle" font-size="10.5" fill="#4a7089">→ 8999 数字</text>

  <path d="M730 210 L760 210" stroke="#8aa4b8" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="768" y="180" width="118" height="60" rx="8" fill="#e8f4ff" stroke="#4a90c2" stroke-width="1.5"/>
  <text x="827" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1668a8">script</text>
  <text x="827" y="220" text-anchor="middle" font-size="10.5" fill="#4a7089">按价格打标</text>
  <text x="827" y="234" text-anchor="middle" font-size="10.5" fill="#4a7089">high / low</text>

  <path d="M894 210 L924 210" stroke="#8aa4b8" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="932" y="180" width="180" height="60" rx="8" fill="#e6f7ee" stroke="#3fa66a" stroke-width="1.5"/>
  <text x="1022" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1f7a4a">落盘后的 _source</text>
  <text x="1022" y="220" text-anchor="middle" font-size="10.5" fill="#2d8a58">brand: APPLE</text>
  <text x="1022" y="234" text-anchor="middle" font-size="10.5" fill="#2d8a58">price: 8999（price_str 已删除）</text>

  <!-- on_failure branch -->
  <path d="M663 248 L663 276 L420 276 L420 300" stroke="#d98d3f" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>
  <rect x="240" y="300" width="360" height="66" rx="8" fill="#fff2e6" stroke="#d98d3f" stroke-width="1.5"/>
  <text x="256" y="322" font-size="13" font-weight="600" fill="#9c5a12">on_failure：给脏数据留活路</text>
  <text x="256" y="341" font-size="11" fill="#7a4a12">grok 解析失败 → 自动改路由到死信索引 failed-logs</text>
  <text x="256" y="357" font-size="11" fill="#7a4a12">原文保留 + 写 grok_error 字段，不拖累整批写入</text>

  <!-- warning box -->
  <rect x="640" y="300" width="472" height="66" rx="8" fill="#fdeaea" stroke="#d15c5c" stroke-width="1.5"/>
  <text x="656" y="322" font-size="13" font-weight="600" fill="#a02c2c">⚠ 实测坑：_update_by_query 会重跑 default_pipeline</text>
  <text x="656" y="341" font-size="11" fill="#8a2828">price_str 早被 remove 掉 → 重跑时报 field not present</text>
  <text x="656" y="357" font-size="11" fill="#8a2828">total: 2, updated: 0 ／ 加 ?pipeline=_none 后 updated: 2</text>

  <!-- ===== Panel 2: Reindex ===== -->
  <rect x="60" y="418" width="530" height="240" rx="12" fill="#fbf7fd" stroke="#c9b3dd" stroke-width="1.5"/>
  <text x="84" y="448" font-size="19" font-weight="700" fill="#7a3fa8">② Reindex — 分片数不可改的唯一解</text>
  <text x="84" y="470" font-size="13" fill="#5a6472">课 9 埋的坑，本课兑现</text>

  <rect x="90" y="490" width="180" height="70" rx="8" fill="#ffffff" stroke="#c9b3dd" stroke-width="1.5"/>
  <text x="180" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#5c2d80">l11_shop（源）</text>
  <text x="180" y="532" text-anchor="middle" font-size="11" fill="#6a4a80">1 主分片 ／ 0 副本</text>
  <text x="180" y="550" text-anchor="middle" font-size="11" fill="#6a4a80">3 条文档</text>

  <path d="M278 525 L338 525" stroke="#a884c4" stroke-width="2.5" marker-end="url(#arwP)"/>
  <text x="308" y="515" text-anchor="middle" font-size="11" fill="#7a3fa8">_reindex</text>

  <rect x="346" y="490" width="220" height="70" rx="8" fill="#ffffff" stroke="#7a3fa8" stroke-width="1.5"/>
  <text x="456" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#5c2d80">l11_shop_v2（目标）</text>
  <text x="456" y="532" text-anchor="middle" font-size="11" fill="#6a4a80">3 主分片 ／ 1 副本  ← 已改变</text>
  <text x="456" y="550" text-anchor="middle" font-size="11" fill="#6a4a80">3 条文档（含 migrated_from 标记）</text>

  <!-- steps -->
  <rect x="90" y="578" width="476" height="62" rx="8" fill="#f5eef9" stroke="#d9c6e8" stroke-width="1"/>
  <text x="106" y="598" font-size="12" font-weight="600" fill="#5c2d80">生产三步走（零停机）：</text>
  <text x="106" y="617" font-size="11" fill="#6a4a80">① 建新索引（mapping 需自己先建好，reindex 不搬 mapping）</text>
  <text x="106" y="633" font-size="11" fill="#6a4a80">② _reindex 搬运　③ _aliases 原子切换别名，应用无感知</text>

  <!-- ===== Panel 3: Snapshot ===== -->
  <rect x="610" y="418" width="530" height="240" rx="12" fill="#f4faf6" stroke="#a8d5ba" stroke-width="1.5"/>
  <text x="634" y="448" font-size="19" font-weight="700" fill="#1f7a4a">③ 快照与恢复 — 唯一不丢数据的退路</text>
  <text x="634" y="470" font-size="13" fill="#5a6472">副本防硬件故障，快照防人为删除</text>

  <rect x="640" y="490" width="150" height="56" rx="8" fill="#ffffff" stroke="#a8d5ba" stroke-width="1.5"/>
  <text x="715" y="512" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f7a4a">注册仓库</text>
  <text x="715" y="530" text-anchor="middle" font-size="10.5" fill="#3d8a5e">PUT /_snapshot/l11_repo</text>

  <path d="M798 518 L828 518" stroke="#5cae82" stroke-width="2" marker-end="url(#arwG)"/>

  <rect x="836" y="490" width="130" height="56" rx="8" fill="#ffffff" stroke="#a8d5ba" stroke-width="1.5"/>
  <text x="901" y="512" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f7a4a">建快照</text>
  <text x="901" y="530" text-anchor="middle" font-size="10.5" fill="#3d8a5e">snap_1 · 6 分片成功</text>

  <path d="M974 518 L1004 518" stroke="#5cae82" stroke-width="2" marker-end="url(#arwG)"/>

  <rect x="1012" y="490" width="104" height="56" rx="8" fill="#ffffff" stroke="#a8d5ba" stroke-width="1.5"/>
  <text x="1064" y="512" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f7a4a">恢复</text>
  <text x="1064" y="530" text-anchor="middle" font-size="10.5" fill="#3d8a5e">数据+配置原样</text>

  <!-- incremental evidence -->
  <rect x="640" y="562" width="476" height="78" rx="8" fill="#e9f7ef" stroke="#5cae82" stroke-width="1.5"/>
  <text x="656" y="583" font-size="12.5" font-weight="600" fill="#1f7a4a">增量机制实测：删掉旧快照，新快照照样完整</text>
  <text x="656" y="602" font-size="11" fill="#2d8a58">仓库 106.7 KB → 删 snap_1 → 83.3 KB（仅释放 23.4 KB，说明段文件被复用）</text>
  <text x="656" y="619" font-size="11" fill="#2d8a58">再从 snap_4 恢复 → 24 条完整。每个快照逻辑完整，物理共享不变段</text>
  <text x="656" y="634" font-size="11" fill="#2d8a58">SLM 自动命名：l11-daily-snap-2026.08.31-&lt;随机串&gt;</text>

  <!-- ===== Panel 4: Cross-cluster ===== -->
  <rect x="60" y="678" width="1080" height="230" rx="12" fill="#fffaf2" stroke="#e8c48a" stroke-width="1.5"/>
  <text x="84" y="708" font-size="19" font-weight="700" fill="#9c6a12">④ 跨集群恢复 — 课 10 悬念的答案</text>
  <text x="84" y="730" font-size="13" fill="#5a6472">问题：机器全烧了，备份还在吗？　答案：取决于快照存在哪</text>

  <!-- wrong way -->
  <rect x="90" y="748" width="500" height="140" rx="10" fill="#fdeaea" stroke="#d15c5c" stroke-width="1.5"/>
  <text x="110" y="772" font-size="14" font-weight="700" fill="#a02c2c">✗ 快照放在集群本机 = 等于没备份</text>
  <circle cx="150" cy="812" r="26" fill="#fff" stroke="#d15c5c" stroke-width="1.5"/>
  <text x="150" y="809" text-anchor="middle" font-size="10.5" fill="#a02c2c">D 盘</text>
  <text x="150" y="823" text-anchor="middle" font-size="9.5" fill="#a02c2c">同一块</text>
  <rect x="196" y="792" width="150" height="38" rx="6" fill="#fff" stroke="#d15c5c" stroke-width="1.2"/>
  <text x="271" y="808" text-anchor="middle" font-size="11" fill="#a02c2c">集群数据</text>
  <text x="271" y="822" text-anchor="middle" font-size="10" fill="#c07070">node-X/data</text>
  <rect x="368" y="792" width="196" height="38" rx="6" fill="#fff" stroke="#d15c5c" stroke-width="1.2"/>
  <text x="466" y="808" text-anchor="middle" font-size="11" fill="#a02c2c">快照 l11_backup</text>
  <text x="466" y="822" text-anchor="middle" font-size="10" fill="#c07070">snapshots/l11_backup</text>
  <path d="M346 811 L362 811" stroke="#d15c5c" stroke-width="2"/>
  <text x="110" y="856" font-size="11.5" fill="#8a2828">盘一坏 → 数据和备份一起没</text>
  <text x="110" y="874" font-size="11.5" fill="#8a2828">fs 类型仓库的 location 必须落在 path.repo 之内</text>

  <!-- right way -->
  <rect x="610" y="748" width="500" height="140" rx="10" fill="#e9f7ef" stroke="#3fa66a" stroke-width="1.5"/>
  <text x="630" y="772" font-size="14" font-weight="700" fill="#1f7a4a">✓ 快照放在集群之外 → 整机烧毁也能恢复</text>

  <rect x="640" y="788" width="130" height="46" rx="6" fill="#fff" stroke="#3fa66a" stroke-width="1.2"/>
  <text x="705" y="806" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f7a4a">集群 A（源）</text>
  <text x="705" y="822" text-anchor="middle" font-size="10" fill="#2d8a58">localhost:9201</text>

  <path d="M778 811 L828 811" stroke="#3fa66a" stroke-width="2" marker-end="url(#arwG)"/>
  <text x="803" y="802" text-anchor="middle" font-size="9.5" fill="#1f7a4a">快照</text>

  <rect x="836" y="782" width="120" height="58" rx="8" fill="#e6f7ee" stroke="#3fa66a" stroke-width="1.5"/>
  <text x="896" y="802" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f7a4a">集群外存储</text>
  <text x="896" y="818" text-anchor="middle" font-size="9.5" fill="#2d8a58">S3 / GCS / Azure</text>
  <text x="896" y="832" text-anchor="middle" font-size="9.5" fill="#2d8a58">或独立 NAS</text>

  <path d="M964 811 L1014 811" stroke="#3fa66a" stroke-width="2" marker-end="url(#arwG)"/>
  <text x="989" y="802" text-anchor="middle" font-size="9.5" fill="#1f7a4a">恢复</text>

  <rect x="1022" y="788" width="72" height="46" rx="6" fill="#fff" stroke="#3fa66a" stroke-width="1.2"/>
  <text x="1058" y="806" text-anchor="middle" font-size="11" font-weight="600" fill="#1f7a4a">集群 B</text>
  <text x="1058" y="822" text-anchor="middle" font-size="10" fill="#2d8a58">9200</text>

  <text x="630" y="856" font-size="11.5" fill="#1f7a4a">实测：9201 的 snap_4 → 恢复到 9200，24 条、连 _id 都原样</text>
  <text x="630" y="874" font-size="11.5" fill="#1f7a4a">rename_pattern 恢复到新索引名，不覆盖现有数据</text>

  <!-- ===== Bottom: three takeaways ===== -->
  <rect x="60" y="928" width="1080" height="200" rx="12" fill="#f2f5f9" stroke="#a8b8c8" stroke-width="1.5"/>
  <text x="84" y="956" font-size="18" font-weight="700" fill="#2c3e50">三条原理句</text>

  <rect x="90" y="972" width="340" height="132" rx="8" fill="#ffffff" stroke="#c0ccd8" stroke-width="1.2"/>
  <text x="108" y="996" font-size="13" font-weight="700" fill="#1668a8">① Pipeline 改的是 _source 本身</text>
  <text x="108" y="1018" font-size="11" fill="#4a5a6a">不只是"给索引加字段"。</text>
  <text x="108" y="1035" font-size="11" fill="#4a5a6a">存进去什么，取出来就是什么。</text>
  <text x="108" y="1058" font-size="11" fill="#8a2828">坑：update_by_query 重跑 pipeline</text>
  <text x="108" y="1075" font-size="11" fill="#8a2828">会读到已被 remove 的字段</text>
  <text x="108" y="1092" font-size="11" fill="#4a5a6a">解法：?pipeline=_none</text>

  <rect x="450" y="972" width="340" height="132" rx="8" fill="#ffffff" stroke="#c0ccd8" stroke-width="1.2"/>
  <text x="468" y="996" font-size="13" font-weight="700" fill="#7a3fa8">② Reindex 只搬文档，不搬 mapping</text>
  <text x="468" y="1018" font-size="11" fill="#4a5a6a">目标索引的映射要自己先建好。</text>
  <text x="468" y="1035" font-size="11" fill="#4a5a6a">这是改分片数的唯一途径。</text>
  <text x="468" y="1058" font-size="11" fill="#4a5a6a">生产用别名做零停机切换：</text>
  <text x="468" y="1075" font-size="11" fill="#4a5a6a">_aliases 原子 remove + add</text>
  <text x="468" y="1092" font-size="11" fill="#4a5a6a">应用代码全程不用改</text>

  <rect x="810" y="972" width="310" height="132" rx="8" fill="#ffffff" stroke="#c0ccd8" stroke-width="1.2"/>
  <text x="828" y="996" font-size="13" font-weight="700" fill="#1f7a4a">③ 快照必须存在集群之外</text>
  <text x="828" y="1018" font-size="11" fill="#4a5a6a">副本防的是硬件故障，</text>
  <text x="828" y="1035" font-size="11" fill="#4a5a6a">快照防的是人为删除。</text>
  <text x="828" y="1058" font-size="11" fill="#8a2828">放在同一块盘 = 没备份</text>
  <text x="828" y="1075" font-size="11" fill="#4a5a6a">SLM 自动定时 + 自动清理，</text>
  <text x="828" y="1092" font-size="11" fill="#4a5a6a">min_count 保证不会全被删</text>

  <text x="600" y="1156" text-anchor="middle" font-size="11.5" fill="#7a8695">本机 ES 9.5.1 实测 · 阶段 4《分布式与工程实践》课 11 · 全部数据来自真实执行输出</text>

  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8aa4b8"/>
    </marker>
    <marker id="arwG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5cae82"/>
    </marker>
    <marker id="arwP" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a884c4"/>
    </marker>
  </defs>
</svg>
