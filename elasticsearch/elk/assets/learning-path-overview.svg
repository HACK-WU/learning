<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1060" height="660" fill="#ffffff"/>

  <text x="530" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#333333">ELK 系统学习 · 四阶段学习路径</text>
  <text x="530" y="76" text-anchor="middle" font-size="15" fill="#5f6368">主角是一条日志 —— 从应用 stdout 一路走到 Kibana 告警（Elastic Stack 9.5.3 / Docker Compose）</text>

  <!-- 故事四幕标签 -->
  <g font-size="13">
    <rect x="30" y="104" width="230" height="26" rx="4" fill="#e3f2fd"/>
    <text x="145" y="122" text-anchor="middle" font-weight="700" fill="#1565C0">第 1 幕 · 看得见全貌</text>
    <rect x="285" y="104" width="230" height="26" rx="4" fill="#e3f2fd"/>
    <text x="400" y="122" text-anchor="middle" font-weight="700" fill="#1565C0">第 2 幕 · 拿得到</text>
    <rect x="540" y="104" width="230" height="26" rx="4" fill="#e3f2fd"/>
    <text x="655" y="122" text-anchor="middle" font-weight="700" fill="#1565C0">第 3 幕 · 看得懂</text>
    <rect x="795" y="104" width="230" height="26" rx="4" fill="#e3f2fd"/>
    <text x="910" y="122" text-anchor="middle" font-weight="700" fill="#1565C0">第 4 幕 · 留得住、用得上</text>
  </g>

  <!-- 箭头：阶段1 -> 阶段2 -> 阶段3 -> 阶段4 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b0bec5"/>
    </marker>
  </defs>
  <line x1="262" y1="300" x2="282" y2="300" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="517" y1="300" x2="537" y2="300" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="772" y1="300" x2="792" y2="300" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段 1 卡片 -->
  <g>
    <rect x="30" y="140" width="230" height="330" rx="8" fill="#fafafa" stroke="#d0d7de" stroke-width="1.5"/>
    <circle cx="56" cy="168" r="15" fill="#1565C0"/>
    <text x="56" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
    <text x="80" y="174" font-size="17" font-weight="700" fill="#333333">全景与起步</text>
    <text x="46" y="200" font-size="12.5" fill="#5f6368">课 1-3 · 9 个知识点</text>
    <line x1="46" y1="212" x2="244" y2="212" stroke="#e0e0e0" stroke-width="1"/>

    <text x="46" y="238" font-size="13.5" font-weight="600" fill="#333333">课 1 一条日志的旅程</text>
    <text x="46" y="258" font-size="12" fill="#5f6368">日志为什么难查 / 四组件 / 起源</text>
    <text x="46" y="286" font-size="13.5" font-weight="600" fill="#333333">课 2 把 ELK 跑起来</text>
    <text x="46" y="306" font-size="12" fill="#5f6368">Compose 编排 / 安全配置 / 重建</text>
    <text x="46" y="334" font-size="13.5" font-weight="600" fill="#333333">课 3 端到端走一遍</text>
    <text x="46" y="354" font-size="12" fill="#5f6368">跑通链路 / 一条数据 / 组件契约</text>

    <rect x="46" y="378" width="198" height="72" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="58" y="398" font-size="12" font-weight="700" fill="#1565C0">学完能回答</text>
    <text x="58" y="417" font-size="11.5" fill="#5f6368">这套东西由什么组成？</text>
    <text x="58" y="433" font-size="11.5" fill="#5f6368">怎么先让它跑起来、亲眼</text>
    <text x="58" y="445" font-size="11.5" fill="#5f6368">看见数据流过去？</text>
  </g>

  <!-- 阶段 2 卡片 -->
  <g>
    <rect x="285" y="140" width="230" height="330" rx="8" fill="#fafafa" stroke="#d0d7de" stroke-width="1.5"/>
    <circle cx="311" cy="168" r="15" fill="#1565C0"/>
    <text x="311" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <text x="335" y="174" font-size="17" font-weight="700" fill="#333333">采集层 Beats</text>
    <text x="301" y="200" font-size="12.5" fill="#5f6368">课 4-6 · 9 个知识点</text>
    <line x1="301" y1="212" x2="499" y2="212" stroke="#e0e0e0" stroke-width="1"/>

    <text x="301" y="238" font-size="13.5" font-weight="600" fill="#333333">课 4 Filebeat 把文件读进来</text>
    <text x="301" y="258" font-size="12" fill="#5f6368">harvester / registry / 多行合并</text>
    <text x="301" y="286" font-size="13.5" font-weight="600" fill="#333333">课 5 模块与处理器</text>
    <text x="301" y="306" font-size="12" fill="#5f6368">modules / processors / 输出与背压</text>
    <text x="301" y="334" font-size="13.5" font-weight="600" fill="#333333">课 6 家族与采集选型</text>
    <text x="301" y="354" font-size="12" fill="#5f6368">Beat 家族 / 选型对比 / 何时不用</text>

    <rect x="301" y="378" width="198" height="72" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="313" y="398" font-size="12" font-weight="700" fill="#1565C0">学完能回答</text>
    <text x="313" y="417" font-size="11.5" fill="#5f6368">日志凭什么自动不丢地搬进来？</text>
    <text x="313" y="433" font-size="11.5" fill="#5f6368">堆栈为什么被切碎？</text>
    <text x="313" y="445" font-size="11.5" fill="#5f6368">采集端该选谁？</text>
  </g>

  <!-- 阶段 3 卡片 -->
  <g>
    <rect x="540" y="140" width="230" height="330" rx="8" fill="#fafafa" stroke="#d0d7de" stroke-width="1.5"/>
    <circle cx="566" cy="168" r="15" fill="#1565C0"/>
    <text x="566" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <text x="590" y="174" font-size="17" font-weight="700" fill="#333333">处理层 Logstash</text>
    <text x="556" y="200" font-size="12.5" fill="#5f6368">课 7-9 · 9 个知识点</text>
    <line x1="556" y1="212" x2="754" y2="212" stroke="#e0e0e0" stroke-width="1"/>

    <text x="556" y="238" font-size="13.5" font-weight="600" fill="#333333">课 7 管道三件套</text>
    <text x="556" y="258" font-size="12" fill="#5f6368">input-filter-output / grok / date</text>
    <text x="556" y="286" font-size="13.5" font-weight="600" fill="#333333">课 8 可靠性与吞吐</text>
    <text x="556" y="306" font-size="12" fill="#5f6368">持久化队列 / 背压调优 / 多管道</text>
    <text x="556" y="334" font-size="13.5" font-weight="600" fill="#333333">课 9 该在哪处理</text>
    <text x="556" y="354" font-size="12" fill="#5f6368">Ingest 配法 / 位置之争 / ECS 脱敏</text>

    <rect x="556" y="378" width="198" height="72" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="568" y="398" font-size="12" font-weight="700" fill="#1565C0">学完能回答</text>
    <text x="568" y="417" font-size="11.5" fill="#5f6368">原始文本怎么变结构化字段？</text>
    <text x="568" y="433" font-size="11.5" fill="#5f6368">丢了怎么办？</text>
    <text x="568" y="445" font-size="11.5" fill="#5f6368">解析该放在哪一层做？</text>
  </g>

  <!-- 阶段 4 卡片 -->
  <g>
    <rect x="795" y="140" width="230" height="330" rx="8" fill="#fafafa" stroke="#d0d7de" stroke-width="1.5"/>
    <circle cx="821" cy="168" r="15" fill="#1565C0"/>
    <text x="821" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
    <text x="845" y="174" font-size="17" font-weight="700" fill="#333333">存储可视化与落地</text>
    <text x="811" y="200" font-size="12.5" fill="#5f6368">课 10-12 · 9 个知识点</text>
    <line x1="811" y1="212" x2="1009" y2="212" stroke="#e0e0e0" stroke-width="1"/>

    <text x="811" y="238" font-size="13.5" font-weight="600" fill="#333333">课 10 日志的存储策略</text>
    <text x="811" y="258" font-size="12" fill="#5f6368">data stream / ILM 冷热 / 模板配法</text>
    <text x="811" y="286" font-size="13.5" font-weight="600" fill="#333333">课 11 Kibana 可视化</text>
    <text x="811" y="306" font-size="12" fill="#5f6368">Data View / KQL / Lens 仪表盘</text>
    <text x="811" y="334" font-size="13.5" font-weight="600" fill="#333333">课 12 告警与生产落地</text>
    <text x="811" y="354" font-size="12" fill="#5f6368">告警 / 容量权限备份 / 该不该上</text>

    <rect x="811" y="378" width="198" height="72" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="823" y="398" font-size="12" font-weight="700" fill="#1565C0">学完能回答</text>
    <text x="823" y="417" font-size="11.5" fill="#5f6368">怎么存才不撑爆磁盘？</text>
    <text x="823" y="433" font-size="11.5" fill="#5f6368">怎么变成图与告警？</text>
    <text x="823" y="445" font-size="11.5" fill="#5f6368">生产上这套东西值不值？</text>
  </g>

  <!-- 捷径：Filebeat 直连 ES -->
  <path d="M400 470 L400 508 L655 508 L655 470" fill="none" stroke="#b0bec5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
  <text x="527" y="528" text-anchor="middle" font-size="12" fill="#78909c">捷径：Filebeat 可绕过 Logstash 直连 ES（课 3 先走这条）</text>

  <!-- 底部：收束与收尾产物 -->
  <rect x="30" y="552" width="995" height="82" rx="8" fill="#f5f7fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="580" font-size="14" font-weight="700" fill="#333333">收束</text>
  <text x="50" y="602" font-size="12.5" fill="#5f6368">一条从「日志产生」到「告警触发」的完整链路 ＋ 一份「该不该上 ELK、上到哪一步」的决策清单</text>
  <text x="50" y="622" font-size="12.5" fill="#5f6368">收尾产物：结课综合实战项目（Phase 3）→ 课程手册汇总（Phase 4）→ 实战经验 / 排障速查手册 / 场景解法库（Phase 5，三份一次生成）</text>
</svg>
