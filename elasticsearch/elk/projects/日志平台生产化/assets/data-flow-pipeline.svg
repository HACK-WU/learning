<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#5b6b7c"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1240" height="860" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="30" y="40" font-size="21" font-weight="700" fill="#1f2328">结课实战《日志平台生产化》· 数据流全链路</text>
  <text x="30" y="63" font-size="13" fill="#5b6b7c">一条日志从"被产生"到"被查询 / 被告警 / 被备份"的完整旅程 ｜ Elastic Stack 9.5.3 ｜ macOS + Docker Compose</text>

  <!-- ==================== 泳道表头 ==================== -->
  <g>
    <rect x="30"  y="85" width="222" height="34" rx="6" fill="#e8eef5" stroke="#c3d2e0"/>
    <text x="141" y="107" font-size="13.5" font-weight="700" fill="#1f4e79" text-anchor="middle">① 应用与日志文件</text>

    <rect x="264" y="85" width="196" height="34" rx="6" fill="#e8eef5" stroke="#c3d2e0"/>
    <text x="362" y="107" font-size="13.5" font-weight="700" fill="#1f4e79" text-anchor="middle">② 采集 Filebeat</text>

    <rect x="472" y="85" width="228" height="34" rx="6" fill="#e8eef5" stroke="#c3d2e0"/>
    <text x="586" y="107" font-size="13.5" font-weight="700" fill="#1f4e79" text-anchor="middle">③ 处理 Logstash</text>

    <rect x="712" y="85" width="240" height="34" rx="6" fill="#e8eef5" stroke="#c3d2e0"/>
    <text x="832" y="107" font-size="13.5" font-weight="700" fill="#1f4e79" text-anchor="middle">④ 存储 Elasticsearch</text>

    <rect x="964" y="85" width="246" height="34" rx="6" fill="#e8eef5" stroke="#c3d2e0"/>
    <text x="1087" y="107" font-size="13.5" font-weight="700" fill="#1f4e79" text-anchor="middle">⑤ 消费 Kibana / 告警 / 备份</text>
  </g>

  <!-- 泳道竖分隔线 -->
  <g stroke="#dde4eb" stroke-width="1" stroke-dasharray="4 4">
    <line x1="258" y1="85" x2="258" y2="700"/>
    <line x1="466" y1="85" x2="466" y2="700"/>
    <line x1="706" y1="85" x2="706" y2="700"/>
    <line x1="958" y1="85" x2="958" y2="700"/>
  </g>

  <!-- ==================== 步骤 1 ==================== -->
  <circle cx="52" cy="146" r="13" fill="#1f4e79"/>
  <text x="52" y="151" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="72" y="122" width="170" height="76" rx="8" fill="#ffffff" stroke="#c3d2e0"/>
  <text x="86" y="144" font-size="12.5" font-weight="700" fill="#1f2328">gen-logs.py 造数据</text>
  <text x="86" y="163" font-size="11.5" fill="#5b6b7c">600 条应用日志</text>
  <text x="86" y="180" font-size="11.5" fill="#5b6b7c">400 条 nginx 访问日志</text>
  <text x="86" y="193" font-size="11" fill="#8b98a5">70% JSON / 30% 文本混杂</text>

  <!-- 步骤 2 -->
  <circle cx="52" cy="252" r="13" fill="#1f4e79"/>
  <text x="52" y="257" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="72" y="228" width="170" height="76" rx="8" fill="#ffffff" stroke="#c3d2e0"/>
  <text x="86" y="250" font-size="12.5" font-weight="700" fill="#1f2328">落成日志文件</text>
  <text x="86" y="269" font-size="11" fill="#5b6b7c">app-web-01/02/03.log</text>
  <text x="86" y="285" font-size="11" fill="#5b6b7c">nginx-web-01/02/03.log</text>
  <text x="86" y="299" font-size="11" fill="#8b98a5">挂载为 /var/log/shop:ro</text>

  <line x1="244" y1="266" x2="278" y2="200" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ==================== 步骤 3-4 : Filebeat ==================== -->
  <circle cx="286" cy="146" r="13" fill="#1f4e79"/>
  <text x="286" y="151" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="304" y="118" width="144" height="84" rx="8" fill="#ffffff" stroke="#c3d2e0"/>
  <text x="316" y="139" font-size="12" font-weight="700" fill="#1f2328">filestream ×2</text>
  <text x="316" y="157" font-size="11" fill="#5b6b7c">app-*.log</text>
  <text x="316" y="173" font-size="11" fill="#5b6b7c">nginx-*.log</text>
  <text x="316" y="191" font-size="10.5" fill="#8b98a5">→ 多行合并</text>

  <circle cx="286" cy="252" r="13" fill="#1f4e79"/>
  <text x="286" y="257" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="304" y="224" width="144" height="84" rx="8" fill="#ffffff" stroke="#c3d2e0"/>
  <text x="316" y="245" font-size="12" font-weight="700" fill="#1f2328">processors</text>
  <text x="316" y="263" font-size="11" fill="#5b6b7c">add_fields env</text>
  <text x="316" y="279" font-size="11" fill="#5b6b7c">drop_fields 无用字段</text>
  <text x="316" y="297" font-size="10.5" fill="#8b98a5">fields.log_type 分流</text>

  <line x1="362" y1="202" x2="362" y2="220" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="448" y1="266" x2="486" y2="266" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 传输协议标注 -->
  <rect x="452" y="243" width="34" height="46" rx="4" fill="#eef5ff" stroke="#b8d4f0"/>
  <text x="469" y="257" font-size="9.5" fill="#1f4e79" text-anchor="middle">Lumber</text>
  <text x="469" y="269" font-size="9.5" fill="#1f4e79" text-anchor="middle">jack</text>
  <text x="469" y="283" font-size="9.5" font-weight="700" fill="#1f4e79" text-anchor="middle">:5044</text>

  <!-- ==================== 步骤 5-6 : Logstash ==================== -->
  <circle cx="498" cy="146" r="13" fill="#1f4e79"/>
  <text x="498" y="151" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="516" y="118" width="172" height="84" rx="8" fill="#ffffff" stroke="#c3d2e0"/>
  <text x="528" y="139" font-size="12" font-weight="700" fill="#1f2328">filter 双分支</text>
  <text x="528" y="157" font-size="10.5" fill="#5b6b7c">access → grok(COMMONAPACHELOG)</text>
  <text x="528" y="173" font-size="10.5" fill="#5b6b7c">app → json 或 grok 文本</text>
  <text x="528" y="191" font-size="10.5" fill="#8b98a5">date 校准事件时间</text>

  <circle cx="498" cy="252" r="13" fill="#1f4e79"/>
  <text x="498" y="257" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="516" y="224" width="172" height="84" rx="8" fill="#ffffff" stroke="#c3d2e0"/>
  <text x="528" y="245" font-size="12" font-weight="700" fill="#1f2328">mutate 归一 + 瘦身</text>
  <text x="528" y="263" font-size="10.5" fill="#5b6b7c">清容器 host.name</text>
  <text x="528" y="279" font-size="10.5" fill="#5b6b7c">convert 数值类型</text>
  <text x="528" y="297" font-size="10.5" fill="#8b98a5">remove 中间字段</text>

  <line x1="586" y1="202" x2="586" y2="220" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="688" y1="266" x2="726" y2="266" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ==================== 步骤 7-8 : Elasticsearch ==================== -->
  <circle cx="738" cy="146" r="13" fill="#1f4e79"/>
  <text x="738" y="151" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <rect x="756" y="110" width="180" height="98" rx="8" fill="#ffffff" stroke="#c3d2e0"/>
  <text x="768" y="131" font-size="12" font-weight="700" fill="#1f2328">data stream 写入</text>
  <text x="768" y="150" font-size="10.5" fill="#5b6b7c">logs-shopapi-default</text>
  <rect x="768" y="160" width="156" height="38" rx="5" fill="#f2f7ff" stroke="#c9dcf3"/>
  <text x="776" y="175" font-size="10" fill="#1f4e79">gen1 000001（1000 条）</text>
  <text x="776" y="190" font-size="10" fill="#1f4e79">gen2 000002（rollover 后）</text>

  <circle cx="738" cy="290" r="13" fill="#1f4e79"/>
  <text x="738" y="295" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
  <rect x="756" y="256" width="180" height="98" rx="8" fill="#ffffff" stroke="#c3d2e0"/>
  <text x="768" y="277" font-size="12" font-weight="700" fill="#1f2328">ILM 策略 shopapi-7d</text>
  <text x="768" y="296" font-size="10.5" fill="#5b6b7c">hot → warm → delete</text>
  <text x="768" y="312" font-size="10.5" fill="#5b6b7c">rollover 1gb / 1d</text>
  <text x="768" y="328" font-size="10.5" fill="#5b6b7c">warm forcemerge · delete 7d</text>
  <text x="768" y="345" font-size="9.5" fill="#c0392b">⚠ 模板须 composed_of</text>

  <line x1="836" y1="208" x2="836" y2="252" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 告警回写 -->
  <line x1="936" y1="290" x2="986" y2="290" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowRed)"/>

  <!-- ==================== 步骤 9-11 : 消费层 ==================== -->
  <circle cx="1000" cy="120" r="13" fill="#1f4e79"/>
  <text x="1000" y="125" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
  <rect x="1016" y="94" width="182" height="86" rx="8" fill="#ffffff" stroke="#c3d2e0"/>
  <text x="1028" y="115" font-size="12" font-weight="700" fill="#1f2328">Data View + Lens</text>
  <text x="1028" y="134" font-size="10.5" fill="#5b6b7c">logs-shopapi-*</text>
  <text x="1028" y="150" font-size="10.5" fill="#5b6b7c">错误率 / 主机下钻 / P95 耗时</text>
  <text x="1028" y="167" font-size="10.5" fill="#8b98a5">Discover → Dashboard</text>

  <circle cx="1000" cy="290" r="13" fill="#c0392b"/>
  <text x="1000" y="295" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
  <rect x="1016" y="248" width="182" height="86" rx="8" fill="#fff7f6" stroke="#e6b8b2"/>
  <text x="1028" y="269" font-size="12" font-weight="700" fill="#c0392b">告警：ERROR 激增</text>
  <text x="1028" y="288" font-size="10.5" fill="#5b6b7c">.es-query 规则，窗口 5m</text>
  <text x="1028" y="304" font-size="10.5" fill="#5b6b7c">.index 连接器落盘</text>
  <text x="1028" y="321" font-size="10.5" fill="#8b98a5">→ shopapi-alerts 索引</text>

  <circle cx="1000" cy="430" r="13" fill="#1a7f37"/>
  <text x="1000" y="435" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">11</text>
  <rect x="1016" y="388" width="182" height="90" rx="8" fill="#f4faf5" stroke="#b7ddc1"/>
  <text x="1028" y="409" font-size="12" font-weight="700" fill="#1a7f37">备份双路线</text>
  <text x="1028" y="428" font-size="10.5" fill="#5b6b7c">① 快照 fs 仓库 + SLM</text>
  <text x="1028" y="444" font-size="10.5" fill="#5b6b7c">② Saved Objects 导出</text>
  <text x="1028" y="461" font-size="10.5" fill="#8b98a5">恢复后规则 enabled=false</text>

  <line x1="938" y1="137" x2="982" y2="137" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="842" y1="470" x2="1010" y2="470" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="1105" y1="472" x2="1105" y2="434" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ==================== 底部：对象形态变化 ==================== -->
  <rect x="30" y="540" width="1180" height="290" rx="10" fill="#ffffff" stroke="#dde4eb"/>
  <text x="50" y="570" font-size="14" font-weight="700" fill="#1f2328">对象形态变化 —— 同一条日志，在每一跳"长"成了什么样</text>
  <text x="50" y="590" font-size="11.5" fill="#8b98a5">这是排查"字段去哪了"的唯一抓手：任何一跳解析失败，都会在这一跳留下失败标签（tags），而不是静默丢弃</text>

  <!-- 形态 A -->
  <rect x="50" y="608" width="216" height="200" rx="8" fill="#f8fafc" stroke="#d5dee7"/>
  <text x="64" y="630" font-size="11.5" font-weight="700" fill="#1f4e79">① 文件里的原始行</text>
  <text x="64" y="650" font-size="10.5" fill="#333">JSON 型（70%）</text>
  <rect x="64" y="658" width="188" height="52" rx="4" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="70" y="673" font-size="9.5" fill="#5b6b7c">{"ts":"…+08:00","level":"ERROR",</text>
  <text x="70" y="686" font-size="9.5" fill="#5b6b7c">"host":"web-01","path":"/api/pay/…",</text>
  <text x="70" y="699" font-size="9.5" fill="#5b6b7c">"status":500,"duration_ms":568}</text>
  <text x="64" y="730" font-size="10.5" fill="#333">文本型（30%）</text>
  <rect x="64" y="738" width="188" height="44" rx="4" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="70" y="753" font-size="9.5" fill="#5b6b7c">2026-09-10 23:14:54 [ERROR]</text>
  <text x="70" y="768" font-size="9.5" fill="#5b6b7c">[http-nio-…] com.shop… path=…</text>

  <!-- 形态 B -->
  <rect x="288" y="608" width="216" height="200" rx="8" fill="#f8fafc" stroke="#d5dee7"/>
  <text x="302" y="630" font-size="11.5" font-weight="700" fill="#1f4e79">② Logstash 事件</text>
  <text x="302" y="650" font-size="10.5" fill="#333">message 仍是一整行</text>
  <rect x="302" y="658" width="188" height="86" rx="4" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="308" y="673" font-size="9.5" fill="#5b6b7c">message: "…整行原文…"</text>
  <text x="308" y="688" font-size="9.5" fill="#5b6b7c">fields.log_type: "app"</text>
  <text x="308" y="703" font-size="9.5" fill="#5b6b7c">host.name: "09d214…"</text>
  <text x="308" y="718" font-size="9.5" fill="#c0392b">           ↑ 容器 ID（待清理）</text>
  <text x="308" y="733" font-size="9.5" fill="#5b6b7c">log.file.path: "/var/log/…"</text>
  <text x="302" y="768" font-size="10" fill="#8b98a5">此时还没有业务字段</text>

  <!-- 形态 C -->
  <rect x="526" y="608" width="216" height="200" rx="8" fill="#f8fafc" stroke="#d5dee7"/>
  <text x="540" y="630" font-size="11.5" font-weight="700" fill="#1f4e79">③ 解析后 → 归档文档</text>
  <text x="540" y="650" font-size="10.5" fill="#333">业务字段全部落地</text>
  <rect x="540" y="658" width="188" height="112" rx="4" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="546" y="673" font-size="9.5" fill="#1a7f37">log.level: "ERROR"</text>
  <text x="546" y="688" font-size="9.5" fill="#5b6b7c">host.name: "web-01"</text>
  <text x="546" y="703" font-size="9.5" fill="#5b6b7c">url.path: "/api/pay/submit"</text>
  <text x="546" y="718" font-size="9.5" fill="#5b6b7c">http.response.status_code: 500</text>
  <text x="546" y="733" font-size="9.5" fill="#5b6b7c">duration_ms: 568（integer）</text>
  <text x="546" y="748" font-size="9.5" fill="#5b6b7c">@timestamp: 事件时间</text>
  <text x="546" y="763" font-size="9.5" fill="#8b98a5">nginx 侧另有 source.address…</text>

  <!-- 形态 D -->
  <rect x="764" y="608" width="216" height="200" rx="8" fill="#f8fafc" stroke="#d5dee7"/>
  <text x="778" y="630" font-size="11.5" font-weight="700" fill="#1f4e79">④ 落进 data stream</text>
  <text x="778" y="650" font-size="10.5" fill="#333">按 ILM 滚动、到期删除</text>
  <rect x="778" y="658" width="188" height="86" rx="4" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="784" y="673" font-size="9.5" fill="#5b6b7c">.ds-logs-shopapi-</text>
  <text x="784" y="688" font-size="9.5" fill="#5b6b7c">   default-2026.09.10-000001</text>
  <text x="784" y="703" font-size="9.5" fill="#5b6b7c">   default-2026.09.10-000002</text>
  <text x="784" y="722" font-size="9.5" fill="#1a7f37">两代映射完全一致 ✓</text>
  <text x="778" y="768" font-size="10" fill="#8b98a5">replicas=0（单节点教学）</text>

  <!-- 形态 E -->
  <rect x="1002" y="608" width="208" height="200" rx="8" fill="#f8fafc" stroke="#d5dee7"/>
  <text x="1016" y="630" font-size="11.5" font-weight="700" fill="#1f4e79">⑤ 衍生消费物</text>
  <text x="1016" y="650" font-size="10.5" fill="#333">三样东西，同一个源头</text>
  <rect x="1016" y="658" width="180" height="86" rx="4" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="1022" y="673" font-size="9.5" fill="#5b6b7c">· Lens 图表 / Dashboard</text>
  <text x="1022" y="689" font-size="9.5" fill="#5b6b7c">· 告警实例（.internal.alerts）</text>
  <text x="1022" y="705" font-size="9.5" fill="#c0392b">· 告警落盘 shopapi-alerts</text>
  <text x="1022" y="721" font-size="9.5" fill="#5b6b7c">· 快照（32 分片 SUCCESS）</text>
  <text x="1016" y="762" font-size="10" fill="#8b98a5">快照含 .kibana* 功能状态</text>

  <!-- 底部箭头链 -->
  <g stroke="#9aa7b4" stroke-width="1.3" marker-end="url(#arrow)">
    <line x1="270" y1="708" x2="284" y2="708"/>
    <line x1="508" y1="708" x2="522" y2="708"/>
    <line x1="746" y1="708" x2="760" y2="708"/>
    <line x1="984" y1="708" x2="998" y2="708"/>
  </g>

  <!-- 脚注 -->
  <text x="30" y="848" font-size="10.5" fill="#8b98a5">本图对应实测环境：cap-es / cap-kibana / cap-logstash / cap-filebeat 四容器 ｜ 实测数据：1000 条基线上再 rollover 扩 90 条，解析失败标签数为 0</text>
</svg>
