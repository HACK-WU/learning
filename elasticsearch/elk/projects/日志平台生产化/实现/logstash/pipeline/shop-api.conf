# 结课实战：shop-api 日志解析管道
# 知识点回指：课 7（grok/date/mutate/dissect）｜课 8（持久化队列）｜课 9（在哪处理）｜课 10（data stream）
#
# 设计要点：
#   1. 双分支——应用日志（JSON / 半结构化文本）与 nginx 访问日志分开解析，互不污染
#   2. date 校准——把日志里的"事件时间"写进 @timestamp（课 3 遗留问题的正面解决）
#   3. 解析失败的脏数据打标签，便于在 Kibana 里一眼看出（不静默丢弃）
#   4. 输出到 data stream（课 10），由 ILM 管滚动与删除（不自己算日期后缀）

input {
  beats {
    port => 5044
  }
}

filter {
  # ── 步骤 0：清理 Filebeat 带进来的容器元数据 ───────────────────────
  # ⚠️ ⚠️ 本项目第二个隐蔽坑（只有真跑 + 真去看聚合才会暴露）：
  #    Filebeat 跑在容器里，它写入的 host.name 是【容器 ID】（如 09d21480270c），
  #    跟"这条日志到底来自哪台业务机"毫无关系。
  #    如果不管它、直接写真实主机名，Logstash 会把两个值【合并成数组】：
  #        host.name = ["09d21480270c", "web-01"]
  #    后果（实测）：
  #        - Kibana 上"按主机下钻"凭空多出一个假主机，且它命中【全部】文档（600/600）
  #        - 任何 host.name 的 terms 聚合 / Lens 拆分 / 告警分组全被污染
  #    正确做法：先把 Filebeat 的容器 host.name 删掉，再由日志内容写入真实主机名。
  #    ⚠️ 注意：真实生产里 Filebeat 是每台机器一个 DaemonSet，host.name 本来就是对的，
  #       那时【不要】删——本步骤只适用于"一台 Filebeat 收多台机器日志"的场景。
  mutate {
    remove_field => ["[host][name]", "[agent][ephemeral_id]"]
  }

  # ── 分支 A：nginx 访问日志（combined log format）────────────────────
  if [fields][log_type] == "access" {
    # A-0 访问日志正文里没有主机名 —— 从文件路径反推是哪台机器
    #     /var/log/shop/nginx-web-01.log  →  host.name = web-01
    #     （真实环境里对应"从 Pod 名 / 目录名反推实例"，是很常见的一招）
    # ⚠️ 又一个小坑：这里【不能用 %{WORD}】—— WORD 是 \b\w+\b，而 "web-01" 里的
    #    连字符不在 \w 里，WORD 只能匹配到 "web"，后面接 ".log" 就对不上，整条 grok 失败。
    #    换成非贪婪的 %{DATA}（.*?）才吃得下 "web-01"。
    grok {
      match => { "[log][file][path]" => "/var/log/shop/nginx-%{DATA:[host][name]}.log" }
      tag_on_failure => ["_path_host_failed"]
    }
    grok {
      # ⚠️ 课 7 教训：9.x 默认 ecs_compatibility=v8，COMMONAPACHELOG 展开后输出的
      #    字段名已经全部改成 ECS 风格（可直接用下面的命令查实）：
      #      docker exec cap-logstash grep -E "^HTTPD_COMMONLOG" \
      #        /usr/share/logstash/vendor/bundle/jruby/*/gems/logstash-patterns-core-*/patterns/ecs-v1/httpd
      #    实测输出：source.address / http.request.method / url.original /
      #              http.response.status_code / http.response.body.bytes / http.version
      #    不再是老教程里的 clientip / verb / request / response / bytes
      match => { "message" => "%{COMMONAPACHELOG}" }
      tag_on_failure => ["_nginx_parse_failed"]
    }
    # A-1 访问日志的时间戳落在【扁平字段 timestamp】里（ECS 模式未改名），
    #     格式 dd/MMM/yyyy:HH:mm:ss Z，月份必须是英文缩写 —— 生成脚本已注意这点
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
      timezone => "Asia/Shanghai"
      tag_on_failure => ["_date_parse_failed"]
    }
  }

  # ── 分支 B：应用日志 ──────────────────────────────────────────────
  else {
    # B-1 先试 JSON（新版本服务已经改成 JSON 输出）
    if [message] =~ "^\{" {
      json {
        source => "message"
        target => "app"
        tag_on_failure => ["_json_parse_failed"]
      }
      # JSON 里的时间字段 → @timestamp（事件时间，不是采集时间）
      date {
        match => ["[app][ts]", "ISO8601"]
        target => "@timestamp"
        tag_on_failure => ["_date_parse_failed"]
      }
      # ⚠️ 真实踩坑：add_field 是 mutate 的【通用选项，最后才执行】，
      #    把 add_field 和 convert 写在同一个 mutate 块里，convert 会先跑——
      #    此时字段还不存在，报 "invalid value for BigDecimal()" 且类型转换静默失效。
      #    正确做法：拆成两个 mutate 块。
      # ⚠️ 字段名一律用【方括号嵌套写法】[a][b]，不要写字面量点号 "a.b"。
      #    写 "host.name" 会在 _source 里留下一个字面量键 "host.name"，
      #    与 Filebeat 的嵌套 host.name 并存，是另一个"字段打架"的隐患。
      mutate {
        add_field => {
          "[log][level]"                => "%{[app][level]}"
          "[host][name]"                => "%{[app][host]}"
          "[url][path]"                 => "%{[app][path]}"
          "duration_ms"                 => "%{[app][duration_ms]}"
          "[http][response][status_code]" => "%{[app][status]}"
        }
      }
      mutate {
        convert => {
          "duration_ms"                   => "integer"
          "[http][response][status_code]" => "integer"
        }
      }
    }
    # B-2 不是 JSON —— 按半结构化文本解析（老版本服务的输出）
    else {
      grok {
        # 文本行末尾自带 path= / status= / duration= / host=，一次全提出来
        # （DATA 是非贪婪的，不会把后面的 path= 吃掉）
        match => { "message" => "%{TIMESTAMP_ISO8601:log_time} \[%{LOGLEVEL:[log][level]}\] \[%{DATA:thread}\] %{NOTSPACE:logger} - %{DATA:log_msg} path=%{NOTSPACE:[url][path]} status=%{NUMBER:[http][response][status_code]:int} duration=%{NUMBER:duration_ms:int}ms host=%{NOTSPACE:[host][name]}" }
        tag_on_failure => ["_grok_parse_failed"]
      }
      date {
        match => ["log_time", "yyyy-MM-dd HH:mm:ss"]
        target => "@timestamp"
        timezone => "Asia/Shanghai"
        tag_on_failure => ["_date_parse_failed"]
      }
    }
  }

  # 统一：删掉解析过程产生的中间字段，省存储（课 10「字段爆炸」反面教材）
  # ⚠️ 真实踩坑：mutate 插件【没有 ignore_missing 这个设置】，写了会直接
  #    "Unknown setting 'ignore_missing' for mutate" → Logstash 启动失败退出，
  #    表现为 Filebeat 侧 "Failed to publish events caused by: EOF"
  #    （删不存在的字段要用条件判断，或干脆只删一定存在的）
  mutate {
    remove_field => ["timestamp", "log_time", "[app][ts]"]
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "elastic"
    password => "ELKlearn2026"
    # 课 10：写成 data stream（三段式命名由 ES 自动补全为 logs-shopapi-default）
    data_stream           => "true"
    data_stream_type      => "logs"
    data_stream_dataset   => "shopapi"
    data_stream_namespace => "default"
  }
}
