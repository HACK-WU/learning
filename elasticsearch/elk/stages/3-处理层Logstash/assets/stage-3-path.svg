<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#90A4AE"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1565C0"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="900" height="480" rx="12" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">阶段 3 · 处理层 Logstash：让日志「看得懂」</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#666">故事主线：主角是一条日志 —— 被 Beats「拿得到」后，到此被拆成字段、校准时间、理顺结构</text>

  <!-- 主线：四个阶段框（横向） -->
  <!-- 阶段1 -->
  <rect x="40" y="96" width="150" height="64" rx="10" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="115" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">阶段 1</text>
  <text x="115" y="142" text-anchor="middle" font-size="12" fill="#666">全景与起步</text>

  <!-- 阶段2 -->
  <rect x="230" y="96" width="150" height="64" rx="10" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="305" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">阶段 2</text>
  <text x="305" y="142" text-anchor="middle" font-size="12" fill="#666">采集层 Beats</text>

  <!-- 阶段3（当前高亮） -->
  <rect x="420" y="96" width="150" height="64" rx="10" fill="#1565C0" stroke="#0d47a1" stroke-width="2"/>
  <text x="495" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">阶段 3</text>
  <text x="495" y="142" text-anchor="middle" font-size="12" fill="#e3f2fd">处理层 Logstash</text>

  <!-- 阶段4 -->
  <rect x="610" y="96" width="150" height="64" rx="10" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="685" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">阶段 4</text>
  <text x="685" y="142" text-anchor="middle" font-size="12" fill="#666">存储 · 可视化 · 落地</text>

  <!-- 主线箭头 -->
  <line x1="190" y1="128" x2="226" y2="128" stroke="#90A4AE" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="128" x2="416" y2="128" stroke="#90A4AE" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="128" x2="606" y2="128" stroke="#90A4AE" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段3 展开连线（垂直 + 三叉） -->
  <line x1="495" y1="160" x2="495" y2="196" stroke="#1565C0" stroke-width="2.5" marker-end="url(#arrowDark)"/>
  <line x1="495" y1="208" x2="255" y2="208" stroke="#90A4AE" stroke-width="2"/>
  <line x1="495" y1="208" x2="735" y2="208" stroke="#90A4AE" stroke-width="2"/>
  <line x1="255" y1="208" x2="255" y2="238" stroke="#1565C0" stroke-width="2.5" marker-end="url(#arrowDark)"/>
  <line x1="495" y1="208" x2="495" y2="238" stroke="#1565C0" stroke-width="2.5" marker-end="url(#arrowDark)"/>
  <line x1="735" y1="208" x2="735" y2="238" stroke="#1565C0" stroke-width="2.5" marker-end="url(#arrowDark)"/>

  <!-- 阶段3 三个知识点框 -->
  <!-- 课7 -->
  <rect x="170" y="240" width="170" height="108" rx="10" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
  <text x="255" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">课 7</text>
  <text x="255" y="279" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Logstash 管道三件套</text>
  <text x="255" y="300" text-anchor="middle" font-size="11" fill="#37474f">拆字段、改时间</text>
  <text x="255" y="316" text-anchor="middle" font-size="11" fill="#37474f">（看得懂的核心工具）</text>

  <!-- 课8 -->
  <rect x="410" y="240" width="170" height="108" rx="10" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
  <text x="495" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">课 8</text>
  <text x="495" y="279" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">可靠性与吞吐</text>
  <text x="495" y="300" text-anchor="middle" font-size="11" fill="#37474f">不丢、不堵</text>
  <text x="495" y="316" text-anchor="middle" font-size="11" fill="#37474f">（扛住乱格式与大流量）</text>

  <!-- 课9 -->
  <rect x="650" y="240" width="170" height="108" rx="10" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
  <text x="735" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">课 9</text>
  <text x="735" y="279" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">该在哪处理</text>
  <text x="735" y="300" text-anchor="middle" font-size="11" fill="#37474f">Beats / Logstash / Ingest</text>
  <text x="735" y="316" text-anchor="middle" font-size="11" fill="#37474f">（在哪干更划算）</text>

  <!-- 阶段4 前的结果汇流（从课9 到阶段4 的衔接提示） -->
  <line x1="735" y1="348" x2="735" y2="388" stroke="#90A4AE" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="735" y="410" text-anchor="middle" font-size="11" fill="#607D8B">结构化档案 →</text>
  <text x="735" y="424" text-anchor="middle" font-size="11" fill="#607D8B">进 Kibana 可视化</text>

  <!-- 注脚（阶段内顺序提示，非孤立节点） -->
  <text x="450" y="462" text-anchor="middle" font-size="11" fill="#90A4AE">课 7（能处理）→ 课 8（稳得住）→ 课 9（放对位置）；主角至此从「一串字」变成「看得懂的档案」</text>
</svg>
