<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <style>
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .bg { fill: #ffffff; }
    .soft { fill: #fafafa; }
    .deep { fill: #1565C0; }
    .deep-border { stroke: #1565C0; fill: #ffffff; }
    .warm-border { stroke: #ef6c00; fill: #ffffff; }
    .plain { fill: #ffffff; stroke: #cfd8dc; }
    .box-text { fill: #333333; }
    .on-deep { fill: #fafafa; }
    .accent-line { stroke: #1565C0; }
    .warm-line { stroke: #ef6c00; }
    .grey-line { stroke: #b0bec5; fill: none; }
    .sub { fill: #607d8b; }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="480" rx="10"/>

  <text x="450" y="34" font-size="19" font-weight="700" text-anchor="middle" class="box-text">阶段 4 · 存储 · 可视化 · 落地 —— 一条日志的「留得住 · 用得上」</text>
  <text x="450" y="56" font-size="13" text-anchor="middle" class="sub">在四阶段主线中的收官位置：看得见全貌 → 拿得到 → 看得懂 →（本阶段）留得住 · 用得上</text>

  <!-- 四阶段主线（本阶段=阶段4，深色强调） -->
  <rect class="plain" x="62" y="88" width="180" height="66" rx="10"/>
  <text x="152" y="112" font-size="13" font-weight="700" text-anchor="middle" class="box-text">阶段 1</text>
  <text x="152" y="130" font-size="12" text-anchor="middle" class="box-text">全景与起步</text>
  <text x="152" y="147" font-size="11" text-anchor="middle" class="sub">看得见全貌</text>

  <rect class="plain" x="262" y="88" width="180" height="66" rx="10"/>
  <text x="352" y="112" font-size="13" font-weight="700" text-anchor="middle" class="box-text">阶段 2</text>
  <text x="352" y="130" font-size="12" text-anchor="middle" class="box-text">采集 Beats</text>
  <text x="352" y="147" font-size="11" text-anchor="middle" class="sub">拿得到</text>

  <rect class="plain" x="462" y="88" width="180" height="66" rx="10"/>
  <text x="552" y="112" font-size="13" font-weight="700" text-anchor="middle" class="box-text">阶段 3</text>
  <text x="552" y="130" font-size="12" text-anchor="middle" class="box-text">处理 Logstash</text>
  <text x="552" y="147" font-size="11" text-anchor="middle" class="sub">看得懂</text>

  <rect class="deep" x="662" y="88" width="180" height="66" rx="10"/>
  <text x="752" y="112" font-size="13" font-weight="700" text-anchor="middle" class="on-deep">阶段 4 · 存储落地</text>
  <text x="752" y="130" font-size="12" text-anchor="middle" class="on-deep">data stream · Kibana · 告警</text>
  <text x="752" y="147" font-size="11" text-anchor="middle" class="on-deep">留得住 · 用得上（本阶段）</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565C0"/>
    </marker>
    <marker id="arrgrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#90a4ae"/>
    </marker>
    <marker id="arrwarm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef6c00"/>
    </marker>
  </defs>

  <!-- 阶段间箭头（y≈121） -->
  <line class="accent-line" x1="246" y1="121" x2="258" y2="121" stroke-width="2" marker-end="url(#arr)"/>
  <line class="accent-line" x1="446" y1="121" x2="458" y2="121" stroke-width="2" marker-end="url(#arr)"/>
  <line class="accent-line" x1="646" y1="121" x2="658" y2="121" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 从阶段4盒子下拉到内部三课 -->
  <line class="grey-line" x1="752" y1="154" x2="752" y2="178" stroke-width="1.5"/>
  <line class="grey-line" x1="175" y1="178" x2="752" y2="178" stroke-width="1.5"/>
  <line class="grey-line" x1="175" y1="178" x2="175" y2="240" stroke-width="1.5"/>
  <line class="grey-line" x1="450" y1="178" x2="450" y2="240" stroke-width="1.5"/>
  <line class="grey-line" x1="725" y1="178" x2="725" y2="240" stroke-width="1.5"/>
  <line class="grey-line" x1="175" y1="178" x2="175" y2="184" stroke-width="1.5" marker-end="url(#arrgrey)"/>
  <text x="450" y="205" font-size="12" font-weight="700" text-anchor="middle" class="box-text">阶段 4 内部路线：把日志「留得住 · 用得上」要跨过的三课</text>

  <!-- 课 10 -->
  <rect class="deep-border" x="50" y="240" width="250" height="118" rx="10" stroke-width="1.6"/>
  <text x="175" y="263" font-size="13" font-weight="700" text-anchor="middle" class="box-text">课 10 · 日志的存储策略</text>
  <text x="62" y="286" font-size="11" class="box-text">· data stream 在日志场景</text>
  <text x="62" y="305" font-size="11" class="box-text">· ILM 滚动与冷热分层</text>
  <text x="62" y="324" font-size="11" class="box-text">· 模板配法 / ECS / 分片取舍</text>
  <text x="62" y="345" font-size="11" class="sub">—— 让日志留得住、到点自动删</text>

  <!-- 课 11 -->
  <rect class="deep-border" x="325" y="240" width="250" height="118" rx="10" stroke-width="1.6"/>
  <text x="450" y="263" font-size="13" font-weight="700" text-anchor="middle" class="box-text">课 11 · Kibana：Discover → Dashboard</text>
  <text x="337" y="286" font-size="11" class="box-text">· Data View 与 Discover</text>
  <text x="337" y="305" font-size="11" class="box-text">· KQL 与查询过滤</text>
  <text x="337" y="324" font-size="11" class="box-text">· Lens 与 Dashboard</text>
  <text x="337" y="345" font-size="11" class="sub">—— 让日志变得看得懂、可交互</text>

  <!-- 课 12（收官，暖色强调） -->
  <rect class="warm-border" x="600" y="240" width="250" height="118" rx="10" stroke-width="1.6"/>
  <text x="725" y="263" font-size="13" font-weight="700" text-anchor="middle" class="box-text">课 12 · 告警与生产落地</text>
  <text x="612" y="286" font-size="11" class="box-text">· 告警规则与连接器</text>
  <text x="612" y="305" font-size="11" class="box-text">· 容量 / 权限 / 备份</text>
  <text x="612" y="324" font-size="11" class="box-text">· 该不该上 ELK（收束）</text>
  <text x="612" y="345" font-size="11" class="sub">—— 出事叫醒你 + 决策收束</text>

  <!-- 课间箭头 -->
  <line class="accent-line" x1="300" y1="299" x2="321" y2="299" stroke-width="2" marker-end="url(#arr)"/>
  <line class="warm-line" x1="575" y1="299" x2="596" y2="299" stroke-width="2" marker-end="url(#arrwarm)"/>

  <!-- 底部故事定位：第 4 幕（收官） -->
  <rect class="soft" x="60" y="396" width="780" height="44" rx="8"/>
  <text x="450" y="416" font-size="12.5" font-weight="700" text-anchor="middle" class="box-text">故事主线：一条日志的一生 · 第 4 幕（共 4 幕，收官）</text>
  <text x="450" y="432" font-size="11.5" text-anchor="middle" class="sub">冲突场景：逐台 grep 找不到 → 本阶段收束：日志被长期留存、可视化成图、越界即告警，并给出「该不该上 ELK」决策</text>
</svg>
