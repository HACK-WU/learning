# Logstash 管道配置 · ELK 子教程课 7
# 三段式：input（进）→ filter（加工）→ output（出）

# ---------- ① input：数据从哪进 ----------
input {
  beats {
    port => 5044          # Filebeat 用 output.logstash 连到这里
  }
}

# ---------- ② filter：加工主力 ----------
filter {
  # 按来源分支：nginx 用内置模式，订单日志用自定义 grok
  if [log][file][path] =~ "nginx-access" {
    # 内置模式：一条 COMMONAPACHELOG 就能拆出 clientip / verb / request / response / bytes
    grok {
      match => { "message" => "%{COMMONAPACHELOG}" }
    }
  } else if [log][file][path] =~ "demo-app" {
    # 自定义 grok：多模式按顺序尝试，命中第一个就停
    grok {
      match => { "message" => [
        "%{TIMESTAMP_ISO8601:log_time} %{LOGLEVEL:log_level}\s+\[%{DATA:service_name}\] %{DATA:action} orderId=%{NUMBER:order_id:int} userId=%{DATA:user_id} amount=%{NUMBER:amount:float}",
        "%{TIMESTAMP_ISO8601:log_time} %{LOGLEVEL:log_level}\s+\[%{DATA:service_name}\] %{DATA:action} orderId=%{NUMBER:order_id:int} userId=%{DATA:user_id} reason=%{DATA:fail_reason}"
      ]}
    }
    # 用日志里的真实时间覆盖 @timestamp（否则默认是 Logstash 收到它的时间）
    date {
      match       => ["log_time", "yyyy-MM-dd HH:mm:ss"]
      timezone    => "Asia/Shanghai"
      target      => "@timestamp"
    }
  }

  # mutate：类型转换 / 替换 / 改名 / 加字段 / 删字段
  mutate {
    # ⚠️ 注意：9.x 的 ECS 兼容模式下，COMMONAPACHELOG 捕获的 bytes
    #    已经被重命名为 http.response.body.bytes，所以这里要用嵌套字段写法。
    #    如果照抄老教程写成 "bytes"，不会报错但也不会生效（字段已不存在）。
    convert      => { "[http][response][body][bytes]" => "integer" }
    gsub         => [ "user_id", "^u", "user-" ]      # u401 → user-401
    rename       => { "service_name" => "service" }   # 改字段名
    add_field    => { "processed_by" => "logstash-lesson07" }
    remove_field => ["log_time", "@version"]          # 清理临时与噪音字段
  }
}

# ---------- ③ output：数据往哪出 ----------
output {
  # 解析失败的脏数据单独放一个索引，别污染正常数据
  if "_grokparsefailure" in [tags] {
    elasticsearch {
      hosts     => ["http://elasticsearch:9200"]
      user      => "elastic"
      password  => "ELKlearn2026"
      index     => "logstash-failed-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts     => ["http://elasticsearch:9200"]
      user      => "elastic"
      password  => "ELKlearn2026"
      index     => "logstash-demo-%{+YYYY.MM.dd}"
    }
  }
  # 同时打到标准输出，方便 docker compose logs 观察
  stdout { codec => rubydebug }
}
