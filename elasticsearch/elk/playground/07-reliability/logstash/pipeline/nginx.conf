# 管道 2：nginx 访问日志（来自 Filebeat 5045）
# 与 orders 管道完全独立：不同的 input 端口、不同的 output 索引、不同的队列
input {
  beats {
    port => 5045
  }
}

filter {
  grok {
    match => { "message" => "%{COMMONAPACHELOG}" }
  }
  mutate {
    convert      => { "[http][response][body][bytes]" => "integer" }
    add_field    => { "pipeline_id" => "nginx" }
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "elastic"
    password => "ELKlearn2026"
    index    => "ls-nginx-%{+YYYY.MM.dd}"
  }
}
