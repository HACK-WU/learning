# ELK 子教程 · 课 6《Beats 家族与采集选型》—— 两个 Beat 同台对比
# 版本基线：Elastic Stack 9.5.3 ｜ 环境：macOS arm64 + Docker Compose
#
# 本课同时跑两个 Beat，用来对比"日志"与"指标"这两种数据的差别：
#   filebeat   读日志文件（课 4-5 的主角）
#   metricbeat 采集系统与容器的指标（本课新登场）
#
# ⚠️ 端口同样用 9200 / 5601，跑本课前请先停掉 04-modules-processors

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: elk-es
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=ELKlearn2026
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -u elastic:ELKlearn2026 http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.3
    container_name: elk-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=KibanaSys2026
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # 采集"日志"：读文本文件，一条一行
  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.3
    container_name: elk-filebeat
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./filebeat-modules.d:/usr/share/filebeat/modules.d:ro
      - ./logs:/var/log/app:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  # 采集"指标"：定时抓数值快照，不需要读文件
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:9.5.3
    container_name: elk-metricbeat
    user: root
    command: ["metricbeat", "-e", "--strict.perms=false"]
    volumes:
      - ./metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - ./metricbeat-modules.d:/usr/share/metricbeat/modules.d:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
