# ELK 子教程 · 课 3《端到端走一遍》三件套（ES + Kibana + Filebeat）
# 版本基线：Elastic Stack 9.5.3 ｜ 环境：macOS arm64 + Docker Compose
#
# 这是课 2 那份两件套的扩展版：多了 filebeat 服务，用来跑通
#   "日志文件 → Filebeat → Elasticsearch → Kibana" 最小链路。
# 本课刻意不引入 Logstash —— 先看最短链路成立，处理层留到阶段 3。
#
# ⚠️ 端口与课 2 那份相同（9200 / 5601），同时启动会冲突。
#    跑本课前请先在 01-minimal-stack 目录执行 docker compose down。
#
# ⚠️ 密码为学习环境固定值，明文只为可复现；生产环境请用密钥管理。

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: elk-es
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=ELKlearn2026
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -u elastic:ELKlearn2026 http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.3
    container_name: elk-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=KibanaSys2026
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.3
    container_name: elk-filebeat
    # 用 root 运行：需要读取挂载进来的日志文件、并写入自己的 registry
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      # 挂载配置（只读）
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # 挂载"应用日志"目录 —— 容器里的 Filebeat 就是通过它读到宿主机的日志文件
      - ./logs:/usr/share/filebeat/logs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
