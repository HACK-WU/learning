<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="840" height="330" fill="#fbfcfd"/>
  <defs>
    <marker id="redarrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">① 基础版：脏数据直通索引，聚合撞墙（本机实测）</text>

  <!-- 上游 -->
  <rect x="24" y="48" width="230" height="130" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="139" y="70" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">上游推来的脏数据</text>
  <text x="40" y="94" font-size="11" fill="#dc2626">name  "  小米手机  "   ← 首尾空格</text>
  <text x="40" y="112" font-size="11" fill="#dc2626">price "1999.9元"       ← 带单位</text>
  <text x="40" y="130" font-size="11" fill="#dc2626">tag   "A,B"            ← 逗号串非数组</text>
  <text x="40" y="148" font-size="11" fill="#dc2626">ts    "2026/08/15 ..." ← 格式不统一</text>
  <text x="40" y="168" font-size="11" fill="#64748b">↓ 直接写入，无加工</text>

  <!-- 索引 -->
  <rect x="290" y="48" width="230" height="130" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="405" y="70" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="600">动态映射猜错类型</text>
  <text x="306" y="94" font-size="11" fill="#991b1b">name  → text</text>
  <rect x="302" y="104" width="206" height="24" rx="4" fill="#fecaca"/>
  <text x="306" y="121" font-size="11" fill="#7f1d1d" font-weight="600">price → text  ← 带"元"被猜成文本</text>
  <text x="306" y="146" font-size="11" fill="#991b1b">tag   → text</text>
  <text x="306" y="166" font-size="11" fill="#991b1b">ts    → text</text>

  <line x1="254" y1="113" x2="286" y2="113" stroke="#dc2626" stroke-width="2.5" marker-end="url(#redarrow)"/>

  <!-- 需求 -->
  <rect x="556" y="48" width="260" height="130" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="686" y="70" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="600">运营：算平均价格</text>
  <rect x="572" y="82" width="228" height="52" rx="6" fill="#fee2e2"/>
  <text x="686" y="102" text-anchor="middle" font-size="11" fill="#7f1d1d" font-weight="600">聚合报错</text>
  <text x="686" y="122" text-anchor="middle" font-size="10" fill="#991b1b">Fielddata is disabled on [price]</text>
  <text x="572" y="150" font-size="10" fill="#991b1b">text 字段不能聚合，也不能排序 ——</text>
  <text x="572" y="166" font-size="10" fill="#991b1b">课 5 的类型问题在管道里的样子。</text>

  <line x1="520" y1="113" x2="552" y2="113" stroke="#dc2626" stroke-width="2.5" marker-end="url(#redarrow)"/>

  <!-- 问题 -->
  <text x="24" y="204" font-size="14" fill="#334155" font-weight="600">四个脏点，一个都躲不掉</text>
  <rect x="24" y="216" width="404" height="88" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="40" y="238" font-size="12" fill="#92400e" font-weight="600">1. price 被猜成 text（值里带「元」）</text>
  <text x="40" y="258" font-size="11" fill="#a16207">既不能聚合也不能排序 —— 运营需求直接落空。</text>
  <text x="40" y="276" font-size="11" fill="#a16207">2. name 带首尾空格，搜索与精确匹配都受影响。</text>
  <text x="40" y="294" font-size="11" fill="#a16207">3. tag 是逗号串，做不了 terms 分桶。</text>

  <rect x="440" y="216" width="376" height="88" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="456" y="238" font-size="12" fill="#1e3a8a" font-weight="600">实测 _source 回读（原样进来了）</text>
  <text x="456" y="258" font-size="10" fill="#1e40af" font-family="monospace">{"name":"  小米手机  ","price":"1999.9元",</text>
  <text x="456" y="274" font-size="10" fill="#1e40af" font-family="monospace"> "tag":"A,B","ts":"2026/08/15 10:30:00"}</text>
  <text x="456" y="294" font-size="11" fill="#1e40af">脏数据不会报错，它只是静静等着你聚合时炸。</text>
</svg>
