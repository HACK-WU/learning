<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="780" height="420" fill="#fbfcfd"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1f2933">② 改进版：nested 把每张卡片装进独立信封</text>
  <text x="20" y="52" font-size="12" fill="#7b8794">配对关系保住了 —— 橙色区是代价：文档数从 2 膨胀到 6</text>

  <rect x="20" y="76" width="150" height="66" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="95" y="100" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle">查询</text>
  <text x="95" y="122" font-size="11" fill="#1565c0" text-anchor="middle">color=red + size=S</text>

  <line x1="172" y1="109" x2="222" y2="109" stroke="#52606d" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="226" y="70" width="200" height="78" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="326" y="92" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">独立信封（hidden doc）</text>
  <text x="326" y="112" font-size="11" fill="#2e7d32" text-anchor="middle">信封1: color=red</text>
  <text x="326" y="130" font-size="11" fill="#2e7d32" text-anchor="middle">信封2: size=L</text>
  <text x="326" y="146" font-size="11" fill="#2e7d32" text-anchor="middle">每个信封标着父文档 ID</text>

  <line x1="428" y1="109" x2="478" y2="109" stroke="#2e7d32" stroke-width="2" marker-end="url(#grn)"/>

  <rect x="482" y="70" width="278" height="78" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="621" y="92" font-size="12" font-weight="bold" fill="#795548" text-anchor="middle">父文档</text>
  <text x="621" y="112" font-size="11" fill="#3e2723" text-anchor="middle">先匹配信封，再顺 ID 找回父文档</text>
  <text x="621" y="132" font-size="11" fill="#2e7d32" text-anchor="middle">配对关系完整保留 → 命中 0 条 ✅</text>

  <rect x="20" y="168" width="740" height="86" rx="8" fill="#f5f7fa" stroke="#90a4ae" stroke-width="2"/>
  <text x="36" y="190" font-size="12" font-weight="bold" fill="#1f2933">实测：同样的跨对象查询</text>
  <text x="36" y="212" font-size="11" fill="#2e7d32">nested 索引 → hits=0   ← 正确</text>
  <text x="36" y="234" font-size="11" fill="#c62828">但普通 bool 查「同对象」 color=red → hits=0   ← 改完反而搜不到了！</text>
  <text x="36" y="250" font-size="11" fill="#795548">子文档独立存储，普通查询碰不到它们 —— 这是从 object 迁移到 nested 时最常见的事故</text>

  <!-- 代价 -->
  <rect x="20" y="268" width="740" height="136" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
  <text x="36" y="292" font-size="13" font-weight="bold" fill="#e65100">💰 代价：hidden doc 让文档数膨胀（实测 _cat/indices）</text>
  <text x="36" y="316" font-size="11" fill="#3e2723">index&nbsp;&nbsp;&nbsp;&nbsp;docs.count&nbsp;&nbsp;&nbsp;store.size</text>
  <text x="36" y="336" font-size="11" fill="#795548">ap_obj&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;12.3kb&nbsp;&nbsp;&nbsp;← object</text>
  <text x="36" y="356" font-size="11" fill="#e65100" font-weight="bold">ap_nst&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;6&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;6.2kb&nbsp;&nbsp;&nbsp;← nested：2 个顶层 + 4 个隐藏子文档</text>
  <text x="36" y="380" font-size="11" fill="#3e2723">⚠️ _count API 只统计顶层文档（查出来仍是 2），必须用 _cat/indices 才能看到 6。</text>
  <text x="36" y="398" font-size="11" fill="#bf360c">另两个代价：查询更慢（段内 join）／ 嵌套深度限额 max_nested_depth = 30</text>

  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#52606d"/></marker>
    <marker id="grn" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2e7d32"/></marker>
  </defs>
</svg>
