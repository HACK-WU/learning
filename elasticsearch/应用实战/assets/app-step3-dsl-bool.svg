<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="400" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">③ bool 三子句分工：must 管相关性、filter 管是非题、should 管加分（本机实测）</text>

  <!-- bool 容器 -->
  <rect x="24" y="48" width="812" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="430" y="70" text-anchor="middle" font-size="14" fill="#334155" font-weight="600">bool query</text>

  <rect x="44" y="82" width="246" height="82" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="167" y="102" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="600">must</text>
  <text x="167" y="122" text-anchor="middle" font-size="11" fill="#991b1b">必须匹配</text>
  <rect x="56" y="130" width="222" height="26" rx="4" fill="#fecaca"/>
  <text x="167" y="147" text-anchor="middle" font-size="11" fill="#7f1d1d" font-weight="600">✓ 参与 BM25 打分</text>

  <rect x="306" y="82" width="246" height="82" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="429" y="102" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600">filter</text>
  <text x="429" y="122" text-anchor="middle" font-size="11" fill="#166534">必须匹配</text>
  <rect x="318" y="130" width="222" height="26" rx="4" fill="#bbf7d0"/>
  <text x="429" y="147" text-anchor="middle" font-size="11" fill="#14532d" font-weight="600">✗ 不打分 · 可缓存 · 更快</text>

  <rect x="568" y="82" width="246" height="82" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="691" y="102" text-anchor="middle" font-size="13" fill="#312e81" font-weight="600">should</text>
  <text x="691" y="122" text-anchor="middle" font-size="11" fill="#4338ca">加分项</text>
  <rect x="580" y="130" width="222" height="26" rx="4" fill="#c7d2fe"/>
  <text x="691" y="147" text-anchor="middle" font-size="11" fill="#312e81" font-weight="600">↑ 只影响排序，不影响命中</text>

  <!-- 关键对照 -->
  <text x="24" y="204" font-size="14" fill="#334155" font-weight="600">关键实测对照：同一条件「price 在 1000–6000」，分别放 must 与 filter</text>

  <rect x="24" y="216" width="398" height="96" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="40" y="238" font-size="12" fill="#7f1d1d" font-weight="600">放在 must（range 参与打分）</text>
  <text x="40" y="260" font-size="12" fill="#991b1b">hits=2 ｜ 小米手机 score=1.6841192</text>
  <text x="40" y="278" font-size="12" fill="#991b1b">hits=2 ｜ 华为 Mate60 score=1.6195627</text>
  <text x="40" y="300" font-size="12" fill="#7f1d1d" font-weight="600">range 给每个文档贡献了 +1 分</text>

  <rect x="438" y="216" width="398" height="96" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="454" y="238" font-size="12" fill="#14532d" font-weight="600">放在 filter（range 不打分）</text>
  <text x="454" y="260" font-size="12" fill="#166534">hits=2 ｜ 小米手机 score=0.68411916</text>
  <text x="454" y="278" font-size="12" fill="#166534">hits=2 ｜ 华为 Mate60 score=0.61956275</text>
  <text x="454" y="300" font-size="12" fill="#14532d" font-weight="600">分数只反映关键词相关性</text>

  <!-- 底部结论 -->
  <rect x="24" y="328" width="812" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="40" y="350" font-size="13" fill="#1e3a8a" font-weight="600">命中数完全一样（都是 2 条），但 score 整整差了 1.0 —— 条件放错子句，命中一样、排序全乱。</text>
  <text x="40" y="372" font-size="13" fill="#1e40af">价格 / 库存 / 分类是「是非题」（在区间内或不在），不是「有多相关」——一律进 filter。</text>
</svg>
