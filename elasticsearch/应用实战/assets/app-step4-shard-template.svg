<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="320" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="purplearrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a21caf"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">④ 综合版：索引模板固化分片配置 —— 从事后补救到事前约定（本机实测）</text>

  <!-- 应用 -->
  <rect x="24" y="52" width="180" height="72" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="114" y="76" text-anchor="middle" font-size="13" fill="#312e81" font-weight="600">应用代码</text>
  <text x="114" y="98" text-anchor="middle" font-size="11" fill="#4338ca">只管往 shgoods-000001</text>
  <text x="114" y="114" text-anchor="middle" font-size="11" fill="#4338ca">写文档，不写 settings</text>

  <!-- 模板 -->
  <rect x="240" y="46" width="270" height="84" rx="8" fill="#fae8ff" stroke="#a21caf" stroke-width="3"/>
  <text x="375" y="70" text-anchor="middle" font-size="13" fill="#581c87" font-weight="600">索引模板 sh_tpl（本步新增）</text>
  <text x="256" y="92" font-size="11" fill="#7e22ce">index_patterns: ["shgoods-*"]</text>
  <text x="256" y="110" font-size="11" fill="#7e22ce">settings: 3 主分片 · 1 副本</text>
  <text x="256" y="124" font-size="11" fill="#7e22ce">mappings: title(IK) / brand(keyword)</text>

  <!-- 索引 -->
  <rect x="546" y="52" width="290" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="691" y="76" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600">shgoods-000001 自动继承</text>
  <text x="562" y="98" font-size="11" fill="#166534">实测 number_of_shards   = 3  ✓</text>
  <text x="562" y="116" font-size="11" fill="#166534">实测 number_of_replicas = 1  ✓</text>

  <line x1="204" y1="88" x2="236" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="88" x2="542" y2="88" stroke="#a21caf" stroke-width="2.5" marker-end="url(#purplearrow)"/>

  <!-- 对比 -->
  <text x="24" y="158" font-size="14" fill="#334155" font-weight="600">三种做法对比</text>

  <rect x="24" y="170" width="270" height="76" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="40" y="192" font-size="12" fill="#7f1d1d" font-weight="600">① 不指定（默认 1 主分片）</text>
  <text x="40" y="212" font-size="11" fill="#991b1b">小索引够用，会增长的索引是隐患</text>
  <text x="40" y="232" font-size="11" fill="#991b1b">发现时只能重建，成本最高</text>

  <rect x="306" y="170" width="270" height="76" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="322" y="192" font-size="12" fill="#92400e" font-weight="600">② 每次建索引手写 settings</text>
  <text x="322" y="212" font-size="11" fill="#a16207">能定对，但依赖人记住</text>
  <text x="322" y="232" font-size="11" fill="#a16207">迟早有一次忘记 → 回到 ①</text>

  <rect x="588" y="170" width="248" height="76" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="604" y="192" font-size="12" fill="#14532d" font-weight="600">③ 索引模板（推荐）</text>
  <text x="604" y="212" font-size="11" fill="#166534">配置平台化下发，不依赖记忆</text>
  <text x="604" y="232" font-size="11" fill="#166534">新索引自动 3 主 1 副</text>

  <!-- 收束 -->
  <rect x="24" y="264" width="812" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="40" y="288" font-size="13" fill="#1e3a8a" font-weight="600">到这一步，「分片数定错」从事后的一次大重建，变成了事前的一条配置。</text>
</svg>
