<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="400" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">③ 综合版：下钻 / 趋势 / 管道聚合 / ES|QL 四条路径（本机实测）</text>

  <!-- 源 -->
  <rect x="24" y="48" width="140" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="94" y="72" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">ap_sale</text>
  <text x="94" y="92" text-anchor="middle" font-size="11" fill="#475569">20 条 / 4 品牌</text>

  <!-- 四条路径 -->
  <rect x="196" y="44" width="160" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="276" y="66" text-anchor="middle" font-size="12" fill="#14532d" font-weight="600">下钻</text>
  <text x="276" y="86" text-anchor="middle" font-size="11" fill="#166534">子聚合套娃</text>
  <text x="276" y="100" text-anchor="middle" font-size="10" fill="#166534">brand → category</text>

  <rect x="368" y="44" width="160" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="448" y="66" text-anchor="middle" font-size="12" fill="#0c4a6e" font-weight="600">趋势</text>
  <text x="448" y="86" text-anchor="middle" font-size="11" fill="#075985">date_histogram</text>
  <text x="448" y="100" text-anchor="middle" font-size="10" fill="#075985">calendar_interval: week</text>

  <rect x="540" y="44" width="160" height="64" rx="8" fill="#fae8ff" stroke="#a21caf" stroke-width="2.5"/>
  <text x="620" y="66" text-anchor="middle" font-size="12" fill="#581c87" font-weight="600">管道聚合</text>
  <text x="620" y="86" text-anchor="middle" font-size="11" fill="#7e22ce">max_bucket</text>
  <text x="620" y="100" text-anchor="middle" font-size="10" fill="#7e22ce">在桶结果上再算</text>

  <rect x="712" y="44" width="124" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="774" y="66" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">ES|QL</text>
  <text x="774" y="86" text-anchor="middle" font-size="11" fill="#a16207">FROM | STATS</text>
  <text x="774" y="100" text-anchor="middle" font-size="10" fill="#a16207">| SORT</text>

  <line x1="164" y1="76" x2="192" y2="76" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="356" y1="76" x2="364" y2="76" stroke="#64748b" stroke-width="1.5"/>
  <line x1="528" y1="76" x2="536" y2="76" stroke="#64748b" stroke-width="1.5"/>
  <line x1="700" y1="76" x2="708" y2="76" stroke="#64748b" stroke-width="1.5"/>

  <!-- 下钻结果 -->
  <rect x="196" y="124" width="300" height="112" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="210" y="144" font-size="11" fill="#14532d" font-weight="600">嵌套下钻实测（摘录）</text>
  <text x="210" y="164" font-size="11" fill="#166534">Huawei (7单): 手机3单 557.7 / 平板2单 16131.3</text>
  <text x="210" y="182" font-size="11" fill="#166534">Xiaomi (7单): 手机3单 318.4 / 平板2单 21993.0</text>
  <text x="210" y="200" font-size="11" fill="#166534">Apple (4单): 手机2单 18170.1 / 配件1单 32495.0</text>
  <text x="210" y="222" font-size="11" fill="#14532d">两级 terms 嵌套，一层套一层</text>

  <!-- 趋势结果 -->
  <rect x="512" y="124" width="324" height="112" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="526" y="144" font-size="11" fill="#0c4a6e" font-weight="600">按周趋势实测（5 个桶）</text>
  <text x="526" y="164" font-size="11" fill="#075985">07-27: 2单 657.2 ｜ 08-03: 4单 6335.3</text>
  <text x="526" y="182" font-size="11" fill="#075985">08-10: 7单 88008.8 ｜ 08-17: 4单 33192.0</text>
  <text x="526" y="200" font-size="11" fill="#075985">08-24: 3单 12153.20</text>
  <text x="526" y="222" font-size="11" fill="#0c4a6e">⚠️ 分桶按周对齐，会出现 8 月之前的周</text>

  <!-- 管道 + ES|QL -->
  <rect x="196" y="250" width="640" height="76" rx="8" fill="#fae8ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="210" y="270" font-size="11" fill="#581c87" font-weight="600">管道聚合 max_bucket 实测：{"value":50824.3,"keys":["Apple"]}</text>
  <text x="210" y="290" font-size="11" fill="#7e22ce">不用自己遍历桶找最大值 —— ES 直接告诉你「是 Apple，50824.3」。</text>
  <text x="210" y="312" font-size="11" fill="#7e22ce">buckets_path: "by_brand&gt;total" —— 用 &gt; 指向子聚合里的指标。</text>

  <rect x="196" y="334" width="640" height="52" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="210" y="354" font-size="11" fill="#92400e" font-weight="600">ES|QL 实测（同一件事一行搞定，且已排好序）：</text>
  <text x="210" y="374" font-size="11" fill="#a16207" font-family="monospace">FROM ap_sale | STATS total = SUM(amount), orders = COUNT(*) BY brand | SORT total DESC</text>
  <text x="210" y="390" font-size="11" fill="#a16207">→ Apple 50824.3 / Xiaomi 34803.4 / Baseus 32031.8 / Huawei 22687.0（与聚合结果完全一致）</text>
</svg>
