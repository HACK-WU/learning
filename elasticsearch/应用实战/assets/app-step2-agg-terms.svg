<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="380" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="greenarrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">② 改进版：聚合下推到分片并行计算，只回传桶结果（本机实测）</text>

  <!-- 查询 -->
  <rect x="24" y="48" width="180" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="114" y="72" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600">size: 0 + aggs</text>
  <text x="114" y="92" text-anchor="middle" font-size="11" fill="#166534">terms brand + 三个子聚合</text>
  <text x="114" y="112" text-anchor="middle" font-size="11" fill="#166534">sum / avg / sum(qty)</text>

  <!-- 三分片并行 -->
  <rect x="240" y="48" width="330" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="405" y="70" text-anchor="middle" font-size="12" fill="#14532d" font-weight="600">计算下推（本步改动）· 三分片并行</text>
  <rect x="252" y="80" width="98" height="34" rx="6" fill="#bbf7d0"/>
  <text x="301" y="101" text-anchor="middle" font-size="11" fill="#14532d">分片1 本地算</text>
  <rect x="356" y="80" width="98" height="34" rx="6" fill="#bbf7d0"/>
  <text x="405" y="101" text-anchor="middle" font-size="11" fill="#14532d">分片2 本地算</text>
  <rect x="460" y="80" width="98" height="34" rx="6" fill="#bbf7d0"/>
  <text x="509" y="101" text-anchor="middle" font-size="11" fill="#14532d">分片3 本地算</text>

  <line x1="204" y1="86" x2="236" y2="86" stroke="#16a34a" stroke-width="2.5" marker-end="url(#greenarrow)"/>

  <!-- 协调 -->
  <rect x="606" y="48" width="230" height="76" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="721" y="72" text-anchor="middle" font-size="12" fill="#312e81" font-weight="600">协调节点只合并 4 个桶</text>
  <text x="721" y="94" text-anchor="middle" font-size="11" fill="#4338ca">网络传输：全量文档 → 4 个小桶</text>
  <text x="721" y="114" text-anchor="middle" font-size="11" fill="#4338ca">分片越多，并行度越高</text>

  <line x1="570" y1="86" x2="602" y2="86" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 实测表 -->
  <text x="24" y="152" font-size="14" fill="#334155" font-weight="600">实测输出：全库总额 = 140346.5，4 个品牌桶</text>
  <rect x="24" y="164" width="812" height="104" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="44" y="186" font-size="11" fill="#14532d" font-weight="600">品牌</text>
  <text x="180" y="186" font-size="11" fill="#14532d" font-weight="600">订单数</text>
  <text x="300" y="186" font-size="11" fill="#14532d" font-weight="600">总额</text>
  <text x="440" y="186" font-size="11" fill="#14532d" font-weight="600">均价</text>
  <text x="600" y="186" font-size="11" fill="#14532d" font-weight="600">件数</text>
  <line x1="44" y1="194" x2="800" y2="194" stroke="#86efac" stroke-width="1"/>
  <text x="44" y="214" font-size="11" fill="#166534">Huawei</text><text x="180" y="214" font-size="11" fill="#166534">7</text><text x="300" y="214" font-size="11" fill="#166534">22687.0</text><text x="440" y="214" font-size="11" fill="#166534">3241.0</text><text x="600" y="214" font-size="11" fill="#166534">22.0</text>
  <text x="44" y="232" font-size="11" fill="#166534">Xiaomi</text><text x="180" y="232" font-size="11" fill="#166534">7</text><text x="300" y="232" font-size="11" fill="#166534">34803.4</text><text x="440" y="232" font-size="11" fill="#166534">4971.91</text><text x="600" y="232" font-size="11" fill="#166534">31.0</text>
  <text x="44" y="250" font-size="11" fill="#166534">Apple</text><text x="180" y="250" font-size="11" fill="#166534">4</text><text x="300" y="250" font-size="11" fill="#166534">50824.3</text><text x="440" y="250" font-size="11" fill="#166534">12706.08</text><text x="600" y="250" font-size="11" fill="#166534">31.0</text>
  <text x="44" y="268" font-size="11" fill="#166534">Baseus</text><text x="180" y="268" font-size="11" fill="#166534">2</text><text x="300" y="268" font-size="11" fill="#166534">32031.8</text><text x="440" y="268" font-size="11" fill="#166534">16015.9</text><text x="600" y="268" font-size="11" fill="#166534">10.0</text>

  <!-- size 陷阱 -->
  <text x="24" y="292" font-size="14" fill="#334155" font-weight="600">⚠️ terms size 陷阱（实测）</text>
  <rect x="24" y="302" width="812" height="64" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="40" y="322" font-size="12" fill="#7f1d1d" font-weight="600">size=2 实测：返回 2 个桶（Huawei 7 / Xiaomi 7），sum_other_doc_count=6 —— 另外 6 条订单被悄悄丢了。</text>
  <text x="40" y="344" font-size="12" fill="#991b1b">terms 默认只返回前 10 个桶且是近似结果（各分片取本地 Top N 再合并）。做看板时必须显式调大 size。</text>
  <text x="40" y="360" font-size="12" fill="#991b1b">并检查 sum_other_doc_count 是否为 0 —— 这是聚合最常见的 silent bug。</text>
</svg>
