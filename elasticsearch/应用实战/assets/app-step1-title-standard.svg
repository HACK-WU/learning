<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="350" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">① 基础版：text 字段用默认 standard 分析器（本机实测）</text>

  <!-- 左：标题 -->
  <rect x="24" y="52" width="152" height="116" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="100" y="78" text-anchor="middle" font-size="14" fill="#334155" font-weight="600">商品标题</text>
  <text x="100" y="102" text-anchor="middle" font-size="12" fill="#475569">小米手机 全网通</text>
  <text x="100" y="122" text-anchor="middle" font-size="12" fill="#475569">华为手机 旗舰</text>
  <text x="100" y="142" text-anchor="middle" font-size="12" fill="#475569">手机壳 防摔</text>

  <!-- 中：standard -->
  <rect x="214" y="68" width="152" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="290" y="96" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="600">standard 分析器</text>
  <text x="290" y="118" text-anchor="middle" font-size="12" fill="#991b1b">中文逐字切分</text>
  <text x="290" y="136" text-anchor="middle" font-size="12" fill="#991b1b">每汉字一个词条</text>

  <!-- 右：倒排索引 -->
  <rect x="404" y="46" width="240" height="128" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="524" y="68" text-anchor="middle" font-size="14" fill="#7c2d12" font-weight="600">倒排索引（全是单字）</text>
  <text x="422" y="92" font-size="12" fill="#9a3412">小 → doc1</text>
  <text x="422" y="110" font-size="12" fill="#9a3412">米 → doc1</text>
  <text x="422" y="128" font-size="12" fill="#9a3412">手 → doc1, doc2, doc3</text>
  <text x="422" y="146" font-size="12" fill="#9a3412">机 → doc1, doc2, doc3</text>
  <text x="422" y="164" font-size="12" fill="#9a3412">壳 → doc3</text>

  <line x1="176" y1="110" x2="210" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="366" y1="110" x2="400" y2="110" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 查询链路 -->
  <rect x="214" y="200" width="152" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="290" y="222" text-anchor="middle" font-size="14" fill="#0c4a6e" font-weight="600">查询「手机壳」</text>
  <text x="290" y="244" text-anchor="middle" font-size="12" fill="#075985">也切成 手 / 机 / 壳</text>

  <line x1="290" y1="174" x2="290" y2="196" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 结论 -->
  <rect x="404" y="200" width="372" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="420" y="222" font-size="13" fill="#7f1d1d" font-weight="600">结果：hits=3 —— 目标文档排第一，但混进 2 条噪声</text>
  <text x="420" y="244" font-size="13" fill="#991b1b">1.3392「手机壳 防摔」｜0.2671「华为手机」｜0.2500「小米手机」</text>

  <!-- 底部 -->
  <rect x="24" y="274" width="752" height="56" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="40" y="296" font-size="13" fill="#92400e" font-weight="600">真实问题是「混入噪声」，不是「排错序」——目标文档本来就排第一（1.3392）。</text>
  <text x="40" y="318" font-size="13" fill="#a16207">别急着调 BM25：排序没坏，坏的是候选集。误诊会导致你改对了地方却解决不了问题。</text>
</svg>
