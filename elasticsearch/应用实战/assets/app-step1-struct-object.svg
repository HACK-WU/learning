<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="780" height="410" fill="#fbfcfd"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1f2933">① 基础版：object 把对象数组「撕成两摞」</text>
  <text x="20" y="52" font-size="12" fill="#7b8794">配对关系丢失 —— 查询在两摞里各查一次，交集非空就误判匹配</text>

  <!-- 原始数据 -->
  <rect x="20" y="76" width="330" height="106" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="185" y="98" font-size="12" font-weight="bold" fill="#0d47a1" text-anchor="middle">写入的两件商品（卡片）</text>
  <text x="36" y="122" font-size="11" fill="#3e2723">卡片1  夏季T恤：  [color=red]   [size=L]</text>
  <text x="36" y="142" font-size="11" fill="#3e2723">卡片2  冬季外套：[color=blue] [size=S]</text>
  <text x="36" y="168" font-size="11" fill="#1565c0">红色的是 L 码，S 码是蓝色的 —— 没有「红色 S 码」</text>

  <line x1="352" y1="129" x2="404" y2="129" stroke="#c62828" stroke-width="3" marker-end="url(#red)"/>
  <text x="378" y="121" font-size="11" fill="#c62828" text-anchor="middle">撕开</text>

  <!-- 扁平化 -->
  <rect x="408" y="70" width="352" height="118" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="584" y="92" font-size="12" font-weight="bold" fill="#b71c1c" text-anchor="middle">倒排索引里（扁平化后）</text>
  <text x="424" y="116" font-size="11" fill="#c62828">attrs.k = [color, color, size, size]</text>
  <text x="424" y="140" font-size="11" fill="#c62828">attrs.v = [red, blue, L, S]</text>
  <text x="424" y="166" font-size="11" fill="#3e2723">↑ 两摞平行数组，对象边界消失</text>
  <text x="424" y="182" font-size="11" fill="#3e2723">倒排索引只记「词 → 文档」，不记配对</text>

  <!-- 查询 -->
  <rect x="20" y="204" width="740" height="76" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="36" y="226" font-size="12" font-weight="bold" fill="#e65100">用户查询：color=red 且 size=S（应为 0 条）</text>
  <text x="36" y="248" font-size="11" fill="#3e2723">查 attrs.k=color → 命中 {doc1, doc2}      查 attrs.v=S → 命中 {doc2}      取交集 = {doc2}</text>
  <text x="36" y="270" font-size="11" fill="#c62828" font-weight="bold">它不知道 S 原本是跟 blue 配对的 —— 交集非空，判定匹配</text>

  <rect x="20" y="294" width="740" height="100" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="36" y="318" font-size="12" font-weight="bold" fill="#b71c1c">实测：搜出一件不存在的商品</text>
  <text x="36" y="340" font-size="11" fill="#3e2723">用户勾 color=red + size=S → hits=1   误配命中: {"name":"冬季外套","attrs":[{"k":"color","v":"blue"},{"k":"size","v":"S"}]}</text>
  <text x="36" y="362" font-size="11" fill="#c62828">_source 里写得清清楚楚是蓝色，但查询还是把它捞出来了 —— 用户点进去发现是 L 码，投诉客服。</text>
  <text x="36" y="384" font-size="11" fill="#3e2723">实测词项：attrs.k = [color, size] ／ attrs.v = [L, S, blue, red]   ← 两摞互不相干</text>

  <defs>
    <marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c62828"/></marker>
  </defs>
</svg>
