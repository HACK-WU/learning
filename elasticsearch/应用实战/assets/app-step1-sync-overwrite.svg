<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="840" height="330" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="redarrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">① 基础版：覆盖写无保护，迟到消息把新版本回滚（本机实测）</text>

  <!-- 时间线 -->
  <rect x="24" y="52" width="230" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="139" y="74" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">DB 侧顺序</text>
  <text x="40" y="96" font-size="11" fill="#475569">v1 price=1999 → v2 price=2999</text>

  <!-- 正常到达 -->
  <rect x="290" y="46" width="250" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="415" y="68" text-anchor="middle" font-size="12" fill="#14532d" font-weight="600">按序到达（正常）</text>
  <text x="306" y="88" font-size="10" fill="#166534">写入 v1: seq_no=0</text>
  <text x="306" y="104" font-size="10" fill="#166534">写入 v2: seq_no=1 → price=2999 ✓</text>

  <!-- 乱序 -->
  <rect x="566" y="46" width="250" height="68" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="691" y="68" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="600">v1 迟到（本步暴露）</text>
  <text x="582" y="88" font-size="10" fill="#991b1b">迟到的 v1 写入: result=updated</text>
  <text x="582" y="104" font-size="10" fill="#7f1d1d" font-weight="600">现在 price=1999, version=1 ← 回滚了！</text>

  <line x1="254" y1="80" x2="286" y2="80" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="80" x2="562" y2="80" stroke="#dc2626" stroke-width="2.5" marker-end="url(#redarrow)"/>

  <!-- 关键说明 -->
  <rect x="24" y="132" width="812" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="40" y="154" font-size="12" fill="#7f1d1d" font-weight="600">为什么 ES 不拒绝？因为 _source 里的 version 只是个普通数字。</text>
  <text x="40" y="174" font-size="11" fill="#991b1b">ES 不认识你的 version 字段 —— 写 1 写 2 都照单全收。覆盖写是「最后写入者获胜」，不管数据新旧，后到的赢。</text>
  <text x="40" y="188" font-size="11" fill="#991b1b">而消息乱序在分布式里是常态（网络抖动 / 消费者重启 / 重试队列），不是异常。</text>

  <!-- 三个问题 -->
  <text x="24" y="218" font-size="14" fill="#334155" font-weight="600">它的问题</text>
  <rect x="24" y="230" width="264" height="76" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="40" y="252" font-size="12" fill="#92400e" font-weight="600">1. ES 不认识你的 version</text>
  <text x="40" y="272" font-size="11" fill="#a16207">它只是 _source 里的普通数值，</text>
  <text x="40" y="290" font-size="11" fill="#a16207">不提供任何写保护。</text>

  <rect x="300" y="230" width="264" height="76" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="316" y="252" font-size="12" fill="#92400e" font-weight="600">2. 最后写入者获胜</text>
  <text x="316" y="272" font-size="11" fill="#a16207">不管数据新旧，后到的赢 ——</text>
  <text x="316" y="290" font-size="11" fill="#a16207">旧数据照样覆盖新数据。</text>

  <rect x="576" y="230" width="260" height="76" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="592" y="252" font-size="12" fill="#92400e" font-weight="600">3. 现象极具迷惑性</text>
  <text x="592" y="272" font-size="11" fill="#a16207">两次写入都返回成功，日志无异常，</text>
  <text x="592" y="290" font-size="11" fill="#a16207">只有用户看到价格「变回去了」。</text>
</svg>
