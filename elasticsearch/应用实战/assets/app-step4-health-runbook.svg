<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="360" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">④ 综合：三步诊断链 + 对应处置动作（判断先于动作）</text>

  <!-- 分支 -->
  <rect x="24" y="48" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="124" y="72" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">收到告警</text>
  <text x="124" y="92" text-anchor="middle" font-size="11" fill="#475569">status 非 green</text>

  <line x1="224" y1="78" x2="252" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="252" y1="78" x2="252" y2="120" stroke="#64748b" stroke-width="2"/>
  <line x1="252" y1="120" x2="276" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="252" y1="120" x2="252" y2="216" stroke="#64748b" stroke-width="2"/>
  <line x1="252" y1="216" x2="276" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- yellow 分支 -->
  <rect x="280" y="90" width="276" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="418" y="112" text-anchor="middle" font-size="12" fill="#854d0e" font-weight="600">yellow：主分片都在</text>
  <text x="418" y="134" text-anchor="middle" font-size="11" fill="#a16207">副本未分配，数据完整、可读</text>

  <rect x="580" y="90" width="256" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="708" y="112" text-anchor="middle" font-size="12" fill="#14532d" font-weight="600">处置：排期处理</text>
  <text x="708" y="134" text-anchor="middle" font-size="11" fill="#166534">查 allocation/explain → 解决分配原因</text>

  <line x1="556" y1="120" x2="576" y2="120" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- red 分支 -->
  <rect x="280" y="186" width="276" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="418" y="208" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="600">red：有主分片不在</text>
  <text x="418" y="230" text-anchor="middle" font-size="11" fill="#991b1b">该分片数据不可用，立刻响应</text>

  <rect x="580" y="186" width="256" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="708" y="208" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="600">处置：唤醒所有人</text>
  <text x="708" y="230" text-anchor="middle" font-size="11" fill="#991b1b">评估 allocate_stale_primary（可能丢数）</text>

  <line x1="556" y1="216" x2="576" y2="216" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 三条命令 -->
  <text x="24" y="278" font-size="14" fill="#334155" font-weight="600">三条命令，按顺序敲，不要跳步</text>
  <rect x="24" y="290" width="812" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="310" font-size="12" fill="#334155" font-family="monospace">① GET _cluster/health             → 定级别（status / unassigned / active_shards_percent）</text>
  <text x="40" y="328" font-size="12" fill="#334155" font-family="monospace">② GET _cat/shards?v               → 定范围（哪个索引、p 还是 r）</text>
  <text x="40" y="346" font-size="12" fill="#334155" font-family="monospace">③ GET _cluster/allocation/explain → 定原因（ES 自己说为什么分配不了）</text>
</svg>
