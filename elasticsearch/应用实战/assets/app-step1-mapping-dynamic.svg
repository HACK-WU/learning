<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="820" height="360" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="redarrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">① 基础版：不写 mapping，让 ES 动态推断（本机实测）</text>

  <!-- 左：写入 -->
  <rect x="24" y="52" width="200" height="120" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="124" y="76" text-anchor="middle" font-size="14" fill="#334155" font-weight="600">写入的文档</text>
  <text x="40" y="100" font-size="12" fill="#475569">{"name":"小米手机",</text>
  <text x="52" y="118" font-size="12" fill="#475569">"price":1999.9,</text>
  <text x="52" y="136" font-size="12" fill="#475569">"brand":"Xiaomi",</text>
  <text x="52" y="154" font-size="12" fill="#475569">"stock":50}</text>

  <!-- 中：动态映射 -->
  <rect x="256" y="52" width="180" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="346" y="76" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="600">动态映射推断</text>
  <text x="272" y="100" font-size="12" fill="#991b1b">name  → text</text>
  <rect x="268" y="108" width="156" height="22" rx="4" fill="#fecaca"/>
  <text x="272" y="124" font-size="12" fill="#7f1d1d" font-weight="600">brand → text   ← 要命</text>
  <text x="272" y="144" font-size="12" fill="#991b1b">price → float</text>
  <text x="272" y="162" font-size="12" fill="#991b1b">stock → long</text>

  <line x1="224" y1="112" x2="252" y2="112" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 右：两个需求撞墙 -->
  <rect x="468" y="52" width="328" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="632" y="76" text-anchor="middle" font-size="14" fill="#7c2d12" font-weight="600">业务诉求 → 全部撞墙</text>
  <rect x="484" y="88" width="296" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="496" y="110" font-size="12" fill="#991b1b">按品牌分桶 terms agg → ❌ all shards failed</text>
  <rect x="484" y="128" width="296" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="496" y="150" font-size="12" fill="#991b1b">按品牌排序 sort      → ❌ all shards failed</text>

  <line x1="436" y1="100" x2="464" y2="100" stroke="#dc2626" stroke-width="2.5" marker-end="url(#redarrow)"/>

  <!-- 报错原文 -->
  <rect x="256" y="192" width="540" height="76" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="272" y="214" font-size="12" fill="#7f1d1d" font-weight="600">根因（实测原文）：Fielddata is disabled on [brand]</text>
  <text x="272" y="234" font-size="12" fill="#991b1b">Text fields are not optimised for operations that require per-document</text>
  <text x="272" y="252" font-size="12" fill="#991b1b">field data like aggregations and sorting... Please use a keyword field instead.</text>

  <line x1="346" y1="172" x2="346" y2="188" stroke="#dc2626" stroke-width="2" marker-end="url(#redarrow)"/>

  <!-- 底部：精度雷 -->
  <rect x="24" y="288" width="772" height="56" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="40" y="310" font-size="13" fill="#92400e" font-weight="600">隐藏更深的雷：price 被猜成 float —— 单条回读看不出问题，但求和实测 101254.84224586934，精确值应为 101254.84（差 +0.0022）。</text>
  <text x="40" y="332" font-size="13" fill="#a16207">再加上 dynamic 默认 true：多写的 isNew 被静默推断成 text、字符串 "29" 被 coerce 转进 price —— 写入时毫无声响，查询时才爆。</text>
</svg>
