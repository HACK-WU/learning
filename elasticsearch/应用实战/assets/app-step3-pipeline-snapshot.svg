<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="400" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="greenarrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">③ 综合版：快照备份闭环 —— 给「重建索引」买后悔药（本机实测）</text>

  <!-- 闭环五步 -->
  <rect x="24" y="46" width="160" height="76" rx="8" fill="#fae8ff" stroke="#a21caf" stroke-width="2.5"/>
  <text x="104" y="68" text-anchor="middle" font-size="12" fill="#581c87" font-weight="600">① 注册仓库</text>
  <text x="104" y="90" text-anchor="middle" font-size="10" fill="#7e22ce">type: fs</text>
  <text x="104" y="108" text-anchor="middle" font-size="10" fill="#7e22ce">location 受 path.repo 约束</text>

  <rect x="200" y="46" width="160" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#14532d" font-weight="600">② 打快照</text>
  <text x="280" y="90" text-anchor="middle" font-size="10" fill="#166534">snap_1 state=SUCCESS</text>
  <text x="280" y="108" text-anchor="middle" font-size="10" fill="#166534">分片 1/1 成功</text>

  <rect x="376" y="46" width="160" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="456" y="68" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="600">③ 误删索引</text>
  <text x="456" y="90" text-anchor="middle" font-size="10" fill="#991b1b">index_not_found_exception</text>
  <text x="456" y="108" text-anchor="middle" font-size="10" fill="#991b1b">（模拟事故）</text>

  <rect x="552" y="46" width="160" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="632" y="68" text-anchor="middle" font-size="12" fill="#0c4a6e" font-weight="600">④ 恢复</text>
  <text x="632" y="90" text-anchor="middle" font-size="10" fill="#075985">snap_1 恢复完成</text>
  <text x="632" y="108" text-anchor="middle" font-size="10" fill="#075985">分片 1 成功</text>

  <rect x="728" y="46" width="108" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="782" y="68" text-anchor="middle" font-size="12" fill="#14532d" font-weight="600">⑤ 校验</text>
  <text x="782" y="90" text-anchor="middle" font-size="10" fill="#166534">文档数 = 5</text>
  <text x="782" y="108" text-anchor="middle" font-size="10" fill="#166534">一条不少</text>

  <line x1="184" y1="84" x2="196" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="84" x2="372" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="536" y1="84" x2="548" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="712" y1="84" x2="724" y2="84" stroke="#16a34a" stroke-width="1.5" marker-end="url(#greenarrow)"/>

  <!-- 踩坑 -->
  <rect x="24" y="140" width="812" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="40" y="162" font-size="12" fill="#7f1d1d" font-weight="600">⚠️ 实测踩坑：第一次用绝对路径 D:\es_backup_ap 注册仓库 → [ap_backup] failed to create repository</text>
  <text x="40" y="182" font-size="11" fill="#991b1b">原因：location 必须落在节点 path.repo 配置范围内（防任意路径写入）。本机三节点 path.repo = D:\projects\learning\elasticsearch\playground\snapshots</text>
  <text x="40" y="196" font-size="11" fill="#991b1b">正解：用其下的相对子目录 location: "l17_snapshots" —— 实测 acknowledged=True。</text>

  <!-- update_by_query 关键结论 -->
  <text x="24" y="224" font-size="14" fill="#334155" font-weight="600">③ 之前的存量补加工：update_by_query 的真实边界</text>
  <rect x="24" y="236" width="404" height="76" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="40" y="258" font-size="12" fill="#14532d" font-weight="600">✅ _source 确实被洗净了</text>
  <text x="40" y="278" font-size="10" font-family="monospace" fill="#166534">updated=1 failures=0</text>
  <text x="40" y="296" font-size="10" font-family="monospace" fill="#166534">{"price":1999.9,"name":"旧数据A","tag":["A","B"]}</text>

  <rect x="440" y="236" width="396" height="76" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="456" y="258" font-size="12" fill="#7f1d1d" font-weight="600">❌ 但聚合仍然报错</text>
  <text x="456" y="278" font-size="10" fill="#991b1b">Fielddata is disabled on [price] ...</text>
  <text x="456" y="300" font-size="11" fill="#7f1d1d" font-weight="600">update_by_query 改的是 _source，改不了 mapping！</text>

  <!-- 收束 -->
  <rect x="24" y="328" width="812" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="40" y="348" font-size="12" fill="#1e3a8a" font-weight="600">本篇最容易被忽略的坑：清洗 _source ≠ 修复 mapping。</text>
  <text x="40" y="366" font-size="12" fill="#1e40af">存量数据的类型错误，最终仍要靠「建新索引 + reindex」—— 而动重建之前，先确认快照可用。</text>
  <text x="40" y="378" font-size="11" fill="#1e40af">实测恢复后 5 条数据：商品1(100) / 商品2(200) / 商品3(300) / 商品4(400) / 商品5(500)，完整还原。</text>
</svg>
