<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="780" height="400" fill="#fbfcfd"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1f2933">④ 综合版：ES 退回「只读副本」，源头才是账本</text>
  <text x="20" y="52" font-size="12" fill="#7b8794">读写分流（高亮处）—— 写只打源头；右边 reindex 虚线是「丢了能重建」的关键动作</text>

  <rect x="20" y="76" width="150" height="76" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="95" y="104" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle">业务系统</text>
  <text x="95" y="126" font-size="11" fill="#c62828" text-anchor="middle">写 → 只写源头</text>
  <text x="95" y="144" font-size="11" fill="#2e7d32" text-anchor="middle">读 → 走 ES 检索</text>

  <!-- 写：到源头 -->
  <line x1="172" y1="112" x2="292" y2="86" stroke="#c62828" stroke-width="3" marker-end="url(#red)"/>
  <text x="238" y="92" font-size="11" fill="#c62828" text-anchor="middle">写</text>
  <!-- 读：从ES -->
  <line x1="292" y1="196" x2="172" y2="150" stroke="#2e7d32" stroke-width="3" marker-end="url(#grn)"/>
  <text x="196" y="188" font-size="11" fill="#2e7d32" text-anchor="middle">读</text>

  <!-- 源头 -->
  <rect x="296" y="62" width="212" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="402" y="86" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">MySQL（源头账本）</text>
  <text x="402" y="106" font-size="11" fill="#2e7d32" text-anchor="middle">唯一可写，永不删除</text>
  <text x="402" y="124" font-size="11" font-weight="bold" fill="#1b5e20" text-anchor="middle">订单 A / B / C</text>

  <!-- ES 副本 -->
  <rect x="296" y="162" width="212" height="70" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <text x="402" y="186" font-size="13" font-weight="bold" fill="#795548" text-anchor="middle">ap_orders_view（ES）</text>
  <text x="402" y="206" font-size="11" fill="#795548" text-anchor="middle">只读副本，丢了无所谓</text>
  <text x="402" y="224" font-size="11" fill="#e65100" text-anchor="middle">检索 / 聚合专用</text>

  <!-- reindex 虚线 -->
  <line x1="402" y1="134" x2="402" y2="160" stroke="#1565c0" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#blu)"/>
  <text x="412" y="152" font-size="11" fill="#1565c0">reindex 同步</text>

  <!-- 重建验证 -->
  <rect x="530" y="62" width="230" height="170" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="645" y="86" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle">实测：删掉副本再重建</text>
  <text x="546" y="110" font-size="11" fill="#c62828">DELETE 副本后查：</text>
  <text x="546" y="128" font-size="11" fill="#c62828">index_not_found_exception</text>
  <text x="546" y="152" font-size="11" fill="#2e7d32">reindex 重建 created=3</text>
  <text x="546" y="176" font-size="11" fill="#1b5e20" font-weight="bold">副本 hits=3 合计=2100.0</text>
  <text x="546" y="196" font-size="11" fill="#1b5e20" font-weight="bold">源头 hits=3 合计=2100.0</text>
  <text x="546" y="220" font-size="11" fill="#1565c0">两边金额一致 → 可完整还原</text>

  <!-- 结论 -->
  <rect x="20" y="256" width="740" height="128" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="36" y="280" font-size="13" font-weight="bold" fill="#1b5e20">🔑 一句话判断标准：ES 是索引副本，不是原始账本</text>
  <text x="36" y="304" font-size="11" fill="#2e7d32">回到评审会：同事方案错在「MySQL 那边就不维护了」—— 订单是原始账本，把 ES 当唯一数据源，丢一条就是丢一笔订单且无法对账。</text>
  <text x="36" y="326" font-size="11" fill="#2e7d32">改法只有一步：写仍然只打 MySQL，ES 作为只读副本，随时可从源头 reindex 重建（本篇实测已验证金额两边一致）。</text>
  <text x="36" y="350" font-size="11" font-weight="bold" fill="#1b5e20">🎯 会用标志：听到「用 ES 替掉 MySQL」能立刻反问三个问题 —— 要不要多文档事务？要不要写完立刻查到？数据丢了能不能重建？</text>
  <text x="36" y="372" font-size="11" fill="#2e7d32">附带一条静默杀手：聚合可疑时先看 doc_count_error_upper_bound，不是 0 就别拿去汇报（50 分片实测误差上界 103）。</text>

  <defs>
    <marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c62828"/></marker>
    <marker id="grn" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2e7d32"/></marker>
    <marker id="blu" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/></marker>
  </defs>
</svg>
