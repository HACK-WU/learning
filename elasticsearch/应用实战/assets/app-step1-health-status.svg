<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="840" height="330" fill="#fbfcfd"/>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">① 基础版：只看 status 一个字段（本机实测基线）</text>

  <!-- health 返回 -->
  <rect x="24" y="48" width="330" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="189" y="70" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">_cluster/health 返回</text>
  <rect x="40" y="80" width="298" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="189" y="99" text-anchor="middle" font-size="12" fill="#14532d" font-weight="600">status = green   ← 大多数人只看这里</text>

  <text x="40" y="130" font-size="12" fill="#94a3b8">active_primary_shards = 106   ← 决定数据是否完整</text>
  <text x="40" y="150" font-size="12" fill="#94a3b8">unassigned_shards     = 0     ← 决定影响范围</text>
  <text x="40" y="170" font-size="12" fill="#94a3b8">active_shards_percent         ← 决定紧急程度</text>
  <text x="40" y="190" font-size="12" fill="#94a3b8">relocating / initializing     ← 决定是否在变动中</text>
  <text x="40" y="216" font-size="11" fill="#64748b">（灰掉的部分才是关键，却常被忽略）</text>

  <!-- 三档 -->
  <rect x="386" y="48" width="430" height="180" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="601" y="70" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">status 三档的真实含义</text>

  <rect x="402" y="82" width="398" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="416" y="100" font-size="11" fill="#14532d" font-weight="600">green　所有主分片 + 副本都在</text>
  <text x="416" y="118" font-size="11" fill="#166534">数据没丢，服务可用</text>

  <rect x="402" y="128" width="398" height="42" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="416" y="146" font-size="11" fill="#854d0e" font-weight="600">yellow　所有主分片在，部分副本不在</text>
  <text x="416" y="164" font-size="11" fill="#a16207">数据没丢，服务可用（冗余度下降）</text>

  <rect x="402" y="174" width="398" height="42" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="416" y="192" font-size="11" fill="#7f1d1d" font-weight="600">red　有主分片不在</text>
  <text x="416" y="210" font-size="11" fill="#991b1b">该分片数据不可用，部分索引不可用</text>

  <!-- 问题 -->
  <text x="24" y="254" font-size="14" fill="#334155" font-weight="600">只看 status 的三个问题</text>
  <rect x="24" y="266" width="792" height="48" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="40" y="286" font-size="12" fill="#92400e">1. red 不告诉你丢了几个、是哪个索引 —— 老板问「丢了吗」你答不上来。</text>
  <text x="40" y="306" font-size="12" fill="#a16207">2. yellow 与 red 优先级完全不同，只看一个词容易过度反应（急着重启，反而把 yellow 搞成 red）。</text>
</svg>
