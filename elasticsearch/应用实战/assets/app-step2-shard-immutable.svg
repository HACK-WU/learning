<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="380" fill="#fbfcfd"/>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">② 为什么改不了：路由公式的分母（本机实测报错原文）</text>

  <!-- 左：路由公式 -->
  <rect x="24" y="48" width="404" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="226" y="72" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="600">主分片数 = 路由公式的分母</text>
  <rect x="44" y="84" width="364" height="34" rx="6" fill="#fee2e2"/>
  <text x="226" y="106" text-anchor="middle" font-size="13" fill="#7f1d1d" font-family="monospace" font-weight="600">shard = hash(_routing) % num_primary_shards</text>
  <text x="44" y="140" font-size="12" fill="#991b1b">文档落在哪个分片，由 _id 哈希对「主分片数」取模决定。</text>
  <text x="44" y="160" font-size="12" fill="#991b1b">分母一变 → 所有文档的归属全变 → 整个索引要重排。</text>
  <text x="44" y="182" font-size="12" fill="#7f1d1d" font-weight="600">所以 ES 干脆禁止：cannot be modified once created。</text>

  <!-- 右：副本 -->
  <rect x="448" y="48" width="388" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="642" y="72" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600">副本只是拷贝，所以能改</text>
  <rect x="468" y="84" width="348" height="34" rx="6" fill="#bbf7d0"/>
  <text x="642" y="106" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600">副本 = 主分片的完整拷贝</text>
  <text x="468" y="140" font-size="12" fill="#166534">加一份减一份，不影响寻址（路由仍指向主分片）。</text>
  <text x="468" y="160" font-size="12" fill="#166534">实测：number_of_replicas 1 → 2，acknowledged=True</text>
  <text x="468" y="182" font-size="12" fill="#14532d" font-weight="600">而同一请求改 number_of_shards 直接 400。</text>

  <!-- 实测报错 -->
  <text x="24" y="224" font-size="14" fill="#334155" font-weight="600">实测报错原文（改 number_of_shards: 3）</text>
  <rect x="24" y="236" width="812" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="258" font-size="12" fill="#7f1d1d" font-weight="600">illegal_argument_exception</text>
  <text x="40" y="278" font-size="12" fill="#991b1b">Can't update non dynamic setting(s) [[index.number_of_shards]] for open indices...</text>
  <text x="40" y="298" font-size="12" fill="#991b1b">The setting(s) cannot be modified on an index once created.</text>
  <text x="40" y="304" font-size="10" fill="#475569">　</text>

  <!-- 对比 -->
  <text x="24" y="338" font-size="14" fill="#334155" font-weight="600">同一个 _settings 接口，两种命运</text>
  <rect x="24" y="350" width="404" height="24" rx="6" fill="#fee2e2"/>
  <text x="40" y="366" font-size="12" fill="#7f1d1d" font-weight="600">number_of_shards   → 400 报错（不可变）</text>
  <rect x="448" y="350" width="388" height="24" rx="6" fill="#dcfce7"/>
  <text x="464" y="366" font-size="12" fill="#14532d" font-weight="600">number_of_replicas → acknowledged=True（可改）</text>
</svg>
