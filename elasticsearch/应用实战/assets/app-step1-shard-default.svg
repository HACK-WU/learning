<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="840" height="330" fill="#fbfcfd"/>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">① 基础版：不指定分片数，用 ES 默认（本机实测）</text>

  <!-- 默认配置 -->
  <rect x="24" y="48" width="230" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="139" y="72" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">实测默认配置</text>
  <text x="40" y="96" font-size="12" fill="#dc2626">number_of_shards   = 1</text>
  <text x="40" y="116" font-size="12" fill="#475569">number_of_replicas = 1</text>
  <text x="40" y="132" font-size="11" fill="#64748b">（ES 9.x 默认主分片为 1）</text>

  <!-- 节点分布 -->
  <rect x="290" y="48" width="526" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="553" y="70" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="600">3 节点集群的实际分布</text>

  <rect x="306" y="82" width="150" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="381" y="100" text-anchor="middle" font-size="11" fill="#7f1d1d" font-weight="600">node-1</text>
  <text x="381" y="118" text-anchor="middle" font-size="11" fill="#991b1b">R0（副本）</text>

  <rect x="470" y="82" width="150" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="545" y="100" text-anchor="middle" font-size="11" fill="#7f1d1d" font-weight="600">node-2</text>
  <text x="545" y="118" text-anchor="middle" font-size="11" fill="#991b1b">P0（主分片）</text>

  <rect x="634" y="82" width="164" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="716" y="100" text-anchor="middle" font-size="11" fill="#64748b" font-weight="600">node-3</text>
  <text x="716" y="118" text-anchor="middle" font-size="11" fill="#94a3b8">（完全空闲）</text>

  <!-- 问题 -->
  <text x="24" y="172" font-size="14" fill="#334155" font-weight="600">隐患：分布式能力等于没用上</text>

  <rect x="24" y="184" width="264" height="82" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="40" y="206" font-size="12" fill="#92400e" font-weight="600">1. 读写压力全在 P0</text>
  <text x="40" y="226" font-size="11" fill="#a16207">所有写入与查询都打到这一个主分片，</text>
  <text x="40" y="244" font-size="11" fill="#a16207">另外两个节点只是旁观。</text>

  <rect x="300" y="184" width="264" height="82" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="316" y="206" font-size="12" fill="#92400e" font-weight="600">2. 单分片有容量上限</text>
  <text x="316" y="226" font-size="11" fill="#a16207">推荐单分片 20–50GB。数据一涨，</text>
  <text x="316" y="244" font-size="11" fill="#a16207">一个分片装不下也没法横向拆。</text>

  <rect x="576" y="184" width="240" height="82" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="592" y="206" font-size="12" fill="#92400e" font-weight="600">3. 发现时已经晚了</text>
  <text x="592" y="226" font-size="11" fill="#a16207">主分片数建完就不能改，只能重建。</text>
  <text x="592" y="244" font-size="11" fill="#a16207">——这就是下一张图要解决的问题。</text>

  <rect x="24" y="284" width="792" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="40" y="305" font-size="12" fill="#1e40af">一句话：默认 1 主分片对小索引是好事，对会增长的索引是隐患 —— 因为主分片数一旦创建就不可变。</text>
</svg>
