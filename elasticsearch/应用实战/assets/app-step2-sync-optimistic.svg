<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="340" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="greenarrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="redarrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">② 改进版：_seq_no + _primary_term 乐观锁（本机实测）</text>

  <!-- 读 seq_no -->
  <rect x="24" y="46" width="180" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="114" y="68" text-anchor="middle" font-size="12" fill="#0c4a6e" font-weight="600">① 先读 seq_no</text>
  <text x="114" y="90" text-anchor="middle" font-size="10" fill="#075985">当前 seq_no=3</text>

  <line x1="204" y1="76" x2="232" y2="76" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 两个请求 -->
  <rect x="236" y="40" width="200" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="336" y="62" text-anchor="middle" font-size="12" fill="#14532d" font-weight="600">② 请求1（先到）</text>
  <text x="252" y="82" font-size="10" fill="#166534">if_seq_no=3 → 匹配成功</text>
  <text x="252" y="100" font-size="10" fill="#14532d" font-weight="600">result=updated，seq_no 推进到 4</text>

  <rect x="236" y="122" width="200" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="336" y="144" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="600">③ 请求2（后到）</text>
  <text x="252" y="164" font-size="10" fill="#991b1b">if_seq_no=3 → 已过期</text>
  <text x="252" y="182" font-size="10" fill="#7f1d1d" font-weight="600">409 version_conflict_engine_exception</text>

  <line x1="336" y1="112" x2="336" y2="118" stroke="#dc2626" stroke-width="2"/>

  <!-- 结果 -->
  <rect x="464" y="46" width="372" height="148" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="650" y="68" text-anchor="middle" font-size="12" fill="#14532d" font-weight="600">实测结果：请求2 被挡住，数据保持正确</text>
  <text x="480" y="92" font-size="11" font-family="monospace" fill="#166534">请求1（基于 seq_no=3）: result=updated</text>
  <text x="480" y="112" font-size="11" font-family="monospace" fill="#dc2626">请求2（基于同一 seq_no）: 409</text>
  <text x="480" y="132" font-size="11" font-family="monospace" fill="#166534">最终: {"name":"手机A","price":1111,"version":3}</text>
  <text x="480" y="158" font-size="11" fill="#14532d" font-weight="600">旧数据被挡在外面 —— 不再回滚。</text>
  <text x="480" y="178" font-size="10" fill="#166534">seq_no 是集群级的，跨主分片切换仍可靠。</text>

  <line x1="436" y1="110" x2="460" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#greenarrow)"/>

  <!-- 缺点 -->
  <text x="24" y="222" font-size="14" fill="#334155" font-weight="600">它的代价</text>
  <rect x="24" y="234" width="404" height="76" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="40" y="256" font-size="12" fill="#92400e" font-weight="600">1. 需要先读一次才能写</text>
  <text x="40" y="276" font-size="11" fill="#a16207">多一次网络往返，吞吐量受影响。</text>

  <rect x="440" y="234" width="396" height="76" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="456" y="256" font-size="12" fill="#92400e" font-weight="600">2. 挡住 ≠ 处理好</text>
  <text x="456" y="276" font-size="11" fill="#a16207">409 之后是重试、丢弃还是告警？这套逻辑要自己写。</text>
  <text x="456" y="296" font-size="11" fill="#a16207">3. 它防「基于过期状态的写入」，防不了「版本号小的消息」。</text>

  <rect x="24" y="316" width="812" height="18" rx="4" fill="#eff6ff"/>
  <text x="40" y="329" font-size="11" fill="#1e40af">若业务语义就是「版本号小的丢弃」，改用 script 一次请求搞定 —— 见正文第 ③ 节。</text>
</svg>
