<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="780" height="420" fill="#fbfcfd"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1f2933">④ 收尾：rollover 滚动 + 读写分流</text>
  <text x="20" y="52" font-size="12" fill="#7b8794">搜索跨全部后备索引，写入只进最新那个（is_write_index）</text>

  <rect x="20" y="76" width="150" height="76" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="95" y="102" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle">应用</text>
  <text x="95" y="124" font-size="11" fill="#2e7d32" text-anchor="middle">读 → 跨全部</text>
  <text x="95" y="144" font-size="11" fill="#c62828" text-anchor="middle">写 → 只进最新</text>

  <rect x="220" y="76" width="190" height="76" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="315" y="100" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">别名 ap_ro2_alias</text>
  <text x="315" y="120" font-size="11" fill="#2e7d32" text-anchor="middle">同时指向两个后备索引</text>
  <text x="315" y="140" font-size="11" fill="#2e7d32" text-anchor="middle">滚动后自动接上新索引</text>

  <line x1="172" y1="98" x2="218" y2="98" stroke="#2e7d32" stroke-width="3" marker-end="url(#grn)"/>
  <line x1="172" y1="132" x2="218" y2="132" stroke="#c62828" stroke-width="3" marker-end="url(#red)"/>

  <rect x="460" y="62" width="300" height="62" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="610" y="84" font-size="12" font-weight="bold" fill="#795548" text-anchor="middle">ap_ro2-000001（旧，封存）</text>
  <text x="482" y="106" font-size="11" fill="#3e2723">old1 / old2 / old3   只读，仍可被搜到</text>

  <rect x="460" y="136" width="300" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="610" y="158" font-size="12" font-weight="bold" fill="#0d47a1" text-anchor="middle">ap_ro2-000002（新，写入目标）</text>
  <text x="482" y="180" font-size="11" fill="#1565c0">NEW-DOC   滚动后新写入落这里 ← is_write_index</text>

  <line x1="412" y1="98" x2="458" y2="98" stroke="#2e7d32" stroke-width="2" marker-end="url(#grn)"/>
  <line x1="412" y1="160" x2="458" y2="160" stroke="#c62828" stroke-width="3" marker-end="url(#red)"/>

  <rect x="220" y="176" width="190" height="34" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="315" y="198" font-size="11" fill="#e65100" text-anchor="middle">rollover: max_docs = 3 触发</text>

  <rect x="20" y="228" width="740" height="86" rx="8" fill="#f5f7fa" stroke="#90a4ae" stroke-width="2"/>
  <text x="36" y="250" font-size="12" font-weight="bold" fill="#1f2933">实测：滚动后经别名搜索 hits=4（跨全部），写入只落新索引</text>
  <text x="36" y="272" font-size="11" fill="#3e2723">_index=ap_ro2-000001  old1 ／ old2 ／ old3</text>
  <text x="36" y="290" font-size="11" fill="#1565c0">_index=ap_ro2-000002  NEW-DOC   ← 滚动后新写入落在这里</text>
  <text x="36" y="308" font-size="11" fill="#2e7d32">rollover: old=ap_ro2-000001  new=ap_ro2-000002  rolled_over=true，应用一行代码没改</text>

  <rect x="20" y="328" width="740" height="78" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="36" y="350" font-size="12" font-weight="bold" fill="#b71c1c">⚠ 两个硬约束 + 一个顺带复现的老坑</text>
  <text x="36" y="370" font-size="11" fill="#3e2723">① is_write_index 不能省：不指定就写入报 no write index is defined for alias [...]</text>
  <text x="36" y="388" font-size="11" fill="#3e2723">② rollover 只能作用于别名或 data stream：对具体索引调报 rollover target is a [concrete index]</text>
  <text x="36" y="404" font-size="11" fill="#c62828">③ 验证时用 term 查 text 字段得 0 条 —— 中文被切成 写/入/新/索/引。排查第一条永远是：查映射确认字段类型。</text>

  <defs>
    <marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c62828"/></marker>
    <marker id="grn" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2e7d32"/></marker>
  </defs>
</svg>
