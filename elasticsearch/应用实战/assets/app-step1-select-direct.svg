<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="780" height="400" fill="#fbfcfd"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1f2933">① 基础版：把 ES 当唯一数据源（评审会上的方案）</text>
  <text x="20" y="52" font-size="12" fill="#7b8794">MySQL 不维护了 —— 读写全打在 ES 上，四个风险点已标注</text>

  <rect x="20" y="80" width="150" height="76" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="95" y="108" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle">业务系统</text>
  <text x="95" y="128" font-size="11" fill="#1565c0" text-anchor="middle">读 + 写</text>
  <text x="95" y="146" font-size="11" fill="#1565c0" text-anchor="middle">下单 / 查列表</text>

  <!-- 写箭头 -->
  <line x1="172" y1="106" x2="300" y2="106" stroke="#c62828" stroke-width="3" marker-end="url(#red)"/>
  <text x="236" y="98" font-size="11" fill="#c62828" text-anchor="middle">写</text>
  <!-- 读箭头 -->
  <line x1="300" y1="140" x2="172" y2="140" stroke="#2e7d32" stroke-width="3" marker-end="url(#grn)"/>
  <text x="236" y="158" font-size="11" fill="#2e7d32" text-anchor="middle">读</text>

  <rect x="304" y="76" width="196" height="86" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <text x="402" y="100" font-size="13" font-weight="bold" fill="#795548" text-anchor="middle">ap_orders_view（ES）</text>
  <text x="402" y="120" font-size="11" fill="#e65100" text-anchor="middle">被当成「唯一数据源」</text>
  <text x="402" y="140" font-size="11" fill="#795548" text-anchor="middle">订单 A / B / C</text>
  <text x="402" y="156" font-size="11" fill="#c62828" text-anchor="middle">丢了就无法对账</text>

  <!-- 源头虚线 -->
  <line x1="304" y1="180" x2="180" y2="240" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="20" y="240" width="170" height="56" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="105" y="264" font-size="12" font-weight="bold" fill="#546e7a" text-anchor="middle">MySQL（源头）</text>
  <text x="105" y="284" font-size="11" fill="#c62828" text-anchor="middle">「不维护了」← 方案的错误</text>

  <!-- 四个坑 -->
  <rect x="528" y="76" width="232" height="300" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="644" y="100" font-size="13" font-weight="bold" fill="#b71c1c" text-anchor="middle">四个坑（本篇实测复现）</text>
  <text x="546" y="128" font-size="11" font-weight="bold" fill="#c62828">① 近实时</text>
  <text x="546" y="146" font-size="11" fill="#3e2723">写入后立刻 _search → hits=0</text>
  <text x="546" y="164" font-size="11" fill="#3e2723">用户看到空白订单列表</text>
  <text x="546" y="192" font-size="11" font-weight="bold" fill="#c62828">② 无事务</text>
  <text x="546" y="210" font-size="11" fill="#3e2723">扣库存成功、建单失败</text>
  <text x="546" y="228" font-size="11" fill="#3e2723">库存不回滚 → 对不上账</text>
  <text x="546" y="256" font-size="11" font-weight="bold" fill="#c62828">③ 无 JOIN</text>
  <text x="546" y="274" font-size="11" fill="#3e2723">ES|QL JOIN → 400 解析失败</text>
  <text x="546" y="306" font-size="11" font-weight="bold" fill="#c62828">④ 聚合不准</text>
  <text x="546" y="324" font-size="11" fill="#3e2723">50 分片误差上界 103</text>
  <text x="546" y="342" font-size="11" fill="#3e2723">不报错，只是数字不对</text>
  <text x="546" y="364" font-size="11" fill="#c62828" font-weight="bold">前三个会响，第四个静默</text>

  <defs>
    <marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c62828"/></marker>
    <marker id="grn" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2e7d32"/></marker>
  </defs>
</svg>
