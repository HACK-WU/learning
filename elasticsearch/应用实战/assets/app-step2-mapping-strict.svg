<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="820" height="350" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="greenarrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">② 改进版：显式 mapping + dynamic:strict（高亮 = 本步改动，本机实测）</text>

  <!-- 左：显式 mapping -->
  <rect x="24" y="52" width="230" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="139" y="76" text-anchor="middle" font-size="14" fill="#14532d" font-weight="600">显式 mapping</text>
  <rect x="36" y="88" width="206" height="24" rx="4" fill="#bbf7d0"/>
  <text x="44" y="105" font-size="12" fill="#14532d" font-weight="600">"dynamic": "strict"  ← 本步新增</text>
  <text x="44" y="132" font-size="12" fill="#166534">name  → text + IK</text>
  <rect x="40" y="140" width="198" height="22" rx="4" fill="#bbf7d0"/>
  <text x="44" y="156" font-size="12" fill="#14532d" font-weight="600">brand → keyword  ← 改动</text>
  <rect x="40" y="166" width="198" height="22" rx="4" fill="#bbf7d0"/>
  <text x="44" y="182" font-size="12" fill="#14532d" font-weight="600">price → scaled_float ← 改动</text>
  <text x="44" y="196" font-size="12" fill="#166534">stock → integer</text>

  <!-- 中：闸门 -->
  <rect x="290" y="76" width="200" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="390" y="100" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="600">写入闸门</text>
  <text x="390" y="124" text-anchor="middle" font-size="12" fill="#991b1b">多写 isNew 字段？</text>
  <rect x="306" y="132" width="168" height="30" rx="6" fill="#fecaca"/>
  <text x="390" y="152" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="600">当场报错，写不进去</text>

  <line x1="254" y1="126" x2="286" y2="126" stroke="#16a34a" stroke-width="2.5" marker-end="url(#greenarrow)"/>

  <!-- 右：打通 -->
  <rect x="526" y="76" width="268" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="100" text-anchor="middle" font-size="14" fill="#14532d" font-weight="600">keyword 走 doc_values</text>
  <text x="542" y="124" font-size="12" fill="#166534">✅ 按 brand 分桶 —— 通了</text>
  <text x="542" y="144" font-size="12" fill="#166534">✅ 按 brand 排序 —— 通了</text>
  <text x="542" y="164" font-size="12" fill="#166534">✅ 金额精度 —— 保住了</text>

  <line x1="490" y1="126" x2="522" y2="126" stroke="#16a34a" stroke-width="2.5" marker-end="url(#greenarrow)"/>

  <!-- 报错原文 -->
  <rect x="290" y="196" width="504" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="306" y="218" font-size="12" fill="#7f1d1d" font-weight="600">实测报错原文：</text>
  <text x="306" y="240" font-size="12" fill="#991b1b">mapping set to strict, dynamic introduction of [isNew] within [_doc] is not allowed</text>

  <line x1="390" y1="176" x2="390" y2="192" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部：遗留 -->
  <rect x="24" y="272" width="770" height="60" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="40" y="294" font-size="13" fill="#92400e" font-weight="600">本步解决了：脏数据进不来、聚合排序打通、金额精度保住（avg_price = 1009.9000000000001）。</text>
  <text x="40" y="316" font-size="13" fill="#a16207">⚠️ 遗留：brand 变 keyword 后【不能全文搜】了；name 是 text 又【不能排序】——一个字段只能一种用法。</text>
  <text x="40" y="334" font-size="13" fill="#a16207">⚠️ 而且类型改错 = 重建索引，返工成本已经在账上了。</text>
</svg>
