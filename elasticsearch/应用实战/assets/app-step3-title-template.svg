<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="350" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#334155" font-weight="600">③ 综合版：索引模板 + 别名 —— 让重建对应用透明（高亮 = 本步新增，本机实测）</text>

  <!-- 应用 -->
  <rect x="24" y="56" width="130" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="89" y="80" text-anchor="middle" font-size="14" fill="#312e81" font-weight="600">应用代码</text>
  <text x="89" y="100" text-anchor="middle" font-size="12" fill="#4338ca">只写 goods</text>

  <!-- 别名（新增） -->
  <rect x="194" y="56" width="140" height="60" rx="8" fill="#fae8ff" stroke="#a21caf" stroke-width="3"/>
  <text x="264" y="80" text-anchor="middle" font-size="14" fill="#581c87" font-weight="600">别名 goods</text>
  <text x="264" y="100" text-anchor="middle" font-size="12" fill="#7e22ce">切换零停机</text>

  <!-- 索引模板（新增） -->
  <rect x="374" y="46" width="200" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="474" y="70" text-anchor="middle" font-size="14" fill="#14532d" font-weight="600">索引模板 goods_tpl</text>
  <text x="474" y="90" text-anchor="middle" font-size="12" fill="#166534">goods-* 自动套用 IK 配置</text>
  <text x="474" y="110" text-anchor="middle" font-size="12" fill="#166534">杜绝「下次又忘了配」</text>

  <!-- 索引 -->
  <rect x="614" y="56" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="689" y="80" text-anchor="middle" font-size="14" fill="#334155" font-weight="600">goods-v2</text>
  <text x="689" y="100" text-anchor="middle" font-size="12" fill="#475569">真实索引</text>

  <line x1="154" y1="86" x2="190" y2="86" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="334" y1="86" x2="368" y2="86" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="574" y1="86" x2="610" y2="86" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 重建动作 -->
  <rect x="374" y="160" width="390" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="390" y="184" font-size="13" fill="#334155" font-weight="600">重建三步（可重复执行）：</text>
  <text x="390" y="206" font-size="12" fill="#475569">① 改模板 goods_tpl 的 analyzer   ② _reindex 到 goods-v3   ③ _aliases 切换指针</text>
  <text x="390" y="222" font-size="12" fill="#475569">全程应用无感——它从头到尾只认识 goods 这一个名字。</text>

  <line x1="474" y1="126" x2="474" y2="156" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 实测结果 -->
  <rect x="24" y="160" width="320" height="70" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="40" y="184" font-size="13" fill="#14532d" font-weight="600">实测（经别名查询）：</text>
  <text x="40" y="206" font-size="12" fill="#166534">goods 搜「手机壳」  → hits=1  ✅</text>
  <text x="40" y="222" font-size="12" fill="#166534">goods 搜「小米手机」→ hits=3  （与直查一致）</text>

  <!-- 底部 -->
  <rect x="24" y="256" width="740" height="76" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="40" y="280" font-size="13" fill="#1e3a8a" font-weight="600">为什么这一步才算「会用」：</text>
  <text x="40" y="302" font-size="13" fill="#1e40af">分词配错在生产环境是迟早的事，真正的能力不是「一次配对」，而是「配错了能低成本改回来」。</text>
  <text x="40" y="322" font-size="13" fill="#1e40af">模板管住配置（不再依赖人记住）、别名管住入口（切换不碰代码）——两者合起来把事故降级为例行操作。</text>
</svg>
