<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Data Stream：后备索引按时间/大小自动滚动</text>

  <rect x="24" y="56" width="140" height="44" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="94" y="76" text-anchor="middle" font-size="12" fill="#0d47a1">应用只写</text>
  <text x="94" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">logs（数据流名）</text>

  <polygon points="176,78 206,65 206,91" fill="#4527a0"/>

  <rect x="214" y="52" width="230" height="52" rx="5" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5"/>
  <text x="329" y="72" text-anchor="middle" font-size="11" fill="#311b92">写索引 = 最新的后备索引</text>
  <text x="329" y="90" text-anchor="middle" font-size="11" fill="#311b92">.ds-logs-000003（is_write_index）</text>

  <polygon points="454,78 484,65 484,91" fill="#4527a0"/>

  <rect x="492" y="52" width="204" height="52" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="594" y="72" text-anchor="middle" font-size="11" fill="#1b5e20">查询 = 全部后备索引</text>
  <text x="594" y="90" text-anchor="middle" font-size="11" fill="#1b5e20">000001 + 000002 + 000003</text>

  <rect x="60" y="126" width="600" height="76" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1"/>
  <text x="76" y="148" font-size="11" fill="#424242">rollover 触发（谁先到按谁来）</text>
  <rect x="80" y="156" width="176" height="32" rx="4" fill="#ffffff" stroke="#bdbdbd"/>
  <text x="168" y="177" text-anchor="middle" font-size="11" fill="#424242">单分片 30~50 GB</text>
  <rect x="272" y="156" width="176" height="32" rx="4" fill="#ffffff" stroke="#bdbdbd"/>
  <text x="360" y="177" text-anchor="middle" font-size="11" fill="#424242">或 1 天</text>
  <rect x="464" y="156" width="176" height="32" rx="4" fill="#ffffff" stroke="#bdbdbd"/>
  <text x="552" y="177" text-anchor="middle" font-size="11" fill="#424242">或 2 亿条</text>

  <rect x="60" y="216" width="600" height="96" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="76" y="238" font-size="12" font-weight="bold" fill="#b71c1c">失效点：只追加 + ILM 轮询默认 10 分钟</text>

  <rect x="80" y="248" width="280" height="52" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="220" y="268" text-anchor="middle" font-size="11" fill="#b71c1c">Data Stream 是只追加的</text>
  <text x="220" y="286" text-anchor="middle" font-size="10" fill="#7f0000">改/删单条须先定位到具体后备索引</text>

  <rect x="376" y="248" width="284" height="52" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="518" y="268" text-anchor="middle" font-size="11" fill="#b71c1c">ILM 不是实时的</text>
  <text x="518" y="286" text-anchor="middle" font-size="10" fill="#7f0000">poll_interval 默认 10m，配完不会立刻生效</text>
</svg>
