<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="720" height="310" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">shrink 缩分片：不用重建，但三个硬条件缺一不可</text>

  <rect x="24" y="66" width="170" height="60" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="109" y="88" text-anchor="middle" font-size="12" fill="#0d47a1">源索引</text>
  <text x="109" y="106" text-anchor="middle" font-size="11" fill="#0d47a1">orders（4 主分片）</text>
  <text x="109" y="120" text-anchor="middle" font-size="10" fill="#0d47a1">全部分片在同节点 + 只读</text>

  <polygon points="204,96 236,82 236,110" fill="#2e7d32"/>

  <rect x="242" y="66" width="180" height="60" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="332" y="88" text-anchor="middle" font-size="12" fill="#1b5e20">shrink 到目标索引</text>
  <text x="332" y="106" text-anchor="middle" font-size="11" fill="#1b5e20">orders_shrunk（1 分片）</text>
  <text x="332" y="120" text-anchor="middle" font-size="10" fill="#2e7d32">硬链接复用，不重写数据</text>

  <polygon points="432,96 464,82 464,110" fill="#00695c"/>

  <rect x="470" y="66" width="226" height="60" rx="5" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
  <text x="583" y="88" text-anchor="middle" font-size="12" fill="#004d40">别名切换</text>
  <text x="583" y="106" text-anchor="middle" font-size="10" fill="#004d40">（见场景 4 解法 B）</text>
  <text x="583" y="120" text-anchor="middle" font-size="10" fill="#004d40">应用无感</text>

  <rect x="60" y="148" width="600" height="146" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="76" y="170" font-size="12" font-weight="bold" fill="#b71c1c">三个硬条件（课 15 实测，缺一即报错）</text>

  <rect x="80" y="182" width="184" height="52" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="172" y="200" text-anchor="middle" font-size="11" fill="#b71c1c">① 全部分片在同一节点</text>
  <text x="172" y="218" text-anchor="middle" font-size="9" fill="#7f0000">否则：must have all shards</text>
  <text x="172" y="230" text-anchor="middle" font-size="9" fill="#7f0000">allocated on the same node</text>

  <rect x="276" y="182" width="168" height="52" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="360" y="200" text-anchor="middle" font-size="11" fill="#b71c1c">② 源索引必须只读</text>
  <text x="360" y="218" text-anchor="middle" font-size="9" fill="#7f0000">index.blocks.write=true</text>
  <text x="360" y="230" text-anchor="middle" font-size="9" fill="#7f0000">写入中的索引不能 shrink</text>

  <rect x="456" y="182" width="204" height="52" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="558" y="200" text-anchor="middle" font-size="11" fill="#b71c1c">③ 目标数是源数的因数</text>
  <text x="558" y="218" text-anchor="middle" font-size="9" fill="#7f0000">4→1 ✅ ｜ 4→3 ❌</text>
  <text x="558" y="230" text-anchor="middle" font-size="9" fill="#7f0000">must be a multiple of [3]</text>

  <rect x="80" y="242" width="580" height="40" rx="4" fill="#fff8e1" stroke="#f9a825" stroke-dasharray="4 3"/>
  <text x="370" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#795548">规划建议：分片数尽量用 2 的幂（1/2/4/8…），给未来的 shrink 留余地</text>
  <text x="370" y="275" text-anchor="middle" font-size="10" fill="#8d6e63">shrink 不能解决"分片太少"——那是 split 或重建的事</text>
</svg>
