<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">ngram 分词：索引期把词切碎换取容错</text>

  <rect x="24" y="52" width="140" height="46" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="94" y="72" text-anchor="middle" font-size="12" fill="#0d47a1">原始词</text>
  <text x="94" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">iphone</text>

  <polygon points="184,75 214,62 214,88" fill="#6a1b9a"/>

  <rect x="222" y="46" width="230" height="58" rx="5" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="337" y="66" text-anchor="middle" font-size="11" fill="#4a148c">索引期 ngram（min 2 / max 3）</text>
  <text x="337" y="84" text-anchor="middle" font-size="11" fill="#4a148c">ip ph ho on ne … iph pho hon one</text>
  <text x="337" y="99" text-anchor="middle" font-size="10" fill="#4a148c">→ 错词 iphon 也切出大量重叠碎片</text>

  <polygon points="470,75 500,62 500,88" fill="#6a1b9a"/>

  <rect x="508" y="52" width="188" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="602" y="72" text-anchor="middle" font-size="12" fill="#1b5e20">倒排表碎片命中</text>
  <text x="602" y="90" text-anchor="middle" font-size="11" fill="#1b5e20">重叠越多 → 分越高</text>

  <rect x="60" y="134" width="600" height="140" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="76" y="156" font-size="12" font-weight="bold" fill="#b71c1c">代价：用索引体积与精度换召回，且不可逆</text>

  <rect x="80" y="170" width="176" height="88" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="168" y="190" text-anchor="middle" font-size="11" fill="#b71c1c">索引膨胀</text>
  <text x="168" y="209" text-anchor="middle" font-size="10" fill="#7f0000">1 词 → N 个碎片</text>
  <text x="168" y="226" text-anchor="middle" font-size="10" fill="#7f0000">存储与写放大</text>
  <text x="168" y="243" text-anchor="middle" font-size="10" fill="#7f0000">长文本尤其严重</text>
  <text x="168" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#b71c1c">→ 只适合短文本</text>

  <rect x="272" y="170" width="176" height="88" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="360" y="190" text-anchor="middle" font-size="11" fill="#b71c1c">精度下降</text>
  <text x="360" y="209" text-anchor="middle" font-size="10" fill="#7f0000">碎片偶然重叠即命中</text>
  <text x="360" y="226" text-anchor="middle" font-size="10" fill="#7f0000">「苹果」配到「平果手机」</text>
  <text x="360" y="243" text-anchor="middle" font-size="10" fill="#7f0000">BM25 打分失真</text>
  <text x="360" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#b71c1c">→ 需后置精确过滤</text>

  <rect x="464" y="170" width="176" height="88" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="552" y="190" text-anchor="middle" font-size="11" fill="#b71c1c">不可回退</text>
  <text x="552" y="209" text-anchor="middle" font-size="10" fill="#7f0000">ngram 写在 analyzer 里</text>
  <text x="552" y="226" text-anchor="middle" font-size="10" fill="#7f0000">切换需全量 reindex</text>
  <text x="552" y="243" text-anchor="middle" font-size="10" fill="#7f0000">映射不可变（课 5）</text>
  <text x="552" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#b71c1c">→ 先用子字段试</text>
</svg>
