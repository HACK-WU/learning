<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="720" height="310" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">双集群写入：ES 没有跨集群事务，"两边都成功"只能靠设计</text>

  <rect x="288" y="56" width="144" height="44" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="360" y="76" text-anchor="middle" font-size="12" fill="#0d47a1">应用写入</text>
  <text x="360" y="93" text-anchor="middle" font-size="10" fill="#0d47a1">（两个集群各写一次）</text>

  <line x1="340" y1="100" x2="180" y2="140" stroke="#2e7d32" stroke-width="1.6"/>
  <line x1="380" y1="100" x2="540" y2="140" stroke="#2e7d32" stroke-width="1.6"/>

  <rect x="80" y="144" width="200" height="52" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="180" y="164" text-anchor="middle" font-size="11" fill="#1b5e20">机房 A 集群</text>
  <text x="180" y="182" text-anchor="middle" font-size="10" fill="#2e7d32">写入成功</text>

  <rect x="440" y="144" width="200" height="52" rx="5" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="540" y="164" text-anchor="middle" font-size="11" fill="#b71c1c">机房 B 集群</text>
  <text x="540" y="182" text-anchor="middle" font-size="10" fill="#7f0000">写入失败（网络分区）</text>

  <rect x="60" y="210" width="600" height="84" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="76" y="232" font-size="12" font-weight="bold" fill="#b71c1c">失效点：两个集群之间没有任何一致性保证</text>
  <text x="76" y="254" font-size="10" fill="#7f0000">A 成功 B 失败 → 两边不一致；A 成功 B 成功但顺序不同 → 最终状态也可能不同（见场景 7 的解法 A 同款问题）</text>
  <text x="76" y="276" font-size="10" fill="#7f0000">课 14 实测：ES 的乐观锁只到单文档（并发写同一文档报 409），没有跨文档、更没有跨集群事务</text>
</svg>
