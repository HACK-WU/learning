<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">semantic_text：建索引不报错，写入才炸</text>

  <rect x="24" y="70" width="170" height="46" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="109" y="90" text-anchor="middle" font-size="12" fill="#0d47a1">① 建索引</text>
  <text x="109" y="108" text-anchor="middle" font-size="10" fill="#0d47a1">semantic_text 字段</text>

  <polygon points="204,93 236,79 236,107" fill="#2e7d32"/>

  <rect x="242" y="70" width="170" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="327" y="90" text-anchor="middle" font-size="12" fill="#1b5e20">② 创建成功</text>
  <text x="327" y="108" text-anchor="middle" font-size="10" fill="#2e7d32">acknowledged: true</text>

  <polygon points="422,93 454,79 454,107" fill="#c62828"/>

  <rect x="460" y="70" width="236" height="46" rx="5" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="578" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">③ 写入才报错</text>
  <text x="578" y="108" text-anchor="middle" font-size="10" fill="#7f0000">non-compliant for [inference]</text>

  <rect x="60" y="140" width="600" height="140" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="76" y="162" font-size="12" font-weight="bold" fill="#795548">为什么会这样：semantic_text 要调推理端点，而推理是付费能力</text>

  <rect x="80" y="174" width="280" height="42" rx="4" fill="#ffffff" stroke="#f9a825" stroke-dasharray="4 3"/>
  <text x="220" y="192" text-anchor="middle" font-size="11" fill="#795548">建索引只校验字段类型</text>
  <text x="220" y="209" text-anchor="middle" font-size="10" fill="#8d6e63">类型合法 → 放行</text>

  <rect x="376" y="174" width="284" height="42" rx="4" fill="#ffffff" stroke="#f9a825" stroke-dasharray="4 3"/>
  <text x="518" y="192" text-anchor="middle" font-size="11" fill="#795548">写入才真正调用推理端点</text>
  <text x="518" y="209" text-anchor="middle" font-size="10" fill="#8d6e63">license 校验发生在这里</text>

  <rect x="80" y="226" width="580" height="42" rx="4" fill="#fdecea" stroke="#c62828" stroke-dasharray="4 3"/>
  <text x="370" y="244" text-anchor="middle" font-size="11" fill="#b71c1c">最容易踩的坑：以为"建成功了就没事"，上线后第一条写入才炸</text>
  <text x="370" y="261" text-anchor="middle" font-size="10" fill="#7f0000">本机两集群 license = basic（课 13 实测）→ 只能外部生成向量存 dense_vector</text>
</svg>
