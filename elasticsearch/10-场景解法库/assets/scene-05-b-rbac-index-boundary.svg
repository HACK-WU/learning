<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">RBAC 索引级权限：权限边界在 ES 内部</text>

  <rect x="24" y="70" width="130" height="56" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="89" y="92" text-anchor="middle" font-size="12" fill="#0d47a1">租户 A 用户</text>
  <text x="89" y="110" text-anchor="middle" font-size="10" fill="#0d47a1">带上自己的凭据</text>

  <polygon points="164,98 196,84 196,112" fill="#4527a0"/>

  <rect x="204" y="64" width="200" height="68" rx="5" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5"/>
  <text x="304" y="86" text-anchor="middle" font-size="11" fill="#311b92">安全层校验</text>
  <text x="304" y="105" text-anchor="middle" font-size="10" fill="#4a148c">角色 → 索引前缀白名单</text>
  <text x="304" y="122" text-anchor="middle" font-size="10" fill="#4a148c">越权请求在此被拦（403）</text>

  <line x1="404" y1="86" x2="470" y2="76" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="420" y="70" font-size="9" fill="#1b5e20">允许</text>
  <line x1="404" y1="112" x2="470" y2="188" stroke="#c62828" stroke-width="1.6"/>
  <text x="424" y="140" font-size="9" fill="#b71c1c">拒绝</text>

  <rect x="476" y="54" width="220" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="586" y="74" text-anchor="middle" font-size="11" fill="#1b5e20">tenant_a_* 索引</text>
  <text x="586" y="91" text-anchor="middle" font-size="10" fill="#2e7d32">只读到自己前缀的数据</text>

  <rect x="476" y="166" width="220" height="46" rx="5" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="586" y="186" text-anchor="middle" font-size="11" fill="#b71c1c">tenant_b_* 索引</text>
  <text x="586" y="203" text-anchor="middle" font-size="10" fill="#7f0000">403（报错列出所需权限名）</text>

  <rect x="60" y="234" width="600" height="80" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="76" y="256" font-size="12" font-weight="bold" fill="#b71c1c">⚠️ 本机实测边界：安全模块关闭，RBAC 无法实测</text>
  <text x="76" y="276" font-size="10" fill="#7f0000">本机 security.available=True 但 enabled=False → _security API 无 handler（no handler）</text>
  <text x="76" y="298" font-size="10" fill="#7f0000">即 basic license 下 RBAC / DLS / FLS 均不可用；上图为生产正确形态，非本机实测结果</text>
</svg>
