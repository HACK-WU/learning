<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">routing：按业务键只查相关分片</text>

  <text x="180" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">不指定 routing（默认）</text>
  <text x="540" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">指定 routing=tenant_A</text>

  <rect x="40" y="76" width="280" height="200" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <rect x="240" y="96" width="60" height="34" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="270" y="117" text-anchor="middle" font-size="11" fill="#b71c1c">查询</text>

  <line x1="240" y1="113" x2="88" y2="152" stroke="#c62828" stroke-width="1.3"/>
  <line x1="240" y1="113" x2="168" y2="152" stroke="#c62828" stroke-width="1.3"/>
  <line x1="240" y1="113" x2="248" y2="152" stroke="#c62828" stroke-width="1.3"/>
  <line x1="240" y1="113" x2="308" y2="152" stroke="#c62828" stroke-width="1.3"/>

  <rect x="54" y="156" width="60" height="30" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="84" y="176" text-anchor="middle" font-size="10" fill="#b71c1c">P0</text>
  <rect x="134" y="156" width="60" height="30" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="164" y="176" text-anchor="middle" font-size="10" fill="#b71c1c">P1</text>
  <rect x="214" y="156" width="60" height="30" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="244" y="176" text-anchor="middle" font-size="10" fill="#b71c1c">P2</text>
  <rect x="294" y="156" width="60" height="30" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="324" y="176" text-anchor="middle" font-size="10" fill="#b71c1c">P3</text>

  <rect x="60" y="198" width="240" height="40" rx="4" fill="#ffcdd2"/>
  <text x="180" y="216" text-anchor="middle" font-size="11" fill="#b71c1c">广播到全部分片</text>
  <text x="180" y="232" text-anchor="middle" font-size="10" fill="#7f0000">分片越多，gather 开销越大</text>

  <rect x="400" y="76" width="280" height="200" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="600" y="96" width="60" height="34" rx="4" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="630" y="117" text-anchor="middle" font-size="11" fill="#1b5e20">查询</text>
  <text x="630" y="130" text-anchor="middle" font-size="9" fill="#2e7d32">routing=tenant_A</text>

  <line x1="600" y1="113" x2="478" y2="152" stroke="#2e7d32" stroke-width="2"/>

  <rect x="444" y="156" width="60" height="30" rx="4" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="474" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">P1</text>
  <rect x="524" y="156" width="60" height="30" rx="4" fill="#ffffff" stroke="#c8e6c9"/>
  <text x="554" y="176" text-anchor="middle" font-size="10" fill="#a5d6a7">P2</text>
  <rect x="604" y="156" width="60" height="30" rx="4" fill="#ffffff" stroke="#c8e6c9"/>
  <text x="634" y="176" text-anchor="middle" font-size="10" fill="#a5d6a7">P3</text>

  <rect x="420" y="198" width="240" height="40" rx="4" fill="#c8e6c9"/>
  <text x="540" y="216" text-anchor="middle" font-size="11" fill="#1b5e20">只查 hash(tenant_A) 落到的分片</text>
  <text x="540" y="232" text-anchor="middle" font-size="10" fill="#2e7d32">其余分片完全不参与</text>

  <rect x="60" y="288" width="600" height="20" rx="4" fill="#fff8e1" stroke="#f9a825" stroke-dasharray="4 3"/>
  <text x="360" y="303" text-anchor="middle" font-size="10" fill="#795548">失效点：大租户的数据全挤在一个分片上 → 热点分片，别的分片闲着</text>
</svg>
