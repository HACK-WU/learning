<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">别名 + rollover：自己管索引名，ILM 只管滚动与删除</text>

  <rect x="24" y="58" width="140" height="44" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="94" y="78" text-anchor="middle" font-size="12" fill="#0d47a1">应用只写</text>
  <text x="94" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">orders（别名）</text>

  <polygon points="176,80 206,67 206,93" fill="#00695c"/>

  <rect x="214" y="52" width="240" height="56" rx="5" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
  <text x="334" y="72" text-anchor="middle" font-size="11" fill="#004d40">别名指向写索引</text>
  <text x="334" y="89" text-anchor="middle" font-size="11" fill="#004d40">is_write_index: true</text>
  <text x="334" y="103" text-anchor="middle" font-size="10" fill="#004d40">（必须显式指定，否则 rollover 报错）</text>

  <polygon points="464,80 494,67 494,93" fill="#00695c"/>

  <rect x="502" y="58" width="194" height="44" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="599" y="78" text-anchor="middle" font-size="11" fill="#1b5e20">orders-000002</text>
  <text x="599" y="95" text-anchor="middle" font-size="11" fill="#1b5e20">可改可删单条文档</text>

  <rect x="60" y="132" width="600" height="182" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="76" y="154" font-size="12" font-weight="bold" fill="#b71c1c">三个连环坑（本机实测 9.5.1，课 15 记录）</text>

  <rect x="80" y="166" width="600" height="40" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="94" y="184" font-size="11" fill="#b71c1c">坑 1 · 别名不带 is_write_index</text>
  <text x="94" y="200" font-size="10" fill="#7f0000">→ index.lifecycle.rollover_alias [orders] does not point to index [orders-000001]</text>

  <rect x="80" y="212" width="600" height="40" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="94" y="230" font-size="11" fill="#b71c1c">坑 2 · 别名写在模板的 template.aliases 里（最反直觉）</text>
  <text x="94" y="246" font-size="10" fill="#7f0000">→ Rollover alias [orders] can point to multiple indices, found duplicated alias —— rollover 要自己管指向</text>

  <rect x="80" y="258" width="600" height="40" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="94" y="276" font-size="11" fill="#b71c1c">坑 3 · 直接对具体索引 rollover</text>
  <text x="94" y="292" font-size="10" fill="#7f0000">→ rollover target is a [concrete index] but one of [alias, data_stream] was expected</text>
</svg>
