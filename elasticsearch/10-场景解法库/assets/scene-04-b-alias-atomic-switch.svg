<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">别名原子切换：一次请求完成 remove + add</text>

  <rect x="24" y="60" width="150" height="50" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="99" y="80" text-anchor="middle" font-size="12" fill="#0d47a1">应用只认</text>
  <text x="99" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">别名 shop</text>

  <rect x="216" y="46" width="200" height="78" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="316" y="68" text-anchor="middle" font-size="11" fill="#795548">一次 _aliases 请求（原子）</text>
  <text x="316" y="88" text-anchor="middle" font-size="10" fill="#795548">remove: shop → shop_v1</text>
  <text x="316" y="106" text-anchor="middle" font-size="10" fill="#795548">add:    shop → shop_v2</text>
  <text x="316" y="121" text-anchor="middle" font-size="10" font-weight="bold" fill="#b71c1c">要么全成功，要么全失败</text>

  <polygon points="176,85 210,72 210,98" fill="#37474f"/>

  <rect x="450" y="46" width="120" height="34" rx="5" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>
  <text x="510" y="68" text-anchor="middle" font-size="11" fill="#455a64">shop_v1（旧）</text>

  <rect x="450" y="90" width="120" height="34" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="510" y="112" text-anchor="middle" font-size="11" fill="#1b5e20">shop_v2（新）</text>

  <rect x="596" y="46" width="100" height="34" rx="5" fill="#ffffff" stroke="#bdbdbd" stroke-dasharray="4 3"/>
  <text x="646" y="68" text-anchor="middle" font-size="10" fill="#9e9e9e">切换后下线</text>
  <rect x="596" y="90" width="100" height="34" rx="5" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="646" y="112" text-anchor="middle" font-size="10" fill="#2e7d32">接管全部流量</text>

  <rect x="60" y="152" width="600" height="150" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="76" y="174" font-size="12" font-weight="bold" fill="#b71c1c">失效点：原子性只覆盖"切换那一刻"，不覆盖数据本身</text>

  <rect x="80" y="186" width="280" height="46" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="220" y="204" text-anchor="middle" font-size="11" fill="#b71c1c">过渡期需要双倍存储</text>
  <text x="220" y="222" text-anchor="middle" font-size="10" fill="#7f0000">800 GB 索引要准备 1.6 TB</text>

  <rect x="376" y="186" width="284" height="46" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="518" y="204" text-anchor="middle" font-size="11" fill="#b71c1c">reindex 期间的新写入会丢</text>
  <text x="518" y="222" text-anchor="middle" font-size="10" fill="#7f0000">需双写，或在低峰期切换并接受短暂不一致</text>

  <rect x="80" y="242" width="580" height="46" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="370" y="260" text-anchor="middle" font-size="11" fill="#b71c1c">删别名要用 _aliases remove</text>
  <text x="370" y="278" text-anchor="middle" font-size="10" fill="#7f0000">DELETE /别名 会被拒：matches an alias, specify the corresponding concrete indices instead（本机实测）</text>
</svg>
