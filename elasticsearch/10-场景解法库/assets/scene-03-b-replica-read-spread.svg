<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">加副本：读请求分摊到更多分片拷贝</text>

  <rect x="280" y="52" width="160" height="40" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="360" y="70" text-anchor="middle" font-size="12" fill="#0d47a1">协调节点收到查询</text>
  <text x="360" y="86" text-anchor="middle" font-size="10" fill="#0d47a1">按分片轮转挑选副本</text>

  <line x1="300" y1="96" x2="150" y2="134" stroke="#37474f" stroke-width="1.4"/>
  <line x1="360" y1="96" x2="360" y2="134" stroke="#37474f" stroke-width="1.4"/>
  <line x1="420" y1="96" x2="570" y2="134" stroke="#37474f" stroke-width="1.4"/>

  <text x="120" y="126" font-size="10" fill="#37474f">P0</text>
  <text x="352" y="126" font-size="10" fill="#37474f">P1</text>
  <text x="562" y="126" font-size="10" fill="#37474f">P2</text>

  <rect x="40" y="140" width="200" height="66" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="140" y="160" text-anchor="middle" font-size="11" fill="#1b5e20">节点 1</text>
  <text x="140" y="178" text-anchor="middle" font-size="10" fill="#2e7d32">P0 主 · P1 副本</text>
  <text x="140" y="196" text-anchor="middle" font-size="10" fill="#2e7d32">承接 1/3 读</text>

  <rect x="260" y="140" width="200" height="66" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="360" y="160" text-anchor="middle" font-size="11" fill="#1b5e20">节点 2</text>
  <text x="360" y="178" text-anchor="middle" font-size="10" fill="#2e7d32">P1 主 · P2 副本</text>
  <text x="360" y="196" text-anchor="middle" font-size="10" fill="#2e7d32">承接 1/3 读</text>

  <rect x="480" y="140" width="200" height="66" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="580" y="160" text-anchor="middle" font-size="11" fill="#1b5e20">节点 3</text>
  <text x="580" y="178" text-anchor="middle" font-size="10" fill="#2e7d32">P2 主 · P0 副本</text>
  <text x="580" y="196" text-anchor="middle" font-size="10" fill="#2e7d32">承接 1/3 读</text>

  <rect x="60" y="222" width="600" height="82" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="76" y="244" font-size="12" font-weight="bold" fill="#b71c1c">代价：读变便宜了，写变贵了</text>

  <rect x="80" y="254" width="280" height="40" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="220" y="272" text-anchor="middle" font-size="11" fill="#b71c1c">写入要同步到每个副本</text>
  <text x="220" y="288" text-anchor="middle" font-size="10" fill="#7f0000">副本 1→2，写放大约 50%</text>

  <rect x="376" y="254" width="284" height="40" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-dasharray="4 3"/>
  <text x="518" y="272" text-anchor="middle" font-size="11" fill="#b71c1c">存储线性上升</text>
  <text x="518" y="288" text-anchor="middle" font-size="10" fill="#7f0000">副本 0 不抗丢失，副本数要按可用性定</text>
</svg>
