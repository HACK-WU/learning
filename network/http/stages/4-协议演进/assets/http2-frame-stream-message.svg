<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <rect width="1000" height="640" fill="#fff"/>
  <text x="45" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-weight="700" fill="#333">HTTP/2：一条连接里，三种观察尺度</text>
  <text x="45" y="77" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#666">语义仍是请求和响应；线路上看到的是带编号、可交错的小块</text>
  <rect x="45" y="108" width="910" height="472" rx="20" fill="#f7fbff" stroke="#1565c0" stroke-width="2"/>
  <text x="75" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#1565c0">一条 HTTP/2 连接</text>
  <rect x="75" y="175" width="850" height="345" rx="16" fill="#fff" stroke="#90caf9" stroke-width="2"/>
  <text x="100" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#333">流 1：请求 /app.js → 响应 200</text>
  <rect x="115" y="235" width="125" height="50" rx="8" fill="#90caf9"/><text x="142" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#123">HEADERS</text>
  <rect x="255" y="235" width="125" height="50" rx="8" fill="#90caf9"/><text x="289" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#123">DATA</text>
  <rect x="395" y="235" width="125" height="50" rx="8" fill="#90caf9"/><text x="429" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#123">DATA</text>
  <text x="545" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#555">一个完整请求/响应的逻辑边界</text>
  <text x="100" y="339" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#333">流 3：请求 /style.css → 响应 200</text>
  <rect x="115" y="366" width="125" height="50" rx="8" fill="#a5d6a7"/><text x="142" y="397" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#174a1b">HEADERS</text>
  <rect x="255" y="366" width="125" height="50" rx="8" fill="#a5d6a7"/><text x="289" y="397" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#174a1b">DATA</text>
  <text x="545" y="397" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#555">另一条请求/响应的逻辑边界</text>
  <path d="M450 296 V355" stroke="#f57c00" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="470" y="333" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#b85c00">在线路上交错</text>
  <rect x="115" y="470" width="690" height="34" rx="8" fill="#e3f2fd"/>
  <text x="135" y="493" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#1565c0">帧：最小通信块；流：同一请求/响应的帧集合；消息：语义上的请求或响应</text>
</svg>
