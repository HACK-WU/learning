<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
  <title>HTTP/1.1 三件奠基遗产：持久连接、Host、chunked</title>
  <desc>并排对比 HTTP/1.1 三项关键特性分别解决的旧问题、报文线索和边界。</desc>
  <rect width="960" height="720" fill="#fff"/>
  <text x="48" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#333">1.1 的三件奠基遗产</text>
  <text x="48" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#666">它们分别回答：要不要重连？请求给哪个站？正文在哪里结束？</text>

  <rect x="48" y="124" width="272" height="438" rx="12" fill="#e3f2fd" stroke="#90caf9" stroke-width="2"/>
  <circle cx="86" cy="165" r="20" fill="#1565c0"/>
  <text x="86" y="172" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">1</text>
  <text x="120" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#0d47a1">持久连接</text>
  <text x="72" y="215" font-family="sans-serif" font-size="15" fill="#333">旧问题</text>
  <text x="72" y="244" font-family="sans-serif" font-size="14" fill="#333">每个资源都重新建立连接</text>
  <line x1="72" y1="268" x2="296" y2="268" stroke="#90caf9"/>
  <text x="72" y="302" font-family="sans-serif" font-size="15" fill="#333">关键线索</text>
  <text x="72" y="331" font-family="monospace" font-size="14" fill="#0d47a1">HTTP/1.1 默认保持</text>
  <text x="72" y="356" font-family="monospace" font-size="14" fill="#0d47a1">Connection: close</text>
  <text x="72" y="395" font-family="sans-serif" font-size="15" fill="#333">换来的能力</text>
  <text x="72" y="424" font-family="sans-serif" font-size="14" fill="#333">一条 TCP 连接承载多次</text>
  <text x="72" y="448" font-family="sans-serif" font-size="14" fill="#333">请求-响应</text>
  <rect x="72" y="483" width="224" height="48" rx="8" fill="#bbdefb"/>
  <text x="184" y="513" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0d47a1">代价：占用连接资源，仍可能排队</text>

  <rect x="344" y="124" width="272" height="438" rx="12" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/>
  <circle cx="382" cy="165" r="20" fill="#2e7d32"/>
  <text x="382" y="172" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">2</text>
  <text x="416" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#1b5e20">Host</text>
  <text x="368" y="215" font-family="sans-serif" font-size="15" fill="#333">旧问题</text>
  <text x="368" y="244" font-family="sans-serif" font-size="14" fill="#333">同一 IP 不知道该进哪个站</text>
  <line x1="368" y1="268" x2="592" y2="268" stroke="#81c784"/>
  <text x="368" y="302" font-family="sans-serif" font-size="15" fill="#333">关键线索</text>
  <text x="368" y="331" font-family="monospace" font-size="14" fill="#1b5e20">Host: app.example</text>
  <text x="368" y="356" font-family="sans-serif" font-size="14" fill="#333">HTTP/1.1 请求必须带一个</text>
  <text x="368" y="380" font-family="sans-serif" font-size="14" fill="#333">有效 Host 字段</text>
  <text x="368" y="419" font-family="sans-serif" font-size="15" fill="#333">换来的能力</text>
  <text x="368" y="448" font-family="sans-serif" font-size="14" fill="#333">虚拟主机：一台服务器</text>
  <text x="368" y="472" font-family="sans-serif" font-size="14" fill="#333">承载多个域名</text>
  <rect x="368" y="503" width="224" height="28" rx="8" fill="#c8e6c9"/>
  <text x="480" y="522" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1b5e20">边界：HTTPS 身份还要看证书/SNI</text>

  <rect x="640" y="124" width="272" height="438" rx="12" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/>
  <circle cx="678" cy="165" r="20" fill="#ef6c00"/>
  <text x="678" y="172" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>
  <text x="712" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#e65100">chunked</text>
  <text x="664" y="215" font-family="sans-serif" font-size="15" fill="#333">旧问题</text>
  <text x="664" y="244" font-family="sans-serif" font-size="14" fill="#333">正文总大小还没算出来</text>
  <line x1="664" y1="268" x2="888" y2="268" stroke="#ffb74d"/>
  <text x="664" y="302" font-family="sans-serif" font-size="15" fill="#333">关键线索</text>
  <text x="664" y="331" font-family="monospace" font-size="14" fill="#e65100">Transfer-Encoding:</text>
  <text x="664" y="355" font-family="monospace" font-size="14" fill="#e65100">chunked</text>
  <text x="664" y="394" font-family="sans-serif" font-size="15" fill="#333">换来的能力</text>
  <text x="664" y="423" font-family="sans-serif" font-size="14" fill="#333">按块发送，最后用 0 块</text>
  <text x="664" y="447" font-family="sans-serif" font-size="14" fill="#333">告诉接收方“到这里结束”</text>
  <rect x="664" y="483" width="224" height="48" rx="8" fill="#ffe0b2"/>
  <text x="776" y="513" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#e65100">边界：它是传输分帧，不是压缩</text>

  <rect x="48" y="600" width="864" height="64" rx="10" fill="#263238"/>
  <text x="480" y="628" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">共同底层问题：接收方必须知道“这条消息在哪里结束”</text>
  <text x="480" y="651" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#cfd8dc">Content-Length、Transfer-Encoding、连接关闭，都是报文边界的不同线索</text>
</svg>
