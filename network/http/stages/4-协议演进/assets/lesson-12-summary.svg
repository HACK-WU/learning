<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <rect width="1000" height="650" fill="#fff"/>
  <text x="46" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#333">课 12 收束：从 TCP 队头，到 HTTP/3 决策</text>
  <text x="46" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#666">HTTP 语义没有消失，变化的是承载它的运输组织与上线方法</text>

  <rect x="52" y="118" width="410" height="432" rx="18" fill="#fafafa" stroke="#bdbdbd" stroke-width="2"/>
  <text x="82" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#555">HTTP/2 留下的边界</text>
  <rect x="82" y="190" width="350" height="74" rx="12" fill="#e3f2fd"/><text x="106" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#1565c0">一条 TCP 连接</text><text x="106" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#333">多条 HTTP/2 流交错</text>
  <rect x="82" y="284" width="350" height="74" rx="12" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/><text x="106" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#6d1b1b">TCP 丢包</text><text x="106" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#333">可能挡住共享连接上的所有流</text>
  <text x="82" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#555">问题：HTTP 层拆开了，</text><text x="82" y="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#555">运输层仍把它们绑在一条有序队伍里。</text>

  <rect x="538" y="118" width="410" height="432" rx="18" fill="#f6fbff" stroke="#1565c0" stroke-width="2"/>
  <text x="568" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#1565c0">HTTP/3 的回答</text>
  <rect x="568" y="190" width="350" height="58" rx="11" fill="#e3f2fd"/><text x="592" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#1565c0">QUIC streams：各流可靠、各流按序</text>
  <rect x="568" y="262" width="350" height="58" rx="11" fill="#fff3e0"/><text x="592" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#8a4b08">TLS 1.3：握手与加密融入运输</text>
  <rect x="568" y="334" width="350" height="58" rx="11" fill="#e8f5e9"/><text x="592" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#2e7d32">Connection ID：路径变了仍可识别</text>
  <rect x="568" y="406" width="350" height="58" rx="11" fill="#f3e5f5"/><text x="592" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#6a1b9a">Fallback + metrics：上线必须可退</text>
  <text x="568" y="504" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#333">不是“永远更快”，而是把收益交给真实网络验证</text>

  <path d="M462 334 H538" stroke="#1565c0" stroke-width="5" marker-end="url(#arrow)"/><text x="474" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#1565c0">换运输组织</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/></marker></defs>
</svg>
