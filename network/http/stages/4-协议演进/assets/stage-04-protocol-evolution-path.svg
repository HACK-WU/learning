<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">阶段 4 · 协议演进：从 1.1 到 3</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#666666">课 10 → 课 11 → 课 12（9 个知识点，从左到右递进）</text>

  <!-- ============ 课 10 ============ -->
  <g>
    <rect x="24" y="80" width="264" height="46" rx="8" fill="#6a1b9a"/>
    <text x="156" y="109" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">课 10 · HTTP/1.1 奠基</text>

    <!-- 课 10 知识点卡 -->
    <rect x="24" y="140" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="44" cy="160" r="9" fill="#6a1b9a"/>
    <text x="44" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="62" y="164" font-size="13" font-weight="700" fill="#1a1a1a">演进史与版本分界</text>
    <text x="62" y="185" font-size="11" fill="#333333">0.9 / 1.0 / 1.1 各解决了什么</text>
    <text x="62" y="201" font-size="11" fill="#333333">1.1 为何长寿 · RFC 9110/9112（核查）</text>

    <rect x="24" y="234" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="44" cy="254" r="9" fill="#6a1b9a"/>
    <text x="44" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="62" y="258" font-size="13" font-weight="700" fill="#1a1a1a">1.1 的关键特性</text>
    <text x="62" y="279" font-size="11" fill="#333333">持久连接成为默认</text>
    <text x="62" y="295" font-size="11" fill="#333333">Host 头与虚拟主机 · chunked 分块传输</text>

    <rect x="24" y="328" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="44" cy="348" r="9" fill="#6a1b9a"/>
    <text x="44" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="62" y="352" font-size="13" font-weight="700" fill="#1a1a1a">1.1 性能手段与天花板</text>
    <text x="62" y="373" font-size="11" fill="#333333">合并文件 / 内联 / spriting 的由来</text>
    <text x="62" y="389" font-size="11" fill="#333333">域名分片 · HTTP/2 下失效甚至有害</text>
  </g>

  <!-- 课 10 → 课 11 箭头 -->
  <line x1="292" y1="290" x2="318" y2="290" stroke="#6a1b9a" stroke-width="2"/>
  <polygon points="318,290 310,286 310,294" fill="#6a1b9a"/>

  <!-- ============ 课 11 ============ -->
  <g>
    <rect x="318" y="80" width="264" height="46" rx="8" fill="#6a1b9a"/>
    <text x="450" y="109" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">课 11 · HTTP/2 多路复用</text>

    <rect x="318" y="140" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="338" cy="160" r="9" fill="#6a1b9a"/>
    <text x="338" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="356" y="164" font-size="13" font-weight="700" fill="#1a1a1a">二进制分帧</text>
    <text x="356" y="185" font-size="11" fill="#333333">帧、流、消息三个概念</text>
    <text x="356" y="201" font-size="11" fill="#333333">文本到二进制的原因 · HTTPS 与 h2 绑定</text>

    <rect x="318" y="234" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="338" cy="254" r="9" fill="#6a1b9a"/>
    <text x="338" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="356" y="258" font-size="13" font-weight="700" fill="#1a1a1a">多路复用</text>
    <text x="356" y="279" font-size="11" fill="#333333">一条连接并发多条流</text>
    <text x="356" y="295" font-size="11" fill="#333333">HTTP 层队头阻塞已解 · TCP 层仍在</text>

    <rect x="318" y="328" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="338" cy="348" r="9" fill="#6a1b9a"/>
    <text x="338" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="356" y="352" font-size="13" font-weight="700" fill="#1a1a1a">头部压缩与服务器推送</text>
    <text x="356" y="373" font-size="11" fill="#333333">HPACK 与静态表</text>
    <text x="356" y="389" font-size="11" fill="#333333">推送为什么被移除 · 流优先级</text>
  </g>

  <!-- 课 11 → 课 12 箭头 -->
  <line x1="586" y1="290" x2="612" y2="290" stroke="#6a1b9a" stroke-width="2"/>
  <polygon points="612,290 604,286 604,294" fill="#6a1b9a"/>

  <!-- ============ 课 12 ============ -->
  <g>
    <rect x="612" y="80" width="264" height="46" rx="8" fill="#6a1b9a"/>
    <text x="744" y="109" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">课 12 · HTTP/3 与 QUIC</text>

    <rect x="612" y="140" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="632" cy="160" r="9" fill="#6a1b9a"/>
    <text x="632" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="650" y="164" font-size="13" font-weight="700" fill="#1a1a1a">为什么换传输层</text>
    <text x="650" y="185" font-size="11" fill="#333333">TCP 层队头阻塞</text>
    <text x="650" y="201" font-size="11" fill="#333333">协议僵化 · QUIC 基于 UDP 的思路</text>

    <rect x="612" y="234" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="632" cy="254" r="9" fill="#6a1b9a"/>
    <text x="632" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="650" y="258" font-size="13" font-weight="700" fill="#1a1a1a">QUIC 的关键特性</text>
    <text x="650" y="279" font-size="11" fill="#333333">0/1-RTT 建连 · 连接迁移（换网不断连）</text>
    <text x="650" y="295" font-size="11" fill="#333333">加密成为默认</text>

    <rect x="612" y="328" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="632" cy="348" r="9" fill="#6a1b9a"/>
    <text x="632" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="650" y="352" font-size="13" font-weight="700" fill="#1a1a1a">部署现状与决策</text>
    <text x="650" y="373" font-size="11" fill="#333333">浏览器 / 服务器支持度（联网核查）</text>
    <text x="650" y="389" font-size="11" fill="#333333">什么场景值得上 · 升级路径与 Alt-Svc</text>
  </g>

  <!-- 底部递进说明 -->
  <rect x="24" y="434" width="852" height="34" rx="6" fill="#fafafa" stroke="#d0d7de"/>
  <text x="450" y="456" text-anchor="middle" font-size="12" fill="#333333">递进：课 4 的队头阻塞是本阶段演进的引子；1.1 打地基、2 治 HTTP 层、3 治 TCP 层——版本史与支持度为时效内容，写正文时须联网核查</text>
</svg>
