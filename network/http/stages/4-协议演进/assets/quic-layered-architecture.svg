<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690">
  <rect width="1000" height="690" fill="#fff"/>
  <text x="46" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#333">HTTP/3 站在 QUIC 之上：职责分层</text>
  <text x="46" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#666">上层保留 HTTP 语义；下层负责流、可靠性、拥塞、握手与路径变化</text>

  <rect x="92" y="118" width="816" height="92" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="124" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#1565c0">HTTP/3（应用协议）</text>
  <text x="124" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#333">HEADERS / DATA 帧；每个请求-响应占一条双向 request stream</text>
  <rect x="92" y="226" width="816" height="190" rx="14" fill="#f6fbff" stroke="#42a5f5" stroke-width="2"/>
  <text x="124" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#1565c0">QUIC（传输协议）</text>
  <rect x="124" y="286" width="182" height="86" rx="10" fill="#fff" stroke="#90caf9"/><text x="148" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#333">独立 streams</text><text x="148" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#555">各自可靠、按序</text>
  <rect x="326" y="286" width="182" height="86" rx="10" fill="#fff" stroke="#90caf9"/><text x="350" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#333">流量控制</text><text x="350" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#555">每流 + 整条连接</text>
  <rect x="528" y="286" width="182" height="86" rx="10" fill="#fff" stroke="#90caf9"/><text x="552" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#333">Connection ID</text><text x="552" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#555">识别同一条连接</text>
  <rect x="730" y="286" width="146" height="86" rx="10" fill="#fff3e0" stroke="#f57c00"/><text x="752" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#8a4b08">TLS 1.3</text><text x="752" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#6b4a16">握手 + 密钥</text>
  <rect x="92" y="432" width="816" height="86" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="124" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#8a4b08">UDP（承载外壳）</text>
  <text x="124" y="497" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#333">只提供数据报发送入口；可靠性、重传、拥塞与安全由 QUIC 补回</text>
  <rect x="92" y="534" width="816" height="70" rx="14" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
  <text x="124" y="577" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#555">IP 网络</text>
  <path d="M500 210 V226 M500 416 V432 M500 518 V534" stroke="#777" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/></marker></defs>
</svg>
