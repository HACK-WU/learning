<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <rect width="1000" height="640" fill="#fff"/>
  <text x="45" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-weight="700" fill="#333">多路复用：解决一层阻塞，没消灭所有阻塞</text>
  <rect x="45" y="90" width="420" height="480" rx="18" fill="#fafafa" stroke="#bdbdbd" stroke-width="2"/>
  <text x="75" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#555">HTTP/1.1 的应用层排队</text>
  <text x="78" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#666">A 的响应没结束，B 的响应只能等</text>
  <path d="M105 215 H405" stroke="#90a4ae" stroke-width="4"/>
  <rect x="110" y="185" width="240" height="60" rx="10" fill="#ef9a9a"/><text x="135" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#6d1b1b">A：慢响应</text>
  <rect x="110" y="285" width="240" height="60" rx="10" fill="#ffe082"/><text x="135" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#5d4500">B：被迫等待</text>
  <rect x="110" y="385" width="240" height="60" rx="10" fill="#ffe082"/><text x="135" y="422" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#5d4500">C：也在等待</text>
  <text x="92" y="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#b04a3a">同一条连接上的语义队头被卡住</text>
  <rect x="535" y="90" width="420" height="480" rx="18" fill="#f6fbff" stroke="#1565c0" stroke-width="2"/>
  <text x="565" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#1565c0">HTTP/2 的交错发送</text>
  <text x="568" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#666">A、B、C 各自切小，发送顺序可交错</text>
  <path d="M575 215 H915" stroke="#90a4ae" stroke-width="4"/>
  <rect x="580" y="185" width="68" height="60" rx="10" fill="#90caf9"/><text x="600" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#123">A1</text>
  <rect x="658" y="185" width="68" height="60" rx="10" fill="#ffe082"/><text x="678" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#5d4500">B1</text>
  <rect x="736" y="185" width="68" height="60" rx="10" fill="#a5d6a7"/><text x="756" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#174a1b">C1</text>
  <rect x="814" y="185" width="68" height="60" rx="10" fill="#ffe082"/><text x="834" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#5d4500">B2</text>
  <rect x="580" y="285" width="68" height="60" rx="10" fill="#a5d6a7"/><text x="600" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#174a1b">C2</text>
  <rect x="658" y="285" width="68" height="60" rx="10" fill="#90caf9"/><text x="678" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#123">A2</text>
  <rect x="736" y="285" width="68" height="60" rx="10" fill="#90caf9"/><text x="756" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#123">A3</text>
  <rect x="814" y="285" width="68" height="60" rx="10" fill="#a5d6a7"/><text x="834" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#174a1b">C3</text>
  <text x="575" y="405" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#1565c0">HTTP 层：一条流卡住，不必挡住其他流</text>
  <rect x="575" y="445" width="340" height="82" rx="12" fill="#fff3e0" stroke="#f57c00"/>
  <text x="595" y="475" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#b85c00">但底层仍是一条 TCP 字节序列</text>
  <text x="595" y="503" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#6b4a16">丢一个包，后面的字节可能都要等</text>
</svg>
