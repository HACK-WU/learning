<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <title>课 9 一图总结：站位、来路与复用</title>
  <desc>沿一条请求链回答三个问题：谁站在中间、谁写下来路、哪一层可以复用结果。</desc>
  <rect width="960" height="620" fill="#fff"/>
  <text x="48" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#333">一条请求的三次判断</text>
  <text x="48" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#666">代理与 CDN 不只是“多了几台机器”，而是多了站位、记录和复用规则。</text>

  <line x1="108" y1="154" x2="852" y2="154" stroke="#90caf9" stroke-width="4"/>
  <circle cx="160" cy="154" r="15" fill="#1565c0"/>
  <circle cx="480" cy="154" r="15" fill="#2e7d32"/>
  <circle cx="800" cy="154" r="15" fill="#ef6c00"/>
  <text x="160" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="480" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="800" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>

  <rect x="48" y="196" width="270" height="300" rx="12" fill="#e3f2fd" stroke="#90caf9" stroke-width="2"/>
  <text x="72" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#0d47a1">谁站在中间？</text>
  <text x="72" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#333">先看“替谁出面”</text>
  <text x="72" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#333">正向代理：替客户端出面</text>
  <text x="72" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#333">反向代理：替服务端接入口</text>
  <text x="72" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#333">网关 / 负载均衡：承担职责</text>
  <line x1="72" y1="407" x2="294" y2="407" stroke="#90caf9"/>
  <text x="72" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#0d47a1">Via：留下经过哪些中间站</text>
  <text x="72" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#666">站位和职责可以叠加</text>

  <rect x="345" y="196" width="270" height="300" rx="12" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/>
  <text x="369" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#1b5e20">谁写下来路？</text>
  <text x="369" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#333">再看“谁值得相信”</text>
  <text x="369" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#333">Forwarded：标准化链路说明</text>
  <text x="369" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#333">X-Forwarded-For：地址列表</text>
  <text x="369" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#333">X-Real-IP：部署约定的单值</text>
  <line x1="369" y1="407" x2="591" y2="407" stroke="#81c784"/>
  <text x="369" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1b5e20">从可信代理边界向左解析</text>
  <text x="369" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#666">头部结构标准化 ≠ 内容不可伪造</text>

  <rect x="642" y="196" width="270" height="300" rx="12" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/>
  <text x="666" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#e65100">哪一层能复用？</text>
  <text x="666" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#333">最后看“谁可以直接返回”</text>
  <text x="666" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#333">HIT：边缘直接返回</text>
  <text x="666" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#333">MISS：回源取得并保存</text>
  <text x="666" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#333">共享缓存：可能服务多人</text>
  <line x1="666" y1="407" x2="888" y2="407" stroke="#ffb74d"/>
  <text x="666" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#e65100">max-age 管私有缓存</text>
  <text x="666" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#e65100">s-maxage 管共享缓存</text>

  <rect x="48" y="530" width="864" height="54" rx="10" fill="#263238"/>
  <text x="480" y="564" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff">请求链排障顺序：站位 → 来路 → 复用</text>
</svg>
