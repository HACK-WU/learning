<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#333">HTTP 缓存：两条路，省掉的东西不同</text>
  <text x="60" y="82" font-family="Arial, sans-serif" font-size="16" fill="#666">第一次拿到响应后，下一次请求先判断“能不能直接用”；不能直接用时，再带着旧版本向源站确认。</text>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565C0"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C62828"/>
    </marker>
  </defs>

  <rect x="60" y="125" width="190" height="78" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="155" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0D47A1">第一次请求</text>
  <text x="155" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#333">拿到响应 + 缓存元数据</text>

  <line x1="250" y1="164" x2="320" y2="164" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="320" y="125" width="215" height="78" rx="12" fill="#F5F5F5" stroke="#555" stroke-width="2"/>
  <text x="427" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#333">新请求到来</text>
  <text x="427" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#333">先看新鲜度与策略</text>

  <line x1="535" y1="164" x2="650" y2="164" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="593" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1565C0">还没过期</text>
  <rect x="650" y="125" width="230" height="78" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="765" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1B5E20">直接使用缓存</text>
  <text x="765" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#333">请求不出门，省请求与正文</text>

  <line x1="535" y1="184" x2="535" y2="295" stroke="#C62828" stroke-width="3"/>
  <line x1="535" y1="295" x2="650" y2="295" stroke="#C62828" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="548" y="251" font-family="Arial, sans-serif" font-size="15" fill="#C62828">已过期 / 必须确认</text>
  <rect x="650" y="256" width="230" height="78" rx="12" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
  <text x="765" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#E65100">条件请求</text>
  <text x="765" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#333">带 ETag / 日期去询问源站</text>

  <line x1="880" y1="276" x2="975" y2="236" stroke="#2E7D32" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="930" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#2E7D32">没变</text>
  <rect x="975" y="190" width="165" height="78" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="1057" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1B5E20">304</text>
  <text x="1057" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#333">省正文</text>

  <line x1="880" y1="315" x2="975" y2="355" stroke="#C62828" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="930" y="349" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#C62828">变了</text>
  <rect x="975" y="315" width="165" height="78" rx="12" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="1057" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#B71C1C">200</text>
  <text x="1057" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#333">拿新正文</text>

  <rect x="60" y="455" width="500" height="125" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="85" y="490" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0D47A1">HTML 入口文件</text>
  <text x="85" y="520" font-family="Arial, sans-serif" font-size="16" fill="#333">Cache-Control: no-cache</text>
  <text x="85" y="548" font-family="Arial, sans-serif" font-size="15" fill="#555">允许存，但复用前确认；发布新版本时能发现新资源名</text>

  <rect x="600" y="455" width="540" height="125" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="625" y="490" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1B5E20">带 hash 的 JS / CSS / 图片</text>
  <text x="625" y="520" font-family="Arial, sans-serif" font-size="16" fill="#333">Cache-Control: public, max-age=31536000</text>
  <text x="625" y="548" font-family="Arial, sans-serif" font-size="15" fill="#555">文件名变了就是新资源；旧文件可长期复用，请求不出门</text>

  <text x="60" y="620" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#333">一句话：强缓存省掉请求；协商缓存保留请求，只在内容没变时省掉正文。</text>
</svg>
