<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/>
    </marker>
  </defs>
  <rect width="1080" height="680" fill="#fff"/>
  <text x="50" y="52" font-family="sans-serif" font-size="28" font-weight="700" fill="#333">第 14 课收束：浏览器如何决定“脚本能不能读”</text>
  <text x="50" y="86" font-family="sans-serif" font-size="16" fill="#666">源比较是入口，许可头是协议，Network 对账是排障方法</text>

  <rect x="50" y="125" width="290" height="390" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="195" y="166" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#0D47A1">14.1 先判边界</text>
  <rect x="88" y="205" width="214" height="70" rx="10" fill="#fff" stroke="#64B5F6"/>
  <text x="195" y="248" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">协议 · 主机 · 端口</text>
  <rect x="88" y="310" width="214" height="115" rx="10" fill="#fff" stroke="#64B5F6"/>
  <text x="195" y="348" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">三格都一样</text>
  <text x="195" y="380" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">同一个源</text>
  <text x="195" y="412" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#666">路径变化不改变边界</text>

  <rect x="395" y="125" width="290" height="390" rx="16" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
  <text x="540" y="166" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#8D6E00">14.2 再看许可</text>
  <rect x="433" y="205" width="214" height="70" rx="10" fill="#fff" stroke="#FFCA28"/>
  <text x="540" y="248" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">Origin</text>
  <path d="M540 275 L540 305" stroke="#F9A825" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="433" y="315" width="214" height="110" rx="10" fill="#fff" stroke="#FFCA28"/>
  <text x="540" y="350" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">必要时 OPTIONS</text>
  <text x="540" y="382" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">方法 / 请求头 / 凭证</text>
  <text x="540" y="412" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#666">真实响应也要带许可</text>

  <rect x="740" y="125" width="290" height="390" rx="16" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
  <text x="885" y="166" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#2E7D32">14.3 最后定位</text>
  <rect x="778" y="205" width="214" height="70" rx="10" fill="#fff" stroke="#81C784"/>
  <text x="885" y="248" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">看 Network</text>
  <path d="M885 275 L885 305" stroke="#43A047" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="778" y="315" width="214" height="110" rx="10" fill="#fff" stroke="#81C784"/>
  <text x="885" y="350" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">请求 ↔ 响应</text>
  <text x="885" y="382" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">应用 / 代理 / 缓存</text>
  <text x="885" y="412" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#666">不要只盯 Console</text>

  <path d="M340 320 L390 320" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M685 320 L735 320" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="155" y="560" width="770" height="62" rx="12" fill="#1565C0"/>
  <text x="540" y="600" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff">CORS 解决“浏览器脚本能否读”，不替代认证、授权与 CSRF 防护</text>
</svg>
