<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/>
    </marker>
  </defs>
  <rect width="1040" height="660" fill="#fff"/>
  <text x="50" y="50" font-family="sans-serif" font-size="27" font-weight="700" fill="#333">CORS 报错：从症状走到证据</text>
  <text x="50" y="84" font-family="sans-serif" font-size="16" fill="#666">不要从最后一句 Console 文本跳到结论，沿四个观察点逐级下钻</text>

  <rect x="50" y="125" width="210" height="390" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="155" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#0D47A1">① 地址</text>
  <text x="155" y="212" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">页面地址</text>
  <text x="155" y="245" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">目标 URL</text>
  <text x="155" y="278" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">协议 / 主机 / 端口</text>
  <rect x="78" y="330" width="154" height="115" rx="10" fill="#fff" stroke="#64B5F6"/>
  <text x="155" y="368" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555">先确认</text>
  <text x="155" y="400" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555">是不是跨源</text>
  <text x="155" y="433" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#777">不跨源就别追 CORS</text>

  <rect x="295" y="125" width="210" height="390" rx="14" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
  <text x="400" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#8D6E00">② 预检</text>
  <text x="400" y="212" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">有没有 OPTIONS</text>
  <text x="400" y="245" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">方法是什么</text>
  <text x="400" y="278" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">请求头是什么</text>
  <rect x="323" y="330" width="154" height="115" rx="10" fill="#fff" stroke="#FFCA28"/>
  <text x="400" y="368" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555">再确认</text>
  <text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555">预检是否成功</text>
  <text x="400" y="433" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#777">失败就先修 OPTIONS</text>

  <rect x="540" y="125" width="210" height="390" rx="14" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
  <text x="645" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#2E7D32">③ 响应头</text>
  <text x="645" y="212" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">Allow-Origin</text>
  <text x="645" y="245" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">Allow-Methods/Headers</text>
  <text x="645" y="278" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">凭证与实际响应</text>
  <rect x="568" y="330" width="154" height="115" rx="10" fill="#fff" stroke="#81C784"/>
  <text x="645" y="368" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555">逐项对账</text>
  <text x="645" y="400" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555">请求说了什么</text>
  <text x="645" y="433" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#777">响应是否都回答了</text>

  <rect x="785" y="125" width="205" height="390" rx="14" fill="#FCE4EC" stroke="#C2185B" stroke-width="2"/>
  <text x="887" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#880E4F">④ 接缝</text>
  <text x="887" y="212" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">应用 / 认证层</text>
  <text x="887" y="245" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">代理 / 网关</text>
  <text x="887" y="278" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">缓存 / 重定向</text>
  <rect x="813" y="330" width="149" height="115" rx="10" fill="#fff" stroke="#F06292"/>
  <text x="887" y="368" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555">最后定位</text>
  <text x="887" y="400" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555">谁改了报文</text>
  <text x="887" y="433" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#777">谁缓存了旧答案</text>

  <path d="M260 320 L290 320" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M505 320 L535 320" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M750 320 L780 320" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="520" y="575" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#333">Console 给症状，Network 给证据；先止住猜测，再决定改哪一层</text>
</svg>
