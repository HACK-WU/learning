<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720">
  <title>综合排障的证据链</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #333; }
      .step { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #fff; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #333; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #90caf9; stroke-width: 2; rx: 12; }
      .stepbox { fill: #1565c0; rx: 9; }
      .arrow { stroke: #1565c0; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .evidence { fill: #fff8e1; stroke: #ffb300; stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="1160" height="720" fill="#fff"/>
  <text x="580" y="44" text-anchor="middle" class="title">从一个症状走到一个可回滚的决定</text>

  <rect x="48" y="100" width="150" height="92" class="box"/>
  <text x="123" y="136" text-anchor="middle" class="label">用户 / 页面</text>
  <text x="123" y="166" text-anchor="middle" class="small">“很慢”或“登录失效”</text>
  <rect x="220" y="112" width="66" height="38" class="stepbox"/><text x="253" y="138" text-anchor="middle" class="step">1</text>

  <rect x="320" y="100" width="190" height="92" class="box"/>
  <text x="415" y="136" text-anchor="middle" class="label">浏览器证据</text>
  <text x="415" y="166" text-anchor="middle" class="small">请求 / 状态 / Timing / Origin</text>
  <rect x="532" y="112" width="66" height="38" class="stepbox"/><text x="565" y="138" text-anchor="middle" class="step">2</text>

  <rect x="632" y="100" width="190" height="92" class="box"/>
  <text x="727" y="136" text-anchor="middle" class="label">直连对照</text>
  <text x="727" y="166" text-anchor="middle" class="small">curl 重放同一请求</text>
  <rect x="844" y="112" width="66" height="38" class="stepbox"/><text x="877" y="138" text-anchor="middle" class="step">3</text>

  <rect x="944" y="100" width="170" height="92" class="box"/>
  <text x="1029" y="136" text-anchor="middle" class="label">中间层证据</text>
  <text x="1029" y="166" text-anchor="middle" class="small">代理 / 缓存 / TLS 链路</text>

  <path d="M198 146 L320 146" class="arrow"/>
  <path d="M510 146 L632 146" class="arrow"/>
  <path d="M822 146 L944 146" class="arrow"/>

  <path d="M415 192 L415 275" class="arrow"/>
  <rect x="260" y="300" width="310" height="112" class="evidence"/>
  <text x="415" y="335" text-anchor="middle" class="label">慢：先看卡在哪一段</text>
  <text x="415" y="365" text-anchor="middle" class="small">连接慢？TTFB 长？正文读取慢？</text>
  <text x="415" y="390" text-anchor="middle" class="small">重定向是否增加了一次完整请求？</text>

  <path d="M727 192 L727 275" class="arrow"/>
  <rect x="580" y="300" width="310" height="112" class="evidence"/>
  <text x="735" y="335" text-anchor="middle" class="label">登录失效：先看凭证在哪</text>
  <text x="735" y="365" text-anchor="middle" class="small">Cookie / Authorization 是否发出？</text>
  <text x="735" y="390" text-anchor="middle" class="small">401、403、重定向还是 CORS 读取失败？</text>

  <path d="M570 356 L610 356" class="arrow"/>

  <rect x="190" y="500" width="780" height="120" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="14"/>
  <rect x="210" y="520" width="170" height="42" class="stepbox"/><text x="295" y="548" text-anchor="middle" class="step">4 · 决策</text>
  <text x="590" y="542" text-anchor="middle" class="label">只修复被证据指向的层</text>
  <text x="590" y="575" text-anchor="middle" class="small">缓存、协议、认证、CORS 或中间层，各自保留验证方式与回滚出口</text>
  <text x="590" y="602" text-anchor="middle" class="small">没有证据支撑时，不把“换 HTTP/3 / 换 JWT / 改成 *”当成排障。</text>
  <path d="M415 412 C415 465 390 475 360 500" class="arrow"/>
  <path d="M735 412 C735 465 760 475 800 500" class="arrow"/>

  <text x="580" y="680" text-anchor="middle" class="small">读图：上层收集三处视角，中层把“慢”和“失效”拆成可观察问题，底层才允许做带回滚的决策。</text>
</svg>
