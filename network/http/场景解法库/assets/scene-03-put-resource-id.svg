<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <style>.t{font:20px sans-serif;fill:#333}.s{font:16px sans-serif;fill:#333}.b{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}.g{fill:#f5f5f5;stroke:#777;stroke-width:2}.bad{fill:#ffebee;stroke:#c62828;stroke-width:2}.a{stroke:#1565c0;stroke-width:3;fill:none}</style>
  <text x="40" y="42" class="t">PUT + 资源 ID：两次请求指向同一目标</text>
  <rect x="40" y="105" width="200" height="95" rx="10" class="b"/><text x="96" y="145" class="t">客户端</text><text x="68" y="175" class="s">生成 order-id</text>
  <rect x="380" y="105" width="220" height="95" rx="10" class="b"/><text x="444" y="145" class="t">PUT</text><text x="405" y="175" class="s">/orders/{same-id}</text>
  <rect x="740" y="105" width="180" height="95" rx="10" class="g"/><text x="788" y="145" class="t">订单</text><text x="766" y="175" class="s">唯一资源</text>
  <path d="M240 145H380M240 175L380 175M600 155H740" class="a"/><text x="265" y="130" class="s">尝试 1 / 2</text><text x="620" y="140" class="s">同一 ID</text>
  <rect x="245" y="300" width="470" height="72" rx="10" class="bad"/><text x="283" y="330" class="s">代价：客户端 ID 冲突、越权和部分更新语义</text><text x="383" y="354" class="s">必须先定义清楚</text>
</svg>
