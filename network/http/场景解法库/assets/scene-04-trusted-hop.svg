<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <style>.t{font:20px sans-serif;fill:#333}.s{font:16px sans-serif;fill:#333}.b{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2}.g{fill:#f5f5f5;stroke:#777;stroke-width:2}.bad{fill:#ffebee;stroke:#c62828;stroke-width:2}.a{stroke:#2e7d32;stroke-width:3;fill:none}</style>
  <text x="40" y="42" class="t">入口清洗：外部头不直接进入信任链</text>
  <rect x="30" y="105" width="175" height="85" rx="10" class="g"/><text x="86" y="145" class="t">客户端</text><text x="56" y="173" class="s">可伪造头部</text>
  <rect x="280" y="105" width="190" height="85" rx="10" class="bad"/><text x="333" y="145" class="t">入口</text><text x="307" y="173" class="s">清洗/覆盖</text>
  <rect x="545" y="105" width="165" height="85" rx="10" class="b"/><text x="592" y="145" class="t">代理</text><text x="565" y="173" class="s">追加事实</text>
  <rect x="785" y="105" width="145" height="85" rx="10" class="b"/><text x="828" y="145" class="t">应用</text><text x="802" y="173" class="s">按列表信任</text>
  <path d="M205 147H280M470 147H545M710 147H785" class="a"/><text x="213" y="132" class="s">输入</text><text x="480" y="132" class="s">可信链</text><text x="720" y="132" class="s">契约</text>
  <rect x="235" y="300" width="490" height="70" rx="10" class="bad"/><text x="271" y="330" class="s">代价：代理增删必须同步更新信任列表</text><text x="349" y="354" class="s">否则边界会过期</text>
