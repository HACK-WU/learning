<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <style>.t{font:20px sans-serif;fill:#333}.s{font:16px sans-serif;fill:#333}.b{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}.g{fill:#f5f5f5;stroke:#777;stroke-width:2}.bad{fill:#ffebee;stroke:#c62828;stroke-width:2}.a{stroke:#1565c0;stroke-width:3;fill:none}</style>
  <text x="40" y="42" class="t">精确 CORS + Bearer：认证意图显式化</text>
  <rect x="50" y="110" width="205" height="90" rx="10" class="b"/><text x="102" y="150" class="t">浏览器</text><text x="77" y="178" class="s">Authorization</text>
  <rect x="375" y="110" width="205" height="90" rx="10" class="b"/><text x="438" y="150" class="t">预检</text><text x="397" y="178" class="s">允许 Authorization</text>
  <rect x="700" y="110" width="205" height="90" rx="10" class="g"/><text x="760" y="150" class="t">API</text><text x="728" y="178" class="s">验证 Bearer</text>
  <path d="M255 155H375M580 155H700" class="a"/><text x="278" y="140" class="s">Origin + headers</text><text x="604" y="140" class="s">显式凭据</text>
  <rect x="270" y="295" width="420" height="75" rx="10" class="bad"/><text x="302" y="325" class="s">代价：token 保护、刷新、撤销仍需另行治理</text><text x="374" y="350" class="s">CORS 并没有被绕过</text>
</svg>
