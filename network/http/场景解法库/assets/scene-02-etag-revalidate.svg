<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <style>.t{font:20px sans-serif;fill:#333}.s{font:16px sans-serif;fill:#333}.b{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}.g{fill:#f5f5f5;stroke:#777;stroke-width:2}.bad{fill:#ffebee;stroke:#c62828;stroke-width:2}.a{stroke:#1565c0;stroke-width:3;fill:none}</style>
  <text x="40" y="42" class="t">ETag：存下来，但复用前验证</text>
  <rect x="40" y="110" width="190" height="85" rx="10" class="b"/><text x="98" y="148" class="t">客户端</text><text x="73" y="175" class="s">If-None-Match</text>
  <rect x="380" y="110" width="190" height="85" rx="10" class="g"/><text x="442" y="148" class="t">源站</text><text x="421" y="175" class="s">比较 ETag</text>
  <rect x="720" y="80" width="190" height="65" rx="10" class="b"/><text x="783" y="120" class="t">304</text><text x="748" y="140" class="s">无正文</text>
  <rect x="720" y="175" width="190" height="65" rx="10" class="b"/><text x="783" y="215" class="t">200</text><text x="748" y="235" class="s">新正文</text>
  <path d="M230 150H380M570 125H720M570 205H720" class="a"/><text x="252" y="135" class="s">验证请求</text><text x="596" y="110" class="s">相同</text><text x="594" y="193" class="s">变化</text>
  <rect x="260" y="300" width="440" height="68" rx="10" class="bad"/><text x="300" y="330" class="s">代价：每次验证仍消耗请求与处理能力</text><text x="375" y="353" class="s">ETag 不是永久 freshness</text>
</svg>
