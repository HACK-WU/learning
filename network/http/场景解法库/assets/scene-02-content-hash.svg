<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <style>.t{font:20px sans-serif;fill:#333}.s{font:16px sans-serif;fill:#333}.b{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2}.g{fill:#f5f5f5;stroke:#777;stroke-width:2}.bad{fill:#ffebee;stroke:#c62828;stroke-width:2}.a{stroke:#2e7d32;stroke-width:3;fill:none}</style>
  <text x="40" y="42" class="t">内容指纹：URL 变化就是版本切换</text>
  <rect x="45" y="110" width="185" height="85" rx="10" class="b"/><text x="98" y="148" class="t">HTML</text><text x="67" y="175" class="s">指向 app.abc.js</text>
  <rect x="350" y="110" width="220" height="85" rx="10" class="b"/><text x="405" y="148" class="t">CDN</text><text x="378" y="175" class="s">按指纹缓存</text>
  <rect x="690" y="110" width="220" height="85" rx="10" class="g"/><text x="748" y="148" class="t">静态文件</text><text x="730" y="175" class="s">app.abc.js</text>
  <path d="M230 153H350M570 153H690" class="a"/><text x="250" y="137" class="s">发布新 HTML</text><text x="592" y="137" class="s">长 freshness</text>
  <rect x="255" y="292" width="450" height="78" rx="10" class="bad"/><text x="292" y="323" class="s">代价：旧 HTML 仍可能引用旧文件</text><text x="333" y="348" class="s">旧版本不能过早删除，否则回滚 404</text>
</svg>
