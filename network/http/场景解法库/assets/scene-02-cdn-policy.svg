  <rect x="700" y="185" width="205" height="70" rx="10" class="g"/><text x="756" y="226" class="t">API 源站</text>
  <path d="M215 145H330M215 175L330 220M560 120H700M560 220H700" class="a"/><text x="235" y="130" class="s">public GET</text><text x="238" y="207" class="s">private</text>
  <rect x="245" y="315" width="480" height="60" rx="10" class="bad"/><text x="279" y="350" class="s">失败点：错误缓存键会跨用户复用；purge 不能替代契约</text>
