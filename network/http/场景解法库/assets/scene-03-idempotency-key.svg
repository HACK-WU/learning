<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <style>.t{font:20px sans-serif;fill:#333}.s{font:16px sans-serif;fill:#333}.b{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2}.g{fill:#f5f5f5;stroke:#777;stroke-width:2}.bad{fill:#ffebee;stroke:#c62828;stroke-width:2}.a{stroke:#2e7d32;stroke-width:3;fill:none}</style>
  <text x="40" y="42" class="t">Idempotency-Key：重试命中第一次结果</text>
  <rect x="35" y="110" width="185" height="85" rx="10" class="b"/><text x="84" y="148" class="t">客户端</text><text x="59" y="175" class="s">同一业务 key</text>
  <rect x="330" y="90" width="250" height="125" rx="10" class="g"/><text x="380" y="128" class="t">幂等记录表</text><text x="365" y="158" class="s">key + 参数摘要</text><text x="383" y="187" class="s">状态 + 最终响应</text>
  <rect x="700" y="110" width="220" height="85" rx="10" class="b"/><text x="765" y="148" class="t">订单服务</text><text x="748" y="175" class="s">只处理一次</text>
  <path d="M220 153H330M580 153H700" class="a"/><text x="240" y="138" class="s">首次 / 重试</text><text x="610" y="138" class="s">claim 后执行</text>
  <rect x="240" y="300" width="480" height="72" rx="10" class="bad"/><text x="278" y="330" class="s">代价：唯一约束、过期、并发竞态与响应存储</text><text x="394" y="354" class="s">不能只“查一下再插入”</text>
</svg>
