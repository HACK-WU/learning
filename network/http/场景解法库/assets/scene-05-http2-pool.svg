<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <style>.t{font:20px sans-serif;fill:#333}.s{font:16px sans-serif;fill:#333}.b{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}.g{fill:#f5f5f5;stroke:#777;stroke-width:2}.bad{fill:#ffebee;stroke:#c62828;stroke-width:2}.a{stroke:#1565c0;stroke-width:3;fill:none}</style>
  <text x="40" y="42" class="t">HTTP/2：少量连接承载多个 stream</text>
  <rect x="35" y="105" width="165" height="95" rx="10" class="b"/><text x="85" y="145" class="t">客户端</text><text x="66" y="174" class="s">请求 1…10</text>
  <rect x="330" y="95" width="265" height="115" rx="10" class="b"/><text x="417" y="132" class="t">H2 连接</text><text x="355" y="160" class="s">stream 1 | 2 | 3 | …</text><text x="393" y="187" class="s">一条连接复用</text>
  <rect x="730" y="105" width="190" height="95" rx="10" class="g"/><text x="787" y="145" class="t">入口</text><text x="758" y="174" class="s">协商 h2</text>
  <path d="M200 152H330M595 152H730" class="a"/>
  <rect x="225" y="300" width="510" height="72" rx="10" class="bad"/><text x="263" y="330" class="s">限制：TCP 丢包仍可能影响同一连接上的传输</text><text x="384" y="354" class="s">H2 不等于所有 HoL 消失</text>
</svg>
