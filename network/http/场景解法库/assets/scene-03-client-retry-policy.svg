<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <style>.t{font:20px sans-serif;fill:#333}.s{font:16px sans-serif;fill:#333}.b{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}.g{fill:#f5f5f5;stroke:#777;stroke-width:2}.bad{fill:#ffebee;stroke:#c62828;stroke-width:2}.a{stroke:#1565c0;stroke-width:3;fill:none}</style>
  <text x="40" y="42" class="t">客户端重试策略：先判断语义，再决定动作</text>
  <rect x="45" y="120" width="185" height="75" rx="10" class="b"/><text x="91" y="164" class="t">请求失败</text>
  <rect x="360" y="90" width="220" height="70" rx="10" class="b"/><text x="405" y="132" class="t">安全方法</text><text x="395" y="150" class="s">有限退避重试</text>
  <rect x="360" y="190" width="220" height="70" rx="10" class="g"/><text x="405" y="232" class="t">未知写结果</text><text x="408" y="250" class="s">查询/确认</text>
  <rect x="720" y="90" width="190" height="70" rx="10" class="b"/><text x="778" y="132" class="t">恢复</text>
  <rect x="720" y="190" width="190" height="70" rx="10" class="g"/><text x="774" y="232" class="t">不重放</text>
  <path d="M230 155H360M230 175L360 225M580 125H720M580 225H720" class="a"/><text x="252" y="142" class="s">幂等</text><text x="252" y="212" class="s">非幂等</text>
  <rect x="245" y="315" width="470" height="55" rx="10" class="bad"/><text x="280" y="349" class="s">失败点：把所有超时都当成“未执行”</text>
</svg>
