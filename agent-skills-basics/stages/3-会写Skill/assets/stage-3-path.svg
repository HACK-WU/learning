<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">阶段 3 · 会写 Skill —— 学习路径</text>

  <rect x="30" y="60" width="290" height="190" rx="10" fill="#eaf7ea" stroke="#5cb85c" stroke-width="2"/>
  <rect x="30" y="60" width="290" height="36" rx="10" fill="#5cb85c"/>
  <rect x="30" y="80" width="290" height="16" fill="#5cb85c"/>
  <text x="175" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">课 5 · 写第一个 SKILL.md</text>
  <text x="175" y="118" text-anchor="middle" font-size="12" fill="#1a1a1a">实操层：从 0 到 1</text>
  <text x="175" y="142" text-anchor="middle" font-size="11" fill="#555555">① 从重复的事到技能</text>
  <text x="175" y="162" text-anchor="middle" font-size="11" fill="#555555">② 六段式写法</text>
  <text x="175" y="182" text-anchor="middle" font-size="11" fill="#555555">③ 让 AI 写 + 你来审</text>
  <text x="175" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a2d">产出：1 个自己写的</text>
  <text x="175" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a2d">SKILL.md</text>

  <path d="M 328 155 L 356 155" stroke="#888888" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="342" y="147" text-anchor="middle" font-size="10" fill="#888888">能用</text>
  <text x="342" y="175" text-anchor="middle" font-size="10" fill="#888888">够吗</text>

  <rect x="364" y="60" width="290" height="190" rx="10" fill="#eaf7ea" stroke="#5cb85c" stroke-width="2"/>
  <rect x="364" y="60" width="290" height="36" rx="10" fill="#5cb85c"/>
  <rect x="364" y="80" width="290" height="16" fill="#5cb85c"/>
  <text x="509" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">课 6 · 写好、排障与安全</text>
  <text x="509" y="118" text-anchor="middle" font-size="12" fill="#1a1a1a">机制层：从能用 to 可靠</text>
  <text x="509" y="142" text-anchor="middle" font-size="11" fill="#555555">① 五种坏味道</text>
  <text x="509" y="162" text-anchor="middle" font-size="11" fill="#555555">② 不触发的四步排查</text>
  <text x="509" y="182" text-anchor="middle" font-size="11" fill="#555555">③ 脚本类技能的安全边界</text>
  <text x="509" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a2d">产出：能修好自己的技能</text>
  <text x="509" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a2d">且知道风险在哪</text>

  <path d="M 662 155 L 690 155" stroke="#888888" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="676" y="147" text-anchor="middle" font-size="10" fill="#888888">能</text>
  <text x="676" y="175" text-anchor="middle" font-size="10" fill="#888888">复用吗</text>

  <rect x="698" y="60" width="232" height="190" rx="10" fill="#eaf7ea" stroke="#5cb85c" stroke-width="2"/>
  <rect x="698" y="60" width="232" height="36" rx="10" fill="#5cb85c"/>
  <rect x="698" y="80" width="232" height="16" fill="#5cb85c"/>
  <text x="814" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">课 7 · 拆分共享</text>
  <text x="814" y="118" text-anchor="middle" font-size="12" fill="#1a1a1a">定位层：从可靠 to 可复用</text>
  <text x="814" y="142" text-anchor="middle" font-size="11" fill="#555555">① 多文件拆分</text>
  <text x="814" y="162" text-anchor="middle" font-size="11" fill="#555555">② 技能边界划分</text>
  <text x="814" y="182" text-anchor="middle" font-size="11" fill="#555555">③ 团队共享与版本</text>
  <text x="814" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a2d">产出：能给别人用</text>
  <text x="814" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a2d">的技能</text>

  <rect x="30" y="266" width="900" height="26" rx="5" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
  <text x="480" y="283" text-anchor="middle" font-size="11" fill="#333333">本阶段产出：1 个自己写的、真会被触发的技能 —— 之后进入综合实战项目做跨阶段整合</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#888888"/>
    </marker>
  </defs>
</svg>
