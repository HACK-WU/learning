<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">阶段 1 · 理解 Skill —— 学习路径</text>

  <rect x="40" y="60" width="380" height="190" rx="10" fill="#e8f4fd" stroke="#4a90d9" stroke-width="2"/>
  <rect x="40" y="60" width="380" height="36" rx="10" fill="#4a90d9"/>
  <rect x="40" y="80" width="380" height="16" fill="#4a90d9"/>
  <text x="230" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">课 1 · Skill 到底是什么</text>
  <text x="230" y="118" text-anchor="middle" font-size="12" fill="#1a1a1a">感知层：它长什么样</text>
  <text x="230" y="142" text-anchor="middle" font-size="11" fill="#555555">① 文件夹 = 技能</text>
  <text x="230" y="162" text-anchor="middle" font-size="11" fill="#555555">② SKILL.md 的两段结构</text>
  <text x="230" y="182" text-anchor="middle" font-size="11" fill="#555555">③ 它不是插件 / 提示词 / 记忆</text>
  <text x="230" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c6fad">产出：能指着一个文件夹</text>
  <text x="230" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c6fad">说清哪部分是必填的</text>

  <path d="M 428 155 L 466 155" stroke="#888888" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="447" y="147" text-anchor="middle" font-size="10" fill="#888888">为什么</text>
  <text x="447" y="175" text-anchor="middle" font-size="10" fill="#888888">要有它</text>

  <rect x="474" y="60" width="386" height="190" rx="10" fill="#fff4e6" stroke="#e8a33d" stroke-width="2"/>
  <rect x="474" y="60" width="386" height="36" rx="10" fill="#e8a33d"/>
  <rect x="474" y="80" width="386" height="16" fill="#e8a33d"/>
  <text x="667" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">课 2 · 为什么需要 Skill</text>
  <text x="667" y="118" text-anchor="middle" font-size="12" fill="#1a1a1a">概念层 + 机制层：为什么存在</text>
  <text x="667" y="142" text-anchor="middle" font-size="11" fill="#555555">① AI 的失忆特性与三个笨办法</text>
  <text x="667" y="162" text-anchor="middle" font-size="11" fill="#555555">② 渐进式披露（三步读取）</text>
  <text x="667" y="182" text-anchor="middle" font-size="11" fill="#555555">③ 一致性 / 省事 / 可共享</text>
  <text x="667" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a12">产出：能用自己话解释</text>
  <text x="667" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a12">「渐进式披露」</text>

  <rect x="40" y="266" width="820" height="26" rx="5" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
  <text x="450" y="283" text-anchor="middle" font-size="11" fill="#333333">本阶段产出：能讲清 Skill 是什么、为什么需要它 —— 为阶段 2 动手安装建立心智模型</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#888888"/>
    </marker>
  </defs>
</svg>
