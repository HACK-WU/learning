# Prometheus 抓取配置（结课实战项目）
#
# 关键：Collector 的 prometheus exporter 暴露在 8889，
# Prometheus 主动来 scrape —— 这是课 7 验证过的 pull 模式。
global:
  scrape_interval: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: capstone-gateway
    static_configs:
      - targets: ["capstone-gateway:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
