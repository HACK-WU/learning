<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1170" width="1240" height="1170" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546778"/>
    </marker>
  </defs>

  <rect width="1240" height="1170" fill="#ffffff"/>

  <text x="620" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">OpenTelemetry 学习路径总览</text>
  <text x="620" y="70" text-anchor="middle" font-size="14" fill="#6b7280">故事主线：一次 502 的四小时 · 4 阶段 / 12 课 / 42 知识点</text>

  <!-- 痛点 -->
  <rect x="60" y="96" width="1120" height="66" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="620" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">痛点：一次 502，三个控制台查了四小时</text>
  <text x="620" y="146" text-anchor="middle" font-size="13" fill="#7f1d1d">指标不知道请求是谁 · 日志没有 trace_id · 链路断在网关 · 三者没有共同的钥匙</text>

  <path d="M 620 162 L 620 192" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段 1 -->
  <rect x="60" y="196" width="1120" height="176" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="224" font-size="16" font-weight="700" fill="#1e40af">阶段 1 · 三个控制台的四小时</text>
  <text x="80" y="244" font-size="12" fill="#1d4ed8">为什么需要 OTel ｜ 9 知识点 ｜ 课 1-3</text>

  <rect x="86" y="258" width="340" height="94" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="102" y="282" font-size="14" font-weight="600" fill="#1f2937">课 1 一次 502 的四小时</text>
  <text x="102" y="303" font-size="12" fill="#4b5563">· 碎片化的真实代价</text>
  <text x="102" y="322" font-size="12" fill="#4b5563">· 三根支柱与它们的割裂</text>
  <text x="102" y="341" font-size="12" fill="#9ca3af">感知层：先感受痛</text>

  <rect x="450" y="258" width="340" height="94" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="466" y="282" font-size="14" font-weight="600" fill="#1f2937">课 2 OTel 是什么与它不是什么</text>
  <text x="466" y="303" font-size="12" fill="#4b5563">· 四大组件 · 五条边界</text>
  <text x="466" y="322" font-size="12" fill="#4b5563">· 起源：OpenTracing + OpenCensus</text>
  <text x="466" y="341" font-size="12" fill="#9ca3af">概念层：认识主角</text>

  <rect x="814" y="258" width="340" height="94" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="830" y="282" font-size="14" font-weight="600" fill="#1f2937">课 3 跑起来：第一个 Trace</text>
  <text x="830" y="303" font-size="12" fill="#4b5563">· 环境搭建 · 第一个 Trace</text>
  <text x="830" y="322" font-size="12" fill="#4b5563">· Resource：数据是谁发的</text>
  <text x="830" y="341" font-size="12" fill="#9ca3af">实操层：先跑通再说</text>

  <path d="M 426 305 L 444 305" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 790 305 L 808 305" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 620 372 L 620 400" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段 2 -->
  <rect x="60" y="404" width="1120" height="176" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="80" y="432" font-size="16" font-weight="700" fill="#115e59">阶段 2 · 一次请求的完整旅程</text>
  <text x="80" y="452" font-size="12" fill="#0f766e">Traces ｜ 10 知识点 ｜ 课 4-6</text>

  <rect x="86" y="466" width="340" height="94" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="102" y="490" font-size="14" font-weight="600" fill="#1f2937">课 4 Span 与上下文传播</text>
  <text x="102" y="511" font-size="12" fill="#4b5563">· Span 结构 · trace_id / span_id</text>
  <text x="102" y="530" font-size="12" fill="#4b5563">· W3C Trace Context · Baggage</text>
  <text x="102" y="549" font-size="12" fill="#9ca3af">机制层：钥匙怎么传</text>

  <rect x="450" y="466" width="340" height="94" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="466" y="490" font-size="14" font-weight="600" fill="#1f2937">课 5 手动与自动插桩</text>
  <text x="466" y="511" font-size="12" fill="#4b5563">· Tracer API 与 Span 生命周期</text>
  <text x="466" y="530" font-size="12" fill="#4b5563">· 零代码自动插桩 · 事件与异常</text>
  <text x="466" y="549" font-size="12" fill="#9ca3af">实操层：两种插桩法</text>

  <rect x="814" y="466" width="340" height="94" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="830" y="490" font-size="14" font-weight="600" fill="#1f2937">课 6 采样：成本与真相的权衡</text>
  <text x="830" y="511" font-size="12" fill="#4b5563">· 为什么必须采样</text>
  <text x="830" y="530" font-size="12" fill="#4b5563">· 头部采样 vs 尾部采样</text>
  <text x="830" y="549" font-size="12" fill="#9ca3af">定位层：真相的代价</text>

  <path d="M 426 513 L 444 513" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 790 513 L 808 513" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 620 580 L 620 608" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段 3 -->
  <rect x="60" y="612" width="1120" height="176" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="80" y="640" font-size="16" font-weight="700" fill="#854d0e">阶段 3 · 指标与日志</text>
  <text x="80" y="660" font-size="12" fill="#a16207">另外两个信号 ｜ 11 知识点 ｜ 课 7-9</text>

  <rect x="86" y="674" width="340" height="94" rx="8" fill="#ffffff" stroke="#fde047" stroke-width="1.5"/>
  <text x="102" y="698" font-size="14" font-weight="600" fill="#1f2937">课 7 指标模型与六种 Instruments</text>
  <text x="102" y="719" font-size="12" fill="#4b5563">· 指标模型 · 六种 Instruments</text>
  <text x="102" y="738" font-size="12" fill="#4b5563">· Exponential Histogram · Exemplar</text>
  <text x="102" y="757" font-size="12" fill="#9ca3af">机制层：系统发生了什么</text>

  <rect x="450" y="674" width="340" height="94" rx="8" fill="#ffffff" stroke="#fde047" stroke-width="1.5"/>
  <text x="466" y="698" font-size="14" font-weight="600" fill="#1f2937">课 8 日志桥接与信号关联</text>
  <text x="466" y="719" font-size="12" fill="#4b5563">· 日志桥接 API（不替换日志库）</text>
  <text x="466" y="738" font-size="12" fill="#4b5563">· trace_id 自动注入 · 采集两条路</text>
  <text x="466" y="757" font-size="12" fill="#9ca3af">实操层：系统说了什么</text>

  <rect x="814" y="674" width="340" height="94" rx="8" fill="#ffffff" stroke="#fde047" stroke-width="1.5"/>
  <text x="830" y="698" font-size="14" font-weight="600" fill="#1f2937">课 9 语义约定：命名的战争</text>
  <text x="830" y="719" font-size="12" fill="#4b5563">· 语义约定是什么 · 稳定性等级</text>
  <text x="830" y="738" font-size="12" fill="#b45309">· HTTP 属性的弃用与迁移（易错）</text>
  <text x="830" y="757" font-size="12" fill="#9ca3af">定位层：说同一种语言</text>

  <path d="M 426 721 L 444 721" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 790 721 L 808 721" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 620 788 L 620 816" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段 4 -->
  <rect x="60" y="820" width="1120" height="176" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="80" y="848" font-size="16" font-weight="700" fill="#5b21b6">阶段 4 · 生产落地</text>
  <text x="80" y="868" font-size="12" fill="#6d28d9">敢不敢上 ｜ 12 知识点 ｜ 课 10-12</text>

  <rect x="86" y="882" width="340" height="94" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="102" y="906" font-size="14" font-weight="600" fill="#1f2937">课 10 Collector 管道</text>
  <text x="102" y="927" font-size="12" fill="#4b5563">· 可观测性的 nginx</text>
  <text x="102" y="946" font-size="12" fill="#4b5563">· Receiver / Processor / Exporter</text>
  <text x="102" y="965" font-size="12" fill="#9ca3af">机制层：管道怎么搭</text>

  <rect x="450" y="882" width="340" height="94" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="466" y="906" font-size="14" font-weight="600" fill="#1f2937">课 11 部署拓扑与成本治理</text>
  <text x="466" y="927" font-size="12" fill="#4b5563">· Agent / Gateway / 混合拓扑</text>
  <text x="466" y="946" font-size="12" fill="#4b5563">· 数据量与 Cardinality · K8s Operator</text>
  <text x="466" y="965" font-size="12" fill="#9ca3af">实操层：规模化与账单</text>

  <rect x="814" y="882" width="340" height="94" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="830" y="906" font-size="14" font-weight="600" fill="#1f2937">课 12 选型决策与收束</text>
  <text x="830" y="927" font-size="12" fill="#4b5563">· Profiles 第四信号 · 横向对比</text>
  <text x="830" y="946" font-size="12" fill="#4b5563">· 迁移路径 · 收束</text>
  <text x="830" y="965" font-size="12" fill="#9ca3af">定位层：该不该上</text>

  <path d="M 426 929 L 444 929" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 790 929 L 808 929" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 620 996 L 620 1024" stroke="#546778" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 收束 -->
  <rect x="60" y="1028" width="1120" height="106" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="620" y="1058" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">能回答：下一次 502，还要不要四个小时？</text>
  <text x="620" y="1082" text-anchor="middle" font-size="13" fill="#047857">如果只要十分钟 —— 可观测体系要怎么搭、采样率怎么定、要付多少代价</text>
  <text x="620" y="1106" text-anchor="middle" font-size="12" fill="#059669">统一的钥匙 = trace_id（贯通链路 · 指标 Exemplar · 日志 · 火焰图）</text>
  <text x="620" y="1126" text-anchor="middle" font-size="12" fill="#059669">插桩一次，随处消费 —— 换后端是 Collector 的配置变更，不是代码变更</text>
</svg>
