<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Microsoft YaHei, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">怎么判断部署真的成功了：看哪里，不看哪里</text>

  <!-- 表头 -->
  <rect x="40" y="52" width="380" height="30" fill="#d93025"/>
  <text x="230" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">❌ 错的判据（会被误导）</text>
  <rect x="480" y="52" width="380" height="30" fill="#188038"/>
  <text x="670" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">✅ 对的判据（看真实状态）</text>

  <!-- 行1：release 状态 -->
  <rect x="40" y="86" width="380" height="86" fill="#fce8e6" stroke="#d93025" stroke-width="1"/>
  <text x="56" y="108" font-size="13" font-weight="bold" fill="#c5221f">helm list</text>
  <text x="56" y="130" font-size="12.5" fill="#333">8 个 release 全部显示 failed</text>
  <text x="56" y="152" font-size="12.5" fill="#c5221f">→ 误判：部署失败，去改配置</text>
  <text x="56" y="168" font-size="12" fill="#5f6368">实际：配置 100% 正确，改了反而坏</text>

  <rect x="480" y="86" width="380" height="86" fill="#e6f4ea" stroke="#188038" stroke-width="1"/>
  <text x="496" y="108" font-size="13" font-weight="bold" fill="#137333">kubectl get pods</text>
  <text x="496" y="130" font-size="12.5" fill="#333">看 READY 列是否逐步 1/1</text>
  <text x="496" y="152" font-size="12.5" fill="#137333">→ 正确：Pod 在陆续就绪</text>
  <text x="496" y="168" font-size="12" fill="#5f6368">实测：mongodb / mysql8 / rabbitmq 已 1/1</text>

  <!-- 行2：退出码 -->
  <rect x="40" y="178" width="380" height="86" fill="#fce8e6" stroke="#d93025" stroke-width="1"/>
  <text x="56" y="200" font-size="13" font-weight="bold" fill="#c5221f">容器退出码 137</text>
  <text x="56" y="222" font-size="12.5" fill="#333">教科书：SIGKILL = OOM</text>
  <text x="56" y="244" font-size="12.5" fill="#c5221f">→ 误判：去加内存</text>
  <text x="56" y="260" font-size="12" fill="#5f6368">实际：内存 39G 空闲，加了也没用</text>

  <rect x="480" y="178" width="380" height="86" fill="#e6f4ea" stroke="#188038" stroke-width="1"/>
  <text x="496" y="200" font-size="13" font-weight="bold" fill="#137333">kubectl describe pod</text>
  <text x="496" y="222" font-size="12.5" fill="#333">读 Events 原文，找 Killing 原因</text>
  <text x="496" y="244" font-size="12.5" fill="#137333">→ 正确：failed liveness probe</text>
  <text x="496" y="260" font-size="12" fill="#5f6368">事件是权威，退出码只是结果</text>

  <!-- 行3：PVC -->
  <rect x="40" y="270" width="380" height="86" fill="#fef7e0" stroke="#f9ab00" stroke-width="1"/>
  <text x="56" y="292" font-size="13" font-weight="bold" fill="#ea8600">只看 Pod 数量</text>
  <text x="56" y="314" font-size="12.5" fill="#333">忽略存储是否真正落地</text>
  <text x="56" y="336" font-size="12.5" fill="#ea8600">→ 风险：Pod 起了但数据没处写</text>
  <text x="56" y="352" font-size="12" fill="#5f6368">PVC pending 会导致 Pod 永远起不来</text>

  <rect x="480" y="270" width="380" height="86" fill="#e6f4ea" stroke="#188038" stroke-width="1"/>
  <text x="496" y="292" font-size="13" font-weight="bold" fill="#137333">kubectl get pvc</text>
  <text x="496" y="314" font-size="12.5" fill="#333">确认 STATUS 全部 Bound</text>
  <text x="496" y="336" font-size="12.5" fill="#137333">→ 正确：11/11 全部 Bound</text>
  <text x="496" y="352" font-size="12" fill="#5f6368">证明 StorageClass 选型正确</text>
</svg>
