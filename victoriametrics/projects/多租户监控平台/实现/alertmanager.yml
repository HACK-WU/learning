# alertmanager 配置（综合实战项目）
# 刻意不配真实的邮件/Slack，改用 webhook 打到日志里，便于离线验证
global:
  resolve_timeout: 1m

route:
  receiver: default
  group_by: ['alertname', 'tenant']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 5m

  routes:
    # critical 走独立接收器，便于观察分级是否生效
    - receiver: critical-route
      matchers:
        - severity="critical"
      group_wait: 2s

receivers:
  - name: default
    webhook_configs:
      - url: 'http://127.0.0.1:9094/'
        send_resolved: true

  - name: critical-route
    webhook_configs:
      - url: 'http://127.0.0.1:9094/critical'
        send_resolved: true

# ⚠ 说明：webhook 打到 127.0.0.1:9094 在本环境没有接收端，
# 这是有意为之 —— alertmanager 会把投递失败记进自己的日志，
# 我们验证的是「告警是否被正确分组与路由」，而不是「消息是否送达」。
# 想看告警内容，直接看 vmalert 的 /api/v1/alerts 即可。
