  <line x1="60" y1="582" x2="1120" y2="582" stroke="#cfd8dc" stroke-width="1"/>

  <text x="60" y="608" class="axis">阶段依赖说明</text>
  <text x="60" y="630" font-size="12" fill="#37474f">· 阶段 1 → 2：先懂「声明式」再谈「谁来保证声明成立」（控制器）</text>
  <text x="60" y="650" font-size="12" fill="#37474f">· 阶段 2 → 3：先有工作负载，才谈怎么被访问与被隔离</text>
  <text x="60" y="670" font-size="12" fill="#37474f">· 阶段 3 → 4：跑通之后才谈配置、持久化、资源治理与工程化</text>
  <text x="60" y="690" font-size="12" fill="#37474f">· 阶段 4 → 5 → 6：能跑通、能维护之后，才谈安全加固与系统化排障（安全与排障也反向依赖前四阶段的机制理解）</text>

  <rect x="60" y="708" width="1060" height="80" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="80" y="732" font-size="13" font-weight="bold" fill="#263238">🎯 贯穿全课程的「决策参考」线（用户目标之一）</text>
  <text x="80" y="754" font-size="12" fill="#37474f">· 课 1 埋种子（适用边界） → 课 9（入口选型） → 课 14（工程化选型） → 课 20（决策清单收口）</text>
  <text x="80" y="776" font-size="12" fill="#37474f">· Phase 4 课程手册汇总「决策清单」　· Phase 5 场景解法库以设计题升华</text>
