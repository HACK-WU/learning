<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570">
  <rect width="900" height="570" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a">从"命令没人接收"到"15 秒后有机器应答"——用容器假装出几台机器</text>
  <text x="450" y="49" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#666666">本课只解决一件事：让你敲下的那条命令，有地方接收、并且真的回应你</text>

  <rect x="40" y="68" width="250" height="172" rx="8" fill="#ebf8ff" stroke="#2c5282" stroke-width="2"/>
  <text x="165" y="94" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2c5282">① 你想做的事</text>
  <text x="58" y="122" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">敲一条命令，问一句</text>
  <text x="58" y="142" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">"现在上面都有什么"</text>
  <line x1="58" y1="158" x2="272" y2="158" stroke="#bee3f8" stroke-width="1"/>
  <text x="58" y="180" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">期待：回给你一个清单</text>
  <text x="58" y="208" font-family="sans-serif" font-size="11.5" fill="#2c5282">就像问仓库：现在存了哪些货</text>
  <text x="58" y="226" font-family="sans-serif" font-size="11.5" fill="#2c5282">你只关心答案，不关心仓库怎么盖</text>

  <polygon points="295,154 320,154 320,148 330,154 320,160 320,154" fill="#718096"/>

  <rect x="340" y="68" width="250" height="172" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="465" y="94" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c53030">② 卡在哪</text>
  <text x="358" y="122" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">这种命令不是本机自己算，</text>
  <text x="358" y="142" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">它要有个"接收方"来应答</text>
  <line x1="358" y1="158" x2="572" y2="158" stroke="#fed7d7" stroke-width="1"/>
  <text x="358" y="180" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">你电脑上现在没有接收方</text>
  <text x="358" y="206" font-family="monospace" font-size="11" fill="#c53030">Command 'kubectl' not found</text>
  <text x="358" y="226" font-family="monospace" font-size="11" fill="#c53030">localhost:8080 ... refused</text>

  <polygon points="595,154 620,154 620,148 630,154 620,160 620,154" fill="#718096"/>

  <rect x="640" y="68" width="220" height="172" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="750" y="94" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#276749">③ 本课的思路</text>
  <text x="656" y="122" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">不去搞几台真机器</text>
  <text x="656" y="147" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">用"容器"假装成机器</text>
  <text x="656" y="167" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">凑出一个最小的小集群</text>
  <line x1="656" y1="183" x2="844" y2="183" stroke="#c6f6d5" stroke-width="1"/>
  <text x="656" y="206" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">约 15 秒后，命令就有</text>
  <text x="656" y="226" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">地方可去、有人应答</text>

  <text x="450" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">那几台"假装的机器"是怎么来的</text>

  <rect x="40" y="294" width="240" height="132" rx="8" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="160" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d3748">本机已装的 Docker</text>
  <text x="58" y="346" font-family="sans-serif" font-size="12" fill="#1a1a1a">它本来就能跑"容器"——</text>
  <text x="58" y="366" font-family="sans-serif" font-size="12" fill="#1a1a1a">一个个轻量、秒起、</text>
  <text x="58" y="386" font-family="sans-serif" font-size="12" fill="#1a1a1a">彼此隔离的小盒子</text>
  <text x="58" y="411" font-family="sans-serif" font-size="11.5" fill="#4a5568">本课第一步就是确认它在</text>

  <polygon points="285,360 310,360 310,354 320,360 310,366 310,360" fill="#718096"/>

  <rect x="330" y="294" width="240" height="132" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="450" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c05621">容器 ①：当"发令的"</text>
  <text x="348" y="346" font-family="sans-serif" font-size="12" fill="#1a1a1a">接收你的命令、记下</text>
  <text x="348" y="366" font-family="sans-serif" font-size="12" fill="#1a1a1a">"应该是什么样"、</text>
  <text x="348" y="386" font-family="sans-serif" font-size="12" fill="#1a1a1a">并盯着现实去对齐</text>
  <text x="348" y="411" font-family="sans-serif" font-size="11.5" fill="#c05621">它就是你要找的"接收方"</text>

  <polygon points="575,360 600,360 600,354 610,360 600,366 600,360" fill="#718096"/>

  <rect x="620" y="294" width="240" height="132" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="740" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c05621">容器 ②：当"干活的"</text>
  <text x="638" y="346" font-family="sans-serif" font-size="12" fill="#1a1a1a">真正把你交代的活</text>
  <text x="638" y="366" font-family="sans-serif" font-size="12" fill="#1a1a1a">跑起来、跑着、</text>
  <text x="638" y="386" font-family="sans-serif" font-size="12" fill="#1a1a1a">挂了再拉起来</text>
  <text x="638" y="411" font-family="sans-serif" font-size="11.5" fill="#c05621">本课实测：它上面没有门槛</text>

  <rect x="40" y="450" width="820" height="96" rx="8" fill="#fffbea" stroke="#d69e2e" stroke-width="2"/>
  <text x="450" y="476" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#975a16">⚠️ 但它终究是"假装"的 —— 四个地方不像真机器</text>
  <text x="62" y="500" font-family="sans-serif" font-size="12" fill="#1a1a1a">① 没有云厂商那种外部入口，写了也一直是空的     ② 关机休眠后集群可能就没了</text>
  <text x="62" y="520" font-family="sans-serif" font-size="12" fill="#1a1a1a">③ 想看"占了多少资源"得额外装一个东西           ④ 容器的资源上限不等于机器的资源上限</text>
  <text x="62" y="538" font-family="sans-serif" font-size="11.5" fill="#975a16">这四个坑本课逐个实测给你看 —— 它们不是故障，是"假装"的代价</text>
</svg>
