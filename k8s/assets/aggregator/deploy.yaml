apiVersion: v1
kind: Namespace
metadata:
  name: aggregator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-apiserver
  namespace: aggregator
  labels:
    app: hello-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-apiserver
  template:
    metadata:
      labels:
        app: hello-apiserver
    spec:
      containers:
      - name: apiserver
        image: hello-apiserver:latest
        imagePullPolicy: Never           # kind 本地镜像，禁止去远端拉
        ports:
        - containerPort: 8443
          name: https
        volumeMounts:
        - name: certs
          mountPath: /etc/apiserver/certs
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
      volumes:
      - name: certs
        secret:
          secretName: hello-apiserver-certs
---
apiVersion: v1
kind: Service
metadata:
  name: hello-apiserver
  namespace: aggregator
spec:
  selector:
    app: hello-apiserver
  ports:
  - port: 443
    targetPort: 8443
    name: https
---
# 聚合层关键 RBAC：
# extension-apiserver 需要这些权限才能完成「认证/授权委托」和「APIService 可用性上报」
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hello-apiserver-auth-delegator
rules:
# 认证委托：把客户端 token 交给主 API Server 验证
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
# 授权委托：问主 API Server "这个用户能干这事吗"
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hello-apiserver-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hello-apiserver-auth-delegator
subjects:
- kind: ServiceAccount
  name: default
  namespace: aggregator
---
# system:auth-delegator 是内置的，生产必须绑定
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hello-apiserver-system-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: default
  namespace: aggregator
