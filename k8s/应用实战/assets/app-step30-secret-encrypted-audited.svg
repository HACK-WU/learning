<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
  <rect width="760" height="340" fill="#f4fbf4"/>
  <text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">综合版：存储加密 + 操作留痕（高亮 = 本步新增）</text>

  <rect x="30" y="50" width="140" height="55" rx="8" fill="#e8f0fe" stroke="#5b8def" stroke-width="2"/>
  <text x="100" y="73" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">密钥对象</text>
  <text x="100" y="91" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">存进集群</text>

  <line x1="170" y1="78" x2="240" y2="78" stroke="#555" stroke-width="2" marker-end="url(#ag4)"/>

  <rect x="240" y="48" width="180" height="60" rx="8" fill="#e6f7e6" stroke="#4caf50" stroke-width="3"/>
  <text x="330" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">写入前先加密</text>
  <text x="330" y="90" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">密钥由集群保管</text>

  <line x1="420" y1="78" x2="490" y2="78" stroke="#4caf50" stroke-width="3" marker-end="url(#ag4)"/>

  <rect x="490" y="48" width="240" height="60" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="610" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">落盘是密文</text>
  <text x="610" y="90" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">拿到备份也读不出</text>

  <line x1="610" y1="108" x2="610" y2="140" stroke="#4caf50" stroke-width="2" marker-end="url(#ag4)"/>

  <rect x="490" y="140" width="240" height="50" rx="8" fill="#e6f7e6" stroke="#4caf50" stroke-width="2"/>
  <text x="610" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">读取时自动解开</text>
  <text x="610" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">用法不变，无感知</text>

  <rect x="30" y="130" width="400" height="60" rx="8" fill="#fff8e1" stroke="#f0ad4e" stroke-width="2"/>
  <text x="45" y="152" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d9534f">注意：只管之后建的，存量要重写</text>
  <text x="45" y="173" font-family="sans-serif" font-size="11" fill="#666">开启前就存在的仍是老样子，必须逐个重写一遍。</text>

  <rect x="30" y="205" width="700" height="55" rx="8" fill="#e6f7e6" stroke="#4caf50" stroke-width="3"/>
  <text x="45" y="227" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">同时：每一次操作都留痕</text>
  <text x="45" y="247" font-family="sans-serif" font-size="11" fill="#666">谁 · 什么时候 · 对什么 · 做了什么 —— 事后可追溯</text>

  <rect x="30" y="275" width="340" height="48" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="200" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">到这一步：备份泄漏 ≠ 密钥泄漏</text>
  <text x="200" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">多了一层保护</text>

  <rect x="390" y="275" width="340" height="48" rx="8" fill="#e6f7e6" stroke="#4caf50" stroke-width="2"/>
  <text x="560" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">且能回答"谁动过"</text>
  <text x="560" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">审计留痕可追溯</text>

  <defs>
    <marker id="ag4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4caf50"/>
    </marker>
  </defs>
</svg>
