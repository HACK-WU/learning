<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
  <rect width="760" height="340" fill="#f4fbf4"/>
  <text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">综合版：先钉下限，再动手</text>

  <rect x="30" y="50" width="200" height="70" rx="8" fill="#e6f7e6" stroke="#4caf50" stroke-width="3"/>
  <text x="130" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">第 1 步：钉下限</text>
  <text x="130" y="93" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">声明"至少留几个"</text>
  <text x="130" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">集群必须遵守</text>

  <line x1="230" y1="85" x2="290" y2="85" stroke="#4caf50" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="290" y="50" width="200" height="70" rx="8" fill="#e6f7e6" stroke="#4caf50" stroke-width="3"/>
  <text x="390" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">第 2 步：腾空</text>
  <text x="390" y="93" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">集群边挪边数</text>
  <text x="390" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">不够就等</text>

  <line x1="490" y1="85" x2="550" y2="85" stroke="#4caf50" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="550" y="50" width="180" height="70" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="640" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">服务不断</text>
  <text x="640" y="93" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">始终有人在干活</text>
  <text x="640" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">维护 ≠ 事故</text>

  <rect x="30" y="140" width="340" height="85" rx="8" fill="#fff8e1" stroke="#f0ad4e" stroke-width="3"/>
  <text x="45" y="162" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d9534f">实测观察 1：腾空会"卡住"</text>
  <text x="45" y="183" font-family="sans-serif" font-size="11" fill="#666">有下限保护时，集群会一直重试</text>
  <text x="45" y="200" font-family="sans-serif" font-size="11" fill="#666">直到能满足下限为止。</text>
  <text x="45" y="217" font-family="sans-serif" font-size="11" fill="#666">这不是坏了，是保护在起作用。</text>

  <rect x="390" y="140" width="340" height="85" rx="8" fill="#fff8e1" stroke="#f0ad4e" stroke-width="3"/>
  <text x="405" y="162" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d9534f">实测观察 2：副本会分散</text>
  <text x="405" y="183" font-family="sans-serif" font-size="11" fill="#666">腾空后重新安置，两个副本</text>
  <text x="405" y="200" font-family="sans-serif" font-size="11" fill="#666">被分到了不同机器上。</text>
  <text x="405" y="217" font-family="sans-serif" font-size="11" fill="#666">反而比原来更均衡。</text>

  <rect x="30" y="240" width="700" height="42" rx="8" fill="#e6f7e6" stroke="#4caf50" stroke-width="2"/>
  <text x="45" y="260" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">关键认知：副本分散是"尽量"不是"保证"</text>
  <text x="45" y="277" font-family="sans-serif" font-size="11" fill="#666">要看清实际落在哪里，别只看有几份。</text>

  <rect x="30" y="292" width="700" height="40" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="45" y="311" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">验证手段也要选对：</text>
  <text x="45" y="327" font-family="sans-serif" font-size="11" fill="#666">有的探测工具会给出假警报 —— 实测中它一直在误报，真实情况要用最终链路确认。</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4caf50"/>
    </marker>
  </defs>
</svg>
