<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="400" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="22" y="150" width="92" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="68" y="176" text-anchor="middle" font-size="14" fill="#0c4a6e" font-weight="600">访问方</text>
  <text x="68" y="196" text-anchor="middle" font-size="12" fill="#075985">持续请求</text>

  <rect x="156" y="150" width="104" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="208" y="176" text-anchor="middle" font-size="14" fill="#312e81" font-weight="600">转发口</text>
  <text x="208" y="196" text-anchor="middle" font-size="12" fill="#4338ca">两个后端轮着发</text>

  <!-- 两个副本 -->
  <rect x="300" y="86" width="160" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="112" text-anchor="middle" font-size="14" fill="#14532d" font-weight="600">副本 A</text>
  <text x="380" y="132" text-anchor="middle" font-size="12" fill="#15803d">正常服务中</text>

  <rect x="300" y="212" width="160" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="380" y="238" text-anchor="middle" font-size="14" fill="#78350f" font-weight="700">副本 B（正在退场）</text>
  <text x="380" y="258" text-anchor="middle" font-size="12" fill="#92400e">先排水，暂不接新活</text>

  <!-- 新副本补位 -->
  <rect x="300" y="320" width="160" height="62" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="380" y="346" text-anchor="middle" font-size="14" fill="#065f46" font-weight="700">副本 C（刚补上）</text>
  <text x="380" y="366" text-anchor="middle" font-size="12" fill="#047857">顶替 B 的位置</text>

  <!-- 三个机制 -->
  <rect x="512" y="26" width="226" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="625" y="50" text-anchor="middle" font-size="14" fill="#065f46" font-weight="700">① 开场准备</text>
  <text x="625" y="70" text-anchor="middle" font-size="12" fill="#047857">依赖没好就不启动</text>
  <text x="625" y="88" text-anchor="middle" font-size="12" fill="#047857">→ 新副本不会带病上岗</text>
  <text x="625" y="106" text-anchor="middle" font-size="12" fill="#047857">（副本 C 也走这一步）</text>

  <rect x="512" y="134" width="226" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="625" y="158" text-anchor="middle" font-size="14" fill="#065f46" font-weight="700">② 退场缓冲</text>
  <text x="625" y="178" text-anchor="middle" font-size="12" fill="#047857">离开前先排水 5 秒</text>
  <text x="625" y="196" text-anchor="middle" font-size="12" fill="#047857">→ 手上的活干完再走</text>
  <text x="625" y="214" text-anchor="middle" font-size="12" fill="#047857">（副本 B 正在做这件事）</text>

  <rect x="512" y="242" width="226" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="625" y="266" text-anchor="middle" font-size="14" fill="#065f46" font-weight="700">③ 多一个备份（关键）</text>
  <text x="625" y="286" text-anchor="middle" font-size="12" fill="#047857">同时至少留两个能干活</text>
  <text x="625" y="304" text-anchor="middle" font-size="12" fill="#047857">一个走，另一个顶上</text>
  <text x="625" y="322" text-anchor="middle" font-size="12" fill="#047857">→ 任何时刻都有人接客</text>

  <line x1="114" y1="180" x2="152" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="160" x2="296" y2="130" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="260" y1="200" x2="296" y2="228" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="150" x2="508" y2="150" stroke="#059669" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="460" y1="243" x2="508" y2="243" stroke="#059669" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="22" y="352" width="180" height="30" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="36" y="372" font-size="12" fill="#065f46" font-weight="600">实测：全程 60 次请求，全部 200</text>
</svg>
