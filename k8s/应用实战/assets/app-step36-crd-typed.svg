<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
  <rect width="760" height="340" fill="#f4fbf4"/>
  <text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">综合版：定义自己的资源类型（高亮 = 本步新增）</text>

  <rect x="30" y="50" width="180" height="70" rx="8" fill="#e6f7e6" stroke="#4caf50" stroke-width="3"/>
  <text x="120" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">定义新类型</text>
  <text x="120" y="93" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">声明有哪些字段</text>
  <text x="120" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">各自允许什么值</text>

  <line x1="210" y1="85" x2="270" y2="85" stroke="#4caf50" stroke-width="2" marker-end="url(#a6)"/>

  <rect x="270" y="50" width="180" height="70" rx="8" fill="#e6f7e6" stroke="#4caf50" stroke-width="3"/>
  <text x="360" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">系统认识它了</text>
  <text x="360" y="93" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">可增删改查</text>
  <text x="360" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">有独立身份</text>

  <line x1="450" y1="85" x2="510" y2="85" stroke="#4caf50" stroke-width="2" marker-end="url(#a6)"/>

  <rect x="510" y="50" width="220" height="70" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="620" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">写错当场被拒</text>
  <text x="620" y="93" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">实测：给了不允许的值</text>
  <text x="620" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">直接拒绝并列出可选值</text>

  <rect x="30" y="140" width="340" height="95" rx="8" fill="#fff8e1" stroke="#f0ad4e" stroke-width="3"/>
  <text x="45" y="162" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d9534f">实测对照 1：状态区要特殊对待</text>
  <text x="45" y="184" font-family="sans-serif" font-size="11" fill="#666">普通方式改状态 → 无变化（被忽略）</text>
  <text x="45" y="204" font-family="sans-serif" font-size="11" fill="#666">走专门通道改状态 → 成功写入</text>
  <text x="45" y="224" font-family="sans-serif" font-size="11" fill="#666">"期望"与"实际"从此分开管。</text>

  <rect x="390" y="140" width="340" height="95" rx="8" fill="#fff8e1" stroke="#f0ad4e" stroke-width="3"/>
  <text x="405" y="162" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">实测对照 2：类型名有规矩</text>
  <text x="405" y="184" font-family="sans-serif" font-size="11" fill="#666">类型名 = 复数形式 + 组名</text>
  <text x="405" y="204" font-family="sans-serif" font-size="11" fill="#666">写错就建不出来。</text>
  <text x="405" y="224" font-family="sans-serif" font-size="11" fill="#666">这是最容易卡住新人的一处。</text>

  <rect x="30" y="250" width="340" height="60" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="200" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">到这一步：错误在提交时就被挡住</text>
  <text x="200" y="291" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">不用等到运行才炸</text>

  <rect x="390" y="250" width="340" height="60" rx="8" fill="#e6f7e6" stroke="#4caf50" stroke-width="2"/>
  <text x="560" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">且状态可信</text>
  <text x="560" y="291" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">不由填写人随手改写</text>

  <defs>
    <marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4caf50"/>
    </marker>
  </defs>
</svg>
