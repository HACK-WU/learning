<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#fdf6f6"/>
  <text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">基础版：密钥只是换了个写法，谁都能还原</text>

  <rect x="40" y="60" width="150" height="60" rx="8" fill="#e8f0fe" stroke="#5b8def" stroke-width="2"/>
  <text x="115" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">密钥对象</text>
  <text x="115" y="104" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">存进集群</text>

  <line x1="190" y1="90" x2="270" y2="90" stroke="#555" stroke-width="2" marker-end="url(#ar4)"/>

  <rect x="270" y="55" width="180" height="70" rx="8" fill="#fde8e8" stroke="#d9534f" stroke-width="2"/>
  <text x="360" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d9534f">只是换了个写法</text>
  <text x="360" y="99" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">不是加密</text>
  <text x="360" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">一行命令就能还原</text>

  <line x1="450" y1="90" x2="530" y2="90" stroke="#d9534f" stroke-width="3" marker-end="url(#ar4)"/>

  <rect x="530" y="50" width="200" height="180" rx="8" fill="#fde8e8" stroke="#d9534f" stroke-width="2"/>
  <text x="630" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d9534f">能拿到明文的人</text>
  <text x="630" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">有读权限的任何人</text>
  <text x="630" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">能进容器的攻击者</text>
  <text x="630" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">拿到备份文件的人</text>
  <text x="630" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d9534f">备份 = 明文拷贝</text>
  <text x="630" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">谁拿到备份谁就有全部密钥</text>

  <rect x="40" y="170" width="400" height="80" rx="8" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="55" y="192" font-family="sans-serif" font-size="12" fill="#333">更糟的是：没人记录谁读过它。</text>
  <text x="55" y="212" font-family="sans-serif" font-size="12" fill="#333">事后问"谁动过密钥"，答不上来。</text>
  <text x="55" y="234" font-family="sans-serif" font-size="12" fill="#666">审计没有，追溯无从谈起。</text>

  <text x="40" y="278" font-family="sans-serif" font-size="12" fill="#666">问题：防不住备份泄漏，也答不出"谁动过"。</text>

  <defs>
    <marker id="ar4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d9534f"/>
    </marker>
  </defs>
</svg>
