<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="420" fill="#fdfcf8"/>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">③ 综合实现：干完的记录会自动打扫</text>

  <!-- 左：没有自动打扫 -->
  <rect x="26" y="60" width="410" height="230" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="231" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">不设置：记录只进不出</text>

  <text x="46" y="112" font-size="12" fill="#7f1d1d">每分钟一次的定时任务，一天下来：</text>

  <!-- 堆积示意 -->
  <g font-size="10.5" font-family="monospace">
    <rect x="46" y="124" width="150" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="54" y="138" fill="#7f1d1d">tick-29825974 已完成</text>
    <rect x="204" y="124" width="150" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="212" y="138" fill="#7f1d1d">tick-29825975 已完成</text>
    <rect x="46" y="150" width="150" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="54" y="164" fill="#7f1d1d">tick-29825976 已完成</text>
    <rect x="204" y="150" width="150" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="212" y="164" fill="#7f1d1d">tick-29825977 已完成</text>
    <rect x="46" y="176" width="150" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="54" y="190" fill="#7f1d1d">tick-29825978 已完成</text>
    <rect x="204" y="176" width="150" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="212" y="190" fill="#7f1d1d">...</text>
  </g>

  <text x="46" y="216" font-size="11.5" fill="#991b1b">一天 1440 条，一个月 4 万多条</text>
  <text x="46" y="236" font-size="11.5" fill="#991b1b">全部堆在集群的账本里</text>
  <text x="46" y="262" font-size="12.5" font-weight="700" fill="#7f1d1d">实测：等了 70 秒，</text>
  <text x="46" y="279" font-size="12.5" font-weight="700" fill="#7f1d1d">新产生 1 条，旧的 1 条也没走</text>

  <!-- 右：设置自动打扫 -->
  <rect x="464" y="60" width="410" height="230" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="669" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">设置「完成后 N 秒自动清」</text>

  <rect x="484" y="100" width="370" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="496" y="120" font-size="12" font-family="monospace" fill="#374151">ttlSecondsAfterFinished: 20</text>
  <text x="496" y="140" font-size="11" fill="#6b7280">完成后 20 秒，连记录带它造的东西一起清掉</text>

  <!-- 时间线 -->
  <line x1="496" y1="185" x2="840" y2="185" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="510" cy="185" r="5" fill="#16a34a"/>
  <text x="510" y="205" text-anchor="middle" font-size="10.5" fill="#374151">完成</text>
  <circle cx="620" cy="185" r="5" fill="#d97706"/>
  <text x="620" y="205" text-anchor="middle" font-size="10.5" fill="#374151">到期</text>
  <circle cx="780" cy="185" r="5" fill="#dc2626"/>
  <text x="780" y="205" text-anchor="middle" font-size="10.5" fill="#374151">已清掉</text>
  <text x="655" y="180" font-size="11" fill="#92400e">20 秒</text>

  <rect x="484" y="216" width="370" height="62" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="496" y="236" font-size="11.5" font-weight="700" fill="#14532d">实测（本机）</text>
  <text x="496" y="255" font-size="11" fill="#374151">完成后：ttl-demo  Complete  1/1</text>
  <text x="496" y="271" font-size="11" fill="#374151">28 秒后：找不到它了 ✓（Pod 也一起没了）</text>

  <!-- 底部注意 -->
  <rect x="26" y="306" width="848" height="96" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="42" y="330" font-size="13" font-weight="700" fill="#9a3412">三个容易搞反的地方</text>
  <text x="42" y="352" font-size="12.5" fill="#9a3412">① <tspan font-weight="700">计时从「完成」开始</tspan>，不是从创建开始。</text>
  <text x="42" y="372" font-size="12.5" fill="#9a3412">② 设成 <tspan font-family="monospace">0</tspan> 是「<tspan font-weight="700">立刻</tspan>清掉」，不是「不清理」；<tspan font-weight="700">不设置才是永不清理</tspan>。</text>
  <text x="42" y="392" font-size="12.5" fill="#9a3412">③ 清掉之后日志也就没了 —— <tspan font-weight="700">要留日志就先把日志送到别处存起来</tspan>（可观测性，课 14）。</text>
</svg>
