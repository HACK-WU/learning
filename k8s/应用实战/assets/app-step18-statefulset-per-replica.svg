<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="880" height="480" fill="#f6faf6"/>
  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e5e34">综合版：每个副本一份自己的盘，重建后还认得回来</text>

  <!-- sts -->
  <rect x="40" y="66" width="240" height="70" rx="12" fill="#e6f5ec" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="160" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1e5e34">有状态应用（2 副本）</text>
  <text x="160" y="120" text-anchor="middle" font-size="12" fill="#3a5a3a">名字固定：db-0、db-1</text>

  <line x1="284" y1="101" x2="330" y2="101" stroke="#2e8b57" stroke-width="2.5"/>
  <polygon points="330,101 322,96 322,106" fill="#2e8b57"/>

  <rect x="334" y="66" width="240" height="70" rx="12" fill="#fff" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="454" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1e5e34">副本 0 → 盘 0</text>
  <text x="454" y="120" text-anchor="middle" font-size="12" fill="#3a5a3a">副本 1 → 盘 1（各用各的）</text>

  <line x1="578" y1="101" x2="624" y2="101" stroke="#2e8b57" stroke-width="2.5"/>
  <polygon points="624,101 616,96 616,106" fill="#2e8b57"/>

  <rect x="628" y="66" width="212" height="70" rx="12" fill="#e6f5ec" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="734" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1e5e34">删掉也认得回来</text>
  <text x="734" y="120" text-anchor="middle" font-size="12" fill="#3a5a3a">重建后还挂原来那块盘</text>

  <!-- evidence -->
  <rect x="40" y="154" width="800" height="80" rx="10" fill="#fff" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="60" y="180" font-size="13" font-weight="700" fill="#1e5e34">本机实测：删掉 db-0 再重建</text>
  <text x="60" y="204" font-size="12" fill="#3a5a3a">删除前：[db-0] 第 1 次启动　→　重建后：[db-0] 第 2 次启动（用的还是 data-db-0 这块盘）</text>
  <text x="60" y="224" font-size="12" fill="#3a5a3a">两个副本的盘是分开建的：data-db-0、data-db-1，互不干扰。</text>

  <!-- warn 1 -->
  <rect x="40" y="248" width="800" height="86" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
  <text x="60" y="274" font-size="13" font-weight="700" fill="#c0392b">陷阱一：多个副本共用一份盘 → 全被钉在同一台机器</text>
  <text x="60" y="298" font-size="12" fill="#c0392b">实测：3 个副本全挤在同一节点；一旦想把某个副本调去别的机器，它就永远起不来。</text>
  <text x="60" y="320" font-size="12" fill="#c0392b">报错：没有节点同时满足「盘的归属」和「副本要去的地方」—— 两边对不上。</text>

  <!-- warn 2 -->
  <rect x="40" y="344" width="800" height="66" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
  <text x="60" y="370" font-size="13" font-weight="700" fill="#c0392b">陷阱二：直接指定机器 → 盘永远配不上，卡死</text>
  <text x="60" y="394" font-size="12" fill="#c0392b">实测：实例停在「等挂载」，盘的申请一直挂着 —— 跳过调度就没人负责去配盘。</text>

  <!-- warn 3 -->
  <rect x="40" y="420" width="800" height="46" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
  <text x="60" y="450" font-size="12" fill="#c0392b">陷阱三：默认策略下删掉存储申请 → 盘和数据一起消失（实测：盘查不到了）。要留数据得选「保留」。</text>
</svg>
