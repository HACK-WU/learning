<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="860" height="330" fill="#f4f8fd"/>
  <text x="430" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f4e79">改进版：中间加一层固定的「门牌」</text>

  <!-- frontend -->
  <rect x="40" y="120" width="150" height="80" rx="10" fill="#fff" stroke="#2b7ac9" stroke-width="2"/>
  <text x="115" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#1f4e79">前端</text>
  <text x="115" y="172" text-anchor="middle" font-size="12" fill="#3a5a7a">只记名字：</text>
  <text x="115" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#2b7ac9">backend</text>

  <line x1="192" y1="160" x2="290" y2="160" stroke="#2b7ac9" stroke-width="2.5"/>
  <polygon points="290,160 280,155 280,165" fill="#2b7ac9"/>
  <text x="241" y="150" text-anchor="middle" font-size="11" fill="#2b7ac9">访问名字</text>

  <!-- service -->
  <rect x="300" y="100" width="180" height="120" rx="12" fill="#e8f2fd" stroke="#2b7ac9" stroke-width="3"/>
  <text x="390" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Service</text>
  <text x="390" y="152" text-anchor="middle" font-size="12" fill="#3a5a7a">固定门牌 10.96.52.175</text>
  <text x="390" y="174" text-anchor="middle" font-size="12" fill="#3a5a7a">自动维护后端名单</text>
  <text x="390" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#2b7ac9">换 Pod 我一手接管</text>

  <line x1="482" y1="160" x2="570" y2="160" stroke="#2b7ac9" stroke-width="2.5"/>
  <polygon points="570,160 560,155 560,165" fill="#2b7ac9"/>
  <text x="526" y="150" text-anchor="middle" font-size="11" fill="#2b7ac9">转发</text>

  <!-- pods -->
  <rect x="582" y="80" width="240" height="34" rx="8" fill="#fff" stroke="#2b7ac9" stroke-width="1.5"/>
  <text x="702" y="102" text-anchor="middle" font-size="12" fill="#1f4e79">后端 .144 / .150 / .12</text>
  <rect x="582" y="124" width="240" height="34" rx="8" fill="#fff" stroke="#2b7ac9" stroke-width="1.5"/>
  <text x="702" y="146" text-anchor="middle" font-size="12" fill="#1f4e79">Pod 重建 → IP 全变</text>
  <rect x="582" y="168" width="240" height="34" rx="8" fill="#e8f2fd" stroke="#2b7ac9" stroke-width="1.5"/>
  <text x="702" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79">名单自动更新，前端无感</text>

  <!-- bottom note -->
  <rect x="40" y="240" width="782" height="62" rx="8" fill="#fff" stroke="#2b7ac9" stroke-width="1.5"/>
  <text x="56" y="264" font-size="13" font-weight="600" fill="#1f4e79">实测结果</text>
  <text x="56" y="285" font-size="12" fill="#3a5a7a">删光全部 3 个后端 Pod：05:01:04 → 05:01:32 连续 15 次采样，一次都没断。</text>
  <text x="56" y="303" font-size="12" fill="#3a5a7a">返回内容在多个后端之间轮换，说明还顺带拿到了负载均衡。</text>
</svg>
