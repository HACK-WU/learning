<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="880" height="400" fill="#f4f8fd"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f4e79">改进版：配置拿出来了，但改了配置应用毫无反应</text>

  <!-- image -->
  <rect x="40" y="86" width="170" height="70" rx="12" fill="#e8f2fd" stroke="#2b7ac9" stroke-width="2.5"/>
  <text x="125" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">通用镜像</text>
  <text x="125" y="140" text-anchor="middle" font-size="12" fill="#3a5a7a">三环境共用一份</text>

  <!-- configmap -->
  <rect x="300" y="76" width="200" height="90" rx="12" fill="#fff" stroke="#2b7ac9" stroke-width="2.5"/>
  <text x="400" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">配置项</text>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#3a5a7a">日志级别 = 只报错</text>
  <text x="400" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#2b7ac9">已改成「调试」</text>

  <line x1="212" y1="121" x2="296" y2="121" stroke="#2b7ac9" stroke-width="2.5"/>
  <polygon points="296,121 288,116 288,126" fill="#2b7ac9"/>

  <!-- pods -->
  <rect x="580" y="76" width="240" height="90" rx="12" fill="#ffe3e3" stroke="#c94f4f" stroke-width="2"/>
  <text x="700" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#7a2b2b">正在跑的实例</text>
  <text x="700" y="130" text-anchor="middle" font-size="12" fill="#5a3a3a">内存里的日志级别 = 只报错</text>
  <text x="700" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#c0392b">毫无反应</text>

  <line x1="502" y1="121" x2="576" y2="121" stroke="#c92a2a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="524" y="112" font-size="14" font-weight="700" fill="#c92a2a">❌</text>

  <!-- timeline -->
  <rect x="40" y="196" width="800" height="120" rx="10" fill="#fff" stroke="#2b7ac9" stroke-width="1.5"/>
  <text x="60" y="222" font-size="13" font-weight="700" fill="#1f4e79">本机实测：改完配置后的采样</text>

  <text x="60" y="250" font-size="12" fill="#3a5a7a">0 秒</text>
  <text x="150" y="250" font-size="12" fill="#3a5a7a">日志级别 = 只报错</text>
  <text x="60" y="276" font-size="12" fill="#3a5a7a">30 秒</text>
  <text x="150" y="276" font-size="12" fill="#c0392b">日志级别 = 只报错（没变）</text>
  <text x="60" y="302" font-size="12" font-weight="700" fill="#1e5e34">手工重启后</text>
  <text x="150" y="302" font-size="12" font-weight="700" fill="#1e5e34">日志级别 = 调试（终于生效）</text>

  <!-- bottom -->
  <rect x="40" y="332" width="800" height="52" rx="8" fill="#fff" stroke="#2b7ac9" stroke-width="1.5"/>
  <text x="56" y="354" font-size="13" font-weight="600" fill="#1f4e79">改进与遗留</text>
  <text x="56" y="376" font-size="12" fill="#3a5a7a">镜像通用了 ✅　但改配置不会自动生效，得记得手工重启一次 —— 忘了就是「改了没生效」。</text>
</svg>
