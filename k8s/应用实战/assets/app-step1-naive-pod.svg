<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="720" height="320" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="26" y="128" width="100" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="76" y="154" text-anchor="middle" font-size="14" fill="#0c4a6e" font-weight="600">访问方</text>
  <text x="76" y="174" text-anchor="middle" font-size="12" fill="#075985">持续请求</text>

  <rect x="170" y="128" width="104" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="222" y="154" text-anchor="middle" font-size="14" fill="#312e81" font-weight="600">转发口</text>
  <text x="222" y="174" text-anchor="middle" font-size="12" fill="#4338ca">只有一个后端</text>

  <rect x="318" y="128" width="150" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="393" y="154" text-anchor="middle" font-size="14" fill="#14532d" font-weight="600">服务（独苗）</text>
  <text x="393" y="174" text-anchor="middle" font-size="12" fill="#15803d">正在提供服务</text>

  <!-- 依赖 -->
  <rect x="318" y="34" width="150" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="393" y="56" text-anchor="middle" font-size="14" fill="#78350f" font-weight="700">依赖（还没好）</text>
  <text x="393" y="76" text-anchor="middle" font-size="12" fill="#92400e">10 秒后才可用</text>

  <!-- 时间轴 -->
  <line x1="26" y1="248" x2="694" y2="248" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="120" cy="248" r="6" fill="#16a34a"/>
  <text x="120" y="272" text-anchor="middle" font-size="12" fill="#15803d">请求正常 200</text>
  <circle cx="380" cy="248" r="6" fill="#dc2626"/>
  <text x="380" y="272" text-anchor="middle" font-size="12" fill="#b91c1c">服务被删除</text>
  <text x="380" y="288" text-anchor="middle" font-size="12" fill="#b91c1c">瞬间断流</text>
  <circle cx="600" cy="248" r="6" fill="#dc2626"/>
  <text x="600" y="272" text-anchor="middle" font-size="12" fill="#b91c1c">000 连接失败</text>
  <text x="600" y="288" text-anchor="middle" font-size="12" fill="#b91c1c">一路持续</text>
  <text x="26" y="230" font-size="12" fill="#64748b">时间 →</text>

  <line x1="126" y1="159" x2="166" y2="159" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="274" y1="159" x2="314" y2="159" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="393" y1="90" x2="393" y2="124" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowR)"/>

  <rect x="26" y="298" width="668" height="0" fill="none"/>
  <text x="26" y="312" font-size="12" fill="#94a3b8">说明：服务启动不等依赖（依赖黄框没被等待），删除时也没有「先打招呼再走」的缓冲。</text>
</svg>
