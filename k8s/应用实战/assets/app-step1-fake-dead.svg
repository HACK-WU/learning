<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="720" height="300" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 左侧：外部访问方 -->
  <rect x="28" y="112" width="104" height="66" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="140" text-anchor="middle" font-size="15" fill="#0c4a6e" font-weight="600">访问方</text>
  <text x="80" y="162" text-anchor="middle" font-size="12" fill="#075985">用户请求</text>

  <!-- 转发口 -->
  <rect x="180" y="112" width="112" height="66" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="236" y="140" text-anchor="middle" font-size="15" fill="#312e81" font-weight="600">转发口</text>
  <text x="236" y="162" text-anchor="middle" font-size="12" fill="#4338ca">按名单转发</text>

  <!-- 名单（EndpointSlice） -->
  <rect x="334" y="34" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="409" y="56" text-anchor="middle" font-size="14" fill="#334155" font-weight="600">可服务名单</text>
  <text x="409" y="76" text-anchor="middle" font-size="12" fill="#64748b">只按「在不在」判断</text>

  <!-- 服务本体 -->
  <rect x="334" y="118" width="150" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="409" y="146" text-anchor="middle" font-size="15" fill="#7f1d1d" font-weight="600">服务（已假死）</text>
  <text x="409" y="166" text-anchor="middle" font-size="12" fill="#991b1b">进程还在、端口还通</text>
  <text x="409" y="182" text-anchor="middle" font-size="12" fill="#991b1b">但已经不干活了</text>

  <!-- 右侧：无人检查 -->
  <rect x="536" y="118" width="158" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="615" y="146" text-anchor="middle" font-size="14" fill="#94a3b8" font-weight="600">（没人检查）</text>
  <text x="615" y="182" text-anchor="middle" font-size="12" fill="#94a3b8">平台只看「进程在不在」</text>
  <text x="615" y="182" text-anchor="middle" font-size="12" fill="#94a3b8">看不出「还干不干活」</text>

  <!-- 连线 -->
  <line x1="132" y1="145" x2="176" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="292" y1="145" x2="330" y2="145" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="409" y1="86" x2="409" y2="114" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="484" y1="145" x2="532" y2="145" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- 底部结论 -->
  <rect x="28" y="228" width="666" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="250" font-size="13" fill="#7f1d1d" font-weight="600">结果：假死的服务仍留在「可服务名单」里，请求照常被转过去 —— 用户一直报错，而平台状态显示一切正常。</text>
  <text x="44" y="270" font-size="13" fill="#991b1b">因为平台只检查「进程在不在」，没有问过它「还能不能干活」。</text>
</svg>
