<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="420" fill="#fdfcf8"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">② 改进实现：加一道「能干活了吗」的问话</text>

  <!-- 访问方 -->
  <rect x="30" y="160" width="120" height="66" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="90" y="187" text-anchor="middle" font-size="14" font-weight="600" fill="#0c4a6e">访问方</text>
  <text x="90" y="207" text-anchor="middle" font-size="12" fill="#0c4a6e">持续发请求</text>

  <!-- 转发口 -->
  <rect x="205" y="160" width="130" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="270" y="187" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">转发口</text>
  <text x="270" y="207" text-anchor="middle" font-size="12" fill="#5b21b6">按名单分发</text>

  <!-- 名单框 受控 -->
  <rect x="205" y="62" width="130" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="270" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">可服务名单</text>
  <text x="270" y="102" text-anchor="middle" font-size="11" fill="#14532d">判据：问过才算</text>
  <text x="270" y="118" text-anchor="middle" font-size="11" fill="#14532d">由问话结果决定</text>

  <line x1="270" y1="128" x2="270" y2="158" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- 旧副本 -->
  <rect x="400" y="140" width="140" height="56" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="163" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">旧副本 1</text>
  <text x="470" y="182" text-anchor="middle" font-size="12" fill="#14532d">在名单里 ✓</text>

  <rect x="400" y="212" width="140" height="56" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="235" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">旧副本 2</text>
  <text x="470" y="254" text-anchor="middle" font-size="12" fill="#14532d">在名单里 ✓</text>

  <rect x="400" y="284" width="140" height="56" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="307" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">旧副本 3</text>
  <text x="470" y="326" text-anchor="middle" font-size="12" fill="#14532d">在名单里 ✓</text>

  <line x1="335" y1="193" x2="398" y2="172" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowA)"/>
  <line x1="335" y1="193" x2="398" y2="240" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowA)"/>
  <line x1="335" y1="196" x2="398" y2="312" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowA)"/>

  <!-- 新副本 未就绪 -->
  <rect x="610" y="160" width="150" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="685" y="187" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">新副本（换了新版）</text>
  <text x="685" y="207" text-anchor="middle" font-size="12" fill="#92400e">预热中，还没答上话</text>

  <!-- 问话 -->
  <rect x="610" y="258" width="150" height="54" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="685" y="280" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">就绪问话</text>
  <text x="685" y="299" text-anchor="middle" font-size="11.5" fill="#0c4a6e">每隔几秒问一次</text>

  <line x1="685" y1="226" x2="685" y2="256" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="790" y="245" font-size="11" fill="#0284c7">问</text>

  <line x1="685" y1="258" x2="685" y2="232" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowA)"/>
  <text x="700" y="248" font-size="11" fill="#0284c7">答不上</text>

  <line x1="610" y1="285" x2="420" y2="130" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrowG)"/>
  <text x="500" y="150" font-size="11.5" font-weight="700" fill="#14532d">没答上 → 不进名单</text>

  <!-- 结果说明 -->
  <rect x="30" y="358" width="840" height="46" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="46" y="378" font-size="12.5" fill="#14532d">
    <tspan font-weight="700">结果：</tspan>新副本没答上话就<tspan font-weight="700">不进名单</tspan>，旧副本<tspan font-weight="700">一个都不撤</tspan> —— 全程始终有能干活的顶着，用户无感。
  </text>
  <text x="46" y="396" font-size="12.5" fill="#14532d">
    <tspan font-weight="700">代价：</tspan>更新变慢了（必须等新副本真的答上话才继续换下一个）。这是拿时间换不中断，通常是划算的。
  </text>

  <defs>
    <marker id="arrowA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
