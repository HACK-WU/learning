<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="880" height="400" fill="#f6faf6"/>
  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e5e34">综合版：新版本先放 10% 的流量试试</text>

  <!-- traffic -->
  <rect x="36" y="70" width="120" height="60" rx="10" fill="#fff" stroke="#2e8b57" stroke-width="2"/>
  <text x="96" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#1e5e34">全部流量</text>
  <text x="96" y="118" text-anchor="middle" font-size="12" fill="#3a5a3a">100%</text>

  <line x1="158" y1="100" x2="250" y2="100" stroke="#2e8b57" stroke-width="2.5"/>
  <polygon points="250,100 240,95 240,105" fill="#2e8b57"/>

  <!-- ingress -->
  <rect x="262" y="66" width="180" height="68" rx="12" fill="#e6f5ec" stroke="#2e8b57" stroke-width="3"/>
  <text x="352" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#1e5e34">灰度规则</text>
  <text x="352" y="116" text-anchor="middle" font-size="12" fill="#3a5a3a">按比例切分</text>

  <!-- split -->
  <line x1="444" y1="100" x2="530" y2="76" stroke="#2e8b57" stroke-width="2.5"/>
  <polygon points="530,76 520,72 522,80" fill="#2e8b57"/>
  <text x="487" y="80" font-size="11" fill="#2e8b57">90%</text>

  <line x1="444" y1="100" x2="530" y2="126" stroke="#2e8b57" stroke-width="2"/>
  <polygon points="530,126 520,122 522,130" fill="#2e8b57"/>
  <text x="487" y="140" font-size="11" fill="#2e8b57">10%</text>

  <rect x="542" y="52" width="300" height="40" rx="8" fill="#fff" stroke="#2e8b57"/>
  <text x="692" y="78" text-anchor="middle" font-size="13" fill="#1e5e34">稳定版 v1（老版本）</text>
  <rect x="542" y="106" width="300" height="40" rx="8" fill="#e6f5ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="692" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#1e5e34">灰度版 v2（新版本）</text>

  <!-- table -->
  <text x="36" y="182" font-size="14" font-weight="700" fill="#1e5e34">实测：改一个数字就能调整放量比例</text>

  <rect x="36" y="196" width="806" height="30" rx="4" fill="#e6f5ec"/>
  <text x="56" y="216" font-size="12" font-weight="700" fill="#1e5e34">设置的权重</text>
  <text x="230" y="216" font-size="12" font-weight="700" fill="#1e5e34">实测 v1 / v2（100 次）</text>
  <text x="450" y="216" font-size="12" font-weight="700" fill="#1e5e34">复验第二轮</text>
  <text x="620" y="216" font-size="12" font-weight="700" fill="#1e5e34">结论</text>

  <rect x="36" y="228" width="806" height="28" rx="4" fill="#fff"/>
  <text x="56" y="247" font-size="12" fill="#3a5a3a">10%</text>
  <text x="230" y="247" font-size="12" fill="#3a5a3a">90 / 10</text>
  <text x="450" y="247" font-size="12" fill="#3a5a3a">89 / 11</text>
  <text x="620" y="247" font-size="12" fill="#3a5a3a">准确</text>

  <rect x="36" y="258" width="806" height="28" rx="4" fill="#fff"/>
  <text x="56" y="277" font-size="12" fill="#3a5a3a">30%</text>
  <text x="230" y="277" font-size="12" fill="#3a5a3a">71 / 29</text>
  <text x="450" y="277" font-size="12" fill="#3a5a3a">75 / 25</text>
  <text x="620" y="277" font-size="12" fill="#3a5a3a">准确</text>

  <rect x="36" y="288" width="806" height="28" rx="4" fill="#fff"/>
  <text x="56" y="307" font-size="12" fill="#3a5a3a">50%</text>
  <text x="230" y="307" font-size="12" fill="#3a5a3a">60 / 40</text>
  <text x="450" y="307" font-size="12" fill="#3a5a3a">47 / 53</text>
  <text x="620" y="307" font-size="12" fill="#c0392b">浮动明显，看趋势</text>

  <rect x="36" y="318" width="806" height="28" rx="4" fill="#fff"/>
  <text x="56" y="337" font-size="12" fill="#3a5a3a">100%</text>
  <text x="230" y="337" font-size="12" fill="#3a5a3a">0 / 100</text>
  <text x="450" y="337" font-size="12" fill="#3a5a3a">0 / 100</text>
  <text x="620" y="337" font-size="12" fill="#3a5a3a">全量切换完成</text>

  <rect x="36" y="348" width="806" height="30" rx="4" fill="#e6f5ec"/>
  <text x="56" y="368" font-size="12" font-weight="700" fill="#1e5e34">出问题时改回 0%</text>
  <text x="230" y="368" font-size="12" font-weight="700" fill="#1e5e34">50 / 0</text>
  <text x="450" y="368" font-size="12" font-weight="700" fill="#1e5e34">50 / 0</text>
  <text x="620" y="368" font-size="12" font-weight="700" fill="#1e5e34">秒级撤回，不重建 Pod</text>
</svg>
