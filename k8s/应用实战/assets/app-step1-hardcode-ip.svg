<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="860" height="330" fill="#fdf6f6"/>
  <text x="430" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#7a2b2b">基础版：前端直接记后端 Pod 的 IP</text>

  <!-- frontend -->
  <rect x="40" y="110" width="170" height="90" rx="10" fill="#fff" stroke="#c94f4f" stroke-width="2"/>
  <text x="125" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#7a2b2b">前端</text>
  <text x="125" y="166" text-anchor="middle" font-size="12" fill="#5a3a3a">配置里写死：</text>
  <text x="125" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">192.168.109.145</text>

  <!-- arrow -->
  <line x1="212" y1="155" x2="330" y2="155" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="330,155 320,150 320,160" fill="#c0392b"/>
  <text x="271" y="145" text-anchor="middle" font-size="11" fill="#c0392b">直连 IP</text>

  <!-- pods -->
  <rect x="342" y="70" width="196" height="40" rx="8" fill="#ffe3e3" stroke="#c94f4f" stroke-width="2"/>
  <text x="440" y="95" text-anchor="middle" font-size="12" fill="#7a2b2b">后端 .145 ← 写死的目标</text>

  <rect x="342" y="120" width="196" height="36" rx="8" fill="#f0f0f0" stroke="#aaa" stroke-dasharray="4 3"/>
  <text x="440" y="143" text-anchor="middle" font-size="12" fill="#888">后端 .144 / .150 / .12</text>
  <text x="440" y="176" text-anchor="middle" font-size="11" fill="#999">（其他几个它根本不知道）</text>

  <!-- after -->
  <line x1="560" y1="155" x2="640" y2="155" stroke="#999" stroke-width="2"/>
  <polygon points="640,155 630,150 630,160" fill="#999"/>
  <text x="600" y="145" text-anchor="middle" font-size="11" fill="#666">Pod 重建</text>

  <rect x="652" y="110" width="170" height="90" rx="10" fill="#fff" stroke="#c94f4f" stroke-width="2"/>
  <text x="737" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#c0392b">.145 消失了</text>
  <text x="737" y="162" text-anchor="middle" font-size="12" fill="#7a2b2b">新 Pod 拿到 .150</text>
  <text x="737" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">前端：连不上</text>

  <!-- bottom note -->
  <rect x="40" y="240" width="782" height="62" rx="8" fill="#fff" stroke="#c94f4f" stroke-width="1.5"/>
  <text x="56" y="264" font-size="13" font-weight="600" fill="#c0392b">实测结果</text>
  <text x="56" y="285" font-size="12" fill="#5a3a3a">05:00:22 还在正常返回 → 05:00:27 起返回变空，之后再没恢复。</text>
  <text x="56" y="303" font-size="12" fill="#5a3a3a">根因：Pod 重建后 IP 是全新的，不是复用。写死的 IP 从此指向空气。</text>
</svg>
