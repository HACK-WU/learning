<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="430" fill="#fdfcf8"/>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">③ 综合实现：出事能退回去 —— 关键是「退到哪一版」得看得懂</text>

  <!-- 时间线 -->
  <line x1="60" y1="215" x2="845" y2="215" stroke="#9ca3af" stroke-width="2"/>
  <text x="852" y="219" font-size="12" fill="#6b7280">时间</text>

  <!-- v3 好版本 -->
  <rect x="70" y="150" width="118" height="58" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="129" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">第 3 版 · 好</text>
  <text x="129" y="193" text-anchor="middle" font-size="11" fill="#14532d">正常返回</text>
  <circle cx="129" cy="215" r="6" fill="#16a34a"/>

  <!-- v4 坏版本 -->
  <rect x="238" y="150" width="118" height="58" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="297" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">第 4 版 · 坏</text>
  <text x="297" y="193" text-anchor="middle" font-size="11" fill="#7f1d1d">起来就崩</text>
  <circle cx="297" cy="215" r="6" fill="#dc2626"/>

  <!-- 服务不受影响 -->
  <rect x="238" y="252" width="118" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="297" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">服务还在</text>
  <text x="297" y="291" text-anchor="middle" font-size="11" fill="#14532d">旧版顶着 ✓</text>
  <line x1="297" y1="252" x2="297" y2="226" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowG)"/>

  <!-- 回退 -->
  <path d="M 297 205 Q 420 100 543 205" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrowP)"/>
  <text x="420" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">一键退回去</text>
  <text x="420" y="113" text-anchor="middle" font-size="11.5" fill="#5b21b6">（内容照第 3 版重做一遍）</text>

  <!-- v5 = 退回后的版本 -->
  <rect x="486" y="150" width="118" height="58" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="545" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">第 5 版 · 已恢复</text>
  <text x="545" y="193" text-anchor="middle" font-size="11" fill="#14532d">内容 = 第 3 版</text>
  <circle cx="545" cy="215" r="6" fill="#16a34a"/>

  <!-- 编号说明 -->
  <rect x="630" y="140" width="215" height="96" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="645" y="162" font-size="12" font-weight="700" fill="#92400e">注意：编号是 5，不是 3</text>
  <text x="645" y="182" font-size="11.5" fill="#92400e">退回去 ≠ 把编号倒回去</text>
  <text x="645" y="200" font-size="11.5" fill="#92400e">而是「照旧版内容做一版新的」</text>
  <text x="645" y="220" font-size="11.5" fill="#92400e">所以编号继续往后排</text>

  <!-- 历史清单 -->
  <rect x="70" y="292" width="775" height="112" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="86" y="314" font-size="13" font-weight="700" fill="#1f2937">存档清单长什么样，决定了你退得对不对</text>

  <rect x="86" y="326" width="360" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="98" y="345" font-size="11.5" font-weight="700" fill="#7f1d1d">✕ 没写说明：只能靠猜</text>
  <text x="98" y="363" font-size="11.5" font-family="monospace" fill="#7f1d1d">1  (无说明)</text>
  <text x="98" y="381" font-size="11.5" font-family="monospace" fill="#7f1d1d">2  (无说明)   ← 该退到哪个？</text>

  <rect x="466" y="326" width="366" height="66" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="478" y="345" font-size="11.5" font-weight="700" fill="#14532d">✓ 写了说明：一眼看出该退到哪</text>
  <text x="478" y="363" font-size="11.5" font-family="monospace" fill="#14532d">3  C-第三版: 改成返回 OK-v3</text>
  <text x="478" y="381" font-size="11.5" font-family="monospace" fill="#14532d">4  D-坏版本: 起来就崩   ← 退到 3</text>

  <defs>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
