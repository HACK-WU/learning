<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="720" height="330" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="26" y="140" width="96" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="74" y="166" text-anchor="middle" font-size="14" fill="#0c4a6e" font-weight="600">访问方</text>
  <text x="74" y="186" text-anchor="middle" font-size="12" fill="#075985">持续请求</text>

  <rect x="166" y="140" width="100" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="216" y="166" text-anchor="middle" font-size="14" fill="#312e81" font-weight="600">转发口</text>
  <text x="216" y="186" text-anchor="middle" font-size="12" fill="#4338ca">只有一个后端</text>

  <rect x="310" y="140" width="146" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="383" y="166" text-anchor="middle" font-size="14" fill="#14532d" font-weight="600">服务（独苗）</text>
  <text x="383" y="186" text-anchor="middle" font-size="12" fill="#15803d">加了退场缓冲</text>

  <!-- 依赖 + 开场准备（高亮新增） -->
  <rect x="500" y="26" width="190" height="86" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="595" y="50" text-anchor="middle" font-size="14" fill="#065f46" font-weight="700">① 开场准备（新加）</text>
  <text x="595" y="72" text-anchor="middle" font-size="12" fill="#047857">开工前先问依赖好了没</text>
  <text x="595" y="90" text-anchor="middle" font-size="12" fill="#047857">没好就一直等，<tspan font-weight="700">不启动主程序</tspan></text>
  <text x="595" y="106" text-anchor="middle" font-size="12" fill="#047857">→ 不再带病上岗</text>

  <rect x="500" y="140" width="190" height="86" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="595" y="164" text-anchor="middle" font-size="14" fill="#065f46" font-weight="700">② 退场缓冲（新加）</text>
  <text x="595" y="186" text-anchor="middle" font-size="12" fill="#047857">收到离开通知先排水 5 秒</text>
  <text x="595" y="204" text-anchor="middle" font-size="12" fill="#047857">把手上的活干完再走</text>
  <text x="595" y="220" text-anchor="middle" font-size="12" fill="#047857">→ 删除不再瞬断</text>

  <line x1="122" y1="170" x2="162" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="266" y1="170" x2="306" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="456" y1="158" x2="496" y2="158" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- 时间轴 -->
  <line x1="26" y1="262" x2="694" y2="262" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="120" cy="262" r="6" fill="#16a34a"/>
  <text x="120" y="286" text-anchor="middle" font-size="12" fill="#15803d">200 正常</text>
  <circle cx="360" cy="262" r="6" fill="#d97706"/>
  <text x="360" y="286" text-anchor="middle" font-size="12" fill="#b45309">开始退场，仍 200</text>
  <circle cx="580" cy="262" r="6" fill="#dc2626"/>
  <text x="580" y="286" text-anchor="middle" font-size="12" fill="#b91c1c">缓冲结束后 000</text>
  <text x="26" y="244" font-size="12" fill="#64748b">时间 →</text>

  <rect x="26" y="298" width="668" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="40" y="315" font-size="12" fill="#78350f" font-weight="600">⚠ 缺口：缓冲只把断流「推后」了，没有消除——独苗终究要走，走完就没人接客了。</text>
</svg>
