<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="880" height="360" fill="#fdf6f6"/>
  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#7a2b2b">基础版：什么都不声明，谁都能把机器吃光</text>

  <!-- node -->
  <rect x="60" y="66" width="760" height="150" rx="14" fill="#fff" stroke="#c94f4f" stroke-width="2.5"/>
  <text x="440" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#7a2b2b">一台机器（20 核 / 32 GiB）</text>

  <!-- pods -->
  <rect x="90" y="116" width="130" height="60" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
  <text x="155" y="140" text-anchor="middle" font-size="12" fill="#666">实例 A</text>
  <text x="155" y="160" text-anchor="middle" font-size="11" fill="#999">没说要多少</text>

  <rect x="240" y="116" width="130" height="60" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
  <text x="305" y="140" text-anchor="middle" font-size="12" fill="#666">实例 B</text>
  <text x="305" y="160" text-anchor="middle" font-size="11" fill="#999">没说要多少</text>

  <rect x="390" y="108" width="150" height="76" rx="8" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2.5"/>
  <text x="465" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">失控的那个</text>
  <text x="465" y="154" text-anchor="middle" font-size="11" fill="#c0392b">想用多少用多少</text>
  <text x="465" y="172" text-anchor="middle" font-size="11" fill="#c0392b">没人拦得住</text>

  <rect x="560" y="116" width="130" height="60" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
  <text x="625" y="140" text-anchor="middle" font-size="12" fill="#666">实例 C</text>
  <text x="625" y="160" text-anchor="middle" font-size="11" fill="#999">没说要多少</text>

  <line x1="465" y1="190" x2="465" y2="212" stroke="#c92a2a" stroke-width="2"/>

  <!-- result -->
  <rect x="60" y="216" width="760" height="60" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
  <text x="80" y="242" font-size="13" font-weight="700" fill="#c0392b">结果：整台机器被打满，谁先死全凭运气</text>
  <text x="80" y="266" font-size="12" fill="#c0392b">本机实测：一个不设上限的实例跑满 CPU，它所在节点用量立刻冲到 886m（其他两个节点才 60m 左右）。</text>

  <!-- bottom -->
  <rect x="60" y="288" width="760" height="56" rx="10" fill="#fff" stroke="#c94f4f" stroke-width="1.5"/>
  <text x="80" y="312" font-size="12" font-weight="700" fill="#c0392b">它的问题</text>
  <text x="80" y="334" font-size="12" fill="#5a3a3a">调度时不知道该往哪放；紧张时不知道该牺牲谁 —— 两个问题都出在「没给数字」。</text>
</svg>
