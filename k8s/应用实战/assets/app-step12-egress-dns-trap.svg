<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="880" height="440" fill="#f6faf6"/>
  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e5e34">综合版：出站也要管，而最常见的坑是 DNS</text>

  <!-- frontend -->
  <rect x="32" y="86" width="180" height="80" rx="12" fill="#e6f5ec" stroke="#2e8b57" stroke-width="3"/>
  <text x="122" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1e5e34">前端</text>
  <text x="122" y="140" text-anchor="middle" font-size="12" fill="#3a5a3a">只准访问后端</text>
  <text x="122" y="158" text-anchor="middle" font-size="12" fill="#3a5a3a">（出站被管）</text>

  <line x1="214" y1="126" x2="300" y2="126" stroke="#2e8b57" stroke-width="2.5"/>
  <polygon points="300,126 290,121 292,131" fill="#2e8b57"/>

  <!-- dns -->
  <rect x="312" y="66" width="200" height="46" rx="10" fill="#fff" stroke="#2e8b57" stroke-width="2"/>
  <text x="412" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#1e5e34">先问名字解析</text>

  <!-- backend -->
  <rect x="312" y="140" width="200" height="46" rx="10" fill="#e6f5ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="412" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#1e5e34">再访问后端</text>

  <!-- right: three symptoms -->
  <rect x="560" y="60" width="292" height="140" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="580" y="86" font-size="13" font-weight="700" fill="#c0392b">只放行后端、漏了名字解析</text>
  <text x="580" y="112" font-size="12" fill="#c0392b">按名字访问 → bad address</text>
  <text x="580" y="134" font-size="12" fill="#c0392b">解析单独测 → no servers reached</text>
  <text x="580" y="158" font-size="12" font-weight="700" fill="#1e5e34">按 IP 直连 → 通！</text>
  <text x="580" y="184" font-size="12" fill="#3a5a3a">"按名字失败、按 IP 成功"</text>

  <!-- table -->
  <text x="32" y="236" font-size="14" font-weight="700" fill="#1e5e34">实测对照：名字解析该放行哪个协议</text>

  <rect x="32" y="250" width="820" height="30" rx="4" fill="#e6f5ec"/>
  <text x="52" y="270" font-size="12" font-weight="700" fill="#1e5e34">放行的规则</text>
  <text x="400" y="270" font-size="12" font-weight="700" fill="#1e5e34">按名字访问</text>
  <text x="620" y="270" font-size="12" font-weight="700" fill="#1e5e34">结论</text>

  <rect x="32" y="282" width="820" height="28" rx="4" fill="#fff"/>
  <text x="52" y="301" font-size="12" fill="#3a5a3a">只放行 UDP 53</text>
  <text x="400" y="301" font-size="12" fill="#3a5a3a">成功</text>
  <text x="620" y="301" font-size="12" fill="#3a5a3a">够用</text>

  <rect x="32" y="312" width="820" height="28" rx="4" fill="#fff"/>
  <text x="52" y="331" font-size="12" fill="#3a5a3a">只放行 TCP 53</text>
  <text x="400" y="331" font-size="12" fill="#c0392b">bad address（失败）</text>
  <text x="620" y="331" font-size="12" fill="#3a5a3a">不够</text>

  <rect x="32" y="342" width="820" height="28" rx="4" fill="#e6f5ec"/>
  <text x="52" y="361" font-size="12" font-weight="700" fill="#1e5e34">UDP + TCP 都放行（推荐）</text>
  <text x="400" y="361" font-size="12" font-weight="700" fill="#1e5e34">成功</text>
  <text x="620" y="361" font-size="12" font-weight="700" fill="#1e5e34">兼容性最好</text>

  <text x="32" y="396" font-size="13" font-weight="700" fill="#1e5e34">另一个高频坑：按命名空间放行时，同一组的成员也会被挡在门外</text>
  <text x="32" y="418" font-size="12" fill="#3a5a3a">只写「放行带某标签的分组」时，本组因为没那个标签反而进不来 —— 要再补一条「放行本组成员」。</text>
</svg>
