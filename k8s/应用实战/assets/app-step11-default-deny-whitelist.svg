<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="880" height="380" fill="#f4f8fd"/>
  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f4e79">改进版：先全封，再按身份一个个放行</text>

  <!-- db -->
  <rect x="340" y="140" width="200" height="90" rx="12" fill="#e8f2fd" stroke="#2b7ac9" stroke-width="3"/>
  <text x="440" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">数据库</text>
  <text x="440" y="196" text-anchor="middle" font-size="12" fill="#3a5a7a">被策略选中</text>
  <text x="440" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#2b7ac9">只认"带身份牌的请求"</text>

  <!-- allowed -->
  <rect x="32" y="76" width="252" height="36" rx="8" fill="#e6f5ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="158" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="#1e5e34">应用服务（有身份牌）</text>
  <line x1="286" y1="94" x2="336" y2="158" stroke="#2e8b57" stroke-width="3"/>
  <polygon points="336,158 326,153 328,163" fill="#2e8b57"/>
  <text x="300" y="112" font-size="13" font-weight="700" fill="#2e8b57">✅</text>

  <!-- blocked 1 -->
  <rect x="32" y="150" width="252" height="36" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="158" y="173" text-anchor="middle" font-size="12" fill="#c0392b">随便一个 Pod（没身份牌）</text>
  <line x1="286" y1="168" x2="330" y2="176" stroke="#c92a2a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="296" y="196" font-size="14" font-weight="700" fill="#c92a2a">❌</text>

  <!-- blocked 2 -->
  <rect x="32" y="224" width="252" height="36" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="158" y="247" text-anchor="middle" font-size="12" fill="#c0392b">别的命名空间（没身份牌）</text>
  <line x1="286" y1="242" x2="330" y2="204" stroke="#c92a2a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="296" y="228" font-size="14" font-weight="700" fill="#c92a2a">❌</text>

  <!-- right -->
  <rect x="596" y="76" width="256" height="184" rx="10" fill="#fff" stroke="#2b7ac9" stroke-width="1.5"/>
  <text x="614" y="102" font-size="13" font-weight="600" fill="#1f4e79">实测：精确按身份放行</text>
  <text x="614" y="128" font-size="12" fill="#3a5a7a">应用服务     → 通</text>
  <text x="614" y="152" font-size="12" fill="#3a5a7a">随便一个 Pod → 被拦</text>
  <text x="614" y="176" font-size="12" fill="#3a5a7a">跨命名空间   → 被拦</text>
  <text x="614" y="204" font-size="12" font-weight="600" fill="#2b7ac9">只放行 81 端口时，</text>
  <text x="614" y="222" font-size="12" font-weight="600" fill="#2b7ac9">连应用访问 80 也被拦</text>
  <text x="614" y="246" font-size="12" fill="#3a5a7a">→ 端口级精确控制</text>

  <!-- bottom -->
  <rect x="32" y="288" width="820" height="74" rx="8" fill="#fff" stroke="#2b7ac9" stroke-width="1.5"/>
  <text x="52" y="312" font-size="13" font-weight="600" fill="#1f4e79">怎么做的：两步</text>
  <text x="52" y="336" font-size="12" fill="#3a5a7a">第一步「全封」：选中所有 Pod 但不给任何放行规则 —— 白名单之外一律拒绝。</text>
  <text x="52" y="356" font-size="12" fill="#3a5a7a">第二步「放行」：按身份（标签）+ 端口，一条条把该通的加回来。策略之间取并集。</text>
</svg>
