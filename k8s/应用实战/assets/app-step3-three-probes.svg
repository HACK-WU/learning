<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="410" fill="#fbfcfd"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="24" y="150" width="96" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="72" y="176" text-anchor="middle" font-size="14" fill="#0c4a6e" font-weight="600">访问方</text>
  <text x="72" y="196" text-anchor="middle" font-size="12" fill="#075985">用户请求</text>

  <rect x="164" y="150" width="104" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="216" y="176" text-anchor="middle" font-size="14" fill="#312e81" font-weight="600">转发口</text>
  <text x="216" y="196" text-anchor="middle" font-size="12" fill="#4338ca">按名单转发</text>

  <!-- 可服务名单（由就绪检查决定） -->
  <rect x="312" y="40" width="164" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="394" y="62" text-anchor="middle" font-size="14" fill="#065f46" font-weight="700">可服务名单</text>
  <text x="394" y="82" text-anchor="middle" font-size="12" fill="#047857">由「就绪检查」动态加减</text>

  <rect x="312" y="150" width="164" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="394" y="176" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="600">服务（假死中）</text>
  <text x="394" y="196" text-anchor="middle" font-size="12" fill="#991b1b">进程在，但不干活</text>

  <!-- 三种检查 -->
  <rect x="524" y="30" width="212" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="630" y="54" text-anchor="middle" font-size="14" fill="#065f46" font-weight="700">① 启动检查（先上岗）</text>
  <text x="630" y="76" text-anchor="middle" font-size="12" fill="#047857">专门给慢启动留时间</text>
  <text x="630" y="94" text-anchor="middle" font-size="12" fill="#047857">它没通过之前，另外两个都不问</text>
  <text x="630" y="112" text-anchor="middle" font-size="12" fill="#047857">→ 慢启动再也不会被误杀</text>

  <rect x="524" y="134" width="212" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="630" y="158" text-anchor="middle" font-size="14" fill="#065f46" font-weight="700">② 就绪检查（管进出）</text>
  <text x="630" y="180" text-anchor="middle" font-size="12" fill="#047857">答不上来 → 从名单里临时摘掉</text>
  <text x="630" y="198" text-anchor="middle" font-size="12" fill="#047857">但不重启，恢复了自己回来</text>
  <text x="630" y="216" text-anchor="middle" font-size="12" fill="#047857">→ 服务不好时不再坑用户</text>

  <rect x="524" y="238" width="212" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="630" y="262" text-anchor="middle" font-size="14" fill="#065f46" font-weight="700">③ 存活检查（管生死）</text>
  <text x="630" y="284" text-anchor="middle" font-size="12" fill="#047857">只在启动检查通过后才上岗</text>
  <text x="630" y="302" text-anchor="middle" font-size="12" fill="#047857">连续答不上来 → 才重启</text>
  <text x="630" y="320" text-anchor="middle" font-size="12" fill="#047857">→ 真死透了才动手</text>

  <line x1="120" y1="181" x2="160" y2="181" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="268" y1="181" x2="308" y2="181" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="394" y1="96" x2="394" y2="146" stroke="#059669" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowG)"/>
  <line x1="476" y1="181" x2="520" y2="181" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>

  <rect x="24" y="348" width="712" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="40" y="370" font-size="13" fill="#065f46" font-weight="600">三件事分开问，各管一段：启动期归启动检查、能不能接客归就绪检查、真死没死归存活检查。</text>
  <text x="40" y="386" font-size="12" fill="#047857">「能不能服务」不再是一个笼统的判断，而是三个可以分别配置的问题。</text>
</svg>
