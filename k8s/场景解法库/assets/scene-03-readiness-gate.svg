<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="sans-serif">
  <rect width="900" height="470" fill="#fbfcfe"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3d5c">解法 B：readiness 闸门与探针混用的代价</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#666">红框=失效点</text>

  <rect x="40" y="95" width="140" height="50" rx="8" fill="#dceefb" stroke="#3a7ca5" stroke-width="2"/>
  <text x="110" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3d5c">新 Pod 启动</text>
  <text x="110" y="137" text-anchor="middle" font-size="11" fill="#3a7ca5">进程已起</text>

  <rect x="230" y="88" width="170" height="64" rx="10" fill="#fff6d9" stroke="#c99a1e" stroke-width="2.5"/>
  <text x="315" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5d0a">readiness /ready</text>
  <text x="315" y="133" text-anchor="middle" font-size="11" fill="#7a5d0a">查 DB / 下游连通</text>
  <text x="315" y="149" text-anchor="middle" font-size="11" fill="#7a5d0a">失败 → 不接流量</text>

  <rect x="450" y="88" width="150" height="64" rx="8" fill="#e3f6e6" stroke="#3d8b4a" stroke-width="2"/>
  <text x="525" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#265c2e">加入 endpoint</text>
  <text x="525" y="133" text-anchor="middle" font-size="11" fill="#3d8b4a">开始接流量</text>
  <text x="525" y="149" text-anchor="middle" font-size="11" fill="#3d8b4a">此时依赖已可用</text>

  <rect x="660" y="88" width="180" height="64" rx="8" fill="#dceefb" stroke="#3a7ca5" stroke-width="2"/>
  <text x="750" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3d5c">liveness /healthz</text>
  <text x="750" y="133" text-anchor="middle" font-size="11" fill="#3a7ca5">只查进程存活</text>
  <text x="750" y="149" text-anchor="middle" font-size="11" fill="#3a7ca5">失败 → 重启容器</text>

  <line x1="180" y1="120" x2="228" y2="120" stroke="#3a7ca5" stroke-width="2" marker-end="url(#e1)"/>
  <line x1="400" y1="120" x2="448" y2="120" stroke="#3d8b4a" stroke-width="2" marker-end="url(#e2)"/>
  <line x1="600" y1="112" x2="658" y2="118" stroke="#3a7ca5" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#e1)"/>

  <rect x="150" y="200" width="600" height="70" rx="10" fill="#fde7e7" stroke="#b8332f" stroke-width="2.5"/>
  <text x="450" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f1f1c">若 readiness 与 liveness 共用同一个端点</text>
  <text x="450" y="247" text-anchor="middle" font-size="12" fill="#8f1f1c">下游抖动 → liveness 判定失败 → 重启本来健康的 Pod → 全部不可用</text>
  <text x="450" y="264" text-anchor="middle" font-size="11" fill="#5a1a18">（"少量 502" 被放大成 "整个服务挂掉"）</text>

  <rect x="30" y="300" width="840" height="150" rx="10" fill="#fff5f5" stroke="#b8332f" stroke-width="2.5"/>
  <text x="48" y="324" font-size="14" font-weight="bold" fill="#8f1f1c">失效点</text>

  <text x="48" y="350" font-size="12.5" font-weight="bold" fill="#8f1f1c">① readiness 查依赖会把下游故障放大成全局不可用</text>
  <text x="66" y="369" font-size="12" fill="#5a1a18">DB 全面故障时所有 Pod 同时 NotReady → Service 后端全空 → 本来只是"慢"，现在"完全不可用"。</text>

  <text x="48" y="395" font-size="12.5" font-weight="bold" fill="#8f1f1c">② liveness 绝不能查依赖</text>
  <text x="66" y="414" font-size="12" fill="#5a1a18">liveness 的作用是抓死锁（进程活着但不干活），查外部依赖会让"依赖抖一下"变成"容器重启循环"。</text>

  <text x="48" y="440" font-size="12.5" font-weight="bold" fill="#8f1f1c">③ 慢启动应用缺 startupProbe 会在真正就绪前被 liveness 杀掉</text>
  <text x="66" y="459" font-size="12" fill="#5a1a18">JVM 预热 60 秒的应用，liveness 30 秒就判死 → 无限重启。慢启动服务必须配 startupProbe。</text>

  <defs>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3a7ca5"/></marker>
    <marker id="e2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3d8b4a"/></marker>
  </defs>
</svg>
