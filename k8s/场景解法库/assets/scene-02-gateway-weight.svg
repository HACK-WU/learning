<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" font-family="sans-serif">
  <rect width="900" height="530" fill="#fbfcfe"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3d5c">解法 A：Gateway API 权重分流</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#666">比例与副本数解耦　红框=失效点</text>

  <rect x="40" y="100" width="130" height="52" rx="8" fill="#dceefb" stroke="#3a7ca5" stroke-width="2"/>
  <text x="105" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3d5c">客户端</text>
  <text x="105" y="142" text-anchor="middle" font-size="11" fill="#3a7ca5">持续请求</text>

  <rect x="220" y="92" width="180" height="70" rx="10" fill="#fff6d9" stroke="#c99a1e" stroke-width="2.5"/>
  <text x="310" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5d0a">Gateway</text>
  <text x="310" y="138" text-anchor="middle" font-size="11" fill="#7a5d0a">HTTPRoute: app-route</text>
  <text x="310" y="155" text-anchor="middle" font-size="11" fill="#7a5d0a">按请求随机分配</text>

  <rect x="480" y="60" width="170" height="60" rx="8" fill="#e3f6e6" stroke="#3d8b4a" stroke-width="2"/>
  <text x="565" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#265c2e">app-v1-svc（90%）</text>
  <text x="565" y="102" text-anchor="middle" font-size="11" fill="#3d8b4a">Deployment v1 × N 副本</text>

  <rect x="480" y="145" width="170" height="60" rx="8" fill="#e3f6e6" stroke="#3d8b4a" stroke-width="2"/>
  <text x="565" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#265c2e">app-v2-svc（10%）</text>
  <text x="565" y="187" text-anchor="middle" font-size="11" fill="#3d8b4a">Deployment v2 × M 副本</text>

  <text x="435" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d8b4a">90</text>
  <text x="435" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d8b4a">10</text>

  <rect x="700" y="60" width="160" height="145" rx="10" fill="#f0f0f0" stroke="#888" stroke-width="2"/>
  <text x="780" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">共享数据库</text>
  <text x="780" y="112" text-anchor="middle" font-size="11" fill="#777">两版本同时写</text>
  <text x="780" y="132" text-anchor="middle" font-size="11" fill="#777">schema 必须</text>
  <text x="780" y="152" text-anchor="middle" font-size="11" fill="#777">双向兼容</text>
  <text x="780" y="176" text-anchor="middle" font-size="11" fill="#777">否则同时打挂</text>
  <text x="780" y="196" text-anchor="middle" font-size="11" fill="#777">两个版本</text>

  <line x1="170" y1="126" x2="218" y2="126" stroke="#3a7ca5" stroke-width="2" marker-end="url(#c1)"/>
  <line x1="400" y1="118" x2="478" y2="100" stroke="#3d8b4a" stroke-width="3" marker-end="url(#g2)"/>
  <line x1="400" y1="138" x2="478" y2="178" stroke="#3d8b4a" stroke-width="1.5" marker-end="url(#g2)"/>
  <line x1="650" y1="105" x2="698" y2="115" stroke="#888" stroke-width="1.5" marker-end="url(#gr)"/>
  <line x1="650" y1="180" x2="698" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#gr)"/>

  <rect x="30" y="240" width="840" height="270" rx="10" fill="#fff5f5" stroke="#b8332f" stroke-width="2.5"/>
  <text x="48" y="264" font-size="14" font-weight="bold" fill="#8f1f1c">失效点（红框）</text>

  <text x="48" y="290" font-size="12.5" font-weight="bold" fill="#8f1f1c">① 权重按请求随机，同一用户会跳版本</text>
  <text x="66" y="310" font-size="12" fill="#5a1a18">用户 A 的第 1 次请求可能打 v1，第 2 次打 v2 → 页面元素/接口字段不一致时表现为"时好时坏"。</text>
  <text x="66" y="328" font-size="12" fill="#5a1a18">需要会话保持就得另配一致性哈希或 cookie 亲和——**权重本身不提供会话语义**。</text>

  <text x="48" y="354" font-size="12.5" font-weight="bold" fill="#8f1f1c">② 两版本共享同一数据库</text>
  <text x="66" y="374" font-size="12" fill="#5a1a18">v2 改了字段含义或删了列 → v1 也在崩。**流量层灰度救不了数据层不兼容**，</text>
  <text x="66" y="392" font-size="12" fill="#5a1a18">必须先做双向兼容迁移：加字段 → 双写 → 切读 → 最后才删旧字段。</text>

  <text x="48" y="418" font-size="12.5" font-weight="bold" fill="#8f1f1c">③ v2 的 readiness 若不查依赖，会被当健康继续吸流量</text>
  <text x="66" y="438" font-size="12" fill="#5a1a18">readiness 只查 /healthz（进程活着）→ v2 依赖的下游没通也被标记为 Ready，10% 用户持续 500。</text>

  <text x="48" y="464" font-size="12.5" font-weight="bold" fill="#8f1f1c">④ 权重总和不等于 100 不会报错</text>
  <text x="66" y="484" font-size="12" fill="#5a1a18">Gateway API 按相对比例归一化：写 9/1 与 90/10 完全等价。容易让人误以为配置写错了 or 误判当前比例。</text>
  <text x="66" y="502" font-size="12" fill="#5a1a18">另外：灰度期两版本同时常驻，资源占用约为平时 1.1 倍。</text>

  <defs>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3a7ca5"/></marker>
    <marker id="g2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3d8b4a"/></marker>
    <marker id="gr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#888"/></marker>
  </defs>
</svg>
