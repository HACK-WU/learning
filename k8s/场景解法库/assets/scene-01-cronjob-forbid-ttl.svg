<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif">
  <rect width="900" height="520" fill="#fbfcfe"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3d5c">解法 A：CronJob + Forbid + TTL 的三道闸门</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#666">蓝=正常路径　红框=失效点</text>

  <rect x="40" y="90" width="150" height="56" rx="8" fill="#dceefb" stroke="#3a7ca5" stroke-width="2"/>
  <text x="115" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3d5c">定时到点</text>
  <text x="115" y="134" text-anchor="middle" font-size="11" fill="#3a7ca5">schedule: 0 2 * * *</text>

  <polygon points="230,118 290,88 350,118 290,148" fill="#fff6d9" stroke="#c99a1e" stroke-width="2"/>
  <text x="290" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5d0a">上一轮</text>
  <text x="290" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5d0a">还在跑？</text>

  <rect x="400" y="82" width="150" height="40" rx="6" fill="#e3f6e6" stroke="#3d8b4a" stroke-width="2"/>
  <text x="475" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#265c2e">否 → 创建新 Job</text>

  <rect x="400" y="140" width="150" height="40" rx="6" fill="#fde7e7" stroke="#b8332f" stroke-width="2.5"/>
  <text x="475" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f1f1c">是 → 静默跳过</text>

  <rect x="600" y="82" width="230" height="56" rx="8" fill="#dceefb" stroke="#3a7ca5" stroke-width="2"/>
  <text x="715" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3d5c">Pod 执行报表</text>
  <text x="715" y="125" text-anchor="middle" font-size="11" fill="#3a7ca5">restartPolicy: OnFailure</text>
  <text x="715" y="141" text-anchor="middle" font-size="11" fill="#3a7ca5">backoffLimit: 3 次重试</text>

  <rect x="600" y="180" width="230" height="52" rx="8" fill="#dceefb" stroke="#3a7ca5" stroke-width="2"/>
  <text x="715" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3d5c">完成 / 失败</text>
  <text x="715" y="222" text-anchor="middle" font-size="11" fill="#3a7ca5">ttlSecondsAfterFinished: 86400</text>

  <rect x="600" y="270" width="230" height="46" rx="8" fill="#e3f6e6" stroke="#3d8b4a" stroke-width="2"/>
  <text x="715" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#265c2e">TTL 控制器自动删除</text>
  <text x="715" y="308" text-anchor="middle" font-size="11" fill="#3d8b4a">etcd 不再膨胀</text>

  <line x1="190" y1="118" x2="228" y2="118" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="350" y1="105" x2="398" y2="102" stroke="#3d8b4a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="350" y1="132" x2="398" y2="158" stroke="#b8332f" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="550" y1="102" x2="598" y2="105" stroke="#3a7ca5" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="715" y1="140" x2="715" y2="178" stroke="#3a7ca5" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="715" y1="234" x2="715" y2="268" stroke="#3d8b4a" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="30" y="355" width="840" height="145" rx="10" fill="#fff5f5" stroke="#b8332f" stroke-width="2.5"/>
  <text x="48" y="378" font-size="14" font-weight="bold" fill="#8f1f1c">三处失效点（红框）</text>

  <text x="48" y="402" font-size="12" fill="#5a1a18">① Forbid 是「跳过」不是「排队」——40 分钟任务拖到 3 小时，期间调度点全部丢失，</text>
  <text x="66" y="419" font-size="12" fill="#8f1f1c" font-weight="bold">且没有任何报错。要求「每次必跑」时 Forbid 就是错的，应改 Allow + 应用层幂等。</text>

  <text x="48" y="443" font-size="12" fill="#5a1a18">② 忘记 TTL：每分钟的 CronJob 一年攒约 50 万个 Job 对象，只增不减 →</text>
  <text x="66" y="460" font-size="12" fill="#8f1f1c" font-weight="bold">etcd 被撑爆。startingDeadlineSeconds 为 0 时，控制器恢复后会一次性补跑几十个。</text>

  <text x="48" y="484" font-size="12" fill="#5a1a18">③ 失败是静默的：没有控制器替你告警，必须自己接 kube_job_status_failed 指标，</text>
  <text x="66" y="501" font-size="12" fill="#8f1f1c" font-weight="bold">backoffLimit 只是重试（同一批数据重算），不是「重跑一次新任务」。</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3d8b4a"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3a7ca5"/></marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b8332f"/></marker>
  </defs>
</svg>
