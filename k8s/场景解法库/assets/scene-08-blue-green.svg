<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="sans-serif">
  <rect width="900" height="440" fill="#fbfcfe"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3d5c">解法 B：蓝绿集群切换</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#666">老集群全程可用　红框=最难的一步</text>

  <rect x="50" y="85" width="330" height="120" rx="12" fill="#dceefb" stroke="#3a7ca5" stroke-width="2.5"/>
  <text x="215" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3d5c">蓝集群（旧 v1.32）</text>
  <text x="215" y="133" text-anchor="middle" font-size="11" fill="#3a7ca5">全程在线，承接 100% 流量</text>
  <text x="215" y="155" text-anchor="middle" font-size="11" fill="#3a7ca5">业务完全无感</text>
  <text x="215" y="177" text-anchor="middle" font-size="11" fill="#3a7ca5">切换失败 → 流量切回来即可</text>

  <rect x="500" y="85" width="330" height="120" rx="12" fill="#e3f6e6" stroke="#3d8b4a" stroke-width="2.5"/>
  <text x="665" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#265c2e">绿集群（新 v1.34）</text>
  <text x="665" y="133" text-anchor="middle" font-size="11" fill="#3d8b4a">新建，GitOps / Velero 同步</text>
  <text x="665" y="155" text-anchor="middle" font-size="11" fill="#3d8b4a">CRD / Webhook / CSI 要重建</text>
  <text x="665" y="177" text-anchor="middle" font-size="11" fill="#3d8b4a">灰度切流 → 全量 → 下线蓝</text>

  <line x1="380" y1="145" x2="498" y2="145" stroke="#3d8b4a" stroke-width="2.5" marker-end="url(#s1)"/>
  <text x="439" y="135" text-anchor="middle" font-size="10" fill="#3d8b4a">应用/配置同步</text>

  <rect x="330" y="225" width="240" height="60" rx="10" fill="#fde7e7" stroke="#b8332f" stroke-width="2.5"/>
  <text x="450" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f1f1c">数据层迁移（最难）</text>
  <text x="450" y="269" text-anchor="middle" font-size="11" fill="#8f1f1c">主从复制 + 切主，防双写</text>

  <line x1="215" y1="205" x2="380" y2="245" stroke="#b8332f" stroke-width="2" marker-end="url(#s2)"/>
  <line x1="665" y1="205" x2="530" y2="245" stroke="#b8332f" stroke-width="2" marker-end="url(#s2)"/>

  <rect x="30" y="305" width="840" height="115" rx="10" fill="#fff5f5" stroke="#b8332f" stroke-width="2.5"/>
  <text x="48" y="329" font-size="14" font-weight="bold" fill="#8f1f1c">失效点</text>
  <text x="48" y="354" font-size="12.5" font-weight="bold" fill="#8f1f1c">① 资源翻倍是明面成本，数据层迁移才是真难点</text>
  <text x="66" y="373" font-size="12" fill="#5a1a18">有状态服务（数据库 / 消息队列）不能简单"复制过去"：要主从复制 + 切主，切换期间还得防双写。</text>
  <text x="48" y="399" font-size="12.5" font-weight="bold" fill="#8f1f1c">② 集群级资源易遗漏</text>
  <text x="66" y="416" font-size="12" fill="#5a1a18">CRD / Webhook / CSI 驱动 / PSA 标签 不会随应用同步，漏一个就是运行时故障。</text>

  <defs>
    <marker id="s1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3d8b4a"/></marker>
    <marker id="s2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b8332f"/></marker>
  </defs>
</svg>
