<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif">
  <rect width="900" height="520" fill="#fbfcfe"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3d5c">解法 A：etcd 快照覆盖范围与 RPO 计算</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#666">✅ 本机 kind 实测数据　红框=失效点</text>

  <rect x="50" y="90" width="220" height="150" rx="12" fill="#dceefb" stroke="#3a7ca5" stroke-width="2.5"/>
  <text x="160" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3d5c">etcd 全量</text>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#3a7ca5">819 key（实测）</text>
  <text x="160" y="161" text-anchor="middle" font-size="11" fill="#3a7ca5">· 节点 / Lease</text>
  <text x="160" y="179" text-anchor="middle" font-size="11" fill="#3a7ca5">· 集群状态</text>
  <text x="160" y="197" text-anchor="middle" font-size="11" fill="#3a7ca5">· 所有 API 对象</text>
  <text x="160" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#265c2e">快照 32 MB</text>

  <rect x="340" y="90" width="220" height="150" rx="12" fill="#f0f0f0" stroke="#888" stroke-width="2"/>
  <text x="450" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">YAML 导出</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#777">仅 API 对象</text>
  <text x="450" y="161" text-anchor="middle" font-size="11" fill="#777">· 无 Lease</text>
  <text x="450" y="179" text-anchor="middle" font-size="11" fill="#777">· 无节点状态</text>
  <text x="450" y="197" text-anchor="middle" font-size="11" fill="#777">· 无 Event</text>
  <text x="450" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f1f1c">7.7 MB（差 4.2 倍）</text>

  <rect x="630" y="90" width="220" height="150" rx="12" fill="#e3f6e6" stroke="#3d8b4a" stroke-width="2"/>
  <text x="740" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#265c2e">卷快照</text>
  <text x="740" y="140" text-anchor="middle" font-size="12" fill="#3d8b4a">仅持久卷数据</text>
  <text x="740" y="161" text-anchor="middle" font-size="11" fill="#3d8b4a">· 崩溃一致性</text>
  <text x="740" y="179" text-anchor="middle" font-size="11" fill="#3d8b4a">· 依赖 CSI</text>
  <text x="740" y="197" text-anchor="middle" font-size="11" fill="#3d8b4a">· 需 quiesce</text>
  <text x="740" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d8b4a">按数据量</text>

  <rect x="50" y="270" width="800" height="90" rx="10" fill="#fff6d9" stroke="#c99a1e" stroke-width="2"/>
  <text x="70" y="294" font-size="13" font-weight="bold" fill="#7a5d0a">RPO 是算出来的，不是配出来的（revision 外推 · 实测）</text>
  <text x="70" y="317" font-size="12" fill="#5a1a18">rev_t0 = 832908　→　rev_t30 = 832992　　30 秒增量 = 84</text>
  <text x="70" y="339" font-size="12" fill="#5a1a18">备份间隔 1 小时 → 丢失约 <tspan font-weight="bold" fill="#8f1f1c">10 080 次写入</tspan>（84 × 120）</text>
  <text x="70" y="359" font-size="12" font-weight="bold" fill="#8f1f1c">本机实测 CronJob = 0，即从未自动备份 → 真实 RPO = 无穷大</text>

  <rect x="30" y="380" width="840" height="120" rx="10" fill="#fff5f5" stroke="#b8332f" stroke-width="2.5"/>
  <text x="48" y="404" font-size="14" font-weight="bold" fill="#8f1f1c">失效点</text>
  <text x="48" y="429" font-size="12.5" font-weight="bold" fill="#8f1f1c">① 整库还原 = 整个集群回退，无法只救一个应用</text>
  <text x="66" y="448" font-size="12" fill="#5a1a18">"只恢复被误删的那个命名空间"做不到——还原会把其他团队这 1 小时的变更一起吞掉。</text>
  <text x="48" y="473" font-size="12.5" font-weight="bold" fill="#8f1f1c">② 备份含系统自维护资源 → 恢复必 Conflict（实测 2 个，剔除后 0 个）</text>
  <text x="66" y="492" font-size="12" fill="#5a1a18">kube-root-ca.crt / default SA / kubernetes Service 必须在备份时剔除，否则恢复报 AlreadyExists。</text>
</svg>
