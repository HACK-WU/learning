<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="sans-serif">
  <rect width="900" height="380" fill="#fbfcfe"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3d5c">解法 C：卷快照的时序与崩溃一致性</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#666">红框=失效点</text>

  <text x="60" y="95" font-size="12.5" font-weight="bold" fill="#1a3d5c">应用写入</text>
  <rect x="150" y="80" width="90" height="28" rx="4" fill="#dceefb" stroke="#3a7ca5" stroke-width="1.5"/>
  <text x="195" y="98" text-anchor="middle" font-size="10" fill="#1a3d5c">写 A</text>
  <rect x="250" y="80" width="90" height="28" rx="4" fill="#dceefb" stroke="#3a7ca5" stroke-width="1.5"/>
  <text x="295" y="98" text-anchor="middle" font-size="10" fill="#1a3d5c">写 B</text>
  <rect x="350" y="80" width="90" height="28" rx="4" fill="#dceefb" stroke="#3a7ca5" stroke-width="1.5"/>
  <text x="395" y="98" text-anchor="middle" font-size="10" fill="#1a3d5c">写 C</text>
  <rect x="450" y="80" width="90" height="28" rx="4" fill="#dceefb" stroke="#3a7ca5" stroke-width="1.5"/>
  <text x="495" y="98" text-anchor="middle" font-size="10" fill="#1a3d5c">写 D</text>

  <line x1="430" y1="70" x2="430" y2="200" stroke="#b8332f" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="430" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f1f1c">快照点</text>
  <rect x="352" y="150" width="150" height="30" rx="6" fill="#fde7e7" stroke="#b8332f" stroke-width="2"/>
  <text x="427" y="170" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8f1f1c">快照在 C 与 D 之间</text>

  <rect x="560" y="80" width="180" height="90" rx="10" fill="#fff6d9" stroke="#c99a1e" stroke-width="2.5"/>
  <text x="650" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5d0a">恢复结果</text>
  <text x="650" y="130" text-anchor="middle" font-size="11" fill="#7a5d0a">含 A B C，不含 D</text>
  <text x="650" y="153" text-anchor="middle" font-size="11" fill="#8f1f1c" font-weight="bold">但 C 可能只写了一半</text>

  <line x1="540" y1="125" x2="558" y2="125" stroke="#c99a1e" stroke-width="2" marker-end="url(#r1)"/>

  <rect x="60" y="225" width="780" height="26" rx="5" fill="#e3f6e6" stroke="#3d8b4a" stroke-width="1.5"/>
  <text x="450" y="243" text-anchor="middle" font-size="11" fill="#265c2e">生产做法：快照前先 quiesce（冻结写入）或用应用感知快照 —— 否则是"崩溃一致性"，类似断电</text>

  <rect x="30" y="275" width="840" height="85" rx="10" fill="#fff5f5" stroke="#b8332f" stroke-width="2.5"/>
  <text x="48" y="299" font-size="14" font-weight="bold" fill="#8f1f1c">失效点</text>
  <text x="48" y="324" font-size="12.5" font-weight="bold" fill="#8f1f1c">① 快照 ≠ 应用一致性，只覆盖持久卷数据</text>
  <text x="66" y="343" font-size="12" fill="#5a1a18">正在写的时候拍快照 = 崩溃一致性。数据库能用 WAL 恢复，但普通文件可能半截。</text>
  <text x="48" y="360" font-size="12.5" font-weight="bold" fill="#8f1f1c">② 只覆盖数据，不覆盖编排 —— 必须与 etcd 快照 / YAML 配套使用</text>

  <defs>
    <marker id="r1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c99a1e"/></marker>
  </defs>
</svg>
