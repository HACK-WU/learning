<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
  <rect width="900" height="400" fill="#fbfcfe"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3d5c">解法 B：YAML 导出恢复后 uid 必变</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#666">红框=失效点（这也是它不能当灾备主手段的原因）</text>

  <rect x="60" y="90" width="200" height="90" rx="10" fill="#dceefb" stroke="#3a7ca5" stroke-width="2"/>
  <text x="160" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3d5c">导出前</text>
  <text x="160" y="140" text-anchor="middle" font-size="11" fill="#3a7ca5">PVC uid = a1b2</text>
  <text x="160" y="160" text-anchor="middle" font-size="11" fill="#3a7ca5">Pod 绑定该 PVC</text>

  <rect x="350" y="90" width="200" height="90" rx="10" fill="#fff6d9" stroke="#c99a1e" stroke-width="2.5"/>
  <text x="450" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5d0a">kubectl get -o yaml</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#7a5d0a">纯文本 7.7 MB</text>
  <text x="450" y="160" text-anchor="middle" font-size="11" fill="#7a5d0a">可读 / 可版本化</text>

  <rect x="640" y="90" width="200" height="90" rx="10" fill="#fde7e7" stroke="#b8332f" stroke-width="2.5"/>
  <text x="740" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f1f1c">恢复后</text>
  <text x="740" y="140" text-anchor="middle" font-size="11" fill="#8f1f1c">PVC uid = 9z8y（变了）</text>
  <text x="740" y="160" text-anchor="middle" font-size="11" fill="#8f1f1c">有状态应用挂不上盘</text>

  <line x1="260" y1="135" x2="348" y2="135" stroke="#3a7ca5" stroke-width="2.5" marker-end="url(#q1)"/>
  <line x1="550" y1="135" x2="638" y2="135" stroke="#b8332f" stroke-width="2.5" marker-end="url(#q2)"/>

  <rect x="60" y="205" width="780" height="50" rx="8" fill="#f7f9fb" stroke="#3a7ca5" stroke-width="2"/>
  <text x="450" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3d5c">缺失的部分：Lease（租约）· 节点状态 · Event · 集群级资源</text>
  <text x="450" y="246" text-anchor="middle" font-size="11" fill="#3a7ca5">所以它只有 etcd 的约 1/4.2，不是"完整备份"</text>

  <rect x="30" y="275" width="840" height="105" rx="10" fill="#fff5f5" stroke="#b8332f" stroke-width="2.5"/>
  <text x="48" y="299" font-size="14" font-weight="bold" fill="#8f1f1c">失效点</text>
  <text x="48" y="324" font-size="12.5" font-weight="bold" fill="#8f1f1c">① uid 必变 → 有状态应用恢复出来也是废的</text>
  <text x="66" y="343" font-size="12" fill="#5a1a18">PVC 与 PV 的绑定关系靠 uid，换 uid 后挂不上原盘。数据库恢复出来却是空的，比没备份更糟（你以为恢复了）。</text>
  <text x="48" y="369" font-size="12.5" font-weight="bold" fill="#8f1f1c">② 只覆盖 API 对象，不是灾备手段</text>
  <text x="66" y="387" font-size="12" fill="#5a1a18">适合「跨集群复制配置」与迁移；真正的灾备必须用 etcd 快照或数据库原生备份。</text>

  <defs>
    <marker id="q1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3a7ca5"/></marker>
    <marker id="q2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b8332f"/></marker>
  </defs>
</svg>
