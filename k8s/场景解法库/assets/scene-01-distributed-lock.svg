<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="sans-serif">
  <rect width="900" height="500" fill="#fbfcfe"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3d5c">解法 B：应用层分布式锁的互斥边界</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#666">Forbid 只在单 CronJob 内有效；锁把互斥下沉到应用层</text>

  <rect x="40" y="95" width="180" height="54" rx="8" fill="#dceefb" stroke="#3a7ca5" stroke-width="2"/>
  <text x="130" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3d5c">定时调度</text>
  <text x="130" y="138" text-anchor="middle" font-size="11" fill="#3a7ca5">CronJob 到点</text>

  <rect x="40" y="175" width="180" height="54" rx="8" fill="#dceefb" stroke="#3a7ca5" stroke-width="2"/>
  <text x="130" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3d5c">人工补跑</text>
  <text x="130" y="218" text-anchor="middle" font-size="11" fill="#3a7ca5">kubectl create job</text>

  <rect x="40" y="255" width="180" height="54" rx="8" fill="#dceefb" stroke="#3a7ca5" stroke-width="2"/>
  <text x="130" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3d5c">第二个集群</text>
  <text x="130" y="298" text-anchor="middle" font-size="11" fill="#3a7ca5">异地多活触发</text>

  <rect x="330" y="140" width="200" height="120" rx="12" fill="#fff6d9" stroke="#c99a1e" stroke-width="2.5"/>
  <text x="430" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5d0a">锁存储（Redis）</text>
  <text x="430" y="192" text-anchor="middle" font-size="11" fill="#7a5d0a">SET key token NX PX 30min</text>
  <text x="430" y="212" text-anchor="middle" font-size="11" fill="#7a5d0a">① 抢占（原子）</text>
  <text x="430" y="232" text-anchor="middle" font-size="11" fill="#7a5d0a">② 续约（每 10min 续期）</text>
  <text x="430" y="252" text-anchor="middle" font-size="11" fill="#7a5d0a">③ 释放（校验 token 后删）</text>

  <rect x="640" y="140" width="200" height="54" rx="8" fill="#e3f6e6" stroke="#3d8b4a" stroke-width="2"/>
  <text x="740" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#265c2e">抢到锁 → 执行</text>
  <text x="740" y="183" text-anchor="middle" font-size="11" fill="#3d8b4a">唯一执行者</text>

  <rect x="640" y="215" width="200" height="54" rx="8" fill="#f0f0f0" stroke="#888" stroke-width="2"/>
  <text x="740" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">未抢到 → 退出</text>
  <text x="740" y="258" text-anchor="middle" font-size="11" fill="#777">exit 0，不报错</text>

  <line x1="220" y1="122" x2="328" y2="175" stroke="#3a7ca5" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="220" y1="202" x2="328" y2="200" stroke="#3a7ca5" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="220" y1="282" x2="328" y2="225" stroke="#3a7ca5" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="530" y1="175" x2="638" y2="168" stroke="#3d8b4a" stroke-width="2" marker-end="url(#g1)"/>
  <line x1="530" y1="225" x2="638" y2="242" stroke="#888" stroke-width="2" marker-end="url(#g1)"/>

  <rect x="30" y="340" width="840" height="140" rx="10" fill="#fff5f5" stroke="#b8332f" stroke-width="2.5"/>
  <text x="48" y="363" font-size="14" font-weight="bold" fill="#8f1f1c">失效点：锁必须有租约，否则永久停摆</text>

  <text x="48" y="388" font-size="12" fill="#5a1a18">① 无过期时间（SET 不加 PX）→ 进程崩溃后锁永不释放，</text>
  <text x="66" y="405" font-size="12" fill="#8f1f1c" font-weight="bold">后续所有调度全部拿不到锁 → 任务永久停摆。这比重复跑更糟，且没人会立刻发现。</text>

  <text x="48" y="430" font-size="12" fill="#5a1a18">② 续约周期 ≥ 租约时间 → 40 分钟任务在 30 分钟时被别人抢锁，两个实例同时跑。</text>

  <text x="48" y="455" font-size="12" fill="#5a1a18">③ 释放时不校验 token → 可能删掉别人刚抢到的新锁，互斥失效。</text>

  <text x="48" y="478" font-size="12" fill="#5a1a18">④ 锁存储本身是新的故障域：Redis 不可用时须显式决策「跑 or 不跑」，</text>
  <text x="66" y="495" font-size="12" fill="#8f1f1c" font-weight="bold">资金类任务一般取 fail-closed（宁可不跑，不能重复跑）。</text>

  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3a7ca5"/></marker>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3d8b4a"/></marker>
  </defs>
</svg>
