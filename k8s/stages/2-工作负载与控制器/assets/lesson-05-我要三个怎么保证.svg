<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="460" fill="#fbfcfe"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">
    "我要三个"这句话，怎么变成"一直有三个"
  </text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">
    三个麻烦：没了谁补 / 换新怎么不断 / 换错了怎么退回去
  </text>

  <defs>
    <marker id="a5g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="a5r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== ① 没了谁补 ===== -->
  <rect x="30" y="76" width="270" height="190" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="165" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">① 少了一个，谁补？</text>

  <rect x="50" y="114" width="230" height="44" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="165" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">一个一直盯着的人</text>
  <text x="165" y="150" text-anchor="middle" font-size="10" fill="#047857">记住你的话："一直留 3 个"</text>

  <path d="M 120 162 L 100 186" stroke="#059669" stroke-width="1.4" fill="none" marker-end="url(#a5g)"/>
  <path d="M 165 162 L 165 186" stroke="#059669" stroke-width="1.4" fill="none" marker-end="url(#a5g)"/>
  <path d="M 210 162 L 230 186" stroke="#059669" stroke-width="1.4" fill="none" marker-end="url(#a5g)"/>

  <g>
    <rect x="56" y="190" width="60" height="40" rx="4" fill="#fff" stroke="#34d399"/>
    <text x="86" y="214" text-anchor="middle" font-size="14" fill="#059669">✓</text>
    <rect x="122" y="190" width="60" height="40" rx="4" fill="#fff" stroke="#34d399"/>
    <text x="152" y="214" text-anchor="middle" font-size="14" fill="#059669">✓</text>
    <rect x="188" y="190" width="60" height="40" rx="4" fill="#f5f5f5" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="218" y="214" text-anchor="middle" font-size="14" fill="#9ca3af">✕</text>
    <rect x="224" y="190" width="60" height="40" rx="4" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
    <text x="254" y="214" text-anchor="middle" font-size="10" fill="#065f46">补的</text>
  </g>

  <text x="165" y="252" text-anchor="middle" font-size="11" fill="#065f46">它一直在数：够不够 3 个？</text>
  <text x="165" y="266" text-anchor="middle" font-size="11" fill="#065f46">少一个就补，不用你管</text>

  <!-- ===== ② 换新 ===== -->
  <rect x="320" y="76" width="270" height="190" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="455" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">② 换新版，怎么不断？</text>

  <text x="340" y="122" font-size="11" fill="#1e40af">笨办法：一次全换</text>
  <g>
    <rect x="340" y="128" width="46" height="26" rx="3" fill="#fee2e2" stroke="#f87171"/>
    <text x="363" y="145" text-anchor="middle" font-size="9" fill="#991b1b">旧</text>
    <rect x="392" y="128" width="46" height="26" rx="3" fill="#fee2e2" stroke="#f87171"/>
    <text x="415" y="145" text-anchor="middle" font-size="9" fill="#991b1b">旧</text>
    <rect x="444" y="128" width="46" height="26" rx="3" fill="#fee2e2" stroke="#f87171"/>
    <text x="467" y="145" text-anchor="middle" font-size="9" fill="#991b1b">旧</text>
    <text x="500" y="146" font-size="12" fill="#dc2626">→ 全撤</text>
  </g>
  <text x="340" y="176" font-size="11" fill="#b91c1c">中间那一段：一个都没有，全断</text>

  <text x="340" y="200" font-size="11" font-weight="700" fill="#1e40af">好办法：一个个换</text>
  <g>
    <rect x="340" y="208" width="40" height="26" rx="3" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="360" y="225" text-anchor="middle" font-size="9" fill="#1e40af">新</text>
    <rect x="386" y="208" width="40" height="26" rx="3" fill="#fff" stroke="#93c5fd"/>
    <text x="406" y="225" text-anchor="middle" font-size="9" fill="#3b82f6">旧</text>
    <rect x="432" y="208" width="40" height="26" rx="3" fill="#fff" stroke="#93c5fd"/>
    <text x="452" y="225" text-anchor="middle" font-size="9" fill="#3b82f6">旧</text>
    <text x="480" y="225" font-size="10" fill="#1e40af">换 1 个</text>

    <text x="525" y="225" font-size="13" fill="#3b82f6">→</text>

    <rect x="540" y="208" width="40" height="26" rx="3" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="560" y="225" text-anchor="middle" font-size="9" fill="#1e40af">新</text>
  </g>
  <text x="340" y="252" text-anchor="middle" font-size="11" fill="#1e40af">任何时刻都还有能干活的在顶着</text>
  <text x="340" y="266" text-anchor="middle" font-size="11" fill="#1e40af">新旧会短暂地同时存在</text>

  <!-- ===== ③ 退回去 ===== -->
  <rect x="610" y="76" width="260" height="190" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="740" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">③ 换错了，怎么退回去？</text>

  <text x="630" y="122" font-size="11" fill="#7f1d1d">没留记录的话：</text>
  <rect x="630" y="130" width="220" height="30" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="740" y="149" text-anchor="middle" font-size="11" fill="#991b1b">上一个版本长什么样？记不清了 ✕</text>

  <text x="630" y="184" font-size="11" font-weight="700" fill="#065f46">每次换都留一份存档：</text>
  <g>
    <rect x="630" y="192" width="66" height="34" rx="3" fill="#fff" stroke="#86efac"/>
    <text x="663" y="210" text-anchor="middle" font-size="10" fill="#065f46">第 1 版</text>
    <text x="663" y="222" text-anchor="middle" font-size="9" fill="#059669">存档</text>

    <rect x="702" y="192" width="66" height="34" rx="3" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
    <text x="735" y="210" text-anchor="middle" font-size="10" fill="#065f46">第 2 版</text>
    <text x="735" y="222" text-anchor="middle" font-size="9" fill="#059669">当前</text>

    <rect x="774" y="192" width="76" height="34" rx="3" fill="#fee2e2" stroke="#f87171"/>
    <text x="812" y="210" text-anchor="middle" font-size="10" fill="#991b1b">第 3 版</text>
    <text x="812" y="222" text-anchor="middle" font-size="9" fill="#dc2626">出问题</text>
  </g>

  <path d="M 812 232 C 812 256 700 262 665 244" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a5g)"/>
  <text x="740" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">一句话退回去</text>

  <!-- ===== 下方：谁盯着谁 ===== -->
  <rect x="30" y="286" width="840" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="310" font-size="14" font-weight="700" fill="#334155">那这些事是谁在做？—— 一层管一层</text>

  <g>
    <rect x="52" y="326" width="180" height="52" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="142" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">你说话的对象</text>
    <text x="142" y="366" text-anchor="middle" font-size="10" fill="#047857">管"换版本、退版本"</text>

    <path d="M 236 352 L 274 352" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#a5)"/>
    <text x="255" y="344" text-anchor="middle" font-size="9" fill="#64748b">建出</text>

    <rect x="278" y="326" width="180" height="52" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="368" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">管"有几个"的那层</text>
    <text x="368" y="366" text-anchor="middle" font-size="10" fill="#3b82f6">只数个数，不管版本</text>

    <path d="M 462 352 L 500 352" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#a5)"/>
    <text x="481" y="344" text-anchor="middle" font-size="9" fill="#64748b">建出</text>

    <rect x="504" y="326" width="180" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="594" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">真正干活的那些</text>
    <text x="594" y="366" text-anchor="middle" font-size="10" fill="#64748b">（上一课学过的）</text>

    <text x="712" y="344" font-size="11" fill="#475569">每层只多干一件事：</text>
    <text x="712" y="360" font-size="11" fill="#475569">换版本 / 数个数 / 干活</text>
    <text x="712" y="376" font-size="11" fill="#475569">删掉上面那层，下面的跟着没</text>
  </g>

  <!-- 底部一句话 -->
  <text x="450" y="444" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">
    本课要解决的：让"我要三个"变成一句一直算数的话，还能安全地换、安全地退
  </text>
</svg>
