<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="460" fill="#fbfcfe"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">
    不是所有东西都适合"多备几个一模一样的"
  </text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">
    三种脾气不同的东西，得用三种安排法
  </text>

  <defs>
    <marker id="a6r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="a6g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- ===== 回顾：通用做法 ===== -->
  <rect x="30" y="76" width="200" height="180" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">上一课那套：多备几个</text>

  <g>
    <rect x="52" y="114" width="70" height="40" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="87" y="138" text-anchor="middle" font-size="10" fill="#64748b">谁都行</text>
    <rect x="130" y="114" width="70" height="40" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="165" y="138" text-anchor="middle" font-size="10" fill="#64748b">谁都行</text>
    <rect x="52" y="162" width="70" height="40" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="87" y="186" text-anchor="middle" font-size="10" fill="#64748b">谁都行</text>
    <rect x="130" y="162" width="70" height="40" rx="4" fill="#f5f5f5" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="165" y="186" text-anchor="middle" font-size="10" fill="#9ca3af">没了</text>
  </g>
  <text x="130" y="224" text-anchor="middle" font-size="11" fill="#475569">补个新的来就行</text>
  <text x="130" y="240" text-anchor="middle" font-size="11" fill="#475569">—— 前提是：谁都一样</text>

  <path d="M 234 166 L 268 166" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a6r)"/>
  <text x="251" y="156" text-anchor="middle" font-size="10" fill="#dc2626">不适用</text>

  <!-- ===== 类型A：要身份的 ===== -->
  <rect x="272" y="76" width="196" height="180" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="370" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">① 有身份的</text>
  <text x="370" y="118" text-anchor="middle" font-size="10" fill="#3b82f6">（比如数据库）</text>

  <g>
    <rect x="292" y="128" width="156" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="370" y="147" text-anchor="middle" font-size="10" fill="#1e40af">一号 · 有自己的记事本</text>

    <rect x="292" y="164" width="156" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="370" y="183" text-anchor="middle" font-size="10" fill="#1e40af">二号 · 有自己的记事本</text>

    <rect x="292" y="200" width="156" height="30" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="370" y="219" text-anchor="middle" font-size="10" fill="#991b1b">三号 没了 → 补来的还得是"三号"</text>
  </g>
  <text x="370" y="246" text-anchor="middle" font-size="10" fill="#1e40af">补来的要还叫三号，</text>
  <text x="370" y="260" text-anchor="middle" font-size="10" fill="#1e40af">记事本也得还在</text>

  <!-- ===== 类型B：每台一个 ===== -->
  <rect x="482" y="76" width="196" height="180" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="580" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">② 每台机器上都要有</text>
  <text x="580" y="118" text-anchor="middle" font-size="10" fill="#059669">（比如收集日志的）</text>

  <g>
    <rect x="502" y="128" width="156" height="34" rx="4" fill="#fff" stroke="#86efac"/>
    <text x="514" y="146" font-size="10" fill="#065f46">机器 1：</text>
    <rect x="566" y="134" width="80" height="22" rx="3" fill="#d1fae5" stroke="#34d399"/>
    <text x="606" y="149" text-anchor="middle" font-size="9" fill="#065f46">有一个</text>

    <rect x="502" y="168" width="156" height="34" rx="4" fill="#fff" stroke="#86efac"/>
    <text x="514" y="186" font-size="10" fill="#065f46">机器 2：</text>
    <rect x="566" y="174" width="80" height="22" rx="3" fill="#d1fae5" stroke="#34d399"/>
    <text x="606" y="189" text-anchor="middle" font-size="9" fill="#065f46">有一个</text>

    <rect x="502" y="208" width="156" height="34" rx="4" fill="#fff" stroke="#86efac"/>
    <text x="514" y="226" font-size="10" fill="#065f46">机器 3（新加的）：</text>
    <rect x="604" y="214" width="42" height="22" rx="3" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
    <text x="625" y="229" text-anchor="middle" font-size="9" fill="#065f46">自动</text>
  </g>
  <text x="580" y="254" text-anchor="middle" font-size="10" fill="#065f46">不管几台机器，</text>
  <text x="580" y="268" text-anchor="middle" font-size="10" fill="#065f46">每台恰好一个</text>

  <!-- ===== 类型C：干完就走 ===== -->
  <rect x="692" y="76" width="178" height="180" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="781" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">③ 干完就收工</text>
  <text x="781" y="118" text-anchor="middle" font-size="10" fill="#dc2626">（比如每天备份一次）</text>

  <g>
    <rect x="712" y="128" width="138" height="30" rx="4" fill="#fff" stroke="#fca5a5"/>
    <text x="781" y="147" text-anchor="middle" font-size="10" fill="#7f1d1d">开始干</text>

    <path d="M 781 158 L 781 168" stroke="#6b7280" stroke-width="1.2" fill="none" marker-end="url(#a6r)"/>

    <rect x="712" y="172" width="138" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="781" y="191" text-anchor="middle" font-size="10" fill="#065f46">干完了 ✓ 收工</text>

    <path d="M 781 202 L 781 212" stroke="#dc2626" stroke-width="1.2" fill="none"/>
    <text x="781" y="228" text-anchor="middle" font-size="10" fill="#b91c1c">✕ 千万别再给我重启一个</text>
  </g>
  <text x="781" y="246" text-anchor="middle" font-size="10" fill="#7f1d1d">要的是"干完就完"，</text>
  <text x="781" y="260" text-anchor="middle" font-size="10" fill="#7f1d1d">不是"一直有人在"</text>

  <!-- ===== 下方：三种安排法对照 ===== -->
  <rect x="30" y="276" width="840" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="300" font-size="14" font-weight="700" fill="#334155">一句话分清这三种安排法</text>

  <g>
    <rect x="52" y="314" width="262" height="80" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="183" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">管"身份"的那种</text>
    <text x="183" y="356" text-anchor="middle" font-size="10" fill="#3b82f6">每个有固定名字，重建后名字不变</text>
    <text x="183" y="372" text-anchor="middle" font-size="10" fill="#3b82f6">各自有一份自己的存储</text>
    <text x="183" y="388" text-anchor="middle" font-size="10" fill="#3b82f6">按顺序起、按倒序停</text>

    <rect x="330" y="314" width="262" height="80" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="461" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">管"每台都有"的那种</text>
    <text x="461" y="356" text-anchor="middle" font-size="10" fill="#065f46">不管总共几台，每台恰好一个</text>
    <text x="461" y="372" text-anchor="middle" font-size="10" fill="#065f46">新加机器自动补上</text>
    <text x="461" y="388" text-anchor="middle" font-size="10" fill="#065f46">新机器也能被"挑"出来</text>

    <rect x="608" y="314" width="262" height="80" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="739" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">管"一次性活儿"的那种</text>
    <text x="739" y="356" text-anchor="middle" font-size="10" fill="#7f1d1d">干完就结束，不会再被拉起来</text>
    <text x="739" y="372" text-anchor="middle" font-size="10" fill="#7f1d1d">能定时重复（每天凌晨那种）</text>
    <text x="739" y="388" text-anchor="middle" font-size="10" fill="#7f1d1d">干完的东西要记得打扫</text>
  </g>

  <!-- 底部一句话 -->
  <text x="450" y="444" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">
    本课要解决的：给"有身份的""每台都要有的""干完就走的"这三种东西，各配一套合适的安排
  </text>
</svg>
