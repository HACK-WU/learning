<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="470" fill="#fbfcfe"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">
    外面的人怎么进来，进来之后又该去找谁
  </text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">
    两个麻烦：入口太多太贵 / 看不懂网址只认门牌号
  </text>

  <defs>
    <marker id="a8r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="a8g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="a8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== 左：一个服务一个入口 ===== -->
  <rect x="30" y="76" width="380" height="250" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="220" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">做法一：一个服务开一个门</text>

  <g>
    <!-- 三个入口 -->
    <rect x="50" y="116" width="90" height="30" rx="4" fill="#fee2e2" stroke="#f87171"/>
    <text x="95" y="135" text-anchor="middle" font-size="10" fill="#991b1b">大门 1 · 收费</text>
    <rect x="152" y="116" width="90" height="30" rx="4" fill="#fee2e2" stroke="#f87171"/>
    <text x="197" y="135" text-anchor="middle" font-size="10" fill="#991b1b">大门 2 · 收费</text>
    <rect x="254" y="116" width="90" height="30" rx="4" fill="#fee2e2" stroke="#f87171"/>
    <text x="299" y="135" text-anchor="middle" font-size="10" fill="#991b1b">大门 3 · 收费</text>
    <text x="352" y="135" font-size="11" fill="#991b1b">…还有 17 个</text>

    <path d="M 95 150 L 95 176" stroke="#dc2626" stroke-width="1.2" fill="none" marker-end="url(#a8r)"/>
    <path d="M 197 150 L 197 176" stroke="#dc2626" stroke-width="1.2" fill="none" marker-end="url(#a8r)"/>
    <path d="M 299 150 L 299 176" stroke="#dc2626" stroke-width="1.2" fill="none" marker-end="url(#a8r)"/>

    <rect x="50" y="180" width="90" height="30" rx="4" fill="#fff" stroke="#fca5a5"/>
    <text x="95" y="199" text-anchor="middle" font-size="9" fill="#7f1d1d">用户服务</text>
    <rect x="152" y="180" width="90" height="30" rx="4" fill="#fff" stroke="#fca5a5"/>
    <text x="197" y="199" text-anchor="middle" font-size="9" fill="#7f1d1d">订单服务</text>
    <rect x="254" y="180" width="90" height="30" rx="4" fill="#fff" stroke="#fca5a5"/>
    <text x="299" y="199" text-anchor="middle" font-size="9" fill="#7f1d1d">支付服务</text>
  </g>

  <text x="220" y="234" text-anchor="middle" font-size="11" fill="#991b1b">20 个服务 = 20 个大门 =</text>
  <text x="220" y="252" text-anchor="middle" font-size="11" fill="#991b1b">20 个对外地址 + 20 份费用 + 20 份证书</text>

  <rect x="50" y="266" width="340" height="46" rx="6" fill="#fff5f5" stroke="#fca5a5"/>
  <text x="220" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">更要命的是：这些大门认不出网址</text>
  <text x="220" y="301" text-anchor="middle" font-size="10" fill="#7f1d1d">它们只认"哪台机器 + 哪个口子"，不知道你要 /api 还是 /web</text>

  <!-- ===== 右：一个入口 + 前台分派 ===== -->
  <rect x="430" y="76" width="440" height="250" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="650" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">做法二：只开一个门，门口站个认路的</text>

  <text x="450" y="122" font-size="10" fill="#065f46">外面来的人</text>
  <rect x="450" y="128" width="90" height="30" rx="4" fill="#fff" stroke="#86efac"/>
  <text x="495" y="147" text-anchor="middle" font-size="10" fill="#065f46">访客</text>

  <path d="M 544 143 L 584 143" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a8g)"/>

  <rect x="588" y="122" width="120" height="42" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="648" y="140" text-anchor="middle" font-size="10" fill="#991b1b">唯一的大门</text>
  <text x="648" y="155" text-anchor="middle" font-size="9" fill="#dc2626">只有 1 个 · 1 份费用</text>

  <text x="732" y="146" font-size="10" fill="#065f46">（对，大门还是要有一个）</text>

  <path d="M 648 166 L 648 190" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a8g)"/>

  <!-- 前台 -->
  <rect x="450" y="194" width="396" height="52" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="648" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">门口认路的前台（看得懂网址）</text>
  <text x="648" y="234" text-anchor="middle" font-size="10" fill="#047857">"你要 /api/user → 左边；你要 /api/order → 中间"</text>

  <path d="M 520 250 L 520 276" stroke="#059669" stroke-width="1.3" fill="none" marker-end="url(#a8g)"/>
  <path d="M 648 250 L 648 276" stroke="#059669" stroke-width="1.3" fill="none" marker-end="url(#a8g)"/>
  <path d="M 776 250 L 776 276" stroke="#059669" stroke-width="1.3" fill="none" marker-end="url(#a8g)"/>

  <g>
    <rect x="462" y="280" width="116" height="30" rx="4" fill="#fff" stroke="#34d399"/>
    <text x="520" y="299" text-anchor="middle" font-size="9" fill="#065f46">用户服务</text>
    <rect x="590" y="280" width="116" height="30" rx="4" fill="#fff" stroke="#34d399"/>
    <text x="648" y="299" text-anchor="middle" font-size="9" fill="#065f46">订单服务</text>
    <rect x="718" y="280" width="116" height="30" rx="4" fill="#fff" stroke="#34d399"/>
    <text x="776" y="299" text-anchor="middle" font-size="9" fill="#065f46">网页服务</text>
  </g>

  <!-- ===== 下方：规则 vs 干活的人 ===== -->
  <rect x="30" y="342" width="840" height="94" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="52" y="366" font-size="14" font-weight="700" fill="#b45309">本课最容易踩的坑：写了规则，没人执行</text>

  <g>
    <rect x="52" y="378" width="230" height="48" rx="6" fill="#fff" stroke="#fbbf24"/>
    <text x="167" y="398" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">你写的那份：交通规则</text>
    <text x="167" y="416" text-anchor="middle" font-size="10" fill="#b45309">"谁走哪条路"，写清楚就行</text>

    <text x="304" y="404" font-size="15" fill="#b45309">＋</text>

    <rect x="322" y="378" width="230" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="437" y="398" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">得有人站岗：交警</text>
    <text x="437" y="416" text-anchor="middle" font-size="10" fill="#b45309">得另外装，官方不自带</text>

    <text x="574" y="404" font-size="15" fill="#059669">＝</text>

    <rect x="592" y="378" width="278" height="48" rx="6" fill="#d1fae5" stroke="#059669"/>
    <text x="731" y="398" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">两个都在，路口才真的有人指挥</text>
    <text x="731" y="416" text-anchor="middle" font-size="10" fill="#047857">只贴规则不上岗 → 照样没人管</text>
  </g>

  <!-- 底部一句话 -->
  <text x="450" y="458" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">
    本课要解决的：外面只开一个门，靠一个看得懂网址的前台，把人分派给屋里不同的服务
  </text>
</svg>
