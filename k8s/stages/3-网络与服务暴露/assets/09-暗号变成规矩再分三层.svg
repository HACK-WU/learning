<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="470" fill="#fbfcfe"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">
    同一件事，各写各的 —— 怎么才能换个牌子也照样管用
  </text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">
    老办法：高级功能靠各家"暗号" · 新办法：写成大家都认的规矩
  </text>

  <defs>
    <marker id="a9r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="a9g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="a9" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== 上半：老办法的暗号问题 ===== -->
  <rect x="30" y="76" width="840" height="176" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="52" y="100" font-size="14" font-weight="700" fill="#b91c1c">老办法的麻烦：同一件事，各家写各家的"暗号"</text>
  <text x="848" y="100" text-anchor="end" font-size="11" fill="#7f1d1d">想让"一成的人先试新版"</text>

  <g>
    <rect x="52" y="114" width="250" height="52" rx="6" fill="#fff" stroke="#fca5a5"/>
    <text x="177" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">牌子 A 的暗号</text>
    <text x="177" y="152" text-anchor="middle" font-size="10" fill="#7f1d1d">canary-weight: "10"</text>

    <rect x="322" y="114" width="250" height="52" rx="6" fill="#fff" stroke="#fca5a5"/>
    <text x="447" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">牌子 B 的暗号</text>
    <text x="447" y="152" text-anchor="middle" font-size="10" fill="#7f1d1d">service-weights: ...</text>

    <rect x="592" y="114" width="278" height="52" rx="6" fill="#fff" stroke="#fca5a5"/>
    <text x="731" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">牌子 C 的暗号</text>
    <text x="731" y="152" text-anchor="middle" font-size="10" fill="#7f1d1d">另起一套自己的写法</text>
  </g>

  <text x="52" y="188" font-size="11" fill="#7f1d1d">互相不认：把牌子 A 的暗号交给牌子 B →</text>
  <rect x="322" y="176" width="548" height="26" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="596" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">不报错，直接当没看见 —— 全部人都去了新版 ✕</text>

  <text x="52" y="224" font-size="11" fill="#7f1d1d">换个牌子就得重写一遍；写错了还不告诉你，出事才发现</text>
  <text x="52" y="242" font-size="11" fill="#b91c1c">后果：规定了等于没规定，全靠各家自觉</text>

  <!-- ===== 下半：三层分工 ===== -->
  <rect x="30" y="268" width="840" height="164" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="52" y="292" font-size="14" font-weight="700" fill="#047857">新办法：写成大家都认的规矩，并按"谁管哪块"分三层</text>

  <g>
    <!-- 第一层 -->
    <rect x="52" y="306" width="230" height="70" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="167" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">第一层：用哪家的实现</text>
    <text x="167" y="344" text-anchor="middle" font-size="10" fill="#047857">由"管设施的人"定一次</text>
    <text x="167" y="360" text-anchor="middle" font-size="10" fill="#047857">定完大家照着用</text>

    <path d="M 286 341 L 320 341" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a9g)"/>

    <!-- 第二层 -->
    <rect x="324" y="306" width="230" height="70" rx="6" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
    <text x="439" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">第二层：开哪个门、接待谁</text>
    <text x="439" y="344" text-anchor="middle" font-size="10" fill="#047857">由"管集群的人"定</text>
    <text x="439" y="360" text-anchor="middle" font-size="10" fill="#047857">真正守在门口的那个</text>

    <path d="M 558 341 L 592 341" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a9g)"/>

    <!-- 第三层 -->
    <rect x="596" y="306" width="250" height="70" rx="6" fill="#fff" stroke="#34d399" stroke-width="2"/>
    <text x="721" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">第三层：来了往哪儿走</text>
    <text x="721" y="344" text-anchor="middle" font-size="10" fill="#047857">由"写这个服务的人"定</text>
    <text x="721" y="360" text-anchor="middle" font-size="10" fill="#047857">各写各的，互不干扰</text>
  </g>

  <!-- 角色标注 -->
  <text x="52" y="398" font-size="11" fill="#065f46">三个人各管一块，彼此不用对细节 —— 所以换掉下面那家的实现，上面写的规则不用改</text>

  <!-- 关键警告 -->
  <rect x="52" y="404" width="794" height="24" rx="4" fill="#fff5f5" stroke="#fca5a5"/>
  <text x="449" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">⚠ 三层缺任何一层都不通 —— 而且它不报错，只是状态一直"不清楚"，得自己去看状态</text>

  <!-- 底部一句话 -->
  <text x="450" y="458" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">
    本课要解决的：把"各家暗号"变成"大家都认的规矩"，并按谁管哪块拆成三层
  </text>
</svg>
