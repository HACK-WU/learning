<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a">一个 Secret 的三种命运：加密前、加密后、以及谁都能偷走它</text>
  <text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">上：静态加密改变了「存储介质被偷」的后果，但改变不了「API 有权限就能读」；下：五条攻击路径与对应防线</text>

  <!-- 左：未加密 -->
  <rect x="30" y="66" width="400" height="196" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="230" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c53030">默认（未开启静态加密）</text>
  <text x="46" y="118" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">kubectl: password: U3VwZXJTZWNyZXQxMjMh</text>
  <text x="46" y="140" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">etcd 里（实测）：k8s v1 Secret …</text>
  <text x="46" y="158" font-family="sans-serif" font-size="12" fill="#666666">protobuf 明文，无 k8s:enc: 前缀</text>
  <line x1="46" y1="170" x2="414" y2="170" stroke="#cbd5e0" stroke-width="1"/>
  <text x="46" y="192" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#c53030">拿到 etcd 备份 / 磁盘 / 快照 = 拿到全部凭据</text>
  <text x="46" y="212" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">base64 -d 一下就是明文</text>
  <text x="46" y="234" font-family="sans-serif" font-size="12" fill="#666666">实测：本 kind 集群默认即此状态</text>
  <text x="46" y="252" font-family="sans-serif" font-size="12" fill="#666666">（apiserver 无 encryption 参数）</text>

  <!-- 右：已加密 -->
  <rect x="470" y="66" width="400" height="196" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="670" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#276749">开启静态加密后</text>
  <text x="486" y="118" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">kubectl：看起来完全一样（透明解密）</text>
  <text x="486" y="140" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">etcd 里：k8s:enc:aescbc:v1:key1:…</text>
  <text x="486" y="158" font-family="sans-serif" font-size="12" fill="#666666">密文，无密钥不可解</text>
  <line x1="486" y1="170" x2="854" y2="170" stroke="#cbd5e0" stroke-width="1"/>
  <text x="486" y="192" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#276749">拿到 etcd 备份 = 拿到一堆乱码</text>
  <text x="486" y="212" font-family="sans-serif" font-size="12.5" fill="#c05621">但：有 get 权限的人照样读到明文</text>
  <text x="486" y="234" font-family="sans-serif" font-size="12" fill="#666666">因为 apiserver 读取时自动解密</text>
  <text x="486" y="252" font-family="sans-serif" font-size="12" fill="#666666">→ 静态加密防「介质失窃」，不防「权限滥用」</text>

  <polygon points="436,164 452,164 452,159 458,164 452,169 452,164" fill="#718096"/>
  <text x="450" y="278" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666666">静态加密改变的是「介质被偷的后果」，不改变「API 权限边界」——两者必须同时做</text>

  <line x1="30" y1="292" x2="870" y2="292" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="450" y="316" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">五条偷走 Secret 的路径，以及各自的防线</text>

  <!-- 表格 -->
  <rect x="30" y="330" width="840" height="26" fill="#e2e8f0"/>
  <rect x="30" y="356" width="840" height="30" fill="#f7fafc"/>
  <rect x="30" y="386" width="840" height="30" fill="#ffffff"/>
  <rect x="30" y="416" width="840" height="30" fill="#f7fafc"/>
  <rect x="30" y="446" width="840" height="30" fill="#ffffff"/>
  <rect x="30" y="476" width="840" height="30" fill="#f7fafc"/>

  <text x="46" y="348" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#2d3748">攻击路径</text>
  <text x="330" y="348" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#2d3748">实测状态</text>
  <text x="520" y="348" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#2d3748">防线</text>

  <text x="46" y="375" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">① 有 secrets get 权限（RBAC 过宽）</text>
  <text x="336" y="375" font-family="sans-serif" font-size="12.5" fill="#276749">默认 SA: no（实测）</text>
  <text x="526" y="375" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">最小权限 + resourceNames 限定</text>

  <text x="46" y="405" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">② 容器内的 SA token 被利用</text>
  <text x="336" y="405" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#c53030">token 就在容器里（1168 字符）</text>
  <text x="526" y="405" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">automountServiceAccountToken: false</text>

  <text x="46" y="435" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">③ 环境变量注入（子进程/日志/转储）</text>
  <text x="336" y="435" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#c53030">子进程与日志都能拿到（实测）</text>
  <text x="526" y="435" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">改用卷挂载 + defaultMode 0400</text>

  <text x="46" y="465" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">④ 拿到 etcd 备份 / 控制面磁盘</text>
  <text x="336" y="465" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#c53030">未加密 = 明文可读（实测）</text>
  <text x="526" y="465" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">静态加密（aescbc / KMS v2）</text>

  <text x="46" y="495" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">⑤ 明文写进 Git / 镜像层</text>
  <text x="336" y="495" font-family="sans-serif" font-size="12.5" fill="#276749">本环境未发现（实测干净）</text>
  <text x="526" y="495" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">Sealed Secrets / SOPS / 外部密钥管理</text>

  <text x="450" y="524" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666666">Secret 卷实测挂在 tmpfs 上（kubernetes.io~projected）——不落节点磁盘，这是 k8s 默认就做对的一件事</text>
  <text x="450" y="544" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666666">审计日志是唯一能在事后回答「谁在什么时候读了什么」的手段：默认关闭，本集群实测未启用</text>
</svg>
