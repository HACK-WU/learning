<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="470" fill="#fbfcfe"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">
    同一个东西换个地方摆，为什么要重新做一份
  </text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">
    把"会变的那部分"从成品里拿出来，用时再塞回去
  </text>

  <defs>
    <marker id="a11r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="a11g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="a11" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== 左：焊死在成品里 ===== -->
  <rect x="30" y="76" width="420" height="270" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="240" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">做法一：把设置焊进成品里</text>

  <g>
    <rect x="52" y="116" width="120" height="70" rx="6" fill="#fff" stroke="#fca5a5"/>
    <text x="112" y="136" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">成品 · 试用版</text>
    <text x="112" y="154" text-anchor="middle" font-size="9" fill="#7f1d1d">程序 ＋ 试用库地址</text>
    <text x="112" y="170" text-anchor="middle" font-size="9" fill="#7f1d1d">＋ 试用库密码</text>

    <rect x="182" y="116" width="120" height="70" rx="6" fill="#fff" stroke="#fca5a5"/>
    <text x="242" y="136" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">成品 · 正式版</text>
    <text x="242" y="154" text-anchor="middle" font-size="9" fill="#7f1d1d">程序 ＋ 正式库地址</text>
    <text x="242" y="170" text-anchor="middle" font-size="9" fill="#7f1d1d">＋ 正式库密码</text>

    <rect x="312" y="116" width="114" height="70" rx="6" fill="#fff" stroke="#fca5a5"/>
    <text x="369" y="136" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">成品 · 测试版</text>
    <text x="369" y="154" text-anchor="middle" font-size="9" fill="#7f1d1d">程序 ＋ 测试库地址</text>
    <text x="369" y="170" text-anchor="middle" font-size="9" fill="#7f1d1d">＋ 测试库密码</text>
  </g>

  <text x="240" y="208" text-anchor="middle" font-size="10" fill="#991b1b">程序一模一样，只因设置不同就要做三份</text>

  <rect x="52" y="220" width="374" height="112" rx="6" fill="#fff5f5" stroke="#fca5a5"/>
  <text x="68" y="240" font-size="11" font-weight="700" fill="#b91c1c">麻烦在哪：</text>
  <text x="68" y="260" font-size="10" fill="#7f1d1d">· 你验过的是试用版，上线的是正式版 —— 严格说是两个东西</text>
  <text x="68" y="276" font-size="10" fill="#7f1d1d">· 改个密码也要重新做一遍、重新走一遍流程</text>
  <text x="68" y="292" font-size="10" fill="#7f1d1d">· 密码被封在成品里 —— 拿到成品的人能翻出来，</text>
  <text x="82" y="308" font-size="10" fill="#7f1d1d">而且删不掉（一层层叠上去的）</text>
  <text x="68" y="324" font-size="10" fill="#7f1d1d">· 环境越多，成品份数越多</text>

  <!-- ===== 右：拿出来 ===== -->
  <rect x="470" y="76" width="400" height="270" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="670" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">做法二：设置另外放着，用时再塞进去</text>

  <!-- 同一个成品 -->
  <rect x="600" y="116" width="140" height="60" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="670" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">成品 · 只有一份</text>
  <text x="670" y="162" text-anchor="middle" font-size="10" fill="#047857">里面只有程序，没有设置</text>

  <!-- 三份设置 -->
  <g>
    <rect x="492" y="196" width="112" height="48" rx="4" fill="#fff" stroke="#86efac"/>
    <text x="548" y="216" text-anchor="middle" font-size="10" fill="#065f46">试用环境设置</text>
    <text x="548" y="232" text-anchor="middle" font-size="9" fill="#059669">地址 ＋ 密码</text>

    <rect x="614" y="196" width="112" height="48" rx="4" fill="#fff" stroke="#86efac"/>
    <text x="670" y="216" text-anchor="middle" font-size="10" fill="#065f46">正式环境设置</text>
    <text x="670" y="232" text-anchor="middle" font-size="9" fill="#059669">地址 ＋ 密码</text>

    <rect x="736" y="196" width="112" height="48" rx="4" fill="#fff" stroke="#86efac"/>
    <text x="792" y="216" text-anchor="middle" font-size="10" fill="#065f46">测试环境设置</text>
    <text x="792" y="232" text-anchor="middle" font-size="9" fill="#059669">地址 ＋ 密码</text>
  </g>

  <text x="670" y="266" text-anchor="middle" font-size="10" fill="#065f46">同一个成品，换哪套设置就是哪套环境</text>

  <path d="M 670 180 L 670 192" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a11g)"/>

  <rect x="492" y="278" width="356" height="54" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="670" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">密码要单独放</text>
  <text x="670" y="316" text-anchor="middle" font-size="10" fill="#047857">地址可以公开写，密码不行 —— 分两个地方存</text>

  <!-- ===== 下方：新冒出来的坑 ===== -->
  <rect x="30" y="362" width="840" height="76" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="52" y="386" font-size="14" font-weight="700" fill="#b45309">但拿出来之后，冒出一个更隐蔽的坑</text>

  <g>
    <rect x="52" y="396" width="250" height="30" rx="4" fill="#fff" stroke="#fbbf24"/>
    <text x="177" y="415" text-anchor="middle" font-size="10" fill="#92400e">你改了设置</text>

    <text x="322" y="415" font-size="14" fill="#b45309">→</text>

    <rect x="342" y="396" width="250" height="30" rx="4" fill="#fee2e2" stroke="#f87171"/>
    <text x="467" y="415" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">程序读到的还是旧值 ✕</text>

    <text x="612" y="415" font-size="11" fill="#92400e">这不是出错，是设计如此</text>
    <text x="612" y="431" font-size="10" fill="#b45309">本课会把它实测钉死</text>
  </g>

  <!-- 底部一句话 -->
  <text x="450" y="458" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">
    本课要解决的：把"会变的那部分"从成品里拿出来，并弄清拿出来之后为什么会读不到新值
  </text>
</svg>
