<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="470" fill="#fbfcfe"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">
    两种吩咐方式：一步一步教，还是只说要什么
  </text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">
    上：你说一步它做一步，断了就断在半路 · 下：你说目标，它自己反复对齐
  </text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="a2r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="a2g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- ========== 上半：命令式 ========== -->
  <rect x="30" y="78" width="840" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="52" y="102" font-size="15" font-weight="700" fill="#b91c1c">方式一：一步一步教（命令式）</text>
  <text x="860" y="102" text-anchor="end" font-size="12" fill="#7f1d1d">你负责想清楚每一步，还要负责第 3 步失败怎么办</text>

  <!-- 步骤链 -->
  <g>
    <rect x="54" y="118" width="120" height="46" rx="6" fill="#fff" stroke="#fca5a5"/>
    <text x="114" y="138" text-anchor="middle" font-size="12" fill="#7f1d1d">第 1 步 装依赖</text>
    <text x="114" y="154" text-anchor="middle" font-size="10" fill="#9ca3af">你说</text>

    <path d="M 178 141 L 196 141" stroke="#6b7280" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>

    <rect x="200" y="118" width="120" height="46" rx="6" fill="#fff" stroke="#fca5a5"/>
    <text x="260" y="138" text-anchor="middle" font-size="12" fill="#7f1d1d">第 2 步 改配置</text>
    <text x="260" y="154" text-anchor="middle" font-size="10" fill="#9ca3af">你说</text>

    <path d="M 324 141 L 342 141" stroke="#6b7280" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>

    <rect x="346" y="118" width="120" height="46" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="406" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">第 3 步 重启</text>
    <text x="406" y="154" text-anchor="middle" font-size="10" fill="#dc2626">✕ 失败</text>

    <!-- 断在这里 -->
    <text x="486" y="132" font-size="12" font-weight="700" fill="#b91c1c">然后呢？</text>
    <text x="486" y="150" font-size="11" fill="#7f1d1d">不知道停在</text>
    <text x="486" y="166" font-size="11" fill="#7f1d1d">哪一步了</text>

    <path d="M 592 141 L 620 141" stroke="#dc2626" stroke-width="1.4" fill="none" marker-end="url(#a2r)"/>
    <rect x="624" y="118" width="230" height="46" rx="6" fill="#fce7f3" stroke="#ec4899"/>
    <text x="739" y="138" text-anchor="middle" font-size="12" fill="#9d174d">重跑一遍？可能重复做、</text>
    <text x="739" y="154" text-anchor="middle" font-size="12" fill="#9d174d">也可能把事情搞得更乱</text>
  </g>

  <text x="54" y="196" font-size="12" fill="#7f1d1d">问题根源：脚本记的是"动作"，不是"目标"—— 所以出事之后，没人知道"本来应该长什么样"</text>

  <!-- ========== 下半：声明式 ========== -->
  <rect x="30" y="248" width="840" height="184" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="52" y="272" font-size="15" font-weight="700" fill="#047857">方式二：只说要什么（声明式）</text>
  <text x="860" y="272" text-anchor="end" font-size="12" fill="#065f46">你只管目标，对齐过程由它反复自己做</text>

  <!-- 目标纸 -->
  <rect x="54" y="286" width="150" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="129" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">你写下的目标</text>
  <text x="129" y="328" text-anchor="middle" font-size="12" fill="#047857">"一直留 3 个"</text>

  <!-- 循环 -->
  <path d="M 208 314 L 246 314" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a2g)"/>

  <rect x="250" y="286" width="120" height="56" rx="8" fill="#fff" stroke="#34d399"/>
  <text x="310" y="308" text-anchor="middle" font-size="12" fill="#065f46">看看现在</text>
  <text x="310" y="326" text-anchor="middle" font-size="11" fill="#059669">实际有几个？</text>

  <path d="M 374 314 L 400 314" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a2g)"/>

  <rect x="404" y="286" width="110" height="56" rx="8" fill="#fff" stroke="#34d399"/>
  <text x="459" y="308" text-anchor="middle" font-size="12" fill="#065f46">对一对</text>
  <text x="459" y="326" text-anchor="middle" font-size="11" fill="#059669">差几个？</text>

  <path d="M 518 314 L 544 314" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a2g)"/>

  <rect x="548" y="286" width="120" height="56" rx="8" fill="#fff" stroke="#34d399"/>
  <text x="608" y="308" text-anchor="middle" font-size="12" fill="#065f46">动手补齐</text>
  <text x="608" y="326" text-anchor="middle" font-size="11" fill="#059669">差几个补几个</text>

  <!-- 回环 -->
  <path d="M 668 300 C 720 268 760 268 800 292" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a2g)"/>
  <text x="800" y="284" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">一直转</text>

  <path d="M 668 330 C 700 380 400 396 129 348" stroke="#059669" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#a2g)"/>
  <text x="400" y="398" text-anchor="middle" font-size="11" fill="#047857">回到"看看现在"—— 这个圈不会停</text>

  <!-- 右下注释 -->
  <text x="54" y="372" font-size="12" fill="#065f46">所以删掉一个，它会补回来 —— 不是跟你作对，是它还在跟你的目标对齐</text>

  <!-- 底部一句话 -->
  <rect x="30" y="440" width="840" height="0" rx="6" fill="#eff6ff"/>
  <text x="450" y="458" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">
    本课要解决的：把"我该怎么做"换成"我要什么"，剩下的交给一个不停打转的圈
  </text>
</svg>
