<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="450" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle">
    一个对象是一张双栏表：左边你填，右边系统填
  </text>

  <!-- 左栏：你提交的 YAML -->
  <rect x="40" y="70" width="360" height="330" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">
    你写的那一半
  </text>
  <text x="220" y="122" font-family="sans-serif" font-size="12" fill="#3b82f6" text-anchor="middle">
    提交的 YAML · 11 行
  </text>

  <rect x="66" y="140" width="308" height="40" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="82" y="165" font-family="sans-serif" font-size="13" fill="#1f2937">apiVersion / kind</text>
  <text x="330" y="165" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="end">类型和版式</text>

  <rect x="66" y="192" width="308" height="40" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="82" y="217" font-family="sans-serif" font-size="13" fill="#1f2937">metadata.name / namespace</text>
  <text x="330" y="217" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="end">叫什么、在哪</text>

  <rect x="66" y="244" width="308" height="76" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="82" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">spec</text>
  <text x="82" y="292" font-family="sans-serif" font-size="12" fill="#1f2937">你想要的：几个副本</text>
  <text x="82" y="310" font-family="sans-serif" font-size="12" fill="#1f2937">用什么镜像、要多少资源</text>

  <!-- 作者标注 -->
  <circle cx="220" cy="352" r="0" fill="none"/>
  <rect x="110" y="336" width="220" height="34" rx="17" fill="#1e40af"/>
  <text x="220" y="358" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    ✍ 作者：你（kubectl apply）
  </text>

  <!-- 分隔线 -->
  <line x1="450" y1="70" x2="450" y2="400" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="450" y="424" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">
    互不覆盖
  </text>

  <!-- 右栏：集群里的完整对象 -->
  <rect x="500" y="70" width="360" height="330" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#15803d" text-anchor="middle">
    系统写的那一半
  </text>
  <text x="680" y="122" font-family="sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">
    get -o yaml 拿回的 · 100+ 行
  </text>

  <rect x="526" y="140" width="308" height="40" rx="5" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="542" y="165" font-family="sans-serif" font-size="13" fill="#1f2937">uid / resourceVersion</text>
  <text x="790" y="165" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="end">身份证 · 版本号</text>

  <rect x="526" y="192" width="308" height="40" rx="5" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="542" y="217" font-family="sans-serif" font-size="13" fill="#1f2937">creationTimestamp / generation</text>
  <text x="790" y="217" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="end">何时建 · 改几次</text>

  <rect x="526" y="244" width="308" height="76" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="542" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#15803d">status</text>
  <text x="542" y="292" font-family="sans-serif" font-size="12" fill="#1f2937">实际跑了几份、健不健康</text>
  <text x="542" y="310" font-family="sans-serif" font-size="12" fill="#1f2937">IP 是多少、在哪个节点</text>

  <rect x="590" y="336" width="220" height="34" rx="17" fill="#15803d"/>
  <text x="700" y="358" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    ⚙ 作者：控制器 / kubelet
  </text>

  <!-- 底部结论 -->
  <rect x="40" y="436" width="820" height="0" fill="none"/>
</svg>
