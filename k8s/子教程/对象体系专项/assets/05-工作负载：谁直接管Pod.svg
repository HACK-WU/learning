<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440">
  <rect x="0" y="0" width="920" height="440" fill="#ffffff"/>

  <text x="460" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">
    谁直接管 Pod：有的隔一层，有的不隔
  </text>

  <!-- 左侧：手写 -->
  <text x="120" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">
    你手写的控制器
  </text>

  <rect x="40" y="76" width="160" height="40" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="120" y="101" font-family="sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">Deployment</text>

  <rect x="40" y="136" width="160" height="40" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="120" y="161" font-family="sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">StatefulSet</text>

  <rect x="40" y="196" width="160" height="40" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="120" y="221" font-family="sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">Job</text>

  <rect x="40" y="256" width="160" height="40" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="120" y="281" font-family="sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">CronJob</text>

  <!-- 中间层：只有 Deployment 有 -->
  <text x="330" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">
    中间层（只有部分有）
  </text>

  <rect x="250" y="76" width="160" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="330" y="101" font-family="sans-serif" font-size="12" fill="#92400e" text-anchor="middle">ReplicaSet</text>

  <rect x="250" y="256" width="160" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="330" y="281" font-family="sans-serif" font-size="12" fill="#92400e" text-anchor="middle">Job</text>

  <!-- 右侧：Pod -->
  <text x="620" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">
    真正跑容器的
  </text>
  <rect x="540" y="76" width="160" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="101" font-family="sans-serif" font-size="12" fill="#15803d" text-anchor="middle">Pod</text>

  <rect x="540" y="136" width="160" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="161" font-family="sans-serif" font-size="12" fill="#15803d" text-anchor="middle">Pod（有序号）</text>

  <rect x="540" y="196" width="160" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="221" font-family="sans-serif" font-size="12" fill="#15803d" text-anchor="middle">Pod（跑完即止）</text>

  <rect x="540" y="256" width="160" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="281" font-family="sans-serif" font-size="12" fill="#15803d" text-anchor="middle">Pod</text>

  <!-- 连线 -->
  <line x1="200" y1="96" x2="248" y2="96" stroke="#4b5563" stroke-width="2" marker-end="url(#g5)"/>
  <line x1="410" y1="96" x2="538" y2="96" stroke="#4b5563" stroke-width="2" marker-end="url(#g5)"/>

  <line x1="200" y1="156" x2="538" y2="156" stroke="#16a34a" stroke-width="2.5" marker-end="url(#gr)"/>
  <text x="370" y="150" font-family="sans-serif" font-size="10" fill="#15803d" text-anchor="middle">直接管，不隔层</text>

  <line x1="200" y1="216" x2="538" y2="216" stroke="#16a34a" stroke-width="2.5" marker-end="url(#gr)"/>
  <text x="370" y="210" font-family="sans-serif" font-size="10" fill="#15803d" text-anchor="middle">直接管，不隔层</text>

  <line x1="200" y1="276" x2="248" y2="276" stroke="#4b5563" stroke-width="2" marker-end="url(#g5)"/>
  <line x1="410" y1="276" x2="538" y2="276" stroke="#4b5563" stroke-width="2" marker-end="url(#g5)"/>

  <!-- 底部说明 -->
  <rect x="40" y="320" width="660" height="96" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="370" y="346" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">
    为什么有的隔一层、有的不隔
  </text>
  <text x="370" y="370" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">
    需要「版本管理」的（Deployment / CronJob）→ 隔一层，中间层就是版本的载体
  </text>
  <text x="370" y="392" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">
    不需要版本管理的（StatefulSet / Job）→ 直接管 Pod，少一层少一份复杂度
  </text>
  <text x="370" y="410" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">
    实测：Deployment 的 Pod 认 ReplicaSet 做爹；StatefulSet 的 Pod 直接认 StatefulSet
  </text>

  <defs>
    <marker id="g5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#4b5563"/>
    </marker>
    <marker id="gr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
