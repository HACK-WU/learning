<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1000" height="760" fill="#fbfcfd"/>
  <text x="500" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a2b3c">课 3：etcd 与控制面 —— 备份成功 ≠ 你能拿到备份文件</text>

  <!-- 左：备份链路 -->
  <rect x="22" y="52" width="308" height="392" rx="9" fill="#e8f4ff" stroke="#2d7dd2" stroke-width="2"/>
  <text x="176" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#14497a">① 备份三条路径（实测）</text>

  <rect x="38" y="90" width="276" height="72" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="50" y="109" font-size="12" font-weight="bold" fill="#991b1b">✗ 写 /tmp</text>
  <text x="50" y="127" font-size="10" fill="#444">snapshot save /tmp/etcd.db</text>
  <text x="50" y="143" font-size="10" fill="#dc2626">提示 "Snapshot saved" 但节点上 ls 不到</text>
  <text x="50" y="157" font-size="10" fill="#666">原因：/tmp 不在 hostPath 挂载里</text>

  <rect x="38" y="170" width="276" height="72" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="50" y="189" font-size="12" font-weight="bold" fill="#991b1b">✗ kubectl cp 取文件</text>
  <text x="50" y="207" font-size="10" fill="#444">kubectl cp pod:/tmp/x.db ./x.db</text>
  <text x="50" y="223" font-size="10" fill="#dc2626">error: "tar": executable file not found</text>
  <text x="50" y="237" font-size="10" fill="#666">原因：distroless 镜像无 tar / ls / du</text>

  <rect x="38" y="250" width="276" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="50" y="269" font-size="12" font-weight="bold" fill="#14532d">✓ 写 /var/lib/etcd（唯一可行）</text>
  <text x="50" y="287" font-size="10" fill="#444">snapshot save /var/lib/etcd/snap.db</text>
  <text x="50" y="303" font-size="10" fill="#16a34a">节点上可见：-rw------- 25288704</text>
  <text x="50" y="317" font-size="10" fill="#666">25MB 与 DB SIZE 吻合（交叉验证）</text>
  <text x="50" y="331" font-size="10" fill="#c2410c">⚠️ 用完立刻 rm，别留在数据目录</text>

  <rect x="38" y="340" width="276" height="94" rx="6" fill="#fff7e6" stroke="#e8a33d"/>
  <text x="50" y="359" font-size="12" font-weight="bold" fill="#8a5a00">⚠️ 3.6 工具陷阱（本课新发现）</text>
  <text x="50" y="377" font-size="10" fill="#444">etcdctl version  → 3.6.4（有）</text>
  <text x="50" y="393" font-size="10" fill="#dc2626">etcdutl version  → not found（无！）</text>
  <text x="50" y="409" font-size="10" fill="#dc2626">etcdctl snapshot status → 已被移除</text>
  <text x="50" y="427" font-size="10" fill="#8a5a00">→ 恢复工具要提前备到运维跳板机</text>

  <!-- 中：健康指标 -->
  <rect x="346" y="52" width="308" height="392" rx="9" fill="#fff7e6" stroke="#e8a33d" stroke-width="2"/>
  <text x="500" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">② 健康与空间（实测）</text>

  <text x="362" y="102" font-size="12" font-weight="bold" fill="#1a2b3c">endpoint health ✅</text>
  <text x="362" y="120" font-size="10" fill="#16a34a">is healthy: successfully committed proposal</text>
  <text x="362" y="137" font-size="10" fill="#444">took = 8.02ms（能写入才是真健康）</text>

  <line x1="362" y1="148" x2="638" y2="148" stroke="#e8a33d" stroke-dasharray="3,3"/>

  <text x="362" y="168" font-size="12" font-weight="bold" fill="#1a2b3c">空间账本（差 15 倍！）</text>
  <text x="362" y="188" font-size="10" fill="#444">DB SIZE（status 显示）  25 MB</text>
  <text x="362" y="206" font-size="10" fill="#444">── DB IN USE            6.5 MB</text>
  <text x="362" y="224" font-size="10" fill="#c2410c">── 碎片率                73%</text>
  <text x="362" y="244" font-size="10" font-weight="bold" fill="#dc2626">member/wal   367 MB ← status 看不到</text>
  <text x="362" y="262" font-size="10" fill="#444">member/snap   25 MB</text>
  <text x="362" y="280" font-size="10" font-weight="bold" fill="#dc2626">磁盘总计     391 MB（du 实测）</text>

  <rect x="362" y="292" width="276" height="46" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="374" y="310" font-size="10" font-weight="bold" fill="#991b1b">DB SIZE 不含 WAL → 严重低估磁盘</text>
  <text x="374" y="328" font-size="10" fill="#444">"DB 才 25M 为何磁盘满？" 看 WAL</text>

  <rect x="362" y="346" width="276" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="374" y="364" font-size="10" font-weight="bold" fill="#1a2b3c">QUOTA = 0（未配置）</text>
  <text x="374" y="382" font-size="10" fill="#dc2626">= 无限增长，撑爆磁盘才 NOSPACE</text>

  <rect x="362" y="398" width="276" height="38" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="374" y="415" font-size="10" fill="#444">碎片率看趋势不看单值（7.3→6.5MB 浮动）</text>
  <text x="374" y="430" font-size="10" fill="#c2410c">defrag 会阻塞读写 → 本课未执行</text>

  <!-- 右：控制面 -->
  <rect x="670" y="52" width="308" height="392" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="824" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">③ 控制面连接（实测）</text>

  <text x="686" y="102" font-size="11" fill="#444">档案室管理员模型：只有管理员能进档案室</text>

  <rect x="686" y="114" width="276" height="52" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="698" y="133" font-size="12" font-weight="bold" fill="#14532d">kube-apiserver ✅ 直连 etcd</text>
  <text x="698" y="152" font-size="10" fill="#444">--etcd-servers=https://127.0.0.1:2379</text>

  <rect x="686" y="174" width="276" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="698" y="193" font-size="12" fill="#475569">controller-manager ✗ 不直连</text>
  <text x="698" y="212" font-size="10" fill="#666">清单中 etcd 匹配数 = 0（走 apiserver）</text>

  <rect x="686" y="234" width="276" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="698" y="253" font-size="12" fill="#475569">kube-scheduler ✗ 不直连</text>
  <text x="698" y="272" font-size="10" fill="#666">清单中 etcd 匹配数 = 0（走 apiserver）</text>

  <rect x="686" y="296" width="276" height="66" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="698" y="315" font-size="11" font-weight="bold" fill="#991b1b">故障传导方向</text>
  <text x="698" y="333" font-size="10" fill="#444">etcd 挂 → apiserver 挂 → 控制面全废</text>
  <text x="698" y="351" font-size="10" fill="#16a34a">apiserver 挂而 etcd 在 → 数据不丢</text>

  <rect x="686" y="370" width="276" height="66" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="698" y="389" font-size="11" font-weight="bold" fill="#1a2b3c">证书（课 4 引子）</text>
  <text x="698" y="407" font-size="10" fill="#444">组件证书 1 年 → 剩 361 天（要轮换）</text>
  <text x="698" y="425" font-size="10" fill="#444">CA 证书 10 年 → 剩 9 年（不用管）</text>

  <!-- 底部：重启信号 -->
  <rect x="22" y="458" width="956" height="76" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="482" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">⚠️ 实测信号：apiserver 重启了 6 次（etcd 0 次）</text>
  <text x="500" y="504" text-anchor="middle" font-size="11" fill="#444">Ready=true 不等于没问题 —— 重启次数是控制面稳定性的关键信号，生产上应查日志定位</text>
  <text x="500" y="524" text-anchor="middle" font-size="11" fill="#444">etcd 是有状态组件，0 次重启符合预期；apiserver 无状态但频繁重启需追查</text>

  <!-- 底部：一句话 -->
  <rect x="22" y="548" width="956" height="64" rx="9" fill="#1a2b3c"/>
  <text x="500" y="574" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">写进 hostPath、验得出文件、备得好工具（etcdutl）</text>
  <text x="500" y="597" text-anchor="middle" font-size="12" fill="#cbd5e1">这三件事缺一件，真出事时就救不回来</text>

  <!-- 边界声明 -->
  <rect x="22" y="628" width="956" height="108" rx="9" fill="#fff" stroke="#94a3b8" stroke-dasharray="5,4"/>
  <text x="42" y="652" font-size="12" font-weight="bold" fill="#475569">⚠️ 本课边界（诚实声明）</text>
  <text x="42" y="672" font-size="11" fill="#475569">✅ 已实测：health / status / alarm / 备份真跑（三条路径）/ WAL 与 snap 大小 / 配额 / 工具可用性 / 控制面连接 / 重启次数 / 证书有效期</text>
  <text x="42" y="691" font-size="11" fill="#475569">⚠️ 未执行：restore 恢复（需停机中断集群）、defrag / compact（写操作会阻塞请求）、改静态清单（改环境需你点头）</text>
  <text x="42" y="710" font-size="11" fill="#475569">⚠️ 无法真验：leader 选举故障切换（单机 etcd 无 raft 多副本）；碎片率与 IN USE 为动态值（两次采样 69.9% → 73%）</text>
  <text x="42" y="728" font-size="11" fill="#475569">🧹 卫生：探测用快照已从 /var/lib/etcd 清理（实测 ls 仅剩 member）</text>
</svg>
