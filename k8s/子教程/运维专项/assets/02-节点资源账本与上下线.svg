<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1000" height="720" fill="#fbfcfd"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a2b3c">课 2：节点运维与容量 —— 节点资源是分层的，不是全都给 Pod 的</text>

  <!-- 左：资源账本三层 -->
  <rect x="24" y="58" width="300" height="330" rx="9" fill="#e8f4ff" stroke="#2d7dd2" stroke-width="2"/>
  <text x="174" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#14497a">① 资源账本（3 层）</text>
  <text x="174" y="103" text-anchor="middle" font-size="11" fill="#4a6a8a">✅ 本机 kind 实测</text>

  <rect x="40" y="115" width="268" height="62" rx="6" fill="#fff" stroke="#90b8dd"/>
  <text x="52" y="134" font-size="13" font-weight="bold" fill="#1a2b3c">Capacity（总产证）</text>
  <text x="52" y="152" font-size="11" fill="#444">硬件总量：cpu 20 / mem 32582808Ki</text>
  <text x="52" y="168" font-size="10" fill="#2d7dd2">公寓总建筑面积（含公摊）</text>

  <rect x="40" y="185" width="268" height="62" rx="6" fill="#fff" stroke="#90b8dd"/>
  <text x="52" y="204" font-size="13" font-weight="bold" fill="#1a2b3c">Allocatable（可出租）</text>
  <text x="52" y="222" font-size="11" fill="#444">= Capacity − 预留 − 驱逐阈值</text>
  <text x="52" y="238" font-size="10" fill="#2d7dd2">⚠️ 本机实测：20 = 20 → 零预留</text>

  <rect x="40" y="255" width="268" height="62" rx="6" fill="#fff" stroke="#90b8dd"/>
  <text x="52" y="274" font-size="13" font-weight="bold" fill="#1a2b3c">Allocated（已签租约）</text>
  <text x="52" y="292" font-size="11" fill="#444">所有 Pod 的 requests 之和</text>
  <text x="52" y="308" font-size="10" fill="#c2410c">调度只看租约，不看实际用量</text>

  <rect x="40" y="325" width="268" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="174" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">装箱率 = Allocated ÷ Allocatable</text>
  <text x="174" y="365" text-anchor="middle" font-size="10" fill="#444">控制面实测：cpu 750m (3%) / mem 190Mi</text>

  <!-- 中：预留与阈值 -->
  <rect x="342" y="58" width="316" height="330" rx="9" fill="#fff7e6" stroke="#e8a33d" stroke-width="2"/>
  <text x="500" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">② 预留与驱逐阈值</text>
  <text x="500" y="103" text-anchor="middle" font-size="11" fill="#8a6d3b">✅ 读值实测 / ⚠️ 改配置不执行</text>

  <text x="358" y="128" font-size="12" font-weight="bold" fill="#1a2b3c">预留 = 消防通道</text>
  <text x="358" y="148" font-size="11" fill="#444">kube-reserved：给 k8s 组件（kubelet/containerd）</text>
  <text x="358" y="166" font-size="11" fill="#444">system-reserved：给 OS 进程（sshd/journald）</text>
  <text x="358" y="186" font-size="11" fill="#dc2626">❌ 本机实测：grep -c = 0（两项均无配置）</text>

  <line x1="358" y1="200" x2="640" y2="200" stroke="#e8a33d" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="358" y="222" font-size="12" font-weight="bold" fill="#1a2b3c">阈值 = 火警报警器</text>
  <text x="358" y="242" font-size="11" fill="#444">nodefs.available</text><text x="640" y="242" text-anchor="end" font-size="11" fill="#dc2626">0%</text>
  <text x="358" y="262" font-size="11" fill="#444">imagefs.available</text><text x="640" y="262" text-anchor="end" font-size="11" fill="#dc2626">0%</text>
  <text x="358" y="282" font-size="11" fill="#444">nodefs.inodesFree</text><text x="640" y="282" text-anchor="end" font-size="11" fill="#dc2626">0%</text>

  <rect x="358" y="296" width="282" height="46" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="370" y="314" font-size="11" font-weight="bold" fill="#991b1b">0% = 烧到 100% 才响 = 等于没装</text>
  <text x="370" y="332" font-size="10" fill="#444">届时 kubelet 已无法写日志/建容器</text>

  <rect x="358" y="348" width="282" height="32" rx="6" fill="#fff" stroke="#86c9a0"/>
  <text x="370" y="368" font-size="10" fill="#444">💡 inode 比容量更容易先耗尽（小文件）</text>

  <!-- 右：上下线流程 -->
  <rect x="676" y="58" width="300" height="330" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="826" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">③ 节点上下线（3 步）</text>
  <text x="826" y="103" text-anchor="middle" font-size="11" fill="#3f6212">✅ cordon/uncordon 已实测</text>

  <rect x="692" y="115" width="268" height="46" rx="6" fill="#fff" stroke="#86c9a0"/>
  <text x="704" y="133" font-size="12" font-weight="bold" fill="#14532d">1. cordon（停业）</text>
  <text x="704" y="152" font-size="10" fill="#444">状态：Ready,SchedulingDisabled ✅</text>

  <rect x="692" y="169" width="268" height="46" rx="6" fill="#fff" stroke="#86c9a0"/>
  <text x="704" y="187" font-size="12" font-weight="bold" fill="#14532d">2. drain（清场）</text>
  <text x="704" y="206" font-size="10" fill="#444">驱逐存量 Pod ⚠️ 本课未执行</text>

  <rect x="692" y="223" width="268" height="46" rx="6" fill="#fff" stroke="#86c9a0"/>
  <text x="704" y="241" font-size="12" font-weight="bold" fill="#14532d">3. uncordon（复业）</text>
  <text x="704" y="260" font-size="10" fill="#444">node/... uncordoned ✅</text>

  <rect x="692" y="277" width="268" height="105" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="704" y="296" font-size="12" font-weight="bold" fill="#991b1b">drain 三个卡点</text>
  <text x="704" y="315" font-size="10" fill="#444">① DaemonSet → --ignore-daemonsets</text>
  <text x="704" y="332" font-size="10" fill="#444">② emptyDir → --delete-emptydir-data（丢数据）</text>
  <text x="704" y="349" font-size="10" fill="#444">③ PDB 限制 → 查 pdb -A（实测允许 1）</text>
  <text x="704" y="370" font-size="10" fill="#991b1b">卡住就 Ctrl+C 关机 = 事故开始</text>

  <!-- 底部：容量错算警告 -->
  <rect x="24" y="404" width="952" height="80" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">⚠️ kind 环境的容量陷阱（必须知道）</text>
  <text x="500" y="454" text-anchor="middle" font-size="12" fill="#444">实测三节点「各 20 核」= 宿主 WSL 的 20 核，三节点共享同一份</text>
  <text x="500" y="474" text-anchor="middle" font-size="12" fill="#444">不是 60 核！生产环境才是每个节点算自己的真实硬件</text>

  <!-- 底部：一句话 -->
  <rect x="24" y="500" width="952" height="66" rx="9" fill="#1a2b3c"/>
  <text x="500" y="528" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">预留是消防通道，阈值是火警报警器</text>
  <text x="500" y="552" text-anchor="middle" font-size="12" fill="#cbd5e1">不预留 = 系统组件与业务抢同一份资源；阈值 0% = 把报警器拆了</text>

  <!-- 边界声明 -->
  <rect x="24" y="584" width="952" height="94" rx="9" fill="#fff" stroke="#94a3b8" stroke-dasharray="5,4"/>
  <text x="44" y="608" font-size="12" font-weight="bold" fill="#475569">⚠️ 本课边界（诚实声明）</text>
  <text x="44" y="628" font-size="11" fill="#475569">✅ 已实测：资源账本、装箱率、预留现状、驱逐阈值取值、磁盘分区、PDB、cordon/uncordon（可逆）</text>
  <text x="44" y="647" font-size="11" fill="#475569">⚠️ 未执行：drain（会真实驱逐 8 个 Pod，需你确认）；改 kubelet 配置 / 重启 kubelet（改环境，按规矩需你点头）</text>
  <text x="44" y="666" font-size="11" fill="#475569">⚠️ 无法真验：真实磁盘打满触发驱逐（容器共享宿主分区，实测 24%）；预留修改后的重启生效</text>
</svg>
