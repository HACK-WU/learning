<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1000" height="700" fill="#fbfcfd"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a2b3c">课 1：集群交付 —— 从「集群起来了」到「集群可交付」</text>

  <!-- 左：kubeadm 交付四类 -->
  <rect x="24" y="58" width="300" height="336" rx="9" fill="#e8f4ff" stroke="#2d7dd2" stroke-width="2"/>
  <text x="174" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#14497a">kubeadm 交付（4 类）</text>
  <text x="174" y="104" text-anchor="middle" font-size="12" fill="#4a6a8a">✅ 本机 kind 实测</text>

  <rect x="40" y="118" width="268" height="58" rx="6" fill="#fff" stroke="#90b8dd"/>
  <text x="52" y="138" font-size="13" font-weight="bold" fill="#1a2b3c">① 静态 Pod 清单</text>
  <text x="52" y="156" font-size="11" fill="#444">manifests/ 4 个文件齐全</text>
  <text x="52" y="170" font-size="10" fill="#2d7dd2">验收：文件在 + Pod Running + 看 RESTARTS</text>

  <rect x="40" y="184" width="268" height="58" rx="6" fill="#fff" stroke="#90b8dd"/>
  <text x="52" y="204" font-size="13" font-weight="bold" fill="#1a2b3c">② PKI 证书体系</text>
  <text x="52" y="222" font-size="11" fill="#444">16 项 · CA 10 年 / 组件 1 年</text>
  <text x="52" y="236" font-size="10" fill="#c2410c">必做：把到期日写进运维日历</text>

  <rect x="40" y="250" width="268" height="50" rx="6" fill="#fff" stroke="#90b8dd"/>
  <text x="52" y="268" font-size="13" font-weight="bold" fill="#1a2b3c">③ kubeconfig</text>
  <text x="52" y="288" font-size="11" fill="#444">admin / kubelet / cm / scheduler.conf</text>

  <rect x="40" y="308" width="268" height="50" rx="6" fill="#fff" stroke="#90b8dd"/>
  <text x="52" y="326" font-size="13" font-weight="bold" fill="#1a2b3c">④ join 凭据</text>
  <text x="52" y="346" font-size="11" fill="#444">kubeadm token create --print-join-command</text>

  <text x="174" y="380" text-anchor="middle" font-size="11" font-style="italic" fill="#14497a">Ready 只是「入场券」，不是合格证</text>

  <!-- 中：生产交付清单八项 -->
  <rect x="342" y="58" width="316" height="336" rx="9" fill="#fff7e6" stroke="#e8a33d" stroke-width="2"/>
  <text x="500" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">生产交付清单（8 项）</text>
  <text x="500" y="104" text-anchor="middle" font-size="12" fill="#8a6d3b">本机 kind 实测打勾</text>

  <text x="358" y="128" font-size="12" fill="#1a2b3c">1. CNI 网络</text><text x="640" y="128" text-anchor="end" font-size="12" fill="#15803d">✅ Calico v3.31</text>
  <text x="358" y="152" font-size="12" fill="#1a2b3c">2. 存储 CSI</text><text x="640" y="152" text-anchor="end" font-size="12" fill="#b45309">⚠️ local-path（不支持扩容）</text>
  <text x="358" y="176" font-size="12" fill="#1a2b3c">3. 入口 Ingress</text><text x="640" y="176" text-anchor="end" font-size="12" fill="#b45309">⚠️ nginx（已 EOL）</text>
  <text x="358" y="200" font-size="12" fill="#1a2b3c">4. 监控告警</text><text x="640" y="200" text-anchor="end" font-size="12" fill="#dc2626">❌ 仅 metrics-server</text>
  <text x="358" y="224" font-size="12" fill="#1a2b3c">5. 备份</text><text x="640" y="224" text-anchor="end" font-size="12" fill="#dc2626">❌ 无快照无演练</text>
  <text x="358" y="248" font-size="12" fill="#1a2b3c">6. HA / 灾备</text><text x="640" y="248" text-anchor="end" font-size="12" fill="#dc2626">❌ 单控制面</text>
  <text x="358" y="272" font-size="12" fill="#1a2b3c">7. 驱逐阈值</text><text x="640" y="272" text-anchor="end" font-size="12" fill="#dc2626">❌ evictionHard = 0%</text>
  <text x="358" y="296" font-size="12" fill="#1a2b3c">8. 证书轮换</text><text x="640" y="296" text-anchor="end" font-size="12" fill="#dc2626">❌ 未纳入流程</text>

  <line x1="358" y1="310" x2="640" y2="310" stroke="#e8a33d" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="500" y="332" text-anchor="middle" font-size="11" fill="#8a5a00">「装了」≠ 交付：看判断标准与验收证据</text>
  <text x="500" y="352" text-anchor="middle" font-size="11" fill="#8a5a00">打不满的项 = 上任后第一批要补的债</text>
  <text x="500" y="376" text-anchor="middle" font-size="11" font-style="italic" fill="#8a5a00">→ 课 2 驱逐 / 课 3 备份 / 课 4 证书 / 课 5 监控</text>

  <!-- 右：环境一致性 -->
  <rect x="676" y="58" width="300" height="336" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="826" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">环境一致性（5 项）</text>
  <text x="826" y="104" text-anchor="middle" font-size="12" fill="#3f6212">⚠️ 容器里并非全部可信</text>

  <text x="692" y="130" font-size="12" fill="#1a2b3c">容器运行时</text><text x="960" y="130" text-anchor="end" font-size="12" fill="#15803d">✅ 2.1.3 一致</text>
  <text x="692" y="154" font-size="12" fill="#1a2b3c">内核参数</text><text x="960" y="154" text-anchor="end" font-size="12" fill="#b45309">⚠️ 读到宿主内核</text>
  <text x="692" y="178" font-size="12" fill="#1a2b3c">时间同步</text><text x="960" y="178" text-anchor="end" font-size="12" fill="#b45309">⚠️ 共享宿主时钟</text>
  <text x="692" y="202" font-size="12" fill="#1a2b3c">swap</text><text x="960" y="202" text-anchor="end" font-size="12" fill="#dc2626">❌ 查不准（宿主值）</text>
  <text x="692" y="226" font-size="12" fill="#1a2b3c">镜像预拉取</text><text x="960" y="226" text-anchor="end" font-size="12" fill="#15803d">✅ 能读</text>

  <rect x="692" y="244" width="268" height="60" rx="6" fill="#fff" stroke="#86c9a0"/>
  <text x="704" y="264" font-size="12" font-weight="bold" fill="#14532d">为什么 swap 查不准？</text>
  <text x="704" y="282" font-size="10" fill="#444">kind 节点是容器，/proc 未完全</text>
  <text x="704" y="296" font-size="10" fill="#444">命名空间化 → 读到宿主 WSL 的 swap</text>

  <rect x="692" y="312" width="268" height="66" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="704" y="332" font-size="12" font-weight="bold" fill="#991b1b">生产必须上真实主机验：</text>
  <text x="704" y="350" font-size="10" fill="#444">free -m / lsmod / lsblk / systemctl</text>
  <text x="704" y="368" font-size="10" fill="#991b1b">容器通过 ≠ 生产可用</text>

  <!-- 底部：验收三件事 -->
  <rect x="24" y="412" width="952" height="86" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="438" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b21b6">交付验收三件事（缺一不可）</text>
  <text x="200" y="466" text-anchor="middle" font-size="13" fill="#1a2b3c">① 文件 / 资源在不在</text>
  <text x="500" y="466" text-anchor="middle" font-size="13" fill="#1a2b3c">② 组件 Running（看 RESTARTS 并追问）</text>
  <text x="800" y="466" text-anchor="middle" font-size="13" fill="#1a2b3c">③ 到期日 / 阈值已记录（看值不看键名）</text>
  <text x="500" y="488" text-anchor="middle" font-size="11" font-style="italic" fill="#5b21b6">只看 kubectl get nodes Ready → 不算验收</text>

  <!-- 底部：一句话 -->
  <rect x="24" y="516" width="952" height="66" rx="9" fill="#1a2b3c"/>
  <text x="500" y="544" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">交付是状态，不是动作</text>
  <text x="500" y="568" text-anchor="middle" font-size="12" fill="#cbd5e1">八项清单逐条打勾 + 环境一致性在真实主机上验收通过 = 可交付</text>

  <!-- 边界声明 -->
  <rect x="24" y="600" width="952" height="76" rx="9" fill="#fff" stroke="#94a3b8" stroke-dasharray="5,4"/>
  <text x="44" y="624" font-size="12" font-weight="bold" fill="#475569">⚠️ 本课边界（诚实声明）</text>
  <text x="44" y="644" font-size="11" fill="#475569">✅ 已实测：交付物清点、组件状态、CNI/PodCIDR/StorageClass/IngressClass、驱逐阈值取值、内核参数、运行时版本（kind 集群内可读项）</text>
  <text x="44" y="662" font-size="11" fill="#475569">⚠️ 无法真验：swap 关闭、内核模块、磁盘布局、多机网络、HA 搭建 —— kind 节点是容器，/proc 未完全命名空间化；生产须在真实主机验收</text>
</svg>
