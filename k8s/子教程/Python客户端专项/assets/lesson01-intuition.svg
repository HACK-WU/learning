<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">用程序代替手动敲命令：先接上，再说话</text>

  <!-- 左：手动方式 -->
  <rect x="40" y="70" width="300" height="200" rx="10" fill="#fdecea" stroke="#d9534f" stroke-width="2"/>
  <text x="190" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#a94442">以前：人敲命令</text>
  <rect x="70" y="120" width="240" height="40" rx="6" fill="#ffffff" stroke="#d9534f"/>
  <text x="190" y="145" text-anchor="middle" font-size="13" fill="#333333">人 在 终端 敲 一行 命令</text>
  <text x="190" y="192" text-anchor="middle" font-size="13" fill="#555555">每次 都要 人 来 敲</text>
  <text x="190" y="214" text-anchor="middle" font-size="13" fill="#555555">想 让 它 自动 跑，就 没 办法</text>
  <rect x="70" y="232" width="240" height="26" rx="5" fill="#f5c6cb"/>
  <text x="190" y="250" text-anchor="middle" font-size="12" fill="#721c24">人 一 走，事 就 停</text>

  <!-- 箭头 -->
  <path d="M 355 170 L 405 170" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666666"/>
    </marker>
  </defs>

  <!-- 右：代码方式 -->
  <rect x="420" y="60" width="440" height="290" rx="10" fill="#e8f4fd" stroke="#2b7bc4" stroke-width="2"/>
  <text x="640" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c5a8a">现在：写一段程序，让它自己去说</text>

  <!-- 第1步 -->
  <rect x="445" y="105" width="180" height="56" rx="6" fill="#ffffff" stroke="#2b7bc4"/>
  <text x="535" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c5a8a">第 1 步 · 接上</text>
  <text x="535" y="147" text-anchor="middle" font-size="12" fill="#333333">告诉 程序 集群 在 哪、</text>
  <text x="535" y="162" text-anchor="middle" font-size="12" fill="#333333">拿 什么 身份 去 敲门</text>

  <!-- 第2步 -->
  <rect x="655" y="105" width="180" height="56" rx="6" fill="#ffffff" stroke="#2b7bc4"/>
  <text x="745" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c5a8a">第 2 步 · 说话</text>
  <text x="745" y="147" text-anchor="middle" font-size="12" fill="#333333">用 一个 对象 代 你</text>
  <text x="745" y="162" text-anchor="middle" font-size="12" fill="#333333">对 集群 发 请求</text>

  <path d="M 535 165 L 535 190 L 745 190 L 745 168" stroke="#2b7bc4" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b7bc4"/>
    </marker>
  </defs>

  <!-- 三层 -->
  <rect x="445" y="205" width="390" height="42" rx="6" fill="#ffffff" stroke="#888888" stroke-dasharray="4 3"/>
  <text x="640" y="222" text-anchor="middle" font-size="12" fill="#555555">程序 里 要 备 好 三 样 东西（本课 就 讲 这 三 样）</text>
  <text x="640" y="239" text-anchor="middle" font-size="12" fill="#555555">地址 与 身份 → 发 请求 的 人 → 具体 要 做 的 事</text>

  <rect x="445" y="262" width="390" height="26" rx="5" fill="#d4edda"/>
  <text x="640" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#155724">程序 跑 起来 后，人不 在 也 会 一直 做</text>

  <!-- 底部：版本匹配 -->
  <rect x="40" y="300" width="300" height="60" rx="8" fill="#fff8e1" stroke="#e0a800" stroke-width="2"/>
  <text x="190" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6100">前提：版本 要 对 上</text>
  <text x="190" y="342" text-anchor="middle" font-size="12" fill="#555555">程序 和 集群 版本 对 不 上，</text>
  <text x="190" y="358" text-anchor="middle" font-size="12" fill="#555555">有些 功能 就 会 用 不了</text>

  <text x="450" y="385" text-anchor="middle" font-size="12" fill="#777777">图：本课 只 解决 最 前面 一步 —— 让 程序 先 接 上 集群、说 出 第 一 句 话</text>
</svg>
