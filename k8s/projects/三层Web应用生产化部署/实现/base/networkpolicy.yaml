# 阶段 3 / 课 10：默认全通是隐患 —— 先全拒，再逐条放行
# ⚠️ 实测结论（2026-09-14，kindnet v20250512）：
#   1. DNS 放行必须用 namespaceSelector + podSelector 组合，不能用 ipBlock 指向
#      kube-dns 的 ClusterIP —— 后者实测无效（解析仍 Temporary failure）。
#      根因：DNS 请求经 Service 转发，实际目的 Pod IP 不是 ClusterIP。
#   2. 放行规则里 ports 只写业务端口不影响 DNS（DNS 规则独立叠加生效）。
#   3. 别给 netpol 注入额外 commonLabels —— podSelector 会因标签不匹配而失效。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: shop3t
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 放行 1：Gateway（Envoy）→ web
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-web
  namespace: shop3t
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8080
---
# 放行 2：web → api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-api
  namespace: shop3t
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 8000
---
# 放行 3：api → db
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-db
  namespace: shop3t
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 5432
---
# 放行 4（最易漏）：所有 Pod 出网做 DNS
# 实测：namespaceSelector + podSelector 组合有效；ipBlock 到 ClusterIP 无效
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: shop3t
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 放行 5：业务内部东西向出网（web→api、api→db）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-egress
  namespace: shop3t
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 8080
