apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop3t
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop3t
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      annotations:
        checksum/config: "PLACEHOLDER"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: python:3.12-slim
          command: ["python", "-c"]
          args:
            - |
              import os, json, urllib.request, http.server, socketserver, time

              PORT = 8080
              UPSTREAM = os.environ.get("API_UPSTREAM", "")

              class H(http.server.BaseHTTPRequestHandler):
                  def _send(self, code, body):
                      data = json.dumps(body).encode()
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(data)))
                      self.end_headers()
                      self.wfile.write(data)

                  def do_GET(self):
                      if self.path == "/healthz":
                          self._send(200, {"status": "ok", "layer": "web"})
                      elif self.path == "/":
                          # 真实调用 API 层，三层串联
                          try:
                              with urllib.request.urlopen(UPSTREAM + "/api/info", timeout=3) as r:
                                  info = json.loads(r.read().decode())
                              self._send(200, {"layer": "web", "upstream": info})
                          except Exception as e:
                              self._send(502, {"layer": "web", "error": str(e)})
                      elif self.path.startswith("/burn"):
                          # HPA 压测端点：烧 CPU
                          seconds = int(self.path.split("=")[-1]) if "=" in self.path else 30
                          end = time.time() + seconds
                          x = 0
                          while time.time() < end:
                              x += 1
                          self._send(200, {"burned_seconds": seconds, "iterations": x})
                      else:
                          self._send(404, {"error": "not found"})

                  def log_message(self, fmt, *a):
                      print("[web] %s" % (fmt % a), flush=True)

              socketserver.TCPServer.allow_reuse_address = True
              with socketserver.TCPServer(("0.0.0.0", PORT), H) as httpd:
                  print("[web] listening on %d" % PORT, flush=True)
                  httpd.serve_forever()
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: API_UPSTREAM
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
          resources:
            # 阶段 4 / 课 13：必须写 requests，HPA 按 requests 百分比算
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      terminationGracePeriodSeconds: 30
---
# 阶段 4 / 课 13：HPA 按 CPU 利用率扩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: shop3t
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0        # 扩容要快
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60       # 缩容要慢（生产默认 300，演示改 60）
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
---
# 阶段 6 / 课 19：PDB 只管自愿驱逐，挡不住 delete
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: shop3t
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: shop3t
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
