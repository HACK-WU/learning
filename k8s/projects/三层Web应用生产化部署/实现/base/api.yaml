apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop3t
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop3t
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # 配合 PDB：更新期间一个都不许少
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        # 阶段 4 / 课 11：配置变了不会自动滚动，靠 checksum 注解触发
        checksum/config: "PLACEHOLDER"
    spec:
      serviceAccountName: shop-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: python:3.12-slim
          # 用内联脚本起一个真实 HTTP 服务，避免额外构建镜像
          command: ["python", "-c"]
          args:
            - |
              import os, json, http.server, socketserver

              PORT = int(os.environ.get("API_PORT", "8000"))
              LOG_LEVEL = os.environ.get("LOG_LEVEL", "info")
              DB_HOST = os.environ.get("DB_HOST", "")
              DB_USER = os.environ.get("DB_USER", "")
              DB_PASSWORD = os.environ.get("DB_PASSWORD", "")

              class H(http.server.BaseHTTPRequestHandler):
                  def _send(self, code, body):
                      data = json.dumps(body).encode()
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(data)))
                      self.end_headers()
                      self.wfile.write(data)

                  def do_GET(self):
                      if self.path == "/healthz":
                          self._send(200, {"status": "ok"})
                      elif self.path == "/readyz":
                          # 真实就绪判断：连一下数据库
                          import socket
                          try:
                              host, port = DB_HOST, int(os.environ.get("DB_PORT", "5432"))
                              s = socket.create_connection((host, port), timeout=2)
                              s.close()
                              self._send(200, {"status": "ready", "db": "reachable"})
                          except Exception as e:
                              self._send(503, {"status": "not ready", "error": str(e)})
                      elif self.path == "/api/info":
                          self._send(200, {
                              "service": "api",
                              "log_level": LOG_LEVEL,
                              "db_host": DB_HOST,
                              "db_user": DB_USER,
                              "has_password": bool(DB_PASSWORD),
                          })
                      else:
                          self._send(404, {"error": "not found", "path": self.path})

                  def log_message(self, fmt, *a):
                      if LOG_LEVEL != "silent":
                          print("[api] %s" % (fmt % a), flush=True)

              socketserver.TCPServer.allow_reuse_address = True
              with socketserver.TCPServer(("0.0.0.0", PORT), H) as httpd:
                  print("[api] listening on %d" % PORT, flush=True)
                  httpd.serve_forever()
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: API_PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: LOG_LEVEL
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shop-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-secret
                  key: DB_PASSWORD
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # 阶段 1 / 课 4：先睡一会，让 EndpointSlice 传播完成，避免 502
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 30
