# 阶段 5 / 课 15：应用专属 SA，最小权限
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-sa
  namespace: shop3t
automountServiceAccountToken: false
---
# 只读自己命名空间下的 ConfigMap/Secret（演示最小权限，不给写）
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-reader
  namespace: shop3t
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-reader-binding
  namespace: shop3t
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shop-reader
subjects:
  - kind: ServiceAccount
    name: shop-sa
    namespace: shop3t
