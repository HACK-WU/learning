<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">阶段 1 · 语言地基：写出第一行，看懂每一行</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#666666">课 1 → 课 2 → 课 3（9 个知识点，从左到右递进）</text>

  <!-- ============ 课 1 ============ -->
  <g>
    <rect x="24" y="80" width="264" height="46" rx="8" fill="#1565C0"/>
    <text x="156" y="109" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">课 1 · 环境跑起来</text>

    <!-- 课 1 知识点卡 -->
    <rect x="24" y="140" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="44" cy="160" r="9" fill="#1565C0"/>
    <text x="44" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="62" y="164" font-size="13" font-weight="700" fill="#1a1a1a">起源与设计取舍</text>
    <text x="62" y="185" font-size="11" fill="#333333">2007 起稿 · 三个目标 · 少即是多</text>
    <text x="62" y="201" font-size="11" fill="#333333">无三元 / 无断言 / 无类型继承</text>

    <rect x="24" y="234" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="44" cy="254" r="9" fill="#1565C0"/>
    <text x="44" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="62" y="258" font-size="13" font-weight="700" fill="#1a1a1a">工具链与工作区</text>
    <text x="62" y="279" font-size="11" fill="#333333">run / build / mod init 三件套</text>
    <text x="62" y="295" font-size="11" fill="#333333">GOROOT · GOPATH · 模块缓存</text>

    <rect x="24" y="328" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="44" cy="348" r="9" fill="#1565C0"/>
    <text x="44" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="62" y="352" font-size="13" font-weight="700" fill="#1a1a1a">编译模型：一个二进制</text>
    <text x="62" y="373" font-size="11" fill="#333333">AOT · 有 runtime 非虚拟机</text>
    <text x="62" y="389" font-size="11" fill="#333333">-ldflags 瘦身 · GOOS 交叉编译</text>
  </g>

  <!-- 课 1 → 课 2 箭头 -->
  <line x1="292" y1="290" x2="318" y2="290" stroke="#1565C0" stroke-width="2"/>
  <polygon points="318,290 310,286 310,294" fill="#1565C0"/>

  <!-- ============ 课 2 ============ -->
  <g>
    <rect x="318" y="80" width="264" height="46" rx="8" fill="#1565C0"/>
    <text x="450" y="109" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">课 2 · 变量类型与控制流</text>

    <rect x="318" y="140" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="338" cy="160" r="9" fill="#1565C0"/>
    <text x="338" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="356" y="164" font-size="13" font-weight="700" fill="#1a1a1a">变量声明与零值</text>
    <text x="356" y="185" font-size="11" fill="#333333">var / := / const / iota</text>
    <text x="356" y="201" font-size="11" fill="#333333">零值是合法默认值，非未初始化</text>

    <rect x="318" y="234" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="338" cy="254" r="9" fill="#1565C0"/>
    <text x="338" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="356" y="258" font-size="13" font-weight="700" fill="#1a1a1a">基础类型与显式转换</text>
    <text x="356" y="279" font-size="11" fill="#333333">整型宽度 · string/byte/rune</text>
    <text x="356" y="295" font-size="11" fill="#333333">无隐式数值转换，必须 T(v)</text>

    <rect x="318" y="328" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="338" cy="348" r="9" fill="#1565C0"/>
    <text x="338" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="356" y="352" font-size="13" font-weight="700" fill="#1a1a1a">控制流：只有 for</text>
    <text x="356" y="373" font-size="11" fill="#333333">if init · for 三形态 · 无 while</text>
    <text x="356" y="389" font-size="11" fill="#333333">switch 自带 break · range 用 _</text>
  </g>

  <!-- 课 2 → 课 3 箭头 -->
  <line x1="586" y1="290" x2="612" y2="290" stroke="#1565C0" stroke-width="2"/>
  <polygon points="612,290 604,286 604,294" fill="#1565C0"/>

  <!-- ============ 课 3 ============ -->
  <g>
    <rect x="612" y="80" width="264" height="46" rx="8" fill="#1565C0"/>
    <text x="744" y="109" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">课 3 · 数组切片与 map</text>

    <rect x="612" y="140" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="632" cy="160" r="9" fill="#1565C0"/>
    <text x="632" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="650" y="164" font-size="13" font-weight="700" fill="#1a1a1a">数组与切片</text>
    <text x="650" y="185" font-size="11" fill="#333333">值类型 vs 描述符（ptr+len+cap）</text>
    <text x="650" y="201" font-size="11" fill="#333333">append 扩容 · 共享底层数组</text>

    <rect x="612" y="234" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="632" cy="254" r="9" fill="#1565C0"/>
    <text x="632" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="650" y="258" font-size="13" font-weight="700" fill="#1a1a1a">map</text>
    <text x="650" y="279" font-size="11" fill="#333333">comma-ok · 遍历无序</text>
    <text x="650" y="295" font-size="11" fill="#333333">并发写不安全 · 元素不可取地址</text>

    <rect x="612" y="328" width="264" height="86" rx="6" fill="#fafafa" stroke="#d0d7de"/>
    <circle cx="632" cy="348" r="9" fill="#1565C0"/>
    <text x="632" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="650" y="352" font-size="13" font-weight="700" fill="#1a1a1a">字符串与 UTF-8</text>
    <text x="650" y="373" font-size="11" fill="#333333">只读字节序列 · len 是字节数</text>
    <text x="650" y="389" font-size="11" fill="#333333">for range 按 rune · strings/strconv</text>
  </g>

  <!-- 底部递进说明 -->
  <rect x="24" y="434" width="852" height="34" rx="6" fill="#fafafa" stroke="#d0d7de"/>
  <text x="450" y="456" text-anchor="middle" font-size="12" fill="#333333">前置：课 2 需会课 1 的环境与基础语法；课 3 的切片/map 建在课 2 的类型之上</text>
</svg>
