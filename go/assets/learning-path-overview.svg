<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Go 语言系统学习 · 五阶段路径（15 课 / 45 知识点）</text>

  <!-- 故事主线带 -->
  <rect x="24" y="52" width="952" height="54" rx="8" fill="#fafafa" stroke="#d0d7de"/>
  <text x="40" y="72" font-size="12" font-weight="700" fill="#1565C0">故事主线</text>
  <text x="40" y="94" font-size="13" fill="#333333">主角：小谷（写 Python 的后端，被安排用 Go 重写一个一压测就崩的下单接口）</text>
  <text x="452" y="72" font-size="12" font-weight="700" fill="#c62828">冲突</text>
  <text x="452" y="94" font-size="13" fill="#333333">语法三天翻完，服务却数据错乱 / 内存暴涨 / 查不到问题</text>
  <text x="700" y="72" font-size="12" font-weight="700" fill="#2e7d32">收束</text>
  <text x="700" y="94" font-size="13" fill="#333333">能交付 + 说清该不该用 Go</text>

  <!-- 阶段 1 -->
  <g>
    <rect x="24" y="124" width="180" height="290" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="24" y="124" width="180" height="34" rx="8" fill="#1565C0"/>
    <rect x="24" y="150" width="180" height="8" fill="#1565C0"/>
    <text x="114" y="147" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">阶段 1 · 语言地基</text>
    <text x="114" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">写出第一行</text>
    <text x="114" y="208" text-anchor="middle" font-size="12" fill="#1565C0">看懂每一行</text>
    <line x1="40" y1="222" x2="188" y2="222" stroke="#e0e0e0" stroke-width="1"/>
    <text x="114" y="246" text-anchor="middle" font-size="13" fill="#333333">语法与工具链</text>
    <text x="114" y="272" text-anchor="middle" font-size="13" fill="#333333">切片 · map · 字符串</text>
    <text x="114" y="298" text-anchor="middle" font-size="13" fill="#333333">零值与显式转换</text>
    <rect x="60" y="318" width="108" height="26" rx="13" fill="#e3f2fd" stroke="#1565C0"/>
    <text x="114" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#1565C0">课 1 – 3 · 9 知识点</text>
    <text x="114" y="366" text-anchor="middle" font-size="11" fill="#666666">感知层 → 概念层</text>
  </g>

  <!-- 阶段 2 -->
  <g>
    <rect x="219" y="124" width="180" height="290" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="219" y="124" width="180" height="34" rx="8" fill="#1565C0"/>
    <rect x="219" y="150" width="180" height="8" fill="#1565C0"/>
    <text x="309" y="147" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">阶段 2 · 组合与抽象</text>
    <text x="309" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">没有 class</text>
    <text x="309" y="208" text-anchor="middle" font-size="12" fill="#1565C0">怎么组织代码</text>
    <line x1="235" y1="222" x2="383" y2="222" stroke="#e0e0e0" stroke-width="1"/>
    <text x="309" y="246" text-anchor="middle" font-size="13" fill="#333333">错误是值 · defer</text>
    <text x="309" y="272" text-anchor="middle" font-size="13" fill="#333333">struct 与组合</text>
    <text x="309" y="298" text-anchor="middle" font-size="13" fill="#333333">接口与泛型</text>
    <rect x="255" y="318" width="108" height="26" rx="13" fill="#e3f2fd" stroke="#1565C0"/>
    <text x="309" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#1565C0">课 4 – 6 · 9 知识点</text>
    <text x="309" y="366" text-anchor="middle" font-size="11" fill="#666666">概念层 → 抽象层</text>
  </g>

  <!-- 阶段 3 -->
  <g>
    <rect x="414" y="124" width="180" height="290" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="414" y="124" width="180" height="34" rx="8" fill="#c62828"/>
    <rect x="414" y="150" width="180" height="8" fill="#c62828"/>
    <text x="504" y="147" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">阶段 3 · 并发模型</text>
    <text x="504" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">goroutine</text>
    <text x="504" y="208" text-anchor="middle" font-size="12" fill="#c62828">不是免费的</text>
    <line x1="430" y1="222" x2="578" y2="222" stroke="#e0e0e0" stroke-width="1"/>
    <text x="504" y="246" text-anchor="middle" font-size="13" fill="#333333">goroutine 与 GMP</text>
    <text x="504" y="272" text-anchor="middle" font-size="13" fill="#333333">channel 与 select</text>
    <text x="504" y="298" text-anchor="middle" font-size="13" fill="#333333">竞争 · 锁 · 泄漏</text>
    <rect x="450" y="318" width="108" height="26" rx="13" fill="#ffebee" stroke="#c62828"/>
    <text x="504" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#c62828">课 7 – 9 · 9 知识点</text>
    <text x="504" y="366" text-anchor="middle" font-size="11" fill="#666666">机制层（本课最难）</text>
  </g>

  <!-- 阶段 4 -->
  <g>
    <rect x="609" y="124" width="180" height="290" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="609" y="124" width="180" height="34" rx="8" fill="#1565C0"/>
    <rect x="609" y="150" width="180" height="8" fill="#1565C0"/>
    <text x="699" y="147" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">阶段 4 · 标准库与网络</text>
    <text x="699" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">让它对外</text>
    <text x="699" y="208" text-anchor="middle" font-size="12" fill="#1565C0">提供服务</text>
    <line x1="625" y1="222" x2="773" y2="222" stroke="#e0e0e0" stroke-width="1"/>
    <text x="699" y="246" text-anchor="middle" font-size="13" fill="#333333">io 与 context</text>
    <text x="699" y="272" text-anchor="middle" font-size="13" fill="#333333">net/http 服务端</text>
    <text x="699" y="298" text-anchor="middle" font-size="13" fill="#333333">数据库与客户端</text>
    <rect x="645" y="318" width="108" height="26" rx="13" fill="#e3f2fd" stroke="#1565C0"/>
    <text x="699" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#1565C0">课 10 – 12 · 9 知识点</text>
    <text x="699" y="366" text-anchor="middle" font-size="11" fill="#666666">实操层</text>
  </g>

  <!-- 阶段 5 -->
  <g>
    <rect x="804" y="124" width="180" height="290" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="804" y="124" width="180" height="34" rx="8" fill="#2e7d32"/>
    <rect x="804" y="150" width="180" height="8" fill="#2e7d32"/>
    <text x="894" y="147" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">阶段 5 · 工程化与落地</text>
    <text x="894" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">从能跑到</text>
    <text x="894" y="208" text-anchor="middle" font-size="12" fill="#2e7d32">能交付</text>
    <line x1="820" y1="222" x2="968" y2="222" stroke="#e0e0e0" stroke-width="1"/>
    <text x="894" y="246" text-anchor="middle" font-size="13" fill="#333333">模块 · 测试 · 规范</text>
    <text x="894" y="272" text-anchor="middle" font-size="13" fill="#333333">benchmark · pprof</text>
    <text x="894" y="298" text-anchor="middle" font-size="13" fill="#333333">构建部署与选型</text>
    <rect x="840" y="318" width="108" height="26" rx="13" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="894" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">课 13 – 15 · 9 知识点</text>
    <text x="894" y="366" text-anchor="middle" font-size="11" fill="#666666">定位层</text>
  </g>

  <!-- 依赖箭头 -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#78909c"/>
    </marker>
  </defs>
  <line x1="206" y1="270" x2="216" y2="270" stroke="#78909c" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="401" y1="270" x2="411" y2="270" stroke="#78909c" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="596" y1="270" x2="606" y2="270" stroke="#78909c" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="791" y1="270" x2="801" y2="270" stroke="#78909c" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 起点 → 终点 -->
  <rect x="24" y="440" width="960" height="52" rx="8" fill="#fafafa" stroke="#d0d7de"/>
  <text x="44" y="463" font-size="12" font-weight="700" fill="#666666">起点</text>
  <text x="44" y="481" font-size="13" fill="#333333">会写 Go 语法（阶段 1 结束）</text>
  <text x="956" y="463" text-anchor="end" font-size="12" font-weight="700" fill="#666666">终点</text>
  <text x="956" y="481" text-anchor="end" font-size="13" fill="#333333">能交付一个可观测、可回滚的服务，并说清该不该用 Go</text>
  <line x1="300" y1="466" x2="640" y2="466" stroke="#b0bec5" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="640,462 650,466 640,470" fill="#b0bec5"/>

  <!-- 脚注 -->
  <text x="24" y="518" font-size="11" fill="#888888">箭头 = 前置依赖（严格从左到右，不可跳阶段）。阶段 3「并发模型」是全课认知陡坡，它以阶段 1–2 的语法与抽象为基础。</text>
  <text x="24" y="538" font-size="11" fill="#888888">版本基线：Go 1.27.x（本机实测 go1.27.1 darwin/arm64，核查于 2026-09）。每课第四幕均在本机真实跑通并贴实测输出。</text>
  <text x="24" y="562" font-size="11" fill="#888888">场景侧重落点：语言核心与并发 → 阶段 1–3 ｜ 标准库与网络 → 阶段 4 ｜ 工程化与工具链 → 阶段 5 课 13–14 ｜ 生产落地与云原生 → 阶段 5 课 15</text>
</svg>
