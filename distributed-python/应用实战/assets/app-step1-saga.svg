<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="sR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/>
    </marker>
    <marker id="sG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1e8449"/>
    </marker>
    <marker id="sD" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <rect width="940" height="560" fill="#fbfbf9"/>

  <!-- 标题 -->
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2833">应用实战 09 · 第 1 步：下单代码里写死两个库</text>
  <text x="470" y="56" text-anchor="middle" font-size="12" fill="#7f8c8d">先把"建订单"和"扣库存"写成两个直接连库的函数，用 with 包着 —— 这是最快上线的一版</text>

  <!-- 代码卡 -->
  <rect x="26" y="72" width="420" height="270" rx="10" fill="#fdf8f3" stroke="#e0b284" stroke-width="1.5"/>
  <text x="44" y="98" font-size="13" font-weight="700" fill="#a04000">order_service.py（第一版）</text>
  <line x1="44" y1="108" x2="430" y2="108" stroke="#e6cba6"/>
  <text x="44" y="132" font-size="12" fill="#2c3e50" font-family="monospace">with sqlite3.connect(ORDER_DB) as c:</text>
  <text x="44" y="154" font-size="12" fill="#2c3e50" font-family="monospace">    c.execute("INSERT INTO orders ...")</text>
  <text x="44" y="176" font-size="12" fill="#2c3e50" font-family="monospace">    # 这行成功了，commit 出去了</text>
  <text x="44" y="204" font-size="12" fill="#2c3e50" font-family="monospace">with sqlite3.connect(STOCK_DB) as c:</text>
  <text x="44" y="226" font-size="12" fill="#2c3e50" font-family="monospace">    c.execute("UPDATE stock SET qty=qty-1 ...")</text>
  <text x="44" y="248" font-size="12" fill="#c0392b" font-family="monospace">    # 这一步超时：库存回滚，订单已提交</text>
  <line x1="44" y1="264" x2="430" y2="264" stroke="#e6cba6"/>
  <text x="44" y="286" font-size="11" fill="#7f8c8d">以为是"一个事务"，其实是两个独立提交</text>
  <text x="44" y="306" font-size="11" fill="#c0392b">→ 第一步落定=撤不回，第二步失败=白扣</text>

  <!-- 右侧：双库示意 -->
  <rect x="484" y="72" width="430" height="270" rx="10" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="504" y="98" font-size="13" font-weight="700" fill="#1e8449">真实的两个"部门"</text>
  <line x1="504" y1="108" x2="898" y2="108" stroke="#cfe4d3"/>

  <rect x="504" y="120" width="190" height="120" rx="8" fill="#fff" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="599" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">订单服务</text>
  <text x="599" y="170" text-anchor="middle" font-size="11" fill="#2c3e50">自己的 order.db</text>
  <text x="599" y="194" text-anchor="middle" font-size="11" fill="#7f8c8d">写订单表 ✓</text>
  <text x="599" y="216" text-anchor="middle" font-size="10" fill="#7f8c8d">提交后锁权限收进日志</text>

  <rect x="724" y="120" width="190" height="120" rx="8" fill="#fff" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="819" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">库存服务</text>
  <text x="819" y="170" text-anchor="middle" font-size="11" fill="#2c3e50">自己的 stock.db</text>
  <text x="819" y="194" text-anchor="middle" font-size="11" fill="#c0392b">扣款超时 ✗</text>
  <text x="819" y="216" text-anchor="middle" font-size="10" fill="#7f8c8d">自己回滚了，但没人管订单那边</text>

  <line x1="694" y1="180" x2="720" y2="180" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#sR)"/>

  <!-- 失败现场 -->
  <rect x="504" y="252" width="410" height="72" rx="8" fill="#fdeceb" stroke="#e8b4ac"/>
  <text x="524" y="276" font-size="12" font-weight="700" fill="#a93226">结果：一笔「有单无货」脏数据</text>
  <text x="524" y="300" font-size="11" fill="#2c3e50">订单表写了一行，库存没扣。不报错、不告警，只在月底对不上账</text>

  <!-- 底线两个坑 -->
  <rect x="26" y="360" width="888" height="56" rx="8" fill="#fdf2f0" stroke="#e8b4ac" stroke-width="1.2"/>
  <text x="470" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#a93226">两个坑（都是实测）</text>
  <text x="470" y="406" text-anchor="middle" font-size="12" fill="#2c3e50">① 联调时两个库同线程、谁都没先 commit，所以看着像"一个事务"；② 一旦其中一步 commit 过，就彻底撤不回来</text>

  <!-- 四幕实测 -->
  <text x="470" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2833">四幕实测（同一份下单代码，只改故障注入）</text>

  <rect x="26" y="468" width="204" height="70" rx="7" fill="#fff" stroke="#ccc"/>
  <text x="128" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">幕 1：两库都通</text>
  <text x="128" y="510" text-anchor="middle" font-size="11" fill="#2c3e50">订单✓ 库存✓ 一致</text>
  <text x="128" y="528" text-anchor="middle" font-size="10" fill="#7f8c8d">看不出一致性是假的</text>

  <rect x="246" y="468" width="204" height="70" rx="7" fill="#fff" stroke="#ccc"/>
  <text x="348" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">幕 2：库存超时</text>
  <text x="348" y="510" text-anchor="middle" font-size="11" fill="#2c3e50">订单✓ 库存✗</text>
  <text x="348" y="528" text-anchor="middle" font-size="10" fill="#7f8c8d">脏数据"有单无货"</text>

  <rect x="466" y="468" width="204" height="70" rx="7" fill="#fff" stroke="#ccc"/>
  <text x="568" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">幕 3：订单先崩</text>
  <text x="568" y="510" text-anchor="middle" font-size="11" fill="#2c3e50">订单✗ 库存✓</text>
  <text x="568" y="528" text-anchor="middle" font-size="10" fill="#7f8c8d">"有货无单"同样错</text>

  <rect x="686" y="468" width="228" height="70" rx="7" fill="#fff" stroke="#ccc"/>
  <text x="800" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">幕 4：放大 200 笔</text>
  <text x="800" y="510" text-anchor="middle" font-size="11" fill="#2c3e50">20 笔脏数据 / 10%</text>
  <text x="800" y="528" text-anchor="middle" font-size="10" fill="#7f8c8d">不是罕见事故</text>
</svg>
