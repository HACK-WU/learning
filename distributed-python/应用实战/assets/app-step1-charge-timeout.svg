<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="as1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="500" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">演进第 1 步：直接调扣款服务，不设超时（"能跑但危险"）</text>

  <!-- 客户端 -->
  <rect x="70" y="120" width="200" height="90" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="170" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">订单服务</text>
  <text x="170" y="178" text-anchor="middle" font-size="12" fill="#64748b">调用方（客户端）</text>
  <text x="170" y="198" text-anchor="middle" font-size="11" fill="#94a3b8">无超时 · 无重试</text>

  <!-- 扣款服务 -->
  <rect x="620" y="120" width="230" height="90" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="735" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">扣款服务</text>
  <text x="735" y="178" text-anchor="middle" font-size="12" fill="#64748b">服务端</text>
  <text x="735" y="198" text-anchor="middle" font-size="11" fill="#94a3b8">有随机偶发慢</text>

  <line x1="272" y1="165" x2="616" y2="165" stroke="#64748b" stroke-width="2.5" marker-end="url(#as1)"/>
  <text x="444" y="150" text-anchor="middle" font-size="12" fill="#334155">Charge(user, amount)</text>
  <text x="444" y="188" text-anchor="middle" font-size="11" fill="#b91c1c">返回不确定：可能成功/超时/丢包</text>

  <!-- 问题区 -->
  <rect x="70" y="270" width="780" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="92" y="300" font-size="15" font-weight="bold" fill="#b91c1c">这个版本的问题</text>
  <text x="92" y="326" font-size="13" fill="#7f1d1d">· 没设超时 → 下游偶发 900ms+ 时，调用方线程被无限占住，QPS 越高积压越多</text>
  <text x="92" y="350" font-size="13" fill="#7f1d1d">· 一旦超时（靠网关兜底），"有没有扣"未知 → 后续没有自救手段</text>
  <text x="92" y="374" font-size="13" fill="#7f1d1d">· 靠网关超时兜底 = 超时在链条最深的一层，等于没有预算分配</text>
  <text x="92" y="402" font-size="12.5" fill="#b91c1c">→ 第 2 步：先给它定超时终点（超时预算）</text>
</svg>
