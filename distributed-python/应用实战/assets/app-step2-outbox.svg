<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="s2G" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1e8449"/>
    </marker>
    <marker id="s2D" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <rect width="900" height="570" fill="#fbfbf9"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2833">第 2 步：加事务性发件箱</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#7f8c8d">比第 1 步只多了一张表和一次 INSERT —— 但「欠的债」从此可查</text>

  <!-- 左：写侧 -->
  <rect x="24" y="80" width="404" height="268" rx="11" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.6"/>
  <text x="46" y="108" font-size="13" font-weight="700" fill="#1e8449">改了什么：写侧</text>

  <rect x="42" y="124" width="368" height="112" rx="7" fill="#fff" stroke="#7fb889" stroke-width="1.7"/>
  <text x="56" y="144" font-size="10" fill="#7f8c8d" font-family="monospace">with conn(ORDER_DB) as c:   ← 一个事务</text>

  <rect x="56" y="152" width="340" height="34" rx="5" fill="#eaf5ec" stroke="#a9d3b4"/>
  <text x="70" y="173" font-size="10" fill="#1e8449" font-family="monospace">INSERT INTO orders (id, sku, qty) …</text>

  <rect x="56" y="192" width="340" height="34" rx="5" fill="#eaf5ec" stroke="#a9d3b4"/>
  <text x="70" y="213" font-size="10" fill="#1e8449" font-family="monospace">INSERT INTO outbox ('order', 1001, …)</text>

  <text x="46" y="256" font-size="10" fill="#2c3e50">提交 → 两行都在；回滚 → 两行都不在</text>
  <text x="46" y="276" font-size="10" fill="#1e8449">「事件存在」与「业务提交」成了同一个布尔值</text>
  <text x="46" y="298" font-size="9" fill="#7f8c8d">实测：qty=0 撞约束时 → 订单 0 行、outbox 0 行</text>
  <text x="46" y="322" font-size="9" fill="#7f8c8d">比第 1 步多的东西：一张 outbox 表 + 一次 INSERT</text>

  <!-- 右：中继 -->
  <rect x="442" y="80" width="434" height="268" rx="11" fill="#fff8f0" stroke="#e0c3a0" stroke-width="1.6"/>
  <text x="464" y="108" font-size="13" font-weight="700" fill="#a04000">新增：中继（独立进程）</text>

  <rect x="464" y="122" width="390" height="36" rx="6" fill="#fff" stroke="#e0c3a0"/>
  <text x="478" y="138" font-size="10" fill="#2c3e50" font-family="monospace">SELECT … WHERE published_at IS NULL</text>
  <text x="478" y="152" font-size="9" fill="#7f8c8d">按「是否已发布」扫，不能按 id 高水位</text>

  <path d="M 659 158 L 659 176" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#s2G)"/>

  <rect x="464" y="180" width="390" height="36" rx="6" fill="#fff" stroke="#e0c3a0"/>
  <text x="478" y="196" font-size="10" fill="#2c3e50" font-family="monospace">broker.publish(…)</text>
  <text x="478" y="210" font-size="9" fill="#a93226">① 发出去（走网络）</text>

  <path d="M 659 216 L 659 234" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="671" y="230" font-size="9" fill="#c0392b">崩溃窗口（消不掉）</text>

  <rect x="464" y="238" width="390" height="36" rx="6" fill="#fff" stroke="#e0c3a0"/>
  <text x="478" y="254" font-size="10" fill="#2c3e50" font-family="monospace">UPDATE outbox SET published_at=now()</text>
  <text x="478" y="268" font-size="9" fill="#2c3e50">② 标记已发布</text>

  <text x="464" y="298" font-size="10" fill="#a93226">①② 不是原子的 → 重启会重发 → 只能是 at-least-once</text>
  <text x="464" y="320" font-size="9" fill="#7f8c8d">两个中继并发扫同一批 20 条 → 实际投递 40 次</text>

  <!-- 底部实测 -->
  <line x1="24" y1="368" x2="876" y2="368" stroke="#ddd" stroke-width="1.5"/>
  <text x="450" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2833">四幕实测（200 笔，同一份故障脚本）</text>

  <rect x="24" y="412" width="404" height="98" rx="8" fill="#f5f5f5" stroke="#ccc"/>
  <text x="44" y="434" font-size="11" font-weight="700" fill="#566573">幕 1-3：故障逐个注入</text>
  <text x="44" y="456" font-size="10" fill="#2c3e50">提交后崩溃 → outbox 行在 → 中继补发 ✓</text>
  <text x="44" y="474" font-size="10" fill="#2c3e50">中继发完未标记就崩 → 重启重扫 → 发两遍</text>
  <text x="44" y="492" font-size="10" fill="#2c3e50">通道重复投递 15% → 下游收到两遍</text>
  <text x="44" y="508" font-size="9" fill="#7f8c8d">幕 4：不清理 outbox → 行数线性增长</text>

  <rect x="442" y="412" width="434" height="98" rx="8" fill="#fff8f0" stroke="#e0c3a0"/>
  <text x="462" y="434" font-size="11" font-weight="700" fill="#a04000">合计：不丢了，但开始重</text>
  <text x="462" y="458" font-size="11" fill="#2c3e50">订单 <tspan font-weight="700">200</tspan> 笔｜库存扣减 <tspan font-weight="700" fill="#a04000">230</tspan> 件｜应扣 200｜偏差 <tspan font-weight="700" fill="#a04000">+30</tspan></text>
  <text x="462" y="480" font-size="10" fill="#2c3e50">待发 0 条 → 丢事件被治好了</text>
  <text x="462" y="500" font-size="10" fill="#a04000">执行 230 次扣减，其中只有 200 次是不同订单</text>

  <text x="24" y="532" font-size="10" fill="#7f8c8d">本步结论：发件箱没有让「两件事」变成「一件事」，只是把第二件从「网络调用」换成「自己库里的一行」</text>
  <text x="24" y="552" font-size="10" fill="#7f8c8d">下一版要改的：+30 全部压到了下游 —— 见第 3 步，让消费端认得出「这条我办过了」</text>
  <text x="24" y="570" font-size="10" fill="#7f8c8d">⚠️ 这个 +30 里既有中继重发，也有通道重复；在消费端看来它们一模一样</text>
</svg>
