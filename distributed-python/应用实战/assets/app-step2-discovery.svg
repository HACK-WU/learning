<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="s2a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="s2b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="s2r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="640" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">演进第 2 步：加入注册中心，客户端定期拉名单</text>
  <text x="470" y="58" text-anchor="middle" font-size="12" fill="#64748b">地址从代码里搬到了注册中心，客户端不再写死 —— 但「谁在接活」它看不见</text>

  <!-- 实例 -> 注册中心 心跳 -->
  <text x="60" y="96" font-size="12" font-weight="bold" fill="#334155">实例侧：每 250ms 发一次心跳</text>

  <rect x="30" y="110" width="150" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="105" y="135" text-anchor="middle" font-size="11.5" fill="#15803d">n1　心跳 ✓</text>
  <rect x="30" y="158" width="150" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="105" y="183" text-anchor="middle" font-size="11.5" fill="#15803d">n2　心跳 ✓</text>
  <rect x="30" y="206" width="150" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="105" y="231" text-anchor="middle" font-size="11.5" fill="#15803d">n3　心跳 ✓</text>
  <rect x="30" y="254" width="150" height="40" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="105" y="272" text-anchor="middle" font-size="11" fill="#a16207">n1 半死时</text>
  <text x="105" y="287" text-anchor="middle" font-size="10" fill="#a16207">心跳照发 ✓</text>

  <rect x="250" y="140" width="190" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="345" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">注册中心</text>
  <text x="345" y="188" text-anchor="middle" font-size="10.5" fill="#2563eb">记录「最近一次心跳时间」</text>
  <text x="345" y="208" text-anchor="middle" font-size="10.5" fill="#1e40af">TTL = 2.0s</text>
  <text x="345" y="228" text-anchor="middle" font-size="10.5" fill="#1e40af">超时未心跳 → 从名单移除</text>
  <text x="345" y="248" text-anchor="middle" font-size="10" fill="#64748b">它只判断「进程还在不在说话」</text>

  <line x1="184" y1="130" x2="246" y2="160" stroke="#16a34a" stroke-width="1.6" marker-end="url(#s2a)"/>
  <line x1="184" y1="178" x2="246" y2="186" stroke="#16a34a" stroke-width="1.6" marker-end="url(#s2a)"/>
  <line x1="184" y1="226" x2="246" y2="212" stroke="#16a34a" stroke-width="1.6" marker-end="url(#s2a)"/>
  <line x1="184" y1="274" x2="246" y2="238" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#s2a)"/>

  <!-- 客户端拉 -->
  <rect x="520" y="126" width="390" height="148" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="542" y="150" font-size="12.5" font-weight="bold" fill="#0f172a">客户端（下单服务）</text>
  <text x="542" y="172" font-size="11" fill="#334155">· 每 200ms 拉一次名单（pull_seconds）</text>
  <text x="542" y="192" font-size="11" fill="#334155">· 本地缓存这份名单，两次拉取之间不更新</text>
  <text x="542" y="212" font-size="11" fill="#334155">· 轮询：第 1 次 n1、第 2 次 n2 …… 按序转</text>
  <text x="542" y="236" font-size="11" fill="#1d4ed8" font-family="monospace">endpoints[next(turn) % len(endpoints)]</text>
  <text x="542" y="258" font-size="10.5" fill="#64748b">选中谁完全靠位置，不看对方当前忙不忙</text>

  <line x1="444" y1="176" x2="516" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#s2b)"/>
  <text x="480" y="168" text-anchor="middle" font-size="10" fill="#1d4ed8">拉取</text>

  <!-- 四幕结果 -->
  <rect x="30" y="300" width="880" height="176" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="52" y="326" font-size="14.5" font-weight="bold" fill="#1d4ed8">同一份代码，四个场景本机实测</text>

  <text x="52" y="354" font-size="12" fill="#1e3a8a">幕 1　5 个实例常态</text>
  <text x="288" y="354" font-size="12" font-weight="bold" fill="#15803d">30/30 成功，5 个各 6 次</text>
  <text x="600" y="354" font-size="11.5" fill="#1e40af">→ 上一版这一步只用得到 1 个</text>

  <text x="52" y="382" font-size="12" fill="#1e3a8a">幕 2　n1 半死（503）</text>
  <text x="288" y="382" font-size="12" font-weight="bold" fill="#dc2626">143 次里失败 29（20.3%）</text>
  <text x="600" y="382" font-size="11.5" fill="#1e40af">→ 心跳正常，注册中心永远发现不了</text>

  <text x="52" y="410" font-size="12" fill="#1e3a8a">幕 3　n1 全死（无心跳）</text>
  <text x="288" y="410" font-size="12" font-weight="bold" fill="#ca8a04">153 次里失败 16（10.5%）</text>
  <text x="600" y="410" font-size="11.5" fill="#1e40af">→ 1.61s 后自动止血，但之前全是白打</text>

  <text x="52" y="438" font-size="12" fill="#1e3a8a">幕 4　n1 换新端口回来</text>
  <text x="288" y="438" font-size="12" font-weight="bold" fill="#15803d">30/30 成功，5 个各 6 次</text>
  <text x="600" y="438" font-size="11.5" fill="#1e40af">→ 客户端一行没改，新端口自动进入</text>

  <line x1="46" y1="452" x2="894" y2="452" stroke="#93c5fd" stroke-width="1"/>
  <text x="52" y="470" font-size="11.5" fill="#b91c1c">幕 2 是这一步的致命缺口：注册中心的名单只证明「进程还在说话」，不证明「它能接活」。</text>

  <!-- 三段延迟 -->
  <rect x="30" y="492" width="430" height="128" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
  <text x="50" y="516" font-size="12.5" font-weight="bold" fill="#b91c1c">名单天生过期：三段延迟叠加</text>
  <text x="50" y="540" font-size="11" fill="#7f1d1d">① 心跳 TTL　　最多 2.0s 才知道它死了</text>
  <text x="50" y="562" font-size="11" fill="#7f1d1d">② 客户端缓存　最多 0.2s 才拿到新名单</text>
  <text x="50" y="584" font-size="11" fill="#7f1d1d">③ 轮询一圈　　最多一整圈才轮到它</text>
  <text x="50" y="608" font-size="11" font-weight="bold" fill="#dc2626">实测止血点 1.61s，你的用户在这段时间里一直失败</text>

  <rect x="480" y="492" width="430" height="128" rx="10" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.8"/>
  <text x="500" y="516" font-size="12.5" font-weight="bold" fill="#15803d">这一步解决了什么 / 没解决什么</text>
  <text x="500" y="540" font-size="11" fill="#166534">✓ 地址不再写死，扩缩容和换端口都能跟上</text>
  <text x="500" y="562" font-size="11" fill="#166534">✓ 5 个实例全部参与分担，利用率 100%</text>
  <text x="500" y="584" font-size="11" fill="#b91c1c">✗ 分不清「活着」和「能接活」</text>
  <text x="500" y="608" font-size="11" fill="#b91c1c">✗ 轮询按位置转，不看对方当前忙不忙</text>
</svg>
