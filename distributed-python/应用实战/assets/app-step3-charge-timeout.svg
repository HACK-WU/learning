<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="as3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="as3r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="540" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">演进第 3 步：超时预算 + 幂等键 + 有纪律的重试（综合实现）</text>

  <!-- 客户端 -->
  <rect x="60" y="130" width="230" height="120" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">订单服务（综合）</text>
  <text x="88" y="184" font-size="11.5" fill="#1e40af">· timeout = 总预算 500ms</text>
  <text x="88" y="204" font-size="11.5" fill="#1e40af">· 幂等键 idempotency_key</text>
  <text x="88" y="224" font-size="11.5" fill="#1e40af">· 重试上限 3 次 + 指数退避 + 抖动</text>
  <text x="88" y="244" font-size="10.5" fill="#3b82f6">本步新增高亮：预算 + 幂等键 + 纪律</text>

  <!-- 扣款服务 -->
  <rect x="620" y="110" width="260" height="170" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">扣款服务（综合）</text>
  <text x="645" y="164" font-size="11.5" fill="#1e40af">· 去重表 charge_dedup（key 唯一）</text>
  <text x="645" y="184" font-size="11.5" fill="#1e40af">· 先原子占位再真扣款</text>
  <text x="645" y="204" font-size="11.5" fill="#1e40af">· 同一 key→查重→直接返回首结果</text>
  <text x="610" y="98" text-anchor="middle" font-size="10.5" fill="#dc2626">⚠️ 响应丢失后重试，不再双扣</text>

  <line x1="292" y1="180" x2="616" y2="150" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#as3)"/>
  <text x="396" y="148" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Charge#1 key=ord-1001</text>
  <line x1="616" y1="190" x2="292" y2="210" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#as3r)"/>
  <text x="390" y="230" text-anchor="middle" font-size="11" fill="#dc2626">响应丢失</text>
  <line x1="300" y1="212" x2="616" y2="222" stroke="#3b82f6" stroke-width="2" marker-end="url(#as3)"/>
  <text x="446" y="262" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Charge#2 同一 key（重试）→ 服务端查重，返回第一次结果</text>

  <!-- 验证区 -->
  <rect x="60" y="330" width="820" height="150" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="82" y="360" font-size="15" font-weight="bold" fill="#15803d">本步解决了什么（实测验证）」</text>
  <text x="82" y="386" font-size="13" fill="#166534">· 超时有总预算 500ms，不是每层各设 → 最坏总耗时可预测（M5/M6 实测）</text>
  <text x="82" y="410" font-size="13" fill="#166534">· 幂等键把"超时重试"变成"查重返回"——重试不再制造重复副作用（M3c 实测：账本 1 笔）</text>
  <text x="82" y="434" font-size="13" fill="#166534">· 重试有上限 + 指数退避 + 抖动 → 失败时错峰，不放大成雪崩（M2/M4 实测）</text>
  <text x="82" y="462" font-size="12" fill="#15803d">✓ 用户承诺 1 秒内一定有个答案，且重试多少次都不会再多扣一分钱</text>
</svg>
