<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#111827">step1 基础版：文档里写一段话，代码里各写各的</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">三个调用方靠文档同步字段名。字段名一改，有的调用方还在用旧名 —— 没人收到通知，也查不出来。</text>

  <!-- 左：服务提供方 -->
  <rect x="40" y="90" width="260" height="300" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="60" y="116" font-size="13" font-weight="700" fill="#1e40af">服务提供方（订单服务）</text>
  <rect x="60" y="134" width="220" height="90" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="76" y="156" font-size="11.5" fill="#111827">def get_order():</text>
  <text x="76" y="176" font-size="11.5" fill="#111827">    return json.dumps({</text>
  <text x="76" y="196" font-size="11.5" fill="#111827">        "amount": 1990})   # 字段名在这</text>
  <text x="76" y="214" font-size="11" fill="#b91c1c">              ↑↓</text>
  <rect x="60" y="240" width="220" height="60" rx="8" fill="#fff1f2" stroke="#fecaca"/>
  <text x="76" y="262" font-size="11" fill="#b91c1c">约定只存在于</text>
  <text x="76" y="282" font-size="11" fill="#b91c1c">docs/internal-api.md 一段话里</text>

  <!-- 右：三个调用方 -->
  <rect x="360" y="90" width="500" height="300" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="380" y="116" font-size="13" font-weight="700" fill="#b91c1c">三个调用方 —— 各自对齐文档，各自实现一遍</text>

  <rect x="380" y="132" width="150" height="72" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="455" y="156" font-size="11.5" text-anchor="middle" fill="#111827">调用方 A</text>
  <text x="455" y="176" font-size="11" text-anchor="middle" fill="#6b7280">读 item["amount"]</text>
  <text x="455" y="194" font-size="11" text-anchor="middle" fill="#6b7280">(旧名，沿用)</text>

  <rect x="546" y="132" width="150" height="72" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="621" y="156" font-size="11.5" text-anchor="middle" fill="#111827">调用方 B</text>
  <text x="621" y="176" font-size="11.5" text-anchor="middle" fill="#6b7280">读 item["amount_cents"]</text>
  <text x="621" y="194" font-size="11" text-anchor="middle" fill="#6b7280">(改了文档，也用新名)</text>

  <rect x="712" y="132" width="128" height="72" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="776" y="156" font-size="11.5" text-anchor="middle" fill="#111827">调用方 C</text>
  <text x="776" y="176" font-size="11.5" text-anchor="middle" fill="#92400e">新接入，看文档</text>
  <text x="776" y="194" font-size="11.5" text-anchor="middle" fill="#92400e">是 amount_cents</text>

  <!-- 问题标注 -->
  <text x="380" y="236" font-size="12" font-weight="700" fill="#b91c1c">问题：字段名一改，全凭人肉通知</text>
  <text x="380" y="258" font-size="11.5" fill="#7f1d1d">· 调用方 A 还在读 amount，拿到响应后 item.amount 恒 undefined</text>
  <text x="380" y="280" font-size="11.5" fill="#7f1d1d">· 没有任何机制能发现 —— 不报错、不提示</text>
  <text x="380" y="302" font-size="11.5" fill="#7f1d1d">· 想判断"这次改动破坏谁"，只能挨个打电话问</text>
  <text x="380" y="330" font-size="11.5" fill="#7f1d1d">· 无 schema、无兼容检查、无 CI —— 三人三份代码</text>

  <text x="30" y="430" font-size="12" fill="#9ca3af">这一版的"约定"= 文档 与 每个人的记忆。改一处字段名 = 改一次接口，且无人能自动感知。</text>
  <text x="30" y="452" font-size="12" font-weight="700" fill="#b91c1c">触发演进：第三个调用方接入当天就崩 —— 判断标准="别再用文档当协议"。</text>
</svg>
