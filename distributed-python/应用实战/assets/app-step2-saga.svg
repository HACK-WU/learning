<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="tR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/>
    </marker>
    <marker id="tG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1e8449"/>
    </marker>
    <marker id="tO" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#e67e22"/>
    </marker>
  </defs>

  <rect width="940" height="600" fill="#fbfbf9"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2833">应用实战 09 · 第 2 步：加一个"总协调者"，三本账一起点头</text>
  <text x="470" y="56" text-anchor="middle" font-size="12" fill="#7f8c8d">第 1 步的错账逼出第 2 步：把所有参与者问一遍，都同意才一起提交 —— 这是"强一致"路线（2PC）</text>

  <!-- 协调者+参与者 -->
  <rect x="26" y="72" width="888" height="218" rx="10" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="470" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">第 2 步架构：一个总协调者 + N 个参与者</text>

  <!-- 协调者 -->
  <rect x="60" y="116" width="170" height="150" rx="8" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <text x="145" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#a04000">总协调者</text>
  <text x="145" y="168" text-anchor="middle" font-size="11" fill="#2c3e50">问"行不行" → 收集 → 广播</text>
  <text x="145" y="192" text-anchor="middle" font-size="11" fill="#7f8c8d">它是唯一知道"整个要提交</text>
  <text x="145" y="212" text-anchor="middle" font-size="11" fill="#7f8c8d">还是要撤销"的实体</text>
  <text x="145" y="250" text-anchor="middle" font-size="11" fill="#c0392b">⚠️ 单点</text>

  <!-- 三个参与者 -->
  <rect x="300" y="116" width="180" height="130" rx="8" fill="#fff" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="390" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">订单服务</text>
  <text x="390" y="166" text-anchor="middle" font-size="11" fill="#2c3e50">prepare：锁住、写日志</text>
  <text x="390" y="188" text-anchor="middle" font-size="11" fill="#1e8449">答 VOTE-COMMIT</text>
  <text x="390" y="214" text-anchor="middle" font-size="10" fill="#7f8c8d">然后：只能等</text>

  <rect x="500" y="116" width="180" height="130" rx="8" fill="#fff" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="590" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">库存服务</text>
  <text x="590" y="166" text-anchor="middle" font-size="11" fill="#2c3e50">prepare：锁住、写日志</text>
  <text x="590" y="188" text-anchor="middle" font-size="11" fill="#1e8449">答 VOTE-COMMIT</text>
  <text x="590" y="214" text-anchor="middle" font-size="10" fill="#7f8c8d">然后：只能等</text>

  <rect x="700" y="116" width="180" height="130" rx="8" fill="#fff" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="790" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">支付服务</text>
  <text x="790" y="166" text-anchor="middle" font-size="11" fill="#2c3e50">prepare：锁住、写日志</text>
  <text x="790" y="188" text-anchor="middle" font-size="11" fill="#1e8449">答 VOTE-COMMIT</text>
  <text x="790" y="214" text-anchor="middle" font-size="10" fill="#7f8c8d">然后：只能等</text>

  <!-- 协调者到参与者的箭头 -->
  <line x1="238" y1="150" x2="294" y2="150" stroke="#1e8449" stroke-width="2" marker-end="url(#tG)"/>
  <text x="266" y="142" text-anchor="middle" font-size="10" fill="#1e8449">问</text>
  <line x1="294" y1="176" x2="238" y2="176" stroke="#1e8449" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#tG)"/>
  <text x="266" y="190" text-anchor="middle" font-size="10" fill="#1e8449">答</text>

  <line x1="238" y1="196" x2="494" y2="196" stroke="#1e8449" stroke-width="2" marker-end="url(#tG)"/>
  <line x1="494" y1="222" x2="238" y2="222" stroke="#1e8449" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#tG)"/>
  <line x1="238" y1="242" x2="694" y2="242" stroke="#1e8449" stroke-width="2" marker-end="url(#tG)"/>
  <line x1="694" y1="268" x2="238" y2="268" stroke="#1e8449" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#tG)"/>

  <!-- 数字卡 -->
  <rect x="60" y="272" width="820" height="0" rx="0" fill="none"/>

  <!-- 实测四幕 -->
  <text x="470" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2833">四幕实测（真实加锁的 2PC 模拟，3 个参与者各 prepare 30ms）</text>

  <rect x="26" y="340" width="288" height="96" rx="8" fill="#fff" stroke="#7fb889" stroke-width="1.5"/>
  <text x="46" y="364" font-size="12" font-weight="700" fill="#1e8449">并行发 PREPARE（对的做法）</text>
  <text x="46" y="388" font-size="11" fill="#2c3e50">总耗时 30.7ms｜消息 12</text>
  <text x="46" y="410" font-size="11" fill="#7f8c8d">不确定窗口 ~0.3ms（都答完瞬间）</text>
  <text x="46" y="428" font-size="11" fill="#7f8c8d">→ 顺利时很快</text>

  <rect x="326" y="340" width="288" height="96" rx="8" fill="#fff8f0" stroke="#e0c3a0" stroke-width="1.5"/>
  <text x="346" y="364" font-size="12" font-weight="700" fill="#a04000">串行发 PREPARE（新手对做法）</text>
  <text x="346" y="388" font-size="11" fill="#2c3e50">总耗时 90.4ms｜消息仍 12</text>
  <text x="346" y="410" font-size="11" fill="#7f8c8d">rm1 总持锁 90.4ms（在等后面的人）</text>
  <text x="346" y="428" font-size="11" fill="#c0392b">消息一条没省，只是变慢</text>

  <rect x="626" y="340" width="288" height="96" rx="8" fill="#fdf2f0" stroke="#e8b4ac" stroke-width="1.5"/>
  <text x="646" y="364" font-size="12" font-weight="700" fill="#a93226">协调者 prepare 后崩溃</text>
  <text x="646" y="388" font-size="11" fill="#2c3e50">阻塞 2000.1ms｜锁 2030.6ms</text>
  <text x="646" y="410" font-size="11" fill="#c0392b">数据已写好、锁已拿着</text>
  <text x="646" y="428" font-size="11" fill="#7f8c8d">谁也不知道该提交还是撤销</text>

  <text x="470" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2833">第 2 步结论：强一致买到了，但代价是"锁 + 可能僵住"</text>

  <rect x="26" y="486" width="888" height="76" rx="8" fill="#fdf2f0" stroke="#e8b4ac"/>
  <text x="470" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#a93226">逼迫性的问题</text>
  <text x="470" y="536" text-anchor="middle" font-size="12" fill="#2c3e50">如果协调者永远回不来，这三个部门就一直占着 → 别家生意全被卡住。</text>
  <text x="470" y="556" text-anchor="middle" font-size="12" fill="#c0392b">给参与者加超时自行回滚？第 3 步会告诉你这会出更糟的问题。</text>
</svg>
