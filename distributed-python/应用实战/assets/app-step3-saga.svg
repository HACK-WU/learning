<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="940" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="fG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1e8449"/>
    </marker>
    <marker id="fR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/>
    </marker>
    <marker id="fD" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <rect width="940" height="640" fill="#fbfbf9"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2833">应用实战 09 · 第 3 步：Saga —— 去掉协调者，错了补一笔</text>
  <text x="470" y="56" text-anchor="middle" font-size="12" fill="#7f8c8d">第 2 步的锁和单点逼出第 3 步：不锁、不协调，按顺序一步步办，谁错了就倒着补前面的（最终一致）</text>

  <!-- 流程 -->
  <rect x="26" y="72" width="888" height="180" rx="10" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="470" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">订单流程四步（按"可补 → 不可补"排，最后一步是 pivot）</text>

  <rect x="40" y="112" width="150" height="70" rx="7" fill="#fff" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="115" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">① 建订单</text>
  <text x="115" y="158" text-anchor="middle" font-size="11" fill="#7f8c8d">可补：撤订单</text>
  <text x="115" y="176" text-anchor="middle" font-size="10" fill="#7f8c8d">PENDING 占位</text>

  <rect x="210" y="112" width="150" height="70" rx="7" fill="#fff" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="285" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">② 扣库存</text>
  <text x="285" y="158" text-anchor="middle" font-size="11" fill="#7f8c8d">可补：加回去</text>
  <text x="285" y="176" text-anchor="middle" font-size="10" fill="#7f8c8d">⚠️ 补不幂等会怎样</text>

  <rect x="380" y="112" width="150" height="70" rx="7" fill="#fff" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="455" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">③ 扣款</text>
  <text x="455" y="158" text-anchor="middle" font-size="11" fill="#7f8c8d">可补：退款</text>
  <text x="455" y="176" text-anchor="middle" font-size="10" fill="#7f8c8d">第二补会报错</text>

  <rect x="550" y="112" width="150" height="70" rx="7" fill="#fff8f0" stroke="#e0c3a0" stroke-width="2"/>
  <text x="625" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#a04000">④ 发货</text>
  <text x="625" y="158" text-anchor="middle" font-size="11" fill="#a04000">pivot：不可补</text>
  <text x="625" y="176" text-anchor="middle" font-size="10" fill="#a04000">之后失败只重试</text>

  <line x1="194" y1="147" x2="204" y2="147" stroke="#1e8449" stroke-width="2" marker-end="url(#fG)"/>
  <line x1="364" y1="147" x2="374" y2="147" stroke="#1e8449" stroke-width="2" marker-end="url(#fG)"/>
  <line x1="534" y1="147" x2="544" y2="147" stroke="#1e8449" stroke-width="2" marker-end="url(#fG)"/>

  <!-- 补偿回落 -->
  <text x="740" y="198" font-size="10" fill="#7f8c8d">某步失败 ↓</text>
  <path d="M 455 184 L 455 216 L 285 216 L 285 250" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#fR)"/>
  <path d="M 285 216 L 115 216 L 115 250" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#fR)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#c0392b">倒着补：退款 → 加库存 → 撤订单</text>

  <!-- 三种补偿命运 -->
  <rect x="26" y="268" width="888" height="196" rx="10" fill="#fbfbf9" stroke="#ccc"/>
  <text x="470" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2833">三种补偿，三种命运（S2 实测：每条投 2 次；同一份失败清单）</text>

  <rect x="40" y="306" width="276" height="142" rx="8" fill="#fff" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="60" y="330" font-size="12" font-weight="700" fill="#1e8449">撤订单 delete</text>
  <text x="60" y="354" font-size="11" fill="#2c3e50">投两次 = 删两次</text>
  <text x="60" y="376" font-size="11" fill="#2c3e50">结果一样：那行没了</text>
  <text x="60" y="404" font-size="11" fill="#1e8449">✓ 天生幂等</text>
  <text x="60" y="428" font-size="10" fill="#7f8c8d">80 次投递，80 次一样（不报错、不补错）</text>

  <rect x="332" y="306" width="276" height="142" rx="8" fill="#fff" stroke="#e0c3a0" stroke-width="1.5"/>
  <text x="352" y="330" font-size="12" font-weight="700" fill="#a04000">退款 update</text>
  <text x="352" y="354" font-size="11" fill="#2c3e50">第二次找不到可退的</text>
  <text x="352" y="376" font-size="11" fill="#2c3e50">→ 报错</text>
  <text x="352" y="404" font-size="11" fill="#a04000">△ 不幂等，但它"会响"</text>
  <text x="352" y="428" font-size="10" fill="#7f8c8d">能被监控抓住（3 次报错）</text>

  <rect x="624" y="306" width="276" height="142" rx="8" fill="#fdf2f0" stroke="#e8b4ac" stroke-width="1.8"/>
  <text x="644" y="330" font-size="12" font-weight="700" fill="#a93226">还库存 add</text>
  <text x="644" y="354" font-size="11" fill="#2c3e50">第二次照样加</text>
  <text x="644" y="376" font-size="11" fill="#2c3e50">→ 不报错</text>
  <text x="644" y="404" font-size="11" font-weight="700" fill="#c0392b">✗ 不幂等，且"不响"</text>
  <text x="644" y="428" font-size="10" fill="#7f8c8d">多还 32 件，账上看不出（最难查）</text>

  <!-- 三段对照 -->
  <text x="470" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2833">三段对照（100 笔，同一份失败清单：库存 8 / 支付 29 / 发货 3 / 全成功 60）</text>

  <rect x="26" y="508" width="288" height="62" rx="7" fill="#f5f5f5" stroke="#ccc"/>
  <text x="46" y="532" font-size="12" font-weight="700" fill="#566573">S1 无结算</text>
  <text x="46" y="554" font-size="11" fill="#c0392b">偏差 8（少扣，有单无货）</text>

  <rect x="326" y="508" width="288" height="62" rx="7" fill="#fff8f0" stroke="#e0c3a0"/>
  <text x="346" y="532" font-size="12" font-weight="700" fill="#a04000">S2 补但不幂等</text>
  <text x="346" y="554" font-size="11" fill="#c0392b">偏差 32（多还，库存虚增）</text>

  <rect x="626" y="508" width="288" height="62" rx="7" fill="#f1f8f2" stroke="#a9d3b4"/>
  <text x="646" y="532" font-size="12" font-weight="700" fill="#1e8449">S3 补且幂等</text>
  <text x="646" y="554" font-size="11" fill="#1e8449">偏差 0（对得上）</text>

  <!-- 让步说明 -->
  <rect x="26" y="586" width="888" height="40" rx="7" fill="#eef4fb" stroke="#b6cde8"/>
  <text x="470" y="612" text-anchor="middle" font-size="12" fill="#1f4e79">什么时候可以退回简单版（S1）：业务允许先写一边、另一边异步补账、且能接受盘点对不上 → 回到"一个业务一个库"再谈。</text>
</svg>
