<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#5d6d7e"/>
    </marker>
  </defs>

  <rect width="980" height="660" fill="#fbfbf9"/>
  <text x="490" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1c2833">地址写死，会炸在哪三处</text>
  <text x="490" y="62" text-anchor="middle" font-size="13" fill="#7f8c8d">三个阶段：3 个实例 → 扩到 5 个 → 老实例换端口重建（本机实测）</text>

  <!-- R1 -->
  <rect x="30" y="86" width="290" height="286" rx="10" fill="#fff" stroke="#cfd8dc" stroke-width="1.5"/>
  <rect x="30" y="86" width="290" height="34" rx="10" fill="#eaf2f8"/>
  <text x="175" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">R1 初始：3 个实例都健康</text>

  <text x="50" y="146" font-size="12" fill="#566573">客户端只知道 instance-1</text>
  <!-- 客户端 -->
  <rect x="50" y="158" width="110" height="40" rx="6" fill="#eaf2f8" stroke="#85b8d8"/>
  <text x="105" y="183" text-anchor="middle" font-size="12" fill="#1f4e79">调用方</text>
  <!-- 箭头 -->
  <line x1="160" y1="178" x2="222" y2="178" stroke="#5d6d7e" stroke-width="1.6" marker-end="url(#a1)"/>
  <!-- 三实例 -->
  <rect x="228" y="152" width="76" height="26" rx="5" fill="#d5f5e3" stroke="#27ae60"/>
  <text x="266" y="170" text-anchor="middle" font-size="11" fill="#1e8449">instance-1</text>
  <rect x="228" y="186" width="76" height="26" rx="5" fill="#f2f3f4" stroke="#bdc3c7"/>
  <text x="266" y="204" text-anchor="middle" font-size="11" fill="#95a5a6">instance-2</text>
  <rect x="228" y="220" width="76" height="26" rx="5" fill="#f2f3f4" stroke="#bdc3c7"/>
  <text x="266" y="238" text-anchor="middle" font-size="11" fill="#95a5a6">instance-3</text>

  <line x1="50" y1="266" x2="300" y2="266" stroke="#e5e8e8"/>
  <text x="50" y="288" font-size="12" fill="#2c3e50">30 次调用：成功 30 / 失败 0</text>
  <text x="50" y="310" font-size="12" fill="#2c3e50">instance-1 被打 30 次，另两个 0 次</text>
  <rect x="50" y="322" width="250" height="36" rx="6" fill="#fdf2f0" stroke="#e8b4ac"/>
  <text x="175" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#a93226">问题：扩了也不会用</text>
  <text x="50" y="372" font-size="11" fill="#7f8c8d">另 2 个实例白占资源</text>

  <!-- R2 -->
  <rect x="345" y="86" width="290" height="286" rx="10" fill="#fff" stroke="#cfd8dc" stroke-width="1.5"/>
  <rect x="345" y="86" width="290" height="34" rx="10" fill="#fef9e7"/>
  <text x="490" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#7d6608">R2 扩容到 5 个实例</text>

  <text x="365" y="146" font-size="12" fill="#566573">客户端代码一行没改</text>
  <rect x="365" y="158" width="110" height="40" rx="6" fill="#eaf2f8" stroke="#85b8d8"/>
  <text x="420" y="183" text-anchor="middle" font-size="12" fill="#1f4e79">调用方</text>
  <line x1="475" y1="178" x2="537" y2="178" stroke="#5d6d7e" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="543" y="146" width="76" height="22" rx="5" fill="#d5f5e3" stroke="#27ae60"/>
  <text x="581" y="162" text-anchor="middle" font-size="10" fill="#1e8449">instance-1</text>
  <rect x="543" y="172" width="76" height="20" rx="5" fill="#fadbd8" stroke="#e8b4ac"/>
  <text x="581" y="187" text-anchor="middle" font-size="10" fill="#c0392b">instance-2</text>
  <rect x="543" y="196" width="76" height="20" rx="5" fill="#fadbd8" stroke="#e8b4ac"/>
  <text x="581" y="211" text-anchor="middle" font-size="10" fill="#c0392b">instance-3</text>
  <rect x="543" y="220" width="76" height="20" rx="5" fill="#fadbd8" stroke="#e8b4ac"/>
  <text x="581" y="235" text-anchor="middle" font-size="10" fill="#c0392b">instance-4 新</text>
  <rect x="543" y="244" width="76" height="20" rx="5" fill="#fadbd8" stroke="#e8b4ac"/>
  <text x="581" y="259" text-anchor="middle" font-size="10" fill="#c0392b">instance-5 新</text>

  <line x1="365" y1="284" x2="615" y2="284" stroke="#e5e8e8"/>
  <text x="365" y="304" font-size="12" fill="#2c3e50">30 次调用：仍然全打在 instance-1</text>
  <text x="365" y="324" font-size="12" fill="#2c3e50">新扩的 2 个一次都没被调用</text>
  <rect x="365" y="336" width="250" height="36" rx="6" fill="#fdf2f0" stroke="#e8b4ac"/>
  <text x="490" y="359" text-anchor="middle" font-size="12" font-weight="700" fill="#a93226">问题：扩容完全无效（20%）</text>
  <text x="365" y="386" font-size="11" fill="#7f8c8d">容量翻倍，吞吐一点没变</text>

  <!-- R3 -->
  <rect x="660" y="86" width="290" height="286" rx="10" fill="#fff" stroke="#cfd8dc" stroke-width="1.5"/>
  <rect x="660" y="86" width="290" height="34" rx="10" fill="#fdedec"/>
  <text x="805" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#a93226">R3 instance-1 换端口重建</text>

  <text x="680" y="146" font-size="12" fill="#566573">老地址没人监听，新实例活着</text>
  <rect x="680" y="158" width="110" height="40" rx="6" fill="#eaf2f8" stroke="#85b8d8"/>
  <text x="735" y="183" text-anchor="middle" font-size="12" fill="#1f4e79">调用方</text>
  <line x1="790" y1="178" x2="852" y2="178" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a1)"/>
  <text x="822" y="170" text-anchor="middle" font-size="10" fill="#c0392b">✕</text>

  <rect x="858" y="146" width="76" height="22" rx="5" fill="#fadbd8" stroke="#e8b4ac"/>
  <text x="896" y="162" text-anchor="middle" font-size="10" fill="#c0392b">旧端口 断</text>
  <rect x="858" y="176" width="76" height="22" rx="5" fill="#d5f5e3" stroke="#27ae60"/>
  <text x="896" y="192" text-anchor="middle" font-size="10" fill="#1e8449">新端口 活</text>

  <line x1="680" y1="222" x2="930" y2="222" stroke="#e5e8e8"/>
  <text x="680" y="246" font-size="12" fill="#2c3e50">30 次调用：成功 0 / 失败 30</text>
  <text x="680" y="268" font-size="12" fill="#2c3e50">新实例 43759 活着，但客户端找不到</text>
  <rect x="680" y="280" width="250" height="36" rx="6" fill="#fdf2f0" stroke="#e8b4ac"/>
  <text x="805" y="303" text-anchor="middle" font-size="12" font-weight="700" fill="#a93226">问题：重启就全挂（100% 失败）</text>
  <text x="680" y="330" font-size="11" fill="#7f8c8d">滚动升级每次都触发</text>

  <!-- 根因 -->
  <rect x="30" y="392" width="920" height="86" rx="10" fill="#eef4fb" stroke="#b6cde8"/>
  <text x="50" y="418" font-size="14" font-weight="700" fill="#1f4e79">共同根因：地址是"运行期才确定、而且会变"的信息</text>
  <text x="50" y="442" font-size="12" fill="#2c3e50">服务名（order-svc）是逻辑身份，几乎不变 → 可以写进代码</text>
  <text x="560" y="442" font-size="12" fill="#c0392b">实例 IP / 端口 / 数量 / 是否健康 → 每次都变，不能写死</text>
  <text x="50" y="464" font-size="12" fill="#2c3e50">写死 IP 的错误，在于把"物理位置"当成了"逻辑身份"——你寄信该写收件人，不是写他今天坐哪张桌子。</text>

  <!-- 解法 -->
  <rect x="30" y="496" width="920" height="132" rx="10" fill="#f1f8f2" stroke="#a9d3b4"/>
  <text x="50" y="522" font-size="14" font-weight="700" fill="#1e8449">解法：把"地址"变成一次查询的结果</text>

  <rect x="50" y="538" width="270" height="74" rx="8" fill="#fff" stroke="#a9d3b4"/>
  <text x="185" y="560" text-anchor="middle" font-size="12" font-weight="700" fill="#1e8449">① 实例登记 / 移除</text>
  <text x="185" y="580" text-anchor="middle" font-size="11" fill="#2c3e50">启动时上报地址，退出时摘除</text>
  <text x="185" y="600" text-anchor="middle" font-size="11" fill="#7f8c8d">注册中心 / EndpointSlice</text>

  <rect x="355" y="538" width="270" height="74" rx="8" fill="#fff" stroke="#a9d3b4"/>
  <text x="490" y="560" text-anchor="middle" font-size="12" font-weight="700" fill="#1e8449">② 调用方拿"当前名单"</text>
  <text x="490" y="580" text-anchor="middle" font-size="11" fill="#2c3e50">带 TTL 的本地副本，过期就刷</text>
  <text x="490" y="600" text-anchor="middle" font-size="11" fill="#7f8c8d">拉取失败要保留旧名单</text>

  <rect x="660" y="538" width="270" height="74" rx="8" fill="#fff" stroke="#a9d3b4"/>
  <text x="795" y="560" text-anchor="middle" font-size="12" font-weight="700" fill="#1e8449">③ 每次调用时再选</text>
  <text x="795" y="580" text-anchor="middle" font-size="11" fill="#2c3e50">名单是"候选集"，不是"分配结果"</text>
  <text x="795" y="600" text-anchor="middle" font-size="11" fill="#7f8c8d">+ 健康判断决定给不给活</text>
</svg>
