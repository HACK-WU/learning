<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="540" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">幂等键：让"不确定有没有成功"变成"再做一次也没关系"</text>

  <!-- 左：问题 -->
  <rect x="30" y="70" width="410" height="200" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="235" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">问题：超时 = 不知道结果</text>

  <rect x="55" y="120" width="150" height="60" rx="8" fill="#fff"/>
  <text x="130" y="146" text-anchor="middle" font-size="13" fill="#334155">客户端</text>
  <text x="270" y="146" text-anchor="middle" font-size="13" fill="#334155">服务端</text>
  <line x1="207" y1="150" x2="265" y2="150" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr4)"/>
  <text x="270" y="175" text-anchor="middle" font-size="11.5" fill="#92400e">扣款 ✓（钱已动）</text>
  <line x1="207" y1="200" x2="250" y2="200" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4"/>
  <text x="150" y="225" text-anchor="middle" font-size="12" fill="#b91c1c">响应丢失 → 客户端以为失败</text>
  <text x="150" y="246" text-anchor="middle" font-size="12" fill="#b91c1c">重试 → 又扣一笔 → 双扣</text>

  <!-- 右：解决 -->
  <rect x="460" y="70" width="450" height="200" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="685" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">解决：带上同一把钥匙</text>

  <rect x="490" y="120" width="150" height="60" rx="8" fill="#fff"/>
  <text x="565" y="146" text-anchor="middle" font-size="13" fill="#334155">客户端</text>
  <rect x="700" y="120" width="180" height="60" rx="8" fill="#fff"/>
  <text x="790" y="146" text-anchor="middle" font-size="13" fill="#334155">服务端</text>
  <line x1="642" y1="147" x2="697" y2="147" stroke="#2563eb" stroke-width="2" marker-end="url(#arr4)"/>
  <text x="710" y="175" text-anchor="middle" font-size="11" fill="#1d4ed8">key="ord-1001-charge"</text>
  <text x="685" y="212" text-anchor="middle" font-size="12.5" fill="#1e3a8a">同一 key 再来 → 服务端查去重表 → 不再扣</text>
  <text x="685" y="238" text-anchor="middle" font-size="12" fill="#1e3a8a">重试 3 次，账本仍只有 1 笔</text>

  <!-- 底部：钥匙怎么造 -->
  <rect x="30" y="300" width="880" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="330" font-size="16" font-weight="bold" fill="#334155">钥匙（幂等键）怎么造：三个原则</text>

  <rect x="52" y="348" width="270" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="68" y="372" font-size="13.5" font-weight="bold" fill="#1e293b">① 业务唯一，不是你造的随机数</text>
  <text x="68" y="394" font-size="12" fill="#475569">同一笔业务的重试用同一个 key：</text>
  <text x="68" y="412" font-size="12" fill="#475569">"订单号-动作"，而不是随机 UUID</text>
  <text x="68" y="432" font-size="11" fill="#94a3b8">换 key = 新的一笔（M3d 已证）</text>

  <rect x="335" y="348" width="270" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="351" y="372" font-size="13.5" font-weight="bold" fill="#1e293b">② 在扣款前就要占位</text>
  <text x="351" y="394" font-size="12" fill="#475569">先登记"我要扣"，成功了才真扣</text>
  <text x="351" y="412" font-size="12" fill="#475569">先扣再登记 = 并发/重试照样双扣</text>
  <text x="395" y="432" font-size="11" fill="#94a3b8">（M3b vs M3c 已证）</text>

  <rect x="618" y="348" width="270" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="634" y="372" font-size="13.5" font-weight="bold" fill="#1e293b">③ 有生命周期，用完要想清楚</text>
  <text x="634" y="394" font-size="12" fill="#475569">挡"重试窗口"即可；长期保留防重放</text>
  <text x="634" y="412" font-size="12" fill="#475569">过期策略要匹配业务重试上限</text>
  <text x="634" y="432" font-size="11" fill="#94a3b8">去重表要加唯一约束，防并发</text>

  <text x="480" y="476" text-anchor="middle" font-size="13" fill="#64748b">幂等 = 让"再来一次"的成本等于零</text>
</svg>
