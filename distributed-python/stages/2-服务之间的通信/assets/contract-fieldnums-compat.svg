<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="940" height="660" fill="#ffffff"/>

  <text x="30" y="34" font-size="18" font-weight="700" fill="#111827">字段号：位置决定体积与兼容，名字只是注释</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">这一页两张图：上面看"字段号怎么编码"（为什么 1 和 2048 体积不同），下面看"哪些改动安全、哪些危险"。</text>

  <!-- 上：字段号编码 -->
  <rect x="30" y="78" width="880" height="218" rx="10" fill="#fdf4ff" stroke="#e9d5ff"/>
  <text x="48" y="104" font-size="13.5" font-weight="700" fill="#7e22ce">字节数随字段号长大：1 字节挡位（1-15）→ 2 字节挡位（16-2047）→ 3 字节（2048+）</text>

  <!-- 编号刻度条 -->
  <rect x="48" y="124" width="392" height="46" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <rect x="48" y="146" width="180" height="24" fill="#ddd6fe"/>
  <rect x="228" y="146" width="156" height="24" fill="#c4b5fd"/>
  <rect x="384" y="146" width="56" height="24" fill="#a78bfa"/>
  <text x="138" y="163" font-size="11" text-anchor="middle" fill="#4c1d95">1 ~ 15</text>
  <text x="297" y="163" font-size="10.5" text-anchor="middle" fill="#4c1d95">16 ~ 2047</text>
  <text x="412" y="163" font-size="10" text-anchor="middle" fill="#ffffff">2048+</text>
  <text x="48" y="186" font-size="10.5" fill="#7e22ce">挡位含义：挡位越高，每个字段头多占的字节越多；字段体（值本身）不变，差的是"位置"。</text>

  <!-- 实测值 -->
  <text x="48" y="222" font-size="12.5" font-weight="700" fill="#111827">实测：同一个 int32，值 = 1</text>
  <text x="48" y="246" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#4b5563">号 1    → 2 字节  (08 01)</text>
  <text x="48" y="266" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#4b5563">号 15   → 2 字节  (78 01)</text>
  <text x="48" y="286" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#4b5563">号 16   → 3 字节  (80 01 01)</text>
  <text x="48" y="306" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#4b5563">号 2048 → 4 字节  (80 80 01 01)</text>
  <text x="48" y="326" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#4b5563">号 500000 → 5 字节 (80 92 f4 01 01)</text>

  <!-- 影响 -->
  <rect x="470" y="218" width="422" height="62" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="486" y="240" font-size="12" fill="#5b21b6">· 每条消息字节差很小，但批量字段会叠加：1000 条字符串</text>
  <text x="486" y="260" font-size="12" fill="#5b21b6">  号 1→3.00 字节/条，号 2048→5.00 字节/条，差 67%</text>
  <text x="486" y="276" font-size="11" fill="#7e22ce">→ 新消息从 1 开始编号，别跳号，也别浪费 1-15 挡位</text>

  <!-- 下：兼容矩阵 -->
  <rect x="30" y="312" width="880" height="330" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="48" y="340" font-size="13.5" font-weight="700" fill="#047857">兼容矩阵：一次 proto 改动，要么安全、要么静默错位、要么当场失败</text>

  <!-- 表头 -->
  <rect x="48" y="356" width="200" height="34" fill="#a7f3d0"/>
  <text x="148" y="378" font-size="12" text-anchor="middle" font-weight="700" fill="#064e3b">改动</text>
  <rect x="248" y="356" width="212" height="34" fill="#a7f3d0"/>
  <text x="354" y="378" font-size="12" text-anchor="middle" font-weight="700" fill="#064e3b">能不能</text>
  <rect x="460" y="356" width="200" height="34" fill="#a7f3d0"/>
  <text x="560" y="378" font-size="12" text-anchor="middle" font-weight="700" fill="#064e3b">旧代码读到</text>
  <rect x="660" y="356" width="242" height="34" fill="#a7f3d0"/>
  <text x="781" y="378" font-size="12" text-anchor="middle" font-weight="700" fill="#064e3b">结论</text>

  <!-- 行1 加字段 -->
  <rect x="48" y="390" width="200" height="52" fill="#ffffff" stroke="#d1fae5"/>
  <text x="60" y="412" font-size="12" fill="#111827">加一个字段</text>
  <text x="60" y="430" font-size="11" fill="#6b7280">(用新的号)</text>
  <rect x="248" y="390" width="212" height="52" fill="#ecfdf5"/>
  <text x="354" y="417" font-size="12.5" text-anchor="middle" fill="#047857">✅ 兼容</text>
  <rect x="460" y="390" width="200" height="52" fill="#ecfdf5"/>
  <text x="560" y="417" font-size="11.5" text-anchor="middle" fill="#065f46">静默丢弃新字段</text>
  <rect x="660" y="390" width="242" height="52" fill="#ecfdf5"/>
  <text x="781" y="417" font-size="11.5" text-anchor="middle" fill="#065f46">安全，但注意 JSON 会丢</text>

  <!-- 行2 改名 -->
  <rect x="48" y="442" width="200" height="52" fill="#ffffff" stroke="#d1fae5"/>
  <text x="60" y="464" font-size="12" fill="#111827">只改字段名</text>
  <text x="60" y="482" font-size="11" fill="#6b7280">(号不变)</text>
  <rect x="248" y="442" width="212" height="52" fill="#ecfdf5"/>
  <text x="354" y="469" font-size="12.5" text-anchor="middle" fill="#047857">✅ 二进制兼容</text>
  <rect x="460" y="442" width="200" height="52" fill="#ecfdf5"/>
  <text x="560" y="469" font-size="11.5" text-anchor="middle" fill="#065f46">旧名照常读对（实测）</text>
  <rect x="660" y="442" width="242" height="52" fill="#fef3c7"/>
  <text x="781" y="459" font-size="11.5" text-anchor="middle" fill="#b45309">⚠️ JSON 侧直接抛错</text>
  <text x="781" y="477" font-size="11" text-anchor="middle" fill="#b45309">"wire 安全 ≠ JSON 安全"</text>

  <!-- 行3 改号 -->
  <rect x="48" y="494" width="200" height="52" fill="#ffffff" stroke="#fee2e2"/>
  <text x="60" y="516" font-size="12" fill="#991b1b">改字段号</text>
  <text x="60" y="534" font-size="11" fill="#6b7280">(值不变)</text>
  <rect x="248" y="494" width="212" height="52" fill="#fef2f2"/>
  <text x="354" y="521" font-size="12.5" text-anchor="middle" fill="#b91c1c">❌ 静默错位</text>
  <rect x="460" y="494" width="200" height="52" fill="#fef2f2"/>
  <text x="500" y="512" font-size="11.5" text-anchor="middle" fill="#b91c1c">读到默认 0</text>
  <text x="515" y="530" font-size="11" text-anchor="middle" fill="#b91c1c">(实测 1990→0)</text>
  <rect x="660" y="494" width="242" height="52" fill="#fee2e2"/>
  <text x="781" y="517" font-size="11.5" text-anchor="middle" fill="#b91c1c">不报错、数据变 —— 最危险</text>

  <!-- 行4 复用号 -->
  <rect x="48" y="546" width="200" height="52" fill="#ffffff" stroke="#fee2e2"/>
  <text x="60" y="568" font-size="12" fill="#991b1b">删字段后</text>
  <text x="60" y="586" font-size="11" fill="#6b7280">同号塞别的类型</text>
  <rect x="248" y="546" width="212" height="52" fill="#fef2f2"/>
  <text x="354" y="573" font-size="12.5" text-anchor="middle" fill="#b91c1c">❌ 静默错位</text>
  <rect x="460" y="546" width="200" height="52" fill="#fef2f2"/>
  <text x="500" y="564" font-size="11.5" text-anchor="middle" fill="#b91c1c">bool True → 读成</text>
  <text x="500" y="582" font-size="11.5" text-anchor="middle" fill="#b91c1c">金额 1 (实测)</text>
  <rect x="660" y="546" width="242" height="52" fill="#fee2e2"/>
  <text x="781" y="569" font-size="11.5" text-anchor="middle" fill="#b91c1c">必须 reserved 保住号</text>

  <text x="30" y="648" font-size="11.5" fill="#9ca3af">读法：上面记"号是位置、位置决定体积"；下面记"改号、复用号会静默错位，加号、改名（仅二进制）安全"。判断一次改动，先问改动的是"号"还是"名"。</text>
</svg>
