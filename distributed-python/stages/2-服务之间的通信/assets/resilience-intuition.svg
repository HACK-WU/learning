<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#64748b"/></marker>
    <marker id="a1r" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">下游垮了，为什么上游也跟着垮？</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#64748b">一个人排不上队，全店都瘫痪 —— 这节课讲怎么把坏掉的那一段隔在门外</text>

  <!-- 左：问题 -->
  <rect x="40" y="88" width="410" height="330" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="245" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">现在：一个坏了，全都坏</text>

  <rect x="72" y="136" width="110" height="52" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
  <text x="127" y="158" text-anchor="middle" font-size="13" fill="#7f1d1d">用户请求</text>
  <text x="127" y="176" text-anchor="middle" font-size="12" fill="#dc2626">还在源源不断</text>

  <rect x="222" y="136" width="196" height="52" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
  <text x="320" y="158" text-anchor="middle" font-size="13" fill="#7f1d1d">你的服务：8 个干活的位子</text>
  <text x="320" y="176" text-anchor="middle" font-size="12" fill="#dc2626">全被"替下游等"占满了</text>

  <rect x="222" y="216" width="196" height="52" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
  <text x="320" y="238" text-anchor="middle" font-size="13" fill="#7f1d1d">下游：卡住不回</text>
  <text x="320" y="256" text-anchor="middle" font-size="12" fill="#dc2626">每次都要等满 1 秒</text>

  <rect x="72" y="216" width="110" height="52" rx="8" fill="#fee2e2" stroke="#f87171" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="127" y="238" text-anchor="middle" font-size="12" fill="#b91c1c">排队的人</text>
  <text x="127" y="256" text-anchor="middle" font-size="12" fill="#b91c1c">越积越多</text>

  <line x1="182" y1="162" x2="218" y2="162" stroke="#dc2626" stroke-width="2" marker-end="url(#a1r)"/>
  <line x1="320" y1="188" x2="320" y2="212" stroke="#dc2626" stroke-width="2" marker-end="url(#a1r)"/>
  <line x1="218" y1="242" x2="186" y2="242" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a1r)"/>

  <rect x="72" y="296" width="346" height="100" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <text x="86" y="318" font-size="13" font-weight="bold" fill="#7f1d1d">下游恢复了，你也好不了</text>
  <text x="86" y="340" font-size="12" fill="#475569">· 8 个位子还卡在上一批死等的调用里</text>
  <text x="86" y="360" font-size="12" fill="#475569">· 新来的请求连"碰一下下游"的机会都没有</text>
  <text x="86" y="380" font-size="12" fill="#475569">· 下游明明只要 20ms，用户还是全超时</text>

  <!-- 右：解法 -->
  <rect x="510" y="88" width="410" height="330" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="715" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">本课：三道门，一进一出</text>

  <rect x="540" y="136" width="350" height="46" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="556" y="156" font-size="13" font-weight="bold" fill="#14532d">① 进门先数人头</text>
  <text x="556" y="173" font-size="12" fill="#166534">这一秒只放 10 个进来，多的直接挡回去</text>

  <rect x="540" y="192" width="350" height="46" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="556" y="212" font-size="13" font-weight="bold" fill="#14532d">② 每人只准占一个位子</text>
  <text x="556" y="229" font-size="12" fill="#166534">查商品的最多占 3 个，不许挤掉下单的</text>

  <rect x="540" y="248" width="350" height="46" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="556" y="268" font-size="13" font-weight="bold" fill="#14532d">③ 连续失败就别再敲了</text>
  <text x="556" y="285" font-size="12" fill="#166534">先关门 0.5 秒，再放一个人去试试</text>

  <rect x="540" y="308" width="350" height="88" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="556" y="330" font-size="13" font-weight="bold" fill="#14532d">结果</text>
  <text x="556" y="352" font-size="12" fill="#475569">· 那些"不依赖坏下游"的功能照常可用</text>
  <text x="556" y="372" font-size="12" fill="#475569">· 下游一恢复，你立刻能接住（不用等队列排空）</text>
</svg>
