<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="940" height="620" fill="#ffffff"/>

  <text x="30" y="34" font-size="18" font-weight="700" fill="#111827">gRPC 的四种调用形态：消息的次数决定选型</text>
  <text x="30" y="56" font-size="12" fill="#6b7280">每一行只回答一个问题：这一次调用，客户端发几条、服务端回几条。选错形态 = 用错工具，不是写法问题。</text>

  <!-- 每行一个形态 -->
  <!-- 行1 一元 -->
  <rect x="30" y="78" width="880" height="118" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="46" y="92" width="196" height="42" rx="8" fill="#2563eb"/>
  <text x="144" y="118" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">一元 unary</text>

  <text x="46" y="158" font-size="12" fill="#1e40af">形态：1 条请求 → 1 条响应。你大概已经会了——它和一次普通函数调用一模一样。</text>
  <text x="46" y="178" font-size="12" fill="#4b5563">  · 场景：查单个订单、扣款、登录校验——"给我一条，我还你一条"</text>

  <rect x="272" y="96" width="300" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <line x1="452" y1="126" x2="452" y2="156" stroke="#93c5fd"/>
  <line x1="392" y1="126" x2="392" y2="156" stroke="#93c5fd"/>
  <text x="332" y="140" font-size="11.5" text-anchor="middle" fill="#1e3a8a">1 条</text>
  <text x="572" y="140" font-size="11.5" text-anchor="middle" fill="#1e3a8a">1 条</text>

  <!-- 行2 服务端流 -->
  <rect x="30" y="206" width="880" height="130" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="46" y="220" width="196" height="42" rx="8" fill="#059669"/>
  <text x="144" y="246" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">服务端流 server streaming</text>

  <text x="46" y="286" font-size="12" fill="#065f46">形态：1 条请求 → N 条响应，一条路上发完，不拆多段。</text>
  <text x="46" y="306" font-size="12" fill="#4b5563">  · 场景：拉用户最近 1 万条订单、订阅一批数据、把一个大集合分块吐给客户端</text>

  <rect x="272" y="224" width="330" height="72" rx="8" fill="#ffffff" stroke="#86efac"/>
  <polygon points="272,260 290,254 290,266" fill="#059669"/>
  <polygon points="452,260 470,254 470,266 452,260 452,266 470,260" fill="#059669" transform="translate(150,0)"/>
  <polygon points="452,260 470,254 470,266 452,260 452,266 470,260" fill="#059669" transform="translate(90,0)"/>
  <text x="302" y="250" font-size="11" fill="#065f46">1 条请求</text>
  <text x="520" y="250" font-size="11" fill="#065f46">N 条响应（顺序保证）</text>
  <text x="282" y="286" font-size="10.5" fill="#6b7280">本例实测：1 请求 → 1000 条，严格按发序到达</text>

  <!-- 行3 客户端流 -->
  <rect x="30" y="346" width="880" height="118" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="46" y="360" width="196" height="42" rx="8" fill="#dc2626"/>
  <text x="144" y="386" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">客户端流 client streaming</text>

  <text x="46" y="426" font-size="12" fill="#991b1b">形态：N 条请求 → 1 条响应，客户端一条条发，服务端收完才回。</text>
  <text x="46" y="446" font-size="12" fill="#4b5563">  · 场景：上传一批数据让服务端统计、批量建订单、把稀疏数据流式灌给下游</text>

  <rect x="272" y="364" width="330" height="62" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <polygon points="272,396 290,390 290,402" fill="#dc2626"/>
  <polygon points="452,396 470,390 470,402 452,396 452,402 470,396" fill="#dc2626" transform="translate(120,0)"/>
  <polygon points="452,396 470,390 470,402 452,396 452,402 470,396" fill="#dc2626" transform="translate(60,0)"/>
  <text x="302" y="386" font-size="11" fill="#991b1b">N 条请求</text>
  <text x="500" y="412" font-size="11" fill="#991b1b">服务端收完，回 1 条</text>

  <!-- 行4 双向流 -->
  <rect x="30" y="474" width="880" height="146" rx="10" fill="#faf5ff" stroke="#d8b4fe"/>
  <rect x="46" y="488" width="196" height="42" rx="8" fill="#7c3aed"/>
  <text x="144" y="514" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">双向流 bidirectional</text>

  <text x="46" y="556" font-size="12" fill="#5b21b6">形态：N 条请求 ↔ M 条响应，两个方向各自独立流动，可以一边发一边收。</text>
  <text x="46" y="576" font-size="12" fill="#4b5563">  · 场景：对话（一问一答交互）、长连接里的心跳、实时对账</text>
  <text x="46" y="598" font-size="12" fill="#4b5563">  · 关键：两个流互相独立——服务端可以等客户端全发完再一次性回（本例实测），也可以边收边回；不保证请求响应"配对"</text>

  <rect x="272" y="500" width="360" height="72" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="292" y="524" font-size="11" fill="#6d28d9">客户端 →→→→→</text>
  <text x="292" y="548" font-size="11" fill="#6d28d9">客户端 ←←←←←</text>
  <text x="540" y="524" font-size="10.5" fill="#6b7280">两个箭头各自独立</text>
  <text x="292" y="566" font-size="10.5" fill="#6b7280">流内顺序各自保留（本课实测双向流首条 0.98 ms）</text>

  <text x="30" y="640" font-size="11.5" fill="#9ca3af" >（图高预留）读法：从"我这一次要发几条、收几条"出发查形状，就能选对形态。别被"REST 每个接口都是一条"绑住。</text>
</svg>
