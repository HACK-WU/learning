<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="g2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#1e8449"/>
    </marker>
  </defs>

  <rect width="980" height="700" fill="#fbfbf9"/>
  <text x="490" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1c2833">gRPC 的负载均衡：按连接分 vs 按请求分</text>
  <text x="490" y="62" text-anchor="middle" font-size="13" fill="#7f8c8d">HTTP/2 把几百个 RPC 塞进一条连接——只看连接的 LB 会把整包转发给同一个实例</text>

  <!-- 上：L4 -->
  <rect x="30" y="84" width="920" height="252" rx="10" fill="#fdf2f0" stroke="#e8b4ac" stroke-width="1.5"/>
  <text x="52" y="110" font-size="15" font-weight="700" fill="#a93226">L4 负载均衡（只看 TCP 连接）：等于按客户端分配实例</text>

  <!-- 客户端 A -->
  <rect x="56" y="128" width="150" height="66" rx="7" fill="#fff" stroke="#d5a6a0"/>
  <text x="131" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#2c3e50">客户端 A</text>
  <text x="131" y="170" text-anchor="middle" font-size="11" fill="#c0392b">90 个 RPC</text>
  <text x="131" y="186" text-anchor="middle" font-size="10" fill="#7f8c8d">塞在 1 条连接里</text>

  <!-- 客户端 B..F -->
  <rect x="56" y="206" width="150" height="66" rx="7" fill="#fff" stroke="#d5a6a0"/>
  <text x="131" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#2c3e50">客户端 B~F</text>
  <text x="131" y="248" text-anchor="middle" font-size="11" fill="#566573">各 2 个 RPC</text>
  <text x="131" y="264" text-anchor="middle" font-size="10" fill="#7f8c8d">5 条连接</text>

  <!-- 连接箭头 -->
  <line x1="206" y1="161" x2="292" y2="161" stroke="#c0392b" stroke-width="2.4"/>
  <text x="249" y="153" text-anchor="middle" font-size="10" fill="#c0392b">1 条连接</text>
  <line x1="206" y1="239" x2="292" y2="239" stroke="#c0392b" stroke-width="1.6"/>

  <!-- L4 盒子 -->
  <rect x="292" y="128" width="130" height="144" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="1.8"/>
  <text x="357" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#a93226">L4 LB</text>
  <text x="357" y="200" text-anchor="middle" font-size="11" fill="#7b241c">只看到"连接"</text>
  <text x="357" y="220" text-anchor="middle" font-size="11" fill="#7b241c">看不到 RPC 边界</text>
  <text x="357" y="244" text-anchor="middle" font-size="10" fill="#7b241c">一条连接 → 一个实例</text>

  <!-- 到后端 -->
  <line x1="422" y1="161" x2="512" y2="161" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="422" y1="200" x2="512" y2="200" stroke="#7f8c8d" stroke-width="1.4"/>
  <line x1="422" y1="239" x2="512" y2="239" stroke="#7f8c8d" stroke-width="1.4"/>

  <!-- 后端 -->
  <rect x="512" y="140" width="130" height="44" rx="7" fill="#fadbd8" stroke="#c0392b" stroke-width="1.6"/>
  <text x="577" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#a93226">实例 n1</text>
  <text x="577" y="176" text-anchor="middle" font-size="10" fill="#7b241c">90 + 2 = 92 次</text>

  <rect x="512" y="190" width="130" height="30" rx="7" fill="#f2f3f4" stroke="#bdc3c7"/>
  <text x="577" y="210" text-anchor="middle" font-size="11" fill="#95a5a6">实例 n2 · 4 次</text>

  <rect x="512" y="228" width="130" height="30" rx="7" fill="#f2f3f4" stroke="#bdc3c7"/>
  <text x="577" y="248" text-anchor="middle" font-size="11" fill="#95a5a6">实例 n3 · 4 次</text>

  <!-- 实测框 -->
  <rect x="668" y="140" width="258" height="130" rx="8" fill="#fff" stroke="#d5a6a0"/>
  <text x="686" y="164" font-size="12" font-weight="700" fill="#a93226">本机实测（真实 grpcio 1.85.1）</text>
  <text x="686" y="188" font-size="11" fill="#2c3e50" font-family="monospace">轮 1：1 客户端 12 RPC</text>
  <text x="686" y="206" font-size="11" fill="#c0392b" font-family="monospace">      → 12 / 0 / 0</text>
  <text x="686" y="228" font-size="11" fill="#2c3e50" font-family="monospace">轮 3：1 重 + 5 轻（共 100）</text>
  <text x="686" y="246" font-size="11" fill="#c0392b" font-family="monospace">      → 92 / 4 / 4（92.0%）</text>
  <text x="686" y="264" font-size="10" fill="#7f8c8d">倾斜 2.76 倍，另外两台闲着</text>

  <!-- 下：per-call -->
  <rect x="30" y="358" width="920" height="224" rx="10" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="52" y="384" font-size="15" font-weight="700" fill="#1e8449">按每次调用选（per-call）：同一条连接里的 RPC 被逐个分开</text>

  <rect x="56" y="404" width="150" height="66" rx="7" fill="#fff" stroke="#a9d3b4"/>
  <text x="131" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#2c3e50">客户端 A</text>
  <text x="131" y="446" text-anchor="middle" font-size="11" fill="#1e8449">90 个 RPC</text>
  <text x="131" y="462" text-anchor="middle" font-size="10" fill="#7f8c8d">仍是 1 条连接</text>

  <line x1="206" y1="437" x2="292" y2="437" stroke="#1e8449" stroke-width="2.2"/>
  <text x="249" y="429" text-anchor="middle" font-size="10" fill="#1e8449">1 条连接</text>

  <rect x="292" y="404" width="130" height="66" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.8"/>
  <text x="357" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#145a32">per-call 选择</text>
  <text x="357" y="452" text-anchor="middle" font-size="10" fill="#145a32">每个 RPC 各自选</text>

  <line x1="422" y1="424" x2="512" y2="424" stroke="#1e8449" stroke-width="1.8" marker-end="url(#g2)"/>
  <line x1="422" y1="437" x2="512" y2="437" stroke="#1e8449" stroke-width="1.8" marker-end="url(#g2)"/>
  <line x1="422" y1="450" x2="512" y2="450" stroke="#1e8449" stroke-width="1.8" marker-end="url(#g2)"/>

  <rect x="512" y="404" width="130" height="30" rx="7" fill="#d5f5e3" stroke="#27ae60"/>
  <text x="577" y="424" text-anchor="middle" font-size="11" fill="#1e8449">n1 · 30 次</text>
  <rect x="512" y="440" width="130" height="30" rx="7" fill="#d5f5e3" stroke="#27ae60"/>
  <text x="577" y="460" text-anchor="middle" font-size="11" fill="#1e8449">n2 · 30 次</text>

  <rect x="668" y="404" width="258" height="66" rx="8" fill="#fff" stroke="#a9d3b4"/>
  <text x="686" y="426" font-size="11" font-weight="700" fill="#1e8449">实测（same 3 backends）</text>
  <text x="686" y="446" font-size="11" fill="#2c3e50" font-family="monospace">pick_first → 12 / 0 / 0</text>
  <text x="686" y="462" font-size="11" fill="#1e8449" font-family="monospace">round_robin → 4 / 4 / 4</text>

  <!-- 两条正路 -->
  <rect x="56" y="492" width="420" height="74" rx="8" fill="#fff" stroke="#a9d3b4"/>
  <text x="266" y="514" text-anchor="middle" font-size="12" font-weight="700" fill="#1e8449">正路 ①：客户端自己做</text>
  <text x="266" y="534" text-anchor="middle" font-size="11" fill="#2c3e50">配 round_robin / P2C，拿全量地址</text>
  <text x="266" y="552" text-anchor="middle" font-size="10" fill="#7f8c8d">代价：复杂度 × 调用方数量，升级要所有人一起改</text>

  <rect x="494" y="492" width="432" height="74" rx="8" fill="#fff" stroke="#a9d3b4"/>
  <text x="710" y="514" text-anchor="middle" font-size="12" font-weight="700" fill="#1e8449">正路 ②：L7 代理替你做</text>
  <text x="710" y="534" text-anchor="middle" font-size="11" fill="#2c3e50">代理看懂 HTTP/2，把连接里的每个 RPC 分开转发</text>
  <text x="710" y="552" text-anchor="middle" font-size="10" fill="#7f8c8d">代价：多一跳（回环实测约 1.9 倍单次开销）+ 一个要运维的组件</text>

  <!-- 底部 -->
  <rect x="30" y="600" width="920" height="76" rx="10" fill="#eef4fb" stroke="#b6cde8"/>
  <text x="490" y="626" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">唯一不能指望的是"L4 能自动摊平 gRPC"——它看不到 RPC 的边界</text>
  <text x="490" y="650" text-anchor="middle" font-size="12" fill="#2c3e50">还有一个隐藏坑：gRPC 默认策略是 pick_first，不是轮询。传 3 个地址 ≠ 用 3 个实例。</text>
  <text x="490" y="670" text-anchor="middle" font-size="11" fill="#7f8c8d">官方备注：grpclb 已 deprecated，推荐改用 xDS 或 L7 代理</text>
</svg>
