<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar4c" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="ar4cGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="920" height="480" fill="#ffffff"/>

  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">偏差只要大于单程延迟，按墙钟排序就必然倒挂</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#57606a">同一个逻辑顺序，两条时间轴：上面是真实时间，下面是两块表各自写下的读数</text>

  <text x="60" y="88" font-size="12" font-weight="700" fill="#065f46">① 真实时间轴（物理事实）</text>

  <line x1="70" y1="126" x2="870" y2="126" stroke="#059669" stroke-width="1.6"/>
  <polygon points="870,126 860,122 860,130" fill="#059669"/>

  <circle cx="250" cy="126" r="7" fill="#059669"/>
  <circle cx="430" cy="126" r="7" fill="#059669"/>
  <line x1="250" y1="108" x2="250" y2="118" stroke="#059669" stroke-width="1.4"/>
  <line x1="430" y1="108" x2="430" y2="118" stroke="#059669" stroke-width="1.4"/>
  <line x1="250" y1="142" x2="430" y2="142" stroke="#059669" stroke-width="1.4" marker-end="url(#ar4cGreen)"/>
  <text x="340" y="160" text-anchor="middle" font-size="10.5" fill="#065f46">真实单程 15.1 微秒</text>

  <text x="250" y="100" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">A 发出</text>
  <text x="430" y="100" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">B 收到</text>

  <text x="250" y="182" text-anchor="middle" font-size="10" fill="#6b7280">t = 1000.0 μs</text>
  <text x="430" y="182" text-anchor="middle" font-size="10" fill="#6b7280">t = 1015.1 μs</text>

  <rect x="70" y="196" width="800" height="30" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="86" y="216" font-size="10.5" fill="#065f46">因果正常：发出在收到之前 15.1 微秒 —— 这是唯一正确的事实</text>

  <line x1="60" y1="248" x2="880" y2="248" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="470" y="242" text-anchor="middle" font-size="10" fill="#9ca3af">下面是按"两块表各自的读数"记下来的样子</text>

  <text x="60" y="276" font-size="12" font-weight="700" fill="#991b1b">② 墙钟读数轴（A 的表快了 2008 微秒）</text>

  <line x1="70" y1="318" x2="870" y2="318" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="870,318 860,314 860,322" fill="#dc2626"/>

  <circle cx="560" cy="318" r="7" fill="#dc2626"/>
  <circle cx="430" cy="318" r="7" fill="#dc2626"/>
  <line x1="560" y1="300" x2="560" y2="310" stroke="#dc2626" stroke-width="1.4"/>
  <line x1="430" y1="300" x2="430" y2="310" stroke="#dc2626" stroke-width="1.4"/>

  <text x="560" y="292" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">A 记下的"发出"</text>
  <text x="430" y="292" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">B 记下的"收到"</text>

  <text x="560" y="340" text-anchor="middle" font-size="10" fill="#6b7280">t = 3008.0 μs</text>
  <text x="430" y="340" text-anchor="middle" font-size="10" fill="#6b7280">t = 1015.1 μs</text>

  <path d="M430,352 Q495,378 560,352" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <text x="495" y="392" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">倒挂 1992.9 微秒</text>
  <text x="495" y="408" text-anchor="middle" font-size="10" fill="#991b1b">排序结果：收到 早于 发出</text>

  <rect x="70" y="420" width="800" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="86" y="439" font-size="10.5" font-weight="700" fill="#991b1b">判据：比较两个钟的读数之前，先问"这两个读数之间的差，是不是大于这块表自己的误差"</text>
  <text x="86" y="457" font-size="10.5" fill="#1f2937">15.1 微秒 ＜ 2008 微秒 —— 不大于，所以这个比较没有信息量。倒挂量 1992.9 微秒 ≈ 偏差 2008 减 单程 15.1</text>
</svg>
