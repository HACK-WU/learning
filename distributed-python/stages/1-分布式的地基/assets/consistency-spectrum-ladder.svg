<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="940" height="700" fill="#ffffff"/>

  <text x="470" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">一致性不是开关，是一条可以逐档下降的阶梯</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#57606a">从上往下读：每往下一档，你放弃一条能用自然语言说清的保证，换回延迟或可用性（越往上保证越强、代价越大）</text>

  <text x="40" y="74" font-size="10.5" font-weight="700" fill="#6b7280">档位</text>
  <text x="306" y="74" font-size="10.5" font-weight="700" fill="#6b7280">承诺（人话）</text>
  <text x="644" y="74" font-size="10.5" font-weight="700" fill="#6b7280">放弃了什么 / 换回了什么</text>

  <line x1="22" y1="556" x2="22" y2="90" stroke="#9ca3af" stroke-width="1.2"/>
  <polygon points="22,82 18,92 26,92" fill="#9ca3af"/>

  <rect x="40" y="82" width="258" height="72" rx="6" fill="#1e3a8a" stroke="#1e3a8a"/>
  <text x="56" y="106" font-size="13" font-weight="700" fill="#ffffff">线性一致</text>
  <text x="56" y="123" font-size="9.5" fill="#bfdbfe">linearizable ＝ CAP 里的 C</text>
  <text x="56" y="142" font-size="9.5" fill="#dbeafe">最强的一档，也是最贵的一档</text>
  <rect x="306" y="82" width="330" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="318" y="104" font-size="10.5" fill="#1f2937">所有操作像在单个副本上、按某个全序原子执行</text>
  <text x="318" y="121" font-size="10.5" fill="#1f2937">写一返回，任何节点上的读都必须看到它</text>
  <text x="318" y="140" font-size="9.5" fill="#475569">"某个瞬间完成"是它的全部含义，不谈快慢</text>
  <rect x="644" y="82" width="270" height="72" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="656" y="104" font-size="10.5" fill="#7f1d1d">放弃分区时的可用性（少数派拒写）</text>
  <text x="656" y="121" font-size="10.5" fill="#7f1d1d">放弃跨地域的低延迟：写要等一个 RTT</text>
  <text x="656" y="140" font-size="9.5" font-weight="700" fill="#991b1b">本课实测 20.6 ms/次（同机两副本）</text>

  <rect x="40" y="162" width="258" height="72" rx="6" fill="#2563eb" stroke="#2563eb"/>
  <text x="56" y="186" font-size="13" font-weight="700" fill="#ffffff">顺序一致</text>
  <text x="56" y="203" font-size="9.5" fill="#bfdbfe">sequential consistency</text>
  <text x="56" y="222" font-size="9.5" fill="#dbeafe">顺序统一了，但不再是"真实时间"</text>
  <rect x="306" y="162" width="330" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="318" y="184" font-size="10.5" fill="#1f2937">所有节点看到相同的操作顺序</text>
  <text x="318" y="201" font-size="10.5" fill="#1f2937">但这个顺序不必与真实时钟一致</text>
  <text x="318" y="220" font-size="9.5" fill="#475569">单主 + 有序复制就能做到</text>
  <rect x="644" y="162" width="270" height="72" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="656" y="184" font-size="10.5" fill="#7f1d1d">放弃实时性</text>
  <text x="656" y="201" font-size="10.5" fill="#7f1d1d">"写返回后立刻读"不再有保证</text>
  <text x="656" y="220" font-size="9.5" fill="#b91c1c">进程内的程序顺序仍保，跨进程先后不再对应真实时刻</text>

  <rect x="40" y="242" width="258" height="72" rx="6" fill="#0891b2" stroke="#0891b2"/>
  <text x="56" y="266" font-size="13" font-weight="700" fill="#ffffff">因果一致</text>
  <text x="56" y="283" font-size="9.5" fill="#cffafe">causal consistency</text>
  <text x="56" y="302" font-size="9.5" fill="#ecfeff">只保证"有影响的"那个顺序</text>
  <rect x="306" y="242" width="330" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="318" y="264" font-size="10.5" fill="#1f2937">有因果关系的操作，所有人看到的顺序一致</text>
  <text x="318" y="281" font-size="10.5" fill="#1f2937">并发的操作，允许不同节点看到不同顺序</text>
  <text x="318" y="300" font-size="9.5" fill="#475569">"回复必须在原帖之后"靠这一档就够</text>
  <rect x="644" y="242" width="270" height="72" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="656" y="264" font-size="10.5" fill="#7c2d12">放弃全局全序</text>
  <text x="656" y="281" font-size="10.5" fill="#7c2d12">要判因果就得带向量，占 N 个整数</text>
  <text x="656" y="300" font-size="9.5" font-weight="700" fill="#9a3412">N=100 时每条消息 800 B（见上一张图）</text>

  <rect x="40" y="322" width="258" height="72" rx="6" fill="#059669" stroke="#059669"/>
  <text x="56" y="346" font-size="13" font-weight="700" fill="#ffffff">单调读</text>
  <text x="56" y="363" font-size="9.5" fill="#a7f3d0">monotonic reads</text>
  <text x="56" y="382" font-size="9.5" fill="#d1fae5">只管一件事：时间不倒流</text>
  <rect x="306" y="322" width="330" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="318" y="344" font-size="10.5" fill="#1f2937">同一个用户连续读，后一次不会比前一次更旧</text>
  <text x="318" y="361" font-size="10.5" fill="#1f2937">做到的办法很朴素：把这个用户钉在一个副本上</text>
  <text x="318" y="380" font-size="9.5" fill="#475569">不保证新，只保证"不回退"</text>
  <rect x="644" y="322" width="270" height="72" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="656" y="344" font-size="10.5" fill="#7c2d12">放弃最新性：可能一直读到旧值</text>
  <text x="656" y="361" font-size="10.5" fill="#7c2d12">本课实测：挡住了倒流，但读到 100</text>
  <text x="656" y="380" font-size="9.5" font-weight="700" fill="#9a3412">而主库此刻已经是 300</text>

  <rect x="40" y="402" width="258" height="72" rx="6" fill="#d97706" stroke="#d97706"/>
  <text x="56" y="426" font-size="13" font-weight="700" fill="#ffffff">读你所写</text>
  <text x="56" y="443" font-size="9.5" fill="#fde68a">read-your-writes</text>
  <text x="56" y="462" font-size="9.5" fill="#fef3c7">只对自己负责的那一档</text>
  <rect x="306" y="402" width="330" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="318" y="424" font-size="10.5" fill="#1f2937">自己写完，自己一定读得到自己的写</text>
  <text x="318" y="441" font-size="10.5" fill="#1f2937">实现方式：会话粘性，或写后一段时间强制读主</text>
  <text x="318" y="460" font-size="9.5" fill="#475569">用户视角里"我提交了却没显示"多半缺这一条</text>
  <rect x="644" y="402" width="270" height="72" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="656" y="424" font-size="10.5" fill="#7c2d12">放弃别人的写：他人可能还看不到</text>
  <text x="656" y="441" font-size="10.5" fill="#7c2d12">也放弃"换台设备还能读到"</text>
  <text x="656" y="460" font-size="9.5" fill="#9a3412">跨设备要提高一档：写后强制读主</text>

  <rect x="40" y="482" width="258" height="72" rx="6" fill="#6b7280" stroke="#6b7280"/>
  <text x="56" y="506" font-size="13" font-weight="700" fill="#ffffff">最终一致</text>
  <text x="56" y="523" font-size="9.5" fill="#e5e7eb">eventual consistency</text>
  <text x="56" y="542" font-size="9.5" fill="#f3f4f6">最便宜的一档，也是最容易误用的一档</text>
  <rect x="306" y="482" width="330" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="318" y="504" font-size="10.5" fill="#1f2937">只要不再写新值，副本最终会变成一样的</text>
  <text x="318" y="521" font-size="10.5" fill="#1f2937">"最终"指有限时间后，不指某个具体时长</text>
  <text x="318" y="540" font-size="9.5" fill="#475569">DNS、点赞数、商品浏览量常停在这一档</text>
  <rect x="644" y="482" width="270" height="72" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="656" y="504" font-size="10.5" fill="#7f1d1d">放弃上面全部，且"最终"没有时间上界</text>
  <text x="656" y="521" font-size="10.5" fill="#7f1d1d">本课实测：写后立刻读 50/50 陈旧</text>
  <text x="656" y="540" font-size="9.5" font-weight="700" fill="#991b1b">写耗时 20.60 ms → 0.00 ms，这就是价格</text>

  <rect x="26" y="570" width="888" height="118" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="42" y="590" font-size="11.5" font-weight="700" fill="#1f2328">这张图要横着读，不要只记住最上面和最下面两档</text>
  <text x="42" y="610" font-size="10.5" fill="#1f2937">横着读的结论：从线性一致降到最终一致，换回的是"写不用等副本" —— 本课 M9 实测，这个价格是 20.6 毫秒/次。</text>
  <text x="42" y="628" font-size="10.5" fill="#1f2937">同时"写后立刻读陈旧"从 0/50 变成 50/50：那 20.6 毫秒买的就是"读得到自己刚写的"。</text>
  <text x="42" y="650" font-size="10.5" fill="#9a3412">CAP 只谈最上面那一档与可用性的取舍，下面四档 CAP 一个字都没说 —— 所以"我们是 CP 系统"的信息量很小。</text>
  <text x="42" y="670" font-size="10.5" fill="#9a3412">PACELC 补上 CAP 不谈的一半：即使没有分区（E），你仍在延迟（L）与一致（C）之间逐次取舍。</text>
</svg>
