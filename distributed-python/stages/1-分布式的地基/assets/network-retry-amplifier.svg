<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar3d" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">每层重试 3 次，三层叠出 27 倍</text>
  <text x="450" y="56" text-anchor="middle" font-size="12.5" fill="#57606a">放大是乘法不是加法：叶子收到 N^L 次，全链路总数还要再加</text>

  <rect x="356" y="76" width="188" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="450" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">1 个用户请求</text>

  <line x1="450" y1="116" x2="450" y2="140" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar3d)"/>
  <text x="462" y="134" font-size="10" fill="#6b7280">失败后重试 3 次</text>

  <rect x="130" y="148" width="220" height="48" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="240" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">服务层 A</text>
  <text x="240" y="185" text-anchor="middle" font-size="10" fill="#374151">收到 1 次，发出 3 次</text>

  <rect x="360" y="148" width="180" height="48" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="450" y="168" text-anchor="middle" font-size="10.5" fill="#1e40af">A 的第 1 次尝试</text>
  <text x="450" y="185" text-anchor="middle" font-size="10" fill="#6b7280">往下走</text>

  <rect x="550" y="148" width="220" height="48" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="660" y="168" text-anchor="middle" font-size="10.5" fill="#1e40af">A 的第 2、3 次尝试</text>
  <text x="660" y="185" text-anchor="middle" font-size="10" fill="#6b7280">重试产生</text>

  <line x1="240" y1="196" x2="240" y2="224" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ar3d)"/>
  <line x1="450" y1="196" x2="450" y2="224" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ar3d)"/>
  <line x1="660" y1="196" x2="660" y2="224" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ar3d)"/>

  <rect x="86" y="232" width="308" height="48" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="240" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">服务层 B</text>
  <text x="240" y="269" text-anchor="middle" font-size="10" fill="#374151">收到 3 次，发出 9 次</text>

  <rect x="420" y="232" width="340" height="48" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="590" y="252" text-anchor="middle" font-size="10.5" fill="#1e40af">这一层看到的已经是抓到的 3 倍量</text>
  <text x="590" y="269" text-anchor="middle" font-size="10" fill="#6b7280">它自己也重试 3 次，于是 3 × 3 = 9</text>

  <line x1="240" y1="280" x2="240" y2="308" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ar3d)"/>

  <rect x="86" y="316" width="308" height="48" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="240" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">服务层 C</text>
  <text x="240" y="353" text-anchor="middle" font-size="10" fill="#374151">收到 9 次，发出 27 次</text>

  <line x1="240" y1="364" x2="240" y2="392" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar3d)"/>

  <rect x="86" y="400" width="308" height="60" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">真正写库的那一层</text>
  <text x="240" y="441" text-anchor="middle" font-size="11" fill="#7f1d1d">收到 27 次同样的请求</text>
  <text x="240" y="455" text-anchor="middle" font-size="9.5" fill="#6b7280">3^3 = 27；如果没幂等，就写 27 次</text>

  <rect x="420" y="316" width="452" height="144" rx="8" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="436" y="338" font-size="11.5" font-weight="700" fill="#1e3a8a">全链路总共跑了多少请求（本课实测）</text>

  <text x="436" y="360" font-size="10.5" fill="#1f2937">1 层：叶子 3 次　全链路 1+3 = <tspan font-weight="700" fill="#1e40af">4</tspan> 次</text>
  <text x="436" y="382" font-size="10.5" fill="#1f2937">2 层：叶子 9 次　全链路 1+3+9 = <tspan font-weight="700" fill="#1e40af">13</tspan> 次</text>
  <text x="436" y="404" font-size="10.5" fill="#1f2937">3 层：叶子 27 次　全链路 1+3+9+27 = <tspan font-weight="700" fill="#1e40af">40</tspan> 次</text>

  <text x="436" y="428" font-size="10" fill="#6b7280">一个用户点击，链路上跑过 40 个 HTTP 请求。</text>
  <text x="436" y="444" font-size="10" fill="#991b1b">其中 27 个都会打到同一个写库接口上。</text>

  <rect x="24" y="476" width="852" height="70" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="44" y="497" font-size="11.5" font-weight="700" fill="#92400e">所以业界的做法是"只在一层重试"</text>
  <text x="44" y="516" font-size="10.5" fill="#1f2937">通常是离用户最近那层（或独立 sidecar），中间层把失败原样往上抛，让上层决定。</text>
  <text x="44" y="534" font-size="10.5" fill="#1f2937">如果每层都"好心"重试一次，好心会相乘——这就是重试放大器。</text>
</svg>
