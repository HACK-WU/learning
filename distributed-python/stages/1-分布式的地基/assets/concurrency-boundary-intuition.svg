<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 476" width="920" height="476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="920" height="476" fill="#ffffff"/>

  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">同样的活儿，卡住的地方不一样</text>
  <text x="460" y="55" text-anchor="middle" font-size="12.5" fill="#57606a">左边是大多数人的第一反应；右边是本课要你先做的一件事</text>

  <rect x="24" y="72" width="404" height="330" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="44" y="97" font-size="13" font-weight="700" fill="#991b1b">第一反应：多派人手，就该更快</text>

  <rect x="56" y="150" width="132" height="86" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
  <text x="122" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">1 个窗口</text>
  <text x="122" y="201" text-anchor="middle" font-size="11" fill="#1f2937">1 个人收钱</text>
  <text x="122" y="219" text-anchor="middle" font-size="10.5" fill="#6b7280">谁来都得排这儿</text>

  <text x="56" y="128" font-size="10.5" fill="#6b7280">门口挤了 8 个人</text>
  <circle cx="252" cy="140" r="9" fill="#fecaca" stroke="#dc2626"/><circle cx="278" cy="140" r="9" fill="#fecaca" stroke="#dc2626"/>
  <circle cx="304" cy="140" r="9" fill="#fecaca" stroke="#dc2626"/><circle cx="330" cy="140" r="9" fill="#fecaca" stroke="#dc2626"/>
  <circle cx="252" cy="166" r="9" fill="#fecaca" stroke="#dc2626"/><circle cx="278" cy="166" r="9" fill="#fecaca" stroke="#dc2626"/>
  <circle cx="304" cy="166" r="9" fill="#fecaca" stroke="#dc2626"/><circle cx="330" cy="166" r="9" fill="#fecaca" stroke="#dc2626"/>
  <line x1="240" y1="178" x2="200" y2="192" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="56" y="252" width="340" height="42" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="68" y="270" font-size="11" font-weight="700" fill="#991b1b">结果</text>
  <text x="68" y="286" font-size="11" fill="#1f2937">人全堵在一个窗口前，谁也没变快，还互相挡着</text>

  <rect x="56" y="308" width="340" height="76" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="68" y="327" font-size="11" font-weight="700" fill="#9a3412">为什么"派人"在这里没用</text>
  <text x="68" y="346" font-size="10.5" fill="#1f2937">因为真正卡住的不是"人不够"，是"只有这一个窗口"</text>
  <text x="68" y="364" font-size="10.5" fill="#1f2937">窗口没增加，来人只会把等待时间拉得更长</text>
  <text x="68" y="380" font-size="10.5" fill="#6b7280">这就是本课说的"并行了，但没更快"</text>

  <rect x="444" y="72" width="452" height="330" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="464" y="97" font-size="13" font-weight="700" fill="#1e3a8a">本课：先问一句"卡在哪一道"</text>

  <rect x="464" y="112" width="412" height="82" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="476" y="124" width="96" height="58" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="524" y="148" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">动手算</text>
  <text x="524" y="165" text-anchor="middle" font-size="10" fill="#1f2937">很久</text>
  <rect x="592" y="128" width="60" height="50" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="622" y="158" text-anchor="middle" font-size="10" fill="#1e40af">窗口 A</text>
  <rect x="662" y="128" width="60" height="50" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="692" y="158" text-anchor="middle" font-size="10" fill="#1e40af">窗口 B</text>
  <text x="740" y="143" font-size="10.5" font-weight="700" fill="#1e40af">多开窗口</text>
  <text x="740" y="160" font-size="10" fill="#1f2937">各算各的</text>
  <text x="740" y="176" font-size="10" fill="#6b7280">真能同时推进</text>

  <rect x="464" y="204" width="412" height="82" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="476" y="216" width="96" height="58" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="524" y="240" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">等水烧开</text>
  <text x="524" y="257" text-anchor="middle" font-size="10" fill="#1f2937">大部分时间在等</text>
  <circle cx="606" cy="228" r="8" fill="#ffffff" stroke="#2563eb"/><circle cx="632" cy="240" r="8" fill="#ffffff" stroke="#2563eb"/><circle cx="658" cy="252" r="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="690" y="236" font-size="10.5" font-weight="700" fill="#1e40af">一个人盯好几壶</text>
  <text x="690" y="253" font-size="10" fill="#1f2937">谁开了先管谁</text>
  <text x="690" y="269" font-size="10" fill="#6b7280">不用为每壶雇个人</text>

  <rect x="464" y="296" width="412" height="82" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="476" y="308" width="96" height="58" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="524" y="332" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">对面送货</text>
  <text x="524" y="349" text-anchor="middle" font-size="10" fill="#1f2937">慢</text>
  <text x="592" y="330" font-size="10.5" font-weight="700" fill="#b45309">再怎么加窗口</text>
  <text x="592" y="347" font-size="10" fill="#1f2937">货也不会早到</text>
  <text x="592" y="363" font-size="10" fill="#6b7280">先治对面，或先别干等</text>

  <rect x="24" y="416" width="872" height="46" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="437" font-size="11.5" font-weight="700" fill="#1f2328">顺序反过来</text>
  <text x="44" y="453" font-size="11" fill="#1f2937">先看卡在哪一道，再决定开几个窗口、开哪一种窗口　│　判错了，加得越多越糟</text>
</svg>
