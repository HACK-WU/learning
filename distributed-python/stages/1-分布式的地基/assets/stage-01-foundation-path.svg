<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="920" height="380" fill="#ffffff"/>

  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">阶段 1 · 分布式的地基</text>
  <text x="460" y="54" text-anchor="middle" font-size="12.5" fill="#57606a">4 课 / 9 知识点 · 章节定位：建立词汇 —— 一台机器不够用了</text>

  <rect x="24" y="68" width="872" height="38" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="40" y="86" font-size="12" font-weight="700" fill="#78350f">🎬 本章节的故事转折</text>
  <text x="40" y="102" font-size="11.5" fill="#1f2937">从"单机就能扛"到"多一台机器多一堆失败方式"　│　状态变化：只会写单机服务 → 能说清多机环境下哪些地方会坏</text>

  <rect x="24" y="122" width="210" height="190" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="147" font-size="13" font-weight="700" fill="#1e3a8a">课 1 · 环境准备</text>
  <rect x="40" y="158" width="178" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="52" y="175" font-size="10" font-weight="700" fill="#1d4ed8">① 最小可跑环境</text>
  <text x="52" y="191" font-size="9.5" fill="#1f2937">Python 3.12 + venv</text>
  <rect x="40" y="208" width="178" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="52" y="225" font-size="10" font-weight="700" fill="#1d4ed8">② 依赖一次装齐</text>
  <text x="52" y="241" font-size="9.5" fill="#1f2937">grpcio / redis / httpx</text>
  <rect x="40" y="258" width="178" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="52" y="275" font-size="10" font-weight="700" fill="#1d4ed8">③ 自检脚本</text>
  <text x="52" y="291" font-size="9.5" fill="#1f2937">一条命令验证装好了</text>

  <rect x="244" y="122" width="210" height="190" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="147" font-size="13" font-weight="700" fill="#1e3a8a">课 2 · 并发的真实边界</text>
  <rect x="260" y="158" width="178" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="272" y="175" font-size="10" font-weight="700" fill="#1d4ed8">① GIL 管什么不管什么</text>
  <text x="272" y="191" font-size="9.5" fill="#1f2937">线程 / 进程 / asyncio</text>
  <rect x="260" y="208" width="178" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="272" y="225" font-size="10" font-weight="700" fill="#1d4ed8">② 并行反而更慢</text>
  <text x="272" y="241" font-size="9.5" fill="#1f2937">切换与上下文开销</text>
  <rect x="260" y="258" width="178" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="272" y="275" font-size="10" font-weight="700" fill="#1d4ed8">③ 跨进程协作选型</text>
  <text x="272" y="291" font-size="9.5" fill="#1f2937">共享内存 / 队列 / RPC</text>

  <rect x="464" y="122" width="210" height="190" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="147" font-size="13" font-weight="700" fill="#1e3a8a">课 3 · 网络与部分失败</text>
  <rect x="480" y="158" width="178" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="492" y="175" font-size="10" font-weight="700" fill="#1d4ed8">① 结果未知的第三种态</text>
  <text x="492" y="191" font-size="9.5" fill="#1f2937">成功 / 失败 / 不知道</text>
  <rect x="480" y="208" width="178" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="492" y="225" font-size="10" font-weight="700" fill="#1d4ed8">② 超时不是慢，是未知</text>
  <text x="492" y="241" font-size="9.5" fill="#1f2937">超时后对面可能已执行</text>
  <rect x="480" y="258" width="178" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="492" y="275" font-size="10" font-weight="700" fill="#1d4ed8">③ 重试放大器效应</text>
  <text x="492" y="291" font-size="9.5" fill="#1f2937">3 层各重 3 次 = 27 倍</text>

  <rect x="684" y="122" width="212" height="190" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="147" font-size="13" font-weight="700" fill="#1e3a8a">课 4 · 时钟与一致性</text>
  <rect x="700" y="158" width="180" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="712" y="175" font-size="10" font-weight="700" fill="#1d4ed8">① 时钟不可信</text>
  <text x="712" y="191" font-size="9.5" fill="#1f2937">本地时间会跳、会漂</text>
  <rect x="700" y="208" width="180" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="712" y="225" font-size="10" font-weight="700" fill="#1d4ed8">② 顺序与因果</text>
  <text x="712" y="241" font-size="9.5" fill="#1f2937">时间戳相同也不能判先后</text>
  <rect x="700" y="258" width="180" height="44" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="712" y="275" font-size="10" font-weight="700" fill="#1d4ed8">③ CAP 的正确读法</text>
  <text x="712" y="291" font-size="9.5" fill="#1f2937">分区时在 C 与 A 间取舍</text>

  <line x1="236" y1="215" x2="243" y2="215" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="456" y1="215" x2="463" y2="215" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="676" y1="215" x2="683" y2="215" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="24" y="328" width="872" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="346" font-size="11.5" font-weight="700" fill="#1f2328">➡️ 本阶段出口能力</text>
  <text x="40" y="359" font-size="11" fill="#1f2937">能判断一段代码该用线程、进程还是 asyncio；能说清一次超时之后到底发生了什么　│　下一阶段：阶段 2《服务之间的通信》</text>
</svg>
