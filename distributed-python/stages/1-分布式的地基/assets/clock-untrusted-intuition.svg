<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar4a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
    <marker id="ar4aBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="ar4aRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="920" height="520" fill="#ffffff"/>

  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">两块表不一样，但谁给谁递过东西是清楚的</text>
  <text x="460" y="56" text-anchor="middle" font-size="12.5" fill="#57606a">左边是看表比大小；右边是看纸条定先后</text>

  <rect x="24" y="74" width="424" height="366" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="44" y="99" font-size="13" font-weight="700" fill="#991b1b">习惯做法：比两块表上的读数</text>

  <text x="236" y="126" text-anchor="middle" font-size="11" fill="#6b7280">两个房间，各挂一个钟</text>

  <rect x="56" y="140" width="150" height="112" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="131" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">左边的房间</text>
  <circle cx="131" cy="196" r="26" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="131" y1="196" x2="131" y2="180" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="131" y1="196" x2="143" y2="203" stroke="#dc2626" stroke-width="1.6"/>
  <text x="131" y="242" text-anchor="middle" font-size="10.5" fill="#991b1b">表上写着 10:00:00.002</text>

  <rect x="266" y="140" width="150" height="112" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="341" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">右边的房间</text>
  <circle cx="341" cy="196" r="26" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="341" y1="196" x2="341" y2="180" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="341" y1="196" x2="353" y2="203" stroke="#dc2626" stroke-width="1.6"/>
  <text x="341" y="242" text-anchor="middle" font-size="10.5" fill="#991b1b">表上写着 10:00:00.001</text>

  <rect x="56" y="268" width="360" height="76" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="68" y="288" font-size="11" font-weight="700" fill="#9a3412">问题出在这儿</text>
  <text x="68" y="307" font-size="10.5" fill="#1f2937">这两块表，从来没对过表。谁快谁慢、快多少，你都不知道</text>
  <text x="68" y="324" font-size="10.5" fill="#1f2937">所以"左边 002 晚于右边 001"这句话，其实什么都没说明</text>
  <text x="68" y="339" font-size="10" fill="#6b7280">两边的读数差一点点，但你分不清是"真的晚"还是"表就不一样"</text>

  <rect x="56" y="358" width="360" height="60" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="68" y="377" font-size="11" font-weight="700" fill="#991b1b">于是你会得到的结论</text>
  <text x="68" y="396" font-size="10.5" fill="#1f2937">"退款在下单之前" —— 一个看起来很精确、其实没有依据的排序</text>
  <text x="68" y="411" font-size="10" fill="#6b7280">越精确的数字，越容易让人相信它是对的</text>

  <rect x="472" y="74" width="424" height="366" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="492" y="99" font-size="13" font-weight="700" fill="#1e3a8a">换个办法：只看谁给谁递过纸条</text>

  <text x="684" y="126" text-anchor="middle" font-size="11" fill="#6b7280">同一个场景，但不看钟</text>

  <circle cx="530" cy="170" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="530" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">甲</text>
  <circle cx="838" cy="170" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="838" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">乙</text>

  <line x1="546" y1="164" x2="820" y2="164" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar4aBlue)"/>
  <text x="684" y="156" text-anchor="middle" font-size="10.5" fill="#1e40af">递了一张纸条过去</text>
  <line x1="820" y1="180" x2="546" y2="180" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar4aBlue)"/>
  <text x="684" y="196" text-anchor="middle" font-size="10" fill="#1e40af">回了一张</text>

  <rect x="492" y="216" width="384" height="66" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="504" y="235" font-size="11" font-weight="700" fill="#1e3a8a">这样就有先后了</text>
  <text x="504" y="254" font-size="10.5" fill="#1f2937">甲递出去的那一刻，一定在乙收到之前</text>
  <text x="504" y="272" font-size="10.5" fill="#1f2937">乙回过来的那一刻，一定在甲收到之前</text>

  <rect x="492" y="292" width="384" height="66" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="504" y="311" font-size="11" font-weight="700" fill="#065f46">没递过纸条的两件事呢</text>
  <text x="504" y="330" font-size="10.5" fill="#1f2937">那就没有先后 —— 不是"不知道"，是"这话不成立"</text>
  <text x="504" y="348" font-size="10.5" fill="#065f46">硬要排出先后，就是在编</text>

  <rect x="492" y="368" width="384" height="50" rx="6" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="504" y="387" font-size="11" font-weight="700" fill="#1e40af">本课的思路</text>
  <text x="504" y="405" font-size="10.5" fill="#1f2937">先承认"表不可信"，再用"纸条路径"重建先后</text>

  <rect x="24" y="456" width="872" height="46" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="477" font-size="11.5" font-weight="700" fill="#1f2328">顺序反过来</text>
  <text x="44" y="493" font-size="11" fill="#1f2937">先说清"哪两种时间不能混用"　│　再说清"先后只能由纸条路径定义"　│　最后说清"没有全局真相时该怎么选"</text>
</svg>
