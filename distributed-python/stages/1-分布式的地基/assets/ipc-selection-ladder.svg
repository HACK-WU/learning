<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#ffffff"/>

  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">同一台机器，到隔着网络：四级台阶</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#57606a">往上一级，能扛的事更多，但你要替它兜的底也更多</text>

  <rect x="40" y="74" width="120" height="330" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="100" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328">越往上</text>
  <text x="100" y="124" text-anchor="middle" font-size="10.5" fill="#1f2937">能跨的距离</text>
  <text x="100" y="142" text-anchor="middle" font-size="10.5" fill="#1f2937">越远</text>
  <line x1="70" y1="360" x2="70" y2="164" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar3)"/>
  <text x="100" y="200" text-anchor="middle" font-size="10.5" fill="#b91c1c">你要自己</text>
  <text x="100" y="218" text-anchor="middle" font-size="10.5" fill="#b91c1c">兜的失败</text>
  <text x="100" y="236" text-anchor="middle" font-size="10.5" fill="#b91c1c">也越多</text>
  <text x="100" y="290" text-anchor="middle" font-size="10.5" fill="#6b7280">能不出</text>
  <text x="100" y="308" text-anchor="middle" font-size="10.5" fill="#6b7280">机房就</text>
  <text x="100" y="326" text-anchor="middle" font-size="10.5" fill="#6b7280">别往上走</text>

  <rect x="176" y="330" width="704" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="196" y="354" font-size="12.5" font-weight="700" fill="#14532d">① 同一台机器、同一份代码：多开进程</text>
  <text x="196" y="376" font-size="10.5" fill="#1f2937">进程池 / 共享队列。数据要能被"打包"才能过界，传大块要算清搬运时间。</text>
  <text x="196" y="396" font-size="10" fill="#6b7280">适用：一次算很久的批处理、离线计算、单机上把 CPU 吃满。</text>
  <text x="770" y="354" font-size="10" font-weight="700" fill="#15803d">成本：最低</text>
  <text x="770" y="372" font-size="9.5" fill="#6b7280">出问题只影响</text>
  <text x="770" y="388" font-size="9.5" fill="#6b7280">这一台机器</text>

  <rect x="176" y="242" width="704" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="196" y="266" font-size="12.5" font-weight="700" fill="#1e3a8a">② 同一台机器、两个独立程序：本地队列 / 本地服务</text>
  <text x="196" y="288" font-size="10.5" fill="#1f2937">中间放一个能存东西的地方（如 Redis），两边不认识彼此，只认识那个地方。</text>
  <text x="196" y="308" font-size="10" fill="#6b7280">适用：生产者与消费者节奏差很多、需要"先存着慢慢处理"。</text>
  <text x="770" y="266" font-size="10" font-weight="700" fill="#1d4ed8">成本：中</text>
  <text x="770" y="284" font-size="9.5" fill="#6b7280">多一个部件要</text>
  <text x="770" y="300" font-size="9.5" fill="#6b7280">装、要养、会挂</text>

  <rect x="176" y="154" width="704" height="76" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="196" y="178" font-size="12.5" font-weight="700" fill="#78350f">③ 跨机器、任务不能丢：消息队列</text>
  <text x="196" y="200" font-size="10.5" fill="#1f2937">消息先进队列再被取走。对面机器挂了，消息还在，换一台接着处理。</text>
  <text x="196" y="220" font-size="10" fill="#6b7280">适用：跨机器解耦、削峰、异步化。代价是"至少一次"——同一条可能被处理两遍。</text>
  <text x="770" y="178" font-size="10" font-weight="700" fill="#b45309">成本：较高</text>
  <text x="770" y="196" font-size="9.5" fill="#6b7280">要处理重复、</text>
  <text x="770" y="212" font-size="9.5" fill="#6b7280">乱序、积压</text>

  <rect x="176" y="66" width="704" height="76" rx="8" fill="#fdf2f8" stroke="#be185d" stroke-width="1.8"/>
  <text x="196" y="90" font-size="12.5" font-weight="700" fill="#831843">④ 一堆任务要排队跑、要能重跑、要看进度：任务框架</text>
  <text x="196" y="112" font-size="10.5" fill="#1f2937">在消息队列之上再套一层：谁跑、跑几次、失败怎么重试、结果存哪，都由框架管。</text>
  <text x="196" y="132" font-size="10" fill="#6b7280">适用：定时任务、有依赖的工作流、需要人工看板与重跑。</text>
  <text x="770" y="90" font-size="10" font-weight="700" fill="#9d174d">成本：最高</text>
  <text x="770" y="108" font-size="9.5" fill="#6b7280">一整套系统要</text>
  <text x="770" y="124" font-size="9.5" fill="#6b7280">部署、要监控</text>

  <rect x="40" y="424" width="840" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="445" font-size="11.5" font-weight="700" fill="#1f2328">挑的原则：从最低一级开始试，够用就停</text>
  <text x="58" y="464" font-size="10.5" fill="#1f2937">先问"真的需要跨机器吗"，再问"丢了能接受吗"，最后才问"要不要重试和一整套管理"。</text>

  <rect x="40" y="488" width="840" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="58" y="510" font-size="11.5" font-weight="700" fill="#991b1b">最常见的错：一上来就跳到第 ③④ 级</text>
  <text x="58" y="529" font-size="10.5" fill="#1f2937">明明只在一台机器上、数据都能放进内存，却先装了一套队列集群——多出来的每一个部件，都是一个会半夜叫你起来的东西。</text>
</svg>
