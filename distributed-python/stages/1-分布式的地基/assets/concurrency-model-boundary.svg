<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="920" height="580" fill="#ffffff"/>

  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">三条路线，四个维度，各有一处硬伤</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#57606a">同一张表里看：没有一条全绿，只有"这一处短板我能不能接受"</text>

  <rect x="24" y="72" width="160" height="54" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="105" font-size="11.5" font-weight="700" fill="#1f2328">比什么</text>

  <rect x="192" y="72" width="232" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="308" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">多开线程</text>
  <text x="308" y="114" text-anchor="middle" font-size="10" fill="#1e40af">threading / ThreadPool</text>

  <rect x="432" y="72" width="232" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="548" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">多开进程</text>
  <text x="548" y="114" text-anchor="middle" font-size="10" fill="#166534">multiprocessing / ProcessPool</text>

  <rect x="672" y="72" width="224" height="54" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="784" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">一个人盯多个</text>
  <text x="784" y="114" text-anchor="middle" font-size="10" fill="#5b21b6">asyncio / async def</text>

  <rect x="24" y="126" width="160" height="96" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="158" font-size="11.5" font-weight="700" fill="#1f2328">能不能真的</text>
  <text x="40" y="176" font-size="11.5" font-weight="700" fill="#1f2328">同时算</text>
  <text x="40" y="200" font-size="9.5" fill="#6b7280">（算得久时最关键）</text>

  <rect x="192" y="126" width="232" height="96" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="308" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">不能</text>
  <text x="308" y="174" text-anchor="middle" font-size="10.5" fill="#1f2937">同一时刻只有一个在算</text>
  <text x="308" y="192" text-anchor="middle" font-size="10.5" fill="#1f2937">换人很快，但没多出来手</text>
  <text x="308" y="210" text-anchor="middle" font-size="9.5" fill="#6b7280">8 线程 ≈ 1.1 倍，不是 8 倍</text>

  <rect x="432" y="126" width="232" height="96" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="548" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">能</text>
  <text x="548" y="174" text-anchor="middle" font-size="10.5" fill="#1f2937">各占一个核，互不排队</text>
  <text x="548" y="192" text-anchor="middle" font-size="10.5" fill="#1f2937">这是绕开那把锁的唯一办法</text>
  <text x="548" y="210" text-anchor="middle" font-size="9.5" fill="#6b7280">8 进程实测 6.5 倍</text>

  <rect x="672" y="126" width="224" height="96" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="784" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">不能</text>
  <text x="784" y="174" text-anchor="middle" font-size="10.5" fill="#1f2937">全在一个进程里轮转</text>
  <text x="784" y="192" text-anchor="middle" font-size="10.5" fill="#1f2937">算得久就把别人全卡住</text>
  <text x="784" y="210" text-anchor="middle" font-size="9.5" fill="#6b7280">它是为"等"设计的</text>

  <rect x="24" y="222" width="160" height="96" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="254" font-size="11.5" font-weight="700" fill="#1f2328">大部分时间</text>
  <text x="40" y="272" font-size="11.5" font-weight="700" fill="#1f2328">在等外部时</text>
  <text x="40" y="296" font-size="9.5" fill="#6b7280">（查库、调接口）</text>

  <rect x="192" y="222" width="232" height="96" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="308" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">够用</text>
  <text x="308" y="270" text-anchor="middle" font-size="10.5" fill="#1f2937">等的时候会松手，换人去干</text>
  <text x="308" y="288" text-anchor="middle" font-size="10.5" fill="#1f2937">100 个 20ms 的等待 → 0.14s</text>
  <text x="308" y="306" text-anchor="middle" font-size="9.5" fill="#6b7280">代价是每个线程都占内存</text>

  <rect x="432" y="222" width="232" height="96" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="548" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">也能，但亏</text>
  <text x="548" y="270" text-anchor="middle" font-size="10.5" fill="#1f2937">进出的数据都要打包搬运</text>
  <text x="548" y="288" text-anchor="middle" font-size="10.5" fill="#1f2937">同样的活儿多花 7 倍 CPU</text>
  <text x="548" y="306" text-anchor="middle" font-size="9.5" fill="#6b7280">16 进程 0.16s vs 16 线程 0.14s</text>

  <rect x="672" y="222" width="224" height="96" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="784" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">最合适</text>
  <text x="784" y="270" text-anchor="middle" font-size="10.5" fill="#1f2937">等的时候主动交出去</text>
  <text x="784" y="288" text-anchor="middle" font-size="10.5" fill="#1f2937">不用为每次等待雇个人</text>
  <text x="784" y="306" text-anchor="middle" font-size="9.5" fill="#6b7280">同样 100 个等待 → 0.02s</text>

  <rect x="24" y="318" width="160" height="96" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="350" font-size="11.5" font-weight="700" fill="#1f2328">两边怎么</text>
  <text x="40" y="368" font-size="11.5" font-weight="700" fill="#1f2328">交换数据</text>

  <rect x="192" y="318" width="232" height="96" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="308" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">直接读写</text>
  <text x="308" y="366" text-anchor="middle" font-size="10.5" fill="#1f2937">同一份内存，最快</text>
  <text x="308" y="384" text-anchor="middle" font-size="10.5" fill="#b91c1c">但谁先谁后说不准，会互相踩</text>
  <text x="308" y="402" text-anchor="middle" font-size="9.5" fill="#6b7280">要自己加锁，锁漏了就是脏数据</text>

  <rect x="432" y="318" width="232" height="96" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="548" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">打包搬运</text>
  <text x="548" y="366" text-anchor="middle" font-size="10.5" fill="#1f2937">只能传能被打包的东西</text>
  <text x="548" y="384" text-anchor="middle" font-size="10.5" fill="#1f2937">4757 KiB 的列表 ≈ 30ms 单程</text>
  <text x="548" y="402" text-anchor="middle" font-size="9.5" fill="#6b7280">传太多，省下的时间又赔回去</text>

  <rect x="672" y="318" width="224" height="96" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="784" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">不用搬</text>
  <text x="784" y="366" text-anchor="middle" font-size="10.5" fill="#1f2937">同一个进程里，直接拿到</text>
  <text x="784" y="384" text-anchor="middle" font-size="10.5" fill="#1f2937">省掉了打包这一步</text>
  <text x="784" y="402" text-anchor="middle" font-size="9.5" fill="#6b7280">但一处算得久，全体等它</text>

  <rect x="24" y="414" width="160" height="96" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="446" font-size="11.5" font-weight="700" fill="#1f2328">开一个的</text>
  <text x="40" y="464" font-size="11.5" font-weight="700" fill="#1f2328">真实成本</text>

  <rect x="192" y="414" width="232" height="96" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="308" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">轻</text>
  <text x="308" y="462" text-anchor="middle" font-size="10.5" fill="#1f2937">几百 KB 到几 MB</text>
  <text x="308" y="480" text-anchor="middle" font-size="10.5" fill="#1f2937">开到几百个通常还撑得住</text>
  <text x="308" y="498" text-anchor="middle" font-size="9.5" fill="#6b7280">再多就是调度开销在吃你</text>

  <rect x="432" y="414" width="232" height="96" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="548" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">重</text>
  <text x="548" y="462" text-anchor="middle" font-size="10.5" fill="#1f2937">每个都要一份独立的解释器</text>
  <text x="548" y="480" text-anchor="middle" font-size="10.5" fill="#1f2937">空跑一个任务也要 16ms</text>
  <text x="548" y="498" text-anchor="middle" font-size="9.5" fill="#6b7280">小任务用它是纯亏</text>

  <rect x="672" y="414" width="224" height="96" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="784" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">最轻</text>
  <text x="784" y="462" text-anchor="middle" font-size="10.5" fill="#1f2937">一个任务几千字节</text>
  <text x="784" y="480" text-anchor="middle" font-size="10.5" fill="#1f2937">几万个也不在话下</text>
  <text x="784" y="498" text-anchor="middle" font-size="9.5" fill="#6b7280">前提是全程不许有阻塞调用</text>

  <rect x="24" y="520" width="872" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="40" y="540" font-size="11.5" font-weight="700" fill="#78350f">一句话挑法</text>
  <text x="40" y="557" font-size="11" fill="#1f2937">算得久 → 分成多个进程　│　等得久 → 一个进程里多开协程　│　两者混在一起 → 先拆开，再各用各的</text>
</svg>
