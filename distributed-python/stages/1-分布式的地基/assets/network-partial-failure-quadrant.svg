<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar3b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
    <marker id="ar3bR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="ar3bG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="940" height="560" fill="#ffffff"/>

  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">客户端的一种观测，对应服务端的好几种事实</text>
  <text x="470" y="56" text-anchor="middle" font-size="12.5" fill="#57606a">左边是你能看到的全部；右边是对面实际可能处于的状态——中间的连线就是问题的全部</text>

  <text x="130" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">客户端观测到</text>
  <text x="640" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">服务端实际状态</text>

  <rect x="24" y="104" width="228" height="58" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="138" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">① 拿到回应</text>
  <text x="138" y="147" text-anchor="middle" font-size="10" fill="#1f2937">200 或 500，总之有话说</text>

  <rect x="24" y="180" width="228" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="138" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">② 等到超时</text>
  <text x="138" y="223" text-anchor="middle" font-size="10" fill="#1f2937">ReadTimeout</text>

  <rect x="24" y="256" width="228" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="138" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">③ 连接断了</text>
  <text x="138" y="299" text-anchor="middle" font-size="10" fill="#1f2937">RemoteDisconnected</text>

  <rect x="24" y="332" width="228" height="58" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="138" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">④ 连不上</text>
  <text x="138" y="375" text-anchor="middle" font-size="10" fill="#1f2937">ConnectTimeout / 拒连</text>

  <rect x="556" y="104" width="360" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="736" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">A. 没收到</text>
  <text x="736" y="150" text-anchor="middle" font-size="10.5" fill="#1f2937">请求在路上就没了，或根本没发出</text>

  <rect x="556" y="188" width="360" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="736" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">B. 收到了，正在做 / 做了一半</text>
  <text x="736" y="234" text-anchor="middle" font-size="10.5" fill="#1f2937">钱可能已经扣了，也可能只扣了一半</text>

  <rect x="556" y="272" width="360" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="736" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">C. 做完了，回应丢了</text>
  <text x="736" y="318" text-anchor="middle" font-size="10.5" fill="#1f2937">结果已经在库里，只是没送到你手上</text>

  <rect x="556" y="356" width="360" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="736" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">D. 请求没送到对面手里</text>
  <text x="736" y="402" text-anchor="middle" font-size="10.5" fill="#1f2937">TCP 就没握上手，对面一无所知</text>

  <line x1="256" y1="133" x2="548" y2="137" stroke="#059669" stroke-width="1.8" marker-end="url(#ar3bG)"/>
  <text x="402" y="126" text-anchor="middle" font-size="10" fill="#065f46">一对一，能下结论</text>

  <line x1="256" y1="200" x2="548" y2="215" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar3bR)"/>
  <line x1="256" y1="216" x2="548" y2="300" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar3bR)"/>

  <line x1="256" y1="278" x2="548" y2="235" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar3bR)"/>
  <line x1="256" y1="292" x2="548" y2="305" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar3bR)"/>

  <line x1="256" y1="352" x2="548" y2="140" stroke="#059669" stroke-width="1.6" marker-end="url(#ar3bG)"/>
  <line x1="256" y1="366" x2="548" y2="390" stroke="#059669" stroke-width="1.6" marker-end="url(#ar3bG)"/>

  <rect x="24" y="432" width="892" height="86" rx="8" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="44" y="455" font-size="12" font-weight="700" fill="#1e3a8a">这张图要说的就一句话</text>
  <text x="44" y="477" font-size="11" fill="#1f2937">红色那四条线（②③）各自指向两种互斥的事实，说明"超时 / 断连"这一个观测<tspan font-weight="700" fill="#991b1b">无法区分"没做"和"做完了"</tspan>。</text>
  <text x="44" y="497" font-size="11" fill="#1f2937">绿色那两条（①④）各只指向一种事实：拿到回应就一定有结论；连不上就一定没送到——这两类才可以放心重试。</text>
  <text x="44" y="512" font-size="10.5" fill="#6b7280">注意 ④ 和 ③ 都抛 ConnectionError（Python 里同一个大类），但一个"确定没做"、一个"可能做了"——只看异常类型分不出来。</text>

  <rect x="24" y="528" width="892" height="22" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="36" y="543" font-size="10.5" fill="#92400e">读图提示：先只看红色那部分——如果能记住"同一个观测对应两种事实"，本课就抓到重点了。</text>
</svg>
