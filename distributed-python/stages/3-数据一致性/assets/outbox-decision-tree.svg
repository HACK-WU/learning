<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="dtG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1e8449"/>
    </marker>
    <marker id="dtD" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="#fbfbf9"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1c2833">两道关：先不丢，再不重</text>
  <text x="490" y="62" text-anchor="middle" font-size="13" fill="#7f8c8d">从左到右不是「越来越高级」，而是「多一道关就多一份复杂度」</text>

  <!-- 起点 -->
  <rect x="26" y="86" width="146" height="70" rx="8" fill="#f5f5f5" stroke="#bbb"/>
  <text x="99" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">一次下单</text>
  <text x="99" y="134" text-anchor="middle" font-size="10" fill="#7f8c8d">要写几个系统？</text>

  <line x1="178" y1="121" x2="208" y2="121" stroke="#7f8c8d" stroke-width="2" marker-end="url(#dtD)"/>

  <!-- 第一关 -->
  <rect x="218" y="92" width="170" height="58" rx="8" fill="#fff" stroke="#888"/>
  <text x="303" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#1c2833">只写一个系统？</text>
  <text x="303" y="134" text-anchor="middle" font-size="10" fill="#7f8c8d">库 + 消息 = 两个</text>

  <!-- 是 -->
  <path d="M 303 156 L 303 190" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#dtG)"/>
  <text x="315" y="178" font-size="9" fill="#1e8449">是</text>
  <rect x="196" y="196" width="214" height="76" rx="8" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="303" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#1e8449">本地事务就够</text>
  <text x="303" y="242" text-anchor="middle" font-size="10" fill="#2c3e50">一次 BEGIN … COMMIT 护住</text>
  <text x="303" y="260" text-anchor="middle" font-size="9" fill="#7f8c8d">别上发件箱，复杂度不值</text>

  <!-- 否 -->
  <line x1="394" y1="121" x2="424" y2="121" stroke="#7f8c8d" stroke-width="2" marker-end="url(#dtD)"/>

  <rect x="434" y="86" width="196" height="70" rx="8" fill="#fff" stroke="#888"/>
  <text x="532" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#1c2833">要写两个系统</text>
  <text x="532" y="130" text-anchor="middle" font-size="10" fill="#7f8c8d">库 + 消息各一个</text>
  <text x="532" y="147" text-anchor="middle" font-size="9" fill="#7f8c8d">→ 必须上发件箱</text>

  <path d="M 532 160 L 532 192" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#dtG)"/>

  <rect x="418" y="198" width="228" height="96" rx="8" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="532" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1e8449">发件箱（+ 中继）</text>
  <text x="532" y="244" text-anchor="middle" font-size="10" fill="#2c3e50">业务行与待发行同一次落笔</text>
  <text x="532" y="264" text-anchor="middle" font-size="10" fill="#2c3e50">中继扫 WHERE published_at IS NULL</text>
  <text x="532" y="284" text-anchor="middle" font-size="9" fill="#7f8c8d">不丢了，但开始重复</text>

  <!-- 第二关 -->
  <line x1="652" y1="160" x2="692" y2="160" stroke="#7f8c8d" stroke-width="2" marker-end="url(#dtD)"/>

  <rect x="702" y="126" width="252" height="70" rx="8" fill="#fff" stroke="#888"/>
  <text x="828" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#1c2833">重复受得了吗？</text>
  <text x="828" y="170" text-anchor="middle" font-size="10" fill="#7f8c8d">业务是「赋值」还是「累加」？</text>
  <text x="828" y="187" text-anchor="middle" font-size="9" fill="#7f8c8d">赋值天然幂等，累加不行</text>

  <!-- 受得了 -->
  <path d="M 828 200 L 828 232" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#dtG)"/>
  <text x="840" y="220" font-size="9" fill="#1e8449">受得了</text>
  <rect x="702" y="238" width="252" height="72" rx="8" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="828" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#1e8449">到这儿就结束了</text>
  <text x="828" y="284" text-anchor="middle" font-size="10" fill="#2c3e50">「把状态设为已发货」重做一遍也一样</text>
  <text x="828" y="302" text-anchor="middle" font-size="9" fill="#7f8c8d">不必上表，但要能证明它真的幂等</text>

  <!-- 受不了 -->
  <line x1="828" y1="238" x2="828" y2="238" fill="none" stroke="#fff"/>
  <path d="M 828 310 L 828 322" fill="none" stroke="#c0392b" stroke-width="1"/>
  <text x="840" y="332" font-size="9" fill="#a93226">受不了（扣库存、加余额）</text>

  <rect x="702" y="340" width="252" height="88" rx="8" fill="#fdf2f0" stroke="#e8b4ac" stroke-width="1.5"/>
  <text x="828" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#a93226">必须上表 + 同事务</text>
  <text x="828" y="386" text-anchor="middle" font-size="10" fill="#2c3e50">去重表唯一主键 + 业务同事务</text>
  <text x="828" y="406" text-anchor="middle" font-size="10" fill="#a93226">键用消息身份，不是投递序号</text>
  <text x="828" y="422" text-anchor="middle" font-size="9" fill="#7f8c8d">分两个事务会「说做过了、其实没做」</text>

  <!-- 中间分隔 -->
  <line x1="26" y1="452" x2="954" y2="452" stroke="#ddd" stroke-width="1.5"/>

  <!-- 底部量化 -->
  <text x="490" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2833">同一份故障脚本（200 笔，seed=7）走三遍的实测偏差</text>

  <rect x="26" y="496" width="292" height="78" rx="8" fill="#fdf2f0" stroke="#e8b4ac"/>
  <text x="46" y="518" font-size="11" font-weight="700" fill="#a93226">只做第 1 步（双写）</text>
  <text x="46" y="540" font-size="12" font-weight="700" fill="#a93226">偏差 +3</text>
  <text x="46" y="560" font-size="9" fill="#2c3e50">丢事件与重复投递互相抵消 → 伪装成「差不多对」</text>

  <rect x="344" y="496" width="292" height="78" rx="8" fill="#fff8f0" stroke="#e0c3a0"/>
  <text x="364" y="518" font-size="11" font-weight="700" fill="#a04000">加上发件箱</text>
  <text x="364" y="540" font-size="12" font-weight="700" fill="#a04000">偏差 +30</text>
  <text x="364" y="560" font-size="9" fill="#2c3e50">不丢了，但重复全落到库存上</text>

  <rect x="662" y="496" width="292" height="78" rx="8" fill="#f1f8f2" stroke="#a9d3b4"/>
  <text x="682" y="518" font-size="11" font-weight="700" fill="#1e8449">再加幂等消费</text>
  <text x="682" y="540" font-size="12" font-weight="700" fill="#1e8449">偏差 0</text>
  <text x="682" y="560" font-size="9" fill="#2c3e50">200 次扣减 = 200 笔唯一订单</text>
</svg>
