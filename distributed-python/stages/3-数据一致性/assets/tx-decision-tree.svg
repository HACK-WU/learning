<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="dG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1e8449"/>
    </marker>
    <marker id="dR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="#fbfbf9"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1c2833">三条路的分岔口：先问「能不能接受中间态被看见」</text>
  <text x="490" y="62" text-anchor="middle" font-size="13" fill="#7f8c8d">从左到右不是「越来越高级」，而是「放弃的东西越来越多、能撑住的规模越来越大」</text>

  <!-- 起点 -->
  <rect x="30" y="88" width="150" height="72" rx="8" fill="#f5f5f5" stroke="#bbb"/>
  <text x="105" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#566573">一笔生意</text>
  <text x="105" y="136" text-anchor="middle" font-size="11" fill="#7f8c8d">要动几个本子？</text>

  <!-- 路径判断 -->
  <line x1="186" y1="124" x2="222" y2="124" stroke="#7f8c8d" stroke-width="2" marker-end="url(#dG)"/>

  <!-- 分支判断 -->
  <rect x="234" y="98" width="180" height="52" rx="8" fill="#fff" stroke="#888"/>
  <text x="324" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2833">几个本子？</text>
  <text x="324" y="140" text-anchor="middle" font-size="11" fill="#7f8c8d">一个 / 多个</text>

  <!-- 分支1 -->
  <path d="M 324 152 L 324 186" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#dG)"/>
  <text x="336" y="176" font-size="10" fill="#1e8449">只有一个</text>

  <rect x="200" y="196" width="248" height="92" rx="8" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="324" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">就用本地事务</text>
  <text x="324" y="246" text-anchor="middle" font-size="11" fill="#2c3e50">一次 BEGIN … COMMIT 护住</text>
  <text x="324" y="268" text-anchor="middle" font-size="11" fill="#7f8c8d">最简单，别上任何分布式方案</text>

  <!-- 分支2 -->
  <path d="M 414 124 L 470 124" fill="none" stroke="#7f8c8d" stroke-width="2" marker-end="url(#dG)"/>
  <text x="442" y="116" text-anchor="middle" font-size="10" fill="#7f8c8d">多个</text>

  <rect x="482" y="88" width="200" height="72" rx="8" fill="#fff" stroke="#888"/>
  <text x="582" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2833">能容忍「中间态</text>
  <text x="582" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2833">被别人看见」吗？</text>

  <!-- 不能容忍 -->
  <path d="M 582 168 L 582 204" fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#dG)"/>
  <text x="594" y="192" font-size="10" fill="#a04000">不能</text>

  <rect x="446" y="214" width="272" height="112" rx="8" fill="#fff8f0" stroke="#e0c3a0" stroke-width="1.5"/>
  <text x="582" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#a04000">两阶段提交（或共识）</text>
  <text x="582" y="262" text-anchor="middle" font-size="11" fill="#2c3e50">问一遍再一起记，期间全锁住</text>
  <text x="582" y="284" text-anchor="middle" font-size="11" fill="#2c3e50">代价：锁 + 可能僵住</text>
  <text x="582" y="308" text-anchor="middle" font-size="11" fill="#7f8c8d">适合：同组织、少量参与者、强一致要求</text>

  <!-- 能容忍 -->
  <path d="M 688 124 L 742 124" fill="none" stroke="#7f8c8d" stroke-width="2" marker-end="url(#dG)"/>
  <text x="715" y="116" text-anchor="middle" font-size="10" fill="#7f8c8d">能容忍</text>

  <rect x="754" y="88" width="200" height="72" rx="8" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="854" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#1e8449">那就用 Saga</text>
  <text x="854" y="136" text-anchor="middle" font-size="11" fill="#2c3e50">一步步记，错了补</text>

  <!-- Saga 三个前提 -->
  <path d="M 854 166 L 854 200" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#dG)"/>

  <rect x="700" y="210" width="254" height="176" rx="8" fill="#fff" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="720" y="234" font-size="12" font-weight="700" fill="#1e8449">选 Saga 前必须答的三问</text>
  <text x="720" y="258" font-size="11" fill="#2c3e50">① 每一步能不能补？</text>
  <text x="736" y="276" font-size="10" fill="#7f8c8d">补不回来的那步要排到最后（pivot）</text>
  <text x="720" y="300" font-size="11" fill="#2c3e50">② 补偿重复投递会怎样？</text>
  <text x="736" y="318" font-size="10" fill="#7f8c8d">不幂等就会「成功得过头」</text>
  <text x="720" y="342" font-size="11" fill="#2c3e50">③ 中间态被人看见会不会出事？</text>
  <text x="736" y="360" font-size="10" fill="#7f8c8d">看见了就要用语义锁或人工介入兜</text>

  <!-- 中间分隔 -->
  <line x1="30" y1="404" x2="950" y2="404" stroke="#ddd" stroke-width="1.5"/>

  <!-- 下方：三条路的量化 -->
  <text x="490" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2833">同一笔 100 元的生意，三种做法的实测代价</text>

  <rect x="30" y="452" width="292" height="118" rx="8" fill="#f5f5f5" stroke="#ccc"/>
  <text x="50" y="476" font-size="12" font-weight="700" fill="#566573">本地事务</text>
  <text x="50" y="500" font-size="11" fill="#2c3e50">消息 0 条｜持锁最短</text>
  <text x="50" y="522" font-size="11" fill="#2c3e50">代价：只管一个库</text>
  <text x="50" y="548" font-size="11" fill="#7f8c8d">够用就别升级</text>

  <rect x="344" y="452" width="292" height="118" rx="8" fill="#fff8f0" stroke="#e0c3a0"/>
  <text x="364" y="476" font-size="12" font-weight="700" fill="#a04000">两阶段提交</text>
  <text x="364" y="500" font-size="11" fill="#2c3e50">3 个本子：12 条消息、30.7ms</text>
  <text x="364" y="522" font-size="11" fill="#2c3e50">崩溃时：锁 2030.6ms 不放</text>
  <text x="364" y="548" font-size="11" fill="#7f8c8d">一致性最强，可用性最脆</text>

  <rect x="658" y="452" width="292" height="118" rx="8" fill="#f1f8f2" stroke="#a9d3b4"/>
  <text x="678" y="476" font-size="12" font-weight="700" fill="#1e8449">Saga</text>
  <text x="678" y="500" font-size="11" fill="#2c3e50">无锁、无协调者</text>
  <text x="678" y="522" font-size="11" fill="#2c3e50">代价：补偿不幂等 → 偏差 32</text>
  <text x="678" y="548" font-size="11" fill="#7f8c8d">可用性最好，写错最难查</text>
</svg>
