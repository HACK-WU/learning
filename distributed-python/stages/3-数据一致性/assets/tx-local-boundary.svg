<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="aR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/>
    </marker>
    <marker id="aG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1e8449"/>
    </marker>
    <marker id="aD" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#fbfbf9"/>
  <text x="490" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1c2833">本地事务的边界：它护住的是一个「库」，不是一个「业务」</text>
  <text x="490" y="64" text-anchor="middle" font-size="13" fill="#7f8c8d">同一个库里的两张表，一次记账能一起改；换成两个库，第一步落定之后就撤不回来了</text>

  <!-- 上：能用 -->
  <rect x="26" y="88" width="928" height="196" rx="12" fill="#f1f8f2" stroke="#a9d3b4" stroke-width="1.5"/>
  <text x="50" y="118" font-size="15" font-weight="700" fill="#1e8449">能护住：同一个文件里的两张表（R1 实测，回滚后 0 行）</text>

  <!-- 一个库的框 -->
  <rect x="56" y="136" width="330" height="128" rx="8" fill="#fff" stroke="#7fb889" stroke-width="1.8"/>
  <text x="221" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">order.db（一个文件）</text>
  <rect x="82" y="176" width="120" height="34" rx="5" fill="#eaf5ec" stroke="#a9d3b4"/>
  <text x="142" y="198" text-anchor="middle" font-size="12" fill="#1e8449" font-family="monospace">orders 表</text>
  <rect x="240" y="176" width="120" height="34" rx="5" fill="#eaf5ec" stroke="#a9d3b4"/>
  <text x="300" y="198" text-anchor="middle" font-size="12" fill="#1e8449" font-family="monospace">order_items 表</text>
  <text x="221" y="238" text-anchor="middle" font-size="12" fill="#2c3e50">一次 BEGIN … COMMIT 包住，出错就一起撤</text>
  <text x="221" y="256" text-anchor="middle" font-size="11" fill="#7f8c8d">任意多张表都行 —— 只要它们在这一个文件里</text>

  <!-- 说明 -->
  <rect x="410" y="136" width="516" height="128" rx="8" fill="#fff" stroke="#a9d3b4"/>
  <text x="432" y="162" font-size="13" font-weight="700" fill="#1e8449">为什么能？因为「撤」这个动作有实物可依</text>
  <text x="432" y="188" font-size="12" fill="#2c3e50">数据库把「改之前的旧值」和「改之后的新值」记在同一份日志里</text>
  <text x="432" y="212" font-size="12" fill="#2c3e50">在真正落盘之前，它可以照日志倒着走回去</text>
  <text x="432" y="240" font-size="12" fill="#c0392b">撤的前提是：没人看得见中间状态，且它还没对外承诺「成了」</text>
  <text x="432" y="258" font-size="11" fill="#7f8c8d">一旦承诺出去（commit 返回），日志就只往前走了</text>

  <!-- 中间 -->
  <line x1="490" y1="292" x2="490" y2="324" stroke="#7f8c8d" stroke-width="2.5" marker-end="url(#aD)"/>
  <text x="502" y="312" font-size="11" fill="#7f8c8d">换成两个文件</text>

  <!-- 下：不能用 -->
  <rect x="26" y="332" width="928" height="196" rx="12" fill="#fdf2f0" stroke="#e8b4ac" stroke-width="1.5"/>
  <text x="50" y="362" font-size="15" font-weight="700" fill="#a93226">护不住：两个文件 = 两个独立王国（R2 实测，留下 1 笔有单无货）</text>

  <rect x="56" y="380" width="250" height="128" rx="8" fill="#fff" stroke="#d5a6a0" stroke-width="1.8"/>
  <text x="181" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#a93226">order.db</text>
  <rect x="82" y="420" width="198" height="30" rx="5" fill="#fdeceb" stroke="#e8b4ac"/>
  <text x="181" y="440" text-anchor="middle" font-size="11" fill="#a93226" font-family="monospace">orders: 1 行（已提交）</text>
  <text x="181" y="474" text-anchor="middle" font-size="12" fill="#1e8449">✓ 落定了</text>
  <text x="181" y="496" text-anchor="middle" font-size="11" fill="#7f8c8d">撤不动：日志已封存</text>

  <line x1="318" y1="444" x2="352" y2="444" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aR)"/>

  <rect x="364" y="380" width="250" height="128" rx="8" fill="#fff" stroke="#d5a6a0" stroke-width="1.8"/>
  <text x="489" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#a93226">stock.db</text>
  <rect x="390" y="420" width="198" height="30" rx="5" fill="#f5f5f5" stroke="#ccc"/>
  <text x="489" y="440" text-anchor="middle" font-size="11" fill="#7f8c8d" font-family="monospace">stock: 100（未变）</text>
  <text x="489" y="474" text-anchor="middle" font-size="12" fill="#c0392b">✗ 超时了</text>
  <text x="489" y="496" text-anchor="middle" font-size="11" fill="#7f8c8d">它自己撤了，没用</text>

  <!-- 结果 -->
  <rect x="636" y="380" width="290" height="128" rx="8" fill="#fff" stroke="#e8b4ac"/>
  <text x="658" y="406" font-size="13" font-weight="700" fill="#a93226">结果：一笔「有单无货」</text>
  <text x="658" y="430" font-size="12" fill="#2c3e50">客户收到「下单成功」</text>
  <text x="658" y="452" font-size="12" fill="#2c3e50">仓库那边一件没少</text>
  <text x="658" y="480" font-size="12" fill="#a93226">200 笔放大：20 笔错账 / 10.0%</text>
  <text x="658" y="498" font-size="11" fill="#7f8c8d">而且它不报错，只在月底盘点时出现</text>

  <!-- 底部 -->
  <rect x="26" y="546" width="928" height="52" rx="8" fill="#eef4fb" stroke="#b6cde8"/>
  <text x="490" y="570" text-anchor="middle" font-size="13" fill="#1f4e79">「用 with 包起来」不是解决办法：连接是绑库的，不是绑事务的 —— 两个库就是两个事务，各自提交、各自撤。</text>
  <text x="490" y="590" text-anchor="middle" font-size="12" fill="#7f8c8d">R3 实测里两个库「看起来都回滚了」，只是因为同线程、且谁都没先提交；真实服务里中间一定 commit 过。</text>
</svg>
