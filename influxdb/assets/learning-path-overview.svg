  <!-- 箭头 -->
  <line x1="176" y1="215" x2="185" y2="215" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="215" x2="349" y2="215" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="504" y1="215" x2="513" y2="215" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="668" y1="215" x2="677" y2="215" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="832" y1="215" x2="841" y2="215" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 认知阶梯 -->
  <rect x="24" y="312" width="952" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="332" font-size="12" font-weight="700" fill="#1f2328">🪜 能力阶梯（每阶段解决前一章遗留的问题）</text>
  <text x="40" y="352" font-size="11.5" fill="#1f2937">听说过 → 知道为什么需要它 → 能操作它 → 能用对它 → 知道它的边界 → 能扛生产 → 能向团队交代</text>
  <text x="40" y="367" font-size="10.5" fill="#57606a">依赖链：阶段 1 是动机；阶段 2 建立手感（先于 schema 设计）；阶段 3 依赖阶段 2；阶段 4 依赖阶段 3 的模型认知；阶段 5 依赖阶段 4 的引擎理解；阶段 6 依赖前五个阶段全部</text>

  <!-- 终点产物 -->
  <rect x="24" y="390" width="952" height="54" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="40" y="411" font-size="12" font-weight="700" fill="#7c2d12">🏁 终点产物</text>
  <text x="40" y="430" font-size="11.5" fill="#1f2937">《时序数据库选型与落地方案》—— 一份能向团队汇报的决策文档（第 19 课产出）</text>

  <!-- 图例 -->
  <text x="24" y="462" font-size="10" fill="#57606a">进度说明：✅ 已完成 ｜ 🔄 进行中 ｜ ⬜ 未开始　·　本图为活文档，随学习进度更新（最近更新 2026-08-31：阶段 1 完成 2/2，阶段 2 进行中 2/3）</text>
