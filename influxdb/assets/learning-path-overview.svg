  <text x="427" y="239" text-anchor="middle" font-size="11" fill="#1f2937">L8 SQL 查询</text>
  <text x="427" y="254" text-anchor="middle" font-size="11" fill="#1f2937">L9 InfluxQL 与 Flux</text>
