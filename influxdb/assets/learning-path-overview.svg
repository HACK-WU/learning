<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- 背景：浅色 -->
  <rect width="1000" height="470" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">InfluxDB 3 学习路径总览</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#57606a">6 阶段 / 19 课 / 57 知识点 · 动手实操 + 决策参考导向 · 基于 InfluxDB 3 Core 3.11</text>

  <!-- 故事主线条 -->
  <rect x="24" y="74" width="952" height="42" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="92" font-size="12" font-weight="700" fill="#1f2328">🎭 故事主线</text>
  <text x="40" y="109" font-size="11.5" fill="#1f2328">主角：时间　│　冲突：行式牢笼 vs 时间洪流（空间放大 × 删除昂贵 × 聚合缓慢）</text>
  <text x="560" y="92" font-size="12" font-weight="700" fill="#1f2328">🎬 收束</text>
  <text x="560" y="109" font-size="11.5" fill="#1f2328">能回答「该不该用 / 用哪个 SKU / 成本多少 / 迁移代价多大」</text>

  <!-- ===== 阶段卡片 ===== -->

  <!-- 阶段 1 -->
  <rect x="24" y="140" width="150" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
