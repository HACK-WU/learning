  <text x="755" y="209" text-anchor="middle" font-size="11" fill="#1f2937">L13 部署与容量</text>
  <text x="755" y="224" text-anchor="middle" font-size="11" fill="#1f2937">L14 降采样与成本</text>
  <text x="755" y="239" text-anchor="middle" font-size="11" fill="#1f2937">L15 处理引擎插件</text>
  <text x="755" y="254" text-anchor="middle" font-size="11" fill="#1f2937">L16 生态集成</text>
  <rect x="698" y="262" width="114" height="20" rx="5" fill="#ffffff" stroke="#9333ea" stroke-width="1"/>
  <text x="755" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#7e22ce">⬜ 未开始 0/4</text>

  <!-- 阶段 6 -->
  <rect x="844" y="140" width="132" height="150" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="910" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">阶段 6</text>
  <text x="910" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">对比与决策</text>
  <line x1="862" y1="192" x2="958" y2="192" stroke="#0d9488" stroke-width="1" opacity="0.4"/>
