  <text x="910" y="224" text-anchor="middle" font-size="11" fill="#1f2937">L18 迁移指南</text>
  <text x="910" y="239" text-anchor="middle" font-size="11" fill="#1f2937">L19 场景演练</text>
  <rect x="862" y="248" width="96" height="20" rx="5" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
