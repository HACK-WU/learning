  <text x="99" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">问题与定位</text>
  <line x1="42" y1="192" x2="156" y2="192" stroke="#2563eb" stroke-width="1" opacity="0.4"/>
  <text x="99" y="209" text-anchor="middle" font-size="11" fill="#1f2937">L1 为什么需要 TSDB</text>
  <text x="99" y="224" text-anchor="middle" font-size="11" fill="#1f2937">L2 三代演进与生态位</text>
  <rect x="42" y="236" width="114" height="20" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="99" y="250" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">✅ 已完成 2/2</text>
  <text x="99" y="272" text-anchor="middle" font-size="10" fill="#1f2937">转折：认冲突</text>
  <text x="99" y="285" text-anchor="middle" font-size="10" fill="#57606a">听说过 → 知道为什么</text>

