<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="920" height="350" fill="#ffffff"/>

  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">阶段 5 · 生产落地</text>
  <text x="460" y="54" text-anchor="middle" font-size="12.5" fill="#57606a">4 课 / 12 知识点 · 章节定位：上生产 —— 部署、降本、接生态</text>

  <rect x="24" y="68" width="872" height="38" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="40" y="86" font-size="12" font-weight="700" fill="#581c87">🎬 本章节的故事转折</text>
  <text x="40" y="102" font-size="11.5" fill="#1f2937">从"知道边界"到"能扛生产"　│　状态变化：知道它的边界 → 能让它在生产环境稳定跑并控制住成本</text>

  <!-- L13 -->
  <rect x="24" y="122" width="212" height="164" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="40" y="147" font-size="13" font-weight="700" fill="#581c87">L13 · 部署形态与容量规划</text>
  <rect x="40" y="158" width="180" height="44" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="52" y="175" font-size="10.5" font-weight="700" fill="#7e22ce">① Core/Enterprise/Cloud</text>
  <text x="52" y="191" font-size="9.5" fill="#1f2937">关键看是否查历史数据</text>
  <rect x="40" y="208" width="180" height="44" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="52" y="225" font-size="10.5" font-weight="700" fill="#7e22ce">② 容量规划与硬件</text>
  <text x="52" y="241" font-size="9.5" fill="#1f2937">按点数 × 字节数估算</text>
  <rect x="40" y="258" width="180" height="20" rx="5" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="52" y="272" font-size="9.5" fill="#57606a">③ 高可用与备份</text>

  <!-- L14 -->
  <rect x="248" y="122" width="212" height="164" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="264" y="147" font-size="13" font-weight="700" fill="#581c87">L14 · 降采样、保留与成本</text>
  <rect x="264" y="158" width="180" height="44" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="276" y="175" font-size="10.5" font-weight="700" fill="#7e22ce">① 保留策略与删除</text>
  <text x="276" y="191" font-size="9.5" fill="#1f2937">删分区而非删行</text>
  <rect x="264" y="208" width="180" height="44" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="276" y="225" font-size="10.5" font-weight="700" fill="#7e22ce">② 降采样与成本模型</text>
  <text x="276" y="241" font-size="9.5" fill="#1f2937">秒级 7 天 / 分钟级 90 天</text>
  <rect x="264" y="258" width="180" height="20" rx="5" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="276" y="272" font-size="9.5" fill="#57606a">③ 冷数据分层</text>

  <!-- L15 -->
  <rect x="472" y="122" width="212" height="164" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="488" y="147" font-size="13" font-weight="700" fill="#581c87">L15 · 处理引擎插件</text>
  <rect x="488" y="158" width="180" height="44" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="500" y="175" font-size="10.5" font-weight="700" fill="#7e22ce">① 处理引擎架构</text>
  <text x="500" y="191" font-size="9.5" fill="#1f2937">内嵌 Python VM</text>
  <rect x="488" y="208" width="180" height="44" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="500" y="225" font-size="10.5" font-weight="700" fill="#7e22ce">② Python 插件与触发器</text>
  <text x="500" y="241" font-size="9.5" fill="#1f2937">WAL flush / 定时调度</text>
  <rect x="488" y="258" width="180" height="20" rx="5" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="500" y="272" font-size="9.5" fill="#57606a">③ 内置插件与告警</text>

  <!-- L16 -->
  <rect x="696" y="122" width="200" height="164" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="712" y="147" font-size="13" font-weight="700" fill="#581c87">L16 · 生态集成</text>
  <rect x="712" y="158" width="168" height="44" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="724" y="175" font-size="10.5" font-weight="700" fill="#7e22ce">① Telegraf 采集生态</text>
  <text x="724" y="191" font-size="9.5" fill="#1f2937">400+ 插件</text>
  <rect x="712" y="208" width="168" height="44" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="724" y="225" font-size="10.5" font-weight="700" fill="#7e22ce">② Grafana 可视化</text>
  <text x="724" y="241" font-size="9.5" fill="#1f2937">Flight SQL 数据源</text>
  <rect x="712" y="258" width="168" height="20" rx="5" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="724" y="272" font-size="9.5" fill="#57606a">③ 监控 InfluxDB 自身</text>

  <line x1="238" y1="204" x2="246" y2="204" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="462" y1="204" x2="470" y2="204" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="686" y1="204" x2="694" y2="204" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="24" y="300" width="872" height="34" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="322" font-size="11.5" fill="#1f2937">➡️ 本阶段出口能力：能定部署方案、算清存储成本账、接好采集与可视化链路　│　下一阶段：阶段 6《对比与决策》</text>
</svg>
