<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="920" height="350" fill="#ffffff"/>

  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">阶段 6 · 对比与决策</text>
  <text x="460" y="54" text-anchor="middle" font-size="12.5" fill="#57606a">3 课 / 7 知识点 · 章节定位：做抉择 —— 横向对比、迁移、选型</text>

  <rect x="24" y="68" width="872" height="38" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="40" y="86" font-size="12" font-weight="700" fill="#134e4a">🎬 本章节的故事转折</text>
  <text x="40" y="102" font-size="11.5" fill="#1f2937">从"能扛生产"到"能向团队交代"　│　状态变化：能扛生产 → 能回答"该不该用、用哪个、代价多大"</text>

  <!-- L17 -->
  <rect x="24" y="122" width="288" height="164" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="40" y="147" font-size="13.5" font-weight="700" fill="#134e4a">L17 · 横向对比：五款候选</text>
  <rect x="40" y="158" width="256" height="44" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="52" y="175" font-size="11" font-weight="700" fill="#0f766e">① 五款候选速览</text>
  <text x="52" y="191" font-size="10" fill="#1f2937">TimescaleDB / VictoriaMetrics / ClickHouse</text>
  <rect x="40" y="208" width="256" height="44" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="52" y="225" font-size="11" font-weight="700" fill="#0f766e">② 与 Prometheus 的关系</text>
  <text x="52" y="241" font-size="10" fill="#1f2937">存储引擎 vs 完整监控方案</text>
  <rect x="40" y="258" width="256" height="20" rx="5" fill="#ffffff" stroke="#5eead4"/>
  <text x="52" y="272" font-size="10" fill="#57606a">③ 关键维度对比表</text>

  <!-- L18 -->
  <rect x="326" y="122" width="288" height="164" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="342" y="147" font-size="13.5" font-weight="700" fill="#134e4a">L18 · 迁移指南：1.x/2.x → 3.x</text>
  <rect x="342" y="158" width="256" height="44" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="354" y="175" font-size="11" font-weight="700" fill="#0f766e">① 三代差异清单</text>
  <text x="354" y="191" font-size="10" fill="#1f2937">API / 查询语言 / 术语变化</text>
  <rect x="342" y="208" width="256" height="44" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="354" y="225" font-size="11" font-weight="700" fill="#0f766e">② 迁移路径与工具</text>
  <text x="354" y="241" font-size="10" fill="#1f2937">Flux → SQL 改写策略</text>
  <rect x="342" y="258" width="256" height="20" rx="5" fill="#ffffff" stroke="#5eead4"/>
  <text x="354" y="272" font-size="10" fill="#57606a">③ 版本升级注意事项（catalog 备份）</text>

  <!-- L19 -->
  <rect x="628" y="122" width="268" height="164" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="644" y="147" font-size="13.5" font-weight="700" fill="#134e4a">L19 · 场景演练与选型决策</text>
  <rect x="644" y="158" width="236" height="44" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="656" y="175" font-size="11" font-weight="700" fill="#0f766e">① 选型决策树</text>
  <text x="656" y="191" font-size="10" fill="#1f2937">把"哪个更好"翻译成成本</text>
  <rect x="644" y="208" width="236" height="44" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="656" y="225" font-size="11" font-weight="700" fill="#0f766e">② 三个场景演练</text>
  <text x="656" y="241" font-size="10" fill="#1f2937">IoT / APM / 业务指标</text>
  <rect x="644" y="258" width="236" height="20" rx="5" fill="#ffffff" stroke="#5eead4"/>
  <text x="656" y="272" font-size="10" fill="#57606a">③ 落地检查清单</text>

  <line x1="316" y1="204" x2="324" y2="204" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="618" y1="204" x2="626" y2="204" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 终点产物 -->
  <rect x="24" y="300" width="872" height="34" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="40" y="322" font-size="11.5" fill="#1f2937">🏁 本阶段出口 = 全课程终点产物：《时序数据库选型与落地方案》—— 一份能向团队汇报的决策文档</text>
