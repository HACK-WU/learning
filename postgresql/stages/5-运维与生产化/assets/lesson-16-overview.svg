<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180">
<rect x="0" y="0" width="1000" height="1180" rx="0" fill="#ffffff"/>
<text x="500.0" y="40" font-size="21" fill="#333333" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">课 16 · 监控与性能：把“凭感觉”换成“凭指标”</text>
<text x="500.0" y="64" font-size="12.5" fill="#777" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">实测环境 PostgreSQL 17.11 · 实验数据见 labs/out_l16_full.md</text>
<rect x="24" y="88" width="952" height="150" rx="8" fill="#fafafa"/>
<text x="44" y="116" font-size="15" fill="#333333" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">① 巡检五件套：一套 SQL 看全集群健康度（实测值）</text>
<rect x="44" y="132" width="176" height="94" rx="8" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<text x="132" y="152" font-size="13" fill="#1565C0" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">连接与会话</text>
<text x="132" y="172" font-size="10.5" fill="#555" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">pg_stat_activity</text>
<text x="132" y="192" font-size="11" fill="#333333" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">state×backend_type 分组</text>
<text x="132" y="210" font-size="10" fill="#777" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">1 客户端 + 7 后台</text>
<rect x="232" y="132" width="176" height="94" rx="8" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<text x="320" y="152" font-size="13" fill="#1565C0" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">库级累计</text>
<text x="320" y="172" font-size="10.5" fill="#555" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">pg_stat_database</text>
<text x="320" y="192" font-size="11" fill="#333333" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">命中率 98.45%</text>
<text x="320" y="210" font-size="10" fill="#777" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">deadlocks=4（课13痕迹）</text>
<rect x="420" y="132" width="176" height="94" rx="8" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<text x="508" y="152" font-size="13" fill="#1565C0" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">WAL 与检查点</text>
<text x="508" y="172" font-size="10.5" fill="#555" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">pg_stat_wal / checkpointer</text>
<text x="508" y="192" font-size="11" fill="#333333" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">累计 3.7 GB</text>
<text x="508" y="210" font-size="10" fill="#777" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">PG 17 列名全改！</text>
<rect x="608" y="132" width="176" height="94" rx="8" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<text x="696" y="152" font-size="13" fill="#1565C0" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">表级 TOP</text>
<text x="696" y="172" font-size="10.5" fill="#555" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">pg_stat_user_tables</text>
<text x="696" y="192" font-size="11" fill="#333333" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">seq_scan / n_dead_tup</text>
<text x="696" y="210" font-size="10" fill="#777" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">orders_big 扫 20 次</text>
<rect x="796" y="132" width="176" height="94" rx="8" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
<text x="884" y="152" font-size="13" fill="#1565C0" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">未用索引</text>
<text x="884" y="172" font-size="10.5" fill="#555" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">pg_stat_user_indexes</text>
<text x="884" y="192" font-size="11" fill="#333333" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">idx_scan=0 共 5 个</text>
<text x="884" y="210" font-size="10" fill="#777" font-weight="normal" text-anchor="middle" font-family="PingFang SC, sans-serif">≠该删（3 行小表）</text>
<rect x="24" y="258" width="952" height="150" rx="8" fill="#fafafa"/>
<text x="44" y="286" font-size="15" fill="#333333" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">② pg_stat_activity：state × wait_event 定位“谁在等什么”（实验 C 实拍）</text>
<rect x="60" y="300" width="190" height="26" rx="6" fill="#FFF8E1"/>
<text x="155" y="318" font-size="12.5" fill="#B26A00" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">idle in transaction</text>
<text x="266" y="318" font-size="12" fill="#B26A00" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">Client / ClientRead</text>
<text x="430" y="318" font-size="12" fill="#555" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">持锁但等客户端发下一条 SQL —— 最危险状态</text>
<rect x="60" y="332" width="190" height="26" rx="6" fill="#E3F2FD"/>
<text x="155" y="350" font-size="12.5" fill="#1565C0" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">active</text>
<text x="266" y="350" font-size="12" fill="#1565C0" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">Lock / transactionid</text>
<text x="430" y="350" font-size="12" fill="#555" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">正在等另一事务的行锁（课 13 同款现场）</text>
<rect x="60" y="364" width="190" height="26" rx="6" fill="#ffffff"/>
<text x="155" y="382" font-size="12.5" fill="#333333" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">idle</text>
<text x="266" y="382" font-size="12" fill="#1565C0" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">—</text>
<text x="430" y="382" font-size="12" fill="#555" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">等客户端下一条命令（官方六 state 之一）</text>
<text x="60" y="402" font-size="11.5" fill="#2E7D32" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">抓等待链用 pg_blocking_pids()（课 13 官方推荐）；统计有延迟：pg_stat_force_next_flush() 可强制落账（实测 0 → 1000）</text>
<rect x="24" y="428" width="952" height="190" rx="8" fill="#fafafa"/>
<text x="44" y="456" font-size="15" fill="#333333" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">③ pg_stat_io（PG 16+）：命中率必须按 context 看（同库同时刻实测）</text>
<text x="60" y="486" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">bulkread（大表顺序扫）</text>
<rect x="280" y="472" width="78" height="18" fill="#FFEBEE"/>
<rect x="280" y="472" width="11" height="18" fill="#C62828"/>
<text x="368" y="486" font-size="12" fill="#C62828" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">13.6%（251517 reads / 39463 hits）</text>
<text x="60" y="516" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">normal（普通查询）</text>
<rect x="280" y="502" width="560" height="18" fill="#E8F5E9"/>
<rect x="280" y="502" width="559" height="18" fill="#2E7D32"/>
<text x="850" y="516" font-size="12" fill="#2E7D32" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">99.9%</text>
<text x="60" y="546" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">vacuum（清理 IO）</text>
<rect x="280" y="532" width="240" height="18" fill="#FFF8E1"/>
<rect x="280" y="532" width="105" height="18" fill="#B26A00"/>
<text x="530" y="546" font-size="12" fill="#B26A00" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">43.9%～56.8%</text>
<text x="60" y="584" font-size="12" fill="#555" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">bulkread 天生低命中：大表扫描走环形缓冲、故意不污染共享缓冲——低是设计，不是故障</text>
<text x="60" y="602" font-size="11.5" fill="#777" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">track_io_timing 默认 off（计时开销）；会话级 SET 即可开，无需重启</text>
<rect x="24" y="638" width="952" height="170" rx="8" fill="#fafafa"/>
<text x="44" y="666" font-size="15" fill="#333333" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">④ pg_stat_progress_vacuum：长命令有了进度条（800 万行 / 112198 页实测）</text>
<text x="60" y="714" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">采样1  19%</text>
<rect x="150" y="700" width="106" height="14" fill="#2E7D32"/>
<text x="722" y="712" font-size="11" fill="#777" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">21124/112198 页</text>
<text x="60" y="736" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">采样2  34%</text>
<rect x="150" y="722" width="190" height="14" fill="#2E7D32"/>
<text x="722" y="734" font-size="11" fill="#777" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">38622/112198 页</text>
<text x="60" y="758" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">采样3  51%</text>
<rect x="150" y="744" width="285" height="14" fill="#2E7D32"/>
<text x="722" y="756" font-size="11" fill="#777" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">57754/112198 页</text>
<text x="60" y="780" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">采样4  72%</text>
<rect x="150" y="766" width="403" height="14" fill="#2E7D32"/>
<text x="722" y="778" font-size="11" fill="#777" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">80720/112198 页</text>
<text x="60" y="802" font-size="11.5" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">采样5  96%</text>
<rect x="150" y="788" width="537" height="14" fill="#2E7D32"/>
<text x="722" y="800" font-size="11" fill="#777" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">107255/112198 页</text>
<text x="60" y="790" font-size="11.5" fill="#555" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">phase：scanning heap → vacuuming indexes → …；130MB 小表 1 秒完事，进度条根本抓不到——它是为大表准备的</text>
<rect x="24" y="828" width="952" height="150" rx="8" fill="#fafafa"/>
<text x="44" y="856" font-size="15" fill="#333333" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">⑤ 慢查询取证两件套：一个记“跑了什么”，一个记“怎么跑的”</text>
<rect x="60" y="872" width="440" height="92" rx="8" fill="#ffffff" stroke="#1565C0" stroke-width="1.2"/>
<text x="280" y="894" font-size="13" fill="#1565C0" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">log_min_duration_statement（内核参数）</text>
<text x="80" y="916" font-size="12" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">记录：语句文本 + 耗时</text>
<text x="80" y="934" font-size="11" fill="#777" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">实测：duration: 4889.999 ms statement: VACUUM …</text>
<text x="80" y="952" font-size="11" fill="#555" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">课 10 已用；默认 -1 关闭，pg_reload_conf 即生效</text>
<rect x="524" y="872" width="432" height="92" rx="8" fill="#ffffff" stroke="#2E7D32" stroke-width="1.2"/>
<text x="740" y="894" font-size="13" fill="#2E7D32" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">auto_explain（扩展，可 LOAD 会话级加载）</text>
<text x="544" y="916" font-size="12" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">记录：语句文本 + 耗时 + 完整执行计划</text>
<text x="544" y="934" font-size="11" fill="#777" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">实测：Parallel Seq Scan / Workers Launched: 2</text>
<text x="544" y="952" font-size="11" fill="#555" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">log_min_duration 默认 -1；配合 log_analyze 注意开销</text>
<text x="60" y="984" font-size="12" fill="#B26A00" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">pg_stat_statements 管累计排行（注意：等锁时间计入 total_exec_time——TOP1 未必是坏 SQL，先问慢在哪）</text>
<rect x="24" y="998" width="952" height="130" rx="8" fill="#fafafa"/>
<text x="44" y="1026" font-size="15" fill="#333333" font-weight="bold" text-anchor="start" font-family="PingFang SC, sans-serif">⑥ 从库上查询被取消：同一句报错，两种根源（hot standby 冲突分流实测）</text>
<rect x="60" y="1042" width="440" height="74" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2"/>
<text x="280" y="1062" font-size="12.5" fill="#C62828" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">confl_lock（锁等待超时）</text>
<text x="80" y="1082" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">DETAIL: User was holding a relation lock for too long.</text>
<text x="80" y="1098" font-size="11" fill="#555" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">场景：主库 DROP 从库正查着的表（重放要表锁）</text>
<rect x="524" y="1042" width="432" height="74" rx="8" fill="#FFF8E1" stroke="#B26A00" stroke-width="1.2"/>
<text x="740" y="1062" font-size="12.5" fill="#B26A00" font-weight="bold" text-anchor="middle" font-family="PingFang SC, sans-serif">confl_snapshot（行版本被清理）</text>
<text x="544" y="1082" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">DETAIL: … needed to see row versions that must be removed.</text>
<text x="544" y="1098" font-size="11" fill="#555" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">场景：主库 DELETE+VACUUM，从库快照还要旧版本</text>
<text x="60" y="1136" font-size="11.5" fill="#555" font-weight="normal" text-anchor="start" font-family="PingFang SC, sans-serif">报错第一行相同（conflict with recovery），分流看 DETAIL + pg_stat_database_conflicts 计数器列；30 秒来自 max_standby_streaming_delay 默认值</text>
</svg>