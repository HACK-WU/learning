<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1310" width="920" height="1310" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="920" height="1310" fill="#fafafa"/>

  <defs>
    <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#999"/>
    </marker>
    <marker id="arwB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="30" y="40" font-size="24" font-weight="700" fill="#0d47a1">课 12 · MVCC 与并发控制</text>
  <text x="30" y="64" font-size="13" fill="#666">PostgreSQL 17.11 实测 · 版本链 / 三道闸门 / 死元组 / autovacuum / 回卷</text>
  <line x1="30" y1="78" x2="890" y2="78" stroke="#dcdcdc" stroke-width="1"/>

  <!-- ============ 模块 1：系统列五虎 ============ -->
  <text x="30" y="104" font-size="15" font-weight="700" fill="#333">① 五个系统列 —— 每个元组自带的"身份证"</text>

  <g>
    <rect x="30" y="116" width="161" height="100" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="30" y="116" width="161" height="4" rx="2" fill="#1565c0"/>
    <text x="44" y="142" font-size="13.5" font-weight="700" fill="#1565c0">xmin</text>
    <text x="44" y="162" font-size="11.5" fill="#333">插入它的事务 ID</text>
    <text x="44" y="180" font-size="11" fill="#666">官方：inserting txid</text>
    <text x="44" y="196" font-size="11" fill="#666">决定"生"的时刻</text>
    <text x="44" y="210" font-size="11" fill="#666">实测初值 1151</text>
  </g>

  <g>
    <rect x="202" y="116" width="161" height="100" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="202" y="116" width="161" height="4" rx="2" fill="#e65100"/>
    <text x="216" y="142" font-size="13.5" font-weight="700" fill="#e65100">xmax</text>
    <text x="216" y="162" font-size="11.5" fill="#333">删除它的事务 ID</text>
    <text x="216" y="180" font-size="11" fill="#666">0 = 没被删过</text>
    <text x="216" y="196" font-size="11" fill="#e65100">非零 ≠ 一定删了</text>
    <text x="216" y="210" font-size="11" fill="#666">（可能回滚了）</text>
  </g>

  <g>
    <rect x="374" y="116" width="161" height="100" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="374" y="116" width="161" height="4" rx="2" fill="#7b1fa2"/>
    <text x="388" y="142" font-size="13.5" font-weight="700" fill="#7b1fa2">cmin / cmax</text>
    <text x="388" y="162" font-size="11.5" fill="#333">事务内第几条命令</text>
    <text x="388" y="180" font-size="11" fill="#666">从 0 开始计数</text>
    <text x="388" y="196" font-size="11" fill="#666">决定同一事务内</text>
    <text x="388" y="210" font-size="11" fill="#666">多条命令看到什么</text>
  </g>

  <g>
    <rect x="546" y="116" width="161" height="100" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="546" y="116" width="161" height="4" rx="2" fill="#388e3c"/>
    <text x="560" y="142" font-size="13.5" font-weight="700" fill="#388e3c">ctid</text>
    <text x="560" y="162" font-size="11.5" fill="#333">物理位置 (页,行)</text>
    <text x="560" y="180" font-size="11" fill="#666">UPDATE 后必变</text>
    <text x="560" y="196" font-size="11" fill="#388e3c">(0,1) → (0,4)</text>
    <text x="560" y="210" font-size="11" fill="#666">证明是新行不是改</text>
  </g>

  <g>
    <rect x="718" y="116" width="161" height="100" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="718" y="116" width="161" height="4" rx="2" fill="#0d47a1"/>
    <text x="732" y="142" font-size="13.5" font-weight="700" fill="#0d47a1">组合起来</text>
    <text x="732" y="162" font-size="11.5" fill="#333">xmin 生 / xmax 死</text>
    <text x="732" y="180" font-size="11" fill="#666">这一对就划出了</text>
    <text x="732" y="196" font-size="11" fill="#666">一个版本的</text>
    <text x="732" y="210" font-size="11" fill="#666">"有效期"</text>
  </g>

  <!-- ============ 模块 2：版本链 ============ -->
  <text x="30" y="252" font-size="15" font-weight="700" fill="#333">② 版本链 —— 同一个逻辑行的"前世今生"</text>

  <g>
    <rect x="30" y="264" width="120" height="78" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="90" y="284" font-size="13" font-weight="700" fill="#666" text-anchor="middle">lp1</text>
    <text x="90" y="302" font-size="11.5" fill="#333" text-anchor="middle">xmin 1151</text>
    <text x="90" y="318" font-size="11.5" fill="#e65100" text-anchor="middle">xmax 1153</text>
    <text x="90" y="333" font-size="11" fill="#999" text-anchor="middle">→ (0,4)</text>
  </g>
  <line x1="152" y1="303" x2="208" y2="303" stroke="#999" stroke-width="1.6" marker-end="url(#arwG)"/>

  <g>
    <rect x="212" y="264" width="120" height="78" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="272" y="284" font-size="13" font-weight="700" fill="#666" text-anchor="middle">lp4</text>
    <text x="272" y="302" font-size="11.5" fill="#333" text-anchor="middle">xmin 1153</text>
    <text x="272" y="318" font-size="11.5" fill="#e65100" text-anchor="middle">xmax 1154</text>
    <text x="272" y="333" font-size="11" fill="#999" text-anchor="middle">→ (0,5)</text>
  </g>
  <line x1="334" y1="303" x2="390" y2="303" stroke="#999" stroke-width="1.6" marker-end="url(#arwG)"/>

  <g>
    <rect x="394" y="264" width="120" height="78" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="454" y="284" font-size="13" font-weight="700" fill="#666" text-anchor="middle">lp5</text>
    <text x="454" y="302" font-size="11.5" fill="#333" text-anchor="middle">xmin 1154</text>
    <text x="454" y="318" font-size="11.5" fill="#e65100" text-anchor="middle">xmax 1155</text>
    <text x="454" y="333" font-size="11" fill="#999" text-anchor="middle">→ (0,6)</text>
  </g>
  <line x1="516" y1="303" x2="572" y2="303" stroke="#999" stroke-width="1.6" marker-end="url(#arwG)"/>

  <g>
    <rect x="576" y="264" width="120" height="78" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="636" y="284" font-size="13" font-weight="700" fill="#666" text-anchor="middle">lp6</text>
    <text x="636" y="302" font-size="11.5" fill="#333" text-anchor="middle">xmin 1155</text>
    <text x="636" y="318" font-size="11.5" fill="#e65100" text-anchor="middle">xmax 1156</text>
    <text x="636" y="333" font-size="11" fill="#999" text-anchor="middle">→ (0,7)</text>
  </g>
  <line x1="698" y1="303" x2="754" y2="303" stroke="#999" stroke-width="1.6" marker-end="url(#arwG)"/>

  <g>
    <rect x="758" y="264" width="120" height="78" rx="5" fill="#f1f8e9" stroke="#388e3c" stroke-width="1.6"/>
    <text x="818" y="284" font-size="13" font-weight="700" fill="#388e3c" text-anchor="middle">lp7</text>
    <text x="818" y="302" font-size="11.5" fill="#333" text-anchor="middle">xmin 1156</text>
    <text x="818" y="318" font-size="11.5" fill="#388e3c" text-anchor="middle">xmax 0</text>
    <text x="818" y="333" font-size="11" fill="#666" text-anchor="middle">→ 指向自己</text>
  </g>

  <rect x="30" y="352" width="848" height="44" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="44" y="371" font-size="12.5" fill="#333">逻辑上 <tspan font-weight="700" fill="#0d47a1">3 行</tspan>，物理上 <tspan font-weight="700" fill="#e65100">7 个元组</tspan> —— <tspan fill="#666">id=1 被连续改 4 次，产生 5 个版本；lp2 / lp3 是 id=2、id=3，从未被改过（xmax=0）</tspan></text>
  <text x="44" y="388" font-size="11.5" fill="#666">只有链尾 lp7 是当前版本，其余 4 个都是尸体 —— 它们加起来就是"表为什么变大了"的答案</text>

  <!-- ============ 模块 3：三道闸门 ============ -->
  <text x="30" y="424" font-size="15" font-weight="700" fill="#333">③ 可见性判断 —— 每个版本要过三道闸门</text>

  <g>
    <rect x="30" y="436" width="273" height="114" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="30" y="436" width="273" height="4" rx="2" fill="#1565c0"/>
    <text x="46" y="462" font-size="13.5" font-weight="700" fill="#1565c0">闸门 ① xmin 提交了吗？</text>
    <text x="46" y="482" font-size="11.5" fill="#333">· 未提交 / 在我的快照之后 → 不可见</text>
    <text x="46" y="500" font-size="11.5" fill="#666">· "未来的东西我看不见"</text>
    <text x="46" y="518" font-size="11.5" fill="#333">· 是我自己写的未提交行 → 只有我能看见</text>
    <text x="46" y="536" font-size="11" fill="#888">对应快照字段：xmax（还活着的都不算）</text>
  </g>

  <g>
    <rect x="316" y="436" width="273" height="114" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="316" y="436" width="273" height="4" rx="2" fill="#e65100"/>
    <text x="332" y="462" font-size="13.5" font-weight="700" fill="#e65100">闸门 ② xmax 呢？</text>
    <text x="332" y="482" font-size="11.5" fill="#333">· xmax = 0 → 没被删过，可见</text>
    <text x="332" y="500" font-size="11.5" fill="#333">· xmax 事务已提交 → 已删，不可见</text>
    <text x="332" y="518" font-size="11.5" fill="#e65100">· xmax 事务回滚了 → 没删成，仍可见</text>
    <text x="332" y="536" font-size="11" fill="#888">实测：A 回滚后 t_xmax 仍是 1159，页面一字未改</text>
  </g>

  <g>
    <rect x="602" y="436" width="276" height="114" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="602" y="436" width="276" height="4" rx="2" fill="#7b1fa2"/>
    <text x="618" y="462" font-size="13.5" font-weight="700" fill="#7b1fa2">闸门 ③ 我在事务的第几条命令？</text>
    <text x="618" y="482" font-size="11.5" fill="#333">· cmin / cmax 决定</text>
    <text x="618" y="500" font-size="11.5" fill="#333">· 同事务内，命令只能看见它开始前</text>
    <text x="618" y="518" font-size="11.5" fill="#666">  就已存在的版本</text>
    <text x="618" y="536" font-size="11" fill="#888">实测：id=11 的 cmin=1，被改过的 id=10 是 2</text>
  </g>

  <rect x="30" y="560" width="848" height="40" rx="5" fill="#f1f8e9" stroke="#c5e1a5"/>
  <text x="44" y="578" font-size="12.5" fill="#333">三问都答完 → 这个版本"该不该被我看见"；</text>
  <text x="44" y="594" font-size="12.5" fill="#333"><tspan font-weight="700" fill="#e65100">连未来所有事务都看不见的版本 = 死元组（dead row version）</tspan><tspan fill="#666"> —— 它不占逻辑空间，但实打实占物理空间</tspan></text>

  <!-- ============ 模块 4：膨胀与 VACUUM ============ -->
  <text x="30" y="630" font-size="15" font-weight="700" fill="#333">④ 表膨胀与三种 VACUUM —— 18 MB 是怎么来的，又怎么还回去</text>

  <g>
    <rect x="30" y="642" width="194" height="94" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="127" y="664" font-size="12.5" font-weight="700" fill="#e65100" text-anchor="middle">① UPDATE 10 万次</text>
    <text x="127" y="684" font-size="11.5" fill="#333" text-anchor="middle">4328 kB → 18 MB</text>
    <text x="127" y="701" font-size="11.5" fill="#e65100" text-anchor="middle">死元组 299,925</text>
    <text x="127" y="718" font-size="11.5" fill="#666" text-anchor="middle">192 B / 行</text>
    <text x="127" y="731" font-size="10.5" fill="#999" text-anchor="middle">行数从头到尾没变</text>
  </g>
  <line x1="232" y1="689" x2="306" y2="689" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arwB)"/>

  <g>
    <rect x="316" y="642" width="194" height="94" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="413" y="664" font-size="12.5" font-weight="700" fill="#1565c0" text-anchor="middle">② VACUUM</text>
    <text x="413" y="684" font-size="11.5" fill="#333" text-anchor="middle">18 MB（一点没变！）</text>
    <text x="413" y="701" font-size="11.5" fill="#388e3c" text-anchor="middle">死元组 → 0</text>
    <text x="413" y="718" font-size="11.5" fill="#666" text-anchor="middle">空间标为"可复用"</text>
    <text x="413" y="731" font-size="10.5" fill="#999" text-anchor="middle">不还磁盘，只腾地方</text>
  </g>
  <line x1="518" y1="689" x2="592" y2="689" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arwB)"/>

  <g>
    <rect x="602" y="642" width="194" height="94" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="699" y="664" font-size="12.5" font-weight="700" fill="#1565c0" text-anchor="middle">③ 再 UPDATE 10 万次</text>
    <text x="699" y="684" font-size="11.5" fill="#333" text-anchor="middle">仍是 18 MB</text>
    <text x="699" y="701" font-size="11.5" fill="#388e3c" text-anchor="middle">一 kB 都没涨</text>
    <text x="699" y="718" font-size="11.5" fill="#666" text-anchor="middle">旧空间被复用</text>
    <text x="699" y="731" font-size="10.5" fill="#999" text-anchor="middle">这才是 VACUUM 的价值</text>
  </g>
  <line x1="804" y1="689" x2="878" y2="689" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arwB)"/>

  <rect x="30" y="746" width="848" height="42" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="44" y="765" font-size="12.5" fill="#333">④ <tspan font-weight="700" fill="#0d47a1">VACUUM FULL</tspan> → <tspan font-weight="700" fill="#388e3c">6592 kB（52 B/行）</tspan><tspan fill="#666"> —— 膨胀 3.7 倍被真正收回</tspan></text>
  <text x="44" y="781" font-size="11.5" fill="#e65100">代价：ACCESS EXCLUSIVE 锁（实测被另一个会话的 AccessShareLock 阻塞）+ 额外需要约一份表大小的磁盘</text>

  <!-- ============ 模块 5：HOT ============ -->
  <text x="30" y="818" font-size="15" font-weight="700" fill="#333">⑤ HOT 更新 —— 同样一次 UPDATE，为什么一个快一个慢</text>

  <g>
    <rect x="30" y="830" width="415" height="92" rx="6" fill="#f1f8e9" stroke="#c5e1a5"/>
    <text x="48" y="854" font-size="13" font-weight="700" fill="#388e3c">改【非索引列】→ HOT 生效</text>
    <text x="48" y="874" font-size="12" fill="#333">n_tup_hot_upd / n_tup_upd</text>
    <text x="48" y="894" font-size="16" font-weight="700" fill="#388e3c">5000 / 5000 = 100.0%</text>
    <text x="48" y="912" font-size="11" fill="#666">不写索引、不新增索引项 → 索引不膨胀</text>
  </g>

  <g>
    <rect x="462" y="830" width="416" height="92" rx="6" fill="#ffebee" stroke="#ffcdd2"/>
    <text x="480" y="854" font-size="13" font-weight="700" fill="#e65100">改【索引列】→ HOT 失效</text>
    <text x="480" y="874" font-size="12" fill="#333">n_tup_hot_upd / n_tup_upd</text>
    <text x="480" y="894" font-size="16" font-weight="700" fill="#e65100">0 / 5000 = 0.0%</text>
    <text x="480" y="912" font-size="11" fill="#666">每个版本都要写一遍所有索引 → 索引一起膨胀</text>
  </g>

  <rect x="30" y="932" width="848" height="40" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="44" y="950" font-size="12.5" fill="#333">HOT 生效的两个条件（缺一不可）：<tspan fill="#666">① 新版本能放进<u>同一个页</u>（所以写频繁的表要调低 fillfactor，实测用 50）② 不修改任何<u>被索引的列</u></tspan></text>
  <text x="44" y="966" font-size="11.5" fill="#888">对照实验踩过的坑：第一轮 fillfactor=70 且全表 2 万行都更新，页里塞不下新版本，HOT 只有 43.4% —— 条件①没满足</text>

  <!-- ============ 模块 6：autovacuum 三条命 ============ -->
  <text x="30" y="1000" font-size="15" font-weight="700" fill="#333">⑥ autovacuum —— 后台清洁工的三条命</text>

  <g>
    <rect x="30" y="1012" width="273" height="96" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="30" y="1012" width="273" height="4" rx="2" fill="#1565c0"/>
    <text x="46" y="1038" font-size="13.5" font-weight="700" fill="#1565c0">命 1 · VACUUM</text>
    <text x="46" y="1058" font-size="11.5" fill="#333">回收死元组，腾出可复用空间</text>
    <text x="46" y="1076" font-size="11" fill="#666">触发 = threshold + scale_factor × 行数</text>
    <text x="46" y="1092" font-size="11" fill="#666">默认 50 + 0.2 × 行数</text>
    <text x="46" y="1104" font-size="10.5" fill="#e65100">1 亿行的表要攒 2000 万才触发一次</text>
  </g>

  <g>
    <rect x="316" y="1012" width="273" height="96" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="316" y="1012" width="273" height="4" rx="2" fill="#388e3c"/>
    <text x="332" y="1038" font-size="13.5" font-weight="700" fill="#388e3c">命 2 · ANALYZE</text>
    <text x="332" y="1058" font-size="11.5" fill="#333">更新统计信息 → 喂给执行计划</text>
    <text x="332" y="1076" font-size="11" fill="#666">触发 = analyze_threshold + scale_factor</text>
    <text x="332" y="1092" font-size="11" fill="#666">默认 50 + 0.1 × 行数</text>
    <text x="332" y="1104" font-size="10.5" fill="#888">接课 9：统计信息过期 = 计划跑偏</text>
  </g>

  <g>
    <rect x="602" y="1012" width="276" height="96" rx="6" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="602" y="1012" width="276" height="4" rx="2" fill="#7b1fa2"/>
    <text x="618" y="1038" font-size="13.5" font-weight="700" fill="#7b1fa2">命 3 · FREEZE</text>
    <text x="618" y="1058" font-size="11.5" fill="#333">冻结老事务 ID，防回卷</text>
    <text x="618" y="1076" font-size="11" fill="#666">触发 = 表年龄 &gt; freeze_table_age</text>
    <text x="618" y="1092" font-size="11" fill="#666">默认 1.5 亿，最迟 2 亿强制执行</text>
    <text x="618" y="1104" font-size="10.5" fill="#888">实测：VACUUM FREEZE 后 age 5 → 0</text>
  </g>

  <text x="30" y="1128" font-size="11.5" fill="#666">本机实测默认值（PG 17.11）：autovacuum=on · naptime=60s · max_workers=3 · vacuum_threshold=50 · vacuum_scale_factor=0.2 · insert_threshold=1000 · freeze_max_age=2 亿 · cost_delay=2ms</text>

  <!-- ============ 模块 7：回卷警戒线 ============ -->
  <text x="30" y="1156" font-size="15" font-weight="700" fill="#333">⑦ 事务 ID 回卷 —— 32 位只有 21 亿个，用完就"灾难性数据丢失"</text>

  <rect x="30" y="1168" width="169" height="26" fill="#e8f5e9" stroke="#e0e0e0"/>
  <rect x="199" y="1168" width="338" height="26" fill="#fff8e1" stroke="#e0e0e0"/>
  <rect x="537" y="1168" width="170" height="26" fill="#fff3e0" stroke="#e0e0e0"/>
  <rect x="707" y="1168" width="171" height="26" fill="#ffebee" stroke="#e0e0e0"/>

  <line x1="199" y1="1168" x2="199" y2="1194" stroke="#333" stroke-width="1.5"/>
  <line x1="537" y1="1168" x2="537" y2="1194" stroke="#333" stroke-width="1.5"/>
  <line x1="707" y1="1168" x2="707" y2="1194" stroke="#333" stroke-width="1.5"/>

  <text x="36" y="1185" font-size="11" fill="#666">0</text>
  <text x="199" y="1210" font-size="11.5" font-weight="700" fill="#388e3c" text-anchor="middle">5000 万</text>
  <text x="199" y="1226" font-size="10.5" fill="#888" text-anchor="middle">vacuum_freeze_min_age</text>
  <text x="537" y="1210" font-size="11.5" font-weight="700" fill="#e65100" text-anchor="middle">1.5 亿</text>
  <text x="537" y="1226" font-size="10.5" fill="#888" text-anchor="middle">vacuum_freeze_table_age</text>
  <text x="707" y="1210" font-size="11.5" font-weight="700" fill="#e65100" text-anchor="middle">2 亿</text>
  <text x="707" y="1226" font-size="10.5" fill="#888" text-anchor="middle">autovacuum_freeze_max_age</text>
  <text x="874" y="1210" font-size="11.5" font-weight="700" fill="#c62828" text-anchor="end">21 亿 · 硬墙</text>
  <text x="874" y="1226" font-size="10.5" fill="#888" text-anchor="end">wraparound</text>

  <text x="30" y="1250" font-size="12" fill="#c62828">官方原文用词是 catastrophic data loss（灾难性数据丢失）—— 这是 PG 里唯一会让你真的丢数据的运维疏忽。</text>
  <text x="30" y="1268" font-size="11.5" fill="#666">但官方也说：真到了这一步，<tspan fill="#333">「not necessary or desirable to stop the postmaster」</tspan> —— 不用停库，单表 VACUUM FREEZE 就能救。</text>
  <text x="30" y="1286" font-size="11.5" fill="#666">监控一条就够：<tspan font-family="monospace" fill="#333">SELECT datname, age(datfrozenxid) FROM pg_database;</tspan> —— 超过 1.5 亿就该告警</text>

</svg>
