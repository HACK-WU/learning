<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" font-family="-apple-system, 'PingFang SC', 'Segoe UI', sans-serif">
  <rect width="920" height="690" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="460" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0d47a1">课 7 一图总结 · 窗口函数：分组但不折叠</text>
  <text x="460" y="48" text-anchor="middle" font-size="11" fill="#666">上：7.1 / 7.2 / 7.3 三件事 · 下：默认帧决策树 + 排名三兄弟与受帧影响矩阵 · 实测于 PG 17.11（核查于 2026-09-07）</text>

  <!-- ========= 上半：3 个知识点 ========= -->

  <!-- ===== 7.1 ===== -->
  <g transform="translate(20, 66)">
    <rect width="280" height="206" rx="8" fill="#ffffff" stroke="#bcd"/>
    <rect width="280" height="28" rx="8" fill="#0d47a1"/>
    <text x="14" y="19" font-size="13" font-weight="700" fill="#ffffff">7.1 OVER / PARTITION BY / ORDER BY</text>

    <text x="14" y="50" font-size="11" font-weight="700" fill="#1565c0">🎯 用途：分组内计算，但一行都不合并</text>

    <g transform="translate(14, 60)">
      <rect width="252" height="104" rx="4" fill="#f5f7fa" stroke="#cfd8dc"/>
      <text x="8" y="15" font-size="10" fill="#333">函数名(...) OVER (</text>
      <text x="20" y="29" font-size="9" fill="#333">PARTITION BY u   <tspan fill="#666">← ①分班：谁是我同组</tspan></text>
      <text x="20" y="43" font-size="9" fill="#333">ORDER BY t       <tspan fill="#666">← ②排队：+ 悄悄改帧</tspan></text>
      <text x="20" y="57" font-size="9" fill="#333">ROWS/RANGE/GROUPS<tspan fill="#666">← ③圈人</tspan></text>
      <line x1="0" y1="66" x2="252" y2="66" stroke="#cfd8dc"/>
      <text x="8" y="81" font-size="9" font-weight="700" fill="#0d47a1">不折叠：40000 行进 → 40000 行出</text>
      <text x="8" y="95" font-size="9" fill="#666">GROUP BY 同样数据 → 只有 8 行</text>
    </g>

    <text x="14" y="180" font-size="9" font-weight="700" fill="#c62828">⚠️ 写了 ORDER BY = 帧变成 RANGE…CURRENT ROW</text>
    <text x="14" y="194" font-size="9" font-weight="700" fill="#0d47a1">   要"整组合计"就去掉 ORDER BY 或扩到 UNBOUNDED FOLLOWING</text>
  </g>

  <!-- ===== 7.2 ===== -->
  <g transform="translate(320, 66)">
    <rect width="280" height="206" rx="8" fill="#ffffff" stroke="#bcd"/>
    <rect width="280" height="28" rx="8" fill="#0d47a1"/>
    <text x="14" y="19" font-size="13" font-weight="700" fill="#ffffff">7.2 排名函数</text>

    <text x="14" y="50" font-size="11" font-weight="700" fill="#1565c0">🎯 用途：组内名次（并列时三者分道扬镳）</text>

    <g transform="translate(14, 60)">
      <rect width="252" height="104" rx="4" fill="#f5f7fa" stroke="#cfd8dc"/>
      <text x="8" y="14" font-size="9" font-weight="700" fill="#666">分数 100 / 90 / 90 / 80 实测：</text>
      <text x="8" y="31" font-size="10" fill="#333">ROW_NUMBER  <tspan font-weight="700" fill="#388e3c">1, 2, 3, 4</tspan>  <tspan font-size="8" fill="#666">无视并列</tspan></text>
      <text x="8" y="48" font-size="10" fill="#333">RANK        <tspan font-weight="700" fill="#e65100">1, 2, 2, 4</tspan>  <tspan font-size="8" fill="#666">跳号（奥运式）</tspan></text>
      <text x="8" y="65" font-size="10" fill="#333">DENSE_RANK  <tspan font-weight="700" fill="#1565c0">1, 2, 2, 3</tspan>  <tspan font-size="8" fill="#666">不跳号（档位）</tspan></text>
      <line x1="0" y1="74" x2="252" y2="74" stroke="#cfd8dc"/>
      <text x="8" y="89" font-size="9" fill="#333">要"恰好 N 行" → ROW_NUMBER（加 tie-breaker）</text>
      <text x="8" y="101" font-size="9" fill="#333">要"同分一起进" → RANK / DENSE_RANK</text>
    </g>

    <text x="14" y="180" font-size="9" font-weight="700" fill="#c62828">⚠️ 不写 ORDER BY = 随机发号，每次跑可能不同</text>
    <text x="14" y="194" font-size="9" font-weight="700" fill="#0d47a1">   NTILE / PERCENT_RANK / CUME_DIST 同属排名家族</text>
  </g>

  <!-- ===== 7.3 ===== -->
  <g transform="translate(620, 66)">
    <rect width="280" height="206" rx="8" fill="#ffffff" stroke="#bcd"/>
    <rect width="280" height="28" rx="8" fill="#0d47a1"/>
    <text x="14" y="19" font-size="13" font-weight="700" fill="#ffffff">7.3 聚合窗口函数 + 滑动</text>

    <text x="14" y="50" font-size="11" font-weight="700" fill="#1565c0">🎯 用途：累计 / 滑动 / 环比 / 一行多指标</text>

    <g transform="translate(14, 60)">
      <rect width="252" height="104" rx="4" fill="#f5f7fa" stroke="#cfd8dc"/>
      <text x="8" y="15" font-size="9" fill="#333">累计  SUM(x) OVER (ORDER BY t</text>
      <text x="60" y="27" font-size="9" fill="#333">ROWS UNBOUNDED PRECEDING AND CURRENT ROW)</text>
      <text x="8" y="43" font-size="9" fill="#333">滑动  AVG(x) OVER (ORDER BY t</text>
      <text x="60" y="55" font-size="9" fill="#333">ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)</text>
      <text x="8" y="71" font-size="9" fill="#333">环比  x - LAG(x) OVER (ORDER BY t)</text>
      <line x1="0" y1="80" x2="252" y2="80" stroke="#cfd8dc"/>
      <text x="8" y="95" font-size="9" fill="#333">FILTER  COUNT(*) FILTER (WHERE status='paid')</text>
    </g>

    <text x="14" y="180" font-size="9" font-weight="700" fill="#c62828">⚠️ LAST_VALUE 不扩帧 = 返回当前行自己</text>
    <text x="14" y="194" font-size="9" font-weight="700" fill="#0d47a1">   SUM…FILTER 遇空集给 NULL（COUNT 才给 0）</text>
  </g>

  <!-- ========= 下半左：默认帧决策树 + 帧模式三选一 ========= -->
  <g transform="translate(20, 288)">
    <rect width="440" height="296" rx="8" fill="#ffffff" stroke="#bcd"/>
    <rect width="440" height="28" rx="8" fill="#1565c0"/>
    <text x="14" y="19" font-size="13" font-weight="700" fill="#ffffff">默认帧决策树 —— 本课第一大坑（隐形行为）</text>

    <!-- 决策树 -->
    <g transform="translate(16, 42)">
      <rect x="120" y="0" width="180" height="26" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
      <text x="210" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#0d47a1">OVER 里写了 ORDER BY？</text>

      <line x1="210" y1="26" x2="210" y2="40" stroke="#90a4ae" stroke-width="1.5"/>
      <line x1="90" y1="40" x2="330" y2="40" stroke="#90a4ae" stroke-width="1.5"/>
      <line x1="90" y1="40" x2="90" y2="54" stroke="#90a4ae" stroke-width="1.5"/>
      <line x1="330" y1="40" x2="330" y2="54" stroke="#90a4ae" stroke-width="1.5"/>
      <text x="86" y="36" text-anchor="end" font-size="9" font-weight="700" fill="#388e3c">否</text>
      <text x="334" y="36" font-size="9" font-weight="700" fill="#c62828">是</text>

      <rect x="6" y="54" width="168" height="44" rx="4" fill="#e8f5e9" stroke="#388e3c"/>
      <text x="14" y="70" font-size="9" font-weight="700" fill="#2e7d32">帧 = 整个分区</text>
      <text x="14" y="83" font-size="9" fill="#333">SUM OVER (PARTITION BY u)</text>
      <text x="14" y="94" font-size="9" font-weight="700" fill="#2e7d32">→ 拿到"本组总额" ✅</text>

      <rect x="246" y="54" width="188" height="44" rx="4" fill="#fff3e0" stroke="#e65100"/>
      <text x="254" y="70" font-size="9" font-weight="700" fill="#e65100">帧 = RANGE UNBOUNDED</text>
      <text x="254" y="82" font-size="9" fill="#333">PRECEDING AND CURRENT ROW</text>
      <text x="254" y="94" font-size="9" font-weight="700" fill="#e65100">→ 拿到"累计值" ⚠️</text>

      <text x="6" y="118" font-size="9" font-weight="700" fill="#0d47a1">想拿总额？两条路：</text>
      <text x="6" y="132" font-size="9" fill="#333">① 去掉 ORDER BY（若不需要顺序）</text>
      <text x="6" y="146" font-size="9" fill="#333">② 显式写 ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING</text>
    </g>

    <line x1="16" y1="196" x2="424" y2="196" stroke="#cfd8dc" stroke-dasharray="3 3"/>

    <!-- 帧模式三选一 -->
    <text x="16" y="214" font-size="11" font-weight="700" fill="#1565c0">帧模式三选一：「1 PRECEDING」到底是什么意思</text>

    <g transform="translate(16, 222)">
      <rect width="408" height="20" fill="#eceff1"/>
      <text x="6" y="14" font-size="9" font-weight="700" fill="#333">模式</text>
      <text x="66" y="14" font-size="9" font-weight="700" fill="#333">含义</text>
      <text x="230" y="14" font-size="9" font-weight="700" fill="#333">典型场景</text>
      <text x="350" y="14" font-size="9" font-weight="700" fill="#333">版本</text>

      <rect y="20" width="408" height="17" fill="#ffffff" stroke="#e0e0e0"/>
      <text x="6" y="33" font-size="9" font-weight="700" fill="#0d47a1">ROWS</text>
      <text x="66" y="33" font-size="8" fill="#333">物理上前 1 行</text>
      <text x="230" y="33" font-size="8" fill="#333">最近 7 笔、最近 3 条</text>
      <text x="350" y="33" font-size="8" fill="#333">一直有</text>

      <rect y="37" width="408" height="17" fill="#f5f7fa" stroke="#e0e0e0"/>
      <text x="6" y="50" font-size="9" font-weight="700" fill="#0d47a1">RANGE</text>
      <text x="66" y="50" font-size="8" fill="#333">值在 1 单位内的所有行</text>
      <text x="230" y="50" font-size="8" fill="#333">最近 7 天（有缺口也对）</text>
      <text x="350" y="50" font-size="8" fill="#333">PG11+ 带 INTERVAL</text>

      <rect y="54" width="408" height="17" fill="#ffffff" stroke="#e0e0e0"/>
      <text x="6" y="67" font-size="9" font-weight="700" fill="#0d47a1">GROUPS</text>
      <text x="66" y="67" font-size="8" fill="#333">前面 1 个同值组</text>
      <text x="230" y="67" font-size="8" fill="#333">本档 + 上一档</text>
      <text x="350" y="67" font-size="8" fill="#333">PG 11+（SQL:2011）</text>
    </g>
  </g>

  <!-- ========= 下半右：排名选择 + 受帧影响矩阵 + 性能实测 ========= -->
  <g transform="translate(480, 288)">
    <rect width="420" height="296" rx="8" fill="#ffffff" stroke="#bcd"/>
    <rect width="420" height="28" rx="8" fill="#7b1fa2"/>
    <text x="14" y="19" font-size="13" font-weight="700" fill="#ffffff">三张判断表：选谁 / 谁受帧影响 / 谁更快</text>

    <!-- 表1 -->
    <text x="16" y="48" font-size="10" font-weight="700" fill="#7b1fa2">① 排名函数怎么选</text>
    <g transform="translate(16, 54)">
      <rect width="388" height="17" fill="#f3e5f5"/>
      <text x="6" y="12" font-size="8" font-weight="700" fill="#333">问题</text>
      <text x="230" y="12" font-size="8" font-weight="700" fill="#333">用谁</text>
      <rect y="17" width="388" height="16" fill="#ffffff" stroke="#e0e0e0"/>
      <text x="6" y="29" font-size="8" fill="#333">要恰好 N 行（多一个都不要）</text>
      <text x="230" y="29" font-size="8" font-weight="700" fill="#388e3c">ROW_NUMBER（+ tie-breaker）</text>
      <rect y="33" width="388" height="16" fill="#fafafa" stroke="#e0e0e0"/>
      <text x="6" y="45" font-size="8" fill="#333">同分必须一起入选</text>
      <text x="230" y="45" font-size="8" font-weight="700" fill="#388e3c">RANK 或 DENSE_RANK</text>
      <rect y="49" width="388" height="16" fill="#ffffff" stroke="#e0e0e0"/>
      <text x="6" y="61" font-size="8" fill="#333">名次显示要"跳号"（奥运式）</text>
      <text x="230" y="61" font-size="8" font-weight="700" fill="#388e3c">RANK</text>
      <rect y="65" width="388" height="16" fill="#fafafa" stroke="#e0e0e0"/>
      <text x="6" y="77" font-size="8" fill="#333">档位编号要连续（第 2 档 / 第 3 档）</text>
      <text x="230" y="77" font-size="8" font-weight="700" fill="#388e3c">DENSE_RANK</text>
      <rect y="81" width="388" height="16" fill="#ffffff" stroke="#e0e0e0"/>
      <text x="6" y="93" font-size="8" fill="#333">分桶（四分位 / 百分位）</text>
      <text x="230" y="93" font-size="8" font-weight="700" fill="#388e3c">NTILE(n)</text>
    </g>

    <!-- 表2 -->
    <text x="16" y="172" font-size="10" font-weight="700" fill="#7b1fa2">② 谁受窗口帧影响（关键区分）</text>
    <g transform="translate(16, 178)">
      <rect width="388" height="16" fill="#f3e5f5"/>
      <text x="6" y="11" font-size="8" font-weight="700" fill="#333">函数</text>
      <text x="250" y="11" font-size="8" font-weight="700" fill="#333">受帧影响？</text>
      <rect y="16" width="388" height="15" fill="#fff3e0" stroke="#e0e0e0"/>
      <text x="6" y="27" font-size="8" fill="#333">SUM / AVG / COUNT / MAX / MIN</text>
      <text x="250" y="27" font-size="8" font-weight="700" fill="#e65100">✅ 受（决定累计还是合计）</text>
      <rect y="31" width="388" height="15" fill="#fff3e0" stroke="#e0e0e0"/>
      <text x="6" y="42" font-size="8" fill="#333">FIRST_VALUE / LAST_VALUE / NTH_VALUE</text>
      <text x="250" y="42" font-size="8" font-weight="700" fill="#e65100">✅ 受（LAST_VALUE 的坑）</text>
      <rect y="46" width="388" height="15" fill="#e8f5e9" stroke="#e0e0e0"/>
      <text x="6" y="57" font-size="8" fill="#333">LAG / LEAD</text>
      <text x="250" y="57" font-size="8" font-weight="700" fill="#2e7d32">❌ 不受（按物理偏移取）</text>
      <rect y="61" width="388" height="15" fill="#e8f5e9" stroke="#e0e0e0"/>
      <text x="6" y="72" font-size="8" fill="#333">ROW_NUMBER / RANK / DENSE_RANK / NTILE</text>
      <text x="250" y="72" font-size="8" font-weight="700" fill="#2e7d32">❌ 不受（恒等于整分区）</text>
    </g>

    <!-- 表3 性能 -->
    <text x="16" y="256" font-size="10" font-weight="700" fill="#7b1fa2">③ 「每组取一条」PG 17.11 实测（4 万行 / 8 组）</text>
    <g transform="translate(16, 262)">
      <rect width="388" height="26" rx="4" fill="#f5f7fa" stroke="#cfd8dc"/>
      <text x="8" y="12" font-size="8" fill="#333">DISTINCT ON  →  Unique ← Index Scan 扫 40000 行</text>
      <text x="8" y="23" font-size="8" fill="#333">Execution Time: <tspan font-weight="700" fill="#c62828">7.33 ms</tspan></text>
      <rect y="30" width="388" height="26" rx="4" fill="#e8f5e9" stroke="#388e3c"/>
      <text x="8" y="42" font-size="8" fill="#333">ROW_NUMBER   →  WindowAgg + <tspan font-weight="700" fill="#2e7d32">Run Condition</tspan></text>
      <text x="8" y="53" font-size="8" fill="#333">Execution Time: <tspan font-weight="700" fill="#2e7d32">5.14 ms ⚡</tspan>   <tspan fill="#666">（PG 15+ 提前终止）</tspan></text>
    </g>
  </g>

  <!-- ========= 阶段 2 闭环 ========= -->
  <g transform="translate(20, 600)">
    <rect width="880" height="74" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#0d47a1">🎉 阶段 2 闭环 · 四件武器齐全</text>

    <g transform="translate(16, 32)">
      <rect width="200" height="30" rx="4" fill="#ffffff" stroke="#bcd"/>
      <text x="100" y="13" text-anchor="middle" font-size="9" font-weight="700" fill="#0d47a1">课 4 关系建模</text>
      <text x="100" y="25" text-anchor="middle" font-size="8" fill="#666">数据怎么摆才不冗余</text>

      <rect x="216" width="200" height="30" rx="4" fill="#ffffff" stroke="#bcd"/>
      <text x="316" y="13" text-anchor="middle" font-size="9" font-weight="700" fill="#0d47a1">课 5 视图与函数</text>
      <text x="316" y="25" text-anchor="middle" font-size="8" fill="#666">逻辑怎么复用</text>

      <rect x="432" width="200" height="30" rx="4" fill="#ffffff" stroke="#bcd"/>
      <text x="532" y="13" text-anchor="middle" font-size="9" font-weight="700" fill="#0d47a1">课 6 CTE 与子查询</text>
      <text x="532" y="25" text-anchor="middle" font-size="8" fill="#666">复杂查询怎么拆</text>

      <rect x="648" width="200" height="30" rx="4" fill="#0d47a1" stroke="#0d47a1"/>
      <text x="748" y="13" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">课 7 窗口函数</text>
      <text x="748" y="25" text-anchor="middle" font-size="8" fill="#c5d9f1">分组内怎么算、怎么比</text>
    </g>
  </g>

</svg>
