  <text x="772" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">数据层纵深</text>
  <text x="772" y="166" text-anchor="middle" font-size="11.5" fill="#33475b">课 11　查询表达式进阶</text>
  <text x="772" y="185" text-anchor="middle" font-size="11.5" fill="#33475b">课 12　索引约束与连接池</text>
  <text x="772" y="200" text-anchor="middle" font-size="11.5" fill="#33475b">课 13-14　DB 路由 · 迁移工程</text>
  <text x="772" y="218" text-anchor="middle" font-size="11" fill="#5a6b7d">12 个知识点</text>

  <line x1="232" y1="158" x2="252" y2="158" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="447" y1="158" x2="467" y2="158" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="662" y1="158" x2="682" y2="158" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>

