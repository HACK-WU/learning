  <text x="350" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">阶段 5 · 扛住真实世界</text>
  <text x="350" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#880e4f">性能与异步</text>
  <text x="350" y="378" text-anchor="middle" font-size="11.5" fill="#33475b">课 15　ORM 进阶与 N+1</text>
  <text x="350" y="397" text-anchor="middle" font-size="11.5" fill="#33475b">课 16　缓存与异步</text>
  <text x="350" y="412" text-anchor="middle" font-size="11.5" fill="#33475b">课 17　信号：隐式耦合的代价</text>
  <text x="350" y="425" text-anchor="middle" font-size="11" fill="#5a6b7d">9 个知识点</text>

  <rect x="470" y="300" width="190" height="126" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
