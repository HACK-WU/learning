<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#fbfcfe"/>

  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a2e">Django 进阶（前后端分离）· 学习路径</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="#5a6b7d">6 阶段 / 22 课 / 66 知识点　|　Django 6.1 + DRF 3.18</text>

  <!-- 上排：阶段 1-3 -->
  <rect x="40" y="88" width="190" height="140" rx="10" fill="#e8f4fd" stroke="#2196f3" stroke-width="2"/>
  <rect x="40" y="88" width="190" height="32" rx="10" fill="#2196f3"/>
  <rect x="40" y="110" width="190" height="10" fill="#2196f3"/>
  <text x="135" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">阶段 1 · 决定分家</text>
  <text x="135" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">为什么要前后端分离</text>
  <text x="135" y="166" text-anchor="middle" font-size="11.5" fill="#33475b">课 1　模板渲染到 API 契约</text>
  <text x="135" y="185" text-anchor="middle" font-size="11.5" fill="#33475b">课 2　工程骨架与跨域</text>
  <text x="135" y="210" text-anchor="middle" font-size="11" fill="#5a6b7d">6 个知识点</text>

  <rect x="255" y="88" width="190" height="140" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
