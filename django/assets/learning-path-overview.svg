  <rect x="470" y="322" width="190" height="10" fill="#9c27b0"/>
  <text x="565" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">阶段 6 · 收尾</text>
  <text x="565" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a148c">工程化与生产</text>
  <text x="565" y="378" text-anchor="middle" font-size="11.5" fill="#33475b">课 18　中间件与请求链路</text>
  <text x="565" y="397" text-anchor="middle" font-size="11.5" fill="#33475b">课 19-21　文件 Admin · 测试 · 命令</text>
  <text x="565" y="412" text-anchor="middle" font-size="11.5" fill="#33475b">课 22　部署与运维</text>
  <text x="565" y="425" text-anchor="middle" font-size="11" fill="#5a6b7d">15 个知识点</text>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#455a64"/>
    </marker>
    <marker id="arrowdash" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <line x1="350" y1="230" x2="350" y2="296" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="447" y1="363" x2="467" y2="363" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 依赖回指虚线 -->
  <path d="M 565 230 C 620 262, 700 262, 700 232" fill="none" stroke="#90a4ae" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowdash)"/>
  <path d="M 772 230 C 820 268, 460 268, 400 296" fill="none" stroke="#90a4ae" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowdash)"/>
  <path d="M 470 388 C 200 388, 120 330, 120 232" fill="none" stroke="#90a4ae" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowdash)"/>
  <text x="252" y="470" text-anchor="middle" font-size="10.5" fill="#78909c">对象级权限依赖 request.user　|　表达式与索引是性能前提</text>

  <!-- 故事主线 -->
  <rect x="40" y="452" width="835" height="78" rx="9" fill="#f5f7fa" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="58" y="475" font-size="13" font-weight="bold" fill="#37474f">📖 故事主线：一个「什么都能干」的视图函数</text>
  <text x="58" y="497" font-size="11.5" fill="#546e7a">⚔️ 冲突：它又要查库、校验、渲染、鉴权 —— 改一个字段要动五个地方</text>
  <text x="58" y="516" font-size="11.5" fill="#546e7a">🔄 转折：学会把职责交出去（序列化器 / 权限类 / 服务层 / 任务框架 / 数据库本身）</text>

  <!-- 收尾环节 -->
  <text x="450" y="566" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">课 时 完 成 后 的 收 尾 环 节</text>

  <rect x="150" y="582" width="220" height="52" rx="8" fill="#ede7f6" stroke="#673ab7" stroke-width="2"/>
