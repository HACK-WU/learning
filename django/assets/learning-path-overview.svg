  <rect x="255" y="110" width="190" height="10" fill="#4caf50"/>
  <text x="350" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">阶段 2 · 立规矩</text>
  <text x="350" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">DRF 核心三件套</text>
  <text x="350" y="166" text-anchor="middle" font-size="11.5" fill="#33475b">课 3-4　序列化器（含进阶）</text>
  <text x="350" y="185" text-anchor="middle" font-size="11.5" fill="#33475b">课 5　视图层与路由</text>
  <text x="350" y="200" text-anchor="middle" font-size="11.5" fill="#33475b">课 6-7　版本控制 · 业务归属</text>
  <text x="350" y="218" text-anchor="middle" font-size="11" fill="#5a6b7d">15 个知识点</text>

  <rect x="470" y="88" width="190" height="140" rx="10" fill="#fff8e1" stroke="#ff9800" stroke-width="2"/>
  <rect x="470" y="88" width="190" height="32" rx="10" fill="#ff9800"/>
  <rect x="470" y="110" width="190" height="10" fill="#ff9800"/>
  <text x="565" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">阶段 3 · 守门</text>
  <text x="565" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">认证、权限与鉴权</text>
  <text x="565" y="166" text-anchor="middle" font-size="11.5" fill="#33475b">课 8　认证：你是谁</text>
  <text x="565" y="185" text-anchor="middle" font-size="11.5" fill="#33475b">课 9　权限：你能干什么</text>
  <text x="565" y="204" text-anchor="middle" font-size="11.5" fill="#33475b">课 10　分离架构下的安全</text>
  <text x="565" y="222" text-anchor="middle" font-size="11" fill="#5a6b7d">9 个知识点</text>

  <rect x="685" y="88" width="175" height="140" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <rect x="685" y="88" width="175" height="32" rx="10" fill="#1976d2"/>
  <rect x="685" y="110" width="175" height="10" fill="#1976d2"/>
