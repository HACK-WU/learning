<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif">
  <rect width="780" height="330" fill="#fbfcfe"/>
  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">阶段 1 · 为什么要前后端分离</text>
  <text x="390" y="52" text-anchor="middle" font-size="12" fill="#5a6b7d">决定分家 —— 渲染权交出去</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#455a64"/>
    </marker>
  </defs>

  <!-- 课 1 -->
  <rect x="30" y="78" width="330" height="196" rx="9" fill="#e8f4fd" stroke="#2196f3" stroke-width="2"/>
  <rect x="30" y="78" width="330" height="30" rx="9" fill="#2196f3"/>
  <rect x="30" y="98" width="330" height="10" fill="#2196f3"/>
  <text x="195" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">课 1　从模板渲染到 API 契约</text>
  <text x="48" y="132" font-size="11.5" fill="#0d47a1">① 渲染权从后端移交前端</text>
  <text x="48" y="152" font-size="11.5" fill="#0d47a1">② 三种渲染模式的取舍</text>
  <text x="48" y="172" font-size="11.5" fill="#0d47a1">③ 契约先行的 API 设计</text>
  <line x1="45" y1="186" x2="345" y2="186" stroke="#bbdefb" stroke-width="1"/>
  <text x="48" y="206" font-size="11" fill="#5a6b7d">产出：能判断该不该分离</text>
  <text x="48" y="224" font-size="11" fill="#5a6b7d">产出：按资源设计出 API 契约</text>
  <text x="48" y="248" font-size="11" fill="#c62828">⚠️ 误区：分离不是唯一正确答案</text>

  <!-- 课 2 -->
  <rect x="420" y="78" width="330" height="196" rx="9" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <rect x="420" y="78" width="330" height="30" rx="9" fill="#1976d2"/>
  <rect x="420" y="98" width="330" height="10" fill="#1976d2"/>
  <text x="585" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">课 2　工程骨架与跨域</text>
  <text x="438" y="132" font-size="11.5" fill="#0d47a1">① 项目分层与 app 划分</text>
  <text x="438" y="152" font-size="11.5" fill="#0d47a1">② CORS 与跨域落地</text>
  <text x="438" y="172" font-size="11.5" fill="#0d47a1">③ 自定义用户模型</text>
  <line x1="435" y1="186" x2="735" y2="186" stroke="#bbdefb" stroke-width="1"/>
  <text x="438" y="206" font-size="11" fill="#5a6b7d">产出：分层骨架 + 跨域跑通</text>
  <text x="438" y="224" font-size="11" fill="#5a6b7d">产出：开局做对用户模型</text>
  <text x="438" y="248" font-size="11" fill="#c62828">⚠️ 误区：CORS_ALLOW_ALL ≠ 解决跨域</text>

  <line x1="362" y1="176" x2="416" y2="176" stroke="#455a64" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- 前置 / 后续 -->
  <rect x="30" y="290" width="330" height="30" rx="6" fill="#eceff1" stroke="#b0bec5"/>
  <text x="195" y="310" text-anchor="middle" font-size="11.5" fill="#455a64">前置：会用 Django 写完整功能</text>

  <rect x="420" y="290" width="330" height="30" rx="6" fill="#e8f5e9" stroke="#81c784"/>
  <text x="585" y="310" text-anchor="middle" font-size="11.5" fill="#2e7d32">后续：阶段 2 的骨架 / 用户模型基础</text>
</svg>
