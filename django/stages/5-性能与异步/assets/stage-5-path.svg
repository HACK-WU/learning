  <text x="40" y="130" font-size="11.5" fill="#880e4f">① select_related / prefetch_related</text>
  <text x="40" y="150" font-size="11.5" fill="#880e4f">② N+1 的发现与根治</text>
  <text x="40" y="170" font-size="11.5" fill="#880e4f">③ 事务、并发与行锁</text>
