<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">登出的困境：黑名单干掉的是 refresh，不是 access</text>
  <text x="500" y="52" text-anchor="middle" font-size="13" fill="#666666">上图：三种方案的凭据存在哪；下图：一次登出之后，两种令牌各自的命运</text>

  <!-- ================= 上半：三种方案凭据存放位置 ================= -->
  <text x="40" y="86" font-size="14.5" font-weight="700" fill="#37474f">① 凭据存放在哪 —— 决定"能不能主动吊销"</text>

  <!-- Session -->
  <rect x="40" y="100" width="290" height="150" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="60" y="126" font-size="14" font-weight="700" fill="#2e7d32">Session（Cookie）</text>
  <text x="60" y="150" font-size="11.5" fill="#424242">客户端：Cookie sessionid=abc…</text>
  <text x="60" y="170" font-size="11.5" fill="#424242">浏览器自动携带，跨站请求也会带上</text>
  <line x1="60" y1="182" x2="310" y2="182" stroke="#a5d6a7" stroke-width="1"/>
  <text x="60" y="204" font-size="11.5" font-weight="700" fill="#2e7d32">服务器：django_session 表有记录 ✓</text>
  <text x="60" y="224" font-size="11.5" fill="#424242">吊销 = 删一行，立即生效</text>
  <text x="60" y="242" font-size="11.5" fill="#c62828">代价：必须配 CSRF</text>

  <!-- DRF Token -->
  <rect x="355" y="100" width="290" height="150" rx="8" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
  <text x="375" y="126" font-size="14" font-weight="700" fill="#1565c0">DRF Token</text>
  <text x="375" y="150" font-size="11.5" fill="#424242">客户端：Authorization: Token xxx</text>
  <text x="375" y="170" font-size="11.5" fill="#424242">需自己存（localStorage / 内存）</text>
  <line x1="375" y1="182" x2="625" y2="182" stroke="#90caf9" stroke-width="1"/>
  <text x="375" y="204" font-size="11.5" font-weight="700" fill="#1565c0">服务器：authtoken_token 表有记录 ✓</text>
  <text x="375" y="224" font-size="11.5" fill="#424242">吊销 = 删一行，立即生效</text>
  <text x="375" y="242" font-size="11.5" fill="#ef6c00">代价：每次认证都要查一次库</text>

  <!-- JWT -->
  <rect x="670" y="100" width="290" height="150" rx="8" fill="#fff3e0" stroke="#ffa726" stroke-width="1.5"/>
  <text x="690" y="126" font-size="14" font-weight="700" fill="#e65100">JWT（simplejwt）</text>
  <text x="690" y="150" font-size="11.5" fill="#424242">客户端：Authorization: Bearer xxx</text>
  <text x="690" y="170" font-size="11.5" fill="#424242">令牌自带全部信息，服务端不存</text>
  <line x1="690" y1="182" x2="940" y2="182" stroke="#ffcc80" stroke-width="1"/>
  <text x="690" y="204" font-size="11.5" font-weight="700" fill="#e65100">服务器：默认无记录 ✗</text>
  <text x="690" y="224" font-size="11.5" fill="#424242">吊销 = 做不到，只能等它过期</text>
  <text x="690" y="242" font-size="11.5" fill="#c62828">除非装 token_blacklist 才开始留痕</text>

  <!-- ================= 下半：登出时间线 ================= -->
  <text x="40" y="300" font-size="14.5" font-weight="700" fill="#37474f">② 一次登出之后，两种令牌各自的命运</text>

  <!-- 时间轴 -->
  <line x1="90" y1="560" x2="950" y2="560" stroke="#90a4ae" stroke-width="2"/>
  <text x="90" y="582" font-size="11" fill="#546e7a" text-anchor="middle">t0</text>
  <text x="430" y="582" font-size="11" fill="#546e7a" text-anchor="middle">t0 + 2min</text>
  <text x="610" y="582" font-size="11" fill="#546e7a" text-anchor="middle">t0 + 5min</text>
  <text x="900" y="582" font-size="11" fill="#546e7a" text-anchor="middle">t0 + 1day</text>

  <text x="90" y="536" font-size="11" fill="#78909c" text-anchor="middle">登录</text>
  <text x="430" y="536" font-size="11" fill="#c62828" text-anchor="middle" font-weight="700">点登出</text>
  <text x="610" y="536" font-size="11" fill="#78909c" text-anchor="middle">access 到期</text>
  <text x="900" y="536" font-size="11" fill="#78909c" text-anchor="middle">refresh 到期</text>

  <!-- access 生命条：t0 -> t0+5min -->
  <rect x="90" y="360" width="520" height="30" rx="4" fill="#81c784" stroke="#388e3c" stroke-width="1.2"/>
  <text x="200" y="380" font-size="12.5" font-weight="700" fill="#1b5e20" text-anchor="middle">access　有效期 5 分钟</text>
  <text x="90" y="350" font-size="11.5" font-weight="700" fill="#2e7d32">access</text>

  <!-- 登出点之后的 access：危险窗口 -->
  <rect x="430" y="360" width="180" height="30" rx="0" fill="#ef9a9a" opacity="0.85"/>
  <rect x="430" y="360" width="180" height="30" rx="0" fill="none" stroke="#c62828" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="520" y="380" font-size="11.5" font-weight="700" fill="#b71c1c" text-anchor="middle">仍然有效 ← 危险窗口</text>

  <!-- refresh 生命条：t0 -> t0+1day -->
  <rect x="90" y="420" width="500" height="30" rx="4" fill="#90caf9" stroke="#1976d2" stroke-width="1.2"/>
  <text x="290" y="440" font-size="12.5" font-weight="700" fill="#0d47a1" text-anchor="middle">refresh　有效期 1 天</text>
  <text x="90" y="410" font-size="11.5" font-weight="700" fill="#1565c0">refresh</text>
  <!-- 登出后被截断 -->
  <line x1="430" y1="414" x2="590" y2="456" stroke="#c62828" stroke-width="2.5"/>
  <line x1="590" y1="414" x2="430" y2="456" stroke="#c62828" stroke-width="2.5"/>
  <rect x="590" y="420" width="320" height="30" rx="4" fill="#eceff1" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="750" y="440" font-size="11.5" fill="#78909c" text-anchor="middle">已作废（进入黑名单）</text>

  <!-- 登出竖线 -->
  <line x1="430" y1="330" x2="430" y2="566" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="430" cy="330" r="5" fill="#c62828"/>
  <text x="430" y="322" font-size="12" font-weight="700" fill="#c62828" text-anchor="middle">登出</text>

  <!-- 说明气泡 -->
  <rect x="640" y="330" width="310" height="92" rx="8" fill="#ffebee" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="656" y="354" font-size="12" font-weight="700" fill="#b71c1c">登出到底做了什么？</text>
  <text x="656" y="374" font-size="11.5" fill="#424242">只把 refresh 写进黑名单表。</text>
  <text x="656" y="392" font-size="11.5" fill="#424242">已经发出去的 access 是「不记名」的，</text>
  <text x="656" y="410" font-size="11.5" fill="#424242">服务器根本不知道它存在，也就无从吊销。</text>

  <!-- 底部结论 -->
  <rect x="40" y="596" width="920" height="0" fill="none"/>
  <text x="500" y="612" font-size="12.5" text-anchor="middle" fill="#37474f">
    <tspan font-weight="700" fill="#b71c1c">窗口大小 = ACCESS_TOKEN_LIFETIME</tspan>
    <tspan>　—　缩短它只能缩小风险，不能消除；要消除就必须牺牲「无状态」</tspan>
  </text>
</svg>
