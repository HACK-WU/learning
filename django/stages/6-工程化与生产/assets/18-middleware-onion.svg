<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">中间件顺序错了：同一个请求，两个不同答案</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#666666">左：顺序颠倒（日志里没有 request_id）　右：洋葱模型（下行 / 上行）</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666666"/>
    </marker>
  </defs>

  <!-- ================= 左：错序 ================= -->
  <rect x="30" y="76" width="450" height="330" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="255" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#b71c1c">❌ 日志中间件在最内层</text>
  <text x="255" y="124" text-anchor="middle" font-size="12" fill="#8e2b2b">MIDDLEWARE = [..., "LoggingMiddleware"]</text>

  <rect x="70" y="146" width="370" height="42" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="255" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b71c1c">① 请求先过外层（认证、限流…）</text>
  <text x="255" y="182" text-anchor="middle" font-size="11" fill="#424242">此时日志中间件还没跑</text>

  <line x1="255" y1="188" x2="255" y2="214" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="70" y="220" width="370" height="52" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="255" y="240" text-anchor="middle" font-size="12.5" fill="#e65100">② 外层出错直接返回</text>
  <text x="255" y="260" text-anchor="middle" font-size="11" fill="#424242">根本走不到日志中间件</text>

  <line x1="255" y1="272" x2="255" y2="298" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="70" y="304" width="370" height="66" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="255" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">🚨 被拒的请求一条日志都没有</text>
  <text x="255" y="344" text-anchor="middle" font-size="11" fill="#424242">排查时只见"业务日志断了一截"</text>
  <text x="255" y="362" text-anchor="middle" font-size="11" fill="#b71c1c">慢查询也串不起 request_id</text>

  <text x="255" y="392" text-anchor="middle" font-size="12" fill="#c62828">越靠外层越早见请求，也越晚见响应</text>

  <!-- ================= 右：洋葱 ================= -->
  <rect x="520" y="76" width="450" height="330" rx="10" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="745" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#1b5e20">✅ 洋葱模型：下行 / 上行</text>
  <text x="745" y="124" text-anchor="middle" font-size="12" fill="#33691e">日志 → 安全 → 认证 → 视图</text>

  <rect x="560" y="146" width="370" height="42" rx="6" fill="#ffffff" stroke="#81c784" stroke-width="1.5"/>
  <text x="745" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b5e20">下行：最外层最先拿到 request</text>
  <text x="745" y="182" text-anchor="middle" font-size="11" fill="#424242">先打上 request_id 再往里传</text>

  <line x1="745" y1="188" x2="745" y2="214" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="560" y="220" width="370" height="52" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="745" y="240" text-anchor="middle" font-size="12.5" fill="#33691e">上行：最内层最先拿到 response</text>
  <text x="745" y="260" text-anchor="middle" font-size="11" fill="#424242">耗时统计要放在最外层</text>

  <line x1="745" y1="272" x2="745" y2="298" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="560" y="304" width="370" height="66" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="745" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">✅ 全程可追溯</text>
  <text x="745" y="344" text-anchor="middle" font-size="11" fill="#424242">包括被限流、被拒的那些请求</text>
  <text x="745" y="362" text-anchor="middle" font-size="11" fill="#1b5e20">process_exception 由内向外冒</text>

  <text x="745" y="392" text-anchor="middle" font-size="12" fill="#2e7d32">两个特殊钩子：process_view / process_exception</text>

  <!-- ================= 底部：常见位置 ================= -->
  <rect x="30" y="426" width="940" height="118" rx="10" fill="#f5f9fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="500" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">常见中间件该放哪（本课 2.4 速查表，配合 2.3 实测错序后果）</text>

  <line x1="60" y1="464" x2="940" y2="464" stroke="#90caf9" stroke-width="1"/>
  <text x="70" y="482" font-size="12" font-weight="700" fill="#0d47a1">中间件</text>
  <text x="330" y="482" font-size="12" font-weight="700" fill="#0d47a1">位置</text>
  <text x="620" y="482" font-size="12" font-weight="700" fill="#0d47a1">原因</text>
  <line x1="60" y1="490" x2="940" y2="490" stroke="#90caf9" stroke-width="1"/>

  <text x="70" y="508" font-size="12" fill="#424242">SecurityMiddleware</text>
  <text x="330" y="508" font-size="12" fill="#1b5e20">最外层</text>
  <text x="620" y="508" font-size="11" fill="#424242">最早介入，统一加安全头</text>

  <text x="70" y="528" font-size="12" fill="#424242">日志 / request_id</text>
  <text x="330" y="528" font-size="12" fill="#1b5e20">尽量靠外</text>
  <text x="620" y="528" font-size="11" fill="#424242">要覆盖"被拒"的请求</text>

  <text x="70" y="548" font-size="12" fill="#424242">AuthenticationMiddleware</text>
  <text x="330" y="548" font-size="12" fill="#e65100">Session 之后</text>
  <text x="620" y="548" font-size="11" fill="#424242">依赖 session 才能拿到 user</text>
</svg>
