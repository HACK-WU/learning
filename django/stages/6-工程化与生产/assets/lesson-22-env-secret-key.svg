<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">环境变量的真值陷阱与 SECRET_KEY 轮换的代价</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#666666">左：字符串 "False" 被当成真　右：轮换一次密钥会死多少数据</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666666"/>
    </marker>
  </defs>

  <!-- ================= 左：真值陷阱 ================= -->
  <rect x="30" y="76" width="450" height="330" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="255" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#b71c1c">🚨 DEBUG="False" 其实是开</text>
  <text x="255" y="124" text-anchor="middle" font-size="12" fill="#8e2b2b">os.environ 拿到的永远是字符串</text>

  <rect x="70" y="146" width="370" height="42" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="255" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b71c1c">① 任何非空字符串都是真</text>
  <text x="255" y="182" text-anchor="middle" font-size="11" fill="#424242">"False" / "0" / "no" 全部为真</text>

  <line x1="255" y1="188" x2="255" y2="214" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="70" y="220" width="370" height="52" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="255" y="240" text-anchor="middle" font-size="12.5" fill="#e65100">② DEBUG=True 上线</text>
  <text x="255" y="260" text-anchor="middle" font-size="11" fill="#424242">详细 traceback 直接暴露给外网</text>

  <line x1="255" y1="272" x2="255" y2="298" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="70" y="304" width="370" height="66" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="255" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">🚨 源码、配置、SQL 全泄露</text>
  <text x="255" y="344" text-anchor="middle" font-size="11" fill="#424242">起服务的人以为自己关了调试</text>
  <text x="255" y="362" text-anchor="middle" font-size="11" fill="#b71c1c">check 覆盖不到这一类</text>

  <text x="255" y="392" text-anchor="middle" font-size="12" fill="#c62828">要用专门的布尔解析，不能靠真值判断</text>

  <!-- ================= 右：SECRET_KEY ================= -->
  <rect x="520" y="76" width="450" height="330" rx="10" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="745" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#1b5e20">⚠️ 轮换一次，会死一批数据</text>
  <text x="745" y="124" text-anchor="middle" font-size="12" fill="#33691e">签名相关的一切都失效</text>

  <rect x="560" y="146" width="370" height="42" rx="6" fill="#ffffff" stroke="#81c784" stroke-width="1.5"/>
  <text x="745" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e65100">① session 全部登出</text>
  <text x="745" y="182" text-anchor="middle" font-size="11" fill="#424242">签名验不过，用户被踢下线</text>

  <line x1="745" y1="188" x2="745" y2="214" stroke="#f9a825" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="560" y="220" width="370" height="52" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="745" y="240" text-anchor="middle" font-size="12.5" fill="#e65100">② 密码重置 / 签名 URL 失效</text>
  <text x="745" y="260" text-anchor="middle" font-size="11" fill="#424242">已发出的链接全部作废</text>

  <line x1="745" y="1" x2="745" y2="298" stroke="#f9a825" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="560" y="304" width="370" height="66" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="745" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">✅ 密钥只放环境变量</text>
  <text x="745" y="344" text-anchor="middle" font-size="11" fill="#424242">不进代码库、不进镜像</text>
  <text x="745" y="362" text-anchor="middle" font-size="11" fill="#1b5e20">缺了就该直接失败，别给默认值</text>

  <text x="745" y="392" text-anchor="middle" font-size="12" fill="#2e7d32">轮换前先算清影响面，别当成"改个配置"</text>

  <!-- ================= 底部：配置分层 ================= -->
  <rect x="30" y="426" width="940" height="118" rx="10" fill="#f5f9fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="500" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">配置分层与静态文件（本课 3.1.2 / 3.2.1 实测）</text>

  <line x1="60" y1="464" x2="940" y2="464" stroke="#90caf9" stroke-width="1"/>
  <text x="70" y="482" font-size="12" font-weight="700" fill="#0d47a1">类别</text>
  <text x="330" y="482" font-size="12" font-weight="700" fill="#0d47a1">做法</text>
  <text x="620" y="482" font-size="12" font-weight="700" fill="#0d47a1">易错点</text>
  <line x1="60" y1="490" x2="940" y2="490" stroke="#90caf9" stroke-width="1"/>

  <text x="70" y="508" font-size="12" fill="#424242">DEBUG / 开关</text>
  <text x="330" y="508" font-size="11" fill="#424242">专门的布尔解析，别用真值</text>
  <text x="620" y="508" font-size="11" fill="#b71c1c">"False" 为真</text>

  <text x="70" y="528" font-size="12" fill="#424242">SECRET_KEY</text>
  <text x="330" y="528" font-size="11" fill="#424242">环境变量，缺了直接失败</text>
  <text x="620" y="528" font-size="11" fill="#e65100">轮换代价被低估</text>

  <text x="70" y="548" font-size="12" fill="#424242">/static/ 与 /media/</text>
  <text x="330" y="548" font-size="11" fill="#424242">collectstatic 后由 Web 服务器提供</text>
  <text x="620" y="548" font-size="11" fill="#e65100">DEBUG=False 时 Django 不再管静态</text>
</svg>
