<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">同名文件：不报错，但结果变了</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#666666">左：默认 FileSystemStorage（同名被改名，URL 与预期不符）　右：搞清存成了什么再谈配置</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666666"/>
    </marker>
  </defs>

  <!-- ================= 左：同名 ================= -->
  <rect x="30" y="76" width="450" height="330" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="255" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">⚠️ 上传 report.pdf 两次</text>
  <text x="255" y="124" text-anchor="middle" font-size="12" fill="#8d6e63">第 2 次不会覆盖第 1 次</text>

  <rect x="70" y="146" width="370" height="42" rx="6" fill="#ffffff" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="255" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b71c1c">① 存储后端发现同名</text>
  <text x="255" y="182" text-anchor="middle" font-size="11" fill="#424242">自动加随机后缀</text>

  <line x1="255" y1="188" x2="255" y2="214" stroke="#f9a825" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="70" y="220" width="370" height="52" rx="6" fill="#ffffff" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="255" y="240" text-anchor="middle" font-size="12.5" fill="#e65100">② 落盘为 report_aXb3.pdf</text>
  <text x="255" y="260" text-anchor="middle" font-size="11" fill="#424242">但代码里还按 report.pdf 拼 URL</text>

  <line x1="255" y1="272" x2="255" y2="298" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="70" y="304" width="370" height="66" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="255" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">🚨 第 14 处「不报错的错误」</text>
  <text x="255" y="344" text-anchor="middle" font-size="11" fill="#424242">field.url 是对的，手拼的是错的</text>
  <text x="255" y="362" text-anchor="middle" font-size="11" fill="#b71c1c">前端拿到 404 且无任何异常日志</text>

  <text x="255" y="392" text-anchor="middle" font-size="12" fill="#c62828">永远用 field.url，不要自己拼路径</text>

  <!-- ================= 右：STORAGES ================= -->
  <rect x="520" y="76" width="450" height="330" rx="10" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="745" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#1b5e20">✅ Django 4.2+ 的 STORAGES</text>
  <text x="745" y="124" text-anchor="middle" font-size="12" fill="#33691e">一次配两个后端：default + staticfiles</text>

  <rect x="560" y="146" width="370" height="42" rx="6" fill="#ffffff" stroke="#81c784" stroke-width="1.5"/>
  <text x="745" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b5e20">default：用户上传（媒体文件）</text>
  <text x="745" y="182" text-anchor="middle" font-size="11" fill="#424242">MEDIA_ROOT / MEDIA_URL</text>

  <line x1="745" y1="188" x2="745" y2="214" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="560" y="220" width="370" height="52" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="745" y="240" text-anchor="middle" font-size="12.5" fill="#33691e">staticfiles：collectstatic 专用</text>
  <text x="745" y="260" text-anchor="middle" font-size="11" fill="#424242">与上传完全分开</text>

  <line x1="745" y1="272" x2="745" y2="298" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="560" y="304" width="370" height="66" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="745" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">✅ 换后端不改业务代码</text>
  <text x="745" y="344" text-anchor="middle" font-size="11" fill="#424242">本地磁盘 → S3 只改配置</text>
  <text x="745" y="362" text-anchor="middle" font-size="11" fill="#1b5e20">用 check 验证配置真的生效</text>

  <text x="745" y="392" text-anchor="middle" font-size="12" fill="#2e7d32">先确认"文件到底存成了什么"，再谈配置</text>

  <!-- ================= 底部：排查 ================= -->
  <rect x="30" y="426" width="940" height="118" rx="10" fill="#f5f9fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="500" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">五分钟定位：这类问题怎么查（本课 1.3 / 2.1 实测）</text>

  <line x1="60" y1="464" x2="940" y2="464" stroke="#90caf9" stroke-width="1"/>
  <text x="70" y="482" font-size="12" font-weight="700" fill="#0d47a1">步骤</text>
  <text x="300" y="482" font-size="12" font-weight="700" fill="#0d47a1">做什么</text>
  <text x="700" y="482" font-size="12" font-weight="700" fill="#0d47a1">能排除什么</text>
  <line x1="60" y1="490" x2="940" y2="490" stroke="#90caf9" stroke-width="1"/>

  <text x="70" y="508" font-size="12" fill="#424242">①</text>
  <text x="300" y="508" font-size="11" fill="#424242">打印 field.name，看真实落盘名</text>
  <text x="700" y="508" font-size="11" fill="#424242">排除"我以为叫这个名字"</text>

  <text x="70" y="528" font-size="12" fill="#424242">②</text>
  <text x="300" y="528" font-size="11" fill="#424242">对比 field.url 与手拼 URL</text>
  <text x="700" y="528" font-size="11" fill="#424242">定位 404 的真正来源</text>

  <text x="70" y="548" font-size="12" fill="#424242">③</text>
  <text x="300" y="548" font-size="11" fill="#424242">确认 STORAGES 里哪个后端在生效</text>
  <text x="700" y="548" font-size="11" fill="#424242">排除配置没生效</text>
</svg>
