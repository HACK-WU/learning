<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="920" height="560" fill="#fbfcfe"/>
  <text x="460" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">指标语义三步核验</text>
  <text x="460" y="52" text-anchor="middle" font-size="12.5" fill="#7b8794">任何指标写进告警规则前必做 —— 防「告警永不触发」的静默失效</text>

  <!-- 三步 -->
  <rect x="40" y="72" width="270" height="150" rx="9" fill="#eaf2fd" stroke="#3d7ec4" stroke-width="1.8"/>
  <circle cx="72" cy="100" r="15" fill="#3d7ec4"/>
  <text x="72" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  <text x="98" y="106" font-size="14" font-weight="700" fill="#1f4e79">看值域</text>
  <text x="60" y="132" font-size="12" fill="#34495e">读出实际数值，判断它是否落在</text>
  <text x="60" y="150" font-size="12" fill="#34495e">你预期的语义区间内。</text>
  <rect x="58" y="160" width="234" height="46" rx="5" fill="#fff" stroke="#bdc3c7" stroke-width="1.2"/>
  <text x="70" y="178" font-size="11" fill="#7f8c8d">比率 → 应在 0~1 或 0~100</text>
  <text x="70" y="195" font-size="11" fill="#922b21">计数 → 可能很大（如 1e11）</text>

  <rect x="325" y="72" width="270" height="150" rx="9" fill="#eaf2fd" stroke="#3d7ec4" stroke-width="1.8"/>
  <circle cx="357" cy="100" r="15" fill="#3d7ec4"/>
  <text x="357" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  <text x="383" y="106" font-size="14" font-weight="700" fill="#1f4e79">查语义</text>
  <text x="345" y="132" font-size="12" fill="#34495e">确认它「定义上」是什么：</text>
  <text x="345" y="150" font-size="12" fill="#34495e">读 HELP 行 / 文档 / 文件命名。</text>
  <rect x="343" y="160" width="234" height="46" rx="5" fill="#fff" stroke="#bdc3c7" stroke-width="1.2"/>
  <text x="355" y="178" font-size="11" fill="#7f8c8d">Prometheus → # HELP 行</text>
  <text x="355" y="195" font-size="11" fill="#7f8c8d">cgroup → 内核文档 + 命名</text>

  <rect x="610" y="72" width="270" height="150" rx="9" fill="#eaf2fd" stroke="#3d7ec4" stroke-width="1.8"/>
  <circle cx="642" cy="100" r="15" fill="#3d7ec4"/>
  <text x="642" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
  <text x="668" y="106" font-size="14" font-weight="700" fill="#1f4e79">连续采样</text>
  <text x="630" y="132" font-size="12" fill="#34495e">采样 3~5 次（间隔数秒），</text>
  <text x="630" y="150" font-size="12" fill="#34495e">看它<b>会不会下降</b>。</text>
  <rect x="628" y="160" width="234" height="46" rx="5" fill="#fff" stroke="#bdc3c7" stroke-width="1.2"/>
  <text x="640" y="178" font-size="11" fill="#145a32">有升有降 → 瞬时 / 窗口值</text>
  <text x="640" y="195" font-size="11" fill="#922b21">只增不减 → 累积计数 ⛔</text>

  <!-- 箭头 -->
  <path d="M310 147 L325 147" stroke="#5d6d7e" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M595 147 L610 147" stroke="#5d6d7e" stroke-width="1.8" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5d6d7e"/></marker></defs>

  <path d="M460 222 L460 252" stroke="#5d6d7e" stroke-width="1.8"/>

  <!-- 判定 -->
  <rect x="300" y="254" width="320" height="40" rx="7" fill="#2c3e50"/>
  <text x="460" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#ecf0f1">只看一件事：它会不会「下降」？</text>

  <!-- 两个真实案例 -->
  <text x="460" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">本机实测的两个案例</text>

  <rect x="40" y="336" width="420" height="186" rx="9" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
  <text x="250" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#145a32">✅ 正例：PSI cpu.some avg10</text>
  <text x="60" y="384" font-size="11.5" fill="#34495e">① 值域：0.28 / 0.39 / 0.85 → 小百分数，符合「百分比」预期</text>
  <text x="60" y="404" font-size="11.5" fill="#34495e">② 语义：PSI some = 有任务被该资源拖慢的时间占比（内核文档）</text>
  <text x="60" y="424" font-size="11.5" fill="#34495e">③ 采样（间隔 3 秒）：</text>
  <text x="76" y="444" font-size="12" font-weight="700" fill="#145a32">0.28 → 0.23 → 0.15 → 1.09　有升有降</text>
  <rect x="60" y="454" width="380" height="52" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/>
  <text x="250" y="474" text-anchor="middle" font-size="11.5" font-weight="700" fill="#145a32">结论：窗口均值 → 可直接比阈值</text>
  <text x="250" y="493" text-anchor="middle" font-size="11" fill="#7f8c8d">⚠ 同文件的 total 是累积微秒，别拿它告警</text>

  <rect x="480" y="336" width="400" height="186" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="680" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#922b21">⛔ 反例：docker stats BlockIO</text>
  <text x="500" y="384" font-size="11.5" fill="#34495e">① 值域：352MB / 6.73GB → GB 级，「很大」可疑</text>
  <text x="500" y="404" font-size="11.5" fill="#34495e">② 语义：cgroup io.stat 命名 wbytes（累计字节）</text>
  <text x="500" y="424" font-size="11.5" fill="#34495e">③ 采样（间隔 8 秒 × 5 次）：</text>
  <text x="516" y="444" font-size="12" font-weight="700" fill="#922b21">6.73GB 五次不变；另轮 370MB → 376MB 只增</text>
  <rect x="500" y="454" width="360" height="52" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/>
  <text x="680" y="474" text-anchor="middle" font-size="11.5" font-weight="700" fill="#922b21">结论：累积值 → 必须先算 rate/差值</text>
  <text x="680" y="493" text-anchor="middle" font-size="11" fill="#7b241c">直接 block_io &gt; 1GB → 迟早触发且只响一次</text>

  <!-- 底部 -->
  <rect x="40" y="534" width="840" height="18" rx="5" fill="#2c3e50"/>
  <text x="460" y="547" text-anchor="middle" font-size="11" fill="#ecf0f1">把核验过程与日期写进配置注释 —— 半年后有人问「这阈值哪来的」，答案就在旁边</text>
</svg>
