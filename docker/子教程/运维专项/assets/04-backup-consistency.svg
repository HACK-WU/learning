<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="560" fill="#fbfcfe"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">卷备份：先分清对象，再谈一致性</text>
  <text x="450" y="50" text-anchor="middle" font-size="12.5" fill="#7b8794">本机实测 218 个卷 —— 第一道坎不是怎么备，是「哪个才是要备的」</text>

  <rect x="40" y="66" width="820" height="112" rx="9" fill="#fdf0e3" stroke="#d68910" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#7d5108">第一道坎：218 个卷里，203 个认不出来</text>
  <rect x="60" y="100" width="380" height="66" rx="6" fill="#fff" stroke="#bdc3c7" stroke-width="1.3"/>
  <text x="250" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#145a32">具名卷　15 个（7%）</text>
  <text x="250" y="139" text-anchor="middle" font-size="10.5" fill="#34495e">gf-l02d-vol · l9data1 · l12_backup_vol …</text>
  <text x="250" y="156" text-anchor="middle" font-size="10.5" fill="#7b241c">其中 6 个是孤儿（无容器引用）</text>
  <rect x="460" y="100" width="380" height="66" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/>
  <text x="650" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#922b21">匿名卷　203 个（93%）</text>
  <text x="650" y="139" text-anchor="middle" font-size="10.5" fill="#34495e">1fe925500a5a9abbcf25beb4a867f01244…</text>
  <text x="650" y="156" text-anchor="middle" font-size="10.5" fill="#7b241c">⛔ 真实 pg 数据就躺在其中一个里</text>

  <path d="M450 178 L450 204" stroke="#5d6d7e" stroke-width="1.8"/>

  <rect x="290" y="206" width="320" height="36" rx="7" fill="#2c3e50"/>
  <text x="450" y="229" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ecf0f1">第二道坎：它在活跃写入吗？</text>

  <path d="M450 242 L450 268" stroke="#5d6d7e" stroke-width="1.8"/>

  <text x="450" y="288" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">三条路（实测判据）</text>

  <rect x="40" y="300" width="262" height="184" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="171" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#922b21">⚠ 物理备份 · 热 tar</text>
  <text x="60" y="346" font-size="11" fill="#34495e">容器运行中直接 tar 卷目录</text>
  <text x="60" y="368" font-size="11" font-weight="700" fill="#7b241c">得到：崩溃一致性副本</text>
  <text x="60" y="390" font-size="10.5" fill="#34495e">相当于「突然断电」，恢复时</text>
  <text x="60" y="407" font-size="10.5" fill="#34495e">靠重放 WAL 自修，通常能起来，</text>
  <text x="60" y="424" font-size="10.5" fill="#7b241c">但未落盘的已提交事务可能丢</text>
  <rect x="58" y="434" width="226" height="38" rx="5" fill="#fff" stroke="#bdc3c7" stroke-width="1.2"/>
  <text x="171" y="450" text-anchor="middle" font-size="10.5" fill="#34495e">适合：静态文件（配置、上传）</text>
  <text x="171" y="465" text-anchor="middle" font-size="10.5" fill="#7b241c">不适合：活跃数据库</text>

  <rect x="319" y="300" width="262" height="184" rx="9" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
  <text x="450" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#145a32">✅ 逻辑备份 · pg_dump</text>
  <text x="339" y="346" font-size="11" fill="#34495e">让数据库自己导出 SQL</text>
  <text x="339" y="368" font-size="11" font-weight="700" fill="#145a32">得到：事务一致性</text>
  <text x="339" y="390" font-size="10.5" fill="#34495e">导出时间点上所有事务</text>
  <text x="339" y="407" font-size="10.5" fill="#34495e">要么全在、要么全不在，</text>
  <text x="339" y="424" font-size="10.5" fill="#145a32">恢复后数据确定完整</text>
  <rect x="337" y="434" width="226" height="38" rx="5" fill="#fff" stroke="#bdc3c7" stroke-width="1.2"/>
  <text x="450" y="450" text-anchor="middle" font-size="10.5" fill="#34495e">适合：活跃数据库（推荐）</text>
  <text x="450" y="465" text-anchor="middle" font-size="10.5" fill="#7b241c">不含 pg_hba.conf 等配置文件</text>

  <rect x="598" y="300" width="262" height="184" rx="9" fill="#eaf2fd" stroke="#3d7ec4" stroke-width="1.8"/>
  <text x="729" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">⚡ 标记 + 存储快照</text>
  <text x="618" y="346" font-size="11" fill="#34495e">pg_backup_start → 快照 → stop</text>
  <text x="618" y="368" font-size="11" font-weight="700" fill="#1f4e79">得到：一致且最快</text>
  <text x="618" y="390" font-size="10.5" fill="#34495e">返回 LSN 后做 LVM/ZFS/云盘</text>
  <text x="618" y="407" font-size="10.5" fill="#34495e">快照，再 stop 结束标记</text>
  <text x="618" y="424" font-size="10.5" fill="#7b241c">⛔ 必须同一会话内成对调用</text>
  <rect x="616" y="434" width="226" height="38" rx="5" fill="#fff" stroke="#bdc3c7" stroke-width="1.2"/>
  <text x="729" y="450" text-anchor="middle" font-size="10.5" fill="#34495e">适合：大库 + 支持快照的存储</text>
  <text x="729" y="465" text-anchor="middle" font-size="10.5" fill="#7f8c8d">实测 start 返回 0/C000028</text>

  <rect x="40" y="500" width="820" height="46" rx="7" fill="#2c3e50"/>
  <text x="450" y="520" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ecf0f1">实测判据：postmaster.pid 存在 + 10 分钟内 5 个文件被改（pg_wal×2 · pg_control …）= 活跃写入</text>
  <text x="450" y="538" text-anchor="middle" font-size="11" fill="#bdc3c7">⚠ 用户名要从 docker inspect 的 Env 读 —— 本机 POSTGRES_USER=grafana，用 -U postgres 会报 role does not exist</text>
</svg>
