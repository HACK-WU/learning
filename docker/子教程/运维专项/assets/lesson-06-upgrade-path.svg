<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Docker 引擎升级：一次 apt upgrade 到底动了什么</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#666">本机实测 Docker 29.4.1 / containerd 2.2.3 / runc 1.3.5</text>

  <rect x="30" y="72" width="180" height="52" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="120" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">apt-get upgrade</text>
  <text x="120" y="112" text-anchor="middle" font-size="11" fill="#1565c0">你以为只是换个包</text>

  <rect x="250" y="72" width="180" height="52" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="340" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">dpkg postinstall</text>
  <text x="340" y="112" text-anchor="middle" font-size="11" fill="#ef6c00">无条件执行 restart</text>

  <rect x="470" y="72" width="200" height="52" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="570" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#ad1457">systemctl restart docker</text>
  <text x="570" y="112" text-anchor="middle" font-size="11" fill="#c2185b">daemon 退出</text>

  <rect x="710" y="72" width="160" height="52" rx="6" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="790" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">带走 119 个容器</text>
  <text x="790" y="112" text-anchor="middle" font-size="11" fill="#d32f2f">默认行为</text>

  <line x1="210" y1="98" x2="250" y2="98" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="430" y1="98" x2="470" y2="98" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="670" y1="98" x2="710" y2="98" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>

  <text x="40" y="165" font-size="15" font-weight="bold" fill="#1a1a1a">live restore 能不能兜住？三条边界（官方口径）</text>

  <rect x="40" y="180" width="270" height="112" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="175" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">✅ 补丁版升级</text>
  <text x="175" y="224" text-anchor="middle" font-size="11" fill="#2e7d32">29.4.1 → 29.4.2</text>
  <text x="175" y="245" text-anchor="middle" font-size="11" fill="#2e7d32">YY.MM.x 最后一位变</text>
  <text x="175" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">官方明确支持</text>
  <text x="175" y="283" text-anchor="middle" font-size="10" fill="#558b2f">容器存活，StartedAt 不变</text>

  <rect x="330" y="180" width="270" height="112" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="465" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#f57f17">⚠️ 跨 minor 升级</text>
  <text x="465" y="224" text-anchor="middle" font-size="11" fill="#f57f17">29.4.1 → 29.8.1（本机候选）</text>
  <text x="465" y="245" text-anchor="middle" font-size="11" fill="#f57f17">跨 4 个 minor + 跳版本</text>
  <text x="465" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">官方明确不保</text>
  <text x="465" y="283" text-anchor="middle" font-size="10" fill="#ef6c00">daemon 可能无法重连容器</text>

  <rect x="620" y="180" width="250" height="112" rx="6" fill="#fbe9e7" stroke="#d84315" stroke-width="1.5"/>
  <text x="745" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">❌ 配置同时变更</text>
  <text x="745" y="224" text-anchor="middle" font-size="11" fill="#d84315">改了 bridge IP / 存储驱动</text>
  <text x="745" y="245" text-anchor="middle" font-size="11" fill="#d84315">或 Swarm 服务</text>
  <text x="745" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">同样不保</text>
  <text x="745" y="283" text-anchor="middle" font-size="10" fill="#e64a19">必须手动停止容器</text>

  <text x="40" y="330" font-size="15" font-weight="bold" fill="#1a1a1a">三层组件：升级不是一个包，是五个</text>

  <rect x="40" y="345" width="155" height="46" rx="5" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="117" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527a0">docker-ce</text>
  <text x="117" y="383" text-anchor="middle" font-size="11" fill="#5e35b1">29.4.1 → 29.8.1</text>

  <rect x="205" y="345" width="155" height="46" rx="5" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="282" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527a0">docker-ce-cli</text>
  <text x="282" y="383" text-anchor="middle" font-size="11" fill="#5e35b1">须与 ce 同版本</text>

  <rect x="370" y="345" width="155" height="46" rx="5" fill="#fff3e0" stroke="#f57c00"/>
  <text x="447" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">containerd.io</text>
  <text x="447" y="383" text-anchor="middle" font-size="11" fill="#f57c00">2.2.3 → 2.3.5（独立漂移）</text>

  <rect x="535" y="345" width="150" height="46" rx="5" fill="#e0f2f1" stroke="#00796b"/>
  <text x="610" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#004d40">buildx / compose</text>
  <text x="610" y="383" text-anchor="middle" font-size="11" fill="#00796b">0.33.0 / 5.1.3</text>

  <rect x="695" y="345" width="175" height="46" rx="5" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="782" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a237e">runc</text>
  <text x="782" y="383" text-anchor="middle" font-size="11" fill="#3949ab">1.3.5（随 containerd）</text>

  <rect x="40" y="410" width="830" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="455" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">唯一判据：升级前后比 StartedAt</text>
  <text x="455" y="450" text-anchor="middle" font-size="11" fill="#2e7d32">docker inspect --format '{{.Name}} {{.State.StartedAt}}' $(docker ps -q)  →  diff 有输出 = 被重启过</text>
</svg>
