<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="470" fill="#fbfcfe"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Docker 引擎的三层配置：谁覆盖谁</text>
  <text x="450" y="56" text-anchor="middle" font-size="12.5" fill="#7b8794">越靠近进程本身的那层越算数；同一项两处都写 → 拒绝启动</text>

  <!-- 优先级箭头说明 -->
  <text x="700" y="95" text-anchor="middle" font-size="12" fill="#c0392b">优先级</text>
  <text x="700" y="113" text-anchor="middle" font-size="12" fill="#c0392b">低 → 高</text>

  <!-- Layer 1 -->
  <rect x="40" y="90" width="600" height="86" rx="9" fill="#eaf2fd" stroke="#3d7ec4" stroke-width="1.6"/>
  <text x="60" y="116" font-size="15" font-weight="700" fill="#1f4e79">第 1 层 · systemd 单元与 drop-in</text>
  <text x="60" y="138" font-size="12.5" fill="#34495e">/lib/systemd/system/docker.service（包管理，勿直接改）</text>
  <text x="60" y="157" font-size="12.5" fill="#34495e">/etc/systemd/system/docker.service.d/*.conf（推荐覆盖点）</text>
  <text x="60" y="172" font-size="11.5" fill="#7f8c8d">决定「怎么启动它」：ExecStart 命令行、开机自启</text>
  <text x="672" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#3d7ec4">1</text>

  <!-- Layer 2 -->
  <rect x="80" y="196" width="560" height="86" rx="9" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
  <text x="100" y="222" font-size="15" font-weight="700" fill="#145a32">第 2 层 · /etc/docker/daemon.json</text>
  <text x="100" y="244" font-size="12.5" fill="#34495e">log-driver / log-opts / live-restore / storage-driver</text>
  <text x="100" y="263" font-size="12.5" fill="#34495e">registry-mirrors / metrics-addr …</text>
  <text x="100" y="278" font-size="11.5" fill="#7f8c8d">决定「它的行为参数」；启动时读入，改完须 restart</text>
  <text x="672" y="246" text-anchor="middle" font-size="26" font-weight="700" fill="#27ae60">2</text>

  <!-- Layer 3 -->
  <rect x="120" y="302" width="520" height="80" rx="9" fill="#fdf0e3" stroke="#d68910" stroke-width="1.6"/>
  <text x="140" y="328" font-size="15" font-weight="700" fill="#7d5108">第 3 层 · 命令行启动参数</text>
  <text x="140" y="350" font-size="12.5" fill="#34495e">dockerd --live-restore  -H tcp://…  （写在 ExecStart 里）</text>
  <text x="140" y="369" font-size="11.5" fill="#7f8c8d">优先级最高，直接覆盖同名配置</text>
  <text x="672" y="348" text-anchor="middle" font-size="26" font-weight="700" fill="#d68910">3</text>

  <!-- 箭头 -->
  <path d="M300 176 L300 194" stroke="#5d6d7e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M340 282 L340 300" stroke="#5d6d7e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M380 382 L380 400" stroke="#5d6d7e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 冲突警告 -->
  <rect x="120" y="402" width="520" height="50" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="380" y="423" text-anchor="middle" font-size="13" font-weight="700" fill="#922b21">⚠ 同一项在第 2 层与第 3 层同时出现 → dockerd 拒绝启动</text>
  <text x="380" y="442" text-anchor="middle" font-size="11.5" fill="#7b241c">the following directives are specified both as a flag and in the configuration file</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5d6d7e"/>
    </marker>
  </defs>
</svg>
