# 课 13 的交付流水线 —— 放到仓库的 .github/workflows/ci.yml 即可生效。
#
# 四个设计要点（课 12–13）：
#   ① PR 只构建、不推送 —— PR 的代码不可信，不该拿到写 registry 的凭据；
#   ② tag 带 git sha，永不覆盖；
#   ③ Build checks、测试和扫描都在 **推送之前** —— 脏镜像根本进不了仓库；
#   ④ 测试构建可 `load`，最终发布按目标平台 `push`，并附带 SBOM / provenance。

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: myrepo/order-service

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 0) 先检查 Dockerfile（课 13 场景补丁）
      - name: Build checks
        run: docker build --check .

      # ① PR 触发时不登录、不推送
      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build (load for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 闸门①（课 12）：镜像里有没有把密钥烤进去
      - name: Check for baked secrets
        run: |
          if docker history ${{ env.IMAGE }}:ci-${{ github.sha }} --no-trunc \
             | grep -iE 'password|secret|token|api[_-]?key'; then
            echo "⛔ 镜像里含有疑似密钥"
            exit 1
          fi

      # 闸门②（课 13）：跑集成测试 —— 复用课 9 的 compose
      - name: Integration test
        run: |
          docker compose -f compose.yaml -f compose.test.yaml up \
            --abort-on-container-exit --exit-code-from tests
        env:
          TAG: ci-${{ github.sha }}

      # 闸门③（课 12）：漏洞扫描
      - name: Vulnerability scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE }}:ci-${{ github.sha }}

      # 三道闸门都过了才推送
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          # 测试阶段的 load 只针对单一架构；最终发布显式覆盖目标平台。
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Verify published manifest
        if: github.event_name != 'pull_request'
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.sha }}

# ---------------------------------------------------------------------
# 已知注意事项（课 13）：
#   · `type=gha` 缓存后端仅能在 GitHub Actions workflow 内使用（官方标注 Experimental）；
#   · GitHub Cache service API v1 已于 2025-04-15 停用，若遇相关报错，
#     需 Buildx ≥ v0.21.0 / BuildKit ≥ v0.20.0（自托管 runner 需自行升级）；
#   · `cache mounts`（RUN --mount=type=cache）默认 **不会** 被 gha 缓存保留。
