  <rect x="55" y="105" width="230" height="150" rx="18" fill="#f5f9ff" stroke="#1565C0" stroke-width="3"/><text x="170" y="160" text-anchor="middle" class="label">上层操作</text><text x="170" y="200" text-anchor="middle" class="note">人和工具发出意图</text>
  <path d="M300 180 H415" class="arrow"/><rect x="435" y="105" width="230" height="150" rx="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="550" y="160" text-anchor="middle" class="label">中间管理</text><text x="550" y="200" text-anchor="middle" class="note">组织镜像、网络、进程</text>
  <path d="M680 180 H795" class="arrow"/><rect x="815" y="105" width="130" height="150" rx="18" fill="#fff8e1" stroke="#ef6c00" stroke-width="3"/><text x="880" y="155" text-anchor="middle" class="label">底层执行</text><text x="880" y="200" text-anchor="middle" class="note">真正</text><text x="880" y="225" text-anchor="middle" class="note">隔离与运行</text>
