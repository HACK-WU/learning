<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#fafafa"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#1565C0">三种挂载方式：数据到底存在哪、容器删了还在吗</text>
  <text x="40" y="62" font-size="12.5" fill="#555">三者都能让数据"绕开"容器的可写层，但存放位置与生命周期完全不同——选错就是数据丢失或安全漏洞。</text>

  <!-- ============ 列 1：volume ============ -->
  <rect x="40" y="90" width="290" height="30" rx="4" fill="#2e7d32"/>
  <text x="185" y="111" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">① volume（卷）</text>

  <text x="60" y="146" font-size="11.5" font-weight="bold" fill="#555">数据存在宿主机的哪</text>
  <rect x="60" y="154" width="250" height="62" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="185" y="178" font-size="11.5" fill="#1b5e20" text-anchor="middle">/var/lib/docker/volumes/</text>
  <text x="185" y="196" font-size="11.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">my-vol/_data</text>
  <text x="185" y="211" font-size="10" fill="#2e7d32" text-anchor="middle">由 Docker 创建并管理</text>

  <path d="M 185 216 L 185 240" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#g1)"/>
  <defs>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#2e7d32"/></marker>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#1565C0"/></marker>
    <marker id="p1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#6a1b9a"/></marker>
  </defs>

  <text x="60" y="262" font-size="11.5" font-weight="bold" fill="#555">容器里看到的是</text>
  <rect x="60" y="270" width="250" height="42" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="185" y="296" font-size="12" fill="#1b5e20" text-anchor="middle">/var/lib/postgresql/data</text>

  <rect x="60" y="322" width="250" height="34" rx="4" fill="#2e7d32"/>
  <text x="185" y="344" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ 容器删了，数据还在</text>

  <text x="60" y="380" font-size="11" fill="#333">• 官方首选的持久化机制</text>
  <text x="60" y="398" font-size="11" fill="#333">• 比 bind mount 更好备份迁移</text>
  <text x="60" y="416" font-size="11" fill="#333">• 不增大容器可写层，I/O 更快</text>
  <text x="60" y="434" font-size="11" fill="#c62828">• 宿主机上不能直接看（Docker 托管）</text>

  <!-- ============ 列 2：bind mount ============ -->
  <rect x="355" y="90" width="290" height="30" rx="4" fill="#1565C0"/>
  <text x="500" y="111" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">② bind mount（绑定挂载）</text>

  <text x="375" y="146" font-size="11.5" font-weight="bold" fill="#555">数据存在宿主机的哪</text>
  <rect x="375" y="154" width="250" height="62" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
  <text x="500" y="178" font-size="11.5" fill="#0d47a1" text-anchor="middle">你指定的任意路径</text>
  <text x="500" y="196" font-size="11.5" font-weight="bold" fill="#0d47a1" text-anchor="middle">/home/me/code</text>
  <text x="500" y="211" font-size="10" fill="#1565C0" text-anchor="middle">路径由你说了算</text>

  <path d="M 500 216 L 500 240" fill="none" stroke="#1565C0" stroke-width="2" marker-end="url(#b1)"/>

  <text x="375" y="262" font-size="11.5" font-weight="bold" fill="#555">容器里看到的是</text>
  <rect x="375" y="270" width="250" height="42" rx="4" fill="#ffffff" stroke="#1565C0" stroke-width="1.5"/>
  <text x="500" y="296" font-size="12" fill="#0d47a1" text-anchor="middle">/app　（同一份文件）</text>

  <rect x="375" y="322" width="250" height="34" rx="4" fill="#1565C0"/>
  <text x="500" y="344" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ 容器删了，数据还在</text>

  <text x="375" y="380" font-size="11" fill="#333">• 宿主机与容器双向可见可改</text>
  <text x="375" y="398" font-size="11" fill="#333">• 适合挂源码、配置文件</text>
  <text x="375" y="416" font-size="11" fill="#c62828">• 容器能改写宿主机文件（安全隐患）</text>
  <text x="375" y="434" font-size="11" fill="#c62828">• 与宿主机目录结构强绑定，换机器易失败</text>

  <!-- ============ 列 3：tmpfs ============ -->
  <rect x="670" y="90" width="290" height="30" rx="4" fill="#6a1b9a"/>
  <text x="815" y="111" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">③ tmpfs（内存挂载）</text>

  <text x="690" y="146" font-size="11.5" font-weight="bold" fill="#555">数据存在宿主机的哪</text>
  <rect x="690" y="154" width="250" height="62" rx="4" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="815" y="178" font-size="11.5" fill="#4a148c" text-anchor="middle">宿主机内存（RAM）</text>
  <text x="815" y="196" font-size="11.5" font-weight="bold" fill="#4a148c" text-anchor="middle">不落盘</text>
  <text x="815" y="211" font-size="10" fill="#6a1b9a" text-anchor="middle">仅 Linux 可用</text>

  <path d="M 815 216 L 815 240" fill="none" stroke="#6a1b9a" stroke-width="2" marker-end="url(#p1)"/>

  <text x="690" y="262" font-size="11.5" font-weight="bold" fill="#555">容器里看到的是</text>
  <rect x="690" y="270" width="250" height="42" rx="4" fill="#ffffff" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="815" y="296" font-size="12" fill="#4a148c" text-anchor="middle">/tmp　（读写极快）</text>

  <rect x="690" y="322" width="250" height="34" rx="4" fill="#c62828"/>
  <text x="815" y="344" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">❌ 容器一停，数据就没了</text>

  <text x="690" y="380" font-size="11" fill="#333">• 想在容器外写大量临时数据时用</text>
  <text x="690" y="398" font-size="11" fill="#333">• 不进容器层，也不落宿主机磁盘</text>
  <text x="690" y="416" font-size="11" fill="#c62828">• ⚠️ 占用计入容器内存上限</text>
  <text x="690" y="434" font-size="11" fill="#c62828">• ⚠️ 可能被写进 swap，从而落盘</text>

  <!-- ============ 关键差异条 ============ -->
  <rect x="40" y="462" width="920" height="70" rx="6" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.2"/>
  <text x="60" y="486" font-size="12.5" font-weight="bold" fill="#e65100">⚠️ 最容易踩的一个差异：挂到「非空目录」上时</text>
  <text x="60" y="508" font-size="12" fill="#333">volume：目标目录里原有的文件会被<tspan font-weight="bold">拷贝进卷</tspan>（可用 volume-nocopy 关闭）——这是预置初始数据的官方手法。</text>
  <text x="60" y="526" font-size="12" fill="#333">bind mount：目标目录里原有的文件被<tspan font-weight="bold">直接遮蔽</tspan>，容器里看不到它们了（官方明说"this behavior differs from that of volumes"）。</text>

  <text x="40" y="556" font-size="11" fill="#78909c">机制依据：Docker 官方 Volumes / Bind mounts / tmpfs mounts 文档（核查于 2026-09）。</text>
  <text x="40" y="576" font-size="11" fill="#78909c">另一处易忽略：写容器可写层要走存储驱动的联合文件系统，比直接写卷慢；这也是"数据库类应用要用卷"的官方理由之一（课 3）。</text>
</svg>
