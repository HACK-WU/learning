<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <rect width="1000" height="360" fill="#fff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#333}.title{font-size:24px;font-weight:700}.label{font-size:22px;font-weight:600}.note{font-size:17px;fill:#555}.arrow{stroke:#1565C0;stroke-width:4;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1565C0"/></marker></defs>
  <text x="500" y="42" text-anchor="middle" class="title">程序可以替换，数据不能跟着消失</text>
  <rect x="55" y="105" width="230" height="150" rx="18" fill="#f5f9ff" stroke="#1565C0" stroke-width="3"/><text x="170" y="160" text-anchor="middle" class="label">程序产生数据</text><text x="170" y="200" text-anchor="middle" class="note">订单、缓存、上传文件</text>
  <path d="M300 180 H415" class="arrow"/><rect x="435" y="105" width="230" height="150" rx="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="550" y="160" text-anchor="middle" class="label">数据独立存放</text><text x="550" y="200" text-anchor="middle" class="note">不绑死某个容器</text>
  <path d="M680 180 H795" class="arrow"/><rect x="815" y="105" width="130" height="150" rx="18" fill="#fff8e1" stroke="#ef6c00" stroke-width="3"/><text x="880" y="155" text-anchor="middle" class="label">替换程序</text><text x="880" y="200" text-anchor="middle" class="note">仍保留</text><text x="880" y="225" text-anchor="middle" class="note">原数据</text>
</svg>
