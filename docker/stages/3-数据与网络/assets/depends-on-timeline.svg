<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#fafafa"/>

  <text x="40" y="38" font-size="20" font-weight="bold" fill="#1565C0">depends_on 的两种写法，决定了「什么时候放行下游服务」</text>
  <text x="40" y="60" font-size="12.5" fill="#555">这是 Compose 最经典的坑：应用启动时报 <tspan font-family="monospace">connection refused</tspan>，但手动重启一次就好了——因为数据库「启动了」≠「能连了」。</text>

  <!-- ============ 左：短语法 ============ -->
  <rect x="40" y="78" width="450" height="422" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <rect x="40" y="78" width="450" height="30" rx="6" fill="#c62828"/>
  <rect x="40" y="98" width="450" height="10" fill="#c62828"/>
  <text x="265" y="99" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">❌ 短语法　depends_on: [db]</text>

  <!-- 泳道标签 -->
  <text x="60" y="152" font-size="12" font-weight="bold" fill="#37474f">db</text>
  <text x="60" y="242" font-size="12" font-weight="bold" fill="#37474f">web</text>

  <!-- 时间轴刻度 -->
  <line x1="100" y1="292" x2="470" y2="292" stroke="#b0bec5" stroke-width="1"/>
  <text x="100" y="308" font-size="10" fill="#90a4ae" text-anchor="middle">0s</text>
  <text x="470" y="308" font-size="10" fill="#90a4ae" text-anchor="middle">时间 →</text>

  <!-- db 泳道 -->
  <rect x="100" y="130" width="150" height="36" rx="3" fill="#fff59d" stroke="#f9a825" stroke-width="1"/>
  <text x="175" y="146" font-size="10" fill="#795548" text-anchor="middle">容器已 start</text>
  <text x="175" y="158" font-size="9" fill="#795548" text-anchor="middle">（依赖条件已满足）</text>

  <rect x="250" y="130" width="220" height="36" rx="3" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <text x="360" y="146" font-size="10" fill="#e65100" text-anchor="middle">仍在初始化…</text>
  <text x="360" y="158" font-size="9" fill="#e65100" text-anchor="middle">还接受不了连接</text>

  <!-- 放行虚线 -->
  <line x1="250" y1="120" x2="250" y2="285" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="256" y="118" font-size="10" font-weight="bold" fill="#c62828">Compose 在此刻放行 web</text>

  <!-- web 泳道 -->
  <rect x="250" y="220" width="220" height="36" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="360" y="236" font-size="10" fill="#1b5e20" text-anchor="middle">web 启动</text>
  <text x="360" y="248" font-size="9" fill="#1b5e20" text-anchor="middle">立刻去连 db</text>

  <!-- 失败标记 -->
  <circle cx="300" cy="238" r="12" fill="#c62828"/>
  <text x="300" y="243" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✕</text>
  <text x="322" y="243" font-size="10.5" font-weight="bold" fill="#c62828">connection refused</text>

  <!-- 结果条 -->
  <rect x="58" y="330" width="414" height="52" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1"/>
  <text x="74" y="352" font-size="11.5" font-weight="bold" fill="#b71c1c">❌ web 启动即崩</text>
  <text x="74" y="370" font-size="10.5" fill="#333">手动重启一次又好了 —— 因为这时 db 才初始化完。典型「本地偶发、CI 必现」故障。</text>

  <text x="60" y="404" font-size="10" fill="#78909c">短语法只保证「Compose 已把 db 容器 start 起来」。</text>
  <text x="60" y="420" font-size="10" fill="#78909c">官方原话：短语法下 "Compose does</text>
  <text x="60" y="434" font-size="10" fill="#78909c">not wait for dependency services to</text>
  <text x="60" y="448" font-size="10" fill="#78909c">be 'healthy'"。</text>

  <!-- ============ 右：长语法 service_healthy ============ -->
  <rect x="510" y="78" width="450" height="422" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="510" y="78" width="450" height="30" rx="6" fill="#2e7d32"/>
  <rect x="510" y="98" width="450" height="10" fill="#2e7d32"/>
  <text x="735" y="99" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ 长语法　condition: service_healthy</text>

  <text x="530" y="152" font-size="12" font-weight="bold" fill="#37474f">db</text>
  <text x="530" y="242" font-size="12" font-weight="bold" fill="#37474f">web</text>

  <line x1="570" y1="292" x2="940" y2="292" stroke="#b0bec5" stroke-width="1"/>
  <text x="570" y="308" font-size="10" fill="#90a4ae" text-anchor="middle">0s</text>
  <text x="940" y="308" font-size="10" fill="#90a4ae" text-anchor="middle">时间 →</text>

  <!-- db 泳道 -->
  <rect x="570" y="130" width="150" height="36" rx="3" fill="#fff59d" stroke="#f9a825" stroke-width="1"/>
  <text x="645" y="146" font-size="10" fill="#795548" text-anchor="middle">容器已 start</text>
  <text x="645" y="158" font-size="9" fill="#795548" text-anchor="middle">（条件还不满足）</text>

  <rect x="720" y="130" width="220" height="36" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="830" y="146" font-size="10" fill="#1b5e20" text-anchor="middle">healthcheck 通过</text>
  <text x="830" y="158" font-size="9" fill="#1b5e20" text-anchor="middle">状态 = healthy</text>

  <!-- 放行虚线 -->
  <line x1="720" y1="120" x2="720" y2="285" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="726" y="118" font-size="10" font-weight="bold" fill="#2e7d32">Compose 等到这里才放行 web</text>

  <!-- web 泳道 -->
  <rect x="720" y="220" width="220" height="36" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="830" y="236" font-size="10" fill="#1b5e20" text-anchor="middle">web 启动</text>
  <text x="830" y="248" font-size="9" fill="#1b5e20" text-anchor="middle">去连 db</text>

  <!-- 成功标记 -->
  <circle cx="770" cy="238" r="12" fill="#2e7d32"/>
  <text x="770" y="243" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="792" y="243" font-size="10.5" font-weight="bold" fill="#2e7d32">连上了</text>

  <!-- 结果条 -->
  <rect x="528" y="330" width="414" height="52" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="544" y="352" font-size="11.5" font-weight="bold" fill="#1b5e20">✅ web 等到 db 真正可用才启动</text>
  <text x="544" y="370" font-size="10.5" fill="#333">启动顺序由「是否健康」决定，而不是「是否 start」。</text>

  <text x="530" y="404" font-size="10" fill="#78909c">前提：db 服务上必须声明 healthcheck，</text>
  <text x="530" y="420" font-size="10" fill="#78909c">否则 service_healthy 永远不会被满足</text>
  <text x="530" y="434" font-size="10" fill="#78909c">（Compose 会一直等，直到超时）。</text>

  <!-- 底部注释 -->
  <rect x="40" y="512" width="920" height="34" rx="5" fill="#fff8e1" stroke="#ef6c00" stroke-width="1"/>
  <text x="58" y="534" font-size="11.5" fill="#333">⚠️ 两个补充：<tspan font-weight="bold">①</tspan> 还有第三种条件 <tspan font-family="monospace" font-weight="bold">service_completed_successfully</tspan>（等依赖「跑完并成功退出」，适合一次性任务如迁移、初始化）；<tspan font-weight="bold">②</tspan> <tspan font-family="monospace">required: false</tspan> 可让依赖缺失时只警告不阻塞。</text>
</svg>
