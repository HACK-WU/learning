<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <rect width="1000" height="360" fill="#fff"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#333} .title{font-size:24px;font-weight:700}.label{font-size:22px;font-weight:600}.note{font-size:17px;fill:#555}.box{fill:#f5f9ff;stroke:#1565C0;stroke-width:3}.arrow{stroke:#1565C0;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1565C0"/></marker></defs>
  <text x="500" y="42" text-anchor="middle" class="title">同一份服务，为什么换台机器就变样？</text>
  <rect x="55" y="105" width="230" height="150" rx="18" class="box"/><text x="170" y="158" text-anchor="middle" class="label">不同机器</text><text x="170" y="198" text-anchor="middle" class="note">系统、依赖、配置各不同</text>
  <path d="M300 180 H415" class="arrow"/>
  <rect x="435" y="105" width="230" height="150" rx="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="550" y="158" text-anchor="middle" class="label">同一份服务</text><text x="550" y="198" text-anchor="middle" class="note">代码只是其中一部分</text>
  <path d="M680 180 H795" class="arrow"/>
  <rect x="815" y="105" width="130" height="150" rx="18" fill="#fff8e1" stroke="#ef6c00" stroke-width="3"/><text x="880" y="150" text-anchor="middle" class="label">一起带走</text><text x="880" y="190" text-anchor="middle" class="note">运行环境</text><text x="880" y="220" text-anchor="middle" class="note">可交接</text>
</svg>
