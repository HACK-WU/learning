<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#fafafa"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#1565C0">写时复制（Copy-on-Write）：读 / 改 / 删 三条路径</text>
  <text x="40" y="62" font-size="12.5" fill="#555">镜像层只读、容器层可写。理解这三张图，就理解了"为什么删了文件镜像没变小"。</text>

  <!-- 公共图例 -->
  <rect x="40" y="82" width="14" height="14" rx="2" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="60" y="94" font-size="11.5" fill="#333">容器层（可写）</text>
  <rect x="170" y="82" width="14" height="14" rx="2" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="190" y="94" font-size="11.5" fill="#333">镜像层（只读）</text>
  <rect x="300" y="82" width="14" height="14" rx="2" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="320" y="94" font-size="11.5" fill="#333">被遮挡 / 已删除（但仍在下层占空间）</text>

  <!-- ============ Panel 1：读 ============ -->
  <rect x="40" y="110" width="290" height="330" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="40" y="110" width="290" height="30" rx="6" fill="#2e7d32"/>
  <text x="185" y="131" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">① 读文件</text>

  <rect x="60" y="156" width="250" height="38" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="185" y="179" font-size="12" fill="#1b5e20" text-anchor="middle">容器层（可写）· 空</text>

  <rect x="60" y="200" width="250" height="36" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="185" y="222" font-size="11.5" fill="#0d47a1" text-anchor="middle">镜像层 3（只读）</text>
  <rect x="60" y="240" width="250" height="36" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="185" y="262" font-size="11.5" font-weight="bold" fill="#0d47a1" text-anchor="middle">镜像层 2（只读）· app.js 在这</text>
  <rect x="60" y="280" width="250" height="36" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="185" y="302" font-size="11.5" fill="#0d47a1" text-anchor="middle">镜像层 1（只读）</text>

  <path d="M 280 175 L 120 175 L 120 258" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#g1)"/>
  <defs>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#2e7d32"/>
    </marker>
  </defs>
  <text x="200" y="248" font-size="11" fill="#2e7d32" text-anchor="middle">穿透到下层读</text>

  <text x="185" y="342" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">不复制、不占空间</text>
  <text x="60" y="366" font-size="11.5" fill="#555">容器只往下层找文件，</text>
  <text x="60" y="384" font-size="11.5" fill="#555">找到了就直接用现成的那一份。</text>
  <text x="60" y="408" font-size="11.5" fill="#555">只读层被 N 个容器共享，</text>
  <text x="60" y="426" font-size="11.5" fill="#555">磁盘上只有一份。</text>

  <!-- ============ Panel 2：改 ============ -->
  <rect x="355" y="110" width="290" height="330" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="355" y="110" width="290" height="30" rx="6" fill="#1565C0"/>
  <text x="500" y="131" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">② 改文件</text>

  <rect x="375" y="156" width="250" height="38" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="500" y="179" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">容器层 · app.js（改后的副本）</text>

  <rect x="375" y="200" width="250" height="36" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="500" y="222" font-size="11.5" fill="#0d47a1" text-anchor="middle">镜像层 3（只读）</text>
  <rect x="375" y="240" width="250" height="36" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="500" y="262" font-size="11.5" fill="#90a4ae" text-anchor="middle">镜像层 2 · app.js（原版，被盖住）</text>
  <rect x="375" y="280" width="250" height="36" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="500" y="302" font-size="11.5" fill="#0d47a1" text-anchor="middle">镜像层 1（只读）</text>

  <path d="M 410 258 L 410 194" fill="none" stroke="#1565C0" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#b1)"/>
  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#1565C0"/>
    </marker>
  </defs>
  <text x="425" y="228" font-size="11" fill="#1565C0">copy_up</text>

  <text x="500" y="342" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">第一次改才复制</text>
  <text x="375" y="366" font-size="11.5" fill="#555">① 从最新层往下找目标文件</text>
  <text x="375" y="384" font-size="11.5" fill="#555">② copy_up 到容器层</text>
  <text x="375" y="402" font-size="11.5" fill="#555">③ 改副本，容器看不到下层的原件</text>
  <text x="375" y="426" font-size="11.5" fill="#c62828">⚠️ 改权限 / 属主也会触发 copy_up</text>

  <!-- ============ Panel 3：删 ============ -->
  <rect x="670" y="110" width="290" height="330" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <rect x="670" y="110" width="290" height="30" rx="6" fill="#c62828"/>
  <text x="815" y="131" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">③ 删文件</text>

  <rect x="690" y="156" width="250" height="38" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.8"/>
  <text x="815" y="179" font-size="12" font-weight="bold" fill="#b71c1c" text-anchor="middle">容器层 · whiteout 遮罩标记</text>

  <rect x="690" y="200" width="250" height="36" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="815" y="222" font-size="11.5" fill="#0d47a1" text-anchor="middle">镜像层 3（只读）</text>
  <rect x="690" y="240" width="250" height="36" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="815" y="262" font-size="11.5" fill="#b71c1c" text-anchor="middle">镜像层 2 · 大文件还在（占着空间）</text>
  <rect x="690" y="280" width="250" height="36" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="815" y="302" font-size="11.5" fill="#0d47a1" text-anchor="middle">镜像层 1（只读）</text>

  <line x1="705" y1="258" x2="925" y2="258" stroke="#c62828" stroke-width="2"/>
  <path d="M 815 194 L 815 234" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#r1)"/>
  <defs>
    <marker id="r1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#c62828"/>
    </marker>
  </defs>

  <text x="815" y="342" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">删 = 遮住，不是抹掉</text>
  <text x="690" y="366" font-size="11.5" fill="#555">下层文件一个字节都没少，</text>
  <text x="690" y="384" font-size="11.5" fill="#555">只是在上层放了个"看不见"标记。</text>
  <text x="690" y="408" font-size="11.5" fill="#c62828">→ 所以 RUN rm 之后，</text>
  <text x="690" y="426" font-size="11.5" fill="#c62828">镜像体积一点没变小。</text>

  <!-- ============ 结论条 ============ -->
  <rect x="40" y="458" width="920" height="52" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2"/>
  <text x="60" y="480" font-size="12.5" font-weight="bold" fill="#283593">记住这三张图，就能回答两个高频疑问：</text>
  <text x="60" y="500" font-size="12" fill="#333">①「容器为什么这么轻？」—— 没写东西时，可写层几乎是空的，只读层大家共用一份。</text>
  <text x="60" y="518" font-size="12" fill="#333">②「删了文件镜像为什么没小？」—— 删除只是加了一层遮罩，被删的内容仍在下层算体积。正解是多阶段构建（课 6）。</text>

  <text x="40" y="546" font-size="11" fill="#78909c">注：上图为经典存储驱动（overlay2）的概念模型。Docker Engine 29.0 起新装默认改用 containerd image store（snapshotters），层的物理存放方式变了，但分层与 CoW 的概念一致。</text>
  <text x="40" y="566" font-size="11" fill="#78909c">机制依据：Docker 官方 Storage drivers 文档 · The copy-on-write (CoW) strategy（核查于 2026-09）。</text>
</svg>
