<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#fafafa"/>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#1565C0">镜像与容器：模板与实例</text>
  <text x="40" y="62" font-size="12.5" fill="#555">镜像是一摞只读层，容器 = 镜像 + 顶部一层可写层。一个镜像可以同时被多个容器共享，各自的可写层互不干扰。</text>

  <!-- ============ 标题行 ============ -->
  <rect x="60" y="86" width="200" height="28" rx="4" fill="#1565C0"/>
  <text x="160" y="105" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">镜像（只读模板）</text>
  <rect x="520" y="86" width="320" height="28" rx="4" fill="#2e7d32"/>
  <text x="680" y="105" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">容器（运行中的实例）</text>

  <!-- ============ 镜像 ============ -->
  <rect x="60" y="130" width="200" height="180" rx="6" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="160" y="156" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle">nginx:alpine</text>
  <rect x="76" y="168" width="168" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="160" y="185" font-size="12" fill="#0d47a1" text-anchor="middle">层 3 · nginx 本体</text>
  <text x="160" y="200" font-size="10" fill="#1565C0" text-anchor="middle">只读</text>
  <rect x="76" y="214" width="168" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="160" y="231" font-size="12" fill="#0d47a1" text-anchor="middle">层 2 · 依赖库</text>
  <text x="160" y="246" font-size="10" fill="#1565C0" text-anchor="middle">只读</text>
  <rect x="76" y="260" width="168" height="40" rx="4" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.2"/>
  <text x="160" y="277" font-size="12" fill="#0d47a1" text-anchor="middle">层 1 · alpine 基础</text>
  <text x="160" y="292" font-size="10" fill="#1565C0" text-anchor="middle">只读</text>

  <text x="160" y="336" font-size="11" fill="#78909c" text-anchor="middle">存于本地镜像缓存，可被复用</text>

  <!-- ============ 容器 1 ============ -->
  <rect x="520" y="130" width="320" height="110" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="536" y="152" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="start">容器 web1</text>
  <rect x="536" y="162" width="288" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="680" y="182" font-size="11.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">容器层（可写）· 每个容器独有</text>
  <rect x="536" y="198" width="288" height="32" rx="4" fill="none" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="680" y="218" font-size="11.5" fill="#607d8b" text-anchor="middle">↑ 共享镜像的 3 个只读层（只读，不复制）</text>

  <!-- ============ 容器 2 ============ -->
  <rect x="520" y="256" width="320" height="110" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="536" y="278" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="start">容器 web2</text>
  <rect x="536" y="288" width="288" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="680" y="308" font-size="11.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">容器层（可写）· 每个容器独有</text>
  <rect x="536" y="324" width="288" height="32" rx="4" fill="none" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="680" y="344" font-size="11.5" fill="#607d8b" text-anchor="middle">↑ 共享镜像的 3 个只读层（只读，不复制）</text>

  <!-- ============ 容器 3 ============ -->
  <rect x="520" y="382" width="320" height="110" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="536" y="404" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="start">容器 web3</text>
  <rect x="536" y="414" width="288" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="680" y="434" font-size="11.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">容器层（可写）· 每个容器独有</text>
  <rect x="536" y="450" width="288" height="32" rx="4" fill="none" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="680" y="470" font-size="11.5" fill="#607d8b" text-anchor="middle">↑ 共享镜像的 3 个只读层（只读，不复制）</text>

  <!-- ============ 共享箭头 ============ -->
  <path d="M 262 220 C 350 220 400 216 532 216" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow1)"/>
  <path d="M 262 250 C 350 250 400 340 532 340" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow1)"/>
  <path d="M 262 280 C 350 280 400 466 532 466" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow1)"/>
  <defs>
    <marker id="arrow1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#1565C0"/>
    </marker>
  </defs>

  <text x="400" y="336" font-size="11" fill="#1565C0" text-anchor="middle">共享 · 不复制</text>

  <!-- ============ 结论条 ============ -->
  <rect x="40" y="508" width="820" height="40" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="526" font-size="12.5" font-weight="bold" fill="#333">一句话：</text>
  <text x="60" y="542" font-size="12.5" fill="#333">删掉容器，只删掉它自己的可写层；镜像原封不动 —— 这就是为什么"删了容器重新 run 一个"总能回到干净状态。</text>
</svg>
