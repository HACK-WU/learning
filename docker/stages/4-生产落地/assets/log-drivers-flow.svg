<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1000" height="580" fill="#fafafa"/>

  <text x="40" y="34" font-size="20" font-weight="bold" fill="#1565C0">容器的日志，最后落到哪去了</text>
  <text x="40" y="55" font-size="12.5" fill="#555">`docker logs` 读的不是"容器里的文件"，而是<tspan font-weight="bold">日志驱动</tspan>写下的东西 —— 换一个驱动，落点和可读性就全变了。</text>

  <!-- ===== 容器 ===== -->
  <rect x="40" y="185" width="150" height="60" rx="5" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="115" y="208" font-size="12.5" font-weight="bold" fill="#0d47a1" text-anchor="middle">容器</text>
  <text x="115" y="228" font-size="10.5" fill="#0d47a1" text-anchor="middle">stdout + stderr</text>

  <path d="M 190 215 L 250 215" fill="none" stroke="#1565C0" stroke-width="2" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#1565C0"/></marker>
  </defs>

  <!-- ===== 日志驱动 ===== -->
  <rect x="250" y="185" width="150" height="60" rx="5" fill="#fff8e1" stroke="#ef6c00" stroke-width="2"/>
  <text x="325" y="208" font-size="12.5" font-weight="bold" fill="#e65100" text-anchor="middle">日志驱动</text>
  <text x="325" y="228" font-size="10.5" fill="#e65100" text-anchor="middle">默认 json-file</text>

  <!-- ===== 分支连线 ===== -->
  <path d="M 400 215 L 430 215 L 430 116 L 458 116" fill="none" stroke="#78909c" stroke-width="1.5" marker-end="url(#ar2)"/>
  <path d="M 400 215 L 430 215 L 430 180 L 458 180" fill="none" stroke="#78909c" stroke-width="1.5" marker-end="url(#ar2)"/>
  <path d="M 400 215 L 430 215 L 430 244 L 458 244" fill="none" stroke="#78909c" stroke-width="1.5" marker-end="url(#ar2)"/>
  <path d="M 400 215 L 430 215 L 430 308 L 458 308" fill="none" stroke="#78909c" stroke-width="1.5" marker-end="url(#ar2)"/>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#78909c"/></marker>
  </defs>

  <!-- ===== 行 1：json-file / local ===== -->
  <rect x="460" y="90" width="500" height="52" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="476" y="112" font-size="11.5" font-weight="bold" fill="#1b5e20">json-file　/　local</text>
  <text x="476" y="131" font-size="10.5" fill="#1b5e20">写在宿主机 Docker 数据目录下的文件里（一个容器一个文件）</text>
  <rect x="770" y="102" width="176" height="28" rx="4" fill="#2e7d32"/>
  <text x="858" y="121" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ docker logs 可读</text>

  <!-- ===== 行 2：journald ===== -->
  <rect x="460" y="154" width="500" height="52" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="476" y="176" font-size="11.5" font-weight="bold" fill="#1b5e20">journald</text>
  <text x="476" y="195" font-size="10.5" fill="#1b5e20">写进宿主机的 systemd journal（宿主机上需运行 journald）</text>
  <rect x="770" y="166" width="176" height="28" rx="4" fill="#2e7d32"/>
  <text x="858" y="185" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ docker logs 可读</text>

  <!-- ===== 行 3：远端 ===== -->
  <rect x="460" y="218" width="500" height="52" rx="4" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.3"/>
  <text x="476" y="240" font-size="11.5" font-weight="bold" fill="#e65100">fluentd / gelf / awslogs / splunk / gcplogs / etwlogs</text>
  <text x="476" y="259" font-size="10.5" fill="#e65100">发往远端日志服务 —— 本地默认不留（但见下方 dual logging）</text>
  <rect x="770" y="230" width="176" height="28" rx="4" fill="#ef6c00"/>
  <text x="858" y="249" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">⚠️ 靠缓存才可读</text>

  <!-- ===== 行 4：none ===== -->
  <rect x="460" y="282" width="500" height="52" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.3"/>
  <text x="476" y="304" font-size="11.5" font-weight="bold" fill="#b71c1c">none</text>
  <text x="476" y="323" font-size="10.5" fill="#b71c1c">不收集任何日志 —— 容器删了就什么都没留下</text>
  <rect x="770" y="294" width="176" height="28" rx="4" fill="#c62828"/>
  <text x="858" y="313" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">❌ docker logs 读不到</text>

  <!-- ===== dual logging ===== -->
  <rect x="40" y="356" width="920" height="112" rx="6" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.3"/>
  <text x="60" y="382" font-size="13" font-weight="bold" fill="#0d47a1">💡 dual logging：远端驱动下 `docker logs` 为什么通常还能用</text>
  <text x="60" y="404" font-size="11.5" fill="#333">官方原话：「Docker Engine <tspan font-weight="bold">automatically enables dual logging if the configured logging driver doesn't support reading logs</tspan>。」</text>
  <text x="60" y="424" font-size="11.5" fill="#333">它用 <tspan font-weight="bold">local 驱动</tspan>在宿主机上建一份「读缓存」：默认<tspan font-weight="bold">开启轮转</tspan>，每容器最多 <tspan font-weight="bold">5 个文件 × 20MB</tspan>（压缩前）。用 `cache-` 前缀的选项调整。</text>
  <text x="60" y="444" font-size="11.5" fill="#333">⚠️ 缓存不是可靠的日志源：官方列出三条限制 —— ①远端网络有问题时<tspan font-weight="bold">本地缓存也不写</tspan>；②写入失败<tspan font-weight="bold">不重试</tspan>；</text>
  <text x="60" y="462" font-size="11.5" fill="#333">　 ③默认配置下<tspan font-weight="bold">可能丢日志</tspan>（用了环形缓冲区以避免阻塞容器的 stdio）。远端服务才是权威来源。</text>

  <!-- ===== 底部：默认驱动的风险 ===== -->
  <rect x="40" y="484" width="920" height="76" rx="6" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.2"/>
  <text x="60" y="508" font-size="12.5" font-weight="bold" fill="#e65100">⚠️ 默认的 json-file 默认「不做轮转」</text>
  <text x="60" y="530" font-size="11.5" fill="#333">官方 Tip：「By default, <tspan font-weight="bold">no log-rotation is performed</tspan>. As a result, log-files stored by the default json-file logging driver</text>
  <text x="60" y="548" font-size="11.5" fill="#333">can cause a significant amount of disk space to be used... which can <tspan font-weight="bold">lead to disk space exhaustion</tspan>.」→ 官方推荐改用 <tspan font-weight="bold">local</tspan> 驱动。</text>
</svg>
