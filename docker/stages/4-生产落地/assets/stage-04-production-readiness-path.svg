<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1180" height="520" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="590" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#212121">阶段 4 · 生产落地 路径图</text>
  <text x="590" y="62" text-anchor="middle" font-size="13" fill="#78909c">让它稳稳地跑：给 order-service 设边界、可观测、守安全，串成一条可回滚的交付流水线</text>

  <!-- 课 10 卡片 -->
  <g>
    <rect x="35" y="110" width="250" height="190" rx="10" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
    <rect x="35" y="110" width="250" height="36" rx="10" fill="#1565C0"/>
    <rect x="35" y="128" width="250" height="18" fill="#1565C0"/>
    <text x="160" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">第 10 课 · 资源限制与进程管理</text>
    <text x="55" y="176" font-size="12" fill="#333">· cgroups 资源限制</text>
    <text x="55" y="200" font-size="12" fill="#333">· 重启策略与自愈</text>
    <text x="55" y="224" font-size="12" fill="#333">· 优雅停止与 PID 1</text>
    <text x="265" y="286" text-anchor="end" font-size="14" font-weight="700" fill="#1565C0">①</text>
  </g>

  <!-- 课 11 卡片 -->
  <g>
    <rect x="335" y="110" width="250" height="190" rx="10" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
    <rect x="335" y="110" width="250" height="36" rx="10" fill="#1565C0"/>
    <rect x="335" y="128" width="250" height="18" fill="#1565C0"/>
    <text x="460" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">第 11 课 · 日志与可观测性</text>
    <text x="355" y="176" font-size="12" fill="#333">· 日志驱动与日志膨胀</text>
    <text x="355" y="200" font-size="12" fill="#333">· 健康检查与状态观测</text>
    <text x="355" y="224" font-size="12" fill="#333">· 容器指标与资源观测</text>
    <text x="565" y="286" text-anchor="end" font-size="14" font-weight="700" fill="#1565C0">②</text>
  </g>

  <!-- 课 12 卡片 -->
  <g>
    <rect x="635" y="110" width="250" height="190" rx="10" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
    <rect x="635" y="110" width="250" height="36" rx="10" fill="#1565C0"/>
    <rect x="635" y="128" width="250" height="18" fill="#1565C0"/>
    <text x="760" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">第 12 课 · 容器安全边界</text>
    <text x="655" y="176" font-size="12" fill="#333">· 容器里的 root 是谁</text>
    <text x="655" y="200" font-size="12" fill="#333">· 能力与系统调用收敛</text>
    <text x="655" y="224" font-size="12" fill="#333">· 镜像供应链与漏洞</text>
    <text x="865" y="286" text-anchor="end" font-size="14" font-weight="700" fill="#1565C0">③</text>
  </g>

  <!-- 课 13 卡片 -->
  <g>
    <rect x="935" y="110" width="210" height="190" rx="10" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
    <rect x="935" y="110" width="210" height="36" rx="10" fill="#1565C0"/>
    <rect x="935" y="128" width="210" height="18" fill="#1565C0"/>
    <text x="1040" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">第 13 课 · CI/CD 与交付流水线</text>
    <text x="955" y="176" font-size="12" fill="#333">· 镜像仓库与推送流程</text>
    <text x="955" y="200" font-size="12" fill="#333">· CI 中的构建与缓存</text>
    <text x="955" y="224" font-size="12" fill="#333">· 部署与回滚</text>
    <text x="1125" y="286" text-anchor="end" font-size="14" font-weight="700" fill="#1565C0">④</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565C0"/>
    </marker>
    <marker id="darrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e65100"/>
    </marker>
  </defs>

  <!-- 主链箭头 -->
  <line x1="285" y1="205" x2="329" y2="205" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="585" y1="205" x2="629" y2="205" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="885" y1="205" x2="929" y2="205" stroke="#1565C0" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 虚线依赖：课11 资源观测依赖课10 cgroups -->
  <line x1="400" y1="300" x2="400" y2="350" stroke="#e65100" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="400" y1="350" x2="220" y2="350" stroke="#e65100" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="220" y1="350" x2="220" y2="304" stroke="#e65100" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#darrow)"/>
  <text x="310" y="343" text-anchor="middle" font-size="11" fill="#e65100">课11 观测资源依赖课10 cgroups 概念</text>

  <!-- 虚线依赖：课13 部署回滚用健康检查依赖课11 -->
  <line x1="460" y1="305" x2="460" y2="430" stroke="#e65100" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="460" y1="430" x2="1010" y2="430" stroke="#e65100" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="1010" y1="430" x2="1010" y2="370" stroke="#e65100" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#darrow)"/>
  <text x="735" y="423" text-anchor="middle" font-size="11" fill="#e65100">课13 用健康检查作发布闸门依赖课11</text>

  <!-- 阶段终点 -->
  <text x="1080" y="345" font-size="12" fill="#78909c" text-anchor="middle">→ 阶段 5 · 成本核算</text>

  <!-- 底部说明 -->
  <text x="590" y="505" text-anchor="middle" font-size="11" fill="#78909c">主链按学习顺序：先设边界能自愈（课10）→ 再可观测（课11）→ 转安全（课12）→ 最后串成可回滚的交付流水线（课13）。虚线为阶段内知识点依赖。</text>
</svg>
