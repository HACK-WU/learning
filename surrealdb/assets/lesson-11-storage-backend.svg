<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 780" width="1080" height="780" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569"/>
    </marker>
    <linearGradient id="ghead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1080" height="780" fill="#f8fafc"/>
  <rect x="0" y="0" width="1080" height="62" fill="url(#ghead)"/>
  <text x="26" y="26" fill="#f1f5f9" font-size="19" font-weight="700">存储后端选型决策树</text>
  <text x="26" y="48" fill="#94a3b8" font-size="12.5">SurrealDB 3.2.4 本机实测结论 · 2026-09-03</text>

  <!-- 起点 -->
  <rect x="400" y="86" width="280" height="52" rx="9" fill="#0f172a" filter="url(#sh)"/>
  <text x="540" y="108" fill="#f8fafc" font-size="14.5" font-weight="700" text-anchor="middle">surreal start &lt;PATH&gt;</text>
  <text x="540" y="128" fill="#94a3b8" font-size="12" text-anchor="middle">PATH 的 scheme 决定一切</text>

  <line x1="540" y1="138" x2="540" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 第一问 -->
  <rect x="330" y="176" width="420" height="46" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#sh)"/>
  <text x="540" y="197" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">数据需要持久化吗？</text>
  <text x="540" y="214" fill="#64748b" font-size="11.5" text-anchor="middle">进程重启后还要不要这份数据</text>

  <!-- 否 -> memory -->
  <line x1="330" y1="199" x2="150" y2="199" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="238" y="190" fill="#b91c1c" font-size="12.5" font-weight="700" text-anchor="middle">否</text>
  <rect x="30" y="168" width="112" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
  <text x="86" y="190" fill="#b91c1c" font-size="13.5" font-weight="700" text-anchor="middle">memory</text>
  <text x="86" y="208" fill="#7f1d1d" font-size="10.5" text-anchor="middle">重启即清空</text>
  <text x="86" y="222" fill="#7f1d1d" font-size="10.5" text-anchor="middle">测试 / 缓存</text>

  <!-- 是 -->
  <line x1="540" y1="222" x2="540" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="560" y="244" fill="#15803d" font-size="12.5" font-weight="700">是</text>

  <!-- 第二问 -->
  <rect x="330" y="262" width="420" height="46" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#sh)"/>
  <text x="540" y="283" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">需要多节点横向扩展吗？</text>
  <text x="540" y="300" fill="#64748b" font-size="11.5" text-anchor="middle">单机的磁盘 / 内存是否够用</text>

  <line x1="750" y1="285" x2="960" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="856" y="276" fill="#b45309" font-size="12.5" font-weight="700" text-anchor="middle">是</text>
  <rect x="964" y="256" width="102" height="58" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.8"/>
  <text x="1015" y="278" fill="#b45309" font-size="13.5" font-weight="700" text-anchor="middle">tikv://</text>
  <text x="1015" y="296" fill="#78350f" font-size="10.5" text-anchor="middle">需 PD 集群</text>
  <text x="1015" y="309" fill="#78350f" font-size="10.5" text-anchor="middle">本机未实测</text>

  <line x1="540" y1="308" x2="540" y2="344" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="560" y="330" fill="#15803d" font-size="12.5" font-weight="700">否（单机）</text>

  <!-- 第三问 -->
  <rect x="290" y="348" width="500" height="46" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#sh)"/>
  <text x="540" y="369" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">需要「时间旅行」（查历史版本）吗？</text>
  <text x="540" y="386" fill="#64748b" font-size="11.5" text-anchor="middle">审计追溯 / 误操作回滚</text>

  <line x1="290" y1="371" x2="120" y2="371" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="204" y="362" fill="#6d28d9" font-size="12.5" font-weight="700" text-anchor="middle">需要</text>
  <rect x="24" y="342" width="90" height="58" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.8"/>
  <text x="69" y="364" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="middle">surrealkv</text>
  <text x="69" y="382" fill="#4c1d95" font-size="10.5" text-anchor="middle">?versioned</text>
  <text x="69" y="395" fill="#4c1d95" font-size="10.5" text-anchor="middle">=true</text>

  <line x1="540" y1="394" x2="540" y2="428" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="556" y="414" fill="#15803d" font-size="12.5" font-weight="700">不需要 → 两者皆可，见下方对照</text>

  <!-- 对照表 -->
  <rect x="60" y="436" width="960" height="196" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#sh)"/>
  <text x="80" y="462" fill="#0f172a" font-size="14.5" font-weight="700">rocksdb:// 与 surrealkv:// 实测对照</text>

  <line x1="60" y1="474" x2="1020" y2="474" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="86" y="497" fill="#475569" font-size="12" font-weight="700">维度</text>
  <text x="360" y="497" fill="#0369a1" font-size="12" font-weight="700">rocksdb://</text>
  <text x="700" y="497" fill="#7c3aed" font-size="12" font-weight="700">surrealkv://</text>
  <line x1="60" y1="506" x2="1020" y2="506" stroke="#e2e8f0" stroke-width="1.4"/>

  <text x="86" y="527" fill="#334155" font-size="11.8">成熟度 / 生态</text>
  <text x="360" y="527" fill="#334155" font-size="11.8">久经考验，工业标准</text>
  <text x="700" y="527" fill="#334155" font-size="11.8">自研，较新</text>

  <text x="86" y="549" fill="#334155" font-size="11.8">时间旅行</text>
  <text x="360" y="549" fill="#b91c1c" font-size="11.8" font-weight="600">不支持（报 does not support versioned queries）</text>
  <text x="700" y="549" fill="#15803d" font-size="11.8" font-weight="600">支持（?versioned=true）</text>

  <text x="86" y="571" fill="#334155" font-size="11.8">持久化与崩溃恢复</text>
  <text x="360" y="571" fill="#334155" font-size="11.8">SIGTERM 与 kill -9 后数据均在</text>
  <text x="700" y="571" fill="#334155" font-size="11.8">SIGTERM 与 kill -9 后数据均在</text>

  <text x="86" y="593" fill="#334155" font-size="11.8">多进程共享目录</text>
  <text x="360" y="593" fill="#b45309" font-size="11.8">不可（LOCK 文件独占，第二实例起不来）</text>
  <text x="700" y="593" fill="#b45309" font-size="11.8">同左</text>

  <text x="86" y="615" fill="#334155" font-size="11.8">启动日志特征</text>
  <text x="360" y="615" fill="#334155" font-size="11.8">打印 Background thread / open files 等</text>
  <text x="700" y="615" fill="#334155" font-size="11.8">打印 Versioning enabled: true/false</text>

  <line x1="60" y1="627" x2="1020" y2="627" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="540" y="646" fill="#0f172a" font-size="12.2" font-weight="700" text-anchor="middle">选择建议：默认 rocksdb（稳）；要时间旅行才选 surrealkv；两者不可混用，切换 = 导出再导入</text>

  <!-- 已移除 -->
  <rect x="60" y="660" width="960" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
  <text x="80" y="686" fill="#b91c1c" font-size="14" font-weight="700">⚠️ 3.2.4 已移除的后端（实测确认，照抄旧教程会直接失败）</text>

  <rect x="84" y="700" width="290" height="42" rx="7" fill="#fff" stroke="#fecaca" stroke-width="1.4"/>
  <text x="229" y="719" fill="#b91c1c" font-size="12.2" font-weight="700" text-anchor="middle">file://　→　改用 rocksdb:// 或 surrealkv://</text>
  <text x="229" y="735" fill="#7f1d1d" font-size="10.8" text-anchor="middle">报错原话：The `file://` scheme is no longer supported</text>

  <rect x="394" y="700" width="290" height="42" rx="7" fill="#fff" stroke="#fecaca" stroke-width="1.4"/>
  <text x="539" y="719" fill="#b91c1c" font-size="12.2" font-weight="700" text-anchor="middle">fdb://（FoundationDB）　→　已移除</text>
  <text x="539" y="735" fill="#7f1d1d" font-size="10.8" text-anchor="middle">报错：Provide a valid database path parameter</text>

  <rect x="704" y="700" width="290" height="42" rx="7" fill="#fff" stroke="#fecaca" stroke-width="1.4"/>
  <text x="849" y="719" fill="#b91c1c" font-size="12.2" font-weight="700" text-anchor="middle">memory://path　→　memory 不接受路径</text>
  <text x="849" y="735" fill="#7f1d1d" font-size="10.8" text-anchor="middle">报错：Provide a valid database path parameter</text>
</svg>
