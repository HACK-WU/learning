<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>
  <text x="560" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">事务的真正陷阱：BEGIN 和 COMMIT 必须在【同一次请求】里</text>
  <text x="560" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">本机 3.2.4 实测——这是本课最容易踩、且报错信息极具误导性的坑</text>

  <!-- 左：错误做法 -->
  <rect x="40" y="76" width="510" height="330" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.8"/>
  <text x="285" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">❌ 错误做法：逐条发送</text>
  <text x="285" y="122" text-anchor="middle" font-size="11" fill="#b91c1c">（CLI 交互模式 / 多次 HTTP 请求就是这样）</text>

  <g font-family="monospace" font-size="11.5">
    <rect x="62" y="138" width="200" height="30" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="78" y="158" fill="#7f1d1d">请求1: BEGIN;</text>
    <rect x="62" y="176" width="200" height="30" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="78" y="196" fill="#7f1d1d">请求2: UPDATE ...</text>
    <rect x="62" y="214" width="200" height="30" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="78" y="234" fill="#7f1d1d">请求3: COMMIT;</text>
  </g>

  <text x="290" y="158" font-size="11.5" fill="#0f172a">→ 返回 <tspan font-family="monospace">NONE</tspan></text>
  <text x="290" y="196" font-size="11.5" fill="#0f172a">→ <tspan fill="#b91c1c" font-weight="bold">立即生效</tspan>（没在事务里）</text>
  <text x="290" y="234" font-size="11.5" fill="#b91c1c" font-weight="bold">→ Cannot COMMIT without</text>
  <text x="290" y="250" font-size="11.5" fill="#b91c1c" font-weight="bold">   starting a transaction</text>

  <line x1="62" y1="272" x2="528" y2="272" stroke="#fca5a5" stroke-dasharray="4"/>

  <text x="62" y="296" font-size="12" fill="#7f1d1d" font-weight="bold">实测后果（最危险的部分）：</text>
  <g font-size="11.5" fill="#334155">
    <text x="62" y="318">1. BEGIN 返回 NONE，<tspan font-weight="bold" fill="#b91c1c">事务根本没开启</tspan></text>
    <text x="62" y="338">2. 中间的 UPDATE <tspan font-weight="bold" fill="#b91c1c">已经直接落库</tspan></text>
    <text x="62" y="358">3. COMMIT 才报错 —— 但数据已经改了</text>
    <text x="62" y="378">4. CANCEL 同样无效，<tspan font-weight="bold" fill="#b91c1c">回滚不了</tspan></text>
  </g>

  <rect x="62" y="390" width="466" height="10" rx="3" fill="#fecaca"/>

  <!-- 右：正确做法 -->
  <rect x="570" y="76" width="510" height="330" rx="10" fill="#ecfdf5" stroke="#22c55e" stroke-width="1.8"/>
  <text x="825" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">✅ 正确做法：一次请求发完</text>
  <text x="825" y="122" text-anchor="middle" font-size="11" fill="#047857">（把整段写成 .surql 文件，或用 SDK 一次 query）</text>

  <rect x="592" y="138" width="466" height="118" rx="6" fill="#ffffff" stroke="#86efac"/>
  <g font-family="monospace" font-size="11.5" fill="#065f46">
    <text x="608" y="160">BEGIN TRANSACTION;</text>
    <text x="608" y="180">UPDATE account:a SET balance -= 1000;</text>
    <text x="608" y="200">UPDATE account:b SET balance += 1000;</text>
    <text x="608" y="220">COMMIT TRANSACTION;</text>
  </g>
  <text x="608" y="242" font-size="11" fill="#047857">↑ 四条语句在【同一个文件 / 同一次 query】里</text>

  <text x="592" y="290" font-size="12" fill="#065f46" font-weight="bold">实测结果（全部通过）：</text>
  <g font-size="11.5" fill="#334155">
    <text x="592" y="312">· 提交成功：2000/500 → <tspan font-weight="bold" fill="#047857">1000/1500</tspan></text>
    <text x="592" y="332">· CANCEL 生效：改动被丢弃，<tspan font-weight="bold" fill="#047857">回到 1000/500</tspan></text>
    <text x="592" y="352">· THROW 中止：报 <tspan font-family="monospace">余额不足</tspan>，<tspan font-weight="bold" fill="#047857">回滚</tspan></text>
    <text x="592" y="372">· 语句失败 → 整体回滚（但有前提，见下）</text>
  </g>

  <rect x="592" y="384" width="466" height="14" rx="3" fill="#bbf7d0"/>

  <!-- 底部：隐形的坑 -->
  <rect x="40" y="424" width="1040" height="128" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="62" y="450" font-size="15" font-weight="bold" fill="#78350f">⚠️ 隐形的坑：事务里"失败"的语句可能根本不算失败</text>

  <g font-size="11.5" fill="#334155">
    <text x="62" y="476">实测：在事务里写 <tspan font-family="monospace">UPDATE account:definitely_not_exist_xxx SET x = 1;</tspan> 然后 COMMIT</text>
    <text x="62" y="498">结果：<tspan font-weight="bold" fill="#b91c1c">事务"成功"提交了</tspan>，前一条 <tspan font-family="monospace">UPDATE account:a SET balance = 1</tspan> <tspan font-weight="bold" fill="#b91c1c">生效了，没有回滚</tspan></text>
  </g>

  <rect x="62" y="510" width="996" height="30" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="78" y="530" font-size="11.5" fill="#7f1d1d"><tspan font-weight="bold">原因</tspan>：UPDATE 不存在的记录【不报错】，返回 <tspan font-family="monospace">[]</tspan>（回顾知识点 4.1）——所以事务里没有"失败"，自然不触发回滚</text>

  <!-- 四种结束方式 -->
  <rect x="40" y="570" width="1040" height="114" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="62" y="594" font-size="15" font-weight="bold" fill="#0f172a">事务的四种结束方式（实测）</text>

  <g font-size="11.5">
    <rect x="62" y="606" width="240" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="182" y="626" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#047857">COMMIT TRANSACTION</text>
    <text x="182" y="646" text-anchor="middle" font-size="11" fill="#475569">提交，全部生效</text>

    <rect x="318" y="606" width="240" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="438" y="626" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#b45309">CANCEL TRANSACTION</text>
    <text x="438" y="646" text-anchor="middle" font-size="11" fill="#475569">显式取消，全部丢弃</text>

    <rect x="574" y="606" width="240" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="694" y="626" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#7c3aed">THROW "消息"</text>
    <text x="694" y="646" text-anchor="middle" font-size="11" fill="#475569">条件中止（IF 内用）</text>

    <rect x="830" y="606" width="228" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="944" y="626" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#dc2626">语句报错</text>
    <text x="944" y="646" text-anchor="middle" font-size="11" fill="#475569">自动回滚（真报错才触发）</text>
  </g>
</svg>
