<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="920" height="560" fill="#fbfaf7"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#1f2d3d">RELATE 建边：边是一条真正的记录（3.2.4 实测）</text>

  <!-- 左：节点与边的图 -->
  <g transform="translate(40,80)">
    <text x="0" y="0" font-size="15" font-weight="600" fill="#2c3e50">图上：节点与边</text>

    <ellipse cx="60" cy="70" rx="52" ry="28" fill="#d6eaf8" stroke="#2e86c1" stroke-width="2"/>
    <text x="60" y="76" font-size="14" text-anchor="middle" fill="#154360">person:alice</text>

    <ellipse cx="60" cy="200" rx="52" ry="28" fill="#d6eaf8" stroke="#2e86c1" stroke-width="2"/>
    <text x="60" y="206" font-size="14" text-anchor="middle" fill="#154360">person:bob</text>

    <ellipse cx="250" cy="135" rx="52" ry="28" fill="#d6eaf8" stroke="#2e86c1" stroke-width="2"/>
    <text x="250" y="141" font-size="14" text-anchor="middle" fill="#154360">person:carol</text>

    <path d="M 108 84 L 202 126" stroke="#7d6608" stroke-width="2.4" fill="none" marker-end="url(#arw)"/>
    <path d="M 108 190 L 202 152" stroke="#7d6608" stroke-width="2.4" fill="none" marker-end="url(#arw)"/>

    <rect x="116" y="96" width="118" height="46" rx="6" fill="#fdf2d9" stroke="#b7950b" stroke-width="1.6"/>
    <text x="175" y="114" font-size="12" text-anchor="middle" fill="#7d6608">knows:9ep1…</text>
    <text x="175" y="132" font-size="11" text-anchor="middle" fill="#7d6608">strength: 0.95</text>

    <rect x="116" y="158" width="118" height="34" rx="6" fill="#fdf2d9" stroke="#b7950b" stroke-width="1.6"/>
    <text x="175" y="180" font-size="12" text-anchor="middle" fill="#7d6608">knows:b2c（自定义 ID）</text>

    <text x="0" y="270" font-size="13" fill="#34495e">• 边有 ID、能带属性、能被 UPDATE</text>
    <text x="0" y="292" font-size="13" fill="#34495e">• 自环与反向边都允许（反向 = 另一条独立边）</text>
    <text x="0" y="314" font-size="13" fill="#c0392b">• 未指定 ID 时边 ID 随机生成（如 9ep1j3ac3cfw…）</text>
  </g>

  <!-- 右上：in / out 反直觉 -->
  <g transform="translate(470,80)">
    <rect x="0" y="0" width="410" height="150" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="1.8"/>
    <text x="16" y="26" font-size="15" font-weight="600" fill="#922b21">⚠️ 最反直觉的一点：in / out 是反的</text>
    <text x="16" y="54" font-size="13" fill="#5d1a15">RELATE alice-&gt;knows-&gt;carol 建出的边：</text>
    <text x="16" y="78" font-size="13" fill="#1f2d3d" font-family="Consolas,monospace">in  = person:alice   ← 起点</text>
    <text x="16" y="98" font-size="13" fill="#1f2d3d" font-family="Consolas,monospace">out = person:carol   ← 终点</text>
    <text x="16" y="124" font-size="12" fill="#922b21">直觉会以为 in=指向自己、out=从自己出发，正好相反</text>
    <text x="16" y="142" font-size="12" fill="#922b21">（记忆法：箭头"射入"边的那一端记 in，射出记 out）</text>
  </g>

  <!-- 右下：静默失败 -->
  <g transform="translate(470,250)">
    <rect x="0" y="0" width="410" height="130" rx="8" fill="#fff8e1" stroke="#f39c12" stroke-width="1.8"/>
    <text x="16" y="26" font-size="15" font-weight="600" fill="#7e5109">⚠️ 写错方向 = 静默改不动（实测）</text>
    <text x="16" y="52" font-size="12" fill="#5d4037" font-family="Consolas,monospace">UPDATE knows SET strength=0.95</text>
    <text x="16" y="72" font-size="12" fill="#5d4037" font-family="Consolas,monospace">WHERE out=alice AND in=carol;  →  []</text>
    <text x="16" y="98" font-size="12" fill="#c0392b">返回 []，不报错（课 4 结论 7 再次生效）</text>
    <text x="16" y="118" font-size="12" fill="#5d4037">必须检查返回数组长度，否则以为改成功了</text>
  </g>

  <!-- 底部：三种约束 -->
  <g transform="translate(40,430)">
    <text x="0" y="0" font-size="15" font-weight="600" fill="#2c3e50">给边加约束的三道闸门（TYPE RELATION，全部实测）</text>
    <rect x="0" y="14" width="280" height="70" rx="7" fill="#e8f6f3" stroke="#16a085" stroke-width="1.6"/>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#0e6251">① 端点类型 IN / OUT</text>
    <text x="14" y="56" font-size="11.5" fill="#0b5345" font-family="Consolas,monospace">Expected record&lt;post&gt;</text>
    <text x="14" y="74" font-size="11.5" fill="#0b5345" font-family="Consolas,monospace">but found person:bob</text>

    <rect x="300" y="14" width="290" height="70" rx="7" fill="#e8f6f3" stroke="#16a085" stroke-width="1.6"/>
    <text x="314" y="36" font-size="13" font-weight="600" fill="#0e6251">② UNIQUE 防重复边</text>
    <text x="314" y="56" font-size="11.5" fill="#0b5345" font-family="Consolas,monospace">index already contains</text>
    <text x="314" y="74" font-size="11.5" fill="#0b5345" font-family="Consolas,monospace">[person:alice, post:p1]</text>

    <rect x="610" y="14" width="270" height="70" rx="7" fill="#e8f6f3" stroke="#16a085" stroke-width="1.6"/>
    <text x="624" y="36" font-size="13" font-weight="600" fill="#0e6251">③ in / out 字段是自带的</text>
    <text x="624" y="56" font-size="11.5" fill="#0b5345" font-family="Consolas,monospace">DEFINE FIELD in ON likes</text>
    <text x="624" y="74" font-size="11.5" fill="#0b5345" font-family="Consolas,monospace">→ already exists</text>
  </g>

  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7d6608"/>
    </marker>
  </defs>
</svg>
