<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1120" height="720" fill="#ffffff"/>
  <text x="560" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">一个应用，五个数据库：数据按「形状」被拆开</text>
  <text x="560" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">Polyglot Persistence（多语言持久化）—— 好用，但代价写在第二页</text>

  <!-- 应用层 -->
  <rect x="410" y="78" width="300" height="52" rx="8" fill="url(#app)"/>
  <text x="560" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">一个电商应用</text>
  <text x="560" y="120" text-anchor="middle" font-size="11.5" fill="#cbd5e1">同一条「商品」数据，要服务五种访问方式</text>

  <line x1="560" y1="130" x2="560" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
  <text x="572" y="150" font-size="11.5" fill="#475569">数据按「形状」分流</text>

  <!-- 五种形状 -->
  <g font-size="12.5">
    <rect x="40" y="162" width="200" height="62" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/>
    <text x="140" y="184" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">订单 / 库存</text>
    <text x="140" y="205" text-anchor="middle" fill="#1d4ed8">关系形状</text>
    <text x="140" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">强一致，要事务</text>

    <rect x="256" y="162" width="200" height="62" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.3"/>
    <text x="356" y="184" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">商品详情</text>
    <text x="356" y="205" text-anchor="middle" fill="#15803d">文档形状</text>
    <text x="356" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">字段灵活，嵌套深</text>

    <rect x="472" y="162" width="200" height="62" rx="6" fill="#fefce8" stroke="#facc15" stroke-width="1.3"/>
    <text x="572" y="184" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#713f12">买了又买</text>
    <text x="572" y="205" text-anchor="middle" fill="#a16207">图形状</text>
    <text x="572" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">多跳关系遍历</text>

    <rect x="688" y="162" width="200" height="62" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
    <text x="788" y="184" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f1d1d">搜索框</text>
    <text x="788" y="205" text-anchor="middle" fill="#b91c1c">全文形状</text>
    <text x="788" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">倒排索引 + 相关性</text>

    <rect x="904" y="162" width="176" height="62" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.3"/>
    <text x="992" y="184" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4c1d95">以图搜图</text>
    <text x="992" y="205" text-anchor="middle" fill="#7c3aed">向量形状</text>
    <text x="992" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">语义相似度</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.8" marker-end="url(#a1)">
    <line x1="140" y1="224" x2="140" y2="280"/>
    <line x1="356" y1="224" x2="356" y2="280"/>
    <line x1="572" y1="224" x2="572" y2="280"/>
    <line x1="788" y1="224" x2="788" y2="280"/>
    <line x1="992" y1="224" x2="992" y2="280"/>
  </g>

  <!-- 五个数据库 -->
  <g font-size="12.5">
    <rect x="40" y="284" width="200" height="58" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140" y="307" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">PostgreSQL</text>
    <text x="140" y="328" text-anchor="middle" font-size="11" fill="#475569">关系型数据库</text>

    <rect x="256" y="284" width="200" height="58" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="356" y="307" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">MongoDB</text>
    <text x="356" y="328" text-anchor="middle" font-size="11" fill="#475569">文档数据库</text>

    <rect x="472" y="284" width="200" height="58" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <text x="572" y="307" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#713f12">Neo4j</text>
    <text x="572" y="328" text-anchor="middle" font-size="11" fill="#475569">图数据库</text>

    <rect x="688" y="284" width="200" height="58" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="788" y="307" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f1d1d">Elasticsearch</text>
    <text x="788" y="328" text-anchor="middle" font-size="11" fill="#475569">搜索引擎</text>

    <rect x="904" y="284" width="176" height="58" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="992" y="307" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4c1d95">Qdrant / Milvus</text>
    <text x="992" y="328" text-anchor="middle" font-size="11" fill="#475569">向量库</text>
  </g>

  <!-- 同步链路 -->
  <line x1="140" y1="342" x2="992" y2="342" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <g fill="#dc2626">
    <circle cx="140" cy="342" r="4.5"/>
    <circle cx="356" cy="342" r="4.5"/>
    <circle cx="572" cy="342" r="4.5"/>
    <circle cx="788" cy="342" r="4.5"/>
    <circle cx="992" cy="342" r="4.5"/>
  </g>
  <rect x="700" y="352" width="284" height="24" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="716" y="369" font-size="11.5" fill="#b91c1c">↓ 一条「商品改价」，要跨 5 个系统同步</text>

  <line x1="216" y1="376" x2="216" y2="404" stroke="#dc2626" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="356" y1="376" x2="356" y2="404" stroke="#dc2626" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="572" y1="376" x2="572" y2="404" stroke="#dc2626" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="788" y1="376" x2="788" y2="404" stroke="#dc2626" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="992" y1="376" x2="992" y2="404" stroke="#dc2626" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 代价清单 -->
  <rect x="40" y="412" width="1040" height="228" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="62" y="440" font-size="16" font-weight="bold" fill="#78350f">代价清单：你换来了「每个形状都最优」，同时继承了五项债务</text>

  <g font-size="12.5" fill="#78350f">
    <rect x="62" y="458" width="480" height="50" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="78" y="479" font-weight="bold">① 五套运维</text>
    <text x="78" y="499" font-size="11.5" fill="#57534e">安装、配置、监控、升级、容量规划，各自一套。每加一个库，故障模式也加一种。</text>

    <rect x="562" y="458" width="496" height="50" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="578" y="479" font-weight="bold">② 五套权限与安全模型</text>
    <text x="578" y="499" font-size="11.5" fill="#57534e">「删除一个用户」这件事要跨 5 个库分别实现，漏一个就是合规事故。</text>

    <rect x="62" y="518" width="480" height="50" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="78" y="539" font-weight="bold">③ 五种备份与恢复策略</text>
    <text x="78" y="559" font-size="11.5" fill="#57534e">跨库的时间点恢复（PITR）几乎做不干净——五个快照很难对齐到同一瞬间。</text>

    <rect x="562" y="518" width="496" height="50" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="578" y="539" font-weight="bold">④ 跨库没有事务</text>
    <text x="578" y="559" font-size="11.5" fill="#57534e">ACID 事务不跨数据库。双写必然出现「A 成功、B 超时」的部分失败。</text>

    <rect x="62" y="578" width="996" height="50" rx="6" fill="#fee2e2" stroke="#f87171"/>
    <text x="78" y="599" font-weight="bold" fill="#7f1d1d">⑤ 「最终一致」退化成「最终不一致」</text>
    <text x="78" y="619" font-size="11.5" fill="#991b1b">派生数据（搜索索引、缓存、向量）靠异步管道同步。没有对账机制的话，漂移是静默的——仪表盘全绿，用户看到的是旧价格。</text>
  </g>

  <text x="62" y="668" font-size="12.5" fill="#78716c">注：这不是「拆库错了」。Netflix、LinkedIn 都在用这套模式。真正的问题是——你为「每个形状都最优」付出的运维与一致性成本，是否真的被业务需要。</text>
  <text x="62" y="690" font-size="12.5" fill="#78716c">SurrealDB 的赌注是：对 <tspan font-weight="bold">大多数应用</tspan>，这个交换不划算——「够好」的五种形状，胜过「最优」的五种运维。</text>
</svg>
