<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="880" height="300" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Git 学习路径 · 一次提交的一生</text>
  <text x="440" y="50" text-anchor="middle" font-size="11" fill="#5f6368">主角：一次 commit ｜ 冲突：历史既不能随便改，又必须能被改写 ｜ 收束：既能设计分支模型，也能救回任何误操作</text>

  <rect x="20" y="70" width="185" height="150" rx="8" fill="#e8f0fe" stroke="#1565C0" stroke-width="2"/>
  <rect x="20" y="70" width="185" height="30" rx="8" fill="#1565C0"/>
  <text x="112" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">阶段 1 · 地基与对象模型</text>
  <text x="112" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">一次提交的诞生</text>
  <text x="112" y="140" text-anchor="middle" font-size="10.5" fill="#37474f">· 分布式与三区模型</text>
  <text x="112" y="157" text-anchor="middle" font-size="10.5" fill="#37474f">· blob / tree / commit / tag</text>
  <text x="112" y="174" text-anchor="middle" font-size="10.5" fill="#37474f">· 内容寻址与历史图</text>
  <text x="112" y="199" text-anchor="middle" font-size="10.5" fill="#1565C0">课 1-3</text>

  <rect x="245" y="70" width="185" height="150" rx="8" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
  <rect x="245" y="70" width="185" height="30" rx="8" fill="#2E7D32"/>
  <text x="337" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">阶段 2 · 个人工作流</text>
  <text x="337" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">一个人的分身术</text>
  <text x="337" y="140" text-anchor="middle" font-size="10.5" fill="#37474f">· diff 三副面孔与撤销四连</text>
  <text x="337" y="157" text-anchor="middle" font-size="10.5" fill="#37474f">· 分支是指针不是副本</text>
  <text x="337" y="174" text-anchor="middle" font-size="10.5" fill="#37474f">· 快进 / 三方合并与冲突</text>
  <text x="337" y="199" text-anchor="middle" font-size="10.5" fill="#2E7D32">课 4-6</text>

  <rect x="470" y="70" width="185" height="150" rx="8" fill="#fff8e1" stroke="#EF6C00" stroke-width="2"/>
  <rect x="470" y="70" width="185" height="30" rx="8" fill="#EF6C00"/>
  <text x="562" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">阶段 3 · 协作与共享</text>
  <text x="562" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">众人手中的同一份历史</text>
  <text x="562" y="140" text-anchor="middle" font-size="10.5" fill="#37474f">· remote / fetch / pull / push</text>
  <text x="562" y="157" text-anchor="middle" font-size="10.5" fill="#37474f">· merge vs rebase 与黄金法则</text>
  <text x="562" y="174" text-anchor="middle" font-size="10.5" fill="#37474f">· 分支策略 / 提交规范 / 标签</text>
  <text x="562" y="199" text-anchor="middle" font-size="10.5" fill="#EF6C00">课 7-9</text>

  <rect x="695" y="70" width="165" height="150" rx="8" fill="#fce4ec" stroke="#C2185B" stroke-width="2"/>
  <rect x="695" y="70" width="165" height="30" rx="8" fill="#C2185B"/>
  <text x="777" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">阶段 4 · 排查救援</text>
  <text x="777" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">历史的追查与救援</text>
  <text x="777" y="140" text-anchor="middle" font-size="10.5" fill="#37474f">· bisect / blame / log -S</text>
  <text x="777" y="157" text-anchor="middle" font-size="10.5" fill="#37474f">· reflog 与救援矩阵</text>
  <text x="777" y="174" text-anchor="middle" font-size="10.5" fill="#37474f">· 仓库卫生 / 钩子 / Review</text>
  <text x="777" y="199" text-anchor="middle" font-size="10.5" fill="#C2185B">课 10-12</text>

  <path d="M205 145 L243 145" stroke="#5f6368" stroke-width="2"/>
  <polygon points="243,145 236,140 236,150" fill="#5f6368"/>
  <path d="M430 145 L468 145" stroke="#5f6368" stroke-width="2"/>
  <polygon points="468,145 461,140 461,150" fill="#5f6368"/>
  <path d="M655 145 L693 145" stroke="#5f6368" stroke-width="2"/>
  <polygon points="693,145 686,140 686,150" fill="#5f6368"/>

  <rect x="20" y="240" width="840" height="44" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="440" y="258" text-anchor="middle" font-size="11.5" fill="#37474f">收尾环节（课时讲完 ≠ 学完）：结课实战项目《团队 Git 工作流搭建与故障演练沙盘》→ 课程手册 → 实战经验 / 排障速查手册 / 场景解法库</text>
  <text x="440" y="275" text-anchor="middle" font-size="10.5" fill="#5f6368">实操环境：WSL Ubuntu 24.04 + Git 2.43.0（Windows 对照 2.53.0）｜ 远端用本地裸仓库模拟，无需托管平台账号</text>
</svg>
