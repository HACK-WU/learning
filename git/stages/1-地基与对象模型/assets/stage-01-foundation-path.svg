<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="260" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a237e">阶段 1 · 地基与对象模型</text>
  <text x="430" y="47" text-anchor="middle" font-size="11" fill="#5f6368">一次提交的诞生：从 git init 到亲手拆开 commit</text>

  <rect x="30" y="70" width="220" height="130" rx="8" fill="#e8f0fe" stroke="#1565C0" stroke-width="2"/>
  <rect x="30" y="70" width="220" height="28" rx="8" fill="#1565C0"/>
  <text x="140" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">课 1 · 版本控制与第一次提交</text>
  <text x="140" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">分布式 ≠ 有服务器</text>
  <text x="140" y="137" text-anchor="middle" font-size="10.5" fill="#37474f">三区模型：工作区/暂存区/版本库</text>
  <text x="140" y="156" text-anchor="middle" font-size="10.5" fill="#37474f">init / add / commit / status</text>
  <text x="140" y="183" text-anchor="middle" font-size="10.5" fill="#1565C0">感知层：先见一次完整提交</text>

  <rect x="320" y="70" width="220" height="130" rx="8" fill="#e8f0fe" stroke="#1565C0" stroke-width="2"/>
  <rect x="320" y="70" width="220" height="28" rx="8" fill="#1565C0"/>
  <text x="430" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">课 2 · Git 的对象数据库</text>
  <text x="430" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">blob / tree / commit / tag</text>
  <text x="430" y="137" text-anchor="middle" font-size="10.5" fill="#37474f">内容寻址与自动去重</text>
  <text x="430" y="156" text-anchor="middle" font-size="10.5" fill="#37474f">cat-file 亲手拆 commit</text>
  <text x="430" y="183" text-anchor="middle" font-size="10.5" fill="#1565C0">机制层：打开黑盒看内部</text>

  <rect x="610" y="70" width="220" height="130" rx="8" fill="#e8f0fe" stroke="#1565C0" stroke-width="2"/>
  <rect x="610" y="70" width="220" height="28" rx="8" fill="#1565C0"/>
  <text x="720" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">课 3 · 提交的身份与历史图</text>
  <text x="720" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">作者 / 提交者 / 时间戳 / 父指针</text>
  <text x="720" y="137" text-anchor="middle" font-size="10.5" fill="#37474f">历史是有向图与 log 视图</text>
  <text x="720" y="156" text-anchor="middle" font-size="10.5" fill="#37474f">config 三层与 .gitignore</text>
  <text x="720" y="183" text-anchor="middle" font-size="10.5" fill="#1565C0">定位层：知道自己在哪</text>

  <path d="M250 135 L318 135" stroke="#5f6368" stroke-width="2"/>
  <polygon points="318,135 311,130 311,140" fill="#5f6368"/>
  <path d="M540 135 L608 135" stroke="#5f6368" stroke-width="2"/>
  <polygon points="608,135 601,130 601,140" fill="#5f6368"/>

  <rect x="30" y="215" width="800" height="33" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="430" y="236" text-anchor="middle" font-size="11" fill="#37474f">阶段产出：能用一个空目录做出第一次提交，并把这次提交拆到 blob 层</text>
</svg>
