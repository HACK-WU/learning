<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="260" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a237e">阶段 2 · 个人工作流</text>
  <text x="430" y="47" text-anchor="middle" font-size="11" fill="#5f6368">一个人的分身术：改错能撤、分支敢建、冲突会解</text>

  <rect x="30" y="70" width="220" height="130" rx="8" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
  <rect x="30" y="70" width="220" height="28" rx="8" fill="#2E7D32"/>
  <text x="140" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">课 4 · 差异与撤销</text>
  <text x="140" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">diff 三副面孔</text>
  <text x="140" y="137" text-anchor="middle" font-size="10.5" fill="#37474f">restore / reset / revert / checkout</text>
  <text x="140" y="156" text-anchor="middle" font-size="10.5" fill="#37474f">amend 与 commit 的边界</text>
  <text x="140" y="183" text-anchor="middle" font-size="10.5" fill="#2E7D32">先会看，再会撤</text>

  <rect x="320" y="70" width="220" height="130" rx="8" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
  <rect x="320" y="70" width="220" height="28" rx="8" fill="#2E7D32"/>
  <text x="430" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">课 5 · 分支的本质</text>
  <text x="430" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">分支是指针不是副本</text>
  <text x="430" y="137" text-anchor="middle" font-size="10.5" fill="#37474f">HEAD 与 detached HEAD</text>
  <text x="430" y="156" text-anchor="middle" font-size="10.5" fill="#37474f">切换分支时工作区的变化</text>
  <text x="430" y="183" text-anchor="middle" font-size="10.5" fill="#2E7D32">理解后面一切的前提</text>

  <rect x="610" y="70" width="220" height="130" rx="8" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
  <rect x="610" y="70" width="220" height="28" rx="8" fill="#2E7D32"/>
  <text x="720" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">课 6 · 合并与冲突</text>
  <text x="720" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">快进合并 vs 三方合并</text>
  <text x="720" y="137" text-anchor="middle" font-size="10.5" fill="#37474f">冲突产生的真实原因与解决</text>
  <text x="720" y="156" text-anchor="middle" font-size="10.5" fill="#37474f">暂存现场：git stash</text>
  <text x="720" y="183" text-anchor="middle" font-size="10.5" fill="#2E7D32">分身汇合</text>

  <path d="M250 135 L318 135" stroke="#5f6368" stroke-width="2"/>
  <polygon points="318,135 311,130 311,140" fill="#5f6368"/>
  <path d="M540 135 L608 135" stroke="#5f6368" stroke-width="2"/>
  <polygon points="608,135 601,130 601,140" fill="#5f6368"/>

  <rect x="30" y="215" width="800" height="33" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="430" y="236" text-anchor="middle" font-size="11" fill="#37474f">阶段产出：说清 reset / revert / restore 的差别，并能在冲突现场独立解决冲突</text>
</svg>
