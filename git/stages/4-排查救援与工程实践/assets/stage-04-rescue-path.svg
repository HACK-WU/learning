<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="260" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a237e">阶段 4 · 排查、救援与工程实践</text>
  <text x="430" y="47" text-anchor="middle" font-size="11" fill="#5f6368">历史的追查与救援：先会查，再会救，最后让它不再发生</text>

  <rect x="30" y="70" width="220" height="130" rx="8" fill="#fce4ec" stroke="#C2185B" stroke-width="2"/>
  <rect x="30" y="70" width="220" height="28" rx="8" fill="#C2185B"/>
  <text x="140" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">课 10 · 历史排查与定位</text>
  <text x="140" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">git bisect 二分定位坏提交</text>
  <text x="140" y="137" text-anchor="middle" font-size="10.5" fill="#37474f">blame 与 log -S 追溯来源</text>
  <text x="140" y="156" text-anchor="middle" font-size="10.5" fill="#37474f">worktree / sparse-checkout</text>
  <text x="140" y="183" text-anchor="middle" font-size="10.5" fill="#C2185B">先知道东西丢在哪</text>

  <rect x="320" y="70" width="220" height="130" rx="8" fill="#fce4ec" stroke="#C2185B" stroke-width="2"/>
  <rect x="320" y="70" width="220" height="28" rx="8" fill="#C2185B"/>
  <text x="430" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">课 11 · 误操作救援</text>
  <text x="430" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">reflog：操作的飞行记录仪</text>
  <text x="430" y="137" text-anchor="middle" font-size="10.5" fill="#37474f">救援矩阵：hard reset / 强推 / 删分支</text>
  <text x="430" y="156" text-anchor="middle" font-size="10.5" fill="#37474f">改写边界与 force-with-lease</text>
  <text x="430" y="183" text-anchor="middle" font-size="10.5" fill="#C2185B">再把它救回来</text>

  <rect x="610" y="70" width="220" height="130" rx="8" fill="#fce4ec" stroke="#C2185B" stroke-width="2"/>
  <rect x="610" y="70" width="220" height="28" rx="8" fill="#C2185B"/>
  <text x="720" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">课 12 · 仓库工程实践</text>
  <text x="720" y="118" text-anchor="middle" font-size="10.5" fill="#37474f">gc / 大文件 / LFS / 历史瘦身</text>
  <text x="720" y="137" text-anchor="middle" font-size="10.5" fill="#37474f">hooks 与提交前检查</text>
  <text x="720" y="156" text-anchor="middle" font-size="10.5" fill="#37474f">Code Review 与 PR 工作流</text>
  <text x="720" y="183" text-anchor="middle" font-size="10.5" fill="#C2185B">最后让它不再发生</text>

  <path d="M250 135 L318 135" stroke="#5f6368" stroke-width="2"/>
  <polygon points="318,135 311,130 311,140" fill="#5f6368"/>
  <path d="M540 135 L608 135" stroke="#5f6368" stroke-width="2"/>
  <polygon points="608,135 601,130 601,140" fill="#5f6368"/>

  <rect x="30" y="215" width="800" height="33" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="430" y="236" text-anchor="middle" font-size="11" fill="#37474f">阶段产出：独立恢复一次 reset --hard 误操作，并为团队搭一套提交前检查</text>
</svg>
