<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
  <rect width="940" height="450" fill="#ffffff"/>

  <text x="20" y="26" font-size="16" font-weight="bold" fill="#1a237e">两地三中心：三种节点摆法的取舍</text>

  <rect x="20" y="38" width="16" height="12" rx="2" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="42" y="48" font-size="12" fill="#333333">participant（投票成员）</text>
  <rect x="196" y="38" width="16" height="12" rx="2" fill="#ffffff" stroke="#1565C0" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="218" y="48" font-size="12" fill="#333333">observer（非投票，只听结果）</text>

  <!-- ============ 解法 A ============ -->
  <rect x="20" y="62" width="280" height="30" rx="4" fill="#1565C0"/>
  <text x="160" y="82" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">A · 三节点均匀分布三地</text>

  <rect x="20" y="104" width="280" height="58" rx="4" fill="#f5f7fa" stroke="#c5cae9"/>
  <text x="32" y="122" font-size="12" fill="#5c6bc0">主城 A 机房 · RTT 1ms</text>
  <rect x="32" y="130" width="90" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="77" y="145" font-size="11" fill="#1a237e" text-anchor="middle">participant</text>

  <rect x="20" y="172" width="280" height="58" rx="4" fill="#f5f7fa" stroke="#c5cae9"/>
  <text x="32" y="190" font-size="12" fill="#5c6bc0">主城 B 机房 · RTT 1ms</text>
  <rect x="32" y="198" width="90" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="77" y="213" font-size="11" fill="#1a237e" text-anchor="middle">participant</text>

  <rect x="20" y="240" width="280" height="58" rx="4" fill="#f5f7fa" stroke="#c5cae9"/>
  <text x="32" y="258" font-size="12" fill="#5c6bc0">异地 C 机房 · RTT 30ms</text>
  <rect x="32" y="266" width="90" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="77" y="281" font-size="11" fill="#1a237e" text-anchor="middle">participant</text>

  <path d="M 262 141 L 262 277" stroke="#1565C0" stroke-width="1.5" fill="none"/>
  <circle cx="262" cy="141" r="3" fill="#1565C0"/>
  <circle cx="262" cy="209" r="3" fill="#1565C0"/>
  <circle cx="262" cy="277" r="3" fill="#1565C0"/>
  <text x="252" y="212" font-size="11" fill="#1565C0" text-anchor="end">同一个 quorum</text>

  <rect x="20" y="312" width="280" height="118" rx="4" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="32" y="332" font-size="12" font-weight="bold" fill="#2e7d32">容忍：任一单机房故障</text>
  <text x="32" y="354" font-size="11" fill="#333333">写要过半 ACK → 每次写 =</text>
  <text x="32" y="370" font-size="11" fill="#333333">一次跨城 RTT（30ms）</text>
  <text x="32" y="392" font-size="11" fill="#c62828">风险：RTT 抖动侵蚀</text>
  <text x="32" y="408" font-size="11" fill="#c62828">syncLimit × tickTime 预算</text>
  <text x="32" y="424" font-size="11" fill="#333333">适用：同城三 AZ</text>

  <!-- ============ 解法 B ============ -->
  <rect x="320" y="62" width="280" height="30" rx="4" fill="#1565C0"/>
  <text x="460" y="82" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">B · 主城 ensemble + 异地 Observer</text>

  <rect x="320" y="104" width="280" height="126" rx="4" fill="#f5f7fa" stroke="#c5cae9"/>
  <text x="332" y="122" font-size="12" fill="#5c6bc0">主城（A + B 机房）· 完整仲裁</text>
  <rect x="332" y="132" width="82" height="24" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="373" y="148" font-size="11" fill="#1a237e" text-anchor="middle">participant</text>
  <rect x="422" y="132" width="82" height="24" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="463" y="148" font-size="11" fill="#1a237e" text-anchor="middle">participant</text>
  <rect x="512" y="132" width="76" height="24" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="550" y="148" font-size="11" fill="#1a237e" text-anchor="middle">leader</text>
  <text x="332" y="182" font-size="11" fill="#333333">写全部在此完成，不跨城</text>
  <text x="332" y="200" font-size="11" fill="#333333">（fsync 过半即可 ACK）</text>
  <text x="332" y="220" font-size="11" fill="#2e7d32">主城内部故障：自动重选</text>

  <rect x="320" y="240" width="280" height="58" rx="4" fill="#f5f7fa" stroke="#c5cae9"/>
  <text x="332" y="258" font-size="12" fill="#5c6bc0">异地 C 机房 · 仅 Observer</text>
  <rect x="332" y="266" width="90" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="377" y="281" font-size="11" fill="#1a237e" text-anchor="middle">observer</text>
  <rect x="432" y="266" width="90" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="477" y="281" font-size="11" fill="#1a237e" text-anchor="middle">observer</text>

  <path d="M 470 230 L 470 264" stroke="#90a4ae" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <text x="480" y="252" font-size="11" fill="#607d8b">只听投票结果（跨城分区不影响主集群）</text>

  <rect x="320" y="312" width="280" height="118" rx="4" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="332" y="332" font-size="12" font-weight="bold" fill="#2e7d32">获得：异地读本地极快</text>
  <text x="332" y="354" font-size="11" fill="#333333">官方 datacenter bridge 用例</text>
  <text x="332" y="376" font-size="11" fill="#c62828">代价：主城整体故障 →</text>
  <text x="332" y="392" font-size="11" fill="#c62828">异地只剩 Observer，无法成 quorum</text>
  <text x="332" y="414" font-size="11" fill="#c62828">→ 写不可用（只能读）</text>

  <!-- ============ 解法 C ============ -->
  <rect x="620" y="62" width="300" height="30" rx="4" fill="#1565C0"/>
  <text x="770" y="82" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">C · Hierarchical Quorums（分组加权）</text>

  <rect x="620" y="104" width="300" height="58" rx="4" fill="#f5f7fa" stroke="#c5cae9"/>
  <text x="632" y="122" font-size="12" fill="#5c6bc0">group.1 = 1:2:3（主城 A）</text>
  <rect x="632" y="130" width="56" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="660" y="145" font-size="11" fill="#1a237e" text-anchor="middle">1</text>
  <rect x="696" y="130" width="56" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="724" y="145" font-size="11" fill="#1a237e" text-anchor="middle">2</text>
  <rect x="760" y="130" width="56" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="788" y="145" font-size="11" fill="#1a237e" text-anchor="middle">3</text>
  <text x="826" y="145" font-size="11" fill="#5c6bc0">w=1</text>

  <rect x="620" y="172" width="300" height="58" rx="4" fill="#f5f7fa" stroke="#c5cae9"/>
  <text x="632" y="190" font-size="12" fill="#5c6bc0">group.2 = 4:5:6（主城 B）</text>
  <rect x="632" y="198" width="56" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="660" y="213" font-size="11" fill="#1a237e" text-anchor="middle">4</text>
  <rect x="696" y="198" width="56" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="724" y="213" font-size="11" fill="#1a237e" text-anchor="middle">5</text>
  <rect x="760" y="198" width="56" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="788" y="213" font-size="11" fill="#1a237e" text-anchor="middle">6</text>
  <text x="826" y="213" font-size="11" fill="#5c6bc0">w=1</text>

  <rect x="620" y="240" width="300" height="58" rx="4" fill="#f5f7fa" stroke="#c5cae9"/>
  <text x="632" y="258" font-size="12" fill="#5c6bc0">group.3 = 7:8:9（异地 C）</text>
  <rect x="632" y="266" width="56" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="660" y="281" font-size="11" fill="#1a237e" text-anchor="middle">7</text>
  <rect x="696" y="266" width="56" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="724" y="281" font-size="11" fill="#1a237e" text-anchor="middle">8</text>
  <rect x="760" y="266" width="56" height="22" rx="3" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="788" y="281" font-size="11" fill="#1a237e" text-anchor="middle">9</text>
  <text x="826" y="281" font-size="11" fill="#5c6bc0">w=1</text>

  <rect x="620" y="312" width="300" height="118" rx="4" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="632" y="332" font-size="12" font-weight="bold" fill="#2e7d32">仲裁规则：多数非零权重组中各取过半</text>
  <text x="632" y="354" font-size="11" fill="#333333">例：需 ≥2 个组里各有 ≥2 票</text>
  <text x="632" y="376" font-size="11" fill="#c62828">代价：配置与运维理解成本高</text>
  <text x="632" y="392" font-size="11" fill="#c62828">扩缩容要重算组权重；</text>
  <text x="632" y="408" font-size="11" fill="#c62828">增量 reconfig 不适用（仅 Majority）</text>
  <text x="632" y="424" font-size="11" fill="#333333">适用：大规模多机房 + 专人维护</text>

  <text x="20" y="446" font-size="11" fill="#757575">依据：ZooKeeper 官方 Observers Guide / Hierarchical Quorums / Dynamic Reconfiguration（核查于 2026-08）</text>
</svg>
