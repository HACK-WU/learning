<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 C · 客户端缓存 + 兜底：控制面挂了，业务不该跟着崩</text>

  <rect x="60" y="150" width="150" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="178" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e3a8a">应用</text>
  <text x="135" y="200" font-size="11" text-anchor="middle" fill="#1e40af">先查本地缓存</text>
  <text x="135" y="220" font-size="11" text-anchor="middle" fill="#1e40af">未命中才问 Consul</text>

  <line x1="210" y1="185" x2="330" y2="185" stroke="#2563eb" stroke-width="2"/>
  <polygon points="330,185 322,179 322,191" fill="#2563eb"/>

  <rect x="330" y="158" width="200" height="54" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="181" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e40af">Consul（控制面）</text>
  <text x="430" y="200" font-size="11" text-anchor="middle" fill="#1e3a8a">?stale + 超时 2s</text>

  <line x1="530" y1="185" x2="620" y2="185" stroke="#dc2626" stroke-width="3" stroke-dasharray="5,4"/>
  <text x="575" y="175" font-size="11" text-anchor="middle" fill="#b91c1c">不可达</text>

  <rect x="620" y="148" width="200" height="94" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="720" y="174" font-size="13" text-anchor="middle" font-weight="bold" fill="#991b1b">没有缓存 = 一起崩</text>
  <text x="720" y="196" font-size="12" text-anchor="middle" fill="#b91c1c">Consul 抖一下</text>
  <text x="720" y="214" font-size="12" text-anchor="middle" fill="#b91c1c">全站 503</text>
  <text x="720" y="234" font-size="11" text-anchor="middle" fill="#dc2626">控制面成了数据面的瓶颈</text>

  <rect x="330" y="245" width="200" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="270" font-size="13" text-anchor="middle" font-weight="bold" fill="#14532d">有缓存 = 继续干活</text>
  <text x="430" y="292" font-size="12" text-anchor="middle" fill="#15803d">用旧列表撑过抖动期</text>

  <line x1="210" y1="275" x2="330" y2="275" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="210,275 218,271 218,279" fill="#16a34a"/>
  <text x="270" y="292" font-size="11" text-anchor="middle" fill="#15803d">兜底返回</text>

  <rect x="50" y="320" width="820" height="28" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="339" font-size="12" text-anchor="middle" fill="#92400e">架构原则：控制面不应成为数据面的可用性瓶颈——缓存须有 TTL，且显式捕获异常、无缓存时才真的失败</text>
</svg>
