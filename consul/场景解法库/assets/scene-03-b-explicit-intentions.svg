<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 B · 显式 intention 清单：白记了一笔，除非默认策略也改</text>

  <rect x="60" y="80" width="150" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="102" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e3a8a">web</text>
  <text x="135" y="121" font-size="11" text-anchor="middle" fill="#1e40af">source</text>

  <rect x="60" y="170" width="150" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="192" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e3a8a">api</text>
  <text x="135" y="211" font-size="11" text-anchor="middle" fill="#1e40af">source</text>

  <rect x="60" y="260" width="150" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="135" y="282" font-size="14" text-anchor="middle" font-weight="bold" fill="#4b5563">ops-tool</text>
  <text x="135" y="301" font-size="11" text-anchor="middle" fill="#6b7280">未列关系</text>

  <line x1="210" y1="108" x2="370" y2="108" stroke="#16a34a" stroke-width="3"/>
  <polygon points="370,108 362,102 362,114" fill="#16a34a"/>
  <text x="290" y="98" font-size="11" text-anchor="middle" font-weight="bold" fill="#15803d">allow（已建）</text>

  <line x1="210" y1="198" x2="370" y2="140" stroke="#16a34a" stroke-width="3"/>
  <polygon points="370,140 362,134 362,146" fill="#16a34a"/>
  <text x="290" y="178" font-size="11" text-anchor="middle" font-weight="bold" fill="#15803d">allow（已建）</text>

  <line x1="210" y1="288" x2="370" y2="160" stroke="#dc2626" stroke-width="3" stroke-dasharray="5,4"/>
  <polygon points="370,160 362,154 362,166" fill="#dc2626"/>
  <text x="292" y="255" font-size="11" text-anchor="middle" font-weight="bold" fill="#b91c1c">默认 allow → 照样通</text>

  <rect x="370" y="105" width="170" height="130" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="455" y="132" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e40af">payment</text>
  <text x="455" y="155" font-size="11" text-anchor="middle" fill="#1e3a8a">destination</text>
  <text x="455" y="180" font-size="11" text-anchor="middle" fill="#1e3a8a">白名单里只有 web / api</text>
  <text x="455" y="205" font-size="11" text-anchor="middle" fill="#1e3a8a">但没说「其他禁止」</text>

  <rect x="590" y="80" width="260" height="230" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="720" y="106" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">两个代价</text>
  <text x="720" y="134" font-size="12" text-anchor="middle" fill="#b91c1c">① 默认策略不改 →</text>
  <text x="720" y="152" font-size="12" text-anchor="middle" fill="#b91c1c">清单只是「白记一笔」</text>
  <text x="720" y="180" font-size="12" text-anchor="middle" fill="#b91c1c">② 关系数平方级增长：</text>
  <text x="720" y="198" font-size="12" text-anchor="middle" fill="#b91c1c">50 服务 ≈ 50×49 条</text>
  <text x="720" y="226" font-size="12" text-anchor="middle" fill="#b91c1c">③ 冒名注册即入白名单：</text>
  <text x="720" y="244" font-size="12" text-anchor="middle" fill="#b91c1c">谁能注册 = 谁拥有身份</text>
  <text x="720" y="272" font-size="12" text-anchor="middle" fill="#b91c1c">（无 ACL 时任何人可领证）</text>
  <text x="720" y="298" font-size="11" text-anchor="middle" fill="#dc2626">实测 intention 生效 82ms</text>

  <rect x="50" y="335" width="800" height="46" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="356" font-size="13" text-anchor="middle" font-weight="bold" fill="#92400e">结论：显式 allow 只有在「默认 deny」的前提下才有约束力</text>
  <text x="450" y="374" font-size="12" text-anchor="middle" fill="#b45309">否则它记录的是「这些允许」，而不是「只许这些」——见解法 C</text>
</svg>
