<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 D · 数据库锁：零新增组件，但把选主可用性焊死在业务库上</text>

  <rect x="60" y="70" width="160" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="98" font-size="14" text-anchor="middle" fill="#1e3a8a">worker-1</text>

  <rect x="60" y="140" width="160" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="140" y="168" font-size="14" text-anchor="middle" fill="#4b5563">worker-2</text>

  <rect x="60" y="210" width="160" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="140" y="238" font-size="14" text-anchor="middle" fill="#4b5563">worker-3</text>

  <line x1="220" y1="93" x2="320" y2="93" stroke="#2563eb" stroke-width="2"/>
  <polygon points="320,93 312,88 312,98" fill="#2563eb"/>
  <line x1="220" y1="163" x2="320" y2="120" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="220" y1="233" x2="320" y2="150" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,4"/>

  <rect x="320" y="70" width="200" height="100" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="420" y="98" font-size="14" text-anchor="middle" font-weight="bold" fill="#5b21b6">PostgreSQL</text>
  <text x="420" y="120" font-size="12" text-anchor="middle" fill="#6d28d9">pg_try_advisory_lock</text>
  <text x="420" y="140" font-size="12" text-anchor="middle" fill="#6d28d9">会话断 → 自动释放</text>
  <text x="420" y="160" font-size="11" text-anchor="middle" fill="#7c3aed">唯一索引亦可互斥点</text>

  <rect x="600" y="70" width="260" height="100" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="730" y="95" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">结构性失效点</text>
  <text x="730" y="118" font-size="12" text-anchor="middle" fill="#b91c1c">DB 抖动 / 长事务 / 连接池耗尽</text>
  <text x="730" y="138" font-size="12" text-anchor="middle" fill="#b91c1c">→ 直接表现为「选主卡住」</text>
  <text x="730" y="158" font-size="12" text-anchor="middle" fill="#b91c1c">轮询间隔 = 交接延迟下限</text>

  <line x1="520" y1="120" x2="600" y2="120" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="600,120 592,115 592,125" fill="#dc2626"/>

  <rect x="60" y="270" width="800" height="50" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="292" font-size="13" text-anchor="middle" font-weight="bold" fill="#92400e">什么时候反而对：团队小、已强依赖一个 Postgres、不愿为选主引入新组件</text>
  <text x="460" y="312" font-size="12" text-anchor="middle" fill="#b45309">但「选主可用性 = 数据库可用性」是架构耦合，不是配置能调开的</text>
</svg>
