  <text x="125" y="230" font-size="12" text-anchor="middle" fill="#1e3a8a">客户端 N</text>

  <line x1="190" y1="115" x2="380" y2="168" stroke="#2563eb" stroke-width="2"/>
  <line x1="190" y1="170" x2="380" y2="172" stroke="#2563eb" stroke-width="2"/>
