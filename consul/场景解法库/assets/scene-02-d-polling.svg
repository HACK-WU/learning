<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 D · 定时轮询：最低成本兜底，代价是延迟与请求放大</text>

  <rect x="60" y="100" width="150" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="125" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e3a8a">应用</text>
  <text x="135" y="144" font-size="11" text-anchor="middle" fill="#1e40af">定时拉取</text>

  <line x1="210" y1="120" x2="380" y2="120" stroke="#2563eb" stroke-width="2"/>
  <polygon points="380,120 372,115 372,125" fill="#2563eb"/>

  <rect x="380" y="98" width="180" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="470" y="122" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e40af">Consul :8500</text>
  <text x="470" y="142" font-size="11" text-anchor="middle" fill="#1e3a8a">全量拉取 + 比对</text>

  <line x1="560" y1="150" x2="470" y2="180" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="470,180 474,171 466,171" fill="#9ca3af"/>
  <text x="540" y="196" font-size="11" text-anchor="middle" fill="#6b7280">绝大多数请求无变化</text>

  <line x1="80" y1="230" x2="820" y2="230" stroke="#9ca3af" stroke-width="2"/>
  <text x="450" y="222" font-size="12" text-anchor="middle" fill="#374151">时间轴：间隔 interval = 30s</text>

  <line x1="80" y1="225" x2="80" y2="235" stroke="#374151" stroke-width="2"/>
  <text x="80" y="252" font-size="11" text-anchor="middle" fill="#374151">拉取</text>
  <line x1="330" y1="225" x2="330" y2="235" stroke="#374151" stroke-width="2"/>
  <text x="330" y="252" font-size="11" text-anchor="middle" fill="#374151">拉取</text>
  <line x1="580" y1="225" x2="580" y2="235" stroke="#374151" stroke-width="2"/>
  <text x="580" y="252" font-size="11" text-anchor="middle" fill="#374151">拉取（拿到变更）</text>
  <line x1="820" y1="225" x2="820" y2="235" stroke="#374151" stroke-width="2"/>
  <text x="820" y="252" font-size="11" text-anchor="middle" fill="#374151">拉取</text>

  <line x1="400" y1="206" x2="400" y2="230" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="420" y="216" font-size="11" fill="#b91c1c">真实变更发生</text>

  <rect x="50" y="275" width="820" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="460" y="298" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">结构性代价：最坏延迟 = 间隔（30s 间隔就注定最坏 30 秒才生效）</text>
  <text x="460" y="320" font-size="12" text-anchor="middle" fill="#b91c1c">请求放大：配置不常变，绝大多数拉取是无效的——调小间隔只会把 Consul 打垮</text>

  <rect x="50" y="345" width="820" height="0" fill="none"/>
</svg>
