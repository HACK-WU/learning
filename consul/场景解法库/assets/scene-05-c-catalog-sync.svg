<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 C · catalog sync：让 VM 侧看得见 K8s 里的服务</text>

  <rect x="60" y="90" width="300" height="120" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="114" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">K8s 集群</text>
  <rect x="90" y="128" width="120" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="149" font-size="12" text-anchor="middle" fill="#14532d">Service</text>
  <rect x="225" y="128" width="110" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="149" font-size="11" text-anchor="middle" fill="#14532d">Endpoints</text>
  <text x="210" y="182" font-size="11" text-anchor="middle" fill="#15803d">Pod IP 只在集群内有效</text>
  <text x="210" y="200" font-size="11" text-anchor="middle" fill="#15803d">VM 侧本来根本看不见</text>

  <line x1="360" y1="150" x2="450" y2="150" stroke="#7c3aed" stroke-width="3"/>
  <polygon points="450,150 442,144 442,156" fill="#7c3aed"/>
  <text x="405" y="140" font-size="11" text-anchor="middle" fill="#6d28d9">同步</text>

  <rect x="450" y="110" width="150" height="80" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="525" y="136" font-size="14" text-anchor="middle" font-weight="bold" fill="#5b21b6">consul-k8s</text>
  <text x="525" y="156" font-size="11" text-anchor="middle" fill="#6d28d9">syncCatalog</text>
  <text x="525" y="174" font-size="11" text-anchor="middle" fill="#6d28d9">多一套控制面</text>

  <line x1="600" y1="150" x2="680" y2="150" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="680,150 672,144 672,156" fill="#7c3aed"/>

  <rect x="680" y="110" width="170" height="80" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="765" y="136" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e40af">Consul 目录</text>
  <text x="765" y="157" font-size="11" text-anchor="middle" fill="#1e3a8a">VM 侧可查</text>
  <text x="765" y="175" font-size="11" text-anchor="middle" fill="#1e3a8a">统一服务名</text>

  <rect x="50" y="230" width="820" height="85" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="460" y="254" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">代价与边界：单向 + 有延迟 + 不解决网络可达</text>
  <text x="460" y="277" font-size="12" text-anchor="middle" fill="#b91c1c">同步是 K8s → Consul（toConsul），不是实时复制；同步来的实例健康依赖 K8s 就绪探针</text>
  <text x="460" y="299" font-size="12" text-anchor="middle" fill="#b91c1c">它解决的是「看得见」，不是「连得上」——跨环境连通性仍需专线 / 网关 / mesh gateway</text>

  <rect x="50" y="328" width="820" height="36" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="351" font-size="12" text-anchor="middle" fill="#92400e">只在「VM 要调 K8s」时才需要——纯 K8s 内部调用用不上它，别为「统一」而多上一套控制面</text>
</svg>
