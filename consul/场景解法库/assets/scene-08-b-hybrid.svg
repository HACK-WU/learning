<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="370" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 B · 原生为主，Consul 只做跨集群：按需引入不全量接管</text>

  <rect x="50" y="80" width="330" height="130" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="215" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">集群内部：继续用原生 Service</text>
  <rect x="80" y="122" width="130" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="145" y="144" font-size="12" text-anchor="middle" fill="#14532d">Service 名</text>
  <rect x="225" y="122" width="130" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="290" y="144" font-size="12" text-anchor="middle" fill="#14532d">延迟最低</text>
  <text x="215" y="180" font-size="12" text-anchor="middle" fill="#15803d">connectInject: false</text>
  <text x="215" y="200" font-size="12" text-anchor="middle" fill="#15803d">不引入 sidecar</text>

  <rect x="520" y="80" width="330" height="130" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="685" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">跨集群 / 跨 VM：走 Consul</text>
  <rect x="550" y="122" width="130" height="34" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="615" y="144" font-size="12" text-anchor="middle" fill="#1e3a8a">catalog sync</text>
  <rect x="695" y="122" width="130" height="34" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="760" y="144" font-size="12" text-anchor="middle" fill="#1e3a8a">mesh gateway</text>
  <text x="685" y="180" font-size="12" text-anchor="middle" fill="#1e3a8a">syncCatalog.enabled: true</text>
  <text x="685" y="200" font-size="12" text-anchor="middle" fill="#1e3a8a">只开跨集群所需能力</text>

  <line x1="380" y1="145" x2="520" y2="145" stroke="#dc2626" stroke-width="3" stroke-dasharray="5,4"/>
  <text x="450" y="135" font-size="11" text-anchor="middle" fill="#b91c1c">跨环境调用</text>
  <text x="450" y="170" font-size="11" text-anchor="middle" fill="#b91c1c">绕经 Consul</text>

  <rect x="50" y="235" width="820" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="460" y="259" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">代价：两套寻址体系并存——实打实的心智负担</text>
  <text x="460" y="281" font-size="12" text-anchor="middle" fill="#b91c1c">开发者要记住「集群内用 Service 名、跨集群用 Consul 名」，两套健康语义、两套排查路径</text>

  <rect x="50" y="308" width="820" height="46" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="329" font-size="13" text-anchor="middle" font-weight="bold" fill="#92400e">适用：多集群或 VM 互通是刚需，但不需要服务间 mTLS 授权</text>
  <text x="460" y="347" font-size="12" text-anchor="middle" fill="#b45309">团队必须能说清「这次调用走哪条路」，否则故障时会两头查</text>
</svg>
