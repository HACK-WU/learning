<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 D · 许可证合规：把「管不管你」与「算不算开源」拆开判断</text>

  <rect x="50" y="60" width="390" height="150" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="245" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">第一问：BUSL 限制条款管不管你？</text>
  <text x="245" y="112" font-size="12" text-anchor="middle" fill="#15803d">附加使用授权明确豁免内部使用</text>
  <text x="245" y="132" font-size="12" text-anchor="middle" fill="#15803d">限制的是「卖竞争性托管服务」</text>
  <text x="245" y="160" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">多数团队答案：不受限</text>
  <text x="245" y="186" font-size="11" text-anchor="middle" fill="#166534">1.17.0 起（1.16.4 仍是 MPL 2.0）</text>
  <text x="245" y="202" font-size="11" text-anchor="middle" fill="#166534">API / SDK 保持 MPL 2.0 不受影响</text>

  <rect x="470" y="60" width="390" height="150" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="665" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">第二问：它算不算开源？（真正的风险点）</text>
  <text x="665" y="112" font-size="12" text-anchor="middle" fill="#b91c1c">OSI 不认证 BUSL 1.1</text>
  <text x="665" y="132" font-size="12" text-anchor="middle" fill="#b91c1c">违反开源定义第六条：不得歧视特定领域</text>
  <text x="665" y="160" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">有「仅用 OSI 开源」政策 = 硬障碍</text>
  <text x="665" y="186" font-size="11" text-anchor="middle" fill="#b91c1c">每版本满 4 年自动转 MPL 2.0</text>
  <text x="665" y="202" font-size="11" text-anchor="middle" fill="#b91c1c">（长期会转，但不是现在）</text>

  <rect x="50" y="230" width="820" height="85" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="254" font-size="14" text-anchor="middle" font-weight="bold" fill="#92400e">两件事常被混为一谈 → 误判</text>
  <text x="460" y="277" font-size="12" text-anchor="middle" fill="#b45309">错法一：听说「BUSL = 不能商用」就不敢用（其实内部使用明确豁免）</text>
  <text x="460" y="299" font-size="12" text-anchor="middle" fill="#b45309">错法二：确认「内部使用不受限」就以为合规过关（其实 OSI 不认证，合规检查会被拦）</text>

  <rect x="50" y="330" width="820" height="55" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="460" y="352" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151">给法务的结论要给「事实 + 出处」：LICENSE 原文 + 附加使用授权条款 + 版本起止</text>
  <text x="460" y="373" font-size="12" text-anchor="middle" fill="#4b5563">本课不是法律意见；条款解释请咨询法务或 licensing@hashicorp.com（核查于 2026-09）</text>
</svg>
