<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 A · 共用管理 token：不会遇到权限问题，因为全都放行</text>

  <rect x="80" y="90" width="130" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="120" font-size="14" text-anchor="middle" fill="#1e3a8a">web 服务</text>
  <rect x="80" y="160" width="130" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="190" font-size="14" text-anchor="middle" fill="#1e3a8a">api 服务</text>
  <rect x="80" y="230" width="130" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="260" font-size="14" text-anchor="middle" fill="#1e3a8a">运维脚本</text>

  <line x1="210" y1="116" x2="330" y2="170" stroke="#2563eb" stroke-width="2"/>
  <line x1="210" y1="186" x2="330" y2="180" stroke="#2563eb" stroke-width="2"/>
  <line x1="210" y1="256" x2="330" y2="192" stroke="#2563eb" stroke-width="2"/>

  <rect x="330" y="140" width="200" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="430" y="168" font-size="15" text-anchor="middle" font-weight="bold" fill="#92400e">同一个管理 token</text>
  <text x="430" y="190" font-size="12" text-anchor="middle" fill="#b45309">拥有全部权限</text>
  <text x="430" y="211" font-size="11" text-anchor="middle" fill="#b45309">写在每个服务配置里</text>

  <line x1="530" y1="185" x2="640" y2="185" stroke="#dc2626" stroke-width="2"/>
  <polygon points="640,185 632,179 632,191" fill="#dc2626"/>

  <rect x="640" y="130" width="200" height="110" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="740" y="156" font-size="15" text-anchor="middle" font-weight="bold" fill="#991b1b">爆炸半径 = 全盘</text>
  <text x="740" y="180" font-size="12" text-anchor="middle" fill="#b91c1c">读所有 KV</text>
  <text x="740" y="200" font-size="12" text-anchor="middle" fill="#b91c1c">注册任意服务</text>
  <text x="740" y="220" font-size="12" text-anchor="middle" fill="#b91c1c">改 intention / ACL</text>

  <rect x="50" y="285" width="820" height="55" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="460" y="308" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">危险在于「没有权限问题」：全部请求都通过，问题被掩盖到泄露那天</text>
  <text x="460" y="330" font-size="12" text-anchor="middle" fill="#b91c1c">无法审计（不知是谁）、无法回收（一撤全挂）、无法最小权限——仅可用于开发 / 测试环境</text>
</svg>
