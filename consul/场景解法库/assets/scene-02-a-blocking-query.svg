<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 A · 阻塞查询：服务端挂住连接，变更一到立刻返回</text>

  <rect x="50" y="90" width="150" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="115" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e3a8a">应用</text>
  <text x="125" y="136" font-size="11" text-anchor="middle" fill="#1e40af">监听循环</text>
  <text x="125" y="152" font-size="11" text-anchor="middle" fill="#1e40af">timeout=90</text>

  <rect x="330" y="90" width="220" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="115" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e40af">Consul agent :8500</text>
  <text x="440" y="136" font-size="12" text-anchor="middle" fill="#1e3a8a">index 未变 → 挂起连接</text>
  <text x="440" y="152" font-size="11" text-anchor="middle" fill="#3b82f6">wait=60s</text>

  <rect x="690" y="90" width="160" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="770" y="115" font-size="14" text-anchor="middle" font-weight="bold" fill="#14532d">KV 变更</text>
  <text x="770" y="136" font-size="12" text-anchor="middle" fill="#15803d">推进 X-Consul-Index</text>
  <text x="770" y="152" font-size="11" text-anchor="middle" fill="#166534">实测闭环 52ms</text>

  <line x1="200" y1="120" x2="330" y2="120" stroke="#2563eb" stroke-width="3"/>
  <polygon points="330,120 322,115 322,125" fill="#2563eb"/>
  <text x="265" y="110" font-size="11" text-anchor="middle" fill="#1d4ed8">GET ?index&amp;wait=60s</text>

  <line x1="550" y1="120" x2="690" y2="120" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="690,120 682,115 682,125" fill="#16a34a"/>
  <text x="620" y="110" font-size="11" text-anchor="middle" fill="#15803d">变更到达</text>

  <path d="M 440 170 L 440 200 L 125 200 L 125 170" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="125,170 120,178 130,178" fill="#2563eb"/>
  <text x="282" y="216" font-size="11" text-anchor="middle" fill="#1d4ed8">返回新值 + 新 index → apply_config()</text>

  <rect x="50" y="250" width="800" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="450" y="274" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">失效点 1：客户端 timeout 是「总耗时上限」，不是连接超时</text>
  <text x="450" y="296" font-size="12" text-anchor="middle" fill="#b91c1c">timeout(5s) &lt; wait(60s) → 必然在变更到达前超时，热更新静默失效且无任何报错</text>
  <text x="450" y="313" font-size="12" text-anchor="middle" fill="#b91c1c">失效点 2：写相同的值 index 不推进（实测 136 → 136），请求永远挂起</text>

  <rect x="50" y="336" width="800" height="46" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="356" font-size="13" text-anchor="middle" font-weight="bold" fill="#92400e">下一轮起点用响应头 X-Consul-Index，不要用 body 里的 ModifyIndex（会秒回旧值，退化为疯狂轮询）</text>
  <text x="450" y="374" font-size="12" text-anchor="middle" fill="#b45309">需要强制触发变更时，写带时间戳的值——同值写入不触发</text>
</svg>
