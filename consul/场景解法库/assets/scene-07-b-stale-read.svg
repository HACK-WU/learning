<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 B · stale 读：follower 也能应答，吞吐随节点数扩展</text>

  <rect x="60" y="95" width="130" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="120" font-size="12" text-anchor="middle" fill="#1e3a8a">客户端 1</text>
  <rect x="60" y="150" width="130" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="175" font-size="12" text-anchor="middle" fill="#1e3a8a">客户端 2</text>
  <rect x="60" y="205" width="130" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="230" font-size="12" text-anchor="middle" fill="#1e3a8a">客户端 N</text>

  <line x1="190" y1="115" x2="380" y2="112" stroke="#16a34a" stroke-width="2"/>
  <polygon points="380,112 372,106 372,118" fill="#16a34a"/>
  <line x1="190" y1="170" x2="380" y2="168" stroke="#16a34a" stroke-width="2"/>
  <polygon points="380,168 372,162 372,174" fill="#16a34a"/>
  <line x1="190" y1="225" x2="380" y2="222" stroke="#16a34a" stroke-width="2"/>
  <polygon points="380,222 372,216 372,228" fill="#16a34a"/>

  <rect x="380" y="88" width="180" height="48" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="470" y="117" font-size="13" text-anchor="middle" fill="#92400e">leader（也可应答）</text>

  <rect x="640" y="88" width="150" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="117" font-size="12" text-anchor="middle" fill="#14532d">follower-1 应答</text>

  <rect x="640" y="160" width="150" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="189" font-size="12" text-anchor="middle" fill="#14532d">follower-2 应答</text>

  <rect x="380" y="160" width="180" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="470" y="183" font-size="12" text-anchor="middle" fill="#1e40af">?stale 参数</text>
  <text x="470" y="200" font-size="11" text-anchor="middle" fill="#1e3a8a">不经 leader 确认</text>

  <rect x="50" y="235" width="820" height="75" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="460" y="259" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">代价：数据可能略旧——实测三节点集群 stale 稳定落后 1 版</text>
  <text x="460" y="282" font-size="12" text-anchor="middle" fill="#b91c1c">刚被摘除的实例可能还在返回列表里 → 调用方必须有重试 / 熔断兜底</text>
  <text x="460" y="301" font-size="12" text-anchor="middle" fill="#b91c1c">适用：读多写少的服务发现；涉及资金的调用仍应走强一致读</text>

  <rect x="50" y="322" width="820" height="42" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="343" font-size="13" text-anchor="middle" font-weight="bold" fill="#14532d">收益：读吞吐随 server 数量线性扩展——这才是「加 server 有用」的正确打开方式</text>
  <text x="460" y="360" font-size="12" text-anchor="middle" fill="#15803d">实战 A 三节点集群实测：stale 与强一致的延迟 / 新鲜度对比</text>
</svg>
