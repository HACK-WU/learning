<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 B · 按服务拆 token：方向对了，但会遇到静默失败</text>

  <rect x="60" y="70" width="150" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="96" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e3a8a">token</text>
  <text x="135" y="114" font-size="11" text-anchor="middle" fill="#1e40af">服务的身份凭证</text>

  <line x1="210" y1="97" x2="280" y2="97" stroke="#2563eb" stroke-width="2"/>
  <polygon points="280,97 272,91 272,103" fill="#2563eb"/>

  <rect x="280" y="70" width="150" height="54" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="355" y="96" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e40af">policy</text>
  <text x="355" y="114" font-size="11" text-anchor="middle" fill="#1e3a8a">权限的集合</text>

  <line x1="430" y1="97" x2="500" y2="97" stroke="#2563eb" stroke-width="2"/>
  <polygon points="500,97 492,91 492,103" fill="#2563eb"/>

  <rect x="500" y="60" width="200" height="74" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="86" font-size="14" text-anchor="middle" font-weight="bold" fill="#14532d">rule（最小权限）</text>
  <text x="600" y="106" font-size="11" text-anchor="middle" fill="#15803d">key_prefix / service_prefix</text>
  <text x="600" y="124" font-size="11" text-anchor="middle" fill="#15803d">node_prefix 分别授权</text>

  <rect x="60" y="155" width="820" height="130" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="460" y="180" font-size="15" text-anchor="middle" font-weight="bold" fill="#991b1b">ACL 三条静默失败（课 8 全链路实测）——排查噩梦</text>

  <rect x="90" y="196" width="240" height="72" rx="5" fill="#fff5f5" stroke="#f87171" stroke-width="2"/>
  <text x="210" y="218" font-size="13" text-anchor="middle" font-weight="bold" fill="#991b1b">读单个 key 无权限</text>
  <text x="210" y="240" font-size="15" text-anchor="middle" font-weight="bold" fill="#dc2626">403</text>
  <text x="210" y="258" font-size="11" text-anchor="middle" fill="#7f1d1d">明确报错，好发现</text>

  <rect x="350" y="196" width="240" height="72" rx="5" fill="#fff5f5" stroke="#f87171" stroke-width="2"/>
  <text x="470" y="218" font-size="13" text-anchor="middle" font-weight="bold" fill="#991b1b">列服务无权限</text>
  <text x="470" y="240" font-size="15" text-anchor="middle" font-weight="bold" fill="#dc2626">200 {}</text>
  <text x="470" y="258" font-size="11" text-anchor="middle" fill="#7f1d1d">看起来像「没有服务」</text>

  <rect x="610" y="196" width="240" height="72" rx="5" fill="#fff5f5" stroke="#f87171" stroke-width="2"/>
  <text x="730" y="218" font-size="13" text-anchor="middle" font-weight="bold" fill="#991b1b">列 keys 无权限</text>
  <text x="730" y="240" font-size="15" text-anchor="middle" font-weight="bold" fill="#dc2626">200 []</text>
  <text x="730" y="258" font-size="11" text-anchor="middle" fill="#7f1d1d">看起来像「没有配置」</text>

  <rect x="60" y="300" width="820" height="80" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="323" font-size="14" text-anchor="middle" font-weight="bold" fill="#92400e">第 2、3 条最危险：不报错、日志里干干净净，看起来完全是「数据不存在」</text>
  <text x="460" y="346" font-size="12" text-anchor="middle" fill="#b45309">排查时你会去查「服务为什么没注册上」「配置为什么没写进去」——而真实原因是权限不足的静默降级</text>
  <text x="460" y="366" font-size="12" text-anchor="middle" fill="#b45309">递归读前缀无权限还会返回 404（伪装成配置不存在）——三条表现各不相同，别只认 403</text>
</svg>
