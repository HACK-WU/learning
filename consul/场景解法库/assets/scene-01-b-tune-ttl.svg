<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 B · 缩短 TTL + 调小 LockDelay：交接变快，误抢风险变高</text>

  <text x="225" y="58" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e40af">默认参数：TTL 15s / LockDelay 15s</text>
  <text x="675" y="58" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">调参后：TTL 10s / LockDelay 1s</text>

  <line x1="70" y1="130" x2="390" y2="130" stroke="#9ca3af" stroke-width="2"/>
  <line x1="520" y1="130" x2="840" y2="130" stroke="#9ca3af" stroke-width="2"/>

  <polygon points="70,130 78,125 78,135" fill="#9ca3af"/>
  <polygon points="520,130 528,125 528,135" fill="#9ca3af"/>
  <text x="70" y="150" font-size="11" text-anchor="middle" fill="#4b5563">t=0 崩溃</text>
  <text x="520" y="150" font-size="11" text-anchor="middle" fill="#4b5563">t=0 崩溃</text>

  <rect x="70" y="160" width="150" height="34" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="145" y="181" font-size="12" text-anchor="middle" fill="#374151">0–15s 冷静期：抢不到</text>

  <rect x="520" y="160" width="90" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="565" y="181" font-size="12" text-anchor="middle" fill="#14532d">0–1s 冷静期</text>

  <line x1="220" y1="130" x2="220" y2="200" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="220" y="216" font-size="12" text-anchor="middle" font-weight="bold" fill="#b91c1c">t=15s 可抢</text>

  <line x1="610" y1="130" x2="610" y2="200" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="610" y="216" font-size="12" text-anchor="middle" font-weight="bold" fill="#15803d">t=1s 可抢</text>

  <rect x="70" y="240" width="740" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="440" y="263" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">新引入的风险：TTL 一短，心跳稍有抖动就判死 → holder 还活着，锁已被抢走</text>
  <text x="440" y="285" font-size="12" text-anchor="middle" fill="#b91c1c">两个实例同时跑对账——这比「交接慢 15 秒」贵得多</text>

  <rect x="40" y="320" width="740" height="58" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="343" font-size="13" text-anchor="middle" font-weight="bold" fill="#92400e">调参顺序：先只调 LockDelay（纯收益，不引入误抢），TTL 是风险源留到最后</text>
  <text x="410" y="365" font-size="12" text-anchor="middle" fill="#b45309">LockDelay 随 session 创建逐把指定（默认 15s，须 &gt; 0，可设 0 禁用）；TTL 官方下限 10s，压不到 5s</text>
</svg>
