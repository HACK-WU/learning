<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 C · 默认拒绝：让「忘了授权」表现为被拒，而不是放行</text>

  <rect x="60" y="80" width="360" height="150" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="108" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">default_policy = allow</text>
  <text x="240" y="136" font-size="12" text-anchor="middle" fill="#b91c1c">漏配策略 → 请求通过</text>
  <text x="240" y="158" font-size="12" text-anchor="middle" fill="#b91c1c">表现为：一切正常</text>
  <text x="240" y="182" font-size="12" text-anchor="middle" fill="#b91c1c">发现时机：泄露 / 越权之后</text>
  <text x="240" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">漏配 = 静默漏洞</text>

  <rect x="480" y="80" width="360" height="150" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="108" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">default_policy = deny</text>
  <text x="660" y="136" font-size="12" text-anchor="middle" fill="#15803d">漏配策略 → 请求被拒</text>
  <text x="660" y="158" font-size="12" text-anchor="middle" fill="#15803d">表现为：调不通 / 403</text>
  <text x="660" y="182" font-size="12" text-anchor="middle" fill="#15803d">发现时机：上线那一刻</text>
  <text x="660" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="#16a34a">漏配 = 立刻暴露</text>

  <line x1="420" y1="155" x2="480" y2="155" stroke="#6b7280" stroke-width="3"/>
  <polygon points="480,155 472,149 472,161" fill="#6b7280"/>
  <text x="450" y="145" font-size="11" text-anchor="middle" fill="#4b5563">翻转</text>

  <rect x="60" y="255" width="820" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="460" y="278" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">代价：上线初期一定会有服务因漏配被挡，表现为「调不通」</text>
  <text x="460" y="300" font-size="12" text-anchor="middle" fill="#b91c1c">这是必须付的——方向对了：安全控制的正确姿势就是让「忘了做」表现为失败</text>

  <rect x="60" y="328" width="400" height="40" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="260" y="353" font-size="12" text-anchor="middle" fill="#92400e">匿名 token 的 SecretID 字面量就是 anonymous</text>

  <rect x="480" y="328" width="400" height="40" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="680" y="353" font-size="12" text-anchor="middle" fill="#92400e">ACL / gossip 加密 / TLS 是三件独立的事</text>
</svg>
