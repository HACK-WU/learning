<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 C · envconsul：零改造，但它是「重启生效」不是热更新</text>

  <rect x="50" y="90" width="140" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="115" font-size="14" text-anchor="middle" font-weight="bold" fill="#14532d">KV 变更</text>
  <text x="120" y="134" font-size="11" text-anchor="middle" fill="#15803d">守护模式监听</text>

  <line x1="190" y1="120" x2="280" y2="120" stroke="#16a34a" stroke-width="2"/>
  <polygon points="280,120 272,115 272,125" fill="#16a34a"/>
  <text x="235" y="110" font-size="11" text-anchor="middle" fill="#15803d">约 1 秒</text>

  <rect x="280" y="88" width="170" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="365" y="112" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e3a8a">envconsul</text>
  <text x="365" y="132" font-size="11" text-anchor="middle" fill="#1e40af">渲染为环境变量</text>

  <line x1="450" y1="120" x2="540" y2="120" stroke="#2563eb" stroke-width="2"/>
  <polygon points="540,120 532,115 532,125" fill="#2563eb"/>

  <rect x="540" y="88" width="160" height="64" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="112" font-size="14" text-anchor="middle" font-weight="bold" fill="#92400e">子进程被重启</text>
  <text x="620" y="132" font-size="11" text-anchor="middle" fill="#b45309">注入新环境变量</text>

  <line x1="700" y1="120" x2="780" y2="120" stroke="#d97706" stroke-width="2"/>
  <polygon points="780,120 772,115 772,125" fill="#d97706"/>

  <rect x="780" y="88" width="90" height="64" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="825" y="112" font-size="13" text-anchor="middle" font-weight="bold" fill="#374151">新进程</text>
  <text x="825" y="132" font-size="11" text-anchor="middle" fill="#4b5563">新配置</text>

  <rect x="50" y="180" width="820" height="95" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="460" y="205" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">本质差异：进程内状态、长连接、内存缓存全部丢失</text>
  <text x="460" y="228" font-size="12" text-anchor="middle" fill="#b91c1c">真实延迟 = 子进程重启耗时，不是那 1 秒——若重启要 30 秒，它就是 30 秒</text>
  <text x="460" y="250" font-size="12" text-anchor="middle" fill="#b91c1c">课程实测反直觉点：初稿曾断言「envconsul 不监听变更」，补测推翻——守护模式确实会重启子进程</text>
  <text x="460" y="269" font-size="12" text-anchor="middle" fill="#b91c1c">不适用：持有长连接（WebSocket / gRPC 流）或大内存缓存的进程</text>

  <rect x="50" y="295" width="820" height="60" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="318" font-size="13" text-anchor="middle" font-weight="bold" fill="#92400e">适用：12-factor 无状态应用，随时可重启且重启代价低</text>
  <text x="460" y="340" font-size="12" text-anchor="middle" fill="#b45309">-once 只注入一次后退出（不监听）；守护模式才是「变更即重启」——两种形态别混用</text>
</svg>
