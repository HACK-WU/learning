<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="900" height="390" fill="#ffffff"/>
  <text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">解法 B · agent 代注册：老服务零改造，代价是健康由别人代判断</text>

  <rect x="60" y="90" width="200" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="160" y="116" font-size="14" text-anchor="middle" font-weight="bold" fill="#92400e">遗留服务（2015 Java）</text>
  <text x="160" y="138" font-size="12" text-anchor="middle" fill="#b45309">不会调 API 注册</text>
  <text x="160" y="158" font-size="12" text-anchor="middle" fill="#b45309">本体完全不知情</text>

  <line x1="260" y1="135" x2="360" y2="135" stroke="#2563eb" stroke-width="3"/>
  <polygon points="360,135 352,129 352,141" fill="#2563eb"/>
  <text x="310" y="125" font-size="11" text-anchor="middle" fill="#1d4ed8">agent 代注册</text>

  <rect x="360" y="90" width="180" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="116" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e3a8a">本机 agent</text>
  <text x="450" y="138" font-size="12" text-anchor="middle" fill="#1e40af">代为 register</text>
  <text x="450" y="158" font-size="12" text-anchor="middle" fill="#1e40af">代理健康检查</text>

  <line x1="540" y1="135" x2="640" y2="135" stroke="#2563eb" stroke-width="2"/>
  <polygon points="640,135 632,129 632,141" fill="#2563eb"/>

  <rect x="640" y="90" width="200" height="90" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="740" y="116" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e40af">Consul 服务目录</text>
  <text x="740" y="138" font-size="12" text-anchor="middle" fill="#1e3a8a">inventory → 192.0.2.10</text>
  <text x="740" y="158" font-size="12" text-anchor="middle" fill="#1e3a8a">消费方可见</text>

  <path d="M 450 180 L 450 210 L 160 210 L 160 185" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="160,185 155,193 165,193" fill="#16a34a"/>
  <text x="305" y="228" font-size="11" text-anchor="middle" fill="#15803d">定期探活（HTTP / TCP / TTL）</text>

  <rect x="50" y="250" width="820" height="75" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="460" y="274" font-size="14" text-anchor="middle" font-weight="bold" fill="#991b1b">失效点：健康是 agent 代判断的——「活着」的标准由你写的探针决定</text>
  <text x="460" y="297" font-size="12" text-anchor="middle" fill="#b91c1c">只探端口（TCP）→ 漏掉「进程在但已死锁」；探业务接口 → 需要老服务有可探端点</text>
  <text x="460" y="316" font-size="12" text-anchor="middle" fill="#b91c1c">两种失败：误摘（抖动即摘除）/ 漏摘（死了还挂着）——课程实测 TTL 心跳停止 8 秒摘除</text>

  <rect x="50" y="338" width="820" height="36" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="361" font-size="12" text-anchor="middle" fill="#92400e">适用：改不动的遗留服务——注册动作由 agent 承担，老服务本体不需要知道 Consul 存在</text>
</svg>
