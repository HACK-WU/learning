<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Microsoft YaHei, sans-serif">
<defs>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
</defs>
<rect width="880" height="360" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#202124">同一件事的两种做法：地址写死，还是先问一声</text>

<text x="150" y="66" font-size="15" font-weight="700" text-anchor="middle" fill="#a52714">以前：地址写死在本子上</text>
<text x="610" y="66" font-size="15" font-weight="700" text-anchor="middle" fill="#0d652d">现在：先问一声再打</text>

<rect x="40" y="96" width="220" height="70" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<text x="150" y="126" font-size="14" font-weight="600" text-anchor="middle" fill="#a52714">下单的服务</text>
<text x="150" y="150" font-size="12" text-anchor="middle" fill="#a52714">本子上写着：库存 = 10.0.0.5</text>

<line x1="260" y1="131" x2="470" y2="131" stroke="#d93025" stroke-width="3" marker-end="url(#red)"/>
<text x="365" y="120" font-size="12" text-anchor="middle" fill="#a52714">照着本子打过去</text>

<rect x="474" y="96" width="150" height="70" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
<text x="549" y="122" font-size="14" font-weight="600" text-anchor="middle" fill="#202124">库存 10.0.0.5</text>
<text x="549" y="144" font-size="12" text-anchor="middle" fill="#5f6368">（这一台已经停了）</text>
<line x1="490" y1="120" x2="608" y2="150" stroke="#d93025" stroke-width="3"/>
<line x1="608" y1="120" x2="490" y2="150" stroke="#d93025" stroke-width="3"/>

<rect x="40" y="196" width="220" height="70" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="150" y="226" font-size="14" font-weight="600" text-anchor="middle" fill="#0d652d">下单的服务</text>
<text x="150" y="250" font-size="12" text-anchor="middle" fill="#0d652d">手里只有名字："库存"</text>

<line x1="260" y1="216" x2="398" y2="216" stroke="#188038" stroke-width="3" marker-end="url(#green)"/>
<text x="329" y="206" font-size="12" text-anchor="middle" fill="#0d652d">问：库存现在在哪？</text>

<rect x="402" y="186" width="150" height="80" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
<text x="477" y="214" font-size="14" font-weight="700" text-anchor="middle" fill="#174ea6">一本活的花名册</text>
<text x="477" y="238" font-size="12" text-anchor="middle" fill="#174ea6">谁在、在哪、还活着吗</text>
<text x="477" y="256" font-size="11" text-anchor="middle" fill="#174ea6">都记在这里</text>

<line x1="552" y1="226" x2="700" y2="226" stroke="#188038" stroke-width="3" marker-end="url(#green)"/>
<text x="626" y="216" font-size="12" text-anchor="middle" fill="#0d652d">答：这三台都能用</text>

<rect x="704" y="188" width="150" height="76" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
<text x="779" y="214" font-size="13" font-weight="600" text-anchor="middle" fill="#202124">库存 A</text>
<text x="779" y="234" font-size="13" font-weight="600" text-anchor="middle" fill="#202124">库存 B</text>
<text x="779" y="254" font-size="13" font-weight="600" text-anchor="middle" fill="#202124">库存 C</text>

<line x1="150" y1="266" x2="150" y2="292" stroke="#188038" stroke-width="2" marker-end="url(#green)"/>
<text x="150" y="312" font-size="12" text-anchor="middle" fill="#0d652d">停掉一台，下次问就自动绕开</text>

<rect x="24" y="328" width="836" height="22" rx="6" fill="#f1f3f4" stroke="#dadce0"/>
<text x="36" y="344" font-size="12" fill="#5f6368">差别：上面那台停了就打不通；下面换多少台，问的人都不用改。</text>
</svg>
