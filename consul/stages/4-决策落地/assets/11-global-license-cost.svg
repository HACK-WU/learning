<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" font-family="Segoe UI, Microsoft YaHei, sans-serif">
<defs>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
</defs>
<rect width="880" height="350" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#202124">它是免费的，但不一定是你不用花钱的那个</text>

<text x="440" y="60" font-size="13" font-weight="600" text-anchor="middle" fill="#5f6368">往右走一步，门槛就高一层</text>

<rect x="24" y="78" width="256" height="150" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="152" y="106" font-size="14" font-weight="700" text-anchor="middle" fill="#0d652d">自己用、自己改</text>
<text x="152" y="134" font-size="12" text-anchor="middle" fill="#0d652d">✓ 不用交钱</text>
<text x="152" y="158" font-size="12" text-anchor="middle" fill="#0d652d">✓ 随便改，随便看源码</text>
<text x="152" y="182" font-size="12" text-anchor="middle" fill="#0d652d">✓ 出事了自己扛，也能自己修</text>
<text x="152" y="206" font-size="12" text-anchor="middle" fill="#0d652d">（这一档最省心）</text>

<line x1="280" y1="153" x2="308" y2="153" stroke="#188038" stroke-width="3" marker-end="url(#green)"/>

<rect x="312" y="78" width="256" height="150" rx="12" fill="#fef7e0" stroke="#f29900" stroke-width="2"/>
<text x="440" y="106" font-size="14" font-weight="700" text-anchor="middle" fill="#b06000">拿它去卖钱</text>
<text x="440" y="134" font-size="12" text-anchor="middle" fill="#7a4a00">△ 得看清楚条款写给谁</text>
<text x="440" y="158" font-size="12" text-anchor="middle" fill="#7a4a00">△ 说"不许卖"，通常指</text>
<text x="440" y="182" font-size="12" text-anchor="middle" fill="#7a4a00">　 不许把它当产品卖</text>
<text x="440" y="206" font-size="12" text-anchor="middle" fill="#7a4a00">　 不是不许靠它挣钱</text>

<line x1="568" y1="153" x2="596" y2="153" stroke="#d93025" stroke-width="3" marker-end="url(#red)"/>

<rect x="600" y="78" width="256" height="150" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<text x="728" y="106" font-size="14" font-weight="700" text-anchor="middle" fill="#a52714">用到企业版才有的功能</text>
<text x="728" y="134" font-size="12" text-anchor="middle" fill="#a52714">✗ 免费版里没有</text>
<text x="728" y="158" font-size="12" text-anchor="middle" fill="#a52714">✗ 得谈合同、按量付费</text>
<text x="728" y="182" font-size="12" text-anchor="middle" fill="#a52714">✗ 一年一签，会涨</text>
<text x="728" y="206" font-size="12" text-anchor="middle" fill="#a52714">（这一档才真花钱）</text>

<rect x="24" y="246" width="836" height="82" rx="12" fill="#f8f9fa" stroke="#5f6368" stroke-width="2"/>
<text x="44" y="274" font-size="13" font-weight="700" fill="#202124">真正的账，往往不在"买不买"，而在"走不走得掉"</text>
<text x="44" y="298" font-size="12" fill="#5f6368">• 人来人去：会用它的人好不好招、好不好带</text>
<text x="44" y="316" font-size="12" fill="#5f6368">• 换的代价：哪天想换，要动多少代码、停多久业务</text>
<text x="440" y="298" font-size="12" fill="#5f6368">• 谁说了算：条款改了、项目不维护了，你只能跟着</text>
<text x="440" y="316" font-size="12" fill="#5f6368">• 越用越深 → 越难走 —— 这笔账最容易被漏掉</text>
</svg>
