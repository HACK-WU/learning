<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="900" height="330" fill="#fbfcfd"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">场景1 朴素做法：只写 ingress-gateway 配置，期待它自己工作</text>

  <rect x="60" y="70" width="200" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Consul 控制面</text>
  <text x="160" y="122" text-anchor="middle" font-size="12" fill="#0d47a1">ingress-gateway 配置</text>
  <text x="160" y="142" text-anchor="middle" font-size="12" fill="#1565c0">Listener: 19180 / http</text>

  <line x1="265" y1="115" x2="345" y2="115" stroke="#90a4ae" stroke-width="2" marker-end="url(#ar)"/>
  <text x="305" y="105" text-anchor="middle" font-size="11" fill="#546e7a">写入</text>

  <rect x="350" y="70" width="210" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="455" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">返回 true</text>
  <text x="455" y="122" text-anchor="middle" font-size="12" fill="#2e7d32">Config entry written</text>
  <text x="455" y="142" text-anchor="middle" font-size="12" fill="#2e7d32">看起来"成功了"</text>

  <line x1="565" y1="115" x2="645" y2="115" stroke="#90a4ae" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="650" y="70" width="200" height="90" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="750" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">端口 19180</text>
  <text x="750" y="122" text-anchor="middle" font-size="12" fill="#c62828">ss -tln 无输出</text>
  <text x="750" y="142" text-anchor="middle" font-size="12" fill="#c62828">没有任何进程监听</text>

  <rect x="60" y="200" width="790" height="100" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="80" y="228" font-size="14" font-weight="bold" fill="#e65100">错在哪：把"配置条目"当成了"进程"</text>
  <text x="80" y="252" font-size="12.5" fill="#4e342e">ingress-gateway 描述的是「应当有这样一个网关」，不是「已经有了」。</text>
  <text x="80" y="274" font-size="12.5" fill="#4e342e">Consul 只负责算路由表；真正监听端口、转发字节的是 Envoy 进程。</text>
  <text x="80" y="292" font-size="12.5" fill="#b71c1c" font-weight="bold">写入成功 = 路由表被接受；不等于有东西在按它转发。</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
