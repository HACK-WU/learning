<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Microsoft YaHei, sans-serif">
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/></marker>
</defs>
<rect width="880" height="360" fill="#ffffff"/>
<text x="24" y="36" font-size="18" font-weight="700" fill="#202124">① 基础版：读请求一律打向 leader（default）</text>

<rect x="24" y="150" width="132" height="72" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
<text x="90" y="180" font-size="15" font-weight="600" text-anchor="middle" fill="#202124">应用</text>
<text x="90" y="202" font-size="12" text-anchor="middle" fill="#5f6368">consul_client</text>

<line x1="156" y1="186" x2="296" y2="186" stroke="#1a73e8" stroke-width="3" marker-end="url(#blue)"/>
<text x="226" y="174" font-size="12" text-anchor="middle" fill="#1a73e8">default 读</text>

<rect x="300" y="148" width="150" height="76" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
<text x="375" y="176" font-size="14" font-weight="700" text-anchor="middle" fill="#174ea6">node1 · LEADER</text>
<text x="375" y="200" font-size="12" text-anchor="middle" fill="#174ea6">状态机（最新值）</text>

<rect x="500" y="148" width="150" height="76" rx="10" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="2"/>
<text x="575" y="176" font-size="14" font-weight="600" text-anchor="middle" fill="#3c4043">node2 · follower</text>
<text x="575" y="200" font-size="12" text-anchor="middle" fill="#5f6368">副本（可能落后）</text>

<rect x="700" y="148" width="150" height="76" rx="10" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="2"/>
<text x="775" y="176" font-size="14" font-weight="600" text-anchor="middle" fill="#3c4043">node3 · follower</text>
<text x="775" y="200" font-size="12" text-anchor="middle" fill="#5f6368">副本（可能落后）</text>

<line x1="450" y1="170" x2="496" y2="170" stroke="#9aa0a6" stroke-width="2" marker-end="url(#grey)"/>
<line x1="650" y1="170" x2="696" y2="170" stroke="#9aa0a6" stroke-width="2" marker-end="url(#grey)"/>

<text x="575" y="266" font-size="12" text-anchor="middle" fill="#5f6368">Raft 复制：写必须先经 leader，再分发给 follower —— 所以 follower 天然落后一步</text>
<text x="24" y="316" font-size="13" fill="#5f6368">本步形态：读永远由 leader 应答，数据一定最新；代价是读压力全压在一个节点上。</text>
</svg>
