<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Segoe UI, Microsoft YaHei, sans-serif">
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f29900"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/></marker>
</defs>
<rect width="880" height="400" fill="#ffffff"/>
<text x="24" y="36" font-size="18" font-weight="700" fill="#202124">② 综合版：按用途分流 —— stale 让 follower 也能应答（高亮 = 本步新增）</text>

<rect x="24" y="168" width="132" height="72" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
<text x="90" y="196" font-size="15" font-weight="600" text-anchor="middle" fill="#202124">应用</text>
<text x="90" y="218" font-size="12" text-anchor="middle" fill="#5f6368">服务发现 / 读配置</text>

<line x1="156" y1="198" x2="496" y2="172" stroke="#f29900" stroke-width="3" marker-end="url(#amber)"/>
<text x="330" y="168" font-size="12" fill="#b06000">stale 读（服务发现）</text>
<line x1="156" y1="212" x2="696" y2="190" stroke="#f29900" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#amber)"/>
<text x="400" y="252" font-size="12" fill="#b06000">stale 读（也可落到 node3）</text>
<line x1="156" y1="186" x2="296" y2="186" stroke="#1a73e8" stroke-width="3" marker-end="url(#blue)"/>
<text x="226" y="176" font-size="12" fill="#1a73e8">default 读（配置）</text>

<rect x="300" y="148" width="150" height="76" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
<text x="375" y="176" font-size="14" font-weight="700" text-anchor="middle" fill="#174ea6">node1 · LEADER</text>
<text x="375" y="200" font-size="12" text-anchor="middle" fill="#174ea6">状态机（最新值）</text>

<rect x="500" y="130" width="150" height="76" rx="10" fill="#fef7e0" stroke="#f29900" stroke-width="3"/>
<text x="575" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#b06000">node2 · follower</text>
<text x="575" y="182" font-size="12" text-anchor="middle" fill="#b06000">本步起可直接应答</text>

<rect x="700" y="148" width="150" height="76" rx="10" fill="#fef7e0" stroke="#f29900" stroke-width="3"/>
<text x="775" y="176" font-size="14" font-weight="700" text-anchor="middle" fill="#b06000">node3 · follower</text>
<text x="775" y="200" font-size="12" text-anchor="middle" fill="#b06000">本步起可直接应答</text>

<line x1="450" y1="170" x2="496" y2="170" stroke="#9aa0a6" stroke-width="2" marker-end="url(#grey)"/>
<line x1="650" y1="170" x2="696" y2="170" stroke="#9aa0a6" stroke-width="2" marker-end="url(#grey)"/>

<rect x="300" y="288" width="550" height="56" rx="8" fill="#fef7e0" stroke="#f29900" stroke-width="2"/>
<text x="316" y="310" font-size="13" font-weight="600" fill="#b06000">本步解决了什么：leader 换届的 9.5 秒里 default/consistent 全返 500，stale 仍在返回旧值</text>
<text x="316" y="330" font-size="12" fill="#7a4a00">旧多少不靠猜 —— 响应头 X-Consul-LastContact（毫秒）会明确告诉你</text>

<text x="24" y="374" font-size="13" fill="#5f6368">本步形态：读压力从 leader 一个点，摊到全部节点（高亮的两台 follower 开始干活）。</text>
</svg>
