<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="sans-serif">
  <rect width="880" height="340" fill="#fdfdfd"/>
  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold">③ 边界：路由表算得对，不等于流量真的按它走</text>

  <rect x="40" y="60" width="240" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="160" y="85" text-anchor="middle" font-size="13" font-weight="bold">控制面（Consul）</text>
  <text x="160" y="108" text-anchor="middle" font-size="11">discovery chain 解析</text>
  <text x="160" y="128" text-anchor="middle" font-size="11" font-family="monospace">90% → v1　10% → v2</text>
  <text x="160" y="148" text-anchor="middle" font-size="10" fill="#2e7d32">✅ 本篇已实测</text>

  <line x1="280" y1="110" x2="360" y2="110" stroke="#555" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="360,110 352,105 352,115" fill="#555"/>
  <text x="320" y="100" text-anchor="middle" font-size="10">下发</text>

  <rect x="370" y="60" width="240" height="100" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="490" y="85" text-anchor="middle" font-size="13" font-weight="bold">数据面（Envoy sidecar）</text>
  <text x="490" y="108" text-anchor="middle" font-size="11">真正执行转发的组件</text>
  <text x="490" y="130" text-anchor="middle" font-size="11" fill="#c62828">本机未安装 Envoy</text>
  <text x="490" y="150" text-anchor="middle" font-size="10" fill="#c62828">❌ 本篇未实测</text>

  <line x1="610" y1="110" x2="690" y2="110" stroke="#555" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="690,110 682,105 682,115" fill="#555"/>

  <rect x="700" y="60" width="145" height="100" rx="6" fill="#f5f5f5" stroke="#999"/>
  <text x="772" y="85" text-anchor="middle" font-size="12" font-weight="bold">真实流量</text>
  <text x="772" y="108" text-anchor="middle" font-size="11">9 : 1 是否成立</text>
  <text x="772" y="130" text-anchor="middle" font-size="10" fill="#c62828">无法验证</text>

  <rect x="40" y="190" width="805" height="130" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="60" y="215" font-size="13" font-weight="bold">同一个边界，在网关上更明显：配置写进去了，网关并不存在</text>
  <text x="60" y="240" font-size="11" font-family="monospace">$ consul config write gw.hcl</text>
  <text x="60" y="258" font-size="11" font-family="monospace">Config entry written: ingress-gateway/ingress-web　← 成功</text>
  <text x="60" y="278" font-size="11" font-family="monospace">$ ss -tln | grep :8080</text>
  <text x="60" y="296" font-size="11" font-family="monospace">（无输出）← 8080 没有任何进程监听</text>
  <text x="60" y="316" font-size="11">ingress-gateway 描述的是"应当有这样一个网关"，不是"已经有了一个"。让它活起来需要跑 Envoy 的网关进程。</text>
</svg>
