<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="sans-serif">
  <rect width="880" height="320" fill="#fdfdfd"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold">① 基础实现：直接按服务名切分 —— 两条路都走不通</text>

  <rect x="40" y="70" width="150" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="115" y="98" text-anchor="middle" font-size="13" font-weight="bold">service-splitter</text>
  <text x="115" y="118" text-anchor="middle" font-size="11">Weight 90 / 10</text>

  <line x1="190" y1="100" x2="270" y2="100" stroke="#555" stroke-width="2"/>
  <polygon points="270,100 262,95 262,105" fill="#555"/>

  <rect x="280" y="70" width="150" height="60" rx="6" fill="#fff3e0" stroke="#e65100"/>
  <text x="355" y="98" text-anchor="middle" font-size="13" font-weight="bold">Service = "web"</text>
  <text x="355" y="118" text-anchor="middle" font-size="11">两个 split 目标相同</text>

  <line x1="430" y1="100" x2="510" y2="100" stroke="#c62828" stroke-width="2"/>
  <polygon points="510,100 502,95 502,105" fill="#c62828"/>

  <rect x="520" y="60" width="320" height="80" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="680" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">写入被拒（HTTP 500）</text>
  <text x="680" y="106" text-anchor="middle" font-size="11" font-family="monospace">protocol "tcp" does not permit</text>
  <text x="680" y="124" text-anchor="middle" font-size="11" font-family="monospace">advanced routing or splitting</text>

  <rect x="40" y="185" width="800" height="105" rx="6" fill="#f5f5f5" stroke="#999"/>
  <text x="60" y="208" font-size="13" font-weight="bold">为什么走不通：三个独立的前提都没满足</text>
  <text x="60" y="232" font-size="12">1. 协议默认是 tcp（四层），Consul 无法理解"HTTP 请求"，也就无法按比例切分 → 必须先声明 Protocol = "http"</text>
  <text x="60" y="256" font-size="12">2. 两个 split 都指向 Service = "web"，是同一个目标，Weight 不同也区分不了版本 → 必须用 Subset 区分</text>
  <text x="60" y="280" font-size="12">3. 权重和必须等于 100，写 90 会被直接拒绝 → the sum of all split weights must be 100</text>
</svg>
