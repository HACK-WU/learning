<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="760" fill="#f8fafc"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">课 2 一眼全局：集群养得住的三件事</text>
  <text x="550" y="66" text-anchor="middle" font-size="15" fill="#64748b">健康怎么看 → 节点怎么上下 → 异常怎么处置</text>

  <!-- 模块 1：健康读数 -->
  <rect x="40" y="92" width="330" height="270" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="205" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">① 健康怎么看</text>
  <text x="205" y="142" text-anchor="middle" font-size="13" fill="#64748b">不看进程，看这四处读数</text>

  <rect x="62" y="158" width="286" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="180" font-size="13" fill="#1e40af">/v1/status/leader → 谁是 leader</text>

  <rect x="62" y="198" width="286" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="220" font-size="13" fill="#1e40af">raft list-peers → 几个 voter</text>

  <rect x="62" y="238" width="286" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="260" font-size="13" fill="#1e40af">autopilot health → 容错余量</text>

  <rect x="62" y="278" width="286" height="60" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="76" y="298" font-size="13" font-weight="bold" fill="#991b1b">写一笔 KV → 真验收</text>
  <text x="76" y="318" font-size="12" fill="#dc2626">指标 consul_autopilot_healthy 恒 0</text>
  <text x="76" y="334" font-size="12" fill="#dc2626">API 才是权威，别照抄指标配告警</text>

  <!-- 模块 2：节点上下线 -->
  <rect x="385" y="92" width="330" height="270" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="550" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#6d28d9">② 节点怎么上下</text>
  <text x="550" y="142" text-anchor="middle" font-size="13" fill="#64748b">三种方式，三种状态</text>

  <rect x="407" y="158" width="286" height="46" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="421" y="178" font-size="13" font-weight="bold" fill="#4c1d95">consul leave（优雅）</text>
  <text x="421" y="196" font-size="12" fill="#6d28d9">状态 = left，主动告别</text>

  <rect x="407" y="210" width="286" height="46" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="421" y="230" font-size="13" font-weight="bold" fill="#4c1d95">kill -9（强杀）</text>
  <text x="421" y="248" font-size="12" fill="#6d28d9">状态 = failed，别人发现它没了</text>

  <rect x="407" y="262" width="286" height="76" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="421" y="282" font-size="13" font-weight="bold" fill="#4c1d95">扩容：新节点先当非 voter</text>
  <text x="421" y="302" font-size="12" fill="#6d28d9">Voter=false → 稳定 10s → true</text>
  <text x="421" y="322" font-size="12" fill="#6d28d9">5 节点后 FailureTolerance 才变 2</text>

  <!-- 模块 3：异常处置 -->
  <rect x="730" y="92" width="330" height="270" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="895" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">③ 异常怎么处置</text>
  <text x="895" y="142" text-anchor="middle" font-size="13" fill="#64748b">先判多数派还是少数派</text>

  <rect x="752" y="158" width="286" height="46" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="766" y="178" font-size="13" font-weight="bold" fill="#065f46">leader 震荡</text>
  <text x="766" y="196" font-size="12" fill="#059669">实测 7~9 秒选出新 leader</text>

  <rect x="752" y="210" width="286" height="46" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="766" y="230" font-size="13" font-weight="bold" fill="#065f46">节点失联（failed）</text>
  <text x="766" y="248" font-size="12" fill="#059669">autopilot 自动清理 dead voter</text>

  <rect x="752" y="262" width="286" height="76" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="766" y="282" font-size="13" font-weight="bold" fill="#991b1b">脑裂？不会发生</text>
  <text x="766" y="302" font-size="12" fill="#dc2626">多数派(2/3) 可写 HTTP=200</text>
  <text x="766" y="322" font-size="12" fill="#dc2626">少数派(1/3) 写 HTTP=500 被拒</text>

  <!-- 底部：判定流程 -->
  <rect x="40" y="392" width="1020" height="160" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="420" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">出事了先问一句：我是多数派还是少数派？</text>

  <rect x="70" y="440" width="230" height="90" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="185" y="464" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">存活 server ≥ quorum？</text>
  <text x="185" y="490" text-anchor="middle" font-size="12" fill="#334155">3 台 → 要 ≥ 2 台</text>
  <text x="185" y="510" text-anchor="middle" font-size="12" fill="#334155">5 台 → 要 ≥ 3 台</text>

  <path d="M304,485 L370,485" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="337" y="476" text-anchor="middle" font-size="12" fill="#64748b">是</text>

  <rect x="374" y="440" width="250" height="90" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="499" y="464" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">多数派：能写</text>
  <text x="499" y="488" text-anchor="middle" font-size="12" fill="#334155">短暂选举抖动后恢复</text>
  <text x="499" y="508" text-anchor="middle" font-size="12" fill="#334155">优先保这一侧，别急着重启</text>

  <path d="M628,485 L694,485" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="661" y="476" text-anchor="middle" font-size="12" fill="#64748b">否</text>

  <rect x="698" y="440" width="330" height="90" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="863" y="464" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">少数派：只读都拒绝</text>
  <text x="863" y="488" text-anchor="middle" font-size="12" fill="#334155">这是 Raft 在保护数据，不是故障</text>
  <text x="863" y="508" text-anchor="middle" font-size="12" fill="#334155">动作是恢复连通，不是改配置</text>

  <!-- 底部提示 -->
  <rect x="40" y="576" width="1020" height="150" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="550" y="604" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">本机实测：指标不可信，API 才可信</text>
  <text x="70" y="634" font-size="13" fill="#334155">同一时刻，三个节点都说 Healthy=true、FailureTolerance=1，集群也确实健康 ——</text>
  <text x="70" y="656" font-size="13" fill="#334155">但 Prometheus 端点里 consul_autopilot_healthy 恒为 0，连 leader 自己的 consul_server_isLeader 也是 0。</text>
  <text x="70" y="684" font-size="13" font-weight="bold" fill="#dc2626">若照抄 consul_autopilot_healthy &lt; 1 配告警 → 永久误报；反过来以为它 1 才健康 → 永远不告警。</text>
  <text x="70" y="708" font-size="13" fill="#0f172a">判健康走 API（/v1/operator/autopilot/health），指标只用于观测趋势 —— 详见课 6 三步核验。</text>
</svg>
