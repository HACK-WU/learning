<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="820" fill="#f8fafc"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">课 6 一眼全局：监控指标与告警</text>
  <text x="550" y="66" text-anchor="middle" font-size="15" fill="#64748b">指标从哪来 → 哪些能用 → 告警怎么写才不会骗你</text>

  <!-- 模块 1：暴露方式 -->
  <rect x="40" y="92" width="330" height="270" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="205" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">① 指标暴露</text>
  <text x="205" y="142" text-anchor="middle" font-size="13" fill="#64748b">两个端点，值还不一样</text>

  <rect x="62" y="158" width="286" height="46" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="177" font-size="13" font-weight="bold" fill="#1e40af">Prometheus 端点</text>
  <text x="76" y="195" font-size="12" fill="#1d4ed8">?format=prometheus → 528 条</text>

  <rect x="62" y="210" width="286" height="46" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="229" font-size="13" font-weight="bold" fill="#1e40af">JSON 端点</text>
  <text x="76" y="247" font-size="12" fill="#1d4ed8">默认 → 键名点分，值不同</text>

  <rect x="62" y="262" width="286" height="84" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="76" y="282" font-size="13" font-weight="bold" fill="#991b1b">同一指标两个值！</text>
  <text x="76" y="301" font-size="12" fill="#dc2626">Prometheus: raft_last_index = 0</text>
  <text x="76" y="319" font-size="12" fill="#dc2626">JSON:       raft.last_index = 85</text>
  <text x="76" y="337" font-size="12" fill="#dc2626">权威(CLI):  commit index   = 85</text>

  <!-- 模块 2：双重命名 -->
  <rect x="385" y="92" width="330" height="270" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="550" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#991b1b">② 双重命名（最大陷阱）</text>
  <text x="550" y="142" text-anchor="middle" font-size="13" fill="#64748b">46%~51% 的指标恒为 0</text>

  <rect x="407" y="158" width="286" height="56" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="421" y="178" font-size="13" font-weight="bold" fill="#991b1b">无前缀 = 空壳（恒 0）</text>
  <text x="421" y="197" font-size="12" fill="#dc2626">consul_autopilot_healthy  → 0</text>
  <text x="421" y="208" font-size="12" fill="#dc2626">consul_server_isLeader    → 0</text>

  <rect x="407" y="220" width="286" height="56" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="421" y="240" font-size="13" font-weight="bold" fill="#065f46">带主机名前缀 = 真实值</text>
  <text x="421" y="259" font-size="12" fill="#059669">consul_VWYPGWU_PC5_autopilot_healthy → 1</text>
  <text x="421" y="270" font-size="12" fill="#059669">consul_VWYPGWU_PC5_server_isLeader  → 1</text>

  <rect x="407" y="282" width="286" height="64" rx="6" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="421" y="301" font-size="12" font-weight="bold" fill="#92400e">主机名哪来的</text>
  <text x="421" y="319" font-size="12" fill="#334155">hostname = VWYPGWU-PC5</text>
  <text x="421" y="337" font-size="12" fill="#334155">横杠换下划线即前缀</text>

  <!-- 模块 3：告警错法 -->
  <rect x="730" y="92" width="330" height="270" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="895" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#6d28d9">③ 告警的两种错法</text>
  <text x="895" y="142" text-anchor="middle" font-size="13" fill="#64748b">同样用错指标，后果相反</text>

  <rect x="752" y="158" width="286" height="84" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="766" y="178" font-size="13" font-weight="bold" fill="#991b1b">错法 A：写 == 0</text>
  <text x="766" y="197" font-size="12" fill="#dc2626">健康时也等于 0 → 一直告警</text>
  <text x="766" y="215" font-size="12" fill="#dc2626">告警疲劳 → 真故障被忽略</text>
  <text x="766" y="234" font-size="12" font-weight="bold" fill="#991b1b">= 永久误报</text>

  <rect x="752" y="248" width="286" height="98" rx="6" fill="#7f1d1d" stroke="#dc2626"/>
  <text x="766" y="268" font-size="13" font-weight="bold" fill="#fee2e2">错法 B：写 &gt; 0（最危险）</text>
  <text x="766" y="287" font-size="12" fill="#fecaca">恒 0，永远不可能 &gt; 0</text>
  <text x="766" y="305" font-size="12" fill="#fecaca">集群真挂了也不响</text>
  <text x="766" y="324" font-size="12" font-weight="bold" fill="#fca5a5">= 静默失效</text>
  <text x="766" y="340" font-size="12" fill="#fecaca">你以为有人看着，其实没有</text>

  <!-- 三步核验 -->
  <rect x="40" y="382" width="1020" height="118" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="550" y="410" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">写告警前必须做的三步核验（缺一不可）</text>

  <rect x="70" y="426" width="310" height="58" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="225" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">① 看实际值域</text>
  <text x="225" y="467" text-anchor="middle" font-size="12" fill="#334155">curl 看数值是否落在预期区间</text>

  <path d="M386,455 L416,455" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="420" y="426" width="310" height="58" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="575" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">② 读 HELP 行</text>
  <text x="575" y="467" text-anchor="middle" font-size="12" fill="#334155">确认语义与计数/瞬时类型</text>

  <path d="M736,455 L766,455" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="770" y="426" width="258" height="58" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="899" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">③ 连续采样 3~5 次</text>
  <text x="899" y="467" text-anchor="middle" font-size="12" fill="#334155">单调递增=计数，有升有降=瞬时</text>

  <!-- 可信指标清单 -->
  <rect x="40" y="518" width="500" height="276" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="290" y="546" text-anchor="middle" font-size="17" font-weight="bold" fill="#0e7490">实测可用的告警指标（带前缀）</text>
  <text x="70" y="574" font-size="12" fill="#334155">consul_&lt;HOST&gt;_server_isLeader       leader=1 / follower=0（可信）</text>
  <text x="70" y="596" font-size="12" fill="#334155">consul_&lt;HOST&gt;_autopilot_healthy      1=健康（可信）</text>
  <text x="70" y="618" font-size="12" fill="#334155">consul_&lt;HOST&gt;_autopilot_failure_tolerance  实测=1</text>
  <text x="70" y="640" font-size="12" fill="#334155">consul_&lt;HOST&gt;_members_servers        实测=3（数节点）</text>
  <text x="70" y="662" font-size="12" fill="#334155">consul_&lt;HOST&gt;_raft_last_index / applied_index</text>
  <text x="86" y="680" font-size="12" fill="#059669">→ 差值 = FSM 落后，实测恒为 0（本机无压力）</text>
  <text x="70" y="706" font-size="12" fill="#334155">consul_&lt;HOST&gt;_runtime_num_goroutines  实测 116~197</text>
  <text x="70" y="728" font-size="12" fill="#334155">consul_&lt;HOST&gt;_runtime_alloc_bytes     实测约 19 MB</text>
  <text x="70" y="756" font-size="12" font-weight="bold" fill="#0e7490">兜底：/v1/operator/autopilot/health API</text>
  <text x="86" y="776" font-size="12" fill="#334155">指标不可信时用它，实测 Healthy=True FT=1</text>

  <!-- 建议告警 -->
  <rect x="560" y="518" width="500" height="276" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="810" y="546" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">推荐告警写法（用通配避开主机名）</text>

  <rect x="586" y="562" width="448" height="60" rx="6" fill="#ffffff" stroke="#fbbf24"/>
  <text x="600" y="582" font-size="12" font-weight="bold" fill="#b45309">无 leader</text>
  <text x="600" y="600" font-size="11" font-family="monospace" fill="#334155">sum({__name__=~"consul_.*_server_isLeader"}) != 1</text>
  <text x="600" y="615" font-size="11" fill="#059669">实测：三节点求和=1 → 正常</text>

  <rect x="586" y="630" width="448" height="60" rx="6" fill="#ffffff" stroke="#fbbf24"/>
  <text x="600" y="650" font-size="12" font-weight="bold" fill="#b45309">server 节点丢失</text>
  <text x="600" y="668" font-size="11" font-family="monospace" fill="#334155">consul_.*_members_servers &lt; 3（按实际节点数）</text>
  <text x="600" y="683" font-size="11" fill="#059669">实测：挂 1 台后降为 2 → 触发</text>

  <rect x="586" y="698" width="448" height="60" rx="6" fill="#ffffff" stroke="#fbbf24"/>
  <text x="600" y="718" font-size="12" font-weight="bold" fill="#b45309">FSM 应用落后</text>
  <text x="600" y="736" font-size="11" font-family="monospace" fill="#334155">raft_last_index - raft_applied_index &gt; 100</text>
  <text x="600" y="751" font-size="11" fill="#64748b">本机实测差值恒为 0（无压力），阈值需自测</text>

  <rect x="586" y="762" width="448" height="20" rx="4" fill="#fef2f2"/>
  <text x="600" y="777" font-size="11" font-weight="bold" fill="#dc2626">禁止用无前缀指标名写任何告警</text>
</svg>
