<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="720" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">课 1 一眼全局：从"能跑"到"能上生产"</text>
  <text x="550" y="70" text-anchor="middle" font-size="15" fill="#64748b">三个决策定死拓扑 → 一份配置落地 → 上线自检四关</text>

  <!-- Step 1: 规模与拓扑 -->
  <rect x="40" y="100" width="320" height="230" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">① 规模与拓扑</text>
  <text x="200" y="152" text-anchor="middle" font-size="13" fill="#64748b">先定死，后面全按它走</text>

  <circle cx="100" cy="200" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">3</text>
  <text x="100" y="245" text-anchor="middle" font-size="13" fill="#334155">server 奇数台</text>
  <text x="100" y="263" text-anchor="middle" font-size="12" fill="#64748b">quorum = 2</text>
  <text x="100" y="280" text-anchor="middle" font-size="12" fill="#dc2626">坏 1 台仍可用</text>

  <circle cx="200" cy="200" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">5</text>
  <text x="200" y="245" text-anchor="middle" font-size="13" fill="#334155">server 奇数台</text>
  <text x="200" y="263" text-anchor="middle" font-size="12" fill="#64748b">quorum = 3</text>
  <text x="200" y="280" text-anchor="middle" font-size="12" fill="#dc2626">坏 2 台仍可用</text>

  <circle cx="300" cy="200" r="26" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="300" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">N</text>
  <text x="300" y="245" text-anchor="middle" font-size="13" fill="#334155">client agent</text>
  <text x="300" y="263" text-anchor="middle" font-size="12" fill="#64748b">每台业务机 1 个</text>
  <text x="300" y="280" text-anchor="middle" font-size="12" fill="#64748b">不承担 quorum</text>

  <text x="200" y="312" text-anchor="middle" font-size="13" fill="#0f172a">4 台 = 3 台的容错，白付一台的钱</text>

  <!-- Step 2: 配置落地 -->
  <rect x="390" y="100" width="320" height="230" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="550" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#6d28d9">② 配置落地</text>
  <text x="550" y="152" text-anchor="middle" font-size="13" fill="#64748b">HCL 文件，不用一长串命令行</text>

  <rect x="412" y="170" width="276" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="426" y="190" font-size="13" fill="#4c1d95">server = true</text>
  <text x="560" y="190" font-size="12" fill="#64748b">→ 这台是 server</text>

  <rect x="412" y="206" width="276" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="426" y="226" font-size="13" fill="#4c1d95">bootstrap_expect = 3</text>
  <text x="620" y="226" font-size="12" fill="#64748b">→ 等够 3 台才选主</text>

  <rect x="412" y="242" width="276" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="426" y="262" font-size="13" fill="#4c1d95">retry_join = [...]</text>
  <text x="580" y="262" font-size="12" fill="#64748b">→ 自己找到同伴</text>

  <rect x="412" y="278" width="276" height="30" rx="6" fill="#fee2e2" stroke="#f87171"/>
  <text x="426" y="298" font-size="13" fill="#991b1b">serf_wan = -1</text>
  <text x="580" y="298" font-size="12" fill="#dc2626">→ 单机多实例必关</text>

  <!-- Step 3: 上线自检 -->
  <rect x="740" y="100" width="320" height="230" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="900" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">③ 上线自检</text>
  <text x="900" y="152" text-anchor="middle" font-size="13" fill="#64748b">进程活着 ≠ 集群可用</text>

  <rect x="762" y="170" width="276" height="30" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="776" y="190" font-size="13" fill="#065f46">consul members</text>
  <text x="960" y="190" font-size="12" fill="#059669">3 alive</text>

  <rect x="762" y="206" width="276" height="30" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="776" y="226" font-size="13" fill="#065f46">raft list-peers</text>
  <text x="960" y="226" font-size="12" fill="#059669">1 leader</text>

  <rect x="762" y="242" width="276" height="30" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="776" y="262" font-size="13" fill="#065f46">autopilot health</text>
  <text x="960" y="262" font-size="12" fill="#059669">Healthy</text>

  <rect x="762" y="278" width="276" height="30" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="776" y="298" font-size="13" fill="#065f46">写一笔再读回来</text>
  <text x="960" y="298" font-size="12" fill="#059669">quorum 真通</text>

  <!-- arrows -->
  <path d="M364,215 L386,215" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M714,215 L736,215" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- bottom: 本机实测的两个坑 -->
  <rect x="40" y="360" width="1020" height="300" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="392" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">本机实测：两个"看起来像配置错，其实是平台限制"的坑</text>

  <rect x="70" y="412" width="470" height="225" rx="10" fill="#ffffff" stroke="#fbbf24"/>
  <text x="305" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">坑 1：Windows 跑不了 server 模式</text>
  <text x="90" y="468" font-size="13" fill="#334155">现象：换路径、换盘、管理员权限都试过，一律报：</text>
  <text x="90" y="492" font-size="12" font-family="Consolas, monospace" fill="#dc2626">sync ...\raft\wal: Access is denied</text>
  <text x="90" y="520" font-size="13" fill="#334155">定位：dev 模式能起（走内存，不建 WAL）</text>
  <text x="90" y="542" font-size="13" fill="#334155">→ 磁盘持久化的 server 模式在这台机器上不成立</text>
  <text x="90" y="570" font-size="13" fill="#0f172a" font-weight="bold">结论：Windows 不是 Consul server 的生产平台</text>
  <text x="90" y="596" font-size="13" fill="#334155">本课实操改走 WSL Ubuntu 24.04（Linux 才是真实生产环境）</text>
  <text x="90" y="620" font-size="12" fill="#64748b">这不是绕路——它本身就是运维第一课：先确认平台在不在受支持清单里</text>

  <rect x="560" y="412" width="470" height="225" rx="10" fill="#ffffff" stroke="#fbbf24"/>
  <text x="795" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">坑 2：一台机器起 3 个实例，端口打架</text>
  <text x="580" y="468" font-size="13" fill="#334155">现象：server 起一半退出，日志报：</text>
  <text x="580" y="492" font-size="12" font-family="Consolas, monospace" fill="#dc2626">listen tcp ...:9401: address already in use</text>
  <text x="580" y="520" font-size="13" fill="#334155">根因：WAN Serf 绑到 client_addr，三个实例抢同一个口</text>
  <text x="580" y="542" font-size="13" fill="#334155">且 gRPC-TLS 端口固定 8503，不受 ports 块控制</text>
  <text x="580" y="570" font-size="13" fill="#0f172a" font-weight="bold">对策：serf_wan = -1 关掉，gRPC-TLS 单独给端口</text>
  <text x="580" y="596" font-size="13" fill="#334155">生产上三台各占一台机器，本坑自动消失</text>
  <text x="580" y="620" font-size="12" fill="#64748b">但"同机多实例"是本地演练集群的常态，值得记住</text>
</svg>
