<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <defs>
    <marker id="l11" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="440" fill="#fafafa"/>
  <text x="30" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">调用运行时：一个 Invocation，四本账</text>

  <!-- 中心 -->
  <rect x="330" y="160" width="220" height="110" rx="10" fill="#263238" stroke="#455a64"/>
  <text x="348" y="188" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">Invocation</text>
  <text x="348" y="210" font-family="sans-serif" font-size="10" fill="#b0bec5">有身份、有状态</text>
  <text x="348" y="228" font-family="sans-serif" font-size="10" fill="#b0bec5">有账目、有额度</text>
  <text x="348" y="252" font-family="sans-serif" font-size="9" font-style="italic" fill="#80cbc4">Host-owned snapshot</text>

  <!-- 上：状态 -->
  <rect x="300" y="60" width="280" height="76" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="316" y="82" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">① 生命周期（在哪一步）</text>
  <text x="316" y="102" font-family="monospace" font-size="10" fill="#37474f">created → running → waiting</text>
  <text x="316" y="120" font-family="monospace" font-size="10" fill="#37474f">→ succeeded | failed | cancelled</text>
  <line x1="440" y1="136" x2="440" y2="160" stroke="#2e7d32" stroke-width="2" marker-end="url(#l11)"/>

  <!-- 左：身份与幂等 -->
  <rect x="24" y="170" width="264" height="90" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="40" y="192" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1565c0">② 身份与幂等（是否重复）</text>
  <text x="40" y="212" font-family="monospace" font-size="10" fill="#37474f">callId</text>
  <text x="40" y="230" font-family="sans-serif" font-size="9" fill="#546e7a">同键同输入 → 返回旧结果</text>
  <text x="40" y="248" font-family="sans-serif" font-size="9" fill="#546e7a">同键异输入 → 冲突</text>
  <line x1="288" y1="212" x2="330" y2="212" stroke="#1565c0" stroke-width="2" marker-end="url(#l11)"/>

  <!-- 右：账本 -->
  <rect x="592" y="160" width="264" height="110" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="608" y="182" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f57f17">③ 执行账本（发生过什么）</text>
  <text x="608" y="202" font-family="sans-serif" font-size="9" fill="#546e7a">日志：过程时序（排障）</text>
  <text x="608" y="220" font-family="sans-serif" font-size="9" fill="#546e7a">状态：结论（调度/计费）</text>
  <text x="608" y="238" font-family="sans-serif" font-size="9" fill="#546e7a">checkpoint：现场（恢复）</text>
  <text x="608" y="258" font-family="sans-serif" font-size="9" font-style="italic" fill="#e65100">只读，不是 update DTO</text>
  <line x1="550" y1="215" x2="592" y2="215" stroke="#f57f17" stroke-width="2" marker-end="url(#l11)"/>

  <!-- 下：用量 -->
  <rect x="270" y="300" width="340" height="94" rx="8" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="286" y="322" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6a1b9a">④ 用量与预算（花了多少）</text>
  <text x="286" y="342" font-family="sans-serif" font-size="9" fill="#546e7a">采集：AI 消息返回时读 tokenUsage</text>
  <text x="286" y="358" font-family="sans-serif" font-size="9" fill="#546e7a">护栏：调用前预检 spent + 本次估算</text>
  <text x="286" y="374" font-family="sans-serif" font-size="9" fill="#546e7a">归集：按 rootJobId 汇总整棵树</text>
  <text x="286" y="390" font-family="sans-serif" font-size="9" font-style="italic" fill="#6a1b9a">无用量记录 → 按 Infinity 算（不打折）</text>
  <line x1="440" y1="270" x2="440" y2="300" stroke="#6a1b9a" stroke-width="2" marker-end="url(#l11)"/>

  <!-- 底部核心判断 -->
  <rect x="24" y="408" width="832" height="24" rx="5" fill="#eceff1"/>
  <text x="38" y="424" font-family="sans-serif" font-size="10" fill="#455a64">核心判断：不确定的用量按最坏算（fail-closed）；状态判定只能有一处；身份只能由宿主注入，绝不接受模型输入。</text>
</svg>
