<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <defs>
    <marker id="n9" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="420" fill="#fafafa"/>
  <text x="30" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">三种协作形态：结果回传 vs 依赖复用 vs 控制权转移</text>

  <!-- 1 子图 -->
  <rect x="30" y="66" width="300" height="120" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="46" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">① 子图委派（要结果）</text>
  <rect x="60" y="104" width="90" height="70" rx="5" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="70" y="124" font-family="sans-serif" font-size="10" font-weight="bold" fill="#263238">主管</text>
  <text x="70" y="144" font-family="sans-serif" font-size="8" fill="#546e7a">派活 + 汇总</text>
  <rect x="214" y="104" width="100" height="70" rx="5" fill="#ffffff" stroke="#81c784"/>
  <text x="224" y="124" font-family="sans-serif" font-size="10" font-weight="bold" fill="#263238">工人(子图)</text>
  <text x="224" y="144" font-family="sans-serif" font-size="8" fill="#546e7a">结果写父通道</text>
  <line x1="150" y1="127" x2="214" y2="127" stroke="#2e7d32" stroke-width="2" marker-end="url(#n9)"/>
  <line x1="214" y1="160" x2="150" y2="161" stroke="#66bb6a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#n9)"/>

  <!-- 2 协作者 -->
  <rect x="30" y="206" width="300" height="120" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="46" y="230" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1565c0">② 协作者（调外部已发布依赖）</text>
  <rect x="60" y="244" width="90" height="66" rx="5" fill="#ffffff" stroke="#90caf9"/>
  <text x="70" y="264" font-family="sans-serif" font-size="10" font-weight="bold" fill="#263238">调用方</text>
  <text x="70" y="282" font-family="sans-serif" font-size="8" fill="#546e7a">schema 描述</text>
  <text x="70" y="296" font-family="sans-serif" font-size="8" fill="#546e7a">锁版本</text>
  <rect x="214" y="244" width="100" height="66" rx="5" fill="#ffffff" stroke="#64b5f6"/>
  <text x="224" y="264" font-family="sans-serif" font-size="10" font-weight="bold" fill="#263238">已发布 Agent</text>
  <text x="224" y="282" font-family="sans-serif" font-size="8" fill="#546e7a">version 固定</text>
  <text x="224" y="296" font-family="sans-serif" font-size="8" fill="#546e7a">scope 校验</text>
  <line x1="150" y1="277" x2="214" y2="277" stroke="#1565c0" stroke-width="2" marker-end="url(#n9)"/>

  <!-- 3 Swarm -->
  <rect x="356" y="66" width="494" height="260" rx="8" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="372" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6a1b9a">③ Swarm 交接（让出控制权）</text>
  <rect x="380" y="104" width="120" height="80" rx="5" fill="#ffffff" stroke="#ce93d8"/>
  <text x="392" y="128" font-family="monospace" font-size="10" font-weight="bold" fill="#6a1b9a">Agent A</text>
  <text x="392" y="150" font-family="sans-serif" font-size="8" fill="#546e7a">activeAgent=A</text>
  <rect x="524" y="158" width="130" height="80" rx="5" fill="#ffffff" stroke="#ce93d8"/>
  <text x="536" y="182" font-family="monospace" font-size="10" font-weight="bold" fill="#6a1b9a">Agent B</text>
  <text x="536" y="204" font-family="sans-serif" font-size="8" fill="#546e7a">activeAgent=B</text>
  <rect x="680" y="104" width="140" height="80" rx="5" fill="#ffffff" stroke="#ba68c8"/>
  <text x="692" y="128" font-family="monospace" font-size="10" font-weight="bold" fill="#6a1b9a">Agent C</text>
  <text x="692" y="150" font-family="sans-serif" font-size="8" fill="#546e7a">activeAgent=C</text>
  <line x1="500" y1="120" x2="524" y2="160" stroke="#ab47bc" stroke-width="2" marker-end="url(#n9)"/>
  <line x1="654" y1="180" x2="680" y2="160" stroke="#ab47bc" stroke-width="2" marker-end="url(#n9)"/>
  <text x="372" y="268" font-family="monospace" font-size="9" fill="#6a1b9a">new Command({ graph: PARENT, update: { activeAgent } })</text>
  <text x="372" y="288" font-family="sans-serif" font-size="9" fill="#546e7a">控制权整体移交，原角色退场，需要终止条件防环路</text>
  <text x="372" y="308" font-family="sans-serif" font-size="9" font-style="italic" fill="#6a1b9a">只给"图里存在 agent 连接"的伙伴生成 handoff 工具</text>

  <!-- 底部判据 -->
  <rect x="30" y="344" width="820" height="52" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="46" y="366" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f57f17">选型判据：做完这件事，还需要继续处理它的结果吗？</text>
  <text x="46" y="386" font-family="sans-serif" font-size="10" fill="#546e7a">是 → 子图 / 协作者；否（整个交给别人作主）→ Swarm。先问控制权归谁，再定形态。</text>
</svg>
