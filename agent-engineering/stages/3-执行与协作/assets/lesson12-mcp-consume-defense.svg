<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
  <defs>
    <marker id="l12" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#fafafa"/>
  <text x="28" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">接一个不受你管的系统：四道防线</text>
  <text x="28" y="56" font-family="sans-serif" font-size="11" fill="#78909c">对方的实现、可用性、能力边界都不在你手里——能不塌，靠的是这四层各挡一种意外</text>

  <!-- 左侧：对方 -->
  <rect x="24" y="92" width="176" height="300" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-dasharray="6 4"/>
  <text x="44" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#455a64">外部服务端</text>
  <text x="44" y="142" font-family="sans-serif" font-size="10" fill="#607d8b">你改不了它</text>
  <line x1="44" y1="154" x2="180" y2="154" stroke="#cfd8dc"/>
  <text x="44" y="180" font-family="sans-serif" font-size="10" fill="#546e7a">可能只实现一半</text>
  <text x="44" y="202" font-family="sans-serif" font-size="10" fill="#546e7a">可能反过来问你</text>
  <text x="44" y="224" font-family="sans-serif" font-size="10" fill="#546e7a">可能几分钟才回</text>
  <text x="44" y="246" font-family="sans-serif" font-size="10" fill="#546e7a">可能一口气给 34 个工具</text>
  <text x="44" y="286" font-family="sans-serif" font-size="9" font-style="italic" fill="#90a4ae">四件事都可能同时成立</text>

  <!-- 中间四道防线 -->
  <rect x="236" y="92" width="420" height="66" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="252" y="116" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1565c0">防线 1 · 握手时把能力问清（部分失败也继续）</text>
  <text x="252" y="138" font-family="sans-serif" font-size="10" fill="#546e7a">拿到什么用什么，缺的记进 errors —— 不是一错全退出</text>

  <rect x="236" y="172" width="420" height="66" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="252" y="196" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">防线 2 · 对方反问你时，把问题转给人</text>
  <text x="252" y="218" font-family="sans-serif" font-size="10" fill="#546e7a">拒绝这一步 / 作废整次调用 / 填了再继续 —— 三种答案三种后果</text>

  <rect x="236" y="252" width="420" height="66" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="252" y="276" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f57f17">防线 3 · 对方不立刻回，就先拿个句柄</text>
  <text x="252" y="298" font-family="sans-serif" font-size="10" fill="#546e7a">人可以等，线程不能等 —— 拿任务号回来轮询</text>

  <rect x="236" y="332" width="420" height="60" rx="8" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="252" y="356" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6a1b9a">防线 4 · 出口收窄：34 个工具只放 5 个给模型</text>
  <text x="252" y="376" font-family="sans-serif" font-size="10" fill="#546e7a">暴露得多不等于用得对 —— 选择本身是成本</text>

  <!-- 右侧：消费方 Agent -->
  <rect x="700" y="150" width="176" height="184" rx="10" fill="#263238" stroke="#455a64"/>
  <text x="720" y="178" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">你的 Agent</text>
  <text x="720" y="200" font-family="sans-serif" font-size="10" fill="#b0bec5">能力不全也能跑</text>
  <text x="720" y="222" font-family="sans-serif" font-size="10" fill="#b0bec5">坏一个不塌全局</text>
  <text x="720" y="244" font-family="sans-serif" font-size="10" fill="#b0bec5">等待不占线程</text>
  <text x="720" y="266" font-family="sans-serif" font-size="10" fill="#b0bec5">选择面可控</text>

  <!-- 连线 -->
  <line x1="200" y1="125" x2="236" y2="125" stroke="#455a64" stroke-width="2" marker-end="url(#l12)"/>
  <line x1="200" y1="205" x2="236" y2="205" stroke="#455a64" stroke-width="2" marker-end="url(#l12)"/>
  <line x1="200" y1="285" x2="236" y2="285" stroke="#455a64" stroke-width="2" marker-end="url(#l12)"/>
  <line x1="200" y1="362" x2="236" y2="362" stroke="#455a64" stroke-width="2" marker-end="url(#l12)"/>
  <line x1="656" y1="240" x2="700" y2="240" stroke="#455a64" stroke-width="2" marker-end="url(#l12)"/>

  <!-- 底部判断 -->
  <rect x="24" y="416" width="852" height="38" rx="6" fill="#eceff1"/>
  <text x="40" y="434" font-family="sans-serif" font-size="11" fill="#37474f">核心判断：对方不可控是前提，不是意外。所以每一层都要能"缺了也继续"，而不是"缺了就报错退出"。</text>
  <text x="40" y="450" font-family="sans-serif" font-size="10" font-style="italic" fill="#78909c">图上不写协议细节与方法名——先记住"要挡四种意外"，具体机制在四个知识点里逐个展开</text>
</svg>
