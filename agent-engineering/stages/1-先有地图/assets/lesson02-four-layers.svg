<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480">
  <defs>
    <marker id="l2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="480" fill="#fafafa"/>

  <text x="36" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">四层构成：一座楼，一次请求从底走到顶</text>

  <!-- 账本面顶层 -->
  <rect x="36" y="62" width="788" height="78" rx="8" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="54" y="88" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6a1b9a">第 4 层 · 账本面（Account）</text>
  <text x="54" y="112" font-family="sans-serif" font-size="12" fill="#37474f">记录每次请求的会话、用量、状态、结果（调用记录 / 执行账本）</text>
  <text x="54" y="130" font-family="sans-serif" font-size="12" fill="#78909c">谁负责：审计、计费、断点恢复、可观测</text>

  <!-- 执行面 -->
  <rect x="36" y="162" width="788" height="78" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="54" y="188" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1565c0">第 3 层 · 执行面（Execute）</text>
  <text x="54" y="212" font-family="sans-serif" font-size="12" fill="#37474f">接收消息、驱动已编译图、按条件边路由、流式回传（shared/agent 跑图）</text>
  <text x="54" y="230" font-family="sans-serif" font-size="12" fill="#78909c">谁负责：真正"干活"、产出回应</text>

  <!-- 编译面 -->
  <rect x="36" y="262" width="788" height="78" rx="8" fill="#fff3e0" stroke="#ffa726"/>
  <text x="54" y="288" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef6c00">第 2 层 · 编译面（Compile）</text>
  <text x="54" y="312" font-family="sans-serif" font-size="12" fill="#37474f">把 Agent 定义翻译成可执行的 CompiledStateGraph（compile-graph.command.ts）</text>
  <text x="54" y="330" font-family="sans-serif" font-size="12" fill="#78909c">谁负责：一切"翻译"工作，输出可调用图</text>

  <!-- 定义面底层 -->
  <rect x="36" y="362" width="788" height="78" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="54" y="388" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">第 1 层 · 定义面（Definition）</text>
  <text x="54" y="412" font-family="sans-serif" font-size="12" fill="#37474f">存储 Agent 的"声明"：模型、提示词、工具、权限（定义表）</text>
  <text x="54" y="430" font-family="sans-serif" font-size="12" fill="#78909c">谁负责：配置方（产品 / 开发者 / 运维），全是数据没有执行</text>

  <!-- 依赖方向箭头 -->
  <line x1="430" y1="140" x2="430" y2="162" stroke="#546e7a" stroke-width="2" marker-end="url(#l2)"/>
  <line x1="430" y1="240" x2="430" y2="262" stroke="#546e7a" stroke-width="2" marker-end="url(#l2)"/>
  <line x1="430" y1="340" x2="430" y2="362" stroke="#546e7a" stroke-width="2" marker-end="url(#l2)"/>

  <text x="470" y="452" font-family="sans-serif" font-size="12" fill="#90a4ae">箭头 = 一次请求的数据流向（从定义被翻译、被执行、被记账）；依赖方向与之一致，低层不反向依赖高层。</text>
</svg>
