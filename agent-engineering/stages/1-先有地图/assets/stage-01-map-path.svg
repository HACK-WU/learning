<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546e7a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="300" fill="#fafafa"/>
  <text x="26" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">阶段 1 路径：先拿两张地图</text>

  <rect x="26" y="70" width="180" height="90" rx="8" fill="#ffffff" stroke="#90a4ae"/>
  <rect x="26" y="70" width="180" height="28" rx="8" fill="#546e7a"/>
  <text x="116" y="89" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">课 1 环境准备</text>
  <text x="40" y="120" font-family="sans-serif" font-size="11" fill="#37474f">Node 22 + pnpm 9</text>
  <text x="40" y="140" font-family="sans-serif" font-size="11" fill="#37474f">单跑一个 spec 即验证</text>

  <line x1="206" y1="115" x2="256" y2="115" stroke="#546e7a" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="262" y="70" width="220" height="90" rx="8" fill="#ffffff" stroke="#42a5f5" stroke-width="2"/>
  <rect x="262" y="70" width="220" height="28" rx="8" fill="#1565c0"/>
  <text x="372" y="89" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">课 2 静态地图：东西在哪</text>
  <text x="276" y="120" font-family="sans-serif" font-size="11" fill="#37474f">四层职责 / 73 模块</text>
  <text x="276" y="140" font-family="sans-serif" font-size="11" fill="#37474f">三条定位起手式</text>

  <line x1="482" y1="115" x2="532" y2="115" stroke="#546e7a" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="538" y="70" width="256" height="90" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <rect x="538" y="70" width="256" height="28" rx="8" fill="#2e7d32"/>
  <text x="666" y="89" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">课 3 动态地图：事情怎么发生</text>
  <text x="552" y="120" font-family="sans-serif" font-size="11" fill="#37474f">入口 → 编译 → 图执行</text>
  <text x="552" y="140" font-family="sans-serif" font-size="11" fill="#37474f">流式回传 / 执行记账</text>

  <rect x="26" y="196" width="768" height="76" rx="8" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="42" y="220" font-family="sans-serif" font-size="12" font-weight="bold" fill="#455a64">本阶段边界</text>
  <text x="42" y="242" font-family="sans-serif" font-size="11" fill="#546e7a">不要求读懂全部代码。目标是索引式认知：知道「要改 X 该去哪里」，而不是「记住 X 的实现」。</text>
  <text x="42" y="262" font-family="sans-serif" font-size="11" fill="#78909c">课 3 读不懂是正常的——它的作用是把坐标先埋下来，阶段 2 / 3 会放大其中各段。</text>
</svg>
