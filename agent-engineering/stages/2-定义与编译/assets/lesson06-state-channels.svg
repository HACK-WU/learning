<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <defs>
    <marker id="a6" markerWidth="9" markerHeight="9" refX="8" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L8,2.5 z" fill="#78909c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="520" fill="#fafafa"/>
  <text x="30" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">10 个状态通道，四种合并语义</text>

  <!-- 分组标签 -->
  <text x="30" y="72" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1565c0">对话类</text>
  <text x="30" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef6c00">控制类</text>
  <text x="30" y="400" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6a1b9a">运行类</text>

  <!-- 对话类 -->
  <rect x="110" y="56" width="200" height="44" rx="6" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="124" y="74" font-family="monospace" font-size="11" fill="#1565c0">messages</text>
  <text x="124" y="90" font-family="sans-serif" font-size="9" fill="#546e7a">BaseMessage[]</text>
  <rect x="336" y="56" width="230" height="44" rx="6" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="350" y="74" font-family="sans-serif" font-size="10" fill="#2e7d32">追加 + 同 id 替换</text>
  <text x="350" y="90" font-family="sans-serif" font-size="9" fill="#78909c">messagesStateReducer</text>

  <rect x="110" y="110" width="200" height="44" rx="6" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="124" y="128" font-family="monospace" font-size="11" fill="#1565c0">title_channel</text>
  <text x="124" y="144" font-family="sans-serif" font-size="9" fill="#546e7a">TMessageChannel</text>
  <rect x="336" y="110" width="230" height="44" rx="6" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="350" y="128" font-family="sans-serif" font-size="10" fill="#2e7d32">合并对象 + messages 追加</text>
  <text x="350" y="144" font-family="sans-serif" font-size="9" fill="#78909c">分层归约</text>

  <rect x="110" y="164" width="200" height="44" rx="6" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="124" y="182" font-family="monospace" font-size="11" fill="#1565c0">input</text>
  <text x="124" y="198" font-family="sans-serif" font-size="9" fill="#546e7a">string</text>
  <rect x="336" y="164" width="230" height="44" rx="6" fill="#fff3e0" stroke="#ffa726"/>
  <text x="350" y="182" font-family="sans-serif" font-size="10" fill="#e65100">取新值（覆盖）</text>
  <text x="350" y="198" font-family="sans-serif" font-size="9" fill="#78909c">b ?? a</text>

  <!-- 控制类 -->
  <rect x="110" y="220" width="200" height="44" rx="6" fill="#fff3e0" stroke="#ffa726"/>
  <text x="124" y="238" font-family="monospace" font-size="11" fill="#e65100">sys</text>
  <text x="124" y="254" font-family="sans-serif" font-size="9" fill="#546e7a">TAgentStateSystem</text>
  <rect x="336" y="220" width="230" height="44" rx="6" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="350" y="238" font-family="sans-serif" font-size="10" fill="#2e7d32">浅合并 {...a, ...b}</text>
  <text x="350" y="254" font-family="sans-serif" font-size="9" fill="#78909c">多来源各写一部分</text>

  <rect x="110" y="274" width="200" height="44" rx="6" fill="#fff3e0" stroke="#ffa726"/>
  <text x="124" y="292" font-family="monospace" font-size="11" fill="#e65100">human</text>
  <text x="124" y="308" font-family="sans-serif" font-size="9" fill="#546e7a">TChatRequestHuman</text>
  <rect x="336" y="274" width="230" height="44" rx="6" fill="#fff3e0" stroke="#ffa726"/>
  <text x="350" y="292" font-family="sans-serif" font-size="10" fill="#e65100">取新值</text>

  <rect x="110" y="328" width="200" height="44" rx="6" fill="#fff3e0" stroke="#ffa726"/>
  <text x="124" y="346" font-family="monospace" font-size="11" fill="#e65100">pending_follow_ups</text>
  <text x="124" y="362" font-family="sans-serif" font-size="9" fill="#546e7a">TPendingFollowUpStateItem[]</text>
  <rect x="336" y="328" width="230" height="44" rx="6" fill="#fff3e0" stroke="#ffa726"/>
  <text x="350" y="346" font-family="sans-serif" font-size="10" fill="#e65100">取新值</text>

  <rect x="110" y="382" width="200" height="44" rx="6" fill="#fff3e0" stroke="#ffa726"/>
  <text x="124" y="400" font-family="monospace" font-size="11" fill="#e65100">toolCall</text>
  <text x="124" y="416" font-family="sans-serif" font-size="9" fill="#546e7a">TToolCall（节点间便条）</text>
  <rect x="336" y="382" width="230" height="44" rx="6" fill="#fff3e0" stroke="#ffa726"/>
  <text x="350" y="400" font-family="sans-serif" font-size="10" fill="#e65100">取新值</text>

  <!-- 运行类 -->
  <rect x="110" y="436" width="200" height="40" rx="6" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="124" y="453" font-family="monospace" font-size="11" fill="#6a1b9a">title</text>
  <text x="124" y="469" font-family="sans-serif" font-size="9" fill="#546e7a">string（一句话短标题）</text>

  <rect x="336" y="436" width="230" height="40" rx="6" fill="#fff3e0" stroke="#ffa726"/>
  <text x="350" y="453" font-family="sans-serif" font-size="10" fill="#e65100">取新值</text>
  <text x="350" y="469" font-family="sans-serif" font-size="9" fill="#78909c">注意：与 title_channel 完全不同</text>

  <rect x="600" y="56" width="250" height="120" rx="8" fill="#ffffff" stroke="#546e7a"/>
  <text x="616" y="78" font-family="sans-serif" font-size="12" font-weight="bold" fill="#263238">summary / memories</text>
  <text x="616" y="98" font-family="sans-serif" font-size="10" fill="#37474f">summary: string</text>
  <text x="616" y="116" font-family="sans-serif" font-size="10" fill="#37474f">memories: SearchItem[]</text>
  <text x="616" y="140" font-family="sans-serif" font-size="10" fill="#e65100">合并方式：取新值</text>
  <text x="616" y="160" font-family="sans-serif" font-size="9" fill="#78909c">由摘要 / 记忆检索中间件写</text>

  <rect x="600" y="200" width="250" height="150" rx="8" fill="#ffffff" stroke="#546e7a"/>
  <text x="616" y="222" font-family="sans-serif" font-size="12" font-weight="bold" fill="#263238">要点提示</text>
  <text x="616" y="246" font-family="sans-serif" font-size="10" fill="#37474f">· 常量键（sys/human/...）</text>
  <text x="616" y="264" font-family="sans-serif" font-size="9" fill="#78909c">  避免跨包拼写漂移</text>
  <text x="616" y="286" font-family="sans-serif" font-size="10" fill="#37474f">· title 是字，title_channel 是容器</text>
  <text x="616" y="308" font-family="sans-serif" font-size="10" fill="#37474f">· toolCall 是节点间便条</text>
  <text x="616" y="330" font-family="sans-serif" font-size="9" fill="#78909c">  不是对话历史的一部分</text>

  <rect x="600" y="376" width="250" height="100" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="616" y="398" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f57f17">环境不进历史</text>
  <text x="616" y="420" font-family="sans-serif" font-size="10" fill="#37474f">stateWithEnvironment 返回新对象</text>
  <text x="616" y="438" font-family="sans-serif" font-size="10" fill="#37474f">读时投影，绝不写回</text>
  <text x="616" y="458" font-family="sans-serif" font-size="9" fill="#78909c">防密钥泄漏 + 保回放正确</text>
</svg>
