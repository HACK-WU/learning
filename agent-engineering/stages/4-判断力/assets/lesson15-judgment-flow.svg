<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <defs>
    <marker id="a15" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
    <marker id="a15r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef6c00"/>
    </marker>
    <marker id="a15g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="460" fill="#fafafa"/>
  <text x="30" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">判断流程：从陌生系统到迁移决策清单</text>

  <!-- 步0 -->
  <rect x="30" y="60" width="180" height="78" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="46" y="84" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1565c0">步0 画骨架</text>
  <text x="46" y="104" font-family="sans-serif" font-size="10" fill="#0d47a1">层 / 接口 / 数据流</text>
  <text x="46" y="122" font-family="sans-serif" font-size="9" font-style="italic" fill="#546e7a">只看输入输出，不问实现</text>

  <!-- 步1 -->
  <rect x="250" y="60" width="180" height="78" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="266" y="84" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">步1 三分类</text>
  <text x="266" y="104" font-family="sans-serif" font-size="10" fill="#1b5e20">三问逐条给证据</text>
  <text x="266" y="122" font-family="sans-serif" font-size="9" font-style="italic" fill="#546e7a">任一不成立 → 应放弃</text>

  <!-- 步2 -->
  <rect x="470" y="60" width="180" height="78" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="486" y="84" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e65100">步2 约束还原</text>
  <text x="486" y="104" font-family="sans-serif" font-size="10" fill="#8d6e63">版本先行 · 证据门禁</text>
  <text x="486" y="122" font-family="sans-serif" font-size="9" font-style="italic" fill="#8d6e63">区分「没想到」与「做不到」</text>

  <!-- 步3 -->
  <rect x="690" y="60" width="180" height="78" rx="8" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="706" y="84" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6a1b9a">步3 决策清单</text>
  <text x="706" y="104" font-family="sans-serif" font-size="10" fill="#4a148c">设计点 × 我的约束</text>
  <text x="706" y="122" font-family="sans-serif" font-size="9" font-style="italic" fill="#6a1b9a">每格要证据、空证据未完成</text>

  <line x1="210" y1="99" x2="250" y2="99" stroke="#455a64" stroke-width="2" marker-end="url(#a15)"/>
  <line x1="430" y1="101" x2="470" y2="101" stroke="#455a64" stroke-width="2" marker-end="url(#a15)"/>
  <line x1="650" y1="99" x2="690" y2="99" stroke="#455a64" stroke-width="2" marker-end="url(#a15)"/>

  <!-- 三问分支（步1下方） -->
  <text x="250" y="176" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">步1 三问（与关系，一票否决）</text>
  <rect x="250" y="186" width="190" height="34" rx="4" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="262" y="208" font-family="sans-serif" font-size="10" fill="#1b5e20">Q1 通用问题？Q2 约束成立？</text>
  <text x="262" y="220" font-family="sans-serif" font-size="10" fill="#1b5e20">Q3 代价付得起？</text>
  <text x="250" y="240" font-family="sans-serif" font-size="9" font-style="italic" fill="#546e7a">证据缺失 ⇒ answer 不许为 True</text>

  <!-- 三问输出 -->
  <rect x="470" y="186" width="190" height="70" rx="4" fill="#ffffff" stroke="#b0bec5"/>
  <text x="482" y="206" font-family="sans-serif" font-size="9" fill="#37474f">全部成立 → 可迁移 / 需改造</text>
  <text x="482" y="224" font-family="sans-serif" font-size="9" fill="#37474f">任一不成立 → 应放弃</text>
  <text x="482" y="242" font-family="sans-serif" font-size="9" fill="#ef6c00">不确定 → 未定，补证据</text>

  <line x1="440" y1="203" x2="470" y2="203" stroke="#455a64" stroke-width="1.5" marker-end="url(#a15)"/>

  <!-- 约束还原分支（步2下方） -->
  <text x="470" y="300" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e65100">步2 还原三支（按版本）</text>
  <rect x="470" y="310" width="400" height="60" rx="6" fill="#ffffff" stroke="#ffcc80"/>
  <text x="484" y="330" font-family="sans-serif" font-size="10" fill="#37474f">当时框架有等价能力 → 作者没想到：可重构</text>
  <text x="484" y="346" font-family="sans-serif" font-size="10" fill="#37474f">当时没有、今天有 → 等约束变化：给触发条件</text>
  <text x="484" y="362" font-family="sans-serif" font-size="10" fill="#37474f">当时没有、今天也没有 → 保持现状</text>

  <line x1="560" y1="138" x2="560" y2="300" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a15r)"/>

  <!-- 汇入清单 -->
  <rect x="250" y="330" width="200" height="70" rx="8" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="266" y="354" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6a1b9a">全部汇入清单</text>
  <text x="266" y="374" font-family="sans-serif" font-size="9" fill="#4a148c">按事故风险排序 · 一次上一调</text>
  <text x="266" y="390" font-family="sans-serif" font-size="9" font-style="italic" fill="#6a1b9a">留复核触发器，约束是变量</text>

  <line x1="440" y1="340" x2="450" y2="340" stroke="#455a64" stroke-width="1.5" marker-end="url(#a15)"/>
  <line x1="690" y1="340" x2="700" y2="340" stroke="#2e7d32" stroke-width="2" marker-end="url(#a15g)"/>

  <text x="30" y="440" font-family="sans-serif" font-size="11" font-style="italic" fill="#7e57c2">读系统让你走得进去，判断让你走得出来。方法到这一步，换陌生项目也能照做。</text>
</svg>
