<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <defs>
    <marker id="b7" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#fafafa"/>
  <text x="28" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#263238">从 if 堆到策略层：主干越来越短，能力越来越独立</text>

  <!-- 左：if 堆 -->
  <rect x="28" y="58" width="240" height="240" rx="8" fill="#ffebee" stroke="#e57373"/>
  <text x="44" y="82" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c62828">改造前：6 个 if</text>
  <rect x="44" y="94" width="208" height="30" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="56" y="113" font-family="monospace" font-size="9" fill="#c62828">if (fileUnderstanding)</text>
  <rect x="44" y="130" width="208" height="30" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="56" y="149" font-family="monospace" font-size="9" fill="#c62828">if (structuredOutput)</text>
  <rect x="44" y="166" width="208" height="30" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="56" y="185" font-family="monospace" font-size="9" fill="#c62828">if (memory)</text>
  <rect x="44" y="202" width="208" height="30" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="56" y="221" font-family="monospace" font-size="9" fill="#c62828">if (skills.length)</text>
  <rect x="44" y="238" width="208" height="30" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="56" y="257" font-family="monospace" font-size="9" fill="#c62828">if (tenant === 'A')</text>
  <rect x="44" y="274" width="208" height="30" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="56" y="293" font-family="monospace" font-size="9" fill="#c62828">if (permissions.deny)</text>
  <text x="44" y="322" font-family="sans-serif" font-size="9" fill="#c62828">6 个 if = 64 种组合路径</text>

  <!-- 中：抽成函数 -->
  <rect x="300" y="58" width="240" height="240" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="316" y="82" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f57f17">第一步：抽成函数</text>
  <rect x="316" y="94" width="208" height="120" rx="4" fill="#ffffff" stroke="#ffe082"/>
  <text x="330" y="114" font-family="monospace" font-size="9" fill="#37474f">hooks = {</text>
  <text x="330" y="130" font-family="monospace" font-size="9" fill="#37474f">  fileUnderstanding,</text>
  <text x="330" y="146" font-family="monospace" font-size="9" fill="#37474f">  structuredOutput,</text>
  <text x="330" y="162" font-family="monospace" font-size="9" fill="#37474f">  memory, skills,</text>
  <text x="330" y="178" font-family="monospace" font-size="9" fill="#37474f">  audit, permissions</text>
  <text x="330" y="196" font-family="monospace" font-size="9" fill="#37474f">}</text>
  <text x="316" y="236" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 主干变短</text>
  <text x="316" y="256" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 可单独测试</text>
  <text x="316" y="276" font-family="sans-serif" font-size="10" fill="#c62828">✗ 顺序仍写死</text>
  <text x="316" y="292" font-family="sans-serif" font-size="10" fill="#c62828">✗ 没有"位置"概念</text>

  <!-- 右：策略层 -->
  <rect x="572" y="58" width="280" height="240" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="588" y="82" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">终态：主干 + 策略层</text>
  <rect x="588" y="94" width="248" height="26" rx="4" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="600" y="112" font-family="sans-serif" font-size="9" fill="#2e7d32">主干：按钩子顺序调用（无 if）</text>
  <rect x="588" y="128" width="118" height="26" rx="4" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="598" y="146" font-family="monospace" font-size="8" fill="#1565c0">beforeAgent</text>
  <rect x="718" y="128" width="118" height="26" rx="4" fill="#f3e5f5" stroke="#ce93d8"/>
  <text x="728" y="146" font-family="monospace" font-size="8" fill="#6a1b9a">beforeModel</text>
  <rect x="588" y="162" width="118" height="26" rx="4" fill="#f3e5f5" stroke="#ce93d8"/>
  <text x="598" y="180" font-family="monospace" font-size="8" fill="#6a1b9a">afterModel</text>
  <rect x="718" y="162" width="118" height="26" rx="4" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="728" y="180" font-family="monospace" font-size="8" fill="#e65100">wrapToolCall</text>
  <rect x="588" y="196" width="248" height="26" rx="4" fill="#eceff1" stroke="#b0bec5"/>
  <text x="600" y="214" font-family="sans-serif" font-size="9" fill="#455a64">afterAgent（反序清理）</text>
  <text x="588" y="244" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 加能力不改主干</text>
  <text x="588" y="262" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 位置由钩子保证</text>
  <text x="588" y="280" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 权限三层分工</text>

  <line x1="268" y1="178" x2="300" y2="178" stroke="#546e7a" stroke-width="2" marker-end="url(#b7)"/>
  <line x1="540" y1="178" x2="572" y2="178" stroke="#546e7a" stroke-width="2" marker-end="url(#b7)"/>

  <text x="28" y="330" font-family="sans-serif" font-size="11" fill="#546e7a">关键认知转变：不要问"这段代码放哪"，要问"它在生命周期的哪个位置发生"。</text>
  <text x="28" y="352" font-family="sans-serif" font-size="11" fill="#546e7a">位置一旦确定，顺序、组合、清理都自然成立——不需要在主干里手工排列。</text>
  <text x="28" y="374" font-family="sans-serif" font-size="11" fill="#90a4ae">变化标注：红=交叉复杂；黄=搬家但未定位置；绿=位置成为一等公民。</text>
</svg>
