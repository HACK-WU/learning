<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <defs>
    <marker id="b4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="380" fill="#fafafa"/>
  <text x="28" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#263238">三跳演进：从代码里的常量，到可治理的定义</text>

  <!-- 第一跳 -->
  <rect x="28" y="60" width="250" height="230" rx="8" fill="#eceff1" stroke="#90a4ae"/>
  <text x="44" y="84" font-family="sans-serif" font-size="13" font-weight="bold" fill="#455a64">第一跳：常量提取</text>
  <rect x="44" y="98" width="218" height="70" rx="5" fill="#ffffff" stroke="#b0bec5"/>
  <text x="56" y="118" font-family="monospace" font-size="9" fill="#37474f">const CONFIG = {</text>
  <text x="56" y="132" font-family="monospace" font-size="9" fill="#37474f">  model: 'gpt-4o-mini',</text>
  <text x="56" y="146" font-family="monospace" font-size="9" fill="#37474f">  system: '你是客服',</text>
  <text x="56" y="160" font-family="monospace" font-size="9" fill="#37474f">}</text>
  <text x="44" y="192" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 改一处生效</text>
  <text x="44" y="212" font-family="sans-serif" font-size="10" fill="#c62828">✗ 仍在代码里</text>
  <text x="44" y="230" font-family="sans-serif" font-size="10" fill="#c62828">✗ 改提示词要发版</text>
  <text x="44" y="248" font-family="sans-serif" font-size="10" fill="#c62828">✗ 无版本可回滚</text>
  <text x="44" y="272" font-family="sans-serif" font-size="9" font-style="italic" fill="#90a4ae">本质：常量集中</text>

  <!-- 第二跳 -->
  <rect x="322" y="60" width="250" height="230" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="338" y="84" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1565c0">第二跳：变成定义</text>
  <rect x="338" y="98" width="218" height="70" rx="5" fill="#ffffff" stroke="#90caf9"/>
  <text x="350" y="116" font-family="monospace" font-size="9" fill="#37474f">{ "nodes": [{</text>
  <text x="350" y="130" font-family="monospace" font-size="9" fill="#37474f">    "prompt": "你是客服",</text>
  <text x="350" y="144" font-family="monospace" font-size="9" fill="#37474f">    "toolsetIds": [...]</text>
  <text x="350" y="158" font-family="monospace" font-size="9" fill="#37474f">}] }</text>
  <text x="338" y="192" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 改配置不发版</text>
  <text x="338" y="212" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 权限=不暴露工具</text>
  <text x="338" y="230" font-family="sans-serif" font-size="10" fill="#c62828">✗ 草稿=线上</text>
  <text x="338" y="248" font-family="sans-serif" font-size="10" fill="#c62828">✗ 无版本、无校验</text>
  <text x="338" y="272" font-family="sans-serif" font-size="9" font-style="italic" fill="#90a4ae">本质：数据化</text>

  <!-- 第三跳 -->
  <rect x="616" y="60" width="256" height="230" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="632" y="84" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">第三跳：可治理</text>
  <rect x="632" y="98" width="224" height="70" rx="5" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="644" y="116" font-family="monospace" font-size="9" fill="#37474f">draft --校验--> 发布</text>
  <text x="644" y="132" font-family="monospace" font-size="9" fill="#37474f">  ↓              ↓</text>
  <text x="644" y="148" font-family="monospace" font-size="9" fill="#37474f">改配置      版本 N (latest)</text>
  <text x="644" y="162" font-family="monospace" font-size="9" fill="#37474f">(不发版)    可回滚</text>
  <text x="632" y="192" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 草稿不污染线上</text>
  <text x="632" y="212" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 校验前置拦结构错</text>
  <text x="632" y="230" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 按版本号可复现</text>
  <text x="632" y="248" font-family="sans-serif" font-size="10" fill="#2e7d32">✓ 改坏可切回旧版</text>
  <text x="632" y="272" font-family="sans-serif" font-size="9" font-style="italic" fill="#90a4ae">本质：可回滚+可追溯</text>

  <line x1="278" y1="175" x2="322" y2="175" stroke="#546e7a" stroke-width="2" marker-end="url(#b4)"/>
  <line x1="572" y1="175" x2="616" y2="175" stroke="#546e7a" stroke-width="2" marker-end="url(#b4)"/>

  <text x="28" y="322" font-family="sans-serif" font-size="11" fill="#546e7a">检验标准：每跳问同一个问题——"改模型名还要不要发版？"</text>
  <text x="28" y="344" font-family="sans-serif" font-size="11" fill="#546e7a">第一跳要；第二跳不要；第三跳不要，而且改坏了能退回上一版。</text>
  <text x="28" y="366" font-family="sans-serif" font-size="11" fill="#90a4ae">变化标注：灰色=仍在代码里；蓝色=变成数据；绿色=变成可治理的数据。</text>
</svg>
