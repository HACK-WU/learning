<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <defs>
    <marker id="a01b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="480" fill="#fafafa"/>
  <text x="28" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">解法 B · 任务开跑时钉住版本快照（推荐）</text>
  <text x="28" y="56" font-family="sans-serif" font-size="11" fill="#78909c">把"用哪个定义"变成任务的一个字段 —— 任务一旦开始，定义再怎么改都与它无关</text>

  <rect x="30" y="88" width="170" height="86" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="46" y="112" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1565c0">定义表（追加式）</text>
  <text x="46" y="134" font-family="monospace" font-size="10" fill="#37474f">v1 / v2 / v3 …</text>
  <text x="46" y="154" font-family="sans-serif" font-size="9" fill="#546e7a">旧版本永不删除</text>

  <rect x="248" y="88" width="190" height="86" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="264" y="112" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">创建任务时钉版本</text>
  <text x="264" y="134" font-family="monospace" font-size="10" fill="#37474f">task.version = 7</text>
  <text x="264" y="154" font-family="sans-serif" font-size="9" fill="#546e7a">写入任务记录，不可改</text>

  <rect x="486" y="76" width="200" height="110" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="502" y="100" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f57f17">执行时按版本取</text>
  <text x="502" y="122" font-family="monospace" font-size="10" fill="#37474f">compile(get(v7))</text>
  <text x="502" y="142" font-family="sans-serif" font-size="9" fill="#546e7a">可缓存：v7 的图只编一次</text>
  <text x="502" y="164" font-family="sans-serif" font-size="9" fill="#2e7d32">任务全程同一个图</text>

  <rect x="726" y="76" width="146" height="110" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="742" y="100" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">收益</text>
  <text x="742" y="122" font-family="sans-serif" font-size="9" fill="#546e7a">可回溯：出问题</text>
  <text x="742" y="138" font-family="sans-serif" font-size="9" fill="#546e7a">能查"当时用的</text>
  <text x="742" y="154" font-family="sans-serif" font-size="9" fill="#546e7a">是哪一版"</text>
  <text x="742" y="174" font-family="sans-serif" font-size="9" fill="#546e7a">编译可缓存</text>

  <line x1="200" y1="131" x2="248" y2="131" stroke="#455a64" stroke-width="2" marker-end="url(#a01b)"/>
  <line x1="438" y1="131" x2="486" y2="131" stroke="#455a64" stroke-width="2" marker-end="url(#a01b)"/>
  <line x1="686" y1="131" x2="726" y2="131" stroke="#455a64" stroke-width="2" marker-end="url(#a01b)"/>

  <rect x="30" y="212" width="840" height="112" rx="8" fill="#eceff1"/>
  <text x="46" y="236" font-family="sans-serif" font-size="12" font-weight="bold" fill="#37474f">关键代码</text>
  <text x="46" y="258" font-family="monospace" font-size="10" fill="#37474f">const task = await tasks.create({ definitionId, version: published.version });  // 钉版本</text>
  <text x="46" y="276" font-family="monospace" font-size="10" fill="#37474f">const graph = graphCache.getOrCompile(task.definitionId, task.version);         // 同版本可缓存</text>
  <text x="46" y="294" font-family="monospace" font-size="10" fill="#37474f">await graph.invoke(input, { ...cfg, configurable: { taskId: task.id } });       // 全程同图</text>
  <text x="46" y="314" font-family="monospace" font-size="10" fill="#6a1b9a">// 恢复时也用 task.version，不读"当前最新"</text>

  <rect x="30" y="338" width="840" height="126" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="46" y="362" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c62828">失效点（三处，都很隐蔽）</text>
  <text x="46" y="384" font-family="sans-serif" font-size="10" fill="#b71c1c">① 恢复路径忘读 task.version，改读"当前最新" → 挂起三天后恢复，跑了新定义（最常犯）</text>
  <text x="46" y="404" font-family="sans-serif" font-size="10" fill="#b71c1c">② 旧版本被清理 → 老任务无法恢复。定义表必须"只增不删"或按任务的最后活跃时间做保留期</text>
  <text x="46" y="424" font-family="sans-serif" font-size="10" fill="#b71c1c">③ 缓存键只用了 definitionId 没带 version → 改版后仍命中旧图（症状：改了没生效）</text>
  <text x="46" y="448" font-family="sans-serif" font-size="10" fill="#546e7a">适用：绝大多数生产场景。代价：定义表要留存历史版本（存储成本低，语义收益高）</text>
</svg>
