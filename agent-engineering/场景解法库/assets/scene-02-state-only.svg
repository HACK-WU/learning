<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <defs>
    <marker id="a02a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
    <marker id="a02r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#fafafa"/>
  <text x="28" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">解法 A · 只改状态（无幂等键）</text>
  <text x="28" y="56" font-family="sans-serif" font-size="11" fill="#78909c">用 interrupt 拿决策，然后直接把结果写进状态 —— 单窗口时代够用</text>

  <rect x="40" y="90" width="150" height="70" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="56" y="114" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1565c0">窗口 1</text>
  <text x="56" y="136" font-family="sans-serif" font-size="9" fill="#546e7a">点"通过"</text>

  <rect x="40" y="182" width="150" height="70" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="56" y="206" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c62828">窗口 2</text>
  <text x="56" y="228" font-family="sans-serif" font-size="9" fill="#b71c1c">网络卡了，又点一次</text>

  <rect x="240" y="130" width="180" height="90" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="256" y="154" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">resume(approve)</text>
  <text x="256" y="176" font-family="monospace" font-size="10" fill="#37474f">Command({resume})</text>
  <text x="256" y="198" font-family="sans-serif" font-size="9" fill="#546e7a">两次各恢复一次</text>

  <rect x="470" y="130" width="180" height="90" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="486" y="154" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f57f17">执行动作</text>
  <text x="486" y="176" font-family="monospace" font-size="10" fill="#37474f">UPDATE ... WHERE</text>
  <text x="486" y="198" font-family="sans-serif" font-size="9" fill="#e65100">执行了两次</text>

  <rect x="700" y="130" width="170" height="90" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="716" y="154" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c62828">后果</text>
  <text x="716" y="176" font-family="sans-serif" font-size="9" fill="#b71c1c">下游收到两条</text>
  <text x="716" y="194" font-family="sans-serif" font-size="9" fill="#b71c1c">变更记录</text>
  <text x="716" y="212" font-family="sans-serif" font-size="9" fill="#b71c1c">数据可能已错</text>

  <line x1="190" y1="118" x2="240" y2="152" stroke="#455a64" stroke-width="2" marker-end="url(#a02a)"/>
  <line x1="190" y1="220" x2="240" y2="196" stroke="#c62828" stroke-width="2" marker-end="url(#a02r)"/>
  <line x1="420" y1="175" x2="470" y2="175" stroke="#455a64" stroke-width="2" marker-end="url(#a02a)"/>
  <line x1="650" y1="175" x2="700" y2="175" stroke="#c62828" stroke-width="2" marker-end="url(#a02r)"/>

  <rect x="40" y="300" width="830" height="60" rx="8" fill="#eceff1"/>
  <text x="56" y="324" font-family="sans-serif" font-size="12" font-weight="bold" fill="#37474f">关键代码</text>
  <text x="56" y="346" font-family="monospace" font-size="10" fill="#37474f">const decision = interrupt({ kind: "approval", tool: "executeSql" });  // 两次都拿到 approve</text>

  <rect x="40" y="374" width="830" height="50" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="56" y="396" font-family="sans-serif" font-size="10" fill="#b71c1c">适用边界：单操作员、单入口、审批窗口只有一个人能开。一旦有第二个入口（手机端 / 审批中心），这条就不成立。</text>
  <text x="56" y="414" font-family="sans-serif" font-size="10" fill="#546e7a">代价：低实现成本；失效代价：高（重复执行有副作用的操作）</text>
</svg>
