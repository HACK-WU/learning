<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <defs>
    <marker id="a02c" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="460" fill="#fafafa"/>
  <text x="28" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">解法 C · 状态机守卫：决策只能从 PENDING 走一次</text>
  <text x="28" y="56" font-family="sans-serif" font-size="11" fill="#78909c">把"只能批一次"写进状态机 —— 第二次决策在状态层面就不合法，而不是靠查表</text>

  <rect x="40" y="120" width="150" height="70" rx="8" fill="#eceff1" stroke="#90a4ae"/>
  <text x="56" y="146" font-family="sans-serif" font-size="12" font-weight="bold" fill="#455a64">PENDING</text>
  <text x="56" y="168" font-family="sans-serif" font-size="9" fill="#607d8b">等人决策</text>

  <rect x="300" y="70" width="170" height="66" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="316" y="94" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">APPROVED</text>
  <text x="316" y="116" font-family="sans-serif" font-size="9" fill="#546e7a">条件：状态 == PENDING</text>

  <rect x="300" y="176" width="170" height="66" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="316" y="200" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c62828">REJECTED</text>
  <text x="316" y="222" font-family="sans-serif" font-size="9" fill="#546e7a">条件：状态 == PENDING</text>

  <rect x="300" y="278" width="170" height="66" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="316" y="302" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f57f17">EXPIRED</text>
  <text x="316" y="324" font-family="sans-serif" font-size="9" fill="#546e7a">超时未决策</text>

  <rect x="560" y="140" width="300" height="120" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="576" y="164" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1565c0">第二次决策进来时</text>
  <text x="576" y="188" font-family="monospace" font-size="9" fill="#37474f">UPDATE decision SET state='APPROVED'</text>
  <text x="576" y="204" font-family="monospace" font-size="9" fill="#37474f">WHERE id=? AND state='PENDING'</text>
  <text x="576" y="228" font-family="sans-serif" font-size="9" fill="#546e7a">affected rows = 0 → 说明已决策过</text>
  <text x="576" y="248" font-family="sans-serif" font-size="9" fill="#2e7d32">→ 返回已有状态，不重复执行</text>

  <line x1="190" y1="140" x2="300" y2="105" stroke="#455a64" stroke-width="2" marker-end="url(#a02c)"/>
  <line x1="190" y1="155" x2="300" y2="205" stroke="#455a64" stroke-width="2" marker-end="url(#a02c)"/>
  <line x1="190" y1="170" x2="300" y2="305" stroke="#455a64" stroke-width="2" marker-end="url(#a02c)"/>
  <line x1="470" y1="105" x2="560" y2="160" stroke="#455a64" stroke-width="2" marker-end="url(#a02c)"/>

  <rect x="40" y="352" width="830" height="92" rx="8" fill="#eceff1"/>
  <text x="56" y="376" font-family="sans-serif" font-size="12" font-weight="bold" fill="#37474f">关键代码</text>
  <text x="56" y="398" font-family="monospace" font-size="10" fill="#37474f">const n = await db.update("decision")</text>
  <text x="56" y="416" font-family="monospace" font-size="10" fill="#37474f">  .set({ state: "APPROVED", by, at: now }).where({ id, state: "PENDING" });   // 条件更新是原子的</text>
  <text x="56" y="434" font-family="monospace" font-size="10" fill="#37474f">if (n === 0) return db.get("decision", id);   // 已决策过，返回现状而不是再执行一次</text>
</svg>
