<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <defs>
    <marker id="a01a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
    <marker id="a01r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="480" fill="#fafafa"/>
  <text x="28" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">解法 A · 每次读最新定义（无常驻编译产物）</text>
  <text x="28" y="56" font-family="sans-serif" font-size="11" fill="#78909c">最直觉的做法：请求来了再编译 —— 简单，但把"定义变了"这件事摊给了正在跑的任务</text>

  <rect x="30" y="90" width="180" height="90" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="46" y="116" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1565c0">定义表</text>
  <text x="46" y="138" font-family="monospace" font-size="10" fill="#37474f">v1 → v2（刚改）</text>
  <text x="46" y="158" font-family="sans-serif" font-size="9" fill="#546e7a">只有一份"当前值"</text>

  <rect x="270" y="90" width="180" height="90" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="286" y="116" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">每次请求重编译</text>
  <text x="286" y="138" font-family="monospace" font-size="10" fill="#37474f">compile(read())</text>
  <text x="286" y="158" font-family="sans-serif" font-size="9" fill="#546e7a">拿到什么用什么</text>

  <rect x="510" y="60" width="180" height="70" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="526" y="84" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f57f17">任务 X（第 3 步中）</text>
  <text x="526" y="104" font-family="sans-serif" font-size="9" fill="#546e7a">上半段按 v1 跑</text>
  <text x="526" y="120" font-family="sans-serif" font-size="9" fill="#e65100">下半段按 v2 跑</text>

  <rect x="510" y="150" width="180" height="70" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="526" y="174" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f57f17">任务 Y（刚开始）</text>
  <text x="526" y="194" font-family="sans-serif" font-size="9" fill="#546e7a">全按 v2 跑</text>
  <text x="526" y="210" font-family="sans-serif" font-size="9" fill="#2e7d32">正确</text>

  <rect x="730" y="90" width="140" height="110" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="746" y="114" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c62828">失效点</text>
  <text x="746" y="136" font-family="sans-serif" font-size="9" fill="#b71c1c">任务 X 前后半段</text>
  <text x="746" y="152" font-family="sans-serif" font-size="9" fill="#b71c1c">定义不一致</text>
  <text x="746" y="172" font-family="sans-serif" font-size="9" fill="#b71c1c">审批名单变了</text>
  <text x="746" y="188" font-family="sans-serif" font-size="9" fill="#b71c1c">→ 旧调用被判越权</text>

  <line x1="210" y1="135" x2="270" y2="135" stroke="#455a64" stroke-width="2" marker-end="url(#a01a)"/>
  <line x1="450" y1="120" x2="510" y2="98" stroke="#455a64" stroke-width="2" marker-end="url(#a01a)"/>
  <line x1="450" y1="150" x2="510" y2="180" stroke="#455a64" stroke-width="2" marker-end="url(#a01a)"/>
  <line x1="690" y1="95" x2="730" y2="120" stroke="#c62828" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#a01r)"/>

  <rect x="30" y="290" width="840" height="80" rx="8" fill="#eceff1"/>
  <text x="46" y="314" font-family="sans-serif" font-size="12" font-weight="bold" fill="#37474f">关键代码</text>
  <text x="46" y="336" font-family="monospace" font-size="10" fill="#37474f">const graph = compile(await loadDefinition(id));  // 每次请求现编</text>
  <text x="46" y="354" font-family="monospace" font-size="10" fill="#37474f">await graph.invoke(input, cfg);                  // 任务中途定义变了，下游节点用新图</text>

  <rect x="30" y="392" width="840" height="70" rx="8" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="46" y="414" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6a1b9a">代价与适用边界</text>
  <text x="46" y="434" font-family="sans-serif" font-size="10" fill="#546e7a">代价：每次调用多一次编译（本项目实测为微秒级，无缓存压力）；语义上"一次任务横跨两个定义版本"</text>
  <text x="46" y="452" font-family="sans-serif" font-size="10" fill="#546e7a">适用：定义极少变、任务都是秒级短任务、不需要"这次用哪个版本"可追溯</text>
</svg>
