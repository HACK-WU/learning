<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <defs>
    <marker id="a05b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="480" fill="#fafafa"/>
  <text x="28" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">解法 B · 挂起落盘 + 恢复重跑：把"等"变成"结束"</text>
  <text x="28" y="56" font-family="sans-serif" font-size="11" fill="#78909c">关键动作不是"怎么等"，而是"怎么安全地结束，以及怎么从结束处接着跑"</text>

  <rect x="34" y="80" width="196" height="104" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="50" y="104" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1565c0">进程 1 · 跑到一半</text>
  <text x="50" y="126" font-family="monospace" font-size="9" fill="#37474f">create_task</text>
  <text x="50" y="144" font-family="monospace" font-size="9" fill="#37474f">→ 校验 → 写变更单</text>
  <text x="50" y="162" font-family="monospace" font-size="9" fill="#37474f">→ interrupt(审批)</text>
  <text x="50" y="178" font-family="sans-serif" font-size="9" font-style="italic" fill="#1565c0">副作用已发生（第 2 步）</text>

  <rect x="34" y="196" width="196" height="76" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="50" y="218" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f57f17">checkpoint 落盘</text>
  <text x="50" y="238" font-family="monospace" font-size="9" fill="#37474f">thread_id / next / values</text>
  <text x="50" y="256" font-family="sans-serif" font-size="9" fill="#546e7a">然后进程正常退出（不是宕机）</text>

  <rect x="266" y="96" width="200" height="88" rx="8" fill="#eceff1" stroke="#90a4ae"/>
  <text x="282" y="118" font-family="sans-serif" font-size="11" font-weight="bold" fill="#37474f">空窗期 · 3 天</text>
  <text x="282" y="140" font-family="sans-serif" font-size="9" fill="#546e7a">机器可以缩容、发版、断电</text>
  <text x="282" y="158" font-family="sans-serif" font-size="9" fill="#546e7a">状态全在库里，不在内存里</text>
  <text x="282" y="176" font-family="sans-serif" font-size="9" font-style="italic" fill="#37474f">这是"人可以等"的前提</text>

  <rect x="266" y="200" width="200" height="72" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="282" y="222" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">进程 2 · 新的机器</text>
  <text x="282" y="242" font-family="monospace" font-size="9" fill="#37474f">等待 3 天里可能多次重启</text>
  <text x="282" y="260" font-family="sans-serif" font-size="9" fill="#546e7a">进程 1 早就没了，无所谓</text>

  <rect x="502" y="86" width="176" height="82" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="518" y="108" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1565c0">读 checkpoint</text>
  <text x="518" y="128" font-family="monospace" font-size="9" fill="#37474f">getState(cfg)</text>
  <text x="518" y="146" font-family="sans-serif" font-size="9" fill="#546e7a">next 非空 ⇒ 确实是挂起态</text>

  <rect x="502" y="184" width="176" height="88" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="518" y="206" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c62828">⚠ 被中断节点从头重跑</text>
  <text x="518" y="226" font-family="sans-serif" font-size="9" fill="#b71c1c">"写变更单"那一行会再执行一次</text>
  <text x="518" y="244" font-family="sans-serif" font-size="9" fill="#b71c1c">不是从 interrupt 那行接着跑</text>
  <text x="518" y="262" font-family="sans-serif" font-size="9" font-style="italic" fill="#b71c1c">所以第 2 步必须自己保证幂等</text>

  <rect x="704" y="86" width="162" height="82" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="720" y="108" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">带上 resume 值</text>
  <text x="720" y="128" font-family="monospace" font-size="9" fill="#37474f">new Command({</text>
  <text x="720" y="144" font-family="monospace" font-size="9" fill="#37474f">  resume: { ok: true } })</text>
  <text x="720" y="162" font-family="sans-serif" font-size="9" fill="#546e7a">唯一可作 invoke 输入的 Command</text>

  <rect x="704" y="184" width="162" height="88" rx="8" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="720" y="206" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6a1b9a">继续走后半段</text>
  <text x="720" y="226" font-family="sans-serif" font-size="9" fill="#546e7a">执行变更 → 回写 → 结束</text>
  <text x="720" y="244" font-family="sans-serif" font-size="9" fill="#546e7a">此时才把账本置为 FINISHED</text>
  <text x="720" y="262" font-family="sans-serif" font-size="9" font-style="italic" fill="#6a1b9a">"结束"要在最后一步才写</text>

  <line x1="230" y1="132" x2="266" y2="134" stroke="#455a64" stroke-width="2" marker-end="url(#a05b)"/>
  <line x1="230" y1="224" x2="266" y2="224" stroke="#455a64" stroke-width="2" marker-end="url(#a05b)"/>
  <line x1="466" y1="134" x2="502" y2="126" stroke="#455a64" stroke-width="2" marker-end="url(#a05b)"/>
  <line x1="466" y1="228" x2="502" y2="226" stroke="#455a64" stroke-width="2" marker-end="url(#a05b)"/>
  <line x1="678" y1="126" x2="704" y2="126" stroke="#455a64" stroke-width="2" marker-end="url(#a05b)"/>
  <line x1="678" y1="226" x2="704" y2="226" stroke="#455a64" stroke-width="2" marker-end="url(#a05b)"/>
  <line x1="590" y1="168" x2="590" y2="184" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a05b)"/>

  <rect x="34" y="292" width="832" height="86" rx="8" fill="#eceff1"/>
  <text x="50" y="314" font-family="sans-serif" font-size="11" font-weight="bold" fill="#37474f">关键代码</text>
  <text x="50" y="336" font-family="monospace" font-size="10" fill="#37474f">const snap = await graph.getState({ configurable: { thread_id } });</text>
  <text x="50" y="354" font-family="monospace" font-size="10" fill="#37474f">if (snap.next.length === 0) return;      // 不是挂起态，别乱 resume（这是唯一可靠判据）</text>
  <text x="50" y="372" font-family="monospace" font-size="10" fill="#37474f">await graph.invoke(new Command({ resume: decision }), { configurable: { thread_id } });</text>

  <rect x="34" y="392" width="832" height="72" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="50" y="414" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c62828">失效点</text>
  <text x="50" y="434" font-family="sans-serif" font-size="10" fill="#b71c1c">① 忘了"从头重跑"→ 变更单写两份；② 同节点多个 interrupt 按索引匹配，条件性跳过会让恢复值错位（把"驳回"当成"通过"）</text>
  <text x="50" y="454" font-family="sans-serif" font-size="10" fill="#b71c1c">③ thread_id 与业务单号混用 → 同一单两次提交复用了旧 checkpoint，直接跳到已完成的结尾</text>
</svg>
