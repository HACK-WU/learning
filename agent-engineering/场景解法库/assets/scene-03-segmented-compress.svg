<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <marker id="a03b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
    <marker id="a03r2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" fill="#fafafa"/>
  <text x="28" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263238">解法 B · 分段压缩：系统提示不动、只压中段、按配对切</text>
  <text x="28" y="56" font-family="sans-serif" font-size="11" fill="#78909c">三条铁律决定了这个解法的形状 —— 少一条就会坏</text>

  <rect x="40" y="86" width="820" height="58" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="56" y="110" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">① 头部：系统提示 + 最早一轮用户意图 —— 永不压缩</text>
  <text x="56" y="132" font-family="sans-serif" font-size="9" fill="#546e7a">丢了它 = 人格、规则、任务定义全没了</text>

  <rect x="40" y="152" width="820" height="96" rx="8" fill="#fff8e1" stroke="#ffca28"/>
  <text x="56" y="176" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f57f17">② 中段：可压缩区 —— 以"配对"为最小单位</text>
  <text x="56" y="198" font-family="sans-serif" font-size="9" fill="#546e7a">一对 = 一条带 tool_calls 的 AI 消息 + 它的全部 tool 结果（按 tool_call_id 配对）</text>
  <text x="56" y="218" font-family="monospace" font-size="9" fill="#37474f">[AI(tool_calls:[a,b])] + [tool(a)] + [tool(b)]  →  一句摘要 "调用了 X，得到 …"</text>
  <text x="56" y="238" font-family="sans-serif" font-size="9" fill="#c62828">半对保留 = 模型看到无来由的结果 → 开始编解释</text>

  <rect x="40" y="256" width="820" height="58" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="56" y="280" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">③ 尾部：最近 N 轮 —— 永不压缩</text>
  <text x="56" y="302" font-family="sans-serif" font-size="9" fill="#546e7a">当前正在做的事必须完整可见</text>

  <rect x="40" y="330" width="380" height="86" rx="8" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="56" y="354" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1565c0">触发条件</text>
  <text x="56" y="376" font-family="monospace" font-size="9" fill="#37474f">tokens &gt; 0.7 × window</text>
  <text x="56" y="396" font-family="sans-serif" font-size="9" fill="#546e7a">提前压，不要等报错（报错时已经付过钱）</text>

  <rect x="460" y="330" width="400" height="86" rx="8" fill="#f3e5f5" stroke="#ab47bc"/>
  <text x="476" y="354" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6a1b9a">压缩后必须校验</text>
  <text x="476" y="376" font-family="monospace" font-size="9" fill="#37474f">assertNoOrphanToolMessages(msgs)</text>
  <text x="476" y="396" font-family="sans-serif" font-size="9" fill="#546e7a">失败直接抛，不放行</text>

  <rect x="40" y="432" width="820" height="60" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="56" y="454" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c62828">失效点</text>
  <text x="56" y="474" font-family="sans-serif" font-size="10" fill="#b71c1c">摘要本身也要占 token —— 压得太勤会"越压越多"；且摘要是有损的，关键数字（金额 / ID）必须在摘要里逐字保留</text>
</svg>
